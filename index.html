<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পথিক — My Job Preparation</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=8"></script>
<script>window.AG_PAGE = {"id":"index","title":"Study Hub","admin":true};</script>
<script src="auth-gate.js?v=8"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Courier+Prime&display=swap" rel="stylesheet">
<link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">

<style>
  :root{
    --ink:#181310; --paper:#f6efe0; --panel:#fffdf9; --rule:#e2d3ae;
    --brass:#c2831f; --brass-deep:#8a5a13; --maroon:#8a2b3e; --navy:#1f3a4d;
    --teal:#166d67; --teal-deep:#0d4b47; --ok:#2f7a52; --muted:#6b6154;
    --gold:#d9a441;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    background-image:
      radial-gradient(circle at 15% -5%, rgba(138,43,62,0.10), transparent 42%),
      radial-gradient(circle at 100% 10%, rgba(194,131,31,0.12), transparent 40%),
      radial-gradient(circle at 60% 100%, rgba(22,109,103,0.08), transparent 45%);
    font-family:'Kalpurush','Hind Siliguri','Nirmala UI','Segoe UI',system-ui,-apple-system,sans-serif;
    line-height:1.55;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px 80px;}
  .bn-head{font-family:'Kalpurush','Baloo Da 2','Hind Siliguri',sans-serif;}

  header.top{padding:50px 24px 34px;border-bottom:1px solid var(--rule);position:relative;overflow:hidden;
    background:linear-gradient(120deg, rgba(138,43,62,0.07), rgba(194,131,31,0.06) 45%, rgba(22,109,103,0.06));}
  header.top::before{
    content:"";position:absolute;inset:0;
    background-image:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 22px);
    opacity:.04;pointer-events:none;
  }
  .top-inner{max-width:1100px;margin:0 auto;position:relative;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Courier Prime',monospace;
    font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-deep);
    border:1px solid var(--brass);padding:4px 10px;border-radius:999px;background:rgba(194,131,31,0.1);}
  h1{font-family:'Baloo Da 2',sans-serif;font-size:clamp(30px,5.5vw,48px);margin:16px 0 2px;font-weight:800;
    letter-spacing:-0.01em;
    background:linear-gradient(90deg, var(--maroon), var(--brass-deep) 60%, var(--teal-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .byline{font-size:14px;color:var(--muted);margin:0 0 14px;font-family:'Courier Prime',monospace;letter-spacing:.02em;}

  .countdown{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .cd-box{background:var(--panel);border:1px solid var(--rule);border-radius:10px;
    padding:10px 14px;min-width:72px;text-align:center;box-shadow:0 2px 6px rgba(138,43,62,0.06);}
  .cd-box b{display:block;font-family:'Courier Prime',monospace;font-size:24px;color:var(--maroon);}
  .cd-box span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

  main{margin-top:40px;}
  .category{margin-bottom:16px;border:1px solid var(--rule);border-radius:14px;background:var(--panel);
    overflow:hidden;box-shadow:0 4px 16px rgba(24,19,16,0.04);border-left:4px solid var(--cat-accent, var(--brass));}
  .cat-head{display:flex;align-items:center;gap:12px;padding:18px 20px;cursor:pointer;user-select:none;}
  .cat-head:hover{background:rgba(194,131,31,0.05);}
  .cat-head .icon{font-size:18px;transition:transform .15s ease;color:var(--cat-accent, var(--brass-deep));}
  .category.open .cat-head .icon{transform:rotate(90deg);}
  .cat-head .titles .bn{font-family:'Baloo Da 2',sans-serif;font-size:17px;font-weight:700;color:var(--cat-accent, var(--ink));}
  .cat-head .titles .en{font-size:12px;color:var(--muted);}
  .cat-head .soon{margin-left:auto;font-size:11px;font-family:'Courier Prime',monospace;color:var(--brass-deep);
    border:1px solid var(--brass);padding:3px 9px;border-radius:999px;}
  .cat-body{max-height:0;overflow:hidden;transition:max-height .2s ease;}
  .category.open .cat-body{max-height:4000px;}
  .cat-body-inner{padding:0 20px 20px;}

  .subcat{margin-top:6px;}
  .subcat-title{font-size:13px;font-weight:700;color:var(--cat-accent, var(--navy));margin:16px 0 10px;
    padding-bottom:6px;border-bottom:1px dashed var(--rule);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px,1fr));gap:12px;}
  .card{display:block;background:var(--paper);border:1px solid var(--rule);border-radius:10px;
    padding:14px 16px;position:relative;overflow:hidden;transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat-accent, var(--brass));opacity:0;transition:opacity .12s ease;}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(24,19,16,0.09);border-color:var(--cat-accent, var(--brass));}
  .card:hover::before{opacity:1;}
  .card .name{font-size:14px;font-weight:700;}
  .card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
    font-size:10.5px;font-family:'Courier Prime',monospace;color:var(--muted);}
  .card .go{color:var(--ok);font-weight:700;}

  footer{max-width:1100px;margin:50px auto 0;padding:24px;border-top:1px solid var(--rule);
    color:var(--muted);font-size:12px;font-family:'Courier Prime',monospace;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <span class="eyebrow">Personal Study Hub · Offline Ready</span>
    <h1 class="bn-head">পথিক রায়</h1>
    <p class="byline">Film student · University of Dhaka — preparing for BCS</p>

    <div class="countdown" id="countdown">
      <div class="cd-box"><b id="cdD">--</b><span>Days</span></div>
      <div class="cd-box"><b id="cdH">--</b><span>Hours</span></div>
      <div class="cd-box"><b id="cdM">--</b><span>Min</span></div>
      <div class="cd-box"><b id="cdS">--</b><span>Sec</span></div>
    </div>
  </div>
</header>

<div class="wrap">
  <main id="catRoot"></main>
  <footer>পথিক রায় — Personal Study Hub · বিসিএস প্রস্তুতি</footer>
</div>

<script>
/* ============================================================
   EXAM COUNTDOWN — placeholder date. Tell Claude the real
   announced date and this one line gets updated.
   ============================================================ */
const EXAM_DATE = new Date('2027-01-01T00:00:00+06:00');

function tickCountdown(){
  const now = new Date();
  let diff = EXAM_DATE - now;
  if(diff < 0) diff = 0;
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  document.getElementById('cdD').textContent = d;
  document.getElementById('cdH').textContent = String(h).padStart(2,'0');
  document.getElementById('cdM').textContent = String(m).padStart(2,'0');
  document.getElementById('cdS').textContent = String(s).padStart(2,'0');
}
tickCountdown();
setInterval(tickCountdown, 1000);

/* ============================================================
   CATALOG — the whole site map lives here. To add a new subject
   or a new category later, add one more entry below with its
   file path — nothing else needs to change. "accent" sets that
   category's colour throughout its section.
   ============================================================ */
const CATALOG = [
  {
    id: 'bcs', label_bn: 'বিসিএস', label_en: 'BCS', open: true, accent: '#8a2b3e',
    subcategories: [
      {
        id: 'question-bank', label_bn: 'প্রশ্নব্যাংক (আগের বছরের প্রশ্ন)', label_en: 'Question Bank — Previous Year Questions',
        items: [
          {id:'exam-simulator', bn:'BCS প্রস্তুতি প্ল্যাটফর্ম — ৪৪-৫০তম', en:'Full Exam Simulator', path:'bcs/question-bank/BCS_44_50_Exam_Simulator.html'},
          {id:'bangla-uttaran-system', bn:'বাংলা উত্তরণ', en:'Study & Revision System', path:'bcs/question-bank/Bangla_Uttaran_Interactive_Study_System.html'},
          {id:'bangla-uttaran-app', bn:'বাংলা উত্তরণ — সাহিত্য অনুশীলন', en:'Literature Practice App', path:'bcs/question-bank/bangla_uttaran_study_app.html'},
          {id:'english-language', bn:'English Language', en:'Study & Revision System', path:'bcs/question-bank/English_Language_Interactive_Study_System.html'},
          {id:'english-literature', bn:'English Literature', en:'Study & Revision System', path:'bcs/question-bank/English_Literature_Interactive_Study_System.html'},
          {id:'bangladesh-affairs', bn:'বাংলাদেশ বিষয়াবলি', en:'Study & Revision System', path:'bcs/question-bank/Bangladesh_Interactive_Study_Revision_System.html'},
          {id:'international-affairs', bn:'আন্তর্জাতিক বিষয়াবলি', en:'Study System', path:'bcs/question-bank/International_Affairs_Interactive_Study_System.html'},
          {id:'geography', bn:'ভূগোল', en:'Study & Revision System', path:'bcs/question-bank/Geography_Interactive_Study_System.html'},
          {id:'science-quiz', bn:'সাধারণ বিজ্ঞান', en:'Question Bank & Quiz', path:'bcs/question-bank/bcs_science_quiz.html'},
          {id:'math', bn:'গণিত', en:'Study & Revision System', path:'bcs/question-bank/Math_Interactive_Study_System.html'},
          {id:'ict', bn:'কম্পিউটার ও তথ্য প্রযুক্তি', en:'Study & Revision System', path:'bcs/question-bank/ICT_Interactive_Study_System.html'},
          {id:'morality', bn:'নৈতিকতা, মূল্যবোধ ও সুশাসন', en:'Study & Revision System', path:'bcs/question-bank/Morality_Interactive_Study_Revision_System.html'}
        ]
      },
      {
        id: 'books', label_bn: 'বিসিএস বই এবং পাঠ্যসামগ্রী', label_en: 'BCS Books & Study Materials',
        items: [
          {id:'lal-neel-dipaboli', bn:'লাল নীল দীপাবলি', en:'Exam Prep', path:'bcs/question-bank/Lal_Neel_Dipaboli_Exam_Prep.html'},
          {id:'budget-2026-27', bn:'বাজেট FY2026-27', en:'Study Dashboard', path:'bcs/question-bank/BCS_Budget_2026_27_Bangla.html'},
          {id:'bangla-bhasha-sahitya', bn:'বাংলা ভাষা ও সাহিত্য জিজ্ঞাসা', en:'BCS Study System', path:'bcs/books/Bangla_Bhasha_Sahitya_Study_System.html'},
          {id:'math-short-technique', bn:'গণিতের শর্ট টেকনিক', en:'Competitive Exam Prep', path:'bcs/books/Math_Short_Technique_Exam_Prep.html'},
          {id:'vocab-mastery-bcs', bn:'শব্দভাণ্ডার', en:'Vocabulary Mastery', path:'bcs/books/Vocabulary_Mastery.html'},
          {id:'english-literature-master', bn:'BCS English Literature', en:'Command Center', path:'bcs/books/BCS_English_Literature_Master.html'}
        ]
      },
      {
        id: 'syllabus', label_bn: 'সিলেবাস', label_en: 'Syllabus',
        items: [
          {id:'prelim-master-tracker', bn:'BCS Preliminary — মাস্টার ট্র্যাকার', en:'Master Tracker', path:'bcs/preliminary-tools/BCS_Preliminary_Master_Tracker.html'},
          {id:'written-syllabus-intelligence', bn:'BCS Written — সিলেবাস ইন্টেলিজেন্স সিস্টেম', en:'Syllabus Intelligence System', path:'bcs/written/BCS_Written_Syllabus_Intelligence_System.html'}
        ]
      },
      {
        id: 'preliminary-tools', label_bn: 'বিসিএস সহায়ক টুলস', label_en: 'BCS Support Tools',
        items: [
          {id:'bcs50-eligibility', bn:'৫০তম বি.সি.এস — যোগ্যতা বিশ্লেষণ', en:'Eligibility Analysis', path:'bcs/preliminary-tools/bcs50_eligibility.html'}
        ]
      }
      // Add more BCS subcategories here later, e.g. "Detailed Subject Notes"
    ]
  },
  {
    id: 'bank', label_bn: 'ব্যাংক প্রস্তুতি', label_en: 'Bank Preparation', accent: '#166d67',
    subcategories: [
      {
        id: 'vocabulary', label_bn: 'শব্দভাণ্ডার', label_en: 'Vocabulary',
        items: [
          {id:'word-smart-vocabulary', bn:'Word Smart', en:'Vocabulary Mastery', path:'bank/vocabulary/word-smart-vocabulary.html'}
        ]
      }
      // Add more Bank subcategories here later, e.g. Math, English, Written
    ]
  }
  // Add more top-level categories here later, e.g. Primary/NTRCA/University Admission
];

const root = document.getElementById('catRoot');

CATALOG.forEach(cat => {
  const catEl = document.createElement('div');
  catEl.className = 'category' + (cat.open ? ' open' : '');
  if(cat.accent) catEl.style.setProperty('--cat-accent', cat.accent);

  const head = document.createElement('div');
  head.className = 'cat-head';
  head.innerHTML = '<span class="icon">▸</span><div class="titles"><div class="bn">'+cat.label_bn+'</div><div class="en">'+cat.label_en+'</div></div>' +
    (cat.comingSoon ? '<span class="soon">Coming soon</span>' : '');
  head.onclick = () => catEl.classList.toggle('open');
  catEl.appendChild(head);

  const body = document.createElement('div');
  body.className = 'cat-body';
  const inner = document.createElement('div');
  inner.className = 'cat-body-inner';

  if(cat.subcategories.length === 0){
    inner.innerHTML = '<p style="color:#6b6154;font-size:13px;">এই বিভাগের কনটেন্ট শীঘ্রই যোগ করা হবে।</p>';
  }
  cat.subcategories.forEach(sub => {
    const subEl = document.createElement('div');
    subEl.className = 'subcat';
    subEl.innerHTML = '<div class="subcat-title">'+sub.label_bn+' — '+sub.label_en+'</div>';
    const grid = document.createElement('div');
    grid.className = 'grid';
    sub.items.forEach(item => {
      const a = document.createElement('a');
      a.className = 'card'; a.href = item.path;
      a.innerHTML = '<div class="name">'+item.bn+'</div><div class="meta"><span>'+item.en+'</span><span class="go">Open →</span></div>';
      grid.appendChild(a);
    });
    subEl.appendChild(grid);
    inner.appendChild(subEl);
  });

  body.appendChild(inner);
  catEl.appendChild(body);
  root.appendChild(catEl);
});
</script>
</body>
</html>
