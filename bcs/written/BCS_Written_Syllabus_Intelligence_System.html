<title>BCS Written — Syllabus Intelligence System</title>
<style>
:root{
  --paper:#faf7ee;
  --paper-2:#f2ede0;
  --ink:#1c231d;
  --ink-soft:#4c5650;
  --line: #d9d1bd;
  --green:#0e3d2c;
  --green-2:#155a41;
  --green-tint:#e4ede7;
  --red:#a6273c;
  --red-tint:#f7e6e6;
  --gold:#a9762f;
  --gold-tint:#f6ecd8;
  --blue:#28527a;
  --blue-tint:#e6edf3;
  --card:#ffffff;
  --shadow: 0 1px 2px rgba(28,35,29,.06), 0 6px 18px rgba(28,35,29,.05);
  --radius: 10px;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --serif: "Newsreader", "Noto Serif Bengali", Georgia, serif;
  --sans: "Inter", "Noto Sans Bengali", "Hind Siliguri", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
html.dark{
  --paper:#14181a;
  --paper-2:#1b2124;
  --ink:#eef0ea;
  --ink-soft:#a9b3ac;
  --line:#31383a;
  --green:#3fae82;
  --green-2:#2f8a67;
  --green-tint:#173029;
  --red:#e0728a;
  --red-tint:#2e181d;
  --gold:#d9ac5f;
  --gold-tint:#2c2413;
  --blue:#8fb6de;
  --blue-tint:#182633;
  --card:#1c2225;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;}
body{margin:0;}
body,input,textarea,select,button{font-family:var(--sans); color:var(--ink);}
body{background:var(--paper); font-size:15px; line-height:1.5;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; margin:0 0 .4em 0; letter-spacing:.2px;}
a{color:inherit;}
button{cursor:pointer; font-family:var(--sans);}
::selection{background:var(--gold-tint);}

/* ---------- layout shell ---------- */
#app{display:flex; min-height:100vh;}
#sidebar{
  width:230px; flex:0 0 230px; background:var(--green); color:#f4f0e2;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
#sidebar .brand{padding:20px 18px 14px; border-bottom:1px solid rgba(244,240,226,.15);}
#sidebar .brand .mark{font-family:var(--mono); font-size:11px; letter-spacing:2px; opacity:.75; text-transform:uppercase;}
#sidebar .brand h1{font-size:19px; color:#fbf8ee; margin:4px 0 0;}
#sidebar nav{padding:10px 0; flex:1;}
#sidebar .nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 18px; font-size:13.5px; cursor:pointer;
  color:#e6e2cf; border-left:3px solid transparent; opacity:.85;
}
#sidebar .nav-item .ic{width:18px; text-align:center; font-size:14px;}
#sidebar .nav-item:hover{background:rgba(244,240,226,.06); opacity:1;}
#sidebar .nav-item.active{background:rgba(244,240,226,.1); border-left-color:var(--gold); opacity:1; font-weight:600;}
#sidebar .foot{padding:14px 18px; border-top:1px solid rgba(244,240,226,.15); font-size:11px; opacity:.6;}
#main{flex:1; min-width:0; padding:26px 34px 80px; max-width:1360px;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.topbar .search-wrap{position:relative; flex:1; min-width:220px; max-width:420px;}
.topbar input[type=search]{
  width:100%; padding:9px 12px 9px 32px; border-radius:20px; border:1px solid var(--line);
  background:var(--card); font-size:13.5px; color:var(--ink);
}
.topbar .search-wrap:before{content:"⌕"; position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5; font-size:14px;}
.topbar .actions{display:flex; gap:8px; align-items:center;}
.iconbtn{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px;}
.iconbtn:hover{border-color:var(--green-2);}
.pagehead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.pagehead h2{font-size:24px;}
.pagehead .sub{color:var(--ink-soft); font-size:13px;}
.view{display:none;}
.view.active{display:block;}

/* ---------- generic components ---------- */
.grid{display:grid; gap:16px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px;}
.stat{padding:14px 16px;}
.stat .num{font-family:var(--serif); font-size:28px; font-weight:600; line-height:1;}
.stat .label{font-size:12px; color:var(--ink-soft); margin-top:6px; text-transform:uppercase; letter-spacing:.5px;}
.stat .sparkline{height:3px; background:var(--line); border-radius:3px; margin-top:10px; overflow:hidden;}
.stat .sparkline i{display:block; height:100%; background:var(--green-2);}

.progress-bar{height:8px; background:var(--paper-2); border-radius:5px; overflow:hidden; border:1px solid var(--line);}
.progress-bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--green-2),var(--green));}
.subject-card{cursor:pointer; transition:transform .12s ease;}
.subject-card:hover{transform:translateY(-2px); border-color:var(--green-2);}
.subject-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.subject-card .code{font-family:var(--mono); font-size:11px; color:var(--ink-soft); background:var(--paper-2); padding:2px 6px; border-radius:4px;}
.subject-card h3{font-size:16px; margin:6px 0 2px;}
.subject-card .marks{font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
.subject-card .pct{font-family:var(--mono); font-weight:600; font-size:13px;}
.subject-card .mini-stats{display:flex; gap:12px; margin-top:10px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap;}
.subject-card .mini-stats b{color:var(--ink); font-weight:600;}

.badge{display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:20px; font-weight:600; letter-spacing:.2px; white-space:nowrap;}
.badge.official{background:var(--blue-tint); color:var(--blue);}
.badge.breakdown{background:var(--green-tint); color:var(--green-2);}
.badge.angle{background:var(--gold-tint); color:var(--gold);}
.badge.insight{background:var(--red-tint); color:var(--red);}
.badge.tag{background:var(--paper-2); color:var(--ink-soft); border:1px solid var(--line);}
.badge.status-not_started{background:var(--paper-2); color:var(--ink-soft);}
.badge.status-learning{background:var(--gold-tint); color:var(--gold);}
.badge.status-learned{background:var(--blue-tint); color:var(--blue);}
.badge.status-practiced{background:#e3ecf7; color:var(--blue);}
.badge.status-strong{background:var(--green-tint); color:var(--green-2);}
.badge.status-needs_revision{background:var(--red-tint); color:var(--red);}
.badge.status-mastered{background:var(--green); color:#fff;}

.btn{border:1px solid var(--line); background:var(--card); padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600;}
.btn:hover{border-color:var(--green-2);}
.btn.primary{background:var(--green); color:#fff; border-color:var(--green);}
.btn.primary:hover{background:var(--green-2);}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft); font-weight:500;}
.btn.danger{color:var(--red); border-color:var(--red);}
.btn.sm{padding:5px 10px; font-size:12px;}
.btn[disabled]{opacity:.4; cursor:default;}

.explorer-tree{display:flex; flex-direction:column; gap:8px;}
.subj-block{border:1px solid var(--line); border-radius:var(--radius); background:var(--card); overflow:hidden;}
.subj-block > .head{display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; user-select:none;}
.subj-block > .head:hover{background:var(--paper-2);}
.subj-block > .head .chev{transition:transform .15s; opacity:.6; font-size:12px;}
.subj-block.open > .head .chev{transform:rotate(90deg);}
.subj-block > .head h3{margin:0; font-size:15px; flex:1;}
.subj-block > .body{display:none; padding:0 16px 14px 16px; border-top:1px solid var(--line);}
.subj-block.open > .body{display:block;}
.part-block{margin-top:12px;}
.part-block h4{font-size:12.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); margin:14px 0 8px;}
.item-row{border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--paper-2);}
.item-row > .ihead{display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer;}
.item-row > .ihead .chev{opacity:.5; font-size:11px; transition:transform .15s;}
.item-row.open > .ihead .chev{transform:rotate(90deg);}
.item-row .ititle{flex:1; font-size:13.5px; font-weight:600;}
.item-row .imarks{font-family:var(--mono); font-size:11px; color:var(--ink-soft);}
.item-row > .ibody{display:none; padding:2px 12px 12px;}
.item-row.open > .ibody{display:block;}
.official-box{background:var(--card); border-left:3px solid var(--blue); padding:8px 10px; font-size:12.5px; color:var(--ink-soft); border-radius:0 6px 6px 0; margin:8px 0 10px; white-space:pre-line;}
.topic-chip-row{display:flex; flex-wrap:wrap; gap:6px;}
.topic-chip{
  border:1px solid var(--line); background:var(--card); border-radius:16px; padding:5px 12px 5px 10px;
  font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:6px;
}
.topic-chip:hover{border-color:var(--green-2);}
.topic-chip .dot{width:7px; height:7px; border-radius:50%;}

/* status dot colors */
.dot-not_started{background:#b7b0a0;}
.dot-learning{background:var(--gold);}
.dot-learned{background:var(--blue);}
.dot-practiced{background:#4a80b8;}
.dot-strong{background:var(--green-2);}
.dot-needs_revision{background:var(--red);}
.dot-mastered{background:#0e3d2c;}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(15,20,16,.5); display:none; align-items:flex-start; justify-content:center; z-index:100; overflow-y:auto; padding:30px 16px;}
.overlay.active{display:flex;}
.modal{background:var(--card); border-radius:14px; width:100%; max-width:760px; box-shadow:0 20px 60px rgba(0,0,0,.3); margin-bottom:40px;}
.modal .mhead{display:flex; justify-content:space-between; align-items:flex-start; padding:20px 24px 12px; border-bottom:1px solid var(--line);}
.modal .mhead h2{font-size:20px; margin-bottom:4px;}
.modal .mclose{background:none; border:none; font-size:20px; color:var(--ink-soft); line-height:1;}
.modal .mbody{padding:18px 24px 24px;}
.msection{margin-bottom:18px;}
.msection > .stitle{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); margin-bottom:6px; display:flex; align-items:center; gap:8px;}
.msection ul{margin:0; padding-left:18px; font-size:13.5px;}
.msection li{margin-bottom:3px;}
textarea, select, input[type=text], input[type=date], input[type=number]{
  width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13.5px; background:var(--paper); color:var(--ink); font-family:var(--sans);
}
textarea{min-height:70px; resize:vertical;}
.field-row{display:flex; gap:10px; flex-wrap:wrap;}
.field{flex:1; min-width:140px; margin-bottom:10px;}
.field label{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.4px;}
.rate-row{display:flex; gap:6px;}
.rate-btn{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-size:13px; font-weight:700;}
.rate-btn.on{background:var(--green); color:#fff; border-color:var(--green);}
.tab-row{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:14px; flex-wrap:wrap;}
.tab-btn{padding:7px 12px; font-size:12.5px; font-weight:600; background:none; border:none; color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab-btn.active{color:var(--green-2); border-color:var(--green-2);}
.tabpane{display:none;}
.tabpane.active{display:block;}

.qangle{background:var(--gold-tint); border:1px solid transparent; padding:7px 10px; border-radius:7px; font-size:13px; margin-bottom:6px;}
.qangle b{color:var(--gold);}

.empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty .big{font-size:32px; margin-bottom:10px;}

table.simple{width:100%; border-collapse:collapse; font-size:13px;}
table.simple th, table.simple td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);}
table.simple th{font-size:11px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.4px;}
.heat-cell{width:16px; height:16px; border-radius:3px; display:inline-block;}

.list-entry{border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; background:var(--card);}
.list-entry .meta{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
.list-entry .del{float:right; color:var(--red); font-size:11px; background:none; border:none;}

.section-title-row{display:flex; align-items:center; justify-content:space-between; margin:26px 0 10px;}
.section-title-row h3{font-size:16px; margin:0;}

.filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.filter-bar select, .filter-bar input{width:auto; font-size:12.5px; padding:6px 9px;}

.notice{background:var(--gold-tint); border:1px solid transparent; color:var(--gold); padding:10px 14px; border-radius:8px; font-size:12.5px; margin-bottom:16px;}
.notice.blue{background:var(--blue-tint); color:var(--blue);}
.notice b{font-weight:700;}

.quiz-q{font-size:15px; font-weight:600; margin-bottom:14px;}
.quiz-opt{display:block; width:100%; text-align:left; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--card); font-size:13.5px;}
.quiz-opt:hover{border-color:var(--green-2);}
.quiz-opt.correct{background:var(--green-tint); border-color:var(--green-2);}
.quiz-opt.wrong{background:var(--red-tint); border-color:var(--red);}

.recall-box{border:2px dashed var(--line); border-radius:10px; padding:16px; text-align:center; color:var(--ink-soft); font-size:13px;}

::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

@media(max-width:900px){
  #sidebar{position:fixed; left:-230px; z-index:90; transition:left .2s; box-shadow:0 0 30px rgba(0,0,0,.3);}
  #sidebar.open{left:0;}
  #main{padding:18px;}
  .grid.cols-4, .grid.cols-3{grid-template-columns:repeat(2,1fr);}
}
</style>

// Split an official syllabus sentence into candidate study concepts.
function splitConcepts(text){
  let t = text
    .replace(/\be\.g\.,?/gi,"like")
    .replace(/\betc\.?/gi,"");
  // protect sub-lettered clauses a) b) c) as hard breaks already handled by caller
  let parts = t.split(/[;:]|(?<=[a-zA-Z\)])\s*,\s*(?=[A-Z])/g)
    .map(s=>s.trim())
    .filter(Boolean);
  if(parts.length < 2){
    parts = t.split(/,/).map(s=>s.trim()).filter(Boolean);
  }
  // clean, cap length, dedupe, drop trivial fragments
  const seen = new Set(); const out=[];
  for(let p of parts){
    p = p.replace(/^and\s+/i,"").replace(/\.$/,"").trim();
    p = p.replace(/^[a-z]\)\s*/i,"").trim();
    p = p.charAt(0).toUpperCase()+p.slice(1);
    if(p.length<3) continue;
    if(p.length>140) p = p.slice(0,137)+"…";
    const key = p.toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    out.push(p);
  }
  return out.slice(0,10);
}

// Split official item text into a) b) c)-lettered clauses if present, else whole text.
function splitLettered(text){
  const m = text.match(/[a-z]\)\s/g);
  if(m && m.length>=2){
    const chunks = text.split(/(?=[a-z]\)\s)/).map(s=>s.trim()).filter(Boolean);
    return chunks;
  }
  return [text];
}

function angleSetFor(subjectCode, topicName){
  if(subjectCode==="005") return ANGLE_TEMPLATES.bangladeshAffairs(topicName);
  if(subjectCode==="007") return ANGLE_TEMPLATES.internationalAffairs(topicName);
  if(subjectCode==="008") return ANGLE_TEMPLATES.math(topicName);
  if(subjectCode==="009") return ANGLE_TEMPLATES.mentalAbility(topicName);
  if(subjectCode==="010") return ANGLE_TEMPLATES.science(topicName);
  if(["001","002","003"].includes(subjectCode)) return ANGLE_TEMPLATES.language(topicName);
  return ANGLE_TEMPLATES.general(topicName);
}

/* ---------- build the full working data model ---------- */
let SUBJECTS = []; // populated by buildModel()
let TOPIC_INDEX = {}; // topicId -> {topic, item, part, subject}
let ITEM_INDEX = {};

function buildModel(){
  SUBJECTS = [];
  TOPIC_INDEX = {};
  ITEM_INDEX = {};
  COMPULSORY.forEach(subj=>{
    const subjId = "s"+subj.code;
    const partsOut = [];
    subj.parts.forEach((part,pi)=>{
      const itemsOut = [];
      part.items.forEach((item,ii)=>{
        const itemId = `${subjId}-p${pi}-i${ii}`;
        const clauses = splitLettered(item.text);
        let concepts = [];
        clauses.forEach((c,ci)=>{
          // Drop bare heading fragments before lettered sub-clauses, e.g. "Grammar —" or "Organs of the Government:"
          const bare = c.replace(/[:\u2014\-]+\s*$/,"").trim();
          const wordCount = bare.split(/\s+/).filter(Boolean).length;
          if(clauses.length>1 && ci===0 && wordCount<=3 && /[:\u2014-]\s*$/.test(c.trim())) return;
          let cc = splitConcepts(c);
          // clean stray "Such as " lead-ins from list continuations
          cc = cc.map(x=>x.replace(/^Such as\s+/i,"").trim()).map(x=>x.charAt(0).toUpperCase()+x.slice(1));
          concepts = concepts.concat(cc);
        });

        // dedupe & cap
        const seen = new Set(); concepts = concepts.filter(c=>{const k=c.toLowerCase(); if(seen.has(k))return false; seen.add(k); return true;}).slice(0,9);
        if(concepts.length===0) concepts=[item.text.slice(0,80)];
        const topics = concepts.map((c,ti)=>{
          const topicId = `${itemId}-t${ti}`;
          const topic = {
            id: topicId, name:c, itemId, subjectCode:subj.code, subjectName:subj.name,
            tags: item.tags||[], angles: angleSetFor(subj.code,c),
          };
          TOPIC_INDEX[topicId]=topic;
          return topic;
        });
        const itemObj = {id:itemId, text:item.text, textBn:item.textBn||"", marks:item.marks, tags:item.tags||[], topics};
        ITEM_INDEX[itemId]=itemObj;
        itemsOut.push(itemObj);
      });
      partsOut.push({name:part.name, marks:part.marks, items:itemsOut});
    });
    SUBJECTS.push({id:subjId, code:subj.code, name:subj.name, nameBn:subj.nameBn, note:subj.note, totalMarks:subj.totalMarks, parts:partsOut, category:"compulsory"});
  });
}
buildModel();

/* ============================================================================

const STATUS_ORDER = ["not_started","learning","learned","practiced","strong","needs_revision","mastered"];
const STATUS_LABEL = {not_started:"Not Started",learning:"Learning",learned:"Learned",practiced:"Practiced",strong:"Strong",needs_revision:"Needs Revision",mastered:"Mastered"};
const IMPORTANCE_LABEL = {critical:"Critical",high:"High",medium:"Medium",low:"Low"};
const DIFFICULTY_LABEL = {easy:"Easy",medium:"Medium",hard:"Hard",very_hard:"Very Hard"};
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso,n){ const d = iso? new Date(iso): new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysUntil(iso){ if(!iso) return null; const a=new Date(todayISO()); const b=new Date(iso); return Math.round((b-a)/86400000); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }
function allTopicIds(){ return Object.keys(TOPIC_INDEX); }
function allTopicsForSubject(subj){ let t=[]; subj.parts.forEach(p=>p.items.forEach(i=>t=t.concat(i.topics))); return t; }
function allItemsForSubject(subj){ let t=[]; subj.parts.forEach(p=>p.items.forEach(i=>t.push(i))); return t; }

function masteryScore(topicId){
  const s = getTopicState(topicId);
  const statusPts = {not_started:0,learning:15,learned:35,practiced:50,strong:70,needs_revision:40,mastered:100};
  let base = statusPts[s.status] ?? 0;
  let confPts = (s.confidence/5)*100;
  let practiceTotal = s.practiceCorrect+s.practiceWrong;
  let accPts = practiceTotal>0 ? (s.practiceCorrect/practiceTotal)*100 : base;
  let revPts = Math.min(s.revisions*15,100);
  const score = Math.round(base*0.35 + confPts*0.3 + accPts*0.2 + revPts*0.15);
  return Math.max(0,Math.min(100,score));
}
function isDueTopic(topicId, includeOverdue=true){
  const s = getTopicState(topicId);
  if(!s.nextRevision) return false;
  const d = daysUntil(s.nextRevision);
  return includeOverdue ? d<=0 : d===0;
}
function revisionBucket(topicId){
  const s = getTopicState(topicId);
  if(!s.nextRevision) return null;
  const d = daysUntil(s.nextRevision);
  if(d<0) return "overdue";
  if(d===0) return "today";
  if(d<=6) return "soon";
  return "future";
}
function priorityScore(topicId){
  const s = getTopicState(topicId);
  const impPts = {critical:40,high:28,medium:16,low:6}[s.importance]||16;
  const weakPts = (5-s.confidence)*8;
  let timePts = 0;
  if(s.lastStudied){ const d = -daysUntil(s.lastStudied); timePts = Math.min(d*1.2, 30); }
  else timePts = 20;
  const overdue = revisionBucket(topicId)==="overdue" ? 25 : (revisionBucket(topicId)==="today" ? 15:0);
  const practiceDeficit = (s.practiceCorrect+s.practiceWrong)===0 ? 10 : 0;
  return Math.round(impPts+weakPts+timePts+overdue+practiceDeficit);
}
function subjectStats(subj){
  const topics = allTopicsForSubject(subj);
  const total = topics.length;
  let counts = {not_started:0,learning:0,learned:0,practiced:0,strong:0,needs_revision:0,mastered:0};
  let confSum=0, weak=0, strong=0, overdue=0;
  topics.forEach(t=>{
    const s = getTopicState(t.id);
    counts[s.status] = (counts[s.status]||0)+1;
    confSum += s.confidence;
    if(s.confidence<=2 && s.status!=="not_started") weak++;
    if(s.confidence>=4) strong++;
    if(revisionBucket(t.id)==="overdue") overdue++;
  });
  const doneLike = counts.learned+counts.practiced+counts.strong+counts.mastered;
  const completion = total? Math.round((doneLike/total)*100):0;
  const avgConf = total? (confSum/total):0;
  return {total, counts, completion, avgConf, weak, strong, overdue,
    remaining: total - doneLike - counts.needs_revision};
}
function overallStats(){
  const topics = allTopicIds();
  let counts = {not_started:0,learning:0,learned:0,practiced:0,strong:0,needs_revision:0,mastered:0};
  let overdue=0, weak=0, confSum=0;
  topics.forEach(id=>{
    const s = getTopicState(id);
    counts[s.status]=(counts[s.status]||0)+1;
    confSum+=s.confidence;
    if(revisionBucket(id)==="overdue") overdue++;
    if(s.confidence>0 && s.confidence<=2) weak++;
  });
  const doneLike = counts.learned+counts.practiced+counts.strong+counts.mastered;
  const completion = topics.length? Math.round((doneLike/topics.length)*100):0;
  return {totalTopics:topics.length, counts, completion, overdue, weak, avgConf: topics.length? confSum/topics.length:0};
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function uid(){ return Math.random().toString(36).slice(2,10); }

function recommendNextTopic(){
  const ids = allTopicIds();
  let best=null, bestScore=-1;
  ids.forEach(id=>{
    const st = getTopicState(id);
    if(st.status==="mastered") return;
    const sc = priorityScore(id);
    if(sc>bestScore){ bestScore=sc; best=id; }
  });
  if(!best) return null;
  const topic = TOPIC_INDEX[best];
  const st = getTopicState(best);
  const reasons = [];
  reasons.push(`${IMPORTANCE_LABEL[st.importance]} priority`);
  if(st.confidence<=2) reasons.push("currently weak");
  if(revisionBucket(best)==="overdue") reasons.push("revision overdue");
  else if(!st.lastStudied) reasons.push("not yet started");
  const related = allTopicsForSubject(SUBJECTS.find(s=>s.code===topic.subjectCode)).filter(t=>t.itemId===topic.itemId).length-1;
  if(related>0) reasons.push(`connects to ${related} sibling concept${related>1?'s':''} in the same syllabus item`);
  return {topic, reason: reasons.join(", ")};
}

function renderMnemonicList(topicId){
  const list = DB.mnemonics.filter(m=>m.topicId===topicId);
  if(!list.length) return `<div style="font-size:12.5px; color:var(--ink-soft);">No mnemonics yet.</div>`;
  return list.map(m=>`<div class="list-entry"><button class="del" data-del-mnem="${m.id}">remove</button><b>${escapeHtml(m.text)}</b></div>`).join("");
}
function renderTopicAffairsList(topicId){
  const list = DB.globalCurrentAffairs.filter(c=>c.topicId===topicId);
  if(!list.length) return `<div style="font-size:12.5px; color:var(--ink-soft);">No current-affairs links yet.</div>`;
  return list.map(c=>`<div class="list-entry"><button class="del" data-del-affair="${c.id}">remove</button><b>${escapeHtml(c.event)}</b><div class="meta">${fmtDate(c.date)} — ${escapeHtml(c.why)}</div></div>`).join("");
}

function wireTopicModalEvents(){
  const modal = document.getElementById("topicModal");
  modal.querySelector("[data-close-topic]").addEventListener("click", closeTopic);
  modal.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{ activeTopicTab=b.dataset.tab; renderTopicModal(); }));
  modal.querySelectorAll("[data-open-topic]").forEach(b=>b.addEventListener("click",()=>{ openTopic(b.dataset.openTopic); }));
  modal.querySelectorAll("[data-conf]").forEach(b=>b.addEventListener("click",()=>{
    const s=getTopicState(activeTopicId); s.confidence = Number(b.dataset.conf)===s.confidence? s.confidence-1 : Number(b.dataset.conf);
    if(s.confidence<0) s.confidence=0; saveDB(); renderTopicModal(); renderNav();
  }));
  const favBtn = modal.querySelector("[data-fav-topic]");
  if(favBtn) favBtn.addEventListener("click",()=>{ const s=getTopicState(activeTopicId); s.favorite=!s.favorite; saveDB(); renderTopicModal(); });
  modal.querySelectorAll("[data-field]").forEach(f=>{
    const evt = (f.tagName==="SELECT")?"change":"input";
    f.addEventListener(evt,()=>{
      const s = getTopicState(activeTopicId);
      const key = f.dataset.field;
      if(key==="__examinerDraft") return; // scratchpad only, not persisted
      let val = f.value;
      s[key]=val;
      if(key==="status" && (val==="learned"||val==="practiced"||val==="strong"||val==="mastered")){
        if(!s.lastStudied) s.lastStudied = todayISO();
      }
      saveDB();
      if(key==="status") { renderTopicModal(); renderNav(); }
    });
  });
  modal.querySelectorAll("[data-revise-in]").forEach(b=>b.addEventListener("click",()=>{
    const s = getTopicState(activeTopicId);
    const d = Number(b.dataset.reviseIn);
    s.lastStudied = todayISO();
    s.nextRevision = addDays(todayISO(), d);
    s.revisions += 1;
    if(s.status==="not_started") s.status="learned";
    saveDB(); renderTopicModal();
  }));
  modal.querySelectorAll("[data-recall-score]").forEach(b=>b.addEventListener("click",()=>{
    const s = getTopicState(activeTopicId);
    const score = Number(b.dataset.recallScore);
    s.confidence = score;
    DB.studySessions.push({id:uid(), topicId:activeTopicId, date:todayISO(), type:"active_recall", score});
    if(score>=4 && s.status!=="mastered") s.status = score===5?"mastered":"strong";
    else if(score<=1) s.status="needs_revision";
    saveDB(); renderTopicModal();
  }));
  const addMnem = modal.querySelector("#addMnemBtn");
  if(addMnem) addMnem.addEventListener("click",()=>{
    const inp = modal.querySelector("#mnemInput");
    if(!inp.value.trim()) return;
    DB.mnemonics.push({id:uid(), topicId:activeTopicId, text:inp.value.trim(), date:todayISO()});
    saveDB(); renderTopicModal();
  });
  modal.querySelectorAll("[data-del-mnem]").forEach(b=>b.addEventListener("click",()=>{
    DB.mnemonics = DB.mnemonics.filter(m=>m.id!==b.dataset.delMnem); saveDB(); renderTopicModal();
  }));
  const addAffair = modal.querySelector("#addAffairBtn");
  if(addAffair) addAffair.addEventListener("click",()=>{
    const ev = modal.querySelector("#caEvent").value.trim();
    if(!ev) return;
    DB.globalCurrentAffairs.push({id:uid(), topicId:activeTopicId, event:ev, date:modal.querySelector("#caDate").value||todayISO(), why:modal.querySelector("#caWhy").value.trim()});
    saveDB(); renderTopicModal();
  });
  modal.querySelectorAll("[data-del-affair]").forEach(b=>b.addEventListener("click",()=>{
    DB.globalCurrentAffairs = DB.globalCurrentAffairs.filter(c=>c.id!==b.dataset.delAffair); saveDB(); renderTopicModal();
  }));
  const startQuiz = modal.querySelector("[data-start-topic-quiz]");
  if(startQuiz) startQuiz.addEventListener("click",()=>{ closeTopic(); goto("quiz"); startQuizSession({mode:"item", itemId:startQuiz.dataset.startTopicQuiz}); });
  const addOwnQ = modal.querySelector("#addOwnQBtn");
  if(addOwnQ) addOwnQ.addEventListener("click",()=>{
    const q = modal.querySelector("#ownQ").value.trim(), a = modal.querySelector("#ownA").value.trim();
    if(!q) return;
    DB.userQuestions.push({id:uid(), topicId:activeTopicId, question:q, answer:a, date:todayISO()});
    saveDB(); modal.querySelector("#ownQ").value=""; modal.querySelector("#ownA").value="";
    renderTopicModal();
  });
}

/* ============================================================================
   QUIZ ENGINE
   ========================================================================== */
let quizState = null; // {pool, idx, correct, wrong, mode, answered}
function allPreloadedQuestions(){
  let out=[];
  Object.entries(PRELOADED_QUESTIONS).forEach(([itemId,list])=>{
    const item = ITEM_INDEX[itemId];
    if(!item) return;
    list.forEach((q,i)=>out.push({...q, itemId, subjectCode:item.topics[0]?.subjectCode, qid:itemId+"-q"+i}));
  });
  return out;
}
function buildQuizPool(mode, opts={}){
  let pool = allPreloadedQuestions();
  if(mode==="item") pool = pool.filter(q=>q.itemId===opts.itemId);
  if(mode==="subject") pool = pool.filter(q=>q.subjectCode===opts.subjectCode);
  if(mode==="weak"){
    const weakItemIds = new Set(Object.values(ITEM_INDEX).filter(it=>it.topics.some(t=>{const s=getTopicState(t.id); return s.confidence>0 && s.confidence<=2;})).map(it=>it.id));
    pool = pool.filter(q=>weakItemIds.has(q.itemId));
  }
  if(mode==="revision"){
    const dueItemIds = new Set(Object.values(ITEM_INDEX).filter(it=>it.topics.some(t=>revisionBucket(t.id)==="overdue"||revisionBucket(t.id)==="today")).map(it=>it.id));
    pool = pool.filter(q=>dueItemIds.has(q.itemId));
  }
  // shuffle
  pool = pool.slice().sort(()=>Math.random()-0.5);
  const sizeMap = {quick:5, standard:10, deep:25};
  if(sizeMap[opts.size]) pool = pool.slice(0, sizeMap[opts.size]);
  return pool;
}
function startQuizSession(opts){
  const pool = buildQuizPool(opts.mode, opts);
  if(!pool.length){ quizState = {empty:true}; renderCurrentView(); return; }
  quizState = {pool, idx:0, correct:0, wrong:0, answered:false, mode:opts.mode};
  renderCurrentView();
}
function renderQuiz(){
  if(quizState && quizState.empty){
    return `<div class="pagehead"><div><h2>Quiz</h2><div class="sub">Test yourself without leaving the app</div></div></div>
      <div class="empty"><div class="big">✎</div>No preloaded questions match that filter yet.<br><span style="font-size:12px;">Add practice questions from a topic's Practice tab, or try a different quiz mode.</span></div>
      <button class="btn" id="quizBack">← Back to quiz menu</button>`;
  }
  if(quizState && quizState.pool){
    if(quizState.idx >= quizState.pool.length){
      const pct = Math.round((quizState.correct/quizState.pool.length)*100);
      DB.quizHistory.push({id:uid(), date:todayISO(), mode:quizState.mode, score:quizState.correct, total:quizState.pool.length});
      saveDB();
      const res = `<div class="pagehead"><div><h2>Quiz Complete</h2></div></div>
      <div class="card" style="text-align:center; padding:34px;">
        <div style="font-family:var(--serif); font-size:44px; font-weight:700; color:${pct>=70?'var(--green-2)':pct>=40?'var(--gold)':'var(--red)'};">${pct}%</div>
        <div style="color:var(--ink-soft); margin-bottom:18px;">${quizState.correct} of ${quizState.pool.length} correct</div>
        <button class="btn primary" id="quizRestart">Take another quiz</button>
      </div>`;
      quizState=null;
      return res;
    }
    const q = quizState.pool[quizState.idx];
    return `<div class="pagehead"><div><h2>Quiz</h2><div class="sub">Question ${quizState.idx+1} of ${quizState.pool.length} · Score so far ${quizState.correct}/${quizState.idx}</div></div>
      <button class="btn ghost" id="quizExit">Exit quiz</button></div>
      <div class="notice">AI-GENERATED PRACTICE QUESTION — not an official BCS question.</div>
      <div class="card" style="max-width:640px;">
        <div class="quiz-q">${escapeHtml(q.q)}</div>
        ${q.options.map((o,i)=>`<button class="quiz-opt" data-ans="${i}">${escapeHtml(o)}</button>`).join("")}
        <div id="quizExplain" style="display:none; margin-top:12px; font-size:13px; color:var(--ink-soft); background:var(--paper-2); padding:10px 12px; border-radius:8px;"></div>
        <button class="btn primary" id="quizNext" style="display:none; margin-top:12px;">Next →</button>
      </div>`;
  }
  const bySubject = SUBJECTS.map(s=>({s, n: allPreloadedQuestions().filter(q=>q.subjectCode===s.code).length})).filter(x=>x.n>0);
  return `
  <div class="pagehead"><div><h2>Quiz</h2><div class="sub">Test yourself without needing another application</div></div></div>
  <div class="notice">All questions here are <b>AI-generated practice questions</b>, clearly not official BCS questions. This is a small demonstration set — add more from any topic's Practice tab.</div>
  <div class="grid cols-4">
    <div class="card" data-quiz-mode="quick"><h3 style="font-size:15px;">Quick Quiz</h3><div class="sub">5 random questions</div></div>
    <div class="card" data-quiz-mode="standard"><h3 style="font-size:15px;">Standard Quiz</h3><div class="sub">10 random questions</div></div>
    <div class="card" data-quiz-mode="deep"><h3 style="font-size:15px;">Deep Quiz</h3><div class="sub">25 random questions</div></div>
    <div class="card" data-quiz-mode="weak"><h3 style="font-size:15px;">Weak Area Quiz</h3><div class="sub">Only low-confidence topics</div></div>
    <div class="card" data-quiz-mode="revision"><h3 style="font-size:15px;">Revision Quiz</h3><div class="sub">Only topics due for revision</div></div>
    <div class="card" data-quiz-mode="random"><h3 style="font-size:15px;">Random Quiz</h3><div class="sub">Mixed syllabus coverage</div></div>
  </div>
  <div class="section-title-row"><h3>Quiz by subject</h3></div>
  <div class="grid cols-4">
    ${bySubject.map(x=>`<div class="card" data-quiz-subject="${x.s.code}"><h3 style="font-size:14px;">${x.s.code} ${x.s.name}</h3><div class="sub">${x.n} question${x.n>1?'s':''} available</div></div>`).join("")}
  </div>
  <div class="section-title-row"><h3>Quiz history</h3></div>
  ${DB.quizHistory.length? `<table class="simple"><tr><th>Date</th><th>Mode</th><th>Score</th></tr>${DB.quizHistory.slice(-10).reverse().map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${h.mode}</td><td>${h.score}/${h.total}</td></tr>`).join("")}</table>` : `<div class="empty">No quizzes taken yet.</div>`}
  `;
}

/* ============================================================================
   REVISION QUEUE
   ========================================================================== */
function renderRevision(){
  const buckets = {overdue:[],today:[],soon:[],future:[]};
  allTopicIds().forEach(id=>{ const b = revisionBucket(id); if(b) buckets[b].push(id); });
  Object.values(buckets).forEach(arr=>arr.sort((a,b)=>new Date(getTopicState(a).nextRevision)-new Date(getTopicState(b).nextRevision)));
  const bucketMeta = [["overdue","🔴 Overdue"],["today","🟠 Due Today"],["soon","🟡 Due Soon (7 days)"],["future","🟢 Future"]];
  const dueNow = buckets.overdue.concat(buckets.today);
  return `
  <div class="pagehead"><div><h2>Revision Queue</h2><div class="sub">Spaced repetition, so nothing quietly rots</div></div>
    ${dueNow.length? `<button class="btn primary" id="startRevisionSession">Start Revision Session (${dueNow.length})</button>`:""}
  </div>
  ${bucketMeta.map(([key,label])=>`
    <div class="section-title-row"><h3>${label}</h3><span class="sub" style="font-size:12px; color:var(--ink-soft);">${buckets[key].length} topic${buckets[key].length!==1?'s':''}</span></div>
    ${buckets[key].length? `<div class="grid cols-3">${buckets[key].slice(0,30).map(id=>revisionCard(id)).join("")}</div>` : `<div class="empty" style="padding:20px;">Nothing here.</div>`}
  `).join("")}
  ${allTopicIds().every(id=>!revisionBucket(id)) ? `<div class="notice blue">No revisions scheduled yet — open any topic's "Track & Revise" tab to schedule your first one.</div>`:""}
  `;
}
function revisionCard(id){
  const t = TOPIC_INDEX[id]; const s = getTopicState(id);
  return `<div class="card" data-open-topic="${id}" style="cursor:pointer;">
    <div style="font-size:11px; color:var(--ink-soft);">${t.subjectName}</div>
    <h3 style="font-size:14.5px; margin:4px 0 6px;">${escapeHtml(t.name.length>70?t.name.slice(0,68)+'…':t.name)}</h3>
    <div style="font-size:12px; color:var(--ink-soft);">Due ${fmtDate(s.nextRevision)} · Confidence ${s.confidence}/5</div>
  </div>`;
}

  <div class="pagehead"><div><h2>Current Affairs</h2><div class="sub">Contemporary events linked to syllabus topics — kept clearly separate from official content</div></div></div>
  <div class="notice">Link a current-affairs event from any topic's "Current Affairs" tab. This page just gives you the full list across the syllabus.</div>
  ${list.length? list.map(c=>`
    <div class="list-entry">
      <button class="del" data-del-affair-global="${c.id}">remove</button>
      <b>${escapeHtml(c.event)}</b>
      <div class="meta">${fmtDate(c.date)}${c.topicId&&TOPIC_INDEX[c.topicId]?` · linked to ${escapeHtml(TOPIC_INDEX[c.topicId].name.slice(0,50))} (${TOPIC_INDEX[c.topicId].subjectName})`:""}</div>
      ${c.why?`<div style="font-size:12.5px; color:var(--ink-soft); margin-top:4px;">${escapeHtml(c.why)}</div>`:""}
      ${c.topicId?`<button class="btn sm ghost" data-open-topic="${c.topicId}" style="margin-top:6px;">Open linked topic →</button>`:""}
    </div>`).join("") : `<div class="empty"><div class="big">⌘</div>No current-affairs links yet.</div>`}
  `;
}

/* ============================================================================
   ANALYTICS
   ========================================================================== */
function renderAnalytics(){
  const stat = overallStats();
  const sessions = DB.studySessions.length;
  const quizzes = DB.quizHistory.length;
  const avgQuizAcc = quizzes? Math.round(DB.quizHistory.reduce((a,h)=>a+(h.score/h.total),0)/quizzes*100):0;
  const totalPracticed = allTopicIds().reduce((a,id)=>{const s=getTopicState(id); return a+s.practiceCorrect+s.practiceWrong;},0);
  return `
  <div class="pagehead"><div><h2>Study Analytics</h2><div class="sub">Measuring whether you're actually becoming exam-ready</div></div></div>
  <div class="grid cols-4" style="margin-bottom:26px;">
    <div class="card stat"><div class="num">${sessions}</div><div class="label">Active-Recall Sessions</div></div>
    <div class="card stat"><div class="num">${quizzes}</div><div class="label">Quizzes Taken</div></div>
    <div class="card stat"><div class="num">${avgQuizAcc}%</div><div class="label">Avg Quiz Accuracy</div></div>
    <div class="card stat"><div class="num">${DB.mistakes.length}</div><div class="label">Mistakes Logged</div></div>
  </div>
  <div class="section-title-row"><h3>Preparation Heatmap</h3></div>
  <table class="simple">
    <tr><th>Subject</th><th>Weak</th><th>Medium</th><th>Strong</th><th>Coverage</th></tr>
    ${SUBJECTS.map(s=>{
      const topics = allTopicsForSubject(s);
      let weak=0, med=0, strong=0;
      topics.forEach(t=>{ const st=getTopicState(t.id); const c=st.confidence;
        if(st.status==="not_started") return;
        if(c<=2) weak++; else if(c<=3) med++; else strong++; });
      const stt = subjectStats(s);
      return `<tr><td>${s.code} ${s.name}</td><td>${weak}</td><td>${med}</td><td>${strong}</td>
        <td><div class="progress-bar" style="width:120px;"><i style="width:${stt.completion}%"></i></div></td></tr>`;
    }).join("")}
  </table>
  <div class="section-title-row"><h3>Weakness Radar</h3></div>
  <div class="grid cols-2">
    <div class="card"><h3 style="font-size:14px;">Never Tested</h3>
      ${allTopicIds().filter(id=>{const s=getTopicState(id); return s.practiceCorrect+s.practiceWrong===0 && s.status!=="not_started";}).slice(0,8).map(id=>`<div style="font-size:12.5px; padding:4px 0; border-bottom:1px solid var(--line);" data-open-topic="${id}">${escapeHtml(TOPIC_INDEX[id].name.slice(0,60))}</div>`).join("")||`<div class="sub">None — good.</div>`}
    </div>
    <div class="card"><h3 style="font-size:14px;">Low Confidence (started, weak)</h3>
      ${allTopicIds().filter(id=>{const s=getTopicState(id); return s.confidence>0&&s.confidence<=2;}).slice(0,8).map(id=>`<div style="font-size:12.5px; padding:4px 0; border-bottom:1px solid var(--line);" data-open-topic="${id}">${escapeHtml(TOPIC_INDEX[id].name.slice(0,60))}</div>`).join("")||`<div class="sub">None — good.</div>`}
    </div>
  </div>
  <div class="section-title-row"><h3>Preparation Readiness Indicator</h3></div>
  <div class="notice blue">This is a self-tracking indicator based on your own logged progress — not a prediction of actual BCS exam success.</div>
  <div class="grid cols-4">
    ${SUBJECTS.map(s=>{const st=subjectStats(s); const ready = Math.round(st.completion*0.5+ (st.avgConf/5*100)*0.5);
      return `<div class="card stat"><div class="num">${ready}%</div><div class="label">${s.code} ${s.name}</div></div>`;}).join("")}
  </div>
  `;
}

/* ============================================================================
   PLANNER
   ========================================================================== */
function renderPlanner(){
  const p = DB.planner;
  const plan = buildTodayPlan(Number(p.hoursPerDay)||2);
  return `
  <div class="pagehead"><div><h2>Daily Study Planner</h2><div class="sub">Overdue revision → weak high-priority → untouched important → practice → new learning</div></div></div>
  <div class="card" style="margin-bottom:20px;">
    <div class="field-row">
      <div class="field"><label>Available hours today</label><input type="number" min="0.5" step="0.5" id="plHours" value="${p.hoursPerDay}"></div>
      <div class="field"><label>Exam target date</label><input type="date" id="plExam" value="${p.examDate||''}"></div>
      <div class="field"><label>Priority</label><select id="plPriority"><option value="balanced" ${p.priority==='balanced'?'selected':''}>Balanced</option><option value="weak" ${p.priority==='weak'?'selected':''}>Focus weak areas</option><option value="revision" ${p.priority==='revision'?'selected':''}>Focus revision</option></select></div>
    </div>
    <button class="btn primary sm" id="savePlannerBtn">Save & regenerate plan</button>
    ${p.examDate? `<div style="margin-top:10px; font-size:12.5px; color:var(--ink-soft);">${daysUntil(p.examDate)} day(s) until your exam target.</div>`:""}
  </div>
  <div class="section-title-row"><h3>Today's Plan</h3></div>
  ${plan.length? `<div class="grid cols-2">${plan.map((it,i)=>`
    <div class="card" data-open-topic="${it.topic.id}" style="cursor:pointer;">
      <div style="font-size:11px; color:var(--ink-soft);">${i+1}. ${it.reason}</div>
      <h3 style="font-size:14.5px; margin:4px 0;">${escapeHtml(it.topic.name.slice(0,60))}</h3>
      <div style="font-size:12px; color:var(--ink-soft);">${it.topic.subjectName} · ~${it.minutes} min</div>
    </div>`).join("")}</div>` : `<div class="empty">Nothing pending — nice place to be. Add more study hours or explore new topics.</div>`}
  `;
}
function buildTodayPlan(hours){
  const minutesBudget = hours*60;
  const ids = allTopicIds().filter(id=>getTopicState(id).status!=="mastered");
  const scored = ids.map(id=>({id, score:priorityScore(id), bucket:revisionBucket(id)}));
  scored.sort((a,b)=>b.score-a.score);
  let used=0; const plan=[];
  for(const item of scored){
    if(used>=minutesBudget || plan.length>=8) break;
    const chunk = item.bucket==="overdue"?20:(getTopicState(item.id).status==="not_started"?45:30);
    if(used+chunk>minutesBudget && plan.length>0) continue;
    let reason = "New / untouched";
    if(item.bucket==="overdue") reason="Overdue revision";
    else if(item.bucket==="today") reason="Revision due today";
    else if(getTopicState(item.id).confidence<=2 && getTopicState(item.id).status!=="not_started") reason="Weak, high priority";
    plan.push({topic:TOPIC_INDEX[item.id], minutes:chunk, reason});
    used+=chunk;
  }
  return plan;
}

/* ============================================================================
   GLOBAL SEARCH
   ========================================================================== */
function runSearch(q){
  q = q.trim().toLowerCase();
  const el = document.getElementById("searchResultsView");
  if(!q){ el.classList.remove("active"); return; }
  el.classList.add("active");
  let results = [];
  allTopicIds().forEach(id=>{
    const t = TOPIC_INDEX[id];
    if(t.name.toLowerCase().includes(q)) results.push({type:"Topic", label:t.name, sub:t.subjectName, action:()=>openTopic(id)});
  });
  DB.facts.forEach(f=>{ if(f.text.toLowerCase().includes(q)) results.push({type:"Fact", label:f.text.slice(0,80), sub:f.source||"", action:()=>goto("factbank")}); });
  DB.mistakes.forEach(m=>{ if((m.question||"").toLowerCase().includes(q)) results.push({type:"Mistake", label:m.question, sub:m.type, action:()=>goto("mistakes")}); });
  DB.globalCurrentAffairs.forEach(c=>{ if(c.event.toLowerCase().includes(q)) results.push({type:"Current Affairs", label:c.event, sub:fmtDate(c.date), action:()=>goto("currentaffairs")}); });
  DB.mnemonics.forEach(m=>{ if(m.text.toLowerCase().includes(q)) results.push({type:"Mnemonic", label:m.text, sub:TOPIC_INDEX[m.topicId]?.name||"", action:()=>openTopic(m.topicId)}); });
  Object.values(DB.topics).forEach((s,idx)=>{}); // notes are keyed within topics already covered by topic search fallback below
  allTopicIds().forEach(id=>{
    const s = getTopicState(id);
    if(s.notes && s.notes.toLowerCase().includes(q)) results.push({type:"My Notes", label:s.notes.slice(0,80), sub:TOPIC_INDEX[id].name, action:()=>openTopic(id)});
  });
  el.innerHTML = `<div class="pagehead"><div><h2>Search results</h2><div class="sub">${results.length} match${results.length!==1?'es':''} for "${escapeHtml(q)}"</div></div></div>
    ${results.length? results.slice(0,60).map((r,i)=>`<div class="list-entry" data-search-result="${i}"><span class="badge tag">${r.type}</span> <b>${escapeHtml(r.label)}</b><div class="meta">${escapeHtml(r.sub)}</div></div>`).join(""):`<div class="empty">No matches.</div>`}`;
  el.querySelectorAll("[data-search-result]").forEach((n,i)=>n.addEventListener("click",()=>results[i].action()));
}

/* ============================================================================
   EVENT WIRING (per-view) + GLOBAL EVENTS
   ========================================================================== */
function wireViewEvents(){
  const root = document.getElementById("views");
  root.querySelectorAll("[data-open-topic]").forEach(n=>n.addEventListener("click",(e)=>{ e.stopPropagation(); openTopic(n.dataset.openTopic); }));
  root.querySelectorAll("[data-open-subject]").forEach(n=>n.addEventListener("click",()=>{ goto("syllabus"); explorerOpen[n.dataset.openSubject]=true; renderCurrentView(); }));
  root.querySelectorAll("[data-subj-toggle]").forEach(n=>n.addEventListener("click",(e)=>{
    if(e.target.closest("[data-open-topic]")) return;
    const id=n.dataset.subjToggle; explorerOpen[id]=!explorerOpen[id]; renderCurrentView();
  }));
  root.querySelectorAll("[data-item-toggle]").forEach(n=>n.addEventListener("click",(e)=>{
    if(e.target.closest("[data-open-topic]")) return;
    e.stopPropagation();
    const id=n.dataset.itemToggle; explorerOpen[id]=!explorerOpen[id]; renderCurrentView();
  }));
  const whatBtn = root.querySelector("#whatToStudyBtn");
  if(whatBtn) whatBtn.addEventListener("click",()=>{ const rec=recommendNextTopic(); if(rec) openTopic(rec.topic.id); });

  // quiz
  root.querySelectorAll("[data-quiz-mode]").forEach(n=>n.addEventListener("click",()=>{
    const mode = n.dataset.quizMode;
    startQuizSession({mode: mode==="random"?"random":mode, size:["quick","standard","deep"].includes(mode)?mode:"standard"});
  }));
  root.querySelectorAll("[data-quiz-subject]").forEach(n=>n.addEventListener("click",()=>startQuizSession({mode:"subject", subjectCode:n.dataset.quizSubject})));
  const quizBack = root.querySelector("#quizBack"); if(quizBack) quizBack.addEventListener("click",()=>{ quizState=null; renderCurrentView(); });
  const quizRestart = root.querySelector("#quizRestart"); if(quizRestart) quizRestart.addEventListener("click",()=>{ quizState=null; renderCurrentView(); });
  const quizExit = root.querySelector("#quizExit"); if(quizExit) quizExit.addEventListener("click",()=>{ quizState=null; renderCurrentView(); });
  root.querySelectorAll("[data-ans]").forEach(n=>n.addEventListener("click",()=>{
    if(quizState.answered) return;
    quizState.answered = true;
    const q = quizState.pool[quizState.idx];
    const chosen = Number(n.dataset.ans);
    const opts = root.querySelectorAll(".quiz-opt");
    opts.forEach((o,i)=>{ if(i===q.a) o.classList.add("correct"); else if(i===chosen) o.classList.add("wrong"); });
    if(chosen===q.a) quizState.correct++; else quizState.wrong++;
    const item = ITEM_INDEX[q.itemId];
    if(item && item.topics[0]){ const s=getTopicState(item.topics[0].id); if(chosen===q.a) s.practiceCorrect++; else s.practiceWrong++; saveDB(); }
    const exp = root.querySelector("#quizExplain"); exp.style.display="block"; exp.textContent = q.explain||"";
    root.querySelector("#quizNext").style.display="inline-block";
  }));
  const quizNext = root.querySelector("#quizNext");
  if(quizNext) quizNext.addEventListener("click",()=>{ quizState.idx++; quizState.answered=false; renderCurrentView(); });

  // revision
  const startRev = root.querySelector("#startRevisionSession");
  if(startRev) startRev.addEventListener("click",()=>{
    const dueIds = allTopicIds().filter(id=>revisionBucket(id)==="overdue"||revisionBucket(id)==="today");
    if(dueIds.length) openTopic(dueIds[0]);
  });

  // mistakes
  const addMistake = root.querySelector("#addMistakeBtn");
  if(addMistake) addMistake.addEventListener("click",()=>{
    const q = root.querySelector("#mQ").value.trim(); if(!q) return;
    DB.mistakes.push({id:uid(), question:q, correct:root.querySelector("#mCorrect").value.trim(),
      type:root.querySelector("#mType").value, why:root.querySelector("#mWhy").value.trim(),
      topicId:root.querySelector("#mTopic").value||null, date:todayISO(), revised:false});
    saveDB(); renderCurrentView();
  });
  root.querySelectorAll("[data-del-mistake]").forEach(n=>n.addEventListener("click",()=>{ DB.mistakes=DB.mistakes.filter(m=>m.id!==n.dataset.delMistake); saveDB(); renderCurrentView(); }));
  root.querySelectorAll("[data-mistake-revised]").forEach(n=>n.addEventListener("change",()=>{
    const m = DB.mistakes.find(x=>x.id===n.dataset.mistakeRevised); if(m){ m.revised=n.checked; saveDB(); }
  }));

  // fact bank
  const addFact = root.querySelector("#addFactBtn");
  if(addFact) addFact.addEventListener("click",()=>{
    const t = root.querySelector("#fText").value.trim(); if(!t) return;
    DB.facts.push({id:uid(), text:t, topicId:root.querySelector("#fTopic").value||null, source:root.querySelector("#fSource").value.trim(), date:todayISO()});
    saveDB(); renderCurrentView();
  });
  root.querySelectorAll("[data-del-fact]").forEach(n=>n.addEventListener("click",()=>{ DB.facts=DB.facts.filter(f=>f.id!==n.dataset.delFact); saveDB(); renderCurrentView(); }));

  // current affairs global
  root.querySelectorAll("[data-del-affair-global]").forEach(n=>n.addEventListener("click",()=>{ DB.globalCurrentAffairs=DB.globalCurrentAffairs.filter(c=>c.id!==n.dataset.delAffairGlobal); saveDB(); renderCurrentView(); }));

  // planner
  const savePlanner = root.querySelector("#savePlannerBtn");
  if(savePlanner) savePlanner.addEventListener("click",()=>{
    DB.planner.hoursPerDay = root.querySelector("#plHours").value;
    DB.planner.examDate = root.querySelector("#plExam").value;
    DB.planner.priority = root.querySelector("#plPriority").value;
    saveDB(); renderCurrentView();
  });

  // settings
  const sExport = root.querySelector("#settingsExport"); if(sExport) sExport.addEventListener("click", exportBackup);
  const sImport = root.querySelector("#settingsImport"); if(sImport) sImport.addEventListener("click", ()=>document.getElementById("importFile").click());
  const sReset = root.querySelector("#settingsReset"); if(sReset) sReset.addEventListener("click", resetProgress);
  const sTheme = root.querySelector("#settingsTheme"); if(sTheme) sTheme.addEventListener("click", toggleTheme);
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `bcs-prep-backup-${todayISO()}.json`;
  a.click();
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      DB = data; saveDB(); loadDB(); renderCurrentView(); renderNav();
      alert("Backup restored.");
    }catch(e){ alert("Could not read that file — is it a valid backup JSON?"); }
  };
  reader.readAsText(file);
}
function resetProgress(){
  if(!confirm("This will permanently erase ALL your tracked progress, notes, mistakes, facts and quiz history in this browser. This cannot be undone. Continue?")) return;
  if(!confirm("Really sure? Consider exporting a backup first. Proceed with full reset?")) return;
  localStorage.removeItem(LS_KEY);
  DB = freshDB(); saveDB();
  renderCurrentView();
}
function toggleTheme(){
  const html = document.documentElement;
  html.classList.toggle("dark");
  DB.settings.theme = html.classList.contains("dark")?"dark":"light";
  saveDB();
}

/* ============================================================================
   INIT
   ========================================================================== */
function initApp(){
  if(DB.settings.theme==="dark") document.documentElement.classList.add("dark");
  renderNav();
  renderCurrentView();
  document.getElementById("globalSearch").addEventListener("input", (e)=>runSearch(e.target.value));
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);
  document.getElementById("exportBtn").addEventListener("click", exportBackup);
  document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change",(e)=>{ if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=""; });
  document.getElementById("topicOverlay").addEventListener("click",(e)=>{ if(e.target.id==="topicOverlay") closeTopic(); });
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeTopic(); });

  // mobile sidebar toggle
  const mt = document.getElementById("menuToggle");
  if(window.innerWidth<=900){ mt.style.display="inline-block"; }
  mt.addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
  window.addEventListener("resize",()=>{ mt.style.display = window.innerWidth<=900 ? "inline-block":"none"; });
}
initApp();
</script>
