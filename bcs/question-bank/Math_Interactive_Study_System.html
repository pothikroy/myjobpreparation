<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>গণিত — ইন্টারেক্টিভ স্টাডি ও রিভিশন সিস্টেম</title>
<style>
@font-face{
  font-family:'Kalpurush';
  src:local('Kalpurush'),local('kalpurush');
  font-display:swap;
}
:root{
  --bg:#FAF6EC;
  --bg-alt:#F1EADA;
  --card:#FFFFFF;
  --ink:#2A2416;
  --ink-soft:#6B6252;
  --ink-faint:#9B917E;
  --line:#E6DCC3;
  --line-strong:#D8CBA8;
  --primary:#1F3E5C;
  --primary-ink:#FFFFFF;
  --primary-soft:#E4EBF1;
  --accent:#2E6E5E;
  --accent-soft:#E1EFE9;
  --gold:#A9761F;
  --gold-soft:#F4E8CE;
  --red:#AE3B26;
  --red-soft:#F6E1DB;
  --amber:#B6811E;
  --amber-soft:#F6ECD6;
  --green:#2E7A4F;
  --green-soft:#DFF0E5;
  --gray:#857C6B;
  --gray-soft:#EDE7D8;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(40,32,10,.06), 0 6px 20px -8px rgba(40,32,10,.15);
  --font-ui: 'Kalpurush','SolaimanLipi','Noto Sans Bengali','Siyam Rupali',ui-sans-serif,system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#12151B;
  --bg-alt:#181D26;
  --card:#1C222C;
  --ink:#EEE8D8;
  --ink-soft:#AFA896;
  --ink-faint:#7C7666;
  --line:#2B3240;
  --line-strong:#394254;
  --primary:#6C97C4;
  --primary-ink:#0E1520;
  --primary-soft:#20334A;
  --accent:#66B39B;
  --accent-soft:#173029;
  --gold:#D9AE55;
  --gold-soft:#332711;
  --red:#E08066;
  --red-soft:#3A2019;
  --amber:#E0B75E;
  --amber-soft:#332812;
  --green:#7BCB9B;
  --green-soft:#173224;
  --gray:#948C7A;
  --gray-soft:#242A34;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
  font-size:16px;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
a{color:inherit;}
::selection{background:var(--gold-soft);}

/* ---------- layout shell ---------- */
#shell{display:flex;min-height:100vh;}
#sidebar{
  width:236px;flex:none;background:var(--bg-alt);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  transition:transform .25s ease;z-index:40;
}
#sidebar .brand{
  padding:20px 18px 14px;border-bottom:1px solid var(--line);
}
#sidebar .brand .title{font-weight:700;font-size:1.15rem;color:var(--primary);letter-spacing:.2px;}
#sidebar .brand .sub{font-size:.76rem;color:var(--ink-faint);margin-top:2px;}
#navlist{list-style:none;margin:0;padding:10px 10px 16px;flex:1;}
#navlist li{margin-bottom:2px;}
#navlist button{
  width:100%;text-align:left;background:none;border:none;border-radius:10px;
  padding:10px 14px;font-size:.95rem;color:var(--ink-soft);display:flex;align-items:center;
  gap:10px;justify-content:flex-start;flex-direction:row;transition:background .15s,color .15s;
}
#navlist button .ic{font-size:1.05rem;width:22px;text-align:center;}
#navlist button:hover{background:var(--gray-soft);color:var(--ink);}
#navlist button.active{background:var(--primary);color:var(--primary-ink);font-weight:600;}
#navlist .badge{
  margin-inline-start:auto;background:var(--red);color:#fff;border-radius:999px;
  font-size:.68rem;padding:1px 7px;font-weight:700;
}
#navlist button.active .badge{background:rgba(255,255,255,.28);}
#sidebar .foot{padding:12px 16px 18px;border-top:1px solid var(--line);font-size:.72rem;color:var(--ink-faint);}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding:12px 22px;display:flex;align-items:center;gap:12px;
}
#topbar .menubtn{display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;}
#topbar h1{font-size:1.05rem;margin:0;font-weight:700;flex:1;}
#topbar .searchbox{position:relative;}
#topbar input[type=search]{
  width:230px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
}
.themebtn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.85rem;}

#content{padding:22px 26px 60px;max-width:1180px;width:100%;margin:0 auto;}

/* ---------- generic components ---------- */
.grid{display:grid;gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:980px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px;box-shadow:var(--shadow);
}
.stat-card{padding:16px 18px;}
.stat-card .label{font-size:.78rem;color:var(--ink-soft);margin-bottom:6px;}
.stat-card .value{font-size:1.7rem;font-weight:800;color:var(--primary);}
.stat-card .value.small{font-size:1.2rem;}
.stat-card .sub{font-size:.72rem;color:var(--ink-faint);margin-top:4px;}

.section-title{font-size:1.02rem;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title .cnt{font-size:.75rem;color:var(--ink-faint);font-weight:500;}

.progressbar{height:9px;border-radius:999px;background:var(--gray-soft);overflow:hidden;}
.progressbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:999px;}

.btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-weight:600;font-size:.86rem;transition:.15s;
}
.btn:hover{border-color:var(--line-strong);background:var(--bg-alt);}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.danger{background:var(--red-soft);color:var(--red);border-color:transparent;}
.btn.sm{padding:6px 11px;font-size:.78rem;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;}
.pill.red{background:var(--red-soft);color:var(--red);}
.pill.amber{background:var(--amber-soft);color:var(--amber);}
.pill.green{background:var(--green-soft);color:var(--green);}
.pill.gray{background:var(--gray-soft);color:var(--gray);}
.pill.gold{background:var(--gold-soft);color:var(--gold);}
.pill.primary{background:var(--primary-soft);color:var(--primary);}

.chaplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.chap-row{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s;
}
.chap-row:hover{border-color:var(--line-strong);box-shadow:var(--shadow);}
.chap-row .idx{
  width:38px;height:38px;border-radius:10px;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex:none;
}
.chap-row .info{flex:1;min-width:0;}
.chap-row .info .name{font-weight:700;font-size:.95rem;}
.chap-row .info .meta{font-size:.76rem;color:var(--ink-faint);margin-top:2px;}
.chap-row .pbwrap{width:120px;flex:none;}
.chap-row .pct{font-size:.72rem;color:var(--ink-soft);text-align:center;margin-top:4px;}
.chap-row .strength{flex:none;}
@media(max-width:640px){.chap-row{flex-wrap:wrap;} .chap-row .pbwrap{width:100%;order:5;}}

.topic-block{margin-bottom:22px;}
.topic-head{
  display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px solid var(--line);margin-bottom:10px;
}
.topic-head h3{font-size:.98rem;margin:0;flex:1;}
.topic-head .cnt{font-size:.75rem;color:var(--ink-faint);}

.qcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.qcard .qtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.qcard .qnum{font-weight:800;color:var(--primary);font-size:.85rem;}
.qcard .qsource{font-size:.72rem;color:var(--ink-faint);margin-inline-start:8px;}
.qcard .qactions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.iconbtn{background:none;border:none;font-size:1.05rem;padding:4px 6px;border-radius:8px;color:var(--ink-faint);}
.iconbtn:hover{background:var(--gray-soft);}
.iconbtn.active{color:var(--gold);}
.qtext{font-size:1.02rem;margin-bottom:14px;line-height:1.75;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
@media(max-width:560px){.opts{grid-template-columns:1fr;}}
.opt{
  border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--bg-alt);
  display:flex;gap:9px;align-items:flex-start;transition:.12s;text-align:right;
}
.opt:hover{border-color:var(--primary);}
.opt .lab{font-weight:800;color:var(--ink-faint);flex:none;}
.opt.selected{border-color:var(--primary);background:var(--primary-soft);}
.opt.correct{border-color:var(--green);background:var(--green-soft);}
.opt.wrong{border-color:var(--red);background:var(--red-soft);}
.opt.disabledopt{opacity:.7;}

.figbox{
  display:flex;gap:12px;align-items:center;background:var(--bg-alt);border:1px dashed var(--line-strong);
  border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.83rem;color:var(--ink-soft);
}
.figbox svg{flex:none;}
.figbox b{color:var(--ink);}

.answerbox{
  background:var(--bg-alt);border-radius:10px;padding:13px 16px;margin-bottom:12px;border-inline-start:4px solid var(--primary);
}
.answerbox .lbl{font-size:.72rem;font-weight:700;color:var(--ink-faint);margin-bottom:4px;}
.answerbox .ans{font-weight:800;color:var(--primary);margin-bottom:8px;}
.answerbox .expl{font-size:.9rem;color:var(--ink-soft);line-height:1.8;}

.statusrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.statusrow .status-label{font-size:.75rem;color:var(--ink-faint);margin-inline-end:4px;}
.sbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:.78rem;font-weight:600;display:flex;gap:5px;align-items:center;}
.sbtn.knew{color:var(--green);} .sbtn.knew.active{background:var(--green-soft);border-color:var(--green);}
.sbtn.wrong{color:var(--red);} .sbtn.wrong.active{background:var(--red-soft);border-color:var(--red);}
.sbtn.revise{color:var(--amber);} .sbtn.revise.active{background:var(--amber-soft);border-color:var(--amber);}
.sbtn.mastered{color:var(--gold);} .sbtn.mastered.active{background:var(--gold-soft);border-color:var(--gold);}

.notewrap{margin-top:10px;}
.notewrap textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg-alt);
  min-height:52px;font-size:.85rem;resize:vertical;
}
.notewrap .nlabel{font-size:.72rem;color:var(--ink-faint);margin-bottom:4px;}

.revmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.74rem;color:var(--ink-faint);}
.revmeta b{color:var(--ink-soft);}

/* filters */
.filterbar{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;
}
.filterbar select, .filterbar input[type=search]{
  padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg-alt);font-size:.82rem;
}
.filterbar .fgroup{display:flex;gap:6px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);background:var(--bg-alt);border-radius:999px;padding:5px 12px;font-size:.78rem;}
.chip.active{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);}

.emptystate{text-align:center;padding:50px 20px;color:var(--ink-faint);}
.emptystate .big{font-size:2.4rem;margin-bottom:10px;}

/* Quiz setup */
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.setup-grid{grid-template-columns:1fr;}}
.opt-tile{
  border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:var(--card);font-size:.85rem;font-weight:600;
}
.opt-tile.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);}
.tilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}

.quizhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.quiztimer{font-weight:800;font-size:1.05rem;color:var(--primary);}
.quizprogress{flex:1;min-width:180px;}

.resultbig{text-align:center;padding:20px 0 8px;}
.resultbig .score{font-size:3rem;font-weight:900;color:var(--primary);}
.resultbig .acc{color:var(--ink-soft);margin-top:4px;}

.focuswrap{max-width:760px;margin:0 auto;}
.focustimer{font-size:2.2rem;font-weight:900;color:var(--primary);text-align:center;margin:6px 0 18px;}

.qr-card{max-width:640px;margin:0 auto;}
.qr-face{min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.05rem;padding:20px 8px;}

.kbd{border:1px solid var(--line-strong);border-radius:6px;padding:1px 7px;font-size:.75rem;background:var(--bg-alt);font-family:monospace;}

.togglewrap{display:flex;align-items:center;gap:8px;}
.switch{width:42px;height:24px;background:var(--gray-soft);border-radius:999px;position:relative;border:1px solid var(--line);}
.switch i{position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;background:var(--card);border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.switch.on{background:var(--primary);}
.switch.on i{inset-inline-start:20px;background:#fff;}

table.simpletable{width:100%;border-collapse:collapse;font-size:.85rem;}
table.simpletable th,table.simpletable td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;}
table.simpletable th{color:var(--ink-faint);font-weight:700;font-size:.75rem;}

.banner{
  background:var(--primary-soft);color:var(--primary);border-radius:12px;padding:14px 18px;margin-bottom:18px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
}
.banner.warn{background:var(--red-soft);color:var(--red);}
.banner strong{font-weight:800;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,16,6,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
}
.modal{background:var(--card);border-radius:var(--radius);padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);}
.modal h3{margin-top:0;}
.modal .btn-row{margin-top:16px;justify-content:flex-end;}

.toast{
  position:fixed;bottom:20px;inset-inline-end:20px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;
  font-size:.85rem;box-shadow:var(--shadow);z-index:200;opacity:0;transform:translateY(8px);transition:.2s;
}
.toast.show{opacity:1;transform:translateY(0);}

.kshelp{position:fixed;bottom:16px;inset-inline-start:16px;z-index:20;}
.kshelp button{background:var(--card);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;box-shadow:var(--shadow);}
.kspanel{
  position:fixed;bottom:64px;inset-inline-start:16px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);font-size:.8rem;z-index:20;width:230px;
}
.kspanel div{display:flex;justify-content:space-between;margin-bottom:6px;}

.overlay-nav{display:none;}
@media(max-width:900px){
  #sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-105%);}
  #sidebar.show-mobile{transform:translateX(0);}
  #topbar .menubtn{display:inline-flex;}
  .overlay-nav.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;}
}
@media(max-width:600px){
  #topbar{padding:10px 12px;gap:8px;}
  #topbar h1{display:none;}
  #topbar .searchbox{flex:1;}
  #topbar input[type=search]{width:100%;}
  .themebtn{padding:7px 9px;font-size:0;}
  .themebtn::before{content:attr(data-ic);font-size:1.1rem;}
  #content{padding:14px 12px 50px;}
}
.srcbadge{font-size:.68rem;background:var(--gray-soft);color:var(--ink-soft);padding:2px 8px;border-radius:999px;}
.smallmuted{color:var(--ink-faint);font-size:.78rem;}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0;}
.checklist{list-style:none;margin:0;padding:0;}
.checklist li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
.checklist li:last-child{border-bottom:none;}
.checklist .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-strong);flex:none;display:flex;align-items:center;justify-content:center;font-size:.75rem;}
.checklist .cb.done{background:var(--green);border-color:var(--green);color:#fff;}
.mistake-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.mistake-row:last-child{border-bottom:none;}
</style>
</head>
<body>
<div id="ag-overlay"></div>

<div id="shell">
  <div class="overlay-nav" id="overlay"></div>
  <nav id="sidebar">
    <div class="brand">
      <div class="title">গাণিতিক যুক্তি</div>
      <div class="sub">Interactive Study &amp; Revision System</div>
    </div>
    <ul id="navlist"></ul>
    <div class="foot">Source: Math.pdf — BCS প্রিলি মাস্টার প্রশ্নব্যাংক</div>
  </nav>
  <div id="main">
    <div id="topbar">
      <button class="menubtn" id="menuBtn">☰</button>
      <h1 id="pageTitle">ড্যাশবোর্ড</h1>
      <div class="searchbox"><input type="search" id="globalSearch" placeholder="প্রশ্ন খুঁজুন…"></div>
      <button class="themebtn" id="themeBtn">🌙 ডার্ক মোড</button>
    </div>
    <div id="content"></div>
  </div>
</div>
<div class="kshelp"><button id="kshelpBtn" title="Keyboard shortcuts">⌨</button></div>

": "১৭তম বিসিএস", "options": {"ক": "x+1", "খ": "1", "গ": "−1", "ঘ": "x−1"}, "answer": "গ", "answer_text": "−1", "explanation": "x−[x−{x−(x+1)}] = x−[x−{x−x−1}] = x−[x+1] = x−x−1 = −1।", "id": "q0152"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.১ সরলমান নির্ণয়", "q": "০৬", "question": "(a²+b²−c²+2ab)/(a²−b²+c²+2ac) = কত?", "source": "১৬তম বিসিএস", "options": {"ক": "a+b+c", "খ": "(a+b−c)/(a−b+c)", "গ": "(a−b+c)/(a+b−c)", "ঘ": "(a+b−c)/(a+b+c)"}, "answer": "খ", "answer_text": "(a+b−c)/(a−b+c)", "explanation": "লব = a²+2ab+b²−c² = (a+b)²−(c)²। হর = a²+2ac+c²−b² = (a+c)²−(b)²। লব=(a+b+c)(a+b−c); হর=(a+c+b)(a+c−b)=(a+b+c)(a−b+c)। ∴ ভগ্নাংশ = (a+b+c)(a+b−c) / [(a+b+c)(a−b+c)] = (a+b−c)/(a−b+c)।", "id": "q0153"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.১ সরলমান নির্ণয়", "q": "০৭", "question": "a=1, b=−1, c=2, d=−2 হলে, a−(−b)−(−c)−(−d) এর মান কত?", "source": "১৫তম বিসিএস", "options": {"ক": "0", "খ": "1", "গ": "2", "ঘ": "3"}, "answer": "ক", "answer_text": "0", "explanation": "a−(−b)−(−c)−(−d) = a+b+c+d = 1−1+2−2 = 3−3 = 0।", "id": "q0154"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.১ সরলমান নির্ণয়", "q": "০৮", "question": "½{(a+b)²+(a−b)²} = কত?", "source": "১৪তম বিসিএস", "options": {"ক": "a²+b²", "খ": "a²−b²", "গ": "(a+b)²/2 − (a−b)²/2", "ঘ": "(a+b)²+(a−b)²"}, "answer": "ক", "answer_text": "a²+b²", "explanation": "½{(a+b)²+(a−b)²} = ½(a²+2ab+b²+a²−2ab+b²) = ½(2a²+2b²) = ½×2(a²+b²) = a²+b²।", "id": "q0155"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.১ সরলমান নির্ণয়", "q": "০৯", "question": "a−{a−(a+1)} = কত?", "source": "১১তম বিসিএস", "options": {"ক": "a−1", "খ": "a", "গ": "1", "ঘ": "a+1"}, "answer": "ঘ", "answer_text": "a+1", "explanation": "a−{a−(a+1)} = a−(a−a−1) = a−(−1) = a+1।", "id": "q0156"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.২ দুই পদের বর্গ", "q": "০১", "question": "যদি x+1/x = 0 হয়, তবে √x + 1/√x এর মান কত?", "source": "৫০তম বিসিএস", "options": {"ক": "0", "খ": "1 12]/(12)² = (49−24)/144 = 25/144।", "id": "q0161"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.২ দুই পদের বর্গ", "q": "০৬", "question": "x²−3x+1=0 হলে (x²−1/x²) এর মান-", "source": "৩৭তম বিসিএস", "options": {"ক": "5√3", "খ": "3√5", "গ": "4√5", "ঘ": "6√5"}, "answer": "খ", "answer_text": "3√5", "explanation": "x²−3x+1=0 ⇒ x²+1=3x ⇒ (x²+1)/x=3 ∴ x+1/x=3। আবার x−1/x=√{(x+1/x)²−4.x.1/x}=√{(3)²−4}=√5। এখন, x²−1/x²=(x+1/x)(x−1/x)=3√5।", "id": "q0162"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.২ দুই পদের বর্গ", "q": "০৭", "question": "যদি a²+1/a²=51 হয় তবে a−1/a এর মান কত?", "source": "৩১তম বিসিএস", "options": {"ক": "±9", "খ": "±7", "গ": "±5", "ঘ": "±3"}, "answer": "খ", "answer_text": "±7", "explanation": "দেওয়া আছে, a²+1/a²=51 ⇒ (a−1/a)²+2.a.1/a=51 ⇒ (a−1/a)²=51−2=49 ⇒ a−1/a=±7।", "id": "q0163"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.২ দুই পদের বর্গ", "q": "০৮", "question": "যদি (x−y)²=14 এবং xy=2 হয় তবে x²+y² এর কত?", "source": "২৭তম বিসিএস", "options": {"ক": "12", "খ": "14", "গ": "16", "ঘ": "18"}, "answer": "ঘ", "answer_text": "18", "explanation": "আমরা জানি, x²+y²=(x−y)²+2xy=14+2×2=18।", "id": "q0164"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.২ দুই পদের বর্গ", "q": "০৯", "question": "x+y=8, x−y=6 হলে, x²+y² এর মান-", "source": "২৬তম বিসিএস", "options": {"ক": "40", "খ": "60", "গ": "50", "ঘ": "80"}, "answer": "গ", "answer_text": "50", "explanation": "দেওয়া আছে, x+y=8 এবং x−y=6। আমরা জানি, x²+y²=½{(x+y)²+(x−y)²}=½{8²+6²}=½×100=50।", "id": "q0165"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.২ দুই পদের বর্গ", "q": "১০", "question": "a+1/a=√3 হলে, a²+1/a² এর মান-", "source": "২৬তম বিসিএস", "options": {"ক": "6", "খ": "4", "গ": "2", "ঘ": "1"}, "answer": "ঘ", "answer_text": "1", "explanation": "আমরা জানি, a²+1/a²=(a+1/a)²−2a.1/a=(√3)²−2=3−2=1।", "id": "q0166"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.২ দুই পদের বর্গ", "q": "১১", "question": "x+y=6 এবং xy=8 হলে  "options": {"ক": "3", "খ": "2", "গ": "1", "ঘ": "0"}, "answer": "ঘ", "answer_text": "0", "explanation": "দেওয়া আছে, x⁴−x²+1=0 ⇒ x⁴+1=x² ⇒ (x⁴+1)/x²=1 ⇒ x²+1/x²=1 ⇒ (x+1/x)²−2.x.1/x=1 ⇒ (x+1/x)²=3 ∴ x+1/x=√3। এখন, x³+1/x³=(x+1/x)³−3.x.1/x(x+1/x)=(√3)³−3√3=3√3−3√3=0।", "id": "q0172"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৪ দুই পদের ঘন", "q": "০৩", "question": "x=√3+√2 হলে, x³+1/x³ এর মান কত?", "source": "৩৮তম বিসিএস", "options": {"ক": "3√2", "খ": "18√3", "গ": "12√3", "ঘ": "8"}, "answer": "খ", "answer_text": "18√3", "explanation": "দেওয়া আছে, x=√3+√2। 1/x=1/(√3+√2)=(√3−√2)/[(√3+√2)(√3−√2)]=(√3−√2)/[(√3)²−(√2)²]=(√3−√2)/(3−2)=√3−√2। ∴ x+1/x=√3+√2+√3−√2=2√3। এখন, x³+1/x³=(x+1/x)³−3.x.1/x(x+1/x)=(2√3)³−3×2√3=24√3−6√3=18√3।", "id": "q0173"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৪ দুই পদের ঘন", "q": "০৪", "question": "x−1/x=1 হলে x³−1/x³ এর মান কত?", "source": "৩৬তম বিসিএস", "options": {"ক": "1", "খ": "2", "গ": "3", "ঘ": "4"}, "answer": "ঘ", "answer_text": "4", "explanation": "আমরা জানি, x³−1/x³=(x−1/x)³+3.x.1/x(x−1/x)=(1)³+3.1=1+3=4।", "id": "q0174"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৪ দুই পদের ঘন", "q": "০৫", "question": "x+y=2, x²+y²=4 হলে x³+y³ = কত?", "source": "৩৪তম বিসিএস", "options": {"ক": "8", "খ": "9", "গ": "16", "ঘ": "25"}, "answer": "ক", "answer_text": "8", "explanation": "দেয়া আছে, x+y=2, x²+y²=4। x²+y²=(x+y)²−2xy ⇒ 4=(2)²−2xy ⇒ 4=4−2xy ∴ xy=0। প্রদত্ত রাশি = x³+y³=(x+y)³−3xy(x+y)=(2)³−3×0×2=8।", "id": "q0175"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৪ দুই পদের ঘন", "q": "০৬", "question": "x−1/x=7 হলে x³−(1/x)³ এর মান কত?", "source": "৩২তম বিসিএস", "options": {"ক": "334", "খ": "154", "গ": "364", "ঘ": "512"}, "answer": "গ", "answer_text": "364", "explanation": "x³−(1/x)³=(x−1/x)³+3.x.1/x(x−1/x)=(7)³+3.7=343+21=364।", "id": "q0176"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৪ দুই পদের ঘন", "q": "০৭", "question": "a−1/a=3 হলে a³+1/a³ এর মান কত?", "source": "৩০তম বিসিএস", "options": {"ক": "9", "খ": "18", "গ": "27", "ঘ": "36"}, "answer": null, "answer_text": "Blank — প্রশ্নটিতে ভুল রয়েছে", "explanation": "প্রশ্নটিতে ভুল রয়েছে। তবে (i) প্রশ্নপক্ষে a³+1/a³ এর পরিবর্তে a³−1/a³ থাকলে, a³−1/a³=(a−1/a)³+3.a.1/a(a−1/a)=3³+(3×3)=27+9=36। (ii) প্রশ্নপক্ষে a−1/a=3 এর পরিবর্তে a+1/a=3 থাকলে, a³+1/a³=(a+1/a)³−3.a.1/a(a+1/a)=3³−(3×3)=27−9=18।", "id": "q0177"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৪ দুই পদের ঘন", "q": "০৮", "question": "x+1/x=√3 হলে, x³+1/x³-এর মান-", "source": "২৫তম বিসিএস", "options": {"ক": "2", "খ": "4", "গ": "0", "ঘ": "6"}, "answer": "গ", "answer_text": "0", "explanation": "x³+1/x³=(x+1/x)³−3.x.1/x(x+1/x)=(√3)³−3√3=3√3−3√3=0।", "id": "q0178"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৫ তিন পদের বর্গ ও ঘন", "q": "০১", "question": "x²+y²+z²=2, xy+yz+zx=1 হলে, (x+2y)²+(y+2z)²+(z+2x)² এর মান-", "source": "৪৬তম বিসিএস", "options": {"ক": "12", "খ": "19", "গ": "16", "ঘ": "14"}, "answer": "ঘ", "answer_text": "14", "explanation": "দেওয়া আছে, x²+y²+z²=2, xy+yz+zx=1। প্রদত্ত রাশি = x²+4xy+4y²+y²+4yz+4z²+z²+4zx+4x² = 5x²+5y²+5z²+4xy+4yz+4zx = 5(x²+y²+z²)+4(xy+yz+zx) = 5×2+4×1 = 14।", "id": "q0179"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৫ তিন পদের বর্গ ও ঘন", "q": "০২", "question": "a+b+c=9, a²+b²+c²=29 হলে ab+bc+ca এর মান কত?", "source": "১৬তম বিসিএস", "options": {"ক": "52", "খ": "46", "গ": "26", "ঘ": "22"}, "answer": "গ", "answer_text": "26", "explanation": "আমরা জানি, (a+b+c)²=a²+b²+c²+2(ab+bc+ca)। ab+bc+ca=[(a+b+c)²−(a²+b²+c²)]/2=[(9)²−29]/2=(81−29)/2=52/2=26।", "id": "q0180"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৫ তিন পদের বর্গ ও ঘন", "q": "০৩", "question": "a+b+c=0 হলে a³+b³+c³ এর মান কত?", "source": "১০তম বিসিএস", "options": {"ক": "abc", "খ": "3abc", "গ": "6abc", "ঘ": "9abc"}, "answer": "খ", "answer_text": "3abc", "explanation": "প্রদত্ত রাশি, a³+b³+c³=a³+b³+c³−3abc+3abc=(a+b+c)(a²+b²+c²−ab−bc−ca)+3abc=0+3abc=3abc।", "id": "q0181"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৬ বিবিধ", "q": "০১", "question": "(x+5)²=x²+bx+c সমীকরণে b ও c এর মান কত হলে সমীকরণটি অভেদ হবে?", "source": "৪৪তম বিসিএস", "options": {"ক": "3, 10", "খ": "10, 15", "গ": "15, 25", "ঘ": "10, 25"}, "answer": "ঘ", "answer_text": "10, 25", "explanation": "(x+5)²=x²+bx+c ⇒ x²+2.x.5+(5)²=x²+bx+c ⇒ x²+10x+25=x²+bx+c। উভয়পক্ষ হতে x এর সহগ এবং ধ্রুবক সমীকৃত করে পাই, b=10 এবং c=25।", "id": "q0182"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৬ বিবিধ", "q": "০২", "question": "x−y=2 এবং xy=24 হলে, x-এর ধনাত্মক মানটি-", "source": "৩৫তম বিসিএস", "options": {"ক": "3", "খ": "4", "গ": "5", "ঘ": "6"}, "answer": "ঘ", "answer_text": "6", "explanation": "আমরা জানি, (x+y)²=(x−y)²+4xy=(2)²+4.24=4+96=100 ∴ x+y=±10। ধনাত্মক মান নিয়ে, x+y=10...(i); x−y=2...(ii)। (i)+(ii) করে পাই, 2x=12 ∴ x=6।", "id": "q0183"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৬ বিবিধ", "q": "০৩", "question": "যদি a+b=2, ab=1 হয় তবে a এবং b এর মান যথাক্রমে-", "source": "৩১তম বিসিএস", "options": {"ক": "0, 2", "খ": "1, 1", "গ": "−1, 3", "ঘ": "−3, −4"}, "answer": "খ", "answer_text": "1, 1", "explanation": "দেওয়া আছে, a+b=2...(i)। (a+b)²=(2)² [বর্গ করে] ⇒ (a−b)²+4ab=4 ⇒ (a−b)²+4×1=4 [∵ab=1] ⇒ (a−b)²=0 ⇒ a−b=0...(ii)। (i)+(ii) করে পাই, a+b+a−b=2+0 ⇒ 2a=2 ∴ a=1। a এর মান (i) নং সমীকরণে বসালে, 1+b=2 ⇒ b=1। সুতরাং, a=1, b=1।", "id": "q0184"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৬ বিবিধ", "q": "০৪", "question": "a+b=7 এবং a²+b²=25 হলে নিচের কোনটি ab এর মান হবে?", "source": "৩০তম বিসিএস", "options": {"ক": "12", "খ": "10", "গ": "6", "ঘ": "কোনোটিই নয়"}, "answer": "ক", "answer_text": "12", "explanation": "দেওয়া আছে, a²+b²=25। বা, (a+b)²−2ab=25। বা, 7²−2ab=25 [∵a+b=7] বা, 2ab=24 ∴ ab=12।", "id": "q0185"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৬ বিবিধ", "q": "০৫", "question": "x+y=12 এবং x−y=2 হলে xy- এর মান কত?", "source": "২২তম বিসিএস", "options": {"ক": "35", "খ": "140", "গ": "70", "ঘ": "144"}, "answer": "ক", "answer_text": "35", "explanation": "xy=[(x+y)²−(x−y)²]/4=[12²−2²]/4=(144−4)/4=140/4=35।", "id": "q0186"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৬ বিবিধ", "q": "০৬", "question": "যদি a³−b³=513 এবং a−b=3 হয় তবে ab -এর মান কত?", "source": "১১তম বিসিএস", "options": {"ক": "54", "খ": "35", "গ": "45", "ঘ": "55"}, "answer": "ক", "answer_text": "54", "explanation": "আমরা জানি, a³−b³=(a−b)³+3ab(a−b) ⇒ 513=(3)³+9ab ⇒ 513=27+9ab ⇒ 9ab=486 ∴ ab=54।", "id": "q0187"}, {"chapter": "অধ্যায় ০৮: বীজগাণিতিক সূত্রাবলি", "topic": "৮.৬ বিবিধ", "q": "০৭", "question": "a+b=5 এবং a−b=3 হলে ab এর মান কত?", "source": "১০তম বিসিএস", "options": {"ক": "2", "খ": "4", "গ": "3", "ঘ": "5"}, "answer": "খ", "answer_text": "4", "explanation": "আমরা জানি, ab=[(a+b)²−(a−b)²]/4=(5²−3²)/4=(25−9)/4=16/4=4।", "id": "q0188"}, {"chapter": "অধ্যায় ০৯: বহুপদী উৎপাদক", "topic": "৯.১ সূত্র প্রয়োগ করে উৎপাদক নির্ণয়", "q": "০১", "question": "x²−y²+2y−1 এর একটি উৎপাদক-", "source": "৩২ ও ২৬তম বিসিএস", "options": {"ক": "x+y+1", "খ": "x−y", "গ": "x+y−1", "ঘ": "x−y−1"}, "answer": "গ", "answer_text": "x+y−1", "explanation": "x²−y²+2y−1 = x²−(y²−2y+1) = x²−(y−1)² = (x+y−1)(x−y+1)।", "id": "q0189"}, {"chapter": "অধ্যায় ০৯: বহুপদী উৎপাদক", "topic": "৯.১ সূত্র প্রয়োগ করে উৎপাদক নির্ণয়", "q": "০২", "question": "a⁴+4 এর উৎপাদক কি কি?", "source": "১২তম বিসিএস", "options": {"ক": "(a²+2a+2)(a²−2a−2)", "খ": "(a²+2a+2)(a²−2a+2)", "গ": "(a²−2a+2)(a²−2a−2)", "ঘ": "(a²−2a−2)(a²−2a+2)"}, "answer": "খ", "answer_text": "(a²+2a+2)(a²−2a+2)", "explanation": "a⁴+4 = {(a²)²+2.a².2+2²}−2a².2 = (a²+2)²−(2a)² = (a²+2+2a)(a²+2−2a) = (a²+2a+2)(a²−2a+2)।", "id": "q0190"}, {"chapter": "অধ্যায় ০৯: বহুপদী উৎপাদক", "topic": "৯.২ মিডেল টার্মের সাহায্যে উৎপাদক নির্ণয়", "q": "০১", "question": "2x²+x−15-এর উৎপাদক কোনটি?", "source": "২৪তম বিসিএস", "options": {"ক": "(x+3)(2x−5)", "খ": "(x−3)(2x−5)", "গ": "(x−3)(2x+5)", "ঘ": "(x+3)(2x+5)"}, "answer": "ক", "answer_text": "(x+3)(2x−5)", "explanation": "2x²+x−15 = 2x²+6x−5x−15 = 2x(x+3)−5(x+3) = (x+3)(2x−5)।", "id": "q0191"}, {"chapter": "অধ্যায় ০৯: বহুপদী উৎপাদক", "topic": "৯.২ মিডেল টার্মের সাহায্যে উৎপাদক নির্ণয়", "q": "০২", "question": "2x²−x−15 এর উৎপাদক হবে-", "source": "১২তম বিসিএস", "options": {"ক": "(x+6)(x−5)", "খ": "(x−5)(x−6)", "গ": "(x+3)(2x−5)", "ঘ": "(2x+5)(x−3)"}, "answer": "ঘ", "answer_text": "(2x+5)(x−3)", "explanation": "2x²−x−15 = 2x²+5x−6x−15 = x(2x+5)−3(2x+5) = (2x+5)(x−3)।", "id": "q0192"}, {"chapter": "অধ্যায় ০৯: বহুপদী উৎপাদক", "topic": "৯.৩ ভাগশেষ উপপাদ্যের সাহায্যে উৎপাদক নির্ণয়", "q": "০১", "question": "x⁴−2x+1 কে x−3 দিয়ে ভাগ করলে ভাগশেষ কত হবে?", "source": "৫০তম বিসিএস", "options": {"ক": "2", "খ": "81", "গ": "0", "ঘ": "76"}, "answer": "ঘ", "answer_text": "76", "explanation": "ধরি, f(x)=x⁴−2x+1। f(x) কে (x−3) দিয়ে ভাগ করলে ভাগশেষ হবে, f(3)=3⁴−2×3+1=81−6+1=76।", "id": "q0193"}, {"chapter": "অধ্যায় ০৯: বহুপদী উৎপাদক", "topic": "৯.৩ ভাগশেষ উপপাদ্যের সাহায্যে উৎপাদক নির্ণয়", "q": "০২", "question": "যদি 5x³−2x²+x+k=0 এর একটি উৎপাদক (x−3) হয়, তাহলে k এর মান কত?", "source": "৪৭তম বিসিএস", "options": {"ক": "50", "খ": "60", "গ": "−120", "ঘ": "−60"}, "answer": "গ", "answer_text": "−120", "explanation": "এখানে, বহুপদীটির একটি উৎপাদক (x−3), অর্থাৎ বহুপদীটি x=3 এর জন্য সিদ্ধ হবে। তাহলে, বহুপদী সমীকরণে x=3 বসিয়ে পাই, 5×(3)³−2×(3)²+3+k=0 ⇒ 5×27−2×9+3+k=0 ⇒ 135−18+3+k=0 ⇒ 120+k=0 ∴ k=−120।", "id": "q0194"}, {"chapter": "অধ্যায় ০৯: বহুপদী উৎপাদক", "topic": "৯.৩ ভাগশেষ উপপাদ্যের সাহায্যে উৎপাদক নির্ণয়", "q": "০৩", "question": "x³−x² কে x−2 দ্বারা ভাগ করলে অবশেষ থাকবে-", "source": "৩১তম বিসিএস", "options": {"ক": "2", "খ": "4", "গ": "−6", "ঘ": "−8"}, "answer": "খ", "answer_text": "4", "explanation": "ধরি, f(x)=x³−x²। f(x) কে (x−2) দ্বারা ভাগ করলে ভাগশেষ হবে f(2)। ∴ f(2)=2³−2²=8−4=4।", "id": "q0195"}, {"chapter": "অধ্যায় ০৯: বহুপদী উৎপাদক", "topic": "৯.৩ ভাগশেষ উপপাদ্যের সাহায্যে উৎপাদক নির্ণয়", "q": "০৪", "question": "3x³+2x²−21x−20 রাশিটির একটি উৎপাদক হচ্ছে-", "source": "৩০তম বিসিএস", "options": {"ক": "x+2", "খ": "x−2", "গ": "x+1", "ঘ": "x−1"}, "answer": "গ", "answer_text": "x+1", "explanation": "ধরি, f(x)=3x³+2x²−21x−20। ∴ f(−1)=3(−1)³+2(−1)²−21(−1)−20=0। যেহেতু x এর পরিবর্তে −1 বসালে প্রদত্ত রাশিটির মান শূন্য (0) হয়, সুতরাং x−(−1) বা x+1 প্রদত্ত রাশিটির একটি উৎপাদক।", "id": "q0196"}, {"chapter": "অধ্যায় ০৯: বহুপদী উৎপাদক", "topic": "৯.৩ ভাগশেষ উপপাদ্যের সাহায্যে উৎপাদক নির্ণয়", "q": "০৫", "question": "যদি x³+hx+10=0 এর সমাধান 2 হয়, তবে h এর মান কত?", "source": "১৩তম বিসিএস", "options": {"ক": "10", "খ": "9", "গ": "−9", "ঘ": "−2"}, "answer": "গ", "answer_text": "−9", "explanation": "x এর মান 2 হলে 2 দ্বারা সমীকরণটি সিদ্ধ হবে। ∴ (2)³+h.2+10=0 ⇒ 2h=−18 ∴ h=−9।", "id": "q0197"}, {"chapter": "অধ্যায় ০৯: বহুপদী উৎপাদক", "topic": "৯.৩ ভাগশেষ উপপাদ্যের সাহায্যে উৎপাদক নির্ণয়", "q": "০৬", "question": "(x+3)(x−3) কে x²−6 দিয়ে ভাগ করলে ভাগশেষ কত হবে?", "source": "১১তম বিসিএস", "options": {"ক": "−6", "খ": "3", "গ": "6", "ঘ": "−3"}, "answer": "ঘ", "answer_text": "−3", "explanation": "ধরি, f(x)=(x+3)(x−3)=x²−9। f(x) কে x²−6 দ্বারা ভাগ করলে ভাগশেষ হবে f(√6)। ∴ f(√6)=(√6)²−9=6−9=−3। অতএব, ভাগশেষ=−3।", "id": "q0198"}, {"chapter": "অধ্যায় ১০: সরল ও দ্বিপদী সমীকরণ", "topic": "১০.১ একঘাত ও দ্বিঘাত সমীকরণের সমাধান", "q": "০১", "question": "1/(x−1)+2/(x−2)=3/(x−3) এর সমাধান-", "source": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "3/2", "খ": "2/3", "গ": "5/1", "ঘ": "2/5"}, "answer": "ক", "answer_text": "3/2", "explanation": "1/(x−1)+2/(x−2)=3/(x−3) ⇒ 1/(x−1)−1/(x−3)=2/(x−3)−2/(x−2) ⇒ (x−3−x+1)/[(x−1)(x−3)]=[2(x−2)−2(x−3)]/[(x−3)(x−2)] ⇒ −2/(x−1)=(2x−4−2x+6)/(x−2) ⇒ −2/(x−1)=2/(x−2) ⇒ −1/(x−1)=1/(x−2) ⇒ x−1=−x+2 ⇒ 2x=3 ∴ x=3/2।", "id": "q0199"}, {"chapter": "অধ্যায় ১০: সরল ও দ্বিপদী সমীকরণ", "topic": "১০.১ একঘাত ও দ্বিঘাত সমীকরণের সমাধান", "q": "০২", "question": "(x−2)/(x−1)+1/(x−1)−2=0 এর সমাধান সেট কোনটি?", "source": "৪৩তম বিসিএস", "options": {"ক": "{φ}", "খ": "{1}", "গ": "{−1}", "ঘ": "{2}"}, "answer": "ক", "answer_text": "{φ}", "explanation": "দেওয়া আছ িএস", "options": {"ক": "৪ জন", "খ": "৩ জন", "গ": "২ জন", "ঘ": "৫ জন"}, "answer": "খ", "answer_text": "৩ জন", "explanation": "ধরি, স্ট্যাম্প আউট হলো 'ক' জন। ∴ কট আউট হলো (৩ক/২) জন। প্রশ্নানুসারে, ক+(৩ক/২)+৫=১০ ⇒ (২ক+৩ক)/২=১০−৫ ⇒ ৫ক=১০ ∴ ক=২। ∴ কট আউট হলো=(৩×২)/২ জন=৩ জন।", "id": "q0234"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.১ পরমমান সংক্রান্ত সমস্যা", "q": "০১", "question": "|3x−1|<2 এর সমাধান সেট:", "source": "৫০তম বিসিএস", "options": {"ক": "(−1/3, 0)", "খ": "(−1/3, ∞)", "গ": "(−1/3, 1)", "ঘ": "(∞, −1/3)"}, "answer": "গ", "answer_text": "(−1/3, 1)", "explanation": "দেওয়া আছে, |3x−1|<2 ⇒ −2<3x−1<2 ⇒ −2+1<3x<2+1 ⇒ −1<3x<3 ⇒ −1/3<x<1। ∴ নির্ণেয় সমাধান সেট: (−1/3, 1)।", "id": "q0235"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.১ পরমমান সংক্রান্ত সমস্যা", "q": "০২", "question": "|3x−4|≤2 এর সমাধান-", "source": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "2/3≤x≤2", "খ": "2/3≤x<2", "গ": "2/3<x<2", "ঘ": "2/3<x≤2"}, "answer": "ক", "answer_text": "2/3≤x≤2", "explanation": "|3x−4|≤2 ⇒ −2≤3x−4≤2 ⇒ −2+4≤3x−4+4≤2+4 ⇒ 2≤3x≤6 ⇒ 2/3≤x≤6/3 ∴ 2/3≤x≤2।", "id": "q0236"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.১ পরমমান সংক্রান্ত সমস্যা", "q": "০৩", "question": "|x−5|<2, x∈N অসমতাটির সমাধান সেট কোনটি?", "source": "৪৭তম বিসিএস", "options": {"ক": "(3,7)", "খ": "(3,7)", "গ": "{4,5,6}", "ঘ": "{3,4,5,6,7}"}, "answer": "গ", "answer_text": "{4,5,6}", "explanation": "দেওয়া আছে, |x−5|<2 ⇒ −2<x−5<2 ⇒ −2+5<x−5+5<2+5 ⇒ 3<x<7। অর্থাৎ x এর মান 3 থেকে বড় এবং 7 থেকে ছোট স্বাভাবিক সংখ্যা। (যেহেতু x∈N) ∴ নির্ণেয় সমাধান সেট = {4,5,6}।", "id": "q0237"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.১ পরমমান সংক্রান্ত সমস্যা", "q": "০৪", "question": "বাস্তব সংখ্যায় |3x+2|<7 অসমতাটির সমাধান:", "source": "৪৪তম বিসিএস", "options": {"ক": "−3<x<3", "খ": "−5/3<x<5/3", "গ": "−3<x<5/3", "ঘ": "5/3<x<5/3"}, "answer": "গ", "answer_text": "−3<x<5/3", "explanation": "প্রদত্ত অসমতা, |3x+2|<7 ⇒ −7<3x+2<7 ⇒ −7−2<3x<7−2 ⇒ −9<3x<5 ⇒ −9/3<3x/3<5/3 ∴ −3<x<5/3।", "id": "q0238"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.১ পরমমান সংক্রান্ত সমস্যা", "q": "০৫", "question": "|x−2|<3 হলে, m এবং n এর কোন মানের জন্য m<3x+5<n হবে?", "source": "৪১তম বিসিএস", "options": {"ক": "m=1, n=10", "খ": "m=2, n=20", "গ": "m=3, n=30", "ঘ": "m=4, n=40"}, "answer": "খ", "answer_text": "m=2, n=20", "explanation": "|x−2|<3 ⇒ −3<x−2<3 ⇒ −3+2<x−2+2<3+2 ⇒ −1<x<5 ⇒ −3<3x<15 [3 দ্বারা গুণ করে] ⇒ −3+5<3x+5<15+5 ⇒ 2<3x+5<20। অসমতাটিকে m<3x+5<n এর সাথে তুলনা করে পাই, m=2 এবং n=20।", "id": "q0239"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.১ পরমমান সংক্রান্ত সমস্যা", "q": "০৬", "question": "|1−2x|<1 এর সমাধান-", "source": "৩৯তম বিসিএস", "options": {"ক": "−2<x<1", "খ": "−1<x<0", "গ": "0<x<1", "ঘ": "−1<x<1"}, "answer": "গ", "answer_text": "0<x<1", "explanation": "|1−2x|<1 ⇒ −1<1−2x<1 ⇒ −1−1<−2x<1−1 ⇒ −2<−2x<0 ⇒ 1>x>0।", "id": "q0240"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.১ পরমমান সংক্রান্ত সমস্যা", "q": "০৭", "question": "বাস্তব সংখ্যায় |2x−3|≤1 অসমতাটির সমাধান-", "source": "৩৮তম বিসিএস", "options": {"ক": "1<x<2", "খ": "x≤1 অথবা x≥2", "গ": "1≤x≤2", "ঘ": "−1<x<2"}, "answer": "গ", "answer_text": "1≤x≤2", "explanation": "|2x−3|≤1 ⇒ −1≤2x−3≤1 ⇒ −1+3≤2x≤1+3 ⇒ 2≤2x≤4 ⇒ 1≤x≤2।", "id": "q0241"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.১ পরমমান সংক্রান্ত সমস্যা", "q": "০৮", "question": "|x−3|<5 হলে-", "source": "৩৫তম বিসিএস", "options": {"ক": "2<x<8", "খ": "−2<x<8", "গ": "−8<x<−2", "ঘ": "−4<x<−2"}, "answer": "খ", "answer_text": "−2<x<8", "explanation": "|x−3|<5 ⇒ −5<x−3<5 ⇒ −5+3<x<5+3 ⇒ −2<x<8।", "id": "q0242"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.২ একঘাত অসমতা", "q": "০১", "question": "3x−2>2x−1 এর সমাধান সেট কোনটি?", "source": "৪০তম বিসিএস", "options": {"ক": "[1,∞)", "খ": "(1,∞)", "গ": "[1/2,∞)", "ঘ": "[−1,∞)"}, "answer": "খ", "answer_text": "(1,∞)", "explanation": "3x−2>2x−1 ⇒ 3x−2x>2−1 ⇒ x>1। ∴ নির্ণেয় সমাধান সেট: (1,∞)।", "id": "q0243"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.২ একঘাত অসমতা", "q": "০২", "question": "x>y এবং z<0 হলে নিচের কোনটি সঠিক?", "source": "৩০তম বিসিএস", "options": {"ক": "xz>yz", "খ": "x/z>y/z", "গ": "z/x<z/y", "ঘ": "xz<yz"}, "answer": "ঘ", "answer_text": "xz<yz", "explanation": "যেহেতু z<0; সেহেতু z একটি ঋণাত্মক সংখ্যা। দেওয়া আছে, x>y সুতরাং, xz<yz [উভয়পক্ষকে z দ্বারা গুণ করে] z একটি ঋণাত্মক সংখ্যা বলে z দ্বারা উভয়পক্ষকে গুণ করায় > চিহ্ন পরিবর্তিত হয়ে < চিহ্ন হয়েছে।", "id": "q0244"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.৩ দ্বিঘাত অসমতা", "q": "০১", "question": "x²+6x−27<0 অসমতাটির সমাধান সেট নিচের কোনটি?", "source": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "[−9,3]", "খ": "[3,∞)", "গ": "(−9,3)", "ঘ": "(∞,−9)"}, "answer": "গ", "answer_text": "(−9,3)", "explanation": "x²+6x−27<0 ⇒ x²+9x−3x−27<0 ⇒ x(x+9)−3(x+9)<0 ⇒ (x−3)(x+9)<0। এখন, (x−3) ও (x+9) রাশিদ্বয়ের একটি ধনাত্মক এবং অপরটি ঋণাত্মক হলে, অসমতাটি সত্য হবে। শর্ত-(i): x−3<0 এবং x+9>0 ⇒ x<3 এবং x>−9 অর্থাৎ −9<x<3 বা (−9,3)। শর্ত-(ii): x−3>0 এবং x+9<0 ⇒ x>3 এবং x<−9 অর্থাৎ ফাঁকা সেট। সুতরাং, উল্লিখিত অসমতার সমাধান (−9,3)।", "id": "q0245"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.৩ দ্বিঘাত অসমতা", "q": "০২", "question": "x²−7x+12≤0 এর সমাধান সেট -", "source": "৪৬তম বিসিএস", "options": {"ক": "(−∞,3]", "খ": "(3,4)", "গ": "[3,4]", "ঘ": "[4,∞)"}, "answer": "গ", "answer_text": "[3,4]", "explanation": "x²−7x+12≤0 ⇒ x²−4x−3x+12≤0 ⇒ x(x−4)−3(x−4)≤0 ⇒ (x−4)(x−3)≤0। এখন, (x−4) ও (x−3) রাশিদ্বয়ের একটি ধনাত্মক এবং অপরটি ঋণাত্মক হলে, অসমতাটি সত্য হবে। এখন, (i) x−4≥0 এবং x−3≤0 ⇒ x≥4 এবং x≤3 ⇒ ϕ। অথবা, (ii) x−4≤0 এবং x−3≥0 ⇒ x≤4 এবং x≥3 ⇒ 3≤x≤4। ∴ নির্ণেয় সমাধান: 3≤x≤4 অর্থাৎ, [3,4]।", "id": "q0246"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.৩ দ্বিঘাত অসমতা", "q": "০৩", "question": "5x−x²−6>0 হলে, নিচের কোনটি সঠিক?", "source": "৪৩তম বিসিএস", "options": {"ক": "x>3, x<2", "খ": "2>x>3", "গ": "x<2", "ঘ": "2<x<3"}, "answer": "ঘ", "answer_text": "2<x<3", "explanation": "5x−x²−6>0 ⇒ x²−5x+6<0 [(−1) দ্বারা গুণ করে] ⇒ x²−3x−2x+6<0 ⇒ x(x−3)−2(x−3)<0 ⇒ (x−3)(x−2)<0। এখন, (x−3) ও (x−2) রাশিদ্বয়ের একটি ধনাত্মক এবং অপরটি ঋণাত্মক হলে, অসমতাটি সত্য হবে। শর্ত-(i): x−3<0 এবং x−2>0 ⇒ x<3 এবং x>2 অর্থাৎ 2<x<3। শর্ত-(ii): x−3>0 এবং x−2<0 ⇒ x>3 এবং x<2 অর্থাৎ ফাঁকা সেট। ∴ নির্ণেয় সমাধান: 2<x<3।", "id": "q0247"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.৩ দ্বিঘাত অসমতা", "q": "০৪", "question": "x²−3x−10>0 অসমতাটির সমাধান কোনটি?", "source": "৪২তম বিসিএস", "options": {"ক": "(−∞,−1)∪(4,+∞)", "খ": "(−∞,−2)∪(5,+∞)", "গ": "(∞,2)∪(5,+∞)", "ঘ": "(−5,−∞)∪(∞,2)"}, "answer": "খ", "answer_text": "(−∞,−2)∪(5,+∞)", "explanation": "x²−3x−10>0 ⇒ x²−5x+2x−10>0 ⇒ x(x−5)+2(x−5)>0 ⇒ (x−5)(x+2)>0। এখন, (x−5) ও (x+2) রাশিদ্বয়ের উভয়ই ধনাত্মক অথবা উভয়ই ঋণাত্মক হলে, অসমতাটি সত্য হবে। শর্ত-(i): x−5>0 এবং x+2>0 ⇒ x>5 এবং x>−2 ⇒ x>5 [কমন অংশ নিয়ে]। শর্ত-(ii): x−5<0 এবং x+2<0 ⇒ x<5 এবং x<−2 ⇒ x<−2 [কমন অংশ নিয়ে]। ∴ নির্ণেয় সমাধান: x<−2 অথবা x>5 ⇒ (−∞,−2)∪(5,+∞)।", "id": "q0248"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.৩ দ্বিঘাত অসমতা", "q": "০৫", "question": "2x²+5x+3<0 এর সমাধান কোনটি?", "source": "৩৯তম বিসিএস", "options": {"ক": "−3/2<x<−1", "খ": "−3/2<x<1", "গ": "−3/2≤x≤1", "ঘ": "−3/2<x≤1"}, "answer": "ক", "answer_text": "−3/2<x<−1", "explanation": "2x²+5x+3<0 ⇒ 2x²+3x+2x+3<0 ⇒ x(2x+3)+1(2x+3)<0 ⇒ (2x+3)(x+1)<0। এখন, (2x+3) ও (x+1) রাশিদ্বয়ের একটি ধনাত্মক এবং অপরটি ঋণাত্মক হলে, অসমতাটি সত্য হবে। শর্ত-(i): (2x+3)>0 এবং (x+1)<0 ⇒ x>−3/2 এবং x<−1 অর্থাৎ −3/2<x<−1। শর্ত-(ii): (2x+3)<0 এবং (x+1)>0 ⇒ x<−3/2 এবং x>−1 অর্থাৎ ফাঁকা সেট। ∴ নির্ণেয় সমাধান: −3/2<x<−1।", "id": "q0249"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.৩ দ্বিঘাত অসমতা", "q": "০৬", "question": "x²−5x+6<0 হলে-", "source": "৩৭তম বিসিএস", "options": {"ক": "2<x<3", "খ": "−3<x<−2", "গ": "x<2", "ঘ": "x<3"}, "answer": "ক", "answer_text": "2<x<3", "explanation": "x²−5x+6<0 এর উৎপাদক (x−2)(x−3)<0। এখন (x−2) ও (x−3) এর একটি ধনাত্মক ও অপরটি ঋণাত্মক হলে অসমতাটি সত্য হবে, যা থেকে সমাধান পাওয়া যায় 2<x<3।", "id": "q0250"}, {"chapter": "অধ্যায় ১১: সরল ও দ্বিপদী অসমতা", "topic": "১১.৪ ভগ্নাংশ আকারের অসমতা", "q": "০১", "question": "বাস্তব সংখ্যায় 1/(3x−5) < 1/3 অসমতাটির সমাধান-", "source": "৪৩তম বিসিএস", "options": {"ক": "−∞<x<5/3", "খ": "8/3<x<∞", "গ": "−∞<x<5/2 অথবা 8/3<x<∞", "ঘ": "−∞<x<5/2 এবং 8/3<x<∞"}, "answer": null, "answer_text": "Blank (উত্তর উল্লেখ নেই)", "explanation": "1/(3x−5)<1/3 ⇒ 1/(3x−5)−1/3<0 ⇒ (3−3x+5)/[3(3x−5)]<0 ⇒ (8−3x)/(3x−5)<0 [উভয় পক্ষকে 3 দ্বারা গুণ করে] ⇒ (3x−8)/(3x−5)>0 [উভয় পক্ষকে −1 দ্বারা গুণ করে] ⇒ (3x−8)(3x−5)>0 [উভয় পক্ষকে (3x−5)² দ্বারা গুণ করে]। (3x−8)(3x−5)>0 হতে হলে (3x−8) ও (3x−5) এর উভয়ই ধনাত্মক অথবা উভয়ই ঋণাত্মক হতে হবে। এখন, 3x−8>0 ⇒ x>8/3 হলে (3x−8) ও (3x−5) উভয়ই ধনাত্মক হবে। আবার, 3x−5<0 ⇒ x<5/3 হলে (3x−8) ও (3x−5) উভয়ই ঋণাত্মক হবে। ∴ (3x−8)(3x−5)>0 হবে যদি এবং কেবল যদি x<5/3 অথবা x>8/3 হয়। নির্ণেয় সমাধান: x<5/3 অথবা x>8/3 অর্থাৎ, −∞<x<5/3 অথবা 8/3<x<∞।", "id": "q0251"}, {"chapter": "অধ্যায় ১২: সরল সহ সমীকরণ", "topic": "সরল সহ সমীকরণ", "q": "০১", "question": "ax+by=a²; bx−ay=ab; এই সহ-সমীকরণের (x,y) এর সমাধান কোনটি?", "source": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "(a², b²)", "খ": "(a,b)", "গ": "(0,a)", "ঘ": "(a,0)"}, "answer": "ঘ", "answer_text": "(a,0)", "explanation": "ax+by=a²...(i); bx−ay=ab...(ii)। (i) নং কে a ও (ii) নং কে b দ্বারা গুণ করে, (i)নং ও (ii)নং যোগ করে পাই, a²x+aby=a³; b²x−aby=ab² যোগ করে a²x+b²x=a³+ab² ⇒ (a²+b²)x=a(a²+b²) ∴ x=a। x=a (ii) নং এ বসিয়ে, ba−ay=ab ⇒ ay=ab−ab=0 ∴ y=0। ∴ নির্ণেয় সমাধান (x,y)=(a,0)।", "id": "q0252"}, {"chapter": "অধ্যায় ১২: সরল সহ সমীকরণ", "topic": "সরল সহ সমীকরণ", "q": "০২", "question": "3x−y=3, 5x+y=21 হলে, (x,y) এর মান-", "source": "৪৬তম বিসিএস", "options": {"ক": "(2,5)", "খ": "(2,6)", "গ": "(3,5)", "ঘ": "(3,6)"}, "answer": "ঘ", "answer_text": "(3,6)", "explanation": "দেওয়া আছে, 3x−y=3...(i); 5x+y=21...(ii)। (i) নং ও(ii) নং সমীকরণ যোগ করে পাই, 3x−y+5x+y=3+21 ⇒ 8x=24 ∴ x=3। x এর মান (i) নং সমীকরণে বসিয়ে, 3×3−y=3 ⇒ −y=3−9 ⇒ −y=−6 ∴ y=6। ∴ নির্ণেয় সমাধান, (x,y)=(3,6)।", "id": "q0253"}, {"chapter": "অধ্যায় ১২: সরল সহ সমীকরণ", "topic": "সরল সহ সমীকরণ", "q": "০৩", "question": "x²+y²=185, x−y=3 এর একটি সমাধান হল:", "source": "৩৬তম বিসিএস", "options": {"ক": "(7,4)", "খ": "(9,6)", "গ": "(10,7)", "ঘ": "(11,8)"}, "answer": "ঘ", "answer_text": "(11,8)", "explanation": "x²+y²=185...(i); x−y=3...(ii)। (i) নং হতে পাই, x²+y²=185 ⇒ (x−y)²+2xy=185 ⇒ (3)²+2xy=185 ⇒ 2xy=176 ∴ xy=88। আবার, (x+y)²=(x−y)²+4xy=9+352 ⇒ (x+y)²=361 ∴ x+y=19...(iii)। (i)+(ii) [মূলত (ii)+(iii)] করে পাই, 2x=22 ∴ x=11। (iii) এ x=11 বসাই, 11+y=19 ∴ y=8। ∴ (x,y)=(11,8)।", "id": "q0254"}, {"chapter": "অধ্যায় ১২: সরল সহ সমীকরণ", "topic": "সরল সহ সমীকরণ", "q": "০৪", "question": "(x−y,3)=(0,x+2y) হলে (x,y) কত?", "source": "৩৩তম বিসিএস", "options": {"ক": "(1,1)", "খ": "(1,3)", "গ": "(−1,−1)", "ঘ": "(−3,1)"}, "answer": "ক", "answer_text": "(1,1)", "explanation": "(x−y,3)=(0,x+2y) ⇒ x−y=0 ∴ x=y এবং 3=x+2y ⇒ 3=x+2x ⇒ 3x=3 ∴ x=1 ∴ y=1। ∴ নির্ণেয় (x,y)=(1,1)।", "id": "q0255"}, {"chapter": "অধ্যায় ১২: সরল সহ সমীকরণ", "topic": "সরল সহ সমীকরণ", "q": "০৫", "question": "3x−7y+10=0 এবং y−2x−3=0 এর সমাধান-", "source": "৩১তম বিসিএস", "options": {"ক": "x=1, y=−1", "খ": "x=1, y=1", "গ": "x=−1, y=−1", "ঘ": "x=−1, y=1"}, "answer": "ঘ", "answer_text": "x=−1, y=1", "explanation": "3x−7y+10=0...(i); y−2x−3=0...(ii)। (i)+(ii)×7 করে পাই, 3x−7y+10=0 এবং 7y−14x−21=0; যোগ করে, −11x−11=0 ⇒ 11x=−11 ∴ x=−1। x এর মান (i) নং সমীকরণে বসাই, 3(−1)−7y+10=0 ⇒ −3−7y+10=0 ⇒ −7y=−7 ⇒ y=−7/−7=1। ∴ নির্ণেয় সমাধান (x,y)=(−1,1)।", "id": "q0256"}, {"chapter": "অধ্যায় ১২: সরল সহ সমীকরণ", "topic": "সরল সহ সমীকরণ", "q": "০৬", "question": "যদি x+5y=16 এবং x=3y হয়, তাহলে y=কত?", "source": "১৮তম বিসিএস", "options": {"ক": "−24", "খ": "−2", "গ": "8", "ঘ": "2"}, "answer": "ঘ", "answer_text": "2", "explanation": "x+5y=16 ⇒ 3y+5y=16 [∵x=3y] ⇒ 8y=16 ∴ y=2।", "id": "q0257"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.১ সূচকীয় সরল", "q": "০১", "question": "যদি ⁴√x³=2 হয়, তাহলে x^(3/2)=?", "source": "৪৪তম বিসিএস", "options": {"ক": "8", "খ": "16", "গ": "4", "ঘ": "64"}, "answer": "গ", "answer_text": "4", "explanation": "দেওয়া আছে, ⁴√x³=2 ⇒ x^(3/4)=2 ⇒ (x^(3/4))²=2² ∴ x^(3/2)=4।", "id": "q0258"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.১ সূচকীয় সরল", "q": "০২", "question": "5^x+8.5^x+16.5^x=1 হলে, x এর মান কত?", "source": "৪১তম বিসিএস", "options": {"ক": "−3", "খ": "−2", "গ": "−1", "ঘ": "−1/2"}, "answer": "খ", "answer_text": "−2", "explanation": "5^x+8.5^x+16.5^x=1 ⇒ 5^x(1+8+16)=1 ⇒ 25.5^x=1 ⇒ 5^x.5²=1 ⇒ 5^(x+2)=(5)⁰ ⇒ x+2=0 ∴ x=−2।", "id": "q0259"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.১ সূচকীয় সরল", "q": "০৩", "question": "(5^(n+2)+35×5^(n−1))/(4×5^n) এর মান কত?", "source": "৩৪তম বিসিএস", "options": {"ক": "4", "খ": "8", "গ": "5", "ঘ": "7"}, "answer": "খ", "answer_text": "8", "explanation": "(5^(n+2)+35×5^(n−1))/(4×5^n) = (5^n.5²+35×5^n×1/5)/(4×5^n) = [5^n(25+7)]/(4×5^n) = 32/4 = 8।", "id": "q0260"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.১ সূচকীয় সরল", "q": "০৪", "question": "(³√3×³√4)⁶ = কত?", "source": "৩৩তম বিসিএস", "options": {"ক": "12", "খ": "48", "গ": "36", "ঘ": "144"}, "answer": "ঘ", "answer_text": "144", "explanation": "(³√3×³√4)⁶ = (3^(1/3)×4^(1/3))⁶ [রুটের মধ্যে যে সংখ্যাটি থাকে রুট তুলে দিলে সেটির রিভার্স পাওয়ার হয়] = (12^(1/3))⁶ [পাওয়ার একই থাকলে বেস (Base) গুণ হয়ে যায়] = 12² = 144 [পাওয়ারে পাওয়ারে গুণ হয়]।", "id": "q0261"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.১ সূচকীয় সরল", "q": "০৫", "question": "³√(³√a³) = কত?", "source": "৩৩তম বিসিএস", "options": {"ক": "a", "খ": "1", "গ": "a^(1/3)", "ঘ": "a³"}, "answer": "গ", "answer_text": "a^(1/3)", "explanation": "³√(³√a³) = ³√{(a³)^(1/3)} = ³√a = a^(1/3)।", "id": "q0262"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.১ সূচকীয় সরল", "q": "০৬", "question": "যদি (64)^(2/3)+(625)^(1/2)=3K হয় তবে K এর মান-", "source": "৩১তম বিসিএস", "options": {"ক": "9⅔", "খ": "11⅓", "গ": "12⅖", "ঘ": "13⅔"}, "answer": "ঘ", "answer_text": "13⅔", "explanation": "(64)^(2/3)+(625)^(1/2)=3K ⇒ (4³)^(2/3)+{(25)²}^(1/2)=3K ⇒ 4²+25=3K ⇒ 16+25=3K ⇒ k=41/3=13⅔।", "id": "q0263"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.১ সূচকীয় সরল", "q": "০৭", "question": "(√3.√5)⁴-এর মান কত?", "source": "২৬তম বিসিএস", "options": {"ক": "30", "খ": "225", "গ": "60", "ঘ": "15"}, "answer": "খ", "answer_text": "225", "explanation": "(√3.√5)⁴ = (√3)⁴.(√5)⁴ = (3^(1/2))⁴.(5^(1/2))⁴ = 3².5² = 9×25 = 225।", "id": "q0264"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.১ সূচকীয় সরল", "q": "০৮", "question": "(১২০/২৯)^(−২/৩) - এর সহজ প্রকাশ-", "source": "১৭তম বিসিএস", "options": {"ক": "১/২৫", "খ": "৫/২৫", "গ": "৯/২৫", "ঘ": "৩/২৫"}, "answer": "গ", "answer_text": "৯/২৫", "explanation": "(১২০/২৯)^(−২/৩) = (২৯/১২০)^(২/৩) = {(৫/৬)³}^(২/৩) = (৫/৬)^(৩×২/৩) = (৫/৬)² = ৯/২৫ (মূল বইয়ের সরলীকরণ অনুযায়ী)।", "id": "q0265"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.১ সূচকীয় সরল", "q": "০৯", "question": "[২−৩(২−৩)⁻¹]⁻¹ এর মান কত?", "source": "১৩তম বিসিএস", "options": {"ক": "৫", "খ": "−৫", "গ": "২/৫", "ঘ": "−২/৫"}, "answer": "গ", "answer_text": "২/৫", "explanation": "[২−৩(২−৩)⁻¹]⁻¹ = [২−৩(−১)⁻¹]⁻¹ = [২−৩×১/(−১)]⁻¹ = [২+৩]⁻¹ = ৫⁻¹ = ২/৫ (মূল বইয়ের ধাপ অনুসারে)।", "id": "q0266"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "০১", "question": "½×2^(x−3)+1=5 হলে x এর মান কত", "source": "৪৬তম বিসিএস", "options": {"ক": "3", "খ": "4", "গ": "5", "ঘ": "6"}, "answer": "ঘ", "answer_text": "6", "explanation": "দেওয়া আছে, ½×2^(x−3)+1=5 ⇒ 2⁻¹×2^(x−3)=5−1 ⇒ 2^(x−3−1)=4 ⇒ 2^(x−4)=2² ⇒ x−4=2 ∴ x=4+2=6।", "id": "q0267"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "০২", "question": "2^(x+7)=4^(x+2) হলে x এর মান কত?", "source": "৪৫তম বিসিএস", "options": {"ক": "2", "খ": "3", "গ": "4", "ঘ": "6"}, "answer": "খ", "answer_text": "3", "explanation": "দেওয়া আছে, 2^(x+7)=4^(x+2) ⇒ 2^(x+7)=(2²)^(x+2) ⇒ 2^(x+7)=2^(2x+4) ⇒ x+7=2x+4 ⇒ 2x+4=x+7 ⇒ 2x−x=7−4 ∴ x=3।", "id": "q0268"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "০৩", "question": "4^x+4^(1−x)=4 হলে, x = কত?", "source": "৪৩তম বিসিএস", "options": {"ক": "1/4", "খ": "1/3", "গ": "1/2", "ঘ": "1"}, "answer": "গ", "answer_text": "1/2", "explanation": "4^x+4^(1−x)=4 ⇒ 4^x+4/4^x=4 ⇒ p+4/p=4 [4^x=p ধরে] ⇒ (p²+4)/p=4 ⇒ p²−4p+4=0 ⇒ (p−2)²=0 ⇒ p=2 ⇒ 4^x=2 ⇒ 2^(2x)=2¹ ⇒ 2x=1 ∴ x=1/2।", "id": "q0269"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "০৪", "question": "x+2^(1/3)+2^(2/3)=0 হলে, x³+6 এর মান কত?", "source": "৪১তম বিসিএস", "options": {"ক": "4x", "খ": "6x", "গ": "4", "ঘ": "8"}, "answer": "খ", "answer_text": "6x", "explanation": "x+2^(1/3)+2^(2/3)=0 ⇒ x=−(2^(1/3)+2^(2/3)) ⇒ x³=−(2^(1/3)+2^(2/3))³ [ঘন করে] = −{(2^(1/3))³+(2^(2/3))³+3.2^(1/3).2^(2/3)(2^(1/3)+2^(2/3))} = −{2+4+6(−x)} = −{6−6x} ⇒ x³=−6+6x ⇒ x³+6=6x।", "id": "q0270"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "০৫", "question": "x^(x√x)=(x√x)^x হলে, x এর মান কত?", "source": "৪০তম বিসিএস", "options": {"ক": "3/2", "খ": "4/5", "গ": "9/4", "ঘ": "2/3"}, "answer": "গ", "answer_text": "9/4", "explanation": "দেওয়া আছে, x^(x√x)=(x√x)^x ⇒ (x^x)^√x=(x.x^(1/2))^x = (x^(1+1/2))^x = (x^(3/2))^x = (x^x)^(3/2) ⇒ √x=3/2 ∴ x=9/4।", "id": "q0271"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "০৬", "question": "125(√5)^(2x)=1 হলে x এর মান কত?", "source": "৩৯তম বিসিএস", "options": {"ক": "3", "খ": "−3", "গ": "7", "ঘ": "9"}, "answer": "খ", "answer_text": "−3", "explanation": "125(√5)^(2x)=1 ⇒ 5³(√5)^(2x)=1 ⇒ 5³.5^(½.2x)=1 ⇒ 5^(3+x)=5⁰ ⇒ 3+x=0 ∴ x=−3।", "id": "q0272"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "০৭", "question": "2^x+2^(1−x)=3 হলে, x=কত?", "source": "৩৮তম বিসিএস", "options": {"ক": "(1,2)", "খ": "(0,2)", "গ": "(1,3)", "ঘ": "(0,1)"}, "answer": "ঘ", "answer_text": "(0,1)", "explanation": "2^x+2^(1−x)=3 ⇒ 2^x+2¹/2^x=3 ⇒ a+2/a=3 [2^x=a ধরে] ⇒ a²+2=3a ⇒ a²−3a+2=0 ⇒ a²−2a−a+2=0 ⇒ a(a−2)−1(a−2)=0 ⇒ (a−2)(a−1)=0। এখন, a−2=0 অথবা, a−1=0 ∴ a=2 ∴ a=1। a=2 হলে 2^x=2 ⇒ 2^x=2¹ ∴ x=1। a=1 হলে 2^x=1 ⇒ 2^x=2⁰ ∴ x=0। ∴ x=(0,1)।", "id": "q0273"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "০৮", "question": "যদি (25)^(2x+3)=5^(3x+6) হয় তবে x = কত?", "source": "৩৬তম বিসিএস", "options": {"ক": "0", "খ": "1", "গ": "−1", "ঘ": "4"}, "answer": "ক", "answer_text": "0", "explanation": "(25)^(2x+3)=5^(3x+6) ⇒ (5²)^(2x+3)=5^(3x+6) ⇒ 5^(4x+6)=5^(3x+6) ⇒ 4x+6=3x+6 ⇒ 4x−3x=6−6 ∴ x=0।", "id": "q0274"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "০৯", "question": "x⁻³−0.001=0 হলে, x²-এর মান-", "source": "৩৫তম বিসিএস", "options": {"ক": "100", "খ": "1/10", "গ": "10", "ঘ": "1/100"}, "answer": "ক", "answer_text": "100", "explanation": "দেয়া আছে, x⁻³−0.001=0 ⇒ 1/x³=0.001 ⇒ 1/x³=1/1000 ⇒ x³=1000=10³ ⇒ x=10 ∴ x²=100।", "id": "q0275"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "১০", "question": "যদি (a/b)^(x−3)=(b/a)^(x−5) হয় তবে x এর মান কত?", "source": "৩৩তম বিসিএস", "options": {"ক": "8", "খ": "3", "গ": "5", "ঘ": "4"}, "answer": "ঘ", "answer_text": "4", "explanation": "(a/b)^(x−3)=(b/a)^(x−5) ⇒ (a/b)^(x−3)=(a/b)^(5−x) ⇒ x−3=5−x ⇒ 2x=8 ∴ x=4।", "id": "q0276"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "১১", "question": "36.2^(3x−8)=3² হলে x এর মান কত?", "source": "৩৩তম বিসিএস", "options": {"ক": "7/3", "খ": "3", "গ": "8/3", "ঘ": "2"}, "answer": "ঘ", "answer_text": "2", "explanation": "36.2^(3x−8)=3² সমীকরণ সমাধান করে x=2 পাওয়া যায় (মূল বইয়ের হিসাব অনুযায়ী)।", "id": "q0277"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.২ সূচকীয় সমীকরণ", "q": "১২", "question": "4^x+4^x+4^x+4^x এর মান নিচের কোনটি?", "source": "৩৩তম বিসিএস", "options": {"ক": "16^x", "খ": "4^(4x)", "গ": "2^(2x+2)", "ঘ": "2^(8x)"}, "answer": "গ", "answer_text": "2^(2x+2)", "explanation": "4^x+4^x+4^x+4^x = 4^x(1+1+1+1) = 4^x.4¹ = 4^(x+1) = 2^(2x+2)।", "id": "q0278"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.৩ লগের ভিত্তি ও ঘাত নির্ণয়", "q": "০১", "question": "যদি log_x 324=4 হয়, তবে x এর মান হবে:", "source": "৫০তম বিসিএস", "options": {"ক": "4", "খ": "2√3", "গ": "3√3", "ঘ": "3√2"}, "answer": "ঘ", "answer_text": "3√2", "explanation": "দেওয়া আছে, log_x 324=4 ⇒ x⁴=324 [log_x a=b হলে, x^b=a] ⇒ x⁴=81×4 ⇒ x⁴=(3√2)⁴ ∴ x=3√2।", "id": "q0279"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.৩ লগের ভিত্তি ও ঘাত নির্ণয়", "q": "০২", "question": "log_x 4=−2 হলে x=কত?", "source": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "1/2", "খ": "−1/2", "গ": "2", "ঘ": "−2"}, "answer": "ক", "answer_text": "1/2", "explanation": "log_x 4=−2 ⇒ x⁻²=4 [log_a b=c হলে, a^c=b] ⇒ x²=4⁻¹=1/4 [উভয় পক্ষের ঘাতকে −1 দ্বারা গুণ করে] ∴ x=1/2।", "id": "q0280"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.৩ লগের ভিত্তি ও ঘাত নির্ণয়", "q": "০৩", "question": "যদি log₁₀ x=−3 হয়, তবে x এর মান কত?", "source": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "0.1", "খ": "0.001", "গ": "0.01", "ঘ": "0.0001"}, "answer": "খ", "answer_text": "0.001", "explanation": "দেওয়া আছে, log₁₀ x=−3 ⇒ x=10⁻³ [log_a x=p হলে, x=a^p] ⇒ x=1/10³=1/1000 ∴ x=0.001।", "id": "q0281"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.৩ লগের ভিত্তি ও ঘাত নির্ণয়", "q": "০৪", "question": "যদি log_x 324=4 হয়, তবে x এর মান কত?", "source": "৪৭তম বিসিএস", "options": {"ক": "3√2", "খ": "4√2", "গ": "5√2", "ঘ": "√2"}, "answer": "ক", "answer_text": "3√2", "explanation": "এখানে, log_x 324=4 ⇒ x⁴=324 [log_a b=p হলে, a^p=b] ⇒ x⁴=(3√2)⁴ ∴ x=3√2।", "id": "q0282"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.৩ লগের ভিত্তি ও ঘাত নির্ণয়", "q": "০৫", "question": "log√8 x=3⅓ হলে x এর মান কত?", "source": "৪৬তম বিসিএস", "options": {"ক": "32", "খ": "8", "গ": "3", "ঘ": "√8"}, "answer": "ক", "answer_text": "32", "explanation": "দেওয়া আছে, log√8 x=3⅓=10/3 ⇒ x=(√8)^(10/3) [log_a x=P হলে, a^P=x] ⇒ x=(8^(1/2))^(10/3) ⇒ x=8^(1/2×10/3) ⇒ x=8^(5/3) ⇒ x=(2³)^(5/3) ⇒ x=2^(3×5/3) ⇒ x=2⁵ ∴ x=32।", "id": "q0283"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.৩ লগের ভিত্তি ও ঘাত নির্ণয়", "q": "০৬", "question": "যদি log₁₀ x=−1 হয়, তাহলে নিচের কোনটি x এর মান?", "source": "৪৪তম বিসিএস", "options": {"ক": "0.1", "খ": "0.01", "গ": "1/10000", "ঘ": "0.001"}, "answer": "ক", "answer_text": "0.1", "explanation": "প্রদত্ত রাশি, log₁₀ x=−1 ⇒ 10⁻¹=x [log_a x=b হলে, a^b=x] ⇒ x=1/10=0.1।", "id": "q0284"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.৩ লগের ভিত্তি ও ঘাত নির্ণয়", "q": "০৭", "question": "log_x(1/9)=−2 হলে, x এর মান কোনটি?", "source": "৪২তম বিসিএস", "options": {"ক": "3", "খ": "2", "গ": "1/3", "ঘ": "−1/3"}, "answer": "ক", "answer_text": "3", "explanation": "log_x(1/9)=−2 ⇒ x⁻²=1/9 ⇒ 1/x²=1/9 ⇒ x²=9 ∴ x=3।", "id": "q0285"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.৩ লগের ভিত্তি ও ঘাত নির্ণয়", "q": "০৮", "question": "log_x(1/8)=−2 হলে, x=কত?", "source": "৩৮তম বিসিএস", "options": {"ক": "2", "খ": "√2", "গ": "2√2", "ঘ": "4"}, "answer": "গ", "answer_text": "2√2", "explanation": "log_x(1/8)=−2 ⇒ x⁻²=1/8 [x=log_a N হলে a^x=N] ⇒ 1/x²=1/8 ⇒ x²=8 ⇒ x²=(2√2)² ∴ x=2√2 [∵পাওয়ার বা ঘাত সমান]।", "id": "q0286"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.৩ লগের ভিত্তি ও ঘাত নির্ণয়", "q": "০৯", "question": "log_x(3/2)=−1/2 হলে, x-এর মান-", "source": "৩৭তম বিসিএস", "options": {"ক": "4/9", "খ": "9/4", "গ": "√(3/2)", "ঘ": "√(2/3)"}, "answer": "ক", "answer_text": "4/9", "explanation": "log_x(3/2)=−1/2 ⇒ (x)^(−1/2)=3/2 ⇒ 1/x^(1/2)=3/2 ⇒ 1/√x=3/2 ⇒ 3√x=2 ⇒ 9x=4 ∴ x=4/9।", "id": "q0287"}, {"chapter": "অধ্যায় ১৩: সূচক ও লগারিদম", "topic": "১৩.৪ লগের সরলীকরণ", "q": "০১", "question": "2log₁₀ 5+log₁₀ 36−log₁₀ 9=?", "source": "৪৪তম বিসিএস", "options": {"ক": "2", "খ": "100", "গ": "37", "ঘ": "4.6"}, "answer": "ক", "answer_text": "2", "explanation": "2log₁₀5+log₁₀36−log₁₀9 = log₁₀5²+log₁₀36−log₁₀9 [∵nlog_aM=log_aM^n] = log₁₀25+log₁₀36−log₁₀9 = log₁₀(25×36/9) [∵log_aM apter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.২ সমান্তর ধারার n-তম পদ", "q": "০৩", "question": "একটি সমান্তর অনুক্রমে সাধারণ অন্তর 10 এবং 6-তম পদটি 52 হলে 15-তম পদটি-", "source": "৩৭তম বিসিএস", "options": {"ক": "140", "খ": "142", "গ": "148", "ঘ": "150"}, "answer": "খ", "answer_text": "142", "explanation": "প্রথম পদ a ও সাধারণ অন্তর d হলে n-তম পদ=a+(n−1)d। ∴ 6-তম পদ=a+(6−1)d ⇒ 52=a+5×10 ⇒ a=52−50 ∴ a=2। ∴ 15-তম পদ=2+(15−1)×10=2+140=142।", "id": "q0314"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.২ সমান্তর ধারার n-তম পদ", "q": "০৪", "question": "কোনো সমান্তর প্রগমনে প্রথম দুটি সংখ্যা যদি ৫ ও ১৭ হয়, তবে তৃতীয় সংখ্যাটি কত?", "source": "২৩তম বিসিএস", "options": {"ক": "২২", "খ": "২৫", "গ": "২৯", "ঘ": "৮৫"}, "answer": "গ", "answer_text": "২৯", "explanation": "সমান্তর প্রগমনে প্রথম দুটি পদ ৫ ও ১৭ হলে সাধারণ অন্তর=(১৭−৫)=১২। ∴ তৃতীয় পদ=দ্বিতীয় পদ+সাধারণ অন্তর=১৭+১২=২৯।", "id": "q0315"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৩ সমান্তর ধারার সমষ্টি", "q": "০১", "question": "একটি সমান্তর ধারার ৪র্থ (চতুর্থ) এবং ১২ তম পদের যোগফল ২০। ঐ ধারার প্রথম ১৫ পদের যোগফল কত?", "source": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "100", "খ": "150", "গ": "200", "ঘ": "300"}, "answer": "খ", "answer_text": "150", "explanation": "সমান্তর ধারার n তমপদ=a+(n−1)d যেখানে, a=প্রথম পদ, d=পাশাপাশি দুই পদের পার্থক্য। ৪র্থ পদ=a+(4−1)d=a+3d। ১২তম পদ=a+(12−1)d=a+11d। দেওয়া আছে, a+3d+a+11d=20 ⇒ 2a+14d=20। এখানে, n সংখ্যক পদের সমষ্টি=n/2{2a+(n−1)d}। ∴ 15টি পদের সমষ্টি=15/2{2a+(15−1)d}=15/2{2a+14d}=15/2×20=150।", "id": "q0316"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৩ সমান্তর ধারার সমষ্টি", "q": "০২", "question": "১ হতে ১০০ পর্যন্ত সংখ্যা সমূহের যোগফল কত?", "source": "৩৮ ও ১৮তম বিসিএস", "options": {"ক": "৪৯৯৯", "খ": "৫৫০১", "গ": "৫০৫০", "ঘ": "৫০০১"}, "answer": "গ", "answer_text": "৫০৫০", "explanation": "আমরা জানি, ১+২+৩+...+n = n(n+1)/2। ∴ ১+২+৩+.......+১০০ = ১০০×(১০০+১)/২ = ৫০×১০১ = ৫০৫০।", "id": "q0317"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৩ সমান্তর ধারার সমষ্টি", "q": "০৩", "question": "1+3+5+............+(2x−1) কত?", "source": "৩৬তম বিসিএস", "options": {"ক": "x(x−1)", "খ": "x(x+1)/2", "গ": "x(x−1)", "ঘ": "x²"}, "answer": "ঘ", "answer_text": "x²", "explanation": "১ম পদ=1, সাধারণ অন্তর=3−1=2, শেষ পদ=2x−1। ∴ পদ সংখ্যা=(শেষ পদ−১ম পদ)/সাধারণ অন্তর+1 = (2x−1−1)/2+1 = 2(x−1)/2+1 = x−1+1 = x। সমষ্টি=(শেষ পদ+১ম পদ)/2×পদ সংখ্যা = (2x−1+1)/2×x = 2x/2×x = x²।", "id": "q0318"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৩ সমান্তর ধারার সমষ্টি", "q": "০৪", "question": "১+৫+৯+................+৮১ = ?", "source": "৩৬তম বিসিএস", "options": {"ক": "৯৬১", "খ": "৮৬১", "গ": "৭৬১", "ঘ": "৬৬১"}, "answer": "খ", "answer_text": "৮৬১", "explanation": "n তম পদ=a+(n−1)d ⇒ ৮১=১+(n−১)৪ [১ম পদ,a=১; সাধারণ অন্তর,d=৫−১=৪] ⇒ ৮১=১+৪n−৪ ⇒ ৪n=৮১+৩ ⇒ ৪n=৮৪ ∴ n=২১। Sₙ=n/2{2a+(n−1)d} = ২১/২×{২×১+২০×৪} = ২১/২×৮২ = ২১×৪১ = ৮৬১।", "id": "q0319"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৩ সমান্তর ধারার সমষ্টি", "q": "০৫", "question": "1²+2²+3²+.......+x² এর মান কত?", "source": "৩১তম বিসিএস", "options": {"ক": "x(x+1)(2x+1)/6", "খ": "x(x+1)/2", "গ": "x", "ঘ": "{x(x+1)/2}²"}, "answer": "ক", "answer_text": "x(x+1)(2x+1)/6", "explanation": "[n সংখ্যক স্বাভাবিক সংখ্যার বর্গের সমষ্টি, 1²+2²+3²+.......+n²=n(n+1)(2n+1)/6]। সুতরাং, 1²+2²+3²+.......+x²=x(x+1)(2x+1)/6।", "id": "q0320"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৩ সমান্তর ধারার সমষ্টি", "q": "০৬", "question": "1²+2²+3²+..................+50² = কত?", "source": "২৭তম বিসিএস", "options": {"ক": "৩৫৭২৫", "খ": "৪২৯২৫", "গ": "৪৫৫০০", "ঘ": "৪৭২২৫"}, "answer": "খ", "answer_text": "৪২৯২৫", "explanation": "n সংখ্যক স্বাভাবিক সংখ্যার বর্গের সমষ্টি = n(n+1)(2n+1)/6 = (50×51×101)/6 = 42925।", "id": "q0321"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৩ সমান্তর ধারার সমষ্টি", "q": "০৭", "question": "1+2+3+4+...…+99 = কত?", "source": "২৫ ও ১৫ তম বিসিএস", "options": {"ক": "4650", "খ": "4750", "গ": "4850", "ঘ": "4950"}, "answer": "ঘ", "answer_text": "4950", "explanation": "প্রথম পদ=1, শেষ পদ=99, পদ সংখ্যা=99। ∴ সমষ্টি=(প্রথম পদ+শেষ পদ)×পদ সংখ্যা/2 = (1+99)×99/2 = 4950।", "id": "q0322"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৩ সমান্তর ধারার সমষ্টি", "q": "০৮", "question": "log2+log4+log8+……. ধারাটির প্রথম দশটি পদের সমষ্টি কত?", "source": "২৫তম বিসিএস", "options": {"ক": "45 log2", "খ": "55 log2", "গ": "65 log2", "ঘ": "75 log2"}, "answer": "খ", "answer_text": "55 log2", "explanation": "log2+log4+log8+........ দশম পদ পর্যন্ত = log2¹+log2²+log2³+.......+log2¹⁰ = log2+2log2+3log2+.......+10log2 = (1+2+3+⋯....+10)×log2 = [10×(10+1)/2]×log2 [n সংখ্যক স্বাভাবিক সংখ্যার যোগফল=n(n+1)/2] = 55log2।", "id": "q0323"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৩ সমান্তর ধারার সমষ্টি", "q": "০৯", "question": "1²+3²+5²+……+31² সমান কত?", "source": "২৪তম বিসিএস", "options": {"ক": "258", "খ": "256", "গ": "254", "ঘ": "252"}, "answer": null, "answer_text": "Blank (উত্তর উল্লেখ নেই)", "explanation": "1²+3²+5²+⋯+31² = (1²+2²+3²+⋯+31²)−(2²+4²+⋯+30²) = (1²+2²+3²+⋯+31²)−2²(1²+2²+⋯+15²)। n সংখ্যক স্বাভাবিক সংখ্যার বর্গের সমষ্টি=n(n+1)(2n+1)/6। = (31×32×63)/6 − 4×(15×16×31)/6 = 10416 − 4960 = 5456। ∴ 1²+3²+5²+⋯+31² = 5456।", "id": "q0324"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৪ গুণোত্তর ধারার পদসংখ্যা ও সাধারণ অনুপাত", "q": "০১", "question": "3+3/2+3/4+...3/64 ধারাটিতে মোট কতটি পদ আছে?", "source": "৫০তম বিসিএস", "options": {"ক": "5", "খ": "6", "গ": "7", "ঘ": "8"}, "answer": "গ", "answer_text": "7", "explanation": "প্রথম পদ, a=3। সাধারণ অনুপাত, r=(3/2)/3=1/2। আমরা জানি, n তম পদ=ar^(n−1) ⇒ 3×(1/2)^(n−1)=3/64 ⇒ (1/2)^(n−1)=1/64 ⇒ (1/2)^(n−1)=(1/2)⁶ ⇒ n−1=6 ∴ n=7। ∴ পদসংখ্যা, n=7টি।", "id": "q0325"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৪ গুণোত্তর ধারার পদসংখ্যা ও সাধারণ অনুপাত", "q": "০২", "question": "একটি গুণোত্তর ধারার পঞ্চম পদটি ৩২ ও অষ্টম পদটি ২৫৬ হলে উক্ত ধারার সাধারণ অনুপাত কত?", "source": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "৮", "খ": "১৬", "গ": "২", "ঘ": "২/৩"}, "answer": "গ", "answer_text": "২", "explanation": "গুণোত্তর ধারার n তম পদ aq^(n−1), যেখানে a=প্রথম পদ, q=সাধারণ অনুপাত। ∴ পঞ্চম পদ=aq⁴=32। এবং, অষ্টম পদ=aq⁷=256। ∴ aq⁷/aq⁴=256/32 ⇒ q³=8 ∴ q=∛8=∛(2×2×2)=2।", "id": "q0326"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৪ গুণোত্তর ধারার পদসংখ্যা ও সাধারণ অনুপাত", "q": "০৩", "question": "একটি গুণোত্তর ধারার প্রথম ও দ্বিতীয় পদ যথাক্রমে 27 এবং 9, তাহলে ধারাটির দশম পদ কত?", "source": "৪৭তম বিসিএস", "options": {"ক": "1/3", "খ": "1/525", "গ": "1/729", "ঘ": "1/615"}, "answer": "গ", "answer_text": "1/729", "explanation": "এখানে, গুণোত্তর ধারার ১ম পদ, a=27। সাধারণ অনুপাত, r=দ্বিতীয় পদ/প্রথম পদ=9/27=1/3। দশম পদ=ar⁹=27×(1/3)⁹=1/729।", "id": "q0327"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৪ গুণোত্তর ধারার পদসংখ্যা ও সাধারণ অনুপাত", "q": "০৪", "question": "1/√3, −1, √3, ..... ধারাটির পঞ্চম পদ কত?", "source": "৪৫তম বিসিএস", "options": {"ক": "−√3", "খ": "9", "গ": "−9√3", "ঘ": "3√3"}, "answer": "ঘ", "answer_text": "3√3", "explanation": "এখানে, প্রথম পদ, a=1/√3। সাধারণ অনুপাত, r=(−1)/(1/√3)=−√3। ∴ ধারাটির পঞ্চম পদ=ar^(5−1)=ar⁴=(1/√3).(−√3)⁴=(1/√3).3.3=3√3.√3/√3=3√3।", "id": "q0328"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৪ গুণোত্তর ধারার পদসংখ্যা ও সাধারণ অনুপাত", "q": "০৫", "question": "1/√2, 1, √2.... ধারাটির কোন পদ 8√2 হবে?", "source": "৩৯তম বিসিএস", "options": {"ক": "৯তম পদ", "খ": "১০তম পদ", "গ": "১১তম পদ", "ঘ": "১২তম পদ"}, "answer": "ক", "answer_text": "৯তম পদ", "explanation": "প্রথম পদ a=1/√2। সাধারণ অনুপাত r=1/(1/√2)=√2। ধরি, n তম পদ হবে 8√2। ∴ ar^(n−1)=8√2 ⇒ (1/√2)(√2)^(n−1)=8√2 ⇒ (√2)^(n−1)=16 ⇒ (√2)^(n−1)=(√2)⁸ ⇒ n−1=8 ∴ n=9।", "id": "q0329"}, {"chapter": "অধ্যায় ১৪: অনুক্রম ও ধারা", "topic": "১৪.৫ গুণোত্তর ধারার সমষ্টি", "q": "০১", "question": "1−1+1−1+1−1+…...n সংখ্যক পদের যোগফল হবে-", "source": "৪৪তম বিসিএস", "options": {"ক": "0", "খ": "1", "গ": "[1+(−1)ⁿ]", "ঘ": "½[1−(−1)ⁿ]"}, "answer": "ঘ", "answer_text": "½[1−(−1)ⁿ]", "explanation": "এখানে ধারাটির ১ম পদ, a=1 এবং সাধারণ অনুপাত, ": "30", "খ": "60", "গ": "90", "ঘ": "45"}, "answer": "খ", "answer_text": "60", "explanation": "ধরি, দ্বিতীয় কোণটি=2a। তাহলে প্রথম কোণটি=a। এবং তৃতীয় কোণটি=3(2a−a)=3a। আমরা জানি, ত্রিভুজের ৩ কোণের সমষ্টি 180°। ∴ a+2a+3a=180° ⇒ 6a=180° ⇒ 2a=180/3=60°। ∴ দ্বিতীয় কোণটি 60°।", "id": "q0346"}, {"chapter": "অধ্যায় ১৫: রেখা, কোণ, ত্রিভুজ ও চতুর্ভুজ", "topic": "১৫.৩ কোণ সম্পর্কিত সমস্যা", "q": "০৩", "question": "PQR ত্রিভুজের ∠Q=90° এবং ∠P=2∠R হলে নিচের কোনটি সঠিক?", "source": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "PR=2QR", "খ": "PQ=2PR", "গ": "PR=2PQ", "ঘ": "QR=2PQ"}, "answer": "গ", "answer_text": "PR=2PQ", "explanation": "[চিত্র: PQR ত্রিভুজ, ∠Q=90°, ∠P=60°, ∠R=30°।] PQR ত্রিভুজের ∠Q=90°, ∠P=2∠R। ∠P+∠Q+∠R=180 ⇒ 2∠R+90+∠R=180 ⇒ 3∠R=90 ∴ ∠R=30°। এবং ∠P=2×30°=60°। cosP=PQ/PR ⇒ cos60°=PQ/PR ⇒ 1/2=PQ/PR ∴ PR=2PQ।", "id": "q0347"}, {"chapter": "অধ্যায় ১৫: রেখা, কোণ, ত্রিভুজ ও চতুর্ভুজ", "topic": "১৫.৩ কোণ সম্পর্কিত সমস্যা", "q": "০৪", "question": "ABC ত্রিভুজে B কোণের পরিমাণ 48° এবং AB=AC। যদি E এবং F, AB এবং AC-কে এমনভাবে ছেদ করে যেন EF||BC হয়, তাহলে ∠A+∠AFE=?", "source": "৪৪তম বিসিএস", "options": {"ক": "132°", "খ": "180°", "গ": "108°", "ঘ": "160°"}, "answer": "ক", "answer_text": "132°", "explanation": "[চিত্র: ABC ত্রিভুজ, ∠B=∠C=48°, EF||BC ভিতরে অঙ্কিত।] চিত্রে, ∠B=48° এবং AB=AC সুতরাং ∠B=∠C=48°। আবার, EF||BC এবং AC ছেদক ∴ ∠C=∠AFE [একান্তর কোণ] অতএব ∠AFE=48°। এখানে, ∠A+∠B+∠C=180° ⇒ ∠A+48°+48°=180° ⇒ ∠A=180°−96° ∴ ∠A=84°। সুতরাং ∠A+∠AFE=84°+48°=132°।", "id": "q0348"}, {"chapter": "অধ্যায় ১৫: রেখা, কোণ, ত্রিভুজ ও চতুর্ভুজ", "topic": "১৫.৩ কোণ সম্পর্কিত সমস্যা", "q": "০৫", "question": "একটি কোণের মান তার সম্পূরক কোণের মানের অর্ধেকের সমান। কোণটির মান কত?", "source": "৪৩তম বিসিএস", "options": {"ক": "30°", "খ": "60°", "গ": "90°", "ঘ": "120°"}, "answer": "খ", "answer_text": "60°", "explanation": "ধরি, একটি কোণ=x। তাহলে, ঐ কোণের সম্পূরক কোণ=180−x। প্রশ্নমতে, x=(180−x)/2 ⇒ 2x=180−x ⇒ 3x=180 ∴ x=60।", "id": "q0349"}, {"chapter": "অধ্যায় ১৫: রেখা, কোণ, ত্রিভুজ ও চতুর্ভুজ", "t ": "q0413"}, {"chapter": "অধ্যায় ১৮: পরিমিতি (সরলক্ষেত্র)", "topic": "১৮.৫ বৃত্ত", "q": "০৬", "question": "একটি বৃত্তের ব্যাসার্ধকে যদি r থেকে বৃদ্ধি করে r+n করা হয়, তবে তার ক্ষেত্রফল দ্বিগুণ হয়। r-এর মান কত?", "source": "১১তম বিসিএস", "options": {"ক": "n/(√2−1)", "খ": "n+√2", "গ": "√2n", "ঘ": "√(2(n+1))"}, "answer": "ক", "answer_text": "n/(√2−1)", "explanation": "[চিত্র: বৃত্ত, ব্যাসার্ধ r, বর্ধিত ব্যাসার্ধ r+n।] আমরা জানি, বৃত্তের ব্যাসার্ধ r হলে ক্ষেত্রফল πr² এবং ব্যাসার্ধ (r+n) হলে, ক্ষেত্রফল π(r+n)²। শর্তমতে, 2×πr²=π(r+n)² ⇒ 2r²=(r+n)² ⇒ √2r=r+n ⇒ √2r−r=n ⇒ r(√2−1)=n ∴ r=n/(√2−1)।", "id": "q0414"}, {"chapter": "অধ্যায় ১৮: পরিমিতি (সরলক্ষেত্র)", "topic": "১৮.৬ বিভিন্ন জ্যামিতিক ক্ষেত্রের মধ্যে সম্পর্ক", "q": "০১", "question": "একটি বৃত্তস্থ বর্গের প্রত্যেক বাহুর দৈর্ঘ্য ২ সে.মি. হলে, ঐ বৃত্তের ক্ষেত্রফল কত?", "source": "৪৭তম বিসিএস", "options": {"ক": "π", "খ": "2π", "গ": "√2π", "ঘ": "2√2π"}, "answer": "খ", "answer_text": "2π", "explanation": "[চিত্র: বৃত্তে অন্তর্লিখিত বর্গ, বাহু ২।] বৃত্তে অন্তর্লিখিত বর্গের কর্ণই বৃত্তটির ব্যাস। আমরা জানি, বর্গের কর্ণ=√2a=√2×2=2√2 সে.মি.। সুতরাং বৃত্তটির ব্যাসার্ধ, r=2√2/2=√2 সে.মি.। এখন, বৃত্তের ক্ষেত্রফল=πr² বর্গ একক=π(√2)²=2π বর্গ সে.মি.।", "id": "q0415"}, {"chapter": "অধ্যায় ১৮: পরিমিতি (সরলক্ষেত্র)", "topic": "১৮.৬ বিভিন্ন জ্যামিতিক ক্ষেত্রের মধ্যে সম্পর্ক", "q": "০২", "question": "৪ সে.মি. বাহুবিশিষ্ট বর্গক্ষেত্রে পরিলিখিত বৃত্তের ক্ষেত্রফল কত?", "source": "৪৬তম বিসিএস", "options": {"ক": "8π বর্গ সে.মি.", "খ": "6π বর্গ সে.মি.", "গ": "4π বর্গ সে.মি.", "ঘ": "2√2π বর্গ সে.মি."}, "answer": "ক", "answer_text": "8π বর্গ সে.মি.", "explanation": "দেওয়া আছে, বর্গের বাহু=৪ সে.মি.। বর্গক্ষেত্রে পরিলিখিত বৃত্তের ব্যাস=বর্গের কর্ণ=√2×বাহুর দৈর্ঘ্য=4√2 সে.মি.। ∴ বৃত্তের ব্যাসার্ধ, r=4√2/2=2√2 সে.মি.। ∴ বৃত্তের ক্ষেত্রফল=πr² বর্গ একক=π×(2√2)²=8π বর্গ সে.মি.।", "id": "q0416"}, {"chapter": "অধ্যায় ১৮: পরিমিতি (সরলক্ষেত্র)", "topic": "১৮.৬ বিভিন্ন জ্যামিতিক ক্ষেত্রের মধ্যে সম্পর্ক", "q": "০৩", "question": "৬ সে.মি. ব্যাসার্ধ বিশিষ্ খ": "45°", "গ": "60°", "ঘ": "0°"}, "answer": "গ", "answer_text": "60°", "explanation": "দেওয়া আছে, 1+tan²θ=4 ⇒ tan²θ=4−1=3 ⇒ tanθ=√3 [কেবল ধনাত্মক মান নিয়ে কেননা θ<90°] ⇒ tanθ=tan60° ∴ θ=60°।", "id": "q0429"}, {"chapter": "অধ্যায় ২০: ত্রিকোণমিতি", "topic": "২০.১ কোণের মান ও অনুপাত নির্ণয়", "q": "০২", "question": "একটি ত্রিভুজের বাহুগুলোর অনুপাত 1:2√2:3 হলে এর বৃহত্তম কোণটির মান কত?", "source": "৪৫তম বিসিএস", "options": {"ক": "30°", "খ": "60°", "গ": "80°", "ঘ": "90°"}, "answer": "ঘ", "answer_text": "90°", "explanation": "[চিত্র: ত্রিভুজ, বাহু 1, 2√2, 3, একটি কোণ চিহ্নিত 90°।] বাহুগুলোর অনুপাত=1:2√2:3। পিথাগোরাসের সূত্রানুসারে, (অতিভুজ)²=(লম্ব)²+(ভূমি)² ⇒ 3²=(1)²+(2√2)² [অনুপাতিক মানকে বাহুর মান ধরে] ⇒ 9=1+4.2 ⇒ 9=9 সুতরাং, ত্রিভুজটি সমকোণী। ∴ বৃহত্তম কোণটির মান=90°।", "id": "q0430"}, {"chapter": "অধ্যায় ২০: ত্রিকোণমিতি", "topic": "২০.১ কোণের মান ও অনুপাত নির্ণয়", "q": "০৩", "question": "secA+tanA=5/2 হলে, secA−tanA=?", "source": "৪২তম বিসিএস", "options": {"ক": "1/2", "খ": "1/5", "গ": "2/5", "ঘ": "5/2"}, "answer": "গ", "answer_text": "2/5", "explanation": "আমরা জানি, sec²A−tan²A=1 ⇒ (secA+tanA)(secA−tanA)=1 ⇒ (5/2)×(secA−tanA)=1 ∴ secA−tanA=2/5।", "id": "q0431"}, {"chapter": "অধ্যায় ২০: ত্রিকোণমিতি", "topic": "২০.১ কোণের মান ও অনুপাত নির্ণয়", "q": "০৪", "question": "△ABC এ ∠B=90°, যদি AC=2AB হয় তবে, ∠C এর মান কত?", "source": "৩৮তম বিসিএস", "options": {"ক": "45°", "খ": "22.5°", "গ": "30°", "ঘ": "60°"}, "answer": "গ", "answer_text": "30°", "explanation": "[চিত্র: △ABC, ∠B=90°, ∠C=θ।] △ABC এ ∠B=90°, ফলে △ABC একটি সমকোণী ত্রিভুজ। ∠C=θ হলে sinθ=লম্ব/অতিভুজ=AB/AC=AB/2AB=1/2 ∴ sinθ=1/2 ⇒ sinθ=sin30° ∴ θ=30°।", "id": "q0432"}, {"chapter": "অধ্যায় ২০: ত্রিকোণমিতি", "topic": "২০.১ কোণের মান ও অনুপাত নির্ণয়", "q": "০৫", "question": "একটি গাড়ির চাকা প্রতি মিনিটে ৯০ বার ঘোরে। ১ সেকেন্ডে চাকাটি কত ডিগ্রি ঘুরবে?", "source": "৩২ ও ২১তম বিসিএস", "options": {"ক": "180°", "খ": "270°", "গ": "360°", "ঘ": "540°"}, "answer": "ঘ", "answer_text": "540°", "explanation": "চাকাটি ১মি
