/* ============ MOCK EXAM ============ */
var mockState=null;
VIEW_RENDERERS.mock = function(root){
  if(!mockState) renderMockSetup(root);
  else if(!mockState.submitted) renderMockExam(root);
  else renderMockResult(root);
};
function renderMockSetup(root){
  var html = "<div class='card'><h3>⏱️ মক পরীক্ষা সেটআপ</h3>";
  html += "<div class='mt-14'><label class='small muted'>প্রশ্ন সংখ্যা</label><br><select id='mockCount' style='margin-top:6px;width:100%'>"+
    "<option value='15'>১৫টি প্রশ্ন</option><option value='25' selected>২৫টি প্রশ্ন</option><option value='40'>৪০টি প্রশ্ন</option><option value='"+C.questions.length+"'>সবগুলো প্রশ্ন ("+C.questions.length+"টি)</option></select></div>";
  html += "<div class='mt-14'><label class='small muted'>সময়সীমা</label><br><select id='mockTime' style='margin-top:6px;width:100%'>"+
    "<option value='0'>সময়সীমা নেই</option><option value='15'>১৫ মিনিট</option><option value='30' selected>৩০ মিনিট</option><option value='60'>৬০ মিনিট</option></select></div>";
  html += "<button class='btn btn-primary mt-20 btn-block' id='startMock'>মক পরীক্ষা শুরু করুন</button></div>";
  root.innerHTML = html;
  $("#startMock").onclick=function(){
    var n = parseInt($("#mockCount").value); var t = parseInt($("#mockTime").value);
    var pool = shuffle(C.questions.slice()).slice(0,n);
    mockState = {
      questions: pool.map(function(q){ var opts2=q.options.map(function(o,i){return{text:o,origIdx:i};}); opts2=shuffle(opts2); return {q:q, shuffledOptions:opts2, selected:null, marked:false}; }),
      idx:0, startTime:Date.now(), timeLimitSec: t*60, submitted:false
    };
    navigate("mock");
  };
}
function renderMockExam(root){
  var ms = mockState;
  var cur = ms.questions[ms.idx];
  var q = cur.q;
  var keys=["ক","খ","গ","ঘ","ঙ","চ"];
  var timeLeft = ms.timeLimitSec? Math.max(0, ms.timeLimitSec - Math.round((Date.now()-ms.startTime)/1000)) : null;

  var html = "<div class='flex-between mb-14'>";
  html += "<div class='small muted'>প্রশ্ন "+(ms.idx+1)+" / "+ms.questions.length+"</div>";
  if(timeLeft!=null) html += "<div id='mockTimer' style='font-weight:700;color:var(--lal)'>⏱️ "+fmtTime(timeLeft)+"</div>";
  html += "</div>";
  html += "<div class='quiz-q'>"+escapeHtml(q.prompt)+"</div>";
  html += "<div class='opt-list'>";
  cur.shuffledOptions.forEach(function(o,i){
    html += "<button class='opt "+(cur.selected===i?"selected":"")+"' data-i='"+i+"'><span class='optkey'>"+keys[i]+"</span><span>"+escapeHtml(o.text)+"</span></button>";
  });
  html += "</div>";
  html += "<div class='flex gap-8 mt-20'>";
  html += "<button class='btn' id='markBtn'>"+(cur.marked?"🚩 চিহ্নিত":"🏳️ পর্যালোচনার জন্য চিহ্নিত করুন")+"</button>";
  html += "<button class='btn' id='prevQ' "+(ms.idx===0?"disabled":"")+">← আগের</button>";
  html += "<button class='btn btn-primary' id='nextQ'>"+(ms.idx===ms.questions.length-1?"জমা দিন":"পরবর্তী →")+"</button>";
  html += "</div>";
  html += "<h3 class='mt-26'>প্রশ্ন নেভিগেশন</h3><div class='exam-nav-grid mt-8'>";
  ms.questions.forEach(function(c,i){
    var cls = (i===ms.idx?"current ":"")+(c.marked?"marked ":"")+(c.selected!=null?"answered ":"");
    html += "<button class='"+cls+"' data-goq='"+i+"'>"+(i+1)+"</button>";
  });
  html += "</div>";
  root.innerHTML = html;

  $all(".opt",root).forEach(function(b){ b.onclick=function(){ cur.selected=parseInt(b.getAttribute("data-i")); renderMockExam(root); }; });
  $("#markBtn").onclick=function(){ cur.marked=!cur.marked; renderMockExam(root); };
  $("#prevQ").onclick=function(){ ms.idx--; renderMockExam(root); };
  $("#nextQ").onclick=function(){
    if(ms.idx===ms.questions.length-1){ submitMock(); }
    else { ms.idx++; renderMockExam(root); }
  };
  $all("[data-goq]",root).forEach(function(b){ b.onclick=function(){ ms.idx=parseInt(b.getAttribute("data-goq")); renderMockExam(root); }; });

  if(timeLeft!=null){
    clearInterval(window.__mockTimerHandle);
    window.__mockTimerHandle = setInterval(function(){
      var tl = Math.max(0, ms.timeLimitSec - Math.round((Date.now()-ms.startTime)/1000));
      var elm = document.getElementById("mockTimer");
      if(elm) elm.textContent = "⏱️ "+fmtTime(tl);
      if(tl<=0){ clearInterval(window.__mockTimerHandle); submitMock(); }
    },1000);
  }
}
function fmtTime(sec){ var m=Math.floor(sec/60), s=sec%60; return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }
function submitMock(){
  clearInterval(window.__mockTimerHandle);
  var ms = mockState;
  var score=0; var answers=[];
  ms.questions.forEach(function(c){
    var correct = c.selected!=null && c.shuffledOptions[c.selected].origIdx===c.q.answer;
    if(correct) score++;
    answers.push({qid:c.q.id, correct:correct, chapterId:c.q.chapter});
    recordAnswer(c.q.id, correct, c.q.chapter);
  });
  var timeSec = Math.round((Date.now()-ms.startTime)/1000);
  state.quizHistory.push({id:"mock_"+Date.now(), date:todayStr(), mode:"mock", chapterId:null, score:score, total:ms.questions.length, timeSec:timeSec, answers:answers});
  tickStudyTime(timeSec);
  ms.submitted=true; ms.score=score;
  saveState();
  navigate("mock");
}
function renderMockResult(root){
  var ms = mockState;
  var pct = Math.round(ms.score/ms.questions.length*100);
  var chAcc = {};
  ms.questions.forEach(function(c){
    var correct = c.selected!=null && c.shuffledOptions[c.selected].origIdx===c.q.answer;
    var cid=c.q.chapter; if(!chAcc[cid]) chAcc[cid]={t:0,c:0};
    chAcc[cid].t++; if(correct) chAcc[cid].c++;
  });
  var chArr = Object.keys(chAcc).map(function(k){ return {ch:chapterById(parseInt(k)), pct: chAcc[k].c/chAcc[k].t*100}; });
  chArr.sort(function(a,b){return a.pct-b.pct;});
  var weakest = chArr.slice(0,2), strongest = chArr.slice(-2).reverse();

  var html = "<div class='card center' style='padding:36px 20px;'>";
  html += "<div style='font-size:44px'>"+(pct>=80?"🏆":pct>=50?"👍":"📚")+"</div>";
  html += "<h2>স্কোর: "+ms.score+" / "+ms.questions.length+" ("+pct+"%)</h2>";
  html += "<div class='muted small'>সময় ব্যবহৃত: "+fmtTime(Math.round((Date.now()-ms.startTime)/1000))+"</div></div>";
  html += "<div class='grid grid-2 mt-14'>";
  html += "<div class='card'><h3>দুর্বল ক্ষেত্র</h3>"+(weakest.length?weakest.map(function(w){return "<div class='mt-8'>"+escapeHtml(w.ch.title)+" — "+Math.round(w.pct)+"%</div>";}).join(""):"<span class='muted small'>N/A</span>")+"</div>";
  html += "<div class='card'><h3>শক্তিশালী ক্ষেত্র</h3>"+(strongest.length?strongest.map(function(w){return "<div class='mt-8'>"+escapeHtml(w.ch.title)+" — "+Math.round(w.pct)+"%</div>";}).join(""):"<span class='muted small'>N/A</span>")+"</div>";
  html += "</div>";
  html += "<div class='card mt-14'><h3>প্রশ্নভিত্তিক পর্যালোচনা</h3>";
  ms.questions.forEach(function(c,i){
    var correct = c.selected!=null && c.shuffledOptions[c.selected].origIdx===c.q.answer;
    html += "<div class='mt-14' style='padding-bottom:10px;border-bottom:1px solid var(--line)'>"+
      "<div style='font-weight:600'>"+(i+1)+". "+escapeHtml(c.q.prompt)+" "+(correct?"✅":"❌")+"</div>"+
      "<div class='small mt-8'>সঠিক উত্তর: "+escapeHtml(c.q.options[c.q.answer])+"</div></div>";
  });
  html += "</div>";
  html += "<button class='btn btn-primary mt-14' id='newMock'>নতুন মক পরীক্ষা</button>";
  root.innerHTML = html;
  $("#newMock").onclick=function(){ mockState=null; navigate("mock"); };
}

    html += "<tr><td>"+ch.id+". "+escapeHtml(ch.title)+"</td><td>"+(read?"✅":"—")+"</td><td>"+(a.pct!=null?Math.round(a.pct)+"% ("+a.t+"টি)":"—")+"</td><td style='color:"+(m.color||"inherit")+"'>"+m.label+"</td><td class='small muted'>"+rec+"</td></tr>";
  });
  html += "</tbody></table></div>";

  // heatmap
  html += "<div class='card mt-14'><h3>অধ্যয়ন হিটম্যাপ (শেষ ৯১ দিন)</h3><div class='heatmap mt-8'>";
  var days=[];
  for(var i=90;i>=0;i--){ days.push(addDays(todayStr(),-i)); }
  days.forEach(function(d){
    var sec = state.streak.days[d]||0;
    var level = sec===0?0: sec<300?1: sec<900?2: sec<1800?3:4;
    var colors=["var(--paper-2)","#e9dcc9","#d8b98a","var(--gold)","var(--lal)"];
    html += "<div class='heat-cell' title='"+d+"' style='background:"+colors[level]+"'></div>";
  });
  html += "</div><div class='small muted mt-8'>বর্তমান স্ট্রিক: "+state.streak.current+" দিন · সর্বোচ্চ: "+state.streak.longest+" দিন</div></div>";

  root.innerHTML = html;
};

  html += "</div>";
  root.innerHTML = html;
  $all("[data-del]",root).forEach(function(b){ b.onclick=function(){ delete state.bookmarks[b.getAttribute("data-del")]; saveState(); navigate("bookmarks"); }; });
  $all("[data-open]",root).forEach(function(b){
    b.onclick=function(){
      var bm = state.bookmarks[b.getAttribute("data-open")];
      if(bm.type==="chapter") navigate("read",{chapterId:bm.id});
      else navigate("learn");
    };
  });
};

/* ============ SEARCH ============ */
VIEW_RENDERERS.search = function(root){
  var html = "<input type='text' id='searchInput' placeholder='অধ্যায়, নাম, তারিখ, তথ্য খুঁজুন...' style='width:100%;padding:12px 14px;font-size:15px;'>";
  html += "<div id='searchResults' class='mt-20'></div>";
  root.innerHTML = html;
  var input = $("#searchInput");
  input.focus();
  input.oninput=function(){ doSearch(input.value); };
  function doSearch(qstr){
    var out = $("#searchResults");
    if(!qstr || qstr.length<2){ out.innerHTML="<div class='muted small'>কমপক্ষে ২ অক্ষর টাইপ করুন...</div>"; return; }
    var q = qstr.toLowerCase();
    var results = [];
    C.chapters.forEach(function(ch){
      if(ch.title.toLowerCase().indexOf(q)>-1) results.push({type:"অধ্যায়",text:ch.title,go:function(){navigate("read",{chapterId:ch.id});}});
      ch.facts.forEach(function(f){ if(f.text.toLowerCase().indexOf(q)>-1) results.push({type:"তথ্য ("+ch.title+")",text:f.text,go:function(){navigate("read",{chapterId:ch.id});}}); });
    });
    C.flashcards.forEach(function(fc){ if(fc.front.toLowerCase().indexOf(q)>-1 || fc.back.toLowerCase().indexOf(q)>-1) results.push({type:"ফ্ল্যাশকার্ড",text:fc.front,go:function(){navigate("learn");}}); });
    C.questions.forEach(function(qq){ if(qq.prompt.toLowerCase().indexOf(q)>-1) results.push({type:"প্রশ্ন",text:qq.prompt,go:function(){navigate("quiz",{chapterId:qq.chapter});}}); });
    if(!results.length){ out.innerHTML="<div class='muted small'>কোনো ফলাফল পাওয়া যায়নি।</div>"; return; }
    out.innerHTML = results.slice(0,40).map(function(r,i){
      return "<div class='card mt-8' style='cursor:pointer' data-r='"+i+"'><span class='tag'>"+r.type+"</span><div class='mt-8'>"+escapeHtml(r.text)+"</div></div>";
    }).join("");
    $all("[data-r]",out).forEach(function(el2,i){ el2.onclick=function(){ results[i].go(); }; });
  }
};

/* ============ READINESS ============ */
VIEW_RENDERERS.readiness = function(root){
  var comp = chapterCompletion();
  var qs = quizStats();
  var mistakesN = mistakeList().length;
  var totalMistakesEver = Object.keys(state.mistakes).length;
  var mastered = C.flashcards.filter(function(f){return cardBucket(f.id)==="mastered";}).length;

  var coverageScore = comp.pct;
  var accuracyScore = qs.attempted? qs.accuracy : 0;
  var revisionScore = C.flashcards.length? (mastered/C.flashcards.length*100):0;
  var mistakeScore = totalMistakesEver? ((totalMistakesEver-mistakesN)/totalMistakesEver*100) : 100;
  var readiness = Math.round(coverageScore*0.3 + accuracyScore*0.35 + revisionScore*0.2 + mistakeScore*0.15);

  var weak = weakChapters(2);
  var strong = C.chapters.map(function(ch){var a=chapterAccuracy(ch.id); return {ch:ch,pct:a.pct,t:a.t};}).filter(function(x){return x.t>0;}).sort(function(a,b){return b.pct-a.pct;}).slice(0,2);

  var html = "<div class='card center' style='padding:36px 20px'>";
  html += "<h2>পরীক্ষা প্রস্তুতি (Exam Readiness)</h2>";
  html += progressRing(readiness);
  html += "<div class='mt-14 muted small'>এটি কোনো নিশ্চিত পূর্বাভাস নয় — বরং আপনার অধ্যয়ন কার্যক্রমের ভিত্তিতে একটি অভ্যন্তরীণ সূচক মাত্র।</div></div>";

  html += "<div class='grid grid-4 mt-14'>";
  html += statCard("কনটেন্ট কভারেজ", fmtPct(coverageScore), "");
  html += statCard("রিকল নির্ভুলতা", fmtPct(accuracyScore), "");
  html += statCard("রিভিশন সম্পন্নতা", fmtPct(revisionScore), "");
  html += statCard("ভুল সংশোধন", fmtPct(mistakeScore), "");
  html += "</div>";

  html += "<div class='grid grid-2 mt-14'>";
  html += "<div class='card'><h3>শক্তিশালী</h3>"+(strong.length?strong.map(function(s){return "<div class='mt-8'>"+escapeHtml(s.ch.title)+" — "+Math.round(s.pct)+"%</div>";}).join(""):"<span class='small muted'>আরও কুইজ দিন</span>")+"</div>";
  html += "<div class='card'><h3>অগ্রাধিকার</h3>"+(weak.length?weak.map(function(w){return "<div class='mt-8'>"+escapeHtml(w.chapter.title)+" — "+Math.round(w.acc)+"%</div>";}).join(""):"<span class='small muted'>আরও কুইজ দিন</span>")+"</div>";
  html += "</div>";
  html += "<div class='card mt-14'><h3>কীভাবে গণনা করা হয়</h3><div class='small muted'>কভারেজ ৩০% + নির্ভুলতা ৩৫% + রিভিশন ২০% + ভুল-সংশোধন ১৫% — ওজনযুক্ত গড়।</div></div>";
  root.innerHTML = html;
};

/* ============ SETTINGS ============ */
VIEW_RENDERERS.settings = function(root){
  var html = "<div class='card'><h3>প্রদর্শন</h3>";
  html += "<div class='flex-between mt-14'><span>ডার্ক মোড</span><button class='btn btn-sm' id='themeToggle'>"+(state.settings.theme==="dark"?"☀️ লাইট মোডে যান":"🌙 ডার্ক মোডে যান")+"</button></div>";
  html += "<div class='flex-between mt-14'><span>ফন্ট সাইজ</span><div class='flex gap-8'><button class='btn btn-sm' id='fD'>A-</button><button class='btn btn-sm' id='fI'>A+</button></div></div>";
  html += "<div class='flex-between mt-14'><span>লাইন স্পেসিং</span><div class='flex gap-8'><button class='btn btn-sm' id='lD'>−</button><button class='btn btn-sm' id='lI'>+</button></div></div>";
  html += "</div>";

  html += "<div class='card mt-14'><h3>ডেটা</h3>";
  html += "<div class='flex gap-8 mt-8' style='flex-wrap:wrap'>";
  html += "<button class='btn' id='exportBtn'>⬇️ অগ্রগতি এক্সপোর্ট করুন (JSON)</button>";
  html += "<label class='btn' style='margin:0'>⬆️ ইম্পোর্ট করুন<input type='file' id='importFile' accept='.json' style='display:none'></label>";
  html += "</div></div>";

  html += "<div class='card mt-14'><h3 style='color:var(--red)'>রিসেট</h3>";
  html += "<div class='flex gap-8 mt-8' style='flex-wrap:wrap'>";
  html += "<button class='btn' id='resetQuiz'>কুইজ ইতিহাস রিসেট</button>";
  html += "<button class='btn' id='resetMistakes'>ভুল খাতা মুছুন</button>";
  html += "<button class='btn' id='resetChapters'>অধ্যায় অগ্রগতি রিসেট</button>";
  html += "<button class='btn' style='border-color:var(--red);color:var(--red)' id='resetAll'>সব ডেটা মুছে ফেলুন</button>";
  html += "</div></div>";

  html += "<div class='card mt-14'><h3>কীবোর্ড শর্টকাট</h3><div class='small'>"+
    "<div><span class='kbd'>1-4</span> MCQ উত্তর নির্বাচন</div>"+
    "<div class='mt-8'><span class='kbd'>Enter</span> প্রকাশ/জমা</div>"+
    "<div class='mt-8'><span class='kbd'>N</span> পরবর্তী</div>"+
    "<div class='mt-8'><span class='kbd'>P</span> পূর্ববর্তী</div>"+
    "<div class='mt-8'><span class='kbd'>B</span> বুকমার্ক</div>"+
    "<div class='mt-8'><span class='kbd'>R</span> রিভিশন পাতায় যান</div>"+
    "<div class='mt-8'><span class='kbd'>Esc</span> ফোকাস মোড থেকে বের হন</div></div></div>";

  root.innerHTML = html;
  $("#themeToggle").onclick=toggleTheme;
  $("#fD").onclick=function(){ state.settings.fontScale=Math.max(0.85,state.settings.fontScale-0.1); applyTheme(); saveState(); };
  $("#fI").onclick=function(){ state.settings.fontScale=Math.min(1.5,state.settings.fontScale+0.1); applyTheme(); saveState(); };
  $("#lD").onclick=function(){ state.settings.lineHeight=Math.max(1.3,state.settings.lineHeight-0.1); applyTheme(); saveState(); };
  $("#lI").onclick=function(){ state.settings.lineHeight=Math.min(2.4,state.settings.lineHeight+0.1); applyTheme(); saveState(); };
  $("#exportBtn").onclick=function(){

    var a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="lndp_progress_"+todayStr()+".json"; a.click();
  };
  $("#importFile").onchange=function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload=function(ev){
      try{ var imported = JSON.parse(ev.target.result); state = imported; saveState(); toast("অগ্রগতি ইম্পোর্ট হয়েছে!"); navigate("dashboard"); }

  };
  $("#resetQuiz").onclick=function(){ if(confirm("কুইজ ইতিহাস মুছে ফেলতে চান?")){ state.quizHistory=[]; saveState(); toast("কুইজ ইতিহাস রিসেট হয়েছে"); } };
  $("#resetMistakes").onclick=function(){ if(confirm("ভুল খাতা মুছে ফেলতে চান?")){ state.mistakes={}; saveState(); toast("ভুল খাতা মুছে ফেলা হয়েছে"); } };
  $("#resetChapters").onclick=function(){ if(confirm("অধ্যায় অগ্রগতি রিসেট করতে চান?")){ state.chapterProgress={}; saveState(); toast("অধ্যায় অগ্রগতি রিসেট হয়েছে"); } };
  $("#resetAll").onclick=function(){ if(confirm("সতর্কতা: এটি সমস্ত ডেটা স্থায়ীভাবে মুছে ফেলবে। নিশ্চিত?")){ localStorage.removeItem(STORE_KEY); state=defaultState(); saveState(); toast("সব ডেটা রিসেট হয়েছে"); navigate("dashboard"); } };
};

/* ============ KEYBOARD SHORTCUTS ============ */
document.addEventListener("keydown", function(e){
  if(e.target && (e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;
  if(e.key>="1" && e.key<="4"){
    var idx = parseInt(e.key)-1;
    var opts = $all("#optList .opt");
    if(opts[idx]) opts[idx].click();
  } else if(e.key==="Enter"){
    var nextBtn = document.getElementById("nextQ") || document.getElementById("revealBtn");
    if(nextBtn) nextBtn.click();
  } else if(e.key==="n"||e.key==="N"){
    var nb = document.getElementById("nextQ") || document.getElementById("nextCh");
    if(nb) nb.click();
  } else if(e.key==="p"||e.key==="P"){
    var pb = document.getElementById("prevCh") || document.getElementById("prevQ");
    if(pb) pb.click();
  } else if(e.key==="b"||e.key==="B"){
    var bb = document.getElementById("bmChapter") || document.getElementById("bmCard");
    if(bb) bb.click();
  } else if(e.key==="r"||e.key==="R"){
    if(!e.ctrlKey && !e.metaKey) navigate("revision");
  } else if(e.key==="Escape"){
    closeModal();
  }
});

/* ============ INIT ============ */
function boot(){
  loadState();
  applyTheme();
  buildSideNav();
  buildBottomNav();
  var startView = state.lastPosition.view || "dashboard";
  navigate(startView, {chapterId: state.lastPosition.chapterId});
  window.__LNDP.state = state;

  window.addEventListener("beforeunload", function(){
    var sec = Math.round((Date.now()-sessionStart)/1000);
    tickStudyTime(Math.min(sec,60));
  });
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})(); // end IIFE

</script>
