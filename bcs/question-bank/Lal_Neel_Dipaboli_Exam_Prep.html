<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>লাল নীল দীপাবলি — পরীক্ষা প্রস্তুতি</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Noto+Serif+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap');

:root{
  /* Light theme — warm paper, terracotta (lal) + indigo (nil) from the book's own title */
  --paper: #F6EFDF;
  --paper-2: #EFE5CE;
  --ink: #2B2118;
  --ink-soft: #5B4E3F;
  --line: #DDD0B0;
  --card: #FFFBF2;
  --lal: #B8451F;       /* red diya */
  --lal-soft: #E9DCC9;
  --nil: #1F3A5F;       /* blue diya */
  --nil-soft: #DCE4EC;
  --gold: #A9782E;
  --green: #3F6B3A;
  --amber: #B8791C;
  --red: #A63B2A;
  --shadow: 0 2px 10px rgba(43,33,24,0.08);
  --radius: 10px;
  --font-display: 'Tiro Bangla','Noto Serif Bengali','Hind Siliguri',serif;
  --font-body: 'Hind Siliguri','Noto Serif Bengali',sans-serif;
  --content-width: 720px;
  --font-scale: 1;
  --line-height: 1.85;
}
[data-theme="dark"]{
  --paper:#181410;
  --paper-2:#211b15;
  --ink:#EEE6D6;
  --ink-soft:#B9AC93;
  --line:#3A2F23;
  --card:#211b15;
  --lal:#E07A50;
  --lal-soft:#3A241B;
  --nil:#8CA9CC;
  --nil-soft:#1E2A38;
  --gold:#D2A85A;
  --green:#7FB57A;
  --amber:#E0AC53;
  --red:#E28068;
  --shadow: 0 2px 14px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:calc(16px * var(--font-scale));
  line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .25s, color .25s;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; margin:0 0 .4em; letter-spacing:.2px;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--lal-soft);}

/* ---- App shell ---- */
#app{display:flex; min-height:100vh;}

/* Sidebar nav (desktop) */
#sidenav{
  width:230px; flex-shrink:0; background:var(--paper-2); border-right:1px solid var(--line);
  padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 18px; border-bottom:1px solid var(--line); margin-bottom:14px;}
.brand-flame{font-size:26px; line-height:1;}
.brand-title{font-family:var(--font-display); font-weight:700; font-size:17px; line-height:1.15;}
.brand-sub{font-size:11px; color:var(--ink-soft);}

.navlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.navlist button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
  color:var(--ink); padding:10px 12px; border-radius:8px; font-size:14.5px; font-weight:500;
}
.navlist button:hover{background:var(--lal-soft);}
.navlist button.active{background:var(--lal); color:#fff;}
.navlist .navicon{width:20px; text-align:center; flex-shrink:0;}
.nav-section-label{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); margin:16px 8px 6px;}

/* Main content */
#main{flex:1; min-width:0; padding-bottom:70px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper); z-index:20;
}
.topbar-title{font-family:var(--font-display); font-size:19px; font-weight:700;}
.topbar-actions{display:flex; gap:8px; align-items:center;}
.iconbtn{
  background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:15px; color:var(--ink);
}
.iconbtn:hover{border-color:var(--lal);}
.view{padding:20px 22px 30px; max-width:1100px; margin:0 auto;}
.view.narrow{max-width:var(--content-width);}

/* Cards / grid */
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;
  box-shadow:var(--shadow);
}
.card h3{font-size:14px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px;}
.stat-num{font-family:var(--font-display); font-size:30px; font-weight:700; color:var(--nil);}
.stat-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:8px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-weight:600; font-size:14px;
}
.btn:hover{border-color:var(--lal);}
.btn-primary{background:var(--lal); border-color:var(--lal); color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-nil{background:var(--nil); border-color:var(--nil); color:#fff;}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-sm{padding:6px 11px; font-size:12.5px;}
.btn-block{width:100%; justify-content:center;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600;}
.pill-must{background:var(--lal-soft); color:var(--lal);}
.pill-important{background:var(--nil-soft); color:var(--nil);}
.pill-quick{background:#EDE6D0; color:var(--gold);}
.pill-trap{background:#F3DCC9; color:var(--red);}
[data-theme="dark"] .pill-quick{background:#332c1c;}
[data-theme="dark"] .pill-trap{background:#3a241b;}

.tag{font-size:11px; color:var(--ink-soft); border:1px solid var(--line); padding:2px 8px; border-radius:6px;}

/* Progress bar/ring */
.progress-track{height:8px; background:var(--paper-2); border-radius:6px; overflow:hidden; border:1px solid var(--line);}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--lal),var(--gold));}
.ring-wrap{position:relative; width:120px; height:120px; margin:0 auto;}
.ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-num{font-family:var(--font-display); font-size:26px; font-weight:700;}
.ring-cap{font-size:10.5px; color:var(--ink-soft);}

/* Reader */
.reader-layout{display:flex; gap:0; align-items:flex-start;}
.chapter-sidebar{
  width:270px; flex-shrink:0; border-right:1px solid var(--line); padding:16px 12px; max-height:calc(100vh - 110px);
  overflow-y:auto; position:sticky; top:60px;
}
.chapter-sidebar .search-mini{width:100%; margin-bottom:10px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:13px;}
.chlist{list-style:none; margin:0; padding:0;}
.chlist li button{
  width:100%; text-align:left; background:none; border:none; color:var(--ink); padding:8px 9px; border-radius:7px;
  font-size:13px; display:flex; gap:8px; align-items:flex-start;
}
.chlist li button:hover{background:var(--paper-2);}
.chlist li button.active{background:var(--lal-soft); color:var(--lal); font-weight:600;}
.chlist .chnum{flex-shrink:0; color:var(--ink-soft); font-variant-numeric:tabular-nums; width:20px;}
.chlist .chdone{color:var(--green);}

.reader-content{flex:1; min-width:0; padding:24px 34px; max-width:var(--content-width); margin:0 auto;}
.reader-content .chtitle{font-size:26px; margin-bottom:4px;}
.reader-content .chmeta{font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;}
.reading-text{font-size:calc(16.5px*var(--font-scale)); line-height:var(--line-height); white-space:pre-line; color:var(--ink);}
.reading-text p{margin:0 0 1.1em;}
.facts-block{margin-top:26px; border-top:1px dashed var(--line); padding-top:18px;}
.fact-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.fact-item:last-child{border-bottom:none;}
.fact-text{font-size:14.5px; line-height:1.6;}
.reader-toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}

/* Flashcard */
.flip-card-wrap{max-width:520px; margin:0 auto; perspective:1400px;}
.flip-card{
  position:relative; min-height:260px; border-radius:16px; cursor:pointer;
}
.flip-face{
  position:relative; min-height:260px; border-radius:16px; border:1px solid var(--line); background:var(--card);
  display:flex; align-items:center; justify-content:center; text-align:center; padding:30px; box-shadow:var(--shadow);
}
.flip-face.back{background:var(--nil-soft);}
.flip-hint{position:absolute; bottom:12px; font-size:11.5px; color:var(--ink-soft);}
.flip-front-text{font-size:19px; font-weight:600; line-height:1.5;}
.flip-back-text{font-size:16px; line-height:1.6;}

.srs-btns{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; max-width:520px; margin-left:auto; margin-right:auto;}
.srs-btn{padding:11px 6px; border-radius:9px; text-align:center; font-size:13px; font-weight:700; border:1px solid var(--line); background:var(--card);}
.srs-again{color:#fff; background:#A63B2A; border-color:#A63B2A;}
.srs-hard{color:#fff; background:#B8791C; border-color:#B8791C;}
.srs-good{color:#fff; background:#3F6B3A; border-color:#3F6B3A;}
.srs-easy{color:#fff; background:#1F3A5F; border-color:#1F3A5F;}

/* Quiz */
.quiz-progress{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.quiz-q{font-size:19px; font-weight:600; margin-bottom:20px; line-height:1.5;}
.opt-list{display:flex; flex-direction:column; gap:10px;}
.opt{
  text-align:left; padding:13px 16px; border-radius:10px; border:1.5px solid var(--line); background:var(--card);
  font-size:15px; display:flex; gap:10px; align-items:center;
}
.opt:hover{border-color:var(--nil);}
.opt.selected{border-color:var(--nil); background:var(--nil-soft);}
.opt.correct{border-color:var(--green); background:#E4EFE0;}
.opt.incorrect{border-color:var(--red); background:#F5DFDA;}
[data-theme="dark"] .opt.correct{background:#1d3220;}
[data-theme="dark"] .opt.incorrect{background:#3a2018;}
.opt .optkey{font-weight:700; color:var(--ink-soft); width:20px; flex-shrink:0;}
.explain-box{margin-top:16px; padding:14px 16px; border-radius:10px; background:var(--paper-2); border:1px solid var(--line); font-size:14px; line-height:1.6;}

/* Mock exam nav grid */
.exam-nav-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px;}
.exam-nav-grid button{aspect-ratio:1; border-radius:6px; border:1px solid var(--line); background:var(--card); font-size:12px; font-weight:700;}
.exam-nav-grid button.answered{background:var(--nil-soft); border-color:var(--nil);}
.exam-nav-grid button.marked{background:var(--lal-soft); border-color:var(--lal);}
.exam-nav-grid button.current{outline:2px solid var(--gold); outline-offset:1px;}

/* Misc */
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty-state .emoji{font-size:38px; margin-bottom:10px;}
hr.rule{border:none; border-top:1px solid var(--line); margin:20px 0;}
.flex{display:flex;}
.flex-between{display:flex; align-items:center; justify-content:space-between;}
.gap-8{gap:8px;} .gap-10{gap:10px;} .gap-14{gap:14px;}
.mt-8{margin-top:8px;} .mt-14{margin-top:14px;} .mt-20{margin-top:20px;} .mt-26{margin-top:26px;}
.mb-8{margin-bottom:8px;} .mb-14{margin-bottom:14px;}
.muted{color:var(--ink-soft);}
.small{font-size:12.5px;}
.center{text-align:center;}
.badge-dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
textarea, input[type=text], input[type=number], select{
  font-family:inherit; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:14px;
}
table{width:100%; border-collapse:collapse; font-size:14px;}
table th, table td{padding:9px 10px; border-bottom:1px solid var(--line); text-align:left;}
table th{color:var(--ink-soft); font-size:12px; text-transform:uppercase;}

/* Bottom nav (mobile) */
#bottomnav{display:none;}
@media (max-width:840px){
  #sidenav{display:none;}
  #bottomnav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    z-index:50; padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  }
  #bottomnav button{flex:1; background:none; border:none; color:var(--ink-soft); font-size:10px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 0;}
  #bottomnav button.active{color:var(--lal);}
  #bottomnav .navicon{font-size:18px;}
  .reader-layout{flex-direction:column;}
  .chapter-sidebar{width:100%; position:static; max-height:220px;}
  .reader-content{padding:18px 16px;}
  .view{padding:16px 14px 20px;}
  .exam-nav-grid{grid-template-columns:repeat(6,1fr);}
}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(20,15,8,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
.modal{background:var(--card); border-radius:14px; max-width:480px; width:100%; padding:22px; box-shadow:0 12px 40px rgba(0,0,0,0.3); max-height:85vh; overflow-y:auto;}

.kbd{border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-size:12px; font-family:monospace; background:var(--paper-2);}

.heatmap{display:grid; grid-template-columns:repeat(26,1fr); gap:3px;}
.heat-cell{aspect-ratio:1; border-radius:2px; background:var(--paper-2);}

.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:8px; font-size:13.5px; z-index:200; box-shadow:0 6px 20px rgba(0,0,0,.3);}
</style>
</head>
<body data-theme="light">
<div id="ag-overlay"></div>

<div id="app">
  <nav id="sidenav"></nav>
  <main id="main">
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">ড্যাশবোর্ড</div>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>
    <div id="viewRoot" class="view"></div>
  </main>
</div>
<nav id="bottomnav"></nav>
<div id="modalRoot"></div>

 ত্রয়োদশ শতাব্দীর পর দরিদ্র, নিম্নবর্ণের হিন্দু ও উৎপীড়িত বৌদ্ধদের একাংশ ইসলাম গ্রহণ করে। মধ্যযুগের কবি আবদুল হাকিম তাই তীব্র ভাষায় বলেছিলেন, যারা বাঙলায় জন্মেও বাঙলা ভাষাকে ঘৃণা করে তাদের এদেশ ছেড়ে চলে যাওয়া উচিত।\n\nবাঙলা ভাষার উৎস প্রাচীন ভারতীয় আর্যভাষা, যা ক্রমে পালি, তারপর প্রাকৃত ভাষায় রূপান্তরিত হয়, এবং দশম শতকের মাঝামাঝি প্রাকৃতেরই আরও পরিবর্তিত রূপ থেকে জন্ম নেয় বাঙলা ভাষা। বাঙলা ভাষাকে তিনটি স্তরে ভাগ করা হয়: প্রাচীন বাঙলা (৯৫০–১২০০), মধ্যযুগের বাঙলা (১৩৫০–১৮০০), ও আধুনিক বাঙলা (১৮০০-বর্তমান)। মাঝের দেড়শো বছর (১২০০-১৩৫০) কোনো সাহিত্যের নমুনা পাওয়া যায় না। এদেশের নাম 'বাঙ্গালা'/'বাঙলা' এসেছে বলে সম্রাট আকবরের সভাসদ আবুল ফজল জানিয়েছেন — 'বঙ্গ' শব্দের সঙ্গে 'আল' (বাঁধ) শব্দ যুক্ত হয়ে এই নাম হয়েছে, কারণ এদেশে বৃষ্টির প্রকোপে বাঁধ/আল বেশি প্রয়োজন হতো। প্রাচীনকালে অঞ্চলটি বঙ্গ, গৌড়, পুণ্ড্র, রাঢ় ইত্যাদি পৃথক জনপদে বিভক্ত ছিল। ১৯৪৭ সালে ভারত বিভক্ত হলে বাঙলার একাংশ হয় পূর্ব পাকিস্তান, এবং ১৯৭১ সালে জন্ম নেয় স্বাধীন বাঙলাদেশ।", "facts": [{"level": "must", "text": "নৃতাত্ত্বিকদের মতে বাঙালির আদি পূর্বপুরুষ সিংহলের ভেড্ডারা।"}, {"level": "must", "text": "বাঙালির রক্তে ক্রমান্বয়ে মিশেছে: ভেড্ডা → মঙ্গোলীয় → ইন্দো-আর্য → শক → আরব/পারস্য।"}, {"level": "must", "text": "বাঙলা ভাষার বিবর্তনধারা: প্রাচীন ভারতীয় আর্যভাষা → পালি → প্রাকৃত → বাঙলা (জন্ম আনু. ৯৫০ খ্রি.)।"}, {"level": "must", "text": "বাঙলা ভাষার তিনটি স্তর — প্রাচীন যুগ ৯৫০-১২০০, মধ্যযুগ ১৩৫০-১৮০০, আধুনিক যুগ ১৮০০-বর্তমান।"}, {"level": "important", "text": "আবুল ফজলের মতে 'বঙ্গ' + 'আল' (বাঁধ) মিলে 'বাঙ্গালা/বাঙলা' নামের উৎপত্তি।"}, {"level": "important", "text": "প্রাচীন জনপদ: বঙ্গ, গৌড়, পুণ্ড্র, রাঢ়। শশাঙ্ক সপ্তম শতাব্দীর প্রথমভাগে পশ্চিম বাংলাকে প্রথম ঐক্যবদ্ধ করেন, নিজেকে বলতেন 'গৌড়াধিপতি'।"}, {"level": "important", "text": "মুসলমান শাসনের পরে, বিশেষত ত্রয়োদশ শতাব্দীর পরে, দরিদ্র-নিম্নবর্ণের হিন্দু ও উৎপীড়িত বৌদ্ধরা ইসলাম গ্রহণ করতে থাকে।"}, {"level": "must", "text": "১৯৪৭-এ ভারত বিভাগের পর পূর্ব বাংলা হয় 'পূর্ব পাকিস্তান'; ১৯৭১ সালে জন্ম নেয় স্বাধীন বাংলাদেশ।"}, {"level": "quick", "text": "মধ্যযুগের কবি আবদুল হাকিম বাংলাভাষা-বিদ্বেষীদের নিন্দা করে বিখ্যাত পঙক্তি লিখেছিলেন তাঁর 'নূরনামা' কাব্যে।"}, {"level": "trap", "text": "⚠️ চর্যাপদ-এর ভাষা বাঙলা প্রমাণ করেন ডক্টর সুনীতিকুমার চট্টোপাধ্যায় (গ্রন্থ: বাঙলা ভাষার উৎপত্তি ও বিকাশ, ১৯২৬) — একে হরপ্রসাদ শাস্ত্রীর আবিষ্কারের সাথে গুলিয়ে ফেলা যায় না।"}]}, {"id": 3, "title": "বাঙলা সাহিত্যের তিন যুগ", "page": "১২-১৪", "reading": "হাজার বছরের বাঙলা সাহিত্যকে তিনটি যুগে ভাগ করা হয়: (ক) প্রাচীন যুগ ৯৫০-১২০০ খ্রিস্টাব্দ, (খ) মধ্যযুগ ১৩৫০-১৮০০ খ্রিস্টাব্দ, (গ) আধুনিক যুগ ১৮০০ থেকে আজ পর্যন্ত। প্রাচীন যুগে পাওয়া যায় কেবল একটি বই — চর্যাপদ, যার কবিরা ছিলেন বৌদ্ধ সাধক, নিজেদের সাধনার গোপন কথাই কবিতায় গেঁথেছেন। এরপর দেড়শো বছর (১২০০-১৩৫০) কোনো সাহিত্য রচিত হয়নি বলে একে বলা হয় 'অন্ধকার যুগ'।\n\nমধ্যযুগ শুরু হয় চতুর্দশ শতাব্দীর দ্বিতীয়ভাগ থেকে, আর তা দীর্ঘকাল স্থায়ী হয়। এ যুগে রচিত হয় অসংখ্য কাহিনিকাব্য ('মঙ্গলকাব্য') আর বৈষ্ণব পদাবলির মতো গীতিকবিতা। মধ্যযুগের সাহিত্য মূলত দেবতাকেন্দ্রিক, যদিও দেবতার আড়ালে মানুষের সুখ-দুঃখের কথাও এসেছে। মধ্যযুগে মুসলমান কবিরা মানুষের গল্প (যেমন ইউসুফ-জুলেখা, লাইলি-মজনু) বলে নতুন ধারার সূচনা করেন। মধ্যযুগের অবসানে ১৮০০ সালে শুরু হয় আধুনিক যুগ, যার সবচেয়ে বড়ো অবদান গদ্যের বিকাশ — এর নেতৃত্বে ছিলেন ফোর্ট উইলিয়ম কলেজের লেখকরা, প্রধানত উইলিয়ম কেরি ও তাঁর সহায়ক রামরাম বসু।", "facts": [{"level": "must", "text": "তিন যুগ: (ক) প্রাচীন যুগ ৯৫০-১২০০ (খ) মধ্যযুগ ১৩৫০-১৮০০ (গ) আধুনিক যুগ ১৮০০-বর্তমান।"}, {"level": "must", "text": "১২০০-১৩৫০ সময়কাল 'অন্ধকার যুগ' নামে পরিচিত — এ সময়ের কোনো সাহিত্যকর্ম পাওয়া যায়নি।"}, {"level": "important", "text": "মধ্যযুগের শ্রেষ্ঠ কবিদের মধ্যে আছেন বড়ু চণ্ডীদাস, মুকুন্দরাম চক্রবর্তী, বিজয়গুপ্ত, চণ্ডীদাস, বিদ্যাপতি, জ্ঞানদাস, গোবিন্দদাস, ভারতচন্দ্র, আলাওল, কাজী দৌলত।"}, {"level": "important", "text": "আধুনিক যুগের সবচেয়ে বড়ো অবদান: গদ্যের বিকাশ, যার নেতৃত্বে ফোর্ট উইলিয়ম কলেজ (প্রধান: উইলিয়ম কেরি, সহায়ক: রামরাম বসু)।"}, {"level": "quick", "text": "মুসলমান কবিরাই মধ্যযুগে সর্বপ্রথম দেবতার বদলে নিছক মানুষের গল্প বলার সূচনা করেন।"}]}, {"id": 4, "title": "প্রথম প্রদীপ : চর্যাপদ", "page": "১৪-১৮", "reading": "বাঙলা ভাষার প্রথম বই চর্যাপদ। এর অন্য নাম 'চর্যাচর্যবিনিশ্চয়'। ১৯০৭ খ্রিস্টাব্দে পণ্ডিত মহামহোপাধ্যায় হরপ্রসাদ শাস্ত্রী নেপালের রাজদরবারের গ্রন্থাগার থেকে এটি আবিষ্কার করেন, সঙ্গে পান আরও দুটি বই — ডাকার্ণব ও দোহাকোষ। ১৯১৬ খ্রিস্টাব্দে তিনি এগুলো একত্র করে 'হাজার বছরের পুরাণ বাঙ্গালা ভাষায় বৌদ্ধ গান ও দোহা' নামে প্রকাশ করেন। শুরুতে অসমীয়া, ওড়িয়া, মৈথিলি, হিন্দিভাষীরাও চর্যাপদকে নিজেদের ভাষার বলে দাবি করেছিল, কিন্তু ডক্টর সুনীতিকুমার চট্টোপাধ্যায় তাঁর 'বাঙলা ভাষার উৎপত্তি ও বিকাশ' (১৯২৬) গ্রন্থে এবং প্রবোধচন্দ্র বাগচী, মুহম্মদ শহীদুল্লাহ, সুকুমার সেন, শশিভূষণ দাশগুপ্তের মতো পণ্ডিতেরা প্রমাণ করেন এটি বাঙলা ভাষায় রচিত।\n\nচর্যাপদে আছে ৪৬টি পূর্ণ কবিতা ও একটি খণ্ডিত কবিতা (মোট সাড়ে ছেচল্লিশটি), যা লিখেছিলেন ২৪ জন বৌদ্ধ সহজিয়া কবি — যাদের নামের শেষে থাকে 'পাদ' শব্দ (কাহ্নপাদ, লুইপাদ, সরহপাদ, শবরপাদ প্রভৃতি)। সবচেয়ে বেশি কবিতা লিখেছেন কাহ্নপাদ (বারোটি; অন্য নাম কৃষ্ণাচার্য), ভুসুকুপাদ ছয়টি, সরহপাদ চারটি। কবিরা ছিলেন গৃহহীন বৌদ্ধ সহজিয়া সাধক, তাই কবিতায় গোপন সাধন-তত্ত্বের পাশাপাশি সমাজের ছবি, দারিদ্র্যের বেদনা ও শ্রেণীবৈষম্যের প্রতিবাদ ফুটে উঠেছে। এই দুর্বোধ্য প্রতীকী ভাষাকে বলা হয় 'সন্ধ্যাভাষা'। কবিতাগুলো ছিল গীত/গান — প্রতিটির শুরুতে রাগ-রাগিণীর উল্লেখ আছে (যেমন রাগ পটমঞ্জরী, রাগ ভৈরবী)।\n\nচর্যাপদ রচিত হয় ৯৫০-১২০০ খ্রিস্টাব্দের মধ্যে। এর পরেই নেমে আসে দেড়শো বছরের অন্ধকার যুগ (১২০০-১৩৫০), যখন কোনো সাহিত্য রচিত হয়নি বলে জানা যায়। ১২০০-১২০৭ খ্রিস্টাব্দের মধ্যে বখতিয়ার খিলজি লক্ষ্মণ সেনকে পরাজিত করে বাঙলায় মুসলমান শাসনের সূচনা করেন।", "facts": [{"level": "must", "text": "চর্যাপদ আবিষ্কার করেন হরপ্রসাদ শাস্ত্রী, ১৯০৭ সালে নেপালের রাজদরবারের গ্রন্থাগার থেকে (সঙ্গে ডাকার্ণব ও দোহাকোষ)।"}, {"level": "must", "text": "হরপ্রসাদ শাস্ত্রী ১৯১৬ সালে গ্রন্থগুলো 'হাজার বছরের পুরাণ বাঙ্গালা ভাষায় বৌদ্ধ গান ও দোহা' নামে প্রকাশ করেন।"}, {"level": "must", "text": "চর্যাপদের ভাষা বাঙলা প্রমাণ করেন ডক্টর সুনীতিকুমার চট্টোপাধ্যায় (গ্রন্থ: বাঙলা ভাষার উৎপত্তি ও বিকাশ, ১৯২৬)।"}, {"level": "important", "text": "চর্যাপদে আছে ৪৬টি পূর্ণ কবিতা + ১টি খণ্ডিত পদ (মোট সাড়ে ছেচল্লিশ), রচয়িতা ২৪ জন বৌদ্ধ সহজিয়া কবি।"}, {"level": "important", "text": "সর্বাধিক পদ রচয়িতা কাহ্নপাদ (১২টি, অন্য নাম কৃষ্ণাচার্য); এরপর ভুসুকুপাদ (৬টি), সরহপাদ (৪টি)।"}, {"level": "important", "text": "চর্যাপদের কবিদের নামের শেষে 'পাদ' যুক্ত থাকে; দুর্বোধ্য প্রতীকী ভাষাকে বলা হয় 'সন্ধ্যাভাষা'।"}, {"level": "quick", "text": "চর্যাপদের অন্য নাম চর্যাচর্যবিনিশ্চয়; কবিতাগুলো গীত হতো, শুরুতে রাগের (যেমন পটমঞ্জরী, ভৈরবী) উল্লেখ থাকত।"}, {"level": "must", "text": "১২০০-১২০৭ খ্রিস্টাব্দের মধ্যে বখতিয়ার খিলজি লক্ষ্মণ সেনকে পরাজিত করে বাঙলায় মুসলমান শাসনের সূচনা করেন।"}, {"level": "trap", "text": "⚠️ পরীক্ষায় বিভ্রান্তি: চর্যাপদ আবিষ্কার (১৯০৭, হরপ্রসাদ শাস্ত্রী) বনাম বাঙলা ভাষা প্রমাণ (১৯২৬, সুনীতিকুমার চট্টোপাধ্যায়) — দুটি আলাদা ঘটনা, আলাদা ব্যক্তি।"}]}, {"id": 5, "title": "অন্ধকারে দেড়শো বছর", "page": "১৭-১৮", "reading": "চর্যাপদের পর, অর্থাৎ ১২০০ থেকে ১৩৫০ খ্রিস্টাব্দ পর্যন্ত, বাঙলা সাহিত্যে কোনো রচনার সন্ধান পাওয়া যায় না। এই সময়কেই বলা হয় 'অন্ধকার যুগ'। কেউ কেউ মনে করেন এ সময় মুসলমান বিজয়ের অত্যাচারে সাহিত্যচর্চা সম্ভব হয়নি, কিন্তু হুমায়ুন আজাদ এই যুক্তি মানতে নারাজ — কারণ দেড়শো বছর ধরে টানা রক্তপাত চলতে পারে না এবং মুসলমান রাজারা পরবর্তীকালে সাহিত্যে যথেষ্ট উৎসাহ দিয়েছেন। প্রকৃত কারণ সম্ভবত এই যে তখন কবিতা লেখা হতো না, মুখে মুখে গাওয়া হতো এবং সংরক্ষণের কোনো ব্যবস্থা ছিল না, তাই তা কালক্রমে হারিয়ে গেছে।\n\nকেউ কেউ মনে করেন চর্যাপদকে বাঙলা না ধরলে 'অন্ধকার যুগ' বলে কিছু থাকে না, বাঙলা সাহিত্য চতুর্দশ শতক থেকেই শুরু ধরা যায় — কিন্তু চর্যাপদ যেহেতু প্রমাণিতভাবে বাঙলা, তাই এই ফাঁকটি রহস্যই থেকে গেছে।", "facts": [{"level": "must", "text": "অন্ধকার যুগ: ১২০০-১৩৫০ খ্রিস্টাব্দ — এই সময়ের কোনো সাহিত্যকর্মের সন্ধান নেই।"}, {"level": "important", "text": "সম্ভাব্য কারণ: রচনা মুখে মুখে গীত হতো, লিখিত সংরক্ষণ ছিল না, তাই কালে হারিয়ে গেছে (নিশ্চিত কারণ জানা নেই)।"}, {"level": "quick", "text": "হুমায়ুন আজাদ মুসলমান আক্রমণকে একমাত্র কারণ মানতে রাজি নন, কারণ মুসলমান রাজারা পরে সাহিত্যে উৎসাহ দিয়েছেন।"}]}, {"id": 6, "title": "প্রদীপ জ্বললো আবার : মঙ্গলকাব্য", "page": "১৮-২১", "reading": "অন্ধকার যুগের পর, চতুর্দশ শতাব্দীর দ্বিতীয়ভাগ থেকে শুরু হয় মধ্যযুগ। এ যুগের প্রথম উল্লেখযোগ্য কাব্য শ্রীকৃষ্ণকীর্তন, রচয়িতা বড়ু চণ্ডীদাস — বাঙলা ভাষার প্রথম মহাকবি। এই কাব্যের পাণ্ডুলিপি ১৯০৯ সালে বাঁকুড়ার এক গৃহস্থের গোয়ালঘর থেকে উদ্ধার করেন বসন্তরঞ্জন রায় বিদ্বদ্বল্লভ। এর নায়ক-নায়িকা কৃষ্ণ ও রাধা।\n\nমধ্যযুগের সবচেয়ে বিখ্যাত কাব্যধারা 'মঙ্গলকাব্য' — প্রায় পাঁচশো বছর ধরে রচিত। প্রতিটি মঙ্গলকাব্যের মূল কাঠামো একরকম: স্বর্গের কোনো দেবতা শাপগ্রস্ত হয়ে মর্ত্যে জন্ম নেয়, নানা দুর্ভোগের পর দেবতার (যাঁর নামে কাব্য) পূজা প্রচার করে আবার স্বর্গে ফিরে যায়। দেবতার নাম অনুসারেই কাব্যের নাম হয় — চণ্ডীমঙ্গল, মনসামঙ্গল, ধর্মমঙ্গল, শিবমঙ্গল ইত্যাদি। মনসামঙ্গল লিখেছেন হরি দত্ত, নারায়ণ দেব, বিজয় গুপ্ত, বিপ্রদাস প্রমুখ। চণ্ডীমঙ্গল লিখেছেন মাণিক দত্ত, দ্বিজ মাধব, মুকুন্দরাম চক্রবর্তী, ভারতচন্দ্র রায় প্রমুখ। ধর্মমঙ্গল লিখেছেন ময়ূর ভট্ট, মাণিকরাম, রূপরাম, ঘনরাম প্রমুখ। চণ্ডীমঙ্গলের শ্রেষ্ঠ দুই কবি কবিকঙ্কণ মুকুন্দরাম চক্রবর্তী ও রায়গুণাকর ভারতচন্দ্র; মনসামঙ্গলের শ্রেষ্ঠ দুই কবি বিজয়গুপ্ত ও বংশীদাস। আধুনিক কবি সুধীন্দ্রনাথ দত্ত মধ্যযুগের পুনরাবৃত্তিমূলক প্রকৃতি নিয়ে বিরক্ত হয়ে বলেছিলেন, 'বাঙলা সাহিত্যে মধ্যযুগ অপাঠ্য' — যদিও মঙ্গলকাব্যে সেকালের সমাজজীবনের অমূল্য পরিচয় মেলে।", "facts": [{"level": "must", "text": "শ্রীকৃষ্ণকীর্তন কাব্যের রচয়িতা বড়ু চণ্ডীদাস — বাঙলা ভাষার প্রথম মহাকবি; নায়ক-নায়িকা কৃষ্ণ ও রাধা।"}, {"level": "must", "text": "শ্রীকৃষ্ণকীর্তন-এর পুঁথি ১৯০৯ সালে বাঁকুড়ার এক গৃহস্থের গোয়ালঘর থেকে উদ্ধার করেন বসন্তরঞ্জন রায় বিদ্বদ্বল্লভ।"}, {"level": "must", "text": "মনসামঙ্গলের কবি: হরি দত্ত, নারায়ণ দেব, বিজয় গুপ্ত, বিপ্রদাস। শ্রেষ্ঠ দুই কবি: বিজয়গুপ্ত ও বংশীদাস।"}, {"level": "must", "text": "চণ্ডীমঙ্গলের কবি: মাণিক দত্ত, দ্বিজ মাধব, মুকুন্দরাম চক্রবর্তী, ভারতচন্দ্র রায়। শ্রেষ্ঠ দুই কবি: মুকুন্দরাম চক্রবর্তী ও ভারতচন্দ্র রায়।"}, {"level": "important", "text": "ধর্মমঙ্গলের কবি: ময়ূর ভট্ট, মাণিকরাম, রূপরাম, সীতারাম, ঘনরাম।"}, {"level": "important", "text": "চণ্ডীমঙ্গলের দুই কাহিনি: কালকেতু-ফুল্লরা এবং ধনপতি-লহনা-খুল্লনা। মনসামঙ্গলের কাহিনি: বেহুলা-লখিন্দর।"}, {"level": "quick", "text": "সুধীন্দ্রনাথ দত্ত মন্তব্য করেছিলেন: 'বাঙলা সাহিত্যে মধ্যযুগ অপাঠ্য।'"}, {"level": "trap", "text": "⚠️ মনসামঙ্গল বনাম চণ্ডীমঙ্গলের শ্রেষ্ঠ কবিদের গুলিয়ে ফেলা সাধারণ ভুল — মনে রাখুন: চণ্ডী → মুকুন্দরাম/ভারতচন্দ্র, মনসা → বিজয়গুপ্ত/বংশীদাস।"}]}, {"id": 7, "title": "চণ্ডীমঙ্গলের সোনালি গল্প", "page": "২১-২৪", "reading": "চণ্ডীমঙ্গলের প্রথম কাহিনি কালকেতু-ফুল্লরার। স্বর্গের নীলাম্বর নামের এক দেবতা চণ্ডীর ষড়যন্ত্রে শাপগ্রস্ত হয়ে মর্ত্যে ব্যাধ কালকেতু রূপে জন্ম নেয়, তার স্ত্রী ছায়া হয় ফুল্লরা। চণ্ডীদেবী নানা কৌশলে কালকেতুকে বিপদে ফেলে শেষে সোনার গোধিকা রূপে ধরা দেন ও প্রচুর ধনসম্পদ দান করেন, বিনিময়ে চান পৃথিবীতে নিজের পূজা প্রচার। কালকেতু ধনী হয়ে গুজরাট নগর স্থাপন করে রাজা হয়, শত্রু ভাঁড়ুদত্তের চক্রান্তে যুদ্ধে পরাজিত ও বন্দি হয়, কিন্তু চণ্ডীর কৃপায় মুক্তি ও রাজ্য ফিরে পায়। এই কাহিনি রচনা করেন কবি মুকুন্দরাম চক্রবর্তী, যিনি তাঁর কাহিনির শুরুতে নিজের সংক্ষিপ্ত জীবনকথা বলেছেন — অত্যাচারী ডিহিদার মামুদ শরিফের অত্যাচারে গ্রাম ছেড়ে বহু জায়গা ঘুরে অবশেষে আরড়া গ্রামের জমিদার বাঁকুড়া রায়ের আশ্রয়ে স্থিত হন এবং তাঁর পুত্র রঘুনাথের গৃহশিক্ষক হয়ে চণ্ডীমঙ্গল রচনা করেন।", "facts": [{"level": "must", "text": "চণ্ডীমঙ্গলের প্রথম কাহিনি: কালকেতু-ফুল্লরা — রচয়িতা মুকুন্দরাম চক্রবর্তী।"}, {"level": "important", "text": "নীলাম্বর ও ছায়া নামের দুই দেবতা শাপগ্রস্ত হয়ে মর্ত্যে যথাক্রমে কালকেতু ও ফুল্লরা রূপে জন্ম নেন।"}, {"level": "important", "text": "কালকেতুর শত্রু ভাঁড়ুদত্ত কলিঙ্গরাজের সাহায্যে যুদ্ধ বাধায়; কালকেতু পরাজিত হয়ে বন্দি হন, পরে চণ্ডীর কৃপায় মুক্তি পান।"}, {"level": "quick", "text": "কালকেতুর রাজ্যের নাম গুজরাট নগর।"}]}, {"id": 8, "title": "মনসামঙ্গলের নীল দুঃখ", "page": "২৪-২৭", "reading": "মনসামঙ্গলের কেন্দ্রীয় কাহিনি চাঁদ সদাগর ও তাঁর পুত্র লখিন্দর-বেহুলার। স্বর্গচ্যুত চাঁদ সদাগর মর্ত্যে জন্ম নিয়ে শিবের ভক্ত হয়, কিন্তু সাপের দেবী মনসার পূজা বারবার প্রত্যাখ্যান করে। ক্ষুব্ধ মনসা তার বাণিজ্যতরী  দক্ষ কবি মনে করা হয় — আধুনিক কালে জন্মালে তিনি ঔপন্যাসিক হতেন বলে সমালোচকদের অভিমত।"}, {"level": "quick", "text": "মুকুন্দরামের চরিত্র: কালকেতু, ফুল্লরা, ধূর্ত বেনে মুরারি শীল, প্রতিপক্ষ ভাঁড়ুদত্ত।"}]}, {"id": 10, "title": "রায়গুণাকর ভারতচন্দ্র", "page": "৩০-৩২", "reading": "ভারতচন্দ্র রায়ের জন্ম আনুমানিক ১৭১২ খ্রিস্টাব্দে, বর্ধমানের (বর্তমান হাওড়া জেলা) পেঁড়ো-বসন্তপুর বা পাঁচুয়া গ্রামে; পিতা নরেন্দ্রনারায়ণ রায়। শৈশবে পারিবারিক জমিজমা হারিয়ে বহু ঘটনাবহুল জীবন কাটে — সংস্কৃত শেখা, চোদ্দ বছর বয়সে বিবাহ, ফারসি শেখা, বন্দিদশা থেকে পলায়ন, সন্ন্যাসজীবন — অবশেষে ফরাসডাঙ্গার ইন্দ্রনারায়ণ চৌধুরীর মাধ্যমে নদিয়ার রাজা কৃষ্ণচন্দ্রের সভাকবি নিযুক্ত হন। কৃষ্ণচন্দ্র তাঁকে 'রায়গুণাকর' উপাধি দেন। তাঁর একমাত্র কাব্য অন্নদামঙ্গল, যার তিনটি ভাগ: অন্নদামঙ্গল, বিদ্যাসুন্দর, ও ভবানন্দ-মানসিংহ কাহিনি। ভারতচন্দ্র রূপবর্ণনায়, বাক্‌পটুতায় ও চাতুর্যে অসাধারণ — 'মন্ত্রের সাধন কিংবা শরীর পাতন', 'নগর পুড়িলে দেবালয় কি এড়ায়' -র মতো তাঁর অনেক পংক্তি প্রবাদে পরিণত হয়েছে। তিনি মৃত্যুর তিন বছর আগে (১৭৫৭-এর কাছাকাছি) ইংরেজদের দেশ দখলের সাক্ষী হন।", "facts": [{"level": "must", "text": "ভারতচন্দ্র রায়ের উপাধি 'রায়গুণাকর' (দাতা: নদিয়ার রাজা কৃষ্ণচন্দ্র); কাব্য: অন্নদামঙ্গল (আনু. জন্ম ১৭১২ খ্রি.)।"}, {"level": "important", "text": "অন্নদামঙ্গল কাব্যের তিন ভাগ: অন্নদামঙ্গল, বিদ্যাসুন্দর, ভবানন্দ-মানসিংহ কাহিনি।"}, {"level": "quick", "text": "বিখ্যাত পঙক্তি: 'মন্ত্রের সাধন কিংবা শরীর পাতন', 'নগর পুড়িলে দেবালয় কি এড়ায়'।"}, {"level": "trap", "text": "⚠️ মুকুন্দরাম চক্রবর্তী ও ভারতচন্দ্র রায় উভয়েই চণ্ডীমঙ্গল ধারার কবি হলেও প্রায় দুইশ বছরের ব্যবধানে — মুকুন্দরাম ষোড়শ শতাব্দীর, ভারতচন্দ্র অষ্টাদশ শতাব্দীর কবি।"}]}, {"id": 11, "title": "উজ্জ্বলতম আলো : বৈষ্ণব পদাবলি", "page": "৩২-৩৭", "reading": "চতুর্দশ শতকের শেষভাগ থেকে রচিত হতে থাকে বৈষ্ণব পদাবলি — রাধা-কৃষ্ণের প্রেমকে কেন্দ্র করে রচিত ছোট ছোট গীতিকবিতা, যা মধ্যযুগের সবচেয়ে উজ্জ্বল সৃষ্টি। ১৪৮৬ সালে চৈতন্যদেবের জন্মের পর থেকে এসব কবিতায় বৈষ্ণব দর্শনের (রাধা=জীবাত্মা, কৃষ্ণ=পরমাত্মা) প্রভাব বাড়ে। ডক্টর দীনেশচন্দ্র সেন ১৬৫ জন বৈষ্ণব কবির নাম জানিয়েছেন। চার মহাকবি: বিদ্যাপতি (জন্ম আনু. ১৩৭৪), চণ্ডীদাস, জ্ঞানদাস, গোবিন্দদাস (১৫৩৪-১৬১৩)। বিদ্যাপতি ও গোবিন্দদাস লিখতেন কৃত্রিম মিশ্র ভাষা 'ব্রজবুলি'-তে, অলংকারবহুল রীতিতে; চণ্ডীদাস ও জ্ঞানদাস লিখতেন সহজ-সরল খাঁটি বাঙলায়, গভীর সহজাত আবেগে। বৈষ্ণব কবিতা পাঁচ রসে বিভক্ত — শান্ত, দাস্য, বাৎসল্য, সখ্য, মধুর। প্রথম বৈষ্ণব পদ সংকলনকারী বাবা আউল মনোহর দাস, তাঁর গ্রন্থ পদসমুদ্র-এ পনেরো হাজার পদ সংকলিত। পরে রাধামোহন ঠাকুরের পদামৃতসমুদ্র ও বৈষ্ণবদাসের পদকল্পতরু-ও উল্লেখযোগ্য সংকলন।", "facts": [{"level": "must", "text": "বৈষ্ণব পদাবলির চার মহাকবি: বিদ্যাপতি, চণ্ডীদাস, জ্ঞানদাস, গোবিন্দদাস।"}, {"level": "must", "text": "বিদ্যাপতি ও গোবিন্দদাস লিখতেন ব্রজবুলি ভাষায় (অলংকারবহুল); চণ্ডীদাস ও জ্ঞানদাস লিখতেন খাঁটি বাঙলায় (সহজ-সরল)।"}, {"level": "must", "text": "চৈতন্যদেবের জন্ম ১৪৮৬ খ্রিস্টাব্দে — এর পর থেকে বৈষ্ণব পদাবলিতে বৈষ্ণব দর্শনের প্রভাব বৃদ্ধি পায়।"}, {"level": "important", "text": "বৈষ্ণব দর্শনে রাধা = জীবাত্মা, কৃষ্ণ = পরমাত্মা; পাঁচ রস — শান্ত, দাস্য, বাৎসল্য, সখ্য, মধুর।"}, {"level": "important", "text": "প্রথম বৈষ্ণব পদ সংকলনকারী বাবা আউল মনোহর দাস, গ্রন্থ: পদসমুদ্র (পনেরো হাজার পদ)।"}, {"level": "quick", "text": "ডক্টর দীনেশচন্দ্র সেন ১৬৫ জন বৈষ্ণব কবির নাম জানিয়েছেন।"}, {"level": "trap", "text": "⚠️ বিদ্যাপতি মিথিলার (আজকের বিহার) কবি ও ব্রজবুলি ভাষায় লিখতেন, কিন্তু তবু তাঁকে বাঙলা কবিতার কবি গণ্য করা হয় কারণ তাঁর কবিতা বাঙালিদের দ্বারা গৃহীত ও চর্চিত।"}]}, {"id": 12, "title": "বিদ্যাপতি", "page": "৩৭-৩৯", "reading": "বিদ্যাপতি ছিলেন মিথিলার রাজা শিবসিংহের রাজসভার মহাকবি (পঞ্চদশ শতক)। যদিও তিনি বাঙলা ভাষায় একটি কবিতাও লেখেননি — লিখতেন ব্রজবুলি নামক মিশ্র ভাষায় (হিন্দি+বাঙলা+প্রাকৃত শব্দের মিশ্রণ) — তবু তাঁর কবিতা বাঙলা কবিতা হয়ে উঠেছে, কারণ বাঙলার পণ্ডিতরা মিথিলা থেকে জ্ঞানার্জন করে তাঁর কবিতা নিয়ে আসতেন। রাজা শিবসিংহ তাঁকে 'কবিকণ্ঠহার' উপাধি দেন। বাঙলায় রচিত অন্যান্য গ্রন্থ: পুরুষপরীক্ষা (সংস্কৃত), কীর্তিলতা, ভূপরিক্রমা। বিদ্যাপতি রূপক ও উপমার ব্যবহারে অসাধারণ দক্ষ — চণ্ডীদাসের মতো আবেগে ভেসে না গিয়ে তিনি ভাবকে সুসজ্জিত ভাষায় প্রকাশ করেন।", "facts": [{"level": "must", "text": "বিদ্যাপতি মিথিলার রাজা শিবসিংহের সভাকবি (পঞ্চদশ শতক), উপাধি 'কবিকণ্ঠহার'।"}, {"level": "must", "text": "বিদ্যাপতি একটিও কবিতা বাঙলা ভাষায় লেখেননি — লিখতেন ব্রজবুলি ভাষায়, তবু তাঁকে বাঙলার কবি গণ্য করা হয়।"}, {"level": "important", "text": "বিদ্যাপতির সংস্কৃত গ্রন্থ: পুরুষপরীক্ষা, কীর্তিলতা, ভূপরিক্রমা (ভূপরিক্রমা/গঙ্গাবাক্যাবলী)।"}]}, {"id": 13, "title": "চণ্ডীদাস", "page": "৩৮-৪১", "reading": "চণ্ডীদাস নামে বাঙলা সাহিত্যে একাধিক কবির কবিতা পাওয়া যায়, যা নিয়ে সৃষ্টি হয়েছে বিখ্যাত 'চণ্ডীদাস-সমস্যা'। আজকাল মনে করা হয় তিনজন চণ্ডীদাস আছেন: বড়ু চণ্ডীদাস (শ্রীকৃষ্ণকীর্তন-এর রচয়িতা, প্রথম মহাকবি), দ্বিজ চণ্ডীদাস (চতুর্দশ শতকের শেষভাগে বীরভূম জেলার নানুর গ্রামে জন্ম, বাশুলীদেবীর ভক্ত), এবং দীন চণ্ডীদাস। দ্বিজ চণ্ডীদাসের রাধা-বিষয়ক পদগুলো গভীর সহজাত আবেগে পূর্ণ, ভাষা সহজ-সরল অথচ গভীর। চৈতন্যদেব পাগলের মতো চণ্ডীদাসের পদাবলি জপ করতেন বলে কথিত আছে।", "facts": [{"level": "must", "text": "'চণ্ডীদাস-সমস্যা': বাঙলা সাহিত্যে তিনজন চণ্ডীদাস চিহ্নিত — বড়ু চণ্ডীদাস, দ্বিজ চণ্ডীদাস, দীন চণ্ডীদাস।"}, {"level": "must", "text": "বড়ু চণ্ডীদাস শ্রীকৃষ্ণকীর্তন-এর রচয়িতা ও বাঙলার প্রথম মহাকবি; দ্বিজ চণ্ডীদাস বীরভূমের নানুর গ্রামের, বাশুলীদেবীর ভক্ত।"}, {"level": "quick", "text": "চৈতন্যদেব চণ্ডীদাসের পদাবলি গভীর ভক্তিতে জপ করতেন বলে কথিত।"}, {"level": "trap", "text": "⚠️ পরীক্ষায় সাধারণ বিভ্রান্তি: 'শ্রীকৃষ্ণকীর্তন' লিখেছেন বড়ু চণ্ডীদাস, কিন্তু বৈষ্ণব পদাবলির চার মহাকবির তালিকায় উল্লেখিত 'চণ্ডীদাস' সাধারণত দ্বিজ চণ্ডীদাসকে বোঝানো হয়।"}]}, {"id": 14, "title": "চৈতন্য ও বৈষ্ণবজীবনী", "page": "৪০-৪৭", "reading": "শ্রীচৈতন্যদেব (১৪৮৬-১৫৩৩) নবদ্বীপে জন্মগ্রহণ করেন; পিতা জগন্নাথ মিশ্র, মাতা শচীদেবী। আসল নাম বিশ্বম্ভর, ডাকনাম নিমাই, গায়ের রঙের জন্য পরিচিত গৌরাঙ্গ/গোরা নামেও। গয়ায় ঈশ্বরপুরীর কাছে দীক্ষা নিয়ে তিনি বৈষ্ণব ধর্ম প্রচার শুরু করেন — 'সবার উপরে মানুষ সত্য' এই মানবিক বাণী প্রচার করে সমাজে জাগরণ আনেন। মাত্র ৪৮ বছর বয়সে ১৫৩৩ সালে পুরীতে তাঁর মৃত্যু হয়। তাঁর জীবনী নিয়ে রচিত গ্রন্থগুলো বাঙলা সাহিত্যের মূল্যবান সম্পদ: বৃন্দাবন দাসের চৈতন্যভাগবত (মৃত্যুর ১৫ বছরের মধ্যে রচিত), লোচন দাসের চৈতন্যমঙ্গল, এবং সবচেয়ে বিখ্যাত কৃষ্ণদাস কবিরাজের (১৫৩০-১৬১৫) চৈতন্যচরিতামৃত, যাতে জীবনীর সঙ্গে বৈষ্ণব দর্শনও ব্যাখ্যাত হয়েছে।", "facts": [{"level": "must", "text": "শ্রীচৈতন্যদেবের জন্ম ১৪৮৬, মৃত্যু ১৫৩৩ (৪৮ বছর বয়সে, পুরীতে); নবদ্বীপে জন্ম, পিতা জগন্নাথ মিশ্র, মাতা শচীদেবী; আসল নাম বিশ্বম্ভর/নিমাই।"}, {"level": "must", "text": "চৈতন্যজীবনী গ্রন্থ: বৃন্দাবন দাসের চৈতন্যভাগবত, লোচন দাসের চৈতন্যমঙ্গল, কৃষ্ণদাস কবিরাজের চৈতন্যচরিতামৃত।"}, {"level": "important", "text": "চৈতন্যদেব নিজে কোনো কবিতা লেখেননি, কিন্তু বাঙলা সাহিত্যে তাঁর প্রভাব অপরিসীম — 'সবার উপরে মানুষ সত্য' এই মানবিক বাণী প্রচার করেন।"}, {"level": "quick", "text": "চৈতন্যদেবের অন্য নাম: বিশ্বম্ভর, নিমাই, গৌরাঙ্গ/গোরা।"}]}, {"id": 15, "title": "দেবতার মতো দুজন এবং কয়েকজন অনুবাদক", "page": "৪২-৪৭", "reading": "মধ্যযুগে হিন্দু কবিরা রামায়ণ-মহাভারত অনুবাদ করেন — যদিও এগুলো ছিল প্রায়শই স্বাধীন পুনর্লিখন, নিছক অনুবাদ নয়। এই অনুবাদে মুসলমান সম্রাটরা প্রচুর উৎসাহ দিয়েছিলেন। রামায়ণের শ্রেষ্ঠ ও সবচেয়ে জনপ্রিয় অনুবাদক কৃত্তিবাস (পঞ্চদশ শতক), যিনি প্রেরণা ও পৃষ্ঠপোষকতা পান গৌড়ের রাজা রুকনুদ্দিন বারবক শাহের (১৪৫৯-৭৪) কাছ থেকে। তাঁর রামায়ণের অন্য নাম শ্রীরামপাঁচালী; জন্ম নদিয়ার ফুলিয়া গ্রামে, পিতা বনমালী। কৃত্তিবাসী রামায়ণ প্রথম মুদ্রিত হয় ১৮০২-০৩ সালে শ্রীরামপুরের পাদ্রিদের দ্বারা।\n\nমহাভারতের শ্রেষ্ঠ অনুবাদক কাশীরাম দাস (সপ্তদশ শতক, আনু. ১৬০২-১৬১০ সালে রচনা), যদিও তিনি প্রথম অনুবাদক নন — তার আগে পরাগল খানের অনুপ্রেরণায় কবীন্দ্র পরমেশ্বর এবং পরাগল খানের পুত্র ছুটি খানের অনুপ্রেরণায় শ্রীকর নন্দী মহাভারতের অংশবিশেষ অনুবাদ করেছিলেন। কাশীরাম নিজে সম্পূর্ণ মহাভারত শেষ করে যেতে পারেননি; তাঁর ভাইপো ও অন্যরা তা সম্পূর্ণ করেন। এছাড়া হিন্দুধর্মের পবিত্র গ্রন্থ ভাগবত অনুবাদ করেন মালাধর বসু, যিনি মুসলমান রাজার কাছ থেকে 'গুণরাজ খান' উপাধি পান — তাঁর অনুবাদের নাম শ্রীকৃষ্ণবিজয়।", "facts": [{"level": "must", "text": "রামায়ণের শ্রেষ্ঠ/প্রথম অনুবাদক কৃত্তিবাস (পঞ্চদশ শতক); পৃষ্ঠপোষক রাজা রুকনুদ্দিন বারবক শাহ (১৪৫৯-৭৪); অন্য নাম শ্রীরামপাঁচালী।"}, {"level": "must", "text": "মহাভারতের শ্রেষ্ঠ অনুবাদক কাশীরাম দাস (সপ্তদশ শতক, আনু. ১৬০২-১৬১০); তিনি প্রথম অনুবাদক নন, কাজ অসমাপ্ত রেখে যান, ভাইপো তা সম্পূর্ণ করেন।"}, {"level": "important", "text": "মহাভারতের প্রথম অনুবাদক শ্রীকর নন্দী, পৃষ্ঠপোষক ছুটি খান (পরাগল খানের পুত্র); এর আগে কবীন্দ্র পরমেশ্বরও (পরাগল খানের অনুপ্রেরণায়) আংশিক অনুবাদ করেন।"}, {"level": "important", "text": "ভাগবত অনুবাদ করেন মালাধর বসু, উপাধি 'গুণরাজ খান'; অনুবাদের নাম শ্রীকৃষ্ণবিজয়।"}, {"level": "quick", "text": "কৃত্তিবাসী রামায়ণ প্রথম মুদ্রিত হয় ১৮০২/১৮০৩ সালে শ্রীরামপুরের খ্রিস্টান পাদ্রিদের দ্বারা।"}, {"level": "trap", "text": "⚠️ 'প্রথম অনুবাদক' বনাম 'শ্রেষ্ঠ অনুবাদক' গুলিয়ে ফেলা ভুল: কৃত্তিবাস রামায়ণে প্রথম ও শ্রেষ্ঠ উভয়ই, কিন্তু কাশীরাম মহাভারতে শ্রেষ্ঠ হলেও প্রথম নন (শ্রীকর নন্দী প্রথম)।"}]}, {"id": 16, "title": "ভিন্ন প্রদীপ : মুসলমান কবিরা", "page": "৪৭-৫২", "reading": "বাঙলা ভাষায় প্রথম মুসলমান কবি শাহ মুহম্মদ সগীর, যিনি সুলতান গিয়াসউদ্দিন আজম শাহের রাজত্বকালে (চতুর্দশ শতকের শেষ/পঞ্চদশ শতকের প্রথম) ইউসুফ-জুলেখা কাব্য রচনা করেন। মুসলমান কবিরা দেবতার বদলে মানুষের গল্প (ইউসুফ-জুলেখা, লাইলি-মজনু) বলে নতুন ধারার সূচনা করেন, যদিও তাঁদের অধিকাংশ রচনাই ফারসি-হিন্দি-আরবি থেকে ভাবানুবাদ। ষোড়শ শতকের উল্লেখযোগ্য কবি: সাবিরিদ খান (বিদ্যাসুন্দর, হানিফা ও কয়রা পরী, রসুলবিজয়), মুহম্মদ কবির (মধুমালতী, শুরু ১৫৮৩), বাহরাম খান (লাইলি-মজনু), আফজল আলী (নসিহতনামা), শেখ ফয়জুল্লাহ (গাজিবিজয়, গোরক্ষবিজয়), জৈনুদ্দিন (রসুলবিজয়)। আবদুল হাকিম নিজেকে বাঙালি বলতে গর্ববোধ করতেন এবং যারা বাঙলা ভাষাকে ঘৃণা করত তাদের কড়া ভাষায় নিন্দা করেছেন তাঁর নূরনামা কাব্যে। আরাকান রাজদরবারে (সপ্তদশ শতক) বাঙলা সাহিত্যচর্চা হতো — সেখানকার কবি আলাওল, কাজী দৌলত (সতীময়না), মাগন ঠাকুর (চন্দ্রাবতী)। বাঙলার মুসলমান কবিদের রচনা সংগ্রহে বিশেষ অবদান রাখেন আবদুল করিম সাহিত্যবিশারদ (১৮৭১-১৯৫৩)।", "facts": [{"level": "must", "text": "বাঙলা ভাষায় প্রথম মুসলমান কবি শাহ মুহম্মদ সগীর, কাব্য ইউসুফ-জুলেখা; সুলতান গিয়াসউদ্দিন আজম শাহের রাজত্বকালে রচিত।"}, {"level": "important", "text": "আরাকান রাজদরবারের কবি: আলাওল, কাজী দৌলত (সতীময়না/লোরচন্দ্রানী), মাগন ঠাকুর (চন্দ্রাবতী) — সবাই সপ্তদশ শতকের।"}, {"level": "important", "text": "আবদুল হাকিম বাংলাভাষা-বিদ্বেষীদের নিন্দা করেন তাঁর নূরনামা কাব্যে।"}, {"level": "important", "text": "মুসলমান কবিদের পুঁথি সংগ্রহে অগ্রণী ভূমিকা রাখেন আবদুল করিম সাহিত্যবিশারদ (১৮৭১-১৯৫৩), চট্টগ্রামের অধিবাসী।"}, {"level": "quick", "text": "সাবিরিদ খান: বিদ্যাসুন্দর, হানিফা ও কয়রা পরী; বাহরাম খান: লাইলি-মজনু।"}]}, {"id": 17, "title": "আলাওল", "page": "৫২-৫৫", "reading": "আলাওল (আনু. ১৫৯৭-১৬৭৩) মধ্যযুগের মুসলমান কবিদের মধ্যে শ্রেষ্ঠ, সমগ্র বাঙলা সাহিত্যেরও অন্যতম বড় কবি। পিতা ফতেহাবাদ অঞ্চলের মজলিশ কুতুবের কর্মচারী ছিলেন; নৌকায় যাত্রাকালে পর্তুগিজ জলদস্যুদের আক্রমণে পিতার মৃত্যু হলে আলাওল আরাকানে আশ্রয় নেন এবং রাজার অশ্বারোহী বাহিনীতে যোগ দেন। সেখানে মাগন ঠাকুরের উৎসাহে কবিতা লেখা শুরু করেন। তাঁর শ্রেষ্ঠ কাব্য পদ্মাবতী (১৬৪৮), হিন্দি কবি মালিক মুহম্মদ জায়সির পদুমাবত অবলম্বনে রচিত। অন্যান্য কাব্য: সয়ফুলমুলুক-বদিউজ্জামাল (অসমাপ্ত, ফারসি থেকে), হপ্তপয়কর (ফারসি কবি নিজামীর রচনা অবলম্বনে), সেকেন্দারনামা, তোহফা। তিনি কাজী দৌলতের অসমাপ্ত সতীময়না কাব্যও সমাপ্ত করেন। শাহ সুজার সাথে সংশ্লিষ্টতার অভিযোগে পঞ্চাশ দিন বিনা বিচারে কারাবন্দি ছিলেন।", "facts": [{"level": "must", "text": "আলাওলের শ্রেষ্ঠ কাব্য পদ্মাবতী (১৬৪৮), হিন্দি কবি মালিক মুহম্মদ জায়সির পদুমাবত অবলম্বনে রচিত।"}, {"level": "important", "text": "আলাওল আরাকান রাজসভায় মাগন ঠাকুরের উৎসাহে কবি হয়ে ওঠেন; কাজী দৌলতের অসমাপ্ত সতীময়না কাব্য সমাপ্ত করেন।"}, {"level": "important", "text": "অন্যান্য কাব্য: সয়ফুলমুলুক-বদিউজ্জামাল, হপ্তপয়কর, সেকেন্দারনামা, তোহফা।"}, {"level": "quick", "text": "আলাওলের জন্ম আনু. ১৫৯৭, মৃত্যু আনু. ১৬৭৩; পিতা পর্তুগিজ জলদস্যুদের হাতে নিহত হন।"}]}, {"id": 18, "title": "লোকসাহিত্য : বুকের বাঁশরি", "page": "৫৫-৫৯", "reading": "লোকসাহিত্য হলো পল্লীর সাধারণ মানুষের মুখে মুখে বেঁচে থাকা সাহিত্য — ছড়া, প্রবাদ, গীতিকা, রূপকথা — যার রচয়িতার নাম প্রায়শই অজানা থেকে যায়। বাঙলার শ্রেষ্ঠ লোকসাহিত্য সংগ্রাহক চন্দ্রকুমার দে (১৮৮৯-১৯৪৬), ময়মনসিংহের অধিবাসী, যাঁর সংগৃহীত গীতিকাগুলো সম্পাদনা করে ডক্টর দীনেশচন্দ্র সেন ময়মনসিংহ গীতিকা (১৯২০) নামে প্রকাশ করেন। বিখ্যাত গীতিকা: মহুয়া, দেওয়ানা মদিনা, মলুয়া। রূপকথা সংগ্রাহক: দক্ষিণারঞ্জন মিত্রমজুমদার (ঠাকুরমার ঝুলি, ঠাকুরদাদার ঝুলি) ও উপেন্দ্রকিশোর রায়চৌধুরী (টুনটুনির বই)। রবীন্দ্রনাথও ছড়া সংগ্রহ করে লোকসাহিত্য নামক গ্রন্থ রচনা করেন। মহুয়া গীতিকায় বেদেকন্যা মহুয়া ও যুবক নদের চাঁদের করুণ প্রেমকাহিনি বর্ণিত, যেখানে হুমরা বেদের প্রতিহিংসায় উভয়েরই মৃত্যু হয়।", "facts": [{"level": "must", "text": "বাঙলার শ্রেষ্ঠ লোকসাহিত্য/গীতিকা সংগ্রাহক চন্দ্রকুমার দে (১৮৮৯-১৯৪৬); সম্পাদক ডক্টর দীনেশচন্দ্র সেন — গ্রন্থ ময়মনসিংহ গীতিকা (১৯২০)।"}, {"level": "important", "text": "বিখ্যাত গীতিকা: মহুয়া, দেওয়ানা মদিনা, মলুয়া — সবই ময়মনসিংহ অঞ্চল থেকে সংগৃহীত।"}, {"level": "important", "text": "রূপকথা সংগ্রাহক: দক্ষিণারঞ্জন মিত্রমজুমদার (ঠাকুরমার ঝুলি) ও উপেন্দ্রকিশোর রায়চৌধুরী (টুনটুনির বই)।"}, {"level": "quick", "text": "রবীন্দ্রনাথ ছড়া সংগ্রহ করে 'লোকসাহিত্য' নামে গ্রন্থ রচনা করেন।"}]}, {"id": 19, "title": "দ্বিতীয় অন্ধকার", "page": "৫৯-৬৩", "reading": "মধ্যযুগের অবসানে (১৭৬০-১৮৩০ সময়কালে) বাঙলা সাহিত্যে নেমে আসে দ্বিতীয় দফা পতনের ছায়া। ১৭৫৭ সালে পলাশীর যুদ্ধে স্বাধীনতা হারানোর পর ইংরেজরা শাসক হয়ে ওঠে, সমাজে নতুন ধনিক শ্রেণীর উদ্ভব হয় যাদের রুচি ছিল নিম্নমানের। এই সময়ের কবিদের বলা হতো 'কবিওয়ালা' বা মুসলমানদের ক্ষেত্রে 'শায়ের'। তাঁরা মঞ্চে দাঁড়িয়ে দুই দলে ভাগ হয়ে 'কবিগান' (চাপান-উতোর) করতেন। বিখ্যাত কবিওয়ালা: গোঁজলা গুই (প্রাচীনতম), রাম বসু (১৭৮৬-১৮২৮), অ্যান্টনি ফিরিঙ্গি (পর্তুগিজ বংশোদ্ভূত), নিধুবাবু/রামনিধি গুপ্ত (১৭৪১-১৮৩০, বিখ্যাত টপ্পাগান রচয়িতা), হরু ঠাকুর (১৭৪৯-১৮২৪)। মুসলমান সমাজে 'শায়ের'রা রচনা করতেন 'পুঁথিসাহিত্য' বা 'বটতলার পুঁথি' — আরবি-ফারসি শব্দবহুল রোমাঞ্চকর কাহিনি, যেমন গরীবুল্লাহ (ইউসুফ-জুলেখা, আমির হামজা) ও সৈয়দ হামজার রচনা। এই সময়ের একমাত্র উল্লেখযোগ্য সাহিত্যিক কবি ঈশ্বরচন্দ্র গুপ্ত (১৮১২-১৮৫৯), যিনি নিজেও এক সময় কবিওয়ালাদের দলে ছিলেন।", "facts": [{"level": "must", "text": "১৭৬০-১৮৩০ সময়কাল বাঙলা সাহিত্যের পতনের যুগ ('দ্বিতীয় অন্ধকার'); ১৭৫৭ সালে পলাশীর যুদ্ধে বাংলা স্বাধীনতা হারায়।"}, {"level": "must", "text": "এ যুগের কবিদের বলা হয় 'কবিওয়ালা' (হিন্দু) ও 'শায়ের' (মুসলমান); মঞ্চে কবিতা প্রতিযোগিতাকে বলে 'কবিগান' — প্রথম দলের বক্তব্য 'চাপান', জবাব 'উতোর'।"}, {"level": "important", "text": "বিখ্যাত কবিওয়ালা: রাম বসু, অ্যান্টনি ফিরিঙ্গি, নিধুবাবু (রামনিধি গুপ্ত, টপ্পাগান), হরু ঠাকুর, গোঁজলা গুই (প্রাচীনতম)।"}, {"level": "important", "text": "মুসলমান সমাজের 'শায়ের'দের রচনা 'পুঁথিসাহিত্য'/'বটতলার পুঁথি' নামে পরিচিত — প্রধান রচয়িতা ফকির গরীবুল্লাহ ও সৈয়দ হামজা।"}, {"level": "quick", "text": "ঈশ্বরচন্দ্র গুপ্ত (১৮১২-১৮৫৯) এ যুগের একমাত্র উল্লেখযোগ্য কবি, নিজেও কবিওয়ালাদের দলে ছিলেন।"}]}, {"id": 20, "title": "অভিনব আলোর ঝলক", "page": "৬৩-৬৪", "reading": "উনিশ শতক থেকে বাঙলা সাহিত্যের আধুনিক যুগের প্রকৃত সূচনা। এই শতকের সবচেয়ে বড় ঘটনা বাঙলা গদ্যের বিকাশ, যার সূচনা ১৮০০ সালে প্রতিষ্ঠিত ফোর্ট উইলিয়ম কলেজে। মুদ্রণযন্ত্রের প্রতিষ্ঠাও সাহিত্যে বৈচিত্র্য আনে। ঈশ্বরচন্দ্র বিদ্যাসাগর (১৮২০-১৮৯১) গদ্যসাহিত্যে বৈপ্লবিক অবদান রাখেন। প্যারীচাঁদ মিত্র (১৮১৪-১৮৮৩) রচনা করেন প্রথম উপন্যাস, কালীপ্রসন্ন সিংহ (১৮৪০-১৮৭০) ব্যঙ্গাত্মক রচনা লেখেন। কবিতায় নবযুগ আনেন মাইকেল মধুসূদন দত্ত (১৮২৪-১৮৭৩), যিনি বাঙলা ভাষায় প্রথম মহাকাব্য রচনা করেন এবং কবিতাকে সুরনির্ভরতা থেকে মুক্ত করে 'পাঠ্য' করে তোলেন, সৃষ্টি করেন অমিত্রাক্ষর ছন্দ। উপন্যাসে যথার্থ প্রতিষ্ঠা আসে বঙ্কিমচন্দ্র চট্টোপাধ্যায়ের (১৮৩৮-১৮৯৪) হাতে।", "facts": [{"level": "must", "text": "ফোর্ট উইলিয়ম কলেজ প্রতিষ্ঠিত হয় ১৮০০ খ্রিস্টাব্দে — বাঙলা গদ্যের সংগঠিত বিকাশের সূচনাবিন্দু।"}, {"level": "important", "text": "উনিশ শতকের অগ্রণী ব্যক্তিত্ব: বিদ্যাসাগর (গদ্য), প্যারীচাঁদ মিত্র (প্রথম উপন্যাস), মধুসূদন দত্ত (মহাকাব্য, অমিত্রাক্ষর ছন্দ), বঙ্কিমচন্দ্র (উপন্যাস)।"}]}, {"id": 21, "title": "গদ্য : নতুন সম্রাট", "page": "৬৪-৬৯", "reading": "বাঙলা গদ্যের প্রাচীনতম নমুনা মধ্যযুগের কিছু চম্পূকাব্য, দলিল ও চিঠিপত্রে (যেমন কোচবিহারের রাজা নরনারায়ণের ১৫৫৫ সালের চিঠি) পাওয়া যায়, তবে তা দুর্বোধ্য ও অপরিণত। ১৭৪৩ সালে পর্তুগাল থেকে রোমান হরফে তিনটি বাঙলা গদ্যগ্রন্থ ছাপা হয় — দোম আন্তোনিও ও পাদ্রি মনোএল দা আসসুম্পসাঁউ-এর রচনা। কিন্তু বাঙলা গদ্যের প্রকৃত জন্ম ফোর্ট উইলিয়ম কলেজে (স্থাপিত ৪ মে, ১৮০০)। এখানকার অধ্যক্ষ পাদ্রি উইলিয়ম কেরি (১৭৬১-১৮৩৪) ১৮০১ সালে যোগ দিয়ে পণ্ডিতদের সহায়তায় গদ্য বিকাশে মনোযোগ দেন। রামরাম বসুর প্রতাপাদিত্যচরিত্র (১৮০১) হলো ফোর্ট উইলিয়ম কলেজ থেকে প্রকাশিত প্রথম বাঙলা গদ্যগ্রন্থ। মৃত্যুঞ্জয় বিদ্যালঙ্কার সবচেয়ে বেশি বই লিখেছিলেন (বত্রিশ সিংহাসন, হিতোপদেশ, রাজাবলি, প্রবোধচন্দ্রিকা)। পরবর্তীতে বাঙলা প্রথম পত্রিকা প্রকাশ করে শ্রীরামপুরের মিশনারিরা — দিগ্দর্শন (১৮১৮)। বাঙালিদের প্রথম পত্রিকা বাঙ্গাল গেজেটি (১৮১৮)। সবচেয়ে প্রভাবশালী পত্রিকা সম্বাদ প্রভাকর, সম্পাদক ঈশ্বরচন্দ্র গুপ্ত (সাপ্তাহিক শুরু ১৮৩১, দৈনিক ১৮৩৯)।", "facts": [{"level": "must", "text": "ফোর্ট উইলিয়ম কলেজ প্রতিষ্ঠিত হয় ৪ মে ১৮০০ খ্রিস্টাব্দ; অধ্যক্ষ পাদ্রি উইলিয়ম কেরি (১৭৬১-১৮৩৪), যোগ দেন ১৮০১ সালে।"}, {"level": "must", "text": "ফোর্ট উইলিয়ম কলেজ থেকে প্রকাশিত প্রথম বাঙলা গদ্যগ্রন্থ রামরাম বসুর প্রতাপাদিত্যচরিত্র (১৮০১)।"}, {"level": "important", "text": "মৃত্যুঞ্জয় বিদ্যালঙ্কার (১৭৬২-১৮১৯) ফোর্ট উইলিয়ম কলেজের সবচেয়ে ফলপ্রসূ লেখক — বত্রিশ সিংহাসন, হিতোপদেশ, রাজাবলি, প্রবোধচন্দ্রিকা।"}, {"level": "important", "text": "বাঙলার প্রথম পত্রিকা (মিশনারি) দিগ্দর্শন (১৮১৮, শ্রীরামপুর); বাঙালিদের প্রথম পত্রিকা বাঙ্গাল গেজেটি (১৮১৮)।"}, {"level": "important", "text": "সবচেয়ে প্রভাবশালী পত্রিকা সম্বাদ প্রভাকর, সম্পাদক ঈশ্বরচন্দ্র গুপ্ত — সাপ্তাহিক শুরু ১৮৩১, দৈনিক ১৮৩৯।"}, {"level": "quick", "text": "১৭৪৩ সালে পর্তুগাল থেকে রোমান হরফে বাঙলা গদ্যগ্রন্থ ছাপা হয় (দোম আন্তোনিও, পাদ্রি মনোএল দা আসসুম্পসাঁউ)।"}, {"level": "trap", "text": "⚠️ 'প্রথম বাঙলা গদ্যগ্রন্থ' (আঠারো শতকের পর্তুগিজ প্রকাশনা) বনাম 'ফোর্ট উইলিয়ম কলেজের প্রথম গদ্যগ্রন্থ' (প্রতাপাদিত্যচরিত্র, ১৮০১) — দুটি ভিন্ন দাবি, প্রশ্নে সতর্ক থাকুন।"}]}, {"id": 22, "title": "গদ্যের জনক ও প্রধান পুরুষেরা", "page": "৬৯-৭৩", "reading": "রামমোহন রায় (১৭৭২-১৮৩৩) গদ্যকে পাঠ্যবইয়ের গণ্ডি ছাড়িয়ে তর্ক-বিতর্কের উপযোগী করে তোলেন (বেদান্ত গ্রন্থ, গৌড়ীয় ব্যাকরণ)। কিন্তু 'বাঙলা গদ্যের জনক' বলা হয় ঈশ্বরচন্দ্র বিদ্যাসাগরকে (১৮২০-১৮৯১, মেদিনীপুরের বীরসিংহ গ্রামে জন্ম, পিতা ঠাকুরদাস) — তিনিই প্রথম গদ্যের ছন্দ ও যতিচিহ্নের (দাঁড়ি, কমা) সুশৃঙ্খল ব্যবহার প্রবর্তন করেন। রবীন্দ্রনাথ বলেছিলেন বিদ্যাসাগর গদ্যকে সংস্কৃত দীর্ঘ সমাসের কবল থেকে মুক্তি দেন। তাঁর গ্রন্থ: বেতালপঞ্চবিংশতি (১৮৪৭), শকুন্তলা (১৮৫৪), সীতার বনবাস (১৮৬০), ভ্রান্তিবিলাস (১৮৬৯), বর্ণপরিচয় (১৮৫৪), বিধবাবিবাহ প্রচলিত হওয়া উচিত কিনা (১৮৫৫)। প্যারীচাঁদ মিত্র (ছদ্মনাম টেকচাঁদ ঠাকুর) কথ্যরীতিতে লেখেন আলালের ঘরের দুলাল (১৮৫৮); কালীপ্রসন্ন সিংহ (১৮৪০-১৮৭০) লেখেন হুতোম প্যাঁচার নকশা (১৮৬২) — এই দুজন বাঙলা চলতি গদ্যের অগ্রপথিক। পরবর্তীতে বঙ্কিমচন্দ্র, রবীন্দ্রনাথ, এবং প্রমথ চৌধুরী (১৮৬৮-১৯৪৬, চলতি গদ্যরীতির প্রধান প্রবক্তা, সবুজপত্র পত্রিকা) গদ্যকে পূর্ণতা দেন।", "facts": [{"level": "must", "text": "'বাঙলা গদ্যের জনক' ঈশ্বরচন্দ্র বিদ্যাসাগর (১৮২০-১৮৯১); জন্ম মেদিনীপুরের বীরসিংহ গ্রামে; গদ্যের ছন্দ ও যতিচিহ্নের প্রবর্তক।"}, {"level": "must", "text": "রামমোহন রায় (১৭৭২-১৮৩৩) গদ্যকে পাঠ্যবইয়ের সীমা ছাড়িয়ে তর্কবিতর্কের উপযোগী করেন — গ্রন্থ: বেদান্ত গ্রন্থ, গৌড়ীয় ব্যাকরণ।"}, {"level": "important", "text": "প্যারীচাঁদ মিত্র (ছদ্মনাম টেকচাঁদ ঠাকুর) ও কালীপ্রসন্ন সিংহ বাঙলা চলতি (কথ্য) গদ্যরীতির অগ্রপথিক — যথাক্রমে আলালের ঘরের দুলাল (১৮৫৮) ও হুতোম প্যাঁচার নকশা (১৮৬২)।"}, {"level": "important", "text": "চলতি গদ্যরীতির প্রধান প্রবক্তা প্রমথ চৌধুরী (১৮৬৮-১৯৪৬, ছদ্মনাম বীরবল), পত্রিকা সবুজপত্র (১৯১৪) — তাঁর প্রভাবেই রবীন্দ্রনাথ শেষজীবনে চলতি গদ্য লেখেন।"}, {"level": "quick", "text": "বিদ্যাসাগরের বর্ণপরিচয়-এর বিখ্যাত পঙক্তি: 'জল পড়ে, পাতা নড়ে।'"}, {"level": "trap", "text": "⚠️ রামমোহন রায় ও ঈশ্বরচন্দ্র বিদ্যাসাগর উভয়েই গদ্যের অগ্রপথিক, কিন্তু 'গদ্যের জনক' উপাধি একমাত্র বিদ্যাসাগরের জন্য প্রযোজ্য।"}]}, {"id": 23, "title": "কবিতা : অন্তর হ'তে আহরি বচন", "page": "৭৪-৭৯", "reading": "উনিশ শতকের প্রথমার্ধ ছিল গদ্যের রাজত্ব; কবিতায় আকাল চলছিল। এ সময়ের একমাত্র কবি ঈশ্বরচন্দ্র গুপ্ত (১৮২২-১৮৫৯), যাঁর কবিতা ছিল হালকা, ব্যঙ্গবিদ্রূপাত্মক। বাঙলা কবিতায় আধুনিকতা আনেন মাইকেল মধুসূদন দত্ত (১৮২৪-১৮৭৩) — বাঙলা ভাষার প্রথম মহাকাব্য মেঘনাদবধ কাব্য (১৮৬১) রচনা করেন, যার নায়ক রাবণ; তিনি সৃষ্টি করেন অমিত্রাক্ষর ছন্দ (প্রবহমাণ পয়ার), লেখেন প্রথম সনেট ('চতুর্দশপদী কবিতা')। তাঁর অন্যান্য কাব্য: তিলোত্তমাসম্ভবকাব্য (১৮৫৯), ব্রজাঙ্গনাকাব্য (১৮৬১), বীরাঙ্গনাকাব্য (১৮৬২)। মধুসূদন-পরবর্তী মহাকাব্যধারার কবি: হেমচন্দ্র বন্দ্যোপাধ্যায়, নবীনচন্দ্র সেন, কায়কোবাদ (মহাশ্মশান কাব্য, ১৯০৪)। বাঙলা কবিতার প্রথম রোম্যান্টিক কবি বিহারীলাল চক্রবর্তী (১৮৩৫-১৮৯৪), যাঁকে রবীন্দ্রনাথ বলেছেন বাঙলা কাব্যের 'ভোরের পাখি' — তাঁর শ্রেষ্ঠ কাব্য সারদামঙ্গল, বঙ্গসুন্দরী। বিহারীলালের পথ ধরে আসেন রবীন্দ্রনাথ।", "facts": [{"level": "must", "text": "মাইকেল মধুসূদন দত্ত (১৮২৪-১৮৭৩): বাঙলার প্রথম মহাকাব্য মেঘনাদবধ কাব্য (১৮৬১, নায়ক রাবণ); সৃষ্টি করেন অমিত্রাক্ষর ছন্দ ও প্রথম সনেট ('চতুর্দশপদী কবিতা')।"}, {"level": "important", "text": "মধুসূদনের অন্যান্য কাব্য: তিলোত্তমাসম্ভবকাব্য (১৮৫৯), ব্রজাঙ্গনাকাব্য (১৮৬১), বীরাঙ্গনাকাব্য (১৮৬২)।"}, {"level": "must", "text": "বাঙলা কবিতার প্রথম রোম্যান্টিক কবি বিহারীলাল চক্রবর্তী (১৮৩৫-১৮৯৪); রবীন্দ্রনাথ তাঁকে 'ভোরের পাখি' বলেছেন; শ্রেষ্ঠ কাব্য সারদামঙ্গল।"}, {"level": "important", "text": "মধুসূদন-পরবর্তী ছদ্ম-মহাকাব্যধারার কবি: হেমচন্দ্র বন্দ্যোপাধ্যায়, নবীনচন্দ্র সেন, কায়কোবাদ (মহাশ্মশান কাব্য, ১৯০৪)।"}, {"level": "quick", "text": "উনিশ শতকের প্রথমার্ধের একমাত্র উল্লেখযোগ্য কবি ঈশ্বরচন্দ্র গুপ্ত (১৮২২-১৮৫৯), হাস্যরসাত্মক ও ব্যঙ্গাত্মক রচনার জন্য পরিচিত।"}, {"level": "trap", "text": "⚠️ 'বাঙলার প্রথম মহাকাব্য' নিশ্চিতভাবে মেঘনাদবধ কাব্য — এর আগের দীর্ঘ কাব্য (যেমন অন্নদামঙ্গল) মহাকাব্য নয়, মঙ্গলকাব্য।"}]}, {"id": 24, "title": "উপন্যাস : মানুষের মহাকাব্য", "page": "৭৯-৮২", "reading": "বাঙলা ভাষার প্রথম উপন্যাস হিসেবে গণ্য প্যারীচাঁদ মিত্রের আলালের ঘরের দুলাল (১৮৫৮), যদিও হেনা ক্যাথরিন ম্যুলেন্স নামের এক বিদেশিনীর ফুলমণি ও করুণার বিবরণ (১৮৫২) কালানুক্রমে আগে প্রকাশিত হলেও তা ধর্মপ্রচারমূলক রচনা বলে উপন্যাসের মর্যাদা পায় না। বাঙলা ভাষায় প্রথম প্রকৃত (সার্থক) উপন্যাসিক বঙ্কিমচন্দ্র চট্টোপাধ্যায় (১৮৩৮-১৮৯৪, হুগলির কাঁঠালপাড়া গ্রামে জন্ম) — তিনি ভারতের প্রথম গ্র্যাজুয়েটদের একজন (১৮৫৮ সালে বিএ পাশ)। তাঁর প্রথম বাঙলা উপন্যাস দুর্গেশনন্দিনী (১৮৬৫)। ঐতিহাসিক-কাল্পনিক উপন্যাস: কপালকুণ্ডলা, চন্দ্রশেখর, আনন্দমঠ, দেবী চৌধুরানী; সামাজিক উপন্যাস: বিষবৃক্ষ, কৃষ্ণকান্তের উইল।", "facts": [{"level": "must", "text": "প্যারীচাঁদ মিত্রের আলালের ঘরের দুলাল (১৮৫৮) বাঙলা ভাষার প্রথম উপন্যাস হিসেবে গণ্য।"}, {"level": "important", "text": "হেনা ক্যাথরিন ম্যুলেন্সের ফুলমণি ও করুণার বিবরণ (১৮৫২) কালানুক্রমে আগে, কিন্তু ধর্মপ্রচারমূলক বলে উপন্যাসের মর্যাদা পায় না।"}, {"level": "must", "text": "বঙ্কিমচন্দ্র চট্টোপাধ্যায় (১৮৩৮-১৮৯৪) — প্রথম সার্থক ঔপন্যাসিক; প্রথম বাঙলা উপন্যাস দুর্গেশনন্দিনী (১৮৬৫); ভারতের প্রথম গ্র্যাজুয়েটদের একজন (১৮৫৮)।"}, {"level": "quick", "text": "বঙ্কিমের সামাজিক উপন্যাস: বিষবৃক্ষ, কৃষ্ণকান্তের উইল; ঐতিহাসিক: আনন্দমঠ, দেবী চৌধুরানী।"}, {"level": "trap", "text": "⚠️ 'প্রথম উপন্যাস' (আলালের ঘরের দুলাল) বনাম 'প্রথম সার্থক/যথার্থ উপন্যাসিক' (বঙ্কিমচন্দ্র) — দুটি ভিন্ন দাবি।"}]}, {"id": 25, "title": "নাটক : জীবনের বন্দনা", "page": "৮১-৮৭", "reading": "বাঙলায় প্রথম নাটক মঞ্চস্থ করেন রুশ পরিব্রাজক গেরাসিম লেবেদেফ (১৭৯৫, প্রহসন 'ডিসগাইস'-এর অনুবাদ)। প্রথম বাঙলা মৌলিক নাটক ভদ্রার্জুন (১৮৫২, তারাচরণ শিকদার); প্রথম ট্র্যাজেডি কীর্তিবিলাস (১৮৫২, যোগেন্দ্রচন্দ্র গুপ্ত)। নাটকে বৈপ্লবিক অবদান রাখেন মধুসূদন দত্ত — শর্মিষ্ঠা (১৮৫৯) বাঙলা ভাষার প্রথম প্রকৃত আধুনিক নাটক; তাঁর শ্রেষ্ঠ নাটক কৃষ্ণকুমারী (১৮৬১)। দীনবন্ধু মিত্র (১৮৩০-১৮৭৩) লেখেন নীলদর্পণ নাটক (১৮৬০), যা নীলকরদের অত্যাচারের বিরুদ্ধে যুগান্তকারী রচনা — এর ইংরেজি অনুবাদ করেন পাদ্রি লং ও মধুসূদন। উনিশ শতকের শেষভাগের নাট্যকার: জ্যোতিরিন্দ্রনাথ ঠাকুর (রবীন্দ্রনাথের দাদা), গিরিশচন্দ্র ঘোষ (পঁচাত্তরটি নাটক লিখেছিলেন — সর্বাধিক), দ্বিজেন্দ্রলাল রায়, ক্ষীরোদপ্রসাদ বিদ্যাবিনোদ (আলিবাবা, ১৮৯৭)।", "facts": [{"level": "must", "text": "বাঙলায় প্রথম নাটক মঞ্চস্থ করেন রুশ পরিব্রাজক গেরাসিম লেবেদেফ (১৭৯৫, প্রহসন 'ডিসগাইস')।"}, {"level": "must", "text": "প্রথম বাঙলা মৌলিক নাটক ভদ্রার্জুন (১৮৫২, তারাচরণ শিকদার); প্রথম ট্র্যাজেডি কীর্তিবিলাস (১৮৫২, যোগেন্দ্রচন্দ্র গুপ্ত)।"}, {"level": "must", "text": "মধুসূদন দত্তের শর্মিষ্ঠা (১৮৫৯) বাঙলা ভাষার প্রথম প্রকৃত আধুনিক নাটক; শ্রেষ্ঠ নাটক কৃষ্ণকুমারী (১৮৬১, ট্র্যাজেডি)।"}, {"level": "must", "text": "দীনবন্ধু মিত্রের (১৮৩০-১৮৭৩) নীলদর্পণ নাটক (১৮৬০) নীলকরদের অত্যাচারের বিরুদ্ধে বিপ্লবী রচনা; ইংরেজি অনুবাদক পাদ্রি লং ও মধুসূদন।"}, {"level": "quick", "text": "গিরিশচন্দ্র ঘোষ পঁচাত্তরটি নাটক রচনা করেন — বাঙলা সাহিত্যে একক নাট্যকারের সর্বাধিক নাটক।"}, {"level": "trap", "text": "⚠️ 'প্রথম মঞ্চস্থ নাটক' (লেবেদেফ, ১৭৯৫, অনূদিত) বনাম 'প্রথম মৌলিক নাটক' (তারাচরণ শিকদারের ভদ্রার্জুন, ১৮৫২) — গুলিয়ে ফেলা সাধারণ ভুল।"}]}, {"id": 26, "title": "রবীন্দ্রনাথ : প্রতিদিনের সূর্য", "page": "৮৬-৯১", "reading": "রবীন্দ্রনাথ ঠাকুর (৭ মে ১৮৬১ – ৭ আগস্ট ১৯৪১) জোড়াসাঁকো ঠাকুরবাড়িতে জন্মগ্রহণ করেন; পিতা দেবেন্দ্রনাথ ঠাকুর, মাতা সারদা দেবী; পিতামাতার চতুর্দশ সন্তান। তাঁর প্রথম প্রকাশিত বই কাব্যগ্রন্থ বনফুল (১৮৭৮-এর দুই বছর আগে লেখা); প্রথম প্রকাশিত ('ছাপা হওয়া') বই কবিকাহিনী (১৮৭৮)। ১৯১৩ সালে গীতাঞ্জলি কাব্যের জন্য তিনি এশীয়দের মধ্যে সর্বপ্রথম নোবেল পুরস্কার লাভ করেন। তাঁর সাহিত্যকর্ম বিস্তৃত — কবিতা, ছোটগল্প, উপন্যাস, নাটক, প্রবন্ধ, গান, ভ্রমণকাহিনি সবক্ষেত্রেই তিনি অসামান্য। উল্লেখযোগ্য কাব্য: মানসী, সোনার তরী, চিত্রা, ক্ষণিকা, গীতাঞ্জলি (১৯১০), বলাকা, পুনশ্চ। উপন্যাস: চোখের বালি (১৯০৩, আধুনিক উপন্যাসের সূচনা), গোরা (১৯১০), ঘরে বাইরে (১৯১৬), শেষের কবিতা (১৯২৯)। জীবনীগ্রন্থ: জীবনস্মৃতি, ছেলেবেলা। তাঁর মৃত্যু হয় অস্ত্রোপচারের পর, ১৩৪৮ বঙ্গাব্দের ২২ শ্রাবণ।", "facts": [{"level": "must", "text": "রবীন্দ্রনাথ ঠাকুরের জন্ম ৭ মে ১৮৬১ (২৫ বৈশাখ), মৃত্যু ৭ আগস্ট ১৯৪১ (২২ শ্রাবণ); জোড়াসাঁকো ঠাকুরবাড়িতে জন্ম; পিতা দেবেন্দ্রনাথ ঠাকুর, মাতা সারদা দেবী।"}, {"level": "must", "text": "রবীন্দ্রনাথ ১৯১৩ সালে গীতাঞ্জলি কাব্যের জন্য এশীয়দের মধ্যে সর্বপ্রথম নোবেল পুরস্কার লাভ করেন।"}, {"level": "must", "text": "রবীন্দ্রনাথের প্রথম রচিত (অপ্রকাশিত পূর্বতন) কাব্যগ্রন্থ বনফুল; প্রথম প্রকাশিত/মুদ্রিত বই কবিকাহিনী (১৮৭৮)।"}, {"level": "important", "text": "চোখের বালি (১৯০৩) থেকে বাঙলা উপন্যাসের আধুনিক যুগের সূচনা ধরা হয়; অন্যান্য উপন্যাস: গোরা (১৯১০), ঘরে বাইরে (১৯১৬), শেষের কবিতা (১৯২৯)।"}, {"level": "important", "text": "আত্মজীবনীমূলক গ্রন্থ: জীবনস্মৃতি (১৯১২), ছেলেবেলা (১৯৪০)।"}, {"level": "quick", "text": "রবীন্দ্রনাথ ছিলেন পিতামাতার চতুর্দশ সন্তান।"}]}, {"id": 27, "title": "বিশশতকের আলো : আধুনিকতা", "page": "৯১-১০৫", "reading": "বিশ শতকের তৃতীয় দশকের মাঝামাঝি বাঙলা কবিতায় দেখা দেয় 'আধুনিক কবিতা' — রবীন্দ্র-রোম্যান্টিকতার বিপরীতে জটিল, নগরকেন্দ্রিক, ক্লান্তি-অবিশ্বাস-নৈরাশ্যের কবিতা। পাঁচজন প্রধান আধুনিক কবি: বুদ্ধদেব বসু (১৯০৮-১৯৭৪), জীবনানন্দ দাশ (১৮৯৯-১৯৫৪, সবচেয়ে জনপ্রিয়/অনেকের মতে শ্রেষ্ঠ; রবীন্দ্রনাথ বলেছিলেন 'চিত্ররূপময়'; কাব্য: ঝরাপালক, ধূসর পাণ্ডুলিপি, বনলতা সেন, রূপসী বাংলা), সুধীন্দ্রনাথ দত্ত (১৯০১-১৯৬০, দুরূহতম কবি), বিষ্ণু দে (১৯০৯-১৯৮২, একমাত্র স্পষ্ট রাজনীতিক দর্শন-সাম্যবাদ), অমিয় চক্রবর্তী (১৯০১-১৯৮৬)। এঁদের আগে সেতুবন্ধকারী কবি কাজী নজরুল ইসলাম (১৮৯৯-১৯৭৬, 'বিদ্রোহী কবি'), মোহিতলাল মজুমদার, যতীন্দ্রনাথ সেনগুপ্ত এবং পল্লীকবি জসীমউদ্‌দীন (১৯০৩-১৯৭৬, নকশী কাঁথার মাঠ)। কল্লোল (১৯২৩), কালি-কলম (১৯২৬), প্রগতি (১৯২৭) পত্রিকাগুলো আধুনিক সাহিত্যের বিকাশে গুরুত্বপূর্ণ ভূমিকা রাখে।\n\nউপন্যাসে বিশ শতকের ছয় শ্রেষ্ঠ পুরুষ: বঙ্কিমচন্দ্র ও শরৎচন্দ্র চট্টোপাধ্যায় (১৮৭৬-১৯৩৮, সবচেয়ে জনপ্রিয় ঔপন্যাসিক, দেবদাস, শ্রীকান্ত), তারাশঙ্কর (১৮৯৮-১৯৭১, গণদেবতা), বিভূতিভূষণ (১৮৯৪-১৯৫০, পথের পাঁচালী) ও মানিক বন্দ্যোপাধ্যায় (১৯০৮-১৯৫৬, পদ্মানদীর মাঝি) — তিন বন্দ্যোপাধ্যায়, এবং রবীন্দ্রনাথ ঠাকুর। গদ্যশিল্পী অবনীন্দ্রনাথ ঠাকুর ও প্রমথ চৌধুরী রবীন্দ্রনাথের আত্মীয় ছিলেন এবং স্বতন্ত্র গদ্যশৈলীর জন্য স্মরণীয়। নাটকে বিশ শতকে রবীন্দ্রনাথ ছাড়া তেমন বড় প্রতিভা দেখা যায়নি; পরবর্তীতে বুদ্ধদেব বসু কিছু সাহিত্যিক নাটক লেখেন।", "facts": [{"level": "must", "text": "আধুনিক কবিতার পাঁচ প্রধান কবি (রবীন্দ্র-পরবর্তী): বুদ্ধদেব বসু, জীবনানন্দ দাশ, সুধীন্দ্রনাথ দত্ত, বিষ্ণু দে, অমিয় চক্রবর্তী।"}, {"level": "must", "text": "জীবনানন্দ দাশ (১৮৯৯-১৯৫৪) আধুনিকদের মধ্যে সবচেয়ে জনপ্রিয়; রবীন্দ্রনাথ তাঁকে বলেছিলেন 'চিত্ররূপময়' কবি; শ্রেষ্ঠ কাব্য বনলতা সেন।"}, {"level": "important", "text": "কাজী নজরুল ইসলাম (১৮৯৯-১৯৭৬) 'বিদ্রোহী কবি' নামে পরিচিত, রবীন্দ্র-যুগ ও আধুনিক যুগের মাঝামাঝি সময়ের কবি।"}, {"level": "important", "text": "বিশ শতকের ছয় শ্রেষ্ঠ ঔপন্যাসিক: বঙ্কিমচন্দ্র চট্টোপাধ্যায়, শরৎচন্দ্র চট্টোপাধ্যায় (দুই চট্টোপাধ্যায়), তারাশঙ্কর, বিভূতিভূষণ, মানিক বন্দ্যোপাধ্যায় (তিন বন্দ্যোপাধ্যায়), রবীন্দ্রনাথ ঠাকুর।"}, {"level": "important", "text": "বিভূতিভূষণ বন্দ্যোপাধ্যায়ের পথের পাঁচালী (১৯২৯) তাঁকে অমরত্ব দিয়েছে; মানিক বন্দ্যোপাধ্যায়ের পদ্মানদীর মাঝি (১৯৩৬)।"}, {"level": "quick", "text": "আধুনিক কবিতার বিকাশে গুরুত্বপূর্ণ পত্রিকা: কল্লোল (১৯২৩), কালি-কলম (১৯২৬), প্রগতি (১৯২৭)।"}, {"level": "quick", "text": "সুকান্ত ভট্টাচার্য (১৯২৬-১৯৪৭) মাত্র একুশ বছর বয়সে মারা যান — বাঙলা ভাষায় মার্কসীয় ধারার শ্রেষ্ঠ কবি বলা হয় তাঁকে।"}, {"level": "trap", "text": "⚠️ পাঁচ আধুনিক কবির নাম মুখস্থ করার সহজ উপায়: 'জী-সু-বি-অ-বু' (জীবনানন্দ, সুধীন্দ্রনাথ, বিষ্ণু দে, অমিয় চক্রবর্তী, বুদ্ধদেব বসু)। নজরুলকে এই পাঁচজনের তালিকায় রাখা ভুল।"}]}], "flashcards": [{"chapter": 1, "front": "বাঙলা সাহিত্যের প্রথম বইয়ের নাম কী?", "back": "চর্যাপদ। রচনাকাল ৯৫০-১২০০ খ্রিস্টাব্দ।", "id": "fc001"}, {"chapter": 1, "front": "১৮০০ সালের আগে বাঙলা সাহিত্যে কী ছিল না বললেই চলে?", "back": "গদ্য। তখন সবকিছু রচিত হতো কবিতা বা পদ্যে।", "id": "fc002"}, {"chapter": 2, "front": "নৃতাত্ত্বিকদের মতে বাঙালির আদি পূর্বপুরুষ কারা?", "back": "সিংহলের ভেড্ডারা।", "id": "fc003"}, {"chapter": 2, "front": "বাঙালির রক্তে মিশ্রিত জাতিধারাগুলোর ক্রম বলো।", "back": "ভেড্ডা → মঙ্গোলীয় → ইন্দো-আর্য → শক → আরব/পারস্য।", "id": "fc004"}, {"chapter": 2, "front": "'বাঙ্গালা/বাঙলা' নামের উৎপত্তি সম্পর্কে আবুল ফজল কী বলেছেন?", "back": "'বঙ্গ' শব্দের সাথে 'আল' (বাঁধ) শব্দ যুক্ত হয়ে এই নাম হয়েছে।", "id": "fc005"}, {"chapter": 2, "front": "বাঙলা ভাষার তিনটি স্তর ও তাদের সময়কাল বলো।", "back": "প্রাচীন যুগ (৯৫০-১২০০), মধ্যযুগ (১৩৫০-১৮০০), আধুনিক যুগ (১৮০০-বর্তমান)।", "id": "fc006"}, {"chapter": 2, "front": "বাঙলা ভাষার বিবর্তনক্রম কী?", "back": "প্রাচীন ভারতীয় আর্যভাষা → পালি → প্রাকৃত → বাঙলা।", "id": "fc007"}, {"chapter": 2, "front": "বাংলাদেশ কবে স্বাধীন হয়?", "back": "১৯৭১ সালে। এর আগে ১৯৪৭-এ ভারত বিভাগের পর <script id="app-script">
(function(){
"use strict";
var C = window.CONTENT;

/* ============ STORAGE / STATE ============ */
var STORE_KEY = "lndp_state_v2";
function todayStr(d){ d=d||new Date(); return d.toISOString().slice(0,10); }
function defaultState(){
  return {
    version:2,
    chapterProgress:{},         // chId -> {read:true, readAt, percentDone}
    cardSRS:{},                 // cardId -> {ease, interval(days), due(dateStr), reps, lapses, mastery(0-100)}
    quizHistory:[],             // {id,date,mode,chapterId,score,total,timeSec,answers:[{qid,correct}]}
    mistakes:{},                // qid -> {count, lastWrongDate, mastered:false, chapterId}
    bookmarks:{},               // key("type:id") -> true
    notes:{},                   // key -> text
    settings:{theme:"light", fontScale:1, lineHeight:1.85, contentWidth:720, focusMode:false},
    studyTime:0,                // seconds total
    streak:{current:0, longest:0, lastDate:null, days:{}}, // days: dateStr-> seconds studied
    lastPosition:{view:"dashboard", chapterId:1},
    recallLog:{},               // cardId -> {knew,partial,forgot counts}
    xp:0,
    createdAt: todayStr(),
  };
}
var state = null;
function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw){ state = defaultState(); saveState(); return; }
    var parsed = JSON.parse(raw);
    // shallow-merge defaults for any missing keys (future-proofing)
    var def = defaultState();
    for(var k in def){ if(!(k in parsed)) parsed[k]=def[k]; }
    state = parsed;
  }catch(e){
    console.error("state load failed, resetting", e);
    state = defaultState();
  }
}
var saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ console.error("save failed",e); }
  }, 150);
}

/* ============ SRS (lightweight SM-2 variant) ============ */
function ensureCard(id){
  if(!state.cardSRS[id]){
    state.cardSRS[id] = {ease:2.3, interval:0, due:todayStr(), reps:0, lapses:0, mastery:0};
  }
  return state.cardSRS[id];
}
function addDays(dateStr, days){
  var d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+Math.round(days));
  return todayStr(d);
}
function gradeCard(id, grade){ // grade: 'again'|'hard'|'good'|'easy'
  var c = ensureCard(id);
  c.reps++;
  if(grade==="again"){
    c.lapses++; c.interval=0; c.ease=Math.max(1.3, c.ease-0.2);
    c.due = todayStr(); c.mastery=Math.max(0,c.mastery-20);
  } else {
    if(grade==="hard"){ c.ease=Math.max(1.3,c.ease-0.15); c.interval=Math.max(1,c.interval*1.2); c.mastery=Math.min(100,c.mastery+8);}
    else if(grade==="good"){ c.interval = c.interval<1? 1 : (c.interval<6? 6 : c.interval*c.ease); c.mastery=Math.min(100,c.mastery+18);}
    else if(grade==="easy"){ c.ease=Math.min(3.2,c.ease+0.15); c.interval = c.interval<1? 4 : (c.interval<6? 10: c.interval*c.ease*1.3); c.mastery=Math.min(100,c.mastery+28);}
    c.due = addDays(todayStr(), c.interval);
  }
  saveState();
}
function cardBucket(id){
  var c = state.cardSRS[id];
  if(!c || c.reps===0) return "new";
  if(c.due <= todayStr()) return "due";
  var days = (new Date(c.due) - new Date(todayStr()))/86400000;
  if(days<=3) return "soon";
  if(c.mastery>=85) return "mastered";
  return "later";
}

/* ============ STUDY TIME / STREAK TRACKING ============ */
var sessionStart = Date.now();
function tickStudyTime(sec){
  state.studyTime += sec;
  var t = todayStr();
  state.streak.days[t] = (state.streak.days[t]||0) + sec;
  updateStreak();
  saveState();
}
function updateStreak(){
  var t = todayStr();
  var y = addDays(t,-1);
  if(state.streak.lastDate===t) { /* already counted today */ }
  else if(state.streak.lastDate===y){ state.streak.current++; state.streak.lastDate=t; }
  else if(state.streak.lastDate===null){ state.streak.current=1; state.streak.lastDate=t; }
  else { state.streak.current=1; state.streak.lastDate=t; }
  if(state.streak.current > state.streak.longest) state.streak.longest = state.streak.current;
}
setInterval(function(){ tickStudyTime(20); }, 20000);

/* ============ MISTAKES ============ */
function recordAnswer(qid, correct, chapterId){
  if(!correct){
    if(!state.mistakes[qid]) state.mistakes[qid] = {count:0, mastered:false, chapterId:chapterId};
    state.mistakes[qid].count++;
    state.mistakes[qid].lastWrongDate = todayStr();
    state.mistakes[qid].mastered=false;
  } else if(state.mistakes[qid]){
    // correct answer on a previously-mistaken question -> track toward mastery
    state.mistakes[qid].correctStreak = (state.mistakes[qid].correctStreak||0)+1;
    if(state.mistakes[qid].correctStreak>=2) state.mistakes[qid].mastered = true;
  }
  saveState();
}

function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t;} return a; }
function byId(arr,id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function chapterById(id){ for(var i=0;i<C.chapters.length;i++) if(C.chapters[i].id===id) return C.chapters[i]; return null; }
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* ============ DERIVED STATS ============ */
function allFacts(){
  var out=[];
  C.chapters.forEach(function(ch){ ch.facts.forEach(function(f,idx){ out.push({chapterId:ch.id, chapterTitle:ch.title, level:f.level, text:f.text, key:"f:"+ch.id+":"+idx}); }); });
  return out;
}
function chapterCompletion(){
  var total = C.chapters.length;
  var done=0; C.chapters.forEach(function(ch){ if(state.chapterProgress[ch.id] && state.chapterProgress[ch.id].read) done++; });
  return {done:done, total:total, pct: total? (done/total*100):0};
}
function quizStats(){
  var totalQ=0, correctQ=0;
  state.quizHistory.forEach(function(h){ totalQ+=h.total; correctQ+=h.score; });
  return {attempted:totalQ, correct:correctQ, accuracy: totalQ? (correctQ/totalQ*100):0};
}
function chapterAccuracy(chId){
  var t=0,c=0;
  state.quizHistory.forEach(function(h){
    if(h.chapterId===chId || h.mode==="mixed" || h.mode==="mock"){
      (h.answers||[]).forEach(function(a){
        if(a.chapterId===chId){ t++; if(a.correct) c++; }
      });
    }
  });
  return t? {t:t,c:c,pct:c/t*100} : {t:0,c:0,pct:null};
}
function masteryLabel(pct){
  if(pct==null) return {label:"অধ্যয়ন হয়নি", cls:"muted"};
  if(pct<40) return {label:"দুর্বল", cls:"", color:"var(--red)"};
  if(pct<70) return {label:"বিকাশমান", cls:"", color:"var(--amber)"};
  if(pct<85) return {label:"ভালো", cls:"", color:"var(--nil)"};
  if(pct<95) return {label:"শক্তিশালী", cls:"", color:"var(--green)"};
  return {label:"আয়ত্তে এসেছে", cls:"", color:"var(--gold)"};
}
function dueCardsCount(){
  var bins={red:0,orange:0,yellow:0,green:0};
  C.flashcards.forEach(function(fc){
    var b = cardBucket(fc.id);
    if(b==="due") bins.red++;
    else if(b==="soon") bins.orange++;
    else if(b==="new"||b==="later") bins.yellow++;
    else if(b==="mastered") bins.green++;
  });
  return bins;
}
function weakChapters(n){
  var list = C.chapters.map(function(ch){
    var a = chapterAccuracy(ch.id);
    return {chapter:ch, acc:a.pct, attempted:a.t};
  }).filter(function(x){ return x.attempted>0; });
  list.sort(function(a,b){ return a.acc-b.acc; });
  return list.slice(0, n||3);
}
function mistakeList(){
  var out=[];
  for(var qid in state.mistakes){
    if(!state.mistakes[qid].mastered){
      var q = byId(C.questions, qid);
      if(q) out.push({q:q, meta:state.mistakes[qid]});
    }
  }
  return out;
}

var learnQueue = []; var learnIdx = 0; var learnFlipped=false;
VIEW_RENDERERS.learn = function(root, params){
  params = params || currentParams;
  var chId = params.chapterId;
  var pool = chId? C.flashcards.filter(function(f){return f.chapter===chId;}) : C.flashcards;
  if(!learnQueue.length || params.reset){
    // prioritize due/new cards
    learnQueue = shuffle(pool).sort(function(a,b){
      var order={due:0,new:1,later:2,soon:3,mastered:4};
      return order[cardBucket(a.id)]-order[cardBucket(b.id)];
    });
    learnIdx=0;
  }
  renderLearnCard(root);
};
function renderLearnCard(root){
  root.innerHTML="";
  if(!learnQueue.length){ root.appendChild(el("div","empty-state","<div class='emoji'>🗂️</div>কোনো ফ্ল্যাশকার্ড পাওয়া যায়নি।")); return; }
  if(learnIdx>=learnQueue.length){
    root.innerHTML = "<div class='empty-state'><div class='emoji'>🎉</div><h3>সব কার্ড শেষ!</h3><p class='muted'>আপনি এই সেশনে "+learnQueue.length+"টি কার্ড পর্যালোচনা করেছেন।</p><button class='btn btn-primary' id='again'>আবার শুরু করুন</button></div>";
    $("#again").onclick=function(){ navigate("learn",{reset:true}); };
    return;
  }
  var fc = learnQueue[learnIdx];
  var ch = chapterById(fc.chapter);
  var html = "<div class='flex-between mb-14'><div class='small muted'>কার্ড "+(learnIdx+1)+" / "+learnQueue.length+" · "+escapeHtml(ch?ch.title:"")+"</div>"+
    "<button class='btn btn-sm' id='bmCard'>"+(isBookmarked("flashcard",fc.id)?"🔖":"🔖 বুকমার্ক")+"</button></div>";
  html += "<div class='progress-track mb-14'><div class='progress-fill' style='width:"+(learnIdx/learnQueue.length*100)+"%'></div></div>";
  html += "<div class='flip-card-wrap'><div class='flip-card' id='flipCard'>"+
    "<div class='flip-face front'><div class='flip-front-text'>"+escapeHtml(fc.front)+"</div><div class='flip-hint'>উত্তর দেখতে ক্লিক করুন</div></div>"+
    "</div></div>";
  html += "<div id='srsArea'></div>";
  root.innerHTML = html;
  learnFlipped=false;
  $("#flipCard").onclick=function(){ flipLearnCard(root, fc); };
  $("#bmCard").onclick=function(){ toggleBookmark("flashcard",fc.id,fc.front); renderLearnCard(root); };
}
function flipLearnCard(root, fc){
  if(learnFlipped) return;
  learnFlipped=true;
  var card = $("#flipCard");
  card.innerHTML = "<div class='flip-face back'><div><div class='flip-back-text'>"+escapeHtml(fc.back)+"</div></div></div>";
  var srsHtml = "<div class='srs-btns'>"+
    "<button class='srs-btn srs-again' data-g='again'>আবার<br><span class='small'>ভুলে গেছি</span></button>"+
    "<button class='srs-btn srs-hard' data-g='hard'>কঠিন</button>"+
    "<button class='srs-btn srs-good' data-g='good'>ভালো</button>"+
    "<button class='srs-btn srs-easy' data-g='easy'>সহজ</button>"+
    "</div>";

}

  html += "<button class='btn btn-primary mt-20' id='revealBtn'>উত্তর প্রকাশ করুন</button>";
  html += "<div id='answerArea' class='mt-20'></div></div>";

      "<button class='btn srs-again' data-r='forgot'>❌ ভুলে গিয়েছিলাম</button></div>";

/* ============ QUIZ ENGINE ============ */
var quizState = null; // {questions, idx, answers:[], mode, chapterId, startTime}
function startQuiz(opts){
  var pool;
  if(opts.mode==="chapter") pool = C.questions.filter(function(q){return q.chapter===opts.chapterId;});
  else if(opts.mode==="mixed") pool = C.questions.slice();
  else if(opts.mode==="weak"){
    var weak = weakChapters(5).map(function(w){return w.chapter.id;});
    pool = C.questions.filter(function(q){ return weak.indexOf(q.chapter)>-1; });
    if(pool.length<5) pool = C.questions.slice();
  }
  else if(opts.mode==="rapid") pool = C.questions.filter(function(q){return q.difficulty==="easy"||q.difficulty==="medium";});
  else if(opts.mode==="revision"){
    var dueIds = C.flashcards.filter(function(f){ return cardBucket(f.id)==="due"||cardBucket(f.id)==="soon"; }).map(function(f){return f.chapter;});
    pool = C.questions.filter(function(q){ return dueIds.indexOf(q.chapter)>-1; });
    if(pool.length<5) pool = C.questions.slice();
  }
  else if(opts.mode==="mock") pool = C.questions.slice();
  else pool = C.questions.slice();

  pool = shuffle(pool);
  var n = opts.count || Math.min(pool.length, opts.mode==="mock"? (opts.count||25) : 10);
  var qs = pool.slice(0,n).map(function(q){
    var opts2 = q.options.map(function(o,i){return {text:o, origIdx:i};});
    opts2 = shuffle(opts2);
    return {q:q, shuffledOptions:opts2, marked:false, selected:null, answered:false};
  });
  quizState = {
    id:"quiz_"+Date.now(), questions:qs, idx:0, mode:opts.mode, chapterId:opts.chapterId,
    startTime:Date.now(), timeLimitSec: opts.timeLimitSec||null, finished:false,
    rapid: opts.mode==="rapid"
  };
}

VIEW_RENDERERS.quiz = function(root, params){
  params = params || currentParams;
  if(!quizState || quizState.finished){
    renderQuizSetup(root, params);
  } else {
    renderQuizQuestion(root);
  }
};

function renderQuizSetup(root, params){
  var chId = params.chapterId;
  var ch = chId? chapterById(chId) : null;
  var html = "<div class='card'><h3>কুইজ মোড বেছে নিন</h3>";
  html += "<div class='grid grid-3 mt-14'>";
  var modes = [
    {id:"chapter", label:"অধ্যায় কুইজ", desc:(ch?ch.title:"একটি অধ্যায় বেছে নিন")},
    {id:"mixed", label:"মিশ্র কুইজ", desc:"পুরো বই থেকে"},
    {id:"weak", label:"দুর্বল ক্ষেত্র কুইজ", desc:"আপনার দুর্বল টপিক থেকে"},
    {id:"rapid", label:"র‍্যাপিড ফায়ার", desc:"দ্রুত সহজ-মাঝারি প্রশ্ন"},
    {id:"revision", label:"রিভিশন কুইজ", desc:"যেসব কার্ড রিভিশন বাকি"},
  ];
  modes.forEach(function(m){
    html += "<button class='card' style='text-align:left;cursor:pointer' data-mode='"+m.id+"'><div style='font-weight:700'>"+m.label+"</div><div class='small muted mt-8'>"+escapeHtml(m.desc)+"</div></button>";
  });
  html += "</div></div>";
  if(!ch){
    html += "<div class='card mt-14'><h3>অথবা একটি নির্দিষ্ট অধ্যায় বেছে নিন</h3><select id='chSelect' style='width:100%'><option value=''>— অধ্যায় নির্বাচন করুন —</option>";
    C.chapters.forEach(function(c){ html += "<option value='"+c.id+"'>অধ্যায় "+c.id+": "+escapeHtml(c.title)+"</option>"; });
    html += "</select></div>";
  }
  root.innerHTML = html;
  $all("[data-mode]",root).forEach(function(b){
    b.onclick=function(){
      var mode = b.getAttribute("data-mode");
      var selChId = ch? ch.id : (($("#chSelect")&&$("#chSelect").value)? parseInt($("#chSelect").value):null);
      if(mode==="chapter" && !selChId){ toast("দয়া করে একটি অধ্যায় নির্বাচন করুন"); return; }
      startQuiz({mode:mode, chapterId:selChId, count: mode==="rapid"?15:10});
      renderView();
    };
  });
}

function renderQuizQuestion(root){
  var qs = quizState;
  var cur = qs.questions[qs.idx];
  var q = cur.q;
  var ch = chapterById(q.chapter);
  var html = "<div class='quiz-progress'><div class='small muted'>প্রশ্ন "+(qs.idx+1)+" / "+qs.questions.length+"</div>"+
    "<div class='progress-track' style='flex:1'><div class='progress-fill' style='width:"+((qs.idx)/qs.questions.length*100)+"%'></div></div>"+
    "<span class='tag'>"+difficultyIcon(q.difficulty)+" "+q.difficulty+"</span></div>";
  html += "<div class='small muted mb-8'>"+escapeHtml(ch?ch.title:"")+"</div>";
  html += "<div class='quiz-q'>"+escapeHtml(q.prompt)+"</div>";
  html += "<div class='opt-list' id='optList'>";
  var keys=["ক","খ","গ","ঘ","ঙ","চ"];
  cur.shuffledOptions.forEach(function(o,i){
    html += "<button class='opt' data-i='"+i+"'><span class='optkey'>"+keys[i]+"</span><span>"+escapeHtml(o.text)+"</span></button>";
  });
  html += "</div><div id='explainArea'></div>";
  html += "<div class='flex-between mt-20'><button class='btn' id='quitQuiz'>কুইজ থেকে বের হন</button><button class='btn btn-primary' id='nextQ' style='display:none'>"+(qs.idx===qs.questions.length-1?"ফলাফল দেখুন":"পরবর্তী প্রশ্ন")+"</button></div>";
  root.innerHTML = html;

  if(cur.answered){ showAnswerState(root, cur, q); }

  $all("#optList .opt",root).forEach(function(b){
    b.onclick=function(){
      if(cur.answered) return;
      var i = parseInt(b.getAttribute("data-i"));
      cur.selected = i; cur.answered = true;
      var correctOrigIdx = q.answer;
      var chosenOrigIdx = cur.shuffledOptions[i].origIdx;
      cur.correct = (chosenOrigIdx === correctOrigIdx);
      recordAnswer(q.id, cur.correct, q.chapter);
      showAnswerState(root, cur, q);
    };
  });
  $("#quitQuiz").onclick=function(){ if(confirm("এই কুইজ থেকে বের হতে চান? অগ্রগতি সংরক্ষিত হবে না।")){ quizState=null; navigate("quiz"); } };
}
function showAnswerState(root, cur, q){
  var keys=["ক","খ","গ","ঘ","ঙ","চ"];
  $all("#optList .opt",root).forEach(function(b,i){
    b.classList.add("selected");
    var origIdx = cur.shuffledOptions[i].origIdx;
    if(origIdx===q.answer) b.classList.add("correct");
    else if(i===cur.selected) b.classList.add("incorrect");
  });
  $("#explainArea").innerHTML = "<div class='explain-box'><strong>"+(cur.correct?"✅ সঠিক!":"❌ ভুল উত্তর।")+"</strong><br>"+escapeHtml(q.explanation)+"<div class='small muted mt-8'>উৎস: অধ্যায় "+q.chapter+"</div></div>";
  $("#nextQ").style.display="";
  $("#nextQ").onclick=function(){
    quizState.idx++;
    if(quizState.idx>=quizState.questions.length){ finishQuiz(); }
    else renderView();
  };
}
function finishQuiz(){
  var qs = quizState;
  var score=0; var answers=[];
  qs.questions.forEach(function(cur){
    if(cur.correct) score++;
    answers.push({qid:cur.q.id, correct:!!cur.correct, chapterId:cur.q.chapter});
  });
  var timeSec = Math.round((Date.now()-qs.startTime)/1000);
  state.quizHistory.push({id:qs.id, date:todayStr(), mode:qs.mode, chapterId:qs.chapterId, score:score, total:qs.questions.length, timeSec:timeSec, answers:answers});
  tickStudyTime(timeSec);
  qs.finished = true;
  saveState();
  renderQuizResult();
}
function renderQuizResult(){
  var root = $("#viewRoot");
  var qs = quizState;
  var score=0; qs.questions.forEach(function(c){ if(c.correct) score++; });
  var pct = Math.round(score/qs.questions.length*100);
  var wrong = qs.questions.filter(function(c){return !c.correct;});
  var html = "<div class='card center' style='padding:36px 20px;'>";
  html += "<div style='font-size:44px'>"+(pct>=80?"🏆":pct>=50?"👍":"📚")+"</div>";
  html += "<h2>"+score+" / "+qs.questions.length+" সঠিক ("+pct+"%)</h2>";
  html += "<div class='muted small'>সময় লেগেছে: "+Math.round((Date.now()-qs.startTime)/1000)+" সেকেন্ড</div>";
  html += "<div class='flex gap-8 mt-20' style='justify-content:center'>";
  html += "<button class='btn btn-primary' id='retryQuiz'>আবার চেষ্টা করুন</button>";
  html += "<button class='btn' id='backDash'>ড্যাশবোর্ডে ফিরুন</button></div></div>";
  if(wrong.length){
    html += "<div class='card mt-14'><h3>পর্যালোচনা প্রয়োজন ("+wrong.length+"টি)</h3>";
    wrong.forEach(function(c){
      html += "<div class='mt-14' style='padding-bottom:12px;border-bottom:1px solid var(--line)'><div style='font-weight:600'>"+escapeHtml(c.q.prompt)+"</div><div class='small mt-8'>সঠিক উত্তর: "+escapeHtml(c.q.options[c.q.answer])+"</div><div class='small muted'>"+escapeHtml(c.q.explanation)+"</div></div>";
    });
    html += "</div>";
  }
  root.innerHTML = html;
  $("#retryQuiz").onclick=function(){ var mode=qs.mode, chId=qs.chapterId; quizState=null; startQuiz({mode:mode, chapterId:chId, count:qs.questions.length}); renderView(); };
  $("#backDash").onclick=function(){ quizState=null; navigate("dashboard"); };
}

/* ============ REVISION QUEUE ============ */
VIEW_RENDERERS.revision = function(root){
  var bins = {red:[],orange:[],yellow:[],green:[]};
  C.flashcards.forEach(function(fc){
    var b = cardBucket(fc.id);
    if(b==="due") bins.red.push(fc);
    else if(b==="soon") bins.orange.push(fc);
    else if(b==="new"||b==="later") bins.yellow.push(fc);
    else bins.green.push(fc);
  });
  var html = "<div class='card'><h3>স্মার্ট রিভিশন সারি</h3><p class='muted small'>যেসব তথ্য আপনি বারবার ভুলে যাচ্ছেন তা অগ্রাধিকার পাবে।</p>";
  html += "<div class='grid grid-4 mt-14'>";
  html += revisionBox("🔴 এখনই জরুরি", bins.red.length, "due");
  html += revisionBox("🟠 আজকের মধ্যে", bins.orange.length, "soon");
  html += revisionBox("🟡 শীঘ্রই আসছে", bins.yellow.length, "new");
  html += revisionBox("🟢 আয়ত্তে এসেছে", bins.green.length, "mastered");
