<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Literature — Interactive Study &amp; Revision System</title>
<style>
:root{
  --ink:#1B2A4A;
  --ink-2:#233457;
  --paper:#F3ECDA;
  --paper-2:#EAE0C7;
  --paper-3:#DFD3B2;
  --text:#2A2620;
  --text-dim:#5B5647;
  --brass:#AD8548;
  --brass-2:#8E6C36;
  --crimson:#8B3A3A;
  --green:#3F6B4F;
  --blue-soft:#41628A;
  --shadow: 0 2px 10px rgba(27,42,74,0.10);
  --radius: 3px;
  --serif: Georgia, 'Noto Serif Bengali', 'Palatino Linotype', 'Book Antiqua', serif;
  --sans: 'Segoe UI', 'Noto Sans Bengali', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Consolas', 'SF Mono', 'Courier New', monospace;
}
[data-theme="dark"]{
  --ink:#EAE0C7;
  --ink-2:#F3ECDA;
  --paper:#141821;
  --paper-2:#1B212C;
  --paper-3:#262E3B;
  --text:#E7E2D3;
  --text-dim:#A7A18E;
  --brass:#D3A85C;
  --brass-2:#E9C077;
  --crimson:#D97A7A;
  --green:#7FBE97;
  --blue-soft:#8FB2DD;
  --shadow: 0 2px 14px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--text);
  font-family:var(--sans);
  line-height:1.55;
  min-height:100vh;
  transition:background .25s ease,color .25s ease;
}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
.hidden{display:none !important;}
::selection{background:var(--brass);color:var(--paper);}

/* ---------- Layout shell ---------- */
#shell{display:flex;min-height:100vh;}
#sidebar{
  width:230px;flex-shrink:0;background:var(--ink);color:var(--paper);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
[data-theme="dark"] #sidebar{background:#0D1016;}
.brand{
  padding:22px 18px 14px;border-bottom:1px solid rgba(243,236,218,0.15);
}
.brand .quill{font-size:22px;display:block;margin-bottom:6px;color:var(--brass-2);}
.brand h1{font-family:var(--serif);font-size:17px;margin:0 0 2px;letter-spacing:.3px;line-height:1.25;}
.brand p{margin:0;font-size:11px;opacity:.65;font-style:italic;}
nav.mainnav{padding:10px 8px;flex:1;}
nav.mainnav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;color:var(--paper);opacity:.82;
  padding:9px 10px;border-radius:var(--radius);font-size:13.5px;margin-bottom:2px;
}
nav.mainnav button .ic{width:18px;text-align:center;flex-shrink:0;}
nav.mainnav button:hover{background:rgba(243,236,218,0.08);opacity:1;}
nav.mainnav button.active{background:rgba(173,133,72,0.28);opacity:1;font-weight:600;box-shadow:inset 3px 0 0 var(--brass-2);}
nav.mainnav .navgroup-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;opacity:.5;padding:14px 10px 4px;}
.sidebar-foot{padding:12px;border-top:1px solid rgba(243,236,218,0.15);font-size:11px;opacity:.6;}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  display:flex;align-items:center;gap:12px;padding:12px 22px;
  background:var(--paper-2);border-bottom:1px solid var(--paper-3);position:sticky;top:0;z-index:20;
}
#topbar .searchwrap{flex:1;max-width:420px;position:relative;}
#topbar input[type=search]{
  width:100%;padding:8px 12px 8px 30px;border-radius:20px;border:1px solid var(--paper-3);
  background:var(--paper);color:var(--text);font-size:13px;
}
#topbar .searchwrap .sic{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.55;font-size:13px;}
#topbar .spacer{flex:1;}
.iconbtn{
  background:var(--paper);border:1px solid var(--paper-3);border-radius:var(--radius);
  padding:7px 11px;font-size:13px;color:var(--text);white-space:nowrap;
}
.iconbtn:hover{border-color:var(--brass);}
.iconbtn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.iconbtn.primary:hover{background:var(--ink-2);}
#content{padding:24px 26px 60px;max-width:1180px;width:100%;margin:0 auto;}

/* ---------- Typography helpers ---------- */
h1.pagetitle{font-family:var(--serif);font-size:26px;margin:0 0 4px;}
.pagesub{color:var(--text-dim);font-size:13.5px;margin:0 0 22px;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--brass-2);font-weight:700;margin-bottom:4px;}

/* ---------- Cards / grid ---------- */
.card{background:var(--paper-2);border:1px solid var(--paper-3);border-radius:var(--radius);padding:16px 18px;}
.grid{display:grid;gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}#sidebar{position:fixed;left:-230px;z-index:50;transition:left .2s;}#sidebar.open{left:0;}#menubtn{display:inline-flex !important;}}

.stat{padding:14px 16px;}
.stat .num{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ink);}
[data-theme="dark"] .stat .num{color:var(--ink-2);}
.stat .lbl{font-size:11.5px;color:var(--text-dim);margin-top:2px;text-transform:uppercase;letter-spacing:.6px;}
.stat.accent .num{color:var(--brass-2);}
.stat.warn .num{color:var(--crimson);}
.stat.good .num{color:var(--green);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);
  border:1px solid var(--paper-3);background:var(--paper);color:var(--text);font-size:13px;font-weight:600;
}
.btn:hover{border-color:var(--brass);}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.primary:hover{background:var(--ink-2);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--crimson);border-color:var(--crimson);background:transparent;}
.btn.danger:hover{background:var(--crimson);color:#fff;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- Topic list ---------- */
.topic-row{
  display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--paper-2);
  border:1px solid var(--paper-3);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;
}
.topic-row:hover{border-color:var(--brass);}
.topic-row .ttitle{font-weight:700;font-size:14.5px;flex:1;}
.topic-row .tmeta{font-size:12px;color:var(--text-dim);}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;letter-spacing:.3px;}
.badge.weak{background:rgba(139,58,58,.15);color:var(--crimson);}
.badge.dev{background:rgba(173,133,72,.18);color:var(--brass-2);}
.badge.strong{background:rgba(63,107,79,.16);color:var(--green);}
.badge.mastered{background:rgba(63,107,79,.28);color:var(--green);}
.bar{height:6px;border-radius:4px;background:var(--paper-3);overflow:hidden;width:90px;flex-shrink:0;}
.bar > div{height:100%;background:var(--brass);}

/* ---------- Question card ---------- */
.qcard{background:var(--paper-2);border:1px solid var(--paper-3);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:11.5px;color:var(--text-dim);}
.tag{background:var(--paper);border:1px solid var(--paper-3);padding:2px 8px;border-radius:10px;}
.qtext{font-size:16px;font-family:var(--serif);margin:6px 0 14px;line-height:1.5;white-space:pre-line;}
.opt{
  display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--paper-3);
  border-radius:var(--radius);margin-bottom:8px;background:var(--paper);font-size:14px;
}
.opt:hover{border-color:var(--brass);}
.opt .oletter{font-weight:700;color:var(--brass-2);width:16px;flex-shrink:0;}
.opt.selected{border-color:var(--blue-soft);background:rgba(65,98,138,.09);}
.opt.correct{border-color:var(--green);background:rgba(63,107,79,.14);}
.opt.wrong{border-color:var(--crimson);background:rgba(139,58,58,.13);}
.opt.disabled{cursor:default;}
.opt:not(.disabled){cursor:pointer;}
.expl{background:var(--paper);border-left:3px solid var(--brass);padding:12px 14px;border-radius:0 var(--radius) var(--radius) 0;font-size:13.5px;margin-top:10px;white-space:pre-line;}
.expl .lbl{font-weight:700;color:var(--brass-2);display:block;margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;}
.sourceline{font-size:11px;color:var(--text-dim);margin-top:10px;font-style:italic;}
.actionrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.statuschip{font-size:11px;padding:4px 9px;border-radius:10px;border:1px solid var(--paper-3);cursor:pointer;background:var(--paper);}
.statuschip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.notebox{margin-top:12px;}
.notebox textarea{width:100%;min-height:56px;background:var(--paper);border:1px solid var(--paper-3);border-radius:var(--radius);padding:8px 10px;color:var(--text);font-family:var(--sans);font-size:12.5px;}
.notebox .nlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin-bottom:3px;display:block;}

/* ---------- Misc ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty .big{font-size:34px;margin-bottom:8px;}
.section-title{font-family:var(--serif);font-size:19px;margin:26px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--paper-3);}
.section-title:first-child{margin-top:0;}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.filterbar select, .filterbar input{padding:7px 10px;border-radius:var(--radius);border:1px solid var(--paper-3);background:var(--paper-2);color:var(--text);font-size:12.5px;}
.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.pill{padding:5px 12px;border-radius:14px;background:var(--paper-2);border:1px solid var(--paper-3);font-size:12px;}
.pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
mark{background:rgba(173,133,72,.4);color:inherit;border-radius:2px;padding:0 2px;}
.kbd{font-family:var(--mono);font-size:10.5px;background:var(--paper-3);padding:1px 6px;border-radius:3px;}
.modalbg{position:fixed;inset:0;background:rgba(20,24,33,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--paper);border-radius:6px;max-width:480px;width:100%;padding:24px;box-shadow:var(--shadow);}
.modal h3{font-family:var(--serif);margin-top:0;}
.progresswrap{margin:14px 0;}
.progresswrap .barbg{height:9px;border-radius:6px;background:var(--paper-3);overflow:hidden;}
.progresswrap .barbg > div{height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-2));}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:6px;font-size:13px;z-index:200;box-shadow:var(--shadow);}
#menubtn{display:none;background:none;border:none;font-size:18px;color:var(--text);}
.small{font-size:12px;color:var(--text-dim);}
.flex{display:flex;align-items:center;gap:8px;}
.flex.between{justify-content:space-between;}
.mapnode{border:1px solid var(--paper-3);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;background:var(--paper-2);}
.mapnode h4{margin:0 0 6px;font-family:var(--serif);font-size:15px;}
.mapnode .authors{display:flex;flex-wrap:wrap;gap:6px;}
.chiplink{background:var(--paper);border:1px solid var(--paper-3);padding:4px 10px;border-radius:12px;font-size:12px;}
.chiplink:hover{border-color:var(--brass);}
kbd.shortkey{background:var(--paper-3);border-radius:3px;padding:1px 5px;font-family:var(--mono);font-size:11px;}
</style>
</head>

on"}, {"id": "d", "text": "personification"}], "correct": "b", "expl": "Metaphor-দুটি ভিন্ন বস্তুর মধ্যে তুলনা, যেখানে as, like উহ্য থাকে। যেমন-She is a moon. Simile-দুটি ভিন্ন বস্তুর মধ্যে তুলনা, যা as, like ইত্যাদি দ্বারা নির্দিষ্ট করে বোঝানো হয়। যেমন-She is like the moon.", "page": 209}, {"id": "q8", "chapter": "Chapter 1: Literary Terms", "section": "1.2 Expression", "exam": "33rd BCS", "q": "If a part of a speech or writing breaks the theme it is called-", "options": [{"id": "a", "text": "pomposity"}, {"id": "b", "text": "digression"}, {"id": "c", "text": "exaggeration"}, {"id": "d", "text": "anti-climax"}], "correct": "b", "expl": "যদি কোনো বক্তব্য বা লেখা মূলভাব থেকে বিচ্যুত হয়ে পড়ে তখন তাকে digression (মূল প্রসঙ্গ থেকে বিচ্যুতি) বলা হয়। অন্যদিকে Pomposity-আড়ম্বর, exaggeration-অতিরঞ্জন, anti climax- Climax পয়েন্ট থেকে হঠাৎ drop down.", "page": 209}, {"id": "q9", "chapter": "Chapter 1: Literary Terms", "section": "1.2 Expression", "exam": "32nd BCS", "q": "The sentence 'Who would have thought Shylock was so unkind' expresses ——.", "options": [{"id": "a", "text": "hyperbole"}, {"id": "b", "text": "interrogation"}, {"id": "c", "text": "command"}, {"id": "d", "text": "wonder"}], "correct": "d", "expl": "উইলিয়াম শেক্সপিয়ারের Tragi-Comedy 'The Merchant of Venice' থেকে উক্ত লাইনটি নেওয়া হয়েছে। যেখানে Shylock এর চরিত্র সম্পর্কে বিস্ময় প্রকাশ করা হয়েছে।", "page": 209}, {"id": "q10", "chapter": "Chapter 1: Literary Terms", "section": "1.2 Expression", "exam": "31st BCS", "q": "A formal composition or speech expressing high praise of somebody-", "options": [{"id": "a", "text": "elegy"}, {"id": "b", "text": "eulogy"}, {"id": "c", "text": "caricature"}, {"id": "d", "text": "exaggeration"}], "correct": "b", "expl": "'Eulogy' অর্থ- উচ্চ প্রশংসা। অপরদিকে Elegy-শোকগাথা এবং Caricature- ব্যঙ্গচিত্র।", "page": 209}, {"id": "q11", "chapter": "Chapter 1: Literary Terms", "section": "1.2 Expression", "exam": "19th BCS", "q": "The word 'Euphemism' means-", "options": [{"id": "a", "text": "Stating one thing like another"}, {"id": "b", "text": "Description of a disagreeable thing by an agreeable name"}, {"id": "c", "text": "Contrast of words is made in the same sentence"}, {"id": "d", "text": "A statement is made emphatic by overstatement."}], "correct": "b", "expl": "Euphemism এর অর্থ সুভাষণ। কোনো খারাপ বা বাজে কোনো কিছু কে মৃদু ও শোভন শব্দে প্রকাশ করাকে Euphemism বলে।", "page": 209}, {"id": "q12", "chapter": "Chapter 1: Literary Terms", "section": "1.3 Drama Related", "exam": "36th, 35th BCS", "q": "The Climax of a plot is what happens-", "options": [{"id": "a", "text": "in the beginning"}, {"id": "b", "text": "at the height"}, {"id": "c", "text": "at the end"}, {"id": "d", "text": "in the confrontation"}], "correct": "b", "expl": "Climax হচ্ছে কোনো নাটক বা গল্পের সর্বোচ্চ অবস্থা বা turning point যেখানে ঘটনার বৃদ্ধি শেষ হয় আর ঘটনার পতন শুরু হয়। তাই বলা চলে Climax happens at the height.", "page": 209}, {"id": "q13", "chapter": "Chapter 1: Literary Terms", "section": "1.3 Drama Related", "exam": "16th BCS", "q": "A fantasy is-", "options": [{"id": "a", "text": "an imaginary story"}, {"id": "b", "text": "a funny film"}, {"id": "c", "text": "a history record"}, {"id": "d", "text": "a real-life event"}], "correct": "a", "expl": "Fantasy-অলীক, অবাস্তব, কাল্পনিক গল্প কে বুঝানো হয়। এটি গল্পের বিশেষ এক ধরন (Genre)।", "page": 210}, {"id": "q14", "chapter": "Chapter 1: Literary Terms", "section": "1.4 Terms and Theories", "exam": "37th BCS", "q": "The repetition of beginning consonant sound is known as-", "options": [{"id": "a", "text": "Personification"}, {"id": "b", "text": "onomatopoeia"}, {"id": "c", "text": "alliteration"}, {"id": "d", "text": "rhyme"}], "correct": "c", "expl": "বাক্যের মধ্যে একই ধ্বনি বা ধ্বনিগুচ্ছের পুনরাবৃত্তির মাধ্যমে যে শ্রুতিমাধুর্য সৃষ্টি করা হয়, তাকে অনুপ্রাস বা Alliteration বলে। যেমন- Fair is Foul and Foul is Fair, Hover through the fog and filthy air। অপরদিকে, কোনো বস্তু বা objects-কে সাহিত্যে মানুষ বা ব্যক্তিরূপ দান করাকে personification বলে। Onomatopoeia হলো অনুকার শব্দ বা কোনোকিছুর শব্দের অনুকরণে শব্দ গঠন। Rhyme হলো শব্দের বা কবিতার চরণের মিল।", "page": 209}, {"id": "q15", "chapter": "Chapter 1: Literary Terms", "section": "1.4 Terms and Theories", "exam": "35th BCS", "q": "Class relations and societal conflict is the key understanding of-", "options": [{"id": "a", "text": "Feminism"}, {"id": "b", "text": "Formalism"}, {"id": "c", "text": "Structuralism"}, {"id": "d", "text": "Marxism"}], "correct": "d", "expl": "সামাজিক, অর্থনৈতিক, রাজনৈতিক, সাংস্কৃতিক সকল ক্ষেত্রে নারীদের সম-অধিকার এবং নারীদের উপর আরোপিত নেতিবাচক বিভিন্ন বিষয় থেকে মুক্ত করার তত্ত্ব বা আন্দোলন হচ্ছে Feminism। Structuralism হচ্ছে 'grammar of literary text' যা literary text এর form, genre, structure ইত্যাদি বিষয় আলোচনা করে। Formalism এমন একটি তত্ত্ব যা literary text এর অন্তর্গত বিচার বিশ্লেষণ, মূল্যায়ন, Grammar, syntax, বাক্যালংকার ইত্যাদি বিষয় নিয়ে আলোচনা করে। আর সমাজে শ্রেণি বিভাজন এবং তাদের সমস্যার উৎস আলোচনা করে Karl Marx প্রদত্ত সমাধানকে বলা হয় Marxism.", "page": 209}, {"id": "q16", "chapter": "Chapter 1: Literary Terms", "section": "1.4 Terms and Theories", "exam": "16th BCS", "q": "A person who writes about his own life writes-", "options": [{"id": "a", "text": "a chronicle"}, {"id": "b", "text": "an autobiography"}, {"id": "c", "text": "a diary"}, {"id": "d", "text": "a biography"}], "correct": "b", "expl": "Autobiography এর অর্থ আত্মজীবনী। কোনো লেখক যখন তার নিজ জীবন সম্পর্কে লিখেন তখন সেটা হবে autobiography। অন্যদিকে কারো জীবনী অন্য কেউ লিখলে তাকে বলা হয় Biography; Diary বলা হয় প্রাত্যাহিক জীবনের ঘটনা বা দিনলিপি; এবং ঐতিহাসিক ঘটনাবলি কোন ব্যাখ্যা বা কারণ না দিয়ে শুধু ঘটনার ক্রমানুসারে উল্লেখ করাকে বলা হয় Chronicle।", "page": 209}, {"id": "q17", "chapter": "Chapter 1: Literary Terms", "section": "1.4 Terms and Theories", "exam": "15th BCS", "q": "Which of the following school of literary writings is connected with a medical theory?", "options": [{"id": "a", "text": "Comedy of Manners"}, {"id": "b", "text": "Theater of the Absurd"}, {"id": "c", "text": "Heroic Tragedy"}, {"id": "d", "text": "Comedy of Humours"}], "correct": "d", "expl": "Ben Jonson প্রচলিত Comedy of Humours এক ধরনের বিশেষ নাট্যরূপ যেখানে মানুষের আচার আচরণের ব্যাপারে আলোকপাত করা হয়। এজন্য এটিকে মধ্যযুগ ও রেনেসাঁ যুগে মেডিক্যাল তত্ত্ব হিসেবেও অনেকে মনে করতেন।", "page": 209}, {"id": "q18", "chapter": "Chapter 2: The Renaissance Period", "section": "2.1 Chapter Introduction", "exam": "46th, 38th BCS", "q": "Which period is known as \"The Golden Age of English Literature\"?", "options": [{"id": "a", "text": "The Victorian Age"}, {"id": "b", "text": "The Elizabethan Age"}, {"id": "c", "text": "The Eighteen century"}, {"id": "d", "text": "The Restoration period"}], "correct": "b", "expl": "ইংরেজি সাহিত্যের রেনেসাঁর সময়ে ১৫৫৮ সালে ইংল্যান্ডের ক্ষমতায় আসেন রানি এলিজাবেথ। এ সময় রানির পৃষ্ঠপোষকতা ও Shakespeare এর মতো মহান সাহিত্যিকদের নাটক, কবিতা এই যুগকে এনে দিয়েছে The Golden Age of English Literature খ্যাতি। এই যুগের ব্যাপ্তি ১৫৫৮ থেকে ১৬০৩ পর্যন্ত।", "page": 210}, {"id": "q19", "chapter": "Chapter 2: The Renaissance Period", "section": "2.1 Chapter Introduction", "exam": "38th BCS", "q": "'Jacobean Period' of English Literature refers to-", "options": [{"id": "a", "text": "1558-1603"}, {"id": "b", "text": "1625-1649"}, {"id": "c", "text": "1603-1625"}, {"id": "d", "text": "1649-1660"}], "correct": "c", "expl": "রেনেসা যুগকে পাঁচটি অংশে ভাগ করা হয়েছে- Preparation for the Renaissance (1500-1558), Elizabethan (1558-1603), Jacobean (1603-1625), Caroline (1625-1649), Commonwealth (1649-1660)।", "page": 210}, {"id": "q20", "chapter": "Chapter 2: The Renaissance Period", "section": "2.1 Chapter Introduction", "exam": "35th BCS", "q": "Which of the following writers belong to the Elizabethan period?", "options": [{"id": "a", "text": "Christopher Marlowe"}, {"id": "b", "text": "Alexander Pope"}, {"id": "c", "text": "John Dryden"}, {"id": "d", "text": "Samuel Beckett"}], "correct": "a", "expl": "Elizabethan যুগের উল্লেখযোগ্য সাহিত্যিক হলেন William Shakespeare, Edmund Spenser, Thomas Kyd, Francis Bacon, Christopher Marlowe, Thomas Nashe প্রমুখ।", "page": 210}, {"id": "q21", "chapter": "Chapter 2: The Renaissance Period", "section": "2.2 John Milton", "exam": "50th BCS", "q": "Which of these works contains a defence of the right of freedom of speech and expression?", "options": [{"id": "a", "text": "Holy Living and Holy Dying"}, {"id": "b", "text": "Areopagitica"}, {"id": "c", "text": "Religio Medici"}, {"id": "d", "text": "A Free Man's Worship"}], "correct": "b", "expl": "Areopagitica রচনাটিতে John Milton সংবাদপত্রের স্বাধীনতা নিয়ে দীর্ঘ বক্তব্য রেখেছেন। তাঁর অন্যান্য রচনার মতোই এখানেও প্রেরণার ভিত্তি হলো শুদ্ধতাবাদী ধর্মীয় ধারণা। তার মূল বক্তব্য ছিল Garden of Eden এ Adam ও Eve এর গল্পের সমান্তরালে মানুষের আচরণের বৈপরীত্য।", "page": 211}, {"id": "q22", "chapter": "Chapter 2: The Renaissance Period", "section": "2.2 John Milton", "exam": "48th BCS (স্বাস্থ্য)", "q": "Who composed 'Paradise Lost'?", "options": [{"id": "a", "text": "John Donne"}, {"id": "b", "text": "John Keats"}, {"id": "c", "text": "John Dryden"}, {"id": "d", "text": "John Milton"}], "correct": "d", "expl": "Paradise Lost একটি বিখ্যাত epic poem (মহাকাব্য) যা John Milton ১৬৬৭ সালে রচনা করেন। এটি ইংরেজি সাহিত্যের সর্বশ্রেষ্ঠ মহাকাব্যগুলোর একটি, যেখানে আদম ও ইভ এর পাপ ও স্বর্গচ্যুতির কাহিনি বর্ণিত হয়েছে। মহাকাব্যটির মূল থিম- 'To Justify the ways of God to man'. John Milton এর উল্লেখযোগ্য সাহিত্যকর্ম হলো- Paradise Lost (Epic Poem), Paradise Regained (Epic Poem), Samson Agonistes (Tragic Drama), Areopagitica (Prose), Lycidas (Elegy), On His Blindness (Sonnet) প্রভৃতি।", "page": 211}, {"id": "q23", "chapter": "Chapter 2: The Renaissance Period", "section": "2.2 John Milton", "exam": "47th BCS", "q": "The tragedy 'Samson Agonistes' was penned by.", "options": [{"id": "a", "text": "Christopher Marlowe"}, {"id": "b", "text": "Henrick Ibsen"}, {"id": "c", "text": "John Milton"}, {"id": "d", "text": "Arthur Miller"}], "correct": "c", "expl": "এটি Milton-এর শেষের দিকে লেখা একটি ট্র্যাজেডি, যা বাইবেলীয় চরিত্র Samson-এর জীবন ও তার দুঃখের ওপর ভিত্তি করে লেখা। নাটকটি দেখায় কিভাবে Samson নিজের শক্তি ও বিশ্বাসের মাধ্যমে কঠিন পরিস্থিতি মোকাবিলা করে। উল্লেখযোগ্য চরিত্র- Samson, Dalila, Manoa, Harapha.", "page": 211}, {"id": "q24", "chapter": "Chapter 2: The Renaissance Period", "section": "2.2 John Milton", "exam": "44th, 14th BCS", "q": "'Paradise Lost' attempted to-", "options": [{"id": "a", "text": "justify the ways of man to God."}, {"id": "b", "text": "show that Satan and God have equal power."}, {"id": "c", "text": "justify the ways of God to man."}, {"id": "d", "text": "explain why both good and evil are necessary."}], "correct": "c", "expl": "মিল্টন তার জীবদ্দশায় দুটি মহাকাব্য (epic) রচনা করেছেন; Paradise Lost এবং Paradise Regained। তার Paradise Lost-এ আদি পুরুষ ও আদি নারীর স্বর্গ থেকে বিতাড়িত হবার কাহিনির মাধ্যমে মানুষের প্রতি ঈশ্বরের ন্যায় বিচার প্রতিপন্ন করেছেন। তাই বলা হয়, এই মহাকাব্যটি মানুষের কাছে ঈশ্বরের বিচারের ব্যাখ্যামূলক আখ্যান। কাব্যে লুসিফারকে দেখানো হয়েছে এমন সত্তা যে স্বর্গের দাসত্বের চেয়ে দোযখের রাজত্ব বেছে নেয়, যা মিল্টন প্রকাশ করেছেন এভাবে- Better to reign in Hell, than serve in Heav'n", "page": 211}, {"id": "q25", "chapter": "Chapter 2: The Renaissance Period", "section": "2.2 John Milton", "exam": "43rd BCS", "q": "\"Better to reign in Hell, than serve in Heav'n.\"- Who wrote this?", "options": [{"id": "a", "text": "Geoffrey Chaucer"}, {"id": "b", "text": "Christopher Marlowe"}, {"id": "c", "text": "John Milton"}, {"id": "d", "text": "P. B. Shelley"}], "correct": "c", "expl": "উক্তিটি John Milton রচিত Paradise Lost মহাকাব্যের।", "page": 211}, {"id": "q26", "chapter": "Chapter 2: The Renaissance Period", "section": "2.2 John Milton", "exam": "38th BCS", "q": "Of the following authors, who wrote an epic?", "options": [{"id": "a", "text": "John Milton"}, {"id": "b", "text": "Jane Mansfield"}, {"id": "c", "text": "William Cowper"}, {"id": "d", "text": "William Shakespeare"}], "correct": "a", "expl": "John Milton।", "page": 211}, {"id": "q27", "chapter": "Chapter 2: The Renaissance Period", "section": "2.3 Christopher Marlowe", "exam": "48th BCS (স্বাস্থ্য)", "q": "Doctor Faustus is ___.", "options": [{"id": "a", "text": "a comedy"}, {"id": "b", "text": "a tragedy"}, {"id": "c", "text": "a historical novel"}, {"id": "d", "text": "an absurd play"}], "correct": "b", "expl": "Doctor Faustus (সম্পূর্ণ নাম The Tragical History of the Life and Death of Doctor Faustus) হলো একটি tragedy, যা ইংরেজ নাট্যকার Christopher Marlowe রচিত। এই নাটকে Faustus একজন জার্মান স্কলার যে শয়তানের সঙ্গে চুক্তি করে অতিপ্রাকৃত ক্ষমতা অর্জনের চেষ্টা করে, এবং শেষ পর্যন্ত নিজের আত্মা হারায়। তার অহংকার ও অতিমাত্রায় জ্ঞানলিপ্সার জন্য তার পতন ঘটে, যা একটি ট্র্যাজেডির মূল বৈশিষ্ট্য। Marlowe এর বিখ্যাত নাটকগুলো- Tamburlaine the Great, The Jew of Malta, Edward II, The Massacre at Paris ইত্যাদি। The Passionate Shepherd to his love তার রচিত বিখ্যাত গীতিকবিতা।", "page": 211}, {"id": "q28", "chapter": "Chapter 2: The Renaissance Period", "section": "2.3 Christopher Marlowe", "exam": "41st BCS", "q": "'Was this the face that launch'd a thousand ships, And burnt the topless towers of Ilium?' Who speaks the famous lines?", "options": [{"id": "a", "text": "Caesar"}, {"id": "b", "text": "Antony"}, {"id": "c", "text": "Faustus"}, {"id": "d", "text": "Romeo"}], "correct": "c", "expl": "ইংরেজি সাহিত্যের ট্র্যাজিক মহানায়ক Christopher Marlowe ইংরেজি সাহিত্যকে দিয়েছেন Doctor Faustus, The Jew of Malta, Tamberline the Great এর মতো নাটক। পার্থিব স্বার্থের জন্য নিজের আত্মাকে লুসিফারের কাছে বিক্রির কাহিনি সে যুগে বেশ প্রচলিত ছিল, এই কাহিনির অবলম্বনে মারলো Doctor Faustus রচনা করেন। তার নাটকের প্রধান চরিত্র Faustus কে দেখিয়েছেন অনেক জ্ঞানী কিন্তু পার্থিব স্বার্থের জন্য Mephistopheles এর মাধ্যমে Lucifer এর কাছে নিজের আত্মাকে বিক্রি করে শেষে অনুশোচনা করতে। নিজের ক্ষমতা ব্যবহার করে ট্রয় নগরী ধ্বংসের প্রধান কারণ সুন্দরী Helen কে হাজির করে বলে- Sweet Helen make me immortal with a kiss। হেলেনের রূপের বর্ণনায় মারলো উল্লেখ করেন- Was this the face that launch'd a thousand ships, And burnt the topless towers of Ilium. এই নাটকের আরো কিছু উল্লেখযোগ্য উক্তির মধ্যে রয়েছে- This is hell, nor am I out of it। O I'll burn my books- ah, Mephistopheles!", "page": 212}, {"id": "q29", "chapter": "Chapter 2: The Renaissance Period", "section": "2.3 Christopher Marlowe", "exam": "40th BCS", "q": "'Sweet Helen' make me immortal with a kiss.' The sentence has been taken from the play-", "options": [{"id": "a", "text": "Remeo and Juliet"}, {"id": "b", "text": "Caesar and Cleopatra"}, {"id": "c", "text": "Doctor Faustus"}, {"id": "d", "text": "Antony and Cleopatra"}], "correct": "c", "expl": "Doctor Faustus.", "page": 212}, {"id": "q30", "chapter": "Chapter 2: The Renaissance Period", "section": "2.4 John Donne", "exam": "47th BCS", "q": "'For God's sake hold your tongue, and let me love.' This line is taken from the poem.", "options": [{"id": "a", "text": "To His Coy Mistress"}, {"id": "b", "text": "The Canonization"}, {"id": "c", "text": "The Definition of Love"}, {"id": "d", "text": "The Sun Rising"}], "correct": "b", "expl": "'For God's sake hold your tongue, and let me love.'-লাইনটি Father of Metaphysical Poets খ্যাত কবি John Donne এর বিখ্যাত কবিতা The Canonization (প্রথম লাইন) থেকে নেওয়া হয়েছে। তার উল্লেখযোগ্য কবিতাসমূহ হলো- The Good Morrow, The Sun Rising, The Flea, For Whom the Bell Tolls, A Valediction: Forbidding Mourning প্রভৃতি। বিখ্যাত উক্তিসমূহ: 'For love, all love of other sights controls, And makes one little room an everywhere.' (The Good Morrow); 'Busy old fool, unruly Sun, Why dost thou thus, Through windows, and through curtains, call on us?' (The Sun Rising); 'So let us melt, and make no noise, no tear-floods, nor sigh-tempests move.' (A Valediction: Forbidding Mourning)", "page": 212}, {"id": "q31", "chapter": "Chapter 2: The Renaissance Period", "section": "2.4 John Donne", "exam": "42nd BCS", "q": "\"For God's sake, hold your tongue and let me love\" occurs in a novel by:", "options": [{"id": "a", "text": "Jane Austen"}, {"id": "b", "text": "Syed Waliullah"}, {"id": "c", "text": "Somerset Maugham"}, {"id": "d", "text": "Rabindranath Tagore"}], "correct": "d", "expl": "John Donne এর কবিতা The Canonization। এই কবিতা দুইই করেছেন এই আখ্যান জানিয়ে- For God's sake, hold your tongue and let me love। এই লাইনটি রবীন্দ্রনাথ তার শেষের কবিতায় ব্যবহার করেছেন এভাবে-দোহাই তোমাদের, একটুক চুপ কর। ভালোবাসিবারে দে আমারে অবসর।", "page": 212}, {"id": "q32", "chapter": "Chapter 2: The Renaissance Period", "section": "2.4 John Donne", "exam": "40th BCS", "q": "Who worte the poem 'The Good-Morrow'?", "options": [{"id": "a", "text": "George Herbert"}, {"id": "b", "text": "Andrew Marvell"}, {"id": "c", "text": "John Donne"}, {"id": "d", "text": "Henry Vaughan"}], "correct": "c", "expl": "John Donne.", "page": 212}, {"id": "q33", "chapter": "Chapter 2: The Renaissance Period", "section": "2.4 John Donne", "exam": "38th BCS", "q": "'For God's sake hold your tongue, and let me love.' This line is written by-", "options": [{"id": "a", "text": "Emily Dickinson"}, {"id": "b", "text": "T.S. Eliot"}, {"id": "c", "text": "Mathew Arnold"}, {"id": "d", "text": "John Donne"}], "correct": "d", "expl": "John Donne.", "page": 212}, {"id": "q34", "chapter": "Chapter 2: The Renaissance Period", "section": "2.5 Other Prominent Authors", "exam": "49th BCS (শিক্ষা)", "q": "The play 'Englishmen for My Money' was written by-", "options": [{"id": "a", "text": "Christopher Marlowe"}, {"id": "b", "text": "Thomas Kyd"}, {"id": "c", "text": "William Haughton"}, {"id": "d", "text": "Ben Johnson"}], "correct": "c", "expl": "'Englishmen for My Money' কমেডি নাটকটি লিখেছেন William Haughton. এই নাটকটির পুরো নাম হলো 'Englishmen for My Money, or A Woman Will Have Her Will'-নাটকটি মূলত লন্ডনের ব্যবসায়ী সমাজ ও তাদের পরিবারকে কেন্দ্র করে আবর্তিত। 'Englishmen for My Money' নাটকটির প্রধান চরিত্রগুলো হলো: Pisaro, Laurentia, Marina, Mathea, Harvey, Heigham, Walgrave etc.", "page": 212}, {"id": "q35", "chapter": "Chapter 2: The Renaissance Period", "section": "2.5 Other Prominent Authors", "exam": "45th BCS", "q": "The poem \"To his Coy Mistress\" Was written by:", "options": [{"id": "a", "text": "Andrew Marvell"}, {"id": "b", "text": "John Donne"}, {"id": "c", "text": "George Herbert"}, {"id": "d", "text": "Henry Vaughan"}], "correct": "a", "expl": "Metaphysical Poet এবং ব্যঙ্গ সাহিত্যের জন্য প্রসিদ্ধ Andrew Marvell এর সাহিত্যে মিল্টনের প্রভাব লক্ষণীয়। তার To His Coy Mistress কবিতাটি প্রেমিকার প্রতি আহ্বানমূলক কবিতা। এছাড়াও তার আরো কিছু কবিতার মধ্যে রয়েছে- The Definition of Love, The Garden, The Mower's Song, Bermudas.", "page": 213}, {"id": "q36", "chapter": "Chapter 2: The Renaissance Period", "section": "2.5 Other Prominent Authors", "exam": "44th BCS", "q": "Francis Bacon is an Illustrious-", "options": [{"id": "a", "text": "essayist"}, {"id": "b", "text": "dramatist"}, {"id": "c", "text": "novelist"}, {"id": "d", "text": "journalist"}], "correct": "a", "expl": "Francis Bacon ছিলেন Elizabethan যুগের রাজনীতিবিদ, দার্শনিক ও সরকারি আইনজীবী। সাহিত্য রচনার ক্ষেত্রে Essay বা প্রবন্ধ রচনা করে খ্যাতি অর্জন করেন। তাঁকে 'Father of English Essay' বলা হয়। তাঁর অধিকাংশ প্রবন্ধের শুরুতে 'of' শব্দটি আছে। Of Truth, Of Death, Of Marriage and Single life ইত্যাদি তাঁর কিছু বিখ্যাত Essay.", "page": 212}, {"id": "q37", "chapter": "Chapter 2: The Renaissance Period", "section": "2.5 Other Prominent Authors", "exam": "38th BCS", "q": "The play 'The Spanish Tragedy' is written by-", "options": [{"id": "a", "text": "Thomas Kyd"}, {"id": "b", "text": "Christopher Marlowe"}, {"id": "c", "text": "Shakespeare"}, {"id": "d", "text": "Ben Jonson"}], "correct": "a", "expl": "University Wits খ্যাত Thomas Kyd তার The Spanish Tragedy নাটকের মাধ্যমে সাহিত্যে Revenge Tragedy ধারার সূচনা করেন। বলা হয়ে থাকে তার এই নাটক থেকে অনুপ্রাণিত হয়েই Shakespeare তার বিখ্যাত ট্র্যাজেডি Hamlet রচনা করেন। এই নাটকের উল্লেখযোগ্য চরিত্রের মধ্যে রয়েছে- Horatio, Hieronimo, Don Andrea, Lorenzo, Balthazaar.", "page": 212}, {"id": "q38", "chapter": "Chapter 2: The Renaissance Period", "section": "2.5 Other Prominent Authors", "exam": "37th BCS", "q": "Who has written the play 'Volpone'?", "options": [{"id": "a", "text": "John Webster"}, {"id": "b", "text": "Ben Jonson"}, {"id": "c", "text": "Christopher Marlowe"}, {"id": "d", "text": "William Shakespeare"}], "correct": "b", "expl": "Ben Jonson তার ব্যঙ্গ রসাত্মক নাটকের জন্য ইংরেজি সাহিত্যে বিখ্যাত হয়ে আছেন। তাকে কমেডি নাটকের জনকও বলা হয়। 'Volpone' তার বিখ্যাত কমেডি নাটক। তিনি আরো যেসব নাটক লিখেছেন তার মধ্যে The Alchemist, Every man in His Humour, Every man Out of His Humour, A Tale of Tub অন্যতম।", "page": 212}, {"id": "q39", "chapter": "Chapter 2: The Renaissance Period", "section": "2.5 Other Prominent Authors", "exam": "36th BCS", "q": "'Man is a political animal'-who said this?", "options": [{"id": "a", "text": "Dante"}, {"id": "b", "text": "Plato"}, {"id": "c", "text": "Aristotle"}, {"id": "d", "text": "Socrates"}], "correct": "c", "expl": "মানব সমাজের অবিচ্ছেদ্য অংশ রাজনীতি, যার দর্শন সূচনা হয় Aristotle এর 'Politics' গ্রন্থের মাধ্যমে। এই গ্রন্থে মানুষের সাথে রাজনীতির গভীর সম্পর্ক বোঝাতে উল্লেখ করেন- Man is a political animal.", "page": 212}, {"id": "q40", "chapter": "Chapter 3: The Neoclassical Period", "section": "3.1 Chapter Introduction", "exam": "37th BCS", "q": "'Restoration period' in English literature refers to-", "options": [{"id": "a", "text": "1560"}, {"id": "b", "text": "1660"}, {"id": "c", "text": "1760"}, {"id": "d", "text": "1866"}], "correct": "b", "expl": "রেনেসা যুগকে Neo Classical যুগকে ৩টি অংশে ভাগ করা হয়েছে- Restoration (1660-1700), Augustan Period (1700-1745), Age of Sensibility (1745-1798).", "page": 213}, {"id": "q41", "chapter": "Chapter 3: The Neoclassical Period", "section": "3.1 Chapter Introduction", "exam": "15th BCS", "q": "The 'Poet Laureate' is-", "options": [{"id": "a", "text": "the best poet of the country"}, {"id": "b", "text": "a winner of the Noble Prize in poetry"}, {"id": "c", "text": "the Court Poet England"}, {"id": "d", "text": "a classical poet"}], "correct": "c", "expl": "১৬৬৮ সালে রাজা Charles II কর্তৃক John Dryden কে ইংল্যান্ডের Poet Laureate হিসেবে নিয়োগ দেয়া হয় যা ছিল মূলত সভাকবির পদ। পরবর্তীতে সভাকবিদের মৃত্যুর পর পুনরায় একজনকে নিয়োগ করা হতো সেই পদে।", "page": 213}, {"id": "q42", "chapter": "Chapter 3: The Neoclassical Period", "section": "3.2 Alexander Pope", "exam": "44th BCS", "q": "Alexander Pope's 'Essay on Man' is a-", "options": [{"id": "a", "text": "novel"}, {"id": "b", "text": "treatise"}, {"id": "c", "text": "short story"}, {"id": "d", "text": "poem"}], "correct": "d", "expl": "Mock-Heroic Poet খ্যাত Alexander Pope এর Essay on Man এর নামে 'Essay' থাকলেও এটি মূলত একটি Poem। এটি ছাড়াও তার আরো উল্লেখযোগ্য কবিতার মধ্যে রয়েছে- The Rape of the Lock, The Dunciad, An Essay on Criticism ইত্যাদি। তার উল্লেখযোগ্য উক্তির মধ্যে রয়েছে- To err is human; to forgive is divine. Charms strike the sight, but merit wins the soul. A little learning is a dangerous thing. Fools rush in where angels fear to tread.", "page": 213}, {"id": "q43", "chapter": "Chapter 3: The Neoclassical Period", "section": "3.2 Alexander Pope", "exam": "40th BCS", "q": "'The Rape of the Lock' by Alexander Pope is a/an-", "options": [{"id": "a", "text": "epic"}, {"id": "b", "text": "ballad"}, {"id": "c", "text": "mock-heroic poem"}, {"id": "d", "text": "elegy"}], "correct": "c", "expl": "mock-heroic poem.", "page": 213}, {"id": "q44", "chapter": "Chapter 3: The Neoclassical Period", "section": "3.2 Alexander Pope", "exam": "16th BCS", "q": "Which of the following is a correct proverb?", "options": [{"id": "a", "text": "Fools rush in where angels fear to tread."}, {"id": "b", "text": "Fools rush in where an angel fears to tread."}, {"id": "c", "text": "A fools rushes in where an angle fears to tread"}, {"id": "d", "text": "Fools rush in where the angels fear to tread."}], "correct": "a", "expl": "Fools rush in where angels fear to tread.", "page": 213}, {"id": "q45", "chapter": "Chapter 3: The Neoclassical Period", "section": "3.3 Samuel Johnson", "exam": "46th BCS", "q": "Who of the following compiled an English Dictionary?", "options": [{"id": "a", "text": "Samuel Johnson"}, {"id": "b", "text": "T.S. Eliot"}, {"id": "c", "text": "John Dryden"}, {"id": "d", "text": "William Congreve"}], "correct": "a", "expl": "Samuel Johnson ১৭৫৫ সালে 'A Dictionary of the English Language' প্রকাশ করেন। এজন্য তাকে 'First Lexicographer in English' বলা হয়।", "page": 213}, {"id": "q46", "chapter": "Chapter 3: The Neoclassical Period", "section": "3.3 Samuel Johnson", "exam": "28th, 15th BCS", "q": "Who did write first English dictionary?", "options": [{"id": "a", "text": "Boswell"}, {"id": "b", "text": "Ben Jonson"}, {"id": "c", "text": "Samuel Johnson"}, {"id": "d", "text": "Milton"}], "correct": "c", "expl": "Samuel Johnson.", "page": 213}, {"id": "q47", "chapter": "Chapter 3: The Neoclassical Period", "section": "3.4 Henry Fielding", "exam": "44th BCS", "q": "Who wrote the picaresque novel titled 'Tom Jones'?", "options": [{"id": "a", "text": "Samuel Richardson"}, {"id": "b", "text": "Horace Walpole"}, {"id": "c", "text": "Henry Fielding"}, {"id": "d", "text": "Laurence Sterne"}], "correct": "c", "expl": "ইংরেজি সাহিত্যে উপন্যাসের জনক Henry Fielding রচিত অন্যতম উপন্যাস Tom Jones। এটি ১৭৪৯ সালে প্রকাশিত হয়। একে Picaresque Novel বলা হয়, কারণ এ ধরনের উপন্যাসে সমাজের নিচু শ্রেণি থেকে উঠে আসা নায়কের বর্ণনা দেওয়া হয় যে তার বুদ্ধিমত্তা দিয়ে সমাজে টিকে থাকে। উপন্যাসটির উল্লেখযোগ্য চরিত্র-Tom Jones, Sophia, Bridget।", "page": 214}, {"id": "q48", "chapter": "Chapter 3: The Neoclassical Period", "section": "3.4 Henry Fielding", "exam": "13th BCS", "q": "'Tom Jones' by Henry Fielding was first published in-", "options": [{"id": "a", "text": "the 1st half of 19th century"}, {"id": "b", "text": "the 2nd half of 18th century"}, {"id": "c", "text": "the 1st half of 18th century"}, {"id": "d", "text": "the 2nd half of 19th century"}], "correct": "c", "expl": "the 1st half of 18th century.", "page": 214}, {"id": "q49", "chapter": "Chapter 3: The Neoclassical Period", "section": "3.5 Jonathan Swift", "exam": "50th BCS", "q": "In Gulliver's Travels, which of these traits Swift does not show in his depiction of the land of the Lilliput?", "options": [{"id": "a", "text": "pride"}, {"id": "b", "text": "lies"}, {"id": "c", "text": "peace & wisdom"}, {"id": "d", "text": "silly rules"}], "correct": "c", "expl": "Jonathan Swift তার Gulliver's Travels গ্রন্থের প্রথম যাত্রায় Gulliver লিলিপুটদের দ্বীপে পৌঁছায় এবং ৬ ইঞ্চি উচ্চতা বিশিষ্ট লিলিপুটদের দ্বারা বন্দী হয়। পরবর্তীতে Gulliver সেখান থেকে পালিয়ে ইংল্যান্ডে ফিরতে সমর্থ হয়। এখানে সুইফট লিলিপুটদের মিথ্যা গর্ব, অযথা রীতি প্রভৃতি বিষয়গুলোকে তুলে ধরেছেন। তার এই গ্রন্থের লিলিপুটদের রাজ্যে শান্তি ও প্রজ্ঞার অনুপস্থিতির মাধ্যমে সমাজ ব্যবহার প্রহসন করেছেন।", "page": 214}, {"id": "q50", "chapter": "Chapter 3: The Neoclassical Period", "section": "3.5 Jonathan Swift", "exam": "49th BCS (শিক্ষা)", "q": "\"___ I cannot but conclude the Bulk of your Natives, to be the most pernicious race of little odious vermin that Nature ever suffered to crawl upon the surface of the Earth\"-the statement occurs in-", "options": [{"id": "a", "text": "Robinson Crusoe"}, {"id": "b", "text": "A Doll's House"}, {"id": "c", "text": "Vanity Fair"}, {"id": "d", "text": "Gulliver's Travels"}], "correct": "d", "expl": "উক্তিটি Jonathan Swift এর Gulliver's Travels থেকে নেওয়া হয়েছে। 'Gulliver's Travels' এর দ্বিতীয় অংশে, King of Brobdingnag গালিভারের কথাগুলো শুনে বলেছিলেন যে 'ইউরোপীয় মানুষ হলো ক্ষুদ্র, ঘৃণ্য এবং সবচেয়ে ক্ষতিকর কীট।' এই উক্তির মাধ্যমে Jonathan Swift ইউরোপীয় সমাজের অহংকার, দুর্নীতি ও মানুষের খারাপ স্বভাবকে তীব্রভাবে সমালোচনা করেছেন। তিনি পাঠককে হাস্যরসের মাধ্যমে মানুষের দুর্বল দিকগুলো চিন্তা করতে বলেন। Jonathan Swift এর কয়েকটি বিখ্যাত উক্তি: \"Satire is a sort of glass, wherein beholders do generally ো নিয়ে রচিত কমেডি ধারার এই নাটকে Duke এর সরল বিশ্বাসের সুযোগ নিয়ে ভিয়েনা শহরে Lord Angelo এর দুর্নীতি ও অবশেষে ন্যায় বিচার প্রতিষ্ঠা দেখানো হয়েছে। এটি Shakespeare এর অন্যতম Problem Play।", "page": 218}, {"id": "q85", "chapter": "Chapter 4: William Shakespeare", "section": "4.3 Play: Comedy", "exam": "36th BCS", "q": "'The Merchant of Venice' is a Shakespearean play about-", "options": [{"id": "a", "text": "a Jew"}, {"id": "b", "text": "a Moor"}, {"id": "c", "text": "a Roman"}, {"id": "d", "text": "a Turk"}], "correct": "a", "expl": "a Jew.", "page": 218}, {"id": "q86", "chapter": "Chapter 4: William Shakespeare", "section": "4.3 Play: Comedy", "exam": "29th BCS", "q": "Who wrote the plays, 'The Tempest' and 'The Mid Summer Night's Dream'?", "options": [{"id": "a", "text": "Ben Johnson"}, {"id": "b", "text": "Christopher Marlowe"}, {"id": "c", "text": "John Dryden"}, {"id": "d", "text": "William Shakespear"}], "correct": "d", "expl": "William Shakespeare.", "page": 218}, {"id": "q87", "chapter": "Chapter 5: The Romantic Period", "section": "5.1 Chapter Introduction", "exam": "50th BCS", "q": "Which of these is not characteristic of English Romantic Poetry?", "options": [{"id": "a", "text": "Ordinary life"}, {"id": "b", "text": "Everyday language"}, {"id": "c", "text": "Expression of feelings rather than action or plot"}, {"id": "d", "text": "Inane and gaudy phraseology"}], "correct": "d", "expl": "English Romantic Poetry সাধারণ মানুষের জীবন, প্রকৃতি এবং ব্যক্তিগত অনুভূতির প্রকাশে গুরুত্ব দেয়। Romantic কবিরা অতিরিক্ত অলংকারপূর্ণ, ফাঁপা ও চাকচিক্যপূর্ণ ভাষা (inane and gaudy phraseology) পরিহার করে সহজ ও প্রাত্যহিক ভাষা ব্যবহার করেছেন। বিশেষ করে Wordsworth সাধারণ মানুষের ভাষাকে কবিতার উপযোগী বলে মনে করতেন। তাই inane and gaudy phraseology Romantic Poetry-এর বৈশিষ্ট্য নয়।", "page": 219}, {"id": "q88", "chapter": "Chapter 5: The Romantic Period", "section": "5.1 Chapter Introduction", "exam": "46th BCS", "q": "Which event influenced the literature of the Romantic Period?", "options": [{"id": "a", "text": "French revolution"}, {"id": "b", "text": "Industrial Revolution"}, {"id": "c", "text": "Russian Revolution"}, {"id": "d", "text": "Hundred Year's War"}], "correct": "a", "expl": "১৭৯৮ সালে প্রকাশিত হয় Lyrical Ballads যা সাহিত্যে Age of Enlightenment বা নবজাগরণের সূচনা করে। ফরাসি বিপ্লব দ্বারা প্রবলভাবে প্রভাবিত এই যুগের সাহিত্যধারার স্লোগান ছিল Art for Art's Sake তথা শিল্পের জন্য শিল্প। ক্লাসিক্যাল ও নিওক্লাসিক্যাল সময়ে সাহিত্যে থাকা 'Reason' এর প্রভাব কাটিয়ে মানুষের Emotion জায়গা করে নেয়। এই যুগের উল্লেখযোগ্য সাহিত্যিকদের মধ্যে রয়েছেন- William Wordsworth, S.T. Coleridge, P.B. Shelley, John Keats, Lord Byron, Jane Austen প্রমুখ।", "page": 219}, {"id": "q89", "chapter": "Chapter 5: The Romantic Period", "section": "5.1 Chapter Introduction", "exam": "43rd BCS", "q": "The most famous romantic poet of English Literature is-", "options": [{"id": "a", "text": "John Dryden"}, {"id": "b", "text": "Alexander Pope"}, {"id": "c", "text": "William Wordsworth"}, {"id": "d", "text": "T. S. Eliot"}], "correct": "c", "expl": "William Wordsworth.", "page": 219}, {"id": "q90", "chapter": "Chapter 5: The Romantic Period", "section": "5.1 Chapter Introduction", "exam": "41st BCS", "q": "Who is not a romantic poet?", "options": [{"id": "a", "text": "P. B. Shelley"}, {"id": "b", "text": "S. T. Coleridge"}, {"id": "c", "text": "John Keats"}, {"id": "d", "text": "T. S. Eliot"}], "correct": "d", "expl": "T. S. Eliot (1888-1965) Georgian Period এর একজন কবি।", "page": 219}, {"id": "q91", "chapter": "Chapter 5: The Romantic Period", "section": "5.1 Chapter Introduction", "exam": "36th BCS", "q": "The romantic age in English literature began with the publication of-", "options": [{"id": "a", "text": "Preface to Shakespeare"}, {"id": "b", "text": "Perface to Lyrical Ballads"}, {"id": "c", "text": "Preface to Ancient Mariners"}, {"id": "d", "text": "Preface to Dr. Johnson"}], "correct": "b", "expl": "Perface to Lyrical Ballads.", "page": 219}, {"id": "q92", "chapter": "Chapter 5: The Romantic Period", "section": "5.1 Chapter Introduction", "exam": "36th BCS", "q": "Which of the following writers belongs to the romantic period in English literature?", "options": [{"id": "a", "text": "A. Tennyson"}, {"id": "b", "text": "Alexander Pope"}, {"id": "c", "text": "John Dryden"}, {"id": "d", "text": "S.T. Coleridge"}], "correct": "d", "expl": "A. Tennyson-Victorian Period; Alexander Pope-Augustan Period; John Dryden-Restoration Period.", "page": 219}, {"id": "q93", "chapter": "Chapter 5: The Romantic Period", "section": "5.2 William Wordsworth & S.T. Coleridge", "exam": "50th BCS", "q": "The killing of albatross in The Rime of the Ancient Mariner was indicative of-", "options": [{"id": "a", "text": "a trigger-happy Mariner"}, {"id": "b", "text": "the essential irrationality of man"}, {"id": "c", "text": "a superstitious Mariner"}, {"id": "d", "text": "the Mariner as a skillful fowler"}], "correct": "b", "expl": "The Rime of the Ancient Mariner কবিতায় Coleridge দেখিয়েছেন একজন নাবিকের একটি অযাচিত কর্মকাণ্ড: একটি Albatross পাখি হত্যার কারণে তাদের উপর বয়ে আসা দুর্দশা। কবিতাটিতে মানুষের অযৌক্তিক কাজের ফলাফল কতটা ভয়াবহ হতে পারে তা দেখিয়েছেন।", "page": 220}, {"id": "q94", "chapter": "Chapter 5: The Romantic Period", "section": "5.2 William Wordsworth & S.T. Coleridge", "exam": "50th BCS", "q": "Poetry is the spontaneous overflow of powerful feeling: it takes its origin from emotion recollected in tranquility' is a statement ascribed to-", "options": [{"id": "a", "text": "Coleridge"}, {"id": "b", "text": "William Wordsworth"}, {"id": "c", "text": "TS Eliot"}, {"id": "d", "text": "IA Richards"}], "correct": "b", "expl": "William Wordsworth তার Preface to Lyrical Ballads এ কবিতা ও কাব্য সম্পর্কে উক্তিটি করেছেন।", "page": 220}, {"id": "q95", "chapter": "Chapter 5: The Romantic Period", "section": "5.2 William Wordsworth & S.T. Coleridge", "exam": "44th BCS", "q": "'He prayeth best, who loveth best.'- Who said it?", "options": [{"id": "a", "text": "John Milton"}, {"id": "b", "text": "John Donne"}, {"id": "c", "text": "Lord Byron"}, {"id": "d", "text": "S.T. Coleridge"}], "correct": "d", "expl": "Lyrical Ballads এর বিখ্যাত কবিতা The Rime of the Ancient Mariner; রচয়িতা S.T Coleridge। কবিতায় এক বৃদ্ধ নাবিকের দুঃসাহসী সমুদ্র অভিযান বর্ণিত হয়েছে। সমুদ্রের একাকিত্ব নাবিক এভাবে প্রকাশ করেছেন 'Alone, alone, all, all alone, Alone on a wide, wide sea.......'। কবিতা শেষ হয়েছে বৃদ্ধের এই উপদেশের মাধ্যমে- He prayeth best, who loveth best.", "page": 220}, {"id": "q96", "chapter": "Chapter 5: The Romantic Period", "section": "5.2 William Wordsworth & S.T. Coleridge", "exam": "38th BCS", "q": "Where do the following lines occur in? 'Alone, alone, all, all alone, Alone on a wide, wide sea.......'", "options": [{"id": "a", "text": "The Rime of the Ancient Mariner"}, {"id": "b", "text": "Kubla khan"}, {"id": "c", "text": "The Nightingle"}, {"id": "d", "text": "The Dungeon"}], "correct": "a", "expl": "The Rime of the Ancient Mariner.", "page": 220}, {"id": "q97", "chapter": "Chapter 5: The Romantic Period", "section": "5.2 William Wordsworth & S.T. Coleridge", "exam": "37th BCS", "q": "Who wrote \"Biographia Literaria\"?", "options": [{"id": "a", "text": "Lord Byron"}, {"id": "b", "text": "P.B. Shelley"}, {"id": "c", "text": "S.T. Coleridge"}, {"id": "d", "text": "Charles Lamb"}], "correct": "c", "expl": "S. T. Coleridge রচিত Biographia Literaria তার আত্মচরিত, যেখানে তার রচনায় Wordsworth এর প্রভাব এবং সাহিত্য রচনায় তার দৃষ্টিভঙ্গি তুলে ধরেছেন। তার রচিত আরো কিছু বিখ্যাত কবিতার মধ্যে রয়েছে- Kubla Khan, Christabel ইত্যাদি।", "page": 220}, {"id": "q98", "chapter": "Chapter 5: The Romantic Period", "section": "5.2 William Wordsworth & S.T. Coleridge", "exam": "36th BCS", "q": "'Child is the father of man' is taken from the poem of-", "options": [{"id": "a", "text": "W. Wordsworth"}, {"id": "b", "text": "S.T. Coleridge"}, {"id": "c", "text": "P.B. Shelley"}, {"id": "d", "text": "A.C. Swinburne"}], "correct": "a", "expl": "উক্তিটি Poet of Nature খ্যাত William Wordsworth রচিত বিখ্যাত কবিতা My Heart Leaps up থেকে নেওয়া হয়েছে। তার রচিত আরো কিছু বিখ্যাত কবিতার মধ্যে রয়েছে- The Solitary Reaper, The Prelude, Tintern Abbey, I wandered Lonely as a Cloud ইত্যাদি।", "page": 220}, {"id": "q99", "chapter": "Chapter 5: The Romantic Period", "section": "5.2 William Wordsworth & S.T. Coleridge", "exam": "36th BCS", "q": "Who is known as 'the poet of nature' in English literature?", "options": [{"id": "a", "text": "Lord Tennyson"}, {"id": "b", "text": "John Milton"}, {"id": "c", "text": "William Wordsworth"}, {"id": "d", "text": "John Keats"}], "correct": "c", "expl": "William Wordsworth কে Poet of Nature উপাধিটি দেন P.B. Shelly. তার আরও কিছু উপাধি: Poet of Childhood, Father of Romantic Age, Court/Lake Poet (1843 সালে নিযুক্ত হন)।", "page": 220}, {"id": "q100", "chapter": "Chapter 5: The Romantic Period", "section": "5.2 William Wordsworth & S.T. Coleridge", "exam": "36th BCS", "q": "The poem 'The Solitary Reaper' is written by-", "options": [{"id": "a", "text": "W.H. Auden"}, {"id": "b", "text": "W. Wordsworth"}, {"id": "c", "text": "W.B. Yeats"}, {"id": "d", "text": "Ezra Pound"}], "correct": "b", "expl": "W. Wordsworth.", "page": 221}, {"id": "q101", "chapter": "Chapter 5: The Romantic Period", "section": "5.2 William Wordsworth & S.T. Coleridge", "exam": "35th BCS", "q": "Who wrote the following lines: \"all at once I saw a crowd, a host of golden daffodils\"?", "options": [{"id": "a", "text": "Wordsworth"}, {"id": "b", "text": "Herrick"}, {"id": "c", "text": "Shelley"}, {"id": "d", "text": "Keats"}], "correct": "a", "expl": "প্রশ্নোক্ত লাইন দুটি William Wordsworth-এর 'I Wandered Lonely As a Cloud' কবিতা থেকে নেয়া হয়েছে। কবিতাটি Daffodils নামেও পরিচিত।", "page": 221}, {"id": "q102", "chapter": "Chapter 5: The Romantic Period", "section": "5.2 William Wordsworth & S.T. Coleridge", "exam": "13th BCS", "q": "The literary work 'Kubla Khan' is-", "options": [{"id": "a", "text": "a history by Vincent Smith"}, {"id": "b", "text": "a verse by Coleridge"}, {"id": "c", "text": "a drama by Oscar Wilde"}, {"id": "d", "text": "a short story by Somerst Maugham"}], "correct": "b", "expl": "a verse by Coleridge.", "page": 221}, {"id": "q103", "chapter": "Chapter 5: The Romantic Period", "section": "5.3 P.B. Shelley & John Keats", "exam": "48th BCS (স্বাস্থ্য)", "q": "John keats wrote ___.", "options": [{"id": "a", "text": "Ode to the West Wind"}, {"id": "b", "text": "Ode on a Grecian urn"}, {"id": "c", "text": "Tinter Abbey"}, {"id": "d", "text": "The Accient Mariner"}], "correct": "b", "expl": "John Keats একজন ইংরেজ রোমান্টিক কবি, যিনি তার সুন্দর ভাষা ও গভীর কল্পনার জন্য বিখ্যাত। তিনি অনেক 'ode' বা স্তবকবদ্ধ কবিতা লিখেছেন, যার মধ্যে \"Ode on a Grecian Urn\" অন্যতম। তার বিখ্যাত কবিতাগুলো হলো- Ode to a Nightingale, Ode on Melancholy, Ode to Autumn, Isabella প্রভৃতি। বিখ্যাত উক্তি: Beauty is truth, truth beauty. (Ode on a Grecian urn); A thing of beauty is a joy forever. (Endymion); Heard melodies are sweet but those unheard are sweeter. (Ode on a Grecian urn)", "page": 221}, {"id": "q104", "chapter": "Chapter 5: The Romantic Period", "section": "5.3 P.B. Shelley & John Keats", "exam": "47th BCS", "q": "'Our sweetest songs are those that tell of saddest thought.'- This oft-quoted line occurs in Shelley's notable poem.", "options": [{"id": "a", "text": "To a Skylark"}, {"id": "b", "text": "Ode to the West Wind"}, {"id": "c", "text": "Adonais"}, {"id": "d", "text": "The Cloud"}], "correct": "a", "expl": "'Our sweetest songs are those that tell of saddest thought.'-লাইনটি P. B. Shelley-এর \"To a Skylark\" কবিতা থেকে নেওয়া হয়েছে। এই কবিতায় Shelley বোঝাতে চেয়েছেন যে স্কাইলার্ক পাখির গান দুঃখমুক্ত এবং আনন্দময়, কিন্তু মানুষের গান তখনই সবচেয়ে সুন্দর ও মধুর হয় যখন তা দুঃখ, যন্ত্রণা এবং গভীর অনুভূতির ওপর ভিত্তি করে রচিত হয়। মানুষের সবচেয়ে মধুর সৃষ্টিগুলো দুঃখের অভিজ্ঞতা থেকে আসে। 'To a Skylark' ছাড়াও Shelley এর আরও কিছু বিখ্যাত ও উল্লেখযোগ্য কাজ হলো: Ozymandias, Ode to the West Wind, Adonais, Prometheus Unbound (play), The Masque of Anarchy etc.", "page": 221}, {"id": "q105", "chapter": "Chapter 5: The Romantic Period", "section": "5.3 P.B. Shelley & John Keats", "exam": "45th, 43rd BCS", "q": "Who wrote the poem 'Ozymandias'?", "options": [{"id": "a", "text": "Thomas Hardy"}, {"id": "b", "text": "Robert Frost"}, {"id": "c", "text": "P.B. Shelley"}, {"id": "d", "text": "Edmund Spenser"}], "correct": "c", "expl": "প্রশ্নোক্ত পৌরাণিক কাহিনি ও ইতিহাসের সমন্বয়ে রচিত Ozymandias রোমান্টিক লেখক P.B. Shelley এর আলোচিত ও শ্রেষ্ঠ সনেট। কবিতায় ফারাও দ্বিতীয় রামসেস এর ধ্বসে পড়া মূর্তি দ্বারা কবি বুঝিয়েছেন ক্ষমতার ক্ষণস্থায়ী মোহময়তার করুণ পরিণতি।", "page": 221}, {"id": "q106", "chapter": "Chapter 5: The Romantic Period", "section": "5.3 P.B. Shelley & John Keats", "exam": "44th BCS", "q": "\"Oh, lift me as a wave, a leaf, a cloud! I fall upon the thorns of life! I bleed!\" The extract is taken from P.B. Shelley's poem-", "options": [{"id": "a", "text": "The Cloud"}, {"id": "b", "text": "To a Skylark"}, {"id": "c", "text": "Ode to the West Wind"}, {"id": "d", "text": "Adonais"}], "correct": "c", "expl": "উল্লিখিত লাইনগুলো রোমান্টিক যুগের বিখ্যাত কবি P. B. Shelley রচিত Ode to the West Wind নামক কবিতা থেকে চয়ন করা হয়েছে। কবি এখানে সরাসরি পশ্চিমের বাতাসকে বলেন- বিপ্লবের বাণী ট্রাম্পেটের মতো সবখানে ছড়িয়ে দিতে, যেন নির্যাতিত মানুষের মধ্যে বিদ্রোহ ছড়িয়ে যেতে পারে। কবিতার শেষ পর্বে কবি নিজের মৃত্যু ও বিনাশের কথা ভাবতে শুরু করেন। তবে ঠিক যেমন শুষ্ক শীতের পর বসন্ত আসে, তেমনই এই বার্তায় কবির কষ্টস্বর ও কবির কথা স্মরণ হবে।", "page": 221}, {"id": "q107", "chapter": "Chapter 5: The Romantic Period", "section": "5.3 P.B. Shelley & John Keats", "exam": "43rd, 28th BCS", "q": "\"If Winter comes, can Spring be far behind?\"- Who wrote this?", "options": [{"id": "a", "text": "William Blake"}, {"id": "b", "text": "S. T. Coleridge"}, {"id": "c", "text": "Lord Byron"}, {"id": "d", "text": "P. B. Shelley"}], "correct": "d", "expl": "P. B. Shelley.", "page": 221}, {"id": "q108", "chapter": "Chapter 5: The Romantic Period", "section": "5.3 P.B. Shelley & John Keats", "exam": "40th BCS", "q": "'Where are the songs of Spring? Aye, Where are they? Think not of them, thou hast the music too.' -who wrote this?", "options": [{"id": "a", "text": "William Wordsworth"}, {"id": "b", "text": "Rober Browning"}, {"id": "c", "text": "John Keats"}, {"id": "d", "text": "Samuel Coleridge"}], "correct": "c", "expl": "প্রদত্ত লাইনগুলো John Keats লিখেছেন তার 'To Autumn' কবিতায়। লাইনগুলো দ্বারা John Keats প্রতিবছর আসা স্বল্পস্থায়ী বসন্তকে বিচ্ছেদের সাথে দেখেছেন। অন্যদিকে তিনি মনে করেন শরৎ ঋতুর বিশেষ বৈশিষ্ট্য রয়েছে এবং এ ঋতুর সুরেলা ধ্বনিও রয়েছে।", "page": 222}, {"id": "q109", "chapter": "Chapter 5: The Romantic Period", "section": "5.3 P.B. Shelley & John Keats", "exam": "37th BCS", "q": "P.B. Shelley's 'Adonais' is an elegy on the death of-", "options": [{"id": "a", "text": "John Milton"}, {"id": "b", "text": "S.T. Coleridge"}, {"id": "c", "text": "John Keats"}, {"id": "d", "text": "Lord Byron"}], "correct": "c", "expl": "P.B. Shelly এর লেখা Adonais কবিতাটি ১৮২১ সালে তার বন্ধু John Keats কে উৎসর্গকৃত। বন্ধুর অকালমৃত্যুতে ব্যথিত হয়ে কবি Keats-এর মৃত্যুর সাত সপ্তাহের মধ্যে কবিতাটি রচনা করেন। বন্ধুর অকাল প্রয়াণই কবিতাটির মূল বিষয়বস্তু।", "page": 222}, {"id": "q110", "chapter": "Chapter 5: The Romantic Period", "section": "5.3 P.B. Shelley & John Keats", "exam": "15th BCS", "q": "Who wrote 'beauty is truth, truth is beauty'?", "options": [{"id": "a", "text": "Shakespeare"}, {"id": "b", "text": "Wordsworth"}, {"id": "c", "text": "Keats"}, {"id": "d", "text": "Eliot"}], "correct": "c", "expl": "'Poet of beauty' নামে খ্যাত John Keats তার 'Ode on a Grecian Urn' নামক কবিতায় এই উক্তি করেছেন। এছাড়া তার উল্লেখযোগ্য আরো কিছু কবিতার মধ্যে রয়েছে- Ode to Autumn, Ode to a Nightingale, Ode on Melancholy, Hyperion, Lamia।", "page": 222}, {"id": "q111", "chapter": "Chapter 5: The Romantic Period", "section": "5.4 Lord Byron & Jane Austen", "exam": "47th BCS", "q": "'It's strange - but true; for truth is always strange; Stranger than fiction.' This quote is taken from a poem of___.", "options": [{"id": "a", "text": "Mark Twain"}, {"id": "b", "text": "Robert Herrick"}, {"id": "c", "text": "Lord Byron"}, {"id": "d", "text": "Franz Kafka"}], "correct": "c", "expl": "প্রশ্নোক্ত বিখ্যাত পঙ্‌ক্তি লর্ড বায়রনের ব্যঙ্গাত্মক মহাকাব্য 'Don Juan' থেকে নেওয়া হয়েছে। Byron এখানে মানুষের অভিজ্ঞতা ও বাস্তবতার সাথে কল্পনার তুলনা করেছেন। Lord Byron-এর গুরুত্বপূর্ণ quotes- \"Love will find a way through paths where wolves fear to prey.\" (Don Juan); \"The great art of life is sensation, to feel that we exist, even in pain.\" (Childe Harold's Pilgrimage); \"Those who will not reason, are bigots, those who cannot, are fools.\" (Don Juan)", "page": 222}, {"id": "q112", "chapter": "Chapter 5: The Romantic Period", "section": "5.4 Lord Byron & Jane Austen", "exam": "45th BCS", "q": "The character, Elizabeth Bennett, appears in the novel-", "options": [{"id": "a", "text": "Pride and Prejudice"}, {"id": "b", "text": "Tess of the D'llrberville"}, {"id": "c", "text": "Wuthering Heights"}, {"id": "d", "text": "Jane Eyre"}], "correct": "a", "expl": "Jane Austen ইংরেজি সাহিত্যের প্রথম নারী নক্ষত্র যিনি পুরুষ প্রধান সাহিত্য সমাজকে স্বীয় ব্যক্তিত্বে নিয়ন্ত্রণ করেছিলেন। তার বিদ্রোহী মন্ত্রে উজ্জীবিত তার উপন্যাসের নারী চরিত্র Elizabeth Bennett। Pride and Prejudice উপন্যাসের কেন্দ্রীয় চরিত্র Elizabeth, যার বিয়ে করা অথবা না করার সিদ্ধান্তহীনতা ঘিরে উপন্যাসটি আবর্তিত।", "page": 222}, {"id": "q113", "chapter": "Chapter 5: The Romantic Period", "section": "5.4 Lord Byron & Jane Austen", "exam": "45th BCS", "q": "Don Juan was composed by-", "options": [{"id": "a", "text": "W. B. Yeats"}, {"id": "b", "text": "E.B. Browning"}, {"id": "c", "text": "George Gordon Byron"}, {"id": "d", "text": "Alexander Pope"}], "correct": "c", "expl": "Lord Byron এর সবচেয়ে বিখ্যাত কবিতার নাম 'Don Juan' অ্যাডভেঞ্চার ও ফ্যান্টাসি দিয়ে পরিপূর্ xt": "Lord Tennison"}, {"id": "d", "text": "Ernest Hemingway"}], "correct": "d", "expl": "Ernest Hemingway.", "page": 230}, {"id": "q178", "chapter": "Chapter 7: The Modern Period", "section": "7.7 George Orwell", "exam": "47th BCS", "q": "Who was the writer of the autobiographical as well as political essay 'Shooting and Elephant'?", "options": [{"id": "a", "text": "Francis Bacon"}, {"id": "b", "text": "George Orwell"}, {"id": "c", "text": "Joseph Addison"}, {"id": "d", "text": "Charles Lamb"}], "correct": "b", "expl": "'Shooting an Elephant' হলো George Orwell-এর একটি আত্মজীবনীমূলক এবং রাজনৈতিক প্রবন্ধ। এটি মূলত তার বার্মা (বর্তমান মিয়ানমার) অবস্থানের সময়কার অভিজ্ঞতার ওপর ভিত্তি করে লেখা। প্রবন্ধে Orwell একজন ব্রিটিশ পুলিশ কর্মকর্তা হিসেবে একটি হাতি হত্যা করার পরিস্থিতি নিয়ে লেখেন। তিনি দেখিয়েছেন কিভাবে উপনিবেশী ক্ষমতা, সামাজিক প্রত্যাশা ও জনগণের চাপে মানুষ নিজের নৈতিকতা ও বিবেকের বিপরীতে কাজ করতে বাধ্য হয়। হাতিটি হত্যা করা শুধু প্রাণীটির জন্য নয় বরং সমাজে নিজের অবস্থান ও কর্তৃত্ব প্রদর্শনের প্রতীক হয়ে ওঠে। George Orwell-এর গুরুত্বপূর্ণ প্রবন্ধ ও উপন্যাসগুলো- Animal Farm (1945), 1984 (1949), Homage to Catalonia (1938), The Road to Wigan Pier (1937), Down and Out in Paris and London (1933) etc. বি. দ্র: প্রশ্নে 'Shooting and Elephant' লেখা আছে। এখানে and এর পরিবর্তে an হবে।", "page": 231}, {"id": "q179", "chapter": "Chapter 7: The Modern Period", "section": "7.7 George Orwell", "exam": "45th BCS", "q": "Which of the following novels was written by George Orwell?", "options": [{"id": "a", "text": "1984"}, {"id": "b", "text": "Brave New World"}, {"id": "c", "text": "A clockwork Orange"}, {"id": "d", "text": "For Whom the Bell Tolls."}], "correct": "a", "expl": "George Orwell ছদ্মনাম নিয়ে Eric Aurther Blair ইংরেজি সাহিত্যকে দিয়েছেন 1984, Animal Farm এর মতো কালজয়ী উপন্যাস। 1984 উপন্যাসে লেখক একনায়কতান্ত্রিক রাষ্ট্রে নাগরিকদের উপর শাসকের চরম মাত্রার নিয়ন্ত্রণ দেখিয়েছেন। উপন্যাসের শেষ পর্যায়ে প্রধান চরিত্র Winston ও Julia এর শাসক Big Brother কে চূড়ান্তভাবে মেনে নেওয়াকে দেখানোর মাধ্যমে Totalitarian State এর বাস্তবিক পরিণতি তুলে ধরেছেন।", "page": 231}, {"id": "q180", "chapter": "Chapter 7: The Modern Period", "section": "7.7 George Orwell", "exam": "28th, 10th BCS", "q": "'Animal Farm' was written by-", "options": [{"id": "a", "text": "Geogre Orwell"}, {"id": "b", "text": "Stevenson"}, {"id": "c", "text": "Swift"}, {"id": "d", "text": "Mark Twain"}], "correct": "a", "expl": "'Animal Farm' Orwell এর আরেক ক্লাসিক উপন্যাস। এখানে তিনি বিভিন্ন পশুর হাস্যকর কর্মকাণ্ডের মাধ্যমে তৎকালীন সোভিয়েত নেতা স্টালিনের চরম মাত্রার বিদ্রূপ করেছেন।", "page": 231}, {"id": "q181", "chapter": "Chapter 7: The Modern Period", "section": "7.8 E.M. Forster", "exam": "50th BCS", "q": "Themes like racial prejudice, oppressive power dynamics, unbridgeable gulf between Eastern & Western cultures, etc. are best exemplified in-", "options": [{"id": "a", "text": "Shadow of the Moon by MM Kaye"}, {"id": "b", "text": "Bhowani Junction by John Masters"}, {"id": "c", "text": "Kim by Rudyard Kipling"}, {"id": "d", "text": "A Passage to India by EM Forster"}], "correct": "d", "expl": "E.M Forster কে আকর্ষণ করেছিল প্রাচ্যের আধ্যাত্মবাদ। 'A Passage to India' উপন্যাসটিতে লেখক প্রথম মহাযুদ্ধ এবং তার বিভীষিকায় মানুষের প্রাচীনপন্থী কুসংস্কার সম্পর্কে অত্যন্ত নির্মমভাবে উপহাস করেছিল। উপন্যাসের এক মুখ্য চরিত্র Cyril Fielding ঈশ্বর বিশ্বাসী নয় কিন্তু অবিশ্বাসী নাস্তিকও সে নয়। কাঁধের লুকানো ডানা মেলে দিয়ে মানুষ যখন হঠাৎ পথকে সমল করে বেরিয়ে পড়ে, তখন Fielding অভিভূত হয়ে যায়। ভারতবর্ষে যুগে যুগে মুঘল, ইংরেজরা এসেছে কিন্তু সবাই মিশে গেছে ভারতবর্ষের আত্মায়। তবুও ব্রিটিশ Fielding এর বাড়ানো হাত ধরলো না ভারতীয় Dr. Aziz। পূর্ব পশ্চিমের মিলন অত সহজে সম্ভব হয় না, হবে না। উপন্যাসের প্রধান চরিত্রগুলোর মধ্যে রয়েছে- Adela Quested, Mrs. Moore, Dr. Aziz, Cyril Fielding।", "page": 231}, {"id": "q182", "chapter": "Chapter 7: The Modern Period", "section": "7.8 E.M. Forster", "exam": "42nd, 36th BCS", "q": "\"A Passage to India\" is written by:", "options": [{"id": "a", "text": "E.M. Forster"}, {"id": "b", "text": "Nirad C. Chaudhuri"}, {"id": "c", "text": "Rudyard Kipling"}, {"id": "d", "text": "Walt Whitman"}], "correct": "a", "expl": "E.M. Forster.", "page": 231}, {"id": "q183", "chapter": "Chapter 7: The Modern Period", "section": "7.8 E.M. Forster", "exam": "41st BCS", "q": "Adela Quested and Mrs. Moore are characters from the novel-", "options": [{"id": "a", "text": "David Copperfield"}, {"id": "b", "text": "The Return of the Native"}, {"id": "c", "text": "A Passage to India"}, {"id": "d", "text": "Adam Bede"}], "correct": "c", "expl": "A Passage to India.", "page": 231}, {"id": "q184", "chapter": "Chapter 7: The Modern Period", "section": "7.9 Other Prominent Authors", "exam": "48th BCS (স্বাস্থ্য)", "q": "Lord of the Flies was written by ___.", "options": [{"id": "a", "text": "William Shakespeare"}, {"id": "b", "text": "William Wordsworth"}, {"id": "c", "text": "William Golding"}, {"id": "d", "text": "T.S. Eliot"}], "correct": "c", "expl": "Lord of the Flies একটি বিখ্যাত allegorical novel, যা William Golding ১৯৫৪ সালে লিখেছিলেন। William Golding এর অন্যান্য বিখ্যাত উপন্যাস- The Inheritors (1955), Pincher Martin (1956), Free Fall (1959), The Spire (1964), Darkness Visible (1979).", "page": 232}, {"id": "q185", "chapter": "Chapter 7: The Modern Period", "section": "7.9 Other Prominent Authors", "exam": "47th BCS", "q": "Who wrote the novella 'Heart of Darkness'?", "options": [{"id": "a", "text": "Joseph Conrad"}, {"id": "b", "text": "Doris Lessing"}, {"id": "c", "text": "John Osborne"}, {"id": "d", "text": "Thomas Hardy"}], "correct": "a", "expl": "Joseph Conrad (১৮৫৭-১৯২৪) ছিলেন একজন পোলিশ-ব্রিটিশ ঔপন্যাসিক, যিনি মানব প্রকৃতি, নৈতিকতা এবং সাম্রাজ্যবাদের মতো বিষয় নিয়ে লেখার জন্য পরিচিত। 'Heart of Darkness' নভেলাটি ইউরোপীয় উপনিবেশবাদের অন্ধকার দিক এবং ঔপনিবেশিক ও উপনিবেশিত উভয় পক্ষের নৈতিক অবক্ষয়কে গভীরভাবে তুলে ধরেছে। 'Heart of Darkness' উপন্যাসের প্রধান চরিত্রগুলো- Marlow (protagonist), Kurtz, The Manager, The Accountant, T
