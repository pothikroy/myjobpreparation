<script>
(function(){
"use strict";

/* ================= DATA ================= */
const QUESTIONS = JSON.parse(document.getElementById('questions-data').textContent);
const LETTERS = ['a','b','c','d'];

// Derive chapters/sections structure
const CHAPTERS = [];
(function buildStructure(){
  const chMap = new Map();
  QUESTIONS.forEach(q=>{
    if(!chMap.has(q.chapter)) chMap.set(q.chapter, new Map());
    const secMap = chMap.get(q.chapter);
    if(!secMap.has(q.section)) secMap.set(q.section, []);
    secMap.get(q.section).push(q.id);
  });
  chMap.forEach((secMap, chName)=>{
    const sections = [];
    secMap.forEach((qids, secName)=> sections.push({name:secName, qids}));
    const allQids = sections.reduce((a,s)=>a.concat(s.qids),[]);
    CHAPTERS.push({name:chName, sections, qids:allQids});
  });
})();

function qById(id){ return QUESTIONS.find(q=>q.id===id); }

/* ================= STORE (localStorage) ================= */
const STORE_KEY = 'els_progress_v1';
let DB = loadDB();
function defaultDB(){
  return {
    q: {},           // qid -> {status, attempts:[{correct,date}], bookmarked, note, nextRevision, interval, wrongCount, lastStudied}
    sessions: [],     // {date, topic, minutes}
    quizzes: [],       // {date, scope, total, correct, wrong, unanswered, seconds}
    streak: {current:0, longest:0, lastDate:null, totalDays:0},
    settings: {theme:'light'},
    dailyPlanDone: {} // date -> [taskIndex,...]
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultDB(), parsed, {q: Object.assign({}, parsed.q||{})});
  }catch(e){ console.error('Failed to load progress', e); return defaultDB(); }
}
function saveDB(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){ console.error('Save failed', e); }
}
function qState(id){
  if(!DB.q[id]) DB.q[id] = {status:'new', attempts:[], bookmarked:false, note:'', nextRevision:null, interval:0, wrongCount:0, lastStudied:null};
  return DB.q[id];
}

const REVISION_INTERVALS = [1,3,7,14,30,60]; // days

function markStudyToday(){
  const today = new Date().toISOString().slice(0,10);
  if(DB.streak.lastDate === today) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(DB.streak.lastDate === y){ DB.streak.current += 1; } else { DB.streak.current = 1; }
  DB.streak.longest = Math.max(DB.streak.longest, DB.streak.current);
  DB.streak.totalDays += 1;
  DB.streak.lastDate = today;
  saveDB();
}

function recordAnswer(qid, correct){
  const s = qState(qid);
  s.attempts.push({correct, date:new Date().toISOString()});
  s.lastStudied = new Date().toISOString();
  if(correct){
    s.interval = Math.min(s.interval+1, REVISION_INTERVALS.length-1);
    if(s.status==='new' || s.status==='learning') s.status='learning';
    const recentWrong = s.attempts.slice(-3).filter(a=>!a.correct).length;
    if(s.attempts.length>=2 && recentWrong===0 && s.attempts.filter(a=>a.correct).length>=2) s.status='mastered';
  }else{
    s.wrongCount += 1;
    s.interval = 0;
    s.status = s.wrongCount>=3 ? 'weak' : 'revision';
  }
  const days = REVISION_INTERVALS[s.interval];
  const nr = new Date(); nr.setDate(nr.getDate()+days);
  s.nextRevision = nr.toISOString().slice(0,10);
  markStudyToday();
  saveDB();
}

function setStatus(qid, status){
  const s = qState(qid);
  s.status = status;
  if(status==='mastered'){ s.interval = REVISION_INTERVALS.length-1; }
  if(status==='revision'||status==='weak'){ s.interval=0; }
  const days = REVISION_INTERVALS[s.interval]||1;
  const nr = new Date(); nr.setDate(nr.getDate()+days);
  s.nextRevision = nr.toISOString().slice(0,10);
  saveDB();
}
function toggleBookmark(qid){ const s=qState(qid); s.bookmarked=!s.bookmarked; saveDB(); }
function setNote(qid, text){ const s=qState(qid); s.note=text; saveDB(); }

function isOverdue(qid){
  const s = DB.q[qid];
  if(!s || !s.nextRevision) return false;
  return s.nextRevision <= new Date().toISOString().slice(0,10) && (s.status==='revision'||s.status==='weak'||s.status==='learning'||s.status==='mastered');
}
function isDueToday(qid){
  const s = DB.q[qid];
  if(!s || !s.nextRevision) return false;
  return s.nextRevision === new Date().toISOString().slice(0,10);
}

/* ================= STATS ================= */
function computeStats(qids){
  qids = qids || QUESTIONS.map(q=>q.id);
  let attempted=0, correct=0, wrong=0, mastered=0, needsRevision=0, bookmarked=0, weak=0;
  qids.forEach(id=>{
    const s = DB.q[id];
    if(!s) return;
    if(s.attempts.length>0) attempted++;
    const lastAtt = s.attempts[s.attempts.length-1];
    if(lastAtt){ if(lastAtt.correct) correct++; else wrong++; }
    if(s.status==='mastered') mastered++;
    if(s.status==='revision') needsRevision++;
    if(s.status==='weak') weak++;
    if(s.bookmarked) bookmarked++;
  });
  return {total:qids.length, attempted, correct, wrong, mastered, needsRevision, weak, bookmarked,
    remaining: qids.length-attempted,
    accuracy: attempted? Math.round(correct/attempted*100):0};
}
function revisionDueToday(qids){
  qids = qids || QUESTIONS.map(q=>q.id);
  return qids.filter(isDueToday);
}
function revisionOverdue(qids){
  qids = qids || QUESTIONS.map(q=>q.id);
  return qids.filter(id=>{
    const s = DB.q[id];
    if(!s || !s.nextRevision) return false;
    return s.nextRevision < new Date().toISOString().slice(0,10);
  });
}
function wrongQuestions(qids){
  qids = qids || QUESTIONS.map(q=>q.id);
  return qids.filter(id=> DB.q[id] && DB.q[id].wrongCount>0)
    .sort((a,b)=> (DB.q[b].wrongCount)-(DB.q[a].wrongCount));
}
function bookmarkedQuestions(qids){
  qids = qids || QUESTIONS.map(q=>q.id);
  return qids.filter(id=> DB.q[id] && DB.q[id].bookmarked);
}
function topicStrength(qids){
  const st = computeStats(qids);
  if(st.attempted===0) return {label:'Unstudied', cls:''};
  if(st.mastered >= qids.length*0.7) return {label:'Mastered', cls:'mastered'};
  if(st.accuracy>=75 && st.attempted>=qids.length*0.5) return {label:'Strong', cls:'strong'};
  if(st.accuracy>=45) return {label:'Developing', cls:'dev'};
  return {label:'Weak', cls:'weak'};
}

/* ================= ROUTER ================= */
const ROUTES = [
  {id:'dashboard', label:'Dashboard', icon:'&#127968;'},
  {id:'topics', label:'Topics', icon:'&#128218;'},
  {id:'map', label:'Literature Map', icon:'&#128214;'},
  {id:'revision', label:'Revision Due', icon:'&#128308;'},
  {id:'mistakes', label:'My Mistakes', icon:'&#10060;'},
  {id:'bookmarks', label:'Bookmarked', icon:'&#11088;'},
  {id:'quiz', label:'Quiz Mode', icon:'&#128221;'},
  {id:'quickrev', label:'Quick Revision', icon:'&#9889;'},
  {id:'focus', label:'Focus Mode', icon:'&#9201;'},
  {id:'progress', label:'Progress', icon:'&#128202;'},
  {id:'settings', label:'Settings', icon:'&#9881;'},
];
let state = { route:'dashboard', params:{} };

function navTo(route, params){
  state.route = route; state.params = params||{};
  renderNav(); render();
  window.scrollTo(0,0);
  document.getElementById('sidebar').classList.remove('open');
}

function renderNav(){
  const nav = document.getElementById('mainnav');
  nav.innerHTML = ROUTES.map(r=>
    `<button data-route="${r.id}" class="${state.route===r.id?'active':''}"><span class="ic">${r.icon}</span>${r.label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(b=> b.onclick = ()=> navTo(b.dataset.route));
}

/* ================= UTIL RENDER HELPERS ================= */
function esc(s){ return (s+'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function highlight(text, term){
  if(!term) return esc(text);
  const idx = text.toLowerCase().indexOf(term.toLowerCase());
  if(idx===-1) return esc(text);
  return esc(text.slice(0,idx)) + '<mark>' + esc(text.slice(idx,idx+term.length)) + '</mark>' + esc(text.slice(idx+term.length));
}
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toastroot').appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function fmtDate(iso){ if(!iso) return '-'; return iso; }
function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso), t = new Date(new Date().toISOString().slice(0,10));
  return Math.round((d-t)/86400000);
}

/* ================= QUESTION CARD RENDERING ================= */
function renderQuestionCard(q, opts){
  opts = opts||{};
  const s = qState(q.id);
  const answered = s.attempts.length>0 && !opts.forceUnanswered;
  const lastAnswered = opts.sessionAnswered && opts.sessionAnswered[q.id];
  const shown = opts.revealAll || lastAnswered;
  const wrap = document.createElement('div');
  wrap.className='qcard'; wrap.dataset.qid=q.id;

  const statusLbl = {new:'Not Reviewed &#9898;', learning:'Learning &#128309;', revision:'Needs Revision &#128993;', weak:'Weak &#128308;', mastered:'Mastered &#128994;'};

  wrap.innerHTML = `
    <div class="qmeta">
      <span class="tag">${esc(q.chapter.replace(/^Chapter \\d+: /,''))}</span>
      <span class="tag">${esc(q.section)}</span>
      <span class="tag">${esc(q.exam)}</span>
      <span class="tag" title="Source page">PDF p.${q.page}</span>
      ${s.status!=='new'?`<span class="tag">${statusLbl[s.status]}</span>`:''}
    </div>
    <div class="qtext">${opts.term? highlight(q.q,opts.term): esc(q.q)}</div>
    <div class="opts"></div>
    <div class="explwrap"></div>
    <div class="actionrow"></div>
    <div class="notebox">
      <span class="nlbl">My Note (not from source)</span>
      <textarea placeholder="Add a personal note or memory hook...">${esc(s.note||'')}</textarea>
    </div>
  `;

  const optsWrap = wrap.querySelector('.opts');
  let optOrder = q.options.slice();
  if(opts.shuffleOptions){ optOrder = optOrder.slice().sort(()=>Math.random()-0.5); }

  let userPicked = opts.sessionAnswered ? opts.sessionAnswered[q.id] : null;
  let revealed = shown || false;

  function draw(){
    optsWrap.innerHTML='';
    optOrder.forEach(o=>{
      const div = document.createElement('div');
      let cls='opt';
      if(revealed){
        cls+=' disabled';
        if(o.id===q.correct) cls+=' correct';
        else if(userPicked===o.id) cls+=' wrong';
      } else if(userPicked===o.id){ cls+=' selected'; }
      div.className = cls;
      div.innerHTML = `<span class="oletter">${o.id.toUpperCase()}.</span><span>${opts.term? highlight(o.text,opts.term): esc(o.text)}</span>`;
      if(!revealed){
        div.onclick = ()=>{ userPicked=o.id; draw(); };
      }
      optsWrap.appendChild(div);
    });
    renderExpl(); renderActions();
  }

  function renderExpl(){
    const ew = wrap.querySelector('.explwrap');
    if(!revealed){ ew.innerHTML=''; return; }
    ew.innerHTML = `<div class="expl"><span class="lbl">&#128220; Source Explanation</span>${esc(q.expl)}</div>
      <div class="sourceline">Source: English_Literature.pdf — page ${q.page}</div>`;
  }

  function renderActions(){
    const ar = wrap.querySelector('.actionrow');
    ar.innerHTML='';
    if(!revealed){
      const checkBtn = document.createElement('button');
      checkBtn.className='btn primary sm';
      checkBtn.textContent = userPicked? 'Check Answer' : 'Select an option first';
      checkBtn.disabled = !userPicked;
      checkBtn.onclick = ()=>{
        revealed = true;
        const correct = userPicked===q.correct;
        recordAnswer(q.id, correct);
        if(opts.onAnswered) opts.onAnswered(q.id, correct);
        draw();
        renderTopbarBadges();
      };
      ar.appendChild(checkBtn);
      const revealBtn = document.createElement('button');
      revealBtn.className='btn sm ghost';
      revealBtn.textContent='Reveal Answer';
      revealBtn.onclick = ()=>{ revealed=true; if(!userPicked){ } draw(); };
      ar.appendChild(revealBtn);
    } else {
      [['learning','I knew this'],['revision','Need Revision'],['weak',"I got this wrong"],['mastered','Mastered']].forEach(([st,label])=>{
        const b=document.createElement('button');
        b.className='statuschip'+(s.status===st?' active':'');
        b.textContent=label;
        b.onclick=()=>{ setStatus(q.id, st); draw(); wrap.querySelector('.qmeta').innerHTML = wrap.querySelector('.qmeta').innerHTML; toast('Status updated'); renderTopbarBadges(); };
        ar.appendChild(b);
      });
    }
    const bmBtn=document.createElement('button');
    bmBtn.className='statuschip'+(s.bookmarked?' active':'');
    bmBtn.innerHTML = s.bookmarked? '&#11088; Bookmarked' : '&#9734; Bookmark';
    bmBtn.onclick=()=>{ toggleBookmark(q.id); bmBtn.className='statuschip'+(s.bookmarked?' active':''); bmBtn.innerHTML = s.bookmarked? '&#11088; Bookmarked' : '&#9734; Bookmark'; };
    ar.appendChild(bmBtn);
  }

  wrap.querySelector('textarea').addEventListener('input', e=> setNote(q.id, e.target.value));
  draw();
  return wrap;
}

/* ================= PAGES ================= */
function render(){
  const c = document.getElementById('content');
  c.innerHTML='';
  const fn = PAGES[state.route] || PAGES.dashboard;
  fn(c);
}

const PAGES = {};

/* ---- DASHBOARD ---- */
PAGES.dashboard = function(c){
  const st = computeStats();
  const overdue = revisionOverdue().length;
  const dueToday = revisionDueToday().length;
  c.innerHTML = `
    <h1 class="pagetitle">Dashboard</h1>
    <p class="pagesub">Source: English Literature.pdf — ${QUESTIONS.length} questions across ${CHAPTERS.length} periods</p>
    <div class="grid cols-4" id="statgrid"></div>
    <h2 class="section-title">What Should I Study Now?</h2>
    <div id="whatnow"></div>
    <h2 class="section-title">Today's Study Plan</h2>
    <div id="planbox" class="card"></div>
  `;
  const statgrid = c.querySelector('#statgrid');
  const stats = [
    ['Total Topics', CHAPTERS.reduce((a,ch)=>a+ch.sections.length,0), ''],
    ['Total Questions', st.total, ''],
    ['Attempted', st.attempted, ''],
    ['Remaining', st.remaining, ''],
    ['Correct (last try)', st.correct, 'good'],
    ['Incorrect (last try)', st.wrong, 'warn'],
    ['Mastered', st.mastered, 'good'],
    ['Needs Revision', st.needsRevision+st.weak, 'warn'],
    ['Bookmarked', st.bookmarked, 'accent'],
    ['Study Sessions', DB.streak.totalDays, ''],
    ['Current Streak', DB.streak.current+' days', 'accent'],
    ['Revision Due Today', dueToday, dueToday>0?'warn':''],
  ];
  stats.forEach(([lbl,num,cls])=>{
    const d=document.createElement('div');
    d.className='card stat '+(cls||'');
    d.innerHTML=`<div class="num">${num}</div><div class="lbl">${lbl}</div>`;
    statgrid.appendChild(d);
  });
  statgrid.insertAdjacentHTML('beforeend', `<div class="card stat"><div class="num">${st.total?Math.round(st.attempted/st.total*100):0}%</div><div class="lbl">Overall Progress</div></div>`);

  // What should I study now
  const whatnow = c.querySelector('#whatnow');
  const priorities = [];
  if(overdue>0) priorities.push({label:`${overdue} overdue revision${overdue>1?'s':''}`, route:'revision', icon:'&#128308;'});
  const wq = wrongQuestions();
  if(wq.length>0) priorities.push({label:`${wq.length} frequently wrong question${wq.length>1?'s':''}`, route:'mistakes', icon:'&#10060;'});
  const weakTopics = CHAPTERS.flatMap(ch=>ch.sections.map(s=>({...s, strength:topicStrength(s.qids)})))
      .filter(s=>s.strength.cls==='weak' || s.strength.cls==='dev');
  if(weakTopics.length>0) priorities.push({label:`${weakTopics.length} weak/developing topic${weakTopics.length>1?'s':''}: ${weakTopics.slice(0,3).map(t=>t.name).join(', ')}`, route:'topics', icon:'&#128293;'});
  const unstudied = QUESTIONS.filter(q=> !DB.q[q.id] || DB.q[q.id].attempts.length===0).length;
  if(unstudied>0) priorities.push({label:`${unstudied} unstudied question${unstudied>1?'s':''}`, route:'topics', icon:'&#128366;'});
  if(dueToday>0) priorities.push({label:`${dueToday} revision${dueToday>1?'s':''} due today`, route:'revision', icon:'&#128197;'});
  if(priorities.length===0) priorities.push({label:'Great work — nothing urgent. Try a fresh quiz!', route:'quiz', icon:'&#127881;'});
  whatnow.innerHTML='';
  priorities.slice(0,5).forEach(p=>{
    const d=document.createElement('div');
    d.className='topic-row';
    d.innerHTML=`<span style="font-size:18px">${p.icon}</span><span class="ttitle">${esc(p.label)}</span><button class="btn sm">Go &#8594;</button>`;
    d.onclick=()=>navTo(p.route);
    whatnow.appendChild(d);
  });

  // Today's study plan
  const plan = [];
  if(overdue+dueToday>0) plan.push('Revision overdue — '+(overdue+dueToday)+' items (~'+Math.max(10,(overdue+dueToday)*1)+' min)');
  if(weakTopics.length>0) plan.push('Weak topics: '+weakTopics.slice(0,2).map(t=>t.name).join(', ')+' (~20 min)');
  if(wq.length>0) plan.push('My Mistakes review — '+wq.length+' items (~10 min)');
  if(unstudied>0) plan.push('New material: '+Math.min(unstudied,15)+' fresh questions (~15 min)');
  plan.push('Quick Quiz — 10 questions (~10 min)');
  const planbox = c.querySelector('#planbox');
  const today = new Date().toISOString().slice(0,10);
  DB.dailyPlanDone[today] = DB.dailyPlanDone[today]||[];
  planbox.innerHTML = plan.map((p,i)=>{
    const done = DB.dailyPlanDone[today].includes(i);
    return `<label style="display:flex;gap:10px;align-items:center;padding:7px 0;${done?'opacity:.5;text-decoration:line-through;':''}">
      <input type="checkbox" data-i="${i}" ${done?'checked':''}> <span>${esc(p)}</span></label>`;
  }).join('');
  planbox.querySelectorAll('input').forEach(inp=>{
    inp.onchange = ()=>{
      const i = +inp.dataset.i;
      const arr = DB.dailyPlanDone[today];
      const idx = arr.indexOf(i);
      if(inp.checked){ if(idx===-1) arr.push(i); } else { if(idx>-1) arr.splice(idx,1); }
      saveDB(); render();
    };
  });
};

function runQuiz(container, ids, shuffleOptions){
  const area = container.querySelector('#quizArea');
  container.querySelector('#quizsetup').classList.add('hidden');
  let idx = 0;
  const answers = {}; // qid -> {picked, correct}
  const startTime = Date.now();

  function renderQ(){
    area.innerHTML = `<div class="small" style="margin-bottom:8px;">Question ${idx+1} of ${ids.length}</div>`;
    const q = qById(ids[idx]);
    const card = renderQuestionCard(q, {
      shuffleOptions: shuffleOptions,
      forceUnanswered:true,
      onAnswered:(qid,correct)=>{ answers[qid]={correct}; }
    });
    area.appendChild(card);
    const nav = document.createElement('div');
    nav.className='flex';
    nav.style.marginTop='14px';
    const prevBtn = document.createElement('button'); prevBtn.className='btn sm'; prevBtn.textContent='&#8592; Previous'; prevBtn.disabled = idx===0;
    prevBtn.onclick = ()=>{ idx--; renderQ(); };
    const nextBtn = document.createElement('button'); nextBtn.className='btn sm primary'; nextBtn.textContent = idx===ids.length-1? 'Finish Quiz' : 'Next &#8594;';
    nextBtn.onclick = ()=>{
      if(idx===ids.length-1){ finishQuiz(); } else { idx++; renderQ(); }
    };
    nav.appendChild(prevBtn); nav.appendChild(nextBtn);
    area.appendChild(nav);
  }

  function finishQuiz(){
    const seconds = Math.round((Date.now()-startTime)/1000);
    const total = ids.length;
    const correct = Object.values(answers).filter(a=>a.correct).length;
    const wrong = Object.values(answers).filter(a=>!a.correct).length;
    const unanswered = total - correct - wrong;
    const pct = total? Math.round(correct/total*100):0;
    DB.quizzes.push({date:new Date().toISOString(), total, correct, wrong, unanswered, seconds});
    saveDB();
    const wrongIds = ids.filter(id=> answers[id] && !answers[id].correct);
    const weakTopicsSet = new Set();
    wrongIds.forEach(id=>{ const q=qById(id); weakTopicsSet.add(q.section); });
    area.innerHTML = `
      <div class="card">
        <h2 style="font-family:var(--serif);margin-top:0;">Quiz Results</h2>
        <div class="grid cols-4">
          <div class="card stat good"><div class="num">${pct}%</div><div class="lbl">Score</div></div>
          <div class="card stat good"><div class="num">${correct}</div><div class="lbl">Correct</div></div>
          <div class="card stat warn"><div class="num">${wrong}</div><div class="lbl">Wrong</div></div>
          <div class="card stat"><div class="num">${unanswered}</div><div class="lbl">Unanswered</div></div>
        </div>
        <p class="small" style="margin-top:12px;">Time taken: ${Math.floor(seconds/60)}m ${seconds%60}s · Accuracy: ${pct}%</p>
        ${weakTopicsSet.size? `<p class="small">Weak topics this quiz: ${Array.from(weakTopicsSet).join(', ')}</p>`:''}
        <div class="flex" style="margin-top:14px;">
          ${wrongIds.length? `<button class="btn primary" id="reviseNowBtn">Revise These Now (${wrongIds.length})</button>`:''}
          <button class="btn" id="newQuizBtn">New Quiz</button>
        </div>
      </div>
    `;
    if(wrongIds.length) area.querySelector('#reviseNowBtn').onclick = ()=> navTo('quiz',{presetScope:wrongIds, presetName:'Quiz Mistakes'});
    area.querySelector('#newQuizBtn').onclick = ()=> navTo('quiz');
    renderTopbarBadges();
  }
  renderQ();
}

PAGES.quickrev = function(c){
  const pool = revisionOverdue().concat(revisionDueToday());
  const fallback = pool.length? pool : QUESTIONS.filter(q=>!DB.q[q.id]||DB.q[q.id].attempts.length===0).map(q=>q.id).slice(0,20);
  c.innerHTML = `<h1 class="pagetitle">Quick Revision</h1><p class="pagesub">Distraction-free: Question → Think → Reveal → Mark. ${fallback.length} cards queued.</p><div id="qr"></div>`;
  const qr = c.querySelector('#qr');
  if(fallback.length===0){ qr.innerHTML = `<div class="empty"><div class="big">&#127881;</div>Nothing to revise right now.</div>`; return; }
  let i=0;
  function draw(){
    qr.innerHTML='';
    if(i>=fallback.length){ qr.innerHTML = `<div class="empty"><div class="big">&#9989;</div>Quick revision complete!</div>`; return; }
    qr.insertAdjacentHTML('beforeend', `<div class="small">Card ${i+1} / ${fallback.length}</div>`);
    const q = qById(fallback[i]);
    const card = renderQuestionCard(q, {forceUnanswered:true, onAnswered:()=>{}});
    qr.appendChild(card);
    const nav = document.createElement('div'); nav.className='flex'; nav.style.marginTop='10px';
    const skip = document.createElement('button'); skip.className='btn sm ghost'; skip.textContent='Skip';
    skip.onclick=()=>{ i++; draw(); };
    const next = document.createElement('button'); next.className='btn sm primary'; next.textContent='Next Card &#8594;';
    next.onclick=()=>{ i++; draw(); };
    nav.appendChild(skip); nav.appendChild(next);
    qr.appendChild(nav);
  }
  draw();
};

function startFocusSession(area, topic){
  let idx=0, correct=0, wrong=0, seconds=0, paused=false;
  const startAt = Date.now();
  let timerInt = setInterval(()=>{ if(!paused){ seconds++; updateTimer(); } },1000);
  function updateTimer(){
    const t = area.querySelector('#focusTimer');
    if(t) t.textContent = String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
  }
  function draw(){
    if(idx>=topic.qids.length){
      clearInterval(timerInt);
      area.innerHTML = `<div class="card">
        <h2 style="font-family:var(--serif);margin-top:0;">Focus Session Complete</h2>
        <p>Time spent: ${Math.floor(seconds/60)}m ${seconds%60}s</p>
        <p>Questions attempted: ${correct+wrong} · Correct: ${correct} · Incorrect: ${wrong}</p>
        <button class="btn primary" id="exitFocus">Back to Focus Mode</button>
      </div>`;
      area.querySelector('#exitFocus').onclick = ()=> navTo('focus');
      markStudyToday();
      return;
    }
    area.innerHTML = `<div class="flex between" style="margin-bottom:10px;">
      <div class="small">${esc(topic.name)} — Question ${idx+1}/${topic.qids.length}</div>
      <div class="flex"><span class="tag" id="focusTimer">00:00</span>
        <button class="btn sm" id="pauseBtn">${paused?'Resume':'Pause'}</button></div>
    </div>`;
    updateTimer();
    area.querySelector('#pauseBtn').onclick = ()=>{ paused=!paused; draw(); };
    const card = renderQuestionCard(qById(topic.qids[idx]), {forceUnanswered:true, onAnswered:(qid,c)=>{ if(c) correct++; else wrong++; }});
    area.appendChild(card);
    const nextBtn=document.createElement('button');
    nextBtn.className='btn primary sm'; nextBtn.style.marginTop='10px';
    nextBtn.textContent = idx===topic.qids.length-1? 'Finish Session' : 'Next Question &#8594;';
    nextBtn.onclick = ()=>{ idx++; draw(); };
    area.appendChild(nextBtn);
  }
  draw();
}

    </div>
    <div class="card" style="margin-bottom:16px;">
      <div class="eyebrow">Backup</div>
      <p class="small">Export all your progress, notes, bookmarks and quiz history to a JSON file, or import a previous backup.</p>
      <button class="btn primary" id="exportBtn">Export Progress</button>
      <button class="btn" id="importBtn">Import Progress</button>
      <input type="file" id="importFile" accept="application/json" class="hidden">
    </div>
    <div class="card">
      <div class="eyebrow">Reset</div>
      <p class="small">These actions cannot be undone.</p>
      <button class="btn danger" id="resetQuizBtn">Reset Quiz History</button>
      <button class="btn danger" id="resetAllBtn">Reset All Progress</button>
    </div>
    <h2 class="section-title">Keyboard Shortcuts</h2>
    <div class="card small">
      <p><kbd class="shortkey">1</kbd>-<kbd class="shortkey">4</kbd> Select option A-D &nbsp; <kbd class="shortkey">Enter</kbd> Reveal/Next &nbsp; <kbd class="shortkey">R</kbd> Needs Revision &nbsp; <kbd class="shortkey">M</kbd> Mastered &nbsp; <kbd class="shortkey">B</kbd> Bookmark &nbsp; <kbd class="shortkey">N</kbd> Next question &nbsp; <kbd class="shortkey">P</kbd> Previous question</p>
    </div>
  `;
  c.querySelector('#toggleThemeBtn').onclick = toggleTheme;
  c.querySelector('#exportBtn').onclick = exportProgress;
  c.querySelector('#importBtn').onclick = ()=> c.querySelector('#importFile').click();
  c.querySelector('#importFile').onchange = importProgress;
  c.querySelector('#resetQuizBtn').onclick = ()=> confirmModal('Reset quiz history?','This will delete all quiz attempt records.', ()=>{ DB.quizzes=[]; saveDB(); toast('Quiz history reset'); render(); });
  c.querySelector('#resetAllBtn').onclick = ()=> confirmModal('Reset ALL progress?','This deletes every status, note, bookmark and quiz record permanently.', ()=>{
    confirmModal('Are you absolutely sure?','This cannot be undone.', ()=>{ DB = defaultDB(); saveDB(); toast('All progress reset'); navTo('dashboard'); });
  });
};

/* ================= SEARCH ================= */
function runSearch(term){
  term = term.trim();
  const c = document.getElementById('content');
  if(!term){ navTo('dashboard'); return; }
  const t = term.toLowerCase();
  const results = QUESTIONS.filter(q=>
    q.q.toLowerCase().includes(t) ||
    q.options.some(o=>o.text.toLowerCase().includes(t)) ||
    q.section.toLowerCase().includes(t) ||
    q.chapter.toLowerCase().includes(t) ||
    q.exam.toLowerCase().includes(t)
  );
  state.route='__search'; state.params={};
  renderNav();
  c.innerHTML = `<h1 class="pagetitle">Search Results</h1><p class="pagesub">${results.length} result(s) for "${esc(term)}"</p><div id="sres"></div>`;
  const sres = c.querySelector('#sres');
  if(results.length===0){ sres.innerHTML = `<div class="empty">No matches found.</div>`; return; }
  results.forEach(q=> sres.appendChild(renderQuestionCard(q, {term})));
}

/* ================= MODAL / TOAST / THEME ================= */
function confirmModal(title, body, onConfirm){
  const root = document.getElementById('modalroot');
  root.innerHTML = `<div class="modalbg"><div class="modal">
    <h3>${esc(title)}</h3><p class="small">${esc(body)}</p>
    <div class="flex" style="margin-top:16px;justify-content:flex-end;">
      <button class="btn" id="cancelM">Cancel</button>
      <button class="btn danger" id="okM">Confirm</button>
    </div></div></div>`;
  root.querySelector('#cancelM').onclick = ()=> root.innerHTML='';
  root.querySelector('#okM').onclick = ()=>{ root.innerHTML=''; onConfirm(); };
}
function toggleTheme(){
  DB.settings.theme = DB.settings.theme==='dark' ? 'light' : 'dark';
  applyTheme(); saveDB();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', DB.settings.theme==='dark'?'dark':'light');
  document.body.setAttribute('data-theme', DB.settings.theme==='dark'?'dark':'light');
}
function exportProgress(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='english_literature_progress_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Progress exported');
}
function importProgress(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(typeof parsed !== 'object' || parsed===null) throw new Error('bad format');
      DB = Object.assign(defaultDB(), parsed, {q: Object.assign({}, parsed.q||{})});
      saveDB();
      toast('Progress imported successfully');
      navTo('dashboard');
    }catch(err){ toast('Import failed: invalid file'); }
  };
  reader.readAsText(file);
}

/* ================= TOPBAR / SEARCH BINDINGS ================= */
function renderTopbarBadges(){ /* placeholder for potential live badges */ }

document.getElementById('globalsearch').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ runSearch(e.target.value); }
});
document.getElementById('themebtn').onclick = toggleTheme;
document.getElementById('menubtn').onclick = ()=> document.getElementById('sidebar').classList.toggle('open');
document.getElementById('shortcutbtn').onclick = ()=> navTo('settings');

/* ================= KEYBOARD SHORTCUTS ================= */
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;
  const activeCard = document.querySelector('.qcard');
  if(!activeCard) return;
  if(['1','2','3','4'].includes(e.key)){
    const opts = activeCard.querySelectorAll('.opt:not(.disabled)');
    const i = parseInt(e.key,10)-1;
    if(opts[i]) opts[i].click();
  }
  if(e.key==='Enter'){
    const btn = activeCard.querySelector('.actionrow .btn.primary');
    if(btn && !btn.disabled) btn.click();
  }
  if(e.key.toLowerCase()==='b'){
    const chips = activeCard.querySelectorAll('.statuschip');
    const bm = Array.from(chips).find(x=>x.textContent.includes('Bookmark'));
    if(bm) bm.click();
  }
  if(e.key.toLowerCase()==='m'){
    const chips = activeCard.querySelectorAll('.statuschip');
    const mm = Array.from(chips).find(x=>x.textContent.includes('Mastered'));
    if(mm) mm.click();
  }
  if(e.key.toLowerCase()==='r'){
    const chips = activeCard.querySelectorAll('.statuschip');
    const rr = Array.from(chips).find(x=>x.textContent.includes('Revision'));
    if(rr) rr.click();
  }
});

/* ================= INIT ================= */
applyTheme();
renderNav();
render();

})();
</script>
