<title>কম্পিউটার ও তথ্য প্রযুক্তি — Interactive Study & Revision System</title>
<style>
:root{
  --bg:#f5f7fa; --bg2:#ffffff; --card:#ffffff; --text:#1a2233; --muted:#5c6b7a;
  --border:#e2e8f0; --accent:#2563eb; --accent2:#7c3aed; --green:#16a34a; --yellow:#d97706;
  --red:#dc2626; --grey:#94a3b8; --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --radius:14px; --sidebar-w:230px;
}
[data-theme="dark"]{
  --bg:#0f1520; --bg2:#161d2b; --card:#1a2233; --text:#e6ecf5; --muted:#93a2b8;
  --border:#2a3446; --accent:#5b8def; --accent2:#a78bfa; --green:#4ade80; --yellow:#fbbf24;
  --red:#f87171; --grey:#64748b; --shadow:0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:'Kalpurush','Noto Sans Bengali','Hind Siliguri','Segoe UI',system-ui,-apple-system,sans-serif;
  transition:background .2s,color .2s;}
/* Kalpurush is a widely-used Bengali font commonly pre-installed on Bangladeshi systems (e.g. via Avro Keyboard / Bijoy).
   Since this file must work fully offline, the font isn't embedded — the browser will use it automatically if
   installed on the user's device, and gracefully fall back to other Bengali-friendly fonts otherwise. */
body{display:flex;min-height:100vh;}
h1,h2,h3,h4{margin:0 0 .5em 0; font-weight:700}
button{font-family:inherit; cursor:pointer;}
a{color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ============ SIDEBAR ============ */
#sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; height:100vh; position:sticky; top:0; z-index:50;
}
#sidebar .brand{padding:18px 16px 10px 16px;}
#sidebar .brand h1{font-size:15px; line-height:1.3; margin:0;}
#sidebar .brand .src{font-size:11px; color:var(--muted); margin-top:4px;}
#navlist{list-style:none; margin:0; padding:8px; flex:1; overflow-y:auto;}
#navlist li{margin-bottom:2px;}
.navbtn{display:flex; align-items:center; gap:10px; width:100%; text-align:right; padding:10px 12px;
  border:none; background:transparent; color:var(--text); border-radius:10px; font-size:14px; font-weight:600;}
.navbtn:hover{background:var(--bg);}
.navbtn.active{background:var(--accent); color:#fff;}
.navbtn .ic{font-size:16px; width:20px; text-align:center;}
.navbtn .cnt{margin-inline-start:auto; font-size:11px; background:rgba(128,128,128,.2); padding:1px 7px; border-radius:20px;}
#sidebar-footer{padding:10px 14px 14px; border-top:1px solid var(--border); display:flex; gap:8px; align-items:center; justify-content:space-between;}
.theme-toggle{border:1px solid var(--border); background:var(--bg); border-radius:20px; padding:6px 12px; font-size:12px; color:var(--text); display:flex; align-items:center; gap:6px;}
.streak-badge{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px;}

/* mobile nav */
#mobilebar{display:none; position:fixed; bottom:0; left:0; right:0; background:var(--bg2); border-top:1px solid var(--border); z-index:60; padding:6px 2px; }
#mobilebar .mrow{display:flex; overflow-x:auto; gap:2px;}
#mobilebar button{flex:0 0 auto; background:none; border:none; color:var(--muted); font-size:10px; padding:6px 10px; border-radius:10px; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:56px;}
#mobilebar button.active{color:var(--accent); background:var(--bg);}
#mobilebar .ic{font-size:17px;}
#menutoggle{display:none;}

/* ============ MAIN ============ */
#main{flex:1; min-width:0; padding:22px 26px 70px 26px; max-width:1180px; margin:0 auto; width:100%;}
.pagehead{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.pagehead h2{font-size:22px;}
.pagehead .sub{color:var(--muted); font-size:13px; margin-top:2px;}

.grid{display:grid; gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.stat-card{display:flex; flex-direction:column; gap:6px;}
.stat-card .lbl{font-size:12px; color:var(--muted); font-weight:600;}
.stat-card .val{font-size:26px; font-weight:800;}
.stat-card .sub{font-size:11px; color:var(--muted);}

.progressbar{height:8px; border-radius:6px; background:var(--border); overflow:hidden; margin-top:6px;}
.progressbar > div{height:100%; background:var(--accent); border-radius:6px; transition:width .3s;}

.section-title{font-size:15px; font-weight:800; margin:26px 0 10px; display:flex; align-items:center; gap:8px;}
.pill{display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:3px 9px; border-radius:20px; font-weight:700;}
.pill.red{background:rgba(220,38,38,.12); color:var(--red);}
.pill.yellow{background:rgba(217,119,6,.12); color:var(--yellow);}
.pill.green{background:rgba(22,163,74,.12); color:var(--green);}
.pill.grey{background:rgba(148,163,184,.18); color:var(--muted);}
.pill.blue{background:rgba(37,99,235,.12); color:var(--accent);}

.btn{border:1px solid var(--border); background:var(--card); color:var(--text); padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn.primary:hover{opacity:.9;}
.btn.danger{background:var(--red); color:#fff; border-color:var(--red);}
.btn.sm{padding:5px 10px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.topic-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px; border:1px solid var(--border); border-radius:12px; background:var(--card); margin-bottom:10px; cursor:pointer;}
.topic-row:hover{border-color:var(--accent);}
.topic-row .ttl{font-weight:700; font-size:14.5px;}
.topic-row .meta{font-size:12px; color:var(--muted); margin-top:3px;}
.topic-row .right{display:flex; align-items:center; gap:12px; flex-shrink:0;}
.mini-progress{width:80px; height:6px; border-radius:4px; background:var(--border); overflow:hidden;}
.mini-progress>div{height:100%; background:var(--green);}

/* Question card */
.qcard{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:var(--shadow);}
.qcard .qmeta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; font-size:11px; color:var(--muted);}
.qcard .qtext{font-size:15.5px; font-weight:700; line-height:1.6; margin-bottom:14px;}
.opt{display:block; width:100%; text-align:left; padding:11px 14px; margin-bottom:8px; border-radius:10px; border:1.5px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;}
.opt:hover{border-color:var(--accent);}
.opt.correct{border-color:var(--green); background:rgba(22,163,74,.12); font-weight:700;}
.opt.wrong{border-color:var(--red); background:rgba(220,38,38,.12);}
.opt.selected:not(.correct):not(.wrong){border-color:var(--accent);}
.opt[disabled]{cursor:default;}
.explain{margin-top:14px; padding:14px; background:var(--bg); border-radius:10px; border:1px dashed var(--border); font-size:13.5px; line-height:1.75; display:none;}
.explain.show{display:block;}
.explain .lbl{font-weight:800; color:var(--accent); margin-bottom:6px; font-size:12.5px;}
.note-box{margin-top:8px; padding:10px; background:rgba(217,119,6,.08); border-radius:8px; font-size:12.5px; color:var(--yellow); border:1px dashed var(--yellow);}
.qactions{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.qactions .btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.mynote{width:100%; margin-top:12px; border:1px solid var(--border); border-radius:8px; padding:8px; background:var(--bg); color:var(--text); font-size:13px; font-family:inherit; resize:vertical; min-height:44px;}

/* ---- number-system conversion figure ---- */
.figbox{margin:10px 0 16px; padding:14px; border:1px dashed var(--border); border-radius:10px; background:var(--bg); overflow-x:auto;}
.figbox .figtitle{font-size:12px; font-weight:700; color:var(--accent); margin-bottom:10px;}
.figrow{display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap;}
.figrow .figlabel{font-size:11px; color:var(--muted); min-width:150px; flex-shrink:0;}
.figcells{display:flex; gap:6px; flex-wrap:wrap;}
.figcell{font-family:'Courier New',monospace; font-weight:700; font-size:14px; border:1.5px solid var(--border); border-radius:8px; padding:6px 12px; background:var(--card); text-align:center;}
.figarrowdown{text-align:center; color:var(--muted); font-size:16px; margin:2px 0;}
.figstepdivider{border-top:1px dashed var(--border); margin:10px 0;}

input[type=text], input[type=search], select{
  border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit;
}
.searchbar{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.searchbar input[type=search]{flex:1; min-width:180px;}
.filterrow{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.filterrow select{min-width:130px;}

.chiprow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.chip{padding:6px 13px; border-radius:20px; font-size:12.5px; border:1px solid var(--border); background:var(--card); color:var(--text); font-weight:600;}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}

.empty{text-align:center; padding:60px 20px; color:var(--muted);}
.empty .big{font-size:38px; margin-bottom:10px;}

/* Focus mode */
#focusOverlay{position:fixed; inset:0; background:var(--bg); z-index:200; display:none; flex-direction:column;}
#focusOverlay.show{display:flex;}
.focus-top{display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:1px solid var(--border); background:var(--bg2);}
.focus-timer{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums;}
.focus-body{flex:1; overflow-y:auto; padding:24px; max-width:760px; margin:0 auto; width:100%;}
.focus-progress{height:4px; background:var(--border);}
.focus-progress>div{height:100%; background:var(--accent);}

/* Quiz */
.quiz-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0;}
@media(max-width:560px){.quiz-summary{grid-template-columns:repeat(2,1fr);}}

/* modal */
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; display:none; align-items:center; justify-content:center; padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card); border-radius:16px; padding:22px; max-width:440px; width:100%; box-shadow:var(--shadow);}
.modal h3{margin-bottom:10px;}
.modal p{color:var(--muted); font-size:13.5px; line-height:1.6; margin-bottom:16px;}
.modal .row{display:flex; gap:8px; justify-content:flex-end;}

.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 20px;
  border-radius:30px; font-size:13px; z-index:400; display:none; box-shadow:0 4px 14px rgba(0,0,0,.3);}
[data-theme="dark"] .toast{background:#f1f5f9; color:#0f172a;}
.toast.show{display:block; animation:fadein .2s;}
@keyframes fadein{from{opacity:0; transform:translate(-50%,8px)} to{opacity:1; transform:translate(-50%,0)}}

.kbd{display:inline-block; border:1px solid var(--border); border-bottom-width:2px; border-radius:5px; padding:1px 7px; font-size:11px; font-family:monospace; background:var(--bg);}

@media(max-width:860px){
  #sidebar{display:none;}
  #mobilebar{display:block;}
  #main{padding:16px 14px 80px;}
  .grid.cols-4{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

<script>
try {
/* ============================================================
   ICT ইন্টারেক্টিভ স্টাডি সিস্টেম — সম্পূর্ণ অ্যাপ লজিক
   ============================================================ */
function b64DecodeUnicode(str){
  const binary = atob(str);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
const QUESTIONS = JSON.parse(b64DecodeUnicode(window.__QUESTIONS_B64__));
const STORAGE_KEY = 'ictStudySystem_v1';
const INTERVALS = [1,3,7,14,30,60]; // spaced repetition days

/* ---------- state ---------- */
function defaultState(){
  return {
    perQuestion: {},   // qid -> {status,box,correctCount,wrongCount,lastResult,bookmarked,note,nextRevision,lastReviewed,attempted}
    perTopic: {},      // subtopic -> {studyCount,firstStudied,lastStudied,timeSpentSec,customTime,sessions:[]}
    quizHistory: [],
    dailyPlanDone: {}, // dateStr -> {taskIdx:true}
    streak: {current:0, longest:0, lastStudyDate:null, studyDays:[]},
    settings: {theme:'light'},
    createdAt: nowISO()
  };
}
function nowISO(){ return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateObj, days){ const d=new Date(dateObj); d.setDate(d.getDate()+days); return d; }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d); return dt.toLocaleDateString('bn-BD',{day:'numeric',month:'short',year:'numeric'}); }
function daysBetween(a,b){ return Math.floor((new Date(b)-new Date(a))/(1000*60*60*24)); }

let STATE = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ console.error('state load failed', e); return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch(e){ console.error('save failed', e); toast('⚠️ সংরক্ষণে সমস্যা হয়েছে (স্টোরেজ ফুল?)'); }
}
function pq(qid){
  if(!STATE.perQuestion[qid]){
    STATE.perQuestion[qid] = {status:'new', box:0, correctCount:0, wrongCount:0, lastResult:null,
      bookmarked:false, note:'', nextRevision:null, lastReviewed:null, attempted:false, difficulty:null};
  }
  return STATE.perQuestion[qid];
}
function pt(subtopic){
  if(!STATE.perTopic[subtopic]){
    STATE.perTopic[subtopic] = {studyCount:0, firstStudied:null, lastStudied:null, timeSpentSec:0, customTime:null, sessions:[]};
  }
  return STATE.perTopic[subtopic];
}

/* ---------- topic structure derived from QUESTIONS ---------- */
const TOPIC_ORDER = [];
const TOPIC_MAP = {}; // subtopic -> {chapter, questions:[]}
QUESTIONS.forEach(q=>{
  if(!TOPIC_MAP[q.subtopic]){
    TOPIC_MAP[q.subtopic] = {chapter:q.chapter, subtopic:q.subtopic, questions:[]};
    TOPIC_ORDER.push(q.subtopic);
  }
  TOPIC_MAP[q.subtopic].questions.push(q);
});
const CHAPTERS = [...new Set(QUESTIONS.map(q=>q.chapter))];

function recommendedMinutes(subtopic){
  const t = pt(subtopic);
  if(t.customTime) return t.customTime;
  const n = TOPIC_MAP[subtopic].questions.length;
  return Math.max(15, Math.min(90, Math.round(n*2.2 + 6)));
}

/* ---------- streak logic ---------- */
function touchStreak(){
  const today = todayStr();
  const s = STATE.streak;
  if(s.lastStudyDate === today) return;
  if(s.lastStudyDate){
    const gap = daysBetween(s.lastStudyDate, today);
    if(gap === 1) s.current += 1;
    else if(gap > 1) s.current = 1;
  } else {
    s.current = 1;
  }
  s.lastStudyDate = today;
  s.longest = Math.max(s.longest, s.current);
  if(!s.studyDays.includes(today)) s.studyDays.push(today);
  saveState();
}

/* ---------- question status transitions ---------- */
function recordAnswer(qid, isCorrect){
  const q = pq(qid);
  q.attempted = true;
  if(isCorrect === true){
    q.correctCount++;
    q.lastResult = 'correct';
    if(q.status === 'new') q.status = 'learning';
  } else if(isCorrect === false){
    q.wrongCount++;
    q.lastResult = 'wrong';
    q.status = 'weak';
    q.box = 0;
    q.nextRevision = addDays(new Date(),1).toISOString();
  }
  q.lastReviewed = nowISO();
  touchStreak();
  saveState();
}
function setStatus(qid, status){
  const q = pq(qid);
  q.status = status;
  if(status === 'mastered'){
    q.box = Math.min(q.box+1, INTERVALS.length-1);
    q.nextRevision = addDays(new Date(), INTERVALS[q.box]).toISOString();
  } else if(status === 'weak'){
    q.box = 0;
    q.nextRevision = addDays(new Date(),1).toISOString();
  } else if(status === 'learning'){
    q.box = Math.max(q.box-1,0);
    q.nextRevision = addDays(new Date(), INTERVALS[q.box] || 1).toISOString();
  }
  q.lastReviewed = nowISO();
  touchStreak();
  saveState();
  render();
}
function toggleBookmark(qid){
  const q = pq(qid);
  q.bookmarked = !q.bookmarked;
  saveState();
  render();
}
function saveNote(qid, text){
  const q = pq(qid);
  q.note = text;
  saveState();
}
function setDifficulty(qid, level){
  pq(qid).difficulty = level;
  saveState();
  render();
}

function isDue(q){
  const st = pq(q.id);
  if(!st.nextRevision) return st.status==='weak';
  return new Date(st.nextRevision) <= new Date();
}
function autoDifficulty(q){
  // simple heuristic: based on options text length + explanation length + numeric/technical density
  const len = (q.question.length + q.explanation.length);
  if(len > 550) return 'hard';
  if(len > 320) return 'medium';
  return 'easy';
}

/* ---------- stats ---------- */
function computeStats(){
  const totalQ = QUESTIONS.length;
  const totalTopics = TOPIC_ORDER.length;
  let attempted=0, mastered=0, weak=0, learning=0, newC=0, bookmarked=0;
  QUESTIONS.forEach(q=>{
    const st = STATE.perQuestion[q.id];
    if(!st){ newC++; return; }
    if(st.attempted) attempted++;
    if(st.bookmarked) bookmarked++;
    if(st.status==='mastered') mastered++;
    else if(st.status==='weak') weak++;
    else if(st.status==='learning') learning++;
    else newC++;
  });
  let dueToday=0;
  QUESTIONS.forEach(q=>{ if(isDue(q)) dueToday++; });
  let topicsCompleted=0, topicsStudying=0;
  TOPIC_ORDER.forEach(t=>{
    const qs = TOPIC_MAP[t].questions;
    const masteredCt = qs.filter(q=> STATE.perQuestion[q.id] && STATE.perQuestion[q.id].status==='mastered').length;
    const attemptedCt = qs.filter(q=> STATE.perQuestion[q.id] && STATE.perQuestion[q.id].attempted).length;
    if(masteredCt === qs.length) topicsCompleted++;
    else if(attemptedCt>0) topicsStudying++;
  });
  let totalSessions=0, totalTimeSec=0;
  Object.values(STATE.perTopic).forEach(t=>{ totalSessions+=t.studyCount; totalTimeSec+=t.timeSpentSec; });
  let totalEstMin = 0;
  TOPIC_ORDER.forEach(t=> totalEstMin += recommendedMinutes(t));
  const overallPct = totalQ? Math.round((mastered/totalQ)*100) : 0;
  return {totalQ, totalTopics, attempted, mastered, weak, learning, newC, bookmarked, dueToday,
    topicsCompleted, topicsStudying, totalSessions, totalTimeSec, totalEstMin, overallPct};
}
function topicStats(subtopic){
  const qs = TOPIC_MAP[subtopic].questions;
  let mastered=0, weak=0, learning=0, attempted=0, correct=0;
  qs.forEach(q=>{
    const st = STATE.perQuestion[q.id];
    if(!st) return;
    if(st.attempted){ attempted++; if(st.lastResult==='correct') correct++; }
    if(st.status==='mastered') mastered++;
    else if(st.status==='weak') weak++;
    else if(st.status==='learning') learning++;
  });
  const total = qs.length;
  const pct = total? Math.round(((mastered*1 + learning*0.5)/total)*100) : 0;
  let strength='দুর্বল (Weak)';
  if(pct>=85) strength='দক্ষ (Mastered)';
  else if(pct>=60) strength='ভালো (Strong)';
  else if(pct>=30) strength='মাঝারি (Average)';
  return {total, mastered, weak, learning, attempted, correct, pct, strength};
}
function weakTopics(limit){
  return TOPIC_ORDER.map(t=>({t, s:topicStats(t)}))
    .filter(x=>x.s.attempted>0)
    .sort((a,b)=>a.s.pct-b.s.pct)
    .slice(0, limit||5);
}
function recentTopics(limit){
  return Object.entries(STATE.perTopic)
    .filter(([k,v])=>v.lastStudied)
    .sort((a,b)=> new Date(b[1].lastStudied) - new Date(a[1].lastStudied))
    .slice(0, limit||5)
    .map(([k])=>k);
}

/* priority engine for "what should I study now" */
function priorityList(){
  const items = [];
  QUESTIONS.forEach(q=>{
    const st = STATE.perQuestion[q.id];
    let score = 0, reason = '';
    if(st && st.wrongCount >= 2){ score += 50; reason = 'বারবার ভুল হচ্ছে'; }
    if(isDue(q) && st){ score += 40; reason = reason || 'রিভিশন বকেয়া'; }
    if(st && st.status==='weak'){ score += 30; reason = reason || 'দুর্বল চিহ্নিত'; }
    if(!st){ return; } // skip completely new for priority-now list (handled separately)
    if(score>0) items.push({q, score, reason});
  });
  items.sort((a,b)=>b.score-a.score);
  return items.slice(0,6);
}

function escapeHtml(str){

}
function attrJson(x){

}

function applyTopicFilter(){

}
function renderTopicQList(topic){
  const wrap = document.getElementById('topicQList');
  let qs = TOPIC_MAP[topic].questions;
  if(TOPIC_FILTER_STATE.status !== 'all'){
    qs = qs.filter(q=> pq(q.id).status === TOPIC_FILTER_STATE.status);
  }
  if(!qs.length){ wrap.innerHTML = `<div class="card empty">এই ফিল্টারে কোনো প্রশ্ন নেই।</div>`; return; }
  wrap.innerHTML = qs.map(q=>questionCard(q)).join('');
  attachQuestionCardHandlers();

    setTimeout(()=>{
      const el = document.getElementById('qc_'+ROUTE.params.jump);
      if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.style.outline='2px solid var(--accent)'; }

}
function quickStudySession(topic){
  const t = pt(topic);
  t.studyCount++;

  saveState();
  toast('✅ স্টাডি সেশন যোগ হয়েছে');

}

function questionCard(q, opts){
  opts = opts || {};

  }[st.status];

  const diffPill = `<span class="pill blue">${diff==='easy'?'সহজ':diff==='medium'?'মাঝারি':'কঠিন'}</span>`;
  const dueTxt = st.nextRevision ? `পরবর্তী রিভিশন: ${new Date(st.nextRevision)<=new Date()?'<b style=\"color:var(--red)\">আজই বকেয়া</b>':fmtDate(st.nextRevision)}` : '';
  const optsHtml = q.options.map((op,i)=>{
    return `<button class="opt" data-qid="${q.id}" data-idx="${i}">${['ক','খ','গ','ঘ'][i]}) ${escapeHtml(op)}</button>`;
  }).join('');
  return `<div class="qcard" id="qc_${q.id}">
    <div class="qmeta">
      <span class="pill grey">#${q.num}</span>
      <span>${escapeHtml(q.source)}</span>
      ${statusPill} ${diffPill}
      ${dueTxt?`<span style="margin-inline-start:auto;font-size:11px;">${dueTxt}</span>`:''}
    </div>
    <div class="qtext">${escapeHtml(q.question)}</div>
    ${renderFigure(q)}
    <div class="optlist">${optsHtml}</div>
    <div class="explain" id="exp_${q.id}">
      <div class="lbl">📘 ব্যাখ্যা</div>
      <div>${escapeHtml(q.explanation)}</div>
      ${q.note?`<div class="note-box">ℹ️ উৎস-নোট: ${escapeHtml(q.note)}</div>`:''}
    </div>

      <button class="btn sm" id="peekBtn_${q.id}" onclick="peekAnswer('${q.id}')">👁️ উত্তর দেখুন</button>
      <button class="btn sm ${st.status==='weak'?'active':''}" onclick="setStatus('${q.id}','weak')">🔁 Need Revision</button>
      <button class="btn sm ${st.status==='learning'?'active':''}" onclick="setStatus('${q.id}','learning')">🟡 Learning</button>
      <button class="btn sm ${st.status==='mastered'?'active':''}" onclick="setStatus('${q.id}','mastered')">✅ Mastered</button>
      <button class="btn sm ${st.bookmarked?'active':''}" onclick="toggleBookmark('${q.id}')">⭐ ${st.bookmarked?'বুকমার্কড':'বুকমার্ক'}</button>
      <select onchange="setDifficulty('${q.id}', this.value)" style="padding:5px 8px;font-size:12px;border-radius:8px;">
        <option value="">কঠিনতা নির্বাচন</option>
        <option value="easy" ${st.difficulty==='easy'?'selected':''}>সহজ</option>
        <option value="medium" ${st.difficulty==='medium'?'selected':''}>মাঝারি</option>
        <option value="hard" ${st.difficulty==='hard'?'selected':''}>কঠিন</option>
      </select>
    </div>
    <textarea class="mynote" placeholder="আমার নোট লিখুন..." onchange="saveNote('${q.id}', this.value)">${escapeHtml(st.note)}</textarea>
  </div>`;
}
function attachQuestionCardHandlers(){
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      const qid = btn.dataset.qid;
      const idx = parseInt(btn.dataset.idx);
      const q = QUESTIONS.find(x=>x.id===qid);
      revealAnswer(q, idx);
    };
  });
}
/* "উত্তর দেখুন" — study mode only (not quiz): shows the correct answer & explanation
   WITHOUT selecting any option and WITHOUT affecting correct/wrong stats. Options remain
   clickable afterward in case the learner still wants to self-test. */
function peekAnswer(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  const card = document.getElementById('qc_'+qid) || document.querySelector('#focusBody .qcard');
  if(!card) return;
  const optBtns = card.querySelectorAll('.opt');
  optBtns.forEach((b,i)=>{
    if(q.answerIdx>=0 && i===q.answerIdx) b.classList.add('correct');
  });
  const exp = card.querySelector('.explain');
  if(exp) exp.classList.add('show');
  const peekBtn = card.querySelector(`#peekBtn_${qid}`) || card.querySelector('.peekBtnFocus');
  if(peekBtn){ peekBtn.disabled = true; peekBtn.textContent = '👁️ উত্তর দেখানো হয়েছে'; }
}
function revealAnswer(q, chosenIdx){
  const card = document.getElementById('qc_'+q.id);
  if(!card) return;
  const already = card.dataset.answered === '1';
  card.dataset.answered = '1';
  const optBtns = card.querySelectorAll('.opt');
  optBtns.forEach((b,i)=>{
    b.disabled = true;
    if(q.answerIdx>=0 && i===q.answerIdx) b.classList.add('correct');
    if(i===chosenIdx && i!==q.answerIdx) b.classList.add('wrong');
    if(i===chosenIdx) b.classList.add('selected');
  });
  document.getElementById('exp_'+q.id).classList.add('show');
  const peekBtn = document.getElementById('peekBtn_'+q.id);
  if(peekBtn){ peekBtn.disabled = true; }
  if(!already && q.answerIdx>=0){
    recordAnswer(q.id, chosenIdx===q.answerIdx);
  } else if(!already){
    // ambiguous source answer — just mark attempted, no correct/wrong
    pq(q.id).attempted = true; pq(q.id).lastReviewed = nowISO(); touchStreak(); saveState();
  }
}

function startQuizForTopic(topic){ go('quiz'); setTimeout(()=>renderQuiz(document.getElementById('main'), topic), 0); }

function shuffleArr(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function beginQuiz(){
  const scope = document.getElementById('quizScope').value;
  let pool = QUESTIONS.slice();
  if(scope==='topic'){ const t = document.getElementById('quizTopicSel').value; pool = pool.filter(q=>q.subtopic===t); }
  else if(scope==='chapter'){ const c = document.getElementById('quizChapterSel').value; pool = pool.filter(q=>q.chapter===c); }
  else if(scope==='revision'){ pool = pool.filter(isDue); }
  else if(scope==='wrong'){ pool = pool.filter(q=>pq(q.id).wrongCount>0); }
  else if(scope==='unanswered'){ pool = pool.filter(q=>!pq(q.id).attempted); }
  else if(scope==='mastered'){ pool = pool.filter(q=>pq(q.id).status==='mastered'); }
  else if(scope==='bookmarked'){ pool = pool.filter(q=>pq(q.id).bookmarked); }

  if(!pool.length){ toast('⚠️ এই পরিধিতে কোনো প্রশ্ন পাওয়া যায়নি'); return; }
  const shuffle = document.getElementById('quizShuffle').checked;
  if(shuffle) pool = shuffleArr(pool);
  const countSel = document.getElementById('quizCount').value;
  const n = countSel==='all' ? pool.length : Math.min(parseInt(countSel), pool.length);
  pool = pool.slice(0, n);

  // build per-question shuffled option order if needed
  const questions = pool.map(q=>{
    let order = [0,1,2,3];
    if(shuffle) order = shuffleArr(order);
    return {q, order};
  });

  QUIZ = {questions, idx:0, answers:new Array(questions.length).fill(null), startTime:Date.now(), shuffle};
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const area = document.getElementById('quizArea');
  const {questions, idx} = QUIZ;
  const total = questions.length;
  const {q, order} = questions[idx];
  const answered = QUIZ.answers[idx] !== null;
  area.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px;">
        <span>প্রশ্ন ${idx+1} / ${total}</span><span>${q.subtopic}</span>
      </div>
      <div class="progressbar" style="margin-bottom:16px;"><div style="width:${(idx/total)*100}%"></div></div>
      <div class="qtext">${escapeHtml(q.question)}</div>
      ${renderFigure(q)}
      <div class="optlist" id="quizOpts">
        ${order.map((origIdx,pos)=>`<button class="opt" data-orig="${origIdx}">${['ক','খ','গ','ঘ'][pos]}) ${escapeHtml(q.options[origIdx])}</button>`).join('')}
      </div>
      <div class="explain" id="quizExplain"></div>
      <div style="display:flex;justify-content:space-between;margin-top:16px;">
        <button class="btn" id="quizPrevBtn" ${idx===0?'disabled':''}>← আগের</button>
        <button class="btn primary" id="quizNextBtn">${idx===total-1?'কুইজ শেষ করুন ✅':'পরবর্তী →'}</button>
      </div>
    </div>
  `;
  document.querySelectorAll('#quizOpts .opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(QUIZ.answers[idx] !== null) return;
      const origIdx = parseInt(btn.dataset.orig);
      QUIZ.answers[idx] = origIdx;
      document.querySelectorAll('#quizOpts .opt').forEach(b=>{
        b.disabled = true;
        const oi = parseInt(b.dataset.orig);
        if(q.answerIdx>=0 && oi===q.answerIdx) b.classList.add('correct');
        if(oi===origIdx && oi!==q.answerIdx) b.classList.add('wrong');
      });
      if(q.answerIdx>=0){
        const isCorrect = origIdx===q.answerIdx;
        recordAnswer(q.id, isCorrect);
        if(!isCorrect) setStatusSilent(q.id,'weak');
      } else {
        pq(q.id).attempted = true; saveState();
      }
      const exp = document.getElementById('quizExplain');
      exp.classList.add('show');
      exp.innerHTML = `<div class="lbl">📘 ব্যাখ্যা</div><div>${escapeHtml(q.explanation)}</div>`;
    };
  });
  if(answered){
    document.querySelectorAll('#quizOpts .opt').forEach(b=>{
      b.disabled = true;
      const oi = parseInt(b.dataset.orig);
      if(q.answerIdx>=0 && oi===q.answerIdx) b.classList.add('correct');
      if(oi===QUIZ.answers[idx] && oi!==q.answerIdx) b.classList.add('wrong');
    });
    const exp = document.getElementById('quizExplain');
    exp.classList.add('show');
    exp.innerHTML = `<div class="lbl">📘 ব্যাখ্যা</div><div>${escapeHtml(q.explanation)}</div>`;
  }
  document.getElementById('quizPrevBtn').onclick = ()=>{ QUIZ.idx--; renderQuizQuestion(); };
  document.getElementById('quizNextBtn').onclick = ()=>{
    if(idx===total-1){ finishQuiz(); } else { QUIZ.idx++; renderQuizQuestion(); }
  };
}
function setStatusSilent(qid, status){
  const q = pq(qid);
  q.box = 0; q.status = status; q.nextRevision = addDays(new Date(),1).toISOString();
  saveState();
}
function finishQuiz(){
  const {questions, answers, startTime} = QUIZ;
  const total = questions.length;
  let correct=0, wrong=0, unanswered=0;
  const weakOnes = [];
  questions.forEach((item,i)=>{
    const {q} = item;
    if(answers[i]===null){ unanswered++; return; }
    if(q.answerIdx<0) return;
    if(answers[i]===q.answerIdx) correct++;
    else { wrong++; weakOnes.push(q); }
  });
  const timeSec = Math.round((Date.now()-startTime)/1000);
  const accuracy = total? Math.round((correct/total)*100) : 0;
  STATE.quizHistory.push({date:nowISO(), total, correct, wrong, unanswered, timeSec, accuracy});
  touchStreak();
  saveState();

  const byTopic = {};
  weakOnes.forEach(q=>{ byTopic[q.subtopic] = (byTopic[q.subtopic]||0)+1; });
  const weakTopicsArr = Object.entries(byTopic).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="card">
      <h3>🏁 কুইজ শেষ!</h3>
      <div class="quiz-summary">
        ${statCard('স্কোর', correct+' / '+total, `নির্ভুলতা: ${accuracy}%`)}
        ${statCard('সঠিক', correct, '✅')}
        ${statCard('ভুল', wrong, '❌')}
        ${statCard('অচেষ্টিত', unanswered, '⚪')}
        ${statCard('সময় লেগেছে', fmtMinSec(timeSec), '⏱')}
        ${statCard('নির্ভুলতা', accuracy+'%', accuracy>=80?'চমৎকার! 🎉':accuracy>=50?'ভালো হচ্ছে':'আরও অনুশীলন দরকার')}
      </div>
      ${weakTopicsArr.length? `<div style="margin-top:14px;"><strong>📉 দুর্বল বিষয়সমূহ (এই কুইজ অনুসারে):</strong>
        <div class="chiprow" style="margin-top:8px;">${weakTopicsArr.map(([t,c])=>`<span class="chip">${t} (${c})</span>`).join('')}</div></div>` : ''}
      ${wrong>0? `<div style="margin-top:10px;font-size:13px;color:var(--muted);">ভুল হওয়া প্রশ্নগুলো স্বয়ংক্রিয়ভাবে "🔁 রিভিশন প্রয়োজন" হিসেবে চিহ্নিত হয়েছে এবং "My Mistakes" এ যুক্ত হয়েছে।</div>`:''}
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">
        <button class="btn primary" onclick="renderQuiz(document.getElementById('main'))">🔁 আরেকটি কুইজ</button>
        <button class="btn" onclick="go('mistakes')">❌ ভুলগুলো দেখুন</button>
        <button class="btn" onclick="go('dashboard')">🏠 ড্যাশবোর্ডে ফিরুন</button>
      </div>
    </div>
  `;
  QUIZ = null;
}

      <option value="weak">🔴 সকল দুর্বল প্রশ্ন</option>
      <option value="mistakes">❌ ভুল হওয়া প্রশ্ন</option>

    </select>

  </div>
  <div id="qrevArea" style="margin-top:20px;"></div>
  `;
  document.getElementById('qrevStartBtn').onclick = ()=>{
    const scope = document.getElementById('qrevScope').value;
    let pool = QUESTIONS.slice();
    if(scope==='due') pool = pool.filter(isDue);
    else if(scope==='weak') pool = pool.filter(q=>pq(q.id).status==='weak');
    else if(scope==='mistakes') pool = pool.filter(q=>pq(q.id).wrongCount>0);
    else if(scope==='bookmarked') pool = pool.filter(q=>pq(q.id).bookmarked);
    if(!pool.length){ toast('⚠️ এই পরিধিতে কোনো প্রশ্ন নেই'); return; }
    pool = shuffleArr(pool);
    QREV = {pool, idx:0, know:0, forgot:0};
    renderQrevCard();
  };
}
function renderQrevCard(){
  const area = document.getElementById('qrevArea');
  const {pool, idx} = QREV;
  if(idx >= pool.length){
    area.innerHTML = `<div class="card">
      <h3>✅ রিভিশন সম্পন্ন!</h3>
      <div class="quiz-summary">
        ${statCard('মোট', pool.length,'')}
        ${statCard('জানতাম', QREV.know, '✅')}
        ${statCard('ভুলে গিয়েছিলাম', QREV.forgot, '🔁')}
      </div>
      <button class="btn primary" style="margin-top:14px;" onclick="renderQuickRevisionSetup(document.getElementById('main'))">🔁 আবার শুরু করুন</button>
    </div>`;
    touchStreak();
    return;
  }
  const q = pool[idx];
  area.innerHTML = `
  <div class="card" style="max-width:640px;margin:0 auto;">
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;text-align:center;">${idx+1} / ${pool.length} · ${q.subtopic}</div>
    <div class="qtext" style="text-align:center;font-size:17px;">${escapeHtml(q.question)}</div>
    <div style="text-align:center;margin:18px 0;">
      <button class="btn primary" id="qrevRevealBtn">👁️ উত্তর দেখুন</button>
    </div>
    <div id="qrevAnswerArea" style="display:none;">
      <div class="explain show">
        <div class="lbl">✅ সঠিক উত্তর</div>
        <div>${q.answerIdx>=0 ? ['ক','খ','গ','ঘ'][q.answerIdx]+') '+escapeHtml(q.options[q.answerIdx]) : 'মূল বইয়ে সুনির্দিষ্ট উত্তর উল্লেখ ছিল না'}</div>
        <div class="lbl" style="margin-top:10px;">📘 ব্যাখ্যা</div>
        <div>${escapeHtml(q.explanation)}</div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;">
        <button class="btn" style="border-color:var(--green);color:var(--green);" id="qrevKnowBtn">✅ জানতাম</button>
        <button class="btn" style="border-color:var(--red);color:var(--red);" id="qrevForgotBtn">🔁 ভুলে গিয়েছিলাম</button>
        <button class="btn" style="border-color:var(--accent);color:var(--accent);" id="qrevMasterBtn">🏆 আয়ত্ত হয়ে গেছে</button>
      </div>
    </div>
  </div>`;
  document.getElementById('qrevRevealBtn').onclick = ()=>{
    document.getElementById('qrevAnswerArea').style.display='block';

  };
  const nextCard = (result)=>{
    if(result==='know'){ QREV.know++; setStatusSilent2(q.id,'learning'); }
    else if(result==='forgot'){ QREV.forgot++; setStatusSilent2(q.id,'weak'); }
    else if(result==='master'){ QREV.know++; setStatusSilent2(q.id,'mastered'); }
    QREV.idx++;
    renderQrevCard();
  };
  setTimeout(()=>{
    const k=document.getElementById('qrevKnowBtn'), f=document.getElementById('qrevForgotBtn'), m=document.getElementById('qrevMasterBtn');
    if(k) k.onclick=()=>nextCard('know');
    if(f) f.onclick=()=>nextCard('forgot');
    if(m) m.onclick=()=>nextCard('master');
  },0);
}
function setStatusSilent2(qid, status){
  const q = pq(qid);
  q.status = status;
  q.attempted = true;
  q.lastReviewed = nowISO();
  if(status==='mastered'){ q.box=Math.min(q.box+1,INTERVALS.length-1); q.nextRevision=addDays(new Date(),INTERVALS[q.box]).toISOString(); }
  else if(status==='weak'){ q.box=0; q.nextRevision=addDays(new Date(),1).toISOString(); }
  else { q.box=Math.max(q.box-1,0); q.nextRevision=addDays(new Date(),INTERVALS[q.box]||1).toISOString(); }
  saveState();
}

let FOCUS = null; // {topic, questions, idx, startTs, elapsedSec, timerHandle, paused, correct, wrong, marked}
function renderFocusSetup(main){
  main.innerHTML = `
  <div class="pagehead"><div><h2>⏱ ফোকাস স্টাডি মোড</h2><div class="sub">একটি বিষয়ে মনোযোগ দিয়ে, টাইমারসহ পড়াশোনা করুন</div></div></div>
  <div class="card">
    <label style="font-size:12px;color:var(--muted);">বিষয় নির্বাচন করুন</label>
    <select id="focusTopicSel" style="width:100%;margin:8px 0 16px;">${TOPIC_ORDER.map(t=>`<option value="${t}">${t} (${TOPIC_MAP[t].questions.length}টি প্রশ্ন)</option>`).join('')}</select>
    <button class="btn primary" id="focusStartBtn">▶️ Focus Session শুরু করুন</button>
  </div>`;
  document.getElementById('focusStartBtn').onclick = ()=>{
    startFocusSession(document.getElementById('focusTopicSel').value);
  };
}
function startFocusSession(topic){
  FOCUS = {topic, questions: TOPIC_MAP[topic].questions, idx:0, elapsedSec:0, paused:false,
    correct:0, wrong:0, marked:0};
  document.getElementById('focusTopicName').textContent = '⏱ '+topic;
  document.getElementById('focusOverlay').classList.add('show');
  document.body.style.overflow='hidden';
  FOCUS.timerHandle = setInterval(()=>{
    if(!FOCUS.paused){ FOCUS.elapsedSec++; updateFocusTimer(); }
  },1000);
  renderFocusQuestion();
  updateFocusTimer();
}
function updateFocusTimer(){
  const t = FOCUS.elapsedSec;
  const m = String(Math.floor(t/60)).padStart(2,'0');
  const s = String(t%60).padStart(2,'0');
  document.getElementById('focusTimer').textContent = `${m}:${s}`;
}
function renderFocusQuestion(){
  const {questions, idx} = FOCUS;
  const total = questions.length;
  document.getElementById('focusProgressTxt').textContent = `প্রশ্ন ${idx+1} / ${total}`;
  document.getElementById('focusProgressBar').style.width = (idx/total*100)+'%';
  const body = document.getElementById('focusBody');
  if(idx >= total){
    body.innerHTML = `<div class="card" style="text-align:center;">
      <h3>🏁 এই বিষয়ের সব প্রশ্ন শেষ!</h3>
      <p style="color:var(--muted)">সেশন শেষ করতে নিচের বাটনে ক্লিক করুন।</p>
      <button class="btn primary" onclick="endFocusSession()">সেশন শেষ করুন ও ফলাফল দেখুন</button>
    </div>`;
    return;
  }
  const q = questions[idx];
  body.innerHTML = questionCardFocus(q);
  document.querySelectorAll('#focusBody .opt').forEach(btn=>{
    btn.onclick = ()=>{
      const chosen = parseInt(btn.dataset.idx);
      const card = btn.closest('.qcard');
      if(card.dataset.answered==='1') return;
      card.dataset.answered='1';
      card.querySelectorAll('.opt').forEach((b,i)=>{
        b.disabled=true;
        if(q.answerIdx>=0 && i===q.answerIdx) b.classList.add('correct');
        if(i===chosen && i!==q.answerIdx) b.classList.add('wrong');
      });
      document.getElementById('fexp_'+q.id).classList.add('show');
      if(q.answerIdx>=0){
        const ok = chosen===q.answerIdx;
        if(ok) FOCUS.correct++; else { FOCUS.wrong++; }
        recordAnswer(q.id, ok);
      } else { pq(q.id).attempted=true; saveState(); }
    };
  });
  document.getElementById('focusNextBtn').onclick = ()=>{ FOCUS.idx++; renderFocusQuestion(); };
  document.getElementById('focusMarkBtn').onclick = ()=>{
    setStatus(q.id,'weak'); FOCUS.marked++;
    toast('🔁 রিভিশনের জন্য চিহ্নিত হলো');
  };
}
function questionCardFocus(q){
  const st = pq(q.id);
  return `<div class="qcard" data-answered="0">
    <div class="qmeta"><span class="pill grey">#${q.num}</span><span>${escapeHtml(q.source)}</span></div>
    <div class="qtext">${escapeHtml(q.question)}</div>
    ${renderFigure(q)}
    <div class="optlist">${q.options.map((op,i)=>`<button class="opt" data-idx="${i}">${['ক','খ','গ','ঘ'][i]}) ${escapeHtml(op)}</button>`).join('')}</div>
    <div class="explain" id="fexp_${q.id}"><div class="lbl">📘 ব্যাখ্যা</div><div>${escapeHtml(q.explanation)}</div></div>
    <div class="qactions">
      <button class="btn sm peekBtnFocus" onclick="peekAnswer('${q.id}')">👁️ উত্তর দেখুন</button>
      <button class="btn sm" id="focusMarkBtn">🔁 Need Revision</button>
      <button class="btn sm primary" id="focusNextBtn">পরবর্তী →</button>
    </div>
  </div>`;
}
document.getElementById('focusPauseBtn').onclick = ()=>{
  if(!FOCUS) return;
  FOCUS.paused = !FOCUS.paused;
  document.getElementById('focusPauseBtn').textContent = FOCUS.paused? '▶️ Resume' : '⏸ Pause';
};
document.getElementById('focusEndBtn').onclick = ()=>{
  openModal(`<h3>সেশন শেষ করবেন?</h3><p>বর্তমান ফোকাস সেশনটি শেষ করে ফলাফল দেখতে চান?</p>

function endFocusSession(){
  clearInterval(FOCUS.timerHandle);
  const {topic, elapsedSec, correct, wrong, marked, idx} = FOCUS;
  const t = pt(topic);
  t.studyCount++;
  if(!t.firstStudied) t.firstStudied = nowISO();
  t.lastStudied = nowISO();
  t.timeSpentSec += elapsedSec;
  t.sessions.push({date:nowISO(), durationSec:elapsedSec});
  touchStreak();
  saveState();
  document.getElementById('focusOverlay').classList.remove('show');
  document.body.style.overflow='';
  openModal(`
    <h3>🏁 ফোকাস সেশন সম্পন্ন!</h3>
    <div class="grid cols-2" style="margin:14px 0;">
      ${statCard('সময় ব্যয়িত', fmtMinSec(elapsedSec),'')}
      ${statCard('প্রশ্ন প্রচেষ্টা', idx,'')}
      ${statCard('সঠিক', correct,'✅')}
      ${statCard('ভুল', wrong,'❌')}
      ${statCard('রিভিশনের জন্য চিহ্নিত', marked,'🔁')}
      ${statCard('বিষয়', topic,'')}
    </div>
    <div class="row"><button class="btn primary" onclick="closeModal();go('topicDetail',{topic:${attrJson(topic)}})">বিষয়ে ফিরুন</button></div>
  `);
  FOCUS = null;
  render();
}

      <div style="padding:9px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px;flex-wrap:wrap;gap:6px;">
        <span>${fmtDate(h.date)}</span>
        <span>✅ ${h.correct} · ❌ ${h.wrong} · ⚪ ${h.unanswered} / ${h.total}</span>
        <span>নির্ভুলতা: ${h.accuracy}%</span>
        <span>⏱ ${fmtMinSec(h.timeSec)}</span>
      </div>`).join('') : `<div class="empty" style="padding:20px;">এখনো কোনো কুইজ দেওয়া হয়নি।</div>`}
  </div>
  `;
}
function quizAccuracyOverall(){
  const h = STATE.quizHistory;
  if(!h.length) return 0;
  const totC = h.reduce((s,x)=>s+x.correct,0);
  const totQ = h.reduce((s,x)=>s+x.total,0);
  return totQ? Math.round(totC/totQ*100) : 0;
}

function setTheme(theme){
  STATE.settings.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').innerHTML = theme==='dark' ? '☀️ <span>লাইট</span>' : '🌙 <span>ডার্ক</span>';
  saveState();
  render();
}
function exportProgress(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ICT_Study_Progress_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('⬇️ প্রোগ্রেস ডাউনলোড হয়েছে');
}
document.getElementById('importFile').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.perQuestion) throw new Error('invalid');
      STATE = Object.assign(defaultState(), data);
      saveState();
      document.documentElement.setAttribute('data-theme', STATE.settings.theme||'light');
      toast('✅ প্রোগ্রেস সফলভাবে ইম্পোর্ট হয়েছে');
      render();
    }catch(err){
      toast('❌ ফাইলটি সঠিক নয়, ইম্পোর্ট ব্যর্থ হয়েছে');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
function confirmResetAll(){

function doResetAll(){

/* ============================================================
   THEME TOGGLE & KEYBOARD SHORTCUTS
   ============================================================ */
document.getElementById('themeToggle').onclick = ()=>{
  setTheme(STATE.settings.theme==='dark' ? 'light':'dark');
};

document.addEventListener('keydown', function(e){
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea' || tag==='select') return;
  if(e.key==='Escape'){ closeModal(); return; }
  // Quiz mode shortcuts
  if(QUIZ){
    const {questions, idx} = QUIZ;
    if(['1','2','3','4'].includes(e.key)){
      const optBtns = document.querySelectorAll('#quizOpts .opt');
      const pos = parseInt(e.key)-1;
      if(optBtns[pos] && !optBtns[pos].disabled) optBtns[pos].click();
      return;
    }
    if(e.key==='Enter'){ const btn=document.getElementById('quizNextBtn'); if(btn) btn.click(); return; }
  }
  // Focus mode shortcuts
  if(FOCUS && document.getElementById('focusOverlay').classList.contains('show')){
    if(['1','2','3','4'].includes(e.key)){
      const optBtns = document.querySelectorAll('#focusBody .opt');
      const pos = parseInt(e.key)-1;
      if(optBtns[pos] && !optBtns[pos].disabled) optBtns[pos].click();
      return;
    }
    if(e.key==='n' || e.key==='N' || e.key==='Enter'){ const btn=document.getElementById('focusNextBtn'); if(btn) btn.click(); return; }
    if(e.key==='r' || e.key==='R'){ const btn=document.getElementById('focusMarkBtn'); if(btn) btn.click(); return; }
  }
});
