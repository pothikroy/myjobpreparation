  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--paper); color:var(--ink-900);
  font-family:var(--font-bn); font-size:15.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease, color .2s ease;
}
::selection{background:var(--brass-dim); color:var(--ink-900);}
a{color:inherit;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--focus-ring); outline-offset:2px; border-radius:4px;}

/* ---------- Layout shell ---------- */
#shell{display:flex; min-height:100vh;}
#sidebar{
  width:248px; flex-shrink:0; background:var(--ink-900); color:var(--ink-200);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
  transition:transform .25s ease;
  z-index:40;
}
#sidebar .brand{
  padding:22px 20px 16px; font-family:var(--font-disp); font-size:20px; font-weight:600;
  color:#fff; display:flex; align-items:baseline; gap:8px; border-bottom:1px solid rgba(255,255,255,.08);
}
#sidebar .brand small{font-family:var(--font-bn); font-size:11px; color:var(--brass-light); font-weight:600; letter-spacing:.04em;}
.nav-group{padding:10px 10px;}
.nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-400); padding:14px 12px 6px; font-weight:600;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer;
  color:var(--ink-200); font-size:14px; font-weight:500; margin-bottom:1px; transition:background .12s;
  -webkit-tap-highlight-color:transparent;
}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:var(--brass); color:#fff;}
.nav-item .ic{font-size:16px; width:18px; text-align:center;}
#sidebar-foot{margin-top:auto; padding:14px 18px; font-size:11px; color:var(--ink-500); border-top:1px solid rgba(255,255,255,.08);}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  display:none; align-items:center; justify-content:space-between; padding:12px 16px;
  background:var(--paper-raised); border-bottom:1px solid var(--ink-100); position:sticky; top:0; z-index:30;
}
#topbar .hamburger{background:none; border:1px solid var(--ink-200); border-radius:8px; padding:8px 10px; font-size:16px; cursor:pointer; color:var(--ink-800);}
#content{flex:1; padding:28px 32px 60px; max-width:1180px; width:100%; margin:0 auto;}
#sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:39;}

@media (max-width:920px){
  #sidebar{position:fixed; left:0; transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #sidebar-overlay.show{display:block;}
  #topbar{display:flex;}
  #content{padding:18px 14px 90px;}
}

/* ---------- Typography helpers ---------- */
h1,h2,h3{font-family:var(--font-disp); color:var(--ink-900); margin:0 0 6px; letter-spacing:-.01em;}
.page-title{font-size:26px; font-weight:600; margin-bottom:4px;}
.page-sub{color:var(--ink-500); font-size:14px; margin-bottom:24px;}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--brass); font-weight:700; margin-bottom:6px;}

/* ---------- Cards & grid ---------- */
.card{background:var(--paper-raised); border:1px solid var(--ink-100); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-sm);}
.card + .card{margin-top:16px;}
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
@media (max-width:520px){.grid-4{grid-template-columns:1fr 1fr;}}

.stat{padding:16px 18px;}
.stat .num{font-family:var(--font-disp); font-size:28px; font-weight:600; color:var(--ink-900); line-height:1;}
.stat .lbl{font-size:12.5px; color:var(--ink-500); margin-top:6px;}
.stat.accent .num{color:var(--brass);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; justify-content:center;
  padding:10px 18px; border-radius:8px; border:1px solid var(--ink-200); background:var(--paper-raised);
  color:var(--ink-800); font-size:14px; font-weight:600; cursor:pointer; transition:all .12s; white-space:nowrap;
}
.btn:hover{border-color:var(--ink-400); background:var(--ink-100);}
.btn-primary{background:var(--ink-900); color:#fff; border-color:var(--ink-900);}
.btn-primary:hover{background:var(--brass); border-color:var(--brass);}
.btn-brass{background:var(--brass); color:#fff; border-color:var(--brass);}
.btn-brass:hover{background:var(--brass-light); border-color:var(--brass-light);}
.btn-danger{color:var(--bad); border-color:var(--bad);}
.btn-danger:hover{background:var(--bad-bg);}
.btn-sm{padding:6px 12px; font-size:12.5px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--ink-100);}

/* ---------- Badges/pills ---------- */
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600;}
.pill-good{background:var(--good-bg); color:var(--good);}
.pill-bad{background:var(--bad-bg); color:var(--bad);}
.pill-warn{background:var(--warn-bg); color:var(--warn);}
.pill-neutral{background:var(--ink-100); color:var(--ink-600);}
.pill-brass{background:var(--brass-dim); color:var(--brass);}

/* ---------- Forms ---------- */
select, input[type=text], input[type=number]{
  font-family:inherit; font-size:14px; padding:9px 12px; border-radius:8px; border:1px solid var(--ink-200);
  background:var(--paper-raised); color:var(--ink-900);
}
label.field{display:block; font-size:12.5px; font-weight:600; color:var(--ink-600); margin-bottom:5px;}

/* ---------- Question card ---------- */
.qcard{background:var(--paper-raised); border:1px solid var(--ink-100); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow-sm);}
.qmeta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; font-size:11.5px; color:var(--ink-500);}
.qtext{font-size:15.5px; color:var(--ink-900); margin-bottom:14px; line-height:1.65;}
.opt{
  display:flex; align-items:flex-start; gap:10px; padding:10px 14px; border-radius:8px; border:1.5px solid var(--ink-150,var(--ink-200));
  margin-bottom:8px; cursor:pointer; transition:all .1s; font-size:14.5px;
}
.opt:hover{border-color:var(--ink-400);}
.opt.selected{border-color:var(--ink-900); background:var(--ink-100); font-weight:600;}
.opt .oletter{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--ink-300); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; color:var(--ink-600);}
.opt.selected .oletter{background:var(--ink-900); color:#fff; border-color:var(--ink-900);}
.opt.correct{border-color:var(--good); background:var(--good-bg);}
.opt.correct .oletter{background:var(--good); color:#fff; border-color:var(--good);}
.opt.incorrect{border-color:var(--bad); background:var(--bad-bg);}
.opt.incorrect .oletter{background:var(--bad); color:#fff; border-color:var(--bad);}
.opt.disabled{cursor:default;}

/* ---------- Exam runner ---------- */
#examBar{
  position:sticky; top:0; z-index:20; background:var(--paper-raised); border-bottom:1px solid var(--ink-100);
  padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; box-shadow:var(--shadow-sm); flex-wrap:wrap;
}
.timer{font-family:var(--font-mono); font-size:20px; font-weight:600; color:var(--ink-900); padding:6px 14px; border-radius:8px; background:var(--ink-100);}
.timer.low{background:var(--bad-bg); color:var(--bad); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
#palette{display:grid; grid-template-columns:repeat(10,1fr); gap:6px; padding:14px; max-height:360px; overflow-y:auto;}
.pcell{
  aspect-ratio:1; border-radius:6px; border:1px solid var(--ink-200); background:var(--paper-raised); font-size:11.5px;
  font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-600); position:relative;
}
.pcell.answered{background:var(--good); color:#fff; border-color:var(--good);}
.pcell.review{background:var(--warn); color:#fff; border-color:var(--warn);}
.pcell.current{outline:2.5px solid var(--focus-ring); outline-offset:1px;}
.pcell.answered.review::after{content:'★'; position:absolute; top:-6px; right:-4px; font-size:9px; color:var(--brass);}

/* ---------- table ---------- */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; padding:8px 10px; color:var(--ink-500); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1.5px solid var(--ink-200);}
td{padding:9px 10px; border-bottom:1px solid var(--ink-100);}
tr:hover td{background:var(--ink-100);}

/* ---------- misc ---------- */
.hr{height:1px; background:var(--ink-100); margin:20px 0; border:none;}
.flex{display:flex; align-items:center;}
.flex-between{display:flex; align-items:center; justify-content:space-between;}
.gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
.wrap{flex-wrap:wrap;}
.muted{color:var(--ink-500);}
.small{font-size:12.5px;}
.center{text-align:center;}
.mb-0{margin-bottom:0;} .mt-0{margin-top:0;}
.bar-track{height:8px; border-radius:99px; background:var(--ink-100); overflow:hidden;}
.bar-fill{height:100%; border-radius:99px; background:var(--brass);}
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-500);}
.empty-state .ic{font-size:40px; margin-bottom:10px;}
.modal-backdrop{position:fixed; inset:0; background:rgba(20,25,36,.55); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{background:var(--paper-raised); border-radius:14px; max-width:480px; width:100%; padding:26px; box-shadow:var(--shadow-lg); max-height:88vh; overflow-y:auto;}
.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink-900); color:#fff; padding:11px 18px; border-radius:8px; font-size:13.5px; box-shadow:var(--shadow-md); animation:slideup .2s ease;}
@keyframes slideup{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.tag-strong{color:var(--good); font-weight:700;}
.tag-weak{color:var(--bad); font-weight:700;}
.tag-mod{color:var(--warn); font-weight:700;}
.klabel{font-size:11px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.06em; font-weight:700;}
.data-src{font-size:11px; padding:2px 8px; border-radius:5px; background:var(--ink-100); color:var(--ink-500); font-weight:600;}
.data-src.pdf{background:var(--good-bg); color:var(--good);}
.data-src.user{background:var(--brass-dim); color:var(--brass);}
.data-src.infer{background:var(--warn-bg); color:var(--warn);}
input[type=checkbox], input[type=radio]{width:16px; height:16px;}
.tabbar{display:flex; gap:4px; border-bottom:1px solid var(--ink-200); margin-bottom:18px; overflow-x:auto;}
.tabbtn{padding:9px 16px; border:none; background:none; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--ink-500); border-bottom:2.5px solid transparent; white-space:nowrap;}
.tabbtn.active{color:var(--ink-900); border-color:var(--brass);}
.chip{display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border-radius:999px; border:1px solid var(--ink-200); font-size:12.5px; cursor:pointer; background:var(--paper-raised);}
.chip.active{background:var(--ink-900); color:#fff; border-color:var(--ink-900);}
.skeleton{background:linear-gradient(90deg,var(--ink-100) 25%,var(--ink-200) 37%,var(--ink-100) 63%); background-size:400% 100%; animation:shimmer 1.4s infinite; border-radius:6px;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
</style>

<script>
/* ============================================================
   BCS Exam Simulator — application script
   ============================================================ */
"use strict";

const RAW = JSON.parse(document.getElementById('data-blob').textContent);
const SUBJECTS = RAW.subjects;
const SUBJ_BY_ID = Object.fromEntries(SUBJECTS.map(s=>[s.id,s]));
const EXAM_META = RAW.meta;
const EXAMS = RAW.exams; // year -> [{year,num,subject,text,options,answer,page,hasFigure}]
const YEARS = Object.keys(EXAM_META);

function subjName(id){ return SUBJ_BY_ID[id] ? SUBJ_BY_ID[id].name : id; }
function qKey(year,num){ return year+'#'+num; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(sec){
  sec = Math.max(0,Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleString('bn-BD', {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ---------------- Toasts ---------------- */
function toast(msg, ms=2600){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, ms);
}

/* ============================================================
   IndexedDB layer
   ============================================================ */
const DB_NAME = 'bcs_prep_db';
const DB_VERSION = 1;
let dbPromise = null;

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('attempts')) db.createObjectStore('attempts',{keyPath:'id'});
      if(!db.objectStoreNames.contains('qhistory')) db.createObjectStore('qhistory',{keyPath:'key'}); // key = year#num
      if(!db.objectStoreNames.contains('bookmarks')) db.createObjectStore('bookmarks',{keyPath:'key'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'key'});
      if(!db.objectStoreNames.contains('examProgress')) db.createObjectStore('examProgress',{keyPath:'year'});
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = (e)=> reject(e.target.error);
  });
  return dbPromise;
}
async function idbGet(store, key){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readonly').objectStore(store).get(key);
    tx.onsuccess=()=>res(tx.result||null); tx.onerror=()=>rej(tx.error);
  });
}
async function idbGetAll(store){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readonly').objectStore(store).getAll();
    tx.onsuccess=()=>res(tx.result||[]); tx.onerror=()=>rej(tx.error);
  });
}
async function idbPut(store, val){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite').objectStore(store).put(val);
    tx.onsuccess=()=>res(true); tx.onerror=()=>rej(tx.error);
  });
}
async function idbDelete(store, key){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite').objectStore(store).delete(key);
    tx.onsuccess=()=>res(true); tx.onerror=()=>rej(tx.error);
  });
}
async function idbClear(store){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite').objectStore(store).clear();
    tx.onsuccess=()=>res(true); tx.onerror=()=>rej(tx.error);
  });
}

// qhistory row: {key, year, num, attempts:[{attemptId, given, correct, isCorrect, date, confidence}], bookmarkCat}
async function recordAnswer(year, num, given, correctAns, attemptId, confidence){
  const key = qKey(year,num);
  let row = await idbGet('qhistory', key);
  if(!row) row = {key, year, num, attempts:[]};
  const isCorrect = given!=null && correctAns!=null && given===correctAns;
  row.attempts.push({attemptId, given, correct:correctAns, isCorrect, date:Date.now(), confidence:confidence||null});
  await idbPut('qhistory', row);
  return row;
}
function questionStatus(row){
  if(!row || row.attempts.length===0) return 'new';
  const last3 = row.attempts.slice(-3);
  const correctCount = row.attempts.filter(a=>a.isCorrect).length;
  const total = row.attempts.length;
  const lastCorrect = row.attempts[row.attempts.length-1].isCorrect;
  if(total===1) return lastCorrect? 'improving':'learning';
  if(correctCount===total) return total>=3? 'mastered':'strong';
  if(!lastCorrect) return 'weak';
  // last correct but history mixed
  const streak = (()=>{ let s=0; for(let i=row.attempts.length-1;i>=0;i--){ if(row.attempts[i].isCorrect)s++; else break;} return s; })();
  if(streak>=2) return 'strong';
  return 'improving';
}

   Analytics core (shared computations)
   ============================================================ */
function computeSubjectStats(filterAttemptIds=null){
  // returns {subjId: {total, attempted, correct, wrong, unanswered}}
  const stats = {};
  SUBJECTS.forEach(s=> stats[s.id]={total:0,attempted:0,correct:0,wrong:0,unanswered:0});
  for(const q of allQuestions()){
    if(EXAM_META[q.year].status!=='ready') continue;
    stats[q.subject].total++;
    const row = STATE.qhistoryCache[qKey(q.year,q.num)];
    if(!row || row.attempts.length===0){ stats[q.subject].unanswered++; continue; }
    stats[q.subject].attempted++;
    const last = row.attempts[row.attempts.length-1];
    if(last.given==null) stats[q.subject].unanswered++;
    else if(last.isCorrect) stats[q.subject].correct++;
    else stats[q.subject].wrong++;
  }
  return stats;
}
function computeTopicStats(){ return computeSubjectStats(); } // topic-level uses same shape keyed differently, built inline in weakness view

function overallProgress(){
  const total = allQuestions().filter(q=>EXAM_META[q.year].status==='ready').length;
  let attempted=0, correct=0, wrong=0;
  for(const key in STATE.qhistoryCache){
    const row = STATE.qhistoryCache[key];
    if(row.attempts.length===0) continue;
    attempted++;
    const last = row.attempts[row.attempts.length-1];
    if(last.isCorrect) correct++; else if(last.given!=null) wrong++;
  }
  const accuracy = attempted>0 ? (correct/attempted*100) : 0;
  return {total, attempted, correct, wrong, accuracy};
}
function examAttempts(year){ return STATE.attemptsCache.filter(a=>a.year===year).sort((a,b)=>a.attemptNo-b.attemptNo); }
function bestScore(){
  if(STATE.attemptsCache.length===0) return null;
  return Math.max(...STATE.attemptsCache.map(a=>a.score));
}
function avgScore(){
  if(STATE.attemptsCache.length===0) return null;
  return STATE.attemptsCache.reduce((s,a)=>s+a.score,0)/STATE.attemptsCache.length;
}
function subjectAccuracyList(){
  const stats = computeSubjectStats();
  return SUBJECTS.map(s=>{
    const st = stats[s.id];
    const acc = st.attempted>0 ? (st.correct/st.attempted*100) : null;
    return {id:s.id, name:s.name, acc, attempted:st.attempted, total:st.total};
  });
}

          </div>

        </div>
        <div class="flex gap-8">

};

async function confirmStartExam(year){
  const existing = await idbGet('examProgress', year);
  if(existing){
    if(confirm('এই বছরের একটি অসম্পূর্ণ পরীক্ষা পাওয়া গেছে। Resume করতে চান? (Cancel করলে নতুন করে শুরু হবে এবং পুরনো অগ্রগতি মুছে যাবে)')){
      resumeExam(year); return;
    } else {
      await idbDelete('examProgress', year);
    }
  }
  startExam(year);
}

/* ============================================================
   EXAM ENGINE (full year exam + practice session share this)
   ============================================================ */
function buildRunnerState(year, questions, mode, opts={}){
  return {
    mode, // 'exam' | 'practice'
    year,
    questions, // array of question objects in display order
    order: questions.map((q,i)=>i),
    answers:{}, // idx -> letter
    review:{}, // idx -> bool
    confidence:{}, // idx -> 'sure'|'maybe'|'guess'
    current:0,
    startedAt: Date.now(),
    durationSec: opts.durationSec || null,
    remainingSec: opts.durationSec || null,
    title: opts.title || (year? EXAM_META[year].label : 'প্র্যাকটিস'),
    attemptNo: opts.attemptNo || null,
    showAnswerImmediately: mode==='practice',
    negativeMarking: SETTINGS.negativeMarking,
  };
}

function startExam(year){
  const qs = EXAMS[year];
  if(!qs || qs.length===0){ toast('এই বছরের প্রশ্ন এখনো যুক্ত হয়নি।'); return; }
  const durationSec = EXAM_META[year].duration_min*60;
  const attNo = examAttempts(year).length+1;
  STATE.activeExam = buildRunnerState(year, qs, 'exam', {durationSec, attemptNo:attNo});
  navigate('examrunner');
}
async function resumeExam(year){
  const saved = await idbGet('examProgress', year);
  if(!saved){ toast('কোনো সংরক্ষিত অগ্রগতি নেই।'); return; }
  STATE.activeExam = saved.state;
  navigate('examrunner');
}
async function discardExamProgress(year){
  await idbDelete('examProgress', year);
  toast('অসম্পূর্ণ পরীক্ষা মুছে ফেলা হয়েছে।');
  renderRoute();
}
async function saveExamProgress(){
  if(!STATE.activeExam || STATE.activeExam.mode!=='exam') return;
  await idbPut('examProgress', {year: STATE.activeExam.year, state: STATE.activeExam, savedAt: Date.now()});
}

async function beginPracticeSession(questions, title){
  if(questions.length===0){ toast('কোনো প্রশ্ন পাওয়া যায়নি এই ফিল্টারে।'); return; }
  STATE.activeExam = buildRunnerState(null, questions, 'practice', {title});
  navigate('examrunner');
}

ROUTES.examrunner = async ()=>{
  if(!STATE.activeExam) return `<div class="empty-state">কোনো সক্রিয় সেশন নেই। <button class="btn" onclick="navigate('yearexam')">ফিরে যান</button></div>`;
  return `<div id="examRoot"></div>`;
};
ROUTES_AFTER.examrunner = ()=>{ renderExamRunner(); startExamTimer(); };

function stopExamTimer(){ if(STATE.examTimerHandle){ clearInterval(STATE.examTimerHandle); STATE.examTimerHandle=null; } }

function startExamTimer(){
  stopExamTimer();
  const ex = STATE.activeExam;
  if(!ex || ex.durationSec==null) return;
  STATE.examTimerHandle = setInterval(()=>{
    if(!STATE.activeExam){ stopExamTimer(); return; }
    STATE.activeExam.remainingSec--;
    const timerEl = document.getElementById('timerDisplay');
    if(timerEl){
      timerEl.textContent = fmtTime(STATE.activeExam.remainingSec);
      timerEl.classList.toggle('low', STATE.activeExam.remainingSec <= SETTINGS.timerWarnMin*60);
    }
    if(STATE.activeExam.remainingSec<=0){
      stopExamTimer();
      toast('সময় শেষ! পরীক্ষা স্বয়ংক্রিয়ভাবে জমা দেওয়া হচ্ছে।');
      submitExam(true);
    } else if(STATE.activeExam.remainingSec % 20 === 0){
      saveExamProgress();
    }
  },1000);
}

        </div>
        <div class="qcard">
          <div class="qtext">${esc(q.text)}</div>
          ${['A','B','C','D'].map(L=>{
            const selected = given===L;
            const showResult = !isExam && ex.showAnswerImmediately && given!=null;

function togglePaletteMobile(){
  const el = document.getElementById('paletteWrap');
  if(!el) return;
  el.style.display = (el.style.display==='none') ? 'block':'none';
}
function selectAnswer(letter){
  const ex = STATE.activeExam;
  ex.answers[ex.current]=letter;
  if(ex.mode==='practice' && ex.showAnswerImmediately){
    const q = ex.questions[ex.current];
    recordAnswer(ex.year||'practice', q.num, letter, q.answer, 'live-'+ (ex.sessionId||(ex.sessionId=uid())));
    STATE.qhistoryCache; // will refresh on nav
  }
  renderExamRunner();
  if(SETTINGS.autoNext && ex.current<ex.questions.length-1){ setTimeout(()=>nextQuestion(), 500); }
}
function clearAnswer(){ const ex=STATE.activeExam; delete ex.answers[ex.current]; renderExamRunner(); }
function setConfidence(c){ STATE.activeExam.confidence[STATE.activeExam.current]=c; renderExamRunner(); }
function toggleReview(){ const ex=STATE.activeExam; ex.review[ex.current]=!ex.review[ex.current]; renderExamRunner(); }
function jumpTo(i){ STATE.activeExam.current=i; renderExamRunner(); }
function prevQuestion(){ if(STATE.activeExam.current>0){STATE.activeExam.current--; renderExamRunner();} }
function nextQuestion(){ const ex=STATE.activeExam; if(ex.current<ex.questions.length-1){ex.current++; renderExamRunner();} }
function isBookmarked(q){ const key=qKey(q.year||'practice', q.num); return !!STATE.bookmarksCache[key]; }
async function toggleBookmarkCurrent(){
  const ex=STATE.activeExam; const q=ex.questions[ex.current];
  const key=qKey(q.year||'practice', q.num);
  if(STATE.bookmarksCache[key]){ await idbDelete('bookmarks',key); delete STATE.bookmarksCache[key]; toast('বুকমার্ক সরানো হয়েছে'); }
  else { const row={key, year:q.year, num:q.num, cat:'important', date:Date.now()}; await idbPut('bookmarks',row); STATE.bookmarksCache[key]=row; toast('বুকমার্ক করা হয়েছে ⭐'); }
  renderExamRunner();
}
function confirmExitExam(){
  const ex = STATE.activeExam;
  const unanswered = ex.questions.length - Object.keys(ex.answers).length;
  const msg = ex.mode==='exam'
    ? `আপনি ${unanswered}টি প্রশ্নের উত্তর দেননি। জমা দিতে চান?`
    : 'প্র্যাকটিস সেশন শেষ করতে চান?';
  if(confirm(msg)) submitExam(false);
}

async function submitExam(auto){
  stopExamTimer();
  const ex = STATE.activeExam;
  const timeUsed = ex.durationSec!=null ? (ex.durationSec - Math.max(0,ex.remainingSec)) : (Math.floor((Date.now()-ex.startedAt)/1000));

  let correct=0, wrong=0, unanswered=0;
  const subjectBreak = {}; SUBJECTS.forEach(s=>subjectBreak[s.id]={correct:0,wrong:0,unanswered:0,total:0});
  const perQuestion = [];

  const attemptId = uid();
  for(let i=0;i<ex.questions.length;i++){
    const q = ex.questions[i];
    const given = ex.answers[i] ?? null;
    const isCorrect = given!=null && q.answer!=null && given===q.answer;
    if(given==null) unanswered++; else if(isCorrect) correct++; else wrong++;
    const sb = subjectBreak[q.subject]; sb.total++;
    if(given==null) sb.unanswered++; else if(isCorrect) sb.correct++; else sb.wrong++;
    perQuestion.push({idx:i, year:q.year, num:q.num, subject:q.subject, given, correct:q.answer, isCorrect, review:!!ex.review[i], confidence:ex.confidence[i]||null});
    if(q.answer!=null){ // only record history when we have a real answer key
      await recordAnswer(q.year || 'practice', q.num, given, q.answer, attemptId, ex.confidence[i]);
    }
  }
  await refreshCaches();

  let score = correct*1;
  if(ex.negativeMarking) score -= wrong*SETTINGS.negValue;

  const attempt = {
    id: attemptId, year: ex.year, mode: ex.mode, title: ex.title,
    attemptNo: ex.attemptNo || (examAttempts(ex.year||'practice').length+1),
    startedAt: ex.startedAt, completedAt: Date.now(), timeUsedSec: timeUsed,
    total: ex.questions.length, correct, wrong, unanswered, score,
    accuracy: (correct+wrong)>0 ? (correct/(correct+wrong)*100) : 0,
    subjectBreak, perQuestion, negativeMarking: ex.negativeMarking,
  };
  if(ex.mode==='exam'){
    await idbPut('attempts', attempt);
    await idbDelete('examProgress', ex.year);
  } else {
    // practice sessions are saved too, but tagged, for history/analytics
    await idbPut('attempts', attempt);
  }
  await refreshCaches();
  STATE.activeExam = null;
  navigate('examresult', {id: attemptId});
}

ROUTES.examresult = async ({id})=>{
  const a = STATE.attemptsCache.find(x=>x.id===id) || await idbGet('attempts', id);
  if(!a) return `<div class="empty-state">অ্যাটেম্পট পাওয়া যায়নি।</div>`;
  const priorAtts = a.year ? examAttempts(a.year).filter(x=>x.completedAt<=a.completedAt) : [];
  const prevAtt = priorAtts.length>1 ? priorAtts[priorAtts.length-2] : null;
  const delta = prevAtt ? (a.score - prevAtt.score) : null;

  const highConfMistakes = a.perQuestion.filter(p=>p.confidence==='sure' && !p.isCorrect && p.given!=null);

  return `
    <div class="page-title">${a.year?EXAM_META[a.year].label:esc(a.title)} ${a.year?`— Attempt #${a.attemptNo}`:''}</div>
    <div class="page-sub">সম্পন্ন হয়েছে ${fmtDate(a.completedAt)} · সময় ব্যবহৃত ${fmtTime(a.timeUsedSec)}</div>

    <div class="grid grid-4">
      <div class="card stat accent"><div class="num">${a.score}${a.negativeMarking?'':''}<span style="font-size:15px;color:var(--ink-400)">/${a.total}</span></div><div class="lbl">স্কোর ${delta!=null?`<span class="${delta>=0?'tag-strong':'tag-weak'}">(${delta>=0?'+':''}${delta.toFixed(1)} আগের চেয়ে)</span>`:''}</div></div>
      <div class="card stat"><div class="num">${a.correct}</div><div class="lbl">সঠিক</div></div>
      <div class="card stat"><div class="num">${a.wrong}</div><div class="lbl">ভুল</div></div>
      <div class="card stat"><div class="num">${a.unanswered}</div><div class="lbl">উত্তর দেওয়া হয়নি</div></div>
    </div>
    <div class="grid grid-3" style="margin-top:16px;">
      <div class="card stat"><div class="num">${a.accuracy.toFixed(1)}%</div><div class="lbl">Accuracy (attempted প্রশ্নের মধ্যে)</div></div>
      <div class="card stat"><div class="num">${fmtTime(a.timeUsedSec)}</div><div class="lbl">সময় ব্যবহৃত</div></div>
      <div class="card stat"><div class="num">${(a.timeUsedSec/a.total).toFixed(0)}s</div><div class="lbl">গড় সময়/প্রশ্ন</div></div>
    </div>

    ${highConfMistakes.length>0?`
    <div class="card" style="margin-top:16px; border-color:var(--bad);">
      <div class="eyebrow" style="color:var(--bad)">রিভিশন প্রায়োরিটি</div>
      <strong>আপনি নিশ্চিত ছিলেন কিন্তু ${highConfMistakes.length}টি প্রশ্নে ভুল করেছেন।</strong>
      <div class="small muted">এই প্রশ্নগুলো বিশেষভাবে গুরুত্বপূর্ণ — ধারণাগত ভুল বোঝাপড়া থাকতে পারে।</div>
    </div>`:''}

    <div class="card" style="margin-top:16px;">
      <div class="eyebrow">বিষয়ভিত্তিক বিশ্লেষণ</div>
      <table>
        <thead><tr><th>বিষয়</th><th>সঠিক</th><th>ভুল</th><th>বাকি</th><th>Accuracy</th></tr></thead>
        <tbody>
        ${SUBJECTS.filter(s=>a.subjectBreak[s.id] && a.subjectBreak[s.id].total>0).map(s=>{
          const sb=a.subjectBreak[s.id]; const att=sb.correct+sb.wrong;
          const acc = att>0?(sb.correct/att*100):0;
          return `<tr><td>${s.name}</td><td class="tag-strong">${sb.correct}</td><td class="tag-weak">${sb.wrong}</td><td class="muted">${sb.unanswered}</td><td>${att>0?acc.toFixed(0)+'%':'—'}</td></tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>

    <div class="flex gap-8" style="margin:16px 0;">
      <button class="btn btn-primary" onclick="navigate('resultReview',{id:'${a.id}'})">সব প্রশ্ন রিভিউ করুন</button>

      ${a.year?`<button class="btn btn-brass" onclick="confirmStartExam('${a.year}')">আবার দিন</button>`:''}
    </div>

};

      <button class="btn btn-sm" onclick="navigate('examresult',{id:'${id}'})">← ফলাফলে ফিরুন</button>
    </div>
    ${a.perQuestion.map((p,i)=>{

function bankFilterChange(){
  BANK_STATE.year = document.getElementById('bankYear').value;
  BANK_STATE.subject = document.getElementById('bankSubject').value;
  BANK_STATE.status = document.getElementById('bankStatus').value;
  BANK_STATE.search = document.getElementById('bankSearch').value.trim();
  BANK_STATE.page = 1;
  renderBankResults();
}
function bankQuickFilter(kind){
  if(kind==='random'){
    const pool = filteredBankQuestions();
    if(pool.length===0){ toast('কোনো প্রশ্ন নেই'); return; }
    const q = pool[Math.floor(Math.random()*pool.length)];
    showQuestionModal(q);
  } else if(kind==='revise'){
    document.getElementById('bankStatus').value='weak';
    bankFilterChange();
  }
}
function filteredBankQuestions(){
  let pool = allQuestions().filter(q=>EXAM_META[q.year].status==='ready');
  if(BANK_STATE.year!=='all') pool = pool.filter(q=>q.year===BANK_STATE.year);
  if(BANK_STATE.subject!=='all') pool = pool.filter(q=>q.subject===BANK_STATE.subject);
  if(BANK_STATE.search){
    const s = BANK_STATE.search.toLowerCase();
    pool = pool.filter(q=> q.text.toLowerCase().includes(s) || String(q.num).includes(s) || subjName(q.subject).toLowerCase().includes(s));
  }
  if(BANK_STATE.status!=='all'){
    pool = pool.filter(q=>{
      const key = qKey(q.year,q.num);
      const row = STATE.qhistoryCache[key];
      const bm = STATE.bookmarksCache[key];
      if(BANK_STATE.status==='bookmarked') return !!bm;
      if(BANK_STATE.status==='unattempted') return !row || row.attempts.length===0;
      if(!row || row.attempts.length===0) return false;
      const last = row.attempts[row.attempts.length-1];
      if(BANK_STATE.status==='correct') return last.isCorrect;
      if(BANK_STATE.status==='wrong') return !last.isCorrect;
      if(BANK_STATE.status==='weak') return questionStatus(row)==='weak';
      return true;
    });
  }
  return pool;
}
function renderBankResults(){
  const el = document.getElementById('bankResults');
  if(!el) return;
  const pool = filteredBankQuestions();
  const totalPages = Math.max(1,Math.ceil(pool.length/BANK_STATE.pageSize));
  BANK_STATE.page = Math.min(BANK_STATE.page, totalPages);
  const startI = (BANK_STATE.page-1)*BANK_STATE.pageSize;
  const pageItems = pool.slice(startI, startI+BANK_STATE.pageSize);

  el.innerHTML = `
    <div class="flex-between" style="margin-bottom:10px;">
      <div class="small muted">${pool.length}টি প্রশ্ন পাওয়া গেছে</div>
      ${pool.length>0?`<button class="btn btn-sm btn-brass" onclick='startBankPractice()'>এই ফলাফল থেকে প্র্যাকটিস শুরু করুন</button>`:''}
    </div>
    ${pageItems.length===0?`<div class="empty-state"><div class="ic">🔍</div>কোনো প্রশ্ন পাওয়া যায়নি এই ফিল্টারে।</div>`:
    pageItems.map(q=>{
      const key = qKey(q.year,q.num);
      const row = STATE.qhistoryCache[key];
      const st = questionStatus(row);
      const bm = STATE.bookmarksCache[key];
      return `
      <div class="qcard" style="cursor:pointer;" onclick="showQuestionModal(${JSON.stringify({year:q.year,num:q.num}).replace(/"/g,'&quot;')})">
        <div class="qmeta">
          <span class="pill pill-neutral">${EXAM_META[q.year].label} · Q${q.num}</span>
          <span class="pill pill-neutral">${subjName(q.subject)}</span>
          <span class="pill pill-${STATUS_COLOR[st]}">${STATUS_LABEL[st]}</span>
          ${bm?`<span class="pill pill-brass">🔖</span>`:''}
        </div>
        <div class="qtext" style="margin-bottom:0;">${esc(q.text.slice(0,160))}${q.text.length>160?'…':''}</div>
      </div>`;
    }).join('')}
    ${totalPages>1?`
    <div class="flex gap-8" style="justify-content:center; margin-top:16px;">
      <button class="btn btn-sm" onclick="bankPage(-1)" ${BANK_STATE.page<=1?'disabled':''}>← আগে</button>
      <span class="small muted" style="align-self:center;">${BANK_STATE.page} / ${totalPages}</span>
      <button class="btn btn-sm" onclick="bankPage(1)" ${BANK_STATE.page>=totalPages?'disabled':''}>পরে →</button>
    </div>`:''}
    <div id="qmodal-holder"></div>
  `;
}
function bankPage(delta){ BANK_STATE.page += delta; renderBankResults(); }

async function toggleBookmarkQ(year,num){
  const key = qKey(year,num);
  if(STATE.bookmarksCache[key]){ await idbDelete('bookmarks',key); delete STATE.bookmarksCache[key]; }
  else { const row={key,year,num,cat:'important',date:Date.now()}; await idbPut('bookmarks',row); STATE.bookmarksCache[key]=row; }
  document.querySelectorAll('.modal-backdrop').forEach(m=>m.remove());
  renderBankResults();
}

function openPracticeMode(mode){
  const holder = document.getElementById('practiceModalHolder');
  if(mode==='weak'){ startWeakPractice(); return; }
  if(mode==='wrong'){ startWrongPractice(); return; }
  if(mode==='random'){ startQuickPractice(25); return; }
  if(mode==='rapid'){
    const pool = allQuestions().filter(q=>EXAM_META[q.year].status==='ready').sort(()=>Math.random()-0.5).slice(0,20);
    STATE.activeExam = buildRunnerState(null, pool, 'practice', {title:'র‍্যাপিড ফায়ার', durationSec:600});
    navigate('examrunner');
    return;
  }
  if(mode==='revision'){
    const pool = allQuestions().filter(q=>EXAM_META[q.year].status==='ready').filter(q=>{
      const row = STATE.qhistoryCache[qKey(q.year,q.num)];
      if(!row || row.attempts.length===0) return false;
      const st = questionStatus(row);
      return st==='weak' || st==='improving' || st==='learning';
    });
    beginPracticeSession(pool, 'রিভিশন মোড');
    return;
  }
  if(mode==='subject'){
    holder.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)this.remove()"><div class="modal">

      <button class="btn btn-primary btn-block" onclick="launchSubjectPractice()">শুরু করুন</button>
    </div></div>`;
    return;
  }
  if(mode==='topic'){
    holder.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)this.remove()"><div class="modal">
      <h3>বছর নির্বাচন করুন</h3>
      <select id="pmYearSel" style="width:100%; margin:12px 0;">${readyYears().map(y=>`<option value="${y}">${EXAM_META[y].label}</option>`).join('')}</select>
      <button class="btn btn-primary btn-block" onclick="launchYearPractice()">শুরু করুন (উত্তর সাথে সাথে দেখাবে)</button>
    </div></div>`;
    return;
  }
}

  beginPracticeSession(pool, subjName(subj)+' — বিষয়ভিত্তিক প্র্যাকটিস');

ROUTES.revision = async ()=>{
  await refreshCaches();
  const bmList = Object.values(STATE.bookmarksCache);
  const wrongCount = allQuestions().filter(q=>{
    const row = STATE.qhistoryCache[qKey(q.year,q.num)];
    return row && row.attempts.length>0 && !row.attempts[row.attempts.length-1].isCorrect;
  }).length;
  const repeatWrongCount = allQuestions().filter(q=>{
    const row = STATE.qhistoryCache[qKey(q.year,q.num)];
    return row && row.attempts.filter(a=>!a.isCorrect).length>=2;
  }).length;
  const unattemptedCount = allQuestions().filter(q=>EXAM_META[q.year].status==='ready' && !STATE.qhistoryCache[qKey(q.year,q.num)]).length;
  const weakCount = allQuestions().filter(q=>{
    const row = STATE.qhistoryCache[qKey(q.year,q.num)];
    return row && questionStatus(row)==='weak';
  }).length;

  const cards = [
    {label:'বুকমার্কড প্রশ্ন', count:bmList.length, action:"startRevisionSet('bookmark')", ic:'⭐'},
    {label:'সব ভুল প্রশ্ন', count:wrongCount, action:"startRevisionSet('wrong')", ic:'🔴'},

    {label:'দুর্বল বিষয়ের প্রশ্ন', count:weakCount, action:"startRevisionSet('weaktopic')", ic:'🧠'},
    {label:'অ্যাটেম্পট করা হয়নি', count:unattemptedCount, action:"startRevisionSet('unattempted')", ic:'⬜'},
  ];

  return `
    <div class="page-title">রিভিশন সেন্টার</div>
    <div class="page-sub">দ্রুত টার্গেটেড রিভিশনের জন্য</div>
    <div class="grid grid-3">
      ${cards.map(c=>`
        <div class="card">
          <div style="font-size:24px;">${c.ic}</div>
          <div class="num" style="font-family:var(--font-disp); font-size:26px; font-weight:600; margin:6px 0;">${c.count}</div>
          <div class="small muted" style="margin-bottom:12px;">${c.label}</div>
          <button class="btn btn-block" ${c.count===0?'disabled':''} onclick="${c.action}">প্র্যাকটিস শুরু করুন</button>
        </div>`).join('')}
    </div>
    ${bmList.length>0?`
    <div class="card" style="margin-top:16px;">
      <div class="eyebrow">বুকমার্ক তালিকা</div>
      <table><thead><tr><th>বছর</th><th>প্রশ্ন</th><th>বিষয়</th><th></th></tr></thead><tbody>
      ${bmList.map(b=>{
        const q = EXAMS[b.year]?.find(x=>x.num===b.num);
        if(!q) return '';
        return `<tr><td>${EXAM_META[b.year].label}</td><td>${esc(q.text.slice(0,60))}…</td><td>${subjName(q.subject)}</td><td><button class="btn btn-sm" onclick="showQuestionModal({year:'${b.year}',num:${b.num}})">দেখুন</button></td></tr>`;
      }).join('')}
      </tbody></table>
      <div id="qmodal-holder"></div>
    </div>`:''}
  `;
};
function startRevisionSet(kind){
  let pool = allQuestions().filter(q=>EXAM_META[q.year].status==='ready');
  if(kind==='bookmark'){
    const keys = new Set(Object.keys(STATE.bookmarksCache));
    pool = pool.filter(q=>keys.has(qKey(q.year,q.num)));
  } else if(kind==='wrong'){
    pool = pool.filter(q=>{ const row=STATE.qhistoryCache[qKey(q.year,q.num)]; return row && row.attempts.length>0 && !row.attempts[row.attempts.length-1].isCorrect; });
  } else if(kind==='repeatwrong'){
    pool = pool.filter(q=>{ const row=STATE.qhistoryCache[qKey(q.year,q.num)]; return row && row.attempts.filter(a=>!a.isCorrect).length>=2; });
  } else if(kind==='weaktopic'){
    pool = pool.filter(q=>{ const row=STATE.qhistoryCache[qKey(q.year,q.num)]; return row && questionStatus(row)==='weak'; });
  } else if(kind==='unattempted'){
    pool = pool.filter(q=>!STATE.qhistoryCache[qKey(q.year,q.num)]);
  }
  beginPracticeSession(pool, 'রিভিশন সেন্টার');
}

  for(const q of allQuestions()){
    if(EXAM_META[q.year].status!=='ready') continue;
    const row = STATE.qhistoryCache[qKey(q.year,q.num)];

        <tbody>

/* ============================================================

ROUTES.suggestions = async ()=>{
  // Historical importance: frequency across ready years by subject
  const ready = readyYears();
  const subjFreq = {};
  SUBJECTS.forEach(s=>subjFreq[s.id]={count:0, years:new Set()});
  for(const y of ready){
    EXAMS[y].forEach(q=>{ subjFreq[q.subject].count++; subjFreq[q.subject].years.add(y); });
  }
  const subjAcc = Object.fromEntries(subjectAccuracyList().map(s=>[s.id,s]));

  const scored = SUBJECTS.map(s=>{
    const freq = subjFreq[s.id];
    const histScore = ready.length? (freq.count / Math.max(1, allQuestions().filter(q=>EXAM_META[q.year].status==='ready').length) * 100) : 0;
    const yearSpread = ready.length? (freq.years.size / ready.length * 100) : 0;
    const acc = subjAcc[s.id];
    const weaknessScore = (acc && acc.attempted>=3) ? (100-acc.acc) : 50; // unknown perf = medium weight
    const priority = histScore*0.4 + yearSpread*0.3 + weaknessScore*0.3;
    return {...s, histScore, yearSpread, weaknessScore, priority, acc};
  }).sort((a,b)=>b.priority-a.priority);

  const high = scored.slice(0,3), med = scored.slice(3,6), rev = scored.slice(6);

  function block(title, items, color){
    return `
      <div class="card" style="margin-top:14px; border-color:${color};">
        <div class="eyebrow" style="color:${color}">${title}</div>
        ${items.map(it=>`
          <div style="padding:10px 0; border-bottom:1px solid var(--ink-100);">
            <div class="flex-between">
              <strong>${it.name}</strong>
              <span class="small muted">Priority Score: ${it.priority.toFixed(0)}</span>
            </div>
            <div class="small muted" style="margin-top:4px;">
              ঐতিহাসিক উপস্থিতি: ${it.histScore.toFixed(0)} · বছর বিস্তৃতি: ${it.yearSpread.toFixed(0)}%
              ${it.acc && it.acc.attempted>=3 ? ` · আপনার accuracy: ${it.acc.acc.toFixed(0)}%` : ' · আপনার accuracy: পর্যাপ্ত ডেটা নেই'}
            </div>
          </div>`).join('')}
      </div>`;
  }

  return `
    <div class="page-title">What Should I Study Next?</div>
    <div class="page-sub">ঐতিহাসিক প্যাটার্ন ও আপনার ব্যক্তিগত পারফরম্যান্স মিলিয়ে তৈরি — এটি একটি <strong>ডেটা-চালিত পরামর্শ</strong>, ভবিষ্যদ্বাণী নয়।</div>

    <div class="card" style="background:var(--warn-bg); border-color:var(--warn);">
      <strong>⚠️ গুরুত্বপূর্ণ:</strong> এই র‍্যাঙ্কিং বলছে না যে এই বিষয়গুলো থেকে অবশ্যই প্রশ্ন আসবে। এটি কেবলমাত্র বিগত মডেল টেস্টের বিষয় বণ্টন ও আপনার ব্যক্তিগত দুর্বলতার সমন্বয়ে একটি প্রস্তুতির অগ্রাধিকার নির্দেশনা।
      <div class="small muted" style="margin-top:6px;">Priority Score = ০.৪ × ঐতিহাসিক গুরুত্ব + ০.৩ × বছরব্যাপী উপস্থিতি + ০.৩ × ব্যক্তিগত দুর্বলতা</div>
    </div>

    ${block('High Priority', high, 'var(--bad)')}
    ${block('Medium Priority', med, 'var(--warn)')}
    ${block('Revision Priority', rev, 'var(--good)')}

    <div class="card" style="margin-top:16px;">
      <button class="btn btn-brass" onclick="beginPracticeSession(allQuestions().filter(q=>EXAM_META[q.year].status==='ready' && q.subject==='${high[0]?.id}'), '${high[0]?.name} — প্রায়োরিটি প্র্যাকটিস')">সর্বোচ্চ অগ্রাধিকার বিষয় দিয়ে অনুশীলন শুরু করুন</button>
    </div>
  `;
};

/* ============================================================
   SETTINGS / DATA MANAGEMENT
   ============================================================ */
ROUTES.settings = async ()=>{
  return `
    <div class="page-title">সেটিংস ও ডেটা ম্যানেজমেন্ট</div>
    <div class="tabbar">
      <button class="tabbtn active" data-tab="prefs" onclick="settingsTab('prefs')">পছন্দসমূহ</button>
      <button class="tabbtn" data-tab="data" onclick="settingsTab('data')">ডেটা ব্যাকআপ</button>
      <button class="tabbtn" data-tab="verify" onclick="settingsTab('verify')">ডেটা যাচাই</button>
    </div>
    <div id="settingsBody"></div>
  `;
};
ROUTES_AFTER.settings = ()=>{ settingsTab('prefs'); };

function settingsTab(tab){
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const el = document.getElementById('settingsBody');
  if(tab==='prefs') el.innerHTML = renderSettingsPrefs();
  else if(tab==='data') el.innerHTML = renderSettingsData();
  else el.innerHTML = renderSettingsVerify();
}

      <div class="grid grid-2">
        <div>
          <label class="field">থিম</label>

          <label class="field">ফন্ট সাইজ</label>
          <select onchange="setSetting('fontSize',this.value)" style="width:100%">

            <option value="md" ${s.fontSize==='md'?'selected':''}>মাঝারি</option>
            <option value="lg" ${s.fontSize==='lg'?'selected':''}>বড়</option>
          </select>
        </div>
      </div>
    </div>
    <div class="card">

        </div>
        <div>
          <label class="field">শব্দ</label><br>

  return `
    <div class="card">
      <div class="eyebrow">এক্সপোর্ট</div>
      <p class="small muted">আপনার সব অ্যাটেম্পট, প্রশ্ন হিস্টোরি, বুকমার্ক ও সেটিংস JSON ফাইল হিসেবে ডাউনলোড করুন।</p>
      <button class="btn btn-primary" onclick="exportData()">📥 Export Progress (JSON ডাউনলোড)</button>

    <div class="card">
      <div class="eyebrow">ইমপোর্ট</div>
      <p class="small muted">পূর্বে এক্সপোর্ট করা ব্যাকআপ ফাইল থেকে ডেটা পুনরুদ্ধার করুন। এটি বর্তমান ডেটার সাথে যুক্ত হবে (ওভাররাইট হবে যদি একই ID থাকে)।</p>

function renderSettingsVerify(){
  const report = [];
  for(const y of YEARS){
    const meta = EXAM_META[y];
    const qs = EXAMS[y];
    if(meta.status!=='ready'){
      report.push({year:y, label:meta.label, status:'pending', line:`${meta.label}: এখনো ট্রান্সক্রাইব করা হয়নি (০/২০০)`});
      continue;
    }
    const nums = qs.map(q=>q.num).sort((a,b)=>a-b);
    const missing=[]; for(let i=1;i<=200;i++) if(!nums.includes(i)) missing.push(i);
    const dupes = nums.filter((n,i)=>nums.indexOf(n)!==i);
    const missingAns = qs.filter(q=>q.answer==null).length;
    const badOpts = qs.filter(q=>['A','B','C','D'].some(L=>!q.options[L] || !q.options[L].trim())).length;
    const noSubject = qs.filter(q=>!q.subject).length;
    const figQ = qs.filter(q=>q.hasFigure).length;
    report.push({
      year:y, label:meta.label, status:'ready',
      line:`${meta.label}: ${qs.length}/200 প্রশ্ন লোড হয়েছে`,
      missing, dupes, missingAns, badOpts, noSubject, figQ
    });
  }
  return `
    <div class="card">
      <div class="eyebrow">ডেটা যাচাই প্যানেল (Developer / QC View)</div>
      <p class="small muted">প্রতিটি বছরের ডেটা সম্পূর্ণতা ও সঙ্গতি স্বয়ংক্রিয়ভাবে যাচাই করা হয়েছে।</p>
      ${report.map(r=>`
        <div class="card" style="background:var(--ink-100); box-shadow:none;">
          <div class="flex-between">
            <strong>${r.line}</strong>
            <span class="pill ${r.status==='ready'?'pill-good':'pill-warn'}">${r.status==='ready'?'✓ প্রস্তুত':'⏳ বাকি'}</span>
          </div>
          ${r.status==='ready'?`
          <div class="small muted" style="margin-top:8px; line-height:1.9;">
            মিসিং প্রশ্ন নম্বর: ${r.missing.length===0?'০ (কোনোটি নেই ✓)':r.missing.join(', ')}<br>
            ডুপ্লিকেট প্রশ্ন নম্বর: ${r.dupes.length===0?'০ ✓':[...new Set(r.dupes)].join(', ')}<br>
            উত্তর অনুপস্থিত/অস্পষ্ট: ${r.missingAns}<br>
            অসম্পূর্ণ অপশন: ${r.badOpts}<br>
            বিষয় নির্ধারণ বাকি: ${r.noSubject}<br>
            ছবি/চিত্রসহ প্রশ্ন: ${r.figQ}
          </div>`:''}
        </div>`).join('')}
    </div>
  `;
}

async function exportData(){
  const [attempts, qhistory, bookmarks, settings] = await Promise.all([
    idbGetAll('attempts'), idbGetAll('qhistory'), idbGetAll('bookmarks'), idbGetAll('settings')
  ]);
  const payload = {exportedAt:Date.now(), version:1, attempts, qhistory, bookmarks, settings};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = `bcs_progress_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('ব্যাকআপ ডাউনলোড হয়েছে ✓');
}
async function importData(){
  const inp = document.getElementById('importFile');
  if(!inp.files.length){ toast('একটি ফাইল নির্বাচন করুন'); return; }
  try{
    const text = await inp.files[0].text();
    const payload = JSON.parse(text);
    for(const a of (payload.attempts||[])) await idbPut('attempts', a);
    for(const q of (payload.qhistory||[])) await idbPut('qhistory', q);
    for(const b of (payload.bookmarks||[])) await idbPut('bookmarks', b);
    for(const s of (payload.settings||[])) await idbPut('settings', s);
    toast('ইমপোর্ট সম্পন্ন হয়েছে ✓');
    await loadSettings(); await refreshCaches();
    navigate('dashboard');
  }catch(e){
    toast('ইমপোর্ট ব্যর্থ হয়েছে: ফাইলটি সঠিক নয়');
  }
}
async function resetProgress(){
  if(!confirm('আপনি কি নিশ্চিত? এটি আপনার সব পরীক্ষার ফলাফল, প্রশ্ন হিস্টোরি ও বুকমার্ক স্থায়ীভাবে মুছে ফেলবে। এই কাজটি ফেরানো যাবে না।')) return;
  if(!confirm('চূড়ান্ত নিশ্চিতকরণ: সত্যিই সব রিসেট করতে চান?')) return;
  await Promise.all([idbClear('attempts'), idbClear('qhistory'), idbClear('bookmarks'), idbClear('examProgress')]);
  await refreshCaches();
  toast('সব ডেটা রিসেট করা হয়েছে।');
  navigate('dashboard');
}

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('beforeunload', (e)=>{
  if(STATE.activeExam && STATE.activeExam.mode==='exam'){ saveExamProgress(); }
});

async function boot(){
  renderShell();
  await loadSettings();
  await refreshCaches();
  const hashRoute = (location.hash||'#dashboard').slice(1).split('?')[0];
  STATE.route = ROUTES[hashRoute] ? hashRoute : 'dashboard';
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.route===STATE.route));
  await renderRoute();
}
boot();
</script>
