: "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "14", "question": "There is no alternative ___ training.", "source_tag": "২৮তম বিসিএস", "options": {"ক": "to", "খ": "for", "গ": "than", "ঘ": "of"}, "answerKey": "ক", "answerText": "to", "explanation_bn": "Appropriate preposition অনুযায়ী alternative noun-টির পর সব সময় 'to' preposition বসে, এর অর্থ বিকল্প।"}, {"id": "EL-0130", "page": 17, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "15", "question": "What will be the correct preposition to complete the sentence? 'I am not good ___ translation'", "source_tag": "২৭তম বিসিএস", "options": {"ক": "in", "খ": "about", "গ": "with", "ঘ": "at"}, "answerKey": "ঘ", "answerText": "at", "explanation_bn": "'Good'-এর পরে সাধারণত 'at' preposition ব্যবহৃত হলে বোঝায় 'able to do something well'. Good এর সাথে 'With' preposition বসলে বোঝায় 'capable of dealing with'। যেমন- She is very good with children. সুতরাং উপরিউক্ত sentence এর জন্য 'at' appropriate preposition।"}, {"id": "EL-0131", "page": 17, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "16", "question": "Every driver must be held ___ his own actions.", "source_tag": "২৭তম বিসিএস", "options": {"ক": "responsible for", "খ": "responsible to", "গ": "liable to", "ঘ": "blamed for"}, "answerKey": "ক", "answerText": "responsible for", "explanation_bn": "অধস্তন বা ঊর্ধ্বতন কোনো কর্তৃপক্ষের নিকট কাজের জন্য দায়ী বা কোনো লোক অন্য কোনো লোকের কাছে কাজের জন্য দায়ী থাকলে সাধারণত 'responsible to' ব্যবহার করা হয়। যেমন- The Director is directly responsible to the president. অপরপক্ষে, কোনো কাজের দায়ভার যখন যে কাজ করে তার ওপরই বর্তায়, তখন 'be held responsible for' ব্যবহৃত হয়। যেমন- Sumi is mentally ill and can't be held responsible for her actions. 'liable to' দ্বারা কোনো দায়-দায়িত্বকে বোঝায়।"}, {"id": "EL-0132", "page": 17, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "17", "question": "Fill in the blank with correct preposition. He is devoid ___ commonsense.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "of", "খ": "from", "গ": "introduction", "ঘ": "at"}, "answerKey": "ক", "answerText": "of", "explanation_bn": "Devoid এমন একটি verb যার পর সব সময় 'of' preposition বসে। Deviod of অর্থ বর্জিত, শূন্য বা খালি।"}, {"id": "EL-0133", "page": 17, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "18", "question": "Choose the correct preposition. The police is looking ___ the case.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "after", "খ": "on", "গ": "up", "ঘ": "into"}, "answerKey": "ঘ", "answerText": "into", "explanation_bn": "Look after- দেখাশুনা করা। Look on- দর্শক হওয়া। Look up- অভিধানে শব্দ খুঁজে বের করা। Look into- তদন্ত করা। সাধারণত পুলিশ কোনো মামলার তদন্ত করে থাকে। তাই এক্ষেত্রে into হবে।"}, {"id": "EL-0134", "page": 17, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "19", "question": "Choose the correct preposition. The tree has been blown ___ by the storm.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "away", "খ": "up", "গ": "off", "ঘ": "out"}, "answerKey": "ক", "answerText": "away", "explanation_bn": "Blow away অর্থ-এক স্থান থেকে অন্য স্থানে উড়িয়ে নিয়ে যাওয়া (বাতাসে)। যেমন- We fixed the tent securely so that it wouldn't be blown away in the strong wind. Blow up অর্থ-বিস্ফোরণ ব্যবহার করে ধ্বংস করা; Blow off অর্থ-নির্গত করা, Blow out-অর্থ আগুন নেভানো।"}, {"id": "EL-0135", "page": 17, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "20", "question": "The man died ___ over eating.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "by", "খ": "of", "গ": "for", "ঘ": "from"}, "answerKey": "ঘ", "answerText": "from", "explanation_bn": "Die by- কোনো আঘাতে বা দুর্ঘটনায় মারা যাওয়া। Die of- রোগে মারা যাওয়া। Die for- আত্মত্যাগ করা। Die from- কোনো কারণে মারা যাওয়া। এখানে অতিভোজনের (Over eating) কারণে মারা যাওয়া বুঝাচ্ছে বলে die from হবে। die in- কাজ করতে করতে মারা যাওয়া।"}, {"id": "EL-0136", "page": 17, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "21", "question": "What are you so angry ___?", "source_tag": "২৫তম বিসিএস", "options": {"ক": "about", "খ": "at", "গ": "with", "ঘ": "for"}, "answerKey": "ক", "answerText": "about", "explanation_bn": "কোনো ব্যক্তির (somebody) ওপর রাগান্বিত হলে angry-এর সাথে with এবং কারো আচরণ বা কর্মের উপর রাগান্বিত হওয়া বুঝাতে angry at বসে। কিন্তু কোনো কিছু নিয়ে রাগান্বিত হলে angry-এর সাথে about বসে। Sentence-টির অর্থ তুমি কি নিয়ে রাগান্বিত? তাই এখানে about বসবে।"}, {"id": "EL-0137", "page": 17, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "22", "question": "I finally killed the fly ___ a rolled-up newspaper.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "by", "খ": "with", "গ": "through", "ঘ": "from"}, "answerKey": "খ", "answerText": "with", "explanation_bn": "কোন কিছুকে কোনো tool বা বস্তু দিয়ে মারা বুঝাতে kill with ব্যবহৃত হয়। যেমন: I finally killed the fly with a rolled-up newspaper।"}, {"id": "EL-0138", "page": 18, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "23", "question": "The children were entrusted ___ the care of their uncle.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "with", "খ": "for", "গ": "to", "ঘ": "at"}, "answerKey": "গ", "answerText": "to", "explanation_bn": "entrusted with- কোনো ব্যক্তিকে কোনো কিছুর দায়িত্ব প্রদান বা কোনো কিছুতে আস্থা স্থাপন করা। যেমন: He has been entrusted with the task. Entrusted to কাউকে অন্য কারো (ব্যক্তির) দায়িত্ব অর্পন বা কোনো ব্যক্তি বা ব্যক্তিবর্গকে বিশ্বাস করা। যেমন: The children were entrusted to the care of their uncle. বাক্যটির অর্থ শিশুদেরকে চাচার দায়িত্বে অর্পণ করা হয়েছিল। তাই এখানে to বসবে।"}, {"id": "EL-0139", "page": 18, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "24", "question": "He parted ___ his friends in tears.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "with", "খ": "from", "গ": "against", "ঘ": "beside"}, "answerKey": "খ", "answerText": "from", "explanation_bn": "part with- ভিন্ন পথে গমন, কোনো কিছু ত্যাগ করা। part from- বিচ্ছিন্ন হওয়া, ছেড়ে যাওয়া। part against এবং part beside - এ ধরনের ব্যবহার দেখা যায় না।"}, {"id": "EL-0140", "page": 18, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "25", "question": "Please ___ the necessity of arriving early.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "emphasise about", "খ": "emphasise to", "গ": "emphasise on", "ঘ": "emphasise"}, "answerKey": "ঘ", "answerText": "emphasise", "explanation_bn": "Emphasis (n)-এর পর on বসে কিন্তু এর verb 'emphasise'-এর পর সাধারণত কোনো preposition হয় না।"}, {"id": "EL-0141", "page": 18, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "26", "question": "I don't think you will have any difficulty ___ a driving license.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "to get", "খ": "in getting", "গ": "for getting", "ঘ": "get"}, "answerKey": "খ", "answerText": "in getting", "explanation_bn": "difficult শব্দটি adjective এবং এর থেকে গঠিত difficulty শব্দটি noun, সাধারণত have difficulty এর পর infinitive না হয়ে in + verb-এর ing হয়। যেমন: We have much difficulty in completing this project. কিন্তু 'difficult' -adjective-এর পর to বসে। সচরাচর difficulty in something-এরূপ ব্যবহারই দেখা যায়। Difficulty in অর্থ কঠিনতা, অসুবিধা বা কাঠিন্য।"}, {"id": "EL-0142", "page": 18, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "27", "question": "The ministers arrived ___ a decision last night.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "to", "খ": "at", "গ": "on", "ঘ": "by"}, "answerKey": "খ", "answerText": "at", "explanation_bn": "Arrive to, Arrive by ও Arrive on -এ ধরনের কোনো ব্যবহার পাওয়া যায় না। Arrive at-অর্থ ছোট স্থানে বা সিদ্ধান্তে পৌঁছানো বা উপনীত হওয়া। যেমন: The ministers arrived at a decision last night. Arrive in অর্থ বড় স্থানে পৌঁছানো। যেমন: We arrived in Basra yesterday।"}, {"id": "EL-0143", "page": 18, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "28", "question": "The government gave — the demands of the people.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "in to", "খ": "in", "গ": "to", "ঘ": "over to"}, "answerKey": "ক", "answerText": "in to", "explanation_bn": "Give in to- দাবি পূরণ করতে রাজি হওয়া; give in- বশ্যতা স্বীকার করা; give to- কাউকে কিছু দেওয়া; give over to- কোনো কিছুতে বিলিয়ে দেয়া।"}, {"id": "EL-0144", "page": 18, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "29", "question": "The captain left the boat, because it ___.", "source_tag": "২৩তম বিসিএস", "options": {"ক": "turned down", "খ": "turned up", "গ": "turned bottom", "ঘ": "turned over"}, "answerKey": "ঘ", "answerText": "turned over", "explanation_bn": "এখানে, Turned down- প্রত্যাখ্যান করা। Turned up- আগমন করা, উপস্থিত হওয়া। Turned bottom- এ জাতীয় phrase- এর সন্ধান বিরল। Turn over- উল্টে যাওয়া, পাশ ফেরা।"}, {"id": "EL-0145", "page": 18, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "30", "question": "Choose the right preposition for the sentence. She argued ___ me about the marriage.", "source_tag": "২৩তম বিসিএস", "options": {"ক": "with", "খ": "to", "গ": "for", "ঘ": "from"}, "answerKey": "ক", "answerText": "with", "explanation_bn": "Argue with somebody অর্থাৎ কারো সাথে মতের অমিল। আর Argue for something অর্থাৎ কোনো বস্তুর ব্যাপারে মতামত বা যুক্তি প্রদর্শন। এখানে যেহেতু gap এরপর me রয়েছে তাই with বসানো যৌক্তিক।"}, {"id": "EL-0146", "page": 18, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "31", "question": "Choose the right preposition for the sentence. I count ___ your help.", "source_tag": "২৩তম বিসিএস", "options": {"ক": "after", "খ": "upon", "গ": "for", "ঘ": "with"}, "answerKey": "খ", "answerText": "upon", "explanation_bn": "count after এবং count with বলে কোনো phrase নেই। count upon- নির্ভর করা, বিশ্বাস করা যে, কোনো কিছু ঘটবেই। Count for- গুরুত্বপূর্ণ বলে বিবেচনা করা। সুতরাং দুটির মধ্যে Count upon সঠিক।"}, {"id": "EL-0147", "page": 19, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "32", "question": "He has paid the penalty ___ his crimes ___ five years in prison.", "source_tag": "২২তম বিসিএস", "options": {"ক": "for, with", "খ": "at, by", "গ": "about, at", "ঘ": "after, in"}, "answerKey": "ক", "answerText": "for, with", "explanation_bn": "paid for something or action- অর্থ- কোনো কিছুর বা কর্মের পুরস্কার প্রদান বা শাস্তি প্রদান। ৫ বছর কারাদণ্ড সহ-অর্থে five year- এর পূর্বে with বসবে। He has paid the penalty for his crimes with five years in prison. বাক্যটির অর্থ: তার অপরাধের জন্য তাকে ৫ বছরের কারাদণ্ড দেওয়া হয়েছে।"}, {"id": "EL-0148", "page": 19, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "33", "question": "Government has been entrusted ___ elected politicians.", "source_tag": "২২তম বিসিএস", "options": {"ক": "with", "খ": "for", "গ": "to", "ঘ": "at"}, "answerKey": "গ", "answerText": "to", "explanation_bn": ""}, {"id": "EL-0149", "page": 19, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "34", "question": "He fantasized ___ winning the lottery.", "source_tag": "২১তম বিসিএস", "options": {"ক": "with", "খ": "from", "গ": "after", "ঘ": "about"}, "answerKey": "ঘ", "answerText": "about", "explanation_bn": "Fantasize about- কল্পনা করা (কোনো ঘটনা/বস্তু সম্পর্কে)।"}, {"id": "EL-0150", "page": 19, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "35", "question": "The walls of our house have been painted ___ green. Which is the correct preposition in the blank above?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "no preposition", "খ": "by", "গ": "in", "ঘ": "with"}, "answerKey": "ক", "answerText": "no preposition", "explanation_bn": "রং করা অর্থে paint এর পর কোনো preposition বসে না।"}, {"id": "EL-0151", "page": 19, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "36", "question": "Now-a-days many villages are lit ___ electricity. Which is the correct preposition in the above blank?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "With", "খ": "by", "গ": "from", "ঘ": "on"}, "answerKey": "খ", "answerText": "by", "explanation_bn": "Lit এর পর by/with দুটি preposition ই বসে। Lit by সাধারণত লাইনটি সরবরাহকারী সত্ত্বাকে বোঝায় যেমন- 'The house is lit by electricity.' Lit with লাইনটি সরবরাহকারী সত্ত্বাকে বোঝায় যেমন- 'The stage was lit with spotlights.'"}, {"id": "EL-0152", "page": 19, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "37", "question": "Fill in blank 'He has assured me ___ safety'", "source_tag": "১১তম বিসিএস", "options": {"ক": "with", "খ": "at", "গ": "for", "ঘ": "of"}, "answerKey": "ঘ", "answerText": "of", "explanation_bn": "Assure of-আশ্বস্ত করা, নিশ্চয়তা দেয়া। কিন্তু Assure শব্দটি অন্য কোনো Preposition গ্রহণ করে না।"}, {"id": "EL-0153", "page": 19, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "38", "question": "What will be correct preposition to complete the sentence? 'I am not bad ___ tennis'.", "source_tag": "১০তম বিসিএস", "options": {"ক": "in", "খ": "at", "গ": "about", "ঘ": "with"}, "answerKey": "খ", "answerText": "at", "explanation_bn": "কোনো বিষয়ে ভালো বা দক্ষ অথবা মন্দ বা অদক্ষ বুঝাতে Preposition at ব্যবহৃত হয়। যেমন: Good at mathematics, bad at tennis।"}, {"id": "EL-0154", "page": 19, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "01", "question": "Candidates are required to get ___ the centre before 09:00 AM.", "source_tag": "৫০তম বিসিএস", "options": {"ক": "at", "খ": "to", "গ": "in", "ঘ": "into"}, "answerKey": "খ", "answerText": "to", "explanation_bn": "'Get to a place' অর্থ: কোনো স্থানে পৌঁছানো (reach/arrive)। অন্য option গুলো হলো: (ক) at- 'get at' অর্থ নাগাল পাওয়া; (গ) in-'get in' অর্থ প্রবেশ করা বা ভিতরে ঢোকা (of a vehicle or room), গন্তব্যে পৌঁছানো নয়, (ঘ) into- 'get into' অর্থ ভেতরে ঢোকা বা শুরু করা; এর দ্বারা 'reach the centre' অর্থ প্রকাশ পায় না।"}, {"id": "EL-0155", "page": 19, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "02", "question": "These books ___ me.", "source_tag": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "belongs to", "খ": "belong to", "গ": "are belonged by", "ঘ": "belongs by"}, "answerKey": "খ", "answerText": "belong to", "explanation_bn": "'These books' subject টি plural number হওয়ায় verb টিও plural (belong) হবে। যেখানে Phrasal Verb belong to এর অর্থ কারো/কিছুর মালিকামাধীন হওয়া। সুতরাং, বাক্যটির অর্থ এই বইগুলো আমার।"}, {"id": "EL-0156", "page": 20, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "03", "question": "Choose the best alternative for the underlined. He went back on his promise of voting for me.", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "withdrew", "খ": "forgot", "গ": "reinforced", "ঘ": "support"}, "answerKey": "ক", "answerText": "withdrew", "explanation_bn": "বাক্যটিতে went back অঙ্গীকার ভঙ্গ করা/ অঙ্গীকার থেকে সরে আসা (withdraw) অর্থে ব্যবহৃত হয়েছে।"}, {"id": "EL-0157", "page": 20, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "04", "question": "When one makes a promise, one must not go ___ on it.", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "forward", "খ": "back", "গ": "by", "ঘ": "around"}, "answerKey": "খ", "answerText": "back", "explanation_bn": "Go back on একটি group verb. এর অর্থ প্রত্যাহার করা।"}, {"id": "EL-0158", "page": 20, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "05", "question": "'To get along with' means-", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "to adjust", "খ": "to interest", "গ": "to accompany", "ঘ": "to walk"}, "answerKey": "ক", "answerText": "to adjust", "explanation_bn": "To get along with একটি phrasal verb যার অর্থ তাল মিলানো, সুসম্পর্ক করা। তাই সঠিক উত্তর হবে to adjust।"}, {"id": "EL-0159", "page": 20, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "06", "question": "Fill in the blank: As she was talking, he suddenly broke ___, saying, 'That's a lie'.", "source_tag": "৪০তম বিসিএস", "options": {"ক": "off", "খ": "in", "গ": "down", "ঘ": "into"}, "answerKey": "খ", "answerText": "in", "explanation_bn": "'Break in' phrasal verb- এর অর্থ চলমান কথা বা কাজের মাঝে হস্তক্ষেপ করা। বাক্যটির অর্থ 'যখন সে (নারী) কথা বলছিল তখন হঠাৎ সে (পুরুষ) তার (নারীর) কথার মাঝে এই বলে হস্তক্ষেপ করলো যে সেটা মিথ্যা।' সুতরাং শূন্যস্থানে in বসবে। Break off অর্থ সাময়িকভাবে থামা; বিরতি গ্রহণ, break down অর্থ ভেঙে পড়া আর Break into অর্থ বলপূর্বক প্রবেশ করা।"}, {"id": "EL-0160", "page": 20, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "07", "question": "When they had their first child, they put ___ a large sum for his education.", "source_tag": "২৮তম বিসিএস", "options": {"ক": "aside", "খ": "beside", "গ": "outside", "ঘ": "under"}, "answerKey": "ক", "answerText": "aside", "explanation_bn": "Put aside একটি phrasal verb, যার অর্থ সরিয়ে রাখা বা সঞ্চয় করা। Beside শব্দের অর্থ পাশে। Outside অর্থ বহির্দেশ বা বাইরের অংশ। Under শব্দের অর্থ নিচে বা অধীনে। প্রশ্নে উল্লিখিত বাক্যের অর্থ অনুযায়ী aside উত্তরটি সঠিক। কারন বাক্যটির অর্থ হলো 'যখন তাদের প্রথম সন্তান জন্ম নিল, তখন তারা সন্তানের ভবিষ্যৎ শিক্ষার জন্য আয়ের একটি বড় অংশ সঞ্চয় করত'।"}, {"id": "EL-0161", "page": 20, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "08", "question": "Choose the correct alternative and mark its letter on your answer sheet. The rich should not look down ___ the poor.", "source_tag": "২৭তম বিসিএস", "options": {"ক": "at", "খ": "for", "গ": "towards", "ঘ": "upon"}, "answerKey": "ঘ", "answerText": "upon", "explanation_bn": "'look at' অর্থাৎ তাকানো, 'look towards' অর্থ-মুখোমুখি অবস্থায় বা বিপরীতে অবস্থান করা। 'look down upon' অর্থ ঘৃণা করা। বাক্যটির অর্থ ধনীদের গরীবদেরকে ঘৃণা করা উচিৎ নয়, তাই এখানে upon বসবে।"}, {"id": "EL-0162", "page": 20, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "09", "question": "Fill in the blank with the correct phrase: ___ your shoes before entering the mosque.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "put out", "খ": "put off", "গ": "put away", "ঘ": "put on"}, "answerKey": "খ", "answerText": "put off", "explanation_bn": "Put out- নিভানো; Put off- খুলে ফেলা; Put on- পরিধান করা এবং Put away পরিত্যাগ করা, কোনো জিনিস যথাস্থানে/সরিয়ে রাখা।"}, {"id": "EL-0163", "page": 20, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "10", "question": "The lights have been blown ___ by the strong wind.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "Out", "খ": "Away", "গ": "Up", "ঘ": "Off"}, "answerKey": "ক", "answerText": "Out", "explanation_bn": "blow out- বায়ু প্রবাহের ফলে নিভে যাওয়া বুঝায়। blow up- বিস্ফোরক দ্রব্য ব্যবহারের মাধ্যমে কোনো কিছু উড়িয়ে দেওয়া। blow off- কোনো কিছু থেকে কোনো কিছু নির্গত হওয়া।"}, {"id": "EL-0164", "page": 20, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "11", "question": "The Second World War broke ___ in September, 1939.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "through", "খ": "away", "গ": "out", "ঘ": "in"}, "answerKey": "গ", "answerText": "out", "explanation_bn": "Break through-জোর করে পথ করা। Break away-পলায়ন করা। Break out- প্রাদুর্ভাব হওয়া, শুরু হওয়া। Break in- বলপূর্বক প্রবেশ করা, বলপূর্বক নিজেকে ছাড়ানো। এখানে বাক্যের ভাবানুযায়ী Broke out (শুরু হওয়া) ব্যবহারই যথার্থ। কারণ যুদ্ধ আরম্ভ হওয়া অর্থই স্বাভাবিক ও যুক্তিযুক্ত।"}, {"id": "EL-0165", "page": 21, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "12", "question": "In spite of my requests, he did not ___.", "source_tag": "২২তম বিসিএস", "options": {"ক": "give in", "খ": "fall in", "গ": "get off", "ঘ": "give forth"}, "answerKey": "ক", "answerText": "give in", "explanation_bn": "প্রদত্ত phrasal verb গুলোর অর্থ হলো- Give in- আত্মসমর্পণ করা; বশ্যতা স্বীকার করা; Fall in- ভেঙে পড়া, সারি বেধে দাঁড়ানো; Get off- যাত্রা করা, রওনা দেয়া; Get forth- উদগীরণ করা, নিঃসৃত করা/হওয়া; Give in দিয়েই বাক্যটি অর্থবোধক হয়- আমার অনুরোধ সত্ত্বেও সে বশ্যতা স্বীকার করেনি।"}, {"id": "EL-0166", "page": 21, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "13", "question": "The tree has been blown ___ by the strong wind.", "source_tag": "২১তম বিসিএস", "options": {"ক": "away", "খ": "up", "গ": "off", "ঘ": "out"}, "answerKey": "ক", "answerText": "away", "explanation_bn": "Blow away অর্থ- উড়িয়ে নিয়ে যাওয়া। বাক্যটির অর্থ: ঝড়ো বাতাসে গাছটি উপড়ে পড়ল।"}, {"id": "EL-0167", "page": 21, "chapter": "Chapter 01: Parts of Speech", "topic": "1.12 Group Verb/Phrasal Verb", "qno": "14", "question": "The second anniversary celebration of our college will be held on December 15. Which of the following is the correct phrase for 'will be held' above?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "takes off", "খ": "comes off", "গ": "will bring about", "ঘ": "will come round"}, "answerKey": "খ", "answerText": "comes off", "explanation_bn": "Will be held- অনুষ্ঠিত হবে। অপশন Take (s) off- উড্ডয়ন করা, উল্লম্ফন। Come (s) off- সংঘটিত হওয়া, অনুষ্ঠিত হওয়া। Bring about- দুর্ঘটনা ঘটানো, দিক পরিবর্তন করানো। Come round- আরোগ্য লাভ করা, কাটিয়ে ওঠা। বাক্যটির অর্থ আমাদের স্কুলের দ্বিতীয় বার্ষিক উদযাপন অনুষ্ঠান ১৫ ডিসেম্বর অনুষ্ঠিত হবে। এখানে will be held অর্থে comes off ব্যবহৃত হবে।"}, {"id": "EL-0168", "page": 21, "chapter": "Chapter 01: Parts of Speech", "topic": "1.13 Interchange of Parts of Speech", "qno": "01", "question": "What is the verb form of the word 'ability'?", "source_tag": "৪৪তম, ১১তম বিসিএস", "options": {"ক": "capable", "খ": "inability", "গ": "enable", "ঘ": "unable"}, "answerKey": "গ", "answerText": "enable", "explanation_bn": "Ability একটি noun যার verb form হলো enable adjective form হলো able. সাধারণত 'en' prefix যোগে verb গঠিত হয়। যেমন: ensure, enlarge, enforce, enlighten etc."}, {"id": "EL-0169", "page": 21, "chapter": "Chapter 01: Parts of Speech", "topic": "1.13 Interchange of Parts of Speech", "qno": "02", "question": "What is the noun form of the word 'laugh'?", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "laughing", "খ": "laughable", "গ": "laughter", "ঘ": "laughingly"}, "answerKey": "গ", "answerText": "laughter", "explanation_bn": "'laugh' একটি Verb বা ক্রিয়া, যার অর্থ 'হাসা'। এর Noun বা বিশেষ্যরূপ হলো 'laughter' এটি দিয়ে হাসির কাজটিকে বুঝায়। যেমন: \"Her laughter turned quickly to despair.\" অর্থ \"তার হাসি দ্রুত মিলিয়ে গেল।\""}, {"id": "EL-0170", "page": 21, "chapter": "Chapter 01: Parts of Speech", "topic": "1.13 Interchange of Parts of Speech", "qno": "03", "question": "What is the adjective form of the word 'people'?", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "populous", "খ": "popular", "গ": "popularity", "ঘ": "popularize"}, "answerKey": "ক", "answerText": "populous", "explanation_bn": "'people' শব্দটি Noun. এর Adjective form হলো populous।"}, {"id": "EL-0171", "page": 21, "chapter": "Chapter 01: Parts of Speech", "topic": "1.13 Interchange of Parts of Speech", "qno": "08", "flag": "⚠ Source numbering jumps 03→08 on this page, preserved as printed.", "question": "What is the noun form of the word 'know'?", "source_tag": "৪১তম বিসিএস", "options": {"ক": "knowing", "খ": "knowledge", "গ": "knowledgeable", "ঘ": "known"}, "answerKey": "খ", "answerText": "knowledge", "explanation_bn": "Verb- know (জানা) এর noun হলো knowledge (জ্ঞান); knowledgeable (জ্ঞানী) হলো adjective।"}, {"id": "EL-0172", "page": 21, "chapter": "Chapter 01: Parts of Speech", "topic": "1.13 Interchange of Parts of Speech", "qno": "05", "question": "Verb of 'Number' is-", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "number", "খ": "enumerate", "গ": "numbering", "ঘ": "numerical"}, "answerKey": "ক", "answerText": "number", "explanation_bn": "Number শব্দটি Noun এবং Verb উভয় হিসেবেই ব্যবহৃত হয়। Noun হিসেবে Number এর অর্থ- সংখ্যা। Verb-হিসেবে Number-এর অর্থ 'কোনো ব্যক্তি বা বস্তকে বিশেষ দলে অন্তর্ভুক্ত করা অথবা কোনো ক্রম বা তালিকার অংশ হিসেবে কোন কিছুর সংখ্যায়ন করা'। যেমন: I number Mubin as my best friends. Enumerate(v)-গণনা করা, Numbering (Adj)-সংখ্যায়ন, Numerical (adj)-সংখ্যাসূচক।"}, {"id": "EL-0173", "page": 22, "chapter": "Chapter 01: Parts of Speech", "topic": "1.13 Interchange of Parts of Speech", "qno": "06", "question": "The verb of the word 'short' is-", "source_tag": "২৮তম বিসিএস", "options": {"ক": "enshort", "খ": "shorten", "গ": "shorted", "ঘ": "shorting"}, "answerKey": "খ", "answerText": "shorten", "explanation_bn": "Short (ছোট, খাটো) শব্দটি adjective. এর verb form 'Shorten' (সংক্ষিপ্ত করা), adverb 'Shortly' (সংক্ষিপ্তভাবে), noun 'Shortness' (সংক্ষেপ)।"}, {"id": "EL-0174", "page": 22, "chapter": "Chapter 01: Parts of Speech", "topic": "1.13 Interchange of Parts of Speech", "qno": "07", "question": "Which is the noun of the word 'beautiful'?", "source_tag": "২৭তম, ১১তম বিসিএস", "options": {"ক": "Beauty", "খ": "Beautify", "গ": "Beauteous", "ঘ": "Beautifully"}, "answerKey": "ক", "answerText": "Beauty", "explanation_bn": "'Beauty' word টি noun; 'Beautify' word টি verb; 'Beauteous' হচ্ছে adjective এবং 'Beautifully' হচ্ছে adverb।"}, {"id": "EL-0175", "page": 22, "chapter": "Chapter 01: Parts of Speech", "topic": "1.13 Interchange of Parts of Speech", "qno": "08", "question": "What is the verb of the word 'Shortly'?", "source_tag": "১২তম বিসিএস", "options": {"ক": "Short", "খ": "Shorter", "গ": "Shorten", "ঘ": "Shortness"}, "answerKey": "গ", "answerText": "Shorten", "explanation_bn": ""}, {"id": "EL-0176", "page": 22, "chapter": "Chapter 01: Parts of Speech", "topic": "1.13 Interchange of Parts of Speech", "qno": "09", "question": "What is the noun of the word 'Waste'?", "source_tag": "১২তম বিসিএস", "options": {"ক": "Waste", "খ": "Wasting", "গ": "Wastage", "ঘ": "Wasteful"}, "answerKey": "গ", "answerText": "Wastage", "explanation_bn": "Waste-অপচয় করা (verb); Wastage-অপচয় (Noun); Wasteful-অপব্যয়ী, অপচয়ী (Adjective); Wasting-অপচয়, অপচয়ী (Gerund/participle)।"}, {"id": "EL-0177", "page": 22, "chapter": "Chapter 01: Parts of Speech", "topic": "1.13 Interchange of Parts of Speech", "qno": "10", "question": "What is the adjective of the word 'Heart'?", "source_tag": "১২তম বিসিএস", "options": {"ক": "Heart", "খ": "Hearten", "গ": "Heartening", "ঘ": "Heartful"}, "answerKey": "গ", "answerText": "Heartening", "explanation_bn": "Heart শব্দটি Noun এবং এর verb রূপ হচ্ছে Hearten ও Adjective রূপ হচ্ছে Heartening।"}, {"id": "EL-0178", "page": 22, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "01", "question": "Identify the sentence where 'up' functions as a noun-", "source_tag": "৫০তম বিসিএস", "options": {"ক": "He turned the volume up", "খ": "Business confidence is on the up", "গ": "We live just up the road", "ঘ": "Our system should be up by afternoon"}, "answerKey": "খ", "answerText": "Business confidence is on the up", "explanation_bn": "option (খ) তে Prepositional phrase- 'on the up' এ Noun Phrase- 'the up' এর up হলো Noun। অন্য option-গুলো: (ক) তে up (turn…..up), verb turn কে modify করছে, তাই এটি adverb, option (গ) তে up-preposition, যা noun phrase (the road) এর পূর্বে বসে একে verb এর সাথে যুক্ত করেছে এবং option (ঘ) তে up একটি predicate adjective হিসেবে subject (Our system) কে modify করছে।"}, {"id": "EL-0179", "page": 22, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "02", "question": "'We work every day except Friday'. In this sentence 'except' is a/an-", "source_tag": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "adjective", "খ": "noun", "গ": "preposition", "ঘ": "pronoun"}, "answerKey": "গ", "answerText": "preposition", "explanation_bn": "Except শব্দটি noun (Friday) এর পূর্বে বসে, noun এর সাথে বাক্যের অন্য word এর সম্পর্ক স্থাপন করে তাই except এখানে preposition হিসেবে ব্যবহৃত হয়েছে।"}, {"id": "EL-0180", "page": 22, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "03", "question": "Select the sentence in which 'better' is an adverb.", "source_tag": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "We're helping for better weather tomorrow", "খ": "Sound travels better in water than in air", "গ": "It's hard to decide which one is better", "ঘ": "He joined the gym to better his health."}, "answerKey": "খ", "answerText": "Sound travels better in water than in air", "explanation_bn": "'Better' শব্দটি একটি বাক্যে Adjective, Adverb, Noun বা Verb হিসেবে ব্যবহৃত হতে পারে। (ক) We're helping for better weather tomorrow. এখানে better = adjective (noun weather কে বর্ণনা করছে)। (খ) Sound travels better in water than in air. 'Better' এখানে 'travels' ক্রিয়াটি কিভাবে ঘটে (আরও ভালোভাবে/গতিতে) তা বোঝাচ্ছে। এখানে better = adverb। (গ) It's hard to decide which one is better. 'better' এখানে 'which one' (কোনটি) কেমন তা বোঝাচ্ছে। এটি Adjective। (ঘ) He joined the gym to better his health. 'to' এর পর মূল verb হিসেবে better ব্যবহৃত হয়েছে।"}, {"id": "EL-0181", "page": 23, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "04", "question": "After lunch we went for a leisurely stroll. Here 'leisurely' is a /an-", "source_tag": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "adverb", "খ": "adjective", "গ": "noun", "ঘ": "conjunction"}, "answerKey": "খ", "answerText": "adjective", "explanation_bn": "এই বাক্যে, leisurely শব্দটি noun (stroll) শব্দটিকে বর্ণনা করছে। যেহেতু leisurely শব্দটি stroll (পদচারণা) কেমন ছিল তা বোঝাচ্ছে তাই এটি একটি adjective। এছাড়াও determiner (a) ও noun (stroll) এর মাঝে একটি শব্দ থাকলে সেটি adjective।"}, {"id": "EL-0182", "page": 23, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "05", "question": "She works hard. What part of speech is the underlined word?", "source_tag": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "Adjective", "খ": "Adverb", "গ": "Verb", "ঘ": "Noun"}, "answerKey": "খ", "answerText": "Adverb", "explanation_bn": "Hard এখানে 'works' (verb) শব্দটির বর্ণনা দিচ্ছে 'কীভাবে কাজ করে?'। যখন কোনো শব্দ verb, adjective, adverb বা Sentence কে বর্ণনা করে, তখন সেটি adverb। তাই Hard (কঠোরভাবে/কঠিনভাবে) এখানে adverb।"}, {"id": "EL-0183", "page": 23, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "06", "question": "'The river flows past the village.' Here 'past' is a/an-", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "noun", "খ": "verb", "গ": "adverb", "ঘ": "preposition"}, "answerKey": "ঘ", "answerText": "preposition", "explanation_bn": "এখানে 'past' শব্দটি 'the village' এর সঙ্গে সম্পর্ক স্থাপন করেছে। অর্থাৎ, নদী কোন জায়গার পাশে বা পার হয়ে যাচ্ছে তা দেখাচ্ছে। যখন কোন noun বা pronoun-এর সাথে অবস্থান বা দিক নির্দেশ করা হয়, তখন 'past' preposition হিসেবে ব্যবহৃত হয়।"}, {"id": "EL-0184", "page": 23, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "07", "question": "Go and catch the falling star. Here the \"falling\" is-", "source_tag": "৪২তম বিসিএস", "options": {"ক": "an averb", "খ": "a preposition", "গ": "an adjective", "ঘ": "a verb"}, "answerKey": "গ", "answerText": "an adjective", "explanation_bn": "Falling শব্দটি noun 'star' এর পূর্বে বসে noun কে modify করায় এটি Adjective।"}, {"id": "EL-0185", "page": 23, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "08b", "question": "The warning of the authority falls on deaf ears. Here warning does the function of-", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "adverb", "খ": "adjective", "গ": "verb", "ঘ": "noun"}, "answerKey": "ঘ", "answerText": "noun", "explanation_bn": "The + (verb + ing) + of দ্বারা verbal noun গঠিত হয়। সুতরাং প্রদত্ত বাক্যের warning শব্দটি noun। তাছাড়া Participle/Gerund + Noun ব্যবহৃত হয়। Position of parts of speech অনুযায়ী Participle/ Gerund এর"}, {"id": "EL-0186", "page": 23, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "09", "question": "I am in the process of collecting material for my story. The underlined word (material) is a/an-", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "Verb", "খ": "Adjective", "গ": "Adverb", "ঘ": "Noun"}, "answerKey": "ঘ", "answerText": "Noun", "explanation_bn": "এবং Preposition এর মাঝের Word-টি Noun হয়। এখানে collecting material এরপর for আছে তাই material শব্দটি Noun। আবার 'material' শব্দটি collecting verb (Gerund) এর object হিসেবে ব্যবহৃত হওয়ায় এটি নিয়মগত দিক থেকেও noun।"}, {"id": "EL-0187", "page": 23, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "10", "question": "'He was a rather disagreeable man.' Here the underlined word (disagreeable) is a/an-", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "Noun", "খ": "Adverb", "গ": "Adjective", "ঘ": "Preposition"}, "answerKey": "গ", "answerText": "Adjective", "explanation_bn": "'Disagreeable' শব্দটি adjective, যার অর্থ- বিবদমান, বিরোধী।"}, {"id": "EL-0188", "page": 23, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "11", "question": "Honey is ___ sweet.", "source_tag": "২৯তম বিসিএস", "options": {"ক": "very", "খ": "too much", "গ": "much too", "ঘ": "excessive"}, "answerKey": "ক", "answerText": "very", "explanation_bn": "বাক্যে very ও too much উভয়টির প্রয়োগ পরিলক্ষিত হয়। মধু খুব (Very) মিষ্টি হয়, তবে অতিরিক্ত (too much) মিষ্টি হয় না। ভাষার শব্দ চয়নের যথার্থতা ও এক শব্দের সাথে অন্য শব্দের মানানসই ব্যবস্থা অনুযায়ী very এর ব্যবহার-ই সঠিক। much too এবং excessive হল adjective যার অর্থ অত্যাধিক যা sentence এর context এর সাথে সামঞ্জস্য নয়।"}, {"id": "EL-0189", "page": 23, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "12", "question": "He had a ___ headache.", "source_tag": "২৯তম বিসিএস", "options": {"ক": "strong", "খ": "acute", "গ": "serious", "ঘ": "bad"}, "answerKey": "ঘ", "answerText": "bad", "explanation_bn": "তীব্র মাথাব্যথা অর্থে bad headache ব্যবহৃত হয়।"}, {"id": "EL-0190", "page": 23, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "13", "question": "Fill in the gap with the suitable word. To stay healthy, we must plan to have a balanced ___.", "source_tag": "২৭তম, ২২তম বিসিএস", "options": {"ক": "diet", "খ": "food", "গ": "drink", "ঘ": "environment"}, "answerKey": "ক", "answerText": "diet", "explanation_bn": "উপরিউক্ত Sentence -এ 'balanced' adjective টির সাথে diet হওয়াই স্বাভাবিক; কারণ স্বাস্থ্য ঠিক রাখার জন্য শুধু খাদ্য (food), পানীয় (drink), বা পরিবেশ (environment) নয়, প্রয়োজন সুষম খাদ্যাভ্যাস বা balanced diet।"}, {"id": "EL-0191", "page": 23, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "14", "question": "The parents became extremely ___ when their son had not returned by eleven o'clock.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "angry", "খ": "annoyed", "গ": "disturbed", "ঘ": "anxious"}, "answerKey": "ঘ", "answerText": "anxious", "explanation_bn": "এখানে, angry-রাগান্বিত। annoy-বিরক্ত করা। disturb-বিরক্ত করা। anxious-উদ্বিগ্ন। Sentence-এ সন্তান বাসায় না ফেরায় পিতা মাতার উদ্বেগ প্রকাশ পেয়েছে তাই শূন্যস্থানে anxious বসবে। sentence টির অর্থ পিতামাতা অত্যন্ত উদ্বিগ্ন হয়েছিল যখন তাদের সন্তান রাত ১১ টার মধ্যেও ফেরেনি।"}, {"id": "EL-0192", "page": 24, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "15", "question": "He knew it was a very ___ operation but he was determined to carry it out.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "difficult", "খ": "dangerous", "গ": "risky", "ঘ": "troublesome"}, "answerKey": "গ", "answerText": "risky", "explanation_bn": "He knew it was a very risky operation but he was determined to carry it out. বাক্যটির অর্থ সে জানতো যে অপারেশনটি খুবই ঝুঁকিপূর্ণ কিন্তু সে এটাকে চালিয়ে যেতে সংকল্পবদ্ধ ছিল। এখানে ভাষার শব্দ চয়নের যথার্থতা ও এক শব্দের সাথে অন্য শব্দের মানানসই ব্যবস্থা অনুযায়ী Operation-এর আগে risky শব্দটি অধিক যুক্তিযুক্ত এবং অর্থপূর্ণ। Troublesome (কষ্টকর), Difficult (কঠিন), ও Dangerous (বিপজ্জনক)-শব্দ তিনটি Operation এর সাথে ব্যবহার করা যায়। তবে অপশনগুলোর মধ্যে risky শব্দটির ব্যবহার অধিক যুক্তিযুক্ত।"}, {"id": "EL-0193", "page": 24, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "16", "question": "I have read the book ___ you lent me.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "that", "খ": "whom", "গ": "whose", "ঘ": "what"}, "answerKey": "ক", "answerText": "that", "explanation_bn": "এখানে Relative Pronoun বসবে যা the book এর পরিবর্তে ব্যবহৃত হবে। that বস্তুর ক্ষেত্রে ব্যবহৃত হয়। প্রশ্নে I have read ___ you lent me. থাকলে শূন্যস্থানে what ব্যবহৃত হতো। অর্থাৎ verb-এর পরে object না থেকে যদি পরবর্তী clause-এর Subject চলে আসে এক্ষেত্রে Pronoun হিসেবে what ব্যবহৃত হয়। আর যদি verb-এর পর object থাকে এবং তারপর পরবর্তী Clause আসে এক্ষেত্রে conjunction হিসেবে That বসে। যেমন: I have read the book ___ you lent me. এখানে 'read' verb এর পরে 'the book' object থাকায় that ব্যবহৃত হবে। সম্পর্ক বুঝাতে noun এর পূর্বে whose ব্যবহৃত হয়। যাকে বা যাদেরকে বুঝাতে ব্যক্তির ক্ষেত্রে whom বসে।"}, {"id": "EL-0194", "page": 24, "chapter": "Chapter 01: Parts of Speech", "topic": "1.14 Position of Parts of Speech", "qno": "17", "question": "We need two hundred dollars ___ this to pay for everything.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "as well", "খ": "also", "গ": "beside", "ঘ": "besides"}, "answerKey": "ঘ", "answerText": "besides", "explanation_bn": "বাক্যটির অর্থ এমন হবে যে, সবকিছুর মূল্য পরিশোধ করতে আমাদের এ ছাড়াও বা এর পাশাপাশি দুইশত ডলার দরকার। পাশাপাশি অর্থে preposition 'besides' ব্যবহৃত হয়, যা অপশন (ঘ)-তে রয়েছে।"}, {"id": "EL-0195", "page": 24, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "01", "question": "'It is no good falling in love at first sight'. Here the word \"falling\" is a/an-", "source_tag": "৫০তম বিসিএস", "options": {"ক": "participle", "খ": "infinitive", "গ": "gerund", "ঘ": "verbal noun"}, "answerKey": "গ", "answerText": "gerund", "explanation_bn": "\"It is no good falling …\" এখানে falling একটি কাজ/ধারণা হিসেবে noun-এর ভূমিকা পালন করেছে (gerund = verb + ing, used as noun)। অন্য option-গুলো: (ক) participle- participle হলে কোনো noun কে modify করত (যেমন- falling leaves)। তবে participle কাজ করে adjective এর মতো। (খ) infinitive-infinitive হলে 'to + fall' form এ থাকতো। (ঘ) verbal noun-strictly Noun এর মতো কাজ করে, এখানে তেমনটা নয়।"}, {"id": "EL-0196", "page": 24, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "02", "question": "'They talked about going on a vacation'. Here 'going' is a/an-", "source_tag": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "participle", "খ": "infinitive", "গ": "verbal noun", "ঘ": "gerund"}, "answerKey": "ঘ", "answerText": "gerund", "explanation_bn": "Preposition এর object হিসেবে verb + ing বসলে তা gerund হয়। বাক্যটিতে Preposition (about) এর object হিসেবে going বসেছে। তাই 'going' হচ্ছে gerund কিন্তু in, out, inside, outside, about/around এরা adverb হিসেবে কাজ করলে এদের পরের verb + ing টি present participle হবে।"}, {"id": "EL-0197", "page": 24, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "03", "question": "___ others is a great deed.", "source_tag": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "To help", "খ": "Help", "গ": "To helping", "ঘ": "To have helped"}, "answerKey": "ক", "answerText": "To help", "explanation_bn": "এখানে 'Helping others is a great deed' বা 'To help others is a great deed' দুইভাবেই বলা যায়। যখন কোনো বাক্য 'subject' হিসেবে verb ব্যবহার করা হয়, তখন সেই verb এর infinitive form ('to + verb') অথবা gerund ('verb + ing') ব্যবহার করা যায়। To help যোগে বাক্যটির অর্থ: অন্যদের সাহায্য করা একটি মহৎ কাজ।"}, {"id": "EL-0198", "page": 24, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "08", "flag": "⚠ Source numbering jumps 03→08 on this page, preserved as printed.", "question": "'We met Medha carrying a bouquet of red roses.' Here 'carrying' is a/an ___.", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "gerund", "খ": "infinitive", "গ": "verbal noun", "ঘ": "participle"}, "answerKey": "ঘ", "answerText": "participle", "explanation_bn": "'We met Medha carrying a bouquet of red roses' বাক্যটিতে 'Carrying' শব্দটি Present participle হিসেবে ব্যবহৃত হয়েছে। 'Carrying' শব্দটি noun (Medha) এর ঐ মুহূর্তের অবস্থা বর্ণনা করে অর্থাৎ Adjective এর কাজ করে।"}, {"id": "EL-0199", "page": 25, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "05", "question": "'He started teaching Hamlet.' Here 'teaching' is a/an-", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "participle", "খ": "infinitive", "গ": "verbal noun", "ঘ": "gerund"}, "answerKey": "ঘ", "answerText": "gerund", "explanation_bn": "Verb এর object হিসেবে gerund বসে। এটি 'started' ক্রিয়ার direct object হিসেবে ব্যবহৃত হয়েছে। এখানে 'teaching' হলো সেই কাজ যা subject (He) শুরু করেছে। সুতরাং, বাক্যে 'teaching' একটি gerund।"}, {"id": "EL-0200", "page": 25, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "06", "question": "'He contemplated marrying his cousin.' Here 'marrying' is a/an-", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "present participle", "খ": "gerund", "গ": "verb", "ঘ": "infinitive"}, "answerKey": "খ", "answerText": "gerund", "explanation_bn": "Gerund ও Present Participle-এর ধারণাগত স্পষ্টতা: তাই প্রদত্ত বাক্যে verb 'contemplate' এর object হিসেবে ব্যবহৃত শব্দ 'marrying' gerund হবে।", "explanation_table": [["Gerund", "Pre. Participle"], ["Gerund মূলত Noun. Sentence এ যেসব অবস্থানে থাকে Gerund সেসব অবস্থান গ্রহণ করতে পারে। He contemplated marrying his cousin.", "Present Participle মূলত adjective অর্থাৎ, adjective যেসব অবস্থানে থাকবে Present Participle সেসব জায়গায় অবস্থান করবে। Look at the flying bird."], ["Transitive verb-এর পরে verb + ing আসলে তা Gerund হবে। যেমন: We completed travelling by yesterday morning.", "Intransitive verb এর পরে verb + ing আসলে তা Present Participle হবে। যেমন: He went home driving."], ["'Determiner + Verb + ing + Noun' এক্ষেত্রে Noun টি যদি Action receiver হয় তাহলে Gerund হবে। যেমন: A riding school.", "'Determiner + Verb + ing + Noun' এর ক্ষেত্রে Noun টি যদি Action doer হয় তাহলে Present participle হবে। A riding man."], ["Possessive form বা Preposition এর পর verb + ing বসলে তা Gerund হবে। We appreciate his teaching.", "Object এর পরে v + ing বসলে তা Pre. Participle হবে। যেমন: Over the last decade, we found Bangladesh developing."], ["Complement হিসেবে Verb + ing দ্বারা কাজের নাম বুঝালে Gerund হবে। His profession is playing.", "Complement হিসেবে Verb + ing দ্বারা দোষ, গুণ, অবস্থা ইত্যাদি বুঝালে Present participle হবে। Education is enlightening."]]}, {"id": "EL-0201", "page": 25, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "07", "question": "The word \"flying\" in the sentence \"Look at the flying bird\" is a:", "source_tag": "৪২তম বিসিএস", "options": {"ক": "gerund", "খ": "participle", "গ": "verbal noun", "ঘ": "gerundial infinitive"}, "answerKey": "খ", "answerText": "participle", "explanation_bn": "কোনো Sentence-এ verb- এর যে form একই সঙ্গে verb এবং adjective -এর কাজ করে, তাকে Participle বলে। Participle তিন প্রকার। যথা: Present Participle (Verb এর base form এর সাথে ing), Past Participle (Verb এর Past Participle) এবং Perfect Participle (Having + Verb এর Past Participle)। এখানে flying শব্দটি noun 'bird' কে modify করেছে, তাই এটি present participle।"}, {"id": "EL-0202", "page": 25, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "08", "question": "'The old man was tired of walking.' Here 'walking' is a/an-", "source_tag": "৪১তম বিসিএস", "options": {"ক": "present participle", "খ": "adjective", "গ": "common noun", "ঘ": "gerund"}, "answerKey": "ঘ", "answerText": "gerund", "explanation_bn": ""}, {"id": "EL-0203", "page": 25, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "09", "question": "'A lost opportunity never returns.' Here 'lost' is a-", "source_tag": "৪০তম বিসিএস", "options": {"ক": "gerund", "খ": "verbal noun", "গ": "gerundial infinitive", "ঘ": "participle"}, "answerKey": "ঘ", "answerText": "participle", "explanation_bn": "Verb-এর Past participle form (retire + d) যদি বাক্যে adjective-এর কাজ সম্পন্ন করে তাকে Past participle বলে। প্রদত্ত বাক্যে lost (lose-এর past participle) একই সাথে verb এবং adjective-এর কাজ সম্পন্ন করায় lost শব্দটি past participle অর্থাৎ participle হিসেবে কাজ করেছে।"}, {"id": "EL-0204", "page": 25, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "10", "question": "A retired officer lives next door. Here, the underlined word (retired) is used as a/an:", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "gerund", "খ": "adverb", "গ": "preposition", "ঘ": "participle"}, "answerKey": "ঘ", "answerText": "participle", "explanation_bn": ""}, {"id": "EL-0205", "page": 25, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "11", "question": "Reading is an excellent habit. Here, the underlined word (Reading) is a-", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "Verbal noun", "খ": "Participle", "গ": "Verb", "ঘ": "Gerund"}, "answerKey": "ঘ", "answerText": "Gerund", "explanation_bn": ""}, {"id": "EL-0206", "page": 25, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "12", "question": "Education is enlightening. Here 'enlightening' is-", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "A gerund", "খ": "A participle", "গ": "An infinitive", "ঘ": "A finite verb"}, "answerKey": "খ", "answerText": "A participle", "explanation_bn": ""}, {"id": "EL-0207", "page": 25, "chapter": "Chapter 01: Parts of Speech", "topic": "1.15 Gerund & Participle", "qno": "13", "question": "A rolling stone gathers no moss. What 'rolling' is?", "source_tag": "১১তম বিসিএস", "options": {"ক": "Gerund", "খ": "Verbal noun", "গ": "Participle", "ঘ": "Adjective"}, "answerKey": "গ", "answerText": "Participle", "explanation_bn": ""}, {"id": "EL-0208", "page": 26, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.1 Types of Phrases", "qno": "01", "question": "Writing a diary is a very good practice to develop the writing skill. The underlined word (Writing a diary) is a/an-", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "noun phrase", "খ": "verbal phrase", "গ": "adjective phrase", "ঘ": "adverbial phrase"}, "answerKey": "ক", "answerText": "noun phrase", "explanation_bn": "Noun phrase-কে কোনো relevant noun বা it দ্বারা প্রতিস্থাপিত করা যায়। Noun phrase sentence-এর Subject, Object, Adjective বা Preposition-এর object, Appositive এবং Transitive verb-এর object হিসেবে ব্যবহৃত হয়। এখানে Writing a diary বাক্যটিতে Subject হিসেবে ব্যবহৃত হয়ে noun এর কাজ করছে। সুতরাং এটি noun phrase।"}, {"id": "EL-0209", "page": 26, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.1 Types of Phrases", "qno": "02", "question": "He is a man to depend on. The underlined part (to depend on) is-", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "a noun phrase", "খ": "an adjective phrase", "গ": "an adverbial phrase", "ঘ": "a prepositional phrase"}, "answerKey": "খ", "answerText": "an adjective phrase", "explanation_bn": "Phrase এর শুরুতে preposition এবং শেষে noun থাকলে এর অবস্থান ও কাজ অনুযায়ী phrase এর ধরন নির্ণীত হবে। যেমন: To win a prize is my ambition. (noun phrase); The boy was in the room. (Adverbial phrase); He is a man to depend on. (Adj. phrase); Besides making a promise, he kept it. (Prep. Phrase)"}, {"id": "EL-0210", "page": 26, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.1 Types of Phrases", "qno": "03", "question": "'To win a prize is my ambition.' The underlined part of the sentence (To win a prize) is a/an-", "source_tag": "৪১তম বিসিএস", "options": {"ক": "adjective phrase", "খ": "noun phrase", "গ": "adverb phrase", "ঘ": "conjunctional phrase"}, "answerKey": "খ", "answerText": "noun phrase", "explanation_bn": "Infinitive যদি এক বা একাধিক Word-এর সাথে যুক্ত হয় এবং যার Head word noun থাকে তাকে Infinitive Phrase বলে। Infinitive Phrase টি সাধারণত noun এর মতো কাজ করে। আবার, এটি noun, adjective ও adverb- কে modify করতে পারে বা post- modifier হিসেবে কাজ করতে পারে। যেমন: To study book is a good habit. (noun phrase); Mubin hopes to achieve scholarship. (noun phrase); I have taken a firm determination to become an honest man. (noun এর post-modifier); I am glad to know your success. (adj. এর post-modifier); I am reading deeply to get the inner meaning. (adverb এর post modifier)"}, {"id": "EL-0211", "page": 26, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.1 Types of Phrases", "qno": "08", "flag": "⚠ Source numbering jumps 03→08 on this page, preserved as printed.", "question": "'He ran with great speed.' The underlined part of the sentence (with great speed) is a-", "source_tag": "৪০তম বিসিএস", "options": {"ক": "noun phrase", "খ": "adverb phrase", "গ": "adjective phrase", "ঘ": "participle phrase"}, "answerKey": "খ", "answerText": "adverb phrase", "explanation_bn": "Adverbial phrase-ও adverb-এর মতো verb, adjective বা অন্য adverb-কে modify করে। সাধারণত Verb কে কখন, কোথায়, কীভাবে ও কেন দ্বারা প্রশ্ন করে যে Phrase পাওয়া যায় তাকে Adverbial phrase বলে। যেমন: He worked with all sincerity. Adverbial phrases of manner- Sentence এ ব্যবহৃত হয়ে Verb-এর কাজ কীভাবে সম্পন্ন হয় তা নির্দেশ করে। যেমন: He ran with great speed. এখানে With great speed (দ্রুতগতিতে) phrase টি বাক্যের verb কীভাবে কাজ করে কা নির্দেশ করায় phrase টি adverb phrase of manner।"}, {"id": "EL-0212", "page": 26, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.1 Types of Phrases", "qno": "05", "question": "He worked with all sincerity. The underlined phrase (with all sincerity) is-", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "A noun phrase", "খ": "An adjective phrase", "গ": "An infinitive phrase", "ঘ": "An adverbial phrase"}, "answerKey": "ঘ", "answerText": "An adverbial phrase", "explanation_bn": ""}, {"id": "EL-0213", "page": 26, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.1 Types of Phrases", "qno": "06", "question": "___ his earlier study, the professor's new study indicates a general warning trend in global weather.", "source_tag": "৩১তম বিসিএস", "options": {"ক": "In contrast of", "খ": "In contrast to", "গ": "In contrast by", "ঘ": "In contrast as"}, "answerKey": "খ", "answerText": "In contrast to", "explanation_bn": "In contrast to একটি prepositional phrase. এর অর্থ বিপরীত।"}, {"id": "EL-0214", "page": 27, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.1 Types of Phrases", "qno": "07", "question": "We were waiting for the bus. The underlined part (for the bus) is-", "source_tag": "২৮তম বিসিএস", "options": {"ক": "a noun phrase", "খ": "an infinitive phrase", "গ": "a prepositional phrase", "ঘ": "a verb phrase"}, "answerKey": "গ", "answerText": "a prepositional phrase", "explanation_bn": "উক্ত Sentence-এ 'for the bus' phrase-টির অবস্থান ও কাজ অনুযায়ী এটি একটি Adverbial phrase। কিন্তু অপশন গুলোতে Adverbial phrase না থাকায় prepositional phrase হবে। কারণ এটি preposition দিয়ে শুরু হয়েছে। অপশনে Adverbial phrase এবং prepositional phrase দুটোই থাকলে উত্তর হবে Adverbial phrase।"}, {"id": "EL-0215", "page": 27, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "01", "question": "'To have a shot' means:", "source_tag": "৫০তম বিসিএস", "options": {"ক": "to open fire", "খ": "to take a photograph", "গ": "to make try", "ঘ": "to test a gun"}, "answerKey": "গ", "answerText": "to make try", "explanation_bn": "'To have a shot' একটি Idiom, যার অর্থ হলো- একবার চেষ্টা করা বা কোনো কাজে সুযোগ নেওয়া। যেমন- \"Have a shot at it.\" (এটা একবার চেষ্টা করে দেখো)। অন্য Option গুলো: (ক) open fire-গুলি করা, (খ) take a photograph- ছবি তোলা এবং (ঘ) test a gun- বন্দুক পরীক্ষা করা কোনোটিই 'have a shot' এর সঠিক idiomatic meaning নয়।"}, {"id": "EL-0216", "page": 27, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "02", "question": "The saying 'Every cloud has its silver lining' means:", "source_tag": "৫০তম বিসিএস", "options": {"ক": "bad weather is often replaced by good weather", "খ": "clouds often have shining surroundings", "গ": "every difficult situation has a more hopeful aspect though not apparent at the beginning", "ঘ": "clouds and sunshine go hand in hand"}, "answerKey": "গ", "answerText": "every difficult situation has a more hopeful aspect though not apparent at the beginning", "explanation_bn": "এটি একটি প্রবাদ, যার অর্থ হলো: খারাপ সময়ের মধ্যেও ভালো কিছুর সম্ভাবনা থাকে, যদিও শুরুতে হয়তো তা বোঝা যায় না। Saying (প্রবাদ) এর ক্ষেত্রে, literal বা আক্ষরিক অর্থ নয়, বরং Figurative meaning বা ভাবার্থ প্রকাশই মূল উদ্দেশ্য। (ক) এবং (খ) Option দুটোতে Literal interpretation করার চেষ্টা করা হয়েছে, যা গ্রহণযোগ্য নয়। (ঘ) Option টিতে Saying বা Proverb টির নিগূঢ় অর্থ- প্রতিকূলতায় আশার সঞ্চার-বিষয়টি ফুটে উঠেনি।"}, {"id": "EL-0217", "page": 27, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "03", "question": "The idiom 'icing on the cake' means-", "source_tag": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "a slice of the cake", "খ": "an attractive but unnecessary addition", "গ": "an attractive service", "ঘ": "an attractive and essential enhancement"}, "answerKey": "খ", "answerText": "an attractive but unnecessary addition", "explanation_bn": "'Icing on the cake' idiom টির অর্থ অপ্রয়োজনীয় কিন্তু আকর্ষণীয় সংযোজন। এটি সাধারণত এমন একটি ইতিবাচক বা সুন্দর বিবরণকে বোঝায় যা আগে থেকেই ভালো একটি জিনিসকে আরও নিখুঁত বা বিশেষ করে তোলে, কিন্তু এর অনুপস্থিতিতেও মূল বস্তুর গুরুত্ব কমে না। উদাহরণ: \"He got the job he wanted, and a company car was the icing on the cake.\" (সে যে চাকরিটি চেয়েছিল তা পেল, আর একটি কোম্পানির গাড়ি পাওয়াটা হলো icing on the cake।)"}, {"id": "EL-0218", "page": 27, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "08", "flag": "⚠ Source numbering jumps 03→08 on this page, preserved as printed.", "question": "Fill in the blanks with appropriate words. 'Selina knocked it ___ the park with her performance in culinary art'.", "source_tag": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "outside", "খ": "out of", "গ": "inside", "ঘ": "off"}, "answerKey": "খ", "answerText": "out of", "explanation_bn": "'Knocked it out of the park' means to do something or perform exceptionally well, far exceeding expectations. অর্থাৎ, কোনো কাজ অন্যের চেয়ে বেশি দক্ষতার সাথে করা।"}, {"id": "EL-0219", "page": 27, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "05", "question": "What does the idiom \"take someone to task\" mean?", "source_tag": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "To give someone a task to do", "খ": "To praise someone for his task", "গ": "To rebuke someone", "ঘ": "To appoint someone"}, "answerKey": "গ", "answerText": "To rebuke someone", "explanation_bn": "\"Take someone to task\" মানে হলো কাউকে তীব্র সমালোচনা বা কঠোরভাবে দোষারোপ করা, অর্থাৎ কাউকে তিরস্কার করা (To rebuke someone)।"}, {"id": "EL-0220", "page": 28, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "06", "question": "The idiom 'smell a rat' means to___.", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "detect bad smell", "খ": "be in a bad mood", "গ": "suspect something wrong", "ঘ": "see hidden meaning"}, "answerKey": "গ", "answerText": "suspect something wrong", "explanation_bn": "Smell a rat = Suspect Something wrong or deception অর্থাৎ, কোনো বিষয়ে সন্দেহ করা বা প্রতারণার গন্ধ পাওয়া।"}, {"id": "EL-0221", "page": 28, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "07", "question": "Find out the meaning of the following phrase: By and large", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "very large", "খ": "on the whole", "গ": "far away", "ঘ": "the largest one"}, "answerKey": "খ", "answerText": "on the whole", "explanation_bn": "By and large একটি phrase যা mostly (প্রধানত), on the whole (সম্পূর্ণ) অর্থ বুঝাতে ব্যবহৃত হয়। very large- খুব বড়; far away অনেক দূর এবং the largest one- সবচেয়ে বড়টি।"}, {"id": "EL-0222", "page": 28, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "08", "question": "'Let the cat out of the bag' means-", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "bring out a cat from a bag", "খ": "let a cat move at large", "গ": "reveal a secret carelessly", "ঘ": "take a pre-caucious steps"}, "answerKey": "গ", "answerText": "reveal a secret carelessly", "explanation_bn": "'Let the cat out of the bag' এটি একটি idiom যার অর্থ অসতর্কতার সাথে গোপন কিছু বলে ফেলা বা গুপ্ত বিষয় প্রকাশ করা (reveal a secret carelessly)। Bring out a cat from a bag অর্থ-ব্যাগ থেকে ইঁদুর বের করা; let a cat move at large অর্থ- বিড়ালকে মুক্তভাবে চলাচল করতে দাও এবং take a pre-caucious steps অর্থ- পূর্বে সতর্কতামূলক ব্যবস্থা নেওয়া।"}, {"id": "EL-0223", "page": 28, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "09", "question": "The phrase \"Achilles' heel\" means-", "source_tag": "৪৫তম, ৩৭তম বিসিএস", "options": {"ক": "a strong point", "খ": "a strong solution", "গ": "a weak point", "ঘ": "a permanent solution"}, "answerKey": "গ", "answerText": "a weak point", "explanation_bn": "Achilles heel একটি idioms যা দ্বারা কারো দুর্বল জায়গাকে নির্দেশ করে। গ্রিক মিথোলজির অন্যতম প্রধান চরিত্র Achilles এর- প্রধান দুর্বলতা ছিল পায়ের গোড়ালিতে। এজন্য কারো প্রধান দুর্বলতা বুঝাতে Achilles' heel বাগ্ধারাটি ব্যবহার করা হয়।"}, {"id": "EL-0224", "page": 28, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "10", "question": "'By and large' means-", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "everywhere", "খ": "very large", "গ": "mostly", "ঘ": "far away"}, "answerKey": "গ", "answerText": "mostly", "explanation_bn": ""}, {"id": "EL-0225", "page": 28, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "11", "question": "The phrase 'dog days' means-", "source_tag": "৪৩তম, ১৪তম বিসিএস", "options": {"ক": "hot weather", "খ": "cold shower", "গ": "rain-soaked streets", "ঘ": "ice storm"}, "answerKey": "ক", "answerText": "hot weather", "explanation_bn": "'dog days' একটি idioms. 'dog days' দ্বারা বছরের ঊষ্ণতম সময়কাল (The hottest weather of the year/hot weather) বা গ্রীষ্মের গরম আবহাওয়া বা কোনো কিছুর নিষ্ক্রিয়তা বা পতনের সময়কালকে বুঝায়। cold shower (ঠাণ্ডা ঝরনা); rain-soaked streets, (বৃষ্টিস্নাত রাস্তা) এবং ice storm (তুষার ঝড়)।"}, {"id": "EL-0226", "page": 28, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "12", "question": "Fill in the gap: Birds fly ___ in the sky.", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "random", "খ": "at large", "গ": "at a stitch", "ঘ": "are long"}, "answerKey": "খ", "answerText": "at large", "explanation_bn": "মুক্তভাবে আকাশে উড়া বোঝানোয় at large (স্বাধীন বা মুক্তভাবে) ব্যবহৃত হবে। random অর্থ এলোমেলো বা অগোছালো এবং at a stretch অর্থ একটানা।"}, {"id": "EL-0227", "page": 28, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "13", "question": "The phrase 'sine die' means-", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "half-heartedly", "খ": "doubtfully", "গ": "fixed", "ঘ": "uncertain"}, "answerKey": "ঘ", "answerText": "uncertain", "explanation_bn": "The phrase 'sine die' means- indefinite/uncertain (অনিশ্চিত); half-heartedly অর্থ- ভগ্নহৃদয়ে এবং doubtfully- সন্দেহজনকভাবে।"}, {"id": "EL-0228", "page": 28, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "14", "question": "To doctor an animal means:", "source_tag": "৪২তম বিসিএস", "options": {"ক": "to treat it", "খ": "to sterilize it", "গ": "to poison it", "ঘ": "to cure it"}, "answerKey": "খ", "answerText": "to sterilize it", "explanation_bn": "পশুকে প্রজননে অক্ষম করা বা বন্ধ্যা করা (to sterilize) অর্থে 'To doctor an animal' ব্যবহৃত হয়।"}, {"id": "EL-0229", "page": 28, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "15", "question": "\"Giving someone the cold shoulder\" means-", "source_tag": "৪২তম বিসিএস", "options": {"ক": "to torture somebody", "খ": "to harm someone", "গ": "to appreciate someone", "ঘ": "to ignore somebody"}, "answerKey": "ঘ", "answerText": "to ignore somebody", "explanation_bn": "কাউকে এড়িয়ে চলা (to avoid somebody) বা কাউকে উপেক্ষা করা (to ignore somebody) অর্থে Giving someone the cold shoulder ব্যবহৃত হয়।"}, {"id": "EL-0230", "page": 29, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "16", "question": "'Give somebody a piece of your mind' means to-", "source_tag": "৪১তম বিসিএস", "options": {"ক": "tell someone that you are very angry with them.", "খ": "say exactly what you feel or think.", "গ": "return or to help somebody return to a normal situation.", "ঘ": "give somebody mental peace."}, "answerKey": "ক", "answerText": "tell someone that you are very angry with them.", "explanation_bn": "'Give somebody a piece of your mind' অর্থ কারো অন্যায়ের জন্য তার সাথে রাগান্বিত ভাবে কথা বলা বা তিরস্কার করা (to speak angrily to someone about something they have done wrong)। অপশন গুলোর মধ্যে উক্ত বাগ্ধারাটির সবচেয়ে কাছাকাছি অর্থ দেয়- tell someone that you are very angry with them।"}, {"id": "EL-0231", "page": 29, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "17", "question": "A soporific speech is likely to-", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "be incomprehensible", "খ": "appeal primarily to emotions", "গ": "put one to sleep", "ঘ": "stimulate action"}, "answerKey": "গ", "answerText": "put one to sleep", "explanation_bn": "Soporific শব্দটির আক্ষরিক অর্থ নিদ্রাকর্ষক, নিদ্রা উদ্রেককর বা ঘুমপাড়ানি। তবে, রূপক অর্থে Soporific শব্দটি Boring অর্থে ব্যবহৃত হয়। A soporific speech বলতে সে ধরনের বক্তৃতাকে বোঝায় যা দর্শক-শ্রোতার চোখে ঘুম নিয়ে আসে। এ ধরনের বক্তৃতা শুনে শ্রোতারা ক্লান্ত হয়ে পড়েন এবং চোখে ঘুম জড়িয়ে আসে। অপশন গুলোর মধ্যে 'put one to sleep' phrase-টিই A soporific speech-এর সব চেয়ে কাছাকাছি অর্থ; be incomprehensible অর্থ-দুর্বোধ্য হওয়া; appeal primarily to emotions অর্থ-প্রাথমিকভাবে আবেগকে আকর্ষণ করা এবং stimulate action কর্মকে উদ্দীপিত করা।"}, {"id": "EL-0232", "page": 29, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "18", "question": "'Once in a blue moon' means-", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "always", "খ": "very rarely", "গ": "nearly", "ঘ": "hourly"}, "answerKey": "খ", "answerText": "very rarely", "explanation_bn": "Once in a blue moon অর্থ কদাচিৎ বা প্রায় কখনো না। অর্থাৎ very rarely।"}, {"id": "EL-0233", "page": 29, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "19", "question": "Choose the meaning of the idiom- 'Take the bull by the horns'.", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "To challenge the enemy with courage", "খ": "Force the enemy to submit", "গ": "Out of one's wit", "ঘ": "Surrender before the enemy"}, "answerKey": "ক", "answerText": "To challenge the enemy with courage", "explanation_bn": "'Take the bull by the horns' idiom টির বাংলা অর্থ সাহসের সাথে এবং দৃঢ়ভাবে শত্রুর মোকাবিলা করা বা বিপদের মোকাবিলা করা (to challenge the enemy or difficulty with courage)। অথবা কোনো কাজ অত্যন্ত সাহসিকতার সাথে এবং দৃঢ়ভাবে করা (to do something difficult in a brave and determined way)। Force the enemy to submit অর্থ- শত্রুকে আত্মসমর্পণে বাধ্য করা; Out of one's wit অর্থ- হতবুদ্ধি এবং Surrender before the enemy অর্থ- শত্রুর কাছে আত্মসমর্পণ করা।"}, {"id": "EL-0234", "page": 29, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "20", "question": "The idiom 'A stitch in time saves nine'-refers to the importance of-", "source_tag": "৩৬তম, ৩৫তম বিসিএস", "options": {"ক": "saving lives", "খ": "timely action", "গ": "saving time", "ঘ": "time tailoring"}, "answerKey": "খ", "answerText": "timely action", "explanation_bn": "'A stitch in time saves nine'-একটি প্রবাদ বাক্য যার অর্থ \"সময়ের এক ফোঁড়, অসময়ের দশ ফোঁড়\"। এর দ্বারা সময়মতো কাজ করা বা timely action-কে বুঝানো হয়।"}, {"id": "EL-0235", "page": 29, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "21", "question": "'To do away with' means-", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "to repeat", "খ": "to start", "গ": "to get rid of", "ঘ": "to drive off"}, "answerKey": "গ", "answerText": "to get rid of", "explanation_bn": "To do away with অর্থ কোনো কিছুর ব্যবহার বন্ধ করা (to stop using something), ত্যাগ করা (to get rid of something), ধ্বংস করা (remove or put an end to something) অথবা কাউকে হত্যা করা (kill someone)। Option গুলোর মধ্যে to repeat– পুনরাবৃতি করা; to start- শুরু করা; to get rid of- মুক্ত করা বা হওয়া, ত্যাগ করা, ধ্বংস করা এবং to drive off- তাড়িয়ে দেওয়া, শুরু করা (গল্ফ খেলা)। সুতরাং to do away with-এর meaning হচ্ছে to get rid of।"}, {"id": "EL-0236", "page": 29, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "22", "question": "The phrase 'nouveau riche' means-", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "Riche rich", "খ": "Well off", "গ": "New high class", "ঘ": "New rich"}, "answerKey": "ঘ", "answerText": "New rich", "explanation_bn": "'Nouveau riche' একটি French phrase যার অর্থ নব্য ধনী অর্থাৎ new rich।"}, {"id": "EL-0237", "page": 29, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "23", "question": "Maiden speech means-", "source_tag": "৩৪তম বিসিএস", "options": {"ক": "First speech", "খ": "Middle speech", "গ": "Maid servant's speech", "ঘ": "Final speech"}, "answerKey": "ক", "answerText": "First speech", "explanation_bn": "Maiden Speech হলো একটি phrase, যার অর্থ প্রথম বক্তৃতা বা সূচনা বক্তব্য।"}, {"id": "EL-0238", "page": 30, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "24", "question": "The expression 'take into account' means-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "count numbers", "খ": "consider", "গ": "think seriously", "ঘ": "asses"}, "answerKey": "খ", "answerText": "consider", "explanation_bn": "প্রদত্ত phrase 'Take into account' এর অর্থ হলো বিবেচনা করা।"}, {"id": "EL-0239", "page": 30, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "25", "question": "Choose the best translation of 'কর্তৃপক্ষ তাকে তিরস্কার করলো' from the alternatives below-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "The authorities criticized him.", "খ": "The authorities took him to book.", "গ": "The authorities gave reins to him.", "ঘ": "The authorities took him to task."}, "answerKey": "খ", "answerText": "The authorities took him to book.", "explanation_bn": "Bring to someone book/take someone to book ও take someone to task মূলত সমার্থক যার অর্থ-তিরস্কার করা। তবে কাউকে সাধারণ তিরস্কারের ক্ষেত্রে take someone to task ব্যবহৃত হয়। কিন্তু official বা তীব্র কোনো তিরস্কারের ক্ষেত্রে take someone to book/bring someone to book ব্যবহৃত হয়। এখানে কর্তৃপক্ষের তিরস্কার সাধারণত অফিসিয়াল তিরস্কারের সমার্থক। তাই, 'কর্তৃপক্ষ তাকে তিরস্কার করল' বাক্যটির সঠিক অনুবাদ হলো (খ) The authorities took him to book. আবার, Give rein to অর্থ কাউকে বা কোনো কিছুকে পূর্ণ স্বাধীনতা দেওয়া বা কাউকে কোনো কিছু ভোগের পূর্ণ স্বাধীনতা দেওয়া (to allow complete freedom to someone/something or, to completely indulge something)।"}, {"id": "EL-0240", "page": 30, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "26", "question": "The idiom \"put up with\" means-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "stay together", "খ": "tolerate", "গ": "keep trust", "ঘ": "protect"}, "answerKey": "খ", "answerText": "tolerate", "explanation_bn": "'Put up with' phrase টি দ্বারা সহ্য করা বুঝায়। এর সমার্থক condone, ignore, overlook, bear, tolerate, endure, accept, allow, permit ইত্যাদি। উল্লেখ্য- Take something lying down (প্রতিবাদ ছাড়াই কোনো তিরস্কার সহ্য করা) phrase-টিও 'Put up with' এর সমার্থক। stay together অর্থ- একসাথে থাকা; protect keep trust অর্থ- সংরক্ষণ করা এবং keep trust অর্থ- বিশ্বাস রাখা।"}, {"id": "EL-0241", "page": 30, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "27", "question": "'Call to mind' means-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "fantasize", "খ": "attend", "গ": "remember", "ঘ": "request"}, "answerKey": "গ", "answerText": "remember", "explanation_bn": "Call to mind একটি phrase যার অর্থ হলো remember বা স্মরণ করা, স্মরণ রাখা; fantasize- বিস্মৃত করা; attend- গমন করা।"}, {"id": "EL-0242", "page": 30, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "28", "question": "'Pass away' means-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "disappear", "খ": "die", "গ": "erase", "ঘ": "fall"}, "answerKey": "খ", "answerText": "die", "explanation_bn": "'Pass away' phrase-টির অর্থ মারা যাওয়া (Die), অদৃশ্য হওয়া; disappear-অদৃশ্য হওয়া; fall-পতিত হওয়া এবং erase-মুছে ফেলা।"}, {"id": "EL-0243", "page": 30, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "29", "question": "Put appropriate preposition for the sentence below: Some writers sink ___ oblivion in course of time.", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "on", "খ": "from", "গ": "under", "ঘ": "into"}, "answerKey": "ঘ", "answerText": "into", "explanation_bn": "Sink into oblivion একটি phrase, যার অর্থ চিরন্তন বিলীন হয়ে যাওয়া। লেখক যেহেতু বিস্মৃতিতে বা চিন্তার জগতে বিলীন হয়ে যায় তাই শূন্যস্থানে into হবে।"}, {"id": "EL-0244", "page": 30, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "30", "question": "Despite being a brilliant scientist, he does not seem to get his ideas across.", "source_tag": "৩২তম বিসিএস", "options": {"ক": "make his ideas understood", "খ": "get his ideas down pat", "গ": "summarise his ideas", "ঘ": "put together his ideas"}, "answerKey": "ক", "answerText": "make his ideas understood", "explanation_bn": "Get something across to somebody অর্থ-কাউকে কিছু বোঝাতে পারা (make something understood/successfully communicate/manage to make someone understand or believe something)। have/know /get someone's ideas down pat অর্থ কোনো জিনিস এত ভালোভাবে জানা যে তা কোনো রকম চিন্তা বা চেষ্টা ছাড়াই উপস্থিতভাবে বলা বা করা যায় (to know something so well that you can say or do it without having to try or think)।"}, {"id": "EL-0245", "page": 30, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "31", "question": "To 'raise ones brows' indicate ___.", "source_tag": "৩২তম বিসিএস", "options": {"ক": "annoyance", "খ": "disapproval", "গ": "indifference", "ঘ": "surprise"}, "answerKey": "ঘ", "answerText": "surprise", "explanation_bn": "To 'raise one's brows' দ্বারা সন্দেহ, সংশয়, বা অসম্মতি প্রকাশের জন্য কারো চোখের ভ্র ওঠানামা করা (to lift one's eyebrows in order to show surprise) বুঝায়। To 'raise one's brows' phrase-টি দ্বারা Verb নির্দেশ করে তাই annoyance (বিরক্তি); disapproval (অসম্মতি) ও indifference (উদাসীনতা) এখানে প্রযোজ্য নয়।"}, {"id": "EL-0246", "page": 31, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "32", "question": "Only those who are not serious to their success work by ___ and starts.", "source_tag": "৩১তম বিসিএস", "options": {"ক": "long odds", "খ": "against time", "গ": "every inch", "ঘ": "fits"}, "answerKey": "ঘ", "answerText": "fits", "explanation_bn": "By fits and starts- অনিয়মিতভাবে, irregularly; at irregular intervals. এটি একটি Idiom. তাই শূন্যস্থানে fits বসবে। বাক্যটির অর্থ যারা তাদের সাফল্যের জন্য আন্তরিক নয় কেবল erKey": "ঘ", "answerText": "to reverse the natural order of things", "explanation_bn": "Put the cart before the horse-কোনো জিনিসের স্বাভাবিক ক্রমকে পাল্টে দেয়া বা বাধাগ্রস্ত করা (reverse the natural order of things)।"}, {"id": "EL-0251", "page": 31, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "37", "question": "To read between the lines-", "source_tag": "৩০তম, ১৭তম বিসিএস", "options": {"ক": "to concentrate", "খ": "to suspect", "গ": "to read carefully", "ঘ": "to grasp the hidden meaning"}, "answerKey": "ঘ", "answerText": "to grasp the hidden meaning", "explanation_bn": "To read between the lines- অর্থ কারো লেখা বা বক্তব্য থেকে গোপন অর্থ বা প্রকৃত অর্থ বের করে আনা। অপশন গুলোর মধ্যে to grasp the hidden meaning প্রদত্ত phrase-টির সমার্থক। এছাড়াও catch the drift or get the drift অর্থ কোনো কিছুর মূল বক্তব্য বা সাধারণ অর্থ উপলব্ধি করা (understand the main idea or general meaning)।"}, {"id": "EL-0252", "page": 31, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "38", "question": "The horror movie scared them out of their-", "source_tag": "৩০তম বিসিএস", "options": {"ক": "wits", "খ": "seats", "গ": "lives", "ঘ": "funds"}, "answerKey": "ক", "answerText": "wits", "explanation_bn": "Out of one's wits একটি idiom, যার অর্থ অত্যন্ত বিচলিত বা হতবুদ্ধি।"}, {"id": "EL-0253", "page": 31, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "39", "question": "The bad news struck him like a bolt from the-", "source_tag": "২৯তম বিসিএস", "options": {"ক": "sky", "খ": "heavens", "গ": "firmament", "ঘ": "blue"}, "answerKey": "ঘ", "answerText": "blue", "explanation_bn": "'Bolt from the blue' একটা idiom, যার অর্থ বিনা মেঘে বজ্রপাত। এটি negative অর্থে a complete surprise/sudden unexpected/unprecedented problem নির্দেশ করে। আবার, something important and unusual that happen suddenly in good times or bad times অর্থেও ব্যবহৃত হয়। প্রদত্ত Sentence-এর অর্থ হচ্ছে দুঃসংবাদটি তাকে বিনা মেঘে বজ্রপাতের মতোই আঘাত (Struck) করলো।"}, {"id": "EL-0254", "page": 31, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "40", "question": "'To get along with' means-", "source_tag": "২৮তম বিসিএস", "options": {"ক": "to adjust", "খ": "to accompany", "গ": "to interest", "ঘ": "to walk"}, "answerKey": "ক", "answerText": "to adjust", "explanation_bn": "Get along with একটি Phrasal verb, যার অর্থ-কারো সাথে ভালো সম্পর্ক থাকা (to have good relationship with someone) অথবা সফলভাবে কোনো অবস্থার মোকাবিলা করা (to deal with or handle a situation successfully) যেমন-How are you getting along with the training course? To adjust অর্থ কোনো কিছুর সাথে নিজেকে খাপ খাওয়ানো। Good relationship না থাকলে তার সাথে নিজেকে খাপ খাওয়ানো যায় না। এই অর্থে Get along with ও To adjust সমার্থক। To accompany অর্থ কারো সঙ্গী/সহগামী হওয়া। To interest বলতে কোনো কিছুতে আগ্রহ, অনুরাগ, আকর্ষণ, আসক্তি, স্পৃহা ইত্যাদি বুঝায়। To walk অর্থ হাঁটা, চলাফেরা করা ইত্যাদি।"}, {"id": "EL-0255", "page": 32, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "41", "question": "Explain the meaning of 'Bring to pass'.", "source_tag": "২৭তম বিসিএস", "options": {"ক": "Cause to destroy", "খ": "Cause to happen", "গ": "Cause to carry out", "ঘ": "Cause to convince"}, "answerKey": "খ", "answerText": "Cause to happen", "explanation_bn": "'Bring to pass'-অর্থ হচ্ছে কোনো কিছু ঘটার কারণ হওয়া (To cause something to happen/come about)। Cause to destroy দ্বারা ধ্বংস হওয়ার কারণ হওয়া বুঝায়; Cause to carry out বলতে কোনো কিছু সম্পাদন করানো এবং Cause to convince দ্বারা কোনো কিছু স্বমতে নিয়ে আসা বুঝায়।"}, {"id": "EL-0256", "page": 32, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "42", "question": "'Through thick and thin' means-", "source_tag": "২৭তম বিসিএস", "options": {"ক": "under all conditions", "খ": "to make thick and thin", "গ": "not clear in understanding", "ঘ": "of great density"}, "answerKey": "ক", "answerText": "under all conditions", "explanation_bn": "'Through thick and thin'-এর অর্থ in spite of all the difficulties বা যা কিছুই ঘটুক না কেন। এখানে Under all conditions বলতে 'যে কোনো অবস্থার মধ্যে বুঝায়'।"}, {"id": "EL-0257", "page": 32, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "43", "question": "The expression 'after one's own heart' means-", "source_tag": "২৫তম বিসিএস", "options": {"ক": "To be in low spirit", "খ": "With complete devotion", "গ": "To ones's own liking", "ঘ": "To be in high spirit"}, "answerKey": "গ", "answerText": "To ones's own liking", "explanation_bn": "After one's own heart অর্থাৎ কারো সর্বোত্তম পছন্দের অনুরূপ কিছু (of exactly the type one likes best) অথবা কোনো ব্যক্তি বা বস্তু যা কোনো ব্যক্তিকে পরিপূর্ণরূপে সন্তুষ্ট করে (someone or something that pleases someone perfectly)।"}, {"id": "EL-0258", "page": 32, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "88", "flag": "⚠ Source shows unusual question number '88' (likely a printing/typo error for '44' following the sequence 41-43, 45-49); preserved as printed.", "question": "The expression 'Lingua franca' means ___.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "The common language", "খ": "The first language", "গ": "International language", "ঘ": "The French language"}, "answerKey": "ক", "answerText": "The common language", "explanation_bn": "ইতালিয়ান ভাষার সাথে French, Greek, Arabic, Spanish প্রভৃতি ভাষার মিশ্রণে যে ভাষা তৈরি হয়েছিল সে ভাষাকে 'Lingua franca' বলা হতো। মূলত 'Lingua franca' দ্বারা Common language বুঝানো হতো। বর্তমানে Lingua franca হলো এমন ভাষা যা একটি দেশের বিভিন্ন ভাষাভাষি মানুষ তাদের সাধারণ ভাষা হিসেবে ব্যবহার করে। 'Lingua franca' phrase-টি Bridge language বা Trade language অর্থেও ব্যবহৃত হয়।"}, {"id": "EL-0259", "page": 32, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "45", "question": "Choose the correct meaning: He raised his eyebrow at my explanation.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "show surprise or disapproval.", "খ": "show agreement.", "গ": "show happiness.", "ঘ": "show indifference."}, "answerKey": "ক", "answerText": "show surprise or disapproval.", "explanation_bn": ""}, {"id": "EL-0260", "page": 32, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "46", "question": "The team is ___ eleven players.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "made of", "খ": "made up of", "গ": "made up", "ঘ": "made"}, "answerKey": "খ", "answerText": "made up of", "explanation_bn": "কতগুলো অংশ বিশেষ নিয়ে গঠিত হওয়া বা আলাদা আলাদা সত্তা নিয়ে গঠিত হওয়া বুঝাতে made up of ব্যবহৃত হয়। একটি দল এগারজন খেলোয়াড়ের সমন্বয়ে গঠিত হয়। সুতরাং দল যেহেতু কতগুলো player নিয়ে গঠিত হয়, তাই made up of ব্যবহৃত হবে। make up- মনস্থির করা; make of- কোনো কিছু দিয়ে তৈরি হওয়া এবং make-তৈরি করা।"}, {"id": "EL-0261", "page": 32, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "47", "question": "Choose the appropriate meaning of the idiom 'swan song'?", "source_tag": "২৩তম বিসিএস", "options": {"ক": "First work", "খ": "Last work", "গ": "Middle work", "ঘ": "Early work"}, "answerKey": "খ", "answerText": "Last work", "explanation_bn": "swan song- অন্তিম গীত, শেষ কৃত্য, শেষ কর্ম বা সর্বশেষ লেখা।"}, {"id": "EL-0262", "page": 32, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "48", "question": "A person whose 'head' is in the clouds is-", "source_tag": "২৩তম বিসিএস", "options": {"ক": "proud", "খ": "a day dreamer", "গ": "an aviaor", "ঘ": "useless"}, "answerKey": "খ", "answerText": "a day dreamer", "explanation_bn": "A person whose 'head' is in the clouds দ্বারা এমন ব্যক্তিকে বুঝায় যিনি তার কর্ম পরিকল্পনা বা মতবাদে বাস্তবিক বা যুক্তিপূর্ণ নয় (someone which is not practical or reasonable in their plans or actions or ideas)। a day dreamer অর্থ হলো দিবাস্বপ্নচারী এবং এটি অর্থগতভাবে phrase টির সাথে বেশি মি
