আলোকে সম্পন্ন করা। অর্থাৎ, The test should be based on experience।"}, {"id": "EL-0487", "page": 63, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "24", "question": "In many ways, riding a bicycle is similar to-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "driving a car", "খ": "when one drives a car", "গ": "the driving of a car", "ঘ": "when we drive a car"}, "answerKey": "ক", "answerText": "driving a car", "explanation_bn": "parallelism-এর গঠন অনুযায়ী Subject হিসেবে riding a bicycle থাকায় similar to এর পর driving a car বসবে। Sentence-টির অর্থ সাইকেল চালনা অনেক ক্ষেত্রেই গাড়ি চালনার অনুরূপ। এখানে সাইকেল চালনা ও গাড়ি চালনা একই হওয়ায় এদের phrasal গঠনও একই হবে।"}, {"id": "EL-0488", "page": 63, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "25", "question": "Choose the meaning of the given expressions: \"No news is good news\".", "source_tag": "৩২তম বিসিএস", "options": {"ক": "It is likely that we expect bad news.", "খ": "It is likely to have bad news.", "গ": "It is likely that nothing bad has happened.", "ঘ": "It is unlikely that nothing bad has happened."}, "answerKey": "গ", "answerText": "It is likely that nothing bad has happened.", "explanation_bn": "No news is good news. একটি প্রবাদ, যার অর্থ - কোনো খবর না থাকাটাই সুখবর। অর্থাৎ It is likely that nothing bad has happened. (সম্ভবত খারাপ কিছু ঘটেনি)।"}, {"id": "EL-0489", "page": 63, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "26", "question": "A bird in hand is worth two in the bush.", "source_tag": "৩২তম বিসিএস", "options": {"ক": "Take what you have got readily available rather than expecting better in the future.", "খ": "The seen is better than the unseen.", "গ": "Promises are better than actuals.", "ঘ": "It is no good beating about the bush."}, "answerKey": "ক", "answerText": "Take what you have got readily available rather than expecting better in the future.", "explanation_bn": "A bird in hand is worth two in the bush. একটি প্রবাদ, যার অর্থ- অনিশ্চিত অনেক প্রত্যাশার চেয়ে হাতে পাওয়া কম জিনিসও ভালো। প্রবাদটির কাছাকাছি অর্থ Take what you have got readily available rather than expecting better in the future. তাই সঠিক উত্তর (ক)।"}, {"id": "EL-0490", "page": 64, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "27", "question": "The word 'Shrug' indicating doubt or indifference is associated with-", "source_tag": "৩১তম বিসিএস", "options": {"ক": "shoulders", "খ": "head", "গ": "forehead", "ঘ": "eyebrows"}, "answerKey": "ক", "answerText": "shoulders", "explanation_bn": "সন্দেহ বা উদাসীনতা প্রকাশে কাঁধ ঝাঁকানো অর্থে Shrug ব্যবহৃত হয়। অর্থাৎ To raise the shoulders especially as a gesture of doubt, disdain, or indifference. তাই, shrug শব্দটি shoulders এর সাথে সম্পর্কিত।"}, {"id": "EL-0491", "page": 64, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "28", "question": "He is quite ___ in dealing with people.", "source_tag": "৩১তম বিসিএস", "options": {"ক": "unsubtle", "খ": "imprudent", "গ": "diplomatic", "ঘ": "impolite"}, "answerKey": "গ", "answerText": "diplomatic", "explanation_bn": "Unsubtle-অসূক্ষ্মদর্শী, অসুবেদী; imprudent-অবিচক্ষণ; diplomatic-কুশলী এবং impolite-অভদ্র, অমার্জিত। এখানে diplomatic-ছাড়া অন্য word গুলো-negative. তাছাড়া diplomatic-এর অর্থই এখানে অধিক সঙ্গতিপূর্ণ।"}, {"id": "EL-0492", "page": 64, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "29", "question": "Parliamentary democracy demands discipline and ___ to the rules.", "source_tag": "৩০তম বিসিএস", "options": {"ক": "adherence", "খ": "respectful", "গ": "knowledge", "ঘ": "awareness"}, "answerKey": "ক", "answerText": "adherence", "explanation_bn": "Adherence-আনুগত্য; respectful-শ্রদ্ধাশীল; knowledge-জ্ঞান এবং awareness-সচেতনতা। And এর পূর্বে noun থাকায় পরবর্তীতেও noun বসবে। knowledge এবং awareness-এর পর preposition 'of' বসে। অপশন গুলোর মধ্যে শুধু adherence-এর সাথে to বসে বিধায় Adherence-ই সঠিক উত্তর।"}, {"id": "EL-0493", "page": 64, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "30", "question": "Reason is the highest faculty ___ on human by their creator.", "source_tag": "৩০তম বিসিএস", "options": {"ক": "entrusted", "খ": "endowed", "গ": "bestowed", "ঘ": "conferred"}, "answerKey": "গ", "answerText": "bestowed", "explanation_bn": "Bestow অর্থ পুরস্কার বা সম্মান হিসেবে কোনো কিছু দেওয়া বা প্রদান করা; entrust-বিশ্বাস স্থাপন করা; endow-টাকা, সম্পত্তি বা কোন গুণ প্রদান করা এবং confer-খেতাব বা উপাধি প্রদান করা। sentence-টির অর্থ সৃষ্টিকর্তা কর্তৃক প্রদত্ত মানুষের সর্বোচ্চ গুণ হলো বুদ্ধিমত্তা। এখানে, বুদ্ধিমত্তা মানুষকে সৃষ্টিকর্তা কর্তৃক গুণ বা সম্মান হিসেবে দেওয়া হয়েছে। তাই এক্ষেত্রে bestowed ব্যবহৃত হবে। Bestowed এরপর appropriate preposition on/upon হয়।"}, {"id": "EL-0494", "page": 64, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "31", "question": "'Light' is to 'dark' as 'cold' is to-", "source_tag": "২৮তম বিসিএস", "options": {"ক": "hot", "খ": "heat", "গ": "cool", "ঘ": "winter"}, "answerKey": "ক", "answerText": "hot", "explanation_bn": "Light এর বিপরীত শব্দ dark. তেমনি cold এর বিপরীত শব্দ hot।"}, {"id": "EL-0495", "page": 64, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "32", "question": "Nobody knocked him down; it was an-", "source_tag": "২৭তম বিসিএস", "options": {"ক": "incident", "খ": "occurrence", "গ": "accident", "ঘ": "event"}, "answerKey": "গ", "answerText": "accident", "explanation_bn": "knock down- আঘাতে কোনো কিছুর বা কোনো ব্যক্তি পড়ে যাওয়া। এখানে বাক্যটির অর্থ কেউ তাকে ফেলেনি। এটা একটা দুর্ঘটনা। সাধারণত ঘটনা বোঝাতে incident আর দুর্ঘটনা বা mishap বলতে accident ব্যবহৃত হয়।"}, {"id": "EL-0496", "page": 64, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "33", "question": "'Prior to' means-", "source_tag": "২৭তম বিসিএস", "options": {"ক": "after", "খ": "before", "গ": "immediately", "ঘ": "during the period of"}, "answerKey": "খ", "answerText": "before", "explanation_bn": "'Prior to (before)'-এর অর্থ হচ্ছে পূর্ববর্তী, পূর্বতন, পূর্বে, আগে ইত্যাদি।"}, {"id": "EL-0497", "page": 64, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "34", "question": "Choose the right word to fill the blank: Two of the children have to sleep in one bed, but the other three have ___ ones.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "different", "খ": "separate", "গ": "complete", "ঘ": "lonely"}, "answerKey": "খ", "answerText": "separate", "explanation_bn": "different শব্দটি বিভিন্ন/ভিন্ন অর্থে এবং seperate শব্দটি সম্পন্ন পৃথক বা অন্য আরেকটি বা অন্যগুলো অর্থে ব্যবহৃত হয়। তাই sentence এর অর্থ অনুযায়ী separate ব্যবহৃত হয়।"}, {"id": "EL-0498", "page": 64, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "35", "question": "Choose the right word to fill the blank: The Democratic party's candidate ___ defeat in the small hours of the morning.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "consented", "খ": "agreed", "গ": "accepted", "ঘ": "granted"}, "answerKey": "গ", "answerText": "accepted", "explanation_bn": "consent সম্মতি দেয়া; agree রাজি হওয়া; accept গ্রহণ করা এবং grant অনুমোদন/মঞ্জুর করা। পরাজয় স্বীকার করা অর্থে এখানে accepted defeat ব্যবহৃত হবে।"}, {"id": "EL-0499", "page": 64, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "36", "question": "The proper function of the press is surely to ___ the man in the street with facts.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "equip", "খ": "deliver", "গ": "proffer", "ঘ": "provide"}, "answerKey": "ঘ", "answerText": "provide", "explanation_bn": "Equip-সজ্জিত করা; Proffer-দেবার প্রস্তাব, দিতে চাওয়া; Deliver-বিলি করা এবং Provide-সরবরাহ করা। Sentence-এর অর্থ অনুযায়ী provide ব্যবহৃত হবে।"}, {"id": "EL-0500", "page": 65, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "37", "question": "Choose the right word to fill the blank: Since his retirement, Mr. Chowdhury, who was ___ a teacher, has written four novels.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "usually", "খ": "presently", "গ": "already", "ঘ": "formerly"}, "answerKey": "ঘ", "answerText": "formerly", "explanation_bn": "usually-সচরাচর; already-ইতোমধ্যে; presently-বর্তমানে এবং formerly-সাবেক/ পূর্বে/ পূর্ব কালে। Sentence-টির অর্থ- মি. চৌধুরি, যিনি পূর্বে শিক্ষক ছিলেন, অবসরের পর থেকে চারটি উপন্যাস লিখেছেন।"}, {"id": "EL-0501", "page": 65, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "38", "question": "If we want concrete proof, we are looking for-", "source_tag": "২৬তম বিসিএস", "options": {"ক": "Building material", "খ": "Something to cover a path", "গ": "Clear evidence", "ঘ": "A cement Mixer"}, "answerKey": "গ", "answerText": "Clear evidence", "explanation_bn": "বাক্যটির অর্থ: যদি আমরা স্পষ্ট প্রমাণ করতে চাই, আমাদের সুনির্দিষ্ট প্রমাণাদি খুঁজতে হবে।"}, {"id": "EL-0502", "page": 65, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "39", "question": "Choose the right word to fill the blank: It will be your task to make sure the ___ of traffic is maintained without interruption.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "circulation", "খ": "flow", "গ": "current", "ঘ": "procession"}, "answerKey": "খ", "answerText": "flow", "explanation_bn": "Circulation- প্রচার/বিস্তার, Current- স্রোত, Procession- শোভাযাত্রা, Flow- প্রবাহ/গতি। এখানে যানবাহনের প্রবাহ অর্থে flow of traffic ব্যবহৃত হবে।"}, {"id": "EL-0503", "page": 65, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "40", "question": "Maiden speech means-", "source_tag": "২৬তম, ২৩তম বিসিএস", "options": {"ক": "Late speech", "খ": "Early speech", "গ": "Final speech", "ঘ": "First speech"}, "answerKey": "ঘ", "answerText": "First speech", "explanation_bn": "Maiden speech- কোনো বক্তার প্রথম বক্তৃতা (First speech)।"}, {"id": "EL-0504", "page": 65, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "41", "question": "Many students will now be starting to ___ about their exams result.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "worry", "খ": "reflect", "গ": "inquire", "ঘ": "comment"}, "answerKey": "ক", "answerText": "worry", "explanation_bn": "Worry-উদ্বিগ্ন হওয়া। Reflect-প্রতিফলিত। Inquire-খোঁজখবর নেয়া। Comment-মন্তব্য করা। সাধারণত পরীক্ষার পর ফলাফল সম্পর্কে মন্তব্য করা বা খোঁজখবর নেয়ার চেয়ে উদ্বিগ্ন থাকাই স্বাভাবিক।"}, {"id": "EL-0505", "page": 65, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "42", "question": "Climate is a ___ of the environment.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "state", "খ": "situation", "গ": "rank", "ঘ": "size"}, "answerKey": "ক", "answerText": "state", "explanation_bn": "Climate অর্থ হলো জলবায়ু, যা একটি নির্দিষ্ট এলাকার কয়েক বছরের আবহাওয়ার গড় অবস্থাকে নির্দেশ করে। situation-শব্দটি গ্রাম, শহরের অবস্থান বুঝাতে ব্যবহৃত হয়। rank- সারি বা ক্রম বা পদমর্যাদা এবং size-আকার। এখানে state দিয়ে জলবায়ুর অবস্থা বুঝায়।"}, {"id": "EL-0506", "page": 65, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "43", "question": "We must look pleased or else he'll be ___.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "dissatisfied", "খ": "cross", "গ": "happy", "ঘ": "delighted"}, "answerKey": "ক", "answerText": "dissatisfied", "explanation_bn": "এখানে, dissatisfied-অসন্তুষ্ট; cross-কাটাকাটি; happy-সুখী এবং Delight-আনন্দ। বাক্যটি বোঝাচ্ছে যে, আমরা অবশ্যই আনন্দিত থাকব নতুবা সে অসন্তুষ্ট হবে। এখানে else (নতুবা) শব্দটি 'আনন্দিত' এর বিপরীত কিছু বোঝাচ্ছে।"}, {"id": "EL-0507", "page": 65, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "44", "question": "I decided to go ___ with my friend as I needed some exercise.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "to a walk", "খ": "for a walk", "গ": "for a walking", "ঘ": "walk"}, "answerKey": "খ", "answerText": "for a walk.", "explanation_bn": "ব্যায়াম বা ঘোরাঘুরির উদ্দেশে হাঁটাহাঁটি করা অর্থে go for a walk ব্যবহৃত হয়।"}, {"id": "EL-0508", "page": 65, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "45", "question": "Complete the sentence- Trees have ___ off their leaves.", "source_tag": "২৩তম বিসিএস", "options": {"ক": "thrown", "খ": "fallen", "গ": "cast", "ঘ": "put"}, "answerKey": "গ", "answerText": "cast", "explanation_bn": "fall off-ভেঙে পড়া/ক্ষয় হওয়া; put off- খুলে ফেলা। গাছের পাতা ঝরে পড়া বোঝাতে cast off ব্যবহৃত হয়।"}, {"id": "EL-0509", "page": 65, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "46", "question": "Find out the correct translation. সকাল থেকে গুড়ি গুড়ি বৃষ্টি হচ্ছে।", "source_tag": "২৩তম বিসিএস", "options": {"ক": "It is raining from morning", "খ": "It has been raining from morning", "গ": "It has been drizzling since morning", "ঘ": "It is drizzling since morning"}, "answerKey": "গ", "answerText": "It has been drizzling since morning.", "explanation_bn": "Drizzling = গুঁড়ি গুঁড়ি বৃষ্টি হওয়া। Present perfect tense-এ যদি নির্দিষ্ট সময় বিন্দু বা point of time উল্লেখ থাকে (যেমন-morning) তাহলে since বসে।"}, {"id": "EL-0510", "page": 66, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "47", "question": "They have ___ their support for our case.", "source_tag": "২২তম বিসিএস", "options": {"ক": "pledged", "খ": "disavowed", "গ": "provided", "ঘ": "defered"}, "answerKey": "ক", "answerText": "pledged", "explanation_bn": "pledge- অঙ্গীকার করা, প্রতিজ্ঞা করা, জামানত রাখা; provide- সরবরাহ করা, সংস্থান করা; defer- বিলম্বিত করা, স্থগিত করা/মুলতবি করা এবং disavow- অস্বীকার করা। সুতরাং অর্থানুসারে pledged ই- most appropriate."}, {"id": "EL-0511", "page": 66, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "48", "question": "Choose the correct meaning of the following words: Parcel", "source_tag": "২২তম বিসিএস", "options": {"ক": "Quarrel", "খ": "Piece of land", "গ": "Postage", "ঘ": "Unobstructed view"}, "answerKey": "খ", "answerText": "Piece of land", "explanation_bn": "Parcel অর্থ হলো মোড়ক, এর আরেক অর্থ হলো এক খণ্ড জমি। Quarrel- ঝগড়া, বিবাদ; Piece of land-জমির টুকরো; Postage- ডাকমাশুল এবং Unobstucted view- বাধাহীন দৃষ্টি।"}, {"id": "EL-0512", "page": 66, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "49", "question": "Ruminant", "source_tag": "২২তম বিসিএস", "options": {"ক": "Cud-chewing animal", "খ": "Soup", "গ": "Gossip", "ঘ": "Noise-maker"}, "answerKey": "ক", "answerText": "Cud-chewing animal", "explanation_bn": "Ruminant অর্থ হলো জাবর কাটা প্রাণী। অন্যদিকে, Cud-chewing animal- জাবর কাটা প্রাণী; Soup- ঝোল; Gossip- খোশগল্প এবং Noise-maker-শোরগোলকারী।"}, {"id": "EL-0513", "page": 66, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "50", "question": "Cul-de-sac", "source_tag": "২২তম বিসিএস", "options": {"ক": "Selection", "খ": "Dead end", "গ": "Error", "ঘ": "Bubble"}, "answerKey": "খ", "answerText": "Dead end", "explanation_bn": "Cul-de-sac একটি ফরাসি শব্দ, যার অর্থ হলো কানাগলি। অন্যদিকে, Selection- নির্বাচন; Dead end- কানাগলি; Error- ভুল; Bubble- বুদবুদ, অবাস্তব, চিন্তা বা পরিকল্পনা।"}, {"id": "EL-0514", "page": 66, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "51", "question": "If a substance is cohesive, it tends to-", "source_tag": "২০তম বিসিএস", "options": {"ক": "retain heat", "খ": "bend without much difficulty", "গ": "stick together", "ঘ": "break easily"}, "answerKey": "গ", "answerText": "stick together", "explanation_bn": "Cohesive-দৃঢ়ভাবে একত্রে লেগে থাকে এমন। এখন, Retain heat-তাপ অব্যাহত রাখা। Bend without too much difficulty-খুব বেশি কাঠিন্য ছাড়াই বাঁকা হয়। Stick together-একত্রে লেগে থাকা। Break easily-সহজেই ভেঙে যায়।"}, {"id": "EL-0515", "page": 66, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "52", "question": "Each sentence contains two blanks. Choose the set of words for each blank that best completes the sentence. The influence of the technological revolution in ___ and ___ the concentration of wealth and power in the hands of the few should worry us all.", "source_tag": "২০তম বিসিএস", "options": {"ক": "Proliferating–diminishing", "খ": "Undermining–neutralizing", "গ": "Accelerating–intensifying", "ঘ": "Aggravating–demolishing"}, "answerKey": "গ", "answerText": "accelerating–intensifying.", "explanation_bn": "Double blanks যুক্ত বাক্যে দ্বারা blank দুটি যুক্ত থাকলে blank দুটিতে synonym বা near-synonym ব্যবহার করতে হয়। আলোচ্য sentence-এর অর্থ অনুযায়ী accelerating এবং intensifying এর ব্যবহার যথোপযুক্ত। Proliferating- ক্রমবর্ধমান, দ্রুত বর্ধমান, দ্রুত বাড়ছে এমন এবং Diminishing-ক্রম হ্রাসমান (Antonymous). Undermining-ক্রমশ দুর্বল হচ্ছে এমন এবং Neutralizing-ক্রম নিষ্ক্রিয়মান (প্রায় সমার্থক)। Accelerating-বৃদ্ধি পাচ্ছে এমন, দ্রুততর হচ্ছে এমন এবং Intensifying-বৃদ্ধি পাচ্ছে এমন, তীব্রতর হচ্ছে এমন (Synonymous); Aggravating-প্রকোপ বৃদ্ধি পাচ্ছে এমন, শোচনীয়তর হচ্ছে এমন এবং Demolishing-ধ্বংস হয়ে যাচ্ছে এমন (Synonymous নয়)।"}, {"id": "EL-0516", "page": 66, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "53", "question": "Few people would care to take the negative side of the proposition that the women of the world are ___ and ___.", "source_tag": "২০তম বিসিএস", "options": {"ক": "admired–provoked", "খ": "oppressed– scorned", "গ": "rebuked–regaled", "ঘ": "slighted–celebrated"}, "answerKey": "খ", "answerText": "oppressed– scorned", "explanation_bn": "And দ্বারা দুটি blank যুক্ত থাকায় অবশ্যই Synonym ব্যবহার করতে হবে। Sentence-এর context অনুসারে oppressed ও scorned ব্যবহৃত হবে। Admire (d) প্রশংসা করা, বিমুগ্ধ হওয়া এবং Provoke (d) অবহেলিত, তাচ্ছিল্য করা হয় এমন (Synonymous)। Oppressed-নিপীড়িত, অত্যাচারিত, অবহেলিত এবং Scorned-অবহেলিত, তাচ্ছিল্য করা (Synonymous); Rebuked-তিরস্কৃত এবং Regaled-পরিতৃপ্ত, সুখি, আনন্দিত (Antonymous)। Slighted-উপেক্ষিত, অবজ্ঞাকৃত এবং Celebrated-প্রসিদ্ধ, খ্যাত, শ্রদ্ধা ও সম্মান আছে এমন (Antonymous)।"}, {"id": "EL-0517", "page": 67, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "54", "question": "The word 'dilly dally' means-", "source_tag": "২০তম বিসিএস", "options": {"ক": "To dilute", "খ": "Wait impatiently", "গ": "Repeat", "ঘ": "Waste time"}, "answerKey": "ঘ", "answerText": "Waste time", "explanation_bn": "dilute অর্থ পাতলা করা বা দুর্বল করা; Wait impatiently অর্থ অধৈর্য সহকারে অপেক্ষা করা; Repeat অর্থ পুনরাবৃত্তি করা এবং dilly dally অর্থ- সময় অপচয় করা (Waste time)।"}, {"id": "EL-0518", "page": 67, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "55", "question": "Anger, even when it is ___ has one virtue, it overcome-", "source_tag": "২০তম বিসিএস", "options": {"ক": "sinful-sloth", "খ": "inevitable-desire", "গ": "unnecessary-malice", "ঘ": "intense-hate"}, "answerKey": "খ", "answerText": "inevitable-desire", "explanation_bn": "আলোচ্য বাক্যটির অর্থ অনুযায়ী শূন্যস্থানে inevitable ও desire বসবে। বাক্যটির অর্থ ক্রোধের একটি গুণ হলো এটি আকাঙ্ক্ষাকে জয় করে (দমন করে/ভুলিয়ে দেয়) এমনকি যখন এটি অনিবার্য হয় এখানে, Sinful-পাপপূর্ণ এবং Sloth-আলস্য, ঢিলেমি। Inevitable-অনতিক্রম্য, অনিবার্য, যা বর্জন করা অসম্ভব। এবং Desire-আকাঙ্ক্ষা, স্পৃহা, আশা।"}, {"id": "EL-0519", "page": 67, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "56", "question": "Because she had reputation for ___ we were surprised and pleased when she greeted us so-", "source_tag": "১৮তম বিসিএস", "options": {"ক": "insolence-irately", "খ": "insouciance-cordially", "গ": "arrogance-disdainfully", "ঘ": "querulousness-affably"}, "answerKey": "ঘ", "answerText": "querulousness-affably", "explanation_bn": "Because দ্বারা দুটি clause যুক্ত হওয়ায় Synonym প্রয়োজন ছিল। কিন্তু Surprised শব্দটি থাকায় ব্যাপারটি উল্টো হবে। অর্থাৎ Antonym ব্যবহার করতে হবে; Insolence-ধৃষ্টতা, ঔদ্ধত্য এবং Irately-ক্রুদ্ধভাবে। insouciance-নির্লক্ষ্য, নিরাসক্তি এবং cordially-আন্তরিকভাবে; arrogance-ঔদ্ধত্য এবং disdainfully-অসম্মানজনকভাবে; Querulouseness-কলহপ্রিয়তা এবং Affably-অমায়িকভাবে। এরা সম্পূর্ণরূপে বিপরীতার্থক না হলেও near antonym কারণ, অমায়িক ব্যবহার অবশ্যই কলহের উল্টা। বাক্যটির অর্থ আমরা তার অমায়িক ব্যবহারে সন্তুষ্ট ও আশ্চর্য হয়েছিলাম কারণ কলহপ্রিয়তার জন্য তার কুখ্যাতি ছিল।"}, {"id": "EL-0520", "page": 67, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "57", "question": "A ___ Statement is an ___ comparison; it does not compare things explicitly but suggest a likeness between them.", "source_tag": "১৮তম বিসিএস", "options": {"ক": "sarcastic-unfair", "খ": "metaphorical-implied", "গ": "sanguine-inherent", "ঘ": "blatant-overt"}, "answerKey": "খ", "answerText": "metaphorical-implied", "explanation_bn": "Metaphorical অর্থ রূপক এবং implied অর্থ উহ্য। sentence-টির অর্থ একটি রূপক বিবৃতি হলো পরোক্ষ উপমা বা তুলনা, এটি কোনো জিনিসের সাথে প্রত্যক্ষভাবে তুলনা করে না কিন্তু এদের মধ্যে একটি সাদৃশ্য নির্দেশ করে। Blatant অর্থ অনায়াসে চোখে পড়ে এবং overt অর্থ প্রকাশ্য; sarcastic অর্থ হ ": 69, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "09", "question": "One whose attitude is 'eat, drink and be merry' is-", "source_tag": "৪১তম বিসিএস", "options": {"ক": "materialistic", "খ": "epicurean", "গ": "cynic", "ঘ": "stoic"}, "answerKey": "খ", "answerText": "epicurean.", "explanation_bn": "Materialistic-জড়বাদী, প্রকৃতিবাদী; Epicurean-বিলাসপ্রিয়, রুচিবাগীশ, দৈহিক সুখভোগী; Cynic-ছিদ্রান্বেষী লোক এবং Stoic-নির্বিকার, বিষয়বিমুখ।"}, {"id": "EL-0544", "page": 69, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "10", "question": "The word 'sibling' means-", "source_tag": "৪০তম বিসিএস", "options": {"ক": "a brother", "খ": "a sister", "গ": "a brother or sister", "ঘ": "an infant"}, "answerKey": "গ", "answerText": "a brother or sister.", "explanation_bn": "Sibling শব্দটির বাংলা অর্থ একই পিতামাতার সন্তান, ভাই বা বোন। সুতরাং sibling অর্থ a brother or sister।"}, {"id": "EL-0545", "page": 70, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "11", "question": "Someone who is capricious is-", "source_tag": "৪০তম বিসিএস", "options": {"ক": "easily irritated", "খ": "wise and willing to cooperate", "গ": "exceedingly conceited and arrogant", "ঘ": "known for sudden changes in attitude or behaviour"}, "answerKey": "ঘ", "answerText": "known for sudden changes in attitude or behaviour.", "explanation_bn": "যে ব্যক্তি capricious (খেয়ালি; অস্থিরমতি), সে তার আচরণ এবং দৃষ্টিভঙ্গি হঠাৎ পরিবর্তনের জন্য পরিচিত অর্থাৎ শূন্যস্থানের জন্য যথাযথ option হলো known for sudden changes in attitude or behaviour।"}, {"id": "EL-0546", "page": 70, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "12", "question": "A man whose wife has died is called a-", "source_tag": "৪০তম বিসিএস", "options": {"ক": "Widow", "খ": "Widower", "গ": "Spinster", "ঘ": "Bachelor"}, "answerKey": "খ", "answerText": "Widower.", "explanation_bn": "যে ব্যক্তির স্ত্রী মারা গেছে ত Pediatrics হলো শিশুদের চিকিৎসা ব্যবস্থা। অপরদিকে Geriatrics হলো বৃদ্ধদের (old people) চিকিৎসা পদ্ধতি/ব্যবস্থা।"}, {"id": "EL-0550", "page": 70, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "16", "question": "A person who believes that laws and governments are not necessary is known as-", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "a militant", "খ": "an anarchist", "গ": "a terrorist", "ঘ": "an extremist"}, "answerKey": "খ", "answerText": "an anarchist.", "explanation_bn": "an anarchist- অর্থ নৈরাজ্যবাদী, নৈরাজ্যবাদী হলো সেই ব্যক্তি যে বিশ্বাস করে আইন ও সরকার অপ্রয়োজনীয়; a militant- উদ্দেশ্য সাধনে আক্রমণাত্বক মনোভাব সম্পন্ন ব্যক্তি। a terrorist- A person who uses terrorism in the pursuit of political aims; an extremist- চরমপন্থী।"}, {"id": "EL-0551", "page": 70, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "17", "question": "The word 'omnivorous' means:", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "eating all types of food", "খ": "eating only fruits", "গ": "eating only meat", "ঘ": "eating grass and plants only"}, "answerKey": "ক", "answerText": "eating all types of food.", "explanation_bn": "Omnivorous-সর্বভুক, সবকিছু খায় এমন বা eating all types of food. Herbivorous-তৃণভোজী, Carnivores-মাংশাসী।"}, {"id": "EL-0552", "page": 70, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "18", "question": "The film was directed in the director's usual ___ style.", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "confusion", "খ": "idiosyncratic", "গ": "personifying", "ঘ": "purifying"}, "answerKey": "খ", "answerText": "idiosyncratic.", "explanation_bn": "confusion অর্থ- বিভ্রান্তি, কিংকর্তব্যবিমূঢ়তা; idiosyncratic- স্বকীয়, মেজাজি; personifying- ব্যক্তিত্ব আরোপ; purifying- বিশুদ্ধ, শোধক। প্রশ্লোক্ত বাক্যে idiosyncratic-ই সঠিক। বাক্যটির অর্থ চলচ্চিত্রটি পরিচালকের স্বভাবগত স্বকীয় ভঙ্গিতে পরিচালিত হয়েছিল।"}, {"id": "EL-0553", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "19", "question": "\"It is time to review the protocol on testing nuclear weapons\". Here the underlined word means-", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "Record of rules", "খ": "Summary of rules", "গ": "Procedures", "ঘ": "Problems"}, "answerKey": "ক", "answerText": "Record of rules.", "explanation_bn": "Protocol শব্দের একটি অর্থ হচ্ছে-a set of rules/ procedures for an event or experiment। এখানে, protocol-এর পূর্বে 'review' word টি থাকায় তা কোনো recorded/written rules-কেই বোঝাচ্ছে।"}, {"id": "EL-0554", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "20", "question": "N.B. stands for-", "source_tag": "৩৪তম বিসিএস", "options": {"ক": "Note before", "খ": "No bar", "গ": "Non bearing", "ঘ": "Nota bene"}, "answerKey": "ঘ", "answerText": "Nota bene.", "explanation_bn": "N.B. হলো একটি Abbreviation বা সংক্ষিপ্ত রূপ। এর পূর্ণরূপ হলো Nota bene. লেখনিতে কোনো কিছু গুরুত্বপূর্ণ হিসেবে তুলে ধরার ক্ষেত্রে N.B. ব্যবহার করা হয়।"}, {"id": "EL-0555", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "21", "question": "Time after twilight and before night-", "source_tag": "৩০তম বিসিএস", "options": {"ক": "Evening", "খ": "Dawn", "গ": "Dusk", "ঘ": "Eclipse"}, "answerKey": "গ", "answerText": "Dusk.", "explanation_bn": "Twilight (গোধূলি)-এর পরবর্তী কিন্তু night (রাত্রি)-এর পূর্ববর্তী সময় বা time-কে Dusk বা সন্ধ্যার প্রাক্কাল বলে। Dawn-প্রভাত কাল Eclipse-গ্রহণ বা রাহু গ্রাস।"}, {"id": "EL-0556", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "22", "question": "The people who carry a coffin at a funeral are called-", "source_tag": "৩০তম বিসিএস", "options": {"ক": "undertakers", "খ": "supporters", "গ": "pallbearers", "ঘ": "mourners"}, "answerKey": "গ", "answerText": "pallbearers.", "explanation_bn": ""}, {"id": "EL-0557", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "23", "question": "The word 'electorate' means-", "source_tag": "২৮তম বিসিএস", "options": {"ক": "election office", "খ": "a body of voters", "গ": "many elections", "ঘ": "candidates"}, "answerKey": "খ", "answerText": "a body of voters.", "explanation_bn": "Electorate শব্দটি noun, যার অর্থ নির্বাচকমণ্ডলী। A body of voters বলতে বোঝায় নির্বাচকমণ্ডলী, যারা voter-দের দ্বারা নির্বাচিত।"}, {"id": "EL-0558", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "24", "question": "'Paediatric' relates to the treatment of:", "source_tag": "২৬তম, ১৫তম বিসিএস", "options": {"ক": "Adults", "খ": "Children", "গ": "Women", "ঘ": "Old people"}, "answerKey": "খ", "answerText": "Children.", "explanation_bn": "শিশু সম্পর্কিত চিকিৎসাবিদ্যা- Paediatric।"}, {"id": "EL-0559", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "25", "question": "A 'pilgrim' is a person who undertakes a journey to a ___.", "source_tag": "২৬, ১৬তম বিসিএস", "options": {"ক": "Mosque", "খ": "A new country", "গ": "Holy place", "ঘ": "Bazar"}, "answerKey": "গ", "answerText": "Holy place.", "explanation_bn": "Pilgrim-তীর্থযাত্রী (ধর্মীয় স্থানের যাত্রী)। একজন Pilgrim সর্বদাই পবিত্র স্থানে (Holy Place) যাত্রা করে।"}, {"id": "EL-0560", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "26", "question": "'Gullible'", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "foolish", "খ": "willing to believe anything or anyone", "গ": "simple", "ঘ": "easily deceived"}, "answerKey": "খ ও ঘ", "answerText": "খ ও ঘ (both খ and ঘ)", "explanation_bn": "এখানে Gullible অর্থ সহজে বিশ্বাসপ্রবণ। foolish-বোকা। Willing to believe anything or anyone-যে কোনো কিছু বা যে কাউকে বিশ্বাস করতে ইচ্ছুক। easily deceived- সহজে প্রতারিত। Oxford Dictionary-অনুযায়ী (খ) এবং (ঘ) দুটি উত্তরই সঠিক।"}, {"id": "EL-0561", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "27", "question": "The word 'ecological' is related to-", "source_tag": "২৬তম, ১৬তম বিসিএস", "options": {"ক": "Demography", "খ": "Pollution", "গ": "Atmosphere", "ঘ": "Environment"}, "answerKey": "ঘ", "answerText": "Environment.", "explanation_bn": ""}, {"id": "EL-0562", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "28", "question": "Misanthropist means ___.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "One who flirts with ladies", "খ": "A person of narrow views", "গ": "A hater of mankind", "ঘ": "One who believe that God is in everything"}, "answerKey": "গ", "answerText": "A hater of mankind.", "explanation_bn": ""}, {"id": "EL-0563", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "29", "question": "First language means the ___ language.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "important", "খ": "main", "গ": "natural", "ঘ": "official"}, "answerKey": "খ", "answerText": "main.", "explanation_bn": ""}, {"id": "EL-0564", "page": 71, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "30", "question": "'Razzmatazz' means-", "source_tag": "২৪তম, ১৭তম বিসিএস", "options": {"ক": "A musical instrument", "খ": "A well-planned programme", "গ": "A noisy activity", "ঘ": "A musical activity"}, "answerKey": "গ", "answerText": "A noisy activity.", "explanation_bn": "'Razzmatazz'-এর অর্থ হলো-a lot of noisy or exciting activity।"}, {"id": "EL-0565", "page": 72, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "31", "question": "'Blockbuster' means-", "source_tag": "১৭তম বিসিএস", "options": {"ক": "A large solid piece of stone", "খ": "A device to cut off a person's head as a punishment", "গ": "Something that makes movement difficult", "ঘ": "A powerful explosive to demolish buildings"}, "answerKey": "ঘ", "answerText": "A powerful explosive to demolish buildings.", "explanation_bn": "Blockbuster বলতে মূলত 'অত্যান্ত জনপ্রিয় ও বাণিজ্যিকভাবে সফল চলচ্চিত্র, নাটক বা বিনোদনমূলক কাজ' কে বুঝায়, তবে পূর্বে (১৯৪০ এর দশকে) Blockbuster বলতে -শক্তিশালী বিস্ফোরক বা বোমা যা একত্রে অনেক বাড়ি-ঘর ধ্বংস করতে পারে- এমন বুঝানো হতো।"}, {"id": "EL-0566", "page": 72, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "32", "question": "The word 'homogeneous' means-", "source_tag": "১৬তম বিসিএস", "options": {"ক": "of the same kind", "খ": "of the same place", "গ": "of the same race", "ঘ": "of the same density"}, "answerKey": "ক", "answerText": "of the same kind.", "explanation_bn": "Homogeneous- সমজাতীয়/সমজাতিক।"}, {"id": "EL-0567", "page": 72, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "33", "question": "Three Score is-", "source_tag": "১৬তম বিসিএস", "options": {"ক": "thirty times", "খ": "three hundred times", "গ": "three times twenty", "ঘ": "more than three"}, "answerKey": "গ", "answerText": "three times twenty.", "explanation_bn": "Three Score - ষাট, ৬০; thirty times - ৩০ গুণ; three hundred times - ৩০০ গুণ; three times twenty- ষাট, ৬০(২০ + ২০ + ২০); more than three- ৩ এর অধিক।"}, {"id": "EL-0568", "page": 72, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "34", "question": "An Ordinance is-", "source_tag": "১৬তম বিসিএস", "options": {"ক": "a book", "খ": "an arms factory", "গ": "a news paper journal", "ঘ": "a law"}, "answerKey": "ঘ", "answerText": "a law.", "explanation_bn": "Ordinance-অধ্যাদেশ, বিশেষ ক্ষমতা বলে প্রণীত আইন। কাজেই এটি (ঘ) এর law বা আইন এর সমার্থক।"}, {"id": "EL-0569", "page": 72, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "35", "question": "'Plebiscite' is a term related to-", "source_tag": "১৫তম বিসিএস", "options": {"ক": "Medicine", "খ": "Technlogy", "গ": "Law", "ঘ": "Politics"}, "answerKey": "ঘ", "answerText": "Politics.", "explanation_bn": "Plebiscite অর্থ-গণভোট।"}, {"id": "EL-0570", "page": 72, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "36", "question": "Many islands make up-", "source_tag": "১৫তম বিসিএস", "options": {"ক": "an isle", "খ": "an archipelago", "গ": "a peninsula", "ঘ": "a continent"}, "answerKey": "খ", "answerText": "an archipelago.", "explanation_bn": "Island-দ্বীপ; Peninsula/Isles- উপদ্বীপ; Continent-মহাদেশ; Archipelago-দ্বীপপুঞ্জ। অনেকগুলো দ্বীপ মিলে একটি দ্বীপপুঞ্জ গঠিত হয়।"}, {"id": "EL-0571", "page": 72, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "37", "question": "People who assume that no evil can befall them are foolishly-", "source_tag": "১৪তম বিসিএস", "options": {"ক": "ardent", "খ": "complacent", "গ": "confident", "ঘ": "apprehensive"}, "answerKey": "খ", "answerText": "complacent.", "explanation_bn": "প্রশ্নে প্রদত্ত বাক্যটির অর্থ ঐ সকল লোক, যারা মনে করে কোনো পাপই তাদের পতন ঘটাতে পারবে না, বোকার ন্যায় আত্মতুষ্ট; Ardent-অতিশয় আকুল, অতি উৎসাহী; Complacent-আত্মতুষ্ট, পরিতৃপ্ত; Confident-আত্মবিশ্বাসী; Apprehensive-উদ্বিগ্ন, শঙ্কিত, উৎকৃষ্ঠিত। যেহেতু তারা ধরে নিছে, তাদের পতন ঘটা সহজ নয়, কাজেই তারা নিজেদের অর্জনে সন্তুষ্ট বা পরিতৃপ্ত।"}, {"id": "EL-0572", "page": 72, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "38", "question": "One who unduly forwards in rendering services for others is not generally liked in society. - Which of the following words represents truely the character of the person mentioned above?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "Benevolent", "খ": "Offical", "গ": "Officious", "ঘ": "Bureaucratic"}, "answerKey": "গ", "answerText": "Officious.", "explanation_bn": "যে ব্যক্তি অসঙ্গতভাবে অপরের জন্য এগিয়ে আসে তাকে সাধারণভাবে সবাই অপছন্দ করে। Benevolent-দয়ালু, সদাশয়, জনহিতৈষী; Official- রীতিমাফিক, আনুষ্ঠানিক; Officious- গায়ে পড়ে সাহায্য করে এমন, কর্তৃত্বপরায়ণ; Bureaucratic- আমলাতান্ত্রিক। যেহেতু সে অসঙ্গতভাবে সাহায্য করে, কাজেই সে দয়ালু নয় কিংবা অফিসিয়ালও নয়। আবার আমলাতান্ত্রিকতার বিষয়টি অপরের ধামাধরার সদৃশ বা নেতা/কর্মকর্তার তোষামোদ বিষয়ক নয়।"}, {"id": "EL-0573", "page": 72, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "39", "question": "Anything 'Pernicious' tends to injure or destroy. Something which has no such harmful effect is-", "source_tag": "১৩তম বিসিএস", "options": {"ক": "innocuous", "খ": "innocent", "গ": "immaculate", "ঘ": "salutary"}, "answerKey": "ক", "answerText": "innocuous.", "explanation_bn": "মূল sentence-এ বলা হয়েছে যে, Pernicious অর্থ 'যা ক্ষতি করে বা ধ্বংস করে' এবং যা ক্ষতি করে না তা কী জানতে চাওয়া হয়েছে। এখন প্রদত্ত Option-এর মধ্যে 'innocuous'-এর অর্থ 'এমন কিছু যা কোনো অনিষ্ট করে না'। innocent-নির্দোষ; immaculate- নিষ্কলঙ্ক এবং salutary- স্বাস্থ্যকর; হিতকর, উপকারী।"}, {"id": "EL-0574", "page": 72, "chapter": "Chapter 05: Words and Compositions", "topic": "5.2 Substitutions", "qno": "40", "question": "Select the answer of the word 'stagflation'.", "source_tag": "১৩তম বিসিএস", "options": {"ক": "controlled prices", "খ": "economic slow down", "গ": "a disintegrating government", "ঘ": "cultural dullness"}, "answerKey": "খ", "answerText": "economic slow down.", "explanation_bn": "Stagflagtion- অর্থনৈতিক মন্দা (যে সময়ে মুদ্রাস্ফীতি হয় কিন্তু উৎপাদন বাড়ে না)। মূলত Stagnation (নিষ্ক্রিয় অবস্থা, অচলাবস্থা) ও Inflation- (মুদ্রাস্ফীতি)-এই দুটি শব্দের মিলনে Stagflagtion-শব্দটি গঠিত। এখানে Controlled price- নিয়ন্ত্রিত মূল্য; Economic slowdown-অর্থনৈতিক মন্দা। A disintegrating government- একটি অসামঞ্জসপূর্ণ সরকার এবং Cultural dullness-সাংস্কৃতিক মন্দা।"}, {"id": "EL-0575", "page": 73, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "01", "question": "A synonym of the word 'crepuscular' is-", "source_tag": "৫০তম বিসিএস", "options": {"ক": "nocturnal", "খ": "diurnal", "গ": "cathemeral", "ঘ": "twilit"}, "answerKey": "ঘ", "answerText": "twilit", "explanation_bn": "Crepuscular অর্থ: গোধূলি বা ভোর-সন্ধ্যার nyms and Antonyms - Synonyms", "qno": "05", "question": "The synonyms of 'altitude' is-", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "height", "খ": "width", "গ": "length", "ঘ": "depth"}, "answerKey": "ক", "answerText": "height", "explanation_bn": "Altitude, Height, Elevation-এর অর্থ উচ্চতা।"}, {"id": "EL-0580", "page": 73, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "06", "question": "The synonym for 'panoramic' is-", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "scenic", "খ": "narrow", "গ": "limited", "ঘ": "restricted"}, "answerKey": "ক", "answerText": "scenic", "explanation_bn": "Panoramic এর বাংলা অর্থ দূর-দৃশ্য বা চিত্র সংক্রান্ত। এটার synonym হলো scenic যার অর্থ দৃশ্য।"}, {"id": "EL-0581", "page": 73, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "07", "question": "Identify the correct synonym for the word 'magnanimous.'", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "unkind", "খ": "generous", "গ": "revengeful", "ঘ": "friendly"}, "answerKey": "খ", "answerText": "generous", "explanation_bn": "'magnanimous, generous, charitable, greathearted, benevolent, bountiful, munificent, altruistic ইত্যাদি শব্দ গুলোর অর্থ উদার, দানশীল, মহানুভব, মহৎ ইত্যাদি। অন্যদিকে unkind-নির্দয়, revengeful-প্রতিশোধপরায়ণ, friendly-বন্ধুত্বপূর্ণ।"}, {"id": "EL-0582", "page": 73, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "08", "question": "Which word is similar to 'appal'?", "source_tag": "৪০তম বিসিএস", "options": {"ক": "deceive", "খ": "confuse", "গ": "dismay", "ঘ": "solicit"}, "answerKey": "গ", "answerText": "dismay", "explanation_bn": "Appal, dismay, dishearten, alarm, horrify, consternate, demoralize, dispirit ইত্যাদি শব্দগুলোর অর্থ আতঙ্কিত করা, মর্মাহত করা, নিরুৎসাহিত করা, হতাশ করা। অন্যদিকে deceive অর্থ প্রতারণা করা, confuse অর্থ গুলিয়ে ফেলা এবং solicit অর্থ সবিনয়ে আবেদন করা।"}, {"id": "EL-0583", "page": 73, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "09", "question": "A chart was appended to the report. Here 'appended' means-", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "changed", "খ": "removed", "গ": "joined", "ঘ": "shortened"}, "answerKey": "গ", "answerText": "joined", "explanation_bn": "Append শব্দটির অর্থ লেখায় বা ছাপায় যুক্ত করা। এর Synonyms-associate, connect, join, engage ইত্যাদি।"}, {"id": "EL-0584", "page": 73, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "10", "question": "The new offer of job was alluring. Here 'alluring' means-", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "unexpected", "খ": "tempting", "গ": "disappointing", "ঘ": "ordinary"}, "answerKey": "খ", "answerText": "tempting", "explanation_bn": "Alluring-লোভনীয়। অন্য option-গুলোর মধ্যে unexpected-অপ্রত্যাশিত; tempting-প্রলুব্ধকর/লোভনীয়; disappointing-হতাশাজনক; ordinary-সাধারণ। বাক্য অনুযায়ী নতুন চাকরির offer-টি লোভনীয় ছিল।"}, {"id": "EL-0585", "page": 74, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "11", "question": "'Venerate' Means-", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "defame", "খ": "abuse", "গ": "respect", "ঘ": "accuse"}, "answerKey": "গ", "answerText": "respect", "explanation_bn": "Venerate, respect, revere, honour-অর্থ শ্রদ্ধা করা, সম্মান করা। Option গুলোর মধ্যে defame-নিন্দা করা; abuse-গালি দেয়া এবং accuse-দোষারোপ করা।"}, {"id": "EL-0586", "page": 74, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "12", "question": "Choose the pair of words that expresses a relationship similar to that of \"Harm: Damage\"-", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "Sweet : Sour", "খ": "Injure : Incapacitate", "গ": "Stout : Weak", "ঘ": "Hook : Crook"}, "answerKey": "খ", "answerText": "Injure : Incapacitate", "explanation_bn": "Harm (ক্ষতি করা) : Damage (ক্ষতি করা, ধ্বংস করা)। অর্থাৎ কাউকে ধ্বংস করার জন্য ক্ষতি করা হয়। Sweet (মিষ্টি/মধুর) : Sour (টক)- বিপরীতার্থক এবং Injure (আঘাত করা, ক্ষত করা): Incapacitate (অক্ষম করা, আঘাতের দ্বারা দুর্বল করা), অর্থাৎ কাউকে অক্ষম করার জন্য আঘাত করা হয়। Stout (অটল, শক্তিশালী): Weak (দুর্বল)- Antonymous এবং Hook (বাঁকানো, বক্র হওয়া) : Crook (বক্র করা বা হওয়া) এরা synonymous হলেও সম্পর্কগত দিক থেকে এক নয়। তাই উত্তর হবে- Injure ও Incapacitate সম্পর্কগত দিক থেকে Harm ও Damage-এর সমার্থক।"}, {"id": "EL-0587", "page": 74, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "13", "question": "The noise level in Dhaka city has increased exponentially. Here the underlined word means-", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "amazingly", "খ": "steadily", "গ": "shockingly", "ঘ": "rapidly"}, "answerKey": "ঘ", "answerText": "rapidly", "explanation_bn": "Exponentially অর্থ দ্রুতভাবে (গতি বা বৃদ্ধির ক্ষেত্রে); amazingly অর্থ বিস্ময়করভাবে; steadily-স্থিরভাবে; shockingly-জঘন্যভাবে, ভীতিজনকভাবে এবং rapidly-দ্রুতভাবে। সুতরাং exponentially শব্দের অর্থ rapidly।"}, {"id": "EL-0588", "page": 74, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "14", "question": "What would be the right synonym for 'initiative'?", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "apathy", "খ": "enterprise", "গ": "indolence", "ঘ": "activity"}, "answerKey": "গ", "answerText": "enterprise", "explanation_bn": "Initiative অর্থ- আরম্ভ, প্রথম পদক্ষেপ, উদ্যম, option গুলোর মধ্যে apathy অর্থ- অনীহা, উদাসীনতা; indolence- অলসতা; enterprise- নতুন কিছু করার জন্য উদ্যম, উদ্যোগ এবং activity অর্থ- সক্রিয়তা, তৎপরতা। সুতরাং অর্থগত দিক থেকে initiative ও enterprise শব্দ দুটি synonymous।"}, {"id": "EL-0589", "page": 74, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "15", "question": "In the 18th Century the Mughal Empire begun to-", "source_tag": ন মান্যকারী; submissive-অনুগত।"}, {"id": "EL-0593", "page": 74, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "19", "question": "The verb 'succumb' means-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "achieve", "খ": "win", "গ": "submit", "ঘ": "conquer"}, "answerKey": "গ", "answerText": "submit", "explanation_bn": "succumb- সমর্পণ করা; option গুলোর মধ্যে submit অর্থ নিবেদন করা; achieve- অর্জন করা; conquer/win- জয় করা।"}, {"id": "EL-0594", "page": 75, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "20", "question": "What may be considered courteous in one culture may be arrogant in another.", "source_tag": "৩২তম বিসিএস", "options": {"ক": "flimsy", "খ": "coarse", "গ": "gracious", "ঘ": "friendly"}, "answerKey": "গ", "answerText": "gracious", "explanation_bn": "Courteous, Cultured, civil, polite, modest অর্থ- ভদ্র বা মার্জিত; Flimsy- হালকা ও পাতলা বা ফিনফিনে; Coarse অর্থ- মোটা; অমার্জিত; Gracious- ভদ্র, সৌজন্যময়; Friendly- বন্ধুসুলভ। এখানে courteous ও gracious সমার্থক শব্দ।"}, {"id": "EL-0595", "page": 75, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "21", "question": "Choose the correct synonym for- 'Extempore'", "source_tag": "৩২তম বিসিএস", "options": {"ক": "Planned", "খ": "Improvise", "গ": "Impromptu", "ঘ": "Immediate"}, "answerKey": "গ", "answerText": "Impromptu", "explanation_bn": "Extempore, Impromptu, unrehearsed, offhanded অর্থ- পূর্বপ্রস্তুতিহীন, প্রত্যুৎপন্নমতি। Planned- পরিকল্পিত; Improvise- তাৎক্ষণিক ভাবে উদ্ভাবন বা প্রস্তুত করা; Impromptu- প্রত্যুৎপন্ন, পূর্বপ্রস্তুতিহীন; Immediate- তাৎক্ষণিক। এখানে extempore-এর synonym হলো Impromptu। উল্লেখ্য, Improvise অর্থের দিক থেকে সমার্থক হলেও parts of speech হিসেবে ভিন্ন।"}, {"id": "EL-0596", "page": 75, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "22", "question": "'Menacing'.", "source_tag": "৩২তম বিসিএস", "options": {"ক": "Encouraging", "খ": "Alarming", "গ": "Promising", "ঘ": "Auspicious"}, "answerKey": "খ", "answerText": "Alarming", "explanation_bn": "Menacing, threatening, sinister, baleful অর্থ- ভীতিকর, হুমকিদায়ক; Encouraging অর্থ- উৎসাহ ব্যঞ্জক; Alarming অর্থ- ভীতিকর; Promising অর্থ- সম্ভাবনাময়; Auspicious অর্থ- শুভ, অনুকূল। এখানে menacing ও alarming সমার্থক শব্দ।"}, {"id": "EL-0597", "page": 75, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "23", "question": "Sporadic-", "source_tag": "৩১তম বিসিএস", "options": {"ক": "Consistent", "খ": "Uniform", "গ": "Frequent", "ঘ": "Scattered"}, "answerKey": "ঘ", "answerText": "Scattered", "explanation_bn": "Sporadic- বিক্ষিপ্ত; Consistent- সঙ্গতিপূর্ণ; Uniform- একরূপ, সমরূপ; Frequent- পৌনঃপুনিক; Scattered- বিক্ষিপ্ত। এখানে Scattered, sporadic-এর অর্থ প্রকাশ করে।"}, {"id": "EL-0598", "page": 75, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "24", "question": "Omnipotent-", "source_tag": "৩১তম বিসিএস", "options": {"ক": "Feeble", "খ": "Supreme", "গ": "Impotent", "ঘ": "Vulnerable"}, "answerKey": "খ", "answerText": "Supreme.", "explanation_bn": "Omnipotent-সর্বশক্তিমান; feeble-দুর্বল; supreme-সর্বোচ্চ, পরম; impotent-অক্ষম, অসমর্থ; vulnerable-অরক্ষিত। এখানে Supreme, Omnipotent-এর অর্থ প্রকাশ করে।"}, {"id": "EL-0599", "page": 75, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "25", "question": "Crafty men condemn studies, simple men admire them and wise men use them.", "source_tag": "৩১তম বিসিএস", "options": {"ক": "Denounce", "খ": "Laud", "গ": "Compliment", "ঘ": "Acclaim"}, "answerKey": "ক", "answerText": "Denounce.", "explanation_bn": "Condemn, denounce, blame, castigate, chastise, upbraid ইত্যাদি শব্দগুলোর অর্থ- নিন্দা করা, দোষারোপ করা বা ভর্ৎসনা করা। Laud- প্রশংসা করা; Compliment- প্রশংসা করা; Acclaim- স্বাগত জানানো। এখানে Denounce, condemn- এর synonym এবং অন্য word- গুলো antonym।"}, {"id": "EL-0600", "page": 75, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "26", "question": "IMPROVEMENT", "source_tag": "৩০তম বিসিএস", "options": {"ক": "Promotion", "খ": "Advancement", "গ": "Betterment", "ঘ": "Preference"}, "answerKey": "গ", "answerText": "Betterment.", "explanation_bn": "Improvement/Betterment বলতে বুঝায় কোনো কিছুর নির্দিষ্ট অংশ বা দিকের উন্নতি। অপর দিকে Advancement হলো কোন কিছুর সামগ্রিক উন্নতি। Preference- অগ্রাধিকার।"}, {"id": "EL-0601", "page": 75, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "27", "question": "AMICABLE", "source_tag": "৩০তম বিসিএস", "options": {"ক": "Interesting", "খ": "Loving", "গ": "Affectionate", "ঘ": "Friendly"}, "answerKey": "ঘ", "answerText": "Friendly.", "explanation_bn": "Amicable-শান্তিপ্রবণ, বন্ধুত্বপূর্ণ; Interesting-আকর্ষণীয়, চিত্তাকর্ষক; Loving- প্রীতিপূর্ণ, স্নেহশীল; Affectionate-স্নেহময়, মমতাময় এবং Friendly-বন্ধুত্বপূর্ণ, বন্ধুসুলভ।"}, {"id": "EL-0602", "page": 75, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "28", "question": "When one is 'pragmatic' he is being-", "source_tag": "২৯তম বিসিএস", "options": {"ক": "wasteful", "খ": "productive", "গ": "practical", "ঘ": "fussy"}, "answerKey": "গ", "answerText": "practical.", "explanation_bn": "Pragmatic, practical, realistic, rational, reasonable- শব্দগুলোর অর্থ- বাস্তবভিত্তিক, বাস্তবিক, যুক্তিপূর্ণ বা ব্যবহারিক। অন্যদিকে, wasteful- অপচয় ঘটায় এমন; productive- উৎপাদনশীল; practical- ব্যবহারিক; এবং fussy- অস্থির/অতিব্যস্ত।"}, {"id": "EL-0603", "page": 76, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "29", "question": "The word 'precedence' means-", "source_tag": "২৮তম বিসিএস", "options": {"ক": "example", "খ": "priority", "গ": "elderly", "ঘ": "case"}, "answerKey": "খ", "answerText": "priority.", "explanation_bn": "Precedence, predominance, dominance, priority শব্দগুলোর অর্থ অগ্রাধিকার বা অগ্রগণ্যতা। Elderly অর্থ বয়োজ্যেষ্ঠ, প্রৌঢ়, প্রবীণ ইত্যাদি।"}, {"id": "EL-0604", "page": 76, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "30", "question": "The word 'disinterested' means-", "source_tag": "২৮তম বিসিএস", "options": {"ক": "lack of interest", "খ": "indifferent", "গ": "callous", "ঘ": "neutral"}, "answerKey": "ঘ", "answerText": "neutral.", "explanation_bn": "Lack of interest দ্বারা বোঝায় কোনো কিছুতে উৎসাহ বোধের অভাব। Indifferent শব্দের অর্থ উদাসীন। Callous শব্দের অর্থ- নির্বোধ, কঠিন, নির্মম, উদাসীন, অসাড় ইত্যাদি। Neutral শব্দের অর্থ কোনো পক্ষকেই সমর্থন করে না এমন, নিরপেক্ষ। Disinterested শব্দের অর্থ নিরপেক্ষ। অর্থাৎ neutral-এর সমার্থক। তবে Uninterest হলে সঠিক উত্তর হতো Lack of interest. অতএব সঠিক উত্তর neutral।"}, {"id": "EL-0605", "page": 76, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "31", "question": "The word bounty is closest in meaning to-", "source_tag": "২৭তম বিসিএস", "options": {"ক": "generosity", "খ": "familiar", "গ": "dividing line", "ঘ": "sympathy"}, "answerKey": "ক", "answerText": "generosity.", "explanation_bn": "Bounty, generosity, munificence, charity, liberality ইত্যাদি শব্দগুলোর অর্থ- উদারতা, মহানুভবতা ইত্যাদি। 'familiar' word-টির Synonym- well known, intimate, domestic, common ইত্যাদি এবং sympathy শব্দটির Synonym- community of feeling, compassion, pity ইত্যাদি। সুতরাং সঠিক উত্তর হবে generosity।"}, {"id": "EL-0606", "page": 76, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "32", "question": "The meaning of the word 'Obese' is-", "source_tag": "২৭তম বিসিএস", "options": {"ক": "very fat", "খ": "tardy", "গ": "ugly", "ঘ": "obnoxious"}, "answerKey": "ক", "answerText": "very fat.", "explanation_bn": "'Obese' বলতে বোঝায় 'very fat' বা, 'abnormally fat'। 'ugly'-শব্দটির অর্থ-'unpleasant to look at' or other senses, ill-natured ইত্যাদি। 'tardy' এর অর্থ 'slow', 'sluggish', 'late' ইত্যাদি। এবং 'obnoxious'-এর অর্থ objectionable, offensive ইত্যাদি।"}, {"id": "EL-0607", "page": 76, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "33", "question": "Identify the correct synonym for the word 'Magnanimous.'", "source_tag": "২৬তম বিসিএস", "options": {"ক": "generous", "খ": "unkind", "গ": "revengeful", "ঘ": "friendly"}, "answerKey": "ক", "answerText": "generous.", "explanation_bn": ""}, {"id": "EL-0608", "page": 76, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "34", "question": "The synonym for 'Obdurate'-", "source_tag": "২৪তম বিসিএস", "options": {"ক": "Deceitful", "খ": "Stubborn", "গ": "Sly", "ঘ": "Swindler"}, "answerKey": "খ", "answerText": "Stubborn.", "explanation_bn": "Deceitful-প্রতারণাপূর্ণ; Stubborn- অবাধ্য; Sly-চতুর, শঠ, ধূর্ত; Swindler- প্রতারক, জুয়াচোর; আর Obdurate- অর্থ একগুঁয়ে, অবাধ্য।"}, {"id": "EL-0609", "page": 76, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "35", "question": "'Viable'-", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "possible", "খ": "that can be done", "গ": "capable", "ঘ": "that will work"}, "answerKey": "খ ও গ", "answerText": "খ ও গ (both খ and গ)", "explanation_bn": "এখানে viable অর্থ টিকে থাকতে সমর্থ। Oxford Dictionary অনুযায়ী 'that can be done'- এটি viable-এর সমার্থক। তবে 'সমর্থ' অর্থে 'capable' ও সঠিক। সুতরাং 'খ' এবং 'গ' দুটিই সঠিক।"}, {"id": "EL-0610", "page": 76, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "36", "question": "Select the pair that best expresses a relationship similar to that expressed in the original pair. Conscious ... Careless.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "Careful ... Indifferent", "খ": "Graceful ... Ugly", "গ": "Generous ... Unkind", "ঘ": "Well-informed ... Knowing little"}, "answerKey": "ক", "answerText": "Careful ... Indifferent.", "explanation_bn": "Conscious অর্থ সচেতন, সজ্জান এবং Careless অর্থ অসচেতন, অসতর্ক, অমনোযোগী। অতএব শব্দজোড়ার মধ্যে antonymous relation রয়েছে। Careful- সচেতন, সজ্জান এবং Indifferent- উদাসীন, অমনোযোগী। Graceful- লাবণ্যময়, সুশ্রী, সুন্দর; Ugly-কুৎসিত, কদাকার; Generous-উদার, সদাশয়, দয়ালু; Unkind-নির্দয়, অসদাশয়, অনুদার প্রভৃতি। (ঘ)-তে আছে, Well-informed-ভালোভাবে জ্ঞাত। Knowing little- স্বল্প জ্ঞাত, ভালোভাবে জ্ঞাত নয়। প্রতিটি শব্দযুগল-ই মূল শব্দযুগলের ন্যায় Antonymous বা বিপরীত অর্থসম্পন্ন, তবে অর্থের ঘনিষ্ঠতা/প্রাসঙ্গিকতা বিবেচনায় (ক) কে সঠিক উত্তর বিবেচনা করা হয়েছে।"}, {"id": "EL-0611", "page": 77, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "37", "question": "'Handy'", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "comfortable", "খ": "useful", "গ": "convenient to handle or use", "ঘ": "necessary"}, "answerKey": "খ ও গ", "answerText": "খ ও গ (useful, convenient to handle or use)", "explanation_bn": "Comfortable-আরামদায়ক, useful-উপকারী, convenient to handle or use- ব্যবহার বা পরিচালনায় সুবিধাজনক এবং necessary- প্রয়োজনীয়। Handy শব্দটি দিয়ে (খ) এবং (গ) উভয় অর্থই প্রকাশ পায়।"}, {"id": "EL-0612", "page": 77, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "38", "question": "A synonym for 'resentment' is-", "source_tag": "২৩তম বিসিএস", "options": {"ক": "fear", "খ": "anger", "গ": "indignation", "ঘ": "panic"}, "answerKey": "গ", "answerText": "indignation.", "explanation_bn": "মূলশব্দ 'resentment' অর্থ হলো রাগ, বিরক্তি, ক্ষোভ; fear-ভয়; anger-রাগ, ক্ষোভ; Indignation-(অবিচারহেতু) ক্ষোভ, রোষ ইত্যাদি; panic- আতংক। এখানে anger এবং indignation কাছাকাছি হলেও indignation অধিকতর সঠিক উত্তর।"}, {"id": "EL-0613", "page": 77, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "39", "question": "INFRINGE means-", "source_tag": "১৮তম বিসিএস", "options": {"ক": "Transgress", "খ": "Purloin", "গ": "Invade", "ঘ": "Intrude"}, "answerKey": "ক", "answerText": "Transgress.", "explanation_bn": "Infringe, transgress, contravene, encroac অর্থ- ভঙ্গ করা, লঙ্ঘন করা, অতিক্রম করা। অন্যদিকে, Purloin-চুরি করা; Invade- হামলা করা, হানা দেওয়া এবং Intrude- অনধিকার প্রবেশ করা বা জোর করে প্রবেশ করা।"}, {"id": "EL-0614", "page": 77, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "40", "question": "BROCHURE means-", "source_tag": "১৮তম বিসিএস", "options": {"ক": "Opening", "খ": "Pamphlet", "গ": "Bureau", "ঘ": "Censor"}, "answerKey": "খ", "answerText": "Pamphlet.", "explanation_bn": "Brochure-(সংক্ষিপ্ত বিবরণ সমৃদ্ধ) পুস্তিকা। Opening-উদ্বোধন, সূচনা; Pamphlet-পুস্তিকা; Bureau-দফতর; Censor-কেটে বাদ দেয়া, পরীক্ষা করা।"}, {"id": "EL-0615", "page": 77, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "41", "question": "EQUIVOCAL means-", "source_tag": "১৮তম বিসিএস", "options": {"ক": "Universal", "খ": "Mistaken", "গ": "Quaint", "ঘ": "Clear"}, "answerKey": "খ", "answerText": "Mistaken.", "explanation_bn": "Equivocal, obscure, vague, cryptic, ambiguous-এর অর্থ- দ্ব্যর্থবোধক, অস্পষ্ট বা সন্দেহজনক। অন্যদিকে Universal-সর্বজনীন; Mistaken-ভ্রান্ত, ভ্রান্তক; Quaint- খেয়ালী; এবং Clear-স্পষ্ট, স্বচ্ছ, সন্দেহ মুক্ত। equivocal এবং mistaken শব্দ দুটি Synonymous।"}, {"id": "EL-0616", "page": 77, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "42", "question": "ILLUSIVE means-", "source_tag": "১৮তম বিসিএস", "options": {"ক": "Not deceptive", "খ": "Not certain", "গ": "Not obvious", "ঘ": "Not coherent"}, "answerKey": "খ", "answerText": "Not certain.", "explanation_bn": "Illusive- Deceptive, misleading (অলীক, ইন্দ্রজালিক, মায়াবী)। Not deceptive-ভ্রান্তিকর নয়, প্রতারণামূলক নয়। Not Certain-অনিশ্চিত, সন্দেহপূর্ণ, অবিশ্বাসযোগ্য; Not obvious-স্পষ্ট নয় এমন, অস্পষ্ট, অপরিষ্কার এবং Not coherent-অসঙ্গতিপূর্ণ, প্রঞ্জল নয়। (খ) যথাযথ অর্থ প্রকাশ না করলেও Closest meaning হওয়াতে এই Option টি-ই নির্বাচন করা হয়েছে।"}, {"id": "EL-0617", "page": 77, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "43", "question": "The synonym for 'efface'-", "source_tag": "১৭তম বিসিএস", "options": {"ক": "Improve", "খ": "Exhaust", "গ": "Rub out", "ঘ": "Cut out"}, "answerKey": "গ", "answerText": "Rub out.", "explanation_bn": "Efface, rub out, score out, erase, obliterate অর্থ- মুছে ফেলা, নিশ্চিহ্ন করা, বা বিলোপ করা। অন্যদিকে, improve অর্থ উন্নতি সাধন করা, উন্নততর করা; Exhaust-নিঃশেষ করা; এবং Cut out- থেমে যাওয়া, কেটে নেয়া।"}, {"id": "EL-0618", "page": 77, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "44", "question": "The synonym of 'Franchise'-", "source_tag": "১৭তম বিসিএস", "options": {"ক": "Privilege", "খ": "Utility", "গ": "French", "ঘ": "Frankness"}, "answerKey": "ক", "answerText": "Privilege.", "explanation_bn": ""}, {"id": "EL-0619", "page": 77, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "45", "question": "The synonym of 'genesis' is-", "source_tag": "১৬তম বিসিএস", "options": {"ক": "introduction", "খ": "preface", "গ": "beginning", "ঘ": "foreword"}, "answerKey": "গ", "answerText": "beginning.", "explanation_bn": "Genesis, commencement, start, outset অর্থ- প্রারম্ভ, সূচনা, প্রারম্ভিক বিন্দু। কাজেই এর synonym হবে beginning।"}, {"id": "EL-0620", "page": 77, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "46", "question": "What is the meaning of the word 'intrepid'?", "source_tag": "১৫তম বিসিএস", "options": {"ক": "arrogant", "খ": "questioning", "গ": "belligerent", "ঘ": "fearless"}, "answerKey": "ঘ", "answerText": "fearless.", "explanation_bn": "Intrepid, audacious, dauntless, brave, অর্থ-সাহসী, নির্ভীক, ভয়হীন; arrogant- উদ্ধত, বেয়াদব; belligerent-যুদ্ধরত, যুদ্ধমান; questioning- জিজ্ঞাসু এবং fearless- ভয়হীন, নির্ভীক।"}, {"id": "EL-0621", "page": 77, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "47", "question": "What is the synonym of 'incredible'?", "source_tag": "১৫তম বিসিএস", "options": {"ক": "Unbelievable", "খ": "Unthinkable", "গ": "Unlikely", "ঘ": "Unthinking"}, "answerKey": "ক", "answerText": "Unbelievable.", "explanation_bn": "Incredible-অবিশ্বাস্য, বিস্ময়কর, উউট। এর Synonyms- Unbelievable, astonishing, fantastic, তাছাড়া Unthinkable- অচিন্তনীয়; Unlikely- অসম্ভব এবং Unthinking-অচিন্ত্যপূর্ব।"}, {"id": "EL-0622", "page": 78, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "48", "question": "What is the meaning of the word 'scuttle'?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "to tease", "খ": "abandon", "গ": "Pile up", "ঘ": "gossip"}, "answerKey": "খ", "answerText": "abandon.", "explanation_bn": "Scuttle শব্দটি অর্থ কয়লার স্কুড়ি, (ঘরের মধ্যে) অগ্নিকুণ্ডে কয়লা সরবরাহের পাত্র বিশেষ; তড়িঘড়ি পালানো, দ্রুত পরিত্যাগ করা। To tease-উত্যাক্ত করা, বিরক্ত করা; Abandon-পরিত্যাগ করা, ছেড়ে দেয়া; Pile up- স্তূপ করা, জমা করা; Gossip- খোশগল্প করা, চুটকি রচনা করা। অতএব scuttle এর অর্থের সাথে Abandon এর মিল রয়েছে।"}, {"id": "EL-0623", "page": 78, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "49", "question": "What is the meaning of the word 'stanch'?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "to reinforce", "খ": "be weak", "গ": "smooth out", "ঘ": "put an end to"}, "answerKey": "ঘ", "answerText": "put an end to.", "explanation_bn": "Stanch-রোধ করা, বন্ধ করা, শেষ করা। To reinforce- শক্তিশালী করা, ক্ষমতা বৃদ্ধি করা, দৃঢ়তর করা। Be weak-দুর্বল হওয়া। Smooth out- মসৃণ করা, সমান করা। Put an end to- সাঙ্গ করা, শেষ করা, যবনিকা পাত করা। অর্থাৎ stanch এর অর্থের সাথে put an end to এর মিল রয়েছে।"}, {"id": "EL-0624", "page": 78, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "50", "question": "What is the meaning of the word 'belated'?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "complaining", "খ": "weak", "গ": "off hand", "ঘ": "tardy"}, "answerKey": "ঘ", "answerText": "tardy.", "explanation_bn": "Belated- অতিশয় ধীরে চলা, খুব দেরিতে আসা, অতিশয় ধীর, মন্থর; Complaining-অভিযোগ করার মতো; Off hand-তাৎক্ষণিক, উপস্থিত, পূর্বচিন্তা ছাড়া; Weak-দুর্বল, বলহীন; Tardy- ধীর, অতিশয় মন্থর। তাই belated এর প্রতিশব্দ Tardy।"}, {"id": "EL-0625", "page": 78, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "51", "question": "What is the meaning of the word 'sequences'?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "to follow", "খ": "round up", "গ": "withdraw", "ঘ": "question closely"}, "answerKey": "ক", "answerText": "to follow.", "explanation_bn": "Sequences- ক্রমসমূহ, পরস্পরসমূহ অনুক্রমিক বিষয়াবলি। To follow-অনুসরণ করা, ক্রম অনুসরণ করা; Round up-একক করা, পূর্ণসংখ্যায় নিয়ে আসা; Withdraw-উত্তোলন করা, তুলে নেয়া এবং Question closely-ঘনিষ্ঠভাবে/দৃঢ়ভাবে প্রশ্ন করা।"}, {"id": "EL-0626", "page": 78, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "52", "question": "What is the synonym of- 'Delude'?", "source_tag": "১২তম বিসিএস", "options": {"ক": "Demand", "খ": "Permit", "গ": "Aggravate", "ঘ": "Deceive"}, "answerKey": "ঘ", "answerText": "Deceive.", "explanation_bn": "Delude- প্রতারিত করা, বিভ্রান্ত করা। এখানে (ক) Demand- দাবি করা; (খ) Permit- অনুমোদন করা; (গ) Aggravate- হীনতর করা, অবনতি ঘটানো এবং (ঘ) Deceive- প্রতারণা করা, বিভ্রান্ত করা।"}, {"id": "EL-0627", "page": 78, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "53", "question": "What is the synonym of 'Incite'?", "source_tag": "১১তম বিসিএস", "options": {"ক": "Instigate", "খ": "Permit", "গ": "Urge", "ঘ": "Deceive"}, "answerKey": "ক", "answerText": "Instigate.", "explanation_bn": "Incite- খেপানো, উত্তেজিত করা, উসকানি দেওয়া, উদ্দীপ্ত করা। Instigate-প্ররোচিত করা, উসকানি দেওয়া। Permit- অনুমোদন করা, অনুমতি দেয়া। Urge- তাড়া দেওয়া, গুরুত্বারোপ করা। Deceive- প্রতারণা করা, ঠকানো। কাজেই Incite-এর synonym হচ্ছে Instigate।"}, {"id": "EL-0628", "page": 78, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "54", "question": "What is the synonym of 'Jovial'?", "source_tag": "১০তম বিসিএস", "options": {"ক": "Jolly", "খ": "Gay", "গ": "Jealous", "ঘ": "Happy"}, "answerKey": "ক", "answerText": "Jolly.", "explanation_bn": "Jovial, Jolly, Gay, Happy, festive ইত্যাদি শব্দগুলোর অর্থ-আনন্দচিত, হাসিখুশি, উচ্ছল, হাসিখুশি, প্রফুল্ল, সুখী, খুশি, তৃপ্ত ইত্যাদি। অপশনে একাধিক সঠিক উত্তর থাকলে ক্রমানুসারে প্রথম অপশনটি সঠিক উত্তর বলে বিবেচিত হয়।"}, {"id": "EL-0629", "page": 78, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Synonyms", "qno": "55", "question": "What is the synonym of 'Competent'?", "source_tag": "১০তম বিসিএস", "options": {"ক": "Circumspect", "খ": "Discrete", "গ": "Capable", "ঘ": "Prudent"}, "answerKey": "গ", "answerText": "Capable.", "explanation_bn": "Competent, capable, skilled, adroit-উপযুক্ত, সক্ষম, দক্ষ। অপশন (ক) Circumspect-সতর্ক; (খ) Discrete-পৃথক, আলাদা; (গ) Capable-সক্ষম, সমর্থ এবং (ঘ) Prudent-সতর্ক, দূরদর্শী, বিচক্ষণ।"}, {"id": "EL-0630", "page": 79, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "01", "question": "What is the antonym of 'percipience'?", "source_tag": "৫০তম বিসিএস", "options": {"ক": "shrewdness", "খ": "dullness", "গ": "discerning", "ঘ": "astuteness"}, "answerKey": "খ", "answerText": "dullness.", "explanation_bn": "percipience মানে তীক্ষ্ণ উপলব্ধি বা বিচক্ষণতা (keen perception)। এর বিপরীত হলো dullness বা ভোঁতা বুদ্ধি/অনুধাবনের অভাব। (ক) shrewdness (চতুরতা), (গ) discerning (সূক্ষ্ম বিচার-বুদ্ধি সম্পন্ন) এবং (ঘ) astuteness (বিচক্ষণতা)- কোনোটিই percipience এর বিপরীতার্থক বা Antonymous নয়।"}, {"id": "EL-0631", "page": 79, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "02", "question": "Choose the antonym of 'controversy':", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "contention", "খ": "bickering", "গ": "unanimity", "ঘ": "dispute"}, "answerKey": "গ", "answerText": "unanimity.", "explanation_bn": "Controversy-বিতর্ক, বিবাদ; contention- বিবাদ; bickering- ঝগড়া, কলহ; unanimity- ঐকমত্য; dispute- বিবাদ। সুতরাং Controversy শব্দটির antonym 'unanimity'।"}, {"id": "EL-0632", "page": 79, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "03", "question": "The antonym of 'boisterous' is-", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "noisy", "খ": "quit", "গ": "unruly", "ঘ": "cheerful"}, "answerKey": null, "answerText": "Blank (no option marked)", "flag": "⚠ Source shows answer as 'Blank' — no option marked in the original.", "explanation_bn": "Boisterous শব্দটির অর্থ অমার্জিত, উদ্যম, প্রচণ্ড। এর Synonym- clamorous, knockabout, fierce, rough, robustious. এর Antonym- quiet, tranquil, peaceful. অপশনে quit শব্দটি যদি Quiet হতো তাহলে প্রশ্নের boisterous শব্দটির বিপরীত শব্দ/antonym হতো।"}, {"id": "EL-0633", "page": 79, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "04", "question": "Antonym for Adieu-", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "Farewell", "খ": "Good bye", "গ": "Hello", "ঘ": "Valediction"}, "answerKey": "গ", "answerText": "Hello.", "explanation_bn": "Adieu অর্থ বিদায়। Good bye, farewell এবং Valediction এর Synonym. Antonym হবে Hello।"}, {"id": "EL-0634", "page": 79, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "05", "question": "The antonym for 'slothful' is-", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "playful", "খ": "sluggish", "গ": "energetic", "ঘ": "quarrelsome"}, "answerKey": "গ", "answerText": "energetic.", "explanation_bn": "Slothful এর বাংলা অর্থ অলস, অকর্মঠ, নিষ্ক্রিয়। এর Synonym-faineant, indolent, otiose, futile, lazy, sluggish এবং এর Antonym হবে energetic, gumpitious, industrious, untiring, hardworking ইত্যাদি। এদের অর্থ- কর্মঠ, কঠোর পরিশ্রমী ইত্যাদি।"}, {"id": "EL-0635", "page": 79, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "06", "question": "What is the antonym for the word 'deformation'?", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "distortion", "খ": "contortion", "গ": "wholeness", "ঘ": "disfigurement"}, "answerKey": "গ", "answerText": "wholeness.", "explanation_bn": "Deformation/distortion/contortion/disfigurement -এই শব্দগুলো পরস্পর সমার্থক। এদের অর্থ বিকৃতি। Wholeness, entirety, inclusiveness, soundness, absoluteness, perfectness ইত্যাদি শব্দগুলোর অর্থ সম্পূর্ণতা, অভিন্নতা, নিবুঁত্যতা, সম্পূর্ণ বস্তু ইত্যাদি।"}, {"id": "EL-0636", "page": 79, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "07", "question": "Which word means the opposite of 'dearth'?", "source_tag": "৪০তম বিসিএস", "options": {"ক": "lack", "খ": "abundance", "গ": "poverty", "ঘ": "shortage"}, "answerKey": "খ", "answerText": "abundance.", "explanation_bn": "Dearth, paucity, famine, scarcity, deficiency ইত্যাদি শব্দগুলোর অর্থ-অভাব, স্বল্পতা, আকাল, বা দুর্ভিক্ষ। এর বিপরীত শব্দ abundance (অতিপ্রাচুর্য)। তাছাড়া option- এর lack (অভাব, ঘাটতি); poverty (দরিদ্রতা) এবং shortage (ঘাটতি) হলো dearth- এর সমার্থক।"}, {"id": "EL-0637", "page": 79, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "08", "question": "Choose the word opposite in meaning to 'terse':", "source_tag": "৪১তম বিসিএস", "options": {"ক": "concise", "খ": "detailed", "গ": "expressive", "ঘ": "descriptive"}, "answerKey": "খ", "answerText": "detailed.", "explanation_bn": "Terse-সংক্ষিপ্ত। এর Synonym-concise, laconic, succinct, curt, compact ইত্যাদি। এর opposite meaning হলো detailed-বিশদ, সবিস্তার, পুঙ্খানুপুঙ্খ। এছাড়া expressive-স্পষ্ট, ভাবপ্রবণ; descriptive-বর্ণনামূলক।"}, {"id": "EL-0638", "page": 79, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "09", "question": "কোন শব্দযুগলটি ভিন্ন?", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "False, True", "খ": "Sharp, Blunt", "গ": "Love, Affection", "ঘ": "Abundance, Scarcity"}, "answerKey": "গ", "answerText": "Love, Affection.", "explanation_bn": "প্রতিটি শব্দ যুগলে পরস্পর বিপরীত শব্দ (Antonym) রয়েছে। কিন্তু Love -ভালোবাসা, স্নেহ, মমতা এবং Affection -স্নেহ, ভালোবাসা, মমতা ও শব্দযুগল সমার্থক (Synonym)।"}, {"id": "EL-0639", "page": 80, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "10", "question": "Which one is the correct antonym of 'frugal'?", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "extraordinary", "খ": "economical", "গ": "spendthrift", "ঘ": "authentic"}, "answerKey": "খ", "answerText": "spendthrift.", "explanation_bn": "Frugal, economical, sparing ইত্যাদি শব্দগুলোর অর্থ মিতব্যয়ী বা হিসাবি। এর সঠিক antonym হলো spendthrift, Prodigal, squanderer, improvident, extravagant, thriftless (অমিতব্যয়ী, অপব্যয়ী)। তাছাড়া, extraordinary শব্দের অর্থ অসাধারণ, আর authentic শব্দের অর্থ খাঁটি, অকৃত্রিম।"}, {"id": "EL-0640", "page": 80, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "11", "question": "Select the word that is the most closely opposite in meaning to the capitalized word: DELETERIOUS", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "toxic", "খ": "spurious", "গ": "harmless", "ঘ": "lethal"}, "answerKey": "গ", "answerText": "harmless.", "explanation_bn": "Deleterious, detrimental, injurious, hurtful, adverse ইত্যাদি শব্দগুলোর অর্থ- ক্ষতিকর, প্রতিকূল ইত্যাদি। option সমূহের মধ্যে Toxic-বিষাক্ত; Spurious-কৃত্রিম, মিথ্যা; harmless- অহিংস, যা ক্ষতি করে না; lethal-মারাত্মক ক্ষতিকর। অতএব অর্থের দিক থেকে deleterious এবং harmless পুরোপুরি opposite বা বিপরীতার্থক।"}, {"id": "EL-0641", "page": 80, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "12", "question": "What would be the right antonym for 'initiative'?", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "apathy", "খ": "indolence", "গ": "enterprise", "ঘ": "activity"}, "answerKey": "ক", "answerText": "apathy.", "explanation_bn": "Initiative, entrepreneurship, inaugural, first step, opening move ইত্যাদি শব্দগুলোর অর্থ- উদ্যোগ, প্রারম্ভ ইত্যাদি। Option গুলোর মধ্যে apathy- অর্থ অনীহা, অনাগ্রহ; indolence- অলসতা; enterprise- প্রারম্ভ, উদ্যোগ এবং activity-অর্থ কার্যকারিতা, সক্রিয়তা। Initiative-এর antonym হিসেবে apathy ও indolence দুই-ই হতে পারে। তবে, 'apathy' antonym হিসাবে most appropriate।"}, {"id": "EL-0642", "page": 80, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "13", "question": "Give the antonym of the word 'transitory'.", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "temporary", "খ": "permanent", "গ": "transparent", "ঘ": "short-lived"}, "answerKey": "খ", "answerText": "permanent.", "explanation_bn": "Transitory, ephemeral, transient, fugacious, passing ইত্যাদি শব্দগুলোর অর্থ-ক্ষণস্থায়ী বা স্বল্পস্থায়ী। Option -গুলোর মধ্যে temporary, transparent ও short-lived-এর অর্থ যথাক্রমে ক্ষণস্থায়ী, স্বচ্ছ, স্বল্পকালীন এবং Permanent অর্থ-স্থায়ী। সুতরাং transitory-এর antonym হচ্ছে permanent।"}, {"id": "EL-0643", "page": 80, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "14", "question": "What would be the best antonym of 'hibernate'?", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "dormancy", "খ": "liveliness", "গ": "sluggishness", "ঘ": "democracy"}, "answerKey": "খ", "answerText": "liveliness.", "explanation_bn": "Hibernate অর্থ-শীত যাপন করা; নিষ্ক্রিয় অবস্থায় থাকা বা অলসভাবে সময় কাটানো। Option-গুলোর মধ্যে dormancy অর্থ- সুপ্তাবস্থা, স্থগিত অবস্থা; liveliness- কর্মতৎপরতা, সক্রিয়তা; sluggishness- অলসতা, জড়তা এবং democracy অর্থ- গণতন্ত্র। সুতরাং hibernate এর antonym হচ্ছে liveliness।"}, {"id": "EL-0644", "page": 80, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "15", "question": "Choose the correct Antonym for: 'Oblige'.", "source_tag": "৩২তম বিসিএস", "options": {"ক": "Bind", "খ": "Require", "গ": "Bother", "ঘ": "Censure"}, "answerKey": "গ", "answerText": "Bother.", "explanation_bn": "Oblige অর্থ অনুগ্রহ করা বা বাধ্য করা। এর Synonym- obligate, compel, bind। Require অর্থ-প্রয়োজন হওয়া; Bother অর্থ- বিরক্ত বা জ্বালাতন করা; Censure অর্থ- সমালোচনা করা। এখানে oblige- এর antonym হলো bother।"}, {"id": "EL-0645", "page": 80, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "16", "question": "Choose the correct Antonym for: 'Cynical'.", "source_tag": "৩২তম বিসিএস", "options": {"ক": "Pessimistic", "খ": "Gullible", "গ": "Equivocal", "ঘ": "Liberal"}, "answerKey": "খ", "answerText": "Gullible.", "explanation_bn": "Cynical- নৈরাশ্যবাদী; অবিশ্বাসী। Pessimistic-হতাশাপ্রবণ; Gullible- অতিবিশ্বাসপ্রবণ; Equivocal-দ্ব্যর্থবোধক; Liberal- বদান্য; উদার। এখানে cynical-এর antonym হলো gullible।"}, {"id": "EL-0646", "page": 80, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "17", "question": "In each of the following questions, out of the given alternatives, choose the one that best expresses the opposite meaning of the given word: Repeal-", "source_tag": "৩১তম বিসিএস", "options": {"ক": "Abolish", "খ": "Enact", "গ": "Annul", "ঘ": "Nullify"}, "answerKey": "খ", "answerText": "Enact.", "explanation_bn": "Repeal-বাতিল করা; Abolish- লোপ করা; Enact-আইনে পরিণত করা; Annul-বাতিল করা; Nullify বাতিল করা। এখানে repeal এর opposite হচ্ছে enact. অন্য word-গুলো হচ্ছে synonyms।"}, {"id": "EL-0647", "page": 81, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "18", "question": "Equity-", "source_tag": "৩১তম বিসিএস", "options": {"ক": "Uprightness", "খ": "Justice", "গ": "Integrity", "ঘ": "Bias"}, "answerKey": "ঘ", "answerText": "Bias.", "explanation_bn": "Equity- ন্যায়পরায়ণতা; Uprightness- অকপটতা; Justice- ন্যায়পরায়ণতা; Integrity- সাধুতা; Bias পক্ষপাত। এখানে Bias হচ্ছে equity- এর Opposite।"}, {"id": "EL-0648", "page": 81, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "19", "question": "LIABILITY", "source_tag": "৩০তম বিসিএস", "options": {"ক": "Treasure", "খ": "Debt", "গ": "Assets", "ঘ": "Property"}, "answerKey": "গ", "answerText": "Assets.", "explanation_bn": "Liability-দায়; Treasure- অত্যন্ত মূল্যবান সম্পদ; Debt-ঋণ, দেনা; Assets- সম্পদ এবং Property-সম্পত্তি, বিত্ত। এখানে Liability-এর opposite বা বিপরীত হচ্ছে Assets।"}, {"id": "EL-0649", "page": 81, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "20", "question": "HATE", "source_tag": "৩০তম বিসিএস", "options": {"ক": "Admire", "খ": "Abhor", "গ": "Concern", "ঘ": "Loathe"}, "answerKey": "ক", "answerText": "Admire.", "explanation_bn": "Hate, despise, detest, execrate অর্থ- ঘৃণা করা, তীব্র অপছন্দ করা, Admire-প্রশংসা করা; Abhor -তীব্র ঘৃণা করা, Concern-উদ্বেগ; Loathe-অপছন্দ করা। এখানে Hate-এর Opposite বা বিপরীত হলো Admire।"}, {"id": "EL-0650", "page": 81, "chapter": "Chapter 05: Words and Compositions", "topic": "5.3 Synonyms and Antonyms - Antonyms", "qno": "21", "question": "The antonym for 'Recalcitrant' ___.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "Compliant", "খ": "Passive", "গ": "Indifferent", "ঘ": "Careful"}, "answerKey": "ক", "answerText": "Compliant.", "explanation_bn": "Recalcitrant, obdurate, refractory, defiant, abstinate, stubborn শব্দগুলোর অর্থ অবাধ্ oustache, mediaeval, measles, messenger, message, missionary, mausoleum।"}, {"id": "EL-0681", "page": 84, "chapter": "Chapter 05: Words and Compositions", "topic": "5.5 Usage of words as various parts of speech", "qno": "01", "question": "In which sentence 'Like' is used as a preposition?", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "He likes to eat fish", "খ": "he laughs like his father does", "গ": "He climbed the tree like a cat", "ঘ": "Like minded people are necessary to start a business"}, "answerKey": "গ", "answerText": "He climbed the tree like a cat.", "explanation_bn": "অপশন 'ক'তে Like শব্দটি Verb এর কাজ করেছে; অপশন 'খ'তে Like শব্দটি Conjunction হিসেবে ব্যবহৃত হয়েছে; অপশন 'গ'তে Like শব্দটি 'Cat' Noun এর পূর্বে বসে Verb এর সাথে Noun টির সম্পর্ক তৈরি করেছে। তাই এটি একটি Preposition; অপশন 'ঘ'তে Like শব্দটি Adjective হিসেবে ব্যবহৃত হয়েছে।"}, {"id": "EL-0682", "page": 84, "chapter": "Chapter 05: Words and Compositions", "topic": "5.5 Usage of words as various parts of speech", "qno": "02", "question": "Which 'but' is a preposition?", "source_tag": "৪১তম বিসিএস", "options": {"ক": "It is but right to admit our faults.", "খ": "What can we do but sit and wait?", "গ": "We tried hard, But did not succeed.", "ঘ": "There is no one but likes him."}, "answerKey": "খ", "answerText": "What can we do but sit and wait?", "explanation_bn": "It is but right to admit our faults. এখানে but শব্দটি একটি Adverb; What can we do but sit and wait? Sentence-টিতে but শব্দটি ছাড়া বা ব্যতীত অর্থে preposition হিসেবে ব্যবহৃত হয়েছে। তৃতীয় ও চতুর্থ Sentence-এ but শব্দটি Conjunction হিসেবে ব্যবহৃত হয়েছে।"}, {"id": "EL-0683", "page": 84, "chapter": "Chapter 05: Words and Compositions", "topic": "5.5 Usage of words as various parts of speech", "qno": "03", "question": "'Please write to me at the above address.' The word 'above' in this sentence is a/an-", "source_tag": "৪০তম বিসিএস", "options": {"ক": "noun", "খ": "adjective", "গ": "pronoun", "ঘ": "adverb"}, "answerKey": "খ", "answerText":
