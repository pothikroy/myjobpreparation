alyse the topic", "গ": "to present the main idea", "ঘ": "to expand the idea"}, "answerKey": "গ", "answerText": "to present the main idea.", "explanation_bn": ""}, {"id": "EL-0690", "page": 85, "chapter": "Chapter 05: Words and Compositions", "topic": "5.7 Paragraph/Letters", "qno": "04", "question": "An extra message added at the end of a letter after it is signed is called-", "source_tag": "৪০তম বিসিএস", "options": {"ক": "Corrigendum", "খ": "Postscript", "গ": "NB", "ঘ": "RSVP"}, "answerKey": "খ", "answerText": "Postscript.", "explanation_bn": "চিঠিতে স্বাক্ষরের পরে যুক্ত অতিরিক্ত বার্তা বা বাক্যাবলিকে বলা হয় postscript (পুনশ্চ)। অন্যদিকে corrigendum অর্থ শুদ্ধিপত্র, সংশোধনীয় বিষয়। NB (Nota Bene) অর্থ সতর্কতার সাথে লক্ষ করুন, লক্ষণীয় আর RSVP অর্থ দয়া করে জবাব দিন (please reply) যা আমন্ত্রণ কার্ডের নিচ প্রান্তে লেখা হয়।"}];

}

// ---- State containers (persisted) ----
let PROG = loadJSON('progress', {});          // id -> {status,bookmarked,notes,attempts,correctAttempts,wrongAttempts,studyCount,lastStudied,nextRevision,wrongDates:[],difficultyOverride}
let QUIZHIST = loadJSON('quizHistory', []);    // array of quiz result objects
let STUDYSESS = loadJSON('studySessions', {}); // topic -> {sessions,firstStudied,lastStudied,timeSpentSec,attempted,correct,wrong,mastered}
let STREAK = loadJSON('streak', {current:0,longest:0,lastDate:null,days:[]});
let SETTINGS = loadJSON('settings', {theme:'light', studyTimeOverrides:{}});
let DAILYPLAN = loadJSON('dailyPlan', {date:null,tasks:[]});
let TOPIC_TIME_OVERRIDE = loadJSON('topicTimeOverride', {});

function persistAll(){
  try{
    saveJSON('progress', PROG);
    saveJSON('quizHistory', QUIZHIST);
    saveJSON('studySessions', STUDYSESS);
    saveJSON('streak', STREAK);
    saveJSON('settings', SETTINGS);
    saveJSON('dailyPlan', DAILYPLAN);
    saveJSON('topicTimeOverride', TOPIC_TIME_OVERRIDE);
  }catch(e){ /* never let persistence errors break the UI */ }
}

function getProg(id){
  if(!PROG[id]){
    PROG[id] = {status:'not-reviewed', bookmarked:false, notes:'', attempts:0, correctAttempts:0, wrongAttempts:0,
      studyCount:0, lastStudied:null, nextRevision:null, wrongDates:[], difficultyOverride:null, intervalIdx:-1};
  }
  return PROG[id];
}

const SR_INTERVALS = [1,3,7,14,30,60]; // days

function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days){
  const d = dateStr? new Date(dateStr) : new Date();
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function daysBetween(a,b){
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

// mark study streak for today
function touchStreak(){
  const t = todayStr();
  if(STREAK.lastDate === t) { persistAll(); return; }
  if(STREAK.lastDate){
    const gap = daysBetween(STREAK.lastDate, t);
    if(gap === 1){ STREAK.current += 1; }
    else if(gap > 1){ STREAK.current = 1; }
  } else {
    STREAK.current = 1;
  }
  STREAK.longest = Math.max(STREAK.longest, STREAK.current);
  STREAK.lastDate = t;
  if(!STREAK.days.includes(t)) STREAK.days.push(t);
  persistAll();
}

// Spaced repetition update after an answer or quick-revision rating
// outcome: 'correct' | 'wrong' | 'forgot' | 'almost' | 'knew' | 'mastered'
function updateSpacedRepetition(id, outcome){
  const p = getProg(id);
  p.studyCount += 1;
  p.lastStudied = todayStr();
  const positive = (outcome==='correct' || outcome==='knew' || outcome==='mastered');
  const negative = (outcome==='wrong' || outcome==='forgot');
  if(positive){
    p.correctAttempts += 1;
    p.attempts += 1;
    p.intervalIdx = Math.min(p.intervalIdx+1, SR_INTERVALS.length-1);
    if(outcome==='mastered'){ p.intervalIdx = SR_INTERVALS.length-1; p.status='mastered'; }
    else if(p.intervalIdx >= 3 && p.status!=='mastered'){ p.status = 'learning'; }
    else if(p.status==='not-reviewed'){ p.status='learning'; }
  } else if(negative){
    p.wrongAttempts += 1;
    p.attempts += 1;
    p.wrongDates.push(todayStr());
    p.intervalIdx = 0;
    p.status = (outcome==='forgot') ? 'need-revision' : 'needs-practice';
  } else if(outcome==='almost'){
    p.intervalIdx = Math.max(0, p.intervalIdx);
    p.status = 'needs-practice';
  }
  const interval = SR_INTERVALS[Math.max(0,p.intervalIdx)];
  p.nextRevision = addDays(todayStr(), interval);
  persistAll();
}

function setStatus(id, status){
  const p = getProg(id); p.status = status;
  if(status==='mastered'){ p.intervalIdx = SR_INTERVALS.length-1; p.nextRevision = addDays(todayStr(), SR_INTERVALS[p.intervalIdx]); }
  persistAll();
}
function toggleBookmark(id){
  const p = getProg(id); p.bookmarked = !p.bookmarked; persistAll(); return p.bookmarked;
}
function setNote(id, text){ getProg(id).notes = text; persistAll(); }

function isRevisionDue(id){
  const p = PROG[id];
  if(!p || !p.nextRevision) return false;
  return p.nextRevision <= todayStr();
}

/* ============ Derived stats ============ */
function allQuestions(){ return window.QUESTIONS; }

function topicList(){
  const map = {};
  for(const q of allQuestions()){
    if(!map[q.topic]) map[q.topic] = {topic:q.topic, chapter:q.chapter, items:[]};
    map[q.topic].items.push(q);
  }
  return Object.values(map);
}

function topicStats(topicName){
  const items = allQuestions().filter(q=>q.topic===topicName);
  let attempted=0, correct=0, wrong=0, mastered=0, revisionDue=0, bookmarked=0;
  for(const q of items){
    const p = PROG[q.id];
    if(p && p.attempts>0) attempted++;
    if(p) { correct += p.correctAttempts; wrong += p.wrongAttempts; }
    if(p && p.status==='mastered') mastered++;
    if(p && p.bookmarked) bookmarked++;
    if(isRevisionDue(q.id)) revisionDue++;
  }
  const total = items.length;
  const accuracy = (correct+wrong)>0 ? Math.round(100*correct/(correct+wrong)) : null;
  const sess = STUDYSESS[topicName] || {sessions:0, firstStudied:null, lastStudied:null, timeSpentSec:0};
  return {total, attempted, correct, wrong, mastered, revisionDue, bookmarked, accuracy, sess};
}

function topicStrength(topicName){
  const s = topicStats(topicName);
  if(s.attempted===0) return 'weak';
  if(s.mastered === s.total && s.total>0) return 'mastered';
  const acc = s.accuracy===null? 0 : s.accuracy;
  const coverage = s.attempted/s.total;
  const score = acc*0.6 + coverage*100*0.4;
  if(score>=80) return 'strong';
  if(score>=50) return 'average';
  return 'weak';
}

function estimateStudyTime(topicName){
  if(TOPIC_TIME_OVERRIDE[topicName]) return TOPIC_TIME_OVERRIDE[topicName];
  const items = allQuestions().filter(q=>q.topic===topicName);
  const n = items.length;
  const explLen = items.reduce((a,q)=>a+(q.explanation_bn||'').length,0);
  const first = Math.max(10, Math.round(n*1.2 + explLen/900));
  const rev = Math.max(5, Math.round(n*0.35));
  return {first, rev};
}

function globalStats(){
  const qs = allQuestions();
  let attempted=0, correct=0, wrong=0, mastered=0, revisionDue=0, bookmarked=0, unanswered=0;
  for(const q of qs){
    const p = PROG[q.id];
    if(p && p.attempts>0) attempted++; else unanswered++;
    if(p){ correct+=p.correctAttempts; wrong+=p.wrongAttempts; }
    if(p && p.status==='mastered') mastered++;
    if(p && p.bookmarked) bookmarked++;
    if(isRevisionDue(q.id)) revisionDue++;
  }
  const totalSessions = Object.values(STUDYSESS).reduce((a,s)=>a+(s.sessions||0),0);
  const totalTimeSec = Object.values(STUDYSESS).reduce((a,s)=>a+(s.timeSpentSec||0),0);
  return {
    totalQuestions: qs.length, totalTopics: topicList().length,
    attempted, unanswered, correct, wrong, mastered, revisionDue, bookmarked,
    accuracy: (correct+wrong)>0? Math.round(100*correct/(correct+wrong)) : null,
    totalSessions, totalTimeMin: Math.round(totalTimeSec/60),
    streak: STREAK.current, longestStreak: STREAK.longest
  };
}

function mistakeList(){
  const qs = allQuestions().filter(q=>{
    const p = PROG[q.id]; return p && p.wrongAttempts>0;
  });
  return qs.map(q=>({q, p:PROG[q.id]})).sort((a,b)=>{
    // frequently wrong first, then recently wrong, then overdue
    if(b.p.wrongAttempts !== a.p.wrongAttempts) return b.p.wrongAttempts - a.p.wrongAttempts;
    const ad = a.p.wrongDates[a.p.wrongDates.length-1]||'';
    const bd = b.p.wrongDates[b.p.wrongDates.length-1]||'';
    return bd.localeCompare(ad);
  }).map(x=>x.q);
}

function bookmarkList(){
  return allQuestions().filter(q=> PROG[q.id] && PROG[q.id].bookmarked);
}
function revisionDueList(){
  return allQuestions().filter(q=> isRevisionDue(q.id));
}

function weakTopics(n){
  return topicList().map(t=>t.topic).filter(t=>topicStrength(t)==='weak')
    .sort((a,b)=> topicStats(a).attempted - topicStats(b).attempted).slice(0,n||5);
}
function strongTopics(n){
  return topicList().map(t=>t.topic).filter(t=>{const s=topicStrength(t); return s==='strong'||s==='mastered';}).slice(0,n||5);
}

/* Recommendation engine for "What should I study now?" */
function recommendations(){
  const recs = [];
  const due = revisionDueList();
  if(due.length>0) recs.push({type:'revision', label:`${due.length} question(s) due for revision`, action:'#/revision-due', icon:'&#8635;'});
  const mistakes = mistakeList();
  if(mistakes.length>0) recs.push({type:'mistakes', label:`${mistakes.length} question(s) in My Mistakes need another look`, action:'#/mistakes', icon:'&#10007;'});
  const weak = weakTopics(3);
  if(weak.length>0) recs.push({type:'weak', label:`Weak topic: ${weak[0]}`, action:'#/topic/'+encodeURIComponent(weak[0]), icon:'&#9888;'});
  const unattempted = allQuestions().filter(q=>!PROG[q.id] || PROG[q.id].attempts===0);
  if(unattempted.length>0) recs.push({type:'new', label:`${unattempted.length} question(s) not yet attempted`, action:'#/topics', icon:'&#9998;'});
  recs.push({type:'quick', label:'Quick Revision session (5 min)', action:'#/quick-revision', icon:'&#9889;'});
  return recs.slice(0,5);
}

/* Revision priority classification for dashboard */
function revisionPriority(q){
  const p = PROG[q.id];
  if(!p) return 'medium';
  if(p.status==='mastered') return 'low';
  const overdue = p.nextRevision && p.nextRevision < todayStr();
  if(overdue || p.wrongAttempts>=2) return 'high';
  if(p.attempts>0 && p.status!=='mastered') return 'medium';
  return 'low';
}

<script>
/* ============ Router & shell ============ */
const $content = ()=>document.getElementById('content');
const $ = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function slugify(s){ return encodeURIComponent(s); }

function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

const ROUTES = [
  {path:'dashboard', icon:'&#127968;', label:'Dashboard'},
  {path:'topics', icon:'&#128218;', label:'Topics'},
  {path:'revision-due', icon:'&#128260;', label:'Revision Due', badge:()=>revisionDueList().length},
  {path:'mistakes', icon:'&#10007;', label:'My Mistakes', badge:()=>mistakeList().length},
  {path:'bookmarks', icon:'&#9733;', label:'Bookmarked', badge:()=>bookmarkList().length},
  {path:'quiz-setup', icon:'&#128221;', label:'Quiz Mode'},
  {path:'quick-revision', icon:'&#9889;', label:'Quick Revision'},
  {path:'focus-setup', icon:'&#9201;', label:'Focus Mode'},
  {path:'progress', icon:'&#128202;', label:'Progress'},
  {path:'study-plan', icon:'&#128197;', label:"Today's Plan"},
  {path:'settings', icon:'&#9881;', label:'Settings'},
];

function renderSidebar(activePath){
  const html = ROUTES.map(r=>{
    const badge = r.badge ? r.badge() : null;
    return `<button class="nav-item ${activePath===r.path?'active':''}" data-route="${r.path}">
      <span class="icon">${r.icon}</span><span>${r.label}</span>
      ${badge?`<span class="nav-badge">${badge}</span>`:''}
    </button>`;
  }).join('');
  document.getElementById('sidebarNav').innerHTML = html;
  $$('#sidebarNav .nav-item').forEach(btn=>{
    btn.addEventListener('click', ()=>{ location.hash = '#/'+btn.dataset.route; closeSidebarMobile(); });
  });
}
function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

function currentRouteBase(){
  const h = location.hash.replace('#/','');
  return h.split('/')[0] || 'dashboard';
}

function router(){
  const hash = location.hash.replace('#/','') || 'dashboard';
  const parts = hash.split('/');
  const base = parts[0];
  renderSidebar(base);
  window.scrollTo(0,0);
  switch(base){
    case 'dashboard': return viewDashboard();
    case 'topics': return viewTopics();
    case 'topic': return viewTopicStudy(decodeURIComponent(parts[1]||''));
    case 'revision-due': return viewQuestionList('Revision Due', revisionDueList(), 'No revisions due right now — nice work! Check back later or explore Topics.');
    case 'mistakes': return viewQuestionList('My Mistakes', mistakeList(), "You haven't missed any questions yet. Keep it that way!");
    case 'bookmarks': return viewQuestionList('Bookmarked Questions', bookmarkList(), 'No bookmarks yet. Tap the star on any question to save it here.');
    case 'quiz-setup': return viewQuizSetup();
    case 'quiz-run': return viewQuizRun(parts[1]);
    case 'quiz-results': return viewQuizResults(parts[1]);
    case 'quick-revision': return viewQuickRevision();
    case 'focus-setup': return viewFocusSetup();
    case 'focus-run': return viewFocusRun(decodeURIComponent(parts[1]||''));
    case 'progress': return viewProgress();
    case 'study-plan': return viewStudyPlan();
    case 'settings': return viewSettings();
    case 'search': return viewSearch(decodeURIComponent(parts[1]||''));
    default: return viewDashboard();
  }
}
window.addEventListener('hashchange', router);

/* ============ Shared components ============ */
function statCard(num, label, cls){
  return `<div class="stat-card ${cls||''}"><div class="num">${num}</div><div class="label">${label}</div></div>`;
}

function questionCard(q, opts){
  opts = opts || {};
  const p = getProg(q.id);
  const revealed = opts.forceRevealed || REVEALED.has(q.id);
  const quizMode = !!opts.quizMode;
  const selKey = opts.selectedKey;
  let optsHtml = Object.entries(q.options).map(([k,v])=>{
    let cls = 'option';
    if((revealed || (quizMode && opts.submitted))){
      if(k===q.answerKey) cls += ' correct';
      else if(quizMode && k===selKey) cls += ' incorrect';
    } else if(quizMode && k===selKey){
      cls += ' selected';
    }
    return `<div class="${cls}" data-key="${k}" data-qid="${q.id}">
      <span class="lab">${k}.</span><span class="bn">${esc(v)}</span>
    </div>`;
  }).join('');

  let explHtml = '';
  if(revealed || (quizMode && opts.submitted)){
    let table1 = q.explanation_table ? renderTable(q.explanation_table) : '';
    let table2 = q.explanation_table_2 ? renderTable(q.explanation_table_2) : '';
    explHtml = `<div class="explanation-box bn">
      <div class="exp-label">&#128214; Original Source Explanation</div>
      ${q.explanation_bn ? `<div>${esc(q.explanation_bn)}</div>` : '<div style="color:var(--ink-500)">(No explanation given in source for this item.)</div>'}
      ${table1}${table2}
      ${q.flag? `<div class="flag-box">${esc(q.flag)}</div>`:''}
      <div style="margin-top:8px;font-size:12px;color:var(--ink-500)">Answer: <b>${q.answerKey? q.answerKey+'. '+esc(q.answerText||'') : esc(q.answerText||'Not specified in source')}</b> &middot; Source: English Language.pdf — Page ${q.page}</div>
    </div>`;
  }

  const statusPill = `<span class="pill status-${p.status}">${statusLabel(p.status)}</span>`;
  const bookmarkIcon = p.bookmarked ? '&#9733;' : '&#9734;';

  return `<div class="qcard" id="qcard-${q.id}" data-qid="${q.id}">
    <div class="qhead">
      <div>
        <span class="qnum">Q${q.qno||''}</span> ${statusPill}
        ${q.source_tag? `<span class="qsource bn"> &middot; ${esc(q.source_tag)}</span>`:''}
      </div>
      <button class="icon-btn bookmark-btn" data-qid="${q.id}" title="Bookmark" style="width:30px;height:30px;font-size:16px;">${bookmarkIcon}</button>
    </div>
    <div class="qtext bn">${esc(q.question)}</div>
    <div class="options-list">${optsHtml}</div>
    ${!quizMode ? (revealed ? '' : `<button class="reveal-btn" data-qid="${q.id}">Reveal Answer</button>`) : ''}
    ${explHtml}
    ${!quizMode ? `
    <div class="qfooter">
      <div class="qactions">
        <button class="btn btn-sm" data-act="knew" data-qid="${q.id}">&#10003; I knew this</button>
        <button class="btn btn-sm" data-act="wrong" data-qid="${q.id}">&#10007; Got this wrong</button>
        <button class="btn btn-sm" data-act="revision" data-qid="${q.id}">&#8635; Need revision</button>
        <button class="btn btn-sm" data-act="mastered" data-qid="${q.id}">&#9733; Mastered</button>
      </div>
      <button class="btn btn-sm notes-toggle" data-qid="${q.id}">&#128221; Notes ${p.notes? '('+Math.min(p.notes.length,99)+')':''}</button>
    </div>
    <div class="qmeta-row">
      <span>Studied: ${p.studyCount||0}x</span>
      <span>Attempts: ${p.attempts||0}</span>
      ${p.nextRevision? `<span>Next revision: ${p.nextRevision}</span>`:''}
      <span>Topic: ${esc(q.topic)}</span>
    </div>
    <div class="notes-box" id="notes-${q.id}" style="display:none;">
      <textarea placeholder="My Notes (separate from source material)...">${esc(p.notes||'')}</textarea>
      <div style="margin-top:6px;"><button class="btn btn-sm btn-primary save-note" data-qid="${q.id}">Save note</button></div>
    </div>
    `:''}
  </div>`;
}
function renderTable(tbl){
  if(!tbl || !tbl.length) return '';
  let rows = tbl.map((r,i)=>`<tr>${r.map(c=>`<td class="bn">${esc(c)}</td>`).join('')}</tr>`).join('');
  return `<table class="explanation-table">${rows}</table>`;
}
function statusLabel(s){
  return {'not-reviewed':'Not Reviewed','learning':'Learning','needs-practice':'Needs Practice','need-revision':'Need Revision','mastered':'Mastered'}[s]||s;
}

const REVEALED = new Set();

function bindQuestionCardEvents(root){
  $$('.reveal-btn', root).forEach(btn=>btn.addEventListener('click', ()=>{
    REVEALED.add(btn.dataset.qid);
    reRenderQuestionCard(btn.dataset.qid);
  }));
  $$('.bookmark-btn', root).forEach(btn=>btn.addEventListener('click', ()=>{
    const on = toggleBookmark(btn.dataset.qid);
    btn.innerHTML = on? '&#9733;':'&#9734;';
    toast(on? 'Bookmarked':'Bookmark removed');
    refreshBadges();
  }));
  $$('.notes-toggle', root).forEach(btn=>btn.addEventListener('click', ()=>{
    const box = document.getElementById('notes-'+btn.dataset.qid);
    box.style.display = box.style.display==='none' ? 'block':'none';
  }));
  $$('.save-note', root).forEach(btn=>btn.addEventListener('click', ()=>{
    const ta = document.querySelector('#notes-'+btn.dataset.qid+' textarea');
    setNote(btn.dataset.qid, ta.value);
    toast('Note saved');
    reRenderQuestionCard(btn.dataset.qid);
  }));
  $$('.qactions [data-act]', root).forEach(btn=>btn.addEventListener('click', ()=>{
    const qid = btn.dataset.qid, act = btn.dataset.act;
    touchStreak();
    if(act==='knew') updateSpacedRepetition(qid,'correct');
    else if(act==='wrong') updateSpacedRepetition(qid,'wrong');
    else if(act==='revision') setStatus(qid,'need-revision');
    else if(act==='mastered') updateSpacedRepetition(qid,'mastered');
    toast('Updated');
    reRenderQuestionCard(qid);
    refreshBadges();
  }));
}
function reRenderQuestionCard(qid){
  const q = allQuestions().find(x=>x.id===qid);
  const el = document.getElementById('qcard-'+qid);
  if(!el || !q) return;
  el.outerHTML = questionCard(q);
  bindQuestionCardEvents(document.getElementById('qcard-'+qid).parentElement);
}
function refreshBadges(){ renderSidebar(currentRouteBase()); }

<script>

function topicCardHtml(topicName){
  const s = topicStats(topicName);
  const strength = topicStrength(topicName);
  const pct = s.total? Math.round(100*s.attempted/s.total) : 0;
  return `<a class="topic-card" href="#/topic/${slugify(topicName)}">
    <div class="chapter-label">${esc((topicList().find(t=>t.topic===topicName)||{}).chapter||'')}</div>
    <h3 class="bn">${esc(topicName)}</h3>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="row">
      <span>${s.attempted}/${s.total} attempted</span>
      <span class="pill strength-${strength}">${strength}</span>
    </div>
  </a>`;
}

}

/* ============ Topic study page ============ */
function viewTopicStudy(topicName){
  const items = allQuestions().filter(q=>q.topic===topicName);
  if(items.length===0){ $content().innerHTML = `<p>Topic not found.</p>`; return; }
  const s = topicStats(topicName);
  const strength = topicStrength(topicName);
  const time = estimateStudyTime(topicName);
  const chapter = items[0].chapter;

  $content().innerHTML = `
    <a href="#/topics" style="font-size:12.5px; color:var(--ink-500);">&larr; All Topics</a>
    <div class="chapter-label" style="margin-top:8px;">${esc(chapter)}</div>
    <h1 class="bn">${esc(topicName)}</h1>
    <div class="stat-grid">
      ${statCard(s.total,'Questions')}
      ${statCard(s.attempted,'Attempted')}
      ${statCard(s.accuracy===null?'—':s.accuracy+'%','Accuracy')}
      ${statCard(s.mastered,'Mastered','good')}
      ${statCard(s.revisionDue,'Needs Revision','danger')}
      ${statCard(s.sess.sessions||0,'Study Sessions')}
    </div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; align-items:center;">
        <div style="font-size:13px; color:var(--ink-700);">
          <div><b>Strength:</b> <span class="pill strength-${strength}">${strength}</span></div>
          <div style="margin-top:4px;"><b>Last studied:</b> ${s.sess.lastStudied || 'Never'}</div>
          <div style="margin-top:4px;"><b>Suggested study time:</b> First study ~${time.first} min &middot; Revision ~${time.rev} min</div>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="startSessionBtn">&#9654; Start Study Session</button>
          <button class="btn" id="focusModeBtn">&#9201; Focus Mode</button>
        </div>
      </div>
    </div>

    <div class="filter-bar" style="margin-top:18px;">
      <button class="chip active" data-filter="all">All (${items.length})</button>
      <button class="chip" data-filter="not-reviewed">Not Reviewed</button>
      <button class="chip" data-filter="learning">Learning</button>
      <button class="chip" data-filter="needs-practice">Needs Practice</button>
      <button class="chip" data-filter="need-revision">Need Revision</button>
      <button class="chip" data-filter="mastered">Mastered</button>
      <button class="chip" data-filter="bookmarked">Bookmarked</button>
    </div>
    <div id="topicQList"></div>
  `;
  function renderList(filter){
    let list = items;
    if(filter && filter!=='all'){
      if(filter==='bookmarked') list = items.filter(q=> PROG[q.id] && PROG[q.id].bookmarked);
      else list = items.filter(q=> (PROG[q.id]?PROG[q.id].status:'not-reviewed')===filter);
    }
    const el = document.getElementById('topicQList');
    el.innerHTML = list.map(q=>questionCard(q)).join('') || `<div class="empty-state"><div class="icon">&#128269;</div><p>No questions match this filter.</p></div>`;
    bindQuestionCardEvents(el);
  }
  renderList('all');
  $$('.chip').forEach(c=>c.addEventListener('click', ()=>{
    $$('.chip').forEach(x=>x.classList.remove('active')); c.classList.add('active');
    renderList(c.dataset.filter);
  }));
  document.getElementById('startSessionBtn').addEventListener('click', ()=>{
    touchStreak();
    if(!STUDYSESS[topicName]) STUDYSESS[topicName] = {sessions:0, firstStudied:null, lastStudied:null, timeSpentSec:0};
    const sess = STUDYSESS[topicName];
    sess.sessions += 1;
    if(!sess.firstStudied) sess.firstStudied = todayStr();
    sess.lastStudied = todayStr();
    persistAll();
    toast('Study session +1 logged');
    viewTopicStudy(topicName);
  });
  document.getElementById('focusModeBtn').addEventListener('click', ()=>{
    location.hash = '#/focus-run/'+slugify(topicName);
  });
}

/* ============ Generic question list view (Revision Due, Mistakes, Bookmarks) ============ */
function viewQuestionList(title, items, emptyMsg){
  $content().innerHTML = `
    <h1>${title}</h1>
    <p style="color:var(--ink-500); margin-top:-6px;">${items.length} question(s)</p>
    <div id="qlist"></div>
  `;
  const el = document.getElementById('qlist');
  if(items.length===0){
    el.innerHTML = `<div class="empty-state"><div class="icon">&#10003;</div><p>${emptyMsg}</p></div>`;
    return;
  }
  el.innerHTML = items.map(q=>questionCard(q)).join('');
  bindQuestionCardEvents(el);
}

/* ============ Search ============ */
function viewSearch(query){
  const q = (query||'').trim().toLowerCase();
  let results = [];
  if(q.length>0){
    results = allQuestions().filter(item=>{
      return (item.question||'').toLowerCase().includes(q) ||
        Object.values(item.options||{}).some(v=>(v||'').toLowerCase().includes(q)) ||
        (item.topic||'').toLowerCase().includes(q) ||
        (item.explanation_bn||'').toLowerCase().includes(q) ||
        (item.answerText||'').toLowerCase().includes(q);
    });
  }
  $content().innerHTML = `
    <h1>Search Results</h1>
    <p style="color:var(--ink-500); margin-top:-6px;">"${esc(query)}" &middot; ${results.length} result(s)</p>
    <div id="qlist"></div>
  `;
  const el = document.getElementById('qlist');
  el.innerHTML = results.length? results.map(x=>questionCard(x)).join('') : `<div class="empty-state"><div class="icon">&#128269;</div><p>No matches found.</p></div>`;
  bindQuestionCardEvents(el);
}

</script>
<script>
/* ============ Quiz Mode ============ */
let CURRENT_QUIZ = null;

function poolForScope(scope, topicName){
  const qs = allQuestions();
  switch(scope){
    case 'all': return qs;
    case 'topic': return qs.filter(q=>q.topic===topicName);
    case 'revision-due': return revisionDueList();
    case 'mistakes': return mistakeList();
    case 'bookmarked': return bookmarkList();
    case 'unanswered': return qs.filter(q=>!PROG[q.id]||PROG[q.id].attempts===0);
    case 'learning': return qs.filter(q=>PROG[q.id]&&PROG[q.id].status==='learning');
    case 'mastered': return qs.filter(q=>PROG[q.id]&&PROG[q.id].status==='mastered');
    default: return qs;
  }
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function viewQuizSetup(){
  const topics = topicList().map(t=>t.topic);
  $content().innerHTML = `
    <h1>&#128221; Quiz Mode</h1>
    <p style="color:var(--ink-500); margin-top:-6px;">Configure a practice quiz from any slice of the question bank.</p>
    <div class="card">
      <div class="setup-grid">
        <div class="setup-block">
          <h4>Scope</h4>
          <div class="radio-row" id="scopeRow">
            ${[['all','Entire Syllabus'],['topic','Specific Topic'],['revision-due','Revision Due'],['mistakes','My Mistakes'],['bookmarked','Bookmarked'],['unanswered','Unanswered'],['learning','Learning'],['mastered','Mastered']]
              .map(([v,l],i)=>`<label class="radio-opt ${i===0?'sel':''}"><input type="radio" name="scope" value="${v}" ${i===0?'checked':''}><span>${l}</span></label>`).join('')}
          </div>
          <div id="topicPicker" style="display:none; margin-top:8px;">
            <select class="filter-select" id="topicSelect" style="width:100%;">
              ${topics.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="setup-block">
          <h4>Question Count</h4>
          <div class="radio-row" id="countRow">
            ${[10,20,30,50,'All'].map((c,i)=>`<label class="radio-opt ${i===0?'sel':''}"><input type="radio" name="count" value="${c}" ${i===0?'checked':''}><span>${c}</span></label>`).join('')}
          </div>
        </div>
        <div class="setup-block">
          <h4>Question Order</h4>
          <div class="radio-row" id="orderRow">
            <label class="radio-opt sel"><input type="radio" name="order" value="sequential" checked><span>Sequential</span></label>
            <label class="radio-opt"><input type="radio" name="order" value="random"><span>Random</span></label>
          </div>
        </div>
        <div class="setup-block">
          <h4>Option Order</h4>
          <div class="radio-row" id="optOrderRow">
            <label class="radio-opt sel"><input type="radio" name="optorder" value="original" checked><span>Original</span></label>
            <label class="radio-opt"><input type="radio" name="optorder" value="randomized"><span>Randomized</span></label>
          </div>
        </div>
      </div>
      <div style="margin-top:20px;"><button class="btn btn-primary" id="startQuizBtn">&#9654; Start Quiz</button></div>
    </div>
  `;
  document.querySelectorAll('#scopeRow input').forEach(r=>r.addEventListener('change', ()=>{
    document.querySelectorAll('#scopeRow .radio-opt').forEach(x=>x.classList.remove('sel'));
    r.closest('.radio-opt').classList.add('sel');
    document.getElementById('topicPicker').style.display = r.value==='topic' ? 'block':'none';
  }));
  ['countRow','orderRow','optOrderRow'].forEach(id=>{
    document.querySelectorAll('#'+id+' input').forEach(r=>r.addEventListener('change', ()=>{
      document.querySelectorAll('#'+id+' .radio-opt').forEach(x=>x.classList.remove('sel'));
      r.closest('.radio-opt').classList.add('sel');
    }));
  });
  document.getElementById('startQuizBtn').addEventListener('click', ()=>{
    const scope = document.querySelector('#scopeRow input:checked').value;
    const topicName = document.getElementById('topicSelect') ? document.getElementById('topicSelect').value : null;
    const countRaw = document.querySelector('#countRow input:checked').value;
    const order = document.querySelector('#orderRow input:checked').value;
    const optOrder = document.querySelector('#optOrderRow input:checked').value;
    let pool = poolForScope(scope, topicName);
    if(pool.length===0){ toast('No questions available for this scope'); return; }
    if(order==='random') pool = shuffle(pool);
    const count = countRaw==='All' ? pool.length : Math.min(parseInt(countRaw), pool.length);
    pool = pool.slice(0, count);
    const quizQs = pool.map(q=>{
      let keys = Object.keys(q.options);
      if(optOrder==='randomized') keys = shuffle(keys);
      return {id:q.id, keyOrder:keys};
    });
    CURRENT_QUIZ = {
      id: 'quiz_'+Date.now(), scope, topicName, order, optOrder,
      questions: quizQs, current:0, answers:{}, startedAt: Date.now(), finished:false
    };
    location.hash = '#/quiz-run/'+CURRENT_QUIZ.id;
  });
}

function viewQuizRun(quizId){
  if(!CURRENT_QUIZ || CURRENT_QUIZ.id!==quizId){ location.hash='#/quiz-setup'; return; }
  renderQuizQuestion();
}
function renderQuizQuestion(){
  const quiz = CURRENT_QUIZ;
  const idx = quiz.current;
  const total = quiz.questions.length;
  const qref = quiz.questions[idx];
  const q = allQuestions().find(x=>x.id===qref.id);
  const selected = quiz.answers[q.id];
  const pct = Math.round(100*(idx)/total);

  let optsHtml = qref.keyOrder.map(k=>{
    let cls = 'option';
    if(selected===k) cls += ' selected';
    return `<div class="${cls}" data-key="${k}"><span class="lab">${k}.</span><span class="bn">${esc(q.options[k])}</span></div>`;
  }).join('');

  $content().innerHTML = `
    <div class="quiz-header"><span>Question ${idx+1} of ${total}</span><span>${Object.keys(quiz.answers).length} answered</span></div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
    <div class="qcard">
      <div class="qtext bn">${esc(q.question)}</div>
      <div class="options-list" id="quizOpts">${optsHtml}</div>
    </div>
    <div class="quiz-nav">
      <div class="btn-group">
        <button class="btn" id="prevQ" ${idx===0?'disabled':''}>&larr; Previous</button>
        <button class="btn" id="skipQ">Skip</button>
      </div>
      <div class="btn-group">
        ${idx===total-1 ? '<button class="btn btn-primary" id="finishQ">Finish Quiz</button>' : '<button class="btn btn-primary" id="nextQ">Next &rarr;</button>'}
      </div>
    </div>
  `;
  $$('#quizOpts .option').forEach(opt=>opt.addEventListener('click', ()=>{
    quiz.answers[q.id] = opt.dataset.key;
    $$('#quizOpts .option').forEach(o=>o.classList.remove('selected'));
    opt.classList.add('selected');
  }));
  const go = (delta)=>{ quiz.current = Math.max(0, Math.min(total-1, quiz.current+delta)); renderQuizQuestion(); };
  document.getElementById('prevQ').addEventListener('click', ()=>go(-1));
  document.getElementById('skipQ').addEventListener('click', ()=>go(1));
  const nextBtn = document.getElementById('nextQ');
  if(nextBtn) nextBtn.addEventListener('click', ()=>go(1));
  const finishBtn = document.getElementById('finishQ');
  if(finishBtn) finishBtn.addEventListener('click', finishQuiz);
}
function finishQuiz(){
  const quiz = CURRENT_QUIZ;
  quiz.finished = true;
  quiz.endedAt = Date.now();
  touchStreak();
  let correct=0, wrong=0, unanswered=0;
  const wrongIds = [];
  for(const qref of quiz.questions){
    const q = allQuestions().find(x=>x.id===qref.id);
    const ans = quiz.answers[q.id];
    if(!ans){ unanswered++; continue; }
    if(ans===q.answerKey){ correct++; updateSpacedRepetition(q.id,'correct'); }
    else { wrong++; wrongIds.push(q.id); updateSpacedRepetition(q.id,'wrong'); }
  }
  const result = {
    id: quiz.id, date: todayStr(), scope: quiz.scope, topicName: quiz.topicName,
    total: quiz.questions.length, correct, wrong, unanswered,
    accuracy: (correct+wrong)>0? Math.round(100*correct/(correct+wrong)) : 0,
    timeSec: Math.round((quiz.endedAt - quiz.startedAt)/1000),
    wrongIds
  };
  QUIZHIST.push(result);
  persistAll();
  location.hash = '#/quiz-results/'+quiz.id;
}
function viewQuizResults(quizId){
  const result = QUIZHIST.find(r=>r.id===quizId) || QUIZHIST[QUIZHIST.length-1];
  if(!result){ location.hash='#/quiz-setup'; return; }
  const mins = Math.floor(result.timeSec/60), secs = result.timeSec%60;
  $content().innerHTML = `
    <h1>Quiz Results</h1>
    <div class="stat-grid">
      ${statCard(result.accuracy+'%','Accuracy','accent')}
      ${statCard(result.correct,'Correct','good')}
      ${statCard(result.wrong,'Wrong','danger')}
      ${statCard(result.unanswered,'Unanswered')}
      ${statCard(mins+'m '+secs+'s','Time Taken')}
      ${statCard(result.total,'Total Questions')}
    </div>
    <div class="btn-group" style="margin:16px 0;">
      <button class="btn btn-primary" id="reviewWrong">Review Wrong Answers</button>
      <button class="btn" id="reviewAll">Review All Answers</button>
      <button class="btn" id="retakeQuiz">Retake Quiz</button>
      <a class="btn" href="#/dashboard">Return to Dashboard</a>
    </div>
    <div id="reviewArea"></div>
  `;
  document.getElementById('reviewWrong').addEventListener('click', ()=>renderReview(result.wrongIds));
  document.getElementById('reviewAll').addEventListener('click', ()=>renderReview(CURRENT_QUIZ? CURRENT_QUIZ.questions.map(q=>q.id) : result.wrongIds));
  document.getElementById('retakeQuiz').addEventListener('click', ()=>{ location.hash='#/quiz-setup'; });
  function renderReview(ids){
    const el = document.getElementById('reviewArea');
    const qs = ids.map(id=>allQuestions().find(x=>x.id===id)).filter(Boolean);
    el.innerHTML = qs.length? qs.map(q=>questionCard(q,{forceRevealed:true})).join('') : '<p style="color:var(--ink-500)">Nothing to review.</p>';
    bindQuestionCardEvents(el);
  }
}

/* ============ Quick Revision (flashcards) ============ */
let QR = null;
function viewQuickRevision(){
  const pool = shuffle(revisionDueList().length? revisionDueList() : allQuestions()).slice(0,30);
  QR = {pool, idx:0, revealed:false};
  renderQR();
}
function renderQR(){
  const el = $content();
  if(!QR || QR.pool.length===0){
    el.innerHTML = `<div class="empty-state"><div class="icon">&#9889;</div><p>No questions available for quick revision right now.</p><a class="btn btn-primary" href="#/topics">Browse Topics</a></div>`;
    return;
  }
  if(QR.idx >= QR.pool.length){
    el.innerHTML = `<div class="empty-state"><div class="icon">&#127881;</div><p>Quick revision session complete! You reviewed ${QR.pool.length} questions.</p><a class="btn btn-primary" href="#/dashboard">Back to Dashboard</a> <button class="btn" id="qrAgain">Go Again</button></div>`;
    document.getElementById('qrAgain').addEventListener('click', viewQuickRevision);
    return;
  }
  const q = QR.pool[QR.idx];
  el.innerHTML = `
    <div style="max-width:640px;margin:0 auto 10px; display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-500);">
      <span>&#9889; Quick Revision</span><span>${QR.idx+1} / ${QR.pool.length}</span>
    </div>
    <div class="flashcard-wrap">
      <div class="flashcard">
        <div class="qtext bn">${esc(q.question)}</div>
        ${QR.revealed ? `
          <div class="explanation-box bn" style="text-align:left; margin-top:16px;">
            <div class="exp-label">Answer</div>
            <div><b>${q.answerKey}. ${esc(q.options[q.answerKey]||q.answerText||'')}</b></div>
            ${q.explanation_bn? `<div style="margin-top:8px;">${esc(q.explanation_bn)}</div>`:''}
          </div>
        ` : `<button class="btn btn-primary" id="qrReveal" style="margin-top:18px; align-self:center;">Reveal Answer</button>`}
      </div>
      ${QR.revealed ? `
      <div style="margin-top:14px; font-size:12.5px; color:var(--ink-500); text-align:center;">How well did you know it?</div>
      <div class="rate-row">
        <button class="rate-btn rate-forgot" data-r="forgot">Forgot</button>
        <button class="rate-btn rate-almost" data-r="almost">Almost</button>
        <button class="rate-btn rate-knew" data-r="knew">Knew It</button>
        <button class="rate-btn rate-mastered" data-r="mastered">Mastered</button>
      </div>` : ''}
    </div>
  `;
  const revealBtn = document.getElementById('qrReveal');
  if(revealBtn) revealBtn.addEventListener('click', ()=>{ QR.revealed = true; renderQR(); });
  $$('.rate-row .rate-btn').forEach(btn=>btn.addEventListener('click', ()=>{
    touchStreak();
    updateSpacedRepetition(q.id, btn.dataset.r);
    QR.idx += 1; QR.revealed = false;
    renderQR();
  }));
}

/* ============ Focus Mode ============ */
let FOCUS = null;
function viewFocusSetup(){
  const topics = topicList().map(t=>t.topic);
  $content().innerHTML = `
    <h1>&#9201; Focus Study Mode</h1>
    <p style="color:var(--ink-500); margin-top:-6px;">Distraction-free, single-topic study with a timer.</p>
    <div class="card">
      <h4 style="font-size:12.5px; text-transform:uppercase; color:var(--ink-500);">Choose a topic</h4>
      <div class="topics-grid" id="focusTopicGrid">
        ${topics.map(t=>`<button class="topic-card" style="text-align:left; border:1px solid var(--ink-100);" data-t="${esc(t)}"><h3 class="bn">${esc(t)}</h3><div class="row"><span>${topicStats(t).total} questions</span></div></button>`).join('')}
      </div>
    </div>
  `;
  $$('#focusTopicGrid button').forEach(b=>b.addEventListener('click', ()=>{
    location.hash = '#/focus-run/'+slugify(b.dataset.t);
  }));
}
function viewFocusRun(topicName){
  const items = allQuestions().filter(q=>q.topic===topicName);
  if(items.length===0){ location.hash='#/focus-setup'; return; }
  FOCUS = {topicName, items, idx:0, correct:0, wrong:0, startedAt:Date.now(), timerId:null, paused:false, elapsedBeforePause:0};
  touchStreak();
  renderFocus();
  FOCUS.timerId = setInterval(updateFocusTimer, 1000);
}
function updateFocusTimer(){
  const el = document.getElementById('focusTimerDisplay');
  if(!el || !FOCUS || FOCUS.paused) return;
  const secs = Math.floor((Date.now()-FOCUS.startedAt)/1000) + FOCUS.elapsedBeforePause;
  const m = String(Math.floor(secs/60)).padStart(2,'0'); const s = String(secs%60).padStart(2,'0');
  el.textContent = `${m}:${s}`;
}
function renderFocus(){
  if(FOCUS.idx >= FOCUS.items.length){
    clearInterval(FOCUS.timerId);
    const secs = Math.floor((Date.now()-FOCUS.startedAt)/1000)+FOCUS.elapsedBeforePause;
    if(!STUDYSESS[FOCUS.topicName]) STUDYSESS[FOCUS.topicName] = {sessions:0, firstStudied:null, lastStudied:null, timeSpentSec:0};
    const sess = STUDYSESS[FOCUS.topicName];
    sess.sessions += 1; sess.timeSpentSec += secs;
    if(!sess.firstStudied) sess.firstStudied = todayStr();
    sess.lastStudied = todayStr();
    persistAll();
    $content().innerHTML = `
      <div class="empty-state">
        <div class="icon">&#127942;</div>
        <h2>Focus session complete</h2>
        <div class="stat-grid" style="max-width:520px;margin:16px auto;">
          ${statCard(Math.floor(secs/60)+'m','Time Spent')}
          ${statCard(FOCUS.correct,'Correct','good')}
          ${statCard(FOCUS.wrong,'Wrong','danger')}
          ${statCard(FOCUS.items.length,'Questions')}
        </div>
        <a class="btn btn-primary" href="#/topic/${slugify(FOCUS.topicName)}">Back to Topic</a>
        <a class="btn" href="#/dashboard">Dashboard</a>
      </div>`;
    return;
  }
  const q = FOCUS.items[FOCUS.idx];
  $content().innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div><b class="bn">${esc(FOCUS.topicName)}</b> &middot; ${FOCUS.idx+1}/${FOCUS.items.length}</div>
      <div class="focus-timer" id="focusTimerDisplay" style="font-size:22px;">00:00</div>
      <a class="btn btn-sm" href="#/topic/${slugify(FOCUS.topicName)}" id="exitFocus">Exit</a>
    </div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${Math.round(100*FOCUS.idx/FOCUS.items.length)}%"></div></div>
    <div id="focusQArea"></div>
  `;
  const area = document.getElementById('focusQArea');
  area.innerHTML = questionCard(q, {forceRevealed:false});
  bindQuestionCardEvents(area);
  // wrap actions to also advance
  $$('.qactions [data-act]', area).forEach(btn=>btn.addEventListener('click', ()=>{
    if(btn.dataset.act==='knew') FOCUS.correct++;
    else if(btn.dataset.act==='wrong') FOCUS.wrong++;
    setTimeout(()=>{ FOCUS.idx++; renderFocus(); }, 300);
  }));
  const revealBtn = area.querySelector('.reveal-btn');
  // allow manual next without action
  const nextWrap = document.createElement('div');
  nextWrap.style.marginTop='10px';
  nextWrap.innerHTML = `<button class="btn" id="focusSkip">Skip to next &rarr;</button>`;
  area.appendChild(nextWrap);
  document.getElementById('focusSkip').addEventListener('click', ()=>{ FOCUS.idx++; renderFocus(); });
}

</script>
<script>
/* ============ Progress / Analytics ============ */
function viewProgress(){
  const g = globalStats();
  const topics = topicList();
  const rows = topics.map(t=>{
    const s = topicStats(t.topic);
    const strength = topicStrength(t.topic);
    return `<tr>
      <td class="bn">${esc(t.topic)}</td>
      <td>${s.total}</td>
      <td>${s.attempted}</td>
      <td>${s.accuracy===null?'—':s.accuracy+'%'}</td>
      <td>${s.mastered}</td>
      <td><span class="pill strength-${strength}">${strength}</span></td>
    </tr>`;
  }).join('');

  $content().innerHTML = `
    <h1>&#128202; Progress Analytics</h1>
    <div class="stat-grid">
      ${statCard(g.totalQuestions,'Total Questions')}
      ${statCard(g.attempted,'Attempted')}
      ${statCard(g.correct,'Correct','good')}
      ${statCard(g.wrong,'Wrong','danger')}
      ${statCard(g.accuracy===null?'—':g.accuracy+'%','Accuracy')}
      ${statCard(g.mastered,'Mastered','good')}
      ${statCard(g.revisionDue,'Revision Due','danger')}
      ${statCard(g.totalSessions,'Study Sessions')}
      ${statCard(g.totalTimeMin+'m','Total Time')}
      ${statCard(g.streak+' &#128293;','Study Streak (days)','accent')}
      ${statCard(g.longestStreak,'Longest Streak')}
      ${statCard(STREAK.days.length,'Total Study Days')}
    </div>

    <div class="section-title"><h2>Topic-wise Performance</h2></div>
    <div class="card" style="overflow-x:auto;">
      <table class="table-simple">
        <thead><tr><th>Topic</th><th>Qs</th><th>Attempted</th><th>Accuracy</th><th>Mastered</th><th>Strength</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="section-title"><h2>Recent Quiz History</h2></div>
    <div class="card" style="overflow-x:auto;">
      ${QUIZHIST.length===0 ? '<p style="color:var(--ink-500)">No quizzes taken yet.</p>' : `
      <table class="table-simple">
        <thead><tr><th>Date</th><th>Scope</th><th>Score</th><th>Accuracy</th><th>Time</th></tr></thead>
        <tbody>
        ${QUIZHIST.slice().reverse().slice(0,15).map(r=>`<tr>
          <td>${r.date}</td><td>${esc(r.scope)}${r.topicName?' ('+esc(r.topicName)+')':''}</td>
          <td>${r.correct}/${r.total}</td><td>${r.accuracy}%</td><td>${Math.round(r.timeSec/60)}m</td>
        </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

/* ============ Study Plan ============ */
function generateDailyPlan(){
  const t = todayStr();
  if(DAILYPLAN.date === t && DAILYPLAN.tasks.length) return DAILYPLAN;
  const tasks = [];
  const due = revisionDueList();
  if(due.length>0) tasks.push({id:'due', label:`Revision Due (${due.length} questions)`, action:'#/revision-due', done:false, minutes: Math.max(10, Math.round(due.length*0.6))});
  const weak = weakTopics(2);
  weak.forEach(w=>{
    const time = estimateStudyTime(w);
    tasks.push({id:'weak-'+w, label:`Study weak topic: ${w}`, action:'#/topic/'+encodeURIComponent(w), done:false, minutes: time.first});
  });
  const mistakes = mistakeList();
  if(mistakes.length>0) tasks.push({id:'mistakes', label:`Review My Mistakes (${mistakes.length})`, action:'#/mistakes', done:false, minutes: Math.max(10, Math.round(mistakes.length*0.7))});
  const unattempted = allQuestions().filter(q=>!PROG[q.id]||PROG[q.id].attempts===0);
  if(unattempted.length>0) tasks.push({id:'new', label:'Explore new/unattempted questions', action:'#/quiz-setup', done:false, minutes:15});
  tasks.push({id:'qr', label:'Quick Revision session', action:'#/quick-revision', done:false, minutes:10});
  DAILYPLAN = {date:t, tasks};
  persistAll();
  return DAILYPLAN;
}
function viewStudyPlan(){
  const plan = generateDailyPlan();
  const totalMin = plan.tasks.reduce((a,t)=>a+t.minutes,0);
  const doneCount = plan.tasks.filter(t=>t.done).length;
  $content().innerHTML = `
    <h1>&#128197; Today's Study Plan</h1>
    <p style="color:var(--ink-500); margin-top:-6px;">${plan.date} &middot; Est. ${totalMin} min &middot; ${doneCount}/${plan.tasks.length} done</p>
    <div id="planList">
      ${plan.tasks.map((t,i)=>`
        <div class="plan-item ${t.done?'done':''}">
          <div class="plan-check ${t.done?'checked':''}" data-i="${i}"></div>
          <a href="${t.action}" style="flex:1; color:inherit; text-decoration:none;"><b>${i+1}.</b> ${esc(t.label)} <span style="color:var(--ink-500); font-size:12px;">(~${t.minutes} min)</span></a>
        </div>
      `).join('')}
    </div>
    <button class="btn" id="regenPlan" style="margin-top:12px;">&#8635; Regenerate Plan</button>
  `;
  $$('.plan-check').forEach(chk=>chk.addEventListener('click', ()=>{
    const i = parseInt(chk.dataset.i);
    plan.tasks[i].done = !plan.tasks[i].done;
    DAILYPLAN = plan; persistAll();
    viewStudyPlan();
  }));
  document.getElementById('regenPlan').addEventListener('click', ()=>{
    DAILYPLAN = {date:null, tasks:[]};
    viewStudyPlan();
  });
}

/* ============ Settings ============ */
function viewSettings(){
  $content().innerHTML = `
    <h1>&#9881; Settings</h1>

    <div class="card">
      <h3>Appearance</h3>
      <div class="btn-group">
        <button class="btn ${SETTINGS.theme==='light'?'btn-primary':''}" id="lightBtn">&#9728; Light Mode</button>
        <button class="btn ${SETTINGS.theme==='dark'?'btn-primary':''}" id="darkBtn">&#127769; Dark Mode</button>
      </div>
    </div>

    <div class="card">
      <h3>Backup / Restore</h3>
      <p style="color:var(--ink-500); font-size:13px;">Export all your progress (statuses, bookmarks, notes, quiz history, streak) as a JSON file. Browser storage can be cleared, so keep a backup.</p>
      <div class="btn-group">
        <button class="btn btn-primary" id="exportBtn">&#11015; Export Progress</button>
        <button class="btn" id="importBtn">&#11014; Import Progress</button>
        <input type="file" id="importFile" accept=".json" style="display:none;">
      </div>
    </div>

    <div class="card">
      <h3>Reset</h3>
      <p style="color:var(--ink-500); font-size:13px;">Resetting is permanent and cannot be undone.</p>
      <div class="btn-group">
        <button class="btn btn-danger" id="resetAllBtn">Reset All Progress</button>
      </div>
    </div>

    <div class="card">
      <h3>Keyboard Shortcuts</h3>
      <table class="table-simple">
        <tr><td><kbd>1</kbd>–<kbd>4</kbd></td><td>Select option ক/খ/গ/ঘ in quiz</td></tr>
        <tr><td><kbd>Enter</kbd></td><td>Reveal answer / Next question</td></tr>
        <tr><td><kbd>R</kbd></td><td>Mark question for revision</td></tr>
        <tr><td><kbd>M</kbd></td><td>Mark as mastered</td></tr>
        <tr><td><kbd>B</kbd></td><td>Bookmark current question</td></tr>
        <tr><td><kbd>N</kbd></td><td>Next question (Quiz/Focus)</td></tr>
        <tr><td><kbd>P</kbd></td><td>Previous question (Quiz)</td></tr>
      </table>
    </div>

    <div class="card">
      <h3>About</h3>
      <p style="font-size:13px; color:var(--ink-500);">English Language — Interactive Study &amp; Revision System<br>Source: English Language.pdf (BCS প্রিলি মাস্টার প্রশ্নব্যাংক)<br>${allQuestions().length} questions across ${topicList().length} topics, 5 chapters.</p>
    </div>
  `;
  document.getElementById('lightBtn').addEventListener('click', ()=>setTheme('light'));
  document.getElementById('darkBtn').addEventListener('click', ()=>setTheme('dark'));
  document.getElementById('exportBtn').addEventListener('click', exportProgress);
  document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', importProgress);
  document.getElementById('resetAllBtn').addEventListener('click', ()=>{
    confirmModal('Reset ALL progress?', 'This will permanently delete every status, bookmark, note, quiz result, and streak. This cannot be undone.', ()=>{
      PROG = {}; QUIZHIST = []; STUDYSESS = {}; STREAK = {current:0,longest:0,lastDate:null,days:[]}; DAILYPLAN = {date:null,tasks:[]};
      persistAll();
      toast('All progress has been reset');
      location.hash = '#/dashboard';
    });
  });
}
function setTheme(t){
  SETTINGS.theme = t; persistAll();
  document.documentElement.setAttribute('data-theme', t);
  viewSettings();
}
function exportProgress(){
  const payload = {app:'English Language Interactive Study System', exportedAt:new Date().toISOString(),
    progress:PROG, quizHistory:QUIZHIST, studySessions:STUDYSESS, streak:STREAK, settings:SETTINGS, dailyPlan:DAILYPLAN, topicTimeOverride:TOPIC_TIME_OVERRIDE};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'english_language_progress.json';
  a.click();
  toast('Progress exported');
}
function importProgress(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.progress){ throw new Error('bad'); }
      PROG = data.progress||{}; QUIZHIST = data.quizHistory||[]; STUDYSESS = data.studySessions||{};
      STREAK = data.streak||STREAK; SETTINGS = data.settings||SETTINGS; DAILYPLAN = data.dailyPlan||{date:null,tasks:[]};
      TOPIC_TIME_OVERRIDE = data.topicTimeOverride||{};
      persistAll();
      document.documentElement.setAttribute('data-theme', SETTINGS.theme||'light');
      toast('Progress imported successfully');
      location.hash = '#/dashboard'; router();
    }catch(err){
      toast('This file is not a valid English Language progress backup.');
    }
  };
  reader.readAsText(file);
}
function confirmModal(title, msg, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box">
    <h3>${esc(title)}</h3>
    <p style="font-size:13.5px; color:var(--ink-700);">${esc(msg)}</p>
    <div class="btn-group" style="margin-top:14px; justify-content:flex-end;">
      <button class="btn" id="cancelModal">Cancel</button>
      <button class="btn btn-danger" id="confirmModalBtn">Confirm</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelModal').addEventListener('click', ()=>overlay.remove());
  overlay.querySelector('#confirmModalBtn').addEventListener('click', ()=>{ overlay.remove(); onConfirm(); });
}

/* ============ Boot ============ */
function initShell(){
  document.documentElement.setAttribute('data-theme', SETTINGS.theme||'light');
  document.getElementById('mobileMenuBtn').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('show');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', closeSidebarMobile);
  const searchInput = document.getElementById('globalSearch');
  searchInput.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && searchInput.value.trim()){
      location.hash = '#/search/'+encodeURIComponent(searchInput.value.trim());
    }
  });
  if(!STORAGE_OK){
    toast('Browser storage is unavailable. Progress may not persist.');
  }
  window.addEventListener('error', function(e){
    console.error('App error:', e.error);
  });
  window.addEventListener('unhandledrejection', function(e){
    console.error('App promise error:', e.reason);
  });
  if(!location.hash) location.hash = '#/dashboard';
  router();
}
document.addEventListener('DOMContentLoaded', initShell);

</script>
