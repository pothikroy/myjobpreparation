<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../../firebase-config.js?v=8"></script>
  <script>window.AG_PAGE = {"id": "english-language", "title": "English Language", "storage": {"type": "prefix", "prefix": "elsr_"}};</script>
  <script src="../../auth-gate.js?v=8"></script>
  

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Language — Interactive Study &amp; Revision System</title>
<style>
:root{
  --indigo-950:#0f1b3d;
  --indigo-900:#152a5c;
  --indigo-800:#1e3a72;
  --indigo-700:#2a4a8f;
  --indigo-600:#3a5ba8;
  --indigo-100:#e6ebf7;
  --indigo-50:#f3f5fb;
  --gold-600:#b8860b;
  --gold-500:#c9a227;
  --gold-100:#faf3d9;
  --cream:#faf8f3;
  --paper:#ffffff;
  --ink-900:#1a1d29;
  --ink-700:#3d4152;
  --ink-500:#686d80;
  --ink-300:#a6abc0;
  --ink-100:#e3e5ee;
  --green-600:#1f7a4d;
  --green-100:#e2f5ea;
  --amber-600:#b8720b;
  --amber-100:#fbf0d9;
  --red-600:#c23a3a;
  --red-100:#fbe6e6;
  --blue-600:#2563a8;
  --blue-100:#e3edf9;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(15,27,61,0.06), 0 1px 1px rgba(15,27,61,0.04);
  --shadow-md:0 4px 14px rgba(15,27,61,0.08), 0 2px 4px rgba(15,27,61,0.04);
  --shadow-lg:0 12px 32px rgba(15,27,61,0.14), 0 4px 10px rgba(15,27,61,0.06);
  --font-display:'Lora', Georgia, 'Noto Serif Bengali', serif;
  --font-body:'Inter', 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
  --sidebar-w:248px;
}
[data-theme="dark"]{
  --cream:#0e1220;
  --paper:#161b2e;
  --ink-900:#eef0f8;
  --ink-700:#c7cbe0;
  --ink-500:#8b90ac;
  --ink-300:#4c5170;
  --ink-100:#232842;
  --indigo-50:#1a2140;
  --indigo-100:#212950;
  --gold-100:#332a12;
  --green-100:#123321;
  --amber-100:#332a12;
  --red-100:#3a1f1f;
  --blue-100:#182a44;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--ink-900);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0 0 .5em; color:var(--ink-900); font-weight:600;}
p{margin:0 0 .8em;}
a{color:var(--indigo-700);}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:2px solid var(--gold-500); outline-offset:2px;}
.bn{font-family:'Noto Sans Bengali', var(--font-body);}

/* Layout */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--indigo-950); color:#fff;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
  z-index:40;
}
.sidebar-brand{padding:20px 18px 14px; border-bottom:1px solid rgba(255,255,255,0.08);}
.sidebar-brand .title{font-family:var(--font-display); font-size:17px; font-weight:700; color:#fff; line-height:1.25;}
.sidebar-brand .subtitle{font-size:11.5px; color:var(--gold-500); margin-top:4px; letter-spacing:.02em;}
.nav-group{padding:10px 10px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm);
  color:rgba(255,255,255,0.78); text-decoration:none; font-size:13.5px; font-weight:500; margin-bottom:2px;
  border:none; background:none; width:100%; text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,0.08); color:#fff;}
.nav-item.active{background:var(--gold-500); color:var(--indigo-950); font-weight:700;}
.nav-item .icon{width:18px; text-align:center; flex-shrink:0;}
.nav-badge{margin-left:auto; background:rgba(255,255,255,0.15); font-size:10.5px; padding:1px 6px; border-radius:20px;}
.nav-item.active .nav-badge{background:rgba(15,27,61,0.2); color:var(--indigo-950);}
.sidebar-footer{margin-top:auto; padding:12px 14px; border-top:1px solid rgba(255,255,255,0.08); font-size:11px; color:rgba(255,255,255,0.5);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; gap:12px; padding:12px 22px; background:var(--paper);
  border-bottom:1px solid var(--ink-100); position:sticky; top:0; z-index:30;
}
.topbar .search-wrap{flex:1; max-width:420px; position:relative;}
.topbar input[type=search]{
  width:100%; padding:8px 12px 8px 32px; border-radius:20px; border:1px solid var(--ink-100);
  background:var(--indigo-50); font-size:13.5px; color:var(--ink-900);
}
.topbar .search-icon{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-500); font-size:13px;}
.icon-btn{
  background:var(--indigo-50); border:1px solid var(--ink-100); width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-700);
}
.icon-btn:hover{background:var(--indigo-100);}
.mobile-menu-btn{display:none;}
.content{padding:22px 26px 60px; max-width:1180px; width:100%; margin:0 auto;}

/* Cards */
.card{background:var(--paper); border:1px solid var(--ink-100); border-radius:var(--radius-lg); padding:18px 20px; box-shadow:var(--shadow-sm);}
.card + .card{margin-top:14px;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:18px;}
.stat-card{background:var(--paper); border:1px solid var(--ink-100); border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-sm);}
.stat-card .num{font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--indigo-800);}
.stat-card .label{font-size:11.5px; color:var(--ink-500); margin-top:2px; text-transform:uppercase; letter-spacing:.03em;}
.stat-card.accent .num{color:var(--gold-600);}
.stat-card.danger .num{color:var(--red-600);}
.stat-card.good .num{color:var(--green-600);}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px;}
.section-title h2{font-size:18px; margin:0;}
.section-title .meta{font-size:12.5px; color:var(--ink-500);}

.pill{display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.pill.status-not-reviewed{background:var(--ink-100); color:var(--ink-500);}
.pill.status-learning{background:var(--blue-100); color:var(--blue-600);}
.pill.status-needs-practice{background:var(--amber-100); color:var(--amber-600);}
.pill.status-need-revision{background:var(--red-100); color:var(--red-600);}
.pill.status-mastered{background:var(--green-100); color:var(--green-600);}
.pill.strength-weak{background:var(--red-100); color:var(--red-600);}
.pill.strength-average{background:var(--amber-100); color:var(--amber-600);}
.pill.strength-strong{background:var(--green-100); color:var(--green-600);}
.pill.strength-mastered{background:var(--blue-100); color:var(--blue-600);}
.pill.priority-high{background:var(--red-100); color:var(--red-600);}
.pill.priority-medium{background:var(--amber-100); color:var(--amber-600);}
.pill.priority-low{background:var(--green-100); color:var(--green-600);}

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 15px; border-radius:8px; font-size:13px; font-weight:600;
  border:1px solid var(--ink-100); background:var(--paper); color:var(--ink-900); transition:background .12s;
}
.btn:hover{background:var(--indigo-50);}
.btn-primary{background:var(--indigo-800); border-color:var(--indigo-800); color:#fff;}
.btn-primary:hover{background:var(--indigo-900);}
.btn-gold{background:var(--gold-500); border-color:var(--gold-500); color:var(--indigo-950);}
.btn-gold:hover{background:var(--gold-600);}
.btn-danger{background:var(--red-600); border-color:var(--red-600); color:#fff;}
.btn-danger:hover{background:#a12e2e;}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-group{display:flex; gap:8px; flex-wrap:wrap;}

.topic-card{
  display:block; background:var(--paper); border:1px solid var(--ink-100); border-radius:var(--radius-md);
  padding:14px 16px; text-decoration:none; color:inherit; box-shadow:var(--shadow-sm); transition:box-shadow .12s, transform .12s;
  cursor:pointer;
}
.topic-card:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
.topic-card .chapter-label{font-size:10.5px; color:var(--ink-500); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px;}
.topic-card h3{font-size:14.5px; margin:0 0 8px;}
.topic-card .prog-bar{height:6px; border-radius:4px; background:var(--ink-100); overflow:hidden; margin-bottom:8px;}
.topic-card .prog-fill{height:100%; background:var(--indigo-700); border-radius:4px;}
.topic-card .row{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink-500);}
.topics-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px;}

.qcard{background:var(--paper); border:1px solid var(--ink-100); border-radius:var(--radius-lg); padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow-sm);}
.qcard .qhead{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
.qcard .qnum{font-family:var(--font-display); font-weight:700; color:var(--indigo-700); font-size:14px;}
.qcard .qtext{font-size:15px; font-weight:600; color:var(--ink-900); margin-bottom:12px;}
.qcard .qsource{font-size:11px; color:var(--gold-600); font-weight:600;}
.options-list{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
@media(max-width:520px){.options-list{grid-template-columns:1fr;}}
.option{
  display:flex; gap:8px; align-items:flex-start; padding:9px 11px; border-radius:8px; border:1px solid var(--ink-100);
  background:var(--indigo-50); font-size:13.5px; cursor:pointer;
}
.option .lab{font-weight:700; color:var(--indigo-700); flex-shrink:0;}
.option.correct{background:var(--green-100); border-color:var(--green-600);}
.option.incorrect{background:var(--red-100); border-color:var(--red-600);}
.option.selected:not(.correct):not(.incorrect){border-color:var(--indigo-700); box-shadow:0 0 0 1px var(--indigo-700);}
.explanation-box{background:var(--indigo-50); border-left:3px solid var(--indigo-700); border-radius:0 8px 8px 0; padding:12px 14px; margin-top:10px; font-size:13.5px;}
.explanation-box .exp-label{font-size:11px; font-weight:700; color:var(--indigo-700); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
.explanation-table{width:100%; border-collapse:collapse; margin-top:8px; font-size:12.5px;}
.explanation-table td,.explanation-table th{border:1px solid var(--ink-100); padding:5px 8px; text-align:left;}
.explanation-table tr:first-child{background:var(--indigo-100); font-weight:700;}
.flag-box{background:var(--amber-100); color:var(--amber-600); border-radius:6px; padding:8px 10px; font-size:12px; margin-top:8px; font-weight:600;}
.qfooter{display:flex; justify-content:space-between; align-items:center; margin-top:12px; flex-wrap:wrap; gap:8px;}
.qactions{display:flex; gap:6px; flex-wrap:wrap;}
.qmeta-row{display:flex; gap:14px; font-size:11.5px; color:var(--ink-500); flex-wrap:wrap; margin-top:6px;}
.notes-box{margin-top:10px;}
.notes-box textarea{width:100%; min-height:56px; border:1px solid var(--ink-100); border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; background:var(--indigo-50); color:var(--ink-900); resize:vertical;}

.reveal-btn{width:100%; padding:11px; border-radius:8px; border:1px dashed var(--indigo-300, var(--ink-300)); background:var(--indigo-50); color:var(--indigo-700); font-weight:700; font-size:13.5px; text-align:center;}

.filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.filter-select{padding:7px 10px; border-radius:8px; border:1px solid var(--ink-100); background:var(--paper); font-size:12.5px; color:var(--ink-900);}
.chip{padding:5px 11px; border-radius:20px; font-size:12px; border:1px solid var(--ink-100); background:var(--paper); color:var(--ink-700);}
.chip.active{background:var(--indigo-800); color:#fff; border-color:var(--indigo-800);}

.empty-state{text-align:center; padding:50px 20px; color:var(--ink-500);}
.empty-state .icon{font-size:38px; margin-bottom:10px;}

/* Quiz */
.quiz-progress-bar{height:6px; background:var(--ink-100); border-radius:4px; overflow:hidden; margin-bottom:16px;}
.quiz-progress-fill{height:100%; background:var(--gold-500);}
.quiz-header{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-500); margin-bottom:8px;}
.quiz-nav{display:flex; justify-content:space-between; margin-top:16px; gap:10px;}
.setup-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px;}
.setup-block h4{font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-500); margin-bottom:8px;}
.radio-row{display:flex; flex-direction:column; gap:6px;}
.radio-opt{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; border:1px solid var(--ink-100); font-size:13px; cursor:pointer;}
.radio-opt.sel{background:var(--indigo-100); border-color:var(--indigo-700);}

/* Quick revision flashcard */
.flashcard-wrap{max-width:640px; margin:0 auto;}
.flashcard{background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:34px 28px; min-height:220px; display:flex; flex-direction:column; justify-content:center; text-align:center;}
.flashcard .qtext{font-size:18px; font-weight:600;}
.rate-row{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:18px;}
.rate-btn{padding:12px 6px; border-radius:8px; font-weight:700; font-size:12.5px; border:none; color:#fff;}
.rate-forgot{background:var(--red-600);}
.rate-almost{background:var(--amber-600);}
.rate-knew{background:var(--blue-600);}
.rate-mastered{background:var(--green-600);}

/* Focus mode timer */
.focus-timer{font-family:var(--font-display); font-size:40px; font-weight:700; color:var(--indigo-800); text-align:center;}

.table-simple{width:100%; border-collapse:collapse; font-size:13px;}
.table-simple th{text-align:left; padding:8px 10px; border-bottom:2px solid var(--ink-100); color:var(--ink-500); font-size:11.5px; text-transform:uppercase;}
.table-simple td{padding:9px 10px; border-bottom:1px solid var(--ink-100);}
.table-simple tr:hover td{background:var(--indigo-50);}

.plan-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--ink-100); border-radius:10px; margin-bottom:8px; background:var(--paper);}
.plan-item.done{opacity:.5; text-decoration:line-through;}
.plan-check{width:22px; height:22px; border-radius:50%; border:2px solid var(--indigo-700); flex-shrink:0; cursor:pointer;}
.plan-check.checked{background:var(--indigo-700);}

.streak-flame{font-size:22px;}
.modal-overlay{position:fixed; inset:0; background:rgba(15,20,40,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-box{background:var(--paper); border-radius:var(--radius-lg); padding:24px; max-width:420px; width:100%; box-shadow:var(--shadow-lg);}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--indigo-950); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; z-index:200; box-shadow:var(--shadow-lg); opacity:0; transition:opacity .25s, transform .25s;}
.toast.show{opacity:1;}

.disclaimer{font-size:11.5px; color:var(--ink-500); background:var(--indigo-50); border-radius:8px; padding:10px 12px; margin-top:6px;}

/* mobile */
@media(max-width:880px){
  .sidebar{position:fixed; left:-100%; top:0; height:100vh; transition:left .2s; box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .mobile-menu-btn{display:flex;}
  .content{padding:16px 14px 70px;}
  .topbar{padding:10px 14px;}
  .topbar .search-wrap{max-width:none;}
  .sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:39;}
  .sidebar-overlay.show{display:block;}
}
@media(prefers-reduced-motion: reduce){*{transition:none !important; scroll-behavior:auto !important;}}

</style>
</head>
<body>
<div id="ag-overlay"></div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="title">English Language</div>
      <div class="subtitle">Interactive Study &amp; Revision System</div>
    </div>
    <nav class="nav-group" id="sidebarNav"></nav>
    <div class="sidebar-footer">Source: English Language.pdf<br>BCS প্রিলি মাস্টার প্রশ্নব্যাংক</div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main">
    <div class="topbar">
      <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn">&#9776;</button>
      <div class="search-wrap">
        <span class="search-icon">&#128269;</span>
        <input type="search" id="globalSearch" placeholder="Search questions, topics, explanations... (Enter)">
      </div>
      <a class="icon-btn" href="#/settings" title="Settings">&#9881;</a>
    </div>
    <main class="content" id="content"></main>
  </div>

<script>

", "options": {"ক": "poem", "খ": "play", "গ": "drama", "ঘ": "works"}, "answerKey": "ঘ", "answerText": "works", "explanation_bn": "Most of the এর পর Countable এবং Uncountable Noun দুই-ই ব্যবহৃত হয়। তবে Countable noun-এর ক্ষেত্রে এর Plural form ব্যবহৃত হবে। Work দ্বারা কোনো ব্যক্তির লেখা গ্রন্থ, স্বতন্ত্র শিল্পকর্ম, আবিষ্কার ইত্যাদি বুঝালে এটি countable noun-এ পরিণত হয় এবং একের অধিক সংখ্যার ক্ষেত্রে Work-এর সাথে-s যুক্ত হবে। উল্লিখিত Sentence এ Shakespeare এর লেখা গ্রন্থগুলোকে বুঝানো হয়েছে। তাই, এখানে Works হবে।"}, {"id": "EL-0004", "page": 2, "chapter": "Chapter 01: Parts of Speech", "topic": "1.1 The Noun", "qno": "04", "question": "'Mutton' is a/an-", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "Common noun", "খ": "Abstract noun", "গ": "Material noun", "ঘ": "Proper noun"}, "answerKey": "গ", "answerText": "Material noun", "explanation_bn": "Mutton, Gold, Rice, Diamond, Iron, Milk, Paper, Brick, Water, Wood, Coal, Sugar, Tea, Salt, Steel ইত্যাদি Material noun। Material noun গণনা করা যায় না কিন্তু একক দ্বারা পরিমাপ করা যায়। উল্লেখ্য, Material noun এর পূর্বে the বসলে বা Material noun দ্বারা উপাদানের তৈরি জিনিস বুঝালে এটি Common noun-এ রূপান্তরিত হয়। যেমন: Drive the nail into the table. এখানে nail শব্দটি Material noun হলেও এর পূর্বে the বসার কারণে এটি Common noun।"}, {"id": "EL-0005", "page": 2, "chapter": "Chapter 01: Parts of Speech", "topic": "1.1 The Noun", "qno": "05", "question": "Frailty, thy name is woman. Here 'Frailty' is:", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "A noun", "খ": "An adjective", "গ": "An adverb", "ঘ": "A verb"}, "answerKey": null, "answerText": "Blank (no option marked)", "flag": "⚠ Source shows answer as 'Blank' — no option marked in the original.", "explanation_bn": "Frailty বলে কোনো word পাওয়া যায় না। তবে শব্দটি Frailty না হয়ে Frailty হলে এটি হতো Abstract Noun; যার অর্থ ভঙ্গুরতা, নশ্বরতা। Chemistry, heroism, agency, childhood, charity, judgement, discipline, wisdom, hatred, laughter, cowardice, patriotism ইত্যাদি Abstract no : "sovereign", "গ": "emperor", "ঘ": "queen"}, "answerKey": "খ", "answerText": "sovereign", "explanation_bn": ""}, {"id": "EL-0025", "page": 4, "chapter": "Chapter 01: Parts of Speech", "topic": "1.3 The Gender", "qno": "06", "question": "Which one of the following words is masculine?", "source_tag": "৪০তম বিসিএস", "options": {"ক": "Mare", "খ": "Lad", "গ": "Pillow", "ঘ": "Pony"}, "answerKey": "খ", "answerText": "Lad", "explanation_bn": "", "explanation_table": [["Masculine", "Feminine", "Masculine", "Feminine"], ["Bachelor", "Spinster", "Lad, Boy", "Lass, Girl"], ["Monk, Friar", "Nun", "Stag", "Hind"], ["Boar", "Sow", "Drake", "Duck"], ["Buck", "Doe", "Drone", "Bee"], ["Gander", "Goose", "Swain", "Nymph"], ["Horse, Stallion", "Mare", "Hart", "Roe"], ["Dog", "Bitch", "Merman", "Mermaid"]]}, {"id": "EL-0026", "page": 4, "chapter": "Chapter 01: Parts of Speech", "topic": "1.3 The Gender", "qno": "07", "question": "What is the masculine gender of \"mare\"?", "source_tag": "৩৪তম বিসিএস", "options": {"ক": "Mermaid", "খ": "Bear", "গ": "Stallion", "ঘ": "Dog"}, "answerKey": "গ", "answerText": "Stallion", "explanation_bn": ""}, {"id": "EL-0027", "page": 5, "chapter": "Chapter 01: Parts of Speech", "topic": "1.4 The Determiner and The Article", "qno": "01", "question": "Select the right determiner: 'She works as ___ FBI analyst.'", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "a", "খ": "an", "গ": "the", "ঘ": "none of the above"}, "answerKey": "খ", "answerText": "an", "explanation_bn": "যে সকল Abbreviation (সংক্ষিপ্ত রূপ) এর উচ্চারণ vowel এর মতো হয় তাদের পূর্বে an বসে। A, E, F, H, I, L, M, N, O, R, S, X দ্বারা শুরু সকল Abbreviation উচ্চারণ করার সময় শুরুতে Vowel Sound আসে বিধায় Article-a না হয়ে an বসে।"}, {"id": "EL-0028", "page": 5, "chapter": "Chapter 01: Parts of Speech", "topic": "1.4 The Determiner and The Article", "qno": "02", "question": "Identify the determiner in the sentence \"Bring me that book\"", "source_tag": "৪২তম বিসিএস", "options": {"ক": "bring", "খ": "me", "গ": "that", "ঘ": "book"}, "answerKey": "গ", "answerText": "that", "explanation_bn": "Sentence টিতে 'That' Determiner টি 'Book' Noun টিকে নির্দিষ্ট করার জন্য ব্যবহৃত হয়েছে। The, this, these, those এবং কিছু possessive যেমন: my, your, its, his, her, theirs, whose, ours ইত্যাদি নির্দিষ্টতা জ্ঞাপক Determiners."}, {"id": "EL-0029", "page": 5, "chapter": "Chapter 01: Parts of Speech", "topic": "1.4 The Determiner and The Article", "qno": "03", "question": "Identify the determiner in the following sentence: 'I have no news for you.'", "source_tag": "৪০তম বিসিএস", "options": {"ক": "have", "খ": "news", "গ": "no", "ঘ": "for"}, "answerKey": "গ", "answerText": "no", "explanation_bn": "প্রদত্ত বাক্যে news-এর পূর্বে ব্যবহৃত no শব্দটি determiner হিসেবে ব্যবহৃত হয়েছে। no শব্দটি Countable ও uncountable Noun এর পূর্বে ব্যবহৃত হয়। Countable ও uncountable Noun এর পূর্বে ব্যবহৃত আরও কিছু Determiner হলো- the, some, any, no, none, a lot of, more than, this, that ইত্যাদি। কিছু কিছু Determiner আছে যেগুলো Countable Noun এর পূর্বে ব্যবহৃত হয়। যেমন- a, an, these, those, one, three, several, many, a few, a large number of, a great number of ইত্যাদি। অপরদিকে, Much, too much, a large amount of, a great amount of, a little, little, less than ইত্যাদি Determiner গুলো Uncountable noun এর পূর্বে বসে।"}, {"id": "EL-0030", "page": 5, "chapter": "Chapter 01: Parts of Speech", "topic": "1.4 The Determiner and The Article", "qno": "08", "flag": "⚠ Source contains possible numbering anomaly: questions numbered 04-07 do not appear on this page (jumps 03→08), and the number 08 is used twice for two different questions on this page. Preserved exactly as printed.", "question": "He went to ___ hospital because he had ___ heart attack.", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "no article, an", "খ": "a, an", "গ": "the, no article", "ঘ": "no article, a"}, "answerKey": "ঘ", "answerText": "no article, a", "explanation_bn": "সাধারণত school, college, hospital, mosque ইত্যাদি স্থানগুলোতে মূল উদ্দেশ্যে গেলে এ : "Thus", "ঘ": "That"}, "answerKey": "ঘ", "answerText": "That", "explanation_bn": "প্রশ্নোক্ত বাক্যে 'Song' singular হওয়ার কারণে determiner (that) টিও singular হবে। These ও Those উভয়ই Plural Determiner; অপরদিকে, Thus একটি Adverb।"}, {"id": "EL-0035", "page": 5, "chapter": "Chapter 01: Parts of Speech", "topic": "1.4 The Determiner and The Article", "qno": "09", "question": "There are ___ dangerous drivers.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "a very lot of", "খ": "very many of", "গ": "very much of", "ঘ": "a lot of"}, "answerKey": "ঘ", "answerText": "a lot of", "explanation_bn": "a lot of Determiner টি Countable এবং Uncountable উভয় Noun এর পূর্বে বসে। 'a very lot of', 'very many of' এবং 'Very much of' Phrase গুলো ব্যাকরণগতভাবে ভুল যার সঠিক রূপ হলো 'a lot of', many এবং much।"}, {"id": "EL-0036", "page": 6, "chapter": "Chapter 01: Parts of Speech", "topic": "1.4 The Determiner and The Article", "qno": "10", "question": "___ is not the only thing that tourists want to see.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "A scenery", "খ": "Sceneries", "গ": "The sceneries", "ঘ": "Scenery"}, "answerKey": "ঘ", "answerText": "Scenery", "explanation_bn": "সাধারণত abstract noun-এর পূর্বে কোনো article বসে না এবং এর Plural হয় না। Scenery একটি abstract noun।"}, {"id": "EL-0037", "page": 6, "chapter": "Chapter 01: Parts of Speech", "topic": "1.4 The Determiner and The Article", "qno": "11", "question": "I have ___ interest in the matter.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "not", "খ": "any", "গ": "none", "ঘ": "no"}, "answerKey": "ঘ", "answerText": "no", "explanation_bn": "কোনো Sentence এ have মূল verb হিসেবে থাকলে negative করার সময় no ব্যবহার করতে হয়।"}, {"id": "EL-0038", "page": 6, "chapter": "Chapter 01: Parts of Speech", "topic": "1.5 The Pronoun", "qno": "01", "question": "She insisted on ___ leaving the house.", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "he", "খ": "him", "গ": "himself", "ঘ": "his"}, "answerKey": "ঘ", "answerText": "his", "explanation_bn": "Insist on এর পর সর্বদা Pronoun এর Possessive form ব্যবহৃত হয় এবং Verb আসলে এর সাথে ing যুক্ত হয়। সুতরাং সঠিক উত্তর She insisted on his leaving the house."}, {"id": "EL-0039", "page": 6, "chapter": "Chapter 01: Parts of Speech", "topic": "1.5 The Pronoun", "qno": "02", "question": "'Who's that?' in this sentence 'that' is a/an-", "source_tag": "৪১তম বিসিএস", "options": {"ক": "pronoun", "খ": "conjunction", "গ": "adjective", "ঘ": "adverb"}, "answerKey": "ক", "answerText": "pronoun", "explanation_bn": ""}, {"id": "EL-0040", "page": 6, "chapter": "Chapter 01: Parts of Speech", "topic": "1.5 The Pronoun", "qno": "03", "question": "Which one of the following words is an example of a distributive pronoun?", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "such", "খ": "either", "গ": "that", "ঘ": "any"}, "answerKey": "খ", "answerText": "either", "explanation_bn": "দুই বা ততোধিক ব্যক্তি বা বস্তুর মধ্যে প্রত্যেককে পৃথক করে বোঝাতে যে pronoun ব্যবহৃত হয় তা Distributive pronoun। Either, each, neither হলো distributive pronoun-এর উদাহরণ। অন্যদিকে that, such হলো Demonstrative pronoun, আর any হলো Indefinite pronoun।"}, {"id": "EL-0041", "page": 6, "chapter": "Chapter 01: Parts of Speech", "topic": "1.5 The Pronoun", "qno": "08", "flag": "⚠ Source numbering jumps 03→08 on this page (04-07 not present), preserved as printed.", "question": "Each of the sons followed ___ father's trade.", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "their", "খ": "her", "গ": "whose", "ঘ": "his"}, "answerKey": "ঘ", "answerText": "his", "explanation_bn": "Each of the, every of the, either of the, neither of the ইত্যাদির পর Plural noun এবং Singular verb বসে। এক্ষেত্রে Pronoun এর Possessive case টি সর্বদা Singular হয়। অর্থাৎ your, his, her, its ইত্যাদি।"}, {"id": "EL-0042", "page": 6, "chapter": "Chapter 01: Parts of Speech", "topic": "1.5 The Pronoun", "qno": "05", "question": "Tell me ___ that.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "whom told you", "খ": "who told you", "গ": "that told you", "ঘ": "told you"}, "answerKey": "খ", "answerText": "who told you", "explanation_bn": "Who এবং Whom- এর ব্যবহার: ১) Who সবসময় clause বা sentence এর finite verb এর subject হিসেবে এবং Whom সবসময় finite verb বা preposition এর object হিসেবে ব্যবহৃত হয়। ২) একটি sentence- এ যতগুলো finite verb থাকবে ততগুলো subject থাকবে। যদি finite verb- এর সংখ্যার চেয়ে subject এর সংখ্যা কম হয় তাহলে who বসবে আর finite verb ও subject এর সংখ্যা সমান হলে whom বসবে। এক্ষেত্রে মনে রাখা জরুরি যে, Finite verb ও subject এর সংখ্যা সমান হওয়া আবশ্যক হলেও finite verb ও object এর সংখ্যা সমান হওয়া জরুরি নয়। যেমন: I know the man who is self-dependent. (Finite verb দুইটি কিন্তু subject একটি। প্রশ্নোক্ত ক্ষেত্রে, Tell me একটি Clause. এর পরে আরেকটি Clause যুক্ত করতে হলে Clause marker প্রয়োজন হবে। Tell verb এর object থাকায় এখানে whom ব্যবহার হবে না, তাই who told you that-ই সঠিক।"}, {"id": "EL-0043", "page": 6, "chapter": "Chapter 01: Parts of Speech", "topic": "1.5 The Pronoun", "qno": "06", "question": "One should be careful about ___ duty.", "source_tag": "২৩তম বিসিএস", "options": {"ক": "his", "খ": "her", "গ": "one's", "ঘ": "the"}, "answerKey": "গ", "answerText": "one's", "explanation_bn": "এখানে one শব্দটির possessive pronoun হচ্ছে one's।"}, {"id": "EL-0044", "page": 6, "chapter": "Chapter 01: Parts of Speech", "topic": "1.5 The Pronoun", "qno": "09", "question": "The children studied in a class room ___ windows were never opened.", "source_tag": "২২তম বিসিএস", "options": {"ক": "that", "খ": "which", "গ": "where", "ঘ": "whose"}, "answerKey": "ঘ", "answerText": "whose", "explanation_bn": "দুটি অংশকে একত্র করতে হলে relative pronoun ব্যবহার করতে হবে। এখন শূন্যস্থানের পূর্বে room এবং পরে window থাকায় এদের মধ্যে সম্পর্ক বোঝাচ্ছে। আর সম্পর্ক বোঝানোর ক্ষেত্রে relative pronoun এর possessive হয় অর্থাৎ whose (যার/যেটার) হবে।"}, {"id": "EL-0045", "page": 7, "chapter": "Chapter 01: Parts of Speech", "topic": "1.5 The Pronoun", "qno": "10", "question": "My uncle has three sons, ___ work in the same office. Which of the following is the best form of pronoun in the above sentence?", "source_tag": "১৫তম বিসিএস", "options": {"ক": "All of them", "খ": "Who all", "গ": "They all", "ঘ": "All of whom"}, "answerKey": "ঘ", "answerText": "All of whom", "explanation_bn": "My uncle has three sons অংশটি একটি clause। আবার, work in the same office আরেকটি clause, যা কমা (,) দ্বারা যুক্ত হয়েছে। তাই উভয়ের মধ্যে একটি clause marker (conjunction বা relative pronoun) দরকার। (ক) ও (গ)-তে relative pronoun নেই বলে এগুলো গ্রহণযোগ্য নয়; all of whom অর্থ যাদের সকলেই, কিন্তু who all ব্যবহার করা নিয়ম সিদ্ধ নয়, কারণ বাক্যের মধ্যে who শব্দটি relative pronoun হিসেবে বসলে এর পর সরাসরি verb ব্যবহার করতে হয়। উল্লেখ্য, বাক্যে Comma এর পরিবর্তে full stop (.) থাকলে All of them ব্যবহৃত হতো।"}, {"id": "EL-0046", "page": 7, "chapter": "Chapter 01: Parts of Speech", "topic": "1.5 The Pronoun", "qno": "11", "question": "Who, Which, What are-", "source_tag": "১২তম বিসিএস", "options": {"ক": "Demonstrative pronoun", "খ": "Relative pronoun", "গ": "Reflexive Pronoun", "ঘ": "Indefinite pronoun"}, "answerKey": "খ", "answerText": "Relative pronoun", "explanation_bn": ""}, {"id": "EL-0047", "page": 7, "chapter": "Chapter 01: Parts of Speech", "topic": "1.6 The Adjective", "qno": "01", "question": "'It was a cowardly attack on a defenceless man.' Here 'cowardly' is/an ___.", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "adverb", "খ": "adjective", "গ": "noun", "ঘ": "conjunction"}, "answerKey": "খ", "answerText": "adjective", "explanation_bn": "এখানে 'cowardly' শব্দটি 'attack' শব্দকে বর্ণনা করছে। যেহেতু এটি noun (attack) কে describe করছে, তাই এটি adjective। সাধারণত noun-এর শেষে y যুক্ত হলে তা Adjective হয়। 'Coward' noun হওয়ায় 'Cowardly' শব্দটি Adjective।"}, {"id": "EL-0048", "page": 7, "chapter": "Chapter 01: Parts of Speech", "topic": "1.6 The Adjective", "qno": "02", "question": "The Word 'vital' is a/an-", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "noun", "খ": "adverb", "গ": "adjective", "ঘ": "verb"}, "answerKey": "গ", "answerText": "adjective", "explanation_bn": "Vital হলো adjective। সাধারণত suffix 'al' যোগে শব্দগুলো Noun এবং adjective দুইটি-ই হয়। Noun: committal, approval, proposal, arrival, dismissal, referral, trial, refusal, disposal, burial ইত্যাদি। Adjective: Autumnal, natural, identical, vital, visual, global ইত্যাদি।"}, {"id": "EL-0049", "page": 7, "chapter": "Chapter 01: Parts of Speech", "topic": "1.6 The Adjective", "qno": "09", "flag": "⚠ Source numbering non-sequential on this page (jumps to 09 then 08 then 05); preserved as printed.", "question": "Depression is often hereditary. The underlined word is a/an-", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "Adverb", "খ": "Adjective", "গ": "Noun", "ঘ": "Verb"}, "answerKey": "খ", "answerText": "Adjective", "explanation_bn": "'Hereditary' (বংশগত বা বংশানুক্রমিক) শব্দটি adjective। এর Noun হলো heredity (বংশগতি)। আরো কিছু শুক্রতপূর্ণ Adjective- Arbitrary, Adversary, Ancillary, Contemporary, Accessary, Ampullary, Auxiliary, Beneficiary, Contrary, Culinary, Necessary, Preliminary, Rudimentary, Bacillary, Capillary, Centenary।"}, {"id": "EL-0050", "page": 7, "chapter": "Chapter 01: Parts of Speech", "topic": "1.6 The Adjective", "qno": "08", "question": "Stockings are ___ socks.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "long", "খ": "small", "গ": "big", "ঘ": "short"}, "answerKey": "ক", "answerText": "long", "explanation_bn": "Stockings অর্থ হাঁটু পর্যন্ত বা তার ওপর পর্যন্ত লম্বা মোজা। যেহেতু মোজা হাঁটুর ওপর পর্যন্ত বিস্তৃত বোঝাচ্ছে তাই এটি Short বা small হওয়া বাঞ্ছনীয় নয়। তাই সঠিক উত্তর long অর্থাৎ 'ক'।"}, {"id": "EL-0051", "page": 7, "chapter": "Chapter 01: Parts of Speech", "topic": "1.6 The Adjective", "qno": "05", "question": "A seventeen-year-old is not ___ to vote in an election.", "source_tag": "১৮তম বিসিএস", "options": {"ক": "old enough", "খ": "as old enough", "গ": "enough old", "ঘ": "enough old as"}, "answerKey": "ক", "answerText": "old enough", "explanation_bn": "Enough শব্দটি Adjective বা Adverb এর পরে বসে কিন্তু Noun এর আগে বসে। এখানে old শব্দটি যেহেতু adjective তাই old শব্দটি enough শব্দটির আগে বসবে। উল্লেখ্য, enough শব্দটি Noun এর পূর্বে বসলে Adjective এবং Adjective এর পরে বসলে Adverb হবে।"}, {"id": "EL-0052", "page": 7, "chapter": "Chapter 01: Parts of Speech", "topic": "1.7 The Adverb", "qno": "01", "question": "Select the sentence in which 'fast' is an adverb:", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "Don't drive so fast!", "খ": "Technology is expanding at a fast pace.", "গ": "Muslims fast during Ramadan.", "ঘ": "Ushashi went on a 24-hour fast to detox."}, "answerKey": "ক", "answerText": "Don't drive so fast!", "explanation_bn": "যে word কোনো verb, adjective, adverb বা Sentence কে modify করে তাকে adverb বলে। এখানে, Don't drive so fast বাক্যটিতে 'fast' শব্দটি বাক্যের verb 'drive' কে modify করেছে। সুতরাং 'fast' শব্দটি 'adverb'।"}, {"id": "EL-0053", "page": 8, "chapter": "Chapter 01: Parts of Speech", "topic": "1.7 The Adverb", "qno": "02", "question": "'Come on, it's time to go home.' Here 'home' is a/an-", "source_tag": "৪১তম বিসিএস", "options": {"ক": "noun", "খ": "verb", "গ": "adjective", "ঘ": "adverb"}, "answerKey": "ঘ", "answerText": "adverb", "explanation_bn": "Home শব্দটি intransitive verb (go) এর পরে বসে verb কে modify করায় শব্দটি (home) adverb।"}, {"id": "EL-0054", "page": 8, "chapter": "Chapter 01: Parts of Speech", "topic": "1.7 The Adverb", "qno": "03", "question": "The mother sat vigilantly beside the sick baby. Here 'vigilantly' is-", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "a noun", "খ": "an adverb", "গ": "an adjective", "ঘ": "none of the three"}, "answerKey": "খ", "answerText": "an adverb", "explanation_bn": "Vigilantly-জাগ্রতব্যায়, সতর্কভাবে। Grammar অনুযায়ী যে word কোনো verb-কে modify করে তাকে adverb বলে। প্রদত্ত বাক্যে sat হচ্ছে verb আর কীভাবে বসেছিল সেটা বোঝাচ্ছে vigilantly শব্দটি দিয়ে। সুতরাং vigilantly শব্দটি adverb। Vigilantly-এর noun হলো- vigilance এবং এর adjective vigilant।"}, {"id": "EL-0055", "page": 8, "chapter": "Chapter 01: Parts of Speech", "topic": "1.7 The Adverb", "qno": "08", "question": "The sun went down. The underlined word is used here as a/an:", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "preposition", "খ": "adverb", "গ": "noun", "ঘ": "conjunction"}, "answerKey": "খ", "answerText": "adverb", "explanation_bn": "Underlined word 'down' বাক্যে adverb হিসেবে ব্যবহৃত হয়েছে, কেননা down শব্দটি verb কে modify করেছে। তাছাড়া, বাক্যের শেষের preposition টি adverb হয়।"}, {"id": "EL-0056", "page": 8, "chapter": "Chapter 01: Parts of Speech", "topic": "1.7 The Adverb", "qno": "09", "question": "The day of my sister's marriage is drawing near' The underlined word (near) is a/an-", "source_tag": "২৫তম বিসিএস", "options": {"ক": "adjective", "খ": "verb", "গ": "preposition", "ঘ": "adverb"}, "answerKey": "ঘ", "answerText": "adverb", "explanation_bn": "Near এখানে adverb, কারণ এটি drawing verb কে modify করেছে। সাধারণত কোনো word- Noun, Pronoun বা Interjection ছাড়া অন্য যে কোনো word কে modify করলেই তা adverb।"}, {"id": "EL-0057", "page": 8, "chapter": "Chapter 01: Parts of Speech", "topic": "1.7 The Adverb", "qno": "06", "question": "'I ___ remember the holiday I spent in your home', she said.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "ever", "খ": "hardly", "গ": "usually", "ঘ": "always"}, "answerKey": "ঘ", "answerText": "always", "explanation_bn": "Sentence টির অর্থ \"তোমার বাড়িতে কাটানোর স্মৃতি আমার সবসময় মনে পড়ে\"। এখানে, sentence টিতে positive অর্থ প্রকাশ পেয়েছে। তাই always শব্দটি ব্যবহৃত হবে। ever এবং hardly সাধারণত negative অর্থে ব্যবহৃত হয়। তাছাড়া usually এখানে প্রাসঙ্গিক নয়।"}, {"id": "EL-0058", "page": 8, "chapter": "Chapter 01: Parts of Speech", "topic": "1.7 The Adverb", "qno": "07", "question": "I spent ___ with the patient.", "source_tag": "১৩তম বিসিএস", "options": {"ক": "sometimes", "খ": "sometime", "গ": "some time", "ঘ": "some times"}, "answerKey": "গ", "answerText": "some time", "explanation_bn": "I spent some time with the patient। বাক্যের অর্থ: আমি রোগীটির সাথে কিছু সময় ব্যয় করেছিলাম, তাই এখানে অর্থ অনুযায়ী some time (কিছু সময়) বসবে। sometimes (মাঝে মাঝে) একটি Adverb যা উক্ত Sentence এর অর্থানুযায়ী অপ্রাসঙ্গিক; some times শব্দটি ব্যাকরণগত ভাবে ভুল। এর সঠিক রূপ হলো some time। sometime (কোনো এক সময়) এর ব্যবহার Sentence কে অর্থপূর্ণ করলেও some time (কিছু সময়) এখানে অধিক প্রাসঙ্গিক।"}, {"id": "EL-0059", "page": 8, "chapter": "Chapter 01: Parts of Speech", "topic": "1.7 The Adverb", "qno": "08b", "question": "He stopped his car ___ when the light turned red.", "source_tag": "২০তম বিসিএস", "options": {"ক": "abruptly", "খ": "equitably", "গ": "ambiguously", "ঘ": "incisively"}, "answerKey": "ক", "answerText": "abruptly", "explanation_bn": "Abruptly-হঠাৎ করে, আকস্মিকভাবে, অচমকা; Equitably-ন্যায় সঙ্গতভাবে; Ambiguously-অস্পষ্টভাবে, দ্ব্যর্থপূর্ণভাবে; Incisively-তীক্ষ্ণভাবে। প্রশ্নে যেহেতু নালবাতি দেখে গাড়ি থামানোর কথা বলা হয়েছে, তাই abruptly সঠিক।"}, {"id": "EL-0060", "page": 8, "chapter": "Chapter 01: Parts of Speech", "topic": "1.8 The Conjunction", "qno": "01", "question": "Which one is a coordinating conjunction?", "source_tag": "৫০তম বিসিএস", "options": {"ক": "since", "খ": "lest", "গ": "as", "ঘ": "so"}, "answerKey": "ঘ", "answerText": "so", "explanation_bn": "Coordinating conjunction একই ধরনের একাধিক Grammatical Item কে সংযুক্ত করে থাকে এবং সাধারণত Compound sentence গঠনে ব্যবহৃত হয়। coordinating conjunction মনে রাখার একটি প্রচলিত কৌশল হলো- FANBOYS – For, And, Nor, But, Or, Yet, So- এই Word গুলো coordinating conjunction হিসেবে ব্যবহৃত হয়। অন্য Option গুলো - (ক) since, (খ) lest এবং (গ) as মূলত subordinating conjunction।"}, {"id": "EL-0061", "page": 8, "chapter": "Chapter 01: Parts of Speech", "topic": "1.8 The Conjunction", "qno": "02", "question": "'He could not win but learnt a lot' Which part of speech is the word 'but'?", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "an adverb", "খ": "a verb", "গ": "an adjective", "ঘ": "a conjunction"}, "answerKey": "ঘ", "answerText": "a conjunction", "explanation_bn": "Conjunction দুই বা ততোধিক Word, phrase বা Clause কে যুক্ত করে। Coordinating Conjunction গুলো সমজাতীয় Word বা Phrase এবং Independent Clause গুলোকে একত্রিত করে। যেমন: and, but, yet, so, else, or ইত্যাদি Coordinating Conjunction এর অন্তর্ভুক্ত। Subordinating Conjunction গুলো independent Clause ও Dependent Clause এর মধ্যে যোগসূত্র স্থাপন করে। যেমন: although, if, incase, unless, while, after, provided, until ইত্যাদি। Correlative দুইটি সমজাতীয় Word, phrase বা Clause কে যুগলরূপে প্রকাশ করে। যেমন: Not only-but also, either-or, neither-nor, if-then, both-and, whether-or, no sooner-than, scarcely-when ইত্যাদি।"}, {"id": "EL-0062", "page": 9, "chapter": "Chapter 01: Parts of Speech", "topic": "1.8 The Conjunction", "qno": "03", "question": "'I shall help you provided you obey me.' Here the underlined word (provided) is a/an-", "source_tag": "৪১তম বিসিএস", "options": {"ক": "adverb", "খ": "adjective", "গ": "conjunction", "ঘ": "verb"}, "answerKey": "গ", "answerText": "conjunction", "explanation_bn": "Provided/provided that অর্থ-এই শর্তে যে/যদি। এটি দুইটি Clause কে যুক্ত করেছে। তাই এটি Conjunction হবে।"}, {"id": "EL-0063", "page": 9, "chapter": "Chapter 01: Parts of Speech", "topic": "1.8 The Conjunction", "qno": "08", "question": "___ glass is, for all practical purposes, a solid, its molecular structure is that of a liquid.", "source_tag": "২০তম বিসিএস", "options": {"ক": "Because", "খ": "Since", "গ": "Although", "ঘ": "If"}, "answerKey": "গ", "answerText": "Although", "explanation_bn": "Sentence-এ দুটি clause-এ অর্থের মধ্যে বৈপরীত্য প্রকাশ করলে dependence clause-এর শুরুতে though/although/even though/much as ব্যবহৃত হয়। প্রথম clause 'glass is, for all practical purposes, a solid'-এর অর্থ বাস্তবিক ক্ষেত্রে কাচ কঠিন পদার্থ দিয়ে তৈরি। অপরদিকে দ্বিতীয় clause 'its molecular structure is that of a liquid'-এর অর্থ আণবিক গঠন তরল। এখানে দুটি clause-এর অর্থের মধ্যে বৈপরীত্য প্রকাশ পেয়েছে তাই এখানে although ব্যবহৃত হবে।"}, {"id": "EL-0064", "page": 9, "chapter": "Chapter 01: Parts of Speech", "topic": "1.8 The Conjunction", "qno": "05", "question": "The right word to fill in the gap of the following sentence- 'Give her a telephone number to ring ___ she gets lost'-", "source_tag": "১৭তম বিসিএস", "options": {"ক": "Whether", "খ": "Incase", "গ": "Unless", "ঘ": "Perhaps"}, "answerKey": "খ", "answerText": "Incase", "explanation_bn": "পূর্ব সতর্কতা অবলম্বন করার ক্ষেত্রে Incase ব্যবহৃত হয়। সুতরাং বাক্যটি হবে- Give her a telephone number to ring incase she gets lost. Unless যদি না অর্থে শর্ত নির্দেশক এর পূর্বে ব্যবহৃত হয়। যদি অর্থে if/whether ব্যবহৃত হয়। Perhaps অর্থ সম্ভবত। এটি একটি adverb।"}, {"id": "EL-0065", "page": 9, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "01", "question": "Which functions both as a transitive and an intransitive verb?", "source_tag": "৫০তম বিসিএস", "options": {"ক": "sleep", "খ": "arrive", "গ": "break", "ঘ": "die"}, "answerKey": "গ", "answerText": "break", "explanation_bn": "'break' as an intransitive verb: The glass broke. (object ছাড়াই পূর্ণ অর্থ প্রকাশ করে); As a transitive verb: He broke the glass. (পূর্ণ অর্থ প্রকাশ করতে object আবশ্যক)। অন্য option-গুলো: (ক) sleep, (খ) arrive এবং (ঘ) die – verb গুলো object গ্রহণ করে না, object ছাড়াই পূর্ণ অর্থ প্রকাশ করে। অর্থাৎ এরা শুধুই intransitive verb।"}, {"id": "EL-0066", "page": 9, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "02", "question": "'Ihana sleeps only for four hours a night.' In this sentence the verb 'sleeps' is ___.", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "causative", "খ": "intransitive", "গ": "transitive", "ঘ": "factitive"}, "answerKey": "খ", "answerText": "intransitive", "explanation_bn": "Intransitive Verb এমন verb যা কোনো object গ্রহণ করে না, শুধুমাত্র subject-এর কাজকে বোঝায়। এখানে 'sleeps' verb টি কোনো object গ্রহণ করছে না। অর্থাৎ, এটি কারো বা কিছুর উপর ক্রিয়া সম্পন্ন করছে না, শুধুমাত্র subject (Ihana)-এর কাজকে বোঝাচ্ছে। তাই এটি Intransitive Verb।"}, {"id": "EL-0067", "page": 9, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "03", "question": "In fear of ___ he escaped elsewhere.", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "arresting", "খ": "arrested", "গ": "being arrested", "ঘ": "having arrested"}, "answerKey": "গ", "answerText": "being arrested", "explanation_bn": "প্রদত্ত Sentence-টিতে Passive sense প্রকাশিত হয়েছে। In fear of being arrested he escaped elsewhere. অর্থাৎ গ্রেফতার হওয়ার ভয়ে সে অন্য কোথাও পালিয়েছিল। সুতরাং, এখানে being arrested ব্যবহৃত হবে। \"Being arrested\" একটি gerund phrase যেটি noun হিসেবে কাজ করেছে। Preposition এর object হিসেবে gerund/ gerund phrase ব্যবহৃত হয়। যদি বাক্যটি Active Sense-এ থাকতো তাহলে in fear of এর পর Verb এর সাথে ing যুক্ত হয়ে Gerund আকারে ব্যবহৃত হতো।"}, {"id": "EL-0068", "page": 9, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "08", "question": "Which of the following words can be used as a verb?", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "mobile", "খ": "sugar", "গ": "media", "ঘ": "sand"}, "answerKey": "ঘ", "answerText": "sand", "explanation_bn": "Sand শব্দটি verb (the action of applying sand) এবং Noun (the loose granular material) হিসেবে ব্যবহৃত হয়। Verb হিসেবে এটি transitive verb; যার অর্থ এটি object গ্রহণ করে। যেমন: Sand the table. এরকম আরও কিছু Words যা Noun ও Verb হিসেবে ব্যবহৃত হয়। যেমন- arm, master, monitor, chair, hand, mind, land, fish, eye, court, captain, witness, water ইত্যাদি।"}, {"id": "EL-0069", "page": 10, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "05", "question": "The submarine dipped to avoid ___ by the enemy plane.", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "see", "খ": "being seen", "গ": "seeing", "ঘ": "seen"}, "answerKey": "খ", "answerText": "being seen", "explanation_bn": "বাক্যটি passive অর্থ প্রকাশ করায় being seen সঠিক উত্তর হবে।"}, {"id": "EL-0070", "page": 10, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "06", "question": "I didn't follow who passed by me. It ___ Shajib.", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "were", "খ": "must be", "গ": "might be", "ঘ": "was"}, "answerKey": "গ", "answerText": "might be", "explanation_bn": "May, Might-Modal Verb গুলো সম্ভাবনা প্রকাশে ব্যবহৃত হয়। প্রথম Sentence \"I didn't follow who passed by me\" দ্বারা দ্বিতীয় Sentence এর ক্ষেত্রে অনুমান/সম্ভাবনা প্রকাশ পেয়েছে।"}, {"id": "EL-0071", "page": 10, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "07", "question": "Fill in the blank with the correct word. ___ he lay on the ground groaning.", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "Injured", "খ": "Injuring", "গ": "having injured", "ঘ": "Be injured"}, "answerKey": "ক", "answerText": "Injured", "explanation_bn": "Injure হচ্ছে transitive verb। তাই একে active sense এ ব্যবহার করতে হলে object লাগবে। কিন্তু object না থাকায় এটি passive sense এ ব্যবহার হয়েছে। বাংলা অর্থ দাঁড়াবে, 'আহত হয়ে সে মাটিতে গুয়ে কাতরাচ্ছিল'। তাই এখানে Being Injured হওয়া উচিত ছিল। আর আধুনিক গ্রামারে Being টাকে উহ্য রাখা যায়। Active sense প্রকাশ পেলে Having Injured হতো, Having Injured এর পরে object থাকতো।"}, {"id": "EL-0072", "page": 10, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "08b", "question": "'I will not let you go.' In this sentence 'go' is a/an-", "source_tag": "৪১তম বিসিএস", "options": {"ক": "infinitive", "খ": "gerund", "গ": "participle", "ঘ": "verbal noun"}, "answerKey": "ক", "answerText": "infinitive", "explanation_bn": "Infinitive এর সাথে সাধারণত to ব্যবহৃত হয়। কিন্তু bid, let, make, dare, see, hear ইত্যাদি verb গুলোর পর bare infinitive ব্যবহৃত হয়। Active voice-এর ক্ষেত্রে উল্লিখিত শব্দগুলোর পরে bare infinitive (শুধু V1) ব্যবহৃত হলেও passive voice-এর ক্ষেত্রে let ব্যতীত অন্য শব্দ গুলোর পরে infinitive (to + V1) বসবে। এখানে let শব্দটি থাকায় go শব্দটি infinitive হবে।"}, {"id": "EL-0073", "page": 10, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "09b", "question": "'Huffing and puffing, we arrived at the classroom door with only seven seconds to spare.' In this sentence the verb 'arrived' is-", "source_tag": "৪১তম বিসিএস", "options": {"ক": "intransitive", "খ": "transitive", "গ": "causative", "ঘ": "defective"}, "answerKey": "ক", "answerText": "intransitive", "explanation_bn": "যে Verb এর object থাকে না তাকে Intransitive Verb বলে। Intransitive Verb চেনার সহজ উপায় হলো এর পর here বা there বসিয়ে বাক্যের অর্থ সম্পূর্ণ করা যায়। এখানে arrived এর কোনো object নেই তাই intransitive হবে।"}, {"id": "EL-0074", "page": 10, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "10", "question": "Which of the following words can be used as a verb?", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "Mister", "খ": "Master", "গ": "Mistress", "ঘ": "Mastery"}, "answerKey": "খ", "answerText": "Master", "explanation_bn": ""}, {"id": "EL-0075", "page": 10, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "11", "question": "He watched the boat ___ down the river.", "source_tag": "২৯তম বিসিএস", "options": {"ক": "to float", "খ": "floating", "গ": "was floating", "ঘ": "had floated"}, "answerKey": "খ", "answerText": "floating", "explanation_bn": "কোনো simple sentence-এ দুটি main verb ব্যবহার করা যায় না। তাই একটি verb-এর সাথে ing যোগ করতে হয় অথবা verb-টির পূর্বে to বসাতে হয়। উল্লেখ্য, উদ্দেশ্য বোঝাতে verb টির পূর্বে to বসাতে হয়। অর্থাৎ infinitive ব্যবহার করা হয়। উপরিউক্ত sentence-এ কোনো উদ্দেশ্য বোঝায় না। এছাড়া 'watch' verb-এর পর 'to' ব্যবহার করা হয় না। এরূপ আরো কিছু verb হলো- make, let, see, প্রভৃতি। তাই এখানে floating ব্যবহৃত হবে।"}, {"id": "EL-0076", "page": 10, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "12", "question": "I took a map with me, as I didn't want to ___ my way on the journey.", "source_tag": "২৭তম বিসিএস", "options": {"ক": "loose", "খ": "lose", "গ": "lost", "ঘ": "loss"}, "answerKey": "খ", "answerText": "lose", "explanation_bn": "সাধারণত Want এরপর infinitive বসে। এছাড়াও কতগুলো শব্দের পর Verb আসলে তা Infinitive হবে। যেমন: Remind, forbid, permit, intend, allow, request, instruct, encourage, force, decide, refuse, plan, hope, deserve, promise, Fail, agree, attempt, forget, expect, demand।"}, {"id": "EL-0077", "page": 11, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "13", "question": "Fill in the blank with right option. I am looking forward ___ you.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "to seeing", "খ": "seeing", "গ": "to see", "ঘ": "to have seen"}, "answerKey": "ক", "answerText": "to seeing", "explanation_bn": "সাধারণত infinitive 'to' এর পর verb এর present form ব্যবহৃত হয়। কিন্তু 'with a view to', 'Look forward to' প্রভৃতি ক্ষেত্রে ব্যতিক্রম দেখা যায়। এসব ক্ষেত্রে preposition 'to' এর পর 'verb + ing' form ব্যবহৃত হয়। যেমন: I am looking forward to seeing you।"}, {"id": "EL-0078", "page": 11, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "14", "question": "He gave up ___ football when he got married.", "source_tag": "২৬তম, ২৪তম বিসিএস", "options": {"ক": "Of playing", "খ": "To play", "গ": "Playing", "ঘ": "Play"}, "answerKey": "গ", "answerText": "Playing", "explanation_bn": "এখানে give up একটি phrasal verb। এরপর Gerund ব্যবহৃত হয়।"}, {"id": "EL-0079", "page": 11, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "15", "question": "He advised me ___ smoking.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "giving up", "খ": "to give up", "গ": "in giving up", "ঘ": "from giving up"}, "answerKey": "খ", "answerText": "to give up", "explanation_bn": "Advise verb-এর পরে object না থাকলে Infinitive না বসে verb-এর সাথে ing যুক্ত হয়। যেমন: He advised giving up smoking. কিন্তু Advise verb-এর পরে object থাকলে infinitive ব্যবহৃত হয়। যেমন: He advised me to give up smoking।"}, {"id": "EL-0080", "page": 11, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "16", "question": "My wife reminded me ___.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "of my appointment", "খ": "to go my appointment", "গ": "to my appointment", "ঘ": "my appointment"}, "answerKey": "ক", "answerText": "of my appointment", "explanation_bn": "Remind (somebody) of something অর্থ কাউকে কোনো কিছু স্মরণ করিয়ে দেওয়া। 'My wife reminded me of my appointment' বাক্যটির অর্থ 'আমার স্ত্রী আমার নিয়োগের কথা স্মরণ করিয়ে দিয়েছিল।'"}, {"id": "EL-0081", "page": 11, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "17", "question": "Travellers ___ their reservations well in advance if they want to fly during the Eid holidays.", "source_tag": "১৮তম বিসিএস", "options": {"ক": "had better to get", "খ": "had to get better", "গ": "had better get", "ঘ": "had better got"}, "answerKey": "গ", "answerText": "had better get", "explanation_bn": "Had better/had rather/would rather/would better ইত্যাদি modal auxiliary, এদের পরে bare infinitive বসে অর্থাৎ, শুধু verb এর base form বসে।"}, {"id": "EL-0082", "page": 11, "chapter": "Chapter 01: Parts of Speech", "topic": "1.9 The Verb", "qno": "18", "question": "Almost everyone fails ___ one the first try.", "source_tag": "১৮তম বিসিএস", "options": {"ক": "in passing his driver's test", "খ": "to his driver's test", "গ": "to have passed his driver's test", "ঘ": "Passing his driver's test"}, "answerKey": "গ", "answerText": "to have passed his driver's test", "explanation_bn": ""}, {"id": "EL-0083", "page": 11, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "01", "question": "You will need a variety of skills, including leadership, endurance etc. 'In this sentence the word including' is a -", "source_tag": "৫০তম বিসিএস", "options": {"ক": "conjunction", "খ": "gerund", "গ": "participle", "ঘ": "preposition"}, "answerKey": "ঘ", "answerText": "preposition", "explanation_bn": "Including + noun/gerund-form-টি উদাহরণ/অন্তর্ভুক্তি প্রকাশে ব্যবহৃত হয়, যেখানে including preposition-এর মতো কাজ করে। অন্য option-গুলো: (ক) যেহেতু দুটি Clause কে যুক্ত করছে না, তাই conjunction নয়, (খ) Grammatically noun নয়, তাই gerund হওয়ার সুযোগ নেই এবং (গ) Adjective বা verb নয়, তাই Participle হতে পারে না। participle—দেখতে -ing হলেও এখানে verb-like কাজ না করে inclusion-marker হিসেবে বসেছে।"}, {"id": "EL-0084", "page": 11, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "02", "question": "He died following the incident. The underlined word (following) is a/an-", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "adjective", "খ": "adverb", "গ": "noun", "ঘ": "preposition"}, "answerKey": "ঘ", "answerText": "preposition", "explanation_bn": "participle যখন noun এর পূর্বে বসে preposition এর কাজ করে, তখন এদেরকে participial preposition বলে। যেমন: Touching (with regard to) regarding/concerning/respecting (about, with respect to), following (after), notwithstanding (despite), pending (until), failing (without), barring/excepting/excluding (but/without) ইত্যাদি। এই বাক্যে 'following' শব্দটি after অর্থে preposition হিসেবে ব্যবহৃত হয়েছে।"}, {"id": "EL-0085", "page": 11, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "03", "question": "There is a coffee shop ___ the street.", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "at", "খ": "on", "গ": "before", "ঘ": "across"}, "answerKey": "ঘ", "answerText": "across", "explanation_bn": "রাস্তা, মাঠ, নদী বা খাল পার হওয়া বা একপাশ থেকে অন্যপাশে যাওয়া বুঝাতে across ব্যবহৃত হয়। আবার রাস্তা, নদী বা খাল এর অন্যপাশে অবস্থিত বুঝাতেও across ব্যবহৃত হয়। রাস্তার ঠিক বিপরীত পাশে একটি কফি হাউস অবস্থিত- এই অর্থে এখানে across ব্যবহৃত হবে।"}, {"id": "EL-0086", "page": 12, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "08", "question": "The train is running ___ forty miles an hour.", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "on", "খ": "to", "গ": "at", "ঘ": "for"}, "answerKey": "গ", "answerText": "at", "explanation_bn": "ছোট স্থানের পূর্বে, নির্দিষ্ট সময়/নির্দিষ্ট মূল্য/নির্দিষ্ট তাপমাত্রা/নির্দিষ্ট পৃষ্ঠা ইত্যাদির পূর্বে at বসে। specific speed (গতি) বুঝাতেও at ব্যবহৃত হয়। যেকোনো রাত বুঝাতে at night এবং একটি নির্দিষ্ট রাত বুঝাতে in the night ব্যবহৃত হয়। ঘড়ির নির্দিষ্ট সময়, দিনের নির্দিষ্ট সময়বিন্দু বা মুহূর্ত (midday), সপ্তাহের নির্দিষ্ট সময়বিন্দু বা মুহূর্ত (weekend), বিশেষ উৎসব (Eid-Ul-Fitr) বুঝাতে এর পূর্বে at বসে। যেমন: at 3:00 am, at 1:00 pm, at dawn, at noon, at midday, at the weekend, at Eid-Ul-Fitr, at the new year।"}, {"id": "EL-0087", "page": 12, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "05", "question": "He divided the money ___ the two children.", "source_tag": "৪৫তম, ২৬তম, ২১তম বিসিএস", "options": {"ক": "between", "খ": "over", "গ": "among", "ঘ": "in between"}, "answerKey": "ক", "answerText": "between", "explanation_bn": "সাধারণত দুটি ব্যক্তি বা বস্তুর ক্ষেত্রে Between এবং দুইয়ের অধিক ব্যক্তি বা বস্তুর ক্ষেত্রে Among বসে। উল্লেখ্য, দুইয়ের অধিক Proper Noun থাকলে বা আলাদা সত্তা বুঝালে দুইয়ের অধিক কোনো কিছুর ক্ষেত্রেও Between বসে। যেমন: Nepal lies between India, China and Bhutan. আবার 'পারস্পরিক সম্পর্ক' বুঝাতেও দুইয়ের অধিকের মধ্যে Between বসে। যেমন: There is a treaty (চুক্তি) of friendship between the five great powers।"}, {"id": "EL-0088", "page": 12, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "06", "question": "Select the appropriate preposition: 'Are you doing' anything special ___ the weekend?'", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "at", "খ": "with", "গ": "on", "ঘ": "for"}, "answerKey": "ক", "answerText": "at", "explanation_bn": "সাপ্তাহিক ছুটির দিন বোঝাতে weekend ব্যবহৃত হয়, এর পূর্বে preposition হিসেবে at এবং on দুটোই ব্যবহৃত হতে পারে। American English এ on ব্যবহৃত হয় এবং British English এ at ব্যবহৃত হয়। আমরা যেহেতু, writing এর ক্ষেত্রে British English অনুসরণ করি তাই at হবে সঠিক উত্তর।"}, {"id": "EL-0089", "page": 12, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "07", "question": "Fill in the blank: 'She went to New Market ___'", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "on foot", "খ": "on feet", "গ": "by foot", "ঘ": "by walking"}, "answerKey": "ক", "answerText": "on foot", "explanation_bn": "পায়ে হেঁটে কোথাও যাওয়া বুঝাতে on foot ব্যবহৃত হয়।"}, {"id": "EL-0090", "page": 12, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "08b", "question": "Do you have any money ___ you? Fill in the blank with appropriate preposition:", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "to", "খ": "over", "গ": "in", "ঘ": "on"}, "answerKey": "ঘ", "answerText": "on", "explanation_bn": "কোনো ব্যক্তির কাছে টাকা আছে বোঝাতে preposition হিসেবে on ব্যবহৃত হয়। এছাড়াও ম্যাপে তথ্য অনুসন্ধানের ক্ষেত্রে; বিশেষ দিবস, নির্দিষ্ট দিন, বার বা তারিখের পূর্বে; মাধ্যম বা যন্ত্র বুঝাতে Preposition 'on' বসে। যেমন: on 10th January, on 16th December, on Friday, on Victory day, on Pohela Baishakh, on your birthday, on Fridays (every friday), on television, on air ইত্যাদি। উল্লেখ্য, সকাল, দুপুর, বিকাল বুঝাতে in the morning/afternoon/evening হয়। কিন্তু, সুনির্দিষ্ট সকাল, দুপুর, বিকাল অর্থে on the morning/evening/afternoon বসে। যেমন: on the morning of 21st February।"}, {"id": "EL-0091", "page": 12, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "09", "question": "Would you please find out Bangladesh ___ the map.", "source_tag": "৪২তম বিসিএস", "options": {"ক": "in", "খ": "over", "গ": "on", "ঘ": "at"}, "answerKey": "গ", "answerText": "on", "explanation_bn": ""}, {"id": "EL-0092", "page": 12, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "10", "question": "When Ushashi entered ___ the room everybody stopped talking.", "source_tag": "৪১তম বিসিএস", "options": {"ক": "into", "খ": "in", "গ": "to", "ঘ": "no preposition required"}, "answerKey": "ঘ", "answerText": "no preposition required", "explanation_bn": "Enter, discuss, consider, resemble, answer, reach, tackle, marry, divorce ইত্যাদি শব্দ গুলোর পরে কোনো Preposition বসে না। তবে infinitive এর ক্ষেত্রে এটি প্রযোজ্য নয়। সময় প্রকাশের ক্ষেত্রে next, last, this that, every, some, any ইত্যাদির পূর্বে কোনো Preposition বসে না।"}, {"id": "EL-0093", "page": 12, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "11", "question": "'Call me if you have any problems regarding your work'. Here 'regarding' is a/an-", "source_tag": "৪১তম বিসিএস", "options": {"ক": "gerund", "খ": "apposition", "গ": "preposition", "ঘ": "conjunction"}, "answerKey": "গ", "answerText": "preposition", "explanation_bn": ""}, {"id": "EL-0094", "page": 12, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "12", "question": "Fill in the blank: You may go for a walk if you feel ___ it.", "source_tag": "৪০তম বিসিএস", "options": {"ক": "about", "খ": "on", "গ": "like", "ঘ": "for"}, "answerKey": "গ", "answerText": "like", "explanation_bn": "মাঝে মাঝে like preposition হিসেবে ব্যবহৃত হয়। Feel like something অর্থ কোনো কিছু করার ঝোঁক থাকা বা কোনো কিছুর প্রত্যাশা করা। যেমন: I feel like reading. feel like এর পরে Verb আসলে এর সাথে ing যুক্ত হয়। প্রদত্ত বাক্যটির বাংলা অর্থ- যদি হাঁটার ইচ্ছা হয় তাহলে তুমি হাঁটতে যেতে পার।"}, {"id": "EL-0095", "page": 13, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "13", "question": "'There was a small reception following the wedding'. The word 'following' in the sentence above is a/an-", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "preposition", "খ": "adjective", "গ": "adverb", "ঘ": "noun"}, "answerKey": "ক", "answerText": "preposition", "explanation_bn": ""}, {"id": "EL-0096", "page": 13, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "14", "question": "'Among' is a preposition that is used when ___ people are involved.", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "two", "খ": "more than two", "গ": "four only", "ঘ": "two or more than two"}, "answerKey": "খ", "answerText": "more than two", "explanation_bn": ""}, {"id": "EL-0097", "page": 13, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "15", "question": "Choose the appropriate prepositions in the blank of the following sentence: The family doesn't feel ___ going outing this season.", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "in", "খ": "like", "গ": "on", "ঘ": "of"}, "answerKey": "খ", "answerText": "like", "explanation_bn": ""}, {"id": "EL-0098", "page": 13, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "16", "question": "Professor Razzak was a scholar ___ refute. (Fill in the gap).", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "in", "খ": "of", "গ": "after", "ঘ": "by"}, "answerKey": null, "answerText": "Blank (no option marked)", "flag": "⚠ Source shows answer as 'Blank' — no option marked in the original.", "explanation_bn": "Refute (v)-মতামত বা বিবৃতি খণ্ডন করা। শব্দটি verb বলে এর পূর্বে preposition বসে তা বাক্যটিকে অর্থবোধক করে না। তবে শব্দটি যদি refute না হয়ে repute হতো, তাহলে শূন্যস্থানে 'of' ব্যবহার করলে বাক্যটি অর্থপূর্ণ হয়। সেক্ষেত্রে বাক্যটির অর্থ হয়- অধ্যাপক রাজ্জাক ছিলেন একজন খ্যাতিসম্পন্ন পণ্ডিত বা বিদ্বান লোক।"}, {"id": "EL-0099", "page": 13, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "17", "question": "I have been living in Dhaka ___ 2000.", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "since", "খ": "from", "গ": "after", "ঘ": "till"}, "answerKey": "ক", "answerText": "since", "explanation_bn": "", "explanation_table": [["Period of time", "Point of time"], ["Period of time কিছু সময়ের সমষ্টি বা পরিমাণকে নির্দেশ করে যা একক দ্বারা প্রকাশ করা যায়। যেমন: an hour, two days, a year, five weeks, seven decades, a long time ইত্যাদি।", "Point of time নির্দিষ্ট মুহূর্ত বা সময়কে নির্দেশ করে যা গণনার একেকে পরিমাপযোগ্য নয়। যেমন: 5:00 O'clock, morning, night, friday, 5th January, 1971, 5th decade etc."], ["Period of time এর পূর্বে for বসে। যেমন: Julia has been ill for three months.", "Point of time এর পূর্বে since বসে। যেমন: I have been living in Dhaka since 2000."]]}, {"id": "EL-0100", "page": 13, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "18", "question": "Credit tk 5000 ___ my account.", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "in", "খ": "with", "গ": "against", "ঘ": "to"}, "answerKey": "ঘ", "answerText": "to", "explanation_bn": "কারও ব্যাংক অ্যাকাউন্টে টাকা রাখা অর্থে 'credit' verb-টির সাথে 'to' Preposition ব্যবহৃত হয়। I have credited 5000tk to your account. কিন্তু টাকার পরিমাণটি যদি বাক্যের শেষে থাকে তাহলে Preposition 'with' ব্যবহৃত হবে। যেমন- Your account has been credited with 5000 tk।"}, {"id": "EL-0101", "page": 13, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "19", "question": "Noureen will discuss the issue with Nasir ___ phone.", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "in", "খ": "over", "গ": "by", "ঘ": "on"}, "answerKey": "গ", "answerText": "by", "explanation_bn": "Phone বা Telephone এর মাধ্যমে সাধারণ যোগাযোগ বুঝাতে Over the phone অথবা By phone বসে। যেমন: Noureen will discuss the issue with Nasir by phone/over the phone. অথবা Rizvi requested Rini over the/by telephone to attend the meeting। কিন্তু, Phone বা Telephone এ কথা বলা চলছে (Continuous) বুঝাতে On the phone ব্যবহৃত হয়। যেমন: He spent the entire afternoon on the phone। প্রশ্নোক্ত ক্ষেত্রে ফোনে সাধারণ যোগাযোগ বুঝাচ্ছে। তাই preposition 'by' হবে। উল্লেখ্য, Instrument (telephone, fax etc.) এর আগে the থাকলে over এবং the না থাকলে by ব্যবহৃত হবে।"}, {"id": "EL-0102", "page": 14, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "20", "question": "Wordsworth introduced the readers ___ a new kind of poetry.", "source_tag": "৩১তম বিসিএস", "options": {"ক": "with", "খ": "at", "গ": "to", "ঘ": "by"}, "answerKey": "গ", "answerText": "to", "explanation_bn": "Introduce somebody to something- কাউকে কোনো কিছুর সাথে পরিচিত করানো। আর ব্যক্তির সঙ্গে পরিচয় করানো অর্থে introduce with ব্যবহৃত হয়।"}, {"id": "EL-0103", "page": 14, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "21", "question": "They travelled to Savar-", "source_tag": "২৯তম বিসিএস", "options": {"ক": "on foot", "খ": "by walking", "গ": "on their feet", "ঘ": "by foot"}, "answerKey": "ক", "answerText": "on foot", "explanation_bn": ""}, {"id": "EL-0104", "page": 14, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "22", "question": "Rizvi requested Rini ___ telephone to attend the meeting.", "source_tag": "২৮তম বিসিএস", "options": {"ক": "over", "খ": "through", "গ": "with", "ঘ": "by"}, "answerKey": "ঘ", "answerText": "by", "explanation_bn": ""}, {"id": "EL-0105", "page": 14, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "23", "question": "Many prefer donating money ___ distributing clothes.", "source_tag": "২৮তম বিসিএস", "options": {"ক": "than", "খ": "but", "গ": "to", "ঘ": "without"}, "answerKey": "গ", "answerText": "to", "explanation_bn": "Prefer to অর্থ অধিকতর পছন্দ করা, শ্রেয় মনে করা ইত্যাদি। উল্লেখ্য, Senior, Junior, Inferior, Superior, Prior, Ulterior Posterior ইত্যাদি Latin comparative গুলোর পরে preposition 'to' বসে। এই comparative গুলোর পরে object এর যে format থাকবে to এর পরে ঠিক সেই format-ই হবে। যেমন: Many prefer donating money to distributing clothes. এখানে donating money এবং distributing clothes একই format-এ আছে। আবার, He prefer walking to playing বা He prefer cat to dog।"}, {"id": "EL-0106", "page": 14, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "24", "question": "Julia has been ill ___ three months.", "source_tag": "২৮তম বিসিএস", "options": {"ক": "since", "খ": "about", "গ": "in", "ঘ": "for"}, "answerKey": "ঘ", "answerText": "for", "explanation_bn": ""}, {"id": "EL-0107", "page": 14, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "25", "question": "Fill in the blank with appropriate preposition. 'Hurry up! we have to go ___ five minutes.'", "source_tag": "২৭তম বিসিএস", "options": {"ক": "in", "খ": "by", "গ": "on", "ঘ": "for"}, "answerKey": "ক", "answerText": "in", "explanation_bn": "ভবিষ্যতে কোনো কাজ period of time এর মধ্যে ঘটবে বুঝাতে in/within বসে। period of time এর মধ্যে অথবা উক্ত সময়সীমার বাহিরে নয় বুঝাতে within বসবে। যেমন: Hurry up! we have to go in five minutes. আবার, ভবিষ্যতে কোনো কাজ point of time এর মধ্যে ঘটবে বা সম্পন্ন করা হবে বুঝালে এর পূর্বে by বসে। যেমন: If you work steadily, we can finish by noon/five o'clock. প্রশ্নোক্ত Sentence টিতে বলা হয়েছে ৫ মিনিট সময় আছে, এর মধ্যে বা ৫ মিনিটের পূর্বে অবশ্য পৌঁছতে হবে। 5 minutes দ্বারা period of time বুঝায়। তাই এর পূর্বে in বসবে।"}, {"id": "EL-0108", "page": 14, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "26", "question": "Choose the correct preposition. My brother has no interest ___ music.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "for", "খ": "in", "গ": "with", "ঘ": "at"}, "answerKey": "খ", "answerText": "in", "explanation_bn": "Interest for-কোনো বিষয় সম্পর্কে অধিক জানার আগ্রহ প্রকাশ করতে ব্যবহৃত হয়। যেমন: I have interest for the middle east countries. Interest in-যেকোনো বিষয়ে আগ্রহ বোঝাতে এটি বসে। যেমন: I have interest in technology. Interest with এর কোনো ব্যবহার নেই। Interest at-খেলাধুলায় আগ্রহ বুঝাতে এটি বসে।"}, {"id": "EL-0109", "page": 14, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "27", "question": "Choose the right word to fill in the blank: I should appreciate it if you could complete this work ___ Thursday.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "till", "খ": "untill", "গ": "upto", "ঘ": "by"}, "answerKey": "ঘ", "answerText": "by", "explanation_bn": "ভবিষ্যতে কোনো কাজ point of time এর মধ্যে ঘটবে বা সম্পন্ন করা হবে বুঝালে এর পূর্বে by বসে। I should appreciate it if you could complete this work by Thursday. অর্থাৎ, বৃহস্পতিবারের মধ্যে তুমি কাজটি শেষ করতে পারলে আমাকে তোমার মূল্যায়ন করা উচিৎ। এখানে Thursday দ্বারা point of time বুঝায়। তাই by বসবে।"}, {"id": "EL-0110", "page": 14, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "28", "question": "My friend always goes home ___ foot.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "by", "খ": "with", "গ": "on a", "ঘ": "on"}, "answerKey": "ঘ", "answerText": "on", "explanation_bn": ""}, {"id": "EL-0111", "page": 15, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "29", "question": "The intellectual can no longer be said to live ___ the margin of society.", "source_tag": "২০তম বিসিএস", "options": {"ক": "against", "খ": "beyond", "গ": "inside", "ঘ": "before"}, "answerKey": "খ", "answerText": "beyond", "explanation_bn": "কোনো সীমার বাইরে (out of stated limit) বুঝাতে beyond বসে। বাক্যটির অর্থ হল বুদ্ধিজীবীরা সমাজের ঊর্ধ্বে বাস করতে পারে না। Margin of society বলতে এখানে সমাজের সীমারেখা বোঝানো হয়েছে। তাই beyond বসবে।"}, {"id": "EL-0112", "page": 15, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "30", "question": "Are you doing anything special ___ the weekend? Fill in the gap with appropriate preposition.", "source_tag": "১৫তম বিসিএস", "options": {"ক": "in", "খ": "for", "গ": "on", "ঘ": "at"}, "answerKey": "ঘ", "answerText": "at", "explanation_bn": ""}, {"id": "EL-0113", "page": 15, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "31", "question": "We have recently entered ___ an agreement with the Inland Co-operative Society. Which of the following best fits in the blank space?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "no preposition", "খ": "upon", "গ": "in", "ঘ": "into"}, "answerKey": "ঘ", "answerText": "into", "explanation_bn": "ভেতরে প্রবেশ করা বা আসা বোঝাতে enter –এর পর কোনো preposition বসে না। অধিকার লাভ করার ক্ষেত্রে enter-এর পর on/upon বসে। নথিভুক্ত করার ক্ষেত্রে enter-এর পর in বসে এবং চুক্তিতে সম্মত হওয়া বোঝাতে enter-এর পর into বসে।"}, {"id": "EL-0114", "page": 15, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "32", "question": "Fill in the blank 'What is the time ___ your watch'?", "source_tag": "১২তম বিসিএস", "options": {"ক": "by", "খ": "in", "গ": "at", "ঘ": "with"}, "answerKey": "ক", "answerText": "by", "explanation_bn": "বস্তু/ব্যক্তির পাশে বা নিকটে বুঝাতে; ঘড়ির কাজকে নির্দেশ করতে বা সময় জানতে; যোগাযোগ মাধ্যম বুঝাতে Phone, telephone, fax, letter, email, post ইত্যাদির আগে এবং মাঝে মাঝে during অর্থে by ব্যবহৃত হয়। এখানে, সময় জানতে চাওয়া অর্থে Watch-এর পূর্বে 'by' বসবে।"}, {"id": "EL-0115", "page": 15, "chapter": "Chapter 01: Parts of Speech", "topic": "1.10 The Preposition", "qno": "33", "question": "'He has been ill ___ Friday last'. Fill in the blank.", "source_tag": "১১তম বিসিএস", "options": {"ক": "Since", "খ": "In", "গ": "From", "ঘ": "On"}, "answerKey": "ক", "answerText": "Since", "explanation_bn": ""}, {"id": "EL-0116", "page": 15, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "01", "question": "Do you know the solution ___ the problem?", "source_tag": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "of", "খ": "for", "গ": "about", "ঘ": "to"}, "answerKey": "ঘ", "answerText": "to", "explanation_bn": "Solution to-সমাধান; কোনো সমস্যার সমাধান চাওয়া অর্থে 'Solution to' preposition টি ব্যবহৃত হয়। উদাহরণ: He found a solution to the math problem. অর্থ-সে গণিত সমস্যার সমাধান খুঁজে পেল।"}, {"id": "EL-0117", "page": 15, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "02", "question": "She succeeded ___ her good work.", "source_tag": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "because", "খ": "since", "গ": "because of", "ঘ": "as"}, "answerKey": "গ", "answerText": "because of", "explanation_bn": "Because of একটি preposition, যার পরে noun/noun phrase বসে। এখানে 'her good work' একটি noun phrase তাই 'because of' সঠিক। যেমন: He failed because of his carelessness. Because, since, as এগুলো conjunction, অর্থাৎ এগুলোর পরে subject + verb থাকে। যেমন: She succeeded because she worked hard।"}, {"id": "EL-0118", "page": 15, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "03", "question": "Fill in the blank with the appropriate preposition: 'She was married ___ a rich man'.", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "with", "খ": "of", "গ": "to", "ঘ": "off"}, "answerKey": "গ", "answerText": "to", "explanation_bn": "\"Married\" এর সাথে relationship বা spouse নির্দেশ করতে 'to' ব্যবহার হয়। যেমন: She is married to a doctor. He got married to his childhood friend. Marry off → (পারিবারিকভাবে) বিয়ে দেয়া।"}, {"id": "EL-0119", "page": 15, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "08", "flag": "⚠ Source numbering jumps 03→08 on this page, preserved as printed.", "question": "The snow swirls ___ the valley.", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "up", "খ": "in", "গ": "down", "ঘ": "through"}, "answerKey": "ঘ", "answerText": "through", "explanation_bn": "swirl down বলতে কোনো কিছুর নিম্ন দিকে চলাচলকে নির্দেশ করে। যেমন: The snow swirls down from the higher ground. অপরদিকে, swirl through ব্যবহৃত হয় কোনো কিছুর সমতল এবং সমান্তরাল জায়গায় চলাচল বুঝাতে। যেমন: The snow swirls through the valley. উল্লেখ্য, The snow swirls down the valley. Sentence-টি A Mother in Manville গল্প থেকে নেয়া হয়েছে। লেখক এখানে swirls down ব্যবহার করলেও Grammar অনুযায়ী উক্ত ক্ষেত্রে swirls through-ই Appropriate।"}, {"id": "EL-0120", "page": 16, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "05", "question": "He does not adhere ___ any principle.", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "by", "খ": "in", "গ": "at", "ঘ": "to"}, "answerKey": "ঘ", "answerText": "to", "explanation_bn": "Adhere to (sth)- লেগে থাকা, অটল থাকা। Sentence-টির অর্থ 'সে কোনো নীতির উপর অবিচল থাকে না।'"}, {"id": "EL-0121", "page": 16, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "06", "question": "I can't put up with him any more. Here \"put up with\" means:", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "To protect", "খ": "To terminate", "গ": "To tolerate", "ঘ": "To prevent"}, "answerKey": "গ", "answerText": "To tolerate", "explanation_bn": "Put up with- to tolerate or endure something। কোনো কিছু সহ্য করা।"}, {"id": "EL-0122", "page": 16, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "07", "question": "Anger may be compared ___ fire.", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "to", "খ": "within", "গ": "against", "ঘ": "into"}, "answerKey": "ক", "answerText": "to", "explanation_bn": "Compare to-অর্থ অসম বস্তুর মধ্যে তুলনা করা। যেমন: Anger may be compared to fire। আর Compare with-অর্থ একই জাতীয় জিনিসের তুলনা করা। যেমন: Nazrul can be compared with Shelley।"}, {"id": "EL-0123", "page": 16, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "08b", "question": "Identify the appropriate preposition: Your opinion is identical ___ mine.", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "for", "খ": "in", "গ": "with", "ঘ": "by"}, "answerKey": "গ", "answerText": "with", "explanation_bn": "Identical with মানে হলো অভিন্ন, একই বা মিল। Identical with ও Identical to একই অর্থ বহন করলেও Identical with এর ব্যবহারই অধিক প্রচলিত ও যুক্তিযুক্ত। Sentence-টিতে মতামতের সাথে মতামতের মিল হওয়া বুঝাতে Identical with ব্যবহৃত হয়েছে।"}, {"id": "EL-0124", "page": 16, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "09", "question": "Choose the appropriate preposition in the blank of the following sentence: Eight men were concerned ___ the plot.", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "at", "খ": "with", "গ": "in", "ঘ": "for"}, "answerKey": "গ", "answerText": "in", "explanation_bn": "concerned in- সংশ্লিষ্ট, concerned for- উদ্বিগ্ন। খারাপ কিছুর সাথে জড়িত থাকলে concerned in। যেমন: Four men were concerned in this murder. আর ভালো কিছুর সাথে জড়িত থাকলে concern with বসে। যেমন: Abul Kalam Azad was concerned with the independent movement of Indian subcontinent।"}, {"id": "EL-0125", "page": 16, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "10", "question": "John Smith is good ___ Mathematics. (Fill in the gap)", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "at", "খ": "in", "গ": "of", "ঘ": "after"}, "answerKey": "ক", "answerText": "at", "explanation_bn": ""}, {"id": "EL-0126", "page": 16, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "11", "question": "He insisted ___ there. (Fill in the gap)", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "on my going", "খ": "is to go", "গ": "over going", "ঘ": "to go"}, "answerKey": "ক", "answerText": "on my going", "explanation_bn": "insist এর পর preposition on বসে। এর পরে Pronoun- আসলে এর possessive form এবং verb আসলে এর সাথে ing যোগ করতে হয়।"}, {"id": "EL-0127", "page": 16, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "12", "question": "Your conduct admits ___ no excuse.", "source_tag": "২৯তম বিসিএস", "options": {"ক": "to", "খ": "for", "গ": "of", "ঘ": "at"}, "answerKey": "গ", "answerText": "of", "explanation_bn": "'Admit to' অর্থ ভর্তি হওয়া, স্বীকার করা বা স্বীকারোক্তি দেয়া। যেমন: He admits to his fault. 'Admit of' অর্থ হলো 'অবকাশ থাকা'। Sentence- এর অর্থ দাঁড়ায় 'তোমার আচরণে অজুহাত/কৈফিয়তের অবকাশ নেই।' admit-এর সঙ্গে 'for' এবং 'at' ব্যবহার করা যায় না।"}, {"id": "EL-0128", "page": 16, "chapter": "Chapter 01: Parts of Speech", "topic": "1.11 Appropriate Preposition", "qno": "13", "question": "I shall not ___ the examination this year.", "source_tag": "২৯তম বিসিএস", "options": {"ক": "give", "খ": "appear at", "গ": "sit", "ঘ": "go for"}, "answerKey": "খ", "answerText": "appear at", "explanation_bn": "পরীক্ষায় অংশগ্রহণ করা বা পরীক্ষা দেওয়া অর্থে Appear at, sit for, go in for, take ইত্যাদি ব্যবহৃত হয়।"}, {"id": "EL-0129", "page": 17, "chapter"
