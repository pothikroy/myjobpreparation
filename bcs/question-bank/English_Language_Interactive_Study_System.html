লে।"}, {"id": "EL-0263", "page": 32, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "49", "question": "We must keep our fingers ___ that the weather will stay fine for the picnic tomorrow.", "source_tag": "২২তম বিসিএস", "options": {"ক": "raised", "খ": "pointed", "গ": "lifted", "ঘ": "cressed (crossed)"}, "answerKey": "ঘ", "answerText": "cressed (crossed)", "explanation_bn": "keep one's fingers crossed (cressed) অর্থ হলো কারো ইচ্ছা অনুযায়ী কোনো কিছু ঘটবে এরূপ আশা পোষণ করা বা কামনা করা (to hope that things will happen in the way that one want them to)। Keeping fingers raised, keeping fingers pointed or keeping fingers lifted এ জাতীয় phrase সচরাচর দেখা যায় না।"}, {"id": "EL-0264", "page": 33, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "50", "question": "If a man is, 'worth his salt.' he is-", "source_tag": "১৮তম বিসিএস", "options": {"ক": "a soldier", "খ": "a thirsty man", "গ": "a valuable employee", "ঘ": "a highly paid worker"}, "answerKey": "ঘ", "answerText": "a highly paid worker", "explanation_bn": "Worth his salt বলতে এমন ব্যক্তিকে বুঝায় যে উচ্চ বেতন ও সম্মানের যোগ্য (someone deserving respect and worth high payment) এখানে a Highly paid worker phrase-টি Worth his salt এর সমান।"}, {"id": "EL-0265", "page": 33, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "51", "question": "When a person says he's 'all in', it means-", "source_tag": "১৭তম বিসিএস", "options": {"ক": "He is very tired", "খ": "He has arrived", "গ": "He has finished packing", "ঘ": "He has got everything"}, "answerKey": "ক", "answerText": "He is very tired", "explanation_bn": "All in- অত্যন্ত পরিশ্রান্ত, যার ইংরেজি very tired. উল্লেখ্য, all in all অর্থ সর্বেসর্বা।"}, {"id": "EL-0266", "page": 33, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "52", "question": "What is the meaning of the expression 'bottom line'?", "source_tag": "১৫তম বিসিএস", "options": {"ক": "The final step", "খ": "The end of a road", "গ": "The last line of a book", "ঘ": "The essential point"}, "answerKey": "ঘ", "answerText": "The essential point", "explanation_bn": "Bottom line-এর অর্থ কোনো কিছুর অপরিহার্য অংশ (The essential point) আবার, নির্দিষ্ট পরিমাণ অর্থ যা ব্যবসায়ে লাভ বা ক্ষতি হয়েছে বা কোনো গুরুত্বপূর্ণ বিষয়/ঘটনা, অথবা সর্বনিম্ন পরিমাণ অর্থ যা ক্রেতা পণ্যের জন্য দিতে কিংবা বিক্রেতা নিতে রাজি থাকে- অর্থেও Bottom line ব্যবহৃত হয়।"}, {"id": "EL-0267", "page": 33, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "53", "question": "'Boot leg' means to-", "source_tag": "১৫তম বিসিএস", "options": {"ক": "distribute", "খ": "export", "গ": "import", "ঘ": "smuggle"}, "answerKey": "ঘ", "answerText": "smuggle", "explanation_bn": "Boot leg- চোরা কারবার করা, বেআইনিভাবে পণ্য পরিবহণ। distribute- বিতরণ করা; export- রপ্তানি করা; import- আমদানি করা এবং smuggle- চোরা কারবার করা।"}, {"id": "EL-0268", "page": 33, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "54", "question": "You should show good manners in the company of young ladies. Which is the appropriate phrase for the underline expression above?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "behave gently", "খ": "practise manners", "গ": "behave yourself", "ঘ": "do not talk rudely"}, "answerKey": "ক", "answerText": "behave gently", "explanation_bn": "Show good manners-phrase-টির অর্থ-ভালো আচরণ বা ব্যবহার প্রদর্শন করা অথবা ভদ্র/বিনম্র ব্যবহার করা। behave gently- নম্রভাবে ব্যবহার করা; practice manners- প্রথা বা পদ্ধতি চর্চা করা; behave yourself- নিজে ব্যবহার করা (নিজের মতো); do not talk rudely- কথা বলো না (অভদ্রভাবে)।"}, {"id": "EL-0269", "page": 33, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "55", "question": "The invention of computer has turned over a new leaf in the history of modern technology. Which of the following is nearest in meaning to the italicized idiom above?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "created a new history", "খ": "began a new civilization", "গ": "opened a new chapter", "ঘ": "created a sensation"}, "answerKey": "গ", "answerText": "opened a new chapter", "explanation_bn": "Turn over a new leaf- নতুন অধ্যায়ের সূচনা করা (Opened a new chapter). Created a new history- নব ইতিহাস সৃষ্টি করেছে; Began a new civilization- নব্য সভ্যতার সূচনা করেছে এবং Created a sensation- নতুন উত্তেজনাকর ঘটনার সৃষ্টি করেছে।"}, {"id": "EL-0270", "page": 33, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "56", "question": "Trying unitedly, we were able to have our project approved against strong oppositions. Which of the following says nearly the same as 'against' above?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "in the wake of", "খ": "in the guise of", "গ": "in the plea of", "ঘ": "in the teeth of"}, "answerKey": "ঘ", "answerText": "in the teeth of", "explanation_bn": "Against strong opposition- প্রবল প্রতিপক্ষের বিপরীতে। এখানে in the teeth of phrase-টি directly against বা inspite of অর্থে ব্যবহৃত হয়। যেমন: in the teeth of strong oppositions. In the wake of- পেছন পেছন; in the guise of- ছদ্মবেশে এবং In the plea of- অজুহাতে, কৈফিয়তে।"}, {"id": "EL-0271", "page": 33, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "57", "question": "Not many people can commit such a heinous crime in cold blood. -What does the italicized idiom above mean?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "in cool brain and calculated thought", "খ": "so patiently and thoughtfully", "গ": "so impatintly and thoughtlessly", "ঘ": "stirred by sudden emotion"}, "answerKey": "ক", "answerText": "in cool brain and calculated thought", "explanation_bn": "In cold blood-ঠান্ডা মাথায় চিন্তাভাবনা করে, বিনা উত্তেজনায়; in cool brain and calculated thought- ঠান্ডা মাথায় এবং পরিকল্পিত চিন্তায়; so patiently and thoughtfully- খুবই ধৈর্যসহ এবং বিবেচনা সহকারে; so impatiently and thoughtlessly- খুবই অধৈর্যভাবে এবং অবিবেচনা প্রসূত এবং stirred by sudden emotion- হঠাৎ আবেগে জেগে উঠে বা উত্তেজিত হয়ে।"}, {"id": "EL-0272", "page": 34, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "58", "question": "The condition of most slum dwellers is so miserable that it cannot be described in words. Which is the best phrase for the underlined expression above?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "beggars description", "খ": "cuts to the quick", "গ": "boils down to this", "ঘ": "keeps open house"}, "answerKey": "ক", "answerText": "beggars description", "explanation_bn": "So miserable that it cannot be described in words- এত দুর্দশাপূর্ণ যে ভাষায় প্রকাশ করা অসম্ভব। এই অর্থে beggar(s) description (বর্ণনাতীত) phrase-টি এখানে appropriate। Cut(s) to the quick- মনে কষ্ট দেয়া; Boil(s) down (to this)- আয়তনে কমানো, সার-সংক্ষেপ করা এবং Keep(s) open house- গৃহস্থালির দায়িত্ব পালন করা।"}, {"id": "EL-0273", "page": 34, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "59", "question": "What is the meaning of the idiom 'a round dozen'?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "a little less than a dozen", "খ": "a little more than a dozen", "গ": "a full dozen", "ঘ": "round about a dozen"}, "answerKey": "গ", "answerText": "a full dozen", "explanation_bn": "A round dozen- পূর্ণ ডজন/১২টি অর্থাৎ A full dozen।"}, {"id": "EL-0274", "page": 34, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "60", "question": "To meet trouble half-way means-", "source_tag": "১৪তম বিসিএস", "options": {"ক": "To be puzzled", "খ": "To get nervous", "গ": "To be disappointed", "ঘ": "To bear up"}, "answerKey": "ক", "answerText": "To be puzzled", "explanation_bn": "To meet trouble- সমস্যা মোকাবিলা করা এবং halfway- অর্ধেক। halfway- অর্ধেক রাস্তায় অর্থাৎ হতবুদ্ধি হওয়া। To be puzzled- হতবুদ্ধি হওয়া; To get nervous- ভয় পাওয়া; To be disappointed- হতাশ হওয়া এবং To bear up- (নিজেকে) শক্ত রাখা। সুতরাং To be puzzled উত্তরটি সঠিক।"}, {"id": "EL-0275", "page": 34, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "61", "question": "What is the meaning of 'Soft Soap'?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "Flatter for self motives", "খ": "To speak ill of others", "গ": "To speak high of others", "ঘ": "To recognise other's good deeds"}, "answerKey": "ক", "answerText": "Flatter for self motives", "explanation_bn": "Soft Soap মোসাহেবি করা, তোষামোদ করা। Flatter for self motives- নিজ অভিপ্রায়ে/অভিসন্ধিতে তোষামোদ করা; To speak ill of others অর্থ-অন্যের নিন্দা করা; To speak high of others-অর্থ- অন্যদের সম্পর্কে উঁচু কথা বলা এবং To recognize other's good deeds- অন্যের ভালো কাজসমূহ বুঝতে পারা বা স্বীকৃতি দেয়া।"}, {"id": "EL-0276", "page": 34, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "62", "question": "'I have never seen such a slow coach like you, this small work has taken you three full months.' What does the idiom 'a slow coach' mean?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "an irresponsible person", "খ": "a careless person", "গ": "an unthoughtful person", "ঘ": "a very lazy person"}, "answerKey": "ঘ", "answerText": "a very lazy person", "explanation_bn": "Slow coach-ধীর প্রকৃতির লোক, অলস লোক, সময় অপচয়কারী ব্যক্তি। এখানে an irresponsible person- দায়িত্ব জ্ঞানহীন লোক; a careless person- বেপরোয়া লোক; an unthoughtful person-অচিন্তাপূর্ব/অচিন্তাশীল ব্যক্তি এবং a very lazy person-অত্যন্ত অলস ব্যক্তি।"}, {"id": "EL-0277", "page": 34, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "63", "question": "It is too difficult to 'tolerate' bad temper for long. Which of the following phrases best replaces 'tolerate' in the above sentence?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "cope up with", "খ": "put up with", "গ": "stand up for", "ঘ": "pull on with"}, "answerKey": "খ", "answerText": "put up with", "explanation_bn": "Tolerate- সহ্য করা, সওয়া মেনে নেয়া। এখানে Cope with- তাল মেলানো; Put up with- সহ্য করা, বিনা প্রতিবাদে মেনে নেয়া; Stand up for- সমর্থন করা, পক্ষ গ্রহণ করা এবং Pull on with- টান দেয়া, শোষণ করা।"}, {"id": "EL-0278", "page": 34, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "64", "question": "'Hold water' means-", "source_tag": "১১তম বিসিএস", "options": {"ক": "Keep water", "খ": "Drink water", "গ": "Bear examination", "ঘ": "Store water"}, "answerKey": "গ", "answerText": "Bear examination", "explanation_bn": "Hold water-অর্থ টিকে থাকা, চালিয়ে যাওয়া, ধারণ করা। এটি Bear examination-(পরীক্ষায় টিকে থাকা) অর্থেও ব্যবহৃত হয়; Keep water-(Phrase/idiom নয়) পানি সংরক্ষণ করা; Drink water-(Phrase/idiom নয়) পানি পান করা এবং Store water-(Phrase/idiom নয়) পানি জমিয়ে রাখা।"}, {"id": "EL-0279", "page": 34, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "65", "question": "'Out and Out' means-", "source_tag": "১১তম বিসিএস", "options": {"ক": "Not at all", "খ": "Thoroughly", "গ": "To be last", "ঘ": "Man of outside"}, "answerKey": "খ", "answerText": "Thoroughly", "explanation_bn": "Out and out- সম্পূর্ণরূপে (Thoroughly), পুরোদস্তুর, তন্নতন্ন করে, শুরু থেকে শেষ পর্যন্ত; Not at all- আদৌ নয় এবং Man of outside- লেফাফাদুরস্ত, বাহ্যদৃষ্টিতে ফিটফাট ব্যক্তি।"}, {"id": "EL-0280", "page": 34, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.2 Phrases and Idioms", "qno": "66", "question": "What is the meaning of 'White Elephant'?", "source_tag": "১০তম বিসিএস", "options": {"ক": "An elephant of white colour", "খ": "A very costly or troublesome possession", "গ": "A black marketer", "ঘ": "A hoarder"}, "answerKey": "খ", "answerText": "A very costly or troublesome possession", "explanation_bn": "White Elephant- কাজে আসে না অথচ দামি ও অসুবিধাজনক।"}, {"id": "EL-0281", "page": 35, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.3 Types of Clauses", "qno": "01", "question": "The book that she recommended turned out to be very helpful. Here the underlined clause (that she recommended) is a -", "source_tag": "৫০তম বিসিএস", "options": {"ক": "relative clause", "খ": "noun clause", "গ": "adverbial clause", "ঘ": "independent clause"}, "answerKey": "ক", "answerText": "relative clause", "explanation_bn": "Option (ক): 'that she recommended'- clause টি the book কে Modify করছে; এটি কোন Clause নয়, কারণ Clause বলতে বোঝায় বাক্যের একটি অংশ যার মধ্যে Subject ও finite verb থাকে। তথাপি ওটাকে Function এর বিচারে Clause ধরে নিলে এটাকে Subordinate Clause বলতে হবে। relative pronoun 'that' দিয়ে শুরু, তাই relative clause। অন্য option-গুলো: (খ) কোনো noun-এর কাজ (subject/object) করছে না; book-কে modify করছে। (গ) সময়/কারণ/শর্ত বোঝাচ্ছে না। (ঘ) নিজে একা পূর্ণ বাক্য হিসেবে মূল বক্তব্য প্রকাশ করছে না তাই dependent বা embedded Clause।"}, {"id": "EL-0282", "page": 35, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.3 Types of Clauses", "qno": "02", "question": "'We know that the earth is a planet' The underlined part (that the earth is a planet) is a/an-", "source_tag": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "noun clause", "খ": "adverbial clause", "গ": "adjective clause", "ঘ": "principal clause"}, "answerKey": "ক", "answerText": "noun clause", "explanation_bn": "এখানে \"that the earth is a planet\" অংশটি know ক্রিয়াটির object হিসেবে কাজ করছে। যে clause বাক্যে কোনো noun-এর মতো কাজ করে (subject, object, complement ইত্যাদি), সেটিই noun clause।"}, {"id": "EL-0283", "page": 35, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.3 Types of Clauses", "qno": "03", "question": "Tell me frankly why you did this. the underlined part (why you did this) is a/an-", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "adjective clause", "খ": "noun clause", "গ": "adverbial clause", "ঘ": "adverbial phrase"}, "answerKey": "খ", "answerText": "noun clause", "explanation_bn": "যে Sub-ordinate clause কোনো noun এর কাজ করে তাকে noun clause বলে। Tell me frankly why you did this বাক্যে 'Why you did this' Clause টি ক্রিয়া 'Tell' এর direct object হিসেবে কাজ করে, তাই এটি একটি noun Clause।"}, {"id": "EL-0284", "page": 35, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.3 Types of Clauses", "qno": "04", "question": "His dream that he will be a B.C.S cadre finally came true. The underlined part (that he will be a B.C.S cadre) is-", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "a noun clause", "খ": "an adjective clause", "গ": "an independent clause", "ঘ": "a co-ordinate clause"}, "answerKey": "ক", "answerText": "a noun clause", "explanation_bn": "That যুক্ত Clause টি Appositive হিসেবে ব্যবহৃত হলে এটি Noun Clause হবে। যেমন- His dream that he will be a B.C.S cadre finally came true. এখানে \"that he will be a B.C.S cadre\" clause টি Appositive হিসেবে ব্যবহার করা যায় তাই এটি একটি Noun clause. অন্যদিকে, Clause টি যদি Antecedent এর পর that + verb দিয়ে শুরু হয়, অর্থাৎ That এর পর Subject না থাকলে Adjective clause হবে। যেমন: All that glitters is not gold."}, {"id": "EL-0285", "page": 35, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.3 Types of Clauses", "qno": "05", "question": "Sitting happily, the chicken laid eggs. The underlined part (Sitting happily) is a/an-", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "noun clause", "খ": "subordinate clause", "গ": "independent clause", "ঘ": "coordinate clause"}, "answerKey": null, "answerText": "Blank (no option marked)", "flag": "⚠ Source shows answer as 'Blank' — no option marked in the original.", "explanation_bn": "Underlined অংশটি একটি Phrase, এটি কোন Clause নয়, কারণ Clause বলতে বোঝায় বাক্যের একটি অংশ যার মধ্যে Subject ও finite verb থাকে। তথাপি ওটাকে Function এর বিচারে Clause ধরে নিলে এটাকে Subordinate Clause বলতে হবে।"}, {"id": "EL-0286", "page": 35, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.3 Types of Clauses", "qno": "06", "question": "'Strike while the iron is hot' is an example of-", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "Noun clause", "খ": "Adjective clause", "গ": "Adverbial clause", "ঘ": "Subordinate clause"}, "answerKey": "গ", "answerText": "Adverbial clause", "explanation_bn": "Verb কে কখন (When), কোথায় (Where), কীভাবে (How), কেন (Why) দ্বারা প্রশ্ন করলে যে Clause পাওয়া যায় তাকে Adverbial Clause বলে। Adverbial clause হলো এক ধরনের dependent clause যা adverb হিসেবে কাজ করে এবং complex sentence এর Verb, adjective এমনকি Adverb কে modify করতে পারে। যেমন: Strike while the iron is hot. এখানে while the iron is hot একটি Adverbial clause।"}, {"id": "EL-0287", "page": 35, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.3 Types of Clauses", "qno": "07", "question": "This is the book I lost. Here 'I lost' is-", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "A noun clause", "খ": "An adverbial clause", "গ": "An adjective clause", "ঘ": "None of the three"}, "answerKey": "গ", "answerText": "An adjective clause", "explanation_bn": "যে Clause কোনো Noun বা Pronoun এর 'পরে বসে' ঐ Noun বা Pronoun কে Modify/qualify করে থাকে তাকে Adjective Clause/Relative Clause বলে। এর শুরুতে Relative Pronoun (Who, Whom, Whose, What, Which, That) অথবা, relative Adverb (Which, When, Why, How) বসে। Clause এর পূর্বে Antecedent ব্যবহৃত হয়। তবে মাঝে মাঝে relative pronoun বা relative Adjective উহ্য থাকে। যেমন: This is the book I lost. এখানে I lost clause-টি the book Noun-কে Modify করেছে, তাই এটি Adjective clause।"}, {"id": "EL-0288", "page": 35, "chapter": "Chapter 02: Phrases and Clauses", "topic": "2.3 Types of Clauses", "qno": "08", "question": "Can you tell me where ___? Which of the following is the best clause in the above sentence?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "Does Mr. Ali live", "খ": "Mr. Ali does live", "গ": "Mr. Ali lives", "ঘ": "Lives Mr. Ali"}, "answerKey": "গ", "answerText": "Mr. Ali lives", "explanation_bn": "WH question word (When, Where, While) বাক্যের মধ্যে relative pronoun বা relative Adjective হিসেবে বসলে এর পর সরাসরি Verb বসে না। বরং নতুন করে Subject + Verb বসে। আলোচ্য বাক্যে can you tell me হচ্ছে principal clause এবং can you tell me এখানে question word। অন্যদিকে, Where এখানে conjunction (question word নয়) এবং Where-এর পর একটি subordinate clause হবে যার গঠন assertive sentence গঠনানুযায়ী হবে। অর্থাৎ Where + subject + verb + others। সুতরাং অপশন গুলোর মধ্যে Mr. Ali lives সঠিক।"}, {"id": "EL-0289", "page": 36, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "01", "question": "Which sentence is correct?", "source_tag": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "The picture was hanged on the wall", "খ": "The picture was hung on the wall", "গ": "The picture was hunged on the wall", "ঘ": "The picture had hanged on the wall"}, "answerKey": "খ", "answerText": "The picture was hung on the wall.", "explanation_bn": "'The picture was hung on the wall' বাক্যটি সঠিক। Hang (বস্তু ঝুলানো) এর past এবং past participle হচ্ছে Hung. অপরদিকে Hang (ফাঁসি দেয়া) এর past এবং past participle হচ্ছে Hanged।"}, {"id": "EL-0290", "page": 36, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "02", "question": "Choose the correct sentence.", "source_tag": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "He resembles like his father.", "খ": "He resembles with his father.", "গ": "He resembles his father.", "ঘ": "He resembles similar to his father."}, "answerKey": "গ", "answerText": "He resembles his father.", "explanation_bn": "Resemble একটি transitive verb, অর্থাৎ এটি সরাসরি একটি object গ্রহণ করে তাই এর পর কোনো preposition (যেমন: like, with, to) ব্যবহৃত হয় না। গঠন: Subject + resemble + object। যেমন: She resembles her mother।"}, {"id": "EL-0291", "page": 36, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "03", "question": "Which sentence is correct?", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "One of my sisters are a nurse.", "খ": "One of my sister is a nurse.", "গ": "One of my sisters is a nurse.", "ঘ": "One of my sister's are a nurse."}, "answerKey": "গ", "answerText": "One of my sisters is a nurse.", "explanation_bn": "One of এর পর plural noun এবং verb এর singular form ব্যবহৃত হয়। অর্থাৎ, One of + plural noun (my sisters) + singular verb (is)…"}, {"id": "EL-0292", "page": 36, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "08", "flag": "⚠ Source numbering jumps 03→08 on this page, preserved as printed.", "question": "Identify the correct sentences:", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "The room was darkened by switching off all the lights.", "খ": "The room was darkened switching off all the lights.", "গ": "The room was darkened to switch off all the lights.", "ঘ": "Switching off all the lights the room was darkened."}, "answerKey": "ক", "answerText": "The room was darkened by switching off all the lights.", "explanation_bn": "Sentence টি passive voice-এ আছে। The room was darkened by switching off all the lights. (সবগুলো লাইট বন্ধ করে বা বন্ধ করার মাধ্যমে রুমটি অন্ধকারাচ্ছন্ন করা হয়েছিল)। এখানে 'The room' Subject, 'was darkened' Verb এবং 'by switching off all the lights' 'adverbial phrase'। 'by switching off all the lights' দ্বারা কীভাবে রুমটি অন্ধকারাচ্ছন্ন করা হয়েছিল তা নির্দেশ করে। তাই phrase টি by দ্বারা শুরু হবে। উল্লেখ্য, Sentence-টিতে কোনো object নেই। তাই Verb এর পর সরাসরি adverbial phrase আসবে। সুতরাং, The room was darkened by switching off all the lights. Sentence টি-ই Correct। অপশন (খ) তে switching এর পূর্বে by বসলে সঠিক হতো; অপশন (গ) তে 'to switch' এর ব্যবহার অর্থপূর্ণ নয় এবং অপশন (ঘ)-এ By switching off all the lights, the room was darkened- হলে বাক্যটি সঠিক হতো। এ জাতীয় sentence কে active করতে হলে someone বা relevant কোনো word কে subject হিসেবে বসাতে হয়। আলোচ্য Sentence টির active form হলো- 'Someone darkened the room by switching off all the lights.'"}, {"id": "EL-0293", "page": 36, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "05", "question": "Identify the correct sentences:", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "There are trees on the both sides of the road.", "খ": "There are trees on both the sides of the road.", "গ": "There are trees, on the side of the road.", "ঘ": "There are trees on either sides of the road."}, "answerKey": "খ", "answerText": "There are trees on both the sides of the road.", "explanation_bn": "Both হলো pre-determiner এবং the হলো central determiner; যদি pre-determiner এবং central determiner একত্রে বসে, তাহলে pre-determiner আগে বসে এবং central determiner পরে বসে।"}, {"id": "EL-0294", "page": 36, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "06", "question": "Identify the correct sentences:", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "Had you been there on time, you could have had the information.", "খ": "If you had been there on time, you could have the information.", "গ": "If you have been there on time, you might get the information.", "ঘ": "Had been you there on time, you could have got the information."}, "answerKey": "ক", "answerText": "Had you been there on time, you could have had the information.", "explanation_bn": "Conditional Sentence এ প্রথম অংশে Had+Sub+V3 +……. অথবা, If + Subject + had + V3 + ……. হলে, দ্বিতীয় অংশে Subject+ Would / Could/ might + have+ V3 …. হবে। যেমন: If I had known Rifat was coming, I would have gone to the station. অপশন গুলোর মধ্যে (ক)-ই সঠিক। অপশন (খ)-এ you could have the information এর পরিবর্তে you could have had the information হলে সঠিক হতো; অপশন (গ)-এ if যুক্ত clause টি Present perfect Tense-এ আছে। Conditional sentence-এ present perfect tense ব্যবহার করলে বাক্যটি অর্থপূর্ণ হয় না। যেমন: If you have been there one time. বাক্যটির অর্থ তুমি যদি সেখানে ঠিক সময়ে গিয়েছ- এটি অর্থপূর্ণ নয়। সঠিক clause টি হবে If you are there on time/If you were there on time. অপশন (ঘ)-এ Had been you there না হয়ে Had you been there হবে।"}, {"id": "EL-0295", "page": 37, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "07", "question": "Identify the correct sentence:", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "She speaks English like English", "খ": "She speaks the English like English", "গ": "She speaks the English like the English", "ঘ": "She speaks English like the English"}, "answerKey": "ঘ", "answerText": "She speaks English like the English.", "explanation_bn": "She speaks English like the English. Sentence-টির অর্থ 'সে ইংরেজদের মতো ইংরেজিতে কথা বলে'। ভাষার পূর্বে article বসে না, কিন্তু জাতির পূর্বে article 'the' বসে। Sentence-এ প্রথম English দ্বারা ইংরেজি ভাষা বুঝানো হয়েছে তাই এর পূর্বে the বসবে না। অন্যদিকে, দ্বিতীয় English শব্দটি দ্বারা ইংরেজ জাতিকে বুঝানো হয়েছে বলে এর পূর্বে the বসবে।"}, {"id": "EL-0296", "page": 37, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "08b", "question": "Choose the correct sentence:", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "He discussed the matter.", "খ": "He discussed about the mater.", "গ": "He discussed on the matter.", "ঘ": "None of the above"}, "answerKey": "ক", "answerText": "He discussed the matter.", "explanation_bn": "Discuss, consider, resemble, answer, reach, tackle, marry, divorce ইত্যাদি Verb গুলোর পরে কোনো Preposition বসে না। তাই He discussed the matter-ই সঠিক Answer।"}, {"id": "EL-0297", "page": 37, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "09b", "question": "Identify the correct sentence:", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "The girl burst out tears.", "খ": "The girl burst into tears.", "গ": "The girl burst with tears.", "ঘ": "The girl bursted out tears."}, "answerKey": "খ", "answerText": "The girl burst into tears.", "explanation_bn": "", "explanation_table": [["Burst out laughing/crying", "হঠাৎ হাসি/ কান্না শুরু করা (to suddenly start laughing/crying)"], ["Burst into tears", "হঠাৎ কান্নায় ভেঙ্গে পড়া (to suddenly start to cry)"], ["Burst out", "তর্জন গর্জন করা (to suddenly say something loudly)"], ["Burst of energy or speed", "সাময়িক সময়ের জন্য শক্তি বা গতির হঠাৎ বৃদ্ধি (a sudden increase in energy or speed for a short period)"], ["Burst in on", "অনুমতি ব্যতীত হঠাৎ রুমে প্রবেশ করা (to enter a room suddenly and without warning, interrupting the people or activity inside)"], ["Burst in or into (some where)", "হঠাৎ কোনো জায়গায় অপ্রত্যাশিতভাবে প্রবেশ করা (to enter a place suddenly or unexpectedly)"]]}, {"id": "EL-0298", "page": 37, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "10", "question": "Which one is a correct sentence?", "source_tag": "৪১তম বিসিএস", "options": {"ক": "The doctor found my pulse.", "খ": "The doctor took my pulse.", "গ": "The doctor examined my pulse.", "ঘ": "The doctor saw my pulse."}, "answerKey": "খ", "answerText": "The doctor took my pulse.", "explanation_bn": "Take someone's Pulse or check someone's pulse or feel someone's pulse. অর্থ হৃৎপিণ্ড কত দ্রুত স্পন্দিত হচ্ছে তা পরীক্ষা করা। pulse পরীক্ষার ক্ষেত্রে find, examine, see এর ব্যবহার যথার্থ নয়। উল্লেখ্য, take the pulse of অর্থ কোনো ব্যক্তি বা গোষ্ঠীর উদ্দেশ্য বা অনুভূতি বুঝার চেষ্টা করা। যেমন: The government took the pulse of citizens to govern them skillfully."}, {"id": "EL-0299", "page": 37, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "11", "question": "Choose the correct sentence:", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "He refrained to take any drastic action", "খ": "He refrained on taking any drastic action", "গ": "He refrained in taking any drastic action", "ঘ": "He refrained from taking any drastic action"}, "answerKey": "ঘ", "answerText": "He refrained from taking any drastic action", "explanation_bn": "Refrain from doing something অর্থ নিজেকে কোনো কিছু থেকে বিরত রাখা। সুতরাং সঠিক বাক্য He refrained from taking any drastic action।"}, {"id": "EL-0300", "page": 38, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "12", "question": "Choose the correct sentence:", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "All of it depend on you", "খ": "All of it are depending on you", "গ": "All of it depends on you", "ঘ": "All of it are depended on you"}, "answerKey": "গ", "answerText": "All of it depends on you.", "explanation_bn": "All, some, a lot of, lots of, most of etc. Determiners সকল noun (countable and uncountable) এর পূর্বে বসে। এক্ষেত্রে পরবর্তী noun এর উপর ভিত্তি করে verb বসবে। যেমন- All books were Lost, All is well. All that glitters is not gold. All of এর পর it থাকায় পরবর্তী verb-টি singular হবে। সুতরাং, সঠিক উত্তর All of it depends on you।"}, {"id": "EL-0301", "page": 38, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "13", "question": "Which one is a correct sentence?", "source_tag": "৩৬তম, ২৭তম বিসিএস", "options": {"ক": "paper is made of wood", "খ": "paper is made from wood", "গ": "paper is made by wood", "ঘ": "paper is made on wood"}, "answerKey": "খ", "answerText": "paper is made from wood", "explanation_bn": "নির্দিষ্ট উপাদান বা উপকরণ দিয়ে উৎপাদিত বস্তুর উপাদান বা উপকরণ চোখে দেখে শনাক্ত করা গেলে made-এর পর of ব্যবহৃত হয়। যেমন: This table is made of wood. আর যদি চোখে দেখে তার উপাদান শনাক্ত করা না যায়, তাহলে made-এর পর 'from' ব্যবহৃত হয়। যেমন: paper is made from wood।"}, {"id": "EL-0302", "page": 38, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "14", "question": "Which is the correct sentence?", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "He insisted on seeing her", "খ": "He insisted for seeing her", "গ": "He insisted in seeing her", "ঘ": "He insisted to be seeing her"}, "answerKey": "ক", "answerText": "He insisted on seeing her.", "explanation_bn": "Insist verb-এর পর সর্বদা 'on' preposition ব্যবহৃত হয়। এবং এর পরবর্তী verb-এর সাথে ing যুক্ত হয়।"}, {"id": "EL-0303", "page": 38, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "15", "question": "Every man or woman should vote for the candidate of their choice. [identify error]", "source_tag": "৩২তম বিসিএস", "options": {"ক": "Every", "খ": "should vote", "গ": "for", "ঘ": "their"}, "answerKey": "ঘ", "answerText": "their", "explanation_bn": "'Every + singular noun' subject হিসেবে ব্যবহৃত হলে তার পরিবর্তে পরবর্তীতে যে pronoun-টি (Subjective/objective/ possessive form) আসবে তা singular হবে। Their হলো they এর possessive form যা plural. উক্ত sentence-এ every man or woman হলো singular. এর possessive pronoun 'his or her'। সুতরাং their এর পরিবর্তে 'his or her' ব্যবহৃত হবে।"}, {"id": "EL-0304", "page": 38, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "16", "question": "A doctor may be able to diagnose a problem, perfect, but he may not be able to find a drug to which the patient will respond. [identify error]", "source_tag": "৩২তম বিসিএস", "options": {"ক": "to diagnose", "খ": "perfect", "গ": "to which", "ঘ": "will respond"}, "answerKey": "খ", "answerText": "perfect", "explanation_bn": "Verb কে modify করে adverb এবং verb-এর পরে adverb বসে। যেমন- He walks fast. 'Diagnose' transitive verb (সকর্মক ক্রিয়া)। তাই Diagnose + object + adverb বসবে। Perfect-এর adverb হলো perfectly. তাই sentence-এ perfect-এর পরিবর্তে perfectly হবে।"}, {"id": "EL-0305", "page": 38, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "17", "question": "According to experts a good way to improve listening skills is by watch television, specially news and documentaries. [identify error]", "source_tag": "৩২তম বিসিএস", "options": {"ক": "to", "খ": "improve", "গ": "by", "ঘ": "watch"}, "answerKey": "ঘ", "answerText": "watch", "explanation_bn": "by এর পর verb আসলে উক্ত verb-এর সাথে ing যুক্ত করতে হয়। তাই watch -এর পরিবর্তে watching হবে।"}, {"id": "EL-0306", "page": 38, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "18", "question": "Choose the wrong sentence?", "source_tag": "৩১তম বিসিএস", "options": {"ক": "The land is belonged to an old lady.", "খ": "They parted from one another suddenly.", "গ": "The leader expressed himself forcibly.", "ঘ": "Mother bought me an icecream."}, "answerKey": "ক", "answerText": "The land is belonged to an old lady.", "explanation_bn": "কারো অধিকারে কিছু থাকা অর্থে belong to ব্যবহৃত হয়। এর কোনো passive form নেই। 'Belong to' Passive Voice এ ব্যবহৃত হয় না। সুতরাং, The land is belonged to an old lady বাক্যটি ভুল। এর সঠিক রূপ হবে The land belongs to an old lady।"}, {"id": "EL-0307", "page": 39, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "19", "question": "Choose the wrong sentence?", "source_tag": "৩১তম বিসিএস", "options": {"ক": "He was always arguing with his brother.", "খ": "His failure resulted for lack of attention.", "গ": "When will you write to him about your plan?", "ঘ": "Who was the boy you were all laughing at?"}, "answerKey": "খ", "answerText": "His failure resulted for lack of attention.", "explanation_bn": "Result এর সাথে for ব্যবহৃত হয় না, বরং in/from ব্যবহৃত হয়। Result in অর্থ কোনো পরিস্থিতি বা ঘটনা ঘটার কারণ হওয়া আর Result from অর্থ কোনো নির্দিষ্ট ঘটনার ফলে উদ্ভূত হওয়া। Object যদি কিছু ঘটার কারণ বর্ণনা করে তাহলে result from আর object যদি কোনো কিছুর ফলাফল বর্ণনা করে তাহলে result in ব্যবহৃত হয়; অপশন (খ)-এ বলা হয়েছে মনোযোগের ঘাটতির কারণে তার ব্যর্থতা এসেছিল। এখানে, কারণ বর্ণিত হয়েছে, তাই from বসবে। সঠিক বাক্য: His failure resulted from lack of attention. অথবা, Lack of attention resulted in his failure. বাক্যটির অর্থ মনোযোগের ঘাটতির ফলে সে ব্যর্থ হয়েছিল।"}, {"id": "EL-0308", "page": 39, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "20", "question": "One of the four sentences given in each question is grammatically wrong. That alternative is your answer:", "source_tag": "৩০তম বিসিএস", "options": {"ক": "Neither you nor I am in a sound position.", "খ": "Laziness is detrimental for success.", "গ": "He begged the favour of my granting him leave.", "ঘ": "Your action is not in conformity with the law."}, "answerKey": "খ", "answerText": "Laziness is detrimental for success.", "explanation_bn": "অপশন (খ)-এ Detrimental for-এর পরিবর্তে detrimental to হবে যার অর্থ ক্ষতিকর। বাক্যটির সঠিক রূপ হবে Laziness is detrimental to success।"}, {"id": "EL-0309", "page": 39, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "21", "question": "Which sentence is incorrect?", "source_tag": "৩০তম বিসিএস", "options": {"ক": "He has no desire for fame.", "খ": "I intend going to Rajshahi.", "গ": "He is too miserly to part with his money.", "ঘ": "He has invited me for dinner."}, "answerKey": "খ", "answerText": "I intend going to Rajshahi.", "explanation_bn": "Intend-এর পর infinitive অর্থাৎ to + verb এর base বসে। কিন্তু অপশন (খ)-এর Intend এর পর gerund (verb + ing) দেওয়া আছে। বাক্যটির সঠিক রূপ হবে-I intend to go to Rajshahi।"}, {"id": "EL-0310", "page": 39, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "22", "question": "Which sentence is correct?", "source_tag": "২৮তম বিসিএস", "options": {"ক": "This is an unique case", "খ": "This is a unique case", "গ": "This is a very unique case", "ঘ": "This is the most unique case"}, "answerKey": "খ", "answerText": "This is a unique case", "explanation_bn": "সাধারণত noun-এর প্রথম অক্ষর a, c, i, o, u হলে বা প্রথম Letter-টি consonant হওয়া সত্ত্বেও vowel-এর মতো উচ্চারিত হলে তার আগে article 'an' বসে। যেমন- He is an MBA. আবার, noun-এর প্রথম অক্ষর vowel থাকা সত্ত্বেও তার উচ্চারণ যদি U (ইউ)-এর মতো হয় তবে ঐ noun-এর আগে 'a' বসে। যেমন- unique, university etc."}, {"id": "EL-0311", "page": 39, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "23", "question": "Which of the following sentences is correct?", "source_tag": "২৭তম, ১৬তম বিসিএস", "options": {"ক": "Why have you done this?", "খ": "Why you had done this?", "গ": "Why you have done this?", "ঘ": "Why did you done this?"}, "answerKey": "ক", "answerText": "Why have you done this?", "explanation_bn": "Wh-question word যুক্ত interrogative sentence-এর structure হলো: Wh-question word + auxiliary verb + subject + principle verb + object or others. সুতরাং, Why have you done this? sentence টি সঠিক।"}, {"id": "EL-0312", "page": 39, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "24", "question": "Choose the correct sentence.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "Everybody have gone there.", "খ": "Everybody are gone there", "গ": "Everybody has gone there.", "ঘ": "Everybody has went there."}, "answerKey": "গ", "answerText": "Everybody has gone there.", "explanation_bn": "Everybody, Everyone, Anybody, Anyone Somebody, Someone, Nobody, None প্রভৃতি singular noun, তাই এর পরে singular verb বসে। অপশন (ক) এবং (খ)-এ everybody এর পরে Plural verb (have, are) আছে তাই বাক্যদ্বয় ভুল; অপশন (ঘ)-এ has এর পরে went না হয়ে gone হবে। কারণ have/has এর পর verb-এর past participle form বসে। সুতরাং, Everybody has gone there-বাক্যটিই সঠিক।"}, {"id": "EL-0313", "page": 39, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "25", "question": "Choose the correct sentence.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "The train is running in time", "খ": "The train is running on time", "গ": "The train is running with time", "ঘ": "The train is running to time"}, "answerKey": "খ", "answerText": "The train is running on time.", "explanation_bn": "In time সাধারণত 'সময় মতো বা সময়ের একটু পূর্বে' অর্থে ব্যবহৃত হয়। যেমন: He went to school in time. আর on time বলতে বুঝায় 'যথা সময়ে অর্থাৎ একটু আগেও নয় বা একটু পরেও নয়'। ট্রেন, এরোপ্লেন, ইত্যাদি যথাসময়ে স্টেশন ত্যাগ করে বা নির্দিষ্ট সময় মেনে চলে। তাই এসব ক্ষেত্রে on time ব্যবহৃত হয়। যেমন: The train is running on time. Time এর পূর্বে preposition 'to' ও 'with' সাধারণত ব্যবহৃত হয় না। তাই অপশন (গ) ও (ঘ) ভুল।"}, {"id": "EL-0314", "page": 40, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "26", "question": "Choose the correct sentence.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "I have looked for a good doctor before I met you.", "খ": "I had looked for a good doctor before I met you.", "গ": "I looked for a good doctor before I had met you.", "ঘ": "I am looking for a good doctor before meeting you."}, "answerKey": "খ", "answerText": "I had looked for a good doctor before I met you.", "explanation_bn": "সাধারণত past perfect tense -এ দুটি clause থাকে। এ দুটি clause 'before বা after' দ্বারা যুক্ত থাকে। clause দুটি before দ্বারা যুক্ত হলে, before এর পূর্বের clause টি past perfect tense হয় এবং পরের clause টি হয় past indefinite tense। After-এর পরের clause-টি past perfect এবং পূর্ব past indefinite tense হয়।"}, {"id": "EL-0315", "page": 40, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "27", "question": "Select the correct sentence.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "The man was tall who stole my bag.", "খ": "The man stole my bag who was tall.", "গ": "The man who stole my bag was tall.", "ঘ": "The man was tall who is stealing tall my bag."}, "answerKey": "গ", "answerText": "The man who stole my bag was tall.", "explanation_bn": "Who, what, that, which whose ইত্যাদি relative pronoun. বাক্যে relative pronoun এর পূর্বে যে word বসে তাই antecedent। এক্ষেত্রে মাথায় রাখা জরুরি antecedent এর ঠিক পরেই relative pronoun বসে। প্রশ্নোক্ত বাক্যে 'the man' হলো antecedent এবং 'who' relative pronoun। তাই the man এর ঠিক পরেই who ব্যবহৃত হবে। সুতরাং, The man who stole my bag was tall- বাক্যটিই সঠিক; অপশন (ক) ও (ঘ)-এ who-এর antecedent- 'tall' যা বাক্যকে অর্থপূর্ণ করে না। তাছাড়া অপশন (ঘ)-এ present এবং past tense একসাথে আছে। কিন্তু দুইটি clause 'who' দ্বারা যুক্ত হলে প্রথমটি past tense হলে দ্বিতীয়টিও past tense হবে; অপশন (খ)-এ who-এর antecedent 'my bag' থাকায় এটিও ভুল।"}, {"id": "EL-0316", "page": 40, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "28", "question": "Which of the following sentences is the correct one?", "source_tag": "২৫তম বিসিএস", "options": {"ক": "My father was in hospital during six weeks in summer", "খ": "In summer during six weeks my father was in hospital", "গ": "My father was in a hospital during six weeks in summer", "ঘ": "My father was in hospital for six weeks during the summer"}, "answerKey": "ঘ", "answerText": "My father was in hospital for six weeks during the summer.", "explanation_bn": "Period of time-এর পূর্বে for বসে। six week দ্বারা period of time বুঝায় তাই এর পূর্বে during না বসে for বসবে। কোনো সময় ব্যাপিয়া বা কোনো সময় চলাকালীন বা শুরু থেকে শেষ এর মধ্যবর্তী বুঝাতে during বসে। আলোচ্য sentence-এ গ্রীষ্মকালীন সময় বুঝাতে summer-এর পূর্বে during বসবে। তাই সঠিক বাক্য হবে- My father was in hospital for six weeks during the summer. অবশ্য, My father was in hospital for six weeks in the summer-বাক্যটিও সঠিক।"}, {"id": "EL-0317", "page": 40, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "29", "question": "Identify the correct sentence-", "source_tag": "২৩তম বিসিএস", "options": {"ক": "She had faith in and hopes for the future.", "খ": "She had faith and hopes for the future.", "গ": "She had faith and hopes in the future.", "ঘ": "She had faith in and hopes in future."}, "answerKey": "ক", "answerText": "She had faith in and hopes for the future.", "explanation_bn": "faith in অর্থ হলো কোনো কিছুতে প্রবল বিশ্বাস রাখা। অন্যদিকে hope for এর অর্থ হলো- কোনো বিষয়ে আশা প্রকাশ করা; faith in এবং hope for একই বাক্যে ব্যবহার করতে হলে উভয়ই স্ব-স্ব preposition-সহ বসবে। Faith এবং hope- এ দুটি noun একত্রে in অথবা for preposition সহ ব্যবহৃত হলে অর্থ যথার্থ হয় না। তাই অপশন (খ), (গ) ও (ঘ) ভুল।"}, {"id": "EL-0318", "page": 40, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "30", "question": "Choose the correct tense-", "source_tag": "২৩তম বিসিএস", "options": {"ক": "Javed was so exhausted that he lain down for a sleep.", "খ": "Javed was so exhausted that he had laid down for a sleep.", "গ": "Javed was so exhausted that he was lying down for a sleep.", "ঘ": "Javed was so exhausted that he will lay down for a sleep."}, "answerKey": "গ", "answerText": "Javed was so exhausted that he was lying down for a sleep.", "explanation_bn": "Lay অর্থ কোনো কিছু নিচে রাখা। এটি একটি transitive verb যার পর object বসে। অন্যদিকে, lie অর্থ আনুভূমিক অবস্থানে থাকা বা আনুভূমিক অবস্থানে কল্পনা করা বা মিথ্যা বলা বা শুয়ে পড়া। এটি একটি intransitive verb যার পর object বসে না। প্রদত্ত sentence-এর অর্থ জাভেদ এতই ক্লান্ত ছিল যে, সে ঘুমের জন্য নিচে পড়ে যাচ্ছিল বা শুয়ে পড়ছিল। এই sentence-এর ক্ষেত্রে দুইটি জিনিস মাথায় রাখতে হবে। একটি হলো so…. that এর ব্যবহার এবং অপরটি হলো Verb-এর ব্যবহার। so…… that এর পূর্বে past tense থাকায় পরেও past tense হবে। আর Verb হিসেবে intransitive verb 'lie'-এর past form 'lay' অথবা 'was lying' ব্যবহৃত হবে। কারণ, sentence-এর দ্বিতীয় clause-এর কোনো object নেই। সুতরাং Sentence-এর context অনুযায়ী Correct Sentence হবে- Javed was so exhausted that he was lying/lay/had lain down for a sleep. অপশন (ক)-এ lain এর পূর্বে had হবে; অপশন (খ)-এ laid এর পরিবর্তে lain হবে; অপশন (ঘ)-এ will lay এর পরিবর্তে lay/had lain হবে।", "explanation_table_2": [["Word", "Past form", "Past participle", "Present participle/Gerund"], ["Lay", "Laid", "Laid", "Laying"], ["Lie", "Lay", "lain", "lying"]]}, {"id": "EL-0319", "page": 41, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "31", "question": "Choose the correct sentence.", "source_tag": "২৩তম বিসিএস", "options": {"ক": "Rahim ate almost the whole fish.", "খ": "Rahim almost ate the whole fish.", "গ": "Almost Rahim ate whole fish.", "ঘ": "Rahim ate the whole fish almost."}, "answerKey": "ক", "answerText": "Rahim ate almost the whole fish.", "explanation_bn": "Verb এর পরে Adverb + determiner + adjective + noun- এই sequence-এ sentence-এ ব্যবহৃত হয়। এই sequence অনুযায়ী অপশন (ক) সঠিক। এখানে 'almost' adverb, 'the' determiner, 'whole' adjective এবং 'fish' noun।"}, {"id": "EL-0320", "page": 41, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "32", "question": "The sentence with correct punctuations-", "source_tag": "১৭তম বিসিএস", "options": {"ক": "Maria, my student, is on leave to-day", "খ": "Maria my student, is on leave to-day", "গ": "Maria my student is on leave to-day", "ঘ": "Maria my student is, on leave to-day"}, "answerKey": "ক", "answerText": "Maria, my student, is on leave to-day", "explanation_bn": "Sentence-এ subject-এর পর আরেকটি noun ব্যবহৃত হয়ে subject সম্পর্কে অতিরিক্ত তথ্য দেয় এবং subject-কে বাদ দিয়ে উক্ত noun-কে verb-এর subject হিসেবে ব্যবহার করা যায় তাকে appositive বলে। যেমন: Mubin, my best friend, is a successful businessman. এখানে, mubin কে বাদ দিয়ে my best friend কে subject করলেও বাক্যের অর্থ সম্পন্ন হয়। সুতরাং, my best friend এখানে appositive. Appositive সবসময় noun-এর কাজ করে এবং এর শুরুতে ও শেষে comma (,) ব্যবহৃত হয়। অপশন (খ), (গ) ও (ঘ)-এ 'my student' appositive-এর আগে ও পরে comma (,) ব্যবহৃত হয়নি। তাই সঠিক উত্তর হবে Maria, my student, is on leave to-day।"}, {"id": "EL-0321", "page": 41, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "33", "question": "The correct sentence of the followings-", "source_tag": "১৭তম বিসিএস", "options": {"ক": "The Nile is longest river in Africa", "খ": "The Nile is longest river in the Africa", "গ": "Nile is longest river in Africa", "ঘ": "The Nile is the longest river in Africa"}, "answerKey": "ঘ", "answerText": "The Nile is the longest river in Africa.", "explanation_bn": "Proper noun-এর পূর্বে কোনো Article বসে না। কিন্তু নির্দিষ্ট ধর্মগ্রন্থ, সাগর/উপসাগর/মহাসাগর, সংবাদপত্র, নদী, ঋতু, দিক, বিখ্যাত অট্টালিকা, মরুভূমি, দ্বীপপুঞ্জ, পর্বতমালা, জাহাজ ইত্যাদির নামের পূর্বে সবসময় 'The' বসে। যেমন: The Quran, The Red Sea, The Nile, The Himalayas, The East, The Summer ইত্যাদি। অন্যদিকে, superlative degree-এর পূর্বে সবসময় the বসে। সুতরাং সঠিক বাক্য হলো- The Nile is the longest river in Africa. উল্লেখ্য, একটি মাত্র পর্বত (Everest), দ্বীপ (Ceylon, Sandwip), অন্তরীপ (Cape horn) বা হ্রদের (Lake Chilka) নামের পূর্বে Article বসে না। যেমন: Mount Everest is the highest peak in the Himalayas. বা Lake Chilka is in Orissa."}, {"id": "EL-0322", "page": 41, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "34", "question": "The correct sentence of the followings-", "source_tag": "১৭তম বিসিএস", "options": {"ক": "A new cabinet has been sworn in in Dhaka", "খ": "A new cabinet has been sworn at Dhaka.", "গ": "A new cabinet has been sworn by in Dhaka.", "ঘ": "A new cabinet has sworn in Dhaka."}, "answerKey": "ক", "answerText": "A new cabinet has been sworn in in Dhaka.", "explanation_bn": "Swear in একটি phrasal verb যার অর্থ আনুষ্ঠানিক প্রতিজ্ঞা/শপথ গ্রহণ করা। swear-এর past participle form হলো sworn. Swear in একটি phrasal verb হওয়ায় swear in একসাথে বসবে এবং Dhaka একটি বড় স্থানের নাম বলে এর পূর্বে আলাদাভাবে in বসবে। উল্লেখ্য, বাক্যটি passive voice হবে। কারণ swear (প্রতিজ্ঞা/শপথ গ্রহণ করা) এর কাজটি cabinet নিজে করে না। প্রধান বিচারপতি বা প্রেসিডেন্ট শপথ গ্রহণ করান। সুতরাং সঠিক উত্তর: A new cabinet has been sworn in in Dhaka।"}, {"id": "EL-0323", "page": 42, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "35", "question": "Which of the following sentences is correct?", "source_tag": "১৬তম বিসিএস", "options": {"ক": "That shirt which he bought is blue in colour.", "খ": "The shirt that which he bought is blue in colour.", "গ": "Which shirt he bought is blue in colour.", "ঘ": "The shirt which he bought is blue in colour."}, "answerKey": "ঘ", "answerText": "The shirt which he bought is blue in colour.", "explanation_bn": "'Shirt' টিকে নির্দিষ্ট করে বোঝাচ্ছে এবং সেটার রং নিয়ে পরেও আলোচনা আছে। নির্দিষ্টতা অর্থে Article 'the' বসাবে এবং Which এখানে Relative Pronoun হিসেবে কাজ করছে এবং পূর্বে 'The shirt' হলো Antecedent। Antecedent এর পরেই Relative Pronoun বসে।"}, {"id": "EL-0324", "page": 42, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "36", "question": "Which of the following sentences correct?", "source_tag": "১৬তম বিসিএস", "options": {"ক": "One of my friends are a lawyer", "খ": "One of my friends is a lawyer", "গ": "One of my friend is a lawyer", "ঘ": "One of my friends are lawyers"}, "answerKey": "খ", "answerText": "One of my friends is a lawyer.", "explanation_bn": "One of the এর পর সব সময় plural countable noun বসে। কিন্তু one শব্দটির কারণে পরবর্তী verb টি singular হয়ে যায়।"}, {"id": "EL-0325", "page": 42, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "37", "question": "Which of the following sentences is correct?", "source_tag": "১৬তম বিসিএস", "options": {"ক": "I forbade him from going", "খ": "I forbade him to go", "গ": "I forbade him going", "ঘ": "I forbade him not to go"}, "answerKey": "খ", "answerText": "I forbade him to go.", "explanation_bn": "Active Sense-এ Subject + forbid + object + to verb + extension এমন নিয়ম অনুসরণ করা হয়। কিন্তু Passive-Sense এ Object এর পরে from + doing something হয়। 'I forbade him not to go' বাক্যে 'forbade' ও 'not' উভয়ই নেতিবাচক অর্থ প্রকাশ করে। তাই সঠিক বাক্য I forbade him to go।"}, {"id": "EL-0326", "page": 42, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "38", "question": "Which of the following is a correct sentence?", "source_tag": "১৫তম বিসিএস", "options": {"ক": "He was too clever not to miss the point", "খ": "He was so clever to miss the point", "গ": "He was too clever to miss the point", "ঘ": "He was too clever to grasp the point"}, "answerKey": "গ", "answerText": "He was too clever to miss the point", "explanation_bn": "Subject + verb + too + adjective + to + verb এর base form + others যুক্ত simple sentence-টি না-বোধক অর্থ প্রকাশ করে তাই not ব্যবহারের প্রয়োজন হয় না। অপশন (ক)-তে not থাকায় এটি অর্থপূর্ণ নয়; অপশন (খ)-তে so এর পরিবর্তে too হবে। আবার, He was too clever to miss the point অর্থ সে এত চতুর যে বিষয়টি বাদ দেবে না। কারণ, চতুর হলে বিষয়টি বাদ দেওয়ার কথা নয়। এজন্য (গ)-ই সঠিক Answer. কিন্তু grasp – আঁকড়ে ধরা। অর্থাৎ too clever to grasp the point অর্থ এত চতুর যে বিষয়টি আঁকড়ে ধরতে পারে না। কিন্তু চতুর হলে বরং বিষয়টি আঁকড়ে ধরার কথা, তাই অপশন (ঘ) ভুল।"}, {"id": "EL-0327", "page": 42, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "39", "question": "Choose the correct sentence-", "source_tag": "১২তম বিসিএস", "options": {"ক": "The matter was informed to the police.", "খ": "The matter has been informed of the police.", "গ": "The police was informed of the matter.", "ঘ": "The police were informed of the matter."}, "answerKey": "ঘ", "answerText": "The police were informed of the matter.", "explanation_bn": "Inform এর পরে of + বস্তু/ঘটনা বসে থাকে। সাধারণত collective noun এর পরে singular verb ব্যবহৃত হয় কিন্তু the police, cattle, people, poultry, vermin ইত্যাদি collective noun গুলো plural verb গ্রহণ করে, তাই correct answer-The police were informed of the matter।"}, {"id": "EL-0328", "page": 42, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "40", "question": "Choose the correct sentence-", "source_tag": "১২তম বিসিএস", "options": {"ক": "Let he and you be witnesses", "খ": "Let you and him be witnesses", "গ": "Let you and he be witnesses", "ঘ": "Let you and he be witness"}, "answerKey": "খ", "answerText": "Let you and him be witnesses", "explanation_bn": "Let শব্দটির পর noun বা pronoun-এর objective form বসে। এখানে, he-এর objective form 'him' তাই সঠিক উত্তর (খ)। সাধারণত ইতিবাচক বাক্যে Pronoun সর্বদা প্রথমে 2nd, এর পর 3rd, এবং সবশেষে 1st person অনুযায়ী বসে।"}, {"id": "EL-0329", "page": 42, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "41", "question": "Choose the correct sentence–", "source_tag": "১১তম বিসিএস", "options": {"ক": "Rich is not always happy", "খ": "The rich is not always happy", "গ": "The rich is not always happy always", "ঘ": "The rich are not always happy"}, "answerKey": "ঘ", "answerText": "The rich are not always happy.", "explanation_bn": "Adjective এর আগে the বসালে উক্ত Adjective-টি Plural common noun-এ পরিণত হয় এবং verb-টি plural হয়। যেমন: The rich, the pious, the poor ইত্যাদি। The rice বলতে সকল ধনীকে বুঝায় বলে এটা Plural verb (are) গ্রহণ করে।"}, {"id": "EL-0330", "page": 43, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "42", "question": "Choose the correct sentence-", "source_tag": "১১তম বিসিএস", "options": {"ক": "He had been hunged for murder.", "খ": "He has been hunged for murder.", "গ": "He was hanged for murder.", "ঘ": "He was hunged of murder."}, "answerKey": "গ", "answerText": "He was hanged for murder.", "explanation_bn": "এখানে, ফাঁসি দেয়া- hang যার past হচ্ছে hanged এবং past participle-hanged। কিন্তু ঝুলানো অর্থে hang এর past-hung এবং past participle-hung (hunged নয়)। ফাঁসিতে ঝুলিয়ে মৃতুর ক্ষেত্রে hanged for murder ব্যবহৃত হয়। তাই He was hanged for murder বাক্যটি-ই সঠিক, যার অর্থ তাকে ফাঁসিতে ঝুলিয়ে মারা হয়েছিল।"}, {"id": "EL-0331", "page": 43, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "43", "question": "Choose the correct sentence.", "source_tag": "১০তম বিসিএস", "options": {"ক": "I asked Javed had he passéd", "খ": "I asked Javed if he had passed", "গ": "I asked Javed if you had passed", "ঘ": "I asked Javed that had he passed"}, "answerKey": "খ", "answerText": "I asked Javed if he had passed.", "explanation_bn": "Direct speech-এ Interrogative sentence-টি Indirect speech-এ Assertive sentence-এ পরিণত হয়। Interrogative sentence-টি auxiliary verb দ্বারা শুরু হলে indirect narration এ পরিবর্তন করার সময় reported speech এর পূর্বে if বা whether বসে। এখানে I asked Javed if he had passed বাক্যটি সঠিক।"}, {"id": "EL-0332", "page": 43, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "88", "flag": "⚠ Source shows unusual question number '88' (likely a printing/typo error for '44' following the sequence); preserved as printed.", "question": "Choose the correct sentence.", "source_tag": "১০তম বিসিএস", "options": {"ক": "A few of the three boys got a prize", "খ": "Each of the three boys got a prize", "গ": "Every of the three boys got a prize", "ঘ": "All of the three boys got a prize"}, "answerKey": "খ", "answerText": "Each of the three boys got a prize.", "explanation_bn": "কোনো দল বা কোনো তালিকার প্রত্যেককে স্বতন্ত্রভাবে বুঝাতে Each of ব্যবহৃত হয়। অপরদিকে, একটি দলের সকল সদস্যকে বুঝাতে Every ব্যবহৃত হয়। plural noun এর পূর্বে everyone of the, all of the, each of the, a few of the ইত্যাদির ব্যবহার সঠিক। কিন্তু every of the এর ব্যবহার সঠিক নয়, তাই অপশন (গ)-এ Every of the three boys-এর পরিবর্তে everyone of the three boys ব্যবহৃত হলে বাক্যটি সঠিক হবে। a few দ্বারা স্বল্প সংখ্যা বুঝায়। কিন্তু a few of the সাধারণত তুলনামূলক বড় সংখ্যার পূর্বে ব্যবহৃত হয়। যেমন: আমরা বলতে পারি a few of the ten boys কিন্তু a few of the three boys এর ব্যবহার যুক্তিযুক্ত নয়। তাই অপশন (ক)-এ a few of the three boys-এর ব্যবহার সংখ্যানুপাতে অপ্রাসঙ্গিক। 'All of the three boys' Phrase-টির ব্যবহার সঠিক। কিন্তু এরপর got a prize এর পরিবর্তে got prizes হবে। সুতরাং অপশন (ঘ)-এর সঠিক রূপ হবে All of the three boys got prizes।"}, {"id": "EL-0333", "page": 43, "chapter": "Chapter 03: Corrections", "topic": "3.1 Sentence Corrections", "qno": "45", "question": "Choose the correct sentence.", "source_tag": "১০তম বিসিএস", "options": {"ক": "The man that said that was a fool", "খ": "The man who said that was a fool", "গ": "The man that said that was a fool", "ঘ": "The man which said that was a fool"}, "answerKey": "খ", "answerText": "The man who said that was a fool.", "explanation_bn": "The man এর Relative pronoun হিসেবে who ব্যবহৃত হয়েছে। উল্লেখ্য, that শব্দটি এখানে conjunction নয়। বরং, 'said' verb-এর object হিসেবে ব্যবহৃত হয়েছে।"}, {"id": "EL-0334", "page": 43, "chapter": "Chapter 03: Corrections", "topic": "3.2 Subject Verb Agreement", "qno": "01", "question": "I love reading books and ___ football.", "source_tag": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "to play", "খ": "play", "গ": "playing", "ঘ": "to have played"}, "answerKey": "গ", "answerText": "playing", "explanation_bn": "'Love' এর পরে সাধারণত Verb + ing (Gerund) ব্যবহৃত হয়। সম্পূর্ণ বাক্য: \"I love reading books and playing football.\" (আমি বই পড়তে এবং ফুটবল খেলতে ভালোবাসি।)"}, {"id": "EL-0335", "page": 43, "chapter": "Chapter 03: Corrections", "topic": "3.2 Subject Verb Agreement", "qno": "02", "question": "He as well as his parents ___ spending vacation abroad.", "source_tag": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "are", "খ": "is", "গ": "will", "ঘ": "can"}, "answerKey": "খ", "answerText": "is", "explanation_bn": "As well as দ্বারা যুক্ত দুটি Noun/Pronoun এর ক্ষেত্রে, প্রথম Noun/Pronoun অনুযায়ী verb বসে। তাই, প্রথম pronoun 'He' অনুযায়ী verb 'is' হবে। অর্থাৎ, He as well as his parents is spending vacation abroad."}, {"id": "EL-0336", "page": 43, "chapter": "Chapter 03: Corrections", "topic": "3.2 Subject Verb Agreement", "qno": "03", "question": "Slow and steady ___ the race. (Fill in the gap).", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "win", "খ": "wins", "গ": "has won", "ঘ": "won"}, "answerKey": "খ", "answerText": "wins", "explanation_bn": "দুটি noun, and দ্বারা যুক্ত হয়ে যদি একটি মাত্র ভাব প্রকাশ করে, তবে verb টি singular হয়। যেমন: horse and carriage, bread and butter, slow and steady ইত্যাদি। এক্ষেত্রে সাধারণত Present Indefinite tense ব্যবহৃত হয়। এজন্য শূন্যস্থানে slow and steady এরপর 'wins' হবে।"}, {"id": "EL-0337", "page": 44, "chapter": "Chapter 03: Corrections", "topic": "3.2 Subject Verb Agreement", "qno": "04", "question": "'Subject-Verb Agreement' refers to-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "person only", "খ": "number, person and gender", "গ": "number and person", "ঘ": "number only"}, "answerKey": "গ", "answerText": "number and person", "explanation_bn": "Subject-Verb Agreement হচ্ছে subject-এর number ও person অনুযায়ী verb-এর পরিবর্তন। যেমন- Subject 3rd person singular number হলে Present Indefinite Tense এ Verb এর সাথে s/es যুক্ত হয়।"}, {"id": "EL-0338", "page": 44, "chapter": "Chapter 03: Corrections", "topic": "3.2 Subject Verb Agreement", "qno": "05", "question": "The only error in the sentence \"One of the recommendation made by the committee was accepted by the authorities\" is-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "recommendation", "খ": "was", "গ": "accepted by", "ঘ": "committee"}, "answerKey": "ক", "answerText": "recommendation", "explanation_bn": "আমরা জানি One of the- এর পর সব সময় plural noun বা Pronoun ব্যবহৃত হয়। তাই recommendation এর সাথে s যুক্ত হবে।"}, {"id": "EL-0339", "page": 44, "chapter": "Chapter 03: Corrections", "topic": "3.2 Subject Verb Agreement", "qno": "06", "question": "After food has been dried or canned ___ for later consumption.", "source_tag": "৩২তম বিসিএস", "options": {"ক": "it should be stored", "খ": "that it should be stored", "গ": "should be stored", "ঘ": "which should be stored"}, "answerKey": "ক", "answerText": "it should be stored", "explanation_bn": "Sentence-এ after শব্দটি conjunction এবং 'after food has been dried or canned' একটি dependent clause. এর পরবর্তী clause-টি independent হবে এবং এর সাথে কোনো clause marker থাকবে না। তাই 'ক' সঠিক answer. option (খ) ও (ঘ)-এ that ও which থাকায় বাক্য দুটি অশুদ্ধ। Option (গ)-এ subject নেই।"}, {"id": "EL-0340", "page": 44, "chapter": "Chapter 03: Corrections", "topic": "3.2 Subject Verb Agreement", "qno": "07", "question": "Neither Rini nor Simi ___ qualified for the job.", "source_tag": "২৮তম বিসিএস", "options": {"ক": "are", "খ": "is", "গ": "were", "ঘ": "had"}, "answerKey": "খ", "answerText": "is", "explanation_bn": "either…..or, neither…..nor, not only…….but also ইত্যাদি co-relative conjunction গুলোর পরবর্তী Subject-এর noun বা Pronoun অনুযায়ী Verb ব্যবহৃত হবে। এখানে nor-এর পর Simi থাকায় Verb-টি singular হবে। তাই are, were এখানে ব্যবহৃত হবে না। তাছাড়া, Sentence-টি passive voice-এ থাকায় had ব্যবহৃত হবে না। আলোচ্য ক্ষেত্রে is/was এর ব্যবহার রীতিসিদ্ধ।"}, {"id": "EL-0341", "page": 44, "chapter": "Chapter 03: Corrections", "topic": "3.2 Subject Verb Agreement", "qno": "08", "question": "The Arabian Nights ___ still a great favourite.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "has", "খ": "are", "গ": "is", "ঘ": "were"}, "answerKey": "গ", "answerText": "is", "explanation_bn": "বিষয়, খেলা, রোগ, বই ইত্যাদির নাম দেখতে plural হলেও singular হিসেবে গণ্য হবে এবং এরপর singular verb হবে। যেমন: The Arabian Nights, The Indian Musalmans, White House Years, Glimpses of the History, Gymnastics, Aeronautics, Genetics, Rabies, Classics, Billiards ইত্যাদি। The Arabian Nights একটি আরব্য উপন্যাসের নাম। 'The Arabian Nights' Subject হিসেবে নিজেই এখনো তুমুল জনপ্রিয় (still a great favourite)। আর Subject যখন নিজেই কিছু হয় বা কোথাও থাকে, তখন 'to be' verb ব্যবহৃত হয়। এজন্য 'be' verb-এর রূপ হিসেবে 'is' ই সঠিক।"}, {"id": "EL-0342", "page": 44, "chapter": "Chapter 03: Corrections", "topic": "3.2 Subject Verb Agreement", "qno": "09", "question": "At least one of the students ___ full marks every time.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "get", "খ": "are getting", "গ": "gets", "ঘ": "have got"}, "answerKey": "গ", "answerText": "gets", "explanation_bn": "এই Sentence-এর subject হলো one of the students. one of the students অনুযায়ী Verb নির্ধারিত হবে। at least এখানে Adverb. One of + plural noun/pronoun-এর পর singular verb হয়। তাই verb হিসেবে gets বসবে।"}, {"id": "EL-0343", "page": 44, "chapter": "Chapter 03: Corrections", "topic": "3.2 Subject Verb Agreement", "qno": "10", "question": "Three fourths of the work ___ finished.", "source_tag": "২৩তম বিসিএস", "options": {"ক": "have been", "খ": "had", "গ": "has been", "ঘ": "were"}, "answerKey": "গ", "answerText": "has been", "explanation_bn": "বাক্যে ভগ্নাংশের ক্ষেত্রে লব যদি One (1) হয় তাহলে হরের সাথে 's' হবে না। যেমন: One-third, One-fourth, One-fifth ইত্যাদি। কিন্তু লব যদি One এর অধিক হয় তাহলে হরের সাথে 's' হবে। যেমন: Two-thirds, two-fifths, three-fourths ইত্যাদি। আর উভয় ক্ষেত্রেই ভগ্নাংশের পর Noun টি Countable হলে Verb টি Plural এবং Uncountable হলে Verb টি Singular হয়। যেমন: One-third of the students are present in the class/Two-thirds of the road has been repaired. আলোচ্য Sentence-এ 'two-fourths of the work' singular subject হওয়ায় এবং sentence-টি passive হওয়ায় has been বা had been বা was ব্যবহৃত হবে। এখানে had, have been বা were এর ব্যবহার রীতিসিদ্ধ নয়।"}, {"id": "EL-0344", "page": 45, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "01", "question": "Samin is my colleague. I ___ him for ten years.", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "know", "খ": "knew", "গ": "have known", "ঘ": "have been known"}, "answerKey": "গ", "answerText": "have known", "explanation_bn": "কোনো কাজ পূর্ব হতে আরম্ভ হয়ে বর্তমান সময় পর্যন্ত চলে আসছে বুঝালে এবং Sentence এর মধ্যে নির্দিষ্ট সময় যাবৎ(ধরে), হতে, থেকে অর্থে for বা since থাকলে Present Perfect Continuous Tense হয়। কিন্তু কিছু কিছু Word আছে যেগুলোর কোনো continuous form নেই। যেমন: Believe, imagine, know, think, like, love, prefer, want, wish, appear, look, feel, hear, see, seem, smell, taste, belong, weigh. এক্ষেত্রে, Present/Past/Future perfect continuous এর পরিবর্তে present/past/future perfect tense এবং present/past/future continuous এর পরিবর্তে present/past/future indefinite tense হবে। উক্ত প্রশ্নের প্রথম Sentence-টি present tense হওয়ায় এবং দ্বিতীয় Sentence-এ for ten years থাকায় দ্বিতীয় Sentence টি Present perfect বা Present perfect continuous Tense হবে। যেহেতু অপশন গুলোতে know verb আছে তাই দ্বিতীয় Sentence-এ Present perfect continuous Tense না হয়ে Present perfect হবে। সুতরাং উত্তর হবে have known।"}, {"id": "EL-0345", "page": 45, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "02", "question": "Choose the right form of verb: The boy (to lie) on the floor yesterday.", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "lies", "খ": "lied", "গ": "lay", "ঘ": "layed"}, "answerKey": "গ", "answerText": "lay", "explanation_bn": "অতীত নির্দেশক শব্দ বা Phrase যেমন: Yesterday, Ago, Long since, Last night, Last year, Last month, Last day, In the past, Once থাকলে Verb এর past form হয়। যেমন: He came to me the day before yesterday. Lie-শুয়ে থাকা। এর past form lay এবং past participle form lain. বাক্যের শেষে Yesterday আছে, তাই past হিসেবে lay হবে।"}, {"id": "EL-0346", "page": 45, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "03", "question": "Identify the right tense: 'My father ___ before I came'.", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "would be leaving", "খ": "had been leaving", "গ": "had left", "ঘ": "will leave"}, "answerKey": "গ", "answerText": "had left", "explanation_bn": "Before-এর পূর্বে Past Perfect Tense এবং পরে Past Indefinite Tense এবং After-এর পরে Past Perfect Tense এবং পূর্বে Past Indefinite Tense হয়। এক্ষেত্রে মনে রাখতে হবে যে, Before অর্থ 'পূর্বে' অতএব, Before-এর পূর্বে Past Perfect Tense হবে। After-অর্থ 'পরে' অতএব, After-এর পরে Past Perfect Tense হবে। যেমন: I had completed my work before you came. Or, The students stood up after the teacher had entered the room. উল্লেখ্য, অতীতকালে সংঘটিত দুটি কাজের মধ্যে যে কাজটি অপেক্ষাকৃত দীর্ঘ সময় ধরে চলছিল তা নির্দেশ করতে Verb-এর Past continuous tense হয়। Before দ্বারা দুটি কাজ যুক্ত হলে Before এর পরে Past indefinite এবং Before এর পূর্বে Past perfect continuous tense হবে। অর্থাৎ Past perfect continuous tense + before + past indefinite tense কিন্তু কাজ দুটি after দ্বারা যুক্ত হলে after এর পূর্বে Past indefinite থাকলে after এর পরে Past perfect continuous tense হবে। অর্থাৎ Past indefinite tense + after + Past perfect continuous tense. যেমন: Rahim had been looking for a new roommate before he finally succeeded. Or, The rain started after we had been playing."}, {"id": "EL-0347", "page": 45, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "08", "flag": "⚠ Source numbering jumps 03→08 on this page, preserved as printed.", "question": "Choose the right form of verb: It is high time we (act) on the matter.", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "are acting", "খ": "acted", "গ": "have acted", "ঘ": "could act"}, "answerKey": "খ", "answerText": "acted", "explanation_bn": "It is time, It is high time, It is right time ইত্যাদির পরে যদি Subject থাকে তাহলে Verb-এর Past form হয়। কিন্তু Subject না থাকলে to + V1. যেমন: It is high time we acted on the matter. Or, It is high time to do the work."}, {"id": "EL-0348", "page": 46, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "05", "question": "Fill in the gap with the correct form of verb: The police ___ informed yesterday:", "source_tag": "৪২তম বিসিএস", "options": {"ক": "is", "খ": "are", "গ": "was", "ঘ": "were"}, "answerKey": "ঘ", "answerText": "were", "explanation_bn": "সাধারণত collective noun এর পরে singular verb ব্যবহৃত হয় কিন্তু the police, cattle, people, poultry, vermin ইত্যাদি collective noun গুলো plural verb গ্রহণ করে, তাই correct answer-The police were informed yesterday. এখানে yesterday থাকায় are হবে না।"}, {"id": "EL-0349", "page": 46, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "06", "question": "Hospitals ___ the sick.", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "operate", "খ": "treat", "গ": "admit", "ঘ": "nurse"}, "answerKey": "খ", "answerText": "treat", "explanation_bn": "'Treat' অর্থ ওষুধ ও অস্ত্রোপচারের মাধ্যমে চিকিৎসা প্রদান করা। হাসপাতালগুলো ওষুধ ও অস্ত্রোপচারের মাধ্যমে চিকিৎসা প্রদান করে বলে শূন্যস্থানে 'treat' verb টি বসবে। অন্য তিনটি অপশন operate (পরিচালনা করা), nurse (সেবা করা) ও admit (স্বীকার করা, ভর্তি করা) এখানে যথোপযুক্ত নয়।"}, {"id": "EL-0350", "page": 46, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "07", "question": "Fill in the blank: Tourists ___ their reservations well in advance if they want to fly to Cox's Bazar.", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "better to had get", "খ": "had better to get", "গ": "had better got", "ঘ": "had better get"}, "answerKey": "ঘ", "answerText": "had better get", "explanation_bn": "Had better, Had rather, Would better, Would rather ইত্যাদির পর Verb-টির Base form হয়। যেমন: She had better shut up now. Or, You would rather flee away. শূন্যস্থানে had better get বসবে। অন্যান্য option এ had better + verb এর base form এর সঠিক প্রয়োগ নেই।"}, {"id": "EL-0351", "page": 46, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "08", "question": "Cassandra is a night owl, so she doesn't usually get up untill about:", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "11 a.m", "খ": "11 p.m", "গ": "7 a.m", "ঘ": "7 p.m"}, "answerKey": "ক", "answerText": "11 a.m", "explanation_bn": "প্রশ্নানুসারে যেহেতু 'Cassandra is a night owl' সেহেতু তার পক্ষে 11 pm, 7am বা 7 pm-এ ঘুম থেকে জেগে উঠা যুক্তিসঙ্গত নয়। বরং 11 am-ই উত্তর হিসেবে অধিক যুক্তিসঙ্গত। Greek Mythology অনুযায়ী Cassandra ছিলেন ট্রয়রাজ Priam-এর কন্যা। আর 'Night Owl' Metaphorical Idiom, যার অর্থ নিশাচর বা যে রাত জেগে থাকে। এখানে রূপক অর্থে Cassandra কে night owl-এর সাথে তুলনা করা হয়েছে।"}, {"id": "EL-0352", "page": 46, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "09", "question": "Fill in the blank with appropriate use of tense: I couldn't mend the computer myself, so I ___ at a shop.", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "had it mended", "খ": "had it mend", "গ": "did it mend", "ঘ": "had mended"}, "answerKey": "ক", "answerText": "had it mended", "explanation_bn": "কর্তা যখন নিজে কাজ না করে অন্য কাউকে দিয়ে কোনো কাজ করায় তখন সেই Sentence-টির Verb-কে বলা হয় Causative Verb (প্রযোজক ক্রিয়া)। Causative Verb গুলো হলো: Make, Let, Have, Get, Help ইত্যাদি। Structure 01: Have /get/make + something (বস্তু)+ V3 যেমন: I got my car repaired. Or, It costs about 50 dollars to have a tooth filled. Structure 02: Have + someone (ব্যক্তি)+ V1 যেমন: Mary had John wash the car. Or, Anis had Rafique clean the floor. Structure অনুযায়ী had it mended-ই সঠিক। এখানে did it mend, had it mend ও had mended-এর ব্যবহার ব্যাকরণগতভাবে ভুল। সুতরাং প্রদত্ত বাক্যটির পূর্ণরূপ হবে- I couldn't mend the computer myself, so I had it mended at a shop।"}, {"id": "EL-0353", "page": 46, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "10", "question": "Teacher said, 'The earth ___ round the sun.'", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "moves", "খ": "moved", "গ": "has moved", "ঘ": "will be moving"}, "answerKey": "ক", "answerText": "moves", "explanation_bn": "Universal truth, habitual fact বা চিরন্তন সত্য, অভ্যাসগত কর্ম সর্বদা Present Indefinite Tense দ্বারা প্রকাশ করা হয়। এক্ষেত্রে Subject যখন third person singular number হয়, তখন verb এর শেষে s বা es যুক্ত হয়।"}, {"id": "EL-0354", "page": 46, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "11", "question": "Identify the correct sentence?", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "Yesterday, he has gone home", "খ": "Yesterday, he did gone home", "গ": "Yesterday, he had gone home", "ঘ": "Yesterday, he went home"}, "answerKey": "ঘ", "answerText": "Yesterday, he went home", "explanation_bn": ""}, {"id": "EL-0355", "page": 46, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "12", "question": "Cricket enjoys a huge ___ in Bangladesh.", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "follow on", "খ": "fall out", "গ": "follow", "ঘ": "following"}, "answerKey": "ঘ", "answerText": "following", "explanation_bn": "Adjective ও Preposition এর মাঝে Noun বসে। অপশন গুলোর ভিতরে একমাত্র following শব্দটি Noun (Gerund)। উল্লেখ্য, যদি simple sentence-এ মূল verb (enjoy, finish, avoid, fancy, feel, like, mind, give up, deny, admit etc.) থাকে, এরপর আবারো verb আসলে পরবর্তী verb এর সাথে ing যুক্ত হয়।"}, {"id": "EL-0356", "page": 47, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "13", "question": "We look forward ___ a response from you.", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "to receiving", "খ": "to receive", "গ": "in receiving", "ঘ": "for receiving"}, "answerKey": "ক", "answerText": "to receiving", "explanation_bn": "Look forward to, with a view to, be used to, get used to ইত্যাদির পর কোনো verb-আসলে উক্ত verb-এর সাথে ing যুক্ত হয়। সুতরাং সঠিক উত্তর হবে 'to receiving'।"}, {"id": "EL-0357", "page": 47, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "14", "question": "Choose a suitable word/phrase to fill in the blanks of the given sentences: Travellers ___ their reservation well in advance if they want to visit the St. Martins island.", "source_tag": "৩২তম বিসিএস", "options": {"ক": "had better to get", "খ": "had to better get", "গ": "had better got", "ঘ": "had better get"}, "answerKey": "ঘ", "answerText": "had better get", "explanation_bn": "Had better- এর পর verb -এর base form বসে। যেমন- You had better hurry now. Sentence-এ had better to get, had to better get, ও had better got এর ব্যবহার অপপ্রয়োগ হবে।"}, {"id": "EL-0358", "page": 47, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "15", "question": "\"Not once has our neighbour invited us into his house.\"", "source_tag": "৩২তম বিসিএস", "options": {"ক": "Our neighbour has invited us into his house not once but many times.", "খ": "Our neighbour has never invited us into his house.", "গ": "Occasionally our neighbour has invited us into his house", "ঘ": "Our neighbour has not always invited us into his house."}, "answerKey": "খ", "answerText": "Our neighbour has never invited us into his house.", "explanation_bn": "Never, Rarely, Only rarely, Hardly, Seldom, Very seldom, Nor, Little, Never before, Never again, Scarcely, Barely, Nowhere, No sooner, Neither, Not once, Not until, Not only…. But also, Not a + Noun ইত্যাদি Negative Adverb এরপর Inversion হয়ে থাকে। Negative Adverb গুলো থাকলে বাক্য গঠনের নিয়ম: Negative Adv + Auxiliary Verb + Sub + Principal Verb +…. যেমন: Not once has our neighbour invited us into hos house. Not once থাকায় বাক্যটির অর্থ negative হবে। বাক্যটির অর্থ আমাদের প্রতিবেশী আমাদেরকে একবারের জন্যও নিমন্ত্রণ করেনি। অর্থাৎ, আমাদের প্রতিবেশী আমাদেরকে কখনও নিমন্ত্রণ করেনি। তাই Our neighbour has never invited us into his house. বাক্যটি-ই সঠিক। অপশন (ক), অপশন (গ) এবং অপশন (ঘ) এর অর্থ প্রশ্নোক্ত বাক্যের সাথে সামঞ্জস্যপূর্ণ নয়।"}, {"id": "EL-0359", "page": 47, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "16", "question": "Rishan walks as if he ___ lame.", "source_tag": "৩০তম বিসিএস", "options": {"ক": "is", "খ": "has", "গ": "had been", "ঘ": "were"}, "answerKey": "ঘ", "answerText": "were", "explanation_bn": "Unreal past বা অবাস্তব অতীত প্রকাশে As if বা as though ব্যবহৃত হয়। As if বা as though যুক্ত clause-টি সর্বদা past indefinite tense এ হয় এবং 'be' verb থাকলে were হবে।"}, {"id": "EL-0360", "page": 47, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "17", "question": "They suffered much ___ tornado had hit their village.", "source_tag": "৩১তম বিসিএস", "options": {"ক": "until", "খ": "since", "গ": "as if", "ঘ": "let alone"}, "answerKey": "খ", "answerText": "since", "explanation_bn": "Since (যেহেতু) Conjunction হিসেবে ব্যবহৃত হলে এর পূর্বে past indefinite tense থাকলে since-এর পরে past perfect tense হয়। Until (যে পর্যন্ত না) ও let alone এখানে সঙ্গতিপূর্ণ নয়। As if 'unreal past' প্রকাশে ব্যবহৃত হয়। বাক্যটির অর্থ যেহেতু টর্নেডো তাদের গ্রামে আঘাত করেছিল তাই তারা অনেক ভোগান্তির শিকার হয়েছিল।"}, {"id": "EL-0361", "page": 47, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "18", "question": "I have not heard from him-", "source_tag": "২৯তম বিসিএস", "options": {"ক": "long since", "খ": "for a long time", "গ": "since long", "ঘ": "for long"}, "answerKey": "খ", "answerText": "for a long time", "explanation_bn": "দীর্ঘ সময়ের ব্যাপ্তি বুঝাতে for a long time ব্যবহৃত হয়। এই অর্থে long since, since long ও for long এর ব্যবহার যুক্তিযুক্ত নয়।"}, {"id": "EL-0362", "page": 47, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "19", "question": "He said that he ___ be unable to come.", "source_tag": "২৯তম বিসিএস", "options": {"ক": "will", "খ": "shall", "গ": "should", "ঘ": "would"}, "answerKey": "ঘ", "answerText": "would", "explanation_bn": "Reporting verb-টি past tense এ থাকলে Indirect speech এর Reported speech-টিও একইভাবে Past tense এ পরিবর্তন করতে হবে। এখানে shall/will কে tense এর পরিবর্তনের আওতায় কর্তানুসারে would করা হয়েছে।"}, {"id": "EL-0363", "page": 47, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "20", "question": "He had written the book before he-", "source_tag": "২৮তম বিসিএস", "options": {"ক": "retired", "খ": "had retired", "গ": "has retired", "ঘ": "will be retired"}, "answerKey": "ক", "answerText": "retired", "explanation_bn": ""}, {"id": "EL-0364", "page": 47, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "21", "question": "Only after I ___ home, did I remember my doctor's appointment.", "source_tag": "২৮তম বিসিএস", "options": {"ক": "going", "খ": "go", "গ": "went", "ঘ": "gone"}, "answerKey": "গ", "answerText": "went", "explanation_bn": "Only after, Not until, Only because, Only if, Only when, Only until, ইত্যাদি Negative Adverb এর পর Inversion হয়ে থাকে। এই Negative Adverb গুলো থাকলে বাক্য গঠনের নিয়ম: Only after/ Not until/Only Because/ Only if/Only when/ Only until + Clause + comma (,) + Auxiliary verb + Subject + Principal verb + extension. যেমন: Only after I went home, did I remember my doctor's appointment. উল্লেখ্য, Complex Sentence-এর নিয়ম অনুযায়ী একটি clause যে tense-এ থাকবে পরবর্তী clause ও সেই tense অনুযায়ী হবে। প্রশ্নে উল্লিখিত বাক্যটির 'did I remember my doctor's clause টি simple past form-এ আছে। সুতরাং পূর্বের clause টির verb ও simple past form হবে।"}, {"id": "EL-0365", "page": 48, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "22", "question": "The prices of rice are-", "source_tag": "২৮তম বিসিএস", "options": {"ক": "raising", "খ": "risen", "গ": "rising", "ঘ": "raised"}, "answerKey": "গ", "answerText": "rising", "explanation_bn": "বাক্যটিতে rice-এর মূল্য বৃদ্ধি একটি চলমান প্রক্রিয়া অর্থাৎ Continuous Process. অতএব বাক্যটিতে 'rise' verb-এর Continuous Tense হবে। অর্থাৎ ing যোগ হয়ে হবে rising. Rise অর্থ ঘুম থেকে ওঠা, জেগে ওঠা, বৃদ্ধি পাওয়া। এর Past ও Past Participle Form যথাক্রমে rose, risen. Raise দ্বারা কোনো কিছুকে ওঠানো বোঝায়। এর Past Form ও Past Participle Form raised।"}, {"id": "EL-0366", "page": 48, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "23", "question": "New programs will be ___ next week in Bangladesh Television.", "source_tag": "২৮তম বিসিএস", "options": {"ক": "telecast", "খ": "published", "গ": "telecasted", "ঘ": "broadecasted"}, "answerKey": "ক", "answerText": "telecast", "explanation_bn": "Telecast অর্থ টেলিভিশনে অনুষ্ঠান প্রচার করা। অপরদিকে broadcast অর্থ টেলিভিশন, রেডিও বা ইন্টারনেটে সম্প্রচার করা। broadcast ও telecast শব্দ দুইটি past ও past participle form-এ অপরিবর্তিত থাকে। প্রশ্নোক্ত ক্ষেত্রে will be এর পর Verb-এর past participle form হবে। এক্ষেত্রে broadcast ও telecast দুইটি-ই ব্যবহার করা যায়। তাই telecast-ই এখানে সঠিক উত্তর। publish অর্থ কোনো কিছু প্রকাশ করা। যেমন- বই, পত্রিকা ইত্যাদি।"}, {"id": "EL-0367", "page": 48, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "24", "question": "He ___ consciousness as a result of his head hitting the car's dashboard.", "source_tag": "২৮তম বিসিএস", "options": {"ক": "failed", "খ": "lost", "গ": "broke", "ঘ": "passed"}, "answerKey": "খ", "answerText": "lost", "explanation_bn": "বাক্যের অর্থের সাথে সামঞ্জস্য রেখে এখানে lost-এর ব্যবহারই অধিক প্রাসঙ্গিক। কারণ, মাথায় আঘাতের ফলে মানুষের চিত্তাশক্তি হারানো একটি স্বাভাবিক ঘটনা। এক্ষেত্রে, broke, failed, passed-এর ব্যবহার বাক্যের অর্থের সাথে সামঞ্জস্যপূর্ণ নয়।"}, {"id": "EL-0368", "page": 48, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "25", "question": "I cannot ___ to pay such high prices.", "source_tag": "২৮তম বিসিএস", "options": {"ক": "able", "খ": "but", "গ": "try", "ঘ": "afford"}, "an
