swerKey": "ঘ", "answerText": "afford", "explanation_bn": "cannot এরপর Verb-এর base form ব্যবহৃত হবে। afford অর্থ বহন করা। এখানে বাক্যের অর্থ অনুযায়ী afford ব্যবহৃত হবে।"}, {"id": "EL-0369", "page": 48, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "26", "question": "Select the right word. He ran fast lest he ___ miss the train.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "can", "খ": "should", "গ": "could", "ঘ": "has"}, "answerKey": "খ", "answerText": "should", "explanation_bn": "Lest (পিছনে ভয় হয়) যুক্ত sentence যে tense-এরই হোক না কেন lest-এর পর সব সময় auxiliary verb 'should' বসে।"}, {"id": "EL-0370", "page": 48, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "27", "question": "Complete the sentence with the correct verb from: 'Neela ___ her hand when she was cooking dinner.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "is burning", "খ": "burnt", "গ": "will burn", "ঘ": "was burning"}, "answerKey": "খ", "answerText": "burnt", "explanation_bn": "As, even as, when, while যুক্ত completing sentence-এর principal clause-টি past indefinite tense হলে as/when/while যুক্ত clause-টি past continuous tense হবে। তাই এখানে answer হবে burnt।"}, {"id": "EL-0371", "page": 48, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "28", "question": "As the sun ___, I decided to go out.", "source_tag": "২৬তম, ২৪তম বিসিএস", "options": {"ক": "has shone", "খ": "shine", "গ": "shines", "ঘ": "was shining"}, "answerKey": "ঘ", "answerText": "Was shining", "explanation_bn": ""}, {"id": "EL-0372", "page": 48, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "29", "question": "Do not make a noise while your father ___.", "source_tag": "২৬তম, ২৪তম বিসিএস", "options": {"ক": "Is sleeping", "খ": "Has slept", "গ": "Asleep", "ঘ": "Is being asleep"}, "answerKey": "ক", "answerText": "Is sleeping", "explanation_bn": ""}, {"id": "EL-0373", "page": 48, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "30", "question": "He has been ill ___ Friday last.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "From", "খ": "On", "গ": "In", "ঘ": "Since"}, "answerKey": "ঘ", "answerText": "Since", "explanation_bn": "Point of time সময়বিন্দু নির্দিষ্ট মুহূর্ত বা সময়কে নির্দেশ করে যা গণনার একেকে পরিমাপযোগ্য নয়। এরপূর্বে since বসে। যেমন: since 5:00 O'clock, since morning, since night, since friday, since 5th January ইত্যাদি।"}, {"id": "EL-0374", "page": 49, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "31", "question": "Choose the correct alternative and mark its letter on your answer sheet: She told me his name after he ___.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "left", "খ": "had left", "গ": "has left", "ঘ": "has been leaving"}, "answerKey": "খ", "answerText": "had left", "explanation_bn": ""}, {"id": "EL-0375", "page": 49, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "32", "question": "He intends to ___ in the country for two months.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "live", "খ": "stay", "গ": "stop", "ঘ": "halt"}, "answerKey": "খ", "answerText": "stay", "explanation_bn": "Live- স্থায়ীভাবে বাস করা; stay- সাময়িক সময়ের জন্য অবস্থান করা; halt- সাময়িক নিবৃত্তি (সৈন্য সম্পর্কে) এবং Stop- থামা। আলোচ্য sentence-এ সাময়িকভাবে দুই মাসের জন্য অবস্থান করার ইচ্ছা প্রকাশ করায় এখানে stay এর ব্যবহারই অধিক সামঞ্জস্যপূর্ণ।"}, {"id": "EL-0376", "page": 49, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "33", "question": "She has ___ her hair a beautiful shade of brown.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "colored", "খ": "given", "গ": "dried", "ঘ": "dyed"}, "answerKey": "ঘ", "answerText": "dyed", "explanation_bn": "Dye ও color-এর মধ্যে সূক্ষ্ম পার্থক্য রয়েছে। Dye হলো এমন রঞ্জক পদার্থ যা বস্তুর অভ্যন্তরে প্রবেশ করে এর বর্ণ পরিবর্তন করে। যেমন: textiles, paper, leather-এ রং করা। অন্যদিকে, color হলো সেই রঞ্জক পদার্থ যা বস্তুর উপরে প্রলেপ দিয়ে এর বর্ণ পরিবর্তন করে। এটি paint বা ink এর বিকল্প হিসেবে ব্যবহৃত হয়। Dye ও color দুই-ই verb হিসেবে ব্যবহৃত হয় যার অর্থ রং করা। Dye হলো এমন রঞ্জক পদার্থ দিয়ে রং করা যা বস্তুর অভ্যন্তরে গিয়ে তার বর্ণ পরিবর্তন করে। অপরদিকে, color হলো এমন রঞ্জক পদার্থ দিয়ে রং করা যা বস্তুর উপরের বর্ণ পরিবর্তন করে। প্রশ্নোক্ত ক্ষেত্রে, চুলে রং করলে চুলের ভিতরে রঞ্জক পদার্থ প্রবেশ করে চুলের রং পরিবর্তন করে বলে এখানে Dye এর ব্যবহার যথার্থ।"}, {"id": "EL-0377", "page": 49, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "34", "question": "Water boils ___ you heat it to 100° centigrade.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "unless", "খ": "until", "গ": "if", "ঘ": "although"}, "answerKey": "গ", "answerText": "if", "explanation_bn": "চিরন্তন সত্য/বৈজ্ঞানিক গবেষণার ফলাফল/প্রাত্যহিক অভ্যাসগত কাজ বুঝাতে এবং আদেশ/উপদেশ/অনুরোধ বুঝাতে zero conditional ব্যবহৃত হয়। Structures: If + subject + Simple present tense ___, subject + Simple present tense ___. অথবা, subject + Simple present tense ___ if + subject + Simple present tense ___. যেমন: Water boils if you heat it to 100° centigrade. আলোচ্য Sentence- এ বৈজ্ঞানিক সত্য প্রকাশিত হয়েছে তাই if ব্যবহৃত হবে।"}, {"id": "EL-0378", "page": 49, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "35", "question": "I opened the door as soon as I ___ the bell.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "have heard", "খ": "was hearing", "গ": "am heard", "ঘ": "heard"}, "answerKey": "ঘ", "answerText": "heard", "explanation_bn": "অতীতে কোনো ঘটনা সামসময়িক সময়ে ঘটলে 'as soon as' conjunction হিসেবে ব্যবহৃত হয় এবং উভয়ই একই tense-এ হয়। সুতরাং as soon as এর পূর্বে past indefinite থাকায় এর পরেও past indefinite (heard) হবে।"}, {"id": "EL-0379", "page": 49, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "36", "question": "I am looking for someone who ___ play the piano.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "able to", "খ": "is able", "গ": "can be able to", "ঘ": "can"}, "answerKey": "ঘ", "answerText": "can", "explanation_bn": "কারো কোনো কিছু করার যোগ্যতা, সামর্থ্য বা সুযোগ (Ability or opportunity) রয়েছে বা কেউ কোনো কিছু করতে সক্ষম এরূপ বুঝাতে can ব্যবহৃত হয়। উল্লেখ্য, can শুধু present indefinite tense-এর ক্ষেত্রে ব্যবহৃত হয়। আর present perfect ও future tense-এর ক্ষেত্রে can-এর পরিবর্তে be able to ব্যবহৃত হয়।"}, {"id": "EL-0380", "page": 49, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "37", "question": "Just now he ___ his dinner but he says he will see you when he's finished.", "source_tag": "২৪তম বিসিএস", "options": {"ক": "is having", "খ": "has had", "গ": "was having", "ঘ": "had"}, "answerKey": "খ", "answerText": "has had", "explanation_bn": "Sentence-এ just, yet, already, recently, just now, by this time ইত্যাদি থাকলে present perfect tense হয়। অপশন গুলোর মধ্যে 'has had' present perfect tense-এ আছে।"}, {"id": "EL-0381", "page": 49, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "38", "question": "I don't mind ___ with the cooking but I am not going to wash the dishes.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "to help", "খ": "help", "গ": "helping", "ঘ": "for helping"}, "answerKey": "গ", "answerText": "helping", "explanation_bn": "কতগুলো Verb রয়েছে যাদের পর Gerund তথা Verb + ing বসে। যেমন: Avoid, Mind, Stop, consider, Enjoy, Deny, Postpone, Find, worth, Like, Hate, Mention, Finish, Feel, Practice, Suggest, Admit ইত্যাদি।"}, {"id": "EL-0382", "page": 50, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "39", "question": "My uncle arrived while I ___ the dinner.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "would cook", "খ": "had cooked", "গ": "cook", "ঘ": "was cooking"}, "answerKey": "ঘ", "answerText": "was cooking", "explanation_bn": ""}, {"id": "EL-0383", "page": 50, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "40", "question": "Choose the correct option: Even as harvesting was going on ___.", "source_tag": "২৩তম বিসিএস", "options": {"ক": "the rainy season began", "খ": "the rainy season was began", "গ": "the rainy season had began", "ঘ": "the rainy season begins"}, "answerKey": "ক", "answerText": "the rainy season began", "explanation_bn": ""}, {"id": "EL-0384", "page": 50, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "41", "question": "We waited until the plane ___.", "source_tag": "২৩তম বিসিএস", "options": {"ক": "did not take off", "খ": "took off", "গ": "had not taken off", "ঘ": "had taken off"}, "answerKey": "ঘ", "answerText": "had taken off", "explanation_bn": "Until একটি negative অর্থবোধক conjunction যার অর্থ 'যে পর্যন্ত না' এবং এর পর কোনো negative অর্থবোধক শব্দ আসে না। Until / till এর পূর্বের clause-টি বা principal clause-টি past indefinite tense-এ হলে Until / till যুক্ত clause-টি সাধারণত past indefinitte tense হয়। যেমন: I waited for my friend until he came. কিন্তু কাজটির শেষ মুহূর্ত পর্যন্ত অপেক্ষা বুঝাতে until এরপর past perfect tense হয়। প্রশ্লোক্ত ক্ষেত্রে, প্লেনটি উড়ে যাওয়া পর্যন্ত অপেক্ষা করা বুঝাচ্ছে, তাই had taken off হবে। 'did not take off' ও 'had not taken off' Negative হওয়ায় আলোচ্য ক্ষেত্রে প্রযোজ্য নয়।"}, {"id": "EL-0385", "page": 50, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "42", "question": "The path ___ paved, so we were able to walk through the path.", "source_tag": "২২তম বিসিএস", "options": {"ক": "was", "খ": "had been", "গ": "has been", "ঘ": "being"}, "answerKey": "খ", "answerText": "had been", "explanation_bn": "অতীতকালের দুটি কাজের মধ্যে পূর্বে সংগঠিত কাজটি past perfect tense আর পরেরটি past indefinite tense-এ হবে। বাক্যে রাস্তাটি পাকা করার কাজ আগে হয়েছিল তাই The path had been paved হবে।"}, {"id": "EL-0386", "page": 50, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "43", "question": "The parthenon is said ___ erected in the Age of Pericles.", "source_tag": "২১তম বিসিএস", "options": {"ক": "to have become", "খ": "to have begun", "গ": "to have been", "ঘ": "to have had begun"}, "answerKey": "গ", "answerText": "to have been", "explanation_bn": "অতীত কালে কোন কিছু ঘটেছিল এমন কিছু জোর দিয়ে বলার ক্ষেত্রে perfect infinitive (to+have+V3) ব্যবহৃত হয়। বাক্যটিতে বলা হয়েছে 'পার্থেনন পেরিক্লিসের যুগে নির্মিত হয়েছিল বলে বলা হয়'। তাই এখানে নিয়ম ও অর্থ অনুযায়ী to have been হবে। 'to have begun' ও 'to have become' perfect infinitive (to+have+V3)-এর নিয়মানুযায়ী গঠিত হলেও আলোচ্য বাক্যে এদের ব্যবহার অর্থপূর্ণ নয়।"}, {"id": "EL-0387", "page": 50, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "88", "flag": "⚠ Source shows unusual question number '88' (likely a printing/typo error for '44'); preserved as printed.", "question": "As they waited Rahim argued against war-", "source_tag": "২১তম বিসিএস", "options": {"ক": "While his brother discusses the effects of pollution.", "খ": "While his brother discussed the effects of pollution.", "গ": "While his brother was discussing the effects of pollution.", "ঘ": "While his brother had discussed the effects of pollution."}, "answerKey": "গ", "answerText": "While his brother was discussing the effects of pollution.", "explanation_bn": ""}, {"id": "EL-0388", "page": 50, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "45", "question": "A reward has been announced for the employees who ___ hard.", "source_tag": "২১তম বিসিএস", "options": {"ক": "have worked", "খ": "has worked", "গ": "will be work", "ঘ": "have had worked"}, "answerKey": "ক", "answerText": "have worked", "explanation_bn": "Relative pronoun এর antecedent অনুসারে verb বসে এবং Relative pronoun-এর পূর্বের ও পরের Clause-এর Tense একই হবে। এখানে who এর antecedent (The employees) টি plural, তাই পরের verb টিও plural হবে এবং who এর পূর্বের clause-টি present perfect tense হওয়ায় পরের Clause-টিও present perfect tense হবে।"}, {"id": "EL-0389", "page": 50, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "46", "question": "An intensive search was conducted by the detective to locate those criminals, who-", "source_tag": "২০তম বিসিএস", "options": {"ক": "have had escaped", "খ": "had escaped", "গ": "are escaping", "ঘ": "have been escaping"}, "answerKey": "খ", "answerText": "had escaped", "explanation_bn": "Who দ্বারা দুটি clause যুক্ত হয়েছে। প্রথম clause টিতে যেহেতু past tense (was conducted) ব্যবহৃত হয়েছে কাজেই অপর clause টিতেও past tense ব্যবহার করা আবশ্যক। আলোচ্য ক্ষেত্রে escaped/had escaped ব্যবহার করা যায়। অপশন গুলোর মধ্যে শুধু had escaped-ই past tense। have had escaped, are escaping এবং have been escaping Verb গুলো present tense-এ থাকায় এগুলোর ব্যবহার এখানে প্রযোজ্য নয়।"}, {"id": "EL-0390", "page": 51, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "47", "question": "The speaker failed to make the audience ___ to him patiently. Which of the following is the correct verb form in the blank above?", "source_tag": "১৫তম বিসিএস", "options": {"ক": "to listen", "খ": "listening", "গ": "listened", "ঘ": "listen"}, "answerKey": "ঘ", "answerText": "listen", "explanation_bn": "কর্তা যখন নিজে কাজ না করে যখন অন্য কাউকে দিয়ে কোনো কাজ করায় তখন সেই Sentence-টির Verb-কে বলা হয় Causative Verb (প্রযোজক ক্রিয়া)। Causative Verb গুলো হলো: Make, Let, Have, Get, Help ইত্যাদি। Structure: Help/make + someone (ব্যক্তি) + verb1. যেমন: The speaker failed to make the audience listen to him patiently. Structure: Have /get/make + something (বস্তু)+ verb3. যেমন: I made my car repaired."}, {"id": "EL-0391", "page": 51, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "48", "question": "How many eggs have your hens ___ this month? -Which of the following words best completes the above sentence?", "source_tag": "১৪তম বিসিএস", "options": {"ক": "lain", "খ": "laid", "গ": "lay", "ঘ": "lied"}, "answerKey": "খ", "answerText": "laid", "explanation_bn": "Lay অর্থ ডিম পাড়া / কোনো কিছু নিচে রাখা। এটি একটি transitive verb যার পরে object বসে। অন্যদিকে, lie অর্থ আনুভূমিক অবস্থানে থাকা বা আনুভূমিক অবস্থানে কল্পনা করা বা মিথ্যা বলা বা শুয়ে পড়া। এটি একটি intransitive verb যার পর object বসে না। Have এর পর verb এর past participle হয়। আর যেহেতু কর্তা মুরগি, কাজেই বিষয়টি ডিম পাড়ার সাথে সম্পৃক্ত। সুতরাং এখানে lay-এর past participle form 'laid' হবে।", "explanation_table": [["Word", "Past form", "Past participle", "Present participle/Gerund"], ["Lay", "Laid", "Laid", "Laying"], ["Lie", "Lay", "lain", "lying"]]}, {"id": "EL-0392", "page": 51, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "49", "question": "Do not worry, English grammar is not- to understand. Which of the following best fits in the blank space?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "so difficult", "খ": "very difficult", "গ": "too difficult", "ঘ": "difficult enough"}, "answerKey": "গ", "answerText": "too difficult", "explanation_bn": ""}, {"id": "EL-0393", "page": 51, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "50", "question": "The boy from the village said, \"I ___ starve than beg.\"-Which of the following best completes the above sentence?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "better", "খ": "rather", "গ": "would rather", "ঘ": "would better"}, "answerKey": "গ", "answerText": "would rather", "explanation_bn": "Had better, Had rather, Would better, Would rather ইত্যাদির পর Verb-টির Base form হয়। যেমন: I would rather starve than beg (আমি বরং না খেয়ে থাকবো, তবুও ভিক্ষা করবো না)। শূন্যস্থানে would rather বসবে। শূন্যস্থানে Better/rather/would better-এর ব্যবহার অর্থপূর্ণ নয়।"}, {"id": "EL-0394", "page": 51, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "51", "question": "We (not have) a holiday since the beginning of the year. -which of the following verb forms best completes the above sentence?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "did not have", "খ": "have not had", "গ": "are not having", "ঘ": "had not had"}, "answerKey": "খ", "answerText": "have not had", "explanation_bn": "কোনো কাজ পূর্ব হতে আরম্ভ হয়ে বর্তমান সময় পর্যন্ত চলে আসছে বুঝালে এবং Sentence এর মধ্যে নির্দিষ্ট সময় যাবৎ(ধরে), হতে, থেকে অর্থে for বা since থাকলে Present Perfect Continuous Tense হয়। কিন্তু কিছু কিছু Word আছে যেগুলোর কোনো continuous form নেই। যেমন: Have, believe, imagine, know, think, like, love, prefer, want, wish, appear, feel, hear, look, see, seem, smell, taste, belong, weigh. এক্ষেত্রে, Present/Past/Future perfect continuous এর পরিবর্তে present/past/future perfect tense এবং present/past/future continuous এর পরিবর্তে present/past/future indefinite tense হবে। উক্ত প্রশ্নে since the beginning of the year থাকায় Present perfect continuous Tense হওয়ার কথা। কিন্তু এখানে মূল Verb 'have' হওয়ায় Present perfect continuous Tense না হয়ে Present perfect হবে। অর্থাৎ, have not had উত্তর হবে।"}, {"id": "EL-0395", "page": 51, "chapter": "Chapter 03: Corrections", "topic": "3.3 Right From of Verbs", "qno": "52", "question": "It's time (you realize) your mistakes. Which of the following clause best fits in the above sentence?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "you realized", "খ": "that you realize", "গ": "you would realize", "ঘ": "you have realized"}, "answerKey": "ক", "answerText": "you realized", "explanation_bn": ""}, {"id": "EL-0396", "page": 52, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "01", "question": "Identify the compound sentence:", "source_tag": "৫০তম বিসিএস", "options": {"ক": "Either you do it or you will be fined", "খ": "Unless you do it, you will be fined", "গ": "Do it or I shall fine you", "ঘ": "You have to do it, otherwise I will fine you"}, "answerKey": null, "answerText": "Blank (no option marked)", "flag": "⚠ Source shows answer as 'Blank' — no option marked in the original.", "explanation_bn": "Compound Sentence-এ দুই বা ততোধিক Principal clause বা Co-ordinating clause থাকে। এতে Subordinate clause থাকতে পারে, নাও থাকতে পারে। Compound Sentence সাধারণত and, but, or, as well as, either……or, neither…….nor, not only……but also ইত্যাদি Co-ordinating conjunction দ্বারা যুক্ত হয়। প্রদত্ত option গুলোর মধ্যে- (ক)তে দুটি principal clause রয়েছে যা co-ordinate conjunction \"Either….or\" দ্বারা যুক্ত। option (গ)তে দুটি Principal clause এবং Co-ordinate conjunction or দ্বারা যুক্ত। option (ঘ)তে দুটি Principal clause এবং co-ordinate clause otherwise দ্বারা যুক্ত হয়েছে। Option (ক), (গ) ও (ঘ) তিনটিই compound sentence। এবং তিনটিকেই সঠিক বিবেচনা করা যেতে পারে।"}, {"id": "EL-0397", "page": 52, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "02", "question": "What type of sentence is 'Do or die.'", "source_tag": "৪৮তম বিসিএস (স্বাস্থ্য)", "options": {"ক": "Complex", "খ": "Simple", "গ": "Compound", "ঘ": "Exclamatory"}, "answerKey": "গ", "answerText": "Compound", "explanation_bn": "Compound sentence এ দুটি বা ততোধিক independent clause থাকে, এবং সেগুলো coordinating conjunction (and, or, but) দিয়ে যুক্ত থাকে। Do or die একটি compound sentence. এখানে দুটি imperative clauses (আদেশসূচক বাক্য) রয়েছে: Do (কাজ করো), Die (মরো), এই দুটি বাক্য coordinating conjunction 'or' দ্বারা যুক্ত হয়েছে।"}, {"id": "EL-0398", "page": 52, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "03", "question": "'Five years have passed since his father died'. Identify the correct simple form of the sentence from the following options:", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "His father has died five years ago.", "খ": "His father died five years ago.", "গ": "His father has died for five years.", "ঘ": "His father died since five years."}, "answerKey": "খ", "answerText": "His father died five years ago.", "explanation_bn": "বাক্যটিকে একটি simple sentence এ পরিণত করতে, প্রদত্ত বাক্যটির 'Five years have passed since' অংশটি বাদ দিয়ে শুধুমাত্র প্রধান ঘটনা এবং সময় উল্লেখ করতে হয়। এখানে প্রধান ঘটনা হলো 'his father died' এবং সময় হলো 'five years ago'. সঠিক simple sentence হবে- His father died five years ago।"}, {"id": "EL-0399", "page": 52, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "04", "question": "Which of the following is a correct simple sentence?", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "All that glitters is not gold", "খ": "All's well that ends well", "গ": "Do or die", "ঘ": "I saw an old man walking past me"}, "answerKey": "ঘ", "answerText": "I saw an old man walking past me.", "explanation_bn": "একটি মাত্র subject এবং একটি মাত্র finite verb নিয়ে গঠিত sentence কে simple sentence বলে। এই বাক্যে \"I saw an old man walking past me,\" subject (I) এবং একটি verb (saw) নিয়ে গঠিত হয়ে পূর্ণাঙ্গ অর্থ প্রকাশ করছে। অপশন (ক) ও (খ) এর Sentence দুইটি complex sentence এবং অপশন (গ) এর sentence-টি compound sentence।"}, {"id": "EL-0400", "page": 52, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "05", "question": "Which is the correct complex form of the sentence? 'A corrupt man cannot win the respect of others'.", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "A man who is corrupt cannot respect others.", "খ": "A man does not respect others who are corrupt.", "গ": "A man who is corrupt cannot win the respect of others.", "ঘ": "A man who can win the respect of others cannot be corrupt."}, "answerKey": "গ", "answerText": "A man who is corrupt cannot win the respect of others.", "explanation_bn": "Sentence transformation-এ সবসময় মূল sentence-এর অর্থ ঠিক রেখে এক sentence থেকে অন্য sentence-এ রূপান্তর করা হয়। মূল Subject-এর সাথে Adjective বা Participle যুক্ত simple sentence- কে complex করতে হলে Adjective বা participle যুক্ত Subject-টিকে subordinate clause-এ রূপান্তরিত করতে হয় এবং বাকি অংশ main clause হিসেবে অপরিবর্তিত থাকে। এখানে 'A corrupt man-কে subordinate clause-এ পরিণত করলে হবে A man who is corrupt এবং এরপর principal clause বসিয়ে complex sentence তৈরি করা যায়। যেমন: A man who is corrupt cannot win the respect of others."}, {"id": "EL-0401", "page": 53, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "06", "question": "Identify the imperative sentence:", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "Shut up!", "খ": "Shahin is playing football.", "গ": "I shall cook dinner now.", "ঘ": "What is your name?"}, "answerKey": "ক", "answerText": "Shut up!", "explanation_bn": "Imperative Sentence দ্বারা আদেশ, অনুরোধ, নির্দেশনা, নিষেধ কিংবা উপদেশ প্রকাশ করা হয়। এখানে নিষেধ অর্থে Shut up! বাক্যটি Imperative. অপশন (খ) ও (গ) -এ assertive sentence এবং অপশন (ঘ)-এ interrogative sentence।"}, {"id": "EL-0402", "page": 53, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "07", "question": "'Walk fast lest you should miss the train'. This is a-", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "Simple sentence", "খ": "Compound sentence", "গ": "Complex sentence", "ঘ": "Interrogative sentence"}, "answerKey": "গ", "answerText": "Complex sentence", "explanation_bn": "Lest, provided that, if, whether, which, what, who, whom, that, whose, unless, until, though, although, while, ইত্যাদি subordinating conjunction গুলো complex sentence এ ব্যবহৃত হয়। complex sentence-এ একটি principal clause এবং এক বা একাধিক subordinate clause থাকে। এখানে, 'Walk fast lest you should miss the train' sentence-টি একটি complex sentence।"}, {"id": "EL-0403", "page": 53, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "08", "question": "'We must not be late, else we will miss the train.' This is a-", "source_tag": "৪০তম বিসিএস", "options": {"ক": "compound sentence", "খ": "complex sentence", "গ": "simple sentence", "ঘ": "interrogative sentence"}, "answerKey": "ক", "answerText": "compound sentence", "explanation_bn": "একের অধিক Principle clause যদি And, or, but, yet, else, therefore, otherwise ইত্যাদি co-ordinating conjunction দ্বারা যুক্ত হয় তাকে Compound sentence বলে। We must not be late এবং we will miss the train. Clause দুইটি 'else' conjunction দ্বারা যুক্ত হওয়ায় 'বাক্যটি compound sentence।"}, {"id": "EL-0404", "page": 53, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "09", "question": "Select the right compound structure of the sentence: \"Though he is poor, he is honest\".", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "He is poor and honest", "খ": "As he is poor, he is honest", "গ": "He is poor but honest", "ঘ": "Since he is poor, he is honest"}, "answerKey": "গ", "answerText": "He is poor but honest.", "explanation_bn": "দুইটি clause-এর বিপরীতমুখী অর্থ বুঝাতে complex sentence-এ Though বা although এবং compound sentence-এ but ব্যবহৃত হয়। এক্ষেত্রে Complex sentence-থেকে compound-এ রূপান্তরের নিয়ম: subject + verb + object / others + but + subject + verb + object / others. যেমন: Complex: Though he works hard, He cannot succeed. Compound: He works hard but cannot succeed. Complex sentence-এ দুটি clause-এ একই Subject + Verb থাকলে compound sentence-এ but-এর পরে Subject + Verb এর repetition হবে না। যেমন: Complex: Though he is poor, he is honest. Compound: He is poor but honest।"}, {"id": "EL-0405", "page": 53, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "10", "question": "Complete the following sentence choosing the appropriate option: It's raining cats and dogs, so-", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "Watch out for falling animals.", "খ": "Make sure you take an umbrella.", "গ": "Keep your pets inside.", "ঘ": "Keep the windows open."}, "answerKey": "খ", "answerText": "Make sure you take an umbrella.", "explanation_bn": "এখানে গঠনগতভাবে চারটি option দিয়ে বাক্য সম্পন্ন হয়। কিন্তু sentence এর context অনুযায়ী অপশন (খ) অধিক Appropriate. কারণ, বৃষ্টি হলে অত্যাবশ্যকীয় অনুষঙ্গ হিসেবে ছাতা দরকার। অতএব, It's raining cats and dogs, so make sure you take an umbrella।"}, {"id": "EL-0406", "page": 53, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "11", "question": "\"A rolling stone gathers no moss\" The complex form of the sentence is-", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "Since a stone is rolling, it gathers no moss.", "খ": "Though a stone rolls, it gathers no moss.", "গ": "A stone what rolls gathers no moss.", "ঘ": "A stone that rolls gathers no moss."}, "answerKey": "ঘ", "answerText": "A stone that rolls gathers no moss.", "explanation_bn": "মূল Subject-এর সাথে Adjective বা Participle যুক্ত simple sentence- কে complex করতে হলে Adjective বা participle যুক্ত Subject-টিকে subordinate clause-এ রূপান্তরিত করতে হয় এবং বাকি অংশ main clause হিসেবে অপরিবর্তিত থাকে। প্রদত্ত বাক্যে 'a rolling stone' এর subordinate clause হলো 'A stone which/that rolls'।"}, {"id": "EL-0407", "page": 54, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "12", "question": "In English grammar, ___ deals with formation of sentences.", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "Morphology", "খ": "Etymology", "গ": "Syntax", "ঘ": "Semantics"}, "answerKey": "গ", "answerText": "Syntax", "explanation_bn": "অপশনের সবগুলো শব্দ Linguistics বা ভাষাবিজ্ঞানের আলোচ্য বিষয়। Syntax- দ্বারা phrase, clause ও sentence- এর শব্দবিন্যাস; বাক্যগঠন ও বাক্যের অংশগুলোর সম্পর্ক অধ্যয়ন বুঝায়। Morphology শব্দের গঠন নিয়ে। Etymology-শব্দের উৎপত্তি ও ইতিহাস নিয়ে, এবং Semantics- শব্দ ও বাক্যের অর্থ নিয়ে আলোচনা করে।"}, {"id": "EL-0408", "page": 54, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "13", "question": "Fill in the blank of the following sentence with the right form of verb. If I ___ a king!", "source_tag": "৩৪তম বিসিএস", "options": {"ক": "am", "খ": "was", "গ": "were", "ঘ": "shall be"}, "answerKey": "গ", "answerText": "were", "explanation_bn": "Unreal past বা অবাস্তব অতীত কল্পনার ক্ষেত্রে If + subject + were হয়।"}, {"id": "EL-0409", "page": 54, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "14", "question": "Identify the imperative sentence.", "source_tag": "২৭তম বিসিএস", "options": {"ক": "I shall go to college", "খ": "Matin is singing a song", "গ": "Stand up", "ঘ": "It has been raining since morning"}, "answerKey": "গ", "answerText": "Stand up.", "explanation_bn": ""}, {"id": "EL-0410", "page": 54, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "15", "question": "According to the conditions of my scholarship, after finishing my degree-", "source_tag": "২০তম বিসিএস", "options": {"ক": "my education will be employed the University", "খ": "employment will be given to me by the University", "গ": "the University will employ me", "ঘ": "I will be employed of the University"}, "answerKey": "গ", "answerText": "the University will employ me", "explanation_bn": "এখানে মূল Sentence এ Subject অনুপস্থিত কাজেই gap এ প্রদত্ত clause এর subject থাকতে হবে। Sentence এর গঠন ও অর্থানুযায়ী the University will employ me যথার্থ। অপশন (ক) my education will be employed the University অর্থপূর্ণ নয়। আমাকে বিশ্ববিদ্যালয় কর্তৃক নিযুক্ত করা হবে-এই অর্থে I will be employed by the University ব্যবহৃত হবে।"}, {"id": "EL-0411", "page": 54, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "16", "question": "'May Allah help you' What kind of sentence is this?", "source_tag": "১১তম বিসিএস", "options": {"ক": "Optative", "খ": "Imperative", "গ": "Assertive", "ঘ": "Exclamatory"}, "answerKey": "ক", "answerText": "Optative", "explanation_bn": "যে sentence দ্বারা মনের ইচ্ছা বা প্রার্থনা করা বুঝায় তাকে optative sentence বলে।"}, {"id": "EL-0412", "page": 54, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.1 Types of Sentences", "qno": "17", "question": "'Syntax' means-", "source_tag": "১১তম বিসিএস", "options": {"ক": "Manner of speech", "খ": "Sentence building", "গ": "Supplementary tax", "ঘ": "Synchrounizing act"}, "answerKey": "খ", "answerText": "Sentence building", "explanation_bn": ""}, {"id": "EL-0413", "page": 54, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "01", "question": "This could have worked if I ___ been more far-sighted.", "source_tag": "৪৫তম, ৩৫তম বিসিএস", "options": {"ক": "have", "খ": "had", "গ": "might", "ঘ": "would"}, "answerKey": "খ", "answerText": "had", "explanation_bn": "Conditional Sentence এ dependent clause-এ Had+Sub+V3 +……. অথবা, If + Subject + had + V3 + ……. হলে, Independent clause-এ Subject+ Would / Could/ might + have+ V3 …. হবে। একে Third conditional বলে। যেমন: This could have worked if I had been more far-sighted. অথবা, If I had known you were coming, I would have gone to the station অথবা, What would have happened if the bridge had broken. উল্লেখ্য, Principal clause-টি Active voice-এ থাকলে had + V3 এবং passive voice-এ থাকলে had been + V3 হবে।"}, {"id": "EL-0414", "page": 54, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "02", "question": "Complete the sentence: If I were you, I ___ take the money:", "source_tag": "৪২তম বিসিএস", "options": {"ক": "shall", "খ": "will", "গ": "would", "ঘ": "may"}, "answerKey": "গ", "answerText": "would", "explanation_bn": "Second Conditional sentence- এ If যুক্ত Clause-টি past indefinite হলে main clause-টি subject + would/could/might + verb এর base form হবে।"}, {"id": "EL-0415", "page": 54, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "03", "question": "Complete the following sentence: 'Had I known you were waiting outsides, I ___.'", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "had invited you to come in", "খ": "would invite you to come in", "গ": "would be inviting you to come in", "ঘ": "would have invited you to come in"}, "answerKey": "ঘ", "answerText": "would have invited you to come in.", "explanation_bn": ""}, {"id": "EL-0416", "page": 54, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "08", "flag": "⚠ Source numbering jumps 03→08 on this page, preserved as printed.", "question": "Fill in the gap with the right tense: When water ___ it turns into ice.", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "will freeze", "খ": "freezes", "গ": "would freeze", "ঘ": "froze"}, "answerKey": "খ", "answerText": "freezes", "explanation_bn": "চিরন্তন সত্য/বৈজ্ঞানিক গবেষণার ফলাফল/প্রাত্যহিক অভ্যাসগত কাজ বুঝাতে এবং আদেশ/উপদেশ/অনুরোধ বুঝাতে Complex sentence-এ Zero conditional ব্যবহৃত হয়। এক্ষেত্রে দুটো clause-ই present indefinite বা past indefinite tense-এ অর্থাৎ দুটো clause-ই হয় present indefinite অথবা past indefinite tense। যেমন: When/If water freezes, it turns into ice।"}, {"id": "EL-0417", "page": 55, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "05", "question": "This could have worked if I ___ been more cautious.", "source_tag": "৩৬তম বিসিএস", "options": {"ক": "had", "খ": "have", "গ": "might", "ঘ": "would"}, "answerKey": "ক", "answerText": "had", "explanation_bn": ""}, {"id": "EL-0418", "page": 55, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "06", "question": "What would have happened if ___?", "source_tag": "২৭তম বিসিএস", "options": {"ক": "The bridge is broken", "খ": "The bridge would break", "গ": "The bridge had broken", "ঘ": "The bridge had been broken"}, "answerKey": "গ", "answerText": "The bridge had broken.", "explanation_bn": ""}, {"id": "EL-0419", "page": 55, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "07", "question": "Fill in the blank with the correct phrase: He ___ arrested if he had tried to leave the country.", "source_tag": "২৬তম বিসিএস", "options": {"ক": "would", "খ": "could be", "গ": "would have been", "ঘ": "must be"}, "answerKey": "গ", "answerText": "would have been", "explanation_bn": ""}, {"id": "EL-0420", "page": 55, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "08b", "question": "Shaheen would never have taken the job if ___ what great demand it would make on his time.", "source_tag": "২৫তম বিসিএস", "options": {"ক": "he knew", "খ": "he had been knowing", "গ": "he had known", "ঘ": "he was knowing"}, "answerKey": "গ", "answerText": "he had known", "explanation_bn": ""}, {"id": "EL-0421", "page": 55, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "09b", "question": "Complete the following sentence. If I had known you were coming ___.", "source_tag": "২৩তম বিসিএস", "options": {"ক": "I would go the station", "খ": "I had gone to the station", "গ": "I would have gone to the station", "ঘ": "I would be going to the station"}, "answerKey": "গ", "answerText": "I would have gone to the station.", "explanation_bn": ""}, {"id": "EL-0422", "page": 55, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "10", "question": "If a ruby is heated it ___ temporarily loose its color.", "source_tag": "১৮তম বিসিএস", "options": {"ক": "would", "খ": "will", "গ": "does", "ঘ": "has"}, "answerKey": "খ", "answerText": "will", "explanation_bn": "1st conditional sentence এ if/when যুক্ত clause-টি present indefinite tense হলে পরবর্তী অংশ future indefinite tense হবে।"}, {"id": "EL-0423", "page": 55, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "11", "question": "If I were you, I (handle) the situation more carefully. -Which of the following verb forms best completes the above sentence?", "source_tag": "১৩তম বিসিএস", "options": {"ক": "would handle", "খ": "will handle", "গ": "handle", "ঘ": "would have handled"}, "answerKey": "ক", "answerText": "would handle", "explanation_bn": ""}, {"id": "EL-0424", "page": 55, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.2 Conditional Sentences", "qno": "12", "question": "Choose the correct alternative to complete the sentence: 'He ___ to see us if he had been able to.'", "source_tag": "১০তম বিসিএস", "options": {"ক": "would come", "খ": "would have come", "গ": "may have come", "ঘ": "may come"}, "answerKey": "খ", "answerText": "would have come", "explanation_bn": ""}, {"id": "EL-0425", "page": 55, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "01", "question": "'The villagers believed that he was an honest leader.' Passive form of this sentence is:", "source_tag": "৫০তম বিসিএস", "options": {"ক": "He was believed to be an honest leader", "খ": "He was believed to have been an honest leader", "গ": "He has been believed to be an honest leader", "ঘ": "He was believed he was an honest leader"}, "answerKey": "ক", "answerText": "He was believed to be an honest leader.", "explanation_bn": "Active- \"The villagers believed (that) he was…\" এর Passive-এ সাধারণ রূপ: He was believed + to be + complement, এক্ষেত্রে যা: He was believed to be an honest leader. অন্য option গুলো: (খ) \"to have been\" ব্যবহৃত হতো, যদি Active form-এ He had been an honest leader থাকেতা। (গ) \"has been believed\" (present perfect passive) — এক্ষেত্রে tense এর অসঙ্গতি রয়েছে। (ঘ) \"He was believed he was…\" গঠনগতভাবে ভুল।"}, {"id": "EL-0426", "page": 55, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "02", "question": "Identify the correct passive form, \"People thought that the despot was corrupt\"", "source_tag": "৪৯তম বিসিএস (শিক্ষা)", "options": {"ক": "The despot had been thought to be corrupt", "খ": "It was thought that the despot was corrupt", "গ": "The despot was thought to be corrupt", "ঘ": "The despot is thought to be corrupt"}, "answerKey": "খ ও গ", "answerText": "খ ও গ (both খ and গ)", "explanation_bn": "That clause-যুক্ত Complex Sentence কে দুই ভাবে Passive voice-এ পরিণত করা যায়। Structure 1: It + passive verb + that clause. Impersonal passive: এখানে কর্তা সরাসরি উল্লেখ করা হয় না। Dummy subject হিসেবে it দিয়ে বাক্য শুরু করতে হয়। Act: People thought that the despot was corrupt. Pass: It was thought that the despot was corrupt. Structure-2: Subject (that clause এর) + Main clause-টির verb-এর Passive + that clause-টির verb-এর infinitive (to+v1) + direct object. Act: People thought that the despot was corrupt. Pass: The despot was thought to be corrupt."}, {"id": "EL-0427", "page": 55, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "03", "question": "Identify the correct passive form: 'I heard her sing.'", "source_tag": "৪৭তম বিসিএস", "options": {"ক": "She was heard sing by me.", "খ": "She was heard to be sung by me.", "গ": "She was heard sung by me.", "ঘ": "She was heard to sing by me."}, "answerKey": "ঘ", "answerText": "She was heard to sing by me.", "explanation_bn": "সাধারণত Need, watch, dare, make, hear প্রভৃতি verb এর পর Active voice এ to উহ্য থাকে। তবে Passive করার সময়ে এই verb গুলোর পরে to বসে। তাই সঠিক Passive voice হবে। 'She was heard to sing by me'।"}, {"id": "EL-0428", "page": 56, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "04", "question": "Identify the passive form of the following sentence: Who has broken this jug?", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "By whom has this jug been broken?", "খ": "By whom has this jug broken?", "গ": "By whom this jug has been broken?", "ঘ": "Whom has this jug been broken?"}, "answerKey": "ক", "answerText": "By whom has this jug been broken?", "explanation_bn": "Who যুক্ত Interrogative sentence কে Active voice থেকে Passive voice করার নিয়ম: By whom + tense ও person অনুযায়ী auxiliary verb + object-এর subject form + tense অনুযায়ী কখনও কখনও be / being / been + V3 + ? যেমন: Act: Who has broken this jug? Pass: By whom has this jug been broken?"}, {"id": "EL-0429", "page": 56, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "05", "question": "She played on the flute. Passive form is-", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "The flute was played by her.", "খ": "The flute was played on by her.", "গ": "The flute was played to her.", "ঘ": "The flute was being played by her."}, "answerKey": "খ", "answerText": "The flute was played on by her.", "explanation_bn": "Past indefinite tense বিশিষ্ট Active voice কে Passive voice করার নিয়ম: Object এর subject form + tense ও Person অনুযায়ী Auxiliary verb (was, were) + মূল verb-এর past participle + by + subject এর object form। যেমন: Act: She played on the flute. Pass: The flute was played on by her. উল্লেখ্য, Play on একটি group verb হওয়ায় তার সাথে সংযুক্ত preposition 'on' passive voice-এ past participle form এর সাথে বসেছে।"}, {"id": "EL-0430", "page": 56, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "06", "question": "Find out the active form of the sentence: By whom can our country be saved?", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "Who can save our country?", "খ": "Our country has been saved by who?", "গ": "Who save our country?", "ঘ": "Who will save our country?"}, "answerKey": "ক", "answerText": "Who can save our country?", "explanation_bn": "By whom যুক্ত Passive voice কে Active voice করার নিয়ম: By whom এর পরিবর্তে who + tense অনুযায়ী Auxiliary verb (যদি প্রয়োজন হয়) + tense অনুযায়ী মূল verb + Extension. সুতরাং, Who can save our country? উত্তরটি সঠিক।"}, {"id": "EL-0431", "page": 56, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "07", "question": "Identify the correct passive form: \"Do not close the door.\"", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "Let not the door close.", "খ": "Let not the door be closed.", "গ": "Let the door not close.", "ঘ": "Let not door closed."}, "answerKey": "খ", "answerText": "Let not the door be closed.", "explanation_bn": "'Do not close the door' sentence টি imperative sentence. Do not যুক্ত imperative sentence-কে Active voice হতে passive voice করার নিয়ম: Let not + object + be + মূল verb-এর past participle form. সুতরাং, Let not the door be closed উত্তরটি সঠিক।"}, {"id": "EL-0432", "page": 56, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "08b", "question": "Change the voice: 'Nobody trusts a traitor.'", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "A traitor is trusted.", "খ": "A traitor should not be trusted.", "গ": "Everybody hates a traitor.", "ঘ": "A traitor is not trusted by anybody."}, "answerKey": "ঘ", "answerText": "A traitor is not trusted by anybody.", "explanation_bn": "Present indefinite tense বিশিষ্ট Active voice কে Passive voice করার নিয়ম: Object এর subject form + number ও person অনুযায়ী Auxiliary verb (am, is, are) + V3 + by + object এর subject form. সুতরাং A traitor is not trusted by anybody উত্তরটি সঠিক। এখানে, বাক্যটি negative অর্থ প্রকাশ করায় Auxiliary verb হিসেবে is not বসেছে।"}, {"id": "EL-0433", "page": 56, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "09b", "question": "Find out the correct passive form of the sentence 'Who taught you French?'", "source_tag": "৪১তম বিসিএস", "options": {"ক": "By whom you were taught French?", "খ": "By whom French was taught you?", "গ": "French was taught you by whom?", "ঘ": "By whom were you taught French?"}, "answerKey": "ঘ", "answerText": "By whom were you taught French?", "explanation_bn": ""}, {"id": "EL-0434", "page": 56, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "10", "question": "Change the voice: 'Who is calling me?'", "source_tag": "৪০তম বিসিএস", "options": {"ক": "By whom am I called?", "খ": "By whom I am called?", "গ": "By whom am I being called?", "ঘ": "Whom am I called by?"}, "answerKey": "গ", "answerText": "By whom am I being called?", "explanation_bn": ""}, {"id": "EL-0435", "page": 56, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "11", "question": "Identify the correct passive form of the sentence below: 'Do you know them?'", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "Are they known by you?", "খ": "Would they be known by you?", "গ": "Are they known with you?", "ঘ": "Are they known to you?"}, "answerKey": "ঘ", "answerText": "Are they known to you?", "explanation_bn": "Present indefinite tense বিশিষ্ট interrogative sentence কে Active voice হতে Passive voice করার নিয়ম: Number ও person অনুযায়ী Auxiliary verb (am, is, are) + object-এর subject form + V3 + preposition (by অথবা অন্য) + subject-এর object form। সুতরাং 'Are they known to you?' উত্তরটি সঠিক। উল্লেখ্য, কিছু কিছু Verb-এর ক্ষেত্রে passive voice-এ by-এর পরিবর্তে অন্য কোনো preposition ব্যবহৃত হয়। যেমন: known to, annoyed with, marveled at, embodied in, surprised at, contained in, shocked at, seized with, satisfied with ইত্যাদি।"}, {"id": "EL-0436", "page": 57, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "12", "question": "Identify the right passive voice of 'It is impossible to do this'.", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "Doing this is impossible", "খ": "This is impossible to be done", "গ": "This is must be done", "ঘ": "This can't be done"}, "answerKey": "খ", "answerText": "This is impossible to be done.", "explanation_bn": "It is + adjective + infinitive + noun / pronoun যুক্ত বাক্যকে Passive voice করার নিয়ম: Noun/pronoun + be verb + adjective + to be + verb-এর past participle. সুতরাং, This is impossible to be done উত্তরটি সঠিক।"}, {"id": "EL-0437", "page": 57, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "13", "question": "\"Who planted this tree here\"? The correct passive voice of this sentence is-", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "By whom the tree was planted here?", "খ": "Who the tree had been planted hereby?", "গ": "The tree was planted here by whom", "ঘ": "By whom had the tree been planted here?"}, "answerKey": null, "answerText": "Blank (no option marked)", "flag": "⚠ Source shows answer as 'Blank' — no option marked in the original.", "explanation_bn": "অপশনে সঠিক উত্তর নেই, সঠিক উত্তর হবে-By whom was this tree planted here?"}, {"id": "EL-0438", "page": 57, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "14", "question": "The correct passive form of \"You must shut these doors\" is-", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "These must be shut doors", "খ": "Shut the doors you must", "গ": "Shut must be the doors", "ঘ": "These doors must be shut"}, "answerKey": "ঘ", "answerText": "These doors must be shut.", "explanation_bn": "Model auxiliary verb যুক্ত Active voice কে Passive voice করার নিয়ম: object এর subject form + model auxiliary + be + V3 + extension. সুতরাং, These doors must be shut উত্তরটি সঠিক।"}, {"id": "EL-0439", "page": 57, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "15", "question": "'I know him'. (Make it passive)", "source_tag": "৩০তম বিসিএস", "options": {"ক": "He is known by me.", "খ": "He was known to me.", "গ": "He has been known by me.", "ঘ": "He is known to me."}, "answerKey": "ঘ", "answerText": "He is known to me.", "explanation_bn": ""}, {"id": "EL-0440", "page": 57, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "16", "question": "A lion may be helped even by a little mouse. (Make it active)", "source_tag": "৩০তম বিসিএস", "options": {"ক": "A little mouse may even help a lion.", "খ": "Even a little mouse may help a lion.", "গ": "A little mouse can even help a lion.", "ঘ": "Even a little mouse ought to help a lion."}, "answerKey": "খ", "answerText": "Even a little mouse may help a lion.", "explanation_bn": "Modal auxiliary যুক্ত Passive voice কে Active voice-এ রূপান্তরের নিয়ম: Object এর subject form + modal Auxiliary + V1 + subject এর object form. সুতরাং, Even a little mouse may help a lion উত্তরটি সঠিক। Passive বাক্যে 'even' শব্দটি a little mouse-এর পাশে বসায় Active বাক্যেও 'even' শব্দটি 'a little mouse'-এর পাশে বসবে।"}, {"id": "EL-0441", "page": 57, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "17", "question": "Give the correct passive form of 'My teacher embodies all the good qualities'.", "source_tag": "২৭তম বিসিএস", "options": {"ক": "All the good qualities are embodied by my teacher.", "খ": "All the good qualities are embodied in my teacher.", "গ": "All the good qualities are embodied to my teacher.", "ঘ": "All the good qualities are embodied on my teacher."}, "answerKey": "খ", "answerText": "All the good qualities are embodied in my teacher.", "explanation_bn": "Active voice-এ contain, embody, include, subsume প্রভৃতি থাকলে সেগুলোর Passive করার সময় V3 এর পরে by এর পরিবর্তে in বসে। Voice change এর অন্যান্য নিয়ম অপরিবর্তিত থাকবে। সুতরাং, All the good qualities are embodied in my teacher উত্তরটি সঠিক।"}, {"id": "EL-0442", "page": 57, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "18", "question": "Choose the correct form (passive) of- 'Who will do the work?'", "source_tag": "২৬তম বিসিএস", "options": {"ক": "Who will be done the work?", "খ": "Who will done the work?", "গ": "By whom will the work be done?", "ঘ": "Whom will the work be done?"}, "answerKey": "গ", "answerText": "By whom will the work be done?", "explanation_bn": ""}, {"id": "EL-0443", "page": 57, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "19", "question": "Identify the correct passive form of \"He is going to open a shop.\"", "source_tag": "২৬তম বিসিএস", "options": {"ক": "He is being gone to open a shop.", "খ": "A shop is being gone opened by him.", "গ": "A shop will be opened by him.", "ঘ": "A shop is going to be opened by him."}, "answerKey": "ঘ", "answerText": "A shop is going to be opened by him.", "explanation_bn": "am going to / is going to / are going to যুক্ত Active voice কে Passive voice করার নিয়ম: Object এর subject form + am/is/are + going to + be + V3 + by + subject- এর object form। সুতরাং, A shop is going to be opened by him উত্তরটি সঠিক।"}, {"id": "EL-0444", "page": 57, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "20", "question": "Identify the correct passive form- \"Open the window\".", "source_tag": "২৩তম বিসিএস", "options": {"ক": "The window should be opened.", "খ": "Let the window be opened.", "গ": "Let the window be opened by you.", "ঘ": "The window must be opened."}, "answerKey": "খ", "answerText": "Let the window be opened.", "explanation_bn": ""}, {"id": "EL-0445", "page": 58, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "21", "question": "The passive form of the sentence 'Some children were helping the wounded man.'-", "source_tag": "২০তম বিসিএস", "options": {"ক": "The wounded man was helped by some children", "খ": "The wounded man was helping by some children", "গ": "The wounded man was being helped by some children", "ঘ": "The wounded man was to be helped by some children"}, "answerKey": "গ", "answerText": "The wounded man was being helped by some children.", "explanation_bn": "Past continuous tense বিশিষ্ট Active voice কে Passive voice করার নিয়ম: object এর subject form + was being / were being + V3 + by + subject-এর object form। সুতরাং, 'the wounded man was being helped by some children' উত্তরটি সঠিক। Wounded man third person singular number হওয়ায় was being ব্যবহৃত হয়েছে।"}, {"id": "EL-0446", "page": 58, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "22", "question": "The best passive form of the sentence: 'We don't like idle people'", "source_tag": "১৭তম বিসিএস", "options": {"ক": "We are not liked by idle people", "খ": "Idle people are not like us", "গ": "Idle people are not liked by us", "ঘ": "Idle people are not of our liking"}, "answerKey": "গ", "answerText": "Idle people are not liked by us.", "explanation_bn": ""}, {"id": "EL-0447", "page": 58, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "23", "question": "The correct passive of 'Sheila was writing a letter' is-", "source_tag": "১৬তম বিসিএস", "options": {"ক": "A letter was writing by Sheila", "খ": "A letter was being writing by Sheila", "গ": "A letter was being written by Sheila", "ঘ": "A letter was been written by Sheila"}, "answerKey": "গ", "answerText": "A letter was being written by Sheila.", "explanation_bn": ""}, {"id": "EL-0448", "page": 58, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.3 Voice", "qno": "24", "question": "People always remember patriots. Which of the following is the best passive form of the above sentence?", "source_tag": "১৫তম বিসিএস", "options": {"ক": "The patriots will always be remembered by people", "খ": "The patriots are always being remembered", "গ": "People are always remembered by the patriots", "ঘ": "The patriots are always remembered"}, "answerKey": "ঘ", "answerText": "The patriots are always remembered.", "explanation_bn": "Active voice এ people subject হিসেবে ব্যবহৃত হলে passive voice-এ তা উঠে যায়। Voice change এর অন্যান্য নিয়ম অপরিবর্তিত থাকে। সুতরাং, The patriots are always remembered উত্তরটি সঠিক।"}, {"id": "EL-0449", "page": 58, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.4 Degree", "qno": "01", "question": "Find out the correct positive form of the sentence: 'Who else is the better player than Zaman in the team?'", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "Is there any other player in this team who is as good as Zaman?", "খ": "Who is the best player than Zaman in this team?", "গ": "Is there any other players in this team who is as good as Zaman?", "ঘ": "Are there any other players in this team who are as good as Zaman?"}, "answerKey": "ক", "answerText": "Is there any other player in this team who is as good as Zaman?", "explanation_bn": "Who দ্বারা comparative degree শুরু হলে এবং এরপর singular / plural verb ও noun থাকলে positive এ রূপান্তরের নিয়ম: Is / are any other + noun (singular/plural) + দ্বিতীয় Subject-এর পরের অংশ + who + verb (singular/plural) + as + comparative-এর positive রূপ + as + দ্বিতীয় subject। যেমন: Comparative: Who else is/are the better player/players than Zaman in the team? Positive: Is / Are there any other player/players in the team who is as good as Zaman?"}, {"id": "EL-0450", "page": 58, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.4 Degree", "qno": "02", "question": "Choose the correct comparative form of the sentence: 'Very few boys are as industrious as Zaman.'", "source_tag": "৪৪তম বিসিএস", "options": {"ক": "Zaman is one of the most industrious boys.", "খ": "Zaman is more industrious than most other boys.", "গ": "Zaman is really industrious like other boys.", "ঘ": "Zaman is as industrious as other boys."}, "answerKey": "খ", "answerText": "Zaman is more industrious than most other boys.", "explanation_bn": "Positive degree তে very few থাকলে comparative form হবে, Subject (2nd subject) + Verb + comparative form of the positive form + than most other + very few- এর পরের noun। যেমন: Positive: Very few boys are as industrious as Zaman. Comparative: Zaman is more industrious than most other boys।"}, {"id": "EL-0451", "page": 58, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.4 Degree", "qno": "03", "question": "Select the correct comparative form of the sentence 'A string of pearls was not so bright as her teeth.'", "source_tag": "৪১তম বিসিএস", "options": {"ক": "Her teeth was more brighter than a string of pearls.", "খ": "Her teeth were brighter than a string of pearls.", "গ": "A string of pearls was brighter than her teeth.", "ঘ": "A string of pearls were very bright than her teeth."}, "answerKey": "খ", "answerText": "Her teeth were brighter than a string of pearls.", "explanation_bn": "Subject (noun/pronoun) + verb + not + so + Positive + as + noun. যুক্ত sentence-কে positive থেকে comparative-এ রূপান্তরের নিয়ম: Subject (2nd noun) + verb + comparative + than + noun (1st noun/subject)। যেমন: positive: A string of pearls was not so bright as her teeth. Comparative: Her teeth were brighter than a string of pearls."}, {"id": "EL-0452", "page": 59, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.4 Degree", "qno": "08", "flag": "⚠ Source numbering jumps 03→08 on this page, preserved as printed.", "question": "\"We were no more surprised than Rahman.\"", "source_tag": "৩২তম বিসিএস", "options": {"ক": "We were less surprised than Rahman.", "খ": "We were all surprised.", "গ": "Rahman was less surprised than us.", "ঘ": "We were as surprised as Rahman."}, "answerKey": "ঘ", "answerText": "We were as surprised as Rahman.", "explanation_bn": "Subject (noun/pronoun) + verb + no less এ no more + adjective + than + noun যুক্ত sentence-কে positive থেকে comparative-এ রূপান্তরের নিয়ম: Subject (noun/pronoun) + verb + as + Positive + as + noun। যেমন: Comparative: We were no more surprised than Rahman. positive: We were as surprised as Rahman. We were no more surprised than Rahman. অর্থ- আমরা রহমানের চেয়ে বেশি বিস্মিত ছিলাম না। যার অর্থ হলো We were as surprised as (not more than) Rahman. (আমরা রহমানের মতো বিস্মিত ছিলাম। সুতরাং, অর্থ বিবেচনায় (ঘ) অপশনটিই সঠিক।"}, {"id": "EL-0453", "page": 59, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.4 Degree", "qno": "05", "question": "Dhaka is becoming one of the ___ cities in Asia.", "source_tag": "২৮তম বিসিএস", "options": {"ক": "more busy", "খ": "busy", "গ": "busiest", "ঘ": "most busiest"}, "answerKey": "গ", "answerText": "busiest", "explanation_bn": "one of the + superlative degree + plural noun ব্যবহৃত হয়। busy-এর comparative 'busier' এবং superlative 'busiest'।"}, {"id": "EL-0454", "page": 59, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.4 Degree", "qno": "06", "question": "I thought that ___ was the last one.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "the most prettiest of all", "খ": "prettiest one of all", "গ": "the prettiest one from all", "ঘ": "the prettiest one of all"}, "answerKey": "ঘ", "answerText": "the prettiest one of all", "explanation_bn": "The + superlative degree + noun/pronoun+ of + all আকারে sentence-এ ব্যবহৃত হয়। তাই এখানে the prettiest one of all সঠিক। অপশন (ক)-এ Double superlative ব্যবহৃত হয়েছে, যা ভুল; অপশন (গ)-এ from এর পরিবর্তে of ব্যবহৃত হবে; অপশন (খ)-এ prettiest এর আগে the বসবে।"}, {"id": "EL-0455", "page": 59, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.4 Degree", "qno": "09", "question": "She is beautiful but she is ___ her mother.", "source_tag": "২৪তম বিসিএস (বাতিল)", "options": {"ক": "most beautiful", "খ": "less beautiful", "গ": "as beautiful", "ঘ": "not so beautiful as"}, "answerKey": "ঘ", "answerText": "not so beautiful as", "explanation_bn": "দুজন ব্যক্তি বা বস্তু বা সংখ্যার মধ্যে তুলনা বুঝাতে Affirmative sentence এ as-as এবং Negative sentence-এ so-as ব্যবহৃত হয়। সুতরাং, উত্তর (ঘ) সঠিক। উল্লেখ্য, Sentence-এ the most beautiful এর ব্যবহার যথার্থ নয়। কারণ দুইয়ের মধ্যে তুলনার ক্ষেত্রে superlative degree ব্যবহৃত হয় না। অপশন (খ)-এ less beautiful than ব্যবহৃত হলে সঠিক হতো।"}, {"id": "EL-0456", "page": 59, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.4 Degree", "qno": "08b", "question": "Prices for bicycles can run ___ Tk. 20,000.", "source_tag": "১৮তম বিসিএস", "options": {"ক": "as high as", "খ": "so high as", "গ": "as high to", "ঘ": "as high for"}, "answerKey": "ক", "answerText": "as high as", "explanation_bn": ""}, {"id": "EL-0457", "page": 59, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.5 Narration", "qno": "01", "question": "'Helena said I took the laptop home with me.' Its indirect form is-", "source_tag": "৫০তম বিসিএস", "options": {"ক": "Helena said that she took the laptop home with her", "খ": "Helena said that she had taken the laptop home with her", "গ": "Helena confirmed that she has taken the laptop home with her", "ঘ": "Helena told that she had taken the laptop taken home with her"}, "answerKey": "খ", "answerText": "Helena said that she had taken the laptop home with her.", "explanation_bn": "উক্ত sentence- এর Indirect speech এ: Reporting verb, said → said that হবে এবং tense shift, 'took' (simple past) → had taken (past perfect) হবে। এই বিবেচনায় (খ) একমাত্র সঠিক অপশন।"}, {"id": "EL-0458", "page": 59, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.5 Narration", "qno": "02", "question": "Identify the correct sentences:", "source_tag": "৪৬তম বিসিএস", "options": {"ক": "He has said to me that I will go but you will stay there in Dhaka.", "খ": "He has told me that he will go but I will stay here in Dhaka.", "গ": "He has told me that I would go but you would stay here in Dhaka.", "ঘ": "He has told me that he would go but I would stay here in Dhaka."}, "answerKey": "খ", "answerText": "He has told me that he will go but I will stay here in Dhaka.", "explanation_bn": "Reporting Verb 'Present Tense' এ থাকলে reported Speech এর Tense এর পরিবর্তন হয় না। শুধু Number ও Person-এর পরিবর্তন হয়। 'Present Tense' যুক্ত Assertive Sentence- কে Indirect Speech এ রূপান্তরের নিয়ম: Reporting verb-এ say /says/ has said/ have said পরিবর্তে tell / tells /has told/ have told হবে + Inverted Comma উঠে গিয়ে that বসে + Person পরিবর্তনের নিয়ম অনুযায়ী পরবর্তী subject + verb + others। যেমন: Direct: He has said to me, \"I will go but you will stay here in Dhaka.\" Indirect: He has told me that he will go but I will stay here in Dhaka. সাধারণত 'Here' Indirect speech-এ there-এ পরিণত হয় কিন্তু আলোচ্য sentence-এ speaker ও listener দুজনেরই অবস্থান Dhaka. তাই Here-এর কোনো পরিবর্তন হয়নি।"}, {"id": "EL-0459", "page": 60, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.5 Narration", "qno": "03", "question": "What is the correct indirect form of: He said, \"You had better see a doctor\".", "source_tag": "৪২তম বিসিএস", "options": {"ক": "He advised him to see a doctor.", "খ": "He advised that he should see a doctor.", "গ": "He suggested that he had seen a doctor.", "ঘ": "He proposed to see a doctor."}, "answerKey": "ক", "answerText": "He advised him to see a doctor.", "explanation_bn": "Direct narration-এ Reported speech-এ মূল Verb-এর পূর্বে ব্যবহৃত could, might, ought to, used to, had better, would rather- ইত্যাদি modal auxiliary verb-গুলো থাকলে, indirect narration-এ উক্ত modal auxiliary verb-গুলো অপরিবর্তিত থাকে। যেমন: Direct: Rina said, \"I had better do the work.\" Indirect: Rina said that she had better do the work… হওয়ার কথা, কিন্তু Reported Speech-এ You had better থাকলে এর দ্বারা advise (imperative sentence) বুঝায়। এক্ষেত্রে Indirect করার নিয়ম: Subject + advised + object + to + had better এর পরের verb-সহ বাকি অংশ। সুতরাং উত্তর হবে He advised him to see a doctor।"}, {"id": "EL-0460", "page": 60, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.5 Narration", "qno": "04", "question": "Which one in the correct indirect narration? \"Why have you beaten my dog\"? he said to me.", "source_tag": "৩৮তম বিসিএস", "options": {"ক": "He demanded me why had I beaten his dog.", "খ": "He asked me why I have had beaten his dog.", "গ": "He enquired me why had I had beaten his dog.", "ঘ": "He demanded of me why I had beaten his dog."}, "answerKey": "ঘ", "answerText": "He demanded of me why I had beaten his dog.", "explanation_bn": "বাক্যটি দ্বারা দৃঢ়ভাবে জিজ্ঞাসা করা বোঝাচ্ছে। আর demand of somebody অর্থ কাউকে জোরপূর্বক জিজ্ঞাসা করা। Indirect narration এ embedded question টির structure: (Wh) why + subject + had + beaten + his dog। সুতরাং সঠিক Indirect narration হবে: He demanded of me why I had beaten his dog।"}, {"id": "EL-0461", "page": 60, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.5 Narration", "qno": "05", "question": "He said that he ___ the previous day.", "source_tag": "২৯তম বিসিএস", "options": {"ক": "has come", "খ": "had come", "গ": "came", "ঘ": "arrived"}, "answerKey": "খ", "answerText": "had come", "explanation_bn": "Reporting verb 'past tense'-এ থাকলে Reported speech-এর present perfect tense/past indefinite tense-টি past perfect-এ পরিণত হয়। আলোচ্য ক্ষেত্রে direct speech ছিল He said, \"I came yesterday\". এর indirect হবে- He said that he had come the previous day. সুতরাং answer হবে had come।"}, {"id": "EL-0462", "page": 60, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.5 Narration", "qno": "06", "question": "Choose the correct indirect speech- She asked me, \"Are you happy in your new job?\"", "source_tag": "২৭তম বিসিএস", "options": {"ক": "She asked me if I was happy in my new job.", "খ": "She asked me if I have been happy in my new job.", "গ": "She asked me whether I am happy in my new job.", "ঘ": "She asked me if I had been happy in my new job."}, "answerKey": "ক", "answerText": "She asked me if I was happy in my new job.", "explanation_bn": "'Yes' বা 'No' দিয়ে উত্তর দেয়া সম্ভব এমন Interrogative Sentence- কে Indirect Speech এ রূপান্তরের নিয়ম: Reporting Verb said-এর পরিবর্তে asked / enquired / demanded হবে + Inverted Comma উঠিয়ে if বা whether + Tense ও Person যথানিয়মে পরিবর্তিত হবে। যেমন: Direct: She asked me, \"Are you happy in your new job?\" Indirect: She asked me if I was happy in my new job।"}, {"id": "EL-0463", "page": 60, "chapter": "Chapter 04: Sentences and Transformation", "topic": "4.5 Narration", "qno": "07", "question": "'I'll have a cup of tea,' my father said, 'Because I'm not hungry.' Which of the following sentence is the correct indirect speech?", "source_tag": "২৪তম বিসিএস", "options": {"ক": "My father said that he will have a cup of tea because he wasn't hungry.", "খ": "My father said that he would have had a cup of tea because he wasn't hungry.", "গ": "My father said that he would have a cup of tea because he wasn't hungry.", "ঘ": "My father said that he had a cup of tea because he wasn't hungry."}, "answerKey": "গ", "answerText": "My father said that he would have a cup of tea because he wasn't hungry.", "explanation_bn": "Reporting verb যদি past tense-এর হয় তাহলে reported speech-কেও past tense-এ পরিবর্তন করতে হয়। এ নিয়মানুযায়ী reported speech-এর will পরিবর্তে would এবং am/ is/ are এর পরিবর্তে was / were হবে। সুতরাং সঠিক Indirect speech হলো: My father said that he would have a cup of tea because he wasn't hungry।"}, {"id": "EL-0464", "page": 61, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "01", "question": "What may be considered courteous in one culture may be arrogant in another. Here the underlined word \"arrogant\" means-", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "rude", "খ": "gracious", "গ": "coarse", "ঘ": "pretentious"}, "answerKey": "ক", "answerText": "rude", "explanation_bn": "Arrogant, rude, boastful, haughty, egotistical, overbearing, masterful, cheeky ইত্যাদি Word গুলোর অর্থ অহংকারী, উদ্ধত।"}, {"id": "EL-0465", "page": 61, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "02", "question": "\"Black Death\" is the name of a-", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "fever", "খ": "black fever", "গ": "plague pandemic", "ঘ": "death of black people"}, "answerKey": "গ", "answerText": "plague pandemic", "explanation_bn": "Black Death [1346-1351] বলতে একটি Bubonic Plague-কে বোঝানো হয়। এই মহামৃত্যুর পর্বে ইউরোপে প্রায় ২.৫ থেকে ৫ কোটি মানুষ মারা যায়।"}, {"id": "EL-0466", "page": 61, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "03", "question": "No one can ___ that he is clever.", "source_tag": "৪৫তম, ২৬তম, ২১তম বিসিএস", "options": {"ক": "defy", "খ": "deny", "গ": "admire", "ঘ": "denounce"}, "answerKey": "খ", "answerText": "deny", "explanation_bn": "Defy অর্থ অমান্য/অবমাননা করা। deny- অস্বীকার করা বা প্রত্যাখ্যান করা। এর Synonym- reprobate, disown, disaffirm, negate, renounce, disapprove, refuse। denounce অর্থ নিন্দা করা বা প্রকাশ্যে তিরস্কার করা। Sentence-এর অর্থ অনুসারে এখানে deny যথোপযুক্ত।"}, {"id": "EL-0467", "page": 61, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "04", "question": "Put the right word in the blank. \"He reached the ___ of his literary career.\"", "source_tag": "৪৫তম বিসিএস", "options": {"ক": "abattoir", "খ": "acme", "গ": "admonish", "ঘ": "abdicate"}, "answerKey": "খ", "answerText": "acme", "explanation_bn": "acme, peak, zenith, pinnacle, crown, summit, apex, climax, culmination শব্দ গুলোর দ্বারা শীর্ষ, চূড়া, কোনো অবস্থানের শীর্ষ বা সর্বোচ্চ অবস্থা বোঝায়। Abdicated অর্থ পদ বা সিংহাসন ত্যাগ করা; Admonish অর্থ তিরস্কার করা বা বকা দেওয়া, এখানে career এর শীর্ষে আছে বোঝাতে acme হবে।"}, {"id": "EL-0468", "page": 61, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "05", "question": "The word 'equivocation' refers to-", "source_tag": "৪৪তম, ১৭তম বিসিএস", "options": {"ক": "stating like an author", "খ": "two contradictory things in the same statement", "গ": "free expression of opinions", "ঘ": "a true statement"}, "answerKey": "খ", "answerText": "two contradictory things in the same statement.", "explanation_bn": "Equivocation এর প্রকৃত অর্থ হলো deliberate ambiguity / use of ambiguous language to mislead, অর্থাৎ বাংলায় 'ইচ্ছাকৃত অস্পষ্টতা / বিভ্রান্তিকরভাবে ভাষার দ্ব্যর্থক ব্যবহার করে মানুষকে ভুল পথে পরিচালিত করা'। Option গুলোতে সঠিক উত্তরটি না থাকায় অপেক্ষাকৃত গ্রহণযোগ্য option টি নির্বাচন করা হয়েছে।"}, {"id": "EL-0469", "page": 61, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "06", "question": "The word 'to genuflect' means-", "source_tag": "৪৩তম বিসিএস", "options": {"ক": "to be genuine", "খ": "to reflect", "গ": "to bend the knee", "ঘ": "to be flexible"}, "answerKey": "গ", "answerText": "to bend the knee.", "explanation_bn": "Genuflect-নতজানু হয়ে কাউকে সম্মান জানানো। 'to genuflect'-by bending one knee to the ground typically in worship or as a sign of respect."}, {"id": "EL-0470", "page": 61, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "07", "question": "অনুকম্পা শব্দের ইংরেজি কোনটি?", "source_tag": "৪২তম বিসিএস", "options": {"ক": "Clemency", "খ": "Enthral", "গ": "Erudition", "ঘ": "Fathom"}, "answerKey": "ক", "answerText": "Clemency", "explanation_bn": "clemency (noun) কোমলতা, অনুকম্পা। অন্যান্য শব্দার্থ হলো- Enthral- দাসত্বে আবদ্ধ করা Erudition- পাণ্ডিত্য Fathom- অনুধাবন করা, গভীরতা নির্ণয় করা।"}, {"id": "EL-0471", "page": 61, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "08b", "question": "What is the meaning of musk?", "source_tag": "৪২তম বিসিএস", "options": {"ক": "a form of drama", "খ": "a face cover", "গ": "a substance used in making perfume", "ঘ": "a disguise."}, "answerKey": "গ", "answerText": "a substance used making perfume", "explanation_bn": "Musk অর্থ কস্তুরি। এটি সুগন্ধি তৈরিতে ব্যবহৃত হয়। উল্লেখ্য, mask অর্থ Face cover।"}, {"id": "EL-0472", "page": 62, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "09", "question": "'You look terrific in that dress!' The word 'terriffic' in the above sentence means-", "source_tag": "৪০তম বিসিএস", "options": {"ক": "excellent", "খ": "funny", "গ": "very ugly", "ঘ": "horrible"}, "answerKey": "ক", "answerText": "excellent", "explanation_bn": "Terrific এর প্রচলিত অর্থ ভয়ানক, অত্যন্ত তীব্র বা প্রচণ্ড। কিন্তু বাক্যের অর্থ অনুসারে Terrific শব্দের অর্থ Extraordinary, extremely good, Excellent. বাক্যের অর্থ: ঐ পোশাকে তোমাকে চমৎকার দেখায়! অন্যদিকে funny অর্থ হাস্যকর, very ugly অর্থ খুব কুৎসিত এবং horrible অর্থ বীভৎস।"}, {"id": "EL-0473", "page": 62, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "10", "question": "The saying 'enough is enough' is used when you want-", "source_tag": "৪০তম বিসিএস", "options": {"ক": "something to continue", "খ": "something to stop", "গ": "something to continue until it's enough", "ঘ": "to tell instructions are clear"}, "answerKey": "খ", "answerText": "something to stop", "explanation_bn": "'Enough is enough' লোককথাটি ব্যবহৃত হয় যখন পরিস্থিতি এমন যে তুমি যা চাচ্ছ তা গ্রহণ করতে পারছ না এবং তুমি চাচ্ছ যেন বিষয়টি এখনই থেমে যাক। সুতরাং সঠিক option হলো something to stop।"}, {"id": "EL-0474", "page": 62, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "11", "question": "The word 'culinary' is related to-", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "printing", "খ": "cooking", "গ": "dress", "ঘ": "musical instruments"}, "answerKey": "খ", "answerText": "cooking", "explanation_bn": "Culinary (adj) শব্দটি রান্নাঘর বা রান্না সম্বন্ধীয়। অর্থাৎ culinary is related to cooking।"}, {"id": "EL-0475", "page": 62, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "12", "question": "'Panacea' means-", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "Cure-all", "খ": "Pancreatic", "গ": "Widespread disease", "ঘ": "Gland"}, "answerKey": "ক", "answerText": "Cure-all", "explanation_bn": "'Panacea' শব্দটি সকল রোগের ঔষধ/আরোগ্য (Universal Remedy, Universal cure, heal-all)।"}, {"id": "EL-0476", "page": 62, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "13", "question": "Cricket is a kind of play. It is also a kind of-", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "insect", "খ": "food", "গ": "bird", "ঘ": "flower"}, "answerKey": "ক", "answerText": "insect", "explanation_bn": "Cricket শব্দের অর্থ ঝিঁঝি পোকা (insect)।"}, {"id": "EL-0477", "page": 62, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "14", "question": "The word 'florid' indicates-", "source_tag": "৩৯তম বিসিএস", "options": {"ক": "flour", "খ": "foliage", "গ": "floor", "ঘ": "flower"}, "answerKey": "ঘ", "answerText": "flower", "explanation_bn": "Florid means ornate/excessively elaborate/reddish, but not literally \"flower.\" Florid শব্দটির অর্থ পুষ্পল, রক্তিমাভ। এটি 'flower' সঙ্গ্রীয় বিষয়কে নির্দেশ করে। এর দ্বারা সাধারণত 'পুষ্প দ্বারা শোভিত' বোঝায়।"}, {"id": "EL-0478", "page": 62, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "15", "question": "Which word is closest in meaning to 'Franchise'?", "source_tag": "৩৮তম, ১৭তম বিসিএস", "options": {"ক": "utility", "খ": "frankness", "গ": "privilege", "ঘ": "superficial"}, "answerKey": "গ", "answerText": "privilege", "explanation_bn": "Franchise (কোনো দেশ কর্তৃক প্রদত্ত অধিকার; জনাধিকার)- এর সমার্থক শব্দ privilege (অসামান্য অধিকার; প্রাধিকার), permission, authorization, licence, suffrage, grant, right ইত্যাদি। অন্যদিকে, utility অর্থ উপযোগ, উপযোগিতা; frankness অর্থ অকপটতা, অমায়িকতা; আর superficial অর্থ অগভীর, বাহ্য।"}, {"id": "EL-0479", "page": 62, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "16", "question": "Which do you think is the nearest in meaning to 'proviso':", "source_tag": "৩৭তম বিসিএস", "options": {"ক": "sanction", "খ": "substitute", "গ": "stipulation", "ঘ": "directive"}, "answerKey": "গ", "answerText": "stipulation", "explanation_bn": "Proviso- অনুবিধি/শর্ত। এর Synonyms- provision, stipulation, reservation, condition, clause ইত্যাদি। অন্য option গুলোর মধ্যে sanction-অনুমোদন; substitute-বিকল্প; stipulation-পণ, মুক্তিপণ, শর্ত; directive-নির্দেশনামূলক।"}, {"id": "EL-0480", "page": 62, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "17", "question": "Women are too often ___ by family commitments.", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "confused", "খ": "controlled", "গ": "contaminated", "ঘ": "constrained"}, "answerKey": "ঘ", "answerText": "constrained", "explanation_bn": "Constrained অর্থ-বাধ্য, শৃঙ্খলাবদ্ধ, আটক ইত্যাদি; confused অর্থ- বিভ্রান্ত; contaminated- কলুষিত এবং controlled-নিয়ন্ত্রিত। প্রশ্লোক্ত বাক্যটির অর্থ হয়- নারীরা প্রায়ই পারিবারিক প্রতিশ্রুতিতে শৃঙ্খলাবদ্ধ, সুতরাং appropriate word হবে constrained।"}, {"id": "EL-0481", "page": 62, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "18", "question": "Societies living in the periphery are always ignored. Here the underlined word means-", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "offshore areas", "খ": "marginal areas", "গ": "remote places", "ঘ": "backward regions"}, "answerKey": "খ", "answerText": "marginal areas", "explanation_bn": "Periphery চৌহদ্দি বা শেষ সীমানা (marginal areas)। এর Synonyms- boundary, border, circumference, outer edge ইত্যাদি। Offshore areas-সমুদ্রতীর হতে দূরবর্তী এলাকা।"}, {"id": "EL-0482", "page": 63, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "19", "question": "Let us begin by looking at the minutes of the meeting. Here the underlined word means-", "source_tag": "৩৫তম বিসিএস", "options": {"ক": "time record", "খ": "time frame", "গ": "written record", "ঘ": "written analysis"}, "answerKey": "গ", "answerText": "written record", "explanation_bn": "কোনো Meeting-এ যা আলোচনা করা হয় এবং যে সিদ্ধান্ত গৃহীত হয় তা লিখিত আকারে সংরক্ষণ করাকে ইংরেজিতে minutes বলে। Records, proceedings, transactions, notes ইত্যাদি শব্দগুলোও Minutes-এর Synonyms হিসেবে ব্যবহৃত হয়।"}, {"id": "EL-0483", "page": 63, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "20", "question": "If a person cannot stop taking drugs, he or she is-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "attached to them", "খ": "committed to them", "গ": "addicted to them", "ঘ": "devoted to them"}, "answerKey": "গ", "answerText": "addicted to them", "explanation_bn": "আসক্ত অর্থে addicted শব্দটি ব্যবহৃত হয়। প্রদত্ত বাক্যের ভাবার্থ হল যে 'যদি কোনো ব্যক্তি ড্রাগ বা নেশা জাতীয় দ্রব্য গ্রহণ বন্ধ করতে না পারে তাহলে সে সেগুলোর প্রতি আসক্ত।'"}, {"id": "EL-0484", "page": 63, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "21", "question": "'The French' refers to-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "The French people", "খ": "the French language", "গ": "the French manners", "ঘ": "the French society"}, "answerKey": "ক", "answerText": "The French people", "explanation_bn": "ভাষার নামের পূর্বে কখনো Article 'the' বসে না। ভাষার নাম দ্বারা জাতি বুঝাতে তার পূর্বে the বসে। যেমন- The English (ইংরেজ জাতি), The French (ফরাসি জাতি) ইত্যাদি।"}, {"id": "EL-0485", "page": 63, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "22", "question": "The word 'officialese' means-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "plural number of official", "খ": "language used in offices", "গ": "plural number of office", "ঘ": "vague expressions"}, "answerKey": "খ", "answerText": "language used in offices", "explanation_bn": "অফিসসমূহে ব্যবহৃত ভাষাই হচ্ছে Officialese।"}, {"id": "EL-0486", "page": 63, "chapter": "Chapter 05: Words and Compositions", "topic": "5.1 Meanings, Expressions and Definitions", "qno": "23", "question": "Fill in the blank with the appropriate part: \"Such claim needs to be tested empirically\" suggest that-", "source_tag": "৩৩তম বিসিএস", "options": {"ক": "The test should be based on assumption.", "খ": "The test should be based on idea.", "গ": "The test should be based on experience.", "ঘ": "The test should be based on calculation."}, "answerKey": "গ", "answerText": "The test should be based on experience.", "explanation_bn": "Empirical শব্দের অর্থ গবেষণামূলক বা পরীক্ষামূলক। কোনো কিছু empirically test করা বলতে বুঝায় পরীক্ষাটি অভিজ্ঞতার
