িএস","options":{"ক":"আয়োডিন","খ":"আয়রন","গ":"ম্যাগনেসিয়াম","ঘ":"ক্যালসিয়াম ও ফসফরাস"},"answer":"ঘ","answer_text":"ক্যালসিয়াম ও ফসফরাস","explanation":"ক্যালসিয়াম ও ফসফরাস হাড় ও দাঁতের গঠন মজবুত করে, রক্ত তঞ্চন, পেশি সংকোচন ইত্যাদি গুরুত্বপূর্ণ কাজ করে থাকে। আয়োডিনের অভাবে থাইরয়েড গ্ল্যান্ডের কর্মকাণ্ড ব্যাহত হয় এবং গলগণ্ড, বামনত্ব প্রভৃতি দেখা দেয়। অপরদিকে আয়রন রক্তের হিমোগ্লোবিনের অন্যতম প্রধান উৎস এবং ম্যাগনেসিয়াম শরীর গঠনে গুরুত্বপূর্ণ ভূমিকা পালন করে।"},{"id":"q0357","page":55,"printed_page":477,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"১৫","question":"কোন ডালের সঙ্গে ল্যাথারাইজম রোগের সম্পর্ক আছে?","exam_ref":"৩৪তম বিসিএস","options":{"ক":"অড়হর","খ":"ছোলা","গ":"খেসারি","ঘ":"মটর"},"answer":"গ","answer_text":"খেসারি","explanation":"ল্যাথারাইজম একটি পায়ের রোগ। এ রোগে আক্রান্ত হলে মানুষের পা অচল হয়ে যায়। অতিরিক্ত খেসারির ডাল খাদ্য হিসেবে গ্রহণ এ রোগের জন্য দায়ী। খেসারি ডালে BOAA নামক এক ধরনের অ্যামাইনো এসিড থাকে যা এই রোগ সৃষ্টির জন্য দায়ী।"},{"id":"q0358","page":55,"printed_page":477,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"১৬","question":"Natural protein-এর কোড নাম-","exam_ref":"১৭তম বিসিএস","options":{"ক":"protein-P 53","খ":"protein-P 51","গ":"protein-P 49","ঘ":"protein-P 54"},"answer":"গ","answer_text":"protein-P 49","explanation":"কার্বন, হাইড্রোজেন, নাইট্রোজেন ও অক্সিজেন দ্বারা গঠিত জটিল জৈব পদার্থ হচ্ছে প্রোটিন। এটি দেহকোষে গঠনসহ এনজাইম ও হরমোন তৈরিতে অংশগ্রহণ করে। Natural protein এর কোড নাম হলো P-49।"},{"id":"q0359","page":55,"printed_page":477,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"১৭","question":"কচুশাক বিশেষভাবে মূল্যবান যে উপাদানের জন্য তা হলো-","exam_ref":"১০তম বিসিএস","options":{"ক":"ভিটামিন-'এ'","খ":"ভিটামিন-'সি'","গ":"লৌহ","ঘ":"ক্যালসিয়াম"},"answer":"গ","answer_text":"লৌহ","explanation":"কচুশাকের উল্লেখযোগ্য উপাদান লৌহ। তাছাড়া এতে ভিটামিন-এ, ক্যালসিয়াম অক্সালেট এবং অন্যান্য ভিটামিন ও খনিজ পদার্থ রয়েছে।"},{"id":"q0360","page":55,"printed_page":477,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.২","topic_title":"প্লান্ট নিউট্রিশন","number":"০১","question":"ইউরিয়া সার থেকে উদ্ভিদ কি খাদ্য উপাদান গ্রহণ করে?","exam_ref":"৩৪তম বিসিএস","options":{"ক":"ফসফরাস","খ":"নাইট্রোজেন","গ":"পটাশিয়াম","ঘ":"সালফার"},"answer":"খ","answer_text":"নাইট্রোজেন","explanation":"নাইট্রোজেন গ্যাসকে একটি বিশেষ প্রক্রিয়ায় অ্যামোনিয়ায় রূপান্তরিত করা হয় এবং অ্যামোনিয়া থেকে ইউরিয়া সার উৎপন্ন করা হয়। তাই উদ্ভিদ খাদ্য উপাদান হিসেবে ইউরিয়া সার হতে নাইট্রোজেনই গ্রহণ করে। ইউরিয়া সারে নাইট্রোজেনের পরিমাণ ৪৬%। নাইট্রোজেন এর অভাবে পাতায় ক্লোরোফিল সৃষ্টিতে বিঘ্ন ঘটে তাই পাতা হলুদ হয়ে যায়।"},{"id":"q0361","page":55,"printed_page":477,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.২","topic_title":"প্লান্ট নিউট্রিশন","number":"০২","question":"কীসের অভাবে ফসলের পরিপক্কতা বিলম্বিত হয়?","exam_ref":"৩০তম বিসিএস","options":{"ক":"দস্তা","খ":"সালফার","গ":"নাইট্রোজেন","ঘ":"পটাশিয়াম"},"answer":"খ","answer_text":"সালফার","explanation":"সালফারের অভাবে গাছ খর্বাকৃতির হয় এবং ফসলের পরিপক্কতা বিলম্বিত হয়। দস্তার অভাবে গাছের পাতার বৃদ্ধি ব্যাহত হয়। নাইট্রোজেনের অভাবে ক্লোরোফিল সৃষ্টিতে বিঘ্ন ঘটে এবং অভাব বেশি হলে গাছের পাতা হলুদ হয়ে যায়। পটাশিয়ামের অভাব হলে সালোকসংশ্লেষণের হার হ্রাস পায় এবং পাতার শীর্ষ ও কিনারা হলুদ হয়।"},{"id":"q0362","page":55,"printed_page":477,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.২","topic_title":"প্লান্ট নিউট্রিশন","number":"০৩","question":"উদ্ভিদের পাতা হলদে হয়ে যায় কীসের অভাবে?","exam_ref":"২৮তম বিসিএস","options":{"ক":"নাইট্রোজেনের","খ":"ফসফরাসের","গ":"ইউরিয়ার","ঘ":"পটসিয়ামের"},"answer":"ক","answer_text":"নাইট্রোজেনের","explanation":"উদ্ভিদের পাতা হলদে হয়ে যাওয়ার প্রক্রিয়াকে 'ক্লোরোসিস' বলা হয়। নাইট্রোজেনের (N) অভাব হলে ক্লোরোফিল সৃষ্টিতে ব্যাঘাত ঘটে, ফলে উদ্ভিদের পাতা হলদে হয়ে যায়। ইউরিয়া সারের ভিতর নাইট্রোজেন বিদ্যমান, এজন্য নাইট্রোজেনের অভাব পূরণ করতে গাছের গোড়ায় ইউরিয়া সার প্রয়োগ করা হয়। অপরদিকে, ফসফরাসের (P) অভাব হলে পাতা বেগুনি রং ধারণ করে। আবার পটসিয়ামের (K) অভাবে পাতার শীর্ষ ও কিনারা হলুদ হয় এবং মৃত অঞ্চল সৃষ্টি হয়।"},{"id":"q0363","page":55,"printed_page":477,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.২","topic_title":"প্লান্ট নিউট্রিশন","number":"০৪","question":"গাছের খাদ্য তালিকায় আছে?","exam_ref":"২৭তম বিসিএস","options":{"ক":"N, P, K, S ও Zn","খ":"Na, P, K, S ও Zn","গ":"N, B, K, S ও Al","ঘ":"N, P, K, S ও Al"},"answer":"ক","answer_text":"N, P, K, S ও Zn","explanation":"উদ্ভিদের সার্বিক বৃদ্ধির প্রয়োজনে দশটি খনিজ উপাদান বিশেষ দরকারি। এদেরকে উদ্ভিদের মুখ্য পুষ্টি উপাদান বলে। এগুলো হচ্ছে- কার্বন (C), হাইড্রোজেন (H), অক্সিজেন (O), নাইট্রোজেন (N), ফসফরাস (P), পটাশিয়াম (K), ক্যালসিয়াম (Ca), সালফার (S), ম্যাগনেসিয়াম (Mg) এবং লোহা (Fe)। উপরিউক্ত প্রশ্নে (ক) তালিকার সবগুলোই এই দশ প্রকার খনিজের মধ্যে রয়েছে।"},{"id":"q0364","page":56,"printed_page":478,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.১","topic_title":"রোগজীবাণু","number":"০১","question":"MRI কোন নীতিতে কাজ করে?","exam_ref":"৫০তম বিসিএস","options":{"ক":"শরীরের ত্রি-মাত্রিক চিত্র তৈরি করতে এক্স-রে ব্যবহার করে","খ":"তেজষ্ক্রিয় ট্রেসার দ্বারা নির্গত গামা-রে সনাক্তের মাধ্যমে","গ":"শক্তিশালী চুম্বক রেডিও তরঙ্গ ব্যবহার করে ইমেজ তৈরির মাধ্যমে","ঘ":"উচ্চ ফ্রিকোয়েন্সি শব্দ তরঙ্গ ব্যবহার করে ইমেজ তৈরির মাধ্যমে"},"answer":"গ","answer_text":"শক্তিশালী চুম্বক রেডিও তরঙ্গ ব্যবহার করে ইমেজ তৈরির মাধ্যমে","explanation":"MRI যন্ত্রটি মূলত শরীরের হাইড্রোজেন পরমাণু প্রোটনকে কাজে লাগিয়ে কাজ করে। আমাদের শরীরের প্রায় ৭০ শতাংশই পানি, আর পানিতে প্রচুর হাইড্রোজেন প্রোটন থাকে। যখন রোগীকে MRI মেশিনের অত্যন্ত শক্তিশালী চৌম্বক ক্ষেত্রে রাখা হয়, তখন শরীরের এই প্রোটনগুলো চুম্বকীয় বলরেখা বরাবর সারিবদ্ধ হয়ে যায়। এরপর নির্দিষ্ট কম্পাঙ্কের রেডিও তরঙ্গ (Radio Waves) পাঠানো হলে প্রোটনগুলো সেই শক্তি শোষণ করে তাদের অবস্থান পরিবর্তন করে। রেডিও তরঙ্গ বন্ধ করে দিলে প্রোটনগুলো আবার আগের অবস্থায় ফিরে আসে এবং এই সময় তারা শোষিত শক্তি রেডিও সংকেত হিসেবে ছেড়ে দেয়। এই সংকেতগুলো গ্রহণ করে কম্পিউটার অত্যন্ত নিখুঁত এবং উচ্চমানের ত্রি-মাত্রিক চিত্র তৈরি করে।"},{"id":"q0365","page":56,"printed_page":478,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.১","topic_title":"রোগজীবাণু","number":"০২","question":"যে কারণে শৈশব-অন্ধত্ব হতে পারে তা হলো-","exam_ref":"৪৪তম বিসিএস","options":{"ক":"এইচআইভি/এইডস","খ":"ম্যালেরিয়া","গ":"হাম","ঘ":"যক্ষ্মা"},"answer":"গ","answer_text":"হাম","explanation":"হাম হলে ব্যাকটেরিয়ার সংক্রমণ হয়, তা থেকে শিশুদের মৃত্যু হওয়ার ঝুঁকি থাকে। হামের সংক্রমণে শিশুদের ফুসফুসে ও মস্তিষ্কে প্রদাহ, প্রতিহানি এমনকি অন্ধত্বের শিকার হতে পারে। এই কারণে হামে আক্রান্ত সমস্ত শিশুকে ২৪ ঘণ্টা পর দুই মাত্রায় সম্পূরক ভিটামিন এ দেয়া হয়, যাতে হামের কারণে সৃষ্ট ভিটামিন এ এর অভাব পূরণ হয় (যা অপুষ্টিতে না ভোগা শিশুদেরও হতে পারে) এবং চোখের ক্ষতি বা অন্ধত্ব প্রতিরোধ করা যায়।"},{"id":"q0366","page":56,"printed_page":478,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.১","topic_title":"রোগজীবাণু","number":"০৩","question":"ধারালো যন্ত্রপাতি জীবাণুমুক্ত করার ভাল পদ্ধতি-","exam_ref":"৪৪তম বিসিএস","options":{"ক":"বয়লিং","খ":"বেনজিন ওয়াশ","গ":"ফরমালিন ওয়াশ","ঘ":"কেমিক্যাল স্টেরিলাইজেশন"},"answer":"ঘ","answer_text":"কেমিক্যাল স্টেরিলাইজেশন","explanation":"স্বাস্থ্যসেবায় ব্যবহৃত বেশিরভাগ চিকিৎসা এবং অস্ত্রোপচারের ধারালো ডিভাইসগুলো (যেমন- স্ক্যালপেল, হাইপোডার্মিক সূঁচ এবং কৃত্রিম পেস-মেকার) কেমিক্যাল স্টেরিলাইজেশন অথবা রাসায়নিকভাবে জীবাণুমুক্ত করতে হয়। যেমন- ইথিলিন অক্সাইড গ্যাস ১৯৫০ সাল থেকে তাপ- এবং আর্দ্রতা-সংবেদনশীল চিকিৎসা যন্ত্রের জন্য ব্যবহৃত হচ্ছে। এছাড়াও নিম্ন-তাপমাত্রার জীবাণুমুক্তকরণ ব্যবস্থা (যেমন, বাষ্পযুক্ত হাইড্রোজেন পারঅক্সাইড, পেরাসেটিক এসিড নিমজ্জন, ওজোন) তৈরি করা হয়েছে এবং চিকিৎসা ডিভাইসগুলোকে জীবাণুমুক্ত করতে ব্যবহৃত হচ্ছে।"},{"id":"q0367","page":56,"printed_page":478,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.১","topic_title":"রোগজীবাণু","number":"০৪","question":"যেসব অণুজীব রোগ সৃষ্টি করে তাদের বলা হয়-","exam_ref":"৩৬তম বিসিএস","options":{"ক":"প্যাথজেনিক","খ":"ইনফেকশন","গ":"টক্সিন","ঘ":"জীবাণু"},"answer":"ক","answer_text":"প্যাথজেনিক","explanation":"যেসব অণুজীব রোগ সৃষ্টি করে তাদের বলা হয় প্যাথজেনিক। এদের বেশির ভাগই পরজীবী এবং এরা পোষক দেহে রোগ সৃষ্টি করে। অন্যদিকে ইনফেকশন হলো সংক্রমণ। টক্সিন হলো বিষাক্ত পদার্থ এবং জীবাণু হলো ক্ষুদ্র ক্ষুদ্র অণুজীব (microbiologists) যারা রোগ সৃষ্টি করতেও পারে, নাও পারে।"},{"id":"q0368","page":56,"printed_page":478,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.১","topic_title":"রোগজীবাণু","number":"০৫","question":"সঠিক উত্তর কোনটি? ___ ছাড়া রোগ প্রতিরোধ করা অসম্ভব।","exam_ref":"৩৫তম বিসিএস","options":{"ক":"টীকাদান কর্মসূচি","খ":"সচেতনতা","গ":"পুষ্টিকর খাদ্য","ঘ":"অর্থ"},"answer":"খ","answer_text":"সচেতনতা","explanation":"টীকাদান কর্মসূচি, পুষ্টিকর খাদ্য ও অর্থ যতই থাক না কেন বিভিন্ন সংক্রামক ব্যাধির আক্রমণ থেকে রক্ষা পেতে হলে প্রত্যেককে অবশ্যই সচেতন হতে হবে।"},{"id":"q0369","page":57,"printed_page":479,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.১","topic_title":"রোগজীবাণু","number":"০৬","question":"ডায়াবেটিস রোগ সম্পর্কে যে তথ্যটি সঠিক নয় তা হল-","exam_ref":"৩৪তম, ৩০তম, ২১তম বিসিএস","options":{"ক":"এ রোগে মানবদেহের কিডনি নষ্ট করে","খ":"চিনি জাতীয় খাবার খেলে এ রোগ হয়","গ":"এ রোগ হলে রক্তে গ্লুকোজের পরিমাণ বৃদ্ধি পায়","ঘ":"ইনসুলিনের অভাবে এ রোগ হয়"},"answer":"খ","answer_text":"চিনি জাতীয় খাবার খেলে এ রোগ হয়","explanation":"অগ্ন্যাশয় থেকে নিঃসৃত ইনসুলিন হরমোনের অভাব হলে প্রোটিন, শর্করা ও স্নেহজাতীয় খাবারের বিপাক প্রক্রিয়া ব্যাহত হয় এবং রক্তের গ্লুকোজের পরিমাণ বেড়ে যায়, একে ডায়াবেটিস রোগ বলা হয়। চিনি জাতীয় খাবারের সাথে এ রোগের সম্পর্ক নেই। আমাদের দেশের মানুষের ভ্রান্ত ধারণা রয়েছে যে চিনি জাতীয় খাবার বেশি খেলে ডায়াবেটিস হয়, প্রকৃতপক্ষে অগ্ন্যাশয় থেকে নিঃসৃত ইনসুলিন হরমোনের অভাবে রক্তে গ্লুকোজের পরিমাণ বেড়ে গিয়ে ডায়াবেটিস রোগ দেখা দেয়। এর ফলে মানবদেহের কিডনি বিনষ্ট হতে পারে।"},{"id":"q0370","page":57,"printed_page":479,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.১","topic_title":"রোগজীবাণু","number":"০৭","question":"কোন বিজ্ঞানী রোগজীবাণু তত্ত্ব উদ্ভাবন করেন?","exam_ref":"২৯তম বিসিএস","options":{"ক":"ডারউইন","খ":"লুইপাস্তুর","গ":"ফ্রিন্টলী","ঘ":"ল্যাভয়সিয়ে"},"answer":"খ","answer_text":"লুইপাস্তুর","explanation":"Girolamo Fracastoro, Agostino Bassi, Friedrich Henle প্রমুখ বিজ্ঞানী লুই পাস্তুরের অনেক পূর্বেই রোগ জীবাণু তত্ত্বের (Germ theory of disease) প্রস্তাব করেন। তবে ফরাসি বিজ্ঞানী লুই পাস্তুরই (Louis Pasteur) সর্বপ্রথম পরীক্ষার সাহায্যে রোগজীবাণু তত্ত্ব প্রমাণ করেন।"},{"id":"q0371","page":57,"printed_page":479,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.১","topic_title":"রোগজীবাণু","number":"০৮","question":"জেমস গ্রান্টের মতে প্রতিরোধযোগ্য পীড়ায় বিশ্বে প্রতিদিন শিশু মৃত্যুর সংখ্যা-","exam_ref":"১২তম বিসিএস","options":{"ক":"8,00,000","খ":"80,000","গ":"88,000","ঘ":"58,000"},"answer":"খ","answer_text":"80,000","explanation":""},{"id":"q0372","page":57,"printed_page":479,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"০১","question":"ভাইরাস সম্পর্কে কোন বিবৃতিটি সঠিক?","exam_ref":"৫০তম বিসিএস","options":{"ক":"এদের যেকোনো সিনথেটিক নিউট্রিয়েন্ট মিডিয়ামে কালচার করা যায়","খ":"এদের জেনেটিক উপাদান হিসেবে ডিএনএ এবং আরএনএ থাকে","গ":"এরা এক ধরনের অন্তঃকোষীয় পরজীবী","ঘ":"ভাইরাস হলো অণুবীক্ষণিক জীবন্ত প্রাণী"},"answer":"গ","answer_text":"এরা এক ধরনের অন্তঃকোষীয় পরজীবী","explanation":"ভাইরাস হলো অতি অণুবীক্ষণিক এক প্রকার সত্তা যা শুধু জীবিত কোষে বংশবৃদ্ধি করতে পারে, তাই একে বাধ্যতামূলক অন্তঃকোষীয় পরজীবী বলা হয়। এদের নিজস্ব কোনো বিপাকীয় ক্ষমতা নেই এবং কোনো কৃত্রিম পুষ্টি মাধ্যমে (Synthetic Media) এদের চাষ বা কালচার করা অসম্ভব। ভাইরাসের গঠন খুবই সরল; এদের কেন্দ্রে জেনেটিক উপাদান হিসেবে DNA অথবা RNA থাকে (কখনোই দুটি একসাথে থাকে না) এবং বাইরে একটি প্রোটিন আবরণ থাকে। ভাইরাসকে জীবন্ত প্রাণী বলা যায় না, কারণ কোষের বাইরে এরা জড় পদার্থের মতো আচরণ করে কিন্তু জীবন্ত কোষের সংস্পর্শে এলে প্রাণের লক্ষণ প্রকাশ করে। এ কারণেই বিজ্ঞানীরা ভাইরাসকে জীব ও জড়ের মধ্যবর্তী এক অবস্থা হিসেবে বিবেচনা করেন।"},{"id":"q0373","page":57,"printed_page":479,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"০২","question":"কোনটির দেহে নিউক্লিয়াস ও সাইটোপ্লাজম নেই?","exam_ref":"৫০তম বিসিএস","options":{"ক":"শৈবাল","খ":"ছত্রাক","গ":"ভাইরাস","ঘ":"ব্যাকটেরিয়া"},"answer":"গ","answer_text":"ভাইরাস","explanation":"শৈবাল (Algae): ক্লোরোফিলযুক্ত স্বভোজী উদ্ভিদ, সূর্যালোক ব্যবহার করে নিজের খাদ্য নিজে তৈরি করে; দেহে সুগঠিত নিউক্লিয়াস ও সাইটোপ্লাজম থাকে; সাধারণত জলজ পরিবেশে জন্মে। ছত্রাক (Fungi): ক্লোরোফিলবিহীন পরভোজী জীব, মৃত জৈব বস্তু বা অন্য জীবের ওপর নির্ভরশীল; কোষে সুগঠিত নিউক্লিয়াস ও সাইটোপ্লাজম থাকলেও সালোকসংশ্লেষণ করতে পারে না। ব্যাকটেরিয়া (Bacteria): এককোষী আদি-কোষী (Prokaryotic) জীব; দেহে সাইটোপ্লাজম থাকলেও কোনো সুগঠিত নিউক্লিয়াস থাকে না (নিউক্লিয়ার মেমব্রেন অনুপস্থিত); মাটি, পানি, বাতাস ও অন্য জীবের দেহে বাস করতে পারে। ভাইরাস (Virus): অকোষীয় অতি অণুবীক্ষণিক সত্তা; দেহে নিউক্লিয়াস, সাইটোপ্লাজম বা কোনো কোষীয় অঙ্গানু নেই; কেবল প্রোটিন আবরণ এবং জেনেটিক উপাদান (DNA বা RNA) দিয়ে গঠিত।"},{"id":"q0374","page":57,"printed_page":479,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"০৩","question":"গমের মোজাইক ভাইরাস কীভাবে ছড়ায়?","exam_ref":"৪৬তম বিসিএস","options":{"ক":"ইঁদুরের মাধ্যমে","খ":"মাইটের মাধ্যমে","গ":"বাতাসের মাধ্যমে","ঘ":"পাখির মাধ্যমে"},"answer":"খ","answer_text":"মাইটের মাধ্যমে","explanation":"মাইট হলো এক প্রকার ক্ষুদ্রাতিক্ষুদ্র মাকড়সা জাতীয় পোকা। গমের মোজাইক ভাইরাস মাইটের মাধ্যমে ছড়ায়।"},{"id":"q0375","page":58,"printed_page":480,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"০৪","question":"কোভিড-১৯ যে ধরনের ভাইরাস-","exam_ref":"৪৩তম বিসিএস","options":{"ক":"DNA","খ":"DNA + RNA","গ":"mRNA","ঘ":"RNA"},"answer":"ঘ","answer_text":"RNA","explanation":"ভাইরাস ২ ধরনের হয়ে থাকে: DNA ও RNA ভাইরাস। কোভিড-১৯ একটি RNA ভাইরাস। এর নিউক্লিওক্যাপসিড সর্পিলাকৃতির। এর জিনোমের আকার সাধারণত ২৭ থেকে ৩৪ কিলো বেস-পেয়ারের মধ্যে হয়ে থাকে যা এ ধরনের RNA ভাইরাসের মধ্যে সর্ববৃহৎ। সাধারণত নাক কিংবা গলার শ্লেষ্মা পরীক্ষাগারে নিয়ে RRT-PCR: Real-time Reverse Transcription Polymerase Chain Reaction এর মাধ্যমে এই রোগ নির্ণয় করা যায়।"},{"id":"q0376","page":58,"printed_page":480,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"০৫","question":"নিম্নের কোন রোগটি DNA ভাইরাসঘটিত?","exam_ref":"৪৩তম বিসিএস","options":{"ক":"ডেঙ্গুজ্বর","খ":"স্মলপক্স","গ":"কোভিড-১৯","ঘ":"পোলিও"},"answer":"খ","answer_text":"স্মলপক্স","explanation":"স্মলপক্স বা গুটিবসন্ত একটি দ্বি-সূত্রক DNA ভাইরাস যা হোস্ট কোষের সাইটোপ্লাজমে প্রতিলিপন করে। বাকি গুলো RNA ভাইরাস।"},{"id":"q0377","page":58,"printed_page":480,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"০৬","question":"ডেঙ্গু রোগ ছড়ায়-","exam_ref":"৩৮তম, ৩৪তম বিসিএস","options":{"ক":"Aedes aegypti মশা","খ":"House flies","গ":"Anopheles মশা","ঘ":"ইঁদুর ও কাঠবিড়ালী"},"answer":"ক","answer_text":"Aedes aegypti মশা","explanation":"'ডেঙ্গু' ভাইরাসজনিত মশাবাহিত একটি মারাত্মক রোগ। এডিস মশার কামড়ে বিশেষ করে Aedes aegypti (এডিস এজিপ্টাই) প্রজাতির মশার মাধ্যমে এটা ছড়িয়ে পড়ে। এছাড়াও এডিস এলবোপিকটাস মশার কামড়েও ডেঙ্গু রোগ ছড়াতে পারে। Anopheles মশার কামড়ে ম্যালেরিয়া রোগ হয় এবং কিউলেক্স মশা ফাইলেরিয়া বা গোদ রোগ সৃষ্টি করে।"},{"id":"q0378","page":58,"printed_page":480,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"০৭","question":"নিচের কোনটি ভাইরাসের (VIRUS) জন্য সত্য নয়?","exam_ref":"৩৭তম বিসিএস","options":{"ক":"ডিএনএ বা আরএনএ থাকে","খ":"শুধুমাত্র জীবদেহের অভ্যন্তরে সংখ্যাবৃদ্ধি করে","গ":"স্ফটিক দানায় রূপান্তরিত করা যায় (CRYSTALIZATION)","ঘ":"রাইবোজোম (Ribosome) থাকে"},"answer":"ঘ","answer_text":"রাইবোজোম (Ribosome) থাকে","explanation":"অকোষীয় অণুজীব ভাইরাসের বৈশিষ্ট্য হলো- এতে DNA বা RNA আছে, জীবদেহের অভ্যন্তরে এরা সংখ্যাবৃদ্ধি করতে পারে, এদেরকে crystal বা স্ফটিক দানায় রূপান্তরিত করা যায়। এদের কোষপ্রাচীর, নিউক্লিয়াস, কোষীয় ক্ষুদ্রাঙ্গ এবং বিপাকীয় এনজাইম নেই। সুতরাং এখানে রাইবোজোমও থাকবে না।"},{"id":"q0379","page":58,"printed_page":480,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"০৮","question":"ভাইরাসজনিত রোগ নয় কোনটি?","exam_ref":"৩৬তম বিসিএস","options":{"ক":"জন্ডিস","খ":"এইডস","গ":"নিউমোনিয়া","ঘ":"চোখ ওঠা"},"answer":"গ","answer_text":"নিউমোনিয়া","explanation":"ভাইরাসঘটিত রোগসমূহ হলো- হাম, পোলিও, ডেঙ্গু, জলবসন্ত, গুটিবসন্ত, চিকুনগুনিয়া, এইডস, মাম্পস, জন্ডিস, হার্পিস, সোয়াইন ফ্লু, বার্ড ফ্লু, করোনা, জলাতঙ্ক, ইনফ্লুয়েঞ্জা ইত্যাদি। ব্যাকটেরিয়াঘটিত রোগসমূহ হলো- কলেরা, টাইফয়েড, যক্ষ্মা, ধনুষ্টংকার, নিউমোনিয়া, গনোরিয়া, সিফিলিস, কুষ্ঠরোগ, আমাশয় ইত্যাদি।"},{"id":"q0380","page":58,"printed_page":480,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"০৯","question":"জন্ডিসে আক্রান্ত হয়-","exam_ref":"৩৩তম বিসিএস","options":{"ক":"যকৃত","খ":"কিডনি","গ":"পাকস্থলী","ঘ":"হৃৎপিণ্ড"},"answer":"ক","answer_text":"যকৃত","explanation":"শরীরের জলীয় অংশে এবং রক্তে বিলিরুবিন (স্বাভাবিক মাত্রা ০.২-০.৮ মি.গ্রা./ডেসি.লি.) নামক পিত্ত উপাদানের আধিক্যের কারণে শরীরের ত্বক ও শ্লেষ্মাঝিল্লি হলুদ বর্ণ ধারণ করার ফলে সৃষ্ট রোগের নাম জন্ডিস বা পাণ্ডুরোগ বা কামেলা রোগ। এ রোগে আক্রান্ত (লিভার) ছাড়াও প্লীহা, রক্ত ইত্যাদি আক্রান্ত হয়।"},{"id":"q0381","page":58,"printed_page":480,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"১০","question":"যকৃতের রোগ কোনটি?","exam_ref":"৩২তম বিসিএস","options":{"ক":"জন্ডিস","খ":"টাইফয়েড","গ":"হাম","ঘ":"কলেরা"},"answer":"ক","answer_text":"জন্ডিস","explanation":"রক্তে বিলিরুবিনের পরিমাণ বেড়ে গেলে শরীর ও চোখ হলুদ বর্ণ ধারণ করে, যা জন্ডিস নামে পরিচিত। জন্ডিস হলে লিভার বড় হয়ে যায়। এটি একটি পানিবাহিত ভাইরাসজনিত রোগ।"},{"id":"q0382","page":58,"printed_page":480,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"১১","question":"ডেঙ্গু জ্বরের বাহক কোন মশা?","exam_ref":"৩০তম, ২৪তম (বাতিল), ২২তম বিসিএস","options":{"ক":"কিউলেক্স","খ":"এডিস","গ":"অ্যানোফিলিস","ঘ":"সব ধরনের মশা"},"answer":"খ","answer_text":"এডিস","explanation":"অ্যানোফিলিস মশা ম্যালেরিয়া, কিউলেক্স মশা ফাইলেরিয়া এবং এডিস মশা ডেঙ্গু, চিকুনগুনিয়া, পীতজ্বর এবং জিকা জ্বরের জীবাণু বহন করে।"},{"id":"q0383","page":58,"printed_page":480,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"১২","question":"ক্যান্সার রোগের কারণ কি?","exam_ref":"২৮তম বিসিএস","options":{"ক":"কোষের অস্বাভাবিক মৃত্যু","খ":"কোষের অস্বাভাবিক বৃদ্ধি","গ":"কোষের অস্বাভাবিক জমাট বাঁধা","ঘ":"উপরের সবগুলো"},"answer":"খ","answer_text":"কোষের অস্বাভাবিক বৃদ্ধি","explanation":"গবেষণায় দেখা গেছে, বিভিন্ন প্রকার 'প্যাপিলোমা ভাইরাস' ক্যান্সার কোষ সৃষ্টিতে সহায়তা করে। এ ভাইরাসের ই৬ ও ই৭ নামের দুটি জিন পোষক কোষের জিনের সাথে অন্তর্ভুক্ত হয়ে যায় এবং কোষের বৃদ্ধি নিয়ন্ত্রণকারী প্রোটিন অণুসমূহের কাজ বন্ধ করে দেয়। এর ফলে ঘটে অস্বাভাবিক কোষ বিভাজন অর্থাৎ কোষ সংখ্যার অস্বাভাবিক বৃদ্ধি। কোষ সংখ্যার এই অস্বাভাবিক বৃদ্ধির ফলেই ক্যান্সার রোগের সৃষ্টি হয়।"},{"id":"q0384","page":58,"printed_page":480,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.২","topic_title":"ভাইরাসঘটিত রোগ","number":"১৩","question":"বিলিরুবিন তৈরি হয়-","exam_ref":"২৭তম বিসিএস","options":{"ক":"পিত্তথলিতে","খ":"কিডনিতে","গ":"প্লীহায়","ঘ":"যকৃতে"},"answer":"গ","answer_text":"প্লীহায়","explanation":"বিলিরুবিন হচ্ছে পিত্তরসের কমলা রঙের প্রধান রঞ্জক পদার্থ। হিমোগ্লোবিনের প্রধান দুটি উপাদান- প্রোটিন অংশ গ্লোবিন ও লৌহযুক্ত অংশ হিম (heme)। হিম ভেঙে শেষ পর্যন্ত বিলিরুবিনে পরিণত হয়। বিলিরুবিন তৈরি হয় প্লীহায়। রক্তে বিলিরুবিনের স্বাভাবিক মাত্রা ০.২-০.৮ মিলিগ্রাম/ডেসিলিটার। রক্তে বিলিরুবিনের মাত্রা বেড়ে যাওয়াকে জন্ডিস বা পাণ্ডুরোগ বলে।"},{"id":"q0385","page":59,"printed_page":481,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.৩","topic_title":"ব্যাকটেরিয়ার গঠন ও সৃষ্ট রোগ","number":"০১","question":"ব্যাকটেরিয়ার গতিশীলতার জন্য তার যে গঠন দায়ী তা হলো-","exam_ref":"৪৪তম বিসিএস","options":{"ক":"পিলি","খ":"ফ্ল্যাজেলা","গ":"শীথ","ঘ":"ক্যাপসুলস"},"answer":"খ","answer_text":"ফ্ল্যাজেলা","explanation":"ফ্ল্যাজেলা প্রোটোপ্লাজম দিয়ে গঠিত এক প্রকার সূত্রাকৃতির উপাঙ্গ যা কোষ প্রাচীর ভেদ করে বাইরে বেরিয়ে আসে। ফ্ল্যাজেলা ব্যাকটেরিয়ার গতিশীলতা বা গতিবিধি চলাচলে সহায়তা করে। এটি কোষের পৃষ্ঠতলের সাথে বিশেষভাবে কোষের ঝিল্লি বা সাইটোপ্লাজমের সাথে লেগে থাকে এবং গতিশীলতাকে উৎসাহিত করে। প্রোক্যারিওটে ফ্ল্যাজেলা গঠন সহজ এবং এতে মূলত তিনটি অংশ রয়েছে।"},{"id":"q0386","page":59,"printed_page":481,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.৩","topic_title":"ব্যাকটেরিয়ার গঠন ও সৃষ্ট রোগ","number":"০২","question":"ব্যাকটেরিয়ার কোষে নিচের কোনটি উপস্থিত?","exam_ref":"৩৮তম বিসিএস","options":{"ক":"প্লাস্টিড","খ":"মাইটোকন্ড্রিয়া","গ":"নিউক্লিওলাস","ঘ":"ক্রোমাটিন বস্তু"},"answer":"ঘ","answer_text":"ক্রোমাটিন বস্তু","explanation":"ব্যাকটেরিয়া এককোষী, ফিলামেন্টাস, কলোনিয়াল। ব্যাকটেরিয়ার কোষে ক্রোমাটিন বস্তু থাকে কিন্তু নিউক্লিওলাস ও নিউক্লিয়ার পর্দা নেই। এদের কোষে প্লাস্টিড, মাইটোকন্ড্রিয়া, এন্ডোপ্লাজমিক জালিকা ইত্যাদি নেই। এরা আদিকোষ (নিউক্লিয়াস সুগঠিত নয়) বিশিষ্ট এককোষী, আণুবীক্ষণিক জীব।"},{"id":"q0387","page":59,"printed_page":481,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.৩","topic_title":"ব্যাকটেরিয়ার গঠন ও সৃষ্ট রোগ","number":"০৩","question":"কোনটি এন্টিবায়োটিক?","exam_ref":"৩৩তম বিসিএস","options":{"ক":"ইনসুলিন","খ":"পেপসিন","গ":"পেনিসিলিন","ঘ":"ইথিলিন"},"answer":"গ","answer_text":"পেনিসিলিন","explanation":"পেনিসিলিন একটি এন্টিবায়োটিক। ১৯২৮ সালে পেনিসিলিন আবিষ্কার করেন আলেকজান্ডার ফ্লেমিং। ইনসুলিনের অভাবে ডায়াবেটিস রোগ হয়। পেপসিন নামক এনজাইম প্রোটিন পরিপাকে সহায়তা করে। ফল পাকানোর জন্য দায়ী ফাইটোহরমোনের নাম ইথিলিন।"},{"id":"q0388","page":59,"printed_page":481,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.৩","topic_title":"ব্যাকটেরিয়ার গঠন ও সৃষ্ট রোগ","number":"০৪","question":"এন্টিবায়োটিকের কাজ-","exam_ref":"৩২তম বিসিএস","options":{"ক":"রোগ প্রতিরোধের ক্ষমতা বৃদ্ধি করা","খ":"জীবাণু ধ্বংস করা","গ":"ভাইরাস ধ্বংস করা","ঘ":"দ্রুত রোগ নিরাময় করা"},"answer":"খ","answer_text":"জীবাণু ধ্বংস করা","explanation":"যেসব রাসায়নিক পদার্থ ব্যাকটেরিয়ার মতো ক্ষুদ্র ক্ষুদ্র রোগ জীবাণুকে ধ্বংস করে কিংবা এদের বংশবৃদ্ধি রোধ করে সেসব পদার্থকে এন্টিবায়োটিক বলে। যেমন- পেনিসিলিন, ক্লোরোমাইসিন প্রভৃতি।"},{"id":"q0389","page":59,"printed_page":481,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.৩","topic_title":"ব্যাকটেরিয়ার গঠন ও সৃষ্ট রোগ","number":"০৫","question":"নিউমোনিয়া রোগে আক্রান্ত হয় মানব দেহের-","exam_ref":"২৬তম বিসিএস","options":{"ক":"ফুসফুস","খ":"নবত","গ":"কিডনি","ঘ":"প্লীহা"},"answer":"ক","answer_text":"ফুসফুস","explanation":"ফুসফুসের প্রদাহকে নিউমোনিয়া বলে। এটি ব্যাকটেরিয়া ঘটিত রোগ। অপরদিকে যকৃতের প্রদাহকে হেপাটাইটিস (ভাইরাস ঘটিত) এবং কিডনির প্রদাহকে নেফ্রাইটিস বলে।"},{"id":"q0390","page":59,"printed_page":481,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.৪","topic_title":"ইমিউনাইজেশন ও ভ্যাকসিনেশন","number":"০১","question":"'কোভিড-১৯'-এর জন্য তৈরি টিকা কীভাবে কাজ করে?","exam_ref":"৪০তম বিসিএস","options":{"ক":"রোগ প্রতিরোধ ক্ষমতা উদ্দীপিত করার জন্য দুর্বল ভাইরাসের একটি রূপ প্রবর্তন করে","খ":"পরিশোধিত ভাইরাল প্রোটিনের সাবইউনিট প্রবেশ করানোর মাধ্যমে","গ":"হোস্ট কোষে জেনেটিক উপাদান বহন করার জন্য একটি ভাইরাস ঘটিত বাহক ব্যবহার করে","ঘ":"mRNA সরবরাহ করে যা হোস্ট কোষগুলোকে একটি ভাইরাল প্রোটিন তৈরির নির্দেশ দেয়"},"answer":"ঘ","answer_text":"mRNA সরবরাহ করে যা হোস্ট কোষগুলোকে একটি ভাইরাল প্রোটিন তৈরির নির্দেশ দেয়","explanation":"কোভিড-১৯-এর mRNA টিকাগুলো শরীরে কোনো সরাসরি ভাইরাস প্রবেশ করায় না। পরিবর্তে, এগুলো শরীরের কোষগুলোতে একটি বিশেষ জেনেটিক সংকেত বা 'মেসেঞ্জার আরএনএ' (mRNA) পাঠিয়ে দেয়। এই সংকেতটি আমাদের কোষগুলোকে করোনাভাইরাসের বাইরের অংশের মতো একটি নির্দিষ্ট 'স্পাইক প্রোটিন' তৈরি করে শিখিয়ে দেয়। যখন আমাদের শরীর এই প্রোটিনটি তৈরি করে, তখন আমাদের রোগ প্রতিরোধ ব্যবস্থা বা ইমিউন সিস্টেম একে বহিরাগত শক্তি হিসেবে শনাক্ত করে এবং এর বিরুদ্ধে অ্যান্টিবডি তৈরি করে। ফলে ভবিষ্যতে আসল করোনাভাইরাস শরীরে প্রবেশ করলে আমাদের রোগ প্রতিরোধ ব্যবস্থা দ্রুত সেটি চিনতে পারে এবং কার্যকরভাবে ভাইরাসটিকে ধ্বংস করতে সক্ষম হয়।"},{"id":"q0391","page":60,"printed_page":482,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.৪","topic_title":"ইমিউনাইজেশন ও ভ্যাকসিনেশন","number":"০২","question":"EPI-এর পূর্ণরূপ কী?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"Extended Program on immunization","খ":"Expanded program on immunization","গ":"Essential polio immunization","ঘ":"Extended pediatric immunization"},"answer":"খ","answer_text":"Expanded program on immunization","explanation":"সম্প্রসারিত টিকাদান কর্মসূচি (ইংরেজি: Expanded Program on Immunization, সংক্ষেপে EPI) হল বিশ্ব স্বাস্থ্য সংস্থা (WHO) কর্তৃক পরিচালিত টিকাদান কর্মসূচি, যার লক্ষ্য সারা পৃথিবীর সকল শিশুকে এ কর্মসূচির অধীনে নিয়ে আসা। WHO বিশ্বব্যাপী শিশুদের টিকা কর্মসূচির অংশ হিসেবে ১৯৭৪ সালের মে মাসে সম্প্রসারিত টিকাদান কর্মসূচি শুরু করে। বাংলাদেশে ৭ এপ্রিল ১৯৭৯ সালে ১ বছরের কম বয়সী শিশুদের জন্য এ কর্মসূচি শুরু হয় (হাম, ডিপথেরিয়া, হুপিংকাশি, হাম, পোলিও-মাইলাইটিস ও ধনুষ্টংকার নিয়ে)। পরবর্তীতে ২০০৩ সাল থেকে হেপাটাইটিস রোগের টিকা, ২০০৯ সাল থেকে হেমোফাইলাস রোগের টিকা এবং ২০১৫ সাল থেকে নিউমোনিয়ার টিকা দেওয়া হচ্ছে।"},{"id":"q0392","page":60,"printed_page":482,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.৪","topic_title":"ইমিউনাইজেশন ও ভ্যাকসিনেশন","number":"০৩","question":"শিশুদের ভিটামিন এ ক্যাপসুল দিতে হয়-","exam_ref":"৪৪তম বিসিএস","options":{"ক":"বছরে একবার","খ":"বছরে দুইবার","গ":"বছরে তিনবার","ঘ":"এর কোনটিই নয়"},"answer":"খ","answer_text":"বছরে দুইবার","explanation":"শিশুদের ভিটামিন 'এ' ক্যাপসুল খাওয়ানো হয় বছরে দুইবার। এর উপকারিতা- শিশুর রাতকানা ও অন্ধত্ব রোগ প্রতিরোধ করে এবং শিশুর শরীরে রোগ প্রতিরোধ ক্ষমতা বাড়ায়।"},{"id":"q0393","page":60,"printed_page":482,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.৪","topic_title":"ইমিউনাইজেশন ও ভ্যাকসিনেশন","number":"০৪","question":"মা-এর রক্তে হেপাটাইটিস-বি (Hepatitis-B) ভাইরাস থাকলে নবজাতকের স্বাস্থ্যঝুঁকি ব্যবস্থাপনা কি হওয়া উচিত?","exam_ref":"৩৮তম বিসিএস","options":{"ক":"৩০ দিনের মধ্যে ভ্যাকসিন দিতে হবে","খ":"৭ দিন ইনকিউবেটরে রাখতে হবে","গ":"জন্মের ১২ ঘণ্টার মধ্যে ভ্যাকসিন ও এইচবিআইজি (HBIG) শট দিতে হবে","ঘ":"জন্মের ১ মাস পর কেবলমাত্র (HBIG) শট দিতে হবে"},"answer":"গ","answer_text":"জন্মের ১২ ঘণ্টার মধ্যে ভ্যাকসিন ও এইচবিআইজি (HBIG) শট দিতে হবে","explanation":"যদি কোনো মা হেপাটাইটিস-বি দ্বারা আক্রান্ত থাকেন তবে তার গর্ভজাত সন্তানকে জন্মের ১২ ঘণ্টার মধ্যে ভ্যাকসিন দিতে হবে। তবে এর সাথে এইচবিআইজি (HBIG)-এর শটও দিতে হবে এ ভাইরাসের বিরুদ্ধে প্রতিরোধ গড়ে তোলার জন্য। মায়ের শরীরে হেপাটাইটিস-B-এর জীবাণুর উপস্থিতি শনাক্ত না হলে শিশুর জন্মের পর ২৪ ঘণ্টার মধ্যে ভ্যাকসিন প্রয়োগ করলেও চলে।"},{"id":"q0394","page":60,"printed_page":482,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.৪","topic_title":"ইমিউনাইজেশন ও ভ্যাকসিনেশন","number":"০৫","question":"মানবদেহে রোগ প্রতিরোধে প্রাথমিক প্রতিরক্ষাস্তরের (First line of defence) অন্তর্ভুক্ত নয় কোনটি?","exam_ref":"৩৭তম বিসিএস","options":{"ক":"লাইসোজাইম (LYSOZYME)","খ":"গ্যাস্ট্রিক জুস (GASTRIC JUICE)","গ":"সিলিয়া (CILIA)","ঘ":"লিম্ফোসাইট (LYMPHOCYTES)"},"answer":"ঘ","answer_text":"লিম্ফোসাইট (LYMPHOCYTES)","explanation":"মানবদেহে ৩ স্তরের প্রাকৃতিক প্রতিরক্ষা ব্যবস্থা বিদ্যমান। প্রাথমিক প্রতিরক্ষা স্তর: ত্বক ও ত্বকগ্রন্থি/ঘর্মগ্রন্থি, সিলিয়া, মিউকাস, লালা রসের লাইসোজাইম, পাকস্থলীর হাইড্রোক্লোরিক অ্যাসিড (HCl) ইত্যাদি। দ্বিতীয় প্রতিরক্ষা স্তর: ফ্যাগোসাইট (বড় আকারের শ্বেত রক্তকণিকা যা অণুজীব ও বহিরাগত কণা ভক্ষণ করে) এবং লিম্ফোসাইট (T কোষ ও B কোষ, যা টিউমার কোষ ও ভাইরাস আক্রান্ত কোষ ধ্বংস করে)। তৃতীয় প্রতিরক্ষা স্তর: বহিরাগত অণুজীব শনাক্ত করে স্মৃতিতে ধরে রেখে বছরের পর বছর প্রতিরোধ করে। যেহেতু লিম্ফোসাইট দ্বিতীয় স্তরের অংশ, তাই এটি প্রাথমিক প্রতিরক্ষা স্তরের অন্তর্ভুক্ত নয়।"},{"id":"q0395","page":60,"printed_page":482,"chapter":"অধ্যায় ১৬","chapter_title":"রোগ ও স্বাস্থ্য","topic_code":"১৬.৪","topic_title":"ইমিউনাইজেশন ও ভ্যাকসিনেশন","number":"০৬","question":"ভায়াগ্রা কি?","exam_ref":"১৯তম বিসিএস","options":{"ক":"একটি জলপ্রপাত","খ":"নতুন একটি ঔষধ","গ":"সাড়া জাগানো চলচ্চিত্রের নাম","ঘ":"নতুন জাহাজের নাম"},"answer":"খ","answer_text":"নতুন একটি ঔষধ","explanation":"সিলডেনাফিল সাইট্রেট যা ভায়াগ্রা এবং অন্যান্য বাণিজ্যিক নামে বিক্রি হয়ে থাকে, এমন একটি ঔষধ যা পুরুষের ধ্বজভঙ্গের (ইরেকটাইল ডিসফাংশান) ক্ষেত্রে ব্যবহার করা হয়। এছাড়াও হৃদপিণ্ডের ধমনির উচ্চ রক্তচাপের চিকিৎসায়ও ব্যবহৃত হয়ে থাকে। এটি ফাইজার কোম্পানির বিজ্ঞানী এন্ড্রু বেল, ডেভিড ব্রাউন এবং নিকোলাস টেরেট ১৯৯৮ সালে আবিষ্কার করেন।"},{"id":"q0396","page":61,"printed_page":483,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.১","topic_title":"বায়ুমণ্ডলের উপাদান ও বিভিন্ন স্তর","number":"০১","question":"প্রত্যয়ন বায়ু উত্তর গোলার্ধে ___ দিক থেকে ___ দিকে প্রবাহিত হয়?","exam_ref":"৫০তম বিসিএস","options":{"ক":"পূর্ব, পশ্চিম","খ":"দক্ষিণপশ্চিম, উত্তরপূর্ব","গ":"উত্তর, দক্ষিণ","ঘ":"উত্তর, পশ্চিম"},"answer":"খ","answer_text":"দক্ষিণপশ্চিম, উত্তরপূর্ব","explanation":"প্রত্যয়ন বায়ু (Westerlies): এটি ক্রান্তীয় উচ্চচাপ বলয় থেকে সুমেরু ও কুমেরু বৃত্তীয় নিম্নচাপ বলয়ের দিকে প্রবাহিত হয়। ফেরেলের সূত্রানুসারে উত্তর গোলার্ধে এই বায়ু তার গন্তব্য পথের ডানদিকে বেঁকে যায়। অর্থাৎ দক্ষিণ-পশ্চিম দিক থেকে আসে এবং উত্তর-পূর্ব দিকে ধাবিত হয়।"},{"id":"q0397","page":61,"printed_page":483,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.১","topic_title":"বায়ুমণ্ডলের উপাদান ও বিভিন্ন স্তর","number":"০২","question":"কোন গ্যাস গ্রিন হাউস ইফেক্ট ঘটায়?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"হাইড্রোজেন","খ":"নাইট্রোজেন","গ":"অক্সিজেন","ঘ":"মিথেন"},"answer":"ঘ","answer_text":"মিথেন","explanation":"গ্রিনহাউস ইফেক্ট (বা গ্রিনহাউস প্রভাব) হলো একটি প্রাকৃতিক প্রক্রিয়া যেখানে বায়ুমণ্ডলের গ্রিনহাউস গ্যাস (যেমন: কার্বন ডাই অক্সাইড, মিথেন, জলীয় বাষ্প) পৃথিবী থেকে বিকিরিত তাপকে শোষণ করে এবং বায়ুমণ্ডলের নিচের স্তরে ফিরিয়ে দেয়, যার ফলে পৃথিবীর তাপমাত্রা বৃদ্ধি পায়। হাইড্রোজেন, নাইট্রোজেন ও অক্সিজেন বায়ুর প্রধান উপাদান হলেও এরা তাপীয় বিকিরণ শোষণ করতে না পারায় গ্রিনহাউস প্রভাব সৃষ্টি করে না। অন্যদিকে, মিথেন (CH₄) একটি শক্তিশালী গ্রিনহাউস গ্যাস, যা সূর্যের আলো দ্বারা উত্তপ্ত তাপকে বায়ুমণ্ডলে ধরে রাখে ও পৃথিবীর উষ্ণতা বৃদ্ধি করে।"},{"id":"q0398","page":61,"printed_page":483,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.১","topic_title":"বায়ুমণ্ডলের উপাদান ও বিভিন্ন স্তর","number":"০৩","question":"নিচের কোনটি গ্রিনহাউজ গ্যাস নয়?","exam_ref":"৪৬তম বিসিএস","options":{"ক":"জলীয় বাষ্প (H₂O)","খ":"কার্বন ডাইঅক্সাইড (CO₂)","গ":"মিথেন (CH₄)","ঘ":"নাইট্রিক অক্সাইড (NO)"},"answer":"ঘ","answer_text":"নাইট্রিক অক্সাইড (NO)","explanation":"জলীয় বাষ্প (H₂O), কার্বন ডাই অক্সাইড (CO₂), মিথেন (CH₄), নাইট্রাস অক্সাইড (N₂O), ওজোন (O₃), ক্লোরো ফ্লোরো কার্বন সমূহ (CFCs), হাইড্রোফ্লুরো কার্বন সমূহ (HCFCs and HFCs সহ) প্রভৃতি গ্রিনহাউজ গ্যাস।"},{"id":"q0399","page":61,"printed_page":483,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.১","topic_title":"বায়ুমণ্ডলের উপাদান ও বিভিন্ন স্তর","number":"০৪","question":"ওজোন স্তর বায়ুমণ্ডলের কোন স্তরে অবস্থিত?","exam_ref":"৪১তম বিসিএস","options":{"ক":"স্ট্রাটোমণ্ডল","খ":"ট্রপোমণ্ডল","গ":"মেসোমণ্ডল","ঘ":"তাপমণ্ডল"},"answer":"ক","answer_text":"স্ট্রাটোমণ্ডল","explanation":"বায়ুমণ্ডলের স্তর পাঁচটি: ট্রপোস্ফিয়ার (ভূপৃষ্ঠের নিকটতম স্তর; মেঘ, বৃষ্টিপাত, বজ্রপাত, ঝড়, তুষারপাত, শিশির, কুয়াশা এ স্তরে সৃষ্টি হয়); স্ট্রাটোস্ফিয়ার (ওজন স্তর অবস্থিত, এ স্তরেই ওজন গ্যাসের ঘনত্ব সর্বাধিক ৯০%); মেসোস্ফিয়ার (পৃথিবীর সবচেয়ে শীতলতম স্থান, তাপমাত্রা −৮৩°C); আয়োনোস্ফিয়ার (বেতার তরঙ্গ প্রতিফলিত হয়); এক্সোস্ফিয়ার (এ স্তর ic_code":"১৭.২","topic_title":"পানির ঘনত্ব, মানদণ্ড ও উৎস","number":"০২","question":"নদীর পানির ক্ষেত্রে কোনটি সত্য?","exam_ref":"৪১তম বিসিএস","options":{"ক":"COD > BOD","খ":"COD < BOD","গ":"COD = BOD","ঘ":"উপরের কোনটিই নয়"},"answer":"ক","answer_text":"COD > BOD","explanation":"বিশ্ব স্বাস্থ্য সংস্থা (WHO) অনুমোদিত পানির গ্রহণযোগ্য মানদণ্ড: pH ৬.৫-৮.৫; DO ৫.০-৬.০; BOD ৬.০ppm; COD ১০.০ppm; TDS ৫০০ ppm; ক্ষরতা (Ca²⁺, Mg²⁺) ১০০-১৫০ ppm; NaCl ৫০০ ppm (সবগুলো mgL⁻¹ এককেও প্রকাশ করা হয়)। এ জন্যই নদীর পানিতে COD এর মান BOD অপেক্ষা বেশি থাকে।"},{"id":"q0411","page":63,"printed_page":485,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.২","topic_title":"পানির ঘনত্ব, মানদণ্ড ও উৎস","number":"০৩","question":"কোন পানিতে অক্সিজেনের পরিমাণ বেশি?","exam_ref":"৪১তম বিসিএস","options":{"ক":"পুকুরের পানিতে","খ":"লেকের পানিতে","গ":"নদীর পানিতে","ঘ":"সাগরের পানিতে"},"answer":"গ","answer_text":"নদীর পানিতে","explanation":"সাধারণত নদীর পানিতে অক্সিজেনের পরিমাণ বেশি থাকে। লবণাক্ততা (সাগর) ও তাপমাত্রা বৃদ্ধি পানিতে অক্সিজেনের পরিমাণ হ্রাস করে। এছাড়াও আবদ্ধ পানির (লেক, পুকুর) চেয়ে প্রবহমান পানিতে অক্সিজেনের পরিমাণ বেশি থাকে।"},{"id":"q0412","page":63,"printed_page":485,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.২","topic_title":"পানির ঘনত্ব, মানদণ্ড ও উৎস","number":"০৪","question":"কোথায় সাঁতার কাটা সহজ?","exam_ref":"৪০তম, ১৪তম বিসিএস","options":{"ক":"পুকুরে","খ":"খালে","গ":"নদীতে","ঘ":"সাগরে"},"answer":"ঘ","answer_text":"সাগরে","explanation":"যে পানির ঘনত্ব বেশি সে পানিতে সাঁতার কাটা সহজ। সমুদ্রের পানিতে ২.৫% থেকে ৩.০% লবণ দ্রবীভূত অবস্থায় থাকে যার ফলে পুকুর, নদী বা বিলের পানির চেয়ে সমুদ্রের পানির ঘনত্ব বেশি। তাই সমুদ্রের পানিতে সাঁতার কাটা সহজ হয়।"},{"id":"q0413","page":63,"printed_page":485,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.২","topic_title":"পানির ঘনত্ব, মানদণ্ড ও উৎস","number":"০৫","question":"পৃথিবীর বারিমণ্ডলের জলরাশির শতকরা কতভাগ জল ভূগর্ভে ধারণ করে?","exam_ref":"৩৮তম বিসিএস","options":{"ক":"২.০৫%","খ":"০.৬৮%","গ":"০.০১%","ঘ":"০.০০১%"},"answer":"খ","answer_text":"০.৬৮%","explanation":"জলরাশির অবস্থানভিত্তিক শতকরা হার: সমুদ্র ৯৭.২৫%, হিমবাহ ২.০৫%, ভূগর্ভস্থ পানি ০.৬৮%, হ্রদ ০.০১%, মাটির আর্দ্রতা ০.০০৫%, বায়ুমণ্ডল ০.০০১%, নদী ০.০০০১%, জীবমণ্ডল ০.০০০০৮%।"},{"id":"q0414","page":63,"printed_page":485,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.২","topic_title":"পানির ঘনত্ব, মানদণ্ড ও উৎস","number":"০৬","question":"বরফ পানিতে ভাসে কারণ বরফের তুলনায় পানির-","exam_ref":"৩৪তম বিসিএস","options":{"ক":"ঘনত্ব কম","খ":"ঘনত্ব বেশি","গ":"তাপমাত্রা বেশি","ঘ":"দ্রবণীয়তা বেশি"},"answer":"খ","answer_text":"ঘনত্ব বেশি","explanation":"কোনো বস্তুর তাপমাত্রা হ্রাস করলে আয়তন কমে যায় (V∝T)। আয়তন কমলে ঘনত্ব বেড়ে যায় (ρ=m/V)। একমাত্র ব্যতিক্রমী প্রসারণ হচ্ছে পানির — পানির তাপমাত্রা কমিয়ে ৪°C এ আনলে তার ঘনত্ব সর্বোচ্চ হয়। কিন্তু পানির হিমাঙ্ক ০°C, অর্থাৎ পানি ০°C তাপমাত্রায় বরফে পরিণত হয় এবং এর ঘনত্ব কমে আয়তন বেড়ে যায় (১L পানি বরফে পরিণত হলে আয়তন বেড়ে ১২/১১ L হয়)। কোনো বস্তুর ঘনত্ব পানির চেয়ে বেশি হলে তা পানিতে ডুবে এবং কম হলে তা পানিতে ভাসে। পানি বরফে পরিণত হলে তার ঘনত্ব পানির চেয়ে কমে যায় তাই বরফ পানির তৈরি হলেও তা পানিতে ভাসে।"},{"id":"q0415","page":63,"printed_page":485,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.২","topic_title":"পানির ঘনত্ব, মানদণ্ড ও উৎস","number":"০৭","question":"প্রাকৃতিক কোন উৎস হতে সবচেয়ে বেশি মৃদু পানি পাওয়া যায়?","exam_ref":"৩৪তম, ২৩তম বিসিএস","options":{"ক":"নদী","খ":"হ্রদ","গ":"সাগর","ঘ":"বৃষ্টিপাত"},"answer":"ঘ","answer_text":"বৃষ্টিপাত","explanation":"মৃদু পানির প্রধান উৎস বৃষ্টিপাত। বৃষ্টিপাতের মাধ্যমে সবচেয়ে বেশি পরিমাণ মৃদু পানি পাওয়া যায়।"},{"id":"q0416","page":63,"printed_page":485,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.২","topic_title":"পানির ঘনত্ব, মানদণ্ড ও উৎস","number":"০৮","question":"ভারী পানির রাসায়নিক সংকেত-","exam_ref":"৩৩তম, ৩১তম বিসিএস","options":{"ক":"2H₂O₂","খ":"H₂O","গ":"D₂O","ঘ":"HD₂O₂"},"answer":"গ","answer_text":"D₂O","explanation":"ভারী পানি হচ্ছে পানির একটি রূপভেদ যেখানে পারমাণবিক ভর ১ সংবলিত হাইড্রোজেন পরমাণুর বদলে পারমাণবিক ভর ২ সংবলিত হাইড্রোজেনের আইসোটোপ ডিউটেরিয়াম থাকে। ভারী পানির আণবিক সংকেত D₂O। এক মোল সাধারণ পানির ভর ১৮g, অন্যদিকে এক মোল ভারী পানির ভর প্রায় ২০g।"},{"id":"q0417","page":63,"printed_page":485,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.২","topic_title":"পানির ঘনত্ব, মানদণ্ড ও উৎস","number":"০৯","question":"কত তাপমাত্রায় পানির ঘনত্ব সবচেয়ে বেশি?/ স্বাভাবিক আদর্শ পরিবেশে পানির ঘনত্ব যে তাপমাত্রায় সর্বোচ্চ মান পরিগ্রহ করে তা হলো-","exam_ref":"২৫তম, ২১তম বিসিএস","options":{"ক":"০° সেন্টিগ্রেড","খ":"১০° সেন্টিগ্রেড","গ":"৪° সেন্টিগ্রেড","ঘ":"১০০° সেন্টিগ্রেড"},"answer":"গ","answer_text":"৪° সেন্টিগ্রেড","explanation":"পানির ঘনত্ব তাপমাত্রার ওপর নির্ভর করে। ৪° সেলসিয়াস তাপমাত্রায় পানির ঘনত্ব সবচেয়ে বেশি, আর সেটি হচ্ছে ১ গ্রাম/সি.সি বা ১০০০ কেজি/মিটার কিউব। তাপমাত্রা ছাড়াও বিভিন্ন কারণে পানির ঘনত্বের তারতম্য হয় — যেমন সাগরের পানির সাথে লবণ থাকে, যার কারণে সাগরের পানির ঘনত্ব সাধারণ পানি থেকে বেশি হয়। এজন্য পুকুর বা নদীর তুলনায় সাগরের পানিতে সাঁতার কাটা অধিকতর সহজ।"},{"id":"q0418","page":64,"printed_page":486,"chapter":"অধ্যায় ১৭","chapter_title":"বায়ুমণ্ডল ও পানি","topic_code":"১৭.২","topic_title":"পানির ঘনত্ব, মানদণ্ড ও উৎস","number":"১০","question":"পানির ছোট ফোঁটা পানির যে গুণের জন্য গোলাকৃতি হয়-","exam_ref":"১৭তম বিসিএস","options":{"ক":"সান্দ্রতা","খ":"স্থিতিস্থাপকতা","গ":"প্লবতা","ঘ":"পৃষ্ঠটান"},"answer":"ঘ","answer_text":"পৃষ্ঠটান","explanation":"তরল মাত্রই একটি ধর্ম আছে আর তা হলো- তরল পৃষ্ঠ সর্বদা সংকুচিত হয়ে সর্বনিম্ন ক্ষেত্রফলে আসতে চায়। তরলের মধ্যে যে বলের প্রভাবে এই বিশেষ ধর্ম প্রকাশ পায়, সেই বলকেই পৃষ্ঠটান বলে। তাপমাত্রা বাড়লে তরলের পৃষ্ঠটান হ্রাস পায়। আন্তর্জাতিক পদ্ধতিতে পৃষ্ঠটানের একক নিউটন/মিটার (N/m)। পৃষ্ঠটানের জন্য পানির ছোট ফোঁটা বা বৃষ্টির ফোঁটা গোলাকৃতি হয়। পৃষ্ঠটানের জন্য নদীর তীরে ভিজা বালুর উপর দিয়ে হেঁটে যাবার সাথে সাথে পদচিহ্ন মুছে যায়।"},{"id":"q0 ো কার্বন ডাই-অক্সাইড নির্গত হয় না। তাই এটি পরিবেশবান্ধব বা কার্বন-মুক্ত।"},{"id":"q0439","page":67,"printed_page":489,"chapter":"অধ্যায় ১৮","chapter_title":"আমাদের সম্পদ","topic_code":"১৮.১","topic_title":"অনবায়নযোগ্য ও নবায়নযোগ্য শক্তি","number":"০২","question":"প্রাকৃতিক গ্যাসের প্রধান উপাদান হলো-","exam_ref":"৪৩তম বিসিএস","options":{"ক":"হাইড্রোজেন","খ":"নাইট্রোজেন","গ":"মিথেন","ঘ":"ইথেন"},"answer":"গ","answer_text":"মিথেন","explanation":"প্রাকৃতিক গ্যাসের মূল উপাদান মিথেন (CH₄) হলেও এর সাথে অল্প পরিমাণ অন্যান্য প্যারাফিন হাইড্রোকার্বন যেমন ইথেন, প্রোপেন, বিউটেন, পেন্টেন, হেক্সেন ইত্যাদি থাকে। এছাড়াও আরও থাকে নাইট্রোজেন, কার্বন ডাই অক্সাইড ও হাইড্রোজেন সালফাইড। প্রাকৃতিক গ্যাসে মিথেন ৮০%-৯০%, ইথেন ১৩%, প্রোপেন ৩% থাকে। তবে বাংলাদেশে যে প্রাকৃতিক গ্যাস পাওয়া যায় তাতে মিথেনের পরিমাণ প্রায় ৯৫-৯৯%।"},{"id":"q0440","page":67,"printed_page":489,"chapter":"অধ্যায় ১৮","chapter_title":"আমাদের সম্পদ","topic_code":"১৮.১","topic_title":"অনবায়নযোগ্য ও নবায়নযোগ্য শক্তি","number":"০৩","question":"নবায়নযোগ্য জ্বালানির উৎস-","exam_ref":"৪০তম বিসিএস","options":{"ক":"তেল","খ":"গ্যাস","গ":"কয়লা","ঘ":"বায়োগ্যাস"},"answer":"ঘ","answer_text":"বায়োগ্যাস","explanation":"যেসব জ্বালানি নানা প্রাকৃতিক উৎস থেকে পাওয়া যায়, যেগুলোর মজুদ ভবিষ্যতে কখনো শেষ হবে না অর্থাৎ বারবার ব্যবহার করা যায় তাদেরকে নবায়নযোগ্য জ্বালানি বলে। সূর্যরশ্মি, বায়োগ্যাস, পানি শক্তি, বায়ু শক্তি, বায়োফুয়েল ইত্যাদি নবায়নযোগ্য জ্বালানির উৎস। স্থিতিশীল টেকসই উন্নয়নের প্রথম শর্ত দূষণহীন বিকল্প শক্তির উৎসের সন্ধান করা। কয়লা, গ্যাস, তেল ইত্যাদি অনবায়নযোগ্য শক্তির উৎস।"},{"id":"q0441","page":67,"printed_page":489,"chapter":"অধ্যায় ১৮","chapter_title":"আমাদের সম্পদ","topic_code":"১৮.১","topic_title":"অনবায়নযোগ্য ও নবায়নযোগ্য শক্তি","number":"০৪","question":"কোনটি নবায়নযোগ্য শক্তির উৎস?","exam_ref":"৩৮তম বিসিএস","options":{"ক":"তেল","খ":"সমুদ্রের ঢেউ","গ":"গ্যাস","ঘ":"কয়লা"},"answer":"খ","answer_text":"সমুদ্রের ঢেউ","explanation":""},{"id":"q0442","page":67,"printed_page":489,"chapter":"অধ্যায় ১৮" ":"পারমাণবিক বিদ্যুৎ কেন্দ্র বা পরমাণু চুল্লিতে শক্তি উৎপাদনের জন্য নিউক্লিয়ার ফিশন (Nuclear Fission) বিক্রিয়া ঘটানো হয়। ইউরেনিয়াম-২৩৫ আইসোটোপটি এই কাজের জন্য সবচেয়ে উপযোগী কারণ এটি একটি সহজলভ্য 'ফিসাইল' (Fissile) পদার্থ, যার অর্থ হলো একটি নিউট্রন দ্বারা আঘাত করলে এর নিউক্লিয়াস খুব সহজেই ভেঙে যায়। একটি ইউরেনিয়াম-২৩৫ পরমাণু ভাঙলে তা থেকে প্রচুর শক্তির পাশাপাশি আরও ২-৩টি নিউট্রন বের হয়, যা অন্য পরমাণুগুলোকে ভাঙতে সাহায্য করে এবং অবিচ্ছিন্নভাবে শক্তি উৎপন্ন করে।"},{"id":"q0452","page":68,"printed_page":490,"chapter":"অধ্যায় ১৮","chapter_title":"আমাদের সম্পদ","topic_code":"১৮.২","topic_title":"নিউক্লিয়ার বিক্রিয়া","number":"০২","question":"পারমাণবিক চুল্লিতে 'মডারেটরের' প্রাথমিক কাজ হলো:","exam_ref":"৫০তম বিসিএস","options":{"ক":"অতিরিক্ত নিউট্রন শোষণ এবং চেইন বিক্রিয়া নিয়ন্ত্রণ","খ":"চুল্লির কেন্দ্রে উৎপন্ন তাপ স্থানান্তর করে শীতল করা","গ":"দ্রুতগতি সম্পন্ন নিউট্রনগুলোকে ধীরগতি করে ফিশনের সম্ভাবনা বাড়ানো","ঘ":"ক্ষতিকারক গামা বিকিরণ থেকে সুরক্ষা প্রদান"},"answer":"গ","answer_text":"দ্রুতগতি সম্পন্ন নিউট্রনগুলোকে ধীরগতি করে ফিশনের সম্ভাবনা বাড়ানো","explanation":"পারমাণবিক চুল্লিতে মডারেটর মূলত একটি গতি নিয়ন্ত্রক হিসেবে কাজ করে। এর প্রধান কাজগুলো হলো: নিউট্রনের গতি কমানো — ইউরেনিয়াম বিভাজনে উৎপন্ন অতি দ্রুতগতির নিউট্রনগুলোকে সংঘর্ষের মাধ্যমে ধীরগতিতে পরিণত করে, কারণ ধীরগতির নিউট্রনই পরবর্তী বিভাজন ঘটাতে বেশি কার্যকর। Chain Reaction বজায় রাখা — নিউট্রনের গতি কমিয়ে এটি নিশ্চিত করে যেন চেইন রিয়্যাকশনটি থেমে না গিয়ে নিরবচ্ছিন্নভাবে চলতে থাকে। জ্বালানি দক্ষতা — মডারেটরের ব্যবহারের ফলে কম সমৃদ্ধ ইউরেনিয়াম দিয়েও সফলভাবে বিদ্যুৎ উৎপাদন করা সম্ভব হয়, যা খরচ কমায়।"},{"id":"q0453","page":69,"printed_page":491,"chapter":"অধ্যায় ১৮","chapter_title":"আমাদের সম্পদ","topic_code":"১৮.২","topic_title":"নিউক্লিয়ার বিক্রিয়া","number":"০৩","question":"হাইড্রোজেন বোমায় ক্রিয়া করে-","exam_ref":"৪৭তম বিসিএস","options":{"ক":"ফিশন বিক্রিয়া","খ":"ফিউশন বিক্রিয়া","গ":"ফিশন ও ফিউশন উভয়টিই","ঘ":"সাধারণ রাসায়নিক বিক্রিয়া"},"answer":"গ","answer_text":"ফিশন ও ফিউশন উভয়টিই","explanation":"হাইড্রোজেন বোমা একটি থার্মোনিউক্লিয়ার অস্ত্র, যা পারমাণবিক ফিশন প্রক্রিয়ার মাধ্যমে শক্তি উৎপন্ন করে। এটি মূলত দুই ধাপে কাজ করে। প্রথমে একটি পারমাণবিক বোমার ফিশন বিস্ফোরণ ব্যবহার করা হয়, যা ফিউশন বিক্রিয়ার জন্য প্রয়োজনীয় প্রচণ্ড তাপ ও চাপ সৃষ্টি করে। এই তাপ ও চাপে হাইড্রোজেন আইসোটোপ, যেমন ডিউটেরিয়াম এবং ট্রিটিয়াম, একত্রিত হয়ে আরও ভারী পরমাণু তৈরি করে, যা বিপুল পরিমাণে শক্তি ও নিউট্রন নির্গত করে। প্রথম ধাপ (ফিশন): প্রথমে, বোমার ভিতরে একটি ছোট পারমাণবিক বোমা (যা নিউক্লিয়ার ফিশন বা পারমাণবিক বিভাজন প্রক্রিয়ায় কাজ করে) বিস্ফোরিত হয়। এই বিস্ফোরণটি অত্যন্ত উচ্চ তাপমাত্রা (কয়েক মিলিয়ন ডিগ্রি সেলসিয়াস) এবং প্রচণ্ড চাপ তৈরি করে। দ্বিতীয় ধাপ (ফিউশন): প্রথম ধাপের বিস্ফোরণ থেকে সৃষ্ট এই চরম তাপমাত্রা ও চাপই নিউক্লিয়ার ফিউশন বা পারমাণবিক সংযোজন বিক্রিয়া শুরু করার জন্য প্রয়োজনীয় পরিবেশ তৈরি করে। এই পর্যায়ে, হাইড্রোজেনের আইসোটোপ (যেমন ডিউটেরিয়াম এবং ট্রিটিয়াম) একত্রিত হয়ে হিলিয়াম নিউক্লিয়াসে পরিণত হয় এবং ফিশন বিক্রিয়ার চেয়ে বহুগুণ বেশি শক্তি নির্গত করে। সুতরাং, ফিশন বিক্রিয়াটি মূলত ফিউশন বিক্রিয়াকে সক্রিয় করার জন্য একটি ট্রিগার বা সূচনাকারী হিসেবে কাজ করে। এ কারণে হাইড্রোজেন বোমায় উভয় বিক্রিয়াই ঘটে থাকে।"},{"id":"q0454","page":69,"printed_page":491,"chapter":"অধ্যায় ১৮","chapter_title":"আমাদের সম্পদ","topic_code":"১৮.২","topic_title":"নিউক্লিয়ার বিক্রিয়া","number":"০৪","question":"নিউক্লিয়াসের বিভাজনকে কি বলা হয়?","exam_ref":"৩৭তম বিসিএস","options":{"ক":"ফিশন","খ":"মেসন","গ":"ফিউশন","ঘ":"ফিউশন ও মেসন"},"answer":"ক","answer_text":"ফিশন","explanation":"যে নিউক্লীয় বিক্রিয়ায় একটি ভারী নিউক্লিয়াস বিভাজিত হয়ে দুটি বা তার অধিক নিউক্লিয়াসে পরিণত হয় তাকে ফিশন বিক্রিয়া বলে। অন্যদিকে দুটি বা তার চেয়েও বেশি নিউক্লিয়াসের সংযোগে একটি নিউক্লিয়াস তৈরি হওয়াকে ফিউশন বিক্রিয়া বলে। মেসন হলো মৌলের ক্ষুদ্রতম কণিকা।"},{"id":"q0455","page":69,"printed_page":491,"chapter":"অধ্যায় ১৮","chapter_title":"আমাদের সম্পদ","topic_code":"১৮.২","topic_title":"নিউক্লিয়ার বিক্রিয়া","number":"০৫","question":"বিচ্ছিন্ন অবস্থায় একটি পরমাণুর শক্ <script>
(function(){
'use strict';

var LS_KEY = 'bcs_science_quiz_v1';
var QUESTIONS = window.QUESTIONS || [];
var QINDEX = {};
QUESTIONS.forEach(function(q){ QINDEX[q.id] = q; });

/* ---------- Chapter / topic index (order = first appearance in data) ---------- */
var CHAPTERS = []; // [{key,title,count,topics:[{code,title,count}]}]
(function buildIndex(){
  var chMap = {};
  QUESTIONS.forEach(function(q){
    if(!chMap[q.chapter]){
      chMap[q.chapter] = { key:q.chapter, title:q.chapter_title, count:0, topicMap:{}, topics:[] };
      CHAPTERS.push(chMap[q.chapter]);
    }
    var ch = chMap[q.chapter];
    ch.count++;
    if(!ch.topicMap[q.topic_code]){
      ch.topicMap[q.topic_code] = { code:q.topic_code, title:q.topic_title, count:0 };
      ch.topics.push(ch.topicMap[q.topic_code]);
    }
    ch.topicMap[q.topic_code].count++;
  });
})();

/* ---------- State ---------- */
var state = loadState();

function defaultState(){
  return { settings:{ theme:'light', fontSize:'md' }, q:{}, mistakes:[], bookmarks:[] };
}
function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var d = defaultState();
    return Object.assign(d, parsed, { settings: Object.assign(d.settings, parsed.settings||{}) });
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
function getQ(id){
  if(!state.q[id]) state.q[id] = { seen:0, correct:0, incorrect:0, lastResult:null, srs:null, lastSeen:0 };
  return state.q[id];
}
function isBookmarked(id){ return state.bookmarks.indexOf(id) !== -1; }
function toggleBookmark(id){
  var i = state.bookmarks.indexOf(id);
  if(i===-1){ state.bookmarks.push(id); toast('বুকমার্কে যোগ হয়েছে'); }
  else { state.bookmarks.splice(i,1); toast('বুকমার্ক থেকে সরানো হয়েছে'); }
  saveState();
}
function addMistake(id){
  if(state.mistakes.indexOf(id)===-1) state.mistakes.push(id);
}
function clearMistake(id){
  var i = state.mistakes.indexOf(id);
  if(i!==-1) state.mistakes.splice(i,1);
}

/* record an answer attempt */
function recordAnswer(id, wasCorrect){
  var qs = getQ(id);
  qs.seen++;
  qs.lastSeen = Date.now();
  if(wasCorrect){ qs.correct++; qs.lastResult='correct'; clearMistake(id); }
  else { qs.incorrect++; qs.lastResult='incorrect'; addMistake(id); }
  saveState();
}

/* ---------- SRS (SM-2 lite) ---------- */
function ensureSrs(id){
  var qs = getQ(id);
  if(!qs.srs) qs.srs = { ef:2.5, interval:0, reps:0, due:Date.now() };
  return qs.srs;
}
function isDue(id){
  var qs = state.q[id];
  if(!qs || !qs.srs) return true; // never studied -> due
  return qs.srs.due <= Date.now();
}
function getDueList(){
  return QUESTIONS.filter(function(q){ return isDue(q.id); }).map(function(q){ return q.id; });
}
var DAY = 86400000;
function rateSrs(id, rating){
  var srs = ensureSrs(id);
  if(rating==='again'){
    srs.reps = 0; srs.interval = 0; srs.ef = Math.max(1.3, srs.ef - 0.2);
    srs.due = Date.now() + (10*60*1000); // 10 min
  } else if(rating==='hard'){
    srs.ef = Math.max(1.3, srs.ef - 0.15);
    srs.interval = Math.max(1, Math.round((srs.interval||1) * 1.2));
    srs.reps++;
    srs.due = Date.now() + srs.interval*DAY;
  } else if(rating==='good'){
    if(srs.reps===0) srs.interval = 1;
    else if(srs.reps===1) srs.interval = 3;
    else srs.interval = Math.round(srs.interval * srs.ef);
    srs.reps++;
    srs.due = Date.now() + srs.interval*DAY;
  } else if(rating==='easy'){
    srs.ef = srs.ef + 0.1;
    srs.interval = Math.round(((srs.interval||1) * srs.ef) * 1.3) + 1;
    srs.reps++;
    srs.due = Date.now() + srs.interval*DAY;
  }
  saveState();
}

/* ---------- Utilities ---------- */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function sample(arr, n){ return shuffle(arr).slice(0, n); }
var toastTimer=null;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1800);
}
function highlight(text, query){
  if(!query) return escapeHtml(text);
  var esc = escapeHtml(text);
  var q = escapeHtml(query);
  try{
    var re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return esc.replace(re, '<mark>$1</mark>');
  }catch(e){ return esc; }
}

/* ---------- Router ---------- */
var view = 'dashboard';
var viewParams = {};
var quizSession = null; // active quiz/srs session object

function navigate(v, params){
  view = v;
  viewParams = params || {};
  render();
  window.scrollTo(0,0);
}

function render(){
  var activeGroups = navGroupsFor(view);
  document.querySelectorAll('.nav-btn').forEach(function(b){
    b.classList.toggle('active', activeGroups.indexOf(b.dataset.nav) !== -1);
  });
  var root = document.getElementById('view-root');
  var html = '';
  switch(view){
    case 'dashboard': html = renderDashboard(); break;
    case 'browse-chapters': html = renderBrowseChapters(); break;
    case 'browse-topics': html = renderBrowseTopics(viewParams.chapter); break;
    case 'browse-questions': html = renderBrowseQuestions(viewParams.chapter, viewParams.topic); break;
    case 'quiz-setup': html = renderQuizSetup(); break;
    case 'quiz-run': html = renderQuizRun(); break;
    case 'quiz-result': html = renderQuizResult(); break;
    case 'srs-run': html = renderSrsRun(); break;
    case 'srs-empty': html = renderSrsEmpty(); break;
    case 'mistakes': html = renderMistakes(); break;
    case 'bookmarks': html = renderBookmarks(); break;
    case 'search': html = renderSearch(); break;
    case 'settings': html = renderSettings(); break;
    case 'more': html = renderMore(); break;
    default: html = renderDashboard();
  }
  var NARROW_VIEWS = {'quiz-setup':1,'quiz-run':1,'quiz-result':1,'srs-run':1,'srs-empty':1};
  root.innerHTML = NARROW_VIEWS[view] ? ('<div class="narrow-wrap">'+html+'</div>') : html;
  afterRender();
}
function navGroupsFor(v){
  if(v==='dashboard') return ['dashboard'];
  if(v.indexOf('browse')===0) return ['browse'];
  if(v.indexOf('quiz')===0) return ['quiz'];
  if(v.indexOf('srs')===0) return ['srs'];
  if(v==='mistakes') return ['more','mistakes-link'];
  if(v==='bookmarks') return ['more','bookmarks-link'];
  if(v==='search') return ['more','search-link'];
  if(v==='settings') return ['more','settings-link'];
  return ['more'];
}

/* ---------- Dashboard ---------- */
function overallStats(){
  var total = QUESTIONS.length, attempted=0, correct=0;
  QUESTIONS.forEach(function(q){
    var qs = state.q[q.id];
    if(qs && qs.seen>0){ attempted++; if(qs.lastResult==='correct') correct++; }
  });
  return { total:total, attempted:attempted, correct:correct,
    pct: attempted? Math.round(correct/attempted*100):0,
    coveragePct: total? Math.round(attempted/total*100):0 };
}
function renderDashboard(){
  var s = overallStats();
  var due = getDueList().length;
  var mistakeCount = state.mistakes.length;
  var bookmarkCount = state.bookmarks.length;
  var ringPct = s.coveragePct;
  var circumference = 2*Math.PI*36;
  var dash = circumference * ringPct/100;

  var chapterRows = CHAPTERS.map(function(ch, idx){
    var seen=0;
    var chQuestions = QUESTIONS.filter(function(q){return q.chapter===ch.key;});
    chQuestions.forEach(function(q){ var qs=state.q[q.id]; if(qs&&qs.seen>0) seen++; });
    var pct = Math.round(seen/ch.count*100);
    return '<div class="chapter-row" data-action="open-chapter" data-chapter="'+escapeHtml(ch.key)+'">'+
      '<div class="chnum">'+(idx+1)+'</div>'+
      '<div class="chinfo">'+
        '<div class="chtitle">'+escapeHtml(ch.title)+'</div>'+
        '<div class="chmeta">'+ch.count+'টি প্রশ্ন &middot; '+seen+' পড়া হয়েছে</div>'+
        '<div class="mini-bar"><div style="width:'+pct+'%"></div></div>'+
      '</div>'+
      '<div class="chpct">'+pct+'%</div>'+
    '</div>';
  }).join('');

  return ''+
  '<h1 class="page-title">স্বাগতম 👋</h1>'+
  '<p class="page-sub">বিসিএস সাধারণ বিজ্ঞান প্রশ্নব্যাংক &mdash; '+s.total+'টি প্রশ্ন</p>'+

  '<div class="card card-pad" style="margin-bottom:16px;">'+
    '<div class="progress-ring-wrap">'+
      '<svg class="ring" viewBox="0 0 84 84">'+
        '<circle cx="42" cy="42" r="36" fill="none" stroke="var(--line)" stroke-width="8"/>'+
        '<circle cx="42" cy="42" r="36" fill="none" stroke="var(--accent)" stroke-width="8" '+
          'stroke-dasharray="'+dash.toFixed(1)+' '+circumference.toFixed(1)+'" stroke-linecap="round" '+
          'transform="rotate(-90 42 42)"/>'+
      '</svg>'+
      '<div class="overall-copy">'+
        '<div class="big">'+ringPct+'%</div>'+
        '<div class="sub">কভারেজ &middot; '+s.attempted+'/'+s.total+' চেষ্টা করা হয়েছে</div>'+
      '</div>'+
    '</div>'+
  '</div>'+

  '<div class="stat-grid">'+
    '<div class="stat-box"><span class="num">'+s.total+'</span><span class="lbl">মোট প্রশ্ন</span></div>'+
    '<div class="stat-box"><span class="num">'+s.pct+'%</span><span class="lbl">সঠিক হার</span></div>'+
    '<div class="stat-box"><span class="num">'+due+'</span><span class="lbl">রিভিউ বাকি</span></div>'+
  '</div>'+

  '<div class="action-grid">'+
    '<button class="action-card primary" data-action="quick-quiz">'+
      '<div class="ic">📝</div><div class="t">কুইজ শুরু করুন</div><div class="d">যেকোনো অধ্যায় থেকে</div>'+
    '</button>'+
    '<button class="action-card due-badge" data-action="start-srs">'+
      (due>0?'<div class="badge-count">'+due+'</div>':'')+
      '<div class="ic">🔁</div><div class="t">পুনরালোচনা</div><div class="d">স্মৃতি-ভিত্তিক রিভিউ</div>'+
    '</button>'+
    '<button class="action-card" data-action="go-mistakes">'+
      '<div class="ic">✗</div><div class="t">ভুল প্রশ্ন</div><div class="d">'+mistakeCount+'টি জমা আছে</div>'+

    '<button class="action-card" data-action="go-bookmarks">'+
      '<div class="ic">★</div><div class="t">বুকমার্ক</div><div class="d">'+bookmarkCount+'টি সংরক্ষিত</div>'+

function renderQuestionCard(q){

      '<span class="k">'+k+'.</span><span>'+escapeHtml(q.options[k])+'</span></div>';
  }).join('');
  var blankNote = q.answer===''? '<div class="source-note">উৎসে এই প্রশ্নের উত্তর অস্পষ্ট/অনির্দিষ্ট ছিল &mdash; মূল অনুযায়ী সংরক্ষিত।</div>':'';
  var explain = q.explanation? '<div class="explain-box" id="ex-'+q.id+'"><span class="lbl">ব্যাখ্যা</span>'+escapeHtml(q.explanation)+(q.source_note?('<div class="source-note">'+escapeHtml(q.source_note)+'</div>'):'')+'</div>' : (q.source_note? '<div class="explain-box" id="ex-'+q.id+'"><span class="lbl">নোট</span>'+escapeHtml(q.source_note)+'</div>' : '');
  return '<div class="q-item" data-qid="'+q.id+'">'+
    '<div class="qhead">'+
      '<div><span class="qnum">প্রশ্ন '+escapeHtml(q.number)+' &middot; '+escapeHtml(q.topic_code)+'</span></div>'+
      '<button class="q-star'+(bookmarked?' active':'')+'" data-action="toggle-bookmark" data-qid="'+q.id+'">'+(bookmarked?'★':'☆')+'</button>'+
    '</div>'+
    '<div class="qtext">'+escapeHtml(q.question)+'</div>'+

    '<div class="opt-list">'+opts+'</div>'+

    (q.explanation||q.source_note ? '<button class="reveal-btn" data-action="toggle-explain" data-qid="'+q.id+'">ব্যাখ্যা দেখুন</button>' : '')+

}

function afterRenderQuizSetup(){
  var scopeSel = document.getElementById('quiz-scope');
  var chapRow = document.getElementById('chapter-select-row');
  if(!scopeSel) return;
  scopeSel.addEventListener('change', function(){
    chapRow.style.display = scopeSel.value==='chapter' ? 'flex' : 'none';
  });
}
function launchQuiz(){
  var scope = document.getElementById('quiz-scope').value;
  var count = parseInt(document.getElementById('quiz-count').value,10);
  var pool = [];
  if(scope==='all') pool = QUESTIONS.slice();
  else if(scope==='chapter'){
    var chosen = document.getElementById('quiz-chapter').value;
    pool = QUESTIONS.filter(function(q){return q.chapter===chosen;});
  } else if(scope==='mistakes'){
    pool = state.mistakes.map(function(id){return QINDEX[id];}).filter(Boolean);
  } else if(scope==='bookmarks'){
    pool = state.bookmarks.map(function(id){return QINDEX[id];}).filter(Boolean);
  } else if(scope==='unattempted'){
    pool = QUESTIONS.filter(function(q){ var qs=state.q[q.id]; return !qs || qs.seen===0; });
  }
  if(pool.length===0){ toast('এই উৎসে কোনো প্রশ্ন নেই'); return; }
  var picked = sample(pool, Math.min(count, pool.length));
  quizSession = { mode:'quiz', items:picked, idx:0, answered:false, selected:null, correctCount:0, results:[] };
  navigate('quiz-run');
}
function renderQuizRun(){
  if(!quizSession || quizSession.idx >= quizSession.items.length) return renderQuizSetup();
  var q = quizSession.items[quizSession.idx];
  var total = quizSession.items.length;
  var pct = Math.round((quizSession.idx)/total*100);
  var bookmarked = isBookmarked(q.id);
  var optsHtml = ['ক','খ','গ','ঘ'].map(function(k){
    return '<button class="opt-btn" data-k="'+k+'"><span class="k">'+k+'.</span><span>'+escapeHtml(q.options[k])+'</span></button>';
  }).join('');
  return '<div class="quiz-progress"><div class="bar"><div style="width:'+pct+'%"></div></div>'+
    '<div class="lbl">'+(quizSession.idx+1)+' / '+total+'</div></div>'+
    '<div class="card card-pad quiz-card">'+
      '<div class="meta-line"><span>'+escapeHtml(q.chapter_title)+' &middot; '+escapeHtml(q.topic_code)+'</span>'+
        '<button class="q-star'+(bookmarked?' active':'')+'" data-action="toggle-bookmark" data-qid="'+q.id+'">'+(bookmarked?'★':'☆')+'</button></div>'+
      '<div class="qtext">'+escapeHtml(q.question)+'</div>'+
      '<div id="quiz-opts">'+optsHtml+'</div>'+
      '<div id="quiz-feedback"></div>'+
    '</div>';
}
function afterRenderQuizRun(){
  var optsWrap = document.getElementById('quiz-opts');
  if(!optsWrap) return;
  optsWrap.querySelectorAll('.opt-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ selectQuizOption(btn.dataset.k); });
  });
}
function selectQuizOption(k){
  if(quizSession.answered) return;
  quizSession.answered = true;
  quizSession.selected = k;
  var q = quizSession.items[quizSession.idx];
  var correct = q.answer!=='' && k===q.answer;
  if(correct) quizSession.correctCount++;
  quizSession.results.push({ id:q.id, correct:correct });
  recordAnswer(q.id, correct);

  var optsWrap = document.getElementById('quiz-opts');
  optsWrap.querySelectorAll('.opt-btn').forEach(function(btn){
    btn.classList.add('disabled');
    btn.disabled = true;
    if(q.answer!=='' && btn.dataset.k===q.answer) btn.classList.add('correct');
    else if(btn.dataset.k===k) btn.classList.add('wrong');
  });

  var fb = document.getElementById('quiz-feedback');
  var verdictText, verdictClass;
  if(q.answer===''){ verdictText='উৎসে এই প্রশ্নের সুনির্দিষ্ট উত্তর নেই'; verdictClass='wrong'; }
  else if(correct){ verdictText='সঠিক হয়েছে! ✓'; verdictClass='right'; }
  else { verdictText='সঠিক উত্তর: '+q.answer+'. '+q.options[q.answer]; verdictClass='wrong'; }

  var explainHtml = q.explanation? ('<div class="explain-box show"><span class="lbl">ব্যাখ্যা</span>'+escapeHtml(q.explanation)+'</div>') : '';
  var noteHtml = q.source_note? ('<div class="source-note">'+escapeHtml(q.source_note)+'</div>') : '';
  var isLast = quizSession.idx === quizSession.items.length-1;
  fb.innerHTML = '<div class="quiz-feedback">'+
    '<div class="verdict '+verdictClass+'">'+verdictText+'</div>'+
    explainHtml + noteHtml +
    '<div class="nav-row"><button class="big-btn" data-action="quiz-next">'+(isLast?'ফলাফল দেখুন':'পরবর্তী প্রশ্ন')+'</button></div>'+
  '</div>';
}
function quizNext(){
  quizSession.idx++;
  quizSession.answered = false;
  quizSession.selected = null;
  if(quizSession.idx >= quizSession.items.length){ navigate('quiz-result'); }
  else render();
}
function renderQuizResult(){
  if(!quizSession) return renderQuizSetup();
  var total = quizSession.items.length;
  var correct = quizSession.correctCount;
  var pct = total? Math.round(correct/total*100):0;
  var wrongItems = quizSession.results.filter(function(r){return !r.correct;}).map(function(r){return QINDEX[r.id];});
  var wrongHtml = wrongItems.length? ('<div class="section-label">ভুল হওয়া প্রশ্নসমূহ</div><div class="q-list">'+wrongItems.map(renderQuestionCard).join('')+'</div>') : '';
  return '<div class="card card-pad result-hero">'+
      '<div class="score">'+correct+' / '+total+'</div>'+
      '<div class="sub">সঠিক হার '+pct+'%</div>'+
    '</div>'+
    '<div class="nav-row" style="margin-top:16px;">'+
      '<button class="big-btn ghost" data-action="go-quiz-setup">আবার কুইজ দিন</button>'+
      '<button class="big-btn" data-action="go-dashboard">হোমে ফিরুন</button>'+
    '</div>'+
    wrongHtml;
}

  var pct = Math.round((quizSession.idx)/total*100);
  var optsHtml = ['ক','খ','গ','ঘ'].map(function(k){
    return '<button class="opt-btn" data-k="'+k+'"><span class="k">'+k+'.</span><span>'+escapeHtml(q.options[k])+'</span></button>';
  }).join('');
  return '<div class="quiz-progress"><div class="bar"><div style="width:'+pct+'%"></div></div>'+
    '<div class="lbl">'+(quizSession.idx+1)+' / '+total+'</div></div>'+
    '<div class="card card-pad quiz-card">'+
      '<div class="meta-line"><span>'+escapeHtml(q.chapter_title)+' &middot; '+escapeHtml(q.topic_code)+'</span><span>🔁 পুনরালোচনা</span></div>'+
      '<div class="qtext">'+escapeHtml(q.question)+'</div>'+
      '<div id="quiz-opts">'+optsHtml+'</div>'+
      '<div id="quiz-feedback"></div>'+
    '</div>';
}
function selectSrsOption(k){
  if(quizSession.answered) return;
  quizSession.answered = true;
  var q = quizSession.items[quizSession.idx];
  var correct = q.answer!=='' && k===q.answer;
  recordAnswer(q.id, correct);

  var optsWrap = document.getElementById('quiz-opts');
  optsWrap.querySelectorAll('.opt-btn').forEach(function(btn){
    btn.classList.add('disabled'); btn.disabled = true;
    if(q.answer!=='' && btn.dataset.k===q.answer) btn.classList.add('correct');
    else if(btn.dataset.k===k) btn.classList.add('wrong');
  });
  var fb = document.getElementById('quiz-feedback');
  var verdictText = q.answer===''? 'উৎসে সুনির্দিষ্ট উত্তর নেই' : (correct? 'সঠিক হয়েছে! ✓' : 'সঠিক উত্তর: '+q.answer+'. '+q.options[q.answer]);
  var explainHtml = q.explanation? ('<div class="explain-box show"><span class="lbl">ব্যাখ্যা</span>'+escapeHtml(q.explanation)+'</div>') : '';
  fb.innerHTML = '<div class="quiz-feedback">'+
    '<div class="verdict '+(correct?'right':'wrong')+'">'+verdictText+'</div>'+
    explainHtml+
    '<div class="srs-rate-row">'+
      '<button class="srs-btn again" data-rate="again">আবার<span class="sub">কঠিন</span></button>'+
      '<button class="srs-btn hard" data-rate="hard">কষ্টসাধ্য<span class="sub">১-২ দিন</span></button>'+
      '<button class="srs-btn good" data-rate="good">ভালো<span class="sub">কয়েকদিন</span></button>'+
      '<button class="srs-btn easy" data-rate="easy">সহজ<span class="sub">দীর্ঘ সময়</span></button>'+
    '</div>'+
  '</div>';
  fb.querySelectorAll('.srs-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ rateSrs(q.id, btn.dataset.rate); srsNext(); });
  });
}
function srsNext(){
  quizSession.idx++;
  quizSession.answered = false;
  render();
}

/* ---------- Mistakes ---------- */
function renderMistakes(){
  var items = state.mistakes.map(function(id){return QINDEX[id];}).filter(Boolean);
  if(items.length===0){
    return '<h1 class="page-title">ভুল প্রশ্ন</h1><div class="empty-state"><div class="ic">🎉</div>'+
      '<div class="t">কোনো ভুল প্রশ্ন নেই</div><div class="d">কুইজ দিলে ভুল উত্তরগুলো এখানে জমা হবে।</div></div>';
  }
  return '<h1 class="page-title">ভুল প্রশ্ন</h1><p class="page-sub">'+items.length+'টি প্রশ্নে ভুল হয়েছিল &mdash; আবার চর্চা করুন</p>'+
    '<button class="big-btn" style="margin-bottom:16px;" data-action="quiz-from-mistakes">এগুলো নিয়ে কুইজ দিন</button>'+
    '<div class="q-list">'+items.map(renderQuestionCard).join('')+'</div>';
}
function quizFromMistakes(){
  var pool = state.mistakes.map(function(id){return QINDEX[id];}).filter(Boolean);
  if(pool.length===0){ toast('কোনো ভুল প্রশ্ন নেই'); return; }
  quizSession = { mode:'quiz', items:shuffle(pool), idx:0, answered:false, selected:null, correctCount:0, results:[] };
  navigate('quiz-run');
}

/* ---------- Bookmarks ---------- */
function renderBookmarks(){
  var items = state.bookmarks.map(function(id){return QINDEX[id];}).filter(Boolean);
  if(items.length===0){
    return '<h1 class="page-title">বুকমার্ক</h1><div class="empty-state"><div class="ic">☆</div>'+
      '<div class="t">কোনো বুকমার্ক নেই</div><div class="d">প্রশ্নের পাশে ★ চিহ্নে ট্যাপ করে সংরক্ষণ করুন।</div></div>';
  }
  return '<h1 class="page-title">বুকমার্ক</h1><p class="page-sub">'+items.length+'টি প্রশ্ন সংরক্ষিত আছে</p>'+
    '<div class="q-list">'+items.map(renderQuestionCard).join('')+'</div>';
}

/* ---------- Search ---------- */
var searchQuery = '';
function renderSearch(){
  var results = searchQuery.trim() ? doSearch(searchQuery.trim()) : [];
  var resultsHtml = '';
  if(searchQuery.trim() && results.length===0){
    resultsHtml = '<div class="empty-state"><div class="ic">🔍</div><div class="t">কোনো ফলাফল পাওয়া যায়নি</div></div>';
  } else if(results.length){
    resultsHtml = '<p class="page-sub">'+results.length+'টি ফলাফল</p><div class="q-list">'+
      results.slice(0,60).map(function(q){ return renderQuestionCard(q); }).join('')+'</div>';
  }
  return '<h1 class="page-title">খুঁজুন</h1>'+
    '<div class="search-wrap"><span class="si-icon">🔍</span>'+
      '<input class="search-input" id="search-input" type="text" placeholder="প্রশ্ন, বিষয় বা ব্যাখ্যা লিখুন..." value="'+escapeHtml(searchQuery)+'">'+
    '</div>'+resultsHtml;
}
function doSearch(query){
  var q = query.toLowerCase();
  return QUESTIONS.filter(function(item){
    return (item.question && item.question.toLowerCase().indexOf(q)!==-1) ||
      (item.topic_title && item.topic_title.toLowerCase().indexOf(q)!==-1) ||
      (item.chapter_title && item.chapter_title.toLowerCase().indexOf(q)!==-1) ||
      (item.explanation && item.explanation.toLowerCase().indexOf(q)!==-1) ||
      (item.exam_ref && item.exam_ref.toLowerCase().indexOf(q)!==-1) ||
      Object.keys(item.options||{}).some(function(k){ return item.options[k].toLowerCase().indexOf(q)!==-1; });
  });
}
function afterRenderSearch(){
  var input = document.getElementById('search-input');
  if(!input) return;
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  var timer=null;
  input.addEventListener('input', function(){
    searchQuery = input.value;
    clearTimeout(timer);
    timer = setTimeout(function(){ render(); }, 220);
  });
}

/* ---------- More ---------- */
function renderMore(){
  return '<h1 class="page-title">আরও</h1>'+
  '<div class="chapter-list">'+
    '<div class="chapter-row" data-action="go-mistakes"><div class="chnum">✗</div><div class="chinfo"><div class="chtitle">ভুল প্রশ্ন</div><div class="chmeta">'+state.mistakes.length+'টি</div></div></div>'+
    '<div class="chapter-row" data-action="go-bookmarks"><div class="chnum">★</div><div class="chinfo"><div class="chtitle">বুকমার্ক</div><div class="chmeta">'+state.bookmarks.length+'টি</div></div></div>'+
    '<div class="chapter-row" data-action="go-search"><div class="chnum">🔍</div><div class="chinfo"><div class="chtitle">খুঁজুন</div><div class="chmeta">প্রশ্ন অনুসন্ধান করুন</div></div></div>'+
    '<div class="chapter-row" data-action="go-settings"><div class="chnum">⚙</div><div class="chinfo"><div class="chtitle">সেটিংস</div><div class="chmeta">থিম, ফন্ট আকার, ডেটা</div></div></div>'+
  '</div>';
}

/* ---------- Settings ---------- */
function renderSettings(){
  var s = state.settings;
  return '<h1 class="page-title">সেটিংস</h1>'+
  '<div class="card card-pad">'+
    '<div class="settings-row"><div><div class="st">থিম</div><div class="sd">লাইট বা ডার্ক মোড</div></div>'+
      '<div class="seg-control">'+
        '<button data-theme-opt="light" class="'+(s.theme==='light'?'active':'')+'">লাইট</button>'+
        '<button data-theme-opt="dark" class="'+(s.theme==='dark'?'active':'')+'">ডার্ক</button>'+
      '</div>'+
    '</div>'+
    '<div class="settings-row"><div><div class="st">ফন্ট আকার</div><div class="sd">পড়তে আরামদায়ক আকার বেছে নিন</div></div>'+
      '<div class="seg-control">'+
        ['sm','md','lg','xl'].map(function(sz){
          var lbl = {sm:'ছোট',md:'মাঝারি',lg:'বড়',xl:'অতিবড়'}[sz];
          return '<button data-fontsize-opt="'+sz+'" class="'+(s.fontSize===sz?'active':'')+'">'+lbl+'</button>';
        }).join('')+
      '</div>'+
    '</div>'+
  '</div>'+
  '<div class="section-label">ডেটা</div>'+
  '<div class="card card-pad">'+
    '<div class="settings-row"><div><div class="st">অগ্রগতি এক্সপোর্ট করুন</div><div class="sd">JSON ফাইল হিসেবে ডাউনলোড করুন</div></div>'+
      '<button class="icon-btn" data-action="export-data">⭳</button></div>'+
    '<div class="settings-row"><div><div class="st">সব অগ্রগতি রিসেট করুন</div><div class="sd">সব উত্তর, বুকমার্ক ও রিভিউ ডেটা মুছে যাবে</div></div>'+
      '<button class="danger-btn" data-action="reset-progress">রিসেট করুন</button></div>'+
  '</div>'+
  '<div class="section-label">সম্পর্কে</div>'+
  '<div class="card card-pad">'+
    '<p style="margin:0; font-size:0.85rem; color:var(--ink-soft);">বিসিএস সাধারণ বিজ্ঞান প্রশ্নব্যাংক — মোট '+QUESTIONS.length+'টি প্রশ্ন, ১৮টি অধ্যায়ে বিন্যস্ত। সব ডেটা শুধুমাত্র আপনার ডিভাইসে (localStorage) সংরক্ষিত হয়।</p>'+
  '</div>';
}
function afterRenderSettings(){
  document.querySelectorAll('[data-theme-opt]').forEach(function(btn){
    btn.addEventListener('click', function(){ setTheme(btn.dataset.themeOpt); });
  });
  document.querySelectorAll('[data-fontsize-opt]').forEach(function(btn){
    btn.addEventListener('click', function(){ setFontSize(btn.dataset.fontsizeOpt); });
  });
}
function setTheme(t){
  state.settings.theme = t; saveState();
  document.documentElement.setAttribute('data-theme', t);
  render();
}
function setFontSize(sz){
  state.settings.fontSize = sz; saveState();
  document.body.setAttribute('data-fontsize', sz);
  render();
}
function resetProgress(){
  if(!confirm('আপনি কি নিশ্চিত? সব অগ্রগতি, বুকমার্ক ও ভুল প্রশ্নের তালিকা মুছে যাবে। এই কাজটি ফিরিয়ে আনা যাবে না।')) return;
  state = defaultState();
  saveState();
  document.documentElement.setAttribute('data-theme','light');
  document.body.setAttribute('data-fontsize','md');
  toast('সব অগ্রগতি রিসেট হয়েছে');
  navigate('dashboard');
}
function exportData(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'bcs-science-progress.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  toast('ডেটা ডাউনলোড হচ্ছে...');
}

/* ---------- After-render hooks per view ---------- */
function afterRender(){
  if(view==='quiz-setup') afterRenderQuizSetup();
  if(view==='quiz-run') afterRenderQuizRun();
  if(view==='srs-run'){
    var optsWrap = document.getElementById('quiz-opts');
    if(optsWrap) optsWrap.querySelectorAll('.opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ selectSrsOption(btn.dataset.k); });
    });
  }
  if(view==='search') afterRenderSearch();
  if(view==='settings') afterRenderSettings();
}

/* ---------- Global click delegation ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  switch(action){
    case 'open-chapter': navigate('browse-topics', {chapter: el.dataset.chapter}); break;
    case 'open-topic': navigate('browse-questions', {chapter: el.dataset.chapter, topic: el.dataset.topic}); break;
    case 'go-browse': navigate('browse-chapters'); break;
    case 'go-dashboard': navigate('dashboard'); break;
    case 'go-mistakes': navigate('mistakes'); break;
    case 'go-bookmarks': navigate('bookmarks'); break;
    case 'go-search': navigate('search'); break;
    case 'go-settings': navigate('settings'); break;
    case 'go-quiz-setup': navigate('quiz-setup'); break;
    case 'quick-quiz': navigate('quiz-setup'); break;
    case 'start-srs': startSrs(); break;
    case 'launch-quiz': launchQuiz(); break;
    case 'quiz-next': quizNext(); break;
    case 'quiz-from-mistakes': quizFromMistakes(); break;
    case 'toggle-bookmark':
      toggleBookmark(el.dataset.qid);
      render();
      break;
    case 'toggle-explain':
      var box = document.getElementById('ex-'+el.dataset.qid);
      if(box){
        box.classList.toggle('show');
        el.textContent = box.classList.contains('show') ? 'ব্যাখ্যা লুকান' : 'ব্যাখ্যা দেখুন';
      }
      break;
    case 'export-data': exportData(); break;
    case 'reset-progress': resetProgress(); break;
  }
});

/* Bottom nav + topbar bindings */
function bindChrome(){
  document.querySelectorAll('.nav-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var group = btn.dataset.nav;
      if(group==='dashboard') navigate('dashboard');
      else if(group==='browse') navigate('browse-chapters');
      else if(group==='quiz') navigate('quiz-setup');
      else if(group==='srs') startSrs();
      else if(group==='more') navigate('more');
      else if(group==='mistakes-link') navigate('mistakes');
      else if(group==='bookmarks-link') navigate('bookmarks');
      else if(group==='search-link') navigate('search');
      else if(group==='settings-link') navigate('settings');
    });
  });
  var searchIcon = document.getElementById('topbar-search');
  if(searchIcon) searchIcon.addEventListener('click', function(){ navigate('search'); });
  var settingsIcon = document.getElementById('topbar-settings');
  if(settingsIcon) settingsIcon.addEventListener('click', function(){ navigate('settings'); });
}

/* ---------- Init ---------- */
document.documentElement.setAttribute('data-theme', state.settings.theme);
document.body.setAttribute('data-fontsize', state.settings.fontSize);
bindChrome();
render();

})();

</script>
</body>
</html>
