.২","topic_title":"ড্রাইসেল ও স্টোরেজ ব্যাটারি","number":"০২","question":"গাড়ির ব্যাটারিতে কোন এসিড ব্যবহৃত হয়?","exam_ref":"৩৪তম বিসিএস","options":{"ক":"নাইট্রিক","খ":"সালফিউরিক","গ":"হাইড্রোক্লোরিক","ঘ":"পারক্লোরিক"},"answer":"খ","answer_text":"সালফিউরিক","explanation":"ব্যাটারি এক প্রকার তড়িৎকোষ। একটি পাত্রে খানিকটা পাতলা সালফিউরিক এসিড নিয়ে তার মধ্যে একটি দস্তা ও একটি তামার পাত পরস্পরকে স্পর্শ না করিয়ে ডুবালে একটি তড়িৎকোষ বা ব্যাটারি তৈরি হয়। (চিত্র: তড়িৎ রাসায়নিক কোষ — অ্যানোড (জারণ) জিংক দণ্ড, ক্যাথোড (বিজারণ) তামা দণ্ড; কোষ সংকেত: Zn(s)|ZnSO₄(aq)||CuSO₄(aq)|Cu(s))"},{"id":"q0204","page":33,"printed_page":455,"chapter":"অধ্যায় ১০","chapter_title":"রাসায়নিক বিক্রিয়া ও তড়িৎ রসায়ন","topic_code":"১০.২","topic_title":"ড্রাইসেল ও স্টোরেজ ব্যাটারি","number":"০৩","question":"সাধারণ স্টোরেজ ব্যাটারিতে সিসার ইলেকট্রোডের সঙ্গে যে তরলটি ব্যবহৃত হয় তা হলো-","exam_ref":"১২তম বিসিএস","options":{"ক":"নাইট্রিক এসিড","খ":"সালফিউরিক এসিড","গ":"এমোনিয়াম ক্লোরাইড","ঘ":"হাইড্রোক্লোরিক এসিড"},"answer":"খ","answer_text":"সালফিউরিক এসিড","explanation":"ব্যাটারি ছাড়াও সালফিউরিক এসিড বিপুল পরিমাণে ইস্পাত, চামড়াসহ বিভিন্ন শিল্প কারখানায় ব্যবহৃত হয়। কোন দেশ কত উন্নত তা সেই দেশের সালফিউরিক এসিড ব্যবহারের হার দেখেও বোঝা যায়। তাই সালফিউরিক এসিডকে রাসায়নিক পদার্থের রাজা বলা হয়। অন্যদিকে স্বর্ণকাররা সোনায় মিশ্রিত খাদের পরিমাণ নির্ণয় করতে নাইট্রিক এসিড (HNO₃) ব্যবহার করে থাকে। নাইট্রিক ও হাইড্রোক্লোরিক এসিড (HCl) এর ১:৩ অনুপাতে মিশ্রিত দ্রবণ সোনা গলাতে ব্যবহৃত হয় তাই একে রাজঅম্ল বা আকুয়া রেজিয়া বলা হয়। আমাদের পাকস্থলীতে খাদ্য পরিপাকে HCl ব্যবহৃত হয়। অন্যদিকে পারক্লোরিক এসিড (HClO₄) একটি শক্তিশালী এসিড যা বিস্ফোরক তৈরিতে ব্যবহৃত হয় এবং অ্যামোনিয়াম ক্লোরাইড (NH₄Cl) একটি লবণ যা নাইট্রোজেনের উৎস হিসেবে সারে ব্যবহৃত হয়।"},{"id":"q0205","page":33,"printed_page":455,"chapter":"অধ্যায় ১০","chapter_title":"রাসায়নিক বিক্রিয়া ও তড়িৎ রসায়ন","topic_code":"১০.২","topic_title":"ড্রাইসেল ও স্টোরেজ ব্যাটারি","number":"০৪","question":"সৌরকোষের বিদ্যুৎ রাতেও ব্যবহার করা সম্ভব যদি এর সঙ্গে থাকে-","exam_ref":"১১তম বিসিএস","options":{"ক":"ট্রান্সফরমার","খ":"জেনারেটর","গ":"স্টোরেজ ব্যাটারি","ঘ":"ক্যাপাসিটার"},"answer":"গ","answer_text":"স্টোরেজ ব্যাটারি","explanation":"সৌরশক্তি ব্যবহারের আধুনিক কৌশল হচ্ছে সৌরকোষ। সৌরকোষের বৈশিষ্ট্য হলো এর উপর সূর্যের আলো পড়লে এ থেকে সরাসরি তড়িৎ পাওয়া যায়। সৌরকোষে ক্যাডমিয়াম মৌল ব্যবহার করা হয়। সৌর কোষের সাথে স্টোরেজ ব্যাটারি যোগ করে সৌরকোষের বিদ্যুৎ রাতেও ব্যবহার করা যায়।"},{"id":"q0206","page":33,"printed_page":455,"chapter":"অধ্যায় ১০","chapter_title":"রাসায়নিক বিক্রিয়া ও তড়িৎ রসায়ন","topic_code":"১০.২","topic_title":"ড্রাইসেল ও স্টোরেজ ব্যাটারি","number":"০৫","question":"সাধারণ ড্রাইসেলে ইলেকট্রোড হিসেবে থাকে-","exam_ref":"১০তম বিসিএস","options":{"ক":"তামার দণ্ড ও দস্তার দণ্ড","খ":"তামার পাত ও দস্তার পাত","গ":"কার্বন দণ্ড ও দস্তার কৌটা","ঘ":"তামার দণ্ড ও দস্তার কৌটা"},"answer":"গ","answer_text":"কার্বন দণ্ড ও দস্তার কৌটা","explanation":"ড্রাইসেলে উপাদান হিসেবে থাকে অ্যামোনিয়াম ক্লোরাইডের পেস্ট, কার্বন দণ্ড, দস্তার তৈরি চোঙাকৃতির পাত্র, ম্যাংগানিজ ডাই অক্সাইড, কয়লার গুঁড়ো, পিতলের টুপি এবং শক্ত কাগজ। এতে ইলেকট্রোড হিসেবে কার্বন দণ্ড ও দস্তার কৌটা ব্যবহৃত হয়। এক্ষেত্রে দস্তার পাত্র অ্যানোড এবং কার্বন (গ্রাফাইট) দণ্ড ক্যাথোড হিসেবে কাজ করে। (চিত্র: শুষ্ক কোষ — সীল করা অন্তর উপরিভাগ, পিতলের টুপি, বহিঃস্থ আবরণ, দস্তার পাত্র (-ve), কার্বন গুঁড়ো ও ম্যাঙ্গানিজ ডাইঅক্সাইডের মিশ্রণ, অ্যামোনিয়াম ক্লোরাইড জেলী, কার্বন দণ্ড (+ve), কার্বন বোর্ডের চাকতি) এটি এক প্রকার পোর্টেবল বা বহনযোগ্য ব্যাটারি যা ফ্ল্যাশলাইট, ছোট রেডিও এবং বিভিন্ন খেলনা ইত্যাদিতেও ব্যবহার করা হয়।"},{"id":"q0207","page":34,"printed_page":456,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.১","topic_title":"pH ও pH স্কেল","number":"০১","question":"জলীয় দ্রবণে pH এর সর্বোচ্চ মান কোনটি?","exam_ref":"৪৬তম বিসিএস","options":{"ক":"৭","খ":"১০","গ":"১৪","ঘ":"২০"},"answer":"গ","answer_text":"১৪","explanation":"কোনো দ্রবণের pH হলো ঐ দ্রবণে উপস্থিত হাইড্রোজেন আয়নের (H⁺) ঘনমাত্রার ঋণাত্মক লগারিদম। অর্থাৎ pH = −log[H⁺]। ডেনমার্কের বিজ্ঞানী সোরেনসেন ১৯০৯ সালে pH আবিষ্কার করেন। যদিও অঙ্কের হিসেবে pH এর মান ঋণাত্মক থেকে শুরু করে যেকোনো ধনাত্মক সংখ্যা হওয়া সম্ভব কিন্তু বাস্তব জীবনে ব্যবহারিক ক্ষেত্রে pH এর মান ০ থেকে ১৪ পর্যন্ত বিবেচনা করা হয়। দ্রবণের pH মান ৭ এর কম হলে দ্রবণটি অম্লীয়, ৭ হলে প্রশম/নিরপেক্ষ এবং ৭ অপেক্ষা বেশি হলে ক্ষারীয়।"},{"id":"q0208","page":34,"printed_page":456,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.১","topic_title":"pH ও pH স্কেল","number":"০২","question":"pH হলো-","exam_ref":"৩৫তম বিসিএস","options":{"ক":"এসিড নির্দেশক","খ":"এসিড ও ক্ষার নির্দেশক","গ":"ক্ষার নির্দেশক","ঘ":"এসিড, ক্ষার ও নিরপেক্ষতা নির্দেশক"},"answer":"ঘ","answer_text":"এসিড, ক্ষার ও নিরপেক্ষতা নির্দেশক","explanation":""},{"id":"q0209","page":34,"printed_page":456,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"০১","question":"ফিটকিরিতে কত অণু পানি থাকে?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"২৪","খ":"১৫","গ":"০৭","ঘ":"০৫"},"answer":"ক","answer_text":"২৪","explanation":"ফিটকিরি, যা পটাশ অ্যালাম নামেও পরিচিত, একটি প্রাকৃতিক খনিজ যা পানি বিশুদ্ধকরণ, ত্বকের বিভিন্ন সমস্যা (যেমন ব্রণ, র‍্যাশ) দূরীকরণ, এবং আফটারশেভ হিসেবে ব্যবহার করা হয়। ফিটকিরির রাসায়নিক সংকেত হলো K₂SO₄.Al₂(SO₄)₃.২৪H₂O এবং রাসায়নিক নাম: পটাশিয়াম অ্যালুমিনিয়াম সালফেট। এটি অ্যান্টিসেপটিক ও অ্যান্টিব্যাকটেরিয়াল হিসেবে কাজ করে। এছাড়াও ফিটকিরি মুখের ঘা, বগলের দুর্গন্ধ দূর করতে এবং শরীরের রক্ত সঞ্চালন বাড়াতেও ব্যবহৃত হয়।"},{"id":"q0210","page":34,"printed_page":456,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"০২","question":"ধাতব কার্বোনেটের সাথে এসিডের বিক্রিয়ায় উৎপন্ন হয়-","exam_ref":"৪৬তম বিসিএস","options":{"ক":"লবণ","খ":"পানি","গ":"কার্বন ডাইঅক্সাইড","ঘ":"সবগুলো"},"answer":"ঘ","answer_text":"সবগুলো","explanation":"ধাতব কার্বনেট + এসিড = লবণ + পানি + কার্বন ডাইঅক্সাইড। যেমন: Na₂CO₃ + HCl = NaCl + H₂O + CO₂।"},{"id":"q0211","page":34,"printed_page":456,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"০৩","question":"কোনটি পানিতে দ্রবীভূত হয় না?","exam_ref":"৪১তম, ২৮তম বিসিএস","options":{"ক":"গ্লিসারিন","খ":"ফিটকিরি","গ":"সোডিয়াম ক্লোরাইড","ঘ":"ক্যালসিয়াম কার্বোনেট"},"answer":"ঘ","answer_text":"ক্যালসিয়াম কার্বোনেট","explanation":"রসায়ন বিদ্যা থেকে আমরা জানি যে, ক্ষার ধাতু ব্যতীত অন্যান্য ধাতুসমূহের কার্বনেট লবণ পানিতে অদ্রবণীয়। ক্যালসিয়াম (Ca) ক্ষার ধাতু নয়, এটি একটি মৃৎক্ষার ধাতু। সুতরাং ক্যালসিয়ামের কার্বনেট লবণ বা ক্যালসিয়াম কার্বনেট পানিতে অদ্রবণীয় অর্থাৎ পানিতে দ্রবীভূত হয় না। অপরদিকে গ্লিসারিন, ফিটকিরি ও সোডিয়াম ক্লোরাইড (NaCl) বা খাবার লবণ এদের প্রত্যেকেই পানিতে দ্রবণীয়।"},{"id":"q0212","page":35,"printed_page":457,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"০৪","question":"সোডিয়াম এসিটেটের সংকেত-","exam_ref":"৪০তম বিসিএস","options":{"ক":"CH₂COONa","খ":"(CH₃COO)₂Ca","গ":"CH₃COONa","ঘ":"CHCOONa"},"answer":"গ","answer_text":"CH₃COONa","explanation":"সোডিয়াম এসিটেটকে সোডিয়াম ইথানয়েটও বলা হয়। এর সংকেত হলো CH₃COONa। ইথানয়িক এসিড সোডিয়াম হাইড্রোক্সাইডের জলীয় দ্রবণের সাথে বিক্রিয়া করে সোডিয়াম এসিটেট লবণ ও পানি উৎপন্ন করে। CH₃COOH + NaOH → CH₃COONa + H₂O।"},{"id":"q0213","page":35,"printed_page":457,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"০৫","question":"নিম্নের কোনটি বেকিং পাউডারের মূল উপাদানের সংকেত?","exam_ref":"৩৫তম বিসিএস","options":{"ক":"CaCO₃","খ":"NaHCO₃","গ":"NH₄HCO₃","ঘ":"(NH₄)₂CO₃"},"answer":"খ","answer_text":"NaHCO₃","explanation":"বেকিং পাউডারের মূল উপাদানের সংকেত NaHCO₃। এর অপর নাম সোডিয়াম বাইকার্বোনেট, বেকিং সোডা, ব্রেড সোডা, কুকিং সোডা বা খাবার সোডা। অন্যদিকে CaCO₃ (ক্যালসিয়াম কার্বনেট)-কে বলা হয় কোরাল।"},{"id":"q0214","page":35,"printed_page":457,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"০৬","question":"জমির লবণাক্ততা নিয়ন্ত্রণ করে কোনটি?","exam_ref":"৩৪, ৩০তম বিসিএস","options":{"ক":"কৃত্রিম সার প্রয়োগ","খ":"পানি সেচ","গ":"মাটিতে নাইট্রোজেন ধরে রাখা","ঘ":"প্রাকৃতিক গ্যাস প্রয়োগ"},"answer":"খ","answer_text":"পানি সেচ","explanation":"জমির লবণাক্ততা নিয়ন্ত্রণ করে পানি সেচ। জমিতে অতিরিক্ত সার ও কীটনাশক প্রয়োগ এবং অন্যান্য কারণে লবণাক্ততা সৃষ্টি হয় যা পানি সেচের মাধ্যমে নিয়ন্ত্রিত হয়।"},{"id":"q0215","page":35,"printed_page":457,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"০৭","question":"দুধে থাকে-","exam_ref":"৩২তম বিসিএস","options":{"ক":"সাইট্রিক এসিড","খ":"ল্যাকটিক এসিড","গ":"নাইট্রিক এসিড","ঘ":"এসিটিক এসিড"},"answer":"খ","answer_text":"ল্যাকটিক এসিড","explanation":"দুধে থাকে ল্যাকটিক এসিড। সাইট্রিক এসিড ও এসিটিক এসিড পাওয়া যায় যথাক্রমে লেবু ও ভিনেগারে। অন্যদিকে নাইট্রিক এসিড একটি সবল অজৈব এসিড।"},{"id":"q0216","page":35,"printed_page":457,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"০৮","question":"কোনটি জৈব অম্ল?","exam_ref":"৩২তম বিসিএস","options":{"ক":"নাইট্রিক এসিড","খ":"হাইড্রোক্লোরিক এসিড","গ":"এসিটিক এসিড","ঘ":"সালফিউরিক এসিড"},"answer":"গ","answer_text":"এসিটিক এসিড","explanation":"জৈব অম্ল হল এমন এক ধরনের এসিড যা প্রাকৃতিক উৎস থেকে পাওয়া যায় এবং এর মধ্যে এক বা একাধিক কার্বন পরমাণু থাকে। উপর্যুক্ত অপশনগুলোর মধ্যে এসিটিক এসিড জৈব অম্ল। এর সংকেত CH₃COOH। অন্যদিকে নাইট্রিক এসিড (HNO₃) একটি অজৈব এসিড, যা সাধারণত স্বর্ণের খাদ বের করতে ব্যবহৃত হয়। এছাড়া হাইড্রোক্লোরিক এসিড (HCl) ও সালফিউরিক এসিড (H₂SO₄) হলো অজৈব সবল এসিড।"},{"id":"q0217","page":35,"printed_page":457,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"০৯","question":"স্বর্ণের খাদ বের করতে ব্যবহার করা হয়-","exam_ref":"৩২তম, ২৪তম (বাতিল) বিসিএস","options":{"ক":"সালফিউরিক এসিড","খ":"নাইট্রিক এসিড","গ":"সাইট্রিক এসিড","ঘ":"কার্বোলিক এসিড"},"answer":"খ","answer_text":"নাইট্রিক এসিড","explanation":""},{"id":"q0218","page":35,"printed_page":457,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"১০","question":"কৃষি জমিতে প্রধানত চুন ব্যবহার করা হয়-","exam_ref":"৩১তম বিসিএস","options":{"ক":"মাটির ক্ষয় রোধের জন্য","খ":"মাটির অম্লতা বৃদ্ধির জন্য","গ":"মাটির অম্লতা হ্রাসের জন্য","ঘ":"মাটির জৈব পদার্থ বৃদ্ধির জন্য"},"answer":"গ","answer_text":"মাটির অম্লতা হ্রাসের জন্য","explanation":"মাটি অম্লধর্মী না ক্ষারধর্মী তা pH দ্বারা পরিমাপ করা হয়। মাটির pH ৭ হলে তা নিরপেক্ষ হয়। pH ৭ থেকে যত কমতে থাকে অম্লতা তত বৃদ্ধি পায় এবং ৭ থেকে বেশি হলে ক্ষারকত্ব বৃদ্ধি পায়। মাটির অম্লত্ব বেড়ে গেলে তাতে চুন প্রয়োগ করে তা প্রশমন করা হয়।"},{"id":"q0219","page":35,"printed_page":457,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"১১","question":"নিচের কোনটি ক্ষারীয় অক্সাইড?","exam_ref":"২৯তম বিসিএস","options":{"ক":"P₄O₁০","খ":"MgO","গ":"CO","ঘ":"ZnO"},"answer":"খ","answer_text":"MgO","explanation":"ক্ষার ধাতু (Na,K,Rb,Cs) ও মৃৎক্ষার ধাতুর (Ca,Mg) অক্সাইডসমূহ ক্ষারকীয় অক্সাইড। তাই, MgO একটি ক্ষারকীয় অক্সাইড। ক্ষারকীয় অক্সাইড এসিডের সাথে বিক্রিয়া করে লবণ ও পানি উৎপন্ন করে।"},{"id":"q0220","page":36,"printed_page":458,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"১২","question":"অ্যালুমিনিয়াম সালফেটকে চলতি বাংলায় কি বলে?","exam_ref":"২৯তম বিসিএস","options":{"ক":"চুন","খ":"সেভিং সোপ","গ":"ফিটকিরি","ঘ":"কস্টিক সোডা"},"answer":"গ","answer_text":"ফিটকিরি","explanation":"পটাসিয়াম অ্যালুমিনিয়াম সালফেটের কেলাসকে পটাস এলাম বলা হয়। বাংলা ভাষায় এর নাম ফিটকিরি এবং এর রাসায়নিক সংকেত হচ্ছে, Al₂(SO₄)₃.K₂SO₄.২৪H₂O। চুন হচ্ছে মূলত ক্যালসিয়াম অক্সাইড (CaO), যার রাসায়নিক সংকেত Ca(OH)₂। শেভিং সোপের মূল উপাদান পটাসিয়াম স্টিয়ারেট। সোডিয়াম হাইড্রোক্সাইড (NaOH) হচ্ছে একটি ক্ষার, যা কস্টিক সোডা নামে পরিচিত।"},{"id":"q0221","page":36,"printed_page":458,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"১৩","question":"ম্যালিক এসিড-","exam_ref":"২৬তম বিসিএস","options":{"ক":"আমলকিতে পাওয়া যায়","খ":"কমলালেবুতে পাওয়া যায়","গ":"আঙ্গুরে পাওয়া যায়","ঘ":"টমেটোতে পাওয়া যায়"},"answer":"ঘ","answer_text":"টমেটোতে পাওয়া যায়","explanation":"আমলকিতে অক্সালিক এসিড, কমলালেবুতে অ্যাসকরবিক এসিড, আঙ্গুরে টারটারিক এসিড এবং টমেটোতে ম্যালিক অ্যাসিড পাওয়া যায়।"},{"id":"q0222","page":36,"printed_page":458,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"১৪","question":"টেস্টিং সল্ট-এর রাসায়নিক নাম কি?","exam_ref":"২৩তম বিসিএস","options":{"ক":"সোডিয়াম বাইকার্বোনেট","খ":"সোডিয়াম গ্লুটামেট","গ":"পটাশিয়াম বাইকার্বোনেট","ঘ":"সোডিয়াম মনোগ্লুটামেট"},"answer":"খ","answer_text":"সোডিয়াম গ্লুটামেট","explanation":"সঠিক উত্তর হবে মনোসোডিয়াম গ্লুটামেট (C₅H₈NO₄Na)। মনোসোডিয়াম গ্লুটামেটকে সোডিয়াম গ্লুটামেটও বলা হয়। সোডিয়াম বাইকার্বোনেট (NaHCO₃) হচ্ছে খাওয়ার সোডা এবং মনোসোডিয়াম গ্লুটামেটকে সাধারণ কথায় টেস্টিং সল্ট বলে।"},{"id":"q0223","page":36,"printed_page":458,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.২","topic_title":"এসিড, ক্ষার ও লবণ","number":"১৫","question":"'অ্যাকোয়া রেজিয়া' বলতে বুঝায়-","exam_ref":"১৭তম বিসিএস","options":{"ক":"কনসেনট্রেটেড সালফিউরিক এসিড","খ":"কনসেনট্রেটেড নাইট্রিক এসিড","গ":"কনসেনট্রেটেড সালফিউরিক এবং কনসেনট্রেটেড নাইট্রিক এসিডের মিশ্রণ","ঘ":"কনসেনট্রেটেড নাইট্রিক ও হাইড্রোক্লোরিক এসিডের মিশ্রণ"},"answer":"ঘ","answer_text":"কনসেনট্রেটেড নাইট্রিক ও হাইড্রোক্লোরিক এসিডের মিশ্রণ","explanation":"এক মোল গাঢ় নাইট্রিক এসিড (HNO₃) এবং তিন মোল গাঢ় হাইড্রোক্লোরিক এসিডের (HCl) মিশ্রণকে 'অ্যাকোয়া রেজিয়া' বা রাজ অম্ল বলে। স্বর্ণ, প্লাটিনাম প্রভৃতি ধাতু গলাতে এটি ব্যবহৃত হয়।"},{"id":"q0224","page":36,"printed_page":458,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.৩","topic_title":"পরিষ্কারক দ্রব্য","number":"০১","question":"সাবানের আয়নিক গ্রুপ হলো-","exam_ref":"৪৪তম বিসিএস","options":{"ক":"R₃NH⁺","খ":"SO₃−Na⁺","গ":"R₂NH₂⁺","ঘ":"COO−Na⁺"},"answer":"ঘ","answer_text":"COO−Na⁺","explanation":"সাবানের রাসায়নিক সংকেত- C₁₇H₃₅COONa। অর্থাৎ সাবান পানিতে দ্রবীভূত হয়ে RCOO⁻ ও Na⁺ আয়নে পরিণত হয়।"},{"id":"q0225","page":36,"printed_page":458,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.৩","topic_title":"পরিষ্কারক দ্রব্য","number":"০২","question":"কোন কোন স্থানে সলিড ফিনাইল ব্যবহার করা হয়?","exam_ref":"২৯তম বিসিএস","options":{"ক":"পায়খানা, প্রস্রাবখানায়","খ":"গোসলখানায়","গ":"পুকুরে","ঘ":"নালায়"},"answer":"ক","answer_text":"পায়খানা, প্রস্রাবখানায়","explanation":"জীবাণুনাশক ও পরিষ্কারক হিসেবে সাধারণত পায়খানা প্রস্রাবখানায় সলিড ফিনাইল ব্যবহার করা হয়।"},{"id":"q0226","page":36,"printed_page":458,"chapter":"অধ্যায় ১১","chapter_title":"এসিড, ক্ষার ও লবণ","topic_code":"১১.৩","topic_title":"পরিষ্কারক দ্রব্য","number":"০৩","question":"টুথপেস্টের প্রধান উপাদান-","exam_ref":"১৭তম বিসিএস","options":{"ক":"জেলি ও মশলা","খ":"ভোজ্য তেল ও সোডা","গ":"সাবান ও পাউডার","ঘ":"ফ্লোরাইড ও ক্লোরোফিল"},"answer":"গ","answer_text":"সাবান ও পাউডার","explanation":"সাধারণ মানের টুথপেস্টে ৩০% চক পাউডার, ১৫% সাবান, ১০% ট্রাই ও ডাই ক্যালসিয়াম ফসফেট এবং ৫.৫% গাম ট্রাগোকান্থা মিউসিলেজ রয়েছে। টুথপেস্টে ফ্লোরাইড ব্যবহার করা হয়, কারণ এটা দাঁতের ক্ষয়রোধ করে। এছাড়া মেনথলও ব্যবহার করা হয়।"},{"id":"q0227","page":37,"printed_page":459,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"০১","question":"বিরল ভূতল খনিজ (Rare-Earth Minerals) সম্পর্কিত কোন তথ্যটি সঠিক?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"এর মধ্যে ১৫টি ধাতু রয়েছে","খ":"লিথিয়াম এই খনিজের মধ্যে অন্যতম সদস্য","গ":"এর অসাধারণ চৌম্বক ধর্ম রয়েছে","ঘ":"ইউক্রেন এ খনিজ উৎপাদনে শীর্ষ অবস্থানে আছে"},"answer":"গ","answer_text":"এর অসাধারণ চৌম্বক ধর্ম রয়েছে","explanation":"বিরল মৃত্তিকা বা রেয়ার আর্থ (Rare Earth) খনিজ হলো ১৭টি ধাতব মৌলের সমষ্টি। এই ১৭টি উপাদান হলো ল্যান্থানাইড সিরিজের ১৫টি মৌল (ল্যান্থানাম থেকে লুটেসিয়াম), স্ক্যান্ডিয়াম ও ইট্রিয়াম। এগুলো হাইব্রিড গাড়ি, মোবাইল ফোন, ক্ষেপণাস্ত্রব্যবস্থা এবং অন্যান্য উচ্চ প্রযুক্তির পণ্য তৈরিতে ব্যবহৃত হয়। এই বিরল-মৃত্তিকা উপাদানগুলো (বিশেষত নিওডিমিয়াম ও সামারিয়াম) অন্যান্য উপাদানের সাথে মিশিয়ে অত্যন্ত শক্তিশালী স্থায়ী চুম্বক তৈরি করা হয়, যা 'বিরল-মৃত্তিকা চুম্বক' নামে পরিচিত। বিশ্বের মোট বিরল খনিজের ৬০ শতাংশ আকরিকের নিয়ন্ত্রণ চীনের হাতে। ওয়াশিংটনভিত্তিক সাময়িকী দ্য ডিপ্লোম্যাট বলছে, ৮৫ শতাংশ আকরিকের উৎপাদন চীনের নিয়ন্ত্রণে।"},{"id":"q0228","page":37,"printed_page":459,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"০২","question":"কোন ধাতু পানিতে ফেললে আগুন ধরে যায়?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"সোডিয়াম","খ":"ম্যাগনেসিয়াম","গ":"রেডিয়াম","ঘ":"ইউরেনিয়াম"},"answer":"ক","answer_text":"সোডিয়াম","explanation":"যখন কিছু ধাতু পানি বা আর্দ্র পরিবেশের সংস্পর্শে আসে, তখন তারা তীব্র প্রতিক্রিয়া দেখাতে পারে। এর মধ্যে সোডিয়াম একটি অত্যন্ত প্রতিক্রিয়াশীল ধাতু। পানি বা আর্দ্রতার সঙ্গে মিশে সোডিয়াম তাৎক্ষণিকভাবে তাপ উৎপন্ন করে এবং কখনও কখনও আগুন ধরে যায়। অন্যদিকে, ম্যাগনেসিয়াম শক্তিশালী উত্তাপে জ্বলে, কিন্তু সাধারণ পানির সঙ্গে তা সহজে প্রতিক্রিয়া দেখায় না। রেডিয়াম এবং ইউরেনিয়াম তেজষ্ক্রিয় কঠিন পদার্থ এবং পানি বা আর্দ্রতার সংস্পর্শে আগুন ধরে যাওয়ার মতো প্রতিক্রিয়া দেখায় না।"},{"id":"q0229","page":37,"printed_page":459,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"০৩","question":"সোডিয়াম ক্লোরাইড (NaCl) কেলাসের গঠন কীরূপ?","exam_ref":"৪৫তম বিসিএস","options":{"ক":"পৃষ্ঠতল কেন্দ্রিক ঘনকাকৃতির","খ":"দেহ-কেন্দ্রিক ঘনকাকার","গ":"সংঘবদ্ধ-ঘনকাকার","ঘ":"সংঘবদ্ধ ষড়কোণিক আকার"},"answer":"ক","answer_text":"পৃষ্ঠতল কেন্দ্রিক ঘনকাকৃতির","explanation":"যে সকল কঠিন পদার্থ একটি সুনির্দিষ্ট জ্যামিতিক আকারের পুনরাবৃত্তির মাধ্যমে গঠিত হয় তাকে কেলাসাকার বা crystalline পদার্থ বলে। সোডিয়াম ক্লোরাইড (NaCl) একটি স্ফটিকাকার পদার্থ। ঘনক আকৃতির কেলাসের প্রকারভেদ — সাধারণ ঘনকাকার কেলাস (Simple Cubic): ঘনকের প্রতিটি কোণায় একটি করে, মোট ৮টি পরমাণু থাকে; প্যাকিং ঘনত্ব সবচেয়ে কম; উদাহরণ CsCl। বস্তু কেন্দ্রিক কেলাস (Body Centered Cubic): প্রতিটি কোণায় ১টি করে ৮টি এবং কেন্দ্রে ১টি সহ মোট ৯টি পরমাণু থাকে; প্যাকিং ঘনত্ব মাঝামাঝি; উদাহরণ আয়রন (Fe), ক্রোমিয়াম (Cr)। পার্শ্ব কেন্দ্রিক কেলাস (Face Centered Cubic): প্রতিটি কোণায় একটি করে ৮টি এবং প্রতিটি পৃষ্ঠে একটি করে ৬টি পরমাণু থাকে; প্যাকিং ঘনত্ব সবচেয়ে বেশি; উদাহরণ ZnS, NaF, NaCl (Rock Salt Structure)। সোডিয়াম ক্লোরাইড এই পার্শ্ব/পৃষ্ঠতল কেন্দ্রিক ঘনকাকৃতি (FCC) গঠনের অন্তর্ভুক্ত।"},{"id":"q0230","page":37,"printed_page":459,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"০৪","question":"সানস্ক্রিন লোশন তৈরিতে কোন ন্যানো পার্টিকেল ব্যবহৃত হয়?","exam_ref":"৪৫তম বিসিএস","options":{"ক":"Na₂O","খ":"ZnO","গ":"Al₂O₃","ঘ":"CuO"},"answer":"খ","answer_text":"ZnO","explanation":"সূর্যের ক্ষতিকর আল্ট্রা ভায়োলেট বা অতিবেগুনি রশ্মি থেকে রক্ষা পেতে সানস্ক্রিনে ZnO এর ন্যানো পার্টিকেল ব্যবহার করা হয়। সাধারণত সানস্ক্রিনে ZnO এর পাউডার মিশ্রিত করলে সাদা রং ধারণ করে। কিন্তু ন্যানো পার্টিকেল হিসেবে ব্যবহার করলে ZnO এর সাদা রং আর দেখা যায় না, সেটা স্বচ্ছ হয়ে যায়।"},{"id":"q0231","page":38,"printed_page":460,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"০৫","question":"ইলেকট্রিক বাল্ব-এর ফিলামেন্ট যার দ্বারা তৈরি-","exam_ref":"৪১তম, ২৯তম বিসিএস","options":{"ক":"আয়রন","খ":"কার্বন","গ":"টাংস্টেন","ঘ":"লেড"},"answer":"গ","answer_text":"টাংস্টেন","explanation":"বৈদ্যুতিক বাল্বের (Electric bulb) ভিতরে ফিলামেন্ট নামক বিশেষ এক ধরনের তারের কুণ্ডলী থাকে যার মধ্য দিয়ে বিদ্যুৎ প্রবাহিত হলে তাপ ও আলো উৎপন্ন হয়। এ ফিলামেন্টটি টাংস্টেন নামক এক প্রকার উচ্চ গলনাঙ্কবিশিষ্ট ধাতুর তৈরি। এর গলনাঙ্ক প্রায় ৩৪২২°C।"},{"id":"q0232","page":38,"printed_page":460,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"০৬","question":"কোনটি মৌলিক পদার্থ?","exam_ref":"৩৩তম বিসিএস","options":{"ক":"লোহা","খ":"ব্রোঞ্জ","গ":"পানি","ঘ":"ইস্পাত"},"answer":"ক","answer_text":"লোহা","explanation":"যে পদার্থকে রাসায়নিকভাবে বিশ্লেষণ করে অন্য কোনো পদার্থ পাওয়া যায় না তাকে মৌল বা মৌলিক পদার্থ বলে। যেমন- সোনা, তামা, লোহা, হাইড্রোজেন, নাইট্রোজেন, অক্সিজেন ইত্যাদি। পক্ষান্তরে, ব্রোঞ্জ (তামা+টিন), পানি (হাইড্রোজেন+অক্সিজেন), ইস্পাত (লোহা+নির্দিষ্ট পরিমাণ কার্বন) হচ্ছে যৌগিক পদার্থ।"},{"id":"q0233","page":38,"printed_page":460,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"০৭","question":"কোন ধাতু স্বাভাবিক তাপমাত্রায় তরল থাকে?","exam_ref":"৩৩তম বিসিএস","options":{"ক":"পারদ","খ":"লিথিয়াম","গ":"জার্মেনিয়াম","ঘ":"ইউরেনিয়াম"},"answer":"ক","answer_text":"পারদ","explanation":"পারদ সাধারণ তাপমাত্রায় তরল থাকে। পারদের পারমাণবিক ভর ২০০.৫৯। এটি প্রকৃতিতে প্রাপ্ত সবচেয়ে ভারী তরল ধাতু। এর ঘনত্ব ১৩.৫৩৪ কেজি/ঘন মি.। পারদ −৩৯° সে. তাপমাত্রায় কঠিন আকার ধারণ করে।"},{"id":"q0234","page":38,"printed_page":460,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"০৮","question":"কোনটি সিমেন্ট তৈরির অন্যতম কাঁচামাল?","exam_ref":"৩৩তম বিসিএস","options":{"ক":"জিপসাম","খ":"সালফার","গ":"সোডিয়াম","ঘ":"খনিজ লবণ"},"answer":"ক","answer_text":"জিপসাম","explanation":"সিমেন্ট নির্মাণ কাজের অপরিহার্য উপাদান জিপসাম। দালান কোঠা নির্মাণে যে কংক্রিট বানানো হয় তাতে জোড়া লাগাবার উপকরণ হিসেবে সিমেন্ট ব্যবহৃত হয়। সিমেন্টে বিদ্যমান উল্লেখযোগ্য রাসায়নিক উপাদানগুলো হলো সামান্য ম্যাগনেসিয়াম অক্সাইড ও সালফার ট্রাইঅক্সাইডসহ চুন, সিলিকা, অ্যালুমিনা ও লৌহ। জিপসামের রাসায়নিক সংকেত হল (CaSO₄.২H₂O)।"},{"id":"q0235","page":38,"printed_page":460,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"০৯","question":"কোন ধাতু পানি অপেক্ষা হালকা?","exam_ref":"২৯তম বিসিএস","options":{"ক":"ম্যাগনেসিয়াম","খ":"ক্যালসিয়াম","গ":"সোডিয়াম","ঘ":"পটাসিয়াম"},"answer":"গ","answer_text":"সোডিয়াম","explanation":"সোডিয়াম (Na), ম্যাগনেসিয়াম (Mg), পটাসিয়াম (K) ও ক্যালসিয়াম (Ca)-এর পারমাণবিক সংখ্যা যথাক্রমে 11, 12, 19 ও 20 এবং এদের পারমাণবিক ভর যথাক্রমে ২৩, ২৪, ৩৯, ৪০। উল্লিখিত ধাতুসমূহের মধ্যে সোডিয়ামের পারমাণবিক ভর সবচেয়ে কম হওয়ায় এটি অন্য তিনটি ধাতু অপেক্ষা হালকা এবং সোডিয়াম পানি অপেক্ষাও হালকা।"},{"id":"q0236","page":38,"printed_page":460,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"১০","question":"পৃথিবীতে সবচেয়ে বেশি ধাতু কোনটি?","exam_ref":"২৯তম বিসিএস","options":{"ক":"লোহা","খ":"সিলিকন","গ":"পারদ","ঘ":"তামা"},"answer":"ক","answer_text":"লোহা","explanation":"উল্লিখিত মৌলসমূহের মধ্যে লোহা, পারদ ও তামা হচ্ছে ধাতু, কিন্তু সিলিকন কোনো ধাতু নয়। সিলিকন হলো এক ধরনের অর্ধপরিবাহী। ভূত্বকে যে সকল ধাতু পাওয়া যায় তাদের মধ্যে প্রাচুর্যের দিক থেকে অ্যালুমিনিয়ামের অবস্থান প্রথম (প্রায় ৮%) এবং লৌহের অবস্থান দ্বিতীয় (প্রায় ৫%)। তবে ধাতুসমূহের মধ্যে পৃথিবীতে সবচেয়ে বেশি পাওয়া যায় লোহা এবং লোহার ব্যবহারও সবচেয়ে বেশি।"},{"id":"q0237","page":38,"printed_page":460,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"১১","question":"কোনটি বেশি স্থিতিস্থাপক?","exam_ref":"২৪তম বিসিএস (বাতিল)","options":{"ক":"ইস্পাত","খ":"রাবার","গ":"কাচ","ঘ":"পানি"},"answer":"ক","answer_text":"ইস্পাত","explanation":"কোনো বস্তুর উপর বাইরে থেকে বল প্রয়োগ করলে বস্তু নিজের আকার বজায় রাখার চেষ্টা করে। বস্তুর এই ধর্মকে স্থিতিস্থাপকতা বলে। বাহ্যিক বল প্রয়োগে যে পদার্থ যত কম বিকৃত হবে সেই পদার্থের স্থিতিস্থাপকতা তত বেশি। উদাহরণ: ইস্পাত ও রাবারের মধ্যে বল প্রয়োগে ইস্পাত অনেক কম বিকৃত হয় এবং রাবার অনেক বেশি বিকৃত হয়। তাই ইস্পাতের স্থিতিস্থাপকতা রাবারের চেয়ে অনেক বেশি।"},{"id":"q0238","page":38,"printed_page":460,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.১","topic_title":"ধাতু ও ধাতব যৌগ","number":"১২","question":"কোন বস্তুটির স্থিতিস্থাপকতা বেশি?","exam_ref":"২০তম বিসিএস","options":{"ক":"রবার","খ":"এলুমিনিয়াম","গ":"লৌহ","ঘ":"তামা"},"answer":"গ","answer_text":"লৌহ","explanation":"যেসব বস্তুর ক্ষেত্রে পীড়ন এবং বিকৃতির অনুপাত বেশি অর্থাৎ স্থিতিস্থাপক গুণাংকের মান বেশি সেসব বস্তু বেশি স্থিতিস্থাপক। আর যেসব বস্তুর ক্ষেত্রে পীড়ন এবং বিকৃতির অনুপাত কম, অর্থাৎ স্থিতিস্থাপক গুণাংকের মান কম সেসব বস্তু কম স্থিতিস্থাপক। লৌহের ক্ষেত্রে অধিক পীড়ন দেয়া সত্ত্বেও বিকৃতির মান যৎসামান্য হয়। কিন্তু রাবার, এলুমিনিয়াম ও তামার ক্ষেত্রে অল্প পীড়ন দিলেই বিকৃতির মান অনেক বেশি হয়।"},{"id":"q0239","page":39,"printed_page":461,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.২","topic_title":"সংকর ধাতু","number":"০১","question":"স্টেইনলেস স্টিলের অন্যতম উপাদান-","exam_ref":"৩৩তম বিসিএস","options":{"ক":"তামা","খ":"দস্তা","গ":"ক্রোমিয়াম","ঘ":"এলুমিনিয়াম"},"answer":"গ","answer_text":"ক্রোমিয়াম","explanation":"মরিচাহীন ইস্পাত (স্টেইনলেস স্টিল) হলো লোহা (Fe), ক্রোমিয়াম (Cr) ও নিকেল (Ni) এর একটি সংকর ধাতু। এর সংযুক্তি যথাক্রমে- লোহা ৭৪%, ক্রোমিয়াম ১৮% ও নিকেল ৮%। স্টেইনলেস স্টিলের অন্যতম উপাদান ক্রোমিয়াম। স্টেইনলেস স্টিলে যাতে মরিচা না ধরে এবং এর গুণাগুণ বৃদ্ধি করার জন্য এতে ক্রোমিয়াম ও নিকেল মিশ্রিত করা হয়।"},{"id":"q0240","page":39,"printed_page":461,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.২","topic_title":"সংকর ধাতু","number":"০২","question":"পিতলের উপাদান হলো-","exam_ref":"৩৩তম, ৩২তম, ৩০তম, ১০তম বিসিএস","options":{"ক":"তামা ও টিন","খ":"তামা ও নিকেল","গ":"তামা ও সিসা","ঘ":"তামা ও দস্তা"},"answer":"ঘ","answer_text":"তামা ও দস্তা","explanation":"পিতল (ব্রাস), তামা (Cu) ও দস্তার (Zn) তৈরি একটি সংকর ধাতু। এতে তামার পরিমাণ ৬৫% ও দস্তা ৩৫%। পিতল বিভিন্ন অলংকার, কলকজার বিয়ারিং, বৈদ্যুতিক সুইচ, দরজার হাতল, ডেকচি, পাতিল ইত্যাদি তৈরিতে ব্যবহৃত হয়। অন্যদিকে তামা ও টিন মিশিয়ে তৈরি হয় ব্রোঞ্জ কাঁসা নামক সংকর।"},{"id":"q0241","page":39,"printed_page":461,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.২","topic_title":"সংকর ধাতু","number":"০৩","question":"বৈদ্যুতিক হিটার ও ইস্ত্রিতে কোন ধাতুর তার ব্যবহার করা হয়?","exam_ref":"২৯তম, ২৬তম বিসিএস","options":{"ক":"তামা","খ":"নাইক্রোম","গ":"স্টেনিয়াম","ঘ":"প্লাটিনাম"},"answer":"খ","answer_text":"নাইক্রোম","explanation":"বৈদ্যুতিক হিটার ও বৈদ্যুতিক ইস্ত্রির তাপ উৎপাদনের জন্য উচ্চ গলনাঙ্ক ও উচ্চ আপেক্ষিক রোধ বিশিষ্ট নাইক্রোমের তার ব্যবহৃত হয়। তামা দিয়ে বিদ্যুৎবাহী তার, বৈদ্যুতিক কয়েল, বিভিন্ন সংকর ধাতু ইত্যাদি তৈরি করা হয়। নাইক্রোম মূলত ৭৫% নিকেল ও ২৫% ক্রোমিয়াম এর তৈরি একটি সংকর ধাতু। এর আপেক্ষিক রোধ অনেক বেশি তাই বিদ্যুৎ প্রবাহের ফলে দ্রুত উত্তপ্ত হয়ে ওঠে।"},{"id":"q0242","page":39,"printed_page":461,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.২","topic_title":"সংকর ধাতু","number":"০৪","question":"তামার সাথে নিচের কোনটি মেশালে পিতল হয়?","exam_ref":"২৩তম বিসিএস","options":{"ক":"নিকেল","খ":"টিন","গ":"সিসা","ঘ":"দস্তা (জিংক)"},"answer":"ঘ","answer_text":"দস্তা (জিংক)","explanation":""},{"id":"q0243","page":39,"printed_page":461,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.২","topic_title":"সংকর ধাতু","number":"০৫","question":"ইস্পাত সাধারণ লোহা থেকে ভিন্ন। কারণ এতে-","exam_ref":"১১তম বিসিএস","options":{"ক":"বিশেষ ধরনের আকরিক ব্যবহার করা হয়েছে","খ":"সুনিয়ন্ত্রিত পরিমাণ কার্বন রয়েছে","গ":"লোহাকে টেম্পারিং করা হয়েছে","ঘ":"সব বিজাতীয় দ্রব্য বের করে দেয়া হয়েছে"},"answer":"খ","answer_text":"সুনিয়ন্ত্রিত পরিমাণ কার্বন রয়েছে","explanation":"লোহার সঙ্গে সুনিয়ন্ত্রিত মাত্রার কার্বন মিশিয়ে ইস্পাত তৈরি হয়। এতে ০.১৫%-১.৫% কার্বন থাকে। ফলে এর স্থিতিস্থাপকতা বৃদ্ধি পায়।"},{"id":"q0244","page":39,"printed_page":461,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.৩","topic_title":"অধাতু এবং এর যৌগ","number":"০১","question":"নিচের কোনটি সিরামিক উপাদানের প্রধান কাঁচামাল?","exam_ref":"৪৫তম বিসিএস","options":{"ক":"SiO₂","খ":"Na₂CO₃","গ":"Fe₂O₃","ঘ":"NaNO₃"},"answer":"ক","answer_text":"SiO₂","explanation":"সিরামিক হলো একটি অজৈব ও অধাতব কঠিন পদার্থ যা অতি উচ্চ তাপে শক্ত করে তৈরি হয়। সিলিকন ডাই অক্সাইড (SiO₂) বা সিলিকা সিরামিক উৎপাদনের অন্যতম মূল উপকরণ। সিরামিক মূলত চীনা মাটি বা সাদা মাটির সাথে ফেল্সপার (K₂O.Al₂O₃.6SiO₂) এবং সিলিকা (SiO₂) মিশিয়ে প্রস্তুত করা হয়। বৈশিষ্ট্য: তাপ পরিবহণ ক্ষমতা কম, শক্ত ও টেকসই, উচ্চ চাপ সহ্য করতে পারে, ক্ষয় হয় না। ব্যবহার: স্যানিটারি পণ্য, কাটিং টুল, তাপ কুপরিবাহী হিসেবে।"},{"id":"q0245","page":39,"printed_page":461,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.৩","topic_title":"অধাতু এবং এর যৌগ","number":"০২","question":"নিচের কোনটি প্রাইমারি দূষক?","exam_ref":"৪৫তম বিসিএস","options":{"ক":"SO₃","খ":"N₂O₅","গ":"NO","ঘ":"HNO₃"},"answer":"গ","answer_text":"NO","explanation":"যে সকল পদার্থ পরিবেশের ভৌত, রাসায়নিক এবং জৈবিক উপাদানসমূহে এমন প্রত্যক্ষ বা পরোক্ষ পরিবর্তন করে যা ক্ষতির কারণ হয় তাকে দূষক বলে। যে সকল দূষক সরাসরি উৎস থেকে আসে তাদের প্রাইমারি দূষক বলে। যেমন: CO₂, CO, NO, SO₂ ইত্যাদি। অপরদিকে প্রাইমারি দূষক থেকে উৎপাদিত দূষকগুলোকে সেকেন্ডারি দূষক বলে। যেমন: O₃, SO₃, N₂O₅ ইত্যাদি।"},{"id":"q0246","page":39,"printed_page":461,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.৩","topic_title":"অধাতু এবং এর যৌগ","number":"০৩","question":"বজ্রবৃষ্টির ফলে মাটিতে উদ্ভিদের কোন খাদ্য উপাদান বৃদ্ধি পায়?","exam_ref":"৪৪তম বিসিএস","options":{"ক":"নাইট্রোজেন","খ":"পটাশিয়াম","গ":"অক্সিজেন","ঘ":"ফসফরাস"},"answer":"ক","answer_text":"নাইট্রোজেন","explanation":"মাটির উর্বরতা বৃদ্ধিতে সাহায্য করে নাইট্রোজেন। বাতাসের নাইট্রোজেন পানিতে মিশে মাটিতে শোষিত হওয়ার পরে মাটির উর্বরতা বৃদ্ধি করে। নাইট্রেট (NO₃⁻) আয়ন হিসেবে উদ্ভিদ সাধারণত মাটি থেকে নাইট্রোজেন সংগ্রহ করে। বজ্রবৃষ্টির ফলে মাটিতে উদ্ভিদের খাদ্য উপাদান নাইট্রোজেনের পরিমাণ বৃদ্ধি পায়। কারণ আকাশে বিদ্যুৎস্ফুরণের সময় নাইট্রোজেন অক্সিজেনের সাথে যুক্ত হয়ে নাইট্রোজেনের অক্সাইডসমূহ উৎপন্ন করে।"},{"id":"q0247","page":39,"printed_page":461,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.৩","topic_title":"অধাতু এবং এর যৌগ","number":"০৪","question":"গ্রাফিন (graphene) কার বহুরূপী?","exam_ref":"৪১তম বিসিএস","options":{"ক":"কার্বন","খ":"কার্বন ও অক্সিজেন","গ":"কার্বন ও হাইড্রোজেন","ঘ":"কার্বন ও নাইট্রোজেন"},"answer":"ক","answer_text":"কার্বন","explanation":"গ্রাফিন (graphene) কার্বনের একটি রূপ, যা একটি সূক্ষ্ম চাকতিরূপে বিরাজ করে, চাকতিটির ক্ষেত্রফল যত বড়ই হোক না কেন পুরুত্ব মাত্র একটি পরমাণুর আকারের সমান। এক্ষেত্রে পরমাণুগুলো এমনভাবে বিন্যস্ত হয় যে, একটি ষড়ভুজাকার মৌচাকের মত আকৃতি গঠিত হয়। এটি কাচের মত স্বচ্ছ। ইস্পাতের তুলনায় প্রায় ১০০ গুণ বেশি শক্তিশালী এবং এখন পর্যন্ত আবিষ্কৃত সব মৌল ও যৌগের মধ্যে সবচেয়ে ভালো বিদ্যুৎ পরিবাহী। প্লাস্টিকের মধ্যে শতকরা মাত্র ১ ভাগ গ্রাফিন মেশালে তা তড়িৎ সুপরিবাহীতে পরিণত হতে পারে। ২০০৪ সালের অক্টোবরে গ্রাফিন আবিষ্কারের ঘোষণা দেয়া হয়েছিল। এটি আবিষ্কারের জন্য আন্দ্রে গেইম এবং কনস্টানটিন নভোসেলভ ২০১০ সালে পদার্থবিজ্ঞানে নোবেল পুরস্কার লাভ করেন।"},{"id":"q0248","page":40,"printed_page":462,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.৩","topic_title":"অধাতু এবং এর যৌগ","number":"০৫","question":"কোন গ্যাসটি 'ড্রাই আইস' তৈরিতে ব্যবহার করা হয়?","exam_ref":"৩৮তম বিসিএস","options":{"ক":"অক্সিজেন","খ":"কার্বন ডাই-অক্সাইড","গ":"সালফার ডাই-অক্সাইড","ঘ":"নাইট্রোজেন ডাই-অক্সাইড"},"answer":"খ","answer_text":"কার্বন ডাই-অক্সাইড","explanation":"'ড্রাই আইস' তৈরিতে কার্বন ডাই-অক্সাইড গ্যাস ব্যবহার করা হয়। কার্বন ডাই-অক্সাইড (CO₂) গ্যাসকে −৭৮.৫°C তাপমাত্রায় শীতল করলে এটি তরল না হয়ে সরাসরি কঠিন অবস্থায় রূপান্তরিত হয়। একে শুষ্ক বরফ বা ড্রাই আইস বলা হয়। শুষ্ক বরফ নামকরণের তাৎপর্য হলো এটি দেখতে বরফের মত সাদা অথচ হাতে ধরলে হাত ভেজায় না। এটি নাট্যমঞ্চে ধোঁয়া তৈরিতে ও হিমায়ক হিসেবে ব্যবহৃত হয়।"},{"id":"q0249","page":40,"printed_page":462,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_  পূর্বে এটি High Pressure Liquid Chromatography নামে পরিচিত ছিল। এটি এমন একটি প্রক্রিয়া, যা তরল মিশ্রণকে তার উপাদান অনুযায়ী আলাদা করে বিশ্লেষণ করতে সাহায্য করে। এটি ঔষধ উৎপাদন, খাদ্য শিল্প, রাসায়নিক গবেষণা এবং পরিবেশ বিশ্লেষণে ব্যবহৃত হয়।"},{"id":"q0260","page":41,"printed_page":463,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.৪","topic_title":"জৈব যৌগ","number":"০২","question":"কাঁদুনে গ্যাসের অপর নাম কী?","exam_ref":"৪১তম বিসিএস","options":{"ক":"ক্লোরোপিক্রিন","খ":"মিথেন","গ":"নাইট্রোজেন","ঘ":"ইথেন"},"answer":"ক","answer_text":"ক্লোরোপিক্রিন","explanation":"কাঁদুনে গ্যাসের অপর নাম ক্লোরোপিক্রিন। অশ্রু উৎপাদক বলে একে কাঁদুনে গ্যাস বলা হয়। এর রাসায়নিক নাম হলো নাইট্রোক্লোরোফর্ম (CCl₃NO₂)। ক্লোরোফর্মের সাথে গাঢ় নাইট্রিক এসিডের বিক্রিয়ায় ক্লোরোপিক্রিন উৎপন্ন হয় (CHCl₃ + HNO₃ → CCl₃NO₂ + H₂O)।"},{"id":"q0261","page":41,"printed_page":463,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.৪","topic_title":"জৈব যৌগ","number":"০৩","question":"ইস্টের সংশ্লিষ্টতা নেই কোন শিল্পে?","exam_ref":"৩৭তম বিসিএস","options":{"ক":"মদ্য শিল্পে (Wine industry)","খ":"রুটি শিল্পে (Bakery)","গ":"সাইট্রিক এসিড উৎপাদনে","ঘ":"এক কোষীয় প্রোটিন (Single-cell-protein) তৈরিতে"},"answer":"গ","answer_text":"সাইট্রিক এসিড উৎপাদনে","explanation":"ইস্ট একধরনের আদিকোষী অণুজীব যা প্রকৃতিতে খুবই সহজলভ্য। এটা বেকারি শিল্পে পাউরুটি, কেকসহ নানা খাবার তৈরি, চোলাই বিয়ার ও মদ্য তৈরি, ত্বক ও চুলের যত্নে, ডায়েটে সম্পূরক খাদ্য হিসেবে, ওষুধ তৈরি ইত্যাদি ক্ষেত্রে বহুল ব্যবহৃত হয়। সাইট্রিক এসিড উৎপাদনে ইস্টের কোনো সম্পৃক্ততা নেই। সাইট্রিক এসিড উৎপাদনে ব্যবহার করা হয় পেনিসিলিয়াম।"},{"id":"q0262","page":41,"printed_page":463,"chapter":"অধ্যায় ১২","chapter_title":"অজৈব ও জৈব যৌগের রসায়ন","topic_code":"১২.৪","topic_title":"জৈব যৌগ","number":"০৪","question":"ফল পাকানোর জন্য দায়ী কী?","exam_ref":"৩০তম বিসিএস","options":{"ক":"ইথিলিন","খ":"প্রপিন","গ":"লাইকোপেন","ঘ":"মিথিলিন"},"answer":"ক","answer_text":"ইথিলিন","explanation":"ফল পাকানোর জন ্বাস নেয়-","exam_ref":"৩৪তম, ২১তম, ১৬তম বিসিএস","options":{"ক":"পটকা মাছ","খ":"হাঙ্গর","গ":"শুশুক","ঘ":"জেলী ফিস"},"answer":"গ","answer_text":"শুশুক","explanation":"শুশুক বা ডলফিন জাতীয় প্রাণীগুলো পানিতে বাস করলেও মাছের মতো ফুলকার সাহায্যে পানি থেকে অক্সিজেন গ্রহণ করতে পারে না। এরা পানি থেকে ভেসে উঠে মাথার উপর আড়াআড়িভাবে থাকা ছিদ্রের সাহায্যে বাতাস থেকে অক্সিজেন গ্রহণ করে। শুশুক একটি স্তন্যপায়ী প্রাণী। এছাড়া শুশুকের মতো তিমিও বাতাসে নিঃশ্বাস নেয়।"},{"id":"q0279","page":43,"printed_page":465,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.২","topic_title":"জীববৈচিত্র্য","number":"০৪","question":"মাশরুম এক ধরনের-","exam_ref":"৩২তম বিসিএস","options":{"ক":"অপুষ্পক উদ্ভিদ","খ":"পরজীবী উদ্ভিদ","গ":"ফাঙ্গাস","ঘ":"অর্কিড"},"answer":"গ","answer_text":"ফাঙ্গাস","explanation":"মাশরুম বা ব্যাঙের ছাতা এক ধরনের ফাঙ্গাস (Fungus) বা ছত্রাক। Fungi কিংডমের Basidiomycetes শ্রেণি সাধারণভাবে মাশরুম বা ব্যাঙের ছাতা নামে পরিচিত। এরা বর্ণহীন বা সাদা। এদের দেহে ক্লোরোফিল নেই। তাই এরা পরজীবী।"},{"id":"q0280","page":43,"printed_page":465,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.২","topic_title":"জীববৈচিত্র্য","number":"০৫","question":"মূল নেই কোন উদ্ভিদে?","exam_ref":"২৪তম বিসিএস","options":{"ক":"ফণীমনসা","খ":"বীরুৎ","গ":"গুল্ম","ঘ":"সাইকাস"},"answer":"","answer_text":"Blank (উৎসের ব্যাখ্যা অনুযায়ী তালিকাভুক্ত সব উদ্ভিদেরই মূল রয়েছে)","explanation":"উপরিউক্ত সকল উদ্ভিদেরই মূল রয়েছে। ফণীমনসা টেরিডোফাইটা গ্রুপের উদ্ভিদ। এ জাতীয় উদ্ভিদের মূল, কাণ্ড ও পাতা থাকে কিন্তু ফুল ও ফল হয় না। কোমল কাণ্ডযুক্ত ছোট উদ্ভিদকে বীরুৎ বলে। যেমন- ধান, ছোলা, আদা ইত্যাদি। সাইকাস হচ্ছে ফ্যানেরোগ্যামিয়া (Phanerogamia) গ্রুপের উদ্ভিদ, যাদের ফুল হয় ও মূল, কাণ্ড প্রভৃতি থাকে এবং যেসব উদ্ভিদ আকারে ছোট ও কাষ্ঠল কিন্তু গুঁড়ি নেই তাদেরকে গুল্ম বলে। যেমন- গোলাপ, জবা ইত্যাদি। পৃথিবীতে কিছু শৈবাল ও ছত্রাক রয়েছে, যাদের মূল নেই। যেমন- মিউকর, সারগাসাম, ঈস্ট ইত্যাদি। এদের মূলের পরিবর্তে রাইজয়েড থাকে।","source_note":"উৎসে উত্তর 'Blank' — ব্যাখ্যা বলছে ":"১৩.৫","topic_title":"DNA","number":"০২","question":"নিচের কোনটি DNA এর নাইট্রোজেন বেস?","exam_ref":"২৭তম বিসিএস","options":{"ক":"ইউরাসিল","খ":"গোয়ানিন","গ":"পিরিডক্সিন","ঘ":"অ্যাসপারাজিন"},"answer":"খ","answer_text":"গোয়ানিন","explanation":"DNA- এর পূর্ণরূপ হলো De-oxyribonucleic acid। DNA-তে ৪ প্রকার নাইট্রোজেন বেস থাকে। যথা- ১. অ্যাডেনিন ২. গুয়ানিন ৩. সাইটোসিন ও ৪. থাইমিন। RNA এর পূর্ণরূপ হলো Ribonucleic Acid। RNA তে ৪ প্রকার নাইট্রোজেন বেস থাকে। যথা- ১. অ্যাডেনিন ২. গুয়ানিন ৩. সাইটোসিন ৪. ইউরাসিল।"},{"id":"q0297","page":45,"printed_page":467,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৫","topic_title":"DNA","number":"০৩","question":"Adult Cell ক্লোন করে যে ভেড়ার জন্য হয়েছে তার নাম দেয়া হয়েছে-","exam_ref":"২৬তম, ১৯তম, ১৮তম বিসিএস","options":{"ক":"শেলী","খ":"ডলি","গ":"মলি","ঘ":"নেলী"},"answer":"খ","answer_text":"ডলি","explanation":"যুক্তরাজ্য বা গ্রেট ব্রিটেনের আওতাধীন স্কটল্যান্ডের এডিনবরার রোসলিন ইনস্টিটিউটের সামনে ১৯৯৬ সালের ৫ জুলাই ক্লোন ভেড়া ডলির জন্ম হয়। রোসলিন ইনস্টিটিউটের ভ্রূণতত্ত্ববিদ ড. আয়ান উইলমুট ভেড়াটিকে ক্লোন করেন। ১৯৯৭ সালে ডলি ভেড়ার জন্মের বিষয়টি ঘোষণা করা হয়।"},{"id":"q0298","page":45,"printed_page":467,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৫","topic_title":"DNA","number":"০৪","question":"প্রথম ক্লোন শিশু 'ইভ'-এর জন্ম তারিখ কত?","exam_ref":"২৪তম বিসিএস","options":{"ক":"নভেম্বর ২০, ২০০২","খ":"ডিসেম্বর ২৬, ২০০২","গ":"জানুয়ারি ৭, ২০০৩","ঘ":"মার্চ ২৩, ২০০৩"},"answer":"খ","answer_text":"ডিসেম্বর ২৬, ২০০২","explanation":"২০০২ সালের ২৬ ডিসেম্বর ড. ব্রিজিত বোইসেলিয়ার পৃথিবীর প্রথম ক্লোন মানব শিশু 'ইভ'-এর জন্ম ঘটান। ৭ পাউন্ড ওজনের এই কন্যাশিশুটি সিজারিয়ান অপারেশনের মাধ্যমে পৃথিবীতে ভূমিষ্ঠ হয়।"},{"id":"q0299","page":45,"printed_page":467,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৫","topic_title":"DNA","number":"০৫","question":"'Adult Cell' ক্লোন করে কোন দেশে একটি ভেড়ার জন্ম হয়েছে?","exam_ref":"১৮তম বিসিএস","options":{"ক":"যুক্তরাজ্যে","খ":"যুক্তরাষ্ট্রে","গ":"অস্ট্রেলিয়ায়","ঘ":"ফ্রান্সে"},"answer":"ক","answer_text":"যুক্তরাজ্যে","explanation":""},{"id":"q0300","page":46,"printed_page":468,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৬","topic_title":"টিস্যু","number":"০১","question":"কোন টিস্যু পেশীকে হাড়ের সাথে সংযুক্ত রাখে?","exam_ref":"৫০তম বিসিএস","options":{"ক":"তরুণাস্থি","খ":"লিগামেন্ট","গ":"টেন্ডন","ঘ":"অ্যারিওলার টিস্যু"},"answer":"গ","answer_text":"টেন্ডন","explanation":"তরুণাস্থি (Cartilage): নমনীয় যোজক কলা, হাড়ের চেয়ে নরম কিন্তু পেশীর চেয়ে শক্ত; হাড়ের সংযোগস্থলে ঘর্ষণরোধী স্তর হিসেবে কাজ করে (নাক, কানের পিনা, শ্বাসনালিতে পাওয়া যায়)। লিগামেন্ট (Ligament): শক্ত ও স্থিতিস্থাপক তন্তুময় টিস্যু, একটি হাড়কে অন্য হাড়ের সাথে যুক্ত রাখে এবং সংযোগস্থল (Joint)-কে স্থিতিশীল রাখে। টেন্ডন (Tendon): অত্যন্ত শক্ত ও তন্তুময় যোজক কলা যা পেশীকে হাড়ের সাথে সংযুক্ত করে; পেশী সংকুচিত হলে টেন্ডন সেই শক্তি হাড়ে পৌঁছে দেয়, ফলে অঙ্গ-প্রত্যঙ্গ নড়াচড়া করতে পারে; লিগামেন্টের চেয়ে কম স্থিতিস্থাপক কিন্তু বেশি টান সহ্য করতে পারে। অ্যারিওলার টিস্যু (Areolar Tissue): 'প্যাকিং টিস্যু' হিসেবে কাজ করে, ত্বককে নিচের পেশীর সাথে যুক্ত রাখে এবং অভ্যন্তরীণ অঙ্গসমূহকে যথাস্থানে ধরে রাখে; টিস্যুর ক্ষত মেরামতেও ভূমিকা রাখে।"},{"id":"q0301","page":46,"printed_page":468,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৬","topic_title":"টিস্যু","number":"০২","question":"আকৃতি, অবস্থান ও কাজের প্রকৃতিভেদে আবরণী টিস্যু কত ধরনের?","exam_ref":"৩৫তম বিসিএস","options":{"ক":"২","খ":"৩","গ":"৪","ঘ":"৫"},"answer":"খ","answer_text":"৩","explanation":"আবরণী কলা শরীরের প্রধান কলার অন্যতম। ত্বকের উপরিভাগ, শ্বাসনালি, পরিপাক নালি ও মূত্র-জনন নালির অভ্যন্তরভাগ এ কলা দ্বারা আবৃত। আকৃতি, অবস্থান ও কাজের প্রকৃতিভেদে আবরণী কলা (Epithelium tissue) তিন প্রকার। যথা: ১. স্কোয়ামাস (আঁইশাকার), ২. কিউবয়ডাল (ঘনাকার) এবং ৩. কলামনার (স্তম্ভাকৃতি)।"},{"id":"q0302","page":46,"printed_page":468,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৭","topic_title":"উদ্ভিদ শারীরতত্ত্ব","number":"০১","question":"কাগজের প্রধান রাসায়নিক উপাদান কোনটি?","exam_ref":"৫০তম বিসিএস","options":{"ক":"লিগনিন","খ":"রেজিন","গ":"হেমি সেলুলোজ","ঘ":"সেলুলোজ"},"answer":"ঘ","answer_text":"সেলুলোজ","explanation":"কাগজের প্রধান রাসায়নিক উপাদান হলো সেলুলোজ। এটি উদ্ভিদ থেকে প্রাপ্ত এক ধরনের জৈব কার্বোহাইড্রেট পলিমার, যা মূলত কাঠ, তুলা বা অন্যান্য উদ্ভিজ্জ তন্তু থেকে উৎপাদিত মণ্ড বা পাল্পের প্রধান উপাদান হিসেবে কাগজ তৈরিতে ব্যবহৃত হয়।"},{"id":"q0303","page":46,"printed_page":468,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৭","topic_title":"উদ্ভিদ শারীরতত্ত্ব","number":"০২","question":"\"Necessary evil\" কোনটি?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"প্রস্বেদন","খ":"অভিস্রবণ","গ":"ব্যাপন","ঘ":"শোষণ"},"answer":"ক","answer_text":"প্রস্বেদন","explanation":"উদ্ভিদ জীবনে প্রস্বেদন একটি অনিবার্য প্রক্রিয়া। যে প্রক্রিয়ার মাধ্যমে উদ্ভিদ তার দেহ থেকে অতিরিক্ত পানি বের করে দেয় তাকে প্রস্বেদন (Transpiration) বলে। প্রস্বেদন প্রক্রিয়া উদ্ভিদের জন্য অত্যন্ত গুরুত্বপূর্ণ এবং এর অনেক উপকারিতা রয়েছে - এটি উদ্ভিদকে পানি ও খনিজ লবণ শোষণ ও পরিবহনে সাহায্য করে এবং তাপমাত্রা নিয়ন্ত্রণ করে। তবে এর কিছু ক্ষতিকর দিকও আছে - প্রস্বেদনের মাধ্যমে পানি হারানোর হার মাটি থেকে শোষণের হারের চেয়ে বেশি হলে উদ্ভিদে পানি ও খনিজ লবণের ঘাটতি দেখা দেয়, যা গুরুতর হলে উদ্ভিদের মৃত্যুও ঘটাতে পারে। এই কারণে, প্রস্বেদন উদ্ভিদের বেঁচে থাকার জন্য অপরিহার্য হওয়া সত্ত্বেও এর কিছু সম্ভাব্য ক্ষতিকর প্রভাবের জন্য একে \"Necessary evil\" বলা হয়ে থাকে। বিজ্ঞানী Curtis প্রস্বেদনকে Necessary evil নামে অভিহিত করেছেন।"},{"id":"q0304","page":46,"printed_page":468,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৭","topic_title":"উদ্ভিদ শারীরতত্ত্ব","number":"০৩","question":"সালোকসংশ্লেষণে সূর্যের আলোর রাসায়নিক শক্তিতে পরিণত করার কর্মদক্ষতা হলো-","exam_ref":"৪৩তম বিসিএস","options":{"ক":"০%","খ":"১০-১৫%","গ":"৩-৬%","ঘ":"১০০%"},"answer":"গ","answer_text":"৩-৬%","explanation":"সালোকসংশ্লেষণ কর্মদক্ষতা কার্বন ডাইঅক্সাইডের মাত্রা বৃদ্ধির সাথে সালোকসংশ্লেষণের হার বৃদ্ধি পায়। বায়ুতে CO₂ এর পরিমাণ ০.০৩-০.০৪% পর্যন্ত ওঠা-নামা করে। পরীক্ষা থেকে দেখা গেছে ০.৯-১% পর্যন্ত CO₂ থাকলে সালোকসংশ্লেষণের হার সর্বোচ্চ পর্যায়ে উন্নীত হয়। পানিতে CO₂ এর দ্রাব্যতা বেশি হওয়ায় জলজ উদ্ভিদের সালোকসংশ্লেষণের হার সর্বাধিক হয়। এই প্রক্রিয়ায় সূর্যালোক থেকে গৃহীত শক্তির ৪৫% শক্তি ব্যবহৃত হয়। তাত্ত্বিকভাবে সালোকসংশ্লেষণ প্রক্রিয়ায় সূর্যের আলোর শক্তিকে রাসায়নিক শক্তিতে পরিণত করার কর্মদক্ষতা সর্বোচ্চ ১১%। কিন্তু সূর্যালোকের তীব্রতা, তাপমাত্রা, কার্বন ডাইঅক্সাইডের পরিমাণ ইত্যাদির ভিন্নতার কারণে সালোকসংশ্লেষণের কর্মদক্ষতা ৩-৬% পর্যন্ত হয়। সালোকসংশ্লেষণ প্রক্রিয়ায় তাপমাত্রা, আলোর তীব্রতা এবং CO₂ এর ঘনত্ব এই তিনটি লিমিটিং ফ্যাক্টর হিসেবে কাজ করে।"},{"id":"q0305","page":47,"printed_page":469,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৭","topic_title":"উদ্ভিদ শারীরতত্ত্ব","number":"০৪","question":"খাদ্য তৈরির জন্য উদ্ভিদ বায়ু থেকে গ্রহণ করে-","exam_ref":"৪০তম বিসিএস","options":{"ক":"অক্সিজেন","খ":"কার্বন-ডাই-অক্সাইড","গ":"নাইট্রোজেন","ঘ":"জলীয় বাষ্প"},"answer":"খ","answer_text":"কার্বন-ডাই-অক্সাইড","explanation":"বায়ু ছাড়া কোনো প্রাণী বা উদ্ভিদ কিছুই বাঁচতে পারে না। আমরা যে শুধু শ্বাসকার্যে বায়ু ব্যবহার করি তা নয়, বায়ু সমগ্র উদ্ভিদ ও প্রাণিকুলের জন্য খাদ্য যোগায়। আমাদের নিঃশ্বাস থেকে প্রতি মুহূর্তে বায়ুমণ্ডলে প্রচুর কার্বন ডাই-অক্সাইড যোগ হচ্ছে। উদ্ভিদ তাদের খাদ্য তৈরির জন্য বায়ু থেকে এই কার্বন ডাই-অক্সাইড গ্রহণ করছে এবং সালোকসংশ্লেষণ প্রক্রিয়ার মাধ্যমে উদ্ভিদ নিজের খাদ্য নিজেই তৈরি করছে।"},{"id":"q0306","page":47,"printed_page":469,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৭","topic_title":"উদ্ভিদ শারীরতত্ত্ব","number":"০৫","question":"Photosynthesis takes place in-","exam_ref":"৩৪তম বিসিএস","options":{"ক":"Roots of the plants","খ":"Stems of the plants","গ":"Green parts of the plants","ঘ":"All parts of the plants"},"answer":"গ","answer_text":"Green parts of the plants","explanation":"Photosynthesis বা সালোকসংশ্লেষণ একটি জৈব রাসায়নিক প্রক্রিয়া। এ প্রক্রিয়ায় উদ্ভিদের সবুজ অঙ্গ (বিশেষ করে পাতা) সূর্যালোক হতে শক্তি সংগ্রহ করে এবং ঐ শক্তি কাজে লাগিয়ে পানি ও CO₂ এর রাসায়নিক বিক্রিয়ার মাধ্যমে শর্করা জাতীয় খাদ্য প্রস্তুত করে। এ প্রক্রিয়ায় আলোক শক্তি রাসায়নিক শক্তিতে পরিণত হয়। সুতরাং সবুজ অঙ্গের মাধ্যমেই সালোকসংশ্লেষণ সংঘটিত হয়। সমীকরণ: 6CO₂ + 12H₂O →(আলো) C₆H₁₂O₆ (গ্লুকোজ) + 6O₂ + 6H₂O।"},{"id":"q0307","page":47,"printed_page":469,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৭","topic_title":"উদ্ভিদ শারীরতত্ত্ব","number":"০৬","question":"সালোকসংশ্লেষণ সবচেয়ে বেশি পরিমাণে হয়-","exam_ref":"২৬তম বিসিএস","options":{"ক":"সবুজ আলোতে","খ":"নীল আলোতে","গ":"লাল আলোতে","ঘ":"বেগুনি আলোতে"},"answer":"গ","answer_text":"লাল আলোতে","explanation":"বর্ণালিবীক্ষণ যন্ত্র (Spectroscope)-এর সাহায্যে জানা গেছে যে, দৃশ্যমান আলোর মধ্যে সালোকসংশ্লেষণ প্রক্রিয়ায় লাল আলোই সর্বাপেক্ষা কর্মক্ষম। নীল আলো তুলনামূলকভাবে কম কর্মক্ষম হয়। বেগুনি আলোয় আরও কম সালোকসংশ্লেষণ হয়। সূর্যালোকে সবুজ আলো শোষিত না হওয়ায় সবুজ আলোতে সালোকসংশ্লেষণ একেবারেই হয় না।"},{"id":"q0308","page":47,"printed_page":469,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৭","topic_title":"উদ্ভিদ শারীরতত্ত্ব","number":"০৭","question":"ঘন পাতাবিশিষ্ট বৃক্ষের নিচে রাতে ঘুমানো স্বাস্থ্যসম্মত নয়, কারণ গাছ হতে-","exam_ref":"২৪তম বিসিএস (বাতিল)","options":{"ক":"অধিক পরিমাণে অক্সিজেন নির্গত হয়","খ":"অধিক পরিমাণে কার্বন ডাই অক্সাইড নির্গত হয়","গ":"অধিক পরিমাণে কার্বন মনো-অক্সাইড নির্গত হয়","ঘ":"বিষাক্ত সায়ানাইড নির্গত হয়"},"answer":"খ","answer_text":"অধিক পরিমাণে কার্বন ডাই অক্সাইড নির্গত হয়","explanation":"জীবন্ত প্রতিটি জীবের জন্য শ্বসন একটি অপরিহার্য ক্রিয়া, যার জন্য অক্সিজেন প্রয়োজন। দিনের বেলায় সালোকসংশ্লেষণে উদ্ভিদ বায়ুমণ্ডল থেকে কার্বন-ডাই-অক্সাইড গ্রহণ করে এবং অক্সিজেন ত্যাগ করে। রাতে সালোকসংশ্লেষণ বন্ধ থাকে এবং এ সময় উদ্ভিদ শ্বসন ক্রিয়া চালানোর জন্য অক্সিজেন গ্রহণ করে এবং কার্বন-ডাই-অক্সাইড ত্যাগ করে। রাতে ঘন পাতাবিশিষ্ট গাছের নিচে ঘুমানো স্বাস্থ্যসম্মত নয় কারণ এতে অক্সিজেনের অভাবে ঘুমন্ত ব্যক্তির শ্বাস-প্রশ্বাসে বিঘ্ন ঘটতে পারে। উদ্ভিদের শ্বসন বিক্রিয়া: C₆H₁₂O₆ (গ্লুকোজ) + 6O₂ →(বিভিন্ন এনজাইম) 6CO₂ + 6H₂O + শক্তি।"},{"id":"q0309","page":47,"printed_page":469,"chapter":"অধ্যায় ১৩","chapter_title":"জীব ও উদ্ভিদবিদ্যা","topic_code":"১৩.৭","topic_title":"উদ্ভিদ শারীরতত্ত্ব","number":"০৮","question":"ধানের ফুলে পরাগ সংযোগ ঘটে-","exam_ref":"১১তম বিসিএস","options":{"ক":"বাতাসের সাহায্যে ঝরে পড়ে","খ":"পাতা দ্বারা স্থানান্তরিত হয়ে","গ":"কীটপতঙ্গের সাহায্যে","ঘ":"ফুলে ফুলে সংস্পর্শে"},"answer":"ক","answer_text":"বাতাসের সাহায্যে ঝরে পড়ে","explanation":"ধান বায়ুপরাগী উদ্ভিদ। দিনের প্রথম ভাগে ধানের স্পাইকলেট উন্মুক্ত হয়। এ অবস্থায় পরাগরেণু গর্ভমুণ্ডের উপর ঝরে পড়ে এবং প্রকৃতিগতভাবেই পরাগায়ন ঘটে।"},{"id":"q0310","page":48,"printed_page":470,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"০১","question":"এন্টিবডি তৈরি করে নিচের কোনটি?","exam_ref":"৪৬তম বিসিএস","options":{"ক":"Red blood corpuscle","খ":"Thrombocyte","গ":"B Lymphocyte","ঘ":"Monocyte"},"answer":"গ","answer_text":"B Lymphocyte","explanation":"শ্বেত রক্তকণিকা: শ্বেত কণিকার গড় আয়ুষ্কাল ১-১৫ দিন। মানুষের শরীরে শ্বেতকণিকা এবং লোহিত কণিকার অনুপাত ১:৭০০। শ্বেত কণিকা দুই প্রকার- ১. দানাদার শ্বেত কণিকা/গ্রানুলোসাইট (নিউট্রোফিল, ইওসিনোফিল, বেসোফিল) ২. অদানাদার শ্বেত কণিকা/অ্যাগ্রানুলোসাইট (লিম্ফোসাইট, মনোসাইট)। লিম্ফোসাইট আবার ৩ প্রকার- B লিম্ফোসাইট, T-Cell ও Natural Killer Cell। কাজ: শ্বেত রক্তকণিকা বহিরাগত রোগ জীবাণু ধ্বংস করে দেহকে সুরক্ষিত রাখতে সহায়তা করে। নিউট্রোফিল জাতীয় শ্বেত রক্তকণিকা ফ্যাগোসাইটোসিস প্রক্রিয়ায় জীবাণু ধ্বংস করে। লিম্ফোসাইট (B-cells & T-cells) অ্যান্টিবডি গঠন করে এবং এই অ্যান্টিবডির দ্বারা দেহে প্রবেশ করা রোগ-জীবাণু ধ্বংস করে।"},{"id":"q0311","page":48,"printed_page":470,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"০২","question":"মানুষের শরীরের রক্তের গ্রুপ ক'টি?","exam_ref":"৪৫তম বিসিএস","options":{"ক":"চারটি","খ":"পাঁচটি","গ":"তিনটি","ঘ":"দুইটি"},"answer":"ক","answer_text":"চারটি","explanation":"রক্তের লোহিত কণিকায় এন্টিজেন এবং রক্তরসে এন্টিবডির উপস্থিতি বা অনুপস্থিতির উপর ভিত্তি করে রক্তকে ৪ টি গ্রুপে ভাগ করা হয়। যথা- A, B, O এবং AB। O গ্রুপকে সর্বজনীন দাতা বলা হয়, কারণ O গ্রুপের রক্ত যে কোনো ব্যক্তির (O, A, B ও AB গ্রুপধারী) শরীরে দেওয়া যায়। AB গ্রুপকে সর্বজনীন গ্রহীতা বলা হয়, কারণ AB গ্রুপধারী ব্যক্তি যে কোন গ্রুপের রক্ত গ্রহণ করতে পারে। রক্তের গ্রুপ আবিষ্কার করেন কার্ল ল্যান্ড স্টেইনার।"},{"id":"q0312","page":48,"printed_page":470,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"০৩","question":"মানবদেহে লোহিত কণিকার আয়ুষ্কাল কত দিন?","exam_ref":"৪১তম বিসিএস","options":{"ক":"৭ দিন","খ":"৩০ দিন","গ":"১৮০ দিন","ঘ":"উপরের কোনটিই নয়"},"answer":"ঘ","answer_text":"উপরের কোনটিই নয়","explanation":"লোহিত রক্ত কণিকা দেহের অস্থিমজ্জায় তৈরি হয়ে ১২০ দিন পরে প্লীহাতে ধ্বংসপ্রাপ্ত হয়। লোহিত রক্তকণিকার বৈশিষ্ট্য: পরিণত লোহিত রক্তকণিকায় কোনো নিউক্লিয়াস থাকে না; দেখতে অনেকটা চাকতির মতো এবং দ্বি-অবতল; হিমোগ্লোবিন থাকে; সংখ্যা শ্বেত রক্তকণিকার তুলনায় অনেক বেশি; গড় আয়ু ১২০ দিন।"},{"id":"q0313","page":48,"printed_page":470,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"০৪","question":"মানুষের রক্তে লোহিত কণিকা কোথায় সঞ্চিত থাকে?","exam_ref":"৩৬তম বিসিএস","options":{"ক":"হৃদযন্ত্রে","খ":"বৃক্কে","গ":"ফুসফুসে","ঘ":"প্লীহাতে"},"answer":"ঘ","answer_text":"প্লীহাতে","explanation":"মানুষের রক্তের লোহিত কণিকা অস্থিমজ্জায় তৈরি হয় এবং প্লীহাতে সঞ্চিত থাকে। এখান থেকে তাৎক্ষণিক প্রয়োজনে লোহিত কণিকা রক্তরসে সরবরাহ হয়।"},{"id":"q0314","page":48,"printed_page":470,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"০৫","question":"হিমোগ্লোবিন কোন জাতীয় পদার্থ?","exam_ref":"৩৫তম বিসিএস","options":{"ক":"আমিষ","খ":"স্নেহ","গ":"আয়োডিন","ঘ":"লৌহ"},"answer":"ক","answer_text":"আমিষ","explanation":"হিমোগ্লোবিন হলো রক্তের লোহিত কণিকায় বিদ্যমান এক প্রকার শ্বাস রঞ্জক পদার্থ। হিমোগ্লোবিন হিম (৪%) নামক লৌহ ঘটিত রঞ্জক ও গ্লোবিন (৯৬%) নামক প্রোটিন বা আমিষের সংযোগে গঠিত। হিম হলো লৌহযুক্ত পারফাইরিন যৌগ। হিমোগ্লোবিনের চার অণু প্রোস্থেটিক গ্রুপ হিম, এক অণু গ্লোবিন ও এক পরমাণু লৌহ ফেরাস (Fe⁺⁺) অবস্থায় থাকে।"},{"id":"q0315","page":49,"printed_page":471,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"০৬","question":"রক্তে হিমোগ্লোবিনের কাজ কি?","exam_ref":"৩৪তম, ২৫তম বিসিএস","options":{"ক":"অক্সিজেন পরিবহণ করা","খ":"রোগ প্রতিরোধ করা","গ":"রক্ত জমাট বাঁধতে সাহায্য করা","ঘ":"উপরে উল্লিখিত সব কয়টিই"},"answer":"ক","answer_text":"অক্সিজেন পরিবহণ করা","explanation":"লোহিত রক্ত কণিকার সাইটোপ্লাজমের এক ধরনের লৌহঘটিত প্রোটিন জাতীয় রঞ্জক পদার্থ হচ্ছে হিমোগ্লোবিন। আমিষ ও লৌহ এর প্রধান উপাদান। হিমোগ্লোবিনের উপস্থিতির জন্য রক্ত লাল হয়। রক্তে হিমোগ্লোবিন কমে যাওয়াকে রক্তশূন্যতা বলে। রক্তে হিমোগ্লোবিনের কাজ অক্সিজেন পরিবহণ করে প্রতিটি কোষে পৌঁছে দেয়া এবং কোষ থেকে কার্বন ডাই-অক্সাইড পরিবহণ করে ফুসফুসে নিয়ে আসা। রোগ প্রতিরোধের কাজে নিয়োজিত আছে শ্বেত কণিকা এবং রক্ত জমাট বাঁধতে সাহায্য করে অণুচক্রিকা।"},{"id":"q0316","page":49,"printed_page":471,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"০৭","question":"কোলেস্টেরল এক ধরনের-","exam_ref":"৩১তম বিসিএস","options":{"ক":"অসম্পৃক্ত এলকোহল","খ":"জৈব এসিড","গ":"পলিমার","ঘ":"এমিনো এসিড"},"answer":"ক","answer_text":"অসম্পৃক্ত এলকোহল","explanation":"কোলেস্টেরল হলো একধরনের প্রাণিজ স্টেরল। স্টেরল হলো উদ্ভিজ্জ তেল ও প্রাণিজ চর্বি এবং দানাদার যৌগ; কাঠামোতে একটি হাইড্রোক্সিল গ্রুপ (OH⁻) আছে। স্টেরলগুলোকে কঠিন/অসম্পৃক্ত অ্যালকোহল বলা হয়। রক্তে এর পরিমাণ বেড়ে গেলে রক্তনালীতে রক্ত সঞ্চালনে বাধাপ্রাপ্ত হয়, ফলে হৃদরোগ দেখা দেয়। গরুর মাংস, খাসির মাংস, কলিজা, ডিমের কুসুম ইত্যাদি খাবারে প্রচুর কোলেস্টেরল থাকে। রক্তে কোলেস্টেরলের স্বাভাবিক মাত্রা ১০০-২০০ mg/dL। কোলেস্টেরল ২ প্রকার: LDL (Low Density Lipoprotein) ও HDL (High Density Lipoprotein); এদের মধ্যে LDL শরীরের জন্য খারাপ এবং HDL ভালো। HDL অসম্পৃক্ত এবং LDL সম্পৃক্ত কোলেস্টেরল।"},{"id":"q0317","page":49,"printed_page":471,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"০৮","question":"রক্তে কোলেস্টেরলের পরিমাণ বেড়ে গেলে কোনটি খাওয়া উচিত নয়?","exam_ref":"২৪তম বিসিএস (বাতিল)","options":{"ক":"বেলে মাছ","খ":"পালং শাক","গ":"খাসির মাংস","ঘ":"মুরগির মাংস"},"answer":"গ","answer_text":"খাসির মাংস","explanation":"রক্তে কোলেস্টেরল বেড়ে গেলে তা রক্ত পরিবহণ তন্ত্রে পুরু স্তর তৈরি করে রক্তপ্রবাহে বাধা সৃষ্টি করে, যার ফলে হৃৎপিণ্ডের নানারকম রোগসহ স্ট্রোক হতে পারে। সাধারণত চর্বিযুক্ত খাবারে উচ্চ মাত্রার কোলেস্টেরল থাকে। যেমন- খাসির মাংস, গরুর মাংস ইত্যাদি। উদ্ভিদজাত খাবার, স্বাদু পানির মাছ ইত্যাদিতে কোলেস্টেরলের মাত্রা কম।"},{"id":"q0318","page":49,"printed_page":471,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"০৯","question":"দূষিত বাতাসের কোন গ্যাসটি মানবদেহে রক্তের অক্সিজেন পরিবহণ ক্ষমতা খর্ব করে?","exam_ref":"২১তম বিসিএস","options":{"ক":"কার্বন ডাইঅক্সাইড","খ":"কার্বন মনোঅক্সাইড","গ":"নাইট্রিক অক্সাইড","ঘ":"সালফার ডাইঅক্সাইড"},"answer":"খ","answer_text":"কার্বন মনোঅক্সাইড","explanation":"কার্বন ও অক্সিজেনের যৌগ কার্বন মনোঅক্সাইড (CO) একটি বর্ণ ও গন্ধহীন গ্যাস। কার্বন মনোঅক্সাইড রক্তের হিমোগ্লোবিনের সাথে মিশে কার্বক্সিহিমোগ্লোবিন তৈরি করে, যা রক্তে অক্সিজেন পরিবহণে বাধা দেয়।"},{"id":"q0319","page":49,"printed_page":471,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"১০","question":"নাড়ীর স্পন্দন প্রবাহিত হয়-","exam_ref":"১৬তম বিসিএস","options":{"ক":"ধমনির ভেতর দিয়ে","খ":"শিরার ভেতর দিয়ে","গ":"ন্যায়ুর ভেতর দিয়ে","ঘ":"ল্যাকটিয়ালের ভেতর দিয়ে"},"answer":"ক","answer_text":"ধমনির ভেতর দিয়ে","explanation":"হৃৎপিণ্ড থেকে অক্সিজেনবাহী রক্ত শরীরের বিভিন্ন স্থানে পৌঁছে ধমনির মধ্য দিয়ে। এতে রক্তের গতি থাকে বেশি। তাই ধমনির মধ্যেই নাড়ির স্পন্দন অনুভূত হয়। শিরার ভেতর দিয়ে কার্বন ডাই-অক্সাইডযুক্ত রক্ত হৃৎপিণ্ডে ফিরে আসে।"},{"id":"q0320","page":49,"printed_page":471,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"১১","question":"কোনটি রক্তের কাজ নয়?","exam_ref":"১৫তম বিসিএস","options":{"ক":"কলা (Tissue) হতে ফুসফুসে বর্জ্য পদার্থ বহন করা","খ":"ক্ষুদ্রান্ত হতে কলাতে খাদ্যের সারবস্তু বহন করা","গ":"হরমোন বিতরণ করা","ঘ":"জারক রস (enzyme) বিতরণ করা"},"answer":"ঘ","answer_text":"জারক রস (enzyme) বিতরণ করা","explanation":"রক্তের সাধারণ কার্যাবলির মধ্যে উল্লেখযোগ্য হচ্ছে কলা হতে বর্জ্য পদার্থ ফুসফুসে বাহিত করা, খাদ্যের সারবস্তু বিভিন্ন কলা ও অঙ্গে বাহিত করা, হরমোন, উৎসেচক, লিপিড প্রভৃতি বিভিন্ন অঙ্গে বাহিত করা, কার্বন-ডাই-অক্সাইড পরিবহণ, দৈহিক উষ্ণতা নিয়ন্ত্রণ প্রভৃতি; কিন্তু জারক রস বিতরণ করা রক্তের কাজ নয়।"},{"id":"q0321","page":49,"printed_page":471,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.১","topic_title":"রক্ত সংবহনতন্ত্র","number":"১২","question":"আমাদের দেহকোষ রক্ত হতে গ্রহণ করে-","exam_ref":"১০তম বিসিএস","options":{"ক":"অক্সিজেন ও গ্লুকোজ","খ":"অক্সিজেন ও রক্তের আমিষ","গ":"ইউরিয়া ও গ্লুকোজ","ঘ":"এমাইনো এসিড ও কার্বন ডাইঅক্সাইড"},"answer":"ক","answer_text":"অক্সিজেন ও গ্লুকোজ","explanation":"রক্তের মাধ্যমে অক্সিজেন, গ্লুকোজ এবং অন্যান্য পুষ্টি উপাদান দেহের সকল কোষে স্থানান্তরিত হয়। লোহিত রক্ত কণিকার হিমোগ্লোবিন অক্সিজেন ও কার্বন-ডাই-অক্সাইড পরিবহণ করে।"},{"id":"q0322","page":50,"printed_page":472,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.২","topic_title":"হৃৎপিণ্ড","number":"০১","question":"হৃদযন্ত্রের সংকোচন হওয়াকে বলা হয়-","exam_ref":"৪৩তম বিসিএস","options":{"ক":"ডায়াস্টল","খ":"সিস্টল","গ":"ডায়াসিস্টল","ঘ":"উপরের কোনটিই নয়"},"answer":"খ","answer_text":"সিস্টল","explanation":"প্রবহমান রক্ত রক্তনালির গায়ে যে পার্শ্বচাপ প্রয়োগ করে, তাকে রক্তচাপ বলে। রক্তচাপ দুই প্রকার: সিস্টোলিক রক্তচাপ (১১০-১৪০ মি.মি.পারদ) ও ডায়াস্টোলিক রক্তচাপ (৬০-৯০ মি.মি.পারদ)। সিস্টোল = সংকোচন, ডায়াস্টোল = প্রসারণ। স্ফিগমোম্যানোমিটার এর সাহায্যে রক্তচাপ পরিমাপ করা হয়। ধরা যাক, এক ব্যক্তির রক্তচাপ ১২০/৮০ মি.মি. পারদ — এর অর্থ ঐ ব্যক্তির সিস্টোলিক ও ডায়াস্টোলিক রক্তচাপ যথাক্রমে ১২০ ও ৮০ মি.মি. পারদ। উচ্চ রক্তচাপ হলো এমন একটি রোগ যখন কোনো ব্যক্তির রক্তের চাপ সবসময়ই স্বাভাবিকের চেয়ে ঊর্ধ্বে থাকে।"},{"id":"q0323","page":50,"printed_page":472,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.২","topic_title":"হৃৎপিণ্ড","number":"০২","question":"হার্ট থেকে রক্ত বাইরে নিয়ে যায় যে রক্তনালী-","exam_ref":"৪১তম বিসিএস","options":{"ক":"ভেইন","খ":"আর্টারি","গ":"ক্যাপিলারি","ঘ":"নার্ভ"},"answer":"খ","answer_text":"আর্টারি","explanation":"হার্ট থেকে অক্সিজেনযুক্ত রক্ত বাইরে নিয়ে যায় আর্টারি বা ধমনি। এর প্রাচীর পুরু, শক্ত ও স্থিতিস্থাপক। ভেইন (শিরা) অক্সিজেনবিহীন রক্ত দেহ থেকে হৃদপিণ্ডে নিয়ে আসে।"},{"id":"q0324","page":50,"printed_page":472,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.২","topic_title":"হৃৎপিণ্ড","number":"০৩","question":"হৃৎপিণ্ড কোন ধরনের পেশি দ্বারা গঠিত?","exam_ref":"৩৫তম বিসিএস","options":{"ক":"ঐচ্ছিক","খ":"অনৈচ্ছিক","গ":"বিশেষ ধরনের ঐচ্ছিক","ঘ":"বিশেষ ধরনের অনৈচ্ছিক"},"answer":"ঘ","answer_text":"বিশেষ ধরনের অনৈচ্ছিক","explanation":"হৃৎপিণ্ড একটি পেশিবহুল অঙ্গ। এটি বিশেষ ধরনের অনৈচ্ছিক পেশি (হৃদ পেশি) দ্বারা গঠিত। হৃদপেশি গঠনের দিক থেকে অনেকটা ঐচ্ছিক পেশির মতো হলেও হৃদপেশির কার্যকারিতা প্রাণীর ইচ্ছা নির্ভর নয়। তাই কাজের দিক থেকে হৃদপেশি অনৈচ্ছিক।"},{"id":"q0325","page":50,"printed_page":472,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.২","topic_title":"হৃৎপিণ্ড","number":"০৪","question":"এনজিওপ্লাস্টি হচ্ছে-","exam_ref":"৩০তম, ২১তম বিসিএস","options":{"ক":"হৃৎপিণ্ডের মৃত টিস্যু কেটে ফেলা দেয়া","খ":"হৃৎপিণ্ডের বন্ধ শিরা বেলুনের সাহায্যে ফুলানো","গ":"হৃৎপিণ্ডের টিস্যুতে নতুন টিস্যু সংযোজন","ঘ":"হৃৎপিণ্ডে নতুন শিরা সংযোজন"},"answer":"খ","answer_text":"হৃৎপিণ্ডের বন্ধ শিরা বেলুনের সাহায্যে ফুলানো","explanation":"এনজিওপ্লাস্টি: করোনারি ধমনির গাত্রে চর্বি জমে বন্ধ হয়ে গেলে হৃৎপিণ্ডের রক্ত সরবরাহ বাধা পায়। একে হার্ট এটাক বলে। বেলুনের সাহায্যে এ ধমনি ফুলিয়ে পুনরায় রক্ত সরবরাহ স্বাভাবিক করার পদ্ধতিকে এনজিওপ্লাস্টি বলে। বাইপাস: হৃৎপিণ্ডে শিরা সংযোজন করলে তাকে বাইপাস সার্জারি বলা হয়।"},{"id":"q0326","page":50,"printed_page":472,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.২","topic_title":"হৃৎপিণ্ড","number":"০৫","question":"মানুষের হৃদপিণ্ডে কতটি প্রকোষ্ঠ থাকে?","exam_ref":"২৭তম বিসিএস","options":{"ক":"দুটি","খ":"চারটি","গ":"ছয়টি","ঘ":"আটটি"},"answer":"খ","answer_text":"চারটি","explanation":"মানুষের হৃদপিণ্ড সম্পূর্ণভাবে চারটি প্রকোষ্ঠে বিভক্ত। উপরের দুটি পাতলা প্রাচীরযুক্ত ডান ও বাম অলিন্দ এবং নিচের দুটি পুরু প্রাচীরযুক্ত ডান ও বাম নিলয়। অন্যদিকে ব্যাঙের হৃদপিণ্ডে প্রকোষ্ঠ থাকে ৩টি। আরশোলার হৃদপিণ্ডে প্রকোষ্ঠ থাকে ১৩টি।"},{"id":"q0327","page":50,"printed_page":472,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৩","topic_title":"পরিপাকতন্ত্র","number":"০১","question":"মানবদেহে শক্তি উৎপাদনের প্রধান উৎস-","exam_ref":"৩৪তম বিসিএস","options":{"ক":"পরিপাক","খ":"খাদ্য গ্রহণ","গ":"শ্বসন","ঘ":"রক্ত সংবহন"},"answer":"গ","answer_text":"শ্বসন","explanation":"মানবদেহে শক্তি উৎপাদনের প্রধান উৎস শ্বসন। শ্বসন প্রক্রিয়ায় শর্করা, আমিষ, চর্বি, জৈব এসিড ইত্যাদি খাদ্যদ্রব্য অক্সিজেন সহযোগে জারিত হয়ে শক্তি ও কার্বন ডাই-অক্সাইড উৎপন্ন করে।"},{"id":"q0328","page":50,"printed_page":472,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৩","topic_title":"পরিপাকতন্ত্র","number":"০২","question":"অতিরিক্ত খাদ্য থেকে লিভারে সঞ্চিত সুগার হল-","exam_ref":"৩৪তম বিসিএস","options":{"ক":"গ্লাইকোজেন","খ":"গ্লুকোজ","গ":"ফ্রুক্টোজ (Fructose)","ঘ":"সুক্রোজ"},"answer":"ক","answer_text":"গ্লাইকোজেন","explanation":"খাদ্য বিভিন্ন এনজাইম দ্বারা পরিপাক হয়ে ক্ষুদ্রতম অংশে পরিণত হয়। এগুলো সাধারণত মনোস্যাকারাইডে পরিণত হয়। উৎপন্ন সুগার পাকস্থলীর বিভিন্ন অঙ্গ দ্বারা পরিশোষিত হয়। অতিরিক্ত খাদ্য হতে উৎপন্ন সুগার ভবিষ্যতের জন্য লিভার সঞ্চয় করে রাখে। এ সুগার হলো গ্লাইকোজেন।"},{"id":"q0329","page":50,"printed_page":472,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৩","topic_title":"পরিপাকতন্ত্র","number":"০৩","question":"কোন জারক রস পাকস্থলীতে দুধ জমাট বাঁধায়?","exam_ref":"৩০তম, ১৯তম বিসিএস","options":{"ক":"পেপসিন","খ":"এমাইলেজ","গ":"রেনিন","ঘ":"ট্রিপসিন"},"answer":"গ","answer_text":"রেনিন","explanation":"পাকস্থলীতে দুধ জমাট বাঁধতে রেনিন নামক জারক রস প্রয়োজন হয়। অপরপক্ষে 'ট্রিপসিন' এবং 'পেপসিন' নামক এনজাইম প্রোটিন পরিপাকে এবং 'এমাইলেজ' কার্বোহাইড্রেট পরিপাকে সহায়তা করে।"},{"id":"q0330","page":51,"printed_page":473,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৪","topic_title":"স্নায়ুতন্ত্র","number":"০১","question":"মস্তিষ্কের ডোপামিন তৈরির কোষগুলো নষ্ট হলে কি রোগ হয়?","exam_ref":"৩৮তম বিসিএস","options":{"ক":"এপিলেপসি","খ":"পারকিনসন","গ":"প্যারালাইসিস","ঘ":"থ্রম্বোসিস"},"answer":"খ","answer_text":"পারকিনসন","explanation":"পারকিনসন রোগ মস্তিষ্কের এমন এক অবস্থা যাতে হাতে ও পায়ে কাঁপুনি হয় এবং আক্রান্ত রোগী চলাফেরায় অপারগ হয়। স্নায়ু কোষে ডোপামিন নামক এক প্রকার নির্যাস তৈরি হয় যা চলাফেরায় সহায়তা করে। পারকিনসন রোগে ডোপামিন তৈরির কোষগুলো ধীরে ধীরে নষ্ট হয়ে যায়। ডোপামিন ছাড়া ঐ স্নায়ুকোষগুলো পেশিকোষে সংবেদন পাঠাতে পারে না। ফলে পেশিকোষ কার্যকারিতা হারায়। ষাটোর্ধ্ব এবং নারীদের মধ্যে এই রোগের প্রভাব বেশি দেখা দেয়। এপিলেপসি (Epilepsy) হলো একটি স্নায়বিক রোগ, যেখানে মস্তিষ্কের অস্বাভাবিক কার্যকলাপের কারণে মানুষ বারবার খিঁচুনিতে আক্রান্ত হয়। প্যারালাইসিস মানে শরীরের এক অংশ বা একাধিক অংশ অবশ হয়ে যাওয়া।"},{"id":"q0331","page":51,"printed_page":473,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৪","topic_title":"স্নায়ুতন্ত্র","number":"০২","question":"মস্তিষ্ক কোন তন্ত্রের অঙ্গ?","exam_ref":"৩৬তম বিসিএস","options":{"ক":"স্নায়ুতন্ত্রের","খ":"রেচনতন্ত্র","গ":"পরিপাকতন্ত্র","ঘ":"শ্বাসতন্ত্র"},"answer":"ক","answer_text":"স্নায়ুতন্ত্রের","explanation":"স্নায়ুতন্ত্রকে ২ ভাগে ভাগ করা হয়- কেন্দ্রীয় স্নায়ুতন্ত্র ও প্রান্তীয় স্নায়ুতন্ত্র। কেন্দ্রীয় স্নায়ুতন্ত্র ২টি অংশ নিয়ে গঠিত: মস্তিষ্ক ও সুষুম্না কাণ্ড। কেন্দ্রীয় স্নায়ুতন্ত্রের যে অংশ করোটিকার মধ্যে সুরক্ষিত থাকে সেটিই হলো মস্তিষ্ক। মস্তিষ্কই দেহের সকল ঐচ্ছিক ও অনৈচ্ছিক কার্যাবলি নিয়ন্ত্রণ করে। স্নায়ুতন্ত্রের গঠন ও কার্যকরী এককে নিউরন বলে।"},{"id":"q0332","page":51,"printed_page":473,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৪","topic_title":"স্নায়ুতন্ত্র","number":"০৩","question":"মানুষের স্পাইনাল কর্ডের দৈর্ঘ্য কত?","exam_ref":"২৮তম বিসিএস","options":{"ক":"১৫ ইঞ্চি (প্রায়)","খ":"১৭ ইঞ্চি (প্রায়)","গ":"১৮ ইঞ্চি (প্রায়)","ঘ":"২০ ইঞ্চি (প্রায়)"},"answer":"গ","answer_text":"১৮ ইঞ্চি (প্রায়)","explanation":"সুষুম্না কাণ্ড বা Spinal Cord কেন্দ্রীয় স্নায়ুতন্ত্রের একটি অংশ। Spinal Cord বা স্নায়ু রজ্জু মস্তিষ্ক থেকে মেরুদণ্ডের ভেতরে অবস্থিত। Spinal Cord প্রায় ১৮ ইঞ্চি লম্বা। এখান থেকে ৩১ জোড়া স্নায়ু (Spinal nerve) উৎপন্ন হয়।"},{"id":"q0333","page":51,"printed_page":473,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৪","topic_title":"স্নায়ুতন্ত্র","number":"০৪","question":"নার্ভ সিস্টেমের স্ট্রাকচারাল এবং ফাংশনাল ইউনিটকে কি বলে?","exam_ref":"১৫তম বিসিএস","options":{"ক":"নেফ্রোন","খ":"নিউরন","গ":"থাইমাস","ঘ":"মাস্ট সেল"},"answer":"খ","answer_text":"নিউরন","explanation":"প্রতিটি কিডনি অনেকগুলো ক্ষুদ্র কার্যকরী এককের সমন্বয়ে গঠিত, যা নেফ্রোন নামে পরিচিত। নিউরন হলো স্নায়ুতন্ত্রের কার্যকরী উপাদান, যা দিয়ে নার্ভ বা স্নায়ু গঠিত। থাইমাস হচ্ছে একটি গ্রন্থি এবং মাস্ট সেল বিভিন্ন কলাতে পাওয়া যায়।"},{"id":"q0334","page":51,"printed_page":473,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৪","topic_title":"স্নায়ুতন্ত্র","number":"০৫","question":"মস্তিষ্কের ক্ষমতা ক্ষয় পেতে থাকে স্নায়ু কোষের-","exam_ref":"২৪তম বিসিএস","options":{"ক":"এক-চতুর্থাংশ ধ্বংস হয়ে গেলে","খ":"অর্ধেক ধ্বংস হয়ে গেলে","গ":"এক-তৃতীয়াংশ বেড়ে গেলে","ঘ":"এক-চতুর্থাংশ বেড়ে গেলে"},"answer":"ক","answer_text":"এক-চতুর্থাংশ ধ্বংস হয়ে গেলে","explanation":"মানুষের মস্তিষ্ক 'Cerebrum', 'Cerebellum' এবং 'Brain Stem' নিয়ে গঠিত এবং মস্তিষ্কের বিভিন্ন অংশ বিভিন্ন কাজ সম্পাদন করে। স্নায়ু কোষের মাধ্যমেই মস্তিষ্ক উদ্দীপনা গ্রহণ করে ও উপযোগী সিদ্ধান্ত গ্রহণ করে যথাস্থানে পৌঁছানোর ব্যবস্থা করে। তাই মস্তিষ্কের স্নায়ুকোষ এক চতুর্থাংশ ধ্বংস হয়ে গেলে এর ক্ষমতা ক্ষয় পেতে থাকে। মস্তিষ্কের আবরণীর নাম মেনিনজেস। মস্তিষ্কের সবচেয়ে বড় অংশের নাম সেরিব্রাম, এর ওজন মস্তিষ্কের ওজনের ৮০%। এটি মানুষের চিন্তাশক্তি, সহজাত প্রবৃত্তি ও সকল ক্রিয়াকলাপের কেন্দ্রস্থল।"},{"id":"q0335","page":51,"printed_page":473,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৪","topic_title":"স্নায়ুতন্ত্র","number":"০৬","question":"'স্ট্রোক' আকস্মিক অজ্ঞান বা মৃত্যুর কারণ হতে পারে- এটি কি?","exam_ref":"১৫তম বিসিএস","options":{"ক":"হৃৎপিণ্ডের সজোরে সংকোচন বা বন্ধ হয়ে যাওয়া","খ":"মস্তিষ্কে রক্তক্ষরণ এবং রক্ত প্রবাহে বাধা","গ":"হৃৎপিণ্ডের অংশবিশেষের অসাড়তা","ঘ":"ফুসফুস হঠাৎ বিকল হয়ে যাওয়া"},"answer":"খ","answer_text":"মস্তিষ্কে রক্তক্ষরণ এবং রক্ত প্রবাহে বাধা","explanation":"কোনো কারণে মস্তিষ্কের কোথাও রক্ত সরবরাহ বন্ধ হলে বা মস্তিষ্কের কোনো শিরা বা ধমনি ছিঁড়ে গেলে সে অবস্থাকে স্ট্রোক বলে। স্ট্রোকের ফলে মস্তিষ্কে রক্তক্ষরণ দ্রুত সংঘটিত হয় ও সঙ্গে সঙ্গে রোগী জ্ঞান হারিয়ে ফেলে। উচ্চ রক্তচাপ, ডায়াবেটিস, ধূমপান, স্থূলতা, চর্বিজাতীয় খাদ্য বেশি গ্রহণ, অলস জীবন-যাপন, দুশ্চিন্তা ইত্যাদি স্ট্রোকের কারণ।"},{"id":"q0336","page":52,"printed_page":474,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৫","topic_title":"হরমোন","number":"০১","question":"একজন টাইপ-১ ডায়াবেটিক রোগীর ক্ষেত্রে কোন বক্তব্যটি সঠিক?","exam_ref":"৫০তম বিসিএস","options":{"ক":"নির্দিষ্ট কোষের ইনসুলিন প্রতিরোধিতা","খ":"বিটা কোষগুলির অটো-ইমিউন ধ্বংসের কারণে অগ্ন্যাশয় অপর্যাপ্ত ইনসুলিন তৈরি করে","গ":"অগ্ন্যাশয়ের আলফা কোষ দ্বারা গ্লুকাগনের অতিরিক্ত উৎপাদন","ঘ":"প্রো-ইনসুলিন থেকে ইনসুলিনে রূপান্তরের ত্রুটি"},"answer":"খ","answer_text":"বিটা কোষগুলির অটো-ইমিউন ধ্বংসের কারণে অগ্ন্যাশয় অপর্যাপ্ত ইনসুলিন তৈরি করে","explanation":"টাইপ-১ ডায়াবেটিস মূলত একটি অটো-ইমিউন রোগ, যেখানে শরীরের রোগ প্রতিরোধ ব্যবস্থা ভুলবশত অগ্ন্যাশয়ের (Pancreas) ইনসুলিন উৎপাদনকারী বিটা কোষগুলোকে আক্রমণ করে ধ্বংস করে ফেলে। এর ফলে শরীর একদমই ইনসুলিন তৈরি করতে পারে না অথবা খুবই সামান্য পরিমাণ তৈরি করে। ইনসুলিন ছাড়া রক্তে থাকা চিনি বা গ্লুকোজ শরীরের কোষে প্রবেশ করতে পারে না, ফলে রক্তে শর্করার মাত্রা অস্বাভাবিকভাবে বেড়ে যায়। এই ধরনের রোগীদের বেঁচে থাকার জন্য আজীবন বাইরে থেকে ইনসুলিন গ্রহণ করতে হয়। সাধারণত বংশগত কারণে বা পরিবেশগত প্রভাবে অল্প বয়সেই এই রোগ শনাক্ত হয় বলে একে অনেক সময় 'জুভেনাইল ডায়াবেটিস' বলা হয়।"},{"id":"q0337","page":52,"printed_page":474,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৫","topic_title":"হরমোন","number":"০২","question":"এনজাইম, অ্যান্টিবডি এবং হরমোন-এর মৌলিক উপাদান-","exam_ref":"৪৪তম বিসিএস","options":{"ক":"প্রোটিন","খ":"ক্যালসিয়াম","গ":"ভিটামিন","ঘ":"লবণ"},"answer":"ক","answer_text":"প্রোটিন","explanation":"এনজাইম বা উৎসেচক হচ্ছে প্রোটিন দিয়ে গঠিত এক প্রকার অরগানিক ক্যাটালিস্ট (জৈব অনুঘটক)। দেহে অ্যান্টিজেনের উপস্থিতিতে প্রত্যুত্তর হিসেবে অ্যান্টিবডি নামক ইংরেজি ওয়াই (Y) আকৃতির প্রতিরক্ষামূলক প্রোটিন জাতীয় পদার্থ তৈরি হয়। অধিকাংশ হরমোন প্রোটিন দিয়ে গঠিত। যেমন: ইনসুলিন, হিমোগ্লোবিন।"},{"id":"q0338","page":52,"printed_page":474,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৫","topic_title":"হরমোন","number":"০৩","question":"ইনসুলিন নিঃসৃত হয় কোথা থেকে?","exam_ref":"৩৪তম, ২৮তম বিসিএস","options":{"ক":"অগ্ন্যাশয় হতে","খ":"প্যানক্রিয়াস হতে","গ":"লিভার হতে","ঘ":"পিটুইটারী গ্রান্ড হতে"},"answer":"","answer_text":"Blank (অগ্ন্যাশয় ও প্যানক্রিয়াস একই অঙ্গ — উৎসে সুনির্দিষ্ট একক অপশন চিহ্নিত করা হয়নি)","explanation":"প্যানক্রিয়াস (Pancreas)-এর বাংলা প্রতিশব্দ অগ্ন্যাশয়। মানবদেহের অগ্ন্যাশয় বা প্যানক্রিয়াস নামক গ্রন্থির 'আইলেটস অব ল্যান্গারহ্যান্স' নামক অংশ হতে রক্তে শর্করার পরিমাণ নিয়ন্ত্রণকারী হরমোন 'ইনসুলিন' নিঃসৃত হয়। শরীরে প্রয়োজনের তুলনায় কম ইনসুলিন উৎপন্ন হলে রক্তে শর্করা বা গ্লুকোজ এর পরিমাণ বেড়ে যায়। এর ফলে ঘন ঘন ক্ষুধা, পিপাসা ও প্রস্রাবের চাপ লাগে যাকে ডায়াবেটিস বা বহুমূত্র রোগ বলে।","source_note":"উৎসে উত্তর 'Blank' — অগ্ন্যাশয় ও প্যানক্রিয়াস একই অঙ্গের বাংলা-ইংরেজি নাম হওয়ায় সুনির্দিষ্ট একক অপশন নির্ধারিত হয়নি।"},{"id":"q0339","page":52,"printed_page":474,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৫","topic_title":"হরমোন","number":"০৪","question":"মানুষের গায়ের রং কোন উপাদানের উপর নির্ভর করে?","exam_ref":"২৭তম বিসিএস","options":{"ক":"মেলানিন","খ":"থায়ামিন","গ":"ক্যারোটিন","ঘ":"হিমোগ্লোবিন"},"answer":"ক","answer_text":"মেলানিন","explanation":"মানুষের ত্বকে দুটি স্তর আছে। এর বাইরেরটি বহিঃত্বক বা 'এপিডার্মিস' এবং ভেতরেরটিকে বলে অন্তঃত্বক বা 'ডার্মিস'। বহিঃত্বককে আবার কয়েকটি স্তরে ভাগ করা হয়। এর মধ্যে সবচেয়ে ভেতরেরটির নাম 'স্ট্রাটাম বেসাল' (Stratum basale)। এই স্তরে কতগুলো বিশেষ ধরনের কোষ আছে- এদের বলে 'মেলানোসাইট' (Melanocyte)। মেলানোসাইটগুলোর মধ্যে আছে রঞ্জক কণা 'মেলানিন'। গাঢ় রঙের এই কণাগুলোই ত্বকের কালো রঙের জন্য দায়ী। যাদের ত্বকে মেলানিনের পরিমাণ খুব বেশি তাদের গায়ের রং কালো। ত্বকে মেলানিনের পরিমাণ কম থাকলে গায়ের রং ফর্সা হয়। অপরদিকে, ভিটামিন B১ এর অপর নাম থায়ামিন। ক্যারোটিন এক ধরনের আনস্যাচুরেটেড হাইড্রোকার্বন যা শুধু উদ্ভিদ দেহে তৈরি হয় এবং হিমোগ্লোবিন এক ধরনের প্রোটিন যা প্রায় সকল মেরুদণ্ডী প্রাণীর লোহিত রক্ত কণিকায় পাওয়া যায়।"},{"id":"q0340","page":52,"printed_page":474,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৫","topic_title":"হরমোন","number":"০৫","question":"অগ্ন্যাশয় থেকে নির্গত চিনির বিপাক নিয়ন্ত্রণকারী হরমোন কোনটি?","exam_ref":"২৩তম বিসিএস","options":{"ক":"পেনিসিলিন","খ":"ইনসুলিন","গ":"ফলিক অ্যাসিড","ঘ":"অ্যামিনো এসিড"},"answer":"খ","answer_text":"ইনসুলিন","explanation":""},{"id":"q0341","page":52,"printed_page":474,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৫","topic_title":"হরমোন","number":"০৬","question":"কোন হরমোনের অভাবে ডায়াবেটিস রোগ হয়?","exam_ref":"২০তম বিসিএস","options":{"ক":"থাইরোসিন","খ":"গ্লুকাগন","গ":"এড্রিনালিন","ঘ":"ইনসুলিন"},"answer":"ঘ","answer_text":"ইনসুলিন","explanation":""},{"id":"q0342","page":52,"printed_page":474,"chapter":"অধ্যায় ১৪","chapter_title":"মানব শারীরতত্ত্ব","topic_code":"১৪.৫","topic_title":"হরমোন","number":"০৭","question":"বহুমূত্র রোগে কোন হরমোনের দরকার?","exam_ref":"১৯তম বিসিএস","options":{"ক":"ইনসুলিন","খ":"থাইরক্সিন","গ":"এন্ড্রোজেন","ঘ":"এস্ট্রোজেন"},"answer":"ক","answer_text":"ইনসুলিন","explanation":""},{"id":"q0343","page":53,"printed_page":475,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"০১","question":"কোনটি শরীরে নাইট্রোজেন সরবরাহ করে?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"খনিজ লবণ","খ":"ভিটামিন","গ":"স্নেহ","ঘ":"আমিষ"},"answer":"ঘ","answer_text":"আমিষ","explanation":"মানবদেহে কোষ গঠন, টিস্যুর বিকাশ ও বিভিন্ন জৈবিক প্রক্রিয়ায় নাইট্রোজেন একটি অত্যন্ত গুরুত্বপূর্ণ মৌল। নাইট্রোজেন সরবরাহের প্রধান উৎস হলো আমিষ বা প্রোটিন, কারণ প্রোটিন অণু অ্যামিনো অ্যাসিড দিয়ে গঠিত-যার প্রতিটিতেই নাইট্রোজেন পরমাণু থাকে। এই অ্যামিনো অ্যাসিডগুলো দেহে এনজাইম, হরমোন, হিমোগ্লোবিন এবং অন্যান্য গুরুত্বপূর্ণ জৈব অণু সংশ্লেষণে ব্যবহৃত হয়। অন্যদিকে, খনিজ লবণ, ভিটামিন বা স্নেহপদার্থ (চর্বি) সরাসরি নাইট্রোজেন সরবরাহ করে না। তাই দেহের বৃদ্ধি, কোষের পুনরুদ্ধার ও বিপাকীয় নিয়ন্ত্রণের জন্য আমিষ অপরিহার্য ভূমিকা পালন করে।"},{"id":"q0344","page":53,"printed_page":475,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"০২","question":"অত্যাবশ্যকীয় অ্যামাইনো এসিড কোনটি?","exam_ref":"৪৬তম বিসিএস","options":{"ক":"গ্লাইসিন (Glycine)","খ":"সেরিন (Serine)","গ":"সিস্টিন (Cistine)","ঘ":"ভ্যালিন (Valine)"},"answer":"ঘ","answer_text":"ভ্যালিন (Valine)","explanation":"যে সকল অ্যামাইনো এসিড প্রাণী দেহে নিজে নিজে সংশ্লেষিত হতে পারে না, বাহির থেকে খাবারের মাধ্যমে সরবরাহ করতে হয় তাদেরকে অত্যাবশ্যকীয় অ্যামাইনো এসিড বলে। পূর্ণবয়স্কদের জন্য অত্যাবশ্যকীয় অ্যামাইনো এসিড ৮টি। যথা: লিউসিন, আইসোলিউসিন, লাইসিন, থ্রিয়োনিন, ভ্যালিন, মিথিয়োনিন, ফিনাইল আলানিন এবং ট্রিপ্টোফ্যান। শিশুদের জন্য অত্যাবশ্যকীয় অ্যামাইনো এসিড ১০টি (অতিরিক্ত- আরজিনিন ও হিস্টিডিন)। প্রাণিজ প্রোটিনে এদের বেশি পাওয়া যায়।"},{"id":"q0345","page":53,"printed_page":475,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"০৩","question":"রক্ত জমাট বাঁধার জন্য প্রয়োজনীয় ভিটামিনটি হল-","exam_ref":"৪৬তম, ২৬তম বিসিএস","options":{"ক":"Vitamin K","খ":"Vitamin A","গ":"Vitamin B","ঘ":"Vitamin C"},"answer":"ক","answer_text":"Vitamin K","explanation":"ভিটামিন-কে এর রাসায়নিক নাম ফাইলোকুইনোন। এটি প্রোথ্রম্বিন নামক প্রোটিন তৈরি করে, যা রক্ত জমাট বাঁধতে সহায়তা করে। এছাড়াও ইলেকট্রন ট্রান্সপোর্ট সিস্টেমেও ভিটামিন কে ব্যবহার করা হয়। ডিমের কুসুম, সবজি, পালংশাকে Vitamin K পাওয়া যায়। ভিটামিন C স্কার্ভি রোগ প্রতিরোধ করে। ভিটামিন B বেরিবেরি রোগ প্রতিরোধ করে। ভিটামিন B₂ এর অভাবে মুখে ঘা ও দৈহিক বৃদ্ধি বাধাপ্রাপ্ত হয়।"},{"id":"q0346","page":53,"printed_page":475,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"০৪","question":"সুষম খাদ্যে শর্করা, আমিষ ও চর্বিজাতীয় খাদ্যের অনুপাত?","exam_ref":"৪৫তম বিসিএস","options":{"ক":"8:1:1","খ":"8:2:2","গ":"8:2:3","ঘ":"8:3:2"},"answer":"ক","answer_text":"8:1:1","explanation":"খাদ্যের ৬টি উপাদান শর্করা, আমিষ, স্নেহ, ভিটামিন, খনিজ লবণ এবং পানি যে খাদ্যে সুষম মাত্রায় মিশ্রিত থাকে তাকে সুষম খাদ্য বলে। সুষম খাদ্যে শর্করা, আমিষ ও চর্বির অনুপাত হয় 8:1:1। অর্থাৎ সুষম খাদ্যে আমিষ ও চর্বি সমান পরিমাণে থাকবে এবং শর্করা থাকবে তার চারগুণ।"},{"id":"q0347","page":53,"printed_page":475,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"০৫","question":"ফলিক এসিডের অন্য নাম কোনটি?","exam_ref":"৪৪তম বিসিএস","options":{"ক":"ভিটামিন বি ১২","খ":"ভিটামিন বি ৬","গ":"ভিটামিন বি ১","ঘ":"ভিটামিন বি ৯"},"answer":"ঘ","answer_text":"ভিটামিন বি ৯","explanation":"ফলিক এসিড বা ভিটামিন বি ৯ হচ্ছে ভিটামিন বি এর একটি রূপ যা প্রাকৃতিকভাবে সৃষ্ট ও পানিতে দ্রবণীয়। এর অভাবে রক্তশূন্যতা হয়।"},{"id":"q0348","page":53,"printed_page":475,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"০৬","question":"প্রোটিন তৈরি হয়-","exam_ref":"৪৩তম, ৪১তম বিসিএস","options":{"ক":"ফ্যাটি এসিড দিয়ে","খ":"সাইট্রিক এসিড দিয়ে","গ":"অ্যামিনো এসিড দিয়ে","ঘ":"অক্সালিক এসিড দিয়ে"},"answer":"গ","answer_text":"অ্যামিনো এসিড দিয়ে","explanation":"প্রোটিন (Protein) হল এক প্রকারের বৃহৎ জৈব অণু কিংবা বৃহদাণু, যা এক বা একাধিক দীর্ঘ অ্যামিনো অ্যাসিডের শৃঙ্খল নিয়ে গঠিত। প্রোটিনগুলি জীবদেহের ভেতরে বিশাল সংখ্যক কাজ সম্পাদন করে। যেমন- বিপাকীয় বিক্রিয়াসমূহের অনুঘটন, ডিএনএ প্রতিলিপিকরণ, উদ্দীপকের প্রতি সাড়াদান, কোষ ও জীবদেহে কাঠামো প্রদান, এক স্থান থেকে অন্যত্র বিভিন্ন অণু পরিবহণ ইত্যাদি। দেহের শুষ্ক ওজনের ৫০ ভাগ প্রোটিন। এটি দেহের ক্ষয়পূরণ ও বৃদ্ধি সাধন করে।"},{"id":"q0349","page":54,"printed_page":476,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"০৭","question":"কার্বোহাইড্রেটে C, H এবং O-এর অনুপাত কত?","exam_ref":"৪০তম বিসিএস","options":{"ক":"১:১:২","খ":"১:২:১","গ":"১:৩:২","ঘ":"১:৩:১"},"answer":"খ","answer_text":"১:২:১","explanation":"কার্বোহাইড্রেট বা শর্করা হলো কার্বন, হাইড্রোজেন ও অক্সিজেনের সমন্বয়ে গঠিত এক প্রকার জৈব রাসায়নিক পদার্থ। এর সংকেত (CH₂O)ₙ। এতে C, H ও O-এর অনুপাত যথাক্রমে ১:২:১। কার্বোহাইড্রেট জীবদেহের শক্তির প্রধান উৎস হিসেবে কাজ করে। ধান, গম, আলু, ভুট্টা, চিনি, গুড়, পাকা ফল, শাকসবজি ইত্যাদি শর্করার প্রধান উৎস।"},{"id":"q0350","page":54,"printed_page":476,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"০৮","question":"ডিমে কোন ভিটামিন নেই?","exam_ref":"৪০তম বিসিএস","options":{"ক":"ভিটামিন-এ","খ":"ভিটামিন-বি","গ":"ভিটামিন-সি","ঘ":"ভিটামিন-ডি"},"answer":"গ","answer_text":"ভিটামিন-সি","explanation":"ডিমে ভিটামিন সি নেই। ডিমের মধ্যে ভিটামিন- A, B, D ও E বিদ্যমান রয়েছে। ভিটামিন-সি রয়েছে টাটকা টক জাতীয় ফলে। যেমন- কমলালেবু, বাতাবিলেবু, পাতিলেবু, আনারস, আঙুর, আম, জাম, আমলকী এবং টমেটো, শাক, বরবটি ইত্যাদি সবজিতে।"},{"id":"q0351","page":54,"printed_page":476,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"০৯","question":"দৈনিক খাদ্য তালিকায় সামুদ্রিক মাছ/শৈবালের অন্তর্ভুক্তি, কোন রোগের প্রাদুর্ভাব কমাতে সাহায্য করবে?","exam_ref":"৩৭তম বিসিএস","options":{"ক":"হাইপো-থাইরয়ডিজম (HYPOTHYROIDISM)","খ":"রাতকানা","গ":"এনিমিয়া","ঘ":"কোয়াশিয়রকর (KWASHIORKOR)"},"answer":"ক","answer_text":"হাইপো থাইরয়ডিজম (HYPOTHYROIDISM)","explanation":"কোনো কারণে থাইরয়েড গ্রন্থির হরমোন উৎপাদন কমে গেলে তাকে হাইপো-থাইরয়েডিজম বলে। বাংলাদেশে প্রধানত খাদ্যে আয়োডিনের ঘাটতির কারণে এ হরমোন উৎপাদন ব্যাহত হয়। দৈনন্দিন খাবারের সঙ্গে বেশি পরিমাণ আয়োডিনযুক্ত খাদ্য (শাকসবজি, ফলমূল, সামুদ্রিক মাছ ও শৈবাল) ও আয়োডিনযুক্ত লবণ খেয়ে এ রোগ থেকে আরোগ্য লাভ করা যায়। সামুদ্রিক মাছ ও শৈবালে প্রচুর পরিমাণ আয়োডিন থাকে।"},{"id":"q0352","page":54,"printed_page":476,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"১০","question":"চা পাতায় কোন ভিটামিন থাকে?","exam_ref":"৩৭তম, ২৮তম বিসিএস","options":{"ক":"ভিটামিন 'ই'","খ":"ভিটামিন 'কে'","গ":"ভিটামিন বি কমপ্লেক্স","ঘ":"ভিটামিন 'এ'"},"answer":"গ","answer_text":"ভিটামিন বি কমপ্লেক্স","explanation":"শাকসবজি, তেলবীজ এবং হাঙর মাছের যকৃতের তেলে ভিটামিন-ই পাওয়া যায়। সবুজ শাকসবজি, দুগ্ধজাত দ্রব্য ভিটামিন 'কে'-এর প্রধান উৎস। চা পাতা, বৃষ্টির পানিতে ভিটামিন-বি কমপ্লেক্স পাওয়া যায়। মাছের তেল, দুধ, মলা মাছ, মাছের মাথা এবং গাজরে সর্বাধিক ভিটামিন-এ রয়েছে। ভিটামিন-বি কমপ্লেক্স ছাড়াও চা পাতায় আরও থাকে অ্যামাইনো এসিড, ক্যাফেইন, ফ্লোরিন, টেনিন, খনিজ লবণ, পটাসিয়াম ইত্যাদি। ভিটামিন-বি কমপ্লেক্স এর অভাবে বেরিবেরি, ঠোঁটের কোণ ও মুখের চারদিকে ঘা এবং রক্তশূন্যতা দেখা দেয়।"},{"id":"q0353","page":54,"printed_page":476,"chapter":"অধ্যায় ১৫","chapter_title":"খাদ্য ও পুষ্টি","topic_code":"১৫.১","topic_title":"খাদ্য উপাদান","number":"১১","question":"নিচের কোনটি আমিষ জাতীয় খাদ্য হজমে সাহায্য করে?",
