<!DOCTYPE html>
<html lang="bn">
<head>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বিসিএস সাধারণ বিজ্ঞান — প্রশ্নব্যাংক ও কুইজ</title>
<style>
:root{
  --bg:#f7f3ec;
  --bg-alt:#ffffff;
  --ink:#241f1a;
  --ink-soft:#5b5248;
  --ink-faint:#8a8074;
  --line:#e3dbcb;
  --accent:#0f6b5c;
  --accent-soft:#e4efe9;
  --accent-ink:#0a4a40;
  --gold:#b9862f;
  --gold-soft:#f5ead2;
  --red:#a3392d;
  --red-soft:#f7e6e3;
  --radius:14px;
  --shadow:0 1px 2px rgba(36,31,26,0.06),0 6px 20px -8px rgba(36,31,26,0.12);
  --font-bn:'Kalpurush','Siyam Rupali','Li Ador Noirrit','Noto Sans Bengali','Vrinda','Bangla MN','Bangla Sangam MN',sans-serif;
  --font-ui:'Kalpurush','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[data-theme="dark"]{
  --bg:#181613;
  --bg-alt:#221f1b;
  --ink:#eee7da;
  --ink-soft:#c3b8a6;
  --ink-faint:#8d8272;
  --line:#3a352c;
  --accent:#4bb3a0;
  --accent-soft:#1e2f2a;
  --accent-ink:#7fd6c3;
  --gold:#e0ad5f;
  --gold-soft:#332a17;
  --red:#e08376;
  --red-soft:#3a221e;
  --shadow:0 1px 2px rgba(0,0,0,0.3),0 6px 24px -8px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
[data-fontsize="sm"]{ --scale:0.92; }
[data-fontsize="md"]{ --scale:1; }
[data-fontsize="lg"]{ --scale:1.14; }
[data-fontsize="xl"]{ --scale:1.3; }
body{ font-size:calc(16px * var(--scale,1)); }

button, select, input{ font-family:inherit; }
a{ color:inherit; }

.layout{ display:block; }
.side-nav{ display:none; }

.app-shell{
  max-width:960px;
  margin:0 auto;
  padding:0 16px 100px;
  min-height:100vh;
}
.narrow-wrap{ max-width:640px; margin:0 auto; }
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:14px 0 12px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand{
  display:flex; align-items:baseline; gap:8px;
  font-weight:700; font-size:1.05rem;
}
.brand .mark{
  display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; border-radius:9px;
  background:var(--accent); color:#fff; font-size:0.95rem;
  font-weight:800;
  flex-shrink:0;
}
.brand small{ color:var(--ink-faint); font-weight:500; font-size:0.72rem; }
.topbar-actions{ display:flex; gap:8px; }
.icon-btn{
  border:1px solid var(--line);
  background:var(--bg-alt);
  color:var(--ink);
  border-radius:10px;
  width:38px; height:38px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  font-size:1rem;
}
.icon-btn:active{ transform:scale(0.94); }

main{ padding-top:18px; }
.view{ display:none; animation:fadein .18s ease; }
.view.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

h1.page-title{ font-size:1.4rem; margin:2px 0 4px; }
p.page-sub{ color:var(--ink-soft); margin:0 0 18px; font-size:0.92rem; }

.card{
  background:var(--bg-alt);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card-pad{ padding:18px; }

/* Dashboard */
.stat-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;
}
.stat-box{
  background:var(--bg-alt); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 12px; text-align:center;
}
.stat-box .num{ font-size:1.5rem; font-weight:800; color:var(--accent-ink); display:block; }
.stat-box .lbl{ font-size:0.74rem; color:var(--ink-faint); margin-top:2px; }

.progress-ring-wrap{ display:flex; align-items:center; gap:16px; }
.ring{ width:84px; height:84px; flex-shrink:0; }
.overall-copy .big{ font-size:1.6rem; font-weight:800; }
.overall-copy .sub{ font-size:0.82rem; color:var(--ink-soft); }

.action-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0;
}
.action-card{
  border:1px solid var(--line); background:var(--bg-alt); border-radius:var(--radius);
  padding:16px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:6px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.action-card:active{ transform:scale(0.97); }
.action-card .ic{ font-size:1.4rem; }
.action-card .t{ font-weight:700; font-size:0.95rem; }
.action-card .d{ font-size:0.78rem; color:var(--ink-faint); }
.action-card.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
.action-card.primary .d{ color:rgba(255,255,255,0.8); }
.action-card.due-badge{ position:relative; }
.badge-count{
  position:absolute; top:12px; right:12px;
  background:var(--red); color:#fff; font-size:0.7rem; font-weight:700;
  min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  padding:0 5px;
}

.chapter-list{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
.chapter-row{
  display:flex; align-items:center; gap:12px; padding:12px 14px;
  border:1px solid var(--line); border-radius:12px; background:var(--bg-alt);
  cursor:pointer;
}
.chapter-row .chnum{
  width:34px; height:34px; border-radius:9px; background:var(--accent-soft); color:var(--accent-ink);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; flex-shrink:0;
}
.chapter-row .chinfo{ flex:1; min-width:0; }
.chapter-row .chtitle{ font-weight:600; font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chapter-row .chmeta{ font-size:0.74rem; color:var(--ink-faint); margin-top:2px; }
.chapter-row .chpct{ font-size:0.8rem; color:var(--accent-ink); font-weight:700; flex-shrink:0; }
.mini-bar{ width:100%; height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:6px; }
.mini-bar > div{ height:100%; background:var(--accent); border-radius:3px; }

/* Browse */
.crumb{ font-size:0.82rem; color:var(--ink-faint); margin-bottom:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.crumb button{ background:none; border:none; color:var(--accent-ink); cursor:pointer; font-size:0.82rem; padding:0; text-decoration:underline; }
.topic-list{ display:flex; flex-direction:column; gap:8px; }
.topic-row{
  padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--bg-alt);
  cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;
}
.topic-row .tt{ font-weight:600; font-size:0.9rem; }
.topic-row .tc{ font-size:0.72rem; color:var(--ink-faint); }
.topic-row .count{ font-size:0.78rem; color:var(--ink-faint); flex-shrink:0; }

.q-list{ display:flex; flex-direction:column; gap:10px; }
.q-item{
  border:1px solid var(--line); border-radius:12px; background:var(--bg-alt); padding:14px;
}
.q-item .qhead{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.q-item .qnum{ font-size:0.72rem; color:var(--ink-faint); font-weight:700; }
.q-item .qtext{ font-weight:600; margin:4px 0 8px; font-size:0.95rem; }
.q-item .examref{ font-size:0.72rem; color:var(--gold); font-weight:600; margin-bottom:8px; }
.q-star{ background:none; border:none; cursor:pointer; font-size:1.1rem; color:var(--ink-faint); flex-shrink:0; padding:2px; }
.q-star.active{ color:var(--gold); }

.opt-list{ display:flex; flex-direction:column; gap:7px; margin:8px 0; }
.opt-row{
  display:flex; gap:8px; align-items:flex-start; padding:9px 11px; border:1px solid var(--line);
  border-radius:10px; font-size:0.88rem; background:var(--bg);
}
.opt-row .k{ font-weight:700; color:var(--ink-faint); flex-shrink:0; }
.opt-row.correct{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }
.opt-row.correct .k{ color:var(--accent-ink); }

.reveal-btn{
  border:1px solid var(--line); background:var(--bg); color:var(--accent-ink);
  border-radius:9px; padding:7px 12px; font-size:0.8rem; font-weight:600; cursor:pointer; margin-top:4px;
}
.explain-box{
  margin-top:10px; padding:11px 12px; background:var(--gold-soft); border-radius:10px;
  font-size:0.86rem; color:var(--ink); border:1px solid var(--line); display:none;
}
.explain-box.show{ display:block; }
.explain-box .lbl{ font-weight:700; color:var(--gold); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; display:block; margin-bottom:4px; }
.source-note{ margin-top:8px; font-size:0.78rem; color:var(--red); background:var(--red-soft); padding:8px 10px; border-radius:8px; }

/* Search */
.search-wrap{ position:relative; margin-bottom:14px; }
.search-input{
  width:100%; padding:12px 14px 12px 40px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg-alt); color:var(--ink); font-size:0.95rem;
}
.search-wrap .si-icon{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--ink-faint); }
.filter-chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.chip{
  border:1px solid var(--line); background:var(--bg-alt); color:var(--ink-soft);
  border-radius:999px; padding:6px 13px; font-size:0.78rem; cursor:pointer;
}
.chip.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

/* Quiz */
.quiz-setup-grid{ display:flex; flex-direction:column; gap:10px; }
.setup-row{ display:flex; flex-direction:column; gap:6px; }
.setup-row label{ font-size:0.8rem; color:var(--ink-soft); font-weight:600; }
.setup-row select{
  padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg-alt); color:var(--ink);
  font-size:0.9rem;
}
.big-btn{
  width:100%; padding:14px; border-radius:12px; border:none; background:var(--accent); color:#fff;
  font-weight:700; font-size:0.98rem; cursor:pointer; margin-top:6px;
}
.big-btn:disabled{ opacity:0.5; cursor:not-allowed; }
.big-btn.ghost{ background:var(--bg-alt); color:var(--accent-ink); border:1px solid var(--accent); }

.quiz-progress{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.quiz-progress .bar{ flex:1; height:7px; background:var(--line); border-radius:4px; overflow:hidden; }
.quiz-progress .bar > div{ height:100%; background:var(--accent); }
.quiz-progress .lbl{ font-size:0.78rem; color:var(--ink-faint); white-space:nowrap; }

.quiz-card .meta-line{ display:flex; justify-content:space-between; font-size:0.72rem; color:var(--ink-faint); margin-bottom:8px; }
.quiz-card .qtext{ font-size:1.05rem; font-weight:700; margin:0 0 14px; }
.opt-btn{
  display:flex; gap:10px; width:100%; text-align:left; padding:13px 14px; margin-bottom:9px;
  border:1px solid var(--line); border-radius:12px; background:var(--bg-alt); color:var(--ink);
  font-size:0.92rem; cursor:pointer;
}
.opt-btn .k{ font-weight:800; color:var(--ink-faint); flex-shrink:0; }
.opt-btn:active{ transform:scale(0.985); }
.opt-btn.selected{ border-color:var(--accent); }
.opt-btn.correct{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
.opt-btn.correct .k{ color:var(--accent-ink); }
.opt-btn.wrong{ background:var(--red-soft); border-color:var(--red); color:var(--red); }
.opt-btn.wrong .k{ color:var(--red); }
.opt-btn.disabled{ cursor:default; }

.quiz-feedback{ margin-top:6px; }
.quiz-feedback .verdict{ font-weight:800; font-size:0.95rem; margin-bottom:6px; }
.quiz-feedback .verdict.right{ color:var(--accent-ink); }
.quiz-feedback .verdict.wrong{ color:var(--red); }
.nav-row{ display:flex; gap:10px; margin-top:14px; }
.nav-row .big-btn{ margin-top:0; }

.srs-rate-row{ display:flex; gap:8px; margin-top:12px; }
.srs-btn{
  flex:1; padding:11px 4px; border-radius:10px; border:1px solid var(--line); background:var(--bg-alt);
  font-size:0.78rem; font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
}
.srs-btn .sub{ font-size:0.65rem; color:var(--ink-faint); font-weight:500; }
.srs-btn.again{ color:var(--red); }
.srs-btn.hard{ color:var(--gold); }
.srs-btn.good{ color:var(--accent-ink); }
.srs-btn.easy{ color:var(--accent-ink); }

.result-hero{ text-align:center; padding:26px 10px; }
.result-hero .score{ font-size:2.6rem; font-weight:800; color:var(--accent-ink); }
.result-hero .sub{ color:var(--ink-soft); margin-top:4px; }

.empty-state{ text-align:center; padding:50px 20px; color:var(--ink-faint); }
.empty-state .ic{ font-size:2.2rem; margin-bottom:10px; }
.empty-state .t{ font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
.empty-state .d{ font-size:0.85rem; }

/* Bottom nav */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:var(--bg-alt); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav-btn{
  background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
  color:var(--ink-faint); font-size:0.62rem; padding:6px 8px; cursor:pointer; flex:1; max-width:90px;
}
.nav-btn .ic{ font-size:1.15rem; }
.nav-btn.active{ color:var(--accent-ink); font-weight:700; }

/* Settings */
.settings-row{
  display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line);
}
.settings-row:last-child{ border-bottom:none; }
.settings-row .st{ font-weight:600; font-size:0.9rem; }
.settings-row .sd{ font-size:0.76rem; color:var(--ink-faint); margin-top:2px; }
.seg-control{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.seg-control button{
  border:none; background:var(--bg-alt); color:var(--ink-soft); padding:7px 12px; font-size:0.8rem; cursor:pointer;
}
.seg-control button.active{ background:var(--accent); color:#fff; }
.danger-btn{
  border:1px solid var(--red); color:var(--red); background:transparent; border-radius:10px;
  padding:9px 14px; font-size:0.85rem; font-weight:600; cursor:pointer;
}
.section-label{ font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); font-weight:700; margin:22px 0 8px; }
.section-label:first-child{ margin-top:0; }

.toast{
  position:fixed; bottom:88px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:0.84rem;
  opacity:0; pointer-events:none; transition:all .25s ease; z-index:60; white-space:nowrap;
}
[data-theme="dark"] .toast{ background:var(--accent); color:#0a1512; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

::selection{ background:var(--gold-soft); }

@media (min-width:640px){
  .stat-grid{ grid-template-columns:repeat(4,1fr); }
}

/* ---------- Desktop layout ---------- */
@media (min-width:900px){
  body{ display:flex; justify-content:center; }
  .layout{
    display:flex; align-items:flex-start;
    width:100%; max-width:1280px;
    min-height:100vh;
  }
  .side-nav{
    display:flex; flex-direction:column; gap:3px;
    width:236px; flex-shrink:0;
    position:sticky; top:0; align-self:flex-start; height:100vh;
    padding:22px 14px 20px;
    border-right:1px solid var(--line);
    overflow-y:auto;
  }
  .side-nav .brand{ padding:4px 10px 20px; align-items:center; }
  .side-nav .nav-btn{
    flex-direction:row; justify-content:flex-start; gap:11px;
    padding:11px 13px; border-radius:10px; font-size:0.86rem; max-width:none; width:100%;
    color:var(--ink-soft);
  }
  .side-nav .nav-btn .ic{ font-size:1.05rem; }
  .side-nav .nav-btn.active{ background:var(--accent-soft); color:var(--accent-ink); }
  .side-nav .nav-btn:hover{ background:var(--bg); }

  .bottom-nav{ display:none; }

  .app-shell{
    flex:1; min-width:0;
    max-width:1044px;
    margin:0;
    padding:0 40px 60px;
  }
  .topbar .brand{ display:none; }
  .topbar{ justify-content:flex-end; padding-top:20px; }

  .chapter-list, .topic-list{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px 14px;
  }
  .action-grid{ grid-template-columns:repeat(4,1fr); }
  .q-list{ max-width:760px; }
  .card.card-pad.result-hero{ max-width:640px; margin:0 auto; }
}

@media (min-width:1300px){
  .layout{ max-width:1440px; }
  .app-shell{ max-width:1180px; padding:0 52px 60px; }
  .chapter-list, .topic-list{ grid-template-columns:repeat(3,1fr); }
}

</style>
</head>
<body>
<div id="ag-overlay"></div>

<div class="layout">
  <nav class="side-nav">
    <div class="brand"><span class="mark">বি</span><span>সাধারণ বিজ্ঞান<br><small>BCS প্রশ্নব্যাংক</small></span></div>
    <button class="nav-btn" data-nav="dashboard"><span class="ic">🏠</span>হোম</button>
    <button class="nav-btn" data-nav="browse"><span class="ic">📚</span>ব্রাউজ</button>
    <button class="nav-btn" data-nav="quiz"><span class="ic">📝</span>কুইজ</button>
    <button class="nav-btn" data-nav="srs"><span class="ic">🔁</span>রিভিউ</button>
    <button class="nav-btn" data-nav="mistakes-link"><span class="ic">✗</span>ভুল প্রশ্ন</button>
    <button class="nav-btn" data-nav="bookmarks-link"><span class="ic">★</span>বুকমার্ক</button>
    <button class="nav-btn" data-nav="search-link"><span class="ic">🔍</span>খুঁজুন</button>
    <button class="nav-btn" data-nav="settings-link"><span class="ic">⚙</span>সেটিংস</button>
  </nav>

  <div class="app-shell">
    <div class="topbar">
      <div class="brand"><span class="mark">বি</span><span>সাধারণ বিজ্ঞান<br><small>BCS প্রশ্নব্যাংক</small></span></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="topbar-search" title="খুঁজুন" aria-label="খুঁজুন">🔍</button>
        <button class="icon-btn" id="topbar-settings" title="সেটিংস" aria-label="সেটিংস">⚙</button>
      </div>
    </div>
    <main><div id="view-root" class="view active"></div></main>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn" data-nav="dashboard"><span class="ic">🏠</span>হোম</button>
  <button class="nav-btn" data-nav="browse"><span class="ic">📚</span>ব্রাউজ</button>
  <button class="nav-btn" data-nav="quiz"><span class="ic">📝</span>কুইজ</button>
  <button class="nav-btn" data-nav="srs"><span class="ic">🔁</span>রিভিউ</button>
  <button class="nav-btn" data-nav="more"><span class="ic">⋯</span>আরও</button>
</nav>

িকর্ষজ ত্বরণ g এর সাথে সমানুপাতিক (w∝g)। g সর্বোচ্চ হলে ওজন সর্বোচ্চ হয় এবং g সর্বনিম্ন হলে ওজনও সর্বনিম্ন হয়। ওজনের বিভিন্নতা: মেরু অঞ্চলে অভিকর্ষজ ত্বরণের মান বেশি থাকায় বস্তুর ওজন বেশি। বিষুবীয়/নিরক্ষীয় অঞ্চলে অভিকর্ষজ ত্বরণের মান কম থাকায় বস্তুর ওজন কম। পৃথিবীর কেন্দ্রে অভিকর্ষজ ত্বরণের মান শূন্য হওয়ার ফলে বস্তুর ওজন শূন্য। পৃথিবী পৃষ্ঠের উপরে বা নিচে অভিকর্ষজ ত্বরণের মান কমতে থাকে, তাই ওজনও কমতে থাকে।"},{"id":"q0022","page":5,"printed_page":427,"chapter":"অধ্যায় ০২","chapter_title":"বল, কাজ ও শক্তি","topic_code":"২.১","topic_title":"বল ও নিউটনের গতিসূত্র","number":"০৩","question":"যখন দুটি বস্তুর সংঘর্ষ হয় এবং তারা একসাথে লেগে থাকে, তখন তাকে কোন ধরনের সংঘর্ষ বলে?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"স্থিতিস্থাপক সংঘর্ষ","খ":"প্লাস্টিক সংঘর্ষ","গ":"অস্থিতিস্থাপক সংঘর্ষ","ঘ":"ঘর্ষনীয় সংঘর্ষ"},"answer":"খ","answer_text":"প্লাস্টিক সংঘর্ষ","explanation":"যখন দুটি বস্তু সংঘর্ষের পর পুরোপুরি একসাথে আটকে যায় বা লেগে থাকে তাকে প্লাস্টিক সংঘর্ষ বলে। পদার্থবিজ্ঞানে প্লাস্টিক সংঘর্ষ এক ধরনের অস্থিতিস্থাপক সংঘর্ষ এবং তাদের মোট গতিশক্তি সর্বাধিক পরিমাণে তাপ, শব্দ অথবা বিকৃতির মতো অন্যান্য শক্তিতে রূপান্তরিত হয়, যার ফলে কোনো গতিশক্তি সংরক্ষিত থাকে না।"},{"id":"q0023","page":5,"printed_page":427,"chapter":"অধ্যায় ০২","chapter_title":"বল, কাজ ও শক্তি","topic_code":"২.১","topic_title":"বল ও নিউটনের গতিসূত্র","number":"০৪","question":"প্রকৃতিতে মৌলিক বল কয়টি?","exam_ref":"৪৬তম বিসিএস","options":{"ক":"২ টি","খ":"৩ টি","গ":"৪ টি","ঘ":"৫ টি"},"answer":"গ","answer_text":"৪ টি","explanation":"যে সকল বল মূল বা স্বাধীন অর্থাৎ যে সকল বল অন্য কোনো বল থেকে উৎপন্ন হয় না; বরং অন্যান্য বল এ সকল বলের কোনো না কোনো রূপের প্রকাশ তাদের মৌলিক বল বলে। প্রকৃতিতে মৌলিক বল ৪ প্রকার। যথা: ১. মহাকর্ষ বল, ২. তড়িৎ চৌম্বক বল, ৩. দুর্বল নিউক্লীয় বল, ৪. সবল নিউক্লীয় বল। মৌলিক বলসমূহের মধ্যে মহাকর্ষ বল সবচেয়ে দুর্বল এবং সবল নিউক্লীয় বল সবচেয়ে শক্তিশালী।"},{"id":"q0024","page":5,"printed_page":427,"chapter":"অধ্যায় ০২","chapter_title":"বল, কাজ ও শক্তি","topic_code":"২.১","topic_title ,"number":"০৩","question":"রেফ্রিজারেটরের কমপ্রেসরের কাজ কী?","exam_ref":"২৮তম বিসিএস","options":{"ক":"ফ্রেয়নকে ঘনীভূত করা","খ":"ফ্রেয়নকে বাষ্পে পরিণত করা","গ":"ফ্রেয়নকে সংকুচিত করে এর তাপ ও তাপমাত্রা বাড়ানো","ঘ":"ফ্রেয়নকে ঠাণ্ডা করা"},"answer":"ক","answer_text":"ফ্রেয়নকে ঘনীভূত করা","explanation":"রেফ্রিজারেটরের মধ্যে একটি শীতলীকরণ প্রকোষ্ঠ থাকে, যাকে ঘিরে থাকে ফাঁপা নলের তৈরি বাষ্পীভবন কুণ্ডলী। এই কুণ্ডলীর মধ্যে উদ্বায়ী পদার্থ ফ্রেয়ন থাকে এবং একে একটি সংকোচন পাম্প বা কমপ্রেসরের (Compressor) সাথে যুক্ত করা হয়। এই সংকোচন পাম্প বা কমপ্রেসর চালু করা হলে নলের ভিতরের চাপ কমে যাওয়ায় ফ্রেয়ন দ্রুত বাষ্পীভূত হয়। ফ্রেয়ন বাষ্পীভূত হওয়ার সময় বাষ্পীভবনের জন্য প্রয়োজনীয় সুপ্ততাপ শীতলীকরণ প্রকোষ্ঠ থেকে নেয় বলে এখানে শীতলীকরণ ঘটে। পরবর্তীকালে বাষ্পীভূত ফ্রেয়নকে ঘনীভবন কুণ্ডলীর মধ্যে এনে কমপ্রেসরের সাহায্যে সংকুচিত বা ঘনীভূত করে পুনরায় তরলে পরিণত করা হয়। কাজেই বলা যায় যে, ফ্রেয়নকে বাষ্পে পরিণত করা এবং ফ্রেয়নকে ঘনীভূত করা এই উভয় কাজই কমপ্রেসর করে থাকে। তবে কমপ্রেসরের প্রধান কাজ হলো ফ্রেয়নকে ঘনীভূত করা। ফ্রেয়নের রাসায়নিক নাম ডাইক্লোরো ডাইফ্লোরো মিথেন (Cl₂CF₂)।"},{"id":"q0063","page":11,"printed_page":433,"chapter":"অধ্যায় ০৩","chapter_title":"তাপ ও তাপগতিবিদ্যা","topic_code":"৩.৩","topic_title":"তাপ ইঞ্জিন ও রেফ্রিজারেটর","number":"০৪","question":"কোন ইঞ্জিনে কার্বুরেটর থাকে?","exam_ref":"২৭তম বিসিএস","options":{"ক":"পেট্রোল ইঞ্জিনে","খ":"ডিজেল ইঞ্জিনে","গ":"রকেট ইঞ্জিনে","ঘ":"বিমান ইঞ্জিনে"},"answer":"ক","answer_text":"পেট্রোল ইঞ্জিনে","explanation":"মোটর গাড়ির যে প্রকোষ্ঠে বায়ু ও পেট্রোল মিশ্রিত করা হয় তা হলো কার্বুরেটর। বায়ু ও পেট্রোলের মিশ্রণ তৈরি হওয়ার পরে এটিকে দহন প্রকোষ্ঠে পাঠিয়ে দেয়া হয়। সব ইঞ্জিনে কার্বুরেটর থাকে না। শুধু পেট্রোল ইঞ্জিনে এটি থাকে।"},{"id":"q0064","page":12,"printed_page":434,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"০১","question":"জেমস ওয়েব স্পেস টেলিস্কোপ (JWST) মূলতঃ তড়িৎ-চুম্বকীয় বর্ণালীর কোন অংশে মহাবিশ্ব পর্যবেক্ষণ করার জন্য ডিজাইন করা হয়েছে?","exam_ref":"৫০তম বিসিএস","options":{"ক":"অবলোহিত অঞ্চল","খ":"দৃশ্যমান এবং নিকট-অবলোহিত অঞ্চল","গ":"অতিবেগুনী এবং দৃশ্যমান অঞ্চল","ঘ":"এক্স-রে এবং গামা-রে অঞ্চল"},"answer":"ক","answer_text":"অবলোহিত অঞ্চল","explanation":"জেমস ওয়েব স্পেস টেলিস্কোপ মূলত মহাবিশ্বকে অবলোহিত বা ইনফ্রারেড আলোতে দেখার জন্য ডিজাইন করা হয়েছে। যদিও এটি দৃশ্যমান আলোর লাল অংশের খুব কাছাকাছি কিছু আলো শনাক্ত করতে পারে, তবে এর মূল লক্ষ্য হলো নিকট-অবলোহিত (Near-Infrared) এবং মধ্য-অবলোহিত (Mid-Infrared) রশ্মি পর্যবেক্ষণ করা। ইনফ্রারেড ব্যবহারের প্রধান কারণ হলো মহাবিশ্বের ধূলিকণার বিশাল মেঘ ভেদ করে দূরের নক্ষত্র বা গ্রহ দেখা সম্ভব, যা সাধারণ দৃশ্যমান আলোতে দেখা যায় না। এছাড়া, মহাবিশ্ব প্রসারণের ফলে দূরবর্তী গ্যালাক্সিগুলো থেকে আসা আলো অনেক দূরে সরে যেতে যেতে লাল বা অবলোহিতে হয়ে যায় (যাকে Redshift বলা হয়), যা এই টেলিস্কোপটি নিখুঁতভাবে ধরতে পারে। এর মাধ্যমে আমরা মহাবিশ্বের জন্মলগ্ন বা প্রথম নক্ষত্রগুলোর গঠন সম্পর্কে স্পষ্ট ধারণা পাচ্ছি।"},{"id":"q0065","page":12,"printed_page":434,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"০২","question":"কোনটি মাইক্রোওয়েভ ওভেনের কার্যনীতিতে সর্বাধিকভাবে বর্ণনা করতে পারে?","exam_ref":"৫০তম বিসিএস","options":{"ক":"উচ্চ তাপ বিকিরণ এবং খাদ্য কণাগুলিতে পরিবহন","খ":"খাদ্য কণাগুলিতে ইনফ্রা-রেড বিকিরণ এবং শোষণ","গ":"পানির অণুগুলির ইন্ডাকশন হিটিং","ঘ":"ঘূর্ণনের কারণে ডাই-ইলেকট্রিক হিটিং"},"answer":"ঘ","answer_text":"ঘূর্ণনের কারণে ডাই-ইলেকট্রিক হিটিং","explanation":"মাইক্রোওয়েভ ওভেন মূলত ইলেকট্রোম্যাগনেটিক তরঙ্গ ব্যবহার করে খাবার গরম করে। খাবারের মধ্যে থাকা পানির অণুগুলো হচ্ছে পোলার অর্থাৎ এদের এক প্রান্তে ধনাত্মক অন্য প্রান্তে ঋণাত্মক চার্জ থাকে। ওভেনের ভেতরে যখন এই দ্রুত পরিবর্তনশীল বৈদ্যুতিক ক্ষেত্রের সাথে তাল মেলাতে গিয়ে পানির অণুগুলো প্রতি সেকেন্ডে কোটি কোটি বার দিক পরিবর্তন করে বা ঘুরতে থাকে। অণুগুলোর এই অতি দ্রুত ঘূর্ণন এবং একে অপরের সাথে ঘর্ষণের ফলে প্রচুর তাপ শক্তি উৎপন্ন হয়, যা খাবারকে ভেতর থেকে দ্রুত গরম করে তোলে। বিজ্ঞানের ভাষায় এই প্রক্রিয়াকেই ডাই-ইলেকট্রিক হিটিং বলা হয়।"},{"id":"q0066","page":12,"printed_page":434,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"০৩","question":"ইথার সম্বন্ধে কোনটি মিথ্যা?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"এটি একটি রাসায়নিক তরল পদার্থ","খ":"এটি একটি কাল্পনিক মাধ্যম যা মহাবিশ্বে সর্বত্র বিরাজমান ছিল","গ":"এ মাধ্যম ছাড়া তাড়িৎ চৌম্বক তরঙ্গ সঞ্চালন সম্ভব নয়","ঘ":"এ কাল্পনিক মাধ্যমটির স্থিতিস্থাপক ধর্ম ছিল"},"answer":"","answer_text":"Blank (উৎসে সুনির্দিষ্ট অপশন চিহ্নিত করা হয়নি)","explanation":"আলোর তাড়িৎচৌম্বক তত্ত্ব আসার আগ পর্যন্ত মনে করা হতো কোনো তরঙ্গই মাধ্যম ছাড়া চলতে পারে না, তখন আলোকে তরঙ্গ চলাচলের জন্য 'ইথার' কে মাধ্যম হিসেবে বিবেচনা করা হতো। এই তত্ত্ব অনুযায়ী ইথার মাধ্যম ছিল স্থিতিস্থাপক, ওজনহীন, স্বচ্ছ এক আদর্শ মাধ্যম। পরবর্তীতে মাইকেলসন-মর্লি পরীক্ষার মাধ্যমে প্রমান করেন যে, বাস্তবে ইথার নামক কোনো পদার্থের অস্তিত্ব নেই এবং মাধ্যম ছাড়াও তাড়িৎচৌম্বক তরঙ্গ চলাচল করতে পারে। অন্যদিকে, ইথার হলো এক শ্রেণির জৈব যৌগ যেখানে একটি অক্সিজেন পরমাণু দুটি আলকাইল বা অ্যারাইল গ্রুপের সাথে যুক্ত থাকে, এবং এদের সাধারণ সংকেত R-O-R'। ইথার সাধারণত তরল পদার্থ হওয়ায় জৈব দ্রাবক হিসেবে ব্যবহৃত হয় এবং এটি চর্বি, তেল, মোম, এবং রেজিনের মতো উপাদান দ্রবীভূত করতে পারে। এছাড়াও সুগন্ধী, চেতনানাশক এবং ঔষধ হিসেবেও এর ব্যবহার রয়েছে।","source_note":"উৎসে উত্তর 'Blank' হিসেবে দেওয়া আছে। অবিকল সংরক্ষিত।"},{"id":"q0067","page":12,"printed_page":434,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"০৪","question":"তরঙ্গের বেলায় কোনটি সত্য?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"তড়িৎ চৌম্বকতরঙ্গ আলোর বেগে গমন করে","খ":"শব্দতরঙ্গ একধরনের তড়িৎ চৌম্বকতরঙ্গ","গ":"সকল তরঙ্গেই প্রতিফলন-প্রতিসরণ হয় না","ঘ":"তরঙ্গবেগ হলো এর কম্পাঙ্ক ও তরঙ্গ দৈর্ঘ্যের অনুপাত"},"answer":"ক","answer_text":"তড়িৎ চৌম্বকতরঙ্গ আলোর বেগে গমন করে","explanation":"আলো একটি তড়িৎচৌম্বক তরঙ্গ এবং শূন্যস্থানে সব তড়িৎচৌম্বক তরঙ্গ আলোর বেগে চলে যার মান 3×10⁸ মিটার/সেকেন্ড। শব্দ হলো যান্ত্রিক তরঙ্গ, যা জড় ও স্থিতিস্থাপক মাধ্যমে কণার কম্পনের দ্বারা ছড়িয়ে পড়ে। প্রতিফলন, প্রতিসরণ, ব্যতিচার প্রভৃতি তরঙ্গের একটি সাধারণ ধর্ম। প্রকৃতপক্ষে তরঙ্গবেগ, কম্পাঙ্ক ও তরঙ্গদৈর্ঘ্যের মধ্যে সম্পর্ক হল, তরঙ্গবেগ = কম্পাঙ্ক × তরঙ্গদৈর্ঘ্য, অর্থাৎ v = f×λ। সব মিলিয়ে একমাত্র সঠিক উত্তর হলো- (ক) তড়িৎচৌম্বক তরঙ্গ আলোর বেগে গমন করে।"},{"id":"q0068","page":12,"printed_page":434,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"০৫","question":"জেমস ওয়েব টেলিস্কোপ কোন ধরনের রেডিয়েশন ব্যবহার করে?","exam_ref":"৪৬তম বিসিএস","options":{"ক":"Ultra-violet","খ":"Infrared","গ":"Visible","ঘ":"X-ray"},"answer":"খ","answer_text":"Infrared","explanation":""},{"id":"q0069","page":13,"printed_page":435,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"০৬","question":"টেলিভিশনে যে তরঙ্গ ব্যবহৃত হয়-","exam_ref":"৪৫তম বিসিএস","options":{"ক":"রেডিও ওয়েভ","খ":"অবলোহিত রশ্মি","গ":"আল্ট্রা ভায়োলেট","ঘ":"দৃশ্যমান রশ্মি"},"answer":"ক","answer_text":"রেডিও ওয়েভ","explanation":"টেলিভিশনে মূলত মাইক্রোওয়েভ তরঙ্গ ব্যবহৃত হয় যার তরঙ্গ দৈর্ঘ্যের পাল্লা 1nm-1m, তবে অপশনে মাইক্রোওয়েভ না থাকায় উত্তর হবে রেডিও ওয়েভ এ বেতার তরঙ্গ। রেডিও ওয়েভের মাধ্যমেও টেলিভিশন তরঙ্গ প্রচার করা হয়। এক্ষেত্রে শব্দ ফ্রিকুয়েন্সি মডুলেশন এবং ছবি এমপ্লিচিউড মডুলেশনের মাধ্যমে রেডিও ওয়েভে প্রেরণ করা হয়।"},{"id":"q0070","page":13,"printed_page":435,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"০৭","question":"আলোকবর্ষ ব্যবহার করে কী পরিমাণ পরিমাপ করা হয়?","exam_ref":"৪১তম বিসিএস","options":{"ক":"দূরত্ব","খ":"সময়","গ":"ভর","ঘ":"ওজন"},"answer":"ক","answer_text":"দূরত্ব","explanation":"আলোকবর্ষ হল সেই পরিমাণ দূরত্ব যা আলো এক বছরে অতিক্রম করে। আমরা জানি, আলোর বেগ প্রতি সেকেন্ডে 3×10⁸ মিটার। ১ আলোকবর্ষ সমান 9.46×10¹⁵ মিটার বা 9.46×10¹² কি.মি.।"},{"id":"q0071","page":13,"printed_page":435,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"০৮","question":"রঙিন টেলিভিশন থেকে ক্ষতিকর রশ্মি বের হয়-","exam_ref":"৩০তম, ২৪তম, ২২তম বিসিএস","options":{"ক":"গামা রশ্মি","খ":"বিটা রশ্মি","গ":"কসমিক রশ্মি","ঘ":"রঞ্জন রশ্মি"},"answer":"ঘ","answer_text":"রঞ্জন রশ্মি","explanation":"দ্রুতগামী ইলেকট্রন ধাতুতে আঘাত করলে রঞ্জন রশ্মি (X-ray) উৎপন্ন হয়। কসমিক রশ্মি মহাশূন্য হতে আসে। বিটা রশ্মি ও গামা রশ্মি তেজস্ক্রিয় বিকিরণে পাওয়া যায়। ক্যাথোড রে টিউব থাকার কারণে রঙিন টেলিভিশন থেকে মৃদু রঞ্জন রশ্মি নির্গত হয়। আধুনিক LED ও LCD রঙিন টেলিভিশন থেকে রঞ্জন রশ্মি (X-ray) বের হয় না।"},{"id":"q0072","page":13,"printed_page":435,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"০৯","question":"জীবজগতের জন্যে সবচেয়ে ক্ষতিকারক রশ্মি কোনটি?","exam_ref":"২৮তম বিসিএস","options":{"ক":"আল্ট্রা-ভায়োলেট রশ্মি","খ":"বিটা রশ্মি","গ":"আলফা রশ্মি","ঘ":"গামা রশ্মি"},"answer":"ঘ","answer_text":"গামা রশ্মি","explanation":"আল্ট্রা-ভায়োলেট রশ্মি, বিটা রশ্মি, আলফা রশ্মি, গামা রশ্মি জীবদেহের জন্য ক্ষতিকর। এদের মধ্যে আল্ট্রা-ভায়োলেট রশ্মি ও গামা রশ্মি তুলনামূলকভাবে অধিক ক্ষতিকর কিন্তু সবচেয়ে ক্ষতিকারক হচ্ছে গামা রশ্মি, কারণ গামা রশ্মির তরঙ্গদৈর্ঘ্য অন্য সব রশ্মির তরঙ্গদৈর্ঘ্যের তুলনায় অনেক ক্ষুদ্র। আমরা জানি, তরঙ্গের শক্তি, E=hc/λ, অর্থাৎ যে রশ্মির তরঙ্গদৈর্ঘ্য যত কম তার শক্তি তত বেশি। তাই গামা রশ্মির ভেদন ক্ষমতা অত্যন্ত বেশি। এ রশ্মি মানবদেহে ক্যান্সারসহ বিভিন্ন জটিল রোগের সৃষ্টি করে।"},{"id":"q0073","page":13,"printed_page":435,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"১০","question":"সর্বাপেক্ষা ছোট তরঙ্গ দৈর্ঘ্যের বিকিরণ হচ্ছে-","exam_ref":"২৭তম বিসিএস","options":{"ক":"আলফা রশ্মি","খ":"বিটা রশ্মি","গ":"গামা রশ্মি","ঘ":"রঞ্জন রশ্মি"},"answer":"গ","answer_text":"গামা রশ্মি","explanation":"তরঙ্গের মধ্যে সমদশায় কম্পনশীল দুটি কণিকার ন্যূনতম দূরত্ব হলো তরঙ্গদৈর্ঘ্য। তেজস্ক্রিয় পদার্থ থেকে উচ্চতেজন ক্ষমতাসম্পন্ন আলফা, বিটা ও গামা রশ্মি বিকিরিত হয়। এদের মধ্যে আলফা ও বিটা রশ্মি হচ্ছে মূলত যথাক্রমে ধনাত্মক ও ঋণাত্মক চার্জযুক্ত কণা, কোনো তরঙ্গ নয়; ফলে এদের কোনো তরঙ্গ দৈর্ঘ্য নেই। গামা ও রঞ্জন রশ্মি হলো তড়িৎ চুম্বকীয় তরঙ্গ যেখানে গামা রশ্মির তরঙ্গ দৈর্ঘ্য 0.01 nm এর কম এবং রঞ্জন রশ্মির তরঙ্গ দৈর্ঘ্য 10 nm - 0.01 nm এর মধ্যে। তাই এখানে সবচেয়ে ছোট তরঙ্গ দৈর্ঘ্যের বিকিরণ হচ্ছে গামা রশ্মি।"},{"id":"q0074","page":13,"printed_page":435,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"১১","question":"রাডারের যে তড়িৎ চৌম্বক ব্যবহার করা হয় তার নাম কি?","exam_ref":"২০তম বিসিএস","options":{"ক":"গামা রশ্মি","খ":"মাইক্রোওয়েভ","গ":"অবলোহিত বিকিরণ","ঘ":"আলোক তরঙ্গ"},"answer":"খ","answer_text":"মাইক্রোওয়েভ","explanation":"রাডারের মূলনীতি হলো ক্ষুদ্র তরঙ্গ দৈর্ঘ্যের পালস ছড়িয়ে দেয়া হয় যেন তা বস্তু থেকে প্রতিফলিত হয়ে রাডারের গ্রাহক যন্ত্রে আসে। এ জন্য গামা রশ্মি বা মাইক্রোওয়েভ উভয়ের তরঙ্গ দৈর্ঘ্য ক্ষুদ্র হলেও কম ভেদন ক্ষমতাসম্পন্ন মাইক্রোওয়েভই ব্যবহার করা হয়। অপরপক্ষে অবলোহিত বিকিরণ ও আলোক তরঙ্গের তরঙ্গদৈর্ঘ্য বেশ বড়।"},{"id":"q0075","page":13,"printed_page":435,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.১","topic_title":"তাড়িতচৌম্বক বর্ণালি","number":"১২","question":"সূর্য থেকে পৃথিবীতে আলো আসতে কতক্ষণ সময় লাগে?","exam_ref":"১৮তম বিসিএস","options":{"ক":"৮.৩২ মিনিট","খ":"৯.১২ মিনিট","গ":"৭.৯৬ মিনিট","ঘ":"১০.৫৬ মিনিট"},"answer":"ক","answer_text":"৮.৩২ মিনিট","explanation":"সূর্য থেকে পৃথিবীর দূরত্ব ৯ কোটি ৩০ লক্ষ মাইল। আলোর গতি প্রতি সেকেন্ডে ১ লক্ষ ৮৬ হাজার মাইল। সূর্য থেকে পৃথিবীতে আলো আসতে সময় লাগে ৫০০ সেকেন্ড বা ৮ মিনিট ২০ সেকেন্ড বা ৮.৩২ মিনিট।"},{"id":"q0076","page":13,"printed_page":435,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.২","topic_title":"দৃশ্যমান আলো ও লেজার রশ্মি","number":"০১","question":"ফোটন শক্তি 'E' এর সমীকরণটি হল-","exam_ref":"৪৬তম বিসিএস","options":{"ক":"hλ/c","খ":"hc/λ","গ":"cλ/h","ঘ":"chλ"},"answer":"খ","answer_text":"hc/λ","explanation":"১৯০০ সালে ম্যাক্স প্লাঙ্ক সর্বপ্রথম আলোর কোয়ান্টাম-তত্ত্ব প্রদান করেন। এই তত্ত্ব অনুসারে আলোকশক্তি কোনো উৎস থেকে অবিচ্ছিন্ন তরঙ্গের আকারে না বেরিয়ে অসংখ্য ক্ষুদ্র শক্তিগুচ্ছ বা প্যাকেট আকারে বের হয়। প্রত্যেক রঙের আলোর জন্য এই প্যাকেটের শক্তির একটা সর্বনিম্ন মান আছে। এ সর্বনিম্ন মানের শক্তিসম্পন্ন কণিকাকে কোয়ান্টাম (Quantum) বা ফোটন (Photon) বলে। E = ফোটনের শক্তি, f = আলোর কম্পাঙ্ক, λ = তরঙ্গদৈর্ঘ্য হলে, E = hf = hc/λ [∵ f=c/λ এবং h = প্ল্যাঙ্কের ধ্রুবক]।"},{"id":"q0077","page":14,"printed_page":436,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.২","topic_title":"দৃশ্যমান আলো ও লেজার রশ্মি","number":"০২","question":"কোনটি আলোর প্রাথমিক রং হিসাবে বিবেচনা করা হয় না?","exam_ref":"৪৬তম বিসিএস","options":{"ক":"সবুজ","খ":"নীল","গ":"লাল","ঘ":"হলুদ"},"answer":"ঘ","answer_text":"হলুদ","explanation":"মৌলিক বর্ণ সাতটি মূল বর্ণের সমষ্টিতে বর্ণালি গঠিত হয়। তবে এই সাতটি রঙের মধ্যে তিনটি রং আছে যাদেরকে পরিমাণ মতো মিশিয়ে অপর যেকোনো রং তৈরি করা যেতে পারে। এদেরকে মৌলিক বর্ণ বা প্রাথমিক রং বলে। এই তিনটি রং হচ্ছে- আসমানি (নীল), সবুজ ও লাল। মৌলিক বর্ণগুলো মিশিয়ে বিভিন্ন বর্ণ তৈরি করা যায় (যেমন লাল+সবুজ=হলুদ, লাল+আসমানি=বেগুনি জাতীয় রং, সবুজ+আসমানি=আকাশি জাতীয় রং, তিনটি একত্রে=সাদা)। আমাদের চারপাশে প্রতিনিয়ত যে অসংখ্য রঙের বস্তু দেখতে পাই, সেই রঙগুলোর প্রতিটিই তিনটি মূল বা মৌলিক রঙ দ্বারা সৃষ্ট। এ রঙ তিনটি হচ্ছে: লাল, সবুজ ও নীল এবং এ তিনটি রঙকে বিভিন্ন অনুপাতে মিশিয়ে আমাদের চারপাশে দৃশ্যমান সকল রঙই তৈরি করা সম্ভব। এজন্যই টেলিভিশনে বিভিন্ন রঙের রঙিন ছবি উৎপাদনের জন্য এই তিনটি মৌলিক রঙ ব্যবহার করা হয়।"},{"id":"q0078","page":14,"printed_page":436,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.২","topic_title":"দৃশ্যমান আলো ও লেজার রশ্মি","number":"০৩","question":"কোন রং বেশি দূর থেকে দেখা যায়?","exam_ref":"৩৬তম বিসিএস","options":{"ক":"সাদা","খ":"কালো","গ":"হলুদ","ঘ":"লাল"},"answer":"ঘ","answer_text":"লাল","explanation":"লাল রঙের তরঙ্গ দৈর্ঘ্য সবচেয়ে বড় (প্রায় 700 nm এর কাছাকাছি) এবং বিক্ষেপণ সবচেয়ে কম। তাই লাল রং বেশি দূর থেকে দেখা যায়। অন্যদিকে সাদা ও কালো কোনো রং নয়। সবগুলো রং যেখান থেকে প্রতিফলিত হয় তাকে সাদা দেখা যায় এবং যেখানে সবগুলো রং শোষিত হয় তাকে কালো দেখা যায়। হলুদ রঙের তরঙ্গ দৈর্ঘ্য লাল ও কমলা রঙের তরঙ্গ দৈর্ঘ্য থেকে ছোট।"},{"id":"q0079","page":14,"printed_page":436,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.২","topic_title":"দৃশ্যমান আলো ও লেজার রশ্মি","number":"০৪","question":"কোন আলোক তরঙ্গ (Light spectrum) মানব চোখে দেখতে পাওয়া যায়?","exam_ref":"৩১তম বিসিএস","options":{"ক":"১০ থেকে ৪০০ ন্যা.মি. (nm)","খ":"৪০০ থেকে ৭০০ ন্যা.মি. (nm)","গ":"১০০ মাইক্রোমিটার (μm) থেকে ১ মি (m)","ঘ":"১ মি (m)-এর ঊর্ধ্বে"},"answer":"খ","answer_text":"৪০০ থেকে ৭০০ ন্যা.মি. (nm)","explanation":"দৃশ্যমান আলোর তরঙ্গদৈর্ঘ্য হচ্ছে ৩৮০ ন্যানোমিটার থেকে ৭৮০ ন্যানোমিটার পর্যন্ত। দৃশ্যমান আলোর মধ্যে লাল আলোর তরঙ্গদৈর্ঘ্য সবচেয়ে বেশি এবং বেগুনি আলোর তরঙ্গদৈর্ঘ্য সবচেয়ে কম। অপশন অনুযায়ী সঠিক উত্তর হবে (খ)।"},{"id":"q0080","page":14,"printed_page":436,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.২","topic_title":"দৃশ্যমান আলো ও লেজার রশ্মি","number":"০৫","question":"টেলিভিশনে রঙিন ছবি উৎপাদনের জন্য ক'টি মৌলিক রং-এর ছবি ব্যবহার করা হয়?","exam_ref":"২৮তম বিসিএস","options":{"ক":"১টি","খ":"২টি","গ":"৩টি","ঘ":"৪টি"},"answer":"গ","answer_text":"৩টি","explanation":"তিনটি মৌলিক রং হচ্ছে লাল, নীল (আসমানি) ও সবুজ। এই রংগুলোর সমন্বয়ে গঠিত হয় অন্যান্য রং।"},{"id":"q0081","page":14,"printed_page":436,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.২","topic_title":"দৃশ্যমান আলো ও লেজার রশ্মি","number":"০৬","question":"লেজার রশ্মি কে কত সালে আবিষ্কার করেন?","exam_ref":"২৪তম বিসিএস (বাতিল)","options":{"ক":"বোর, ১৯৬৩","খ":"রাদারফোর্ড, ১৯১৯","গ":"হাইগ্যান, ১৯৬১","ঘ":"মাইম্যান, ১৯৬০"},"answer":"ঘ","answer_text":"মাইম্যান, ১৯৬০","explanation":"লেজার LASER শব্দটির পূর্ণরূপ হলো- Light Amplification by Stimulated Emission of Radiation। বিজ্ঞানী মাইম্যান ১৯৬০ সালে লেজার রশ্মি আবিষ্কার করেন। এ রশ্মি অত্যাধিক লক্ষ্যভেদী, সুসংগত, একক রঙের এবং অনেক দূরত্ব অতিক্রম করার পরও এই রশ্মির দিক বিচ্যুতি ঘটে না। লেজারের ব্যবহার: চিকিৎসাক্ষেত্রে সূক্ষ্ম অস্ত্রোপচারে লেজার রশ্মি ব্যবহৃত হয় (চক্ষু, দন্ত ও চর্মরোগ চিকিৎসায়); পানি দ্বারা লেজার রশ্মি শোষিত হয় না তাই পানির নিচে যোগাযোগের জন্য ব্যবহৃত হয়; দূরবর্তী যোগাযোগের ক্ষেত্রে ব্যবহৃত হয়; উচ্চশক্তির লেজার রশ্মি দিয়ে ধাতুর উপর নকশা কাটা যায়; লেজার গাইডেড মিসাইল যুদ্ধক্ষেত্রে ব্যবহৃত হয়।"},{"id":"q0082","page":14,"printed_page":436,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.২","topic_title":"দৃশ্যমান আলো ও লেজার রশ্মি","number":"০৭","question":"দৃশ্যমান বর্ণালির ক্ষুদ্রতম তরঙ্গদৈর্ঘ্য কোন রঙের আলোর?","exam_ref":"১৪তম বিসিএস","options":{"ক":"লাল","খ":"সবুজ","গ":"নীল","ঘ":"বেগুনি"},"answer":"ঘ","answer_text":"বেগুনি","explanation":"দৃশ্যমান বর্ণালির তরঙ্গদৈর্ঘ্য (nm): বেগুনি ৩৮০-৪২৪, নীল ৪২৪-৪৫০, আসমানি ৪৫০-৫০০, সবুজ ৫০০-৫৭৫, হলুদ ৫৭৫-৫৯০, কমলা ৫৯০-৬৪৭, লাল ৬৪৭-৭৮০। সবচেয়ে ছোট তরঙ্গদৈর্ঘ্য বেগুনি রঙের।"},{"id":"q0083","page":14,"printed_page":436,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.২","topic_title":"দৃশ্যমান আলো ও লেজার রশ্মি","number":"০৮","question":"যে তিনটি মুখ্য বর্ণের সমন্বয়ে অন্যান্য বর্ণ সৃষ্টি করা যায় সেগুলো হলো-","exam_ref":"১০তম বিসিএস","options":{"ক":"লাল, হলুদ, নীল","খ":"লাল, কমলা, বেগুনি","গ":"হলুদ, সবুজ, নীল","ঘ":"লাল, নীল, সবুজ"},"answer":"ঘ","answer_text":"লাল, নীল, সবুজ","explanation":"তিনটি মৌলিক রং হচ্ছে লাল, নীল (আসমানি) ও সবুজ। এই রংগুলোর সমন্বয়ে গঠিত হয় অন্যান্য রং।"},{"id":"q0084","page":15,"printed_page":437,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.৩","topic_title":"আলোকীয় ঘটনাবলি","number":"০১","question":"আকাশে রংধনু সৃষ্টির কারণ-","exam_ref":"৩৭তম বিসিএস","options":{"ক":"ধূলিকণা","খ":"বায়ুস্তর","গ":"বৃষ্টির কণা","ঘ":"অতিবেগুনি রশ্মি"},"answer":"গ","answer_text":"বৃষ্টির কণা","explanation":"আকাশে রংধনু সৃষ্টির প্রধান কারণ হলো বৃষ্টির কণা। বৃষ্টির কণা এখানে প্রিজমের ন্যায় কাজ করে। বৃষ্টি কণায় যখন আলোকরশ্মি পতিত হয় তখন বৃষ্টির কণা ঐ আলোকরশ্মিকে ৭টি রঙের পট্টিতে বিভক্ত করে, যাকে আমরা রংধনু বা রামধনু বলি।"},{"id":"q0085","page":15,"printed_page":437,"chapter":"অধ্যায় ০৪","chapter_title":"আলো","topic_code":"৪.৩ মণ্ডল নাই তাই","ঘ":"চাঁদের মাধ্যাকর্ষণজনিত ত্বরণ পৃথিবীর মাধ্যাকর্ষণজনিত ত্বরণ অপেক্ষা কম তাই"},"answer":"গ","answer_text":"চাঁদে বায়ুমণ্ডল নাই তাই","explanation":"শব্দ সঞ্চালনার জন্য মাধ্যম প্রয়োজন। পৃথিবীতে বায়ুস্তর শব্দ সঞ্চালনের মাধ্যম হিসেবে কাজ করে। চাঁদে বায়ুস্তর নেই, যার ফলে পাশাপাশি অবস্থিত দুজন লোক যত জোরেই কথা বলুক না কেন চাঁদে তা শুনতে পাবে না।"},{"id":"q0103","page":17,"printed_page":439,"chapter":"অধ্যায় ০৫","chapter_title":"তরঙ্গ ও শব্দ","topic_code":"৫.১","topic_title":"শব্দের বেগ","number":"০৫","question":"সমটান সম্পন্ন একটি টানা তারের দৈর্ঘ্য দ্বিগুণ করলে কম্পনাঙ্কের কতটা পরিবর্তন ঘটবে?","exam_ref":"১৩তম বিসিএস","options":{"ক":"অর্ধেক হবে","খ":"দ্বিগুণ হবে","গ":"তিনগুণ হবে","ঘ":"চারগুণ হবে"},"answer":"ক","answer_text":"অর্ধেক হবে","explanation":"টানা তারের আড় কম্পনের সূত্র, f = (1/2l)√(T/m), অর্থাৎ তারের টান অপরিবর্তিত থাকলে তার কম্পাঙ্ক দৈর্ঘ্যের সাথে ব্যস্তানুপাতে পরিবর্তিত হয়। তাই সমটান সম্পন্ন একটি টানা তারের দৈর্ঘ্য দ্বিগুণ করলে তার কম্পাঙ্ক অর্ধেক হবে।"},{"id":"q0104","page":17,"printed_page":439,"chapter":"অধ্যায় ০৫","chapter_title":"তরঙ্গ ও শব্দ","topic_code":"৫.১","topic_title":"শব্দের বেগ","number":"০৬","question":"একটি বন্দুকের গুলি প্রতি সেকেন্ডে ১৫৪০ ফুট গতিবেগে লক্ষ্যভেদ করে। এক ব্যক্তি বন্দুক ছুঁড়বার ৩ সেকেন্ড পরে লক্ষ্যভেদের শব্দ শুনতে পায়। শব্দের গতি প্রতি সেকেন্ড ১১০০ ফুট। লক্ষ্য বস্তুর দূরত্ব কত?","exam_ref":"১১তম বিসিএস","options":{"ক":"২০২৫ ফুট","খ":"১৯২৫ ফুট","গ":"১৯৭৫ ফুট","ঘ":"১৮৭৫ ফুট"},"answer":"খ","answer_text":"১৯২৫ ফুট","explanation":"ধরি, দূরত্ব ক ফুট। ∴ গুলি লক্ষ্যভেদ করতে সময় লাগে ক/১৫৪০ সেকেন্ড এবং শব্দ কানে আসতে সময় লাগে ক/১১০০ সেকেন্ড। প্রশ্নমতে, ক/১৫৪০ + ক/১১০০ = ৩ বা, ক/২২০×(২/৭+২/৫) = ৩ বা, ক = ৩×২২০×৩৫/১২ = ১৯২৫ ফুট।"},{"id":"q0105","page":18,"printed_page":440,"chapter":"অধ্যায় ০৫","chapter_title":"তরঙ্গ ও শব্দ","topic_code":"৫.২","topic_title":"শব্দের প্রতিধ্বনি, শোষণ ও তীব্রতা","number":"০১","question":"আল্ট্রাসনোগ্রাফিতে ব্যবহৃত শব্দের কম্পাঙ্ক কত?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"০.০ না"},"answer":"ঘ","answer_text":"মাটির সঙ্গে সংযোগ হয় না","explanation":"বর্তনী সম্পূর্ণ করতে ধনাত্মক ও ঋণাত্মক চার্জের সংযোগের প্রয়োজন হয়। কিন্তু বিদ্যুৎবাহী তারে পাখি বসলে বর্তনী পূর্ণ হয় না বলে পাখি বিদ্যুতায়িত হয়ে মারা যায় না। কিন্তু পাখিটি যদি অন্য তার স্পর্শ করে কিংবা ভূ-সংযুক্ত কোনো পরিবাহীর সংস্পর্শে আসে, তাহলে বর্তনী পূর্ণ হবে এবং এর ভেতর দিয়ে বিদ্যুৎ প্রবাহিত হওয়ার ফলে পাখিটি মারা যাবে।"},{"id":"q0120","page":20,"printed_page":442,"chapter":"অধ্যায় ০৬","chapter_title":"স্থির ও চল তড়িৎ","topic_code":"৬.২","topic_title":"তড়িৎ প্রবাহ ও পরিবাহী","number":"০৭","question":"বাংলাদেশে তড়িৎ-এর কম্পাঙ্ক (frequency) প্রতি সেকেন্ডে ৫০ সাইকেল -এর তাৎপর্য কি?","exam_ref":"১৫তম বিসিএস","options":{"ক":"প্রতি সেকেন্ডে বিদ্যুৎ প্রবাহ ৫০ বার বন্ধ হয়","খ":"প্রতি সেকেন্ডে বিদ্যুৎ প্রবাহ ৫০ একক দৈর্ঘ্য অতিক্রম করে","গ":"প্রতি সেকেন্ডে বিদ্যুৎ প্রবাহ ৫০ বার দিক বদলায়","ঘ":"প্রতি সেকেন্ডে বিদ্যুৎ প্রবাহ ৫০ বার উঠানামা করে"},"answer":"গ","answer_text":"প্রতি সেকেন্ডে বিদ্যুৎ প্রবাহ ৫০ বার দিক বদলায়","explanation":""},{"id":"q0121","page":20,"printed_page":442,"chapter":"অধ্যায় ০৬","chapter_title":"স্থির ও চল তড়িৎ","topic_code":"৬.৩","topic_title":"তড়িৎ কোষের অভ্যন্তরীণ রোধ","number":"০১","question":"আদর্শ ভোল্টেজ উৎসের অভ্যন্তরীণ রোধ কত?","exam_ref":"৪৪তম বিসিএস","options":{"ক":"অসীম","খ":"শূন্য","গ":"অতি ক্ষুদ্র","ঘ":"অনেক বড়"},"answer":"খ","answer_text":"শূন্য","explanation":"একটি আদর্শ ভোল্টেজ (বিভব) উৎসে অভ্যন্তরীণ রোধ (r) কোষের সাথে শ্রেণি সমবায়ে যুক্ত থাকে (চিত্র: R, I, r ও Vs সংবলিত সাধারণ বর্তনী)। শ্রেণি সমবায়ের ক্ষেত্রে তুল্যরোধ, Rs = R + r = বহিঃবর্তনীর রোধ (R) + অভ্যন্তরীণ রোধ (r)। যেহেতু ওহমের সূত্র অনুযায়ী, বিদ্যুৎ প্রবাহ I = V/Rs (তুল্য রোধ), তাই বর্তনীর তুল্য রোধ যত কম হবে বর্তনীতে ততো বেশি তড়িৎ প্রবাহিত হবে অর্থাৎ বর্তনীটি ততো বেশি কার্যকর হবে। এজন্য আদর্শ ভোল্টেজ উৎসে সর্বোচ্চ তড়িৎ প্রবাহ পাওয়ার জন্য এর অভ্যন্তরীণ রোধ (r) শূন্য ধরা হয়।"},{"id":"q0122","page":21,"printed_page":443,"chapter":"অধ্যায় ০৬","chapter_title":"স্থির ও চল তড়িৎ","topic_code":"৬.৩","topic_title":"তড়িৎ কোষের অভ্যন্তরীণ রোধ","number":"০২","question":"একটি আদর্শ তড়িৎ উৎসের অভ্যন্তরীণ রোধ কত?","exam_ref":"৪৩তম বিসিএস","options":{"ক":"শূন্য","খ":"অসীম","গ":"অতিক্ষুদ্র","ঘ":"যে কোনো মান"},"answer":"খ","answer_text":"অসীম","explanation":"আদর্শ তড়িৎ উৎসে (Ideal Current Source) অভ্যন্তরীণ রোধ (r) কোষের সাথে সমান্তরালে যুক্ত থাকে (চিত্র: R, I, r ও Cs সংবলিত বর্তনী)। সমান্তরাল সমবায়ের তুল্য রোধ, ১/Rp = ১/R + ১/r এবং ওহমের সূত্রানুযায়ী তড়িৎ প্রবাহ, I = V/Rp (তুল্য রোধ)। তাই, একটি আদর্শ তড়িৎ উৎস ১/r = 0 হতে হলে, r = ∞ (অসীম) হতে হয়।"},{"id":"q0123","page":21,"printed_page":443,"chapter":"অধ্যায় ০৬","chapter_title":"স্থির ও চল তড়িৎ","topic_code":"৬.৪","topic_title":"বৈদ্যুতিক শক্তির ব্যয় ও ক্ষমতার হিসাব","number":"০১","question":"১০০ ওয়াট-এর একটি বৈদ্যুতিক বাল্ব ১ ঘণ্টা চললে কত শক্তি ব্যয় হয়?","exam_ref":"৪১তম বিসিএস","options":{"ক":"১০০ জুল","খ":"৬০ জুল","গ":"৬০০০ জুল","ঘ":"৩৬০০০০ জুল"},"answer":"ঘ","answer_text":"৩৬০০০০ জুল","explanation":"শক্তি = ক্ষমতা × সময়, W=Pt। এখানে, ক্ষমতা, P=100w, সময়, t=1h=3600s। W = 100×3600 = 360000 J।"},{"id":"q0124","page":21,"printed_page":443,"chapter":"অধ্যায় ০৬","chapter_title":"স্থির ও চল তড়িৎ","topic_code":"৬.৪","topic_title":"বৈদ্যুতিক শক্তির ব্যয় ও ক্ষমতার হিসাব","number":"০২","question":"একটি বাল্বে '৬০ W - ২২০ V' লেখা আছে। বাল্বটির রোধ কত ওহম (Ohm)?","exam_ref":"৪০তম বিসিএস","options":{"ক":"১৬.৩৬","খ":"১৬০","গ":"২৮০","ঘ":"৮০৬.৬৭"},"answer":"ঘ","answer_text":"৮০৬.৬৭","explanation":"আমরা জানি, P = V²/R ⇒ R = V²/P। এখানে, বিভব পার্থক্য, V=220V, ক্ষমতা, P=60W। R = (220×220)/60 = 806.67Ω।"},{"id":"q0125","page":21,"printed_page":443,"chapter":"অধ্যায় ০৬","chapter_title":"স্থির ও চল তড়িৎ","topic_code":"৬.৪","topic_title":"বৈদ্যুতিক শক্তির ব্যয় ও ক্ষমতার হিসাব","number":"০৩","question":"বৈদ্যুতিক মিটারে এক ইউনিটি বিদ্যুৎ খরচ বলতে বুঝায়-","exam_ref":"৩২তম বিসিএস","options":{"ক":"এক কিলোওয়াট-ঘণ্টা","খ":"এক ওয়াট-ঘণ্টা","গ":"এক কিলোওয়াট","ঘ":"এক ওয়াট"},"answer":"ক","answer_text":"এক কিলোওয়াট-ঘণ্টা","explanation":"প্রতি সেকেন্ডে এক কিলোওয়াট হারে এক ঘণ্টায় যে পরিমাণ তড়িৎ শক্তি অন্য শক্তিতে রূপান্তরিত হয় বা ব্যয় হয়, তাকে এক কিলোওয়াট ঘণ্টা বলা হয়। তড়িৎ সরবরাহকারী প্রতিষ্ঠান বিদ্যুৎ বিলের হিসাব করে কিলোওয়াট ঘণ্টা এককে। বাণিজ্যিকভাবে একে 'বোর্ড অব ট্রেড ইউনিট' (B.O.T Unit) বা সংক্ষেপে শুধু 'ইউনিট' বলা হয়ে থাকে।"},{"id":"q0126","page":21,"printed_page":443,"chapter":"অধ্যায় ০৬","chapter_title":"স্থির ও চল তড়িৎ","topic_code":"৬.৪","topic_title":"বৈদ্যুতিক শক্তির ব্যয় ও ক্ষমতার হিসাব","number":"০৪","question":"বৈদ্যুতিক পাখা ধীরে ধীরে ঘুরলে বিদ্যুৎ খরচ-","exam_ref":"৩০তম, ২৩তম, ১১তম বিসিএস","options":{"ক":"কম হয়","খ":"খুব কম হয়","গ":"একই হয়","ঘ":"বেশি হয়"},"answer":"গ","answer_text":"একই হয়","explanation":"রেগুলেটরের মাধ্যমে বৈদ্যুতিক পাখায় বিদ্যুৎ সরবরাহ নিয়ন্ত্রণ করা হয়। যখন বৈদ্যুতিক পাখা ধীরে ঘুরানোর জন্য বিদ্যুৎ প্রবাহ কমানো হয় তখন অতিরিক্ত বিদ্যুৎ রেগুলেটরে তাপ সৃষ্টি করে। যার ফলে বৈদ্যুতিক পাখা ধীরে ঘুরলেও বিদ্যুৎ খরচ একই হয় কারণ সবসময় বিদ্যুৎ প্রবাহ একই থাকে।"},{"id":"q0127","page":21,"printed_page":443,"chapter":"অধ্যায় ০৬","chapter_title":"স্থির ও চল তড়িৎ","topic_code":"৬.৪","topic_title":"বৈদ্যুতিক শক্তির ব্যয় ও ক্ষমতার হিসাব","number":"০৫","question":"বিদ্যুৎ বিলের হিসাব কীভাবে করা হয়?","exam_ref":"২৮তম বিসিএস","options":{"ক":"ওয়াট আওয়ারে","খ":"ওয়াটে","গ":"ভোল্টে","ঘ":"কিলোওয়াট ঘণ্টায়"},"answer":"ঘ","answer_text":"কিলোওয়াট ঘণ্টায়","explanation":""},{"id":"q0128","page":21,"printed_page":443,"chapter":"অধ্যায় ০৬","chapter_title":"স্থির ও চল তড়িৎ","topic_code":"৬.৪","topic_title":"বৈদ্যুতিক শক্তির ব্যয় ও ক্ষমতার হিসাব","number":"০৬","question":"দূরের বিদ্যুৎ উৎপাদন কেন্দ্র হতে বিদ্যুৎ নিয়ে আসতে হলে হাইভোল্টেজ ব্যবহার করার কারণ-","exam_ref":"১০তম বিসিএস","options":{"ক":"এতে বিদ্যুতের অপচয় কম হয়","খ":"এতে কমে গিয়েও প্রয়োজনীয় ভোল্টেজ বজায় থাকে","গ":"অধিক বিদ্যুৎ প্রবাহ পাওয়া যায়","ঘ":"প্রয়োজনমতো ভোল্টেজ কমিয়ে ব্যবহার করা যায়"},"answer":"ক","answer_text":"এতে বিদ্যুতের অপচয় কম হয়","explanati ","গ":"আন্টিমনি","ঘ":"কোবাল্ট"},"answer":"ঘ","answer_text":"কোবাল্ট","explanation":""},{"id":"q0146","page":25,"printed_page":447,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.১","topic_title":"পৃথিবী সৃষ্টির ইতিহাস","number":"০১","question":"কোন বাংলাদেশি বিজ্ঞানী কৃষ্ণগহ্বর নিয়ে গবেষণা করেছেন?","exam_ref":"৫০তম বিসিএস","options":{"ক":"ড. কুদরত-ই-খুদা","খ":"কাজী মোতাহার হোসেন","গ":"জামাল নজরুল ইসলাম","ঘ":"অতীশ দীপংকর"},"answer":"গ","answer_text":"জামাল নজরুল ইসলাম","explanation":"অধ্যাপক জামাল নজরুল ইসলাম ছিলেন বিশ্ববিখ্যাত একজন গণিতবিদ এবং মহাকাশবিজ্ঞানী। মহাবিশ্বের উৎপত্তি এবং এর চূড়ান্ত পরিণতি (The Ultimate Fate of the Universe) নিয়ে তাঁর কাজগুলো পৃথিবীজুড়ে সমাদৃত। কৃষ্ণগহ্বর বা ব্ল্যাক হোল এবং মহাজাগতিক বিভিন্ন জটিল গাণিতিক সমস্যার সমাধানে তাঁর অবদান অনস্বীকার্য।"},{"id":"q0147","page":25,"printed_page":447,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.১","topic_title":"পৃথিবী সৃষ্টির ইতিহাস","number":"০২","question":"হিগ্স কণার (Higgs Particle) প্রকৃতির সাথে কোন বাংলাদেশি বিজ্ঞানীর নাম জড়িয়ে আছে?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"স্যার জগদীশ চন্দ্র বসু","খ":"সত্যেন্দ্র নাথ বসু","গ":"প্রফেসর জামাল নজরুল ইসলাম","ঘ":"ড. কুদরত-ই-খুদা"},"answer":"খ","answer_text":"সত্যেন্দ্র নাথ বসু","explanation":"হিগ্স বোসন হলো একটি মৌলিক কণা, যা পদার্থবিজ্ঞানের স্ট্যান্ডার্ড মডেল অনুযায়ী, পদার্থের ভর সৃষ্টির জন্য দায়ী। হিগ্স বোসন কণার নামকরণ ও তার ধারণার সাথে জড়িত ছিলেন বাঙালি বিজ্ঞানী সত্যেন্দ্রনাথ বসু, যিনি ঢাকা বিশ্ববিদ্যালয়ের অধ্যাপক ছিলেন। যদিও হিগ্স বোসন কণা আবিষ্কারে তাঁর প্রত্যক্ষ অবদান ছিল না, তাঁর 'বোসন পরিসংখ্যান' তত্ত্বের ভিত্তি করেই এই কণার নামকরণ করা হয়। সত্যেন্দ্রনাথ বসুর অবদান: বোস-আইনস্টাইন পরিসংখ্যান — বিজ্ঞানী আলবার্ট আইনস্টাইনের সাথে যৌথভাবে 'বোস-আইনস্টাইন পরিসংখ্যান' তত্ত্ব উপস্থাপন করেন, যা পদার্থবিজ্ঞানের একটি গুরুত্বপূর্ণ ভিত্তি তৈরি করে। বোসনের নামকরণ — এই পরিসংখ্যানের ওপর ভিত্তি করে বিভিন্ন মৌলিক কণার বৈশিষ্ট্য ব্যাখ্যা করার সময় অন্যান্য পদার্থবিজ্ঞানীরা তাঁদের কণার নাম ","question":"টলেমি কি ছিলেন?","exam_ref":"১৮তম বিসিএস","options":{"ক":"চিকিৎসক","খ":"দার্শনিক","গ":"জ্যোতির্বিদ","ঘ":"সেনাপতি"},"answer":"গ","answer_text":"জ্যোতির্বিদ","explanation":"'ক্লডিয়াস টলেমি' ছিলেন বিখ্যাত জ্যোতির্বিদ। তাঁর বিখ্যাত তিনটি গ্রন্থ 'গাইড টু জিওগ্রাফি', 'অ্যালমাজেস্ট' এবং 'অপটিক্স'।"},{"id":"q0155","page":26,"printed_page":448,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.২","topic_title":"জ্যোতির্মণ্ডলী","number":"০১","question":"পৃথিবীর কক্ষপথের বিভিন্ন বিন্দু থেকে দেখলে কোন ঘটনার কারণে একটি নক্ষত্রের অবস্থানের আপাত পরিবর্তন ঘটে?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"ডপলার ইফেক্ট","খ":"রেডশিফট","গ":"কসমিক","ঘ":"প্যারালেক্স"},"answer":"ঘ","answer_text":"প্যারালেক্স","explanation":"জ্যোতির্বিদ্যায় প্যারালেক্স হলো দুটি পৃথক বিন্দু থেকে একজন পর্যবেক্ষকের দ্বারা দেখা একটি মহাকাশীয় বস্তুর দিকের পার্থক্য। প্যারালেক্স পরিমাপ সরাসরি পৃথিবী (ভূকেন্দ্রিক প্যারালেক্স) এবং সূর্য (সূর্যকেন্দ্রিক প্যারালেক্স) থেকে বস্তুর দূরত্ব নির্ণয়ের জন্য ব্যবহৃত হয়। আবার, প্যারালেক্স ত্রুটি (Parallax Error) বলতে বুঝায় ভিন্ন অবস্থান থেকে পর্যবেক্ষণের জন্য বস্তুর অবস্থান বা পরিমাপে যে ত্রুটি পাওয়া যায়। কোণ বা দৈর্ঘ্য পরিমাপের ক্ষেত্রে সরাসরি না দেখে কোনো একপাশ থেকে দেখলে সঠিক মাপ দেখা যায় না। একই ঘটনা পরিলক্ষিত হয় পৃথিবীর কক্ষপথের বিভিন্ন বিন্দু থেকে একটি নক্ষত্রের অবস্থান নির্ণয়ে।"},{"id":"q0156","page":26,"printed_page":448,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.২","topic_title":"জ্যোতির্মণ্ডলী","number":"০২","question":"'কেপলার-৪৫২বি' কী?","exam_ref":"৪৪তম বিসিএস","options":{"ক":"একটি মহাকাশযান","খ":"পৃথিবীর মতো একটি গ্রহ","গ":"সূর্যের মতো একটি নক্ষত্র","ঘ":"NASA-এর অত্যাধুনিক টেলিস্কোপ"},"answer":"খ","answer_text":"পৃথিবীর মতো একটি গ্রহ","explanation":"পৃথিবী যেমন সৌরজগতের কেন্দ্র সূর্যকে কেন্দ্র করে ঘুরছে তেমনি কেপলার ৪৫২-বি গ্রহটি পৃথিবী থেকে ১৪০০ আলোকবর্ষ দূরে অবস্থিত এবং এটি সূর্যের মতো একটি নক্ষত্রকে কেন্দ্র করে ঘুরছে। গ্রহটি নাসার কেপলার স্পেস টেলিস্কোপ দ্বারা আবিষ্কৃত হয় ২০১৫ সালে। এই গ্রহের পৃষ্ঠ পাথুরে এবং জলবায়ু নাতিশীতোষ্ণ প্রকৃতির, তাই এখানে প্রাণের আবির্ভাব হওয়া সম্ভব। তাছাড়া পৃথিবীর সাথে আকার ও অন্যান্য অনেক বৈশিষ্ট্যের দিক দিয়ে গ্রহটির সাদৃশ্য রয়েছে।"},{"id":"q0157","page":26,"printed_page":448,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.২","topic_title":"জ্যোতির্মণ্ডলী","number":"০৩","question":"সূর্যের নিকটতম নক্ষত্রের নাম-","exam_ref":"৪১তম বিসিএস","options":{"ক":"ভেগা","খ":"প্রক্সিমা সেন্টাউরি","গ":"আলফা সেন্টাউরি A","ঘ":"আলফা সেন্টাউরি B"},"answer":"খ","answer_text":"প্রক্সিমা সেন্টাউরি","explanation":"সূর্যের নিকটতম নক্ষত্র প্রক্সিমা সেন্টাউরাই (Proxima Centauri), সূর্য থেকে এর দূরত্ব প্রায় ৪.২ আলোকবর্ষ। অপরদিকে সূর্য পৃথিবীর নিকটতম নক্ষত্র।"},{"id":"q0158","page":26,"printed_page":448,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.২","topic_title":"জ্যোতির্মণ্ডলী","number":"০৪","question":"কোন গ্রহের তাপমাত্রা তুলনামূলকভাবে অধিক?","exam_ref":"৩৫তম বিসিএস","options":{"ক":"শুক্র","খ":"পৃথিবী","গ":"মঙ্গল","ঘ":"বুধ"},"answer":"ক","answer_text":"শুক্র","explanation":"শুক্র গ্রহের পৃষ্ঠের গড় তাপমাত্রা ৪৬৫° সেন্টিগ্রেড, যা সকল গ্রহের মধ্যে সর্বাধিক। অন্যদিকে বুধের পৃষ্ঠের তাপমাত্রা -১৮০° থেকে ৪৩০° সে., পৃথিবীতে -৮৯° থেকে ৫৮° সে. এবং মঙ্গলে -৮২° থেকে০° সে. তাপমাত্রা বিরাজমান।"},{"id":"q0159","page":26,"printed_page":448,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.২","topic_title":"জ্যোতির্মণ্ডলী","number":"০৫","question":"ভূপৃষ্ঠের সৌরদীপ্ত ও অন্ধকারাচ্ছন্ন অংশের সংযোগস্থলকে বলে-","exam_ref":"৩২তম, ১৮তম বিসিএস","options":{"ক":"ঊষা","খ":"গোধূলি","গ":"গৌধুলি","ঘ":"ছায়াবৃত"},"answer":"ঘ","answer_text":"ছায়াবৃত","explanation":"কোনো নির্দিষ্ট সময়ে পৃথিবীর একদিকে রাত এবং অপর দিকে দিন হয়। অর্থাৎ পৃথিবীর একদিক আলোকিত থাকে এবং অপর দিক অন্ধকারাচ্ছন্ন থাকে। পৃথিবীর এ আলোকিত ও অন্ধকারাচ্ছন্ন অংশের সীমারেখাকে ছায়াবৃত বলে। প্রভাতের কিছুক্ষণ পূর্বে যে ক্ষীণ আলো দেখতে পাওয়া যায় তাকে ঊষা বলে এবং সন্ধ্যার কিছুক্ষণ পূর্বে যে সময় ক্ষীণ আলো থাকে সে সময়কে বলা হয় গোধূলি।"},{"id":"q0160","page":26,"printed_page":448,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.২","topic_title":"জ্যোতির্মণ্ডলী","number":"০৬","question":"কত বছর পর পর হ্যালির ধূমকেতু দেখা যায়?","exam_ref":"৩০তম বিসিএস","options":{"ক":"৭০ বছর","খ":"৬৫ বছর","গ":"৭৬ বছর","ঘ":"৮০ বছর"},"answer":"গ","answer_text":"৭৬ বছর","explanation":"ব্রিটিশ জ্যোতির্বিদ অ্যাডমন্ড হ্যালি ১৬৮২ সালে হ্যালির ধূমকেতু আবিষ্কার করেন। হ্যালির ধূমকেতু ৭৬ বছর পর পর দেখা যায়। ১৭৫৯, ১৮৩৫, ১৯১০ ও ১৯৮৬ সালে হ্যালির ধূমকেতু দেখা গেছে। পরবর্তীতে আবার ২০৬২ সালে এটি দেখা যাবে। একবিংশ শতাব্দীর উজ্জ্বলতম ধূমকেতু Ikeya-Seki। P 67 একটি ধূমকেতু।"},{"id":"q0161","page":27,"printed_page":449,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.২","topic_title":"জ্যোতির্মণ্ডলী","number":"০৭","question":"ছায়াপথ তার নিজ অক্ষকে কেন্দ্র করে ঘুরে আসতে যে সময় লাগে তাকে কি বলে?","exam_ref":"২৮তম বিসিএস","options":{"ক":"সৌর বছর","খ":"কসমিক ইয়ার","গ":"আলোক বর্ষ","ঘ":"পলিসার"},"answer":"খ","answer_text":"কসমিক ইয়ার","explanation":"কসমিক ইয়ার: গ্যালাক্সি বা ছায়াপথ তার নিজ অক্ষকে কেন্দ্র করে একবার ঘুরে আসতে যে সময় লাগে তাকে কসমিক ইয়ার বলে। সৌরবছর: সূর্যের চারিদিকে একবার ঘুরে আসতে পৃথিবীর যে সময় লাগে তাকে সৌরবছর (solar year) বলে। আলোকবর্ষ: এক বছরে আলো যত দূরত্ব অতিক্রম করে তাকে আলোকবর্ষ বলে।"},{"id":"q0162","page":27,"printed_page":449,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.২","topic_title":"জ্যোতির্মণ্ডলী","number":"০৮","question":"এই শতাব্দীর সবচেয়ে উজ্জ্বল ধূমকেতু কোনটি?","exam_ref":"১৮তম বিসিএস","options":{"ক":"হেলির ধূমকেতু","খ":"হেলবপ ধূমকেতু","গ":"থেমকার-লেভী ধূমকেতু","ঘ":"কোনটিই নয়"},"answer":"খ","answer_text":"হেলবপ ধূমকেতু","explanation":"মহাকাশে মাঝে মাঝে এক প্রকার জ্যোতিতেজের আবির্ভাব ঘটে। এসব জ্যোতিষ্ক তাদের নিজস্ব কক্ষপথে ঘুরতে ঘুরতে কিছু দিনের জন্য উদয় হয়ে আবার অদৃশ্য হয়ে যায়। এসব জ্যোতিষ্ককে ধূমকেতু বলা হয়। গত শতাব্দী অর্থাৎ বিংশ শতাব্দীর সবচেয়ে উজ্জ্বল ধূমকেতুর নাম 'হেলবপ' ধূমকেতু। ২ জন মার্কিন আবিষ্কারকের নামানুসারে ধূমকেতুটির নামকরণ করা হয়। আবিষ্কারক: মার্কিন জ্যোতির্বিদ এলান হেল ও টমাস বপ (১৯৯৫)। ১৯৯৫ সালের মার্চ-এপ্রিল মাসে বাংলাদেশ হতে এ ধূমকেতুটি দেখা গিয়েছিল।"},{"id":"q0163","page":27,"printed_page":449,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.২","topic_title":"জ্যোতির্মণ্ডলী","number":"০৯","question":"আকাশের উজ্জ্বলতম নক্ষত্র কোনটি?","exam_ref":"১৮তম বিসিএস","options":{"ক":"ধ্রুবতারা","খ":"প্রক্সিমা সেন্টাউরাই","গ":"লুব্ধক","ঘ":"পুলহ"},"answer":"গ","answer_text":"লুব্ধক","explanation":"আকাশের উজ্জ্বলতম নক্ষত্র হচ্ছে 'লুব্ধক'। 'ধ্রুবতারা' হচ্ছে উত্তর গোলার্ধের আকাশের আপাত স্থির উজ্জ্বল নক্ষত্র। 'প্রক্সিমা সেন্টাউরাই' পৃথিবীর (সূর্য ছাড়া) নিকটতম নক্ষত্র এবং পুলহ হচ্ছে সপ্তর্ষিমণ্ডলের একটি নক্ষত্র।"},{"id":"q0164","page":27,"printed_page":449,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.২","topic_title":"জ্যোতির্মণ্ডলী","number":"১০","question":"ধূমকেতু শুমেকার লেভী-৯ এর ভাঙা টুকরোরা কবে বৃহস্পতি গ্রহে আঘাত হানে?","exam_ref":"১৬তম বিসিএস","options":{"ক":"১৫ জুলাই, ১৯৯৪","খ":"১৬ জুলাই, ১৯৯৪","গ":"১৭ জুলাই, ১৯৯৪","ঘ":"১৮ জুলাই, ১৯৯৪"},"answer":"খ","answer_text":"১৬ জুলাই, ১৯৯৪","explanation":"শুমেকার লেভী-৯ ধূমকেতুর আবিষ্কারক ক্যারোলিন শুমেকার ও ইউজিন শুমেকার দম্পতি এবং ডেভিড লেভি। ১৯৯০ সালে এই জ্যোতির্বিজ্ঞানীরা এটি আবিষ্কার করেন। ধূমকেতুটি মূলত বৃহস্পতি গ্রহের মাধ্যাকর্ষণের প্রভাবে আকৃষ্ট হয়ে একে কেন্দ্র করে ঘুরছিল। এটি ছিল কোনো গ্রহকে কেন্দ্র করে প্রদক্ষিণকারী প্রথম সক্রিয় ধূমকেতু। ১৯৯৪ সালের ১৬ জুলাই এটির ভাঙা টুকরোর সাথে বৃহস্পতি গ্রহের সংঘর্ষের ঘটনা ঘটে। এই সংঘর্ষের ফলে বৃহস্পতি গ্রহ সম্পর্কে অনেক নতুন তথ্য পাওয়া যায়।"},{"id":"q0165","page":27,"printed_page":449,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.৩","topic_title":"গুরুত্বপূর্ণ কিছু মহাকাশ অভিযান","number":"০১","question":"কোন স্পেস টেলিস্কোপ ২০২১ সালে হাবল টেলিস্কোপের স্থলাভিষিক্ত হয়?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"জেমস ওয়েব","খ":"পাথ ফাইন্ডার","গ":"স্পিটজার","ঘ":"জন কেপলার"},"answer":"ক","answer_text":"জেমস ওয়েব","explanation":"২০২১ সালে মহাকাশ বিজ্ঞানের ইতিহাসে একটি গুরুত্বপূর্ণ ধাপ হিসেবে হাবল স্পেস টেলিস্কোপের স্থলাভিষিক্ত হিসেবে নতুন একটি স্পেস টেলিস্কোপ চালু করা হয়। এটি হলো জেমস ওয়েব স্পেস টেলিস্কোপ (James Webb Space Telescope), যা হাবলের তুলনায় বহুগুণ উন্নত প্রযুক্তি এবং প্রধানত ইনফ্রারেড বর্ণালীতে পর্যবেক্ষণ করার ক্ষমতা রাখে। জেমস ওয়েব টেলিস্কোপের উদ্দেশ্য হলো মহাবিশ্বের প্রাথমিক নক্ষত্র ও গ্যালাক্সি চিহ্নিত করা, সৌরজগতের বাইরের গ্রহসমূহ (exoplanet) বিশ্লেষণ করা এবং মহাবিশ্বের গঠন ও বিবর্তন সম্পর্কিত গুরুত্বপূর্ণ তথ্য সংগ্রহ করা। অন্যান্য টেলিস্কোপ যেমন পাথ ফাইন্ডার, স্পিটজার এবং জন কেপলার বিভিন্ন ধরনের মহাকাশ গবেষণার জন্য ব্যবহৃত হলেও, এগুলো হাবলের সরাসরি স্থলাভিষিক্ত নয়।"},{"id":"q0166","page":27,"printed_page":449,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.৩","topic_title":"গুরুত্বপূর্ণ কিছু মহাকাশ অভিযান","number":"০২","question":"কোন গ্রহে 'Curiosity' মহাকাশযানটি প্রেরণ করা হয়?","exam_ref":"৪৭তম বিসিএস","options":{"ক":"শনি","খ":"মঙ্গল","গ":"বৃহস্পতি","ঘ":"ইউরেনাস"},"answer":"খ","answer_text":"মঙ্গল","explanation":"মঙ্গলগ্রহের কিউরিওসিটি রোভার (The Mars Curiosity Rover) হলো নাসা পরিচালিত একটি গাড়ির সমআকৃতির ভ্রাম্যমাণ রোবোটিক পরীক্ষাগার, যা ২০১২ সাল হতে মঙ্গলগ্রহের গেল ক্রেটার ও মাউন্ট শার্প অঞ্চলে অনুসন্ধান করে আসছে। এই রোভারের প্রাথমিক উদ্দেশ্য হলো প্রাচীন মাইক্রোবিয়াল জীবন ধারণের জন্য গ্রহটির পরিবেশগত অবস্থা অনুকূল ছিল কিনা তা নির্ধারণ করা। ইতিমধ্যেই এটি জীবনের জন্য প্রয়োজনীয় উপাদান এবং প্রাচীন হ্রদের উপস্থিতি সনাক্ত করেছে এবং বর্তমানে মঙ্গলের পরিবর্তনশীল জলবায়ু ও ভূতাত্ত্বিক অবস্থা বোঝার জন্য গবেষণা চালিয়ে যাচ্ছে। উৎক্ষেপণের তারিখ: ২৬ নভেম্বর, ২০১১। অবতরণ তারিখ: ৬ আগস্ট, ২০১২। অবস্থান: গেল ক্রেটার ও মাউন্ট শার্প অঞ্চল।"},{"id":"q0167","page":27,"printed_page":449,"chapter":"অধ্যায় ০৮","chapter_title":"আধুনিক পদার্থবিজ্ঞান","topic_code":"৮.৩","topic_title":"গুরুত্বপূর্ণ কিছু মহাকাশ অভিযান","number":"০৩","question":"পাথফাইন্ডার-এর মঙ s":{"ক":"50%","খ":"99.3%","গ":"0%","ঘ":"69.3%"},"answer":"খ","answer_text":"99.3%","explanation":"পৃথিবীতে ইউরেনিয়ামের দুটি আইসোটোপ রয়েছে যথাক্রমে ইউরেনিয়াম-২৩৫ এবং ইউরেনিয়াম-২৩৮। প্রকৃতিতে এই (U-২৩৮) আইসোটোপই বেশি মাত্রায় পাওয়া যায়। এক হিসেবে দেখা যায় শতকরা ৯৯.৩% ইউরেনিয়ামই হলো ইউরেনিয়াম-২৩৮, অপরদিকে ইউরেনিয়াম-২৩৫ এর পরিমাণ খুবই অল্প যা মাত্র ০.৭%।"},{"id":"q0196","page":31,"printed_page":453,"chapter":"অধ্যায় ০৯","chapter_title":"পরমাণুর গঠন","topic_code":"৯.৫","topic_title":"তেজষ্ক্রিয় পদার্থ","number":"০২","question":"কোনটি তেজষ্ক্রিয় পদার্থ নয়?","exam_ref":"২০তম বিসিএস","options":{"ক":"লৌহ","খ":"ইউরেনিয়াম","গ":"প্লুটোনিয়াম","ঘ":"নেপচুনিয়াম"},"answer":"ক","answer_text":"লৌহ","explanation":"ভারী মৌলিক পদার্থের নিউক্লিয়াস থেকে স্বতঃস্ফূর্তভাবে অবিরত আলফা, বিটা ও গামা রশ্মি নির্গমনের প্রক্রিয়াকে তেজষ্ক্রিয়তা বলে। প্রকৃতপক্ষে যেসব মৌলের পারমাণবিক সংখ্যা ৮২-এর চেয়ে বেশি তাদেরকে তেজষ্ক্রিয় পদার্থ বলা হয়। উপরিউক্ত মৌলগুলোর মধ্যে লৌহের পারমাণবিক সংখ্যা ২৬, অন্যগুলোর ৮২ বা তার বেশি, যার ফলে শুধু লৌহই তেজষ্ক্রিয় পদার্থ নয়।"},{"id":"q0197","page":32,"printed_page":454,"chapter":"অধ্যায় ১০","chapter_title":"রাসায়নিক বিক্রিয়া ও তড়িৎ রসায়ন","topic_code":"১০.১","topic_title":"জারণ-বিজারণ বিক্রিয়া","number":"০১","question":"জারণ প্রক্রিয়া সম্পন্ন হয়-","exam_ref":"৪৩তম বিসিএস","options":{"ক":"অ্যানোডে","খ":"ক্যাথোডে","গ":"অ্যানোড এবং ক্যাথোড উভয়টিতে","ঘ":"বর্ণিত কোনটিতেই নয়"},"answer":"ক","answer_text":"অ্যানোডে","explanation":"কোষের অ্যানোডে সর্বদা জারণ বিক্রিয়া ও ক্যাথোডে সর্বদা বিজারণ বিক্রিয়া হয়। ইলেকট্রন ত্যাগ করলে জারণ এবং গ্রহণ করলে বিজারণ হয়। যেমন- অ্যানোড: Zn − ২e⁻ → Zn²⁺ (জারণ); ক্যাথোড: Cu²⁺ + ২e⁻ → Cu (বিজারণ)। গ্যালভানিক সেলে দস্তা বা জিংক দণ্ড অ্যানোড এবং তামা বা কপার দণ্ড ক্যাথোড হিসেবে কাজ করে। এক্ষেত্রে জিংক ইলেকট্রন ত্যাগ করে এবং দ্রবণের কপার আয়ন ইলেকট্রন গ্রহণ করে ধাতব কপার হিসেবে কপার দণ্ডের গায়ে জমা হয়।"},{"id":"q0198","page":32,"printed_page":454,"chapter":"অধ্যায় ১০","chapter_title":"রাসায়নিক বিক্রিয়া ও তড়িৎ র
