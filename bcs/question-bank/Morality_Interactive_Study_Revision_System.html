<!DOCTYPE html>
<html lang="bn">
<head>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../../firebase-config.js?v=2"></script>
  <script>window.AG_PAGE = {"id": "morality", "title": "Morality & Ethics", "storage": {"type": "keys", "keys": ["morality_srs_v2"]}};</script>
  <script src="../../auth-gate.js?v=4"></script>
  

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Morality — Interactive Study &amp; Revision System</title>
<style>
:root{
  --bg:#f7f5f0; --bg-alt:#ffffff; --ink:#1c1b18; --ink-soft:#57544c;
  --line:#e4dfd4; --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#e4f0ec;
  --amber:#b5772a; --amber-soft:#f6ead9; --red:#a8402f; --red-soft:#f7e4df;
  --blue:#2b5b8c; --blue-soft:#e3ecf5; --gold:#8a6d1f; --gold-soft:#f2ecd6;
  --card:#ffffff; --shadow:0 1px 2px rgba(28,27,24,.06),0 1px 12px rgba(28,27,24,.05);
  --radius:14px; --radius-sm:9px; --font-ui:"Kalpurush","Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;
  --font-num:"Kalpurush","Noto Sans Bengali",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#161512; --bg-alt:#1f1e1a; --ink:#efece3; --ink-soft:#b3ada0;
  --line:#333026; --accent:#4bab8f; --accent-ink:#0d1512; --accent-soft:#1d2e29;
  --amber:#d99a4e; --amber-soft:#332612; --red:#e08672; --red-soft:#331d18;
  --blue:#7aa8dd; --blue-soft:#1a2534; --gold:#d0b45a; --gold-soft:#2e2810;
  --card:#1f1e1a; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-ui); background:var(--bg); color:var(--ink);
  line-height:1.65; -webkit-font-smoothing:antialiased; letter-spacing:.01em;
}
button,input,select,textarea{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font-ui); font-weight:700; margin:0 0 .5em; line-height:1.35}
p{margin:0 0 .8em}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}

.app-shell{display:flex; min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  width:250px; flex-shrink:0; background:var(--bg-alt); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:20px 18px 14px; border-bottom:1px solid var(--line)}
.brand-title{font-size:17px; font-weight:800; display:flex; align-items:center; gap:8px}
.brand-badge{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.brand-sub{font-size:11.5px; color:var(--ink-soft); margin-top:4px}
.nav{padding:10px 10px 16px; flex:1}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px;
  color:var(--ink-soft); cursor:pointer; font-size:14px; margin-bottom:2px; user-select:none;
  border:none; background:none; width:100%; text-align:left;
}
.nav-item:hover{background:var(--accent-soft); color:var(--ink)}
.nav-item.active{background:var(--accent); color:var(--accent-ink); font-weight:700}
.nav-icon{width:18px; text-align:center; flex-shrink:0; font-size:15px}
.nav-badge{
  margin-left:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:700;
  padding:1px 6px; border-radius:20px; min-width:18px; text-align:center;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,.28)}
.nav-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);
  padding:14px 12px 6px; opacity:.7}
.sidebar-foot{padding:12px; border-top:1px solid var(--line); display:flex; gap:8px}
.icon-btn{
  border:1px solid var(--line); background:var(--bg); border-radius:8px; width:34px; height:34px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); font-size:15px;
}
.icon-btn:hover{border-color:var(--accent)}

/* ---------- Mobile nav ---------- */
.mobile-topbar{display:none}
.mobile-nav-overlay{display:none}

/* ---------- Main ---------- */
.main{flex:1; min-width:0}
.main-inner{max-width:1080px; margin:0 auto; padding:26px 28px 80px}
.page-head{margin-bottom:20px}
.page-title{font-size:22px; font-weight:800; display:flex; align-items:center; gap:10px}
.page-sub{color:var(--ink-soft); font-size:13.5px; margin-top:4px}

.searchbar{
  display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
  border-radius:10px; padding:9px 13px; margin-bottom:18px; box-shadow:var(--shadow);
}
.searchbar input{border:none; outline:none; background:none; flex:1; font-size:14px; color:var(--ink)}
.searchbar .kbd{font-size:11px; color:var(--ink-soft); border:1px solid var(--line); border-radius:5px; padding:1px 6px}

/* ---------- Cards / grid ---------- */
.grid{display:grid; gap:14px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)} .grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr}}

.stat-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px;
  box-shadow:var(--shadow);
}
.stat-num{font-size:26px; font-weight:800; line-height:1}
.stat-label{font-size:12.5px; color:var(--ink-soft); margin-top:6px}
.stat-card.accent{background:var(--accent-soft)}
.stat-card.amber{background:var(--amber-soft)}
.stat-card.red{background:var(--red-soft)}
.stat-card.blue{background:var(--blue-soft)}

.panel{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px;
  box-shadow:var(--shadow); margin-bottom:16px;
}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.panel-title{font-size:15.5px; font-weight:800; display:flex; align-items:center; gap:8px}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px;
  border-radius:20px; background:var(--accent-soft); color:var(--accent)}
.pill.amber{background:var(--amber-soft); color:var(--amber)}
.pill.red{background:var(--red-soft); color:var(--red)}
.pill.blue{background:var(--blue-soft); color:var(--blue)}
.pill.gold{background:var(--gold-soft); color:var(--gold)}
.pill.gray{background:var(--line); color:var(--ink-soft)}

.btn{
  border:1px solid var(--line); background:var(--bg-alt); color:var(--ink); border-radius:9px;
  padding:8px 14px; font-size:13.5px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{opacity:.92}
.btn.danger{background:var(--red); color:#fff; border-color:var(--red)}
.btn.ghost{background:none; border:none}
.btn.sm{padding:5px 10px; font-size:12.5px}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* Priority now widget */
.priority-item{
  display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);
}
.priority-item:last-child{border-bottom:none}
.priority-rank{
  width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  font-weight:800; font-size:12.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.priority-text{flex:1; font-size:14px}
.priority-meta{font-size:12px; color:var(--ink-soft); margin-top:2px}

/* ---------- Question card ---------- */
.q-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px;
  box-shadow:var(--shadow); margin-bottom:14px; scroll-margin-top:20px}
.q-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.q-meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.q-num{font-weight:800; color:var(--accent)}
.q-text{font-size:15.5px; font-weight:700; margin-bottom:14px}
.q-text mark{background:var(--gold-soft); color:inherit; padding:0 2px; border-radius:3px}
.options{display:flex; flex-direction:column; gap:8px}
.opt{
  display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:10px;
  padding:10px 13px; cursor:pointer; font-size:14.5px; background:var(--bg-alt); transition:border-color .1s;
}
.opt:hover{border-color:var(--accent)}
.opt .opt-key{width:22px; height:22px; border-radius:6px; background:var(--bg); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0}
.opt.selected{border-color:var(--accent); background:var(--accent-soft)}
.opt.correct{border-color:var(--accent); background:var(--accent-soft)}
.opt.correct .opt-key{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.opt.incorrect{border-color:var(--red); background:var(--red-soft)}
.opt.incorrect .opt-key{background:var(--red); color:#fff; border-color:var(--red)}
.opt.disabled{cursor:default}
.opt.reveal-correct{border-color:var(--accent); border-style:dashed}

.q-result-banner{display:flex; align-items:center; gap:8px; font-weight:800; font-size:13.5px; margin:12px 0 6px}
.q-result-banner.ok{color:var(--accent)}
.q-result-banner.no{color:var(--red)}

.explain-box{background:var(--accent-soft); border-radius:10px; padding:12px 14px; font-size:13.8px;
  margin-top:10px; color:var(--ink)}
.explain-box b{color:var(--accent)}
.flag-box{background:var(--amber-soft); border-radius:10px; padding:10px 14px; font-size:12.8px; margin-top:8px; color:var(--amber)}
.source-line{font-size:11.5px; color:var(--ink-soft); margin-top:10px}

.q-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
.act-btn{
  border:1px solid var(--line); background:var(--bg-alt); border-radius:8px; padding:6px 11px; font-size:12.5px;
  font-weight:700; cursor:pointer; display:flex; align-items:center; gap:5px; color:var(--ink-soft);
}
.act-btn:hover{border-color:var(--accent); color:var(--ink)}
.act-btn.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.act-btn.on.bm{background:var(--gold); border-color:var(--gold); color:#1c1b18}
.act-btn.on.mastered{background:var(--accent)}
.act-btn.on.revision{background:var(--red); border-color:var(--red); color:#fff}

.status-chip{font-size:11px; font-weight:800; padding:2px 8px; border-radius:20px}
.status-new{background:var(--line); color:var(--ink-soft)}
.status-learning{background:var(--blue-soft); color:var(--blue)}
.status-weak{background:var(--amber-soft); color:var(--amber)}
.status-due{background:var(--red-soft); color:var(--red)}
.status-mastered{background:var(--accent-soft); color:var(--accent)}

.note-box{margin-top:10px}
.note-box textarea{
  width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;
  background:var(--bg-alt); color:var(--ink); resize:vertical; min-height:50px;
}
.note-label{font-size:11px; color:var(--ink-soft); margin-bottom:4px; font-weight:700}

/* ---------- Filters ---------- */
.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.filter-select{
  border:1px solid var(--line); background:var(--card); border-radius:9px; padding:7px 11px; font-size:13px;
  color:var(--ink); cursor:pointer;
}
.chip-toggle{
  border:1px solid var(--line); background:var(--card); border-radius:20px; padding:6px 13px; font-size:12.8px;
  font-weight:700; cursor:pointer; color:var(--ink-soft);
}
.chip-toggle.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

/* ---------- Study material ---------- */
.study-sec{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; overflow:hidden}
.study-sec-head{padding:14px 18px; display:flex; align-items:center; justify-content:space-between; cursor:pointer}
.study-sec-title{font-weight:800; font-size:15px}
.study-sec-body{padding:0 18px 18px; font-size:14.5px}
.study-sec-body p{margin-bottom:10px}

/* ---------- Empty state ---------- */
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft)}
.empty-state .emoji{font-size:38px; margin-bottom:10px}

/* ---------- Topic strength bar ---------- */
.strength-bar{height:7px; border-radius:5px; background:var(--line); overflow:hidden; margin-top:6px}
.strength-fill{height:100%; background:var(--accent); border-radius:5px}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(20,18,14,.55); display:flex; align-items:center;
  justify-content:center; z-index:100; padding:20px}
.modal{background:var(--card); border-radius:16px; max-width:520px; width:100%; padding:24px; box-shadow:var(--shadow); max-height:86vh; overflow-y:auto}
.modal h3{margin-bottom:10px}

/* ---------- toast ---------- */
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:10px 18px; border-radius:30px; font-size:13.5px; font-weight:700; z-index:200; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .25s, bottom .25s;}
.toast.show{opacity:1; bottom:32px}
[data-theme="dark"] .toast{background:var(--accent); color:var(--accent-ink)}

/* focus/quick modes */
.focus-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px}
.timer-display{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent)}
.progress-track{height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:18px}
.progress-fill{height:100%; background:var(--accent)}

/* keyboard shortcut panel */
.kbd-grid{display:grid; grid-template-columns:auto 1fr; gap:8px 14px; font-size:13px}
.kbd-grid kbd{background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:1px 7px; font-family:inherit}

/* responsive */
@media(max-width:880px){
  .sidebar{position:fixed; left:-260px; top:0; z-index:60; transition:left .2s; box-shadow:0 0 30px rgba(0,0,0,.2)}
  .sidebar.open{left:0}
  .mobile-topbar{
    display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--bg-alt);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40;
  }
  .mobile-topbar .brand-title{font-size:15px}
  .mobile-nav-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:55}
  .mobile-nav-overlay.show{display:block}
  .main-inner{padding:18px 14px 70px}
  .grid-4{grid-template-columns:1fr 1fr}
  .grid-3{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  .page-title{font-size:19px}
  .q-text{font-size:14.5px}
}

/* dashboard: what to study now */
.wtsn-card{background:linear-gradient(135deg,var(--accent-soft),var(--bg-alt)); border:1.5px solid var(--accent);
  border-radius:var(--radius); padding:18px 20px; margin-bottom:18px}
.wtsn-title{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin-bottom:10px}

.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:16px}
@media(max-width:880px){.two-col{grid-template-columns:1fr}}

.small-muted{font-size:12px; color:var(--ink-soft)}
hr.sep{border:none; border-top:1px solid var(--line); margin:14px 0}

.tag-row{display:flex; gap:6px; flex-wrap:wrap}

.topic-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
.topic-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.topic-card-title{font-weight:800; font-size:15px}

.streak-flame{font-size:28px}

input[type=range]{accent-color:var(--accent)}

</style>
</head>
<body>
<div id="ag-overlay"></div>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title"><span class="brand-badge">⚖</span> Morality Study System</div>
      <div class="brand-sub">নৈতিকতা, মূল্যবোধ ও সুশাসন</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <button class="icon-btn" id="themeToggleBtn" title="থিম পরিবর্তন করুন">🌓</button>
      <div class="searchbar" style="flex:1; margin:0; padding:6px 10px">
        <span style="font-size:13px">🔍</span>
        <input id="globalSearchInput" placeholder="খুঁজুন… (/)" style="font-size:12.5px">
      </div>
    </div>
  </aside>

  <div class="mobile-nav-overlay" id="mobileOverlay"></div>

  <main class="main">
    <div class="mobile-topbar">
      <button class="icon-btn" id="mobileMenuBtn">☰</button>
      <div class="brand-title">⚖ Morality Study System</div>
    </div>
    <div class="main-inner" id="mainInner"></div>
  </main>

</div>

planation": "আইনের শাসনের মানে আইনের অধীনে সবাই সমান; ধনী-গরিব, শাসক-শাসিত একই অপরাধের জন্য সবাই সমান শাস্তিযোগ্য। এজন্য আইনের শাসন সামাজিক মূল্যবোধের অন্যতম ভিত্তি এবং একে সভ্য সমাজের মানদণ্ড বলা চলে।", "tag": "৪০তম বিসিএস", "page": 6}, {"id": "morality-ch2-q17", "chapter": "ch2", "chapterTitle": "অধ্যায় ০২: মূল্যবোধ (Values)", "num": "17", "question": "মূল্যবোধ হলো-", "options": {"ক": "মানুষের সঙ্গে মানুষের পারস্পরিক সম্পর্ক নির্ধারণ", "খ": "মানুষের আচরণ পরিচালনাকারী নীতি ও মানদণ্ড", "গ": "সমাজজীবনে মানুষের সুখী হওয়ার প্রয়োজনীয় উপাদান", "ঘ": "মানুষের প্রাতিষ্ঠানিক কার্যাবলীর দিক নির্দেশনা"}, "answer": "খ", "explanation": "", "tag": "৪০তম, ৩৫তম বিসিএস", "page": 6}, {"id": "morality-ch2-q18", "chapter": "ch2", "chapterTitle": "অধ্যায় ০২: মূল্যবোধ (Values)", "num": "18", "question": "মূল্যবোধের চালিকা শক্তি হলো-", "options": {"ক": "উন্নয়ন", "খ": "গণতন্ত্র", "গ": "সংস্কৃতি", "ঘ": "সুশাসন"}, "answer": "গ", "explanation": "", "tag": "৪০তম বিসিএস", "page": 6}, {"id": "morality-ch2-q19", "chapter": "ch2", "chapterTitle": "অধ্যায় ০২: মূল্যবোধ (Values)", "num": "19", "question": "ব্যক্তি সহনশীলতার শিক্ষা লাভ করে-", "options": {"ক": "সুশাসনের শিক্ষা থেকে", "খ": "আইনের শিক্ষা থেকে", "গ": "কর্তব্যবোধ থেকে", "ঘ": "মূল্যবোধের শিক্ষা থেকে"}, "answer": "ঘ", "explanation": "", "tag": "৩৮তম বিসিএস", "page": 6}, {"id": "morality-ch2-q20", "chapter": "ch2", "chapterTitle": "অধ্যায় ০২: মূল্যবোধ (Values)", "num": "20", "question": "নিচের কোনটি সংস্কৃতির উপাদান নয়?", "options": {"ক": "আইন", "খ": "প্রতীক", "গ": "ভাষা", "ঘ": "মূল্যবোধ"}, "answer": "ক", "explanation": "সংস্কৃতি সমাজ ভেদে পরিবর্তিত হলেও সংস্কৃতির কিছু উপাদান সবখানেই দেখা যায়। ভাষা, শ্রেণিবোধ, মূল্যবোধ, অনুমোদন, প্রতীক প্রভৃতি সংস্কৃতির প্রধান উপাদান। অন্যদিকে আইন তৈরি হয় প্রথা, ধর্ম, আইনসভা, সংবিধান, বিখ্যাত গ্রন্থ, বিচারকের রায়, সামাজিক ও গণতান্ত্রিক মূল্যবোধ থেকে। তাই সংস্কৃতির উপাদান আইন নয়, আইনের উপাদান সংস্কৃতি।", "tag": "৩৮তম বিসিএস", "page": 6}, {"id": "morality-ch2-q21", "chapter": "ch2", "chapterTitle": "অধ্যায় ০২: মূল্যবোধ (Values)", "num": "21", "question": "মূল্যবোধ পরীক্ষা করে-", "options": {"ক": "ভাল ও মন্দ", "খ": "ন্যায় ও অন্যায়", "গ": "নৈতিকতা ও অনৈতিকতা", "ঘ": "উপরের সবগুলো"}, "answer": "ঘ", "explanation": "", "tag": "৩৮তম বিসিএস", "page": 7}, {"id": "morality-ch2-q22", "chapter": "ch2", "chapterTitle": "অধ্যায় ০২: মূল্যবোধ (Values)", "num": "22", "question": "সরকারি সিদ্ধান্ত প্রণয়নে কোন মূল্যবোধটি গুরুত্বপূর্ণ নয়?", "options": {"ক": "বিশ্বস্ততা", "খ": "সৃজনশীলতা", "গ": "নিরপেক্ষতা", "ঘ": "জবাবদিহি"}, "answer": "খ", "explanation": "সরকারি সিদ্ধান্ত প্রণয়নের ক্ষেত্রে সবচেয়ে গুরুত্বপূর্ণ হলো নিরপেক্ষতা অবলম্বন করে আইনের মধ্যে থেকে সিদ্ধান্ত প্রদান করা, স্বার্থের সংঘাত থেকে বিরত থাকা এবং জবাবদিহিতা নিশ্চিত করা। উল্লিখিত বিষয়গুলো মেনে চলতে সৃজনশীলতার প্রয়োজন হয় না, তাই সরকারি সিদ্ধান্ত প্রণয়নে এই মূল্যবোধটি গুরুত্বপূর্ণ নয়।", "tag": "৩৭তম বিসিএস", "page": 7}, {"id": "morality-ch2-q23", "chapter": "ch2", "chapterTitle": "অধ্যায় ০২: মূল্যবোধ (Values)", "num": "23", "question": "আমাদের চিরন্তন মূল্যবোধ কোনটি?", "options": {"ক": "সত্য ও ন্যায়", "খ": "সার্থকতা", "গ": "শঠতা", "ঘ": "অসহিষ্ণুতা"}, "answer": "ক", "explanation": "", "tag": "৩৭তম বিসিএস", "page": 7}, {"id": "morality-ch2-q24", "chapter": "ch2", "chapterTitle": "অধ্যায় ০২: মূল্যবোধ (Values)", "num": "24", "question": "ব্যক্তিগত মূল্যবোধ লালন করে-", "options": {"ক": "সামাজিক মূল্যবোধকে", "খ": "গণতান্ত্রিক মূল্যবোধকে", "গ": "ব্যক্তিগত মূল্যবোধকে", "ঘ": "স্বাধীনতার মূল্যবোধকে"}, "answer": "ঘ", "explanation": "বর্তমান সময়ে সবচেয়ে বেশি গুরুত্ব পাচ্ছে ব্যক্তিগত মূল্যবোধ। এটি ব্যক্তি স্বাধীনতাকে লালন করে। এটি ব্যক্তি আচার-আচরণ নিয়ন্ত্রণে তার নিজস্ব কিছু মূল্যবোধ, যা ব্যক্তির রুচি, বিশ্বাস, মনোভাব, ধারণা ও নীতি নৈতিকতা থেকে সৃষ্ট। প্রতিটি শিশুই ব্যক্তিগত মূল্যবোধ নিয়ে জন্মায় এবং পরিবার থেকেই মূল্যবোধের শিক্ষা পায়।", "tag": "৩৬তম বিসিএস", "page": 7}, {"id": "morality-ch2-q25", "chapter": "ch2", "chapterTitle": "অধ্যায় ০২: মূল্যবোধ (Values)", "num": "25", "question": "মূল্যবোধ শিক্ষার অন্যতম <script>
/* ===========================================================
   Morality — Interactive Study & Revision System
   Vanilla JS, single-file, localStorage-persisted.
   =========================================================== */

const STORE_KEY = "morality_srs_v2";
const INTERVALS = [1, 3, 7, 14, 30, 60]; // days

// ---------- Utility ----------
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const todayStr = () => new Date().toISOString().slice(0,10);
const addDays = (dateStr, n) => {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
};
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtDate = (s) => {
  if(!s) return "—";
  const d = new Date(s + "T00:00:00");
  return d.toLocaleDateString("bn-BD", {day:"numeric", month:"short", year:"numeric"});
};
const escapeHtml = (s="") => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9);

function toast(msg){
  let t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

// ---------- Persistent state ----------
function defaultState(){
  return {
    progress: {},      // qid -> {status,attempts,correct,wrong,confidence,nextReview,successCount,failCount,lastReviewed,history:[],bookmarked,note,difficulty,lastResult}
    topicMeta: {},      // chapter -> {firstStudied,lastStudied,sessions,timeSpent}
    sessions: [],        // {id,date,topic,durationSec,correct,wrong,attempted}
    quizHistory: [],      // {id,date,scope,pool,count,score,correct,wrong,unanswered,timeSec}
    streak: {current:0, longest:0, lastDate:null, days:[]},
    notes: {},           // topicOrSection key -> text
    settings: {theme:"light"},
    studyPlanDone: {},    // date -> [taskIds done]
  };
}

let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify(DB));
}

function getProg(qid){
  if(!DB.progress[qid]){
    DB.progress[qid] = {
      status:"new", attempts:0, correct:0, wrong:0, confidence:null,
      nextReview:null, successCount:0, failCount:0, lastReviewed:null,
      history:[], bookmarked:false, note:"", difficulty:null, lastResult:null
    };
  }
  return DB.progress[qid];
}

function recordStudyDay(){
  const t = todayStr();
  if(!DB.streak.days.includes(t)) DB.streak.days.push(t);
  if(DB.streak.lastDate === t) { save(); return; }
  if(DB.streak.lastDate && daysBetween(DB.streak.lastDate, t) === 1){
    DB.streak.current += 1;
  } else if(DB.streak.lastDate === t){
    // same day, no change
  } else {
    DB.streak.current = 1;
  }
  DB.streak.lastDate = t;
  DB.streak.longest = Math.max(DB.streak.longest, DB.streak.current);
  save();
}

// ---------- SRS scheduling ----------
function scheduleNext(qid, outcome, confidence){
  // outcome: 'correct-high' | 'correct-low' | 'incorrect'
  const p = getProg(qid);
  let idx = p._srsIdx ?? -1;
  if(outcome === "incorrect"){
    p.failCount += 1;
    idx = Math.max(0, idx - 2); // big step back
    p.status = p.failCount >= 2 ? "due" : "weak";
  } else if(outcome === "correct-low"){
    p.successCount += 1;
    idx = Math.max(0, idx); // stay / small step
    p.status = "learning";
  } else { // correct-high
    p.successCount += 1;
    idx = Math.min(INTERVALS.length - 1, idx + 1);
    p.status = idx >= INTERVALS.length - 2 ? "mastered" : "learning";
  }
  p._srsIdx = idx;
  const days = INTERVALS[idx];
  p.nextReview = addDays(todayStr(), days);
  p.lastReviewed = todayStr();
  p.history.push({date:todayStr(), outcome, confidence: confidence||null});
  save();
}

function manualStatus(qid, status){
  const p = getProg(qid);
  p.status = status;
  if(status === "mastered"){ p._srsIdx = INTERVALS.length-1; p.nextReview = addDays(todayStr(), INTERVALS[INTERVALS.length-1]); }
  if(status === "due"){ p.nextReview = todayStr(); }
  save();
}

// ---------- Derived helpers ----------
function isOverdue(p){
  return p.nextReview && p.nextReview < todayStr() && p.status !== "mastered";
}
function isDueToday(p){
  return p.nextReview === todayStr();
}
function accuracy(p){
  const tot = p.correct + p.wrong;
  return tot ? Math.round((p.correct/tot)*100) : null;
}

function chapterOf(qid){ return DATA.find(q=>q.id===qid); }

function topicList(){
  const map = {};
  DATA.forEach(q=>{
    if(!map[q.chapter]) map[q.chapter] = {key:q.chapter, title:q.chapterTitle, questions:[]};
    map[q.chapter].questions.push(q);
  });
  return Object.values(map);
}

function topicStats(chKey){
  const qs = DATA.filter(q=>q.chapter===chKey);
  let attempted=0, correct=0, wrong=0, mastered=0, revision=0;
  qs.forEach(q=>{
    const p = getProg(q.id);
    if(p.attempts>0) attempted++;
    correct += p.correct; wrong += p.wrong;
    if(p.status==="mastered") mastered++;
    if(p.status==="due" || isOverdue(p)) revision++;
  });
  const acc = (correct+wrong) ? Math.round(correct/(correct+wrong)*100) : 0;
  const progressPct = qs.length ? Math.round((attempted/qs.length)*100) : 0;
  let strength = "Weak";
  if(progressPct === 0) strength = "New";
  else if(acc >= 90 && progressPct >= 80) strength = "Mastered";
  else if(acc >= 70) strength = "Strong";
  else if(acc >= 50) strength = "Average";
  else if(attempted>0) strength = "Developing";
  const meta = DB.topicMeta[chKey] || {};
  return {total:qs.length, attempted, correct, wrong, mastered, revision, acc, progressPct, strength, meta};
}

function allProgressList(){
  return DATA.map(q => ({q, p: getProg(q.id)}));
}

function overallStats(){
  const list = allProgressList();
  const attempted = list.filter(x=>x.p.attempts>0).length;
  const correct = list.reduce((s,x)=>s+x.p.correct,0);
  const wrong = list.reduce((s,x)=>s+x.p.wrong,0);
  const mastered = list.filter(x=>x.p.status==="mastered").length;
  const bookmarked = list.filter(x=>x.p.bookmarked).length;
  const dueToday = list.filter(x=>isDueToday(x.p)).length;
  const overdue = list.filter(x=>isOverdue(x.p)).length;
  const unanswered = DATA.length - attempted;
  return {
    total: DATA.length, attempted, unanswered, correct, wrong, mastered, bookmarked,
    dueToday, overdue, revisionDue: dueToday + overdue,
    accuracy: (correct+wrong) ? Math.round(correct/(correct+wrong)*100) : 0,
    totalSessions: DB.sessions.length,
    totalTimeSec: DB.sessions.reduce((s,x)=>s+(x.durationSec||0),0),
  };
}

function weakTopics(){
  return topicList().map(t=>({...t, stats: topicStats(t.key)}))
    .filter(t=>t.stats.attempted>0)
    .sort((a,b)=> a.stats.acc - b.stats.acc)
    .slice(0,3);
}

function repeatedMistakes(){
  return allProgressList()
    .filter(x=>x.p.wrong >= 2)
    .sort((a,b)=> b.p.wrong - a.p.wrong);
}

function priorityQueue(limit=6){
  const list = allProgressList();
  const items = [];
  list.forEach(({q,p})=>{
    let score = 0, reason = "";
    if(isOverdue(p)){ score = 100 + (p.wrong*2); reason = "মেয়াদোত্তীর্ণ পুনরাবৃত্তি"; }
    else if(isDueToday(p)){ score = 80 + (p.wrong*2); reason = "আজ পুনরাবৃত্তির দিন"; }
    else if(p.wrong >= 2){ score = 70 + p.wrong; reason = "বারবার ভুল হচ্ছে"; }
    else if(p.status === "weak"){ score = 50; reason = "দুর্বল প্রশ্ন"; }
    else if(p.attempts === 0){ score = 10; reason = "নতুন প্রশ্ন"; }
    else return;
    items.push({q,p,score,reason});
  });
  items.sort((a,b)=>b.score-a.score);
  return items.slice(0, limit);
}

function renderTodayPlan(){
  const s = overallStats();
  const weak = weakTopics();
  const tasks = [];
  if(s.overdue>0) tasks.push({id:"overdue", label:`মেয়াদোত্তীর্ণ রিভিশন (${s.overdue}টি)`, time:Math.min(30, s.overdue*2)});
  if(s.dueToday>0) tasks.push({id:"due", label:`আজকের রিভিশন (${s.dueToday}টি)`, time:Math.min(20, s.dueToday*2)});
  if(weak[0]) tasks.push({id:"weak", label:`দুর্বল বিষয়: ${weak[0].title}`, time:20});
  const rm = repeatedMistakes();
  if(rm.length) tasks.push({id:"mistakes", label:`বারবার ভুল প্রশ্ন (${rm.length}টি)`, time:15});
  tasks.push({id:"new", label:"নতুন প্রশ্ন অনুশীলন", time:15});
  const done = DB.studyPlanDone[todayStr()] || [];
  return `<div>${tasks.map(t=>`
    <label style="display:flex; align-items:center; gap:9px; padding:7px 0; font-size:13.5px; cursor:pointer">
      <input type="checkbox" data-plan-task="${t.id}" ${done.includes(t.id)?'checked':''} style="width:16px;height:16px">
      <span style="${done.includes(t.id)?'text-decoration:line-through;color:var(--ink-soft)':''}">${t.label}</span>
      <span class="small-muted" style="margin-left:auto">${t.time} মিনিট</span>
    </label>`).join("")}</div>`;
}

function wireNavButtons(main){
  $$("[data-nav]", main).forEach(b=>b.addEventListener("click", ()=> setView(b.dataset.nav)));
  $$("[data-open-q]", main).forEach(b=>b.addEventListener("click", ()=>{
    const q = DATA.find(x=>x.id===b.dataset.openQ);
    setView("topicDetail", {chapter:q.chapter, scrollTo:q.id});
  }));
  $$("[data-plan-task]", main).forEach(cb=>cb.addEventListener("change", ()=>{
    const t = todayStr();
    if(!DB.studyPlanDone[t]) DB.studyPlanDone[t] = [];
    const id = cb.dataset.planTask;
    if(cb.checked){ if(!DB.studyPlanDone[t].includes(id)) DB.studyPlanDone[t].push(id); }
    else { DB.studyPlanDone[t] = DB.studyPlanDone[t].filter(x=>x!==id); }
    save();
  }));
}

    <div class="filter-row" id="statusFilters">

        `<button class="chip-toggle ${VSTATE.filters.status===k?'active':''}" data-status="${k}">${l}</button>`).join("")}
    </div>
    <div id="qlist"></div>
  `;
  const listBox = $("#qlist", main);

  function draw(){
    let items = chQuestions.filter(q=>{
      const p = getProg(q.id);
      const st2 = p.status;
      if(VSTATE.filters.status !== "all"){
        if(VSTATE.filters.status === "due"){ if(!(isOverdue(p)||isDueToday(p)||st2==="due")) return false; }
        else if(st2 !== VSTATE.filters.status) return false;
      }
      if(VSTATE.filters.search){
        const s = VSTATE.filters.search.toLowerCase();
        const hay = (q.question + Object.values(q.options).join(" ") + (q.explanation||"")).toLowerCase();
        if(!hay.includes(s)) return false;
      }
      return true;
    });
    listBox.innerHTML = items.length ? items.map(q=>questionCardHTML(q)).join("") : emptyState("এই ফিল্টারে কোনো প্রশ্ন পাওয়া যায়নি।");

      const el = document.getElementById("q-"+VSTATE.scrollTo);
      if(el){ el.scrollIntoView({behavior:"smooth", block:"center"}); el.style.borderColor="var(--accent)"; }
      VSTATE.scrollTo = null;
    }
  }
  $("#topicSearch", main).addEventListener("input", (e)=>{ VSTATE.filters.search = e.target.value; draw(); });
  $$("#statusFilters .chip-toggle", main).forEach(b=>b.addEventListener("click", ()=>{
    VSTATE.filters.status = b.dataset.status;
    $$("#statusFilters .chip-toggle", main).forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    draw();
  }));
  $("[data-nav]", main).addEventListener("click", ()=> setView("topics"));
  draw();
  recordStudyDay();
}

// ===========================================================

function highlightSearch(text, term){
  if(!term) return escapeHtml(text);
  const esc = escapeHtml(text);
  const t = escapeHtml(term);
  try{
    return esc.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,"gi"), "<mark>$1</mark>");
  }catch(e){ return esc; }
}

function statusChip(status){
  const map = {
    new:["⚪ নতুন","status-new"], learning:["🔵 শিখছি","status-learning"], weak:["🟡 দুর্বল","status-weak"],
    due:["🔴 রিভিশন প্রয়োজন","status-due"], mastered:["🟢 আয়ত্তে","status-mastered"]
  };
  const [label,cls] = map[status] || map.new;
  return `<span class="status-chip ${cls}">${label}</span>`;
}

function questionCardHTML(q, opts={}){
  const p = getProg(q.id);
  const answered = p.lastResult !== null && opts.forceUnanswered !== true;
  const searchTerm = (VSTATE.filters && VSTATE.filters.search) || "";
  return `
  <div class="q-card" id="q-${q.id}" data-qid="${q.id}">
    <div class="q-top">
      <div class="q-meta">
        <span class="q-num">প্রশ্ন ${q.num}</span>
        ${q.tag? `<span class="pill blue">${q.tag}</span>`:''}
        ${statusChip(p.status)}
        ${p.bookmarked? `<span class="pill gold">⭐ বুকমার্ক</span>`:''}
        ${p.wrong>=2? `<span class="pill red">পুনরাবৃত্ত ভুল ×${p.wrong}</span>`:''}
      </div>
      <div class="small-muted">Source: p.${q.page}</div>
    </div>
    <div class="q-text">${highlightSearch(q.question, searchTerm)}</div>
    <div class="options" data-answered="${answered?1:0}">
      ${Object.entries(q.options).map(([key,val])=>{
        let cls = "opt";
        if(answered){
          cls += " disabled";
          if(key === q.answer) cls += " correct";
          else if(key === p.lastSelected) cls += " incorrect";
        } else if(key === p.lastSelected){
          cls += " selected";
        }
        return `<div class="${cls}" data-opt="${key}">
          <span class="opt-key">${key}</span><span>${highlightSearch(val, searchTerm)}</span>
        </div>`;
      }).join("")}
    </div>
    <div class="reveal-area">
      ${answered ? questionRevealHTML(q,p) : ""}
    </div>
  </div>`;
}

function questionRevealHTML(q,p){
  const correct = p.lastSelected === q.answer;
  return `
    <div class="q-result-banner ${correct?'ok':'no'}">${correct? '✓ সঠিক উত্তর!' : '✗ ভুল হয়েছে।'} সঠিক উত্তর: (${q.answer}) ${escapeHtml(q.options[q.answer])}</div>
    ${q.explanation? `<div class="explain-box"><b>ব্যাখ্যা:</b> ${escapeHtml(q.explanation)}</div>` : ""}
    ${q.flag? `<div class="flag-box">⚠ ${escapeHtml(q.flag)}</div>` : ""}
    <div class="source-line">Source: morality.pdf — page ${q.page} · প্রশ্ন আইডি: ${q.id}${p.nextReview? ` · পরবর্তী রিভিশন: ${fmtDate(p.nextReview)}`:''}</div>
    <div class="q-actions">
      <button class="act-btn ${p.status==='mastered'?'on mastered':''}" data-act="mastered" data-qid="${q.id}">🟢 মাস্টার্ড</button>
      <button class="act-btn ${(p.status==='due'||p.status==='weak')?'on revision':''}" data-act="revision" data-qid="${q.id}">🔴 রিভিশন দরকার</button>
      <button class="act-btn ${p.bookmarked?'on bm':''}" data-act="bookmark" data-qid="${q.id}">⭐ বুকমার্ক</button>
      <button class="act-btn" data-act="note" data-qid="${q.id}">📝 নোট</button>
      <button class="act-btn" data-act="retry" data-qid="${q.id}">↺ আবার চেষ্টা</button>
    </div>

      <div class="note-label">আমার নোট (Source Content নয়)</div>
      <textarea data-note-input="${q.id}" placeholder="ব্যক্তিগত নোট লিখুন…">${escapeHtml(p.note||"")}</textarea>
    </div>
  `;
}

function wireQuestionCards(root){
  $$(".q-card", root).forEach(card=>{
    const qid = card.dataset.qid;
    const q = DATA.find(x=>x.id===qid);
    const optsWrap = $(".options", card);
    if(optsWrap.dataset.answered === "0"){
      $$(".opt", optsWrap).forEach(opt=>{
        opt.addEventListener("click", ()=>{
          selectAnswer(q, opt.dataset.opt, card);
        });
      });
    }
    wireRevealActions(card, q);
  });
}

function selectAnswer(q, key, card){
  const p = getProg(q.id);
  p.attempts += 1;
  p.lastSelected = key;
  p.lastResult = key === q.answer ? "correct" : "incorrect";
  if(key === q.answer) p.correct += 1; else p.wrong += 1;
  scheduleNext(q.id, key===q.answer ? "correct-high" : "incorrect");
  recordStudyDay();
  render_ifQuizSessionActive(q, key===q.answer);
  // full safe re-render avoids duplicate event listeners on other cards
  render();
  const el = document.getElementById("q-"+q.id);
  if(el) el.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function wireRevealActions(card, q){
  $$("[data-act]", card).forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const act = btn.dataset.act;
      const p = getProg(q.id);
      if(act === "mastered"){ manualStatus(q.id, p.status==='mastered' ? "learning" : "mastered"); toast(p.status==='mastered'?"পুনরায় শেখার তালিকায় যোগ হলো":"আয়ত্তে এসেছে হিসেবে চিহ্নিত হলো"); }
      if(act === "revision"){ manualStatus(q.id, p.status==='due' ? "learning" : "due"); toast("রিভিশন স্ট্যাটাস আপডেট হয়েছে"); }
      if(act === "bookmark"){ p.bookmarked = !p.bookmarked; save(); toast(p.bookmarked? "বুকমার্ক যোগ হলো":"বুকমার্ক সরানো হলো"); }
      if(act === "note"){ const nb = document.getElementById("note-"+q.id); nb.style.display = nb.style.display==="none"?"block":"none"; }
      if(act === "retry"){ p.lastResult = null; p.lastSelected = null; save(); }
      render();
    });
  });
  $$("[data-note-input]", card).forEach(ta=>{
    ta.addEventListener("blur", ()=>{
      const p = getProg(ta.dataset.noteInput);
      p.note = ta.value;
      save();
    });
  });
}

function setActive(main, sel, btn){ $$(sel+" .chip-toggle", main).forEach(x=>x.classList.remove("active")); btn.classList.add("active"); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildPool(scope, poolType){
  let base = scope==="all" ? DATA : DATA.filter(q=>q.chapter===scope);
  base = base.filter(q=>{
    const p = getProg(q.id);
    switch(poolType){
      case "due": return isOverdue(p)||isDueToday(p)||p.status==="due";
      case "wrong": return p.wrong>0;
      case "unanswered": return p.attempts===0;
      case "bookmarked": return p.bookmarked;
      case "mastered": return p.status==="mastered";
      case "weak": return p.status==="weak";
      default: return true;
    }
  });
  return base.map(q=>q.id);
}

function startQuizSession({pool, shuffleOpts=true, label="কুইজ", examMode=false, timeLimitSec=null}){
  const state = {
    session: {
      ids: pool, idx:0, answers:{}, marked:{}, selections:{}, startedAt: Date.now(),
      shuffleOpts, examMode, label, timeLimitSec,
      optOrder: {} // per-question shuffled option order
    }
  };
  setView("quizSession", state);
}

function currentSessionQuestion(){
  const s = VSTATE.session;
  return DATA.find(q=>q.id === s.ids[s.idx]);
}

  const isAnswered = s.selections[q.id] !== undefined;
  const revealed = !s.examMode && isAnswered;

      if(remain<=0){ clearInterval(window._examTick); finishSession(); }
    }, 1000);
  }
}
function sel_correct(q,s){ return s.selections[q.id] === q.answer; }

function finishSession(){
  clearInterval(window._examTick);
  const s = VSTATE.session;
  const total = s.ids.length;
  let correct=0, wrong=0, unanswered=0;
  const wrongIds = [];
  s.ids.forEach(id=>{
    if(s.selections[id]===undefined){ unanswered++; return; }
    const q = DATA.find(x=>x.id===id);
    if(s.selections[id]===q.answer) correct++; else { wrong++; wrongIds.push(id); }
    if(s.examMode){
      const p = getProg(id);
      p.attempts+=1; p.lastSelected = s.selections[id]; p.lastResult = s.selections[id]===q.answer?"correct":"incorrect";
      if(s.selections[id]===q.answer) p.correct+=1; else p.wrong+=1;
      scheduleNext(id, s.selections[id]===q.answer?"correct-high":"incorrect");
    }
  });
  const timeSec = Math.round((Date.now()-s.startedAt)/1000);
  const record = {id:uid(), date:todayStr(), scope:s.label, count:total, correct, wrong, unanswered, timeSec};
  DB.quizHistory.push(record);
  DB.sessions.push({id:uid(), date:todayStr(), topic:s.label, durationSec:timeSec, correct, wrong, attempted: total-unanswered});
  recordStudyDay();
  save();
  VSTATE.result = {total, correct, wrong, unanswered, timeSec, wrongIds, label:s.label};
  setView("quizResults", VSTATE);
}

  }).map(q=>q.id));
  if(!VSTATE.qr || VSTATE.qr.pool !== pool){ /* fresh */ }

  if(qr.idx >= qr.pool.length){

  main.innerHTML = `
    <div class="focus-header">
      <div class="page-title" style="font-size:17px">⚡ দ্রুত রিভিশন — ${qr.idx+1}/${qr.pool.length}</div>

        <div class="q-actions">
          <button class="act-btn" id="qrKnow">✓ জানতাম</button>

          <button class="act-btn" id="qrNeed">🔴 রিভিশন দরকার</button>
          <button class="act-btn" id="qrMastered">🟢 মাস্টার্ড</button>
        </div>
      `}
    </div>

  const rb = $("#qrReveal", main);
  if(rb) rb.addEventListener("click", ()=>{ qr.revealed = true; render(); });

    qr.idx++; qr.revealed=false; render();

}

function renderLastMinute(main){
  const rm = repeatedMistakes().map(x=>x.q.id);
  const overdue = allProgressList().filter(x=>isOverdue(x.p)).map(x=>x.q.id);
  const weak = allProgressList().filter(x=>x.p.status==="weak").map(x=>x.q.id);
  const bm = allProgressList().filter(x=>x.p.bookmarked).map(x=>x.q.id);
  const merged = [...new Set([...rm, ...overdue, ...weak, ...bm])];
  const pool = merged.length ? merged : shuffle(DATA.map(q=>q.id)).slice(0,15);
  main.innerHTML = `
    <div class="page-head">
      <div class="page-title">🚨 শেষ মুহূর্তের রিভিশন</div>
      <div class="page-sub">"যদি আমার পরীক্ষা আগামীকাল হয়, আমি সবার আগে কী রিভিশন করবো?" — বারবার ভুল, মেয়াদোত্তীর্ণ, দুর্বল ও বুকমার্ক করা প্রশ্নগুলো একত্রে সাজানো হয়েছে।</div>
    </div>
    <div class="panel">
      <div style="font-size:14px; margin-bottom:10px">মোট <b>${pool.length}টি</b> সর্বোচ্চ-অগ্রাধিকার প্রশ্ন প্রস্তুত।</div>
      <button class="btn primary" id="lmStart">▶ এখনই শুরু করুন (দ্রুত রিভিশন মোডে)</button>
    </div>
    <div>${pool.slice(0,25).map(id=>{
      const q = DATA.find(x=>x.id===id); const p = getProg(id);
      return `<div class="priority-item">
        <div class="priority-text">
          <b>প্রশ্ন ${q.num}</b> — ${escapeHtml(q.question.slice(0,80))}${q.question.length>80?'…':''}
          <div class="priority-meta">${q.chapterTitle.split(':')[0]} ${p.wrong? `· ভুল ×${p.wrong}`:''} ${p.bookmarked?'· ⭐':''}</div>
        </div>
      </div>`;
    }).join("")}</div>
  `;
  $("#lmStart", main).addEventListener("click", ()=>{
    setView("quick", {qr: {pool: shuffle(pool), idx:0, revealed:false, _init:true}});
  });
}

  const dayCounts = last14.map(d=> DB.sessions.filter(x=>x.date===d).length);
  const maxc = Math.max(1, ...dayCounts);
  main.innerHTML = `
    <div class="page-head">
      <div class="page-title">📊 প্রোগ্রেস ও অ্যানালিটিক্স</div>
    </div>
    <div class="grid grid-4" style="margin-bottom:16px">
      <div class="stat-card accent"><div class="stat-num">${Math.round(s.totalTimeSec/60)}</div><div class="stat-label">মোট স্টাডি মিনিট</div></div>
      <div class="stat-card"><div class="stat-num">${s.totalSessions}</div><div class="stat-label">স্টাডি সেশন</div></div>
      <div class="stat-card"><div class="stat-num">${s.accuracy}%</div><div class="stat-label">সামগ্রিক সঠিক উত্তরের হার</div></div>
      <div class="stat-card blue"><div class="stat-num">${DB.streak.days.length}</div><div class="stat-label">মোট স্টাডি দিন</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">গত ১৪ দিনের কার্যকলাপ</div>
      <div style="display:flex; align-items:flex-end; gap:5px; height:70px">
        ${dayCounts.map((c,i)=>`<div title="${last14[i]}: ${c} সেশন" style="flex:1; background:${c?'var(--accent)':'var(--line)'}; height:${Math.max(6,(c/maxc)*100)}%; border-radius:3px 3px 0 0"></div>`).join("")}

    </div>
    <div class="panel">
      <div class="panel-title">অধ্যায়ভিত্তিক অগ্রগতি</div>
      ${topics.map(t=>`
        <div style="margin-bottom:14px">
          <div style="display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px">
            <b>${t.title.split(':')[0]}</b>
            <span class="small-muted">${t.stats.attempted}/${t.stats.total} উত্তর দেওয়া · ${t.stats.acc}% সঠিক · ${t.stats.strength}</span>
          </div>
          <div class="strength-bar"><div class="strength-fill" style="width:${t.stats.progressPct}%"></div></div>
        </div>`).join("")}
    </div>
    <div class="panel">
      <div class="panel-title">কুইজের ইতিহাস</div>
      ${DB.quizHistory.length? DB.quizHistory.slice(-8).reverse().map(h=>`
        <div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line)">
          <span>${h.scope} · ${fmtDate(h.date)}</span>
          <span>${h.correct}/${h.count} সঠিক (${Math.round(h.correct/h.count*100)}%)</span>
        </div>`).join("") : `<div class="small-muted">এখনও কোনো কুইজ সম্পন্ন হয়নি।</div>`}

function setTheme(mode){
  DB.settings.theme = mode; save(); applyTheme();
  render();
}
function applyTheme(){
  const mode = DB.settings.theme;
  const dark = mode==="dark" || (mode==="system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark?"dark":"light");
}

function exportProgress(){
  const payload = {
    exportedAt: new Date().toISOString(), app:"Morality Study System", version:2,
    progress: DB.progress, topicMeta: DB.topicMeta, sessions: DB.sessions,
    quizHistory: DB.quizHistory, streak: DB.streak, notes: DB.notes,
    settings: DB.settings, studyPlanDone: DB.studyPlanDone,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `morality-progress-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("এক্সপোর্ট সম্পন্ন হয়েছে");
}

function importProgress(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data !== "object" || !data.progress){
        toast("❌ অবৈধ ফাইল — ইম্পোর্ট ব্যর্থ হয়েছে"); return;
      }
      DB.progress = Object.assign(DB.progress, data.progress||{});
      DB.topicMeta = Object.assign(DB.topicMeta, data.topicMeta||{});
      DB.sessions = [...DB.sessions, ...(data.sessions||[])];
      DB.quizHistory = [...DB.quizHistory, ...(data.quizHistory||[])];
      if(data.streak) DB.streak = data.streak;
      DB.notes = Object.assign(DB.notes, data.notes||{});
      save();
      toast("✓ ইম্পোর্ট সম্পন্ন হয়েছে");
      render();
    }catch(err){
      toast("❌ ফাইল পড়তে সমস্যা হয়েছে — এটি বৈধ JSON নয়");
    }
  };
  reader.readAsText(file);
}

// ===========================================================
// GLOBAL SEARCH
// ===========================================================
function runGlobalSearch(term){
  if(!term.trim()) return;
  const hits = DATA.filter(q=>{
    const p = getProg(q.id);
    const hay = (q.question+" "+Object.values(q.options).join(" ")+" "+(q.explanation||"")+" "+(p.note||"")).toLowerCase();
    return hay.includes(term.toLowerCase());
  });
  VSTATE = {filters:{status:"all", search:term}};
  const main = $("#mainInner");
  main.innerHTML = `
    <div class="page-head">
      <div class="page-title">🔍 অনুসন্ধান ফলাফল: "${escapeHtml(term)}"</div>
      <div class="page-sub">${hits.length}টি প্রশ্ন পাওয়া গেছে</div>
    </div>
    ${hits.length ? hits.map(q=>questionCardHTML(q)).join("") : emptyState("কোনো ফলাফল পাওয়া যায়নি।")}
  `;
  wireQuestionCards(main);
}

// ===========================================================
// KEYBOARD SHORTCUTS
// ===========================================================
document.addEventListener("keydown", (e)=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea") return;
  if(VIEW === "quizSession" && VSTATE.session){
    const q = currentSessionQuestion();
    if(["1","2","3","4"].includes(e.key)){
      const order = VSTATE.session.optOrder[q.id] || Object.keys(q.options);
      const key = order[parseInt(e.key)-1];
      if(key){ const opt = document.querySelector(`.opt[data-opt="${key}"]`); if(opt) opt.click(); }
    }
    if(e.key === "Enter"){ const nb = document.getElementById("nextQ"); if(nb) nb.click(); }
    return;
  }
  if(e.key === "/" ){ e.preventDefault(); const sb = document.getElementById("globalSearchInput"); if(sb) sb.focus(); }
});

// MOBILE NAV
// ===========================================================
function openMobileNav(){ $(".sidebar").classList.add("open"); $("#mobileOverlay").classList.add("show"); }
function closeMobileNav(){ $(".sidebar").classList.remove("open"); $("#mobileOverlay").classList.remove("show"); }

// ===========================================================
// INIT
// ===========================================================
function init(){
  applyTheme();
  $("#globalSearchInput").addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){ runGlobalSearch(e.target.value); }
  });
  $("#mobileMenuBtn").addEventListener("click", openMobileNav);
  $("#mobileOverlay").addEventListener("click", closeMobileNav);
  $("#themeToggleBtn").addEventListener("click", ()=>{
    const cur = DB.settings.theme === "dark" ? "light" : "dark";
    setTheme(cur);
  });
  render();
}
document.addEventListener("DOMContentLoaded", init);
