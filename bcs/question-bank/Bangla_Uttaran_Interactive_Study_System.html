d":"q268"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.1","st":"বাক্য","n":3,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"'তিনি কথা বললেন না।'-বাক্যটির অস্তিবাচক রূপ কী হবে?","o":["তিনি কথা বলতে চাইলেন না।","তিনি কথা না বলে থাকতে পারলেন না।","তিনি নীরব থাকতে চেষ্টা করলেন।","তিনি চুপ করে থাকলেন।"],"a":3,"e":"","p":34,"id":"q269"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.1","st":"বাক্য","n":4,"exam":"৪৭তম বিসিএস","q":"বাক্যের মধ্যে শব্দ অবস্থান করে কীভাবে?","o":["কর্তা ও ক্রিয়ার পদবিন্যাস অনুযায়ী","অর্থ ও ভাব অনুযায়ী","বর্গ বা গুচ্ছ আকারে","স্বাধীন পদের পরিচয় নিয়ে"],"a":0,"e":"বাংলা ভাষায় কর্তা, কর্ম ও ক্রিয়া একটি নির্দিষ্ট ক্রম অনুযায়ী পদগুলোকে সাজানো হয়। এই আদর্শ হলো বাংলা বাক্যে অন্তত একটি কর্তা এবং একটি ক্রিয়া থাকবেই। এছাড়া মুখ্য ও গৌণ কর্মও মূলত বিশেষ্য। ড. পবিত্র সরকার বলেছেন, ইংরেজিতে যেমন- Subject + Verb + Object অর্থাৎ SVO; বাংলায় তেমনি Subject + Object + Verb (SOV)। অর্থাৎ কর্তা + কর্ম + ক্রিয়া।","p":34,"id":"q270"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.1","st":"বাক্য","n":5,"exam":"৪৪তম বিসিএস","q":"নিচের কোনটি যৌগিক বাক্য?","o":["দোষ স্বীকার করলে তোমাকে শাস্তি দেওয়া হবে না।","তিনি বেড়াতে এসে কেনাকাটা করলেন।","মহৎ মানুষ বলে সবাই তাঁকে সম্মান করেন।","ছেলেটি চঞ্চল তবে মেধাবী।"],"a":3,"e":"গঠন অনুযায়ী বাক্য তিন প্রকার: ১। সরল বাক্য: যে বাক্যে একটি মাত্র কর্তা (উদ্দেশ্য) এবং একটি মাত্র সমাপিকা ক্রিয়া (বিধেয়) থাকে, তাকে সরল বাক্য বলে। যথা- পুকুরে পদ্মফুল জন্মে। এখানে 'পদ্মফুল' উদ্দেশ্য এবং 'জন্মে' বিধেয়। মা ছিল না বলে কেউ তার চুল বেঁধে দেয়নি। ২। জটিল/মিশ্র বাক্য: একটি পূর্ণবাক্যে যখন একটি প্রধান খণ্ডবাক্যের সাথে এক বা একাধিক আশ্রিত বাক্য পরস্পর সাপেক্ষভাবে ব্যবহৃত হয়, তখন তাকে জটিল/মিশ্র বাক্য বলে। প্রতিটি খণ্ড বাক্যের পরে কমা (,) বসে। জটিল বা মিশ্র বাক্যে সাধারণত যে-সে, যা-তা, যখন-তখন, যেখানে-সেখানে, যেমন-তেমন, যদি-তবে/তাহলে, যদি না, যদিও-তথাপি, যিনি-তিনি, যত-তত, যেহেতু-তাই/সেহেতু থাকে এবং বাক্যটি পরস্পর নির্ভরশীল (সাপেক্ষ) থাকে। যেমন- (ক) যে পরিশ্রম করে, সেই সুখ লাভ করে (আশ্রিত বাক্য/প্রধান বাক্য)। (খ) যিনি বিধান, তিনি সর্বত্র আদরণীয়। ৩। যৌগিক বাক্য: পরস্পর নিরপেক্ষ দুই বা ততোধিক সরল বা মিশ্র বাক্য মিলিত হয়ে একটি সম্পূর্ণ বাক্য গঠন করলে তাকে যৌগিক বাক্য বলে। যৌগিক বাক্যে সাধারণত এবং, ও, আর, আবার, কিন্তু, অথবা, নতুবা, অথচ, বরং, তথাপি, নচেৎ, নাহলে, তাই, ফলে, সুতরাং, এ কারণে, নয়তো, অতএব, কিংবা, তবেই/তবে ইত্যাদি থাকে। যেমন- (ক) ছেলেটি চঞ্চল তবে মেধাবী। (খ) তার বয়স বেড়েছে কিন্তু বুদ্ধি বাড়েনি। এখানে নিরপেক্ষ/সরল দুটি বাক্য 'কিন্তু' অব্যয় দিয়ে যুক্ত।","p":34,"id":"q271"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.1","st":"বাক্য","n":6,"exam":"৪৩তম বিসিএস","q":"'তাতে সমাজজীবন চলে না।'-এ বাক্যটির অস্তিবাচক রূপ কোনটি?","o":["তাতে সমাজজীবন চলে।","তাতে না সমাজজীবন চলে।","তাতে সমাজজীবন অচল হয়ে পড়ে।","তাতে সমাজজীবন সচল হয়ে পড়ে।"],"a":2,"e":"বাক্যে 'না', 'নয়', 'নহে', 'নি', 'নেই', 'নাহি', 'নাই' ইত্যাদি নঞর্থক অব্যয়যোগে অস্তিবাচক বাক্যের বিধেয় ক্রিয়াকে (সমাপিকা ক্রিয়াকে) নেতিবাচক বাক্যে রূপান্তর করা হয়। যেমন: নেতিবাচক বাক্য: 'তাতে সমাজজীবন চলে না।' এর অস্তিবাচক বাক্য: তাতে সমাজজীবন অচল হয়ে পড়ে। অনুরূপভাবে নেতিবাচক বাক্য: মন নিচুতে নামতে চায় না। এর অস্তিবাচক বাক্য: মন নিচুতে নামতে অনিচ্ছুক।","p":35,"id":"q272"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.1","st":"বাক্য","n":7,"exam":"৪৩তম বিসিএস","q":"'যিনি বিধান, তিনি সর্বত্র আদরণীয়।'-এটি কোন ধরনের বাক্য?","o":["সরল বাক্য","জটিল বাক্য","যৌগিক বাক্য","খণ্ড বাক্য"],"a":1,"e":"","p":35,"id":"q273"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.1","st":"বাক্য","n":8,"exam":"৪২তম বিসিএস","q":"বাক্যের দুটি অংশ থাকে-","o":["প্রসাদগুণ, মাধুর্যগুণ","উপমা, অলংকার","উদ্দেশ্য, বিধেয়","সাধু, চলিত"],"a":2,"e":"প্রতিটি বাক্যে দুটি অংশ থাকে। যথা: (১) উদ্দেশ্য ও (২) বিধেয়। বাক্যের যে অংশে কাউকে উদ্দেশ্য করে কিছু বলা হয়, তাকে উদ্দেশ্য এবং উদ্দেশ্য সম্বন্ধে যা বলা হয়, তাকে বিধেয় বলে। যেমন: খোকা এখন (উদ্দেশ্য) বই পড়ছে (বিধেয়)।","p":35,"id":"q274"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.1","st":"বাক্য","n":9,"exam":"৪১তম বিসিএস","q":"'এবার আমার একটি বিচিত্র অভিজ্ঞতা হলো'-এ বাক্য কোন ধরনের?","o":["অনুজ্ঞাবাচক","নির্দেশাত্মক","বিস্ময়বোধক","প্রশ্নবোধক"],"a":1,"e":"অর্থ অনুসারে বাক্য ৫ প্রকার। যথা- ১. বিবৃতিমূলক বা নির্দেশাত্মক বাক্য: যে বাক্যের সাহায্যে কোনো কিছু বর্ণনা বা বিবৃতি করা হয় তাকে বলা হয় নির্দেশবাচক/বিবরণমূলক/নির্দেশাত্মক বাক্য। এ নির্দেশবাচক বাক্যকে নির্দেশমূলক বাক্য, নির্দেশসূচক বাক্য, বিবৃতিমূলক বাক্য প্রভৃতিও বলা হয়। যেমন- এবার আমার একটি বিচিত্র অভিজ্ঞতা হলো, সে একটি গল্পের বই পড়ছে ইত্যাদি। বিবৃতিমূলক বাক্য আবার দুই প্রকার- (ক) অস্তিবাচক বাক্য: যে বাক্যে হ্যাঁ বাচক শব্দ থাকে বা সমর্থনের মাধ্যমে কোনো কিছু বর্ণনা করা হয় তাকে অস্তিবাচক বাক্য বলে। যেমন- রহিম আগামীকাল আসবে। (খ) নেতিবাচক বাক্য: যে বাক্যে কোনো ঘটনার অস্বীকৃতি বা না-সূচক অর্থ বোঝায় তাকে নেতিবাচক বাক্য বলে। যেমন- ফারিয়া কোনো কথা বলল না। ২. প্রশ্নসূচক বাক্য: যে বাক্যে কোনো কিছুর সম্পর্কে প্রশ্ন বা জিজ্ঞাসা করা হয় তাকে প্রশ্নসূচক বাক্য বলে। যেমন- তুমি কোন শ্রেণিতে পড়? ৩. প্রার্থনাসূচক বাক্য: যে বাক্যে বক্তার কিছু প্রার্থনা বা কামনা প্রকাশ পায় তাকে প্রার্থনাসূচক বাক্য বলে। যেমন- খোদা তোমার মঙ্গল করুন। ৪. আদেশসূচক বাক্য: যে বাক্যে আদেশ, উপদেশ, অনুরোধ, নিষেধ ইত্যাদি নির্দেশ করা হয় তাকে আদেশসূচক বা অনুজ্ঞাসূচক বাক্য বলে। যেমন- বল বীর বল উন্নত মম শির। ৫. আবেগসূচক/বিস্ময়সূচক বাক্য: যে বাক্যে বিস্ময়, আনন্দ বা হর্ষ-বিষাদ, শোক, ঘৃণা, ভয়, ক্রোধ ইত্যাদি প্রকাশ করা হয় তাকে আবেগসূচক বাক্য বলে। যেমন- সে আজ যাবে!","p":35,"id":"q275"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.1","st":"বাক্য","n":10,"exam":"৪১তম বিসিএস","q":"ধ্বনিতত্ত্ব ও শব্দতত্ত্বকে বাক্যে যথাযথভাবে ব্যবহার করার বিধানের নামই-","o":["রসতত্ত্ব","রূপতত্ত্ব","বাক্যতত্ত্ব","ক্রিয়ার কাল"],"a":2,"e":"ব্যাকরণের আলোচ্য বিষয় ৪টি। যথা- (১) ধ্বনিতত্ত্ব, (২) রূপতত্ত্ব/শব্দতত্ত্ব, (৩) বাক্যতত্ত্ব/পদক্রম, (৪) অর্থতত্ত্ব। একাধিক শব্দ কী নিয়মে যুক্ত হয়ে বৃহত্তর এককসমূহ (যাদের মধ্যে বাক্য প্রধানতম একক) গঠন করে এবং এই বৃহত্তর এককগুলোর বৈশিষ্ট্য কী, সেটাই বাক্যতত্ত্বের আলোচ্য বিষয়। মূল কথা, ধ্বনিতত্ত্ব ও শব্দতত্ত্বকে বাক্যে যথাযথভাবে ব্যবহার করার বিধানের নামই বাক্যতত্ত্ব। এছাড়াও এক ধরনের বাক্যকে অন্য ধরনের বাক্যে রূপান্তর, বাক্যের বাচ্য, উক্তি, কারক বিশ্লেষণ, বাক্যের যোগ্যতা, বাক্যের উপাদান লোপ, যতিচিহ্ন প্রভৃতিও বাক্যতত্ত্বে আলোচিত হয়ে থাকে।","p":35,"id":"q276"},{"c":4,"ct"  বিসিএস","q":"বাক্যের ক্ষুদ্রতম একক কোনটি?","o":["শব্দ","বর্ণ","ধ্বনি","চিহ্ন"],"a":0,"e":"শব্দ: বাক্যের ক্ষুদ্রতম একক। বর্ণ: ধ্বনির লিখিত রূপ। ধ্বনি: শব্দের মৌলিক একক। বাক্য: কয়েকটি শব্দ পাশাপাশি বসে যখন বক্তার মনের ভাব সম্পূর্ণরূপে প্রকাশ করে তাকে বাক্য বলে।","p":37,"id":"q288"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.1","st":"বাক্য","n":23,"exam":"১৭তম বিসিএস","q":"'হজরত মুহম্মদ (স) ছিলেন একজন আদর্শ মানব' বাক্যটি নিম্নোক্ত একটি শ্রেণির-","o":["মিশ্র","জটিল","যৌগিক","সরল"],"a":3,"e":"এটি সরল বাক্য। কারণ বাক্যটিতে একটি কর্তা ও একটি সমাপিকা ক্রিয়া রয়েছে।","p":37,"id":"q289"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.1","st":"বাক্য","n":24,"exam":"১৪তম বিসিএস","q":"যৌগিক বাক্যের অন্যতম গুণ কি?","o":["একটি জটিল ও একটি সরল বাক্যের সাহায্যে বাক্য গঠন","একটি সংযুক্ত ও একটি বিযুক্ত বাক্যের সাহায্যে বাক্য গঠন","দুটি সরল বাক্যের সাহায্যে বাক্য গঠন","দুটি মিশ্র বাক্যের সাহায্যে বাক্য গঠন"],"a":2,"e":"","p":37,"id":"q290"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.1","st":"বাক্য","n":25,"exam":"১০তম বিসিএস","q":"গুরুচণ্ডালী দোষমুক্ত কোনটি?","o":["শবপোড়া","মড়াদাহ","শবদাহ","শবমড়া"],"a":2,"e":"শব্দের যোগ্যতার সঙ্গে যেসব বিষয় জড়িত- (ক) দুর্বোধ্যতা: অপ্রচলিত, দুর্বোধ্য শব্দ ব্যবহার করলে বাক্যের যোগ্যতা বিনষ্ট হয়। যেমন- অশুদ্ধ: তুমি আমার সঙ্গে প্রপঞ্চ করেছো। শুদ্ধ: তুমি আমার সঙ্গে প্রতারণা করেছো। (খ) উপমার ভুল প্রয়োগ: ঠিকভাবে উপমা অলংকারের ব্যবহার না করলে যোগ্যতার হানি ঘটে। যেমন- অশুদ্ধ: আমার হৃদয়-মন্দিরে আশার বীজ উপ্ত হলো। শুদ্ধ: আমার হৃদয়-ক্ষেত্রে আশার বীজ উপ্ত হলো। (গ) বাহুল্য-দোষ: প্রয়োজনের অতিরিক্ত শব্দ ব্যবহারে বাহুল্য দোষ ঘটে। যেমন- অশুদ্ধ: সব পণ্ডিতগণই এ বিষয়ে একমত। শুদ্ধ: সব পণ্ডিতই এ বিষয়ে একমত। (ঘ) গুরুচণ্ডালী দোষ: সাধু-চলিত মিশ্রণ, তৎসম শব্দের সঙ্গে দেশি শব্দের মিশ্রণে গুরুচণ্ডালী দোষ সৃষ্টি করে। যেমন- অশুদ্ধ: মড়াদাহ (দেশি + তৎসম), শবপোড়া, গরুর শকট। শুদ্ধ: মড়া পোড়া (দেশি + দেশি), শবদাহ, গরুর গাড়ি।","p":37,"id":"q291"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.2","st":"বাচ্য","n":1,"exam":"৪১তম বিসিএস","q":"'ডিঙি টেনে বের করতে হবে।'-কোন ধরনের বাক্যের উদাহরণ?","o":["কর্মবাচ্য","ভাববাচ্য","যৌগিক","কর্মকর্তৃবাচ্য"],"a":1,"e":"বাক্যের বিভিন্ন ধরনের প্রকাশ ভঙ্গিকেই বাচ্য বলে। বাচ্য ৩ প্রকার- ১. কর্তৃবাচ্য: যে বাচ্যে কর্তার অর্থ প্রাধান্য পায় এবং ক্রিয়াপদ কর্তার অনুসারী হয় তাকে কর্তৃবাচ্য বলে। যেমন- ছাত্ররা অঙ্ক করছে। ২. কর্মবাচ্য: যে বাক্যে কর্মের সাথে ক্রিয়ার সম্পর্ক প্রধানভাবে প্রকাশিত হয়, তাকে কর্মবাচ্য বলে। যেমন- শিকারি কর্তৃক ব্যাঘ্র নিহত হয়েছে। ৩. ভাব বাচ্য: যে বাচ্যে কর্ম থাকে না এবং বাক্যে ক্রিয়ার অর্থই বিশেষভাবে ব্যক্ত হয় তাকে ভাববাচ্য বলে। ভাববাচ্যের ক্রিয়া সর্বদাই নাম পুরুষের হয় এবং কর্তায় ষষ্ঠী, দ্বিতীয়া অথবা তৃতীয়া বিভক্তি যুক্ত হয়। যেমন- আমার (কর্তায় ষষ্ঠী) খাওয়া হলো না, আমাকে (কর্তায় দ্বিতীয়া) এখন যেতে হবে। ডিঙি টেনে বের করতে হবে (কখনও ভাববাচ্যে কর্তা উহ্য থাকে)। কর্মকর্তৃবাচ্য- যে বাক্যে কর্মপদই কর্তৃস্থানীয় হয়ে বাক্য গঠন করে তাই কর্মকর্তৃবাচ্য। যেমন- বাঁশি বাজে ঐ মধুর লগনে।","p":37,"id":"q292"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.3","st":"উক্তি","n":1,"exam":"৪১তম বিসিএস","q":"'বাবা ছেলের দীর্ঘায়ু কামনা করলেন'- এই পরোক্ষ উক্তির প্রত্যক্ষরূপ হবে:","o":["বাবা ছেলেকে বললেন, বাবা তুমি দীর্ঘজীবী হও","বাবা ছেলেকে বললেন যে, তোমার দীর্ঘায়ু হোক","বাবা ছেলেকে বললেন, \"তুমি দীর্ঘজীবী হও\"","বাবা ছেলেকে বললেন যে, আমি তোমার দীর্ঘায়ু কামনা করি"],"a":2,"e":"কোনো কিছু বলার নামই উক্তি। উক্তি ২ প্রকার- (ক) প্রত্যক্ষ উক্তি: যে বাক্যে বক্তার কথা অবিকল উদ্ধৃত হয়, তাকে প্রত্যক্ষ উক্তি বলে। যেমন- তিনি বললেন, \"বইটা আমার দরকার।\" (খ) পরোক্ষ উক্তি: যে বাক্যে বক্তার উক্তি অন্যের জবানিতে রূপান্তরিতভাবে প্রকাশিত হয়, তাকে পরোক্ষ উক্তি বলে। যেমন- তিনি বললেন যে, বইটা তার দরকার। প্রত্যক্ষ উক্তিতে বক্তার বক্তব্যটুকু উদ্ধরণচিহ্নের (\" \") ভিতরে অন্তর্ভুক্ত থাকে। পরোক্ষ উক্তিতে উদ্ধরণ চিহ্ন লোপ পায়। প্রথম উদ্ধরণ চিহ্ন স্থানে 'যে' এই সংযোজক অব্যয়টি ব্যবহার করতে হয়। বাক্যের সংগতি রক্ষার জন্য উক্তিতে ব্যবহৃত বক্তার পুরুষের পরিবর্তন করতে হয়। যেমন- পরোক্ষ উক্তি: 'বাবা ছেলের দীর্ঘায়ু কামনা করলেন।' প্রত্যক্ষ উক্তি: বাবা ছেলেকে বললেন, \"তুমি দীর্ঘজীবী হও\"।","p":37,"id":"q293"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.4","st":"যতি বা বিরাম চিহ্নের ব্যবহার","n":1,"exam":"৩৩তম বিসিএস","q":"কোনটি 'কোলন'?","o":[";",":","=","\" \""],"a":1,"e":"যতি বা বিরাম বা ছেদ চিহ্নের জনক ঈশ্বরচন্দ্র বিদ্যাসাগর। তিনি সর্বপ্রথম ১৮৪৭ সালে বেতালপঞ্চবিংশতি গ্রন্থে যতি চিহ্নের ব্যবহার করেন। বাংলা ভাষায় প্রচলিত যতি বা বিরাম চিহ্ন ১৩টি। যতিচিহ্নগুলো হলো: কমা (,), উদ্ধরণ (\" \")- ১ বলতে যে সময়; সেমিকোলন (;)- ১ বলার দ্বিগুণ সময়; দাঁড়ি (।), প্রশ্নবোধক চিহ্ন (?), কোলন (:), কোলন ড্যাশ (:-), ড্যাশ (-), বিস্ময় ও সম্বোধন (!)- ১ সেকেন্ড; হাইফেন (-), ইলেক ('), প্রথম বন্ধনী (), দ্বিতীয় বন্ধনী {}, তৃতীয় বন্ধনী [], সংক্ষেপণ (.), বিকল্প (/) এবং সমান (=)- থামার প্রয়োজন নেই।","p":38,"id":"q294"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.4","st":"যতি বা বিরাম চিহ্নের ব্যবহার","n":2,"exam":"২৩তম বিসিএস","q":"নিচের কোনটিতে বিরামচিহ্ন যথাযথভাবে ব্যবহৃত হয়নি?","o":["ডিসেম্বর ১৬, ১৯৭১","২৬ মার্চ, ১৯৭১","ঢাকা, ২১ ফেব্রুয়ারি ১৯৫২","পয়লা বৈশাখ, চৌদ্দশো সাত"],"a":2,"e":"বাংলা ব্যাকরণের নিয়ম অনুযায়ী, তারিখ লেখার সময় মাসের পর কমা (,) ব্যবহার করতে হয়। এছাড়া ঠিকানা বা স্থানের নামের পর তারিখ থাকলে স্থানের নামের পরেও কমা বসে। কিন্তু অপশন 'গ'-তে 'ফেব্রুয়ারি' মাসের পর কমা ব্যবহার করা হয়নি (ঢাকা, ২১ ফেব্রুয়ারি ১৯৫২), যা বিরামচিহ্নের ভুল প্রয়োগ। সুতরাং, সঠিক রূপটি হবে: ঢাকা, ২১ ফেব্রুয়ারি, ১৯৫২।","p":38,"id":"q295"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":1,"exam":"৫০তম বিসিএস","q":"'আকাশ ও পৃথিবীর অন্তরাল' এক কথায় প্রকাশ করলে সঠিক উত্তর কী হবে?","o":["স্ফুলিঙ্গ","রোদসী","পীতাভ","আরক্ত"],"a":1,"e":"এক কথায় প্রকাশ: আকাশ ও পৃথিবীর অন্তরাল = রোদসী; অগ্নির ফুলকি = স্ফুলিঙ্গ; ঈষৎ পীত/ ঈষৎ পীতবর্ণ = পীতাভ; ঈষৎ রক্তবর্ণ = আরক্ত।","p":38,"id":"q296"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":2,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"'যে আলোতে কুমুদ ফোটে'-এককথায় কী হবে?","o":["কুমুদিন","কৌমুদী","প্রভাবতী","বিভা"],"a":1,"e":"যে আলোতে কুমুদ ফোটে = কৌমুদী। কৌমুদী শব্দের অর্থ চাঁদের আলো, জ্যোৎস্না। এটি একটি বিশেষ্য পদ।","p":38,"id":"q297"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":3,"exam":"৪৪তম বিসিএস","q":"কোনটি 'জিগীষা'র সম্প্রসারিত প্রকাশ?","o":["জানিবার ইচ্ছা","জয় করিবার ইচ্ছা","হনন করিবার ইচ্ছা","যুদ্ধ করিবার ইচ্ছা"],"a":1,"e":"জয় করার ইচ্ছা = জিগীষা, জানিবার ইচ্ছা = জিজ্ঞাসা, হনন করিবার ইচ্ছা = জিঘাংসা, যুদ্ধ করিবার ইচ্ছা = যুযুৎসা।","p":38,"id":"q298"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":4,"exam":"৪৪তম বিসিএস","q":"'মৃত্তিকা দিয়ে তৈরি'- কথাটি সংকোচন করলে হবে-","o":["তন্ময়","মন্ময়","মৃন্ময়","চিন্ময়"],"a":2,"e":"মৃত্তিকা দিয়ে তৈরি বাক্যটির সংকোচন করলে হয় মৃন্ময়। মৃন্ময় শব্দের অর্থ হচ্ছে আত্মবাদী, আত্মপ্রকাশক। চিন্ময় একটি বিশেষণ পদ যার অর্থ জ্ঞানময়, চৈতন্যময়।","p":38,"id":"q299"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":5,"exam":"৪৩তম, ৪০তম বিসিএস","q":"'জিজীবিষা' শব্দটির অর্থ কী?","o":["জীবননাশের ইচ্ছা","বেঁচে থাকার ইচ্ছা","জীবনকে জানার ইচ্ছা","জীবন-জীবিকার পথ"],"a":1,"e":"জিজীবিষা- বেঁচে থাকার ইচ্ছা। জিজীবিষু = বেঁচে থাকতে ইচ্ছুক।","p":38,"id":"q300"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":6,"exam":"৪২তম বিসিএস","q":"উদ্বাসন শব্দের অর্থ কী?","o":["বাসভূমি থেকে বিতাড়িত হওয়া","বাসভূমির সমুখস্থ ভূমি","অজ্ঞাত বিষয় প্রকাশ করা","বিকাশ"],"a":0,"e":"","p":39,"id":"q301"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":7,"exam":"৪২তম বিসিএস","q":"'যিনি ন্যায়শাস্ত্র জানেন' এর এককথায় প্রকাশিত রূপ হলো-","o":["ন্যায়বাগীশ","নৈয়ায়িক","ন্যায়পাল","ন্যায়শুদ্ধ"],"a":1,"e":"যিনি ন্যায়শাস্ত্র জানেন- এর এককথায় প্রকাশিত রূপ হলো- নৈয়ায়িক। ন্যায়পাল: সুইডিশ ভাষায় Ombudsman। ন্যায়পাল বলতে এমন একজন সরকারি মুখপাত্র বা প্রতিনিধি কিংবা সরকারি কর্মকর্তাকে বুঝায় যিনি সরকারি কর্তৃপক্ষের বিরুদ্ধে আনীত অভিযোগ তদন্ত করেন।","p":39,"id":"q302"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":8,"exam":"৪০তম বিসিএস","q":"'প্রোষিতভর্তৃকা'-শব্দটির অর্থ কী?","o":["ভর্ৎসনাপ্রাপ্ত","যে নারীর স্বামী বিদেশে অবস্থান করে","ভূমিতে প্রোথিত তরুমূল","যে বিবাহিতা নারী পিত্রালয়ে অবস্থান করে"],"a":1,"e":"একক কথায় প্রকাশ: যে নারীর স্বামী বিদেশে অবস্থান করে- প্রোষিতভর্তৃকা। যে নারী (বিবাহিত বা অবিবাহিত) চিরকাল পিতৃগৃহবাসিনী-চিরন্টী। যে পুরুষের স্ত্রী বিদেশে থাকে- প্রোষিতপত্নীক বা প্রোষিতভার্যা। ভর্ৎসনাপ্রাপ্ত যে নারী- ভর্ৎসিতা। যে নারীর স্বামী ও পুত্র নেই- অবীরা। যে নারীর এখনো বিয়ে হয়নি- অনূঢ়া। যে নারীর সম্প্রতি বিয়ে হয়েছে- নবোঢ়া।","p":39,"id":"q303"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":9,"exam":"৪০তম বিসিএস","q":"অন্যের রচনা থেকে চুরি করাকে বলা হয়-","o":["বেতসবৃত্তি","পতঙ্গবৃত্তি","জলৌকাবৃত্তি","কুম্ভিলকবৃত্তি"],"a":3,"e":"যে ব্যক্তি অন্যের রচনার ভাব বা ভাষা নিজের নামে চালায় তাকে কুম্ভিলক বলে। কুম্ভিলক- এর ইংরেজি পরিভাষা plagiarist। অন্যের রচনা থেকে চুরি করাকে তাই এককথায় বলে কুম্ভিলকবৃত্তি।","p":39,"id":"q304"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":10,"exam":"২৫তম বিসিএস","q":"'নট হওয়ার স্বভাব যার' এক কথায় হবে-","o":["নিদাঘ","নশ্বর","নটীমান","বিনশ্বর"],"a":1,"e":"'নট হওয়ার স্বভাব যার'-এর এককথায় প্রকাশ হবে নশ্বর। নশ্বর-এর অপর অর্থ হলো নাশশীল, অনিত্য বা অস্থায়ী। অন্যদিকে নিদাঘ অর্থ গ্রীষ্মকাল বা উত্তাপ, নটমান অর্থ নট হয়ে যাচ্ছে যা এবং বিনশ্বর অর্থ বিনাশধর্মী বা অনিত্য।","p":39,"id":"q305"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":11,"exam":"২৪তম, ১৭তম বিসিএস","q":"'অক্ষির সমীপে'-এর সংক্ষেপণ হলো-","o":["সমক্ষ","পরোক্ষ","প্রত্যক্ষ","নিরপেক্ষ"],"a":0,"e":"'অক্ষির সমীপে'-এর সংক্ষেপণ হলো সমক্ষ। অন্যদিকে, 'অক্ষির সম্মুখে' হলো প্রত্যক্ষ, 'অক্ষির অগোচরে' হলো পরোক্ষ এবং 'পক্ষপাতহীন বা মুখাপেক্ষী নয় এমন' হলো নিরপেক্ষ।","p":39,"id":"q306"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":12,"exam":"২১তম বিসিএস","q":"'কর্মে যাহার ক্লান্তি নাই' এই বাক্যাংশের সংক্ষিপ্ত রূপ কি?","o":["ক্লান্তিহীন","অক্লান্ত","অক্লান্তকর্মী","অবিশ্রাম"],"a":2,"e":"কর্মে যাহার ক্লান্তি নেই- অক্লান্তকর্মী। ক্লান্তি নেই যার- অক্লান্ত।","p":39,"id":"q307"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.5","st":"এক কথায় প্রকাশ","n":13,"exam":"২০তম বিসিএস","q":"'যা সহজে অতিক্রম করা যায় না'-এ বাক্যাংশের সংক্ষিপ্ত রূপ কি?","o":["অনতিক্রম্য","অলজ্য","দূরতিক্রম্য","দুর্গম"],"a":2,"e":"যা সহজে অতিক্রম করা য ্ছে 'ভেড়া' কিংবা 'মেষ'। এই গড্ডল হয়েই বাংলায় 'গাড়ল' কথাটিও জন্মেছে। কাজেই, 'গড্ডলিকা' বলতে বুঝায় একটা মেষ দলে সামনে থাকা আধ্যয়ন মেষটিকে এবং বাকি ভেড়ারা অন্ধভাবে তাকে অনুসরণ করে আর দলটা একটি নদীর মতো বইতে বইতে এগোতে থাকে। এরই অনুপ্রেরণায় যখন কেউ অন্ধভাবে, নিজে কোনও বিবেচনা না করে, সবাই করছে দেখে কোনও কাজে নিয়োজিত হয়, তখন 'গড্ডলিকা প্রবাহ', 'মেষদল', 'ভেড়ার পাল' এই সমস্ত কথাগুলো ব্যবহার হয়।","p":40,"id":"q314"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.6","st":"বাগ্‌ধারা","n":2,"exam":"৪৪তম বিসিএস","q":"'ইতরবিশেষ' বলতে বোঝায়-","o":["দুর্বৃত্ত","চালাকি","পার্থক্য","অপদার্থ"],"a":2,"e":"ইতরবিশেষ একটি বিশেষ্য পদ যার অর্থ পার্থক্য। অপরদিকে দুর্বৃত্ত বলতে বোঝায় দুষ্ট স্বভাব, দুর্জন, দুশ্চরিত্র, দুরাত্মা। চালাকি শব্দের অর্থ চাতুরী, ধূর্তামি, ফন্দি। অপদার্থ শব্দের অর্থ অসার, অযোগ্য।","p":40,"id":"q315"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.6","st":"বাগ্‌ধারা","n":3,"exam":"৪৪তম, ১১তম বিসিএস","q":"'অর্ধচন্দ্র' কথাটির অর্থ-","o":["অমাবস্যা","গলাধাক্কা দেওয়া","কাছে টানা","কাস্তে"],"a":1,"e":"অর্ধচন্দ্র (বিশেষ্য) এর শাব্দিক অর্থ: অর্ধ প্রকাশিত চন্দ্র। বাগধারা হিসেবে অর্থ: গলাধাক্কা দেয়া। অমাবস্যা হচ্ছে কৃষ্ণপক্ষের শেষ তিথি এবং এর আরেকটি অর্থ হচ্ছে ঘোর অন্ধকার রাতি। কাছে টানা বলতে বোঝায় কাউকে নিকটে টানা। কাস্তে হলো একটি যন্ত্র যা শস্য কাটার কাজে ব্যবহৃত হয়।","p":40,"id":"q316"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.6","st":"বাগ্‌ধারা","n":4,"exam":"৪৩তম বিসিএস","q":"'সপ্তকাণ্ড রামায়ণ' বাগধারার অর্থ কী?","o":["রামায়ণের সাত পর্ব","রামায়ণে বর্ণিত বৃক্ষ","রামায়ণে বর্ণিত সাতটি সমুদ্র","বৃহৎ বিষয়"],"a":3,"e":"সপ্তকাণ্ড রামায়ণ বাগধারাটির অর্থ- বৃহৎ বিষয়। বাল্মীকি রচিত রামায়ণ ২৪ হাজার শ্লোকের বিশাল বড় মহাকাব্য। এটি সাতটি বৃহৎ কাণ্ড বা অধ্যায়ে বিভক্ত। যথা: আদিকাণ্ড, অযোধ্যাকাণ্ড, অরণ্যকাণ্ড, কিষ্কিন্ধ্যাকাণ্ড, সুন্দরকাণ্ড, লঙ্কাকাণ্ড বা যুদ্ধকাণ্ড ও উত্তরকাণ্ড। এজন্য বৃহৎ বিষয় বোঝাতে সপ্তকাণ্ড রামায়ণ বলা হয়। যেমন: সপ্তকাণ্ড রামায়ণ না আউড়ে আসল কথাটা বল।","p":40,"id":"q317"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.6","st":"বাগ্‌ধারা","n":5,"exam":"৪০তম বিসিএস","q":"শরতের শিশির- বাগধা xam":"১২তম বিসিএস","q":"বাগধারা যুগলদের মধ্যে কোন জোড়া সর্বাধিক সমার্থক বাচক?","o":["অমাবস্যার চাঁদ; আকাশ কুসুম","বক ধার্মিক; বিড়াল তপস্বী","রুই-কাতলা; কেউ কেটা","বক ধার্মিক; ভিজে বেড়াল"],"a":1,"e":"বক ধার্মিক (ভণ্ড), বিড়াল তপস্বী (ভণ্ড)। অমাবস্যার চাঁদ (অদৃশ্য বস্তু), আকাশ কুসুম (অসম্ভব কল্পনা)। রুই-কাতলা (নেতৃস্থানীয় ব্যক্তিবর্গ), কেউ কেটা (সামান্য), ভিজে বেড়াল (কপটচারী)। অর্থাৎ বক ধার্মিক ও বিড়াল তপস্বী শব্দযুগল সর্বাধিক সমার্থবাচক।","p":42,"id":"q336"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.7","st":"প্রবাদ-প্রবচন","n":1,"exam":"৪২তম বিসিএস","q":"'উলুবনে মুক্তা ছড়ানো' প্রচলিত এমন শব্দগুচ্ছকে বলে-","o":["প্রবাদ-প্রবচন","এককথায় প্রকাশ","ভাবসম্প্রসারণ","বাক্য সংকোচন"],"a":0,"e":"উলুবনে মুক্তা ছড়ানো প্রচলিত এমন শব্দগুচ্ছকে বলা হয় প্রবাদ-প্রবচন। উলুবনে মুক্তা ছড়ানো অর্থ- অস্থানে মূল্যবান দ্রব্য প্রদান। যার ইংরেজি- To cast pearls before swine.","p":42,"id":"q337"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.7","st":"প্রবাদ-প্রবচন","n":2,"exam":"১৪তম বিসিএস","q":"কোন প্রবচনটি 'হতভাগ্য' অর্থে ব্যবহৃত?","o":["আট কপালে","উড়নচণ্ডী","ছা-পোষা","ভূষণ্ডির কাক"],"a":0,"e":"আট কপালে- হতভাগ্য; উড়নচণ্ডী- অমিতব্যয়ী; ছা-পোষা- পোষ্য ভারাক্রান্ত; ভূষণ্ডির কাক- দীর্ঘায়ু ব্যক্তি।","p":42,"id":"q338"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.7","st":"প্রবাদ-প্রবচন","n":3,"exam":"১৩তম বিসিএস","q":"কোন বাক্যে 'ঢাক ঢাক গুড় গুড়' প্রবাদটির বিশেষ অর্থ প্রকাশ পেয়েছে?","o":["ঢাক ঢাক গুড় গুড় করে কি লাভ, কাজে লেগে যাও","ঢাক ঢাক গুড় গুড় করে কি লাভ, আসল কথাটি বল","ঢাক ঢাক গুড় গুড় করে কি লাভ, কি খাবে বল","ঢাক ঢাক গুড় গুড় করে কি লাভ, নিজের পায়ে দাঁড়াও"],"a":1,"e":"ঢাক ঢাক গুড় গুড় বাগধারাটির অর্থ লুকোচুরি। ঢাক ঢাক গুড় গুড় করে কি লাভ, আসল কথা বল- বাক্যটিতেই শুধু এই অর্থ প্রকাশ পেয়েছে। ঢাকঢোল পেটানো = প্রচারণা, চি টি পড়া অর্থ- দুর্নাম রটনা।","p":42,"id":"q339"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.7","st":"প্রবাদ-প্রবচন","n":4,"exam":"১০তম বিসিএস","q":"'উভয়কূল রক্ষা' অর্থে ব্যবহৃত প্রবচন কোনটি?","o":["কারো পৌষ মাস, কারো সর্বনাশ","চাল না চুলো, ঢেঁকী না কুলো","সাপও মরে, লাঠিও না ভাঙে","বোঝার উপর, শাকের আঁটি"],"a":2,"e":"সাপও মরে, লাঠিও না ভাঙে- উভয়কূল রক্ষা। 'কারো পৌষমাস কারও সর্বনাশ'- কারও সুদিন কারও দুর্দিন। 'চাল না চুলো, ঢেঁকি না কুলো'- নিতান্ত গরিব। 'বোঝার উপর শাকের আঁটি'- অতিরিক্তের অতিরিক্ত।","p":42,"id":"q340"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.7","st":"প্রবাদ-প্রবচন","n":5,"exam":"১০তম বিসিএস","q":"কোন প্রবচন বাক্য ব্যবহারিক দিক হতে সঠিক?","o":["যত গর্জে তত বৃষ্টি হয় না","অধিক সন্ন্যাসীতে গাজন নষ্ট","নাচতে না জানলে উঠোন ভাঙা","যেখানে বাঘের ভয় সেখানে বিপদ হয়"],"a":1,"e":"অধিক সন্ন্যাসীতে গাজন নষ্ট- এটিই শুধু সঠিক। অর্থ কোনো কাজে অনাবশ্যক বেশি কর্মী জুটলে মতভেদের কারণে সে কাজ পণ্ড হয়ে যায়। 'যত গর্জে তত বর্ষে না', 'নাচতে না জানলে উঠোন বাঁকা', 'যেখানে বাঘের ভয় সেখানে রাত হয়' প্রবচন বাক্যগুলো ব্যবহারিক দিক হতে সঠিক নয়।","p":43,"id":"q341"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.8","st":"প্রয়োগ-অপপ্রয়োগ ও বাক্য শুদ্ধি","n":1,"exam":"৫০তম বিসিএস","q":"কোন বাক্যটি প্রয়োগগত দিক থেকে শুদ্ধ?","o":["মাছ আকাশে উড়ে।","তাঁর খুব আনন্দ পেল।","আবশ্যক ব্যয়ে কার্পণ্য অনুচিত।","সকল ছাত্রগণ পাঠে মনোযোগী।"],"a":2,"e":"অপশন (ক)-তে 'মাছ আকাশে উড়ে'-এই বাক্যে সার্থক বাক্যের ৩টি গুণের (আকাঙ্ক্ষা, আসত্তি, যোগ্যতা) মধ্যে আসত্তির অভাব রয়েছে। 'তাঁর খুব আনন্দ পেল'-এটি একটি অসম্পূর্ণ বাক্য। 'সকল ছাত্রগণ পাঠে অমনোযোগী'-এই বাক্যে বাহুল্য দোষ রয়েছে। সুতরাং, ব্যাকরণ সম্মত ও সঠিক বাক্য 'আবশ্যক ব্যয়ে কার্পণ্য অনুচিত।'","p":43,"id":"q342"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.8","st":"প্রয়োগ-অপপ্রয়োগ ও বাক্য শুদ্ধি","n":2,"exam":"৪৯তম বিসিএস (শিক্ষা)","q":"'সত্যকে স্বীকার করতে অনেক ব্যক্তিরাই চায়না।' এখানে ভুল ঘটেছে-","o":["বানান ও প্রত্যয়ের","অর্থ ও বচনের","অর্থ ও প্রত্যয়ের","বানান ও বচনের"],"a":3,"e":"বানানের ভুল: চায়না (বিশেষ্য)- চায় না (ক্রিয়াপদ + না-সূচক অব্যয়)। বচনের ভুল: অনেক ব্যক্তিরাই-অনেক ব্যক্তিই। সুতরাং, বাক্যটির সঠিক রূপ হবে: সত্যকে স্বীকার করতে অনেক ব্যক্তিই চায় না।","p":43,"id":"q343"},{"c":4,"ct":"বাক্যতত্ত্ব","s":"4.8","st":"প্রয়োগ-অপপ্রয়োগ ও বাক্য শুদ্ধি","n":3,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"শুদ্ধ বাক্য কোনটি?","o":["সারা দেশব্যাপী দিবসটি উদ্‌যাপন কর অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":1,"exam":"৫০তম বিসিএস","q":"'ফিকা কমলা রং'-এখানে ফিকা অর্থ কী?","o":["অনুজ্জ্বল","উজ্জ্বল","তীব্র","ঝাঁঝালো"],"a":0,"e":"'ফিকা' বা ফ্যাকাশে বলতে সাধারণত কোনো রঙের হালকা, অনুজ্জ্বল বা বিবর্ণ অবস্থাকে বোঝায়। বাংলা একাডেমি আধুনিক বাংলা অভিধান অনুযায়ী, এটি উজ্জ্বলতার অভাব বা রং চটে যাওয়া অবস্থাকে নির্দেশ করে।","p":45,"id":"q357"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":2,"exam":"৫০তম বিসিএস","q":"কোনটি 'ভাত' এর প্রতিশব্দ?","o":["অলিপিক","প্রভঞ্জন","মহি","তণ্ডুল"],"a":3,"e":"ভাত এর প্রধান প্রতিশব্দ হলো অন্ন, ওদন। এছাড়াও তণ্ডুল চাল বা ভাত অর্থে ব্যবহৃত হয়। অন্যদিকে, প্রভঞ্জন শব্দের অর্থ হলো- প্রবল বায়ু, ঝড়, প্রচণ্ড বাতাস ইত্যাদি।","p":45,"id":"q358"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":3,"exam":"৫০তম বিসিএস","q":"'স্বর্গ' শব্দের সঠিক সমার্থক শব্দজোড়া কোনটি?","o":["হরিদশ্ব, বিবদান","ক্ষিতি, উর্বী","দিনমণি, দিন নাথ","ত্রিদিব, সুরপুর"],"a":3,"e":"স্বর্গ অর্থ দেবলোক, সুরলোক, অমরধাম ইত্যাদি। (ঘ) ত্রিদিব ও সুরপুর- ত্রিদিব অর্থ তিন জগতের ঊর্ধ্বলোক অর্থাৎ স্বর্গ এবং সুরপুর অর্থ দেবতাদের পুরী বা স্বর্গ। অন্যান্য অপশনের ক্ষেত্রে- (ক) হরিদশ্ব (সূর্য), বিবদান (মেঘ)-স্বর্গের সমার্থক নয়। (খ) ক্ষিতি (পৃথিবী), উর্বী (পৃথিবী)-পৃথিবীর সমার্থক, স্বর্গের নয়। (গ) দিনমণি (সূর্য), দিননাথ (সূর্য)-সূর্যের সমার্থক। সুতরাং, সঠিক উত্তর (ঘ) ত্রিদিব, সুরপুর।","p":45,"id":"q359"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":4,"exam":"৪৯তম বিসিএস (শিক্ষা)","q":"'মৃগয়া' শব্দের মৃগ বলতে কি বোঝানো হয়?","o":["বানর","সিংহ","পশু","বন"],"a":2,"e":"'মৃগ' অর্থ 'পশু' বা 'হরিণ'। 'মৃগয়া' শব্দের অর্থ- হরিণ শিকার; বন্য পশুপাখি শিকার।","p":45,"id":"q360"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":5,"exam":"৪৯তম বিসিএস (শিক্ষা)","q":"'এ কাজ করতে আমি বদ্ধ পরিকর'-এখানে 'পরিবার' শব্দের অর্থ কী?","o":["খাস","প্রতিজ্ঞা","কোমর","প্রতিশ্রুত"],"a":2,"e":"প্রশ্নে 'পরিবারের' পরিবর্তে 'পরিকর' হবে। বদ্ধপরিকর শব্দের আভিধানিক অর্থ হলো- দৃঢ়প্রতিজ্ঞ, কঠোর প্রতিজ্ঞা, দৃঢ়সংকল্প, কোনো কাজ করার জন্য উঠেপড়ে লেগেছে এমন বোঝায়। সংস্কৃত 'বদ্ধ' এবং 'পরিকর' শব্দ সহযোগে গঠিত শব্দ হলো 'বদ্ধপরিকর'। ব্যুৎপত্তিগতভাবে 'বদ্ধ' শব্দের অর্থ হলো, 'বাঁধা' আর 'পরিকর' শব্দের একাধিক অর্থের মধ্যে একটি হলো, কোমর বা কটিবদ্ধ, কোমরবন্ধনী। সেই হিসেবে বদ্ধপরিকর শব্দের আক্ষরিক অর্থ হয় কোমর বা কটিবদ্ধ বাঁধা। সংস্কৃত থেকে জাত কোমরবদ্ধনী বাঁধা প্রসঙ্গটিই কালক্রমে দৃঢ়প্রতিজ্ঞ অর্থরূপে পরিগ্রহ করেছে। বাংলা একাডেমি আধুনিক বাংলা অভিধান অনুসারে, বাক্যটি 'এ কাজ করতে আমি বদ্ধ পরিকর'-এখানে 'পরিকর' শব্দের অর্থ কোমর। 'বদ্ধ পরিকর' মানে কোমর বেঁধে প্রস্তুত হওয়া বা দৃঢ় সংকল্প করা।","p":45,"id":"q361"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":6,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"'আফতাব' শব্দের সমার্থক শব্দ কোনটি?","o":["অর্ণব","রাহুল","অর্ক","জলধি"],"a":2,"e":"আফতাব অর্থ সূর্য। এর সমার্থক শব্দ অর্ক।","p":45,"id":"q362"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":7,"exam":"৪৭তম বিসিএস","q":"'নিত্য তোমার যে ফুল ফোটে ফুলবনে' এখানে 'নিত্য' শব্দের প্রতিশব্দ কোনটি?","o":["অতিশয়","চিরন্তন","প্রকৃতি","অহরহ"],"a":3,"e":"'নিত্য তোমার যে ফুল ফোটে ফুলবনে' এটি একটি ঈশ্বরচেতন গান। এই গানে 'নিত্য' শব্দের অর্থ হলো 'অবিরাম' বা 'সবসময়' ঘটেছে এমন অর্থ প্রকাশ করেছে। অহরহ শব্দটির অর্থ হলো 'প্রতিদিন' বা 'সর্বদা', যা 'নিত্য' এর সাথে সঙ্গতিপূর্ণ।","p":46,"id":"q363"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":8,"exam":"৪৬তম বিসিএস","q":"'নদী'র সমার্থ শব্দ কোনটি?","o":["সিন্ধু","হিল্লোল","তটিনী","নির্ঝর"],"a":2,"e":"নদী এর সমার্থক শব্দগুলো হলো: জলপ্রবাহ, সরিৎ, প্রবাহিণী, শৈবালিনী, স্রোতস্বিনী, স্রোতবতী, তরঙ্গিণী, তটিনী, নদ, গাঙ, নির্ঝরিণী, কল্লোলিনী ইত্যাদি। সিন্ধু অর্থ- সাগর, নির্ঝর অর্থ- ঝরনা, হিল্লোল অর্থ- ঢেউ।","p":46,"id":"q364"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":9,"exam":"৪৫তম, ৩৯তম বিসিএস","q":"'তাম্বুলিক' শব্দের সমার্থক নয় কোনটি?","o":["পান-ব্যবসায়ী","পর্ণকার","তামসিক","বারুই"],"a":2,"e":"তাম্বুলিক শব্দের অর্থ পান-ব্যবসায়ী, পর্ণকার, বারুই। তামসিক শব্দের অর্থ মেঘাচ্ছন্ন, অজ্ঞতাপ্রসূত।","p":46,"id":"q365"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":10,"exam":"৪৪তম বিসিএস","q":"নিচের কোনটি 'অগ্নি'র সমার্থক শব্দ নয়?","o":["বহ্নি","আবীর","বায়ুসখা","বৈশ্বানর"],"a":1,"e":"অগ্নির কয়েকটি সমার্থক শব্দ হলো: আগুন, বহ্নি, অনল, হুতাশন, পাবক, বায়ুসখা, বৈশ্বানর, দাহন, সর্বভুক ইত্যাদি। অপরদিকে আবীর হলো একপ্রকার রক্তবর্ণ চূর্ণ বিশেষ যা হোলি বা বসন্তোৎসবে পরস্পরকে রঞ্জিত করতে ব্যবহার করা হয়।","p":46,"id":"q366"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":11,"exam":"৪১তম বিসিএস","q":"'কুসীদজীবী' বলতে কাদের বুঝায়?","o":["চারণকবি","সাপুড়ে","সুদখোর","কৃষিজীবী"],"a":2,"e":"কুসীদজীবী শব্দের অর্থ সুদে টাকা ধার দেওয়া যার পেশা।","p":46,"id":"q367"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":12,"exam":"৪০তম বিসিএস","q":"'অভিরাম' শব্দের অর্থ কী?","o":["বিরামহীন","বালিশ","চলন","সুন্দর"],"a":3,"e":"'অভিরাম' শব্দটি সংস্কৃত উপসর্গ 'অভি' যোগে গঠিত। এর অর্থ মনোহর, সুন্দর, তৃপ্তিদায়ক। বিরামহীন শব্দের অর্থ বিরতিহীন। বালিশ শব্দের অর্থ উপাদান। চলন অর্থ গমন, ভ্রমণ, প্রথা, ধারা, রীতি, রেওয়াজ।","p":46,"id":"q368"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":13,"exam":"৪০তম বিসিএস","q":"'উর্ণনাভ' শব্দটি দিয়ে বুঝায়-","o":["টিকটিকি","তেলাপোকা","উইপোকা","মাকড়সা"],"a":3,"e":"উর্ণনাভ সংস্কৃত শব্দ, অর্থ মাকড়সা। টিকটিকি শব্দটি আলংকারিক অর্থে গোয়েন্দা বোঝায়। আরশোলার প্রতিশব্দ তেলাপোকা। বাল্মীকি অর্থ উইপোকার ঢিবি/উইয়ের ঢিবি।","p":46,"id":"q369"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":14,"exam":"৩৯তম বিসিএস","q":"'আগুন'-এর সমার্থক শব্দ কোনটি?","o":["ভাতি","অনল","অংশু","জ্যোতি"],"a":1,"e":"ভাতি, অংশু ও জ্যোতি হলো 'কিরণ' শব্দের সমার্থক শব্দ।","p":46,"id":"q370"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.1","st":"সমার্থক বা প্রতিশব্দ","n":15,"exam":"৩৮তম বিসিএস","q":"'সূর্য' শব্দের সমার্থক শব্দ কোনটি?","o":["অর্ণব","অর্ক","প্রসূন","পল্লব"],"a":1,"e":"সূর্য এর প্রতিশব্দ: রবি, ভানু, আফতাব, ভাস্কর, আদিত্য, দিবাকর, তপন, দিনমণি, মার্তণ্ড, অর্ঘ্যমা, অর্ক, পুষা, সবিতা, ্ছেদবিদ্যা।","p":51,"id":"q423"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.3","st":"পারিভাষিক শব্দ","n":17,"exam":"২৬তম বিসিএস","q":"Ballad কি?","o":["লোকগীতি","লোকগাঁথা","গীতিকা","গাথা"],"a":2,"e":"Ballad শব্দের বাংলা পরিভাষা 'গীতি-কাহিনি কাব্য' বা 'গীতিকা'। এই শব্দটি ল্যাটিন Balare থেকে এসেছে। ইউরোপে প্রাচীনকালে নাচের সাথে যে কবিতা গীত হতো তাকেই 'Ballad' বা গীতিকা বলা হতো।","p":51,"id":"q424"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.3","st":"পারিভাষিক শব্দ","n":18,"exam":"১৬তম বিসিএস","q":"Intellectual শব্দের বাংলা অর্থ-","o":["বুদ্ধিমান","মননশীল","বুদ্ধিজীবী","মেধাবী"],"a":2,"e":"Intellectual- শব্দের অর্থ বুদ্ধিজীবী, মনীষী। 'বুদ্ধিমান' এর ইংরেজি- intelligent, 'মেধাবী'-এর ইংরেজি talented, 'মননশীল'-এর ইংরেজি thoughtful।","p":51,"id":"q425"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.3","st":"পারিভাষিক শব্দ","n":19,"exam":"১৫তম বিসিএস","q":"Wisdom শব্দের বাংলা অর্থ-","o":["জ্ঞান","বুদ্ধি","মেধা","প্রজ্ঞা"],"a":3,"e":"Wisdom শব্দটির অর্থ প্রজ্ঞা, প্রাজ্ঞতা, বিজ্ঞতা, গভীর ও বিস্তৃত জ্ঞান, বিচক্ষণতা। Knowledge অর্থ জ্ঞান, Intelligence অর্থ বুদ্ধি, Intellect অর্থ মেধা।","p":51,"id":"q426"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.4","st":"ছন্দ বা অলংকার","n":1,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"ছড়ার ছন্দকে কী বলে?","o":["স্বরবৃত্ত","মাত্রাবৃত্ত","অক্ষরবৃত্ত","গদ্যছন্দ"],"a":0,"e":"যে ছন্দ যুগ্মধনি সব সময় একমাত্রা গণনা করা হয় এবং প্রত্যেক পর্বের প্রথম শব্দের আদিতে শ্বাসাঘাত পড়ে তাকে স্বরবৃত্ত ছন্দ বলে। স্বরবৃত্তে মুক্তাক্ষর ও বদ্ধাক্ষর সর্বত্র একমাত্রা হয়। স্বরবৃত্ত ছন্দকে-দলবৃত্ত বা লৌকিক বা ছড়ার ছন্দ বা খশাঘাত প্রধান ছন্দ বা প্রাকৃত বাংলার ছন্দ বলা হয়। ছড়া সাধারণত স্বরবৃত্ত ছন্দে লেখা হয়। এই ছন্দে মূল পর্বে মাত্রার সংখ্যা ৪।","p":51,"id":"q427"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.4","st":"ছন্দ বা অলংকার","n":2,"exam":"৪৫তম বিসিএস","q":"স্বরান্ত অক্ষরকে কী বলে?","o":["একাক্ষর","মুক্তাক্ষর","বদ্ধাক্ষর","যুক্তাক্ষর"],"a":1,"e":"যেসব অক্ষর স্বরধ্বনিজাত বা অক্ষরের শেষে একটি স্বরধ্বনি থাকে, তাকে স্বরান্ত অক্ষর বা মুক্তাক্ষর বলে। যেমন, 'দা' > দ - আ; 'কা' > ক - আ ইত্যাদি। যে শব্দাংশের শেষে স্বর থাকে না অর্থাৎ ব্যঞ্জন থাকে তাকে বদ্ধাক্ষর বলে। যেমন- কলম = ক + লম্‌। শব্দটিতে 'লম' একটি বদ্ধাক্ষর কারণ এর শেষে ব্যঞ্জনবর্ণ আছে।","p":52,"id":"q428"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.4","st":"ছন্দ বা অলংকার","n":3,"exam":"৪৪তম বিসিএস","q":"'দেশের যত নদীর ধারা জল না, ওরা অশ্রুধারা।'-এই উক্তিটি নিচের কোন পারিভাষিক অলংকার দ্বারা শোভিত?","o":["অপহ্নুতি","যমক","অর্থোন্মিলন","অভিযোজন"],"a":0,"e":"প্রকৃতকে/উপমেয়কে অস্বীকার/গোপন/নিষেধ করে উপমানকে প্রতিষ্ঠিত করাকে অপহ্নুতি অলংকার বলে। এখানে সাধারণত দুভাবে নিষেধ হয়ে থাকে। (১) না, নাহ, নয় প্রভৃতি না সূচক অব্যয় ব্যবহার করে। (২) ছলনা, ছল, ছদ্ম প্রভৃতি সত্য গোপনকারী শব্দ ব্যবহার করে। যেমন: \"তারাই আজি নিঃস্ব দেশে, কাঁদছে হয়ে অন্নহারা; দেশের যত নদীর ধারা জল না ওরা অশ্রু ধারা।\" - কাজী নজরুল ইসলাম। উপমেয় 'জল', উপমান 'অশ্রু'। কবি এখানে না সূচক অব্যয় ব্যবহার করে উপমেয়কে অস্বীকার করে উপমানকে প্রতিষ্ঠিত করেছেন। তাই এখানে অপহ্নুতি অলংকার হয়েছে। অন্যদিকে, একই শব্দ একই স্বরধ্বনিতে একই ক্রমানুসারে ভিন্ন অর্থে একাধিকবার ব্যবহারে যমক অলংকার সৃষ্টি হয়। যেমন- 'ভারত ভারত খ্যাত আপনার গুণে।'","p":52,"id":"q429"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.4","st":"ছন্দ বা অলংকার","n":4,"exam":"৩৭তম বিসিএস","q":"যুক্তাক্ষর এক মাত্রা এবং বদ্ধাক্ষরও এক মাত্রা গণনা করা হয় কোন ছন্দে?","o":["মাত্রাবৃত্ত","অক্ষরবৃত্ত","মুক্তক","স্বরবৃত্ত"],"a":3,"e":"ছন্দ পর্ব ও মাত্রানির্ভর, তাই ছন্দের নামকরণ করা হয়েছে তিনভাগে- অক্ষরবৃত্ত, মাত্রাবৃত্ত, ও স্বরবৃত্ত। অক্ষরবৃত্ত ধীরগতির- তাই এর মাত্রা হবে মুক্তাক্ষর এক মাত্রা, বদ্ধাক্ষর এককভাবে দুই মাত্রা, শেষে দুই মাত্রা আর প্রথম ও মাঝে এক মাত্রা। মাত্রাবৃত্ত ছন্দে মুক্তাক্ষর এক মাত্রা ও বদ্ধাক্ষর দুই মাত্রা হয়। আর স্বরবৃত্ত ছন্দে মুক্তাক্ষর ও বদ্ধাক্ষর সব সময় এক মাত্রা গণনা করা হয়। অক্ষরবৃত্ত ছন্দে মূল পর্ব ৮ বা ১০ মাত্রার হয়। মাত্রাবৃত্ত ছন্দে মূল পর্ব সাধারণত ৬ মাত্রার হয়। স্বরবৃত্ত ছন্দে মূল পর্বের মাত্রা সংখ্যা ৪।","p":52,"id":"q430"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.4","st":"ছন্দ বা অলংকার","n":5,"exam":"৩১তম বিসিএস","q":"সাহিত্যে অলংকার প্রধানত কত প্রকার?","o":["৬","২","৪","৫"],"a":1,"e":"সাহিত্যের বা কাব্যের অলংকার বলতে কাব্যের সৌন্দর্য সৃষ্টিকারী তারই অন্তর্গত কোনো উপাদানকে বোঝায়। সাহিত্যের অলংকার প্রধানত দুই প্রকার। যথা: শব্দালংকার ও অর্থালংকার।","p":52,"id":"q431"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.4","st":"ছন্দ বা অলংকার","n":6,"exam":"৩০তম, ২৫তম বিসিএস","q":"বাংলা ভাষায় ছন্দ প্রধানত কত প্রকার?","o":["২","৪","৩","৫"],"a":2,"e":"","p":52,"id":"q432"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.4","st":"ছন্দ বা অলংকার","n":7,"exam":"২৫তম বিসিএস","q":"'অমিত্রাক্ষর' ছন্দের বৈশিষ্ট্য হলো-","o":["অন্ত্যমিল আছে","অন্ত্যমিল নেই","চরণের প্রথমে মিল থাকে","বিশ মাত্রার পর্ব থাকে"],"a":1,"e":"'অমিত্রাক্ষর ছন্দ' হলো অন্ত্যমিলনহীন এবং যতির বাঁধাধরা নিয়ম লঙ্ঘনকারী ছন্দবিশেষ। এর ইংরেজি পরিভাষা Blank verse। অমিত্রাক্ষরে ভাবের প্রবহমানতা নেই এবং ১৪ মাত্রার চরণ থাকে।","p":52,"id":"q433"},{"c":5,"ct":"অর্থতত্ত্ব","s":"5.4","st":"ছন্দ বা অলংকার","n":8,"exam":"১৭তম বিসিএস","q":"যে ছন্দের মূল পর্বের মাত্রা সংখ্যা চার, তাকে বলা হয়-","o":["স্বরবৃত্ত","পয়ার","মাত্রাবৃত্ত","অক্ষরবৃত্ত"],"a":0,"e":"","p":52,"id":"q434"},{"c":5,"ct":"পত্র","s":"5.5","st":"পত্র","n":1,"exam":"২৩তম বিসিএস","q":"নারীকে সম্বোধনের ক্ষেত্রে প্রযোজ্য হবে-","o":["কল্যাণীয়াসু","সুচরিতেষু","প্রষ্টাস্পদাসু","প্রীতিভাজনেষু"],"a":0,"e":"পত্রের উপরাংশে বাম পাশে যাকে পত্র লেখা হয় তাকে যে সম্বোধন করে পত্রের মূল বক্তব্য আরম্ভ করা হয় তাকে সম্ভাষণ বলে। পত্র প্রাপকের শ্রেণিভেদে সম্ভাষণ বিভিন্ন রকম হয়ে থাকে। সাধারণত সম্বোধনে পুরুষের ক্ষেত্রে দোয়াবরেষু, দোয়াবর, কল্যাণবরেষু, কল্যাণীয়েষু ইত্যাদি; নারীদের ক্ষেত্রে কল্যাণীয়াসু, পরম কল্যাণীয়াসু; বন্ধু-বান্ধবদের ক্ষেত্রে সুহৃদবরেষু, প্রিয়বন্ধুবরেষু, প্রীতিভাজনেষু, সুচরিতেষু, ইত্যাদি এবং গুরুজনদের ক্ষেত্রে শ্রদ্ধাভাজনেষু, শ্রদ্ধাস্পদেষু (পূজ্য), শ্রদ্ধাস্পদাসু (শ্রী) ইত্যাদি।","p":52,"id":"q435"}]</script>
<script>
/* ============================================================
   Bangla Uttaran — Study & Revision System — App Logic
   Vanilla JS, single-file, localStorage persistence, offline-first.
   ============================================================ */
(function(){
"use strict";

/* ---------------- Data load ---------------- */
const DATA = JSON.parse(document.getElementById('qdata').textContent);
const BY_ID = {}; DATA.forEach(q => BY_ID[q.id] = q);

/* topic key = chapter.section */
function topicKey(q){ return q.s; }

const CHAPTERS = []; // ordered list {c, ct, sections:[{s,st,count,questions:[]}]}
(function buildTopicTree(){
  const cMap = new Map();
  DATA.forEach(q=>{
    if(!cMap.has(q.c)) cMap.set(q.c, {c:q.c, ct:q.ct, sMap:new Map()});
    const cEntry = cMap.get(q.c);
    if(!cEntry.sMap.has(q.s)) cEntry.sMap.set(q.s, {s:q.s, st:q.st, questions:[]});
    cEntry.sMap.get(q.s).questions.push(q);
  });
  const sortKey = s => s.split('.').map(Number);
  Array.from(cMap.values()).sort((a,b)=>a.c-b.c).forEach(c=>{
    const sections = Array.from(c.sMap.values()).sort((a,b)=>{
      const ka=sortKey(a.s), kb=sortKey(b.s);
      return ka[0]-kb[0] || ka[1]-kb[1];
    });
    CHAPTERS.push({c:c.c, ct:c.ct, sections});
  });
})();
const TOPIC_BY_KEY = {}; CHAPTERS.forEach(c=>c.sections.forEach(s=>TOPIC_BY_KEY[s.s]=s));

/* ---------------- Persistence ---------------- */
const LS_KEYS = { q:'bu_qstate_v1', topic:'bu_topicstate_v1', meta:'bu_meta_v1' };
function loadJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
let QSTATE = loadJSON(LS_KEYS.q, {});       // qid -> {status,bookmarked,note,srsStage,nextRevision,lastStudied,wrongCount,attempts,correct,lastResult,difficulty}
let TSTATE = loadJSON(LS_KEYS.topic, {});   // topicKey -> {studyCount,firstStudied,lastStudied,sessions,attempted:[],timeSpent,recTimeOverride}
let META = loadJSON(LS_KEYS.meta, {
  theme:'light', streak:{current:0, longest:0, lastDate:null, days:[]},
  quizHistory:[], dailyDone:{}, createdAt: Date.now()
});

let saveTimer=null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(LS_KEYS.q, JSON.stringify(QSTATE));
      localStorage.setItem(LS_KEYS.topic, JSON.stringify(TSTATE));
      localStorage.setItem(LS_KEYS.meta, JSON.stringify(META));
    }catch(e){ toast('স্টোরেজ সংরক্ষণে সমস্যা হয়েছে।'); }
  }, 120);
}

function qs(id){
  if(!QSTATE[id]) QSTATE[id] = {status:'new', bookmarked:false, note:'', srsStage:-1, nextRevision:null,
    lastStudied:null, wrongCount:0, attempts:0, correct:0, lastResult:null, difficulty:null};
  return QSTATE[id];
}
function ts(key){
  if(!TSTATE[key]) TSTATE[key] = {studyCount:0, firstStudied:null, lastStudied:null, sessions:0, attempted:[], timeSpent:0, recTimeOverride:null};
  return TSTATE[key];
}

/* ---------------- Spaced repetition ---------------- */
const SRS_INTERVALS = [1,3,7,14,30,60]; // days
function scheduleNext(qid, knew){
  const s = qs(qid);
  const today = new Date(); today.setHours(0,0,0,0);
  if(knew){
    s.srsStage = Math.min(s.srsStage+1, SRS_INTERVALS.length-1);
    const days = SRS_INTERVALS[s.srsStage];
    const next = new Date(today); next.setDate(next.getDate()+days);
    s.nextRevision = next.getTime();
    if(s.srsStage >= SRS_INTERVALS.length-1) s.status='mastered';
    else if(s.status!=='mastered') s.status='learning';
  } else {
    s.srsStage = 0;
    const next = new Date(today); next.setDate(next.getDate()+1);
    s.nextRevision = next.getTime();
    s.status='revision';
  }
  persist();
}
function isDueToday(qid){
  const s = QSTATE[qid];
  if(!s || !s.nextRevision) return false;
  return s.nextRevision <= Date.now();
}
function fmtDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const months=['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্ট','অক্টো','নভে','ডিসে'];
  return d.getDate()+' '+months[d.getMonth()];
}
function bnNum(n){
  const map={'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
  return String(n).split('').map(c=>map[c]!==undefined?map[c]:c).join('');
}

/* ---------------- Streak ---------------- */
function touchStreak(){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.toDateString();
  if(META.streak.lastDate === todayStr) return;
  const y = new Date(today); y.setDate(y.getDate()-1);
  if(META.streak.lastDate === y.toDateString()) META.streak.current += 1;
  else META.streak.current = 1;
  META.streak.longest = Math.max(META.streak.longest, META.streak.current);
  META.streak.lastDate = todayStr;
  if(!META.streak.days.includes(todayStr)) META.streak.days.push(todayStr);
  persist();
}

/* ---------------- Study time estimation ---------------- */
function estimateStudyMinutes(section){
  const n = section.questions.length;
  // ~1.4 min per question for first study (read+understand+explanation), min 8
  return Math.max(8, Math.round(n*1.4));
}
function estimateRevisionMinutes(section){
  const n = section.questions.length;
  return Math.max(4, Math.round(n*0.6));
}

/* ---------------- Derived stats ---------------- */
function topicProgress(section){
  const qids = section.questions.map(q=>q.id);
  let mastered=0, attempted=0, revision=0;
  qids.forEach(id=>{
    const s = QSTATE[id];
    if(!s) return;
    if(s.status==='mastered') mastered++;
    if(s.attempts>0) attempted++;
    if(s.status==='revision') revision++;
  });
  const pct = qids.length ? Math.round((mastered/qids.length)*100) : 0;
  let strength='new';
  if(attempted===0) strength='new';
  else if(pct>=85) strength='mastered';
  else if(pct>=55) strength='strong';
  else if(pct>=25) strength='average';
  else strength='weak';
  return {mastered, attempted, revision, total:qids.length, pct, strength};
}
function allTopics(){ return CHAPTERS.flatMap(c=>c.sections); }

function globalStats(){
  let total=DATA.length, completed=0, mastered=0, needRevision=0;
  DATA.forEach(q=>{
    const s = QSTATE[q.id];
    if(!s) return;
    if(s.attempts>0) completed++;
    if(s.status==='mastered') mastered++;
    if(s.status==='revision') needRevision++;
  });
  const topics = allTopics();
  let topicsCompleted=0, topicsStudying=0;
  topics.forEach(sec=>{
    const p = topicProgress(sec);
    if(p.pct>=85) topicsCompleted++;
    else if(p.attempted>0) topicsStudying++;
  });
  let sessions=0, timeSpent=0;
  Object.values(TSTATE).forEach(t=>{ sessions+=t.sessions||0; timeSpent+=t.timeSpent||0; });
  const dueToday = DATA.filter(q=>isDueToday(q.id)).length;
  return {
    total, completed, mastered, needRevision, topicsTotal:topics.length,
    topicsCompleted, topicsStudying, sessions, timeSpent, dueToday,
    overallPct: total? Math.round((mastered/total)*100):0
  };
}
function weakestTopics(n){
  return allTopics().map(sec=>({sec, p:topicProgress(sec)}))
    .filter(x=>x.p.attempted>0)
    .sort((a,b)=>a.p.pct-b.p.pct)
    .slice(0,n);
}
function recentlyStudied(n){
  return Object.entries(TSTATE)
    .filter(([k,v])=>v.lastStudied)
    .sort((a,b)=>b[1].lastStudied-a[1].lastStudied)
    .slice(0,n)
    .map(([k,v])=>({sec:TOPIC_BY_KEY[k], t:v}))
    .filter(x=>x.sec);
}
function priorityList(){
  const items=[];
  DATA.forEach(q=>{
    const s = QSTATE[q.id]; if(!s) return;
    if(s.status==='revision' && isDueToday(q.id)) items.push({q, level:'high', reason:'রিভিশন বাকি আছে'});
  });
  weakestTopics(5).forEach(x=>{
    if(x.p.pct<40) items.push({sec:x.sec, level:'high', reason:'দুর্বল টপিক ('+x.p.pct+'%)'});
  });
  DATA.forEach(q=>{
    const s = QSTATE[q.id]; if(!s) return;
    if(s.status==='learning') items.push({q, level:'medium', reason:'শেখার পর্যায়ে'});
  });
  const order={high:0, medium:1, low:2};
  return items.sort((a,b)=>order[a.level]-order[b.level]).slice(0,8);
}

let toastTimer=null;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.style.display='block';

}

/* ---------------- Utility ---------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function statCard(num, label, accent){

}
function fmtMinutes(sec){
  const m = Math.round(sec/60);
  if(m<60) return bnNum(m)+' মিনিট';
  return bnNum(Math.floor(m/60))+' ঘ '+bnNum(m%60)+' মি';
}
function truncate(s,n){ return s.length>n ? s.slice(0,n)+'…' : s; }
function todayKey(){ return new Date().toDateString(); }

function dailyPlan(){
  const plan=[];
  const due = dueQuestions();
  if(due.length) plan.push({id:'due', label:'⏰ আজকের রিভিশন প্রশ্ন ('+bnNum(due.length)+'টি)', minutes:bnNum(Math.max(5,Math.round(due.length*0.7))), nav:'due'});
  const weak = weakestTopics(2);
  weak.forEach(x=>plan.push({id:'weak-'+x.sec.s, label:'📘 '+x.sec.st+' পুনরায় পড়ুন', minutes:bnNum(estimateRevisionMinutes(x.sec)), nav:'topic/'+x.sec.s}));
  const mistakes = mistakeQuestions();
  if(mistakes.length) plan.push({id:'mistakes', label:'❌ ভুল হওয়া প্রশ্নগুলো দেখুন ('+bnNum(mistakes.length)+'টি)', minutes:bnNum(Math.max(5,Math.round(mistakes.length*0.6))), nav:'mistakes'});
  if(plan.length<3){
    const next = allTopics().find(sec=>topicProgress(sec).attempted===0);
    if(next) plan.push({id:'new-'+next.s, label:'🆕 নতুন টপিক শুরু করুন: '+next.st, minutes:bnNum(estimateStudyMinutes(next)), nav:'topic/'+next.s});
  }
  return plan;
}

function attachQuizSetupHandlers(){
  const scopeWrap = document.getElementById('quiz-scope');
  if(!scopeWrap) return;
  scopeWrap.querySelectorAll('.choice-pill').forEach(p=>p.addEventListener('click', ()=>{
    scopeWrap.querySelectorAll('.choice-pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    document.getElementById('topic-picker').style.display = p.dataset.scope==='topic' ? 'block':'none';
  }));
  const countWrap = document.getElementById('quiz-count');
  countWrap.querySelectorAll('.choice-pill').forEach(p=>p.addEventListener('click', ()=>{
    countWrap.querySelectorAll('.choice-pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
  }));
  if(ROUTE.params && ROUTE.params.presetTopic){
    document.querySelector('[data-scope="topic"]').click();
    document.getElementById('quiz-topic-select').value = ROUTE.params.presetTopic;
  }
  document.getElementById('quiz-start').addEventListener('click', startQuiz);
}

function startQuiz(){
  const scope = document.querySelector('#quiz-scope .active').dataset.scope;
  const countSel = document.querySelector('#quiz-count .active').dataset.count;
  const shuffleOn = document.getElementById('quiz-shuffle').checked;
  let pool = DATA.filter(q=>q.a>=0); // exclude ambiguous-answer questions from scoring
  if(scope==='topic'){
    const key = document.getElementById('quiz-topic-select').value;
    pool = pool.filter(q=>q.s===key);
  } else if(scope==='revision'){
    pool = pool.filter(q=>QSTATE[q.id] && QSTATE[q.id].status==='revision');
  } else if(scope==='wrong'){
    pool = pool.filter(q=>QSTATE[q.id] && QSTATE[q.id].wrongCount>0);
  } else if(scope==='unanswered'){
    pool = pool.filter(q=>!QSTATE[q.id] || !QSTATE[q.id].attempts);
  } else if(scope==='mastered'){
    pool = pool.filter(q=>QSTATE[q.id] && QSTATE[q.id].status==='mastered');
  }
  if(!pool.length){ toast('এই পরিধিতে কোনো প্রশ্ন পাওয়া যায়নি।'); return; }
  if(shuffleOn) pool = shuffle(pool);
  const n = countSel==='all' ? pool.length : Math.min(parseInt(countSel), pool.length);
  pool = pool.slice(0, n);

  const questions = pool.map(q=>{
    let optOrder = [0,1,2,3];
    if(shuffleOn) optOrder = shuffle(optOrder);
    return {id:q.id, optOrder, selected:null};
  });

  QUIZ = {questions, idx:0, startTime:Date.now(), answers:{}, finished:false, scope};
  navigate('quizrun');
}

function viewQuizRun(){
  const item = QUIZ.questions[QUIZ.idx];
  const q = BY_ID[item.id];
  const pct = Math.round((QUIZ.idx/QUIZ.questions.length)*100);
  const answered = item.selected!=null;
  return `
  <div class="quiz-progress">
    <span>${bnNum(QUIZ.idx+1)} / ${bnNum(QUIZ.questions.length)}</span>
    <div class="progress-bar"><i style="width:${pct}%"></i></div>
    <button class="btn btn-sm btn-ghost" data-action="quizquit">✕ শেষ করুন</button>
  </div>
  <div class="qcard">
    <div class="q-top"><span class="q-num">প্রশ্ন ${bnNum(QUIZ.idx+1)}</span>${q.exam?`<span class="q-exam">${escapeHtml(q.exam)}</span>`:''}</div>
    <div class="q-text">${escapeHtml(q.q)}</div>
    <div class="options">
      ${item.optOrder.map((origIdx)=>{
        let cls='opt';
        if(answered){
          cls+=' disabled';
          if(origIdx===q.a) cls+=' correct';
          else if(origIdx===item.selected) cls+=' wrong';
        }
        return `<div class="${cls}" data-action="quizselect" data-orig="${origIdx}">
          <span class="opt-key">${['ক','খ','গ','ঘ'][item.optOrder.indexOf(origIdx)]})</span><span>${escapeHtml(q.o[origIdx])}</span>
        </div>`;
      }).join('')}
    </div>
    ${answered ? `${q.e?`<div class="explain-box"><b>ব্যাখ্যা:</b> ${escapeHtml(q.e)}</div>`:''}
      <button class="btn btn-primary" data-action="quiznext">${QUIZ.idx+1<QUIZ.questions.length?'পরবর্তী প্রশ্ন →':'ফলাফল দেখুন →'}</button>`
      : `<div class="q-meta-line">একটি অপশন নির্বাচন করুন</div>`}
  </div>
  `;
}

function quizSelect(origIdx){
  const item = QUIZ.questions[QUIZ.idx];
  if(item.selected!=null) return;
  item.selected = origIdx;
  const q = BY_ID[item.id];
  const s = qs(item.id);
  s.attempts++;
  const correct = origIdx===q.a;
  if(correct){ s.correct++; s.lastResult='correct'; scheduleNext(item.id, true); }
  else{ s.wrongCount++; s.lastResult='wrong'; scheduleNext(item.id, false); }
  s.lastStudied = Date.now();
  touchTopicStudy(q.s, false);
  persist();
  render();
}
function quizNext(){
  if(QUIZ.idx+1 < QUIZ.questions.length){ QUIZ.idx++; render(); }
  else finishQuiz();
}
function finishQuiz(){
  const total = QUIZ.questions.length;
  let correct=0, wrong=0;
  QUIZ.questions.forEach(item=>{ const q=BY_ID[item.id]; if(item.selected==null) return; if(item.selected===q.a) correct++; else wrong++; });
  const unanswered = total-correct-wrong;
  const timeTaken = Math.round((Date.now()-QUIZ.startTime)/1000);
  const record = {date:Date.now(), total, correct, wrong, unanswered, timeTaken, scope:QUIZ.scope};
  META.quizHistory.push(record);
  if(META.quizHistory.length>200) META.quizHistory.shift();
  touchStreak();
  persist();
  QUIZ.finished = true;
  QUIZ.record = record;
  navigate('quizresult');
}
function viewQuizResult(){
  const r = QUIZ.record;
  const acc = r.total? Math.round((r.correct/r.total)*100):0;
  const weakTopicsInQuiz = {};
  QUIZ.questions.forEach(item=>{
    const q=BY_ID[item.id];
    if(item.selected!=null && item.selected!==q.a){ weakTopicsInQuiz[q.s]=(weakTopicsInQuiz[q.s]||0)+1; }
  });
  const weakList = Object.entries(weakTopicsInQuiz).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `
  <div class="card result-hero">
    <div style="font-size:38px;">${acc>=80?'🏆':acc>=50?'👍':'📖'}</div>
    <div class="result-score">${acc}%</div>
    <div class="result-sub">${bnNum(r.correct)} সঠিক • ${bnNum(r.wrong)} ভুল ${r.unanswered?('• '+bnNum(r.unanswered)+' অনুত্তরিত'):''} • সময় ${fmtMinutes(r.timeTaken)}</div>
  </div>
  <div class="grid grid-stats" style="margin-top:16px;">
    ${statCard(bnNum(r.total), 'মোট প্রশ্ন')}
    ${statCard(bnNum(r.correct), 'সঠিক উত্তর', 'sage')}
    ${statCard(bnNum(r.wrong), 'ভুল উত্তর', 'terracotta')}
    ${statCard(acc+'%', 'নির্ভুলতা')}
  </div>
  ${weakList.length? `<div class="section-title">📉 এই কুইজে দুর্বল টপিক</div>
    <div class="card">${weakList.map(([k,cnt])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--rule);"><span>${escapeHtml(TOPIC_BY_KEY[k]?TOPIC_BY_KEY[k].st:k)}</span><span class="p-meta">${bnNum(cnt)}টি ভুল</span></div>`).join('')}</div>`:''}
  <div style="display:flex;gap:10px;margin-top:16px;">
    <button class="btn btn-primary" data-nav="quiz">আরেকটি কুইজ</button>
    <button class="btn" data-nav="mistakes">ভুলগুলো দেখুন</button>
    <button class="btn" data-nav="dashboard">ড্যাশবোর্ডে ফিরুন</button>
  </div>
  `;
}
function quitQuiz(){
  if(QUIZ.questions.some(it=>it.selected!=null)) finishQuiz();
  else { QUIZ=null; navigate('quiz'); }
}

function quickPool(){

  });
  if(!pool.length) pool = DATA.filter(q=>QSTATE[q.id] && QSTATE[q.id].attempts>0);
  return shuffle(pool);
}

    </div>

}
function quickReveal(){ QUICKREV.show=true; render(); }
function quickMark(know){
  const id = QUICKREV.pool[QUICKREV.idx].id;
  const s = qs(id);
  s.attempts++;
  if(know){ s.correct++; QUICKREV.know++; } else { s.wrongCount++; QUICKREV.forgot++; }
  s.lastStudied = Date.now();
  scheduleNext(id, !!know);
  persist();
  QUICKREV.done++;
  if(QUICKREV.idx+1 < QUICKREV.pool.length){ QUICKREV.idx++; QUICKREV.show=false; render(); }
  else { touchStreak(); const summary=QUICKREV; QUICKREV=null;
    mainEl.innerHTML = `<div class="view"><div class="card result-hero">
      <div style="font-size:38px;">⚡</div><div class="result-score">${bnNum(summary.done)}</div>

function attachFocusSetupHandlers(){

let focusTickHandle=null;
function startFocus(key, minutes){
  const sec = TOPIC_BY_KEY[key];
  FOCUS = {
    key, questions: sec.questions, idx:0, startTime:Date.now(),
    limitMs: minutes>0 ? minutes*60000 : 0, paused:false, pausedAt:0, pausedTotal:0,
    correct:0, wrong:0, attempted:0, revisionFlagged:0
  };
  navigate('focusrun');
  startFocusTimer();
}
function startFocusTimer(){
  clearInterval(focusTickHandle);
  focusTickHandle = setInterval(()=>{
    if(!FOCUS || ROUTE.view!=='focusrun') { clearInterval(focusTickHandle); return; }
    if(FOCUS.paused) return;
    const elapsed = Date.now()-FOCUS.startTime-FOCUS.pausedTotal;
    if(FOCUS.limitMs && elapsed>=FOCUS.limitMs){ finishFocus(); return; }
    const timerEl = document.getElementById('focus-timer-display');
    if(timerEl) timerEl.textContent = focusTimeLabel();
  }, 1000);
}
function focusTimeLabel(){
  const elapsed = Date.now()-FOCUS.startTime-FOCUS.pausedTotal;
  if(FOCUS.limitMs){
    const remain = Math.max(0, FOCUS.limitMs-elapsed);
    return fmtClock(remain);
  }
  return fmtClock(elapsed);
}
function fmtClock(ms){
  const totalSec = Math.floor(ms/1000);
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return bnNum(String(m).padStart(2,'0'))+':'+bnNum(String(s).padStart(2,'0'));
}
function viewFocusRun(){
  const q = FOCUS.questions[FOCUS.idx];
  const s = qs(q.id);
  const pct = Math.round((FOCUS.idx/FOCUS.questions.length)*100);

    <div><b>${escapeHtml(TOPIC_BY_KEY[FOCUS.key].st)}</b><div class="p-meta">প্রশ্ন ${bnNum(FOCUS.idx+1)}/${bnNum(FOCUS.questions.length)}</div></div>

    </div>
  </div>

function finishFocus(){
  clearInterval(focusTickHandle);
  const timeSpent = Math.round((Date.now()-FOCUS.startTime-FOCUS.pausedTotal)/1000);
  touchTopicStudy(FOCUS.key, true, timeSpent);
  touchStreak();
  const result = {timeSpent, attempted:FOCUS.attempted, correct:FOCUS.correct, wrong:FOCUS.wrong, revisionFlagged:FOCUS.revisionFlagged, key:FOCUS.key};
  FOCUS.result = result;
  persist();
  navigate('focusresult');
}

/* ---------------- Topic study session (non-focus "start session") ---------------- */
function touchTopicStudy(key, isSession, extraSeconds){
  const t = ts(key);
  const now = Date.now();
  if(!t.firstStudied) t.firstStudied = now;
  t.lastStudied = now;
  if(isSession) t.sessions++;
  if(extraSeconds) t.timeSpent += extraSeconds;
  t.studyCount = t.sessions;
  persist();
}
function startSession(key){
  touchTopicStudy(key, true);
  touchStreak();
  toast('স্টাডি সেশন শুরু হয়েছে — শুভকামনা!');
  navigate('topic', {id:key});
}

function exportProgress(){
  const backup = {QSTATE, TSTATE, META, exportedAt:Date.now(), version:1};
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bangla-uttaran-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('অগ্রগতি এক্সপোর্ট করা হয়েছে।');
}
function importProgress(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const obj = JSON.parse(e.target.result);
      if(obj.QSTATE) QSTATE = obj.QSTATE;
      if(obj.TSTATE) TSTATE = obj.TSTATE;
      if(obj.META) META = obj.META;
      persist();
      toast('অগ্রগতি সফলভাবে পুনরুদ্ধার করা হয়েছে।');
      navigate('dashboard');
    }catch(err){ toast('ফাইলটি সঠিক নয়।'); }
  };
  reader.readAsText(file);
}

/* ================================================================
   EVENT HANDLING
   ================================================================ */
function attachHandlers(){
  mainEl.querySelectorAll('[data-nav]').forEach(elm=>{
    elm.addEventListener('click', ()=>{
      const parts = elm.dataset.nav.split('/');
      const params = {};
      if(parts[1]) params.id = parts[1];
      if(elm.dataset.prefillTopic) params.presetTopic = elm.dataset.prefillTopic;
      navigate(parts[0], params);
    });
  });
  mainEl.querySelectorAll('[data-action="reveal"]').forEach(b=>b.addEventListener('click', ()=>{
    const s = qs(b.dataset.qid); s.revealed=true;
    if(!s.attempts && s.selected==null){} // reveal without forced selection allowed
    s.lastStudied = Date.now();
    persist(); render();
  }));
  mainEl.querySelectorAll('[data-action="hideanswer"]').forEach(b=>b.addEventListener('click', ()=>{
    const s = qs(b.dataset.qid); s.revealed=false; persist(); render();
  }));
  mainEl.querySelectorAll('[data-action="selectopt"]').forEach(b=>b.addEventListener('click', ()=>{
    const qid=b.dataset.qid, idx=parseInt(b.dataset.idx);
    const q = BY_ID[qid]; const s = qs(qid);
    if(s.revealed) return;
    s.selected = idx; s.revealed = true; s.attempts++;
    const correct = idx===q.a;
    if(q.a>=0){
      if(correct){ s.correct++; scheduleNext(qid,true); } else { s.wrongCount++; scheduleNext(qid,false); }
    }
    s.lastStudied = Date.now();
    touchTopicStudy(q.s, false);
    persist(); render();
  }));
  mainEl.querySelectorAll('[data-action="bookmark"]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const s = qs(b.dataset.qid); s.bookmarked=!s.bookmarked; persist(); render();
  }));
  mainEl.querySelectorAll('[data-mark]').forEach(b=>b.addEventListener('click', ()=>{
    const s = qs(b.dataset.qid);
    const mark = b.dataset.mark;
    s.status = (s.status===mark) ? 'learning' : mark;
    if(s.status==='mastered') scheduleNext(b.dataset.qid, true);
    else if(s.status==='revision') scheduleNext(b.dataset.qid, false);
    if(FOCUS && ROUTE.view==='focusrun'){
      if(mark==='revision') FOCUS.revisionFlagged++;
    }
    persist(); render();
  }));
  mainEl.querySelectorAll('[data-action="note"]').forEach(t=>{
    t.addEventListener('blur', ()=>{ const s=qs(t.dataset.qid); s.note=t.value; persist(); });
  });
  mainEl.querySelectorAll('[data-action="startsession"]').forEach(b=>b.addEventListener('click', ()=>startSession(b.dataset.topic)));

  const search = document.getElementById('q-search');
  if(search){
    search.addEventListener('input', filterQuestionList);
    document.getElementById('f-status').addEventListener('change', filterQuestionList);
    document.getElementById('f-bookmark').addEventListener('change', filterQuestionList);
  }

  attachQuizSetupHandlers();
  mainEl.querySelectorAll('[data-action="quizselect"]').forEach(b=>b.addEventListener('click', ()=>quizSelect(parseInt(b.dataset.orig))));
  const qnext = mainEl.querySelector('[data-action="quiznext"]'); if(qnext) qnext.addEventListener('click', quizNext);
  const qquit = mainEl.querySelector('[data-action="quizquit"]'); if(qquit) qquit.addEventListener('click', quitQuiz);

  attachFocusSetupHandlers();
  const fpause = mainEl.querySelector('[data-action="focuspause"]');
  if(fpause) fpause.addEventListener('click', ()=>{
    if(FOCUS.paused){ FOCUS.pausedTotal += Date.now()-FOCUS.pausedAt; FOCUS.paused=false; }
    else { FOCUS.paused=true; FOCUS.pausedAt=Date.now(); }
    render();
  });
  const fend = mainEl.querySelector('[data-action="focusend"]'); if(fend) fend.addEventListener('click', finishFocus);
  // count attempts within focus via option select already tracked globally; sync into FOCUS counters
  if(FOCUS && ROUTE.view==='focusrun'){
    mainEl.querySelectorAll('[data-action="selectopt"]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const q = BY_ID[b.dataset.qid];
        if(q.s!==FOCUS.key) return;
        const s = QSTATE[b.dataset.qid];
        FOCUS.attempted++;
        if(s.lastResult==='correct'||parseInt(b.dataset.idx)===q.a) FOCUS.correct++; else FOCUS.wrong++;
      }, {once:true});
    });
    const nextBtn = document.createElement('div'); // add "next question" nav for focus
  }

  const quickRevealBtn = mainEl.querySelector('[data-action="quickreveal"]'); if(quickRevealBtn) quickRevealBtn.addEventListener('click', quickReveal);
  mainEl.querySelectorAll('[data-action="quickmark"]').forEach(b=>b.addEventListener('click', ()=>quickMark(parseInt(b.dataset.know))));
  const quickQuit = mainEl.querySelector('[data-action="quickquit"]'); if(quickQuit) quickQuit.addEventListener('click', quitQuickRev);

  const themeToggle = document.getElementById('theme-toggle');
  if(themeToggle) themeToggle.addEventListener('change', ()=>{
    META.theme = themeToggle.checked ? 'dark':'light';
    applyTheme(); persist();
  });
  const exportBtn = document.getElementById('export-btn'); if(exportBtn) exportBtn.addEventListener('click', exportProgress);
  const importBtn = document.getElementById('import-btn'); const importFile = document.getElementById('import-file');
  if(importBtn) importBtn.addEventListener('click', ()=>importFile.click());
  if(importFile) importFile.addEventListener('change', ()=>{ if(importFile.files[0]) importProgress(importFile.files[0]); });
  const resetAllBtn = document.getElementById('reset-all-btn');
  if(resetAllBtn) resetAllBtn.addEventListener('click', ()=>confirmModal(
    'সম্পূর্ণ অগ্রগতি রিসেট করবেন?', 'এই কাজটি সম্পূর্ণরূপে বাতিলযোগ্য নয়। সমস্ত স্ট্যাটাস, নোট, বুকমার্ক ও ইতিহাস মুছে যাবে।',
    ()=>{ QSTATE={}; TSTATE={}; META={theme:META.theme, streak:{current:0,longest:0,lastDate:null,days:[]}, quizHistory:[], dailyDone:{}, createdAt:Date.now()}; persist(); toast('সব রিসেট করা হয়েছে।'); navigate('dashboard'); }
  ));
  const resetTopicBtn = document.getElementById('reset-topic-btn');
  if(resetTopicBtn) resetTopicBtn.addEventListener('click', ()=>{
    const key = prompt('যে টপিক কোড রিসেট করতে চান তা লিখুন (যেমন 2.7):');
    if(key && TOPIC_BY_KEY[key]){
      confirmModal('টপিক রিসেট করবেন?', TOPIC_BY_KEY[key].st+' টপিকের সব অগ্রগতি মুছে যাবে।', ()=>{
        TOPIC_BY_KEY[key].questions.forEach(q=>delete QSTATE[q.id]);
        delete TSTATE[key]; persist(); toast('টপিক রিসেট করা হয়েছে।'); render();
      });
    } else if(key) toast('টপিক কোড পাওয়া যায়নি।');
  });

  mainEl.querySelectorAll('[data-plan]').forEach(cb=>cb.addEventListener('change', ()=>{
    const day = todayKey();
    if(!META.dailyDone[day]) META.dailyDone[day]=[];
    const id = cb.dataset.plan;
    if(cb.checked){ if(!META.dailyDone[day].includes(id)) META.dailyDone[day].push(id); }
    else META.dailyDone[day] = META.dailyDone[day].filter(x=>x!==id);
    persist();
  }));
}

function filterQuestionList(){
  const term = (document.getElementById('q-search').value||'').trim();
  const status = document.getElementById('f-status').value;
  const bmOnly = document.getElementById('f-bookmark').value;
  const key = ROUTE.params.id;
  const sec = TOPIC_BY_KEY[key];
  if(!sec) return;
  const filtered = sec.questions.filter(q=>{
    const s = qs(q.id);
    if(term && !q.q.includes(term) && !q.o.some(o=>o.includes(term))) return false;
    if(status && s.status!==status) return false;
    if(bmOnly==='1' && !s.bookmarked) return false;
    return true;
  });
  document.getElementById('qlist').innerHTML = filtered.length? filtered.map(q=>questionCard(q)).join('') : `<div class="empty">কোনো প্রশ্ন পাওয়া যায়নি।</div>`;
  attachHandlers();
}

/* ---------------- Confirm modal ---------------- */
function confirmModal(title, body, onConfirm){
  const back = el(`<div class="modal-back"><div class="modal">
    <h3>${escapeHtml(title)}</h3><p style="color:var(--ink-soft);font-size:13.5px;">${escapeHtml(body)}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px;">
      <button class="btn" id="modal-cancel">বাতিল</button>
      <button class="btn btn-danger" id="modal-ok">নিশ্চিত করুন</button>
    </div>
  </div></div>`);
  document.body.appendChild(back);
  back.addEventListener('click', (e)=>{ if(e.target===back) back.remove(); });
  back.querySelector('#modal-cancel').addEventListener('click', ()=>back.remove());
  back.querySelector('#modal-ok').addEventListener('click', ()=>{ onConfirm(); back.remove(); });
}

/* ---------------- Keyboard shortcuts ---------------- */
document.addEventListener('keydown', (e)=>{
  if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA' || e.target.tagName==='SELECT') return;
  if(ROUTE.view==='quizrun' && QUIZ){
    const item = QUIZ.questions[QUIZ.idx];
    if(['1','2','3','4'].includes(e.key) && item.selected==null){
      const pos = parseInt(e.key)-1;
      const origIdx = item.optOrder[pos];
      if(origIdx!=null) quizSelect(origIdx);
    } else if(e.key==='Enter' && item.selected!=null){ quizNext(); }
    return;
  }
  if(ROUTE.view==='quick' && QUICKREV){
    if(e.key==='Enter' && !QUICKREV.show){ quickReveal(); }
    else if(QUICKREV.show && e.key.toLowerCase()==='r'){ quickMark(0); }
    else if(QUICKREV.show && (e.key.toLowerCase()==='m'||e.key==='Enter')){ quickMark(1); }
    return;
  }
});

/* ---------------- Init ---------------- */
(function init(){
  const parts = location.hash.replace('#','').split('/');
  ROUTE = {view: parts[0]||'dashboard', params:{id:parts[1]}};
  render();
})();

})();

</script>
