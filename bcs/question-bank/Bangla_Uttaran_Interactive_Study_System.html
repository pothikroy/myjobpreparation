<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangla Uttaran — Interactive Study &amp; Revision System</title>
<style>
/* ============================================================
   Bangla Uttaran — Study & Revision System
   Design: inspired by Bengali printed exam guides & notebooks —
   deep indigo ink, warm paper, terracotta-red correction marks,
   marigold highlight for mastery. Set in Bengali-capable type.
   ============================================================ */

:root{
  --paper: #FBF6EC;
  --paper-2: #F3ECDC;
  --ink: #262017;
  --ink-soft: #5B5346;
  --rule: #DFD3B8;
  --indigo: #223A5E;
  --indigo-2: #2F4E7A;
  --terracotta: #B33F31;
  --terracotta-soft: #E8CFC6;
  --marigold: #C4881A;
  --marigold-soft: #F1DFB2;
  --sage: #3F6E4E;
  --sage-soft: #CFE3D3;
  --card: #FFFDF7;
  --shadow: 0 2px 10px rgba(38,32,23,.08);
  --shadow-lg: 0 12px 32px rgba(38,32,23,.16);
  --radius: 10px;
  --radius-lg: 16px;
  --font-display: "Baloo Da 2","Hind Siliguri","Noto Sans Bengali","Kohinoor Bangla","Vrinda",sans-serif;
  --font-body: "Hind Siliguri","Noto Sans Bengali","Kohinoor Bangla","Vrinda","Segoe UI",sans-serif;
  --font-num: "Hind Siliguri","Noto Sans Bengali",sans-serif;
}

[data-theme="dark"]{
  --paper: #16140F;
  --paper-2: #201C15;
  --ink: #EFE7D6;
  --ink-soft: #B8AD97;
  --rule: #3A3325;
  --indigo: #7E9EC9;
  --indigo-2: #9BB6DA;
  --terracotta: #E48870;
  --terracotta-soft: #3A241F;
  --marigold: #E0B45C;
  --marigold-soft: #3A2E12;
  --sage: #8FC49E;
  --sage-soft: #1F3324;
  --card: #1D1A13;
  --shadow: 0 2px 10px rgba(0,0,0,.35);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15.5px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  transition:background .25s ease,color .25s ease;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 27px, var(--rule) 27px, var(--rule) 28px);
  opacity:.35;
}
[data-theme="dark"] body::before{opacity:.12;}

button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--marigold-soft);}

.app{position:relative; z-index:1; display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:230px; flex:none;
  background:var(--indigo);
  color:#EFE7D6;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  overflow-y:auto;
}
[data-theme="dark"] .sidebar{background:#0F1B2C;}
.brand{
  padding:20px 18px 14px;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.brand-title{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:.2px; margin:0;}
.brand-sub{font-size:11.5px; opacity:.65; margin-top:3px;}
.nav{list-style:none; margin:0; padding:10px 10px; flex:1;}
.nav li{margin-bottom:2px;}
.nav button{
  width:100%; text-align:left; background:none; border:none; color:inherit;
  padding:10px 12px; border-radius:8px; font-size:14.5px; cursor:pointer;
  display:flex; align-items:center; gap:10px;
  opacity:.82;
}
.nav button:hover{background:rgba(255,255,255,.08); opacity:1;}
.nav button.active{background:rgba(255,255,255,.16); opacity:1; font-weight:600;}
.nav .badge{
  margin-left:auto; background:var(--terracotta); color:#fff; font-size:10.5px;
  padding:1px 7px; border-radius:20px; font-weight:700;
}
.sidebar-foot{padding:14px 18px; font-size:11px; opacity:.55; border-top:1px solid rgba(255,255,255,.1);}

/* mobile nav */
.mobile-topbar{display:none;}
.mobile-nav-toggle{display:none;}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; padding:26px 30px 70px; max-width:1180px;}
.view{animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.page-head{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:20px;}
.page-title{font-family:var(--font-display); font-size:26px; font-weight:700; margin:0; color:var(--indigo);}
[data-theme="dark"] .page-title{color:var(--indigo-2);}
.page-sub{color:var(--ink-soft); font-size:13.5px; margin-top:4px;}

.btn{
  border:1px solid var(--rule); background:var(--card); color:var(--ink);
  padding:8px 14px; border-radius:8px; font-size:13.5px; cursor:pointer; font-weight:600;
  display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{border-color:var(--indigo);}
.btn-primary{background:var(--indigo); color:#fff; border-color:var(--indigo);}
.btn-primary:hover{background:var(--indigo-2);}
.btn-terracotta{background:var(--terracotta); color:#fff; border-color:var(--terracotta);}
.btn-sage{background:var(--sage); color:#fff; border-color:var(--sage);}
.btn-ghost{background:transparent;}
.btn-sm{padding:5px 10px; font-size:12.5px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-danger{background:#fff; color:var(--terracotta); border-color:var(--terracotta);}

/* ---------- Cards / grid ---------- */
.grid{display:grid; gap:14px;}
.grid-stats{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.card{
  background:var(--card); border:1px solid var(--rule); border-radius:var(--radius-lg);
  padding:16px 18px; box-shadow:var(--shadow);
}
.stat-card{position:relative; overflow:hidden;}
.stat-card .stat-num{font-family:var(--font-display); font-size:28px; font-weight:700; color:var(--indigo);}
[data-theme="dark"] .stat-card .stat-num{color:var(--indigo-2);}
.stat-card .stat-label{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.stat-card.accent-terracotta .stat-num{color:var(--terracotta);}
.stat-card.accent-marigold .stat-num{color:var(--marigold);}
.stat-card.accent-sage .stat-num{color:var(--sage);}

.progress-bar{height:8px; border-radius:6px; background:var(--paper-2); overflow:hidden; border:1px solid var(--rule);}
.progress-bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--sage),var(--marigold)); border-radius:6px;}

.section-title{font-family:var(--font-display); font-size:16px; font-weight:700; margin:26px 0 12px; color:var(--indigo); display:flex; align-items:center; gap:8px;}
[data-theme="dark"] .section-title{color:var(--indigo-2);}

/* dashboard priority list */
.priority-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.priority-item{
  display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--rule);
  border-radius:10px; padding:10px 14px; cursor:pointer;
}
.priority-item:hover{border-color:var(--indigo);}
.dot{width:10px; height:10px; border-radius:50%; flex:none;}
.dot.high{background:var(--terracotta);}
.dot.medium{background:var(--marigold);}
.dot.low{background:var(--sage);}
.priority-item .p-title{font-weight:600; flex:1;}
.priority-item .p-meta{font-size:12px; color:var(--ink-soft);}

/* ---------- Topics ---------- */
.chapter-block{margin-bottom:22px;}
.chapter-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.chapter-head h3{font-family:var(--font-display); font-size:17px; margin:0; color:var(--indigo);}
[data-theme="dark"] .chapter-head h3{color:var(--indigo-2);}
.chapter-num{
  width:28px; height:28px; border-radius:50%; background:var(--indigo); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex:none;
}
.topic-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px;}
.topic-card{
  background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:13px 15px;
  cursor:pointer; display:flex; flex-direction:column; gap:8px;
}
.topic-card:hover{border-color:var(--indigo); box-shadow:var(--shadow);}
.topic-card .t-title{font-weight:700; font-size:14px;}
.topic-card .t-meta{font-size:11.5px; color:var(--ink-soft); display:flex; justify-content:space-between;}
.strength-pill{font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:700; align-self:flex-start;}
.strength-weak{background:var(--terracotta-soft); color:var(--terracotta);}
.strength-average{background:var(--marigold-soft); color:var(--marigold);}
.strength-strong{background:var(--sage-soft); color:var(--sage);}
.strength-mastered{background:var(--indigo); color:#fff;}
.strength-new{background:var(--paper-2); color:var(--ink-soft);}

/* ---------- Question card ---------- */
.qcard{
  background:var(--card); border:1px solid var(--rule); border-radius:var(--radius-lg);
  padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow); position:relative;
}
.qcard .q-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
.q-num{font-weight:700; color:var(--indigo); font-family:var(--font-display);}
[data-theme="dark"] .q-num{color:var(--indigo-2);}
.q-exam{font-size:11px; color:var(--ink-soft); background:var(--paper-2); padding:2px 8px; border-radius:20px; white-space:nowrap;}
.q-text{font-size:16px; font-weight:600; margin:4px 0 12px; line-height:1.65;}
.q-actions-top{display:flex; gap:6px; align-items:center;}
.icon-btn{
  background:none; border:none; cursor:pointer; font-size:16px; color:var(--ink-soft);
  padding:3px 5px; border-radius:6px; line-height:1;
}
.icon-btn:hover{background:var(--paper-2);}
.icon-btn.active{color:var(--marigold);}

.options{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:10px;}
@media (max-width:640px){.options{grid-template-columns:1fr;}}
.opt{
  border:1px solid var(--rule); background:var(--paper-2); border-radius:9px; padding:10px 13px;
  cursor:pointer; font-size:14.5px; display:flex; gap:8px; align-items:flex-start;
}
.opt:hover{border-color:var(--indigo);}
.opt .opt-key{font-weight:700; color:var(--indigo-2); flex:none;}
.opt.correct{background:var(--sage-soft); border-color:var(--sage); font-weight:600;}
.opt.wrong{background:var(--terracotta-soft); border-color:var(--terracotta);}
.opt.disabled{cursor:default;}
.opt.reveal-correct-marker::after{content:" ✓"; color:var(--sage); font-weight:800;}

.answer-box{
  background:var(--sage-soft); border:1px solid var(--sage); border-radius:10px;
  padding:10px 14px; margin-bottom:10px; font-size:13.5px;
}
.answer-box b{color:var(--sage);}
.explain-box{
  background:var(--paper-2); border-left:3px solid var(--marigold); border-radius:6px;
  padding:10px 14px; margin-bottom:12px; font-size:13.5px; color:var(--ink-soft); line-height:1.7;
}
.explain-box b{color:var(--marigold); font-weight:700;}

.mark-row{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px;}
.mark-btn{
  border:1px solid var(--rule); background:var(--card); padding:6px 12px; border-radius:20px;
  font-size:12.5px; cursor:pointer; font-weight:600; display:flex; align-items:center; gap:5px;
}
.mark-btn[data-mark="mastered"].active{background:var(--sage); border-color:var(--sage); color:#fff;}
.mark-btn[data-mark="revision"].active{background:var(--terracotta); border-color:var(--terracotta); color:#fff;}
.mark-btn[data-mark="learning"].active{background:var(--marigold); border-color:var(--marigold); color:#fff;}

.status-chip{font-size:10.5px; padding:2px 9px; border-radius:20px; font-weight:700; white-space:nowrap;}
.status-new{background:var(--paper-2); color:var(--ink-soft);}
.status-learning{background:var(--marigold-soft); color:var(--marigold);}
.status-revision{background:var(--terracotta-soft); color:var(--terracotta);}
.status-mastered{background:var(--sage-soft); color:var(--sage);}

.note-field{width:100%; border:1px solid var(--rule); border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit; background:var(--paper-2); color:var(--ink); resize:vertical; min-height:34px;}
.q-meta-line{font-size:11px; color:var(--ink-soft); margin-top:6px; display:flex; gap:14px; flex-wrap:wrap;}

/* ---------- Filters ---------- */
.filter-bar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center;}
.filter-bar select, .filter-bar input[type=text]{
  border:1px solid var(--rule); border-radius:8px; padding:7px 10px; font-size:13px;
  background:var(--card); color:var(--ink); font-family:inherit;
}
.search-box{flex:1; min-width:180px;}

/* ---------- Quiz ---------- */
.quiz-setup-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:16px;}
.choice-grid{display:flex; flex-wrap:wrap; gap:8px;}
.choice-pill{
  border:1px solid var(--rule); background:var(--card); padding:7px 14px; border-radius:20px;
  cursor:pointer; font-size:13px; font-weight:600;
}
.choice-pill.active{background:var(--indigo); border-color:var(--indigo); color:#fff;}
.quiz-progress{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
.quiz-progress .progress-bar{flex:1;}
.quiz-timer{font-family:var(--font-display); font-weight:700; color:var(--terracotta); font-size:15px;}

.result-hero{text-align:center; padding:26px 20px;}
.result-score{font-family:var(--font-display); font-size:48px; font-weight:800; color:var(--indigo);}
[data-theme="dark"] .result-score{color:var(--indigo-2);}
.result-sub{color:var(--ink-soft); margin-top:4px;}

/* ---------- Quick revision / focus flashcard ---------- */
.flash-wrap{max-width:640px; margin:0 auto;}
.flashcard{
  background:var(--card); border:1px solid var(--rule); border-radius:20px; padding:34px 28px;
  min-height:260px; display:flex; flex-direction:column; justify-content:center; box-shadow:var(--shadow-lg);
  text-align:center;
}
.flash-q{font-size:19px; font-weight:700; line-height:1.6;}
.flash-hint{color:var(--ink-soft); font-size:12.5px; margin-top:14px;}
.flash-actions{display:flex; justify-content:center; gap:10px; margin-top:20px; flex-wrap:wrap;}

/* ---------- Empty state ---------- */
.empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty .empty-icon{font-size:40px; margin-bottom:10px;}

/* ---------- Modal ---------- */
.modal-back{position:fixed; inset:0; background:rgba(20,16,10,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:var(--card); border-radius:16px; padding:24px; max-width:480px; width:100%; box-shadow:var(--shadow-lg); max-height:85vh; overflow-y:auto;}
.modal h3{margin-top:0; font-family:var(--font-display); color:var(--indigo);}
[data-theme="dark"] .modal h3{color:var(--indigo-2);}

/* toast */
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--indigo); color:#fff; padding:10px 20px; border-radius:30px; font-size:13.5px; box-shadow:var(--shadow-lg); z-index:200; animation:toastin .2s ease;}
@keyframes toastin{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}

/* keyboard help */
kbd{background:var(--paper-2); border:1px solid var(--rule); border-radius:5px; padding:1px 7px; font-size:11.5px; font-family:monospace;}

/* toggle switch */
.switch{position:relative; width:40px; height:22px; flex:none;}
.switch input{opacity:0; width:0; height:0;}
.switch .slider{position:absolute; inset:0; background:var(--rule); border-radius:20px; cursor:pointer; transition:.2s;}
.switch .slider::before{content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--indigo);}
.switch input:checked + .slider::before{transform:translateX(18px);}
.settings-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--rule);}
.settings-row:last-child{border-bottom:none;}

/* focus mode */
.focus-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}

/* table inside explanations aren't literal HTML tables; keep text wrapped */

::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--rule); border-radius:6px;}

@media (max-width: 880px){
  .sidebar{position:fixed; left:-240px; z-index:60; transition:left .2s ease; box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .main{padding:70px 16px 60px;}
  .mobile-topbar{
    display:flex; align-items:center; gap:12px; position:fixed; top:0; left:0; right:0; height:54px;
    background:var(--indigo); color:#fff; z-index:50; padding:0 14px;
  }
  .mobile-nav-toggle{display:flex; background:none; border:none; color:#fff; font-size:20px; cursor:pointer;}
  .mobile-topbar .brand-title{font-size:16px; margin:0;}
  .app{display:block;}
}

</style>
</head>
<body>
<div id="ag-overlay"></div>

<div class="mobile-topbar">
  <button class="mobile-nav-toggle" id="mobile-toggle">☰</button>
  <h1 class="brand-title">BCS বাংলা উত্তরণ</h1>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1 class="brand-title">উত্তরণ</h1>
      <div class="brand-sub">BCS প্রিলি — বাংলা ভাষা ও ব্যাকরণ<br>Interactive Study System</div>
    </div>
    <ul class="nav">
      <li><button data-view="dashboard">🏠 Dashboard</button></li>
      <li><button data-view="topics">📚 Topics</button></li>
      <li><button data-view="due">🔴 Revision Due <span class="badge" id="due-badge" style="display:none;">0</span></button></li>
      <li><button data-view="mistakes">❌ My Mistakes</button></li>
      <li><button data-view="bookmarks">⭐ Bookmarked</button></li>
      <li><button data-view="quiz">📝 Quiz Mode</button></li>
      <li><button data-view="quick">⚡ Quick Revision</button></li>
      <li><button data-view="focus">⏱ Focus Mode</button></li>
      <li><button data-view="progress">📊 Progress</button></li>
      <li><button data-view="settings">⚙ Settings</button></li>
    </ul>
    <div class="sidebar-foot">Source: Bangla_Uttaran -1-52.pdf<br>সমস্ত তথ্য আপনার ব্রাউজারে সংরক্ষিত</div>
  </aside>

ড. এনামুল হক; আঞ্চলিক ভাষার অভিধান- ড. মুহম্মদ শহীদুল্লাহ; সংক্ষিপ্ত বাংলা অভিধান- ড. আহমদ শরীফ; ইংরেজি বাংলা অভিধান- জিল্লুর রহমান সিদ্দিকী; সমকালীন বাংলা অভিধান- আবু ইসহাক; ঐতিহাসিক অভিধান- মনজুরুল রহমান।","p":8,"id":"q13"},{"c":1,"ct":"বাংলা ভাষা ও ব্যাকরণ","s":"1.2","st":"বাংলা ব্যাকরণের ইতিহাস ও আলোচ্য বিষয়","n":2,"exam":"৪৬তম বিসিএস","q":"'ধ্বনিবিজ্ঞান ও বাংলা ধ্বনিতত্ত্ব' গ্রন্থের রচয়িতা-","o":["মুহম্মদ আবদুল হাই","মুহম্মদ শহীদুল্লাহ","মুনীর চৌধুরী","মুহম্মদ এনামুল হক"],"a":0,"e":"বাংলা ভাষা সংক্রান্ত কিছু গ্রন্থ: ধ্বনিবিজ্ঞান ও বাংলা ধ্বনিতত্ত্ব, সাহিত্য ও সংস্কৃতি, ভাষা ও সাহিত্য- মুহম্মদ আব্দুল হাই; ভাষার ইতিবৃত্ত- সুকুমার সেন; বাংলা ভাষার সংস্কার, মুসলিম বাঙলা সাহিত্য, মনীষা মঞ্জুষা- মুহম্মদ এনামুল হক; বাঙ্গালা ভাষার ইতিবৃত্ত- মুহম্মদ শহীদুল্লাহ।","p":8,"id":"q14"},{"c":1,"ct":"বাংলা ভাষা ও ব্যাকরণ","s":"1.2","st":"বাংলা ব্যাকরণের ইতিহাস ও আলোচ্য বিষয়","n":3,"exam":"৪৫তম বিসিএস","q":"সর্বপ্রথম বাংলা ভাষার ব্যাকরণ রচনা করেন কে?","o":["মানোএল দ্য আসসুম্পসাঁও","রাজা রামমোহন রায়","রামেন্দ্র সুন্দর ত্রিবেদী","নাথানিয়েল ব্রাসি হ্যালহেড"],"a":0,"e":"প্রথম বাংলা ব্যাকরণ প্রকাশিত হয় ১৭৪৩ সালে পর্তুগিজ ভাষায় (Vocabulario em Idioma Bengalla E Portuguez)। এর লেখক ছিলেন মানোএল দ্য আসসুম্পসাঁও। ১৭৭৮ খ্রিস্টাব্দে নাথানিয়েল ব্রাসি হ্যালহেড নামক ইংরেজ পণ্ডিত ইংরেজি ভাষায় 'A Grammar of the Bengal Language' নামে প্রথম বাংলা ব্যাকরণ রচনা করেন ইংরেজিতে। এ গ্রন্থ মুদ্রণে সর্বপ্রথম ধাতুতে খোদাই বাংলা হরফ ব্যবহৃত হয়।","p":9,"id":"q15"},{"c":1,"ct":"বাংলা ভাষা ও ব্যাকরণ","s":"1.2","st":"বাংলা ব্যাকরণের ইতিহাস ও আলোচ্য বিষয়","n":4,"exam":"৪৫তম বিসিএস","q":"'ভাষা চিন্তার শুধু বাহনই নয়, চিন্তার প্রসূতিও।' মন্তব্যটি কোন ভাষা-চিন্তকের?","o":["সুনীতিকুমার চট্টোপাধ্যায়","মুহম্মদ শহীদুল্লাহ","মুহম্মদ এনামুল হক","সুকুমার সেন"],"a":3,"e":"উক্তিটি সুকুমার সেনের 'ভাষার ইতিবৃত্ত' গ্রন্থের 'ভাষা ও উপভাষা' নামক অধ্যায় থেকে নেওয়া। সুকুমার সেন ১৯০০ সালে কলকাতায় জন্মগ্রহণ করেন এবং ১৯৯২ সালে মৃত্যুবরণ করেন। তার অন্যান্য গ্রন্থ: বাংলা স্থাননাম, বাংলায় নারীর ভাষা, বাংলা সাহিত্যে গদ্য।","p":9,"id":"q16"},{"c":1,"ct":"বাংলা ভাষা ও ব্যাকরণ","s":"1.2","st":"বাংলা ব্যাকরণের ইতিহাস ও আলোচ্য বিষয়","n":5,"exam":"৪১তম বিসিএস","q":"বাংলা ভাষায় প্রথম অভিধান সংকলন করেন কে?","o":["রামচন্দ্র বিদ্যাবাগীশ","রাজশেখর বসু","হরিচরণ দে","অশোক মুখোপাধ্যায়"],"a":0,"e":"বাংলালিপিতে মুদ্রিত প্রথম বাংলা অভিধানের নাম 'বঙ্গভাষাভিধান'। ১৮১৭ সালে কলকাতা থেকে এটি প্রকাশিত হয়। এর সংকলক রামচন্দ্র বিদ্যাবাগীশ। তিনি ব্রাহ্মসমাজের সাথে যুক্ত ছিলেন।","p":9,"id":"q17"},{"c":1,"ct":"বাংলা ভাষা ও ব্যাকরণ","s":"1.2","st":"বাংলা ব্যাকরণের ইতিহাস ও আলোচ্য বিষয়","n":6,"exam":"৩৭তম বিসিএস","q":"মুহম্মদ আবদুল হাই রচিত ধ্বনিবিজ্ঞান বিষয়ক গ্রন্থের নাম কী?","o":["বাংলা ধ্বনিবিজ্ঞান","আধুনিক বাংলা ধ্বনিবিজ্ঞান","ধ্বনিবিজ্ঞানের কথা","ধ্বনিবিজ্ঞান ও বাংলা ধ্বনিতত্ত্ব"],"a":3,"e":"","p":9,"id":"q18"},{"c":1,"ct":"বাংলা ভাষা ও ব্যাকরণ","s":"1.2","st":"বাংলা ব্যাকরণের ইতিহাস ও আলোচ্য বিষয়","n":7,"exam":"২৯তম বিসিএস","q":"বাংলা ভাষায় প্রথম ব্যাকরণ রচনা করেন কে?","o":["অফহে দত্ত","মার্শম্যান","ব্রাসি হ্যালহেড","রাজা রামমোহন রায়"],"a":3,"e":"১৮২৬ সালে রাজা রামমোহন রায় ইংরেজিতে বাংলা ব্যাকরণ লেখেন। এরপর তিনি স্কুল বুক সোসাইটির জন্য ঐ গ্রন্থ বাংলায় অনুবাদ করে নাম দেন 'গৌড়ীয় ব্যাকরণ' যা প্রকাশ হয় ১৮৩৩ সালে। আর এ গ্রন্থটি বাংলা ভাষায় প্রকাশিত প্রথম বাংলা ব্যাকরণ গ্রন্থ।","p":9,"id":"q19"},{"c":1,"ct":"বাংলা ভাষা ও ব্যাকরণ","s":"1.2","st":"বাংলা ব্যাকরণের ইতিহাস ও আলোচ্য বিষয়","n":8,"exam":"২৭তম বিসিএস","q":"রাজা রামমোহন রচিত বাংলা ব্যাকরণের নাম কি?","o":["মাগধীয় ব্যাকরণ","গৌড়ীয় ব্যাকরণ","মাতৃভাষা ব্যাকরণ","ভাষা ও ব্যাকরণ"],"a":1,"e":"","p":9,"id":"q20"},{"c":1,"ct":"বাংলা ভাষা ও ব্যাকরণ","s":"1.2","st":"বাংলা ব্যাকরণের ইতিহাস ও আলোচ্য বিষয়","n":9,"exam":"২৬তম বিসিএস","q":"কে সর্বপ্রথম বাংলা টাইপ সহযোগে বাংলা ব্যাকরণ মুদ্রণ করেন?","o":["স্যার উইলিয়াম জোনস","স্যার উইলিয়াম কেরি","রাজীব লোচন মুখোপাধ্যায়","ব্রাসি হ্যালহেড"],"a":3,"e":"","p":9,"id":"q21"},{"c":1,"ct":"বাংলা ভাষা ও ব্যাকরণ","s":"1.2","st":"বাংলা ব্যাকরণের ইতিহাস ও আলোচ্য বিষয়","n":10,"exam":"২২তম বিসিএস","q":"'ভাষা প্রকাশ বাঙ্গালা ব্যাকরণ' কে রচনা করেন?","o":["ঈশ্বরচন্দ্র বিদ্যাসাগর","সুনীতিকুমার চট্টোপাধ্যায়","মুহম্মদ শহীদুল্লাহ","মুহম্মদ এনামুল হক"],"a":1,"e":"'ভাষা প্রকাশ বাঙ্গালা ব্যাকরণ' গ্রন্থের রচয়িতা সুনীতিকুমার চট্টোপাধ্যায়। ঈশ্বরচন্দ্র বিদ্যাসাগর রচিত ব্যাকরণ গ্রন্থের নাম 'ব্যাকরণ কৌমুদী' ও 'শব্দ মঞ্জুরী' (১ম,২য়,৩য় ও ৪র্থ ভাগ)। মুহম্মদ শহীদুল্লাহ রচিত বাংলা ব্যাকরণ গ্রন্থের নাম 'বাংলা ব্যাকরণ'। মুহম্মদ এনামুল হক রচিত বাংলা ব্যাকরণ গ্রন্থের নাম 'ব্যাকরণ মঞ্জুরী'।","p":9,"id":"q22"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.1","st":"বাগযন্ত্র","n":1,"exam":"৪৭তম বিসিএস","q":"বিবৃত স্বরধ্বনি বলতে বোঝায়-","o":["যে স্বরধ্বনি উচ্চারণে ঠোঁট বেশি খোলে","যে স্বরধ্বনি উচ্চারণে জিভ উঁচু হয়","যে স্বরধ্বনি অবিকৃতভাবে উচ্চারিত হয়","যে স্বরধ্বনি উচ্চারণে বিকৃতি ঘটে"],"a":0,"e":"বিবৃত স্বরধ্বনি: এ স্বরধ্বনির উচ্চারণে ঠোঁট সবচেয়ে বেশি খোলা থাকে। বাংলা ভাষায় এ জাতীয় স্বর মাত্র একটি- আ। অর্ধবিবৃত স্বরধ্বনি: বিবৃত স্বরধ্বনির তুলনায় ঠোঁট কম খোলা রেখে উচ্চারিত হয়। যেমন: অ্যা, অ। অর্ধসংবৃত স্বরধ্বনি: সংবৃত স্বরধ্বনির তুলনায় ঠোঁট বেশি খোলা কিন্তু অর্ধ-বিবৃত স্বরধ্বনির তুলনায় কম খোলা থাকে। যেমন: এ, ও। সংবৃত স্বরধ্বনি: ঠোঁট সবচেয়ে কম খোলা থেকে উচ্চারিত হয়। যেমন: ই, উ। (জিভের উচ্চতা ও ঠোঁটের আকৃতি অনুযায়ী সারণি: উচ্চ-সংবৃত: ই, উ; উচ্চমধ্য-অর্ধসংবৃত: এ, ও; নিম্নমধ্য-অর্ধবিবৃত: অ্যা, অ; নিম্ন-বিবৃত: আ)।","p":10,"id":"q23"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.1","st":"বাগযন্ত্র","n":2,"exam":"৪৩তম বিসিএস","q":"বাগযন্ত্রের অংশ কোনটি?","o":["স্বরযন্ত্র","ফুসফুস","দাঁত","উপরের সবগুলো"],"a":3,"e":"মানুষের দেহের যে সব অঙ্গ-প্রত্যঙ্গ ধ্বনি তৈরিতে সহায়তা করে তাকে বাক প্রত্যঙ্গ বা বাগযন্ত্র বলা হয়। বাগযন্ত্রের এলাকা বিস্তৃত। এর মধ্যে রয়েছে ফুসফুস (lungs), শ্বাসনালি (trachea), স্বরযন্ত্র (larynx), স্বরতন্ত্রী (vocal fold), জিভ (tongue), ঠোঁট (lips), নিচের চোয়াল (lower jaw), দাঁত (teeth), তালু (palate) ও গলনালি (pharynx)।","p":10,"id":"q24"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.1","st":"বাগযন্ত্র","n":3,"exam":"৪২তম বিসিএস","q":"মানুষের দেহের যে সব অঙ্গ-প্রত্যঙ্গ ধ্বনি তৈরিতে সহায়তা করে তাকে বলে?","o":["বাক প্রত্যঙ্গ","অঙ্গধ্বনি","স্বরতন্ত্রী","নাসিকাতন্ত্র"],"a":0,"e":"","p":10,"id":"q25"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.2","st":"ধ্বনি","n":1,"exam":"৪৯তম বিসিএস (শিক্ষা)","q":"ভাষার অর্থযুক্ত ক্ষুদ্রতম একক কোনটি?","o":["অক্ষর","রূপমূল","শব্দ","বর্ণ"],"a":1,"e":"এক বা একাধিক ধ্বনির অর্থবোধক সম্মিলনে শব্দ তৈরি হয়, শব্দের অর্থযুক্ত ক্ষুদ্রাংশকে বলা হয় রূপ (Morpheme)। রূপ গঠন করে শব্দ। ভাষার অর্থযুক্ত ক্ষুদ্রতম একক হলো রূপমূল। উদাহরণ: 'গাছ' একটি রূপমূল, অর্থ 'বৃক্ষ'। 'গাছগুলো' = গাছ (রূপমূল) + গুলো (বহুবচন)।","p":10,"id":"q26"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.2","st":"ধ্বনি","n":2,"exam":"৪৯তম বিসিএস (শিক্ষা)","q":"ধ্বনি ও বর্ণের পার্থক্য কোথায়?","o":["লেখার ধরনে","উচ্চারণের বিশিষ্টতায়","সংখ্যাগত পরিমাণে","ইন্দ্রিয় গ্রাহ্যে"],"a":3,"e":"ধ্বনি: মানুষের মুখ নিঃসৃত অর্থবোধক আওয়াজকেই 'ধ্বনি' বলে। ধ্বনি দৃশ্যমান নয়, ধ্বনি উচ্চারণীয় ও শ্রবণীয়। বর্ণ: ধ্বনির লিখিত প্রতীক বা চিহ্নই হলো বর্ণ, যা চোখে দেখা যায় ও পড়া যায়। সুতরাং, ধ্বনি ও বর্ণের মূল পার্থক্য ইন্দ্রিয়গ্রাহ্যতায়।","p":10,"id":"q27"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.2","st":"ধ্বনি","n":3,"exam":"৪৯তম বিসিএস (শিক্ষা)","q":"রবীন্দ্রনাথ ঠাকুর শব্দের শুরুতে মাত্রাযুক্ত এ-কার ব্যবহার করতেন কেন?","o":["এ-কার মাত্রা যুক্ত বলে","'এ' মাত্রাহীন বর্ণ বলে","'এ' উচ্চারণ বোঝাতে","'অ্যা' উচ্চারণ বোঝাতে"],"a":3,"e":"রবীন্দ্রনাথ ঠাকুর বাংলা বানানে মাত্রাযুক্ত 'এ' কার ব্যবহার করতেন দুটি ভিন্ন ধ্বনি বোঝানোর জন্য; মাত্রাযুক্ত 'এ' কার দিয়ে তিনি 'অ্যা' ধ্বনি বোঝাতেন। যেমন: অ্যামন (এমন), অ্যাখন (এখন), অ্যাক (এক) প্রভৃতি।","p":10,"id":"q28"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.2","st":"ধ্বনি","n":4,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"কোন শব্দে দ্বিস্বরধ্বনি রয়েছে?","o":["তিসি","মালি","লাউ","মেয়ে"],"a":2,"e":"দ্বিস্বর ধ্বনি: পূর্ণ স্বরধ্বনি ও অর্ধস্বরধ্বনি একত্রে উচ্চারিত হলে দ্বিস্বরধ্বনি হয়। যেমন- 'লাউ' শব্দের (আ) পূর্ণ স্বরধ্বনি এবং (উ) অর্ধস্বরধ্বনি মিলে দ্বিস্বরধ্বনি (আউ) তৈরি হয়েছে। দ্বিস্বরধ্বনির উদাহরণ: (আই): তাই, নাই; (এই): সেই, নেই; (আও): যাও, দাও ইত্যাদি।","p":11,"id":"q29"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.2","st":"ধ্বনি","n":5,"exam":"৪৬তম বিসিএস","q":"বাংলা ভাষায় কোন স্বরধ্বনি উচ্চারণকালে জিহ্বা উচ্চ অবস্থানে থাকে?","o":["আ","এ","উ","ও"],"a":2,"e":"","p":11,"id":"q30"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.2","st":"ধ্বনি","n":6,"exam":"৪৬তম বিসিএস","q":"বাংলা বর্ণমালায় যৌগিক স্বর কয়টি?","o":["১টি","২টি","৩টি","৪টি"],"a":1,"e":"পাশাপাশি দুটি স্বরধ্বনি থাকলে দ্রুত উচ্চারণের সময় তা একটি সংযুক্ত স্বরধ্বনি রূপে উচ্চারিত হয়। একসঙ্গে উচ্চারিত দুটো মিলিত স্বরধ্বনিকে যৌগিক স্বর বলে। বাংলা ভাষায় স্বরবর্ণ ১১টি, মৌলিক স্বরধ্বনি ৩২টি। এদের মধ্যে মৌলিক স্বরবর্ণ ৭টি (অ, আ, ই, উ, এ, ও, অ্যা) এবং যৌগিক স্বরধ্বনি ২৫টি। যৌগিক স্বরধ্বনিগুলোর মধ্যে স্বরাজ্ঞাপক বর্ণ মাত্র ২টি- ঐ, ঔ। বাকি ২৩টি যৌগিক স্বরধ্বনির নিজস্ব বর্ণ বা প্রতীক নেই।","p":11,"id":"q31"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.2","st":"ধ্বনি","n":7,"exam":"৪৫তম বিসিএস","q":"'ধ্বনি' সম্পর্কে নিচের কোন বাক্যটি সঠিক নয়?","o":["ধ্বনি দৃশ্যমান","মানুষের ভাষার মূলে আছে কতগুলো ধ্বনি","ধ্বনি উচ্চারণীয় ও শ্রবণীয়","অর্থবোধক ধ্বনিগুলোই মানুষের বিভিন্ন ভাষার বাগ্‌ধ্বনি"],"a":0,"e":"ভাষার ক্ষুদ্রতম একক হলো 'ধ্বনি'। এটা ভাষার মৌলিক অংশ। ধ্বনির লিখিত রূপ হলো 'বর্ণ'। শব্দের ক্ষুদ্রতম অংশ হলো ধ্বনি। বাক্যের ক্ষুদ্রতম একক বা অংশকে শব্দ বলে। মানুষের ভাষার মূলে আছে কতগুলো ধ্বনি এবং অর্থবোধক ধ্বনিগুলোই মানুষের বিভিন্ন ভাষার বাগ্‌ধ্বনি। ধ্বনি উচ্চারণীয় ও শ্রবণীয়, ধ্বনি দৃশ্যমান নয়।","p":11,"id":"q32"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.2","st":"ধ্বনি","n":8,"exam":"৪৫তম বিসিএস","q":"উচ্চারণের রীতি অনুযায়ী নিচের কোনটি উচ্চমধ্য-সম্মুখ স্বরধ্বনি?","o":["অ","আ","ও","এ"],"a":3,"e":"","p":11,"id":"q33"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.2","st":"ধ্বনি","n":9,"exam":"৪৩তম বিসিএস","q":"নিম্নবিবৃত স্বরধ্বনি কোনটি?","o":["আ","ই","এ","অ্যা"],"a":0,"e":"","p":11,"id":"q34"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.2","st":"ধ্বনি","n":10,"exam":"৪১তম বিসিএস","q":"ব্যঞ্জন ধ্বনির সংক্ষিপ্ত রূপকে বলে-","o":["রেফ","হসন্ত","কার","ফলা"],"a":3,"e":"ব্যঞ্জনবর্ণের সংক্ষিপ্ত রূপকে বলা হয় 'ফলা'। ফলা ৬টি। যেমন: ণ/ন ফলা, ব ফলা, ম ফলা, য ফলা, র ফলা ও ল ফলা। উল্লেখ্য স্বরবর্ণের সংক  টিকি বা লম্বা চুলের গোছার মতো।","p":12,"id":"q42"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.3","st":"বর্ণ","n":2,"exam":"৪৭তম বিসিএস","q":"অভিধানে ং, ঃ, ঁ -এই বর্ণগুলোর অবস্থান কোথায়?","o":["স্বরবর্ণের আগে","স্বরবর্ণের শেষে","ব্যঞ্জনবর্ণের শেষে","এদের নির্দিষ্ট অবস্থান নেই"],"a":1,"e":"ং, ঃ, ঁ -এই তিনটি বর্ণ স্বাধীনভাবে স্বতন্ত্র বর্ণ হিসেবে ভাষায় ব্যবহৃত হয় না। এ বর্ণে দ্যোতিত ধ্বনি অন্য ধ্বনির সঙ্গে মিলিত হয়ে একত্রে উচ্চারিত হয়। এই বর্ণগুলোকে বলা হয় পরাশ্রয়ী বর্ণ। এই বর্ণগুলো স্বরবর্ণের শেষে বসে।","p":12,"id":"q43"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.3","st":"বর্ণ","n":3,"exam":"৩৮তম, ২৩তম বিসিএস","q":"'ক্ষ' যুক্তবর্ণটি কিভাবে গঠিত হয়েছে?","o":["হ্‌ + ম","ক্‌ + ষ","ষ্‌ + ম","ম্‌ + হ"],"a":1,"e":"যুক্তবর্ণ গঠনের উদাহরণ: ক্ষ = হ্‌+ম (ব্রাহ্মণ, ব্রহ্মপুত্র, ব্রহ্ম, ব্রহ্মাণ্ড); ঞ্চ = ক্‌+ষ (পক্ষ, পরীক্ষা, অক্ষয়, দীক্ষিত); ন্ম = জ্‌+ঞ (গ্রাম্য, উষ্ম, ভস্ম); জ্ঞ = জ্‌+ঞ (জ্ঞান, বিজ্ঞান); গ্ন = ঞ্‌+জ (অজ্ঞ, গজ্ঞনা)। [দ্রষ্টব্য: মূল সারণিতে যুক্তবর্ণ 'ক্ষ' গঠিত হয়েছে হ্‌+ম দিয়ে বলে উত্তরে দেখানো হয়েছে; সারণির বাকি অংশ কিছুটা অস্পষ্ট।]","p":12,"id":"q44"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.3","st":"বর্ণ","n":4,"exam":"৩৬তম বিসিএস","q":"বাংলা বর্ণমালায় অর্ধমাত্রার বর্ণ কয়টি?","o":["৭টি","৯টি","১০টি","৮টি"],"a":3,"e":"বাংলা বর্ণমালায় মোট বর্ণ ৫০টি। স্বরবর্ণ- ১১টি ও ব্যঞ্জনবর্ণ- ৩৯টি। মাত্রার উপর ভিত্তি করে বর্ণ ৩ প্রকার: মাত্রাহীন বর্ণ ১০টি (৪টি স্বরবর্ণ- এ, ঐ, ও, ঔ এবং ৬টি ব্যঞ্জনবর্ণ- ঙ, ঞ, ৎ, ং, ঃ, ঁ); অর্ধমাত্রার বর্ণ ৮টি (১টি স্বরবর্ণ- ঋ এবং ৭টি ব্যঞ্জনবর্ণ- খ, গ, ণ, থ, ধ, প, শ); পূর্ণমাত্রার বর্ণ ৩২টি (৬টি স্বরবর্ণ- অ, আ, ই, ঈ, উ, ঊ এবং ২৬টি ব্যঞ্জনবর্ণ)।","p":12,"id":"q45"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.3","st":"বর্ণ","n":5,"exam":"৩৬তম বিসিএস","q":"'বিজ্ঞান' শব্দের যুক্তবর্ণের সঠিক রূপ কোনটি?","o":["জ্‌+ঞ","ঞ্‌+গ","ঞ্‌+জ","গ্‌+ঞ"],"a":0,"e":"","p":12,"id":"q46"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.3","st":"বর্ণ","n":6,"exam":"২৯তম বিসিএস","q":"বাংলা বর্ণমালার স্বরবর্ণ কয়টি?","o":["১৩টি","১০টি","১২টি","১১টি"],"a":3,"e":"","p":12,"id":"q47"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.3","st":"বর্ণ","n":7,"exam":"১৮তম বিসিএস","q":"বাংলা বর্ণমালায় মাত্রাবিহীন বর্ণের সংখ্যা কয়টি?","o":["এগারটি","নয়টি","দশটি","আটটি"],"a":2,"e":"","p":12,"id":"q48"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.3","st":"বর্ণ","n":8,"exam":"১৪তম বিসিএস","q":"বর্ণ হচ্ছে-","o":["শব্দের ক্ষুদ্রতম অংশ","একসঙ্গে উচ্চারিত ধ্বনিগুচ্ছ","ধ্বনি নির্দেশক প্রতীক","ধ্বনির শ্রুতিগ্রাহ্য রূপ"],"a":2,"e":"শব্দের ক্ষুদ্রতম অংশকে বলে ধ্বনি। একসঙ্গে উচ্চারিত ধ্বনিগুচ্ছের অর্থবোধক মিলনে শব্দ তৈরি হয়। ধ্বনি নির্দেশক প্রতীক হলো বর্ণ।","p":12,"id":"q49"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.4","st":"অক্ষর","n":1,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"'অন্তর্ভুক্তিমূলক' শব্দ উচ্চারণে কয়টি অক্ষর পাওয়া যায়?","o":["৫","৬","৭","৮"],"a":1,"e":"নিঃশ্বাসের স্বল্পতম প্রয়াসে উচ্চারিত ধ্বনি বা ধ্বনিগুচ্ছকে অক্ষর বলে। 'অন্তর্ভুক্তিমূলক' শব্দ উচ্চারণে মোট ছয়টি অক্ষর পাওয়া যায় = অন্‌ + তর্‌ + ভুক্‌ + তি + মূ + লক্‌।","p":12,"id":"q50"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.4","st":"অক্ষর","n":2,"exam":"৪১তম বিসিএস","q":"নিঃশ্বাসের স্বল্পতম প্রয়াসে উচ্চারিত ধ্বনি বা ধ্বনিগুচ্ছকে কী বলে?","o":["যৌগিক ধ্বনি","অক্ষর","বর্ণ","মৌলিক স্বরধ্বনি"],"a":1,"e":"","p":12,"id":"q51"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.4","st":"অক্ষর","n":3,"exam":"৩৬তম বিসিএস","q":"'বন্দন' শব্দের সঠিক অক্ষর বিন্যাস কোনটি?","o":["ব+ন+ধ+ন","বন্‌+ধন","ব+ন্দ+ন","বান্‌+ধন"],"a":1,"e":"'বন্দন' শব্দের বন্‌ + ধন্‌-এ দুটো অক্ষর। কিন্তু ব + ন + ধ + ন- এগুলো অক্ষর নয়; এগুলো বর্ণ।","p":12,"id":"q52"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.5","st":"ধ্বনির পরিবর্তন","n":1,"exam":"৫০তম বিসিএস","q":"একটি স্বরধ্বনির প্রভাবে শব্দে অপর স্বরের পরিবর্তন ঘটলে তাকে বলে-","o":["অভিশ্রুতি","অপিনিহিতি","সমীভবন","স্বরসঙ্গতি"],"a":3,"e":"একটি স্বরধ্বনির প্রভাবে শব্দে অপর স্বরধ্বনির পরিবর্তন ঘটলে তাকে স্বরসঙ্গতি (Vowel harmony) বলে। যেমন- দেশি > দিশি, বিলাতি > বিলিতি, মুলা > মুলো ইত্যাদি।","p":13,"id":"q53"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.5","st":"ধ্বনির পরিবর্তন","n":2,"exam":"৪৯তম বিসিএস (শিক্ষা)","q":"কোন ধ্বনি পরিবর্তনটি যথাযথ নয়?","o":["ক্রন্দন > কাঁদা","অঞ্চল > আঁচল","সংগীত > গীতিকা","দন্ত > দাঁত"],"a":2,"e":"'সংগীত > গীতিকা' পরিবর্তনটি ধ্বনির পরিবর্তনে সাধিত হয়নি। এক্ষেত্রে সম্পূর্ণ নতুন পদ গঠিত হয়েছে। তাই এই পরিবর্তনটি যথাযথ নয়।","p":13,"id":"q54"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.5","st":"ধ্বনির পরিবর্তন","n":3,"exam":"৪৪তম বিসিএস","q":"ধ্বনি-পরিবর্তনের নিয়মে কোনটি বর্ণ-বিপর্যয়-এর দৃষ্টান্ত?","o":["রতন","কবাট","পিচাশ","মুলুক"],"a":2,"e":"শব্দের মধ্যে দুটি ব্যঞ্জনের পরস্পর স্থান পরিবর্তন ঘটলে তাকে বর্ণ বিপর্যয় বলে। যেমন: বাক্স > বাসক, রিক্সা > রিস্কা, লাফ > ফাল, পিশাচ > পিচাশ ইত্যাদি।","p":13,"id":"q55"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.5","st":"ধ্বনির পরিবর্তন","n":4,"exam":"৪৩তম বিসিএস","q":"বড় > বড্ড-এটি কোন ধরনের পরিবর্তন?","o":["বিষমীভবন","সমীভবন","ব্যঞ্জনদ্বিত্ব","ব্যঞ্জন-বিকৃতি"],"a":2,"e":"দ্বিত্ব ব্যঞ্জন (Long Consonant) বা ব্যঞ্জনদ্বিত্ব: কখনো কখনো জোর দেওয়ার জন্য শব্দের অন্তর্গত ব্যঞ্জনের দ্বিত্ব উচ্চারণ হয়, একে বলে দ্বিত্ব ব্যঞ্জন বা ব্যঞ্জনদ্বিত্ব। যেমন- বড় > বড্ড, পাকা > পাক্কা, সকাল > সক্কাল, সবাই > সব্বাই ইত্যাদি।","p":13,"id":"q56"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.5","st":"ধ্বনির পরিবর্তন","n":5,"exam":"৪১তম বিসিএস","q":"অপিনিহিতির উদাহরণ কোনটি?","o":["জন্ম>জম্ম","আজি>আইজ","ডেস্ক>ডেসক","অলাবু>লাবু>লাউ"],"a":1,"e":"পরের ই-কার বা উ-কার আগে উচ্চারিত হলে কিংবা যুক্ত ব্যঞ্জনধ্বনির আগে ই-কার বা উ-কার উচ্চারিত হলে তাকে অপিনিহিতি বলে। যেমন: আজি > আইজ, সাধু >, সাউধ, সত্য > সইত্য ইত্যাদি।","p":13,"id":"q57"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.5","st":"ধ্বনির পরিবর্তন","n":6,"exam":"৩৫তম বিসিএস","q":"নিচের কোনটি ধ্বনি-পরিবর্তনের উদাহরণ নয়?","o":["প্রাতিপদিক","অভিশ্রুতি","অপিনিহিতি","ধ্বনি-বিপর্যয়"],"a":0,"e":"ধ্বনি পরিবর্তনের মধ্যে অভিশ্রুতি, অপিনিহিতি, ধ্বনি বিপর্যয় রয়েছে; অর্থাৎ প্রাতিপদিক ধ্বনি পরিবর্তনের মধ্যে অন্তর্ভুক্ত নয়। বিভক্তিহীন নাম শব্দকে প্রাতিপদিক বলে। যেমন- মা, হাত ইত্যাদি। প্রাতিপদিক প্রকৃতিতে আলোচনা করা হয়।","p":13,"id":"q58"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.6","st":"ণত্ব ও ষত্ব বিধান","n":1,"exam":"৩৬তম বিসিএস","q":"নিচের কোন শব্দে ণ-ত্ব বিধি অনুসারে 'ণ'-এর ব্যবহার হয়েছে?","o":["কল্যাণ","প্রবণ","নিকরণ","বিপণি"],"a":1,"e":"যে বিধান বা নিয়ম অনুযায়ী তৎসম বা সংস্কৃত শব্দে 'ণ' (মূর্ধন্য-ণ) ব্যবহার করা হয় তাকে ণত্ব বিধান বলে। বাংলা, তদ্ভব ও বিদেশি শব্দে মূর্ধন্য-ণ হয় না। ঋ, র, ষ-এর পরে স্বরধ্বনি, ষ য ব হ ং এবং ক-বর্গীয় ও প-বর্গীয় ধ্বনি থাকলে তার পরবর্তী দন্ত্য-'ন' মূর্ধন্য 'ণ' হয়। যেমন- কৃপণ, হরিণ, অর্পণ, প্রবণ ইত্যাদি। অপশনের বাকি তিনটি শব্দ- কল্যাণ, নিকরণ, বিপণি স্বভাবতই 'ণ' হয়।","p":13,"id":"q59"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.6","st":"ণত্ব ও ষত্ব বিধান","n":2,"exam":"২৪তম, ২০তম বিসিএস","q":"নিত্য মূর্ধন্য-ষ কোন শব্দে বর্তমান?","o":["কষ্ট","উপনিষৎ","কল্যাণীয়েষু","আষাঢ়"],"a":3,"e":"সংস্কৃত ভাষায় আদিকাল থেকে কিছু শব্দে মূর্ধন্য-ষ চলে আসছে, এসব শব্দের বানানে নিত্য মূর্ধন্য-ষ হয়। সে হিসেবে 'আষাঢ়' শব্দটিতে নিত্য মূর্ধন্য-ষ বর্তমান। অন্যান্য নিত্য মূর্ধন্য ষ এর উদাহরণ: ষড়ঋতু, ষড়যন্ত্র, শোষণ, আষাঢ়, ভাষণ, ভূষণ, ভাষা, ঈষৎ, উষা, মানুষ, পৌষ, পাষণ্ড, পাষাণ, রোষ, ঔষধ, কলুষ, কোষ, দ্বেষ ইত্যাদি।","p":13,"id":"q60"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.6","st":"ণত্ব ও ষত্ব বিধান","n":3,"exam":"২১তম বিসিএস","q":"ণ-ত্ব বিধি সাধারণত কোন শব্দে প্রযোজ্য?","o":["দেশী","বিদেশী","তৎসম","তদ্ভব"],"a":2,"e":"","p":13,"id":"q61"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":1,"exam":"৫০তম বিসিএস","q":"'পরমেশ' শব্দটির সঠিক সন্ধি বিচ্ছেদ কোনটি?","o":["পরম + এশ","পরম + ঈশ","পরম + ইশ","পরম + ইস"],"a":1,"e":"অ-কার কিংবা আ-কারের পর ই-কার কিংবা ঈ-কার থাকলে উভয়ে মিলে এ-কার হয়; এ-কার পূর্ববর্তী ব্যঞ্জনের সঙ্গে যুক্ত হয়। যেমন- পরম + ঈশ = পরমেশ; মহা + ঈশ = মহেশ।","p":14,"id":"q62"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":2,"exam":"৪৯তম বিসিএস (শিক্ষা)","q":"কোন শব্দটি বিসর্গসন্ধির মাধ্যমে গঠিত?","o":["নীরব","উজ্জ্বল","মনোহর","সংগ্রাম"],"a":0,"e":"ই কিংবা উ ধ্বনির পরের বিসর্গের সঙ্গে 'র' এর সন্ধি হলে বিসর্গের লোপ হয় ও বিসর্গের পূর্ববর্তী হ্রস্ব স্বর দীর্ঘ হয়। যেমন: নিঃ + রব = নীরব, নিঃ + রস = নীরস।","p":14,"id":"q63"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":3,"exam":"৪৬তম বিসিএস","q":"'শিরচ্ছেদ' শব্দের সন্ধিবিচ্ছেদ-","o":["শির + ছেদ","শিরঃ + ছেদ","শিরশ + ছেদ","শির + উচ্ছেদ"],"a":1,"e":"বিসর্গের পর অঘোষ অল্পপ্রাণ কিংবা মহাপ্রাণ তালব্য ব্যঞ্জন থাকলে বিসর্গের স্থলে তালব্য শশ ধ্বনি হয়। অঘোষ অল্পপ্রাণ কিংবা অঘোষ মহাপ্রাণ মূর্ধন্য ব্যঞ্জন থাকলে বিসর্গ স্থলে মূর্ধন্য ষষ ধ্বনি হয়, অঘোষ অল্পপ্রাণ কিংবা অঘোষ মহাপ্রাণ দন্ত্য ব্যঞ্জনের স্থলে দন্ত্য সস ধ্বনি হয়। যেমন: ঃ + চ/ছ = শ+চ/ছ (শিরঃ+ছেদ=শিরশ্ছেদ); ঃ + ট/ঠ = ষ+ট/ঠ (ধনুঃ+টঙ্কার=ধনুষ্টঙ্কার); ঃ + ত/থ = স+ত/থ (দুঃ+ত=দুস্থ)।","p":14,"id":"q64"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":4,"exam":"৪৪তম বিসিএস","q":"নিপাতনে সিদ্ধ স্বরসন্ধির দৃষ্টান্ত কোনটি?","o":["গো + অক্ষ = গবাক্ষ","গৌ + অক্ষ = পাবক","বি + অঙ্গ = বঙ্গ","যতি + ইন্দ্র = যতীন্দ্র"],"a":0,"e":"যে সন্ধি কোনো নিয়ম অনুসারে হয় না তাকে নিপাতনে সিদ্ধ সন্ধি বলে। কতগুলো নিপাতনে সিদ্ধ স্বরসন্ধি হলো: কুল + অটা = কুলটা, গো + অক্ষ = গবাক্ষ, প্র + ঊঢ় = প্রৌঢ়, অন্য + অন্য = অন্যান্য, মার্ত + অণ্ড = মার্তণ্ড, শুদ্ধ + ওদন = শুদ্ধোদন।","p":14,"id":"q65"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":5,"exam":"৩৯তম বিসিএস","q":"'দুরবস্থা' শব্দটি সন্ধি বিচ্ছেদ করলে নিচের কোনটি পাওয়া যায়?","o":["দুঃ + অবস্থা","দূর + বস্থা","দুর + বস্থা","দুঃ + বস্থা"],"a":0,"e":"অ, আ ভিন্ন স্বরবর্ণের পরে বিসর্গ থাকলে এবং তারপর স্বরবর্ণ, বর্গের তৃতীয়, চতুর্থ, পঞ্চম অথবা য, র, ল, ব, হ থাকলে বিসর্গের স্থানে র হয়। 'র' পরের বর্ণে যুক্ত হয় বা পরের ব্যঞ্জনবর্ণের মাথায় 'রেফ' হয়ে বসে। যেমন- দুঃ + অবস্থা = দুরবস্থা, নিঃ + আপদ = নিরাপদ, দুঃ + যোগ = দুর্যোগ, আশিঃ + বাদ = আশীর্বাদ, দুঃ + বোধ্য = দুর্বোধ্য।","p":14,"id":"q66"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":6,"exam":"৩৮তম বিসিএস","q":"'সদ্যোজাত' শব্দের শুদ্ধ সন্ধিবিচ্ছেদ কোনটি?","o":["সৎ + জাত","সদ্যো + জাত","সদ্যঃ + জাত","সদ্য + জাত"],"a":2,"e":"বিসর্গ সন্ধির ক্ষেত্রে, অ-কারের পরিহৃত-স-জাত বিসর্গের পর ঘোষ অল্পপ্রাণ ও ঘোষ মহাপ্রাণ ব্যঞ্জনধ্বনি, নাসিক্যধ্বনি কিংবা অন্তঃস্থ য, অন্তঃস্থ ব, র, ল, হ থাকলে অ-কার ও স-জাত বিসর্গ উভয় স্থলে ও-কার হয়। যেমন: সদ্যঃ + জাত = সদ্যোজাত, তিরঃ + ধান = তিরোধান, মনঃ + রম = মনোরম, তপঃ + বন = তপোবন ইত্যাদি।","p":14,"id":"q67"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":7,"exam":"৩৬তম বিসিএস","q":"'রবীন্দ্র'-এর সঠিক সন্ধি বিচ্ছেদ কোনটি?","o":["রবী + ইন্দ্র","রবী + ঈন্দ্র","রবি + ইন্দ্র","রবি + ঈন্দ্র"],"a":2,"e":"ই-কার কিংবা ঈ-কারের পর ই-কার কিংবা ঈ-কার থাকলে উভয়ে মিলে দীর্ঘ 'ঈ'-কার হয়; দীর্ঘ 'ঈ'-কার পূর্ববর্তী ব্যঞ্জনের সাথে যুক্ত হয়। যেমন: রবি + ইন্দ্র = রবীন্দ্র, অতি + ইত = অতীত, পরি + ঈক্ষা = পরীক্ষা, সতী + ঈশ = সতীশ, সতী + ইন্দ্র = সতীন্দ্র ইত্যাদি।","p":14,"id":"q68"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":8,"exam":"৩৫তম বিসিএস","q":"'দ্বৈপায়ন' শব্দের শুদ্ধ সন্ধিবিচ্ছেদ কোনটি?","o":["দ্বীপ + আয়ন","দ্বীপ + অয়ন","দ্বিপ + অনট","দ্বিপ + অনট"],"a":0,"e":"'দ্বৈপায়ন' এর সঠিক সন্ধিবিচ্ছেদ হবে দ্বীপ + আয়ন (অয়ন + অ)। যে শব্দের সাথে 'আয়ন' প্রত্যয় যুক্ত হবে সেই শব্দের আদিস্বর বৃদ্ধি পাবে। 'আয়ন' প্রত্যয়যুক্ত শব্দের পূর্ব শব্দে 'ঈ' কার থাকলে তা ঐ-কার (ৈ) হবে।","p":14,"id":"q69"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":9,"exam":"৩১তম বিসিএস","q":"সন্ধি-সাধিত শব্দ 'পরস্পর' কোন ধরনের সন্ধির দৃষ্টান্ত?","o":["ব্যঞ্জন ধ্বনি","স্বরসন্ধি","নিপাতনে সিদ্ধ","বিসর্গ সন্ধি"],"a":2,"e":"পরস্পর শব্দটি নিপাতনে সিদ্ধ ব্যঞ্জন সন্ধির উদাহরণ। যেমন- বন + পতি = বনস্পতি, এক + দশ = একাদশ, গো + পদ = গোষ্পদ, তৎ + কর = তস্কর, বৃহৎ + পতি = বৃহস্পতি, পতৎ + অঞ্জলি = পতঞ্জলি, আ + চর্য = আশ্চর্য, মনস্‌ + ঈষা = মনীষা, ষট্‌ + দশ = ষোড়শ, পর্‌ + পর = পরস্পর, দিব্‌ + লোক = দ্যুলোক।","p":14,"id":"q70"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":10,"exam":"৩০তম বিসিএস","q":"বাগাড়ম্বর শব্দের সন্ধি-বিচ্ছেদ-","o":["বাগ্ + অম্বর","বাগ্ + আড়ম্বর","বাক্ + অম্বর","বাক্ + আড়ম্বর"],"a":3,"e":"ক, চ, ট, ত, প-এর পরে স্বরধ্বনি থাকলে সেগুলো যথাক্রমে গ, জ, ড(ড়), দ, ব হয়। পরবর্তী স্বরধ্বনিটি পূর্ববর্তী ব্যঞ্জনধ্বনির সঙ্গে যুক্ত হয়। যেমন: বাক্ + আড়ম্বর = বাগাড়ম্বর; দিক্ + অন্ত = দিগন্ত।","p":15,"id":"q71"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":11,"exam":"২৯তম বিসিএস","q":"'জনৈক' শব্দটির সন্ধি বিচ্ছেদ-","o":["জন + ইক","জন + এক","জৈন + এক","জন + ঈক"],"a":1,"e":"স্বরসন্ধির নিয়মানুসারে অ-কার কিংবা আ-কারের পর এ-কার কিংবা ঐ কার থাকলে উভয়ে মিলে ঐ-কার হয়; ঐ-কার পূর্ববর্তী ব্যঞ্জনের সাথে যুক্ত হয়। যেমন: জন + এক = জনৈক, সদা + এব = সদৈব।","p":15,"id":"q72"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":12,"exam":"২৭তম বিসিএস","q":"কোন সন্ধিটি নিপাতনে সিদ্ধ?","o":["বাক্ + দান = বাগ্‌দান","উৎ + ছেদ = উচ্ছেদ","পর + পর = পরস্পর","সম্ + সার = সংসার"],"a":2,"e":"","p":15,"id":"q73"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":13,"exam":"২৬তম বিসিএস","q":"'নবান্ন' শব্দটি কোন প্রক্রিয়ায় গঠিত?","o":["সমাস","সন্ধি","প্রত্যয়","উপসর্গ"],"a":-1,"e":"নবান্ন শব্দটি সন্ধি এবং সমাস উভয় প্রক্রিয়ায় গঠন করা যায়। নবান্ন এর সন্ধি বিচ্ছেদ = নব + অন্ন। সমাসের ক্ষেত্রে নবান্ন = নব যে অন্ন (কর্মধারয় সমাস)। [মূল উত্তরে চিহ্নিত অপশন অস্পষ্ট ছিল—উভয় বিকল্প সঠিক বলে ব্যাখ্যা করা হয়েছে]","p":15,"id":"q74"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":14,"exam":"২৩তম বিসিএস","q":"'প্রাতরাশ'- এর সন্ধি-","o":["প্রাত + রাশ","প্রাতঃ + রাশ","প্রাতঃ + আশ","প্রাত + আশ"],"a":2,"e":"অ-কারের পরিহৃত র্‌-জাত বিসর্গের পরে আ ধ্বনি থাকলে বিসর্গ ও আ ধ্বনি মিলে র হয়। যেমন- প্রাতঃ + আশ = প্রাতরাশ।","p":15,"id":"q75"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":15,"exam":"১৮তম বিসিএস","q":"'সন্ধি' ব্যাকরণের কোন অংশের আলোচ্য বিষয়?","o":["রূপতত্ত্ব","ধ্বনিতত্ত্ব","পদক্রম","বাক্য প্রকরণ"],"a":1,"e":"সহজ উচ্চারণ প্রবণতা ও ধ্বনিগত মাধুর্য সম্পাদনের লক্ষ্যে পাশাপাশি দুই ধ্বনির মিলনকে সন্ধি বলা হয়। সন্ধি দুটি ধ্বনির মিলন আর ধ্বনির লিখিত রূপ হলো- বর্ণ। সুতরাং, সন্ধি সহ বর্ণমালা সংক্রান্ত আলোচনা ধ্বনিতত্ত্বে করা হয়। (তুলনা সারণি: ধ্বনিতত্ত্ব-বাগ্‌যন্ত্র ও এর উচ্চারণ প্রক্রিয়া, ধ্বনির উচ্চারণ স্থান, ধ্বনির বিন্যাস, ধ্বনির পরিবর্তন, বর্ণ, সন্ধি, ণ-ত্ব বিধান, ষ-ত্ব বিধান; শব্দতত্ত্ব/রূপতত্ত্ব-শব্দের প্রকার, পদের প্রকার, শব্দ গঠন প্রক্রিয়া, উপসর্গ, প্রত্যয়, বিভক্তি, লিঙ্গ পরিবর্তন, বচন, ধাতু, সমাস, ক্রিয়ার কাল ইত্যাদি; বাক্যতত্ত্ব/পদক্রম-বাক্য ও এর অংশ, বাক্যের প্রকার, পদের স্থান বা ক্রম, কারক, বাক্য সংকোচন/সংযোজন/বিয়োজন, যতিচিহ্ন; অর্থতত্ত্ব/বাগর্থতত্ত্ব-শব্দের অর্থবিচার, বাক্যের অর্থবিচার, ব্যুৎপত্তার্থ, গৌণার্থ, বিপরীত শব্দ, প্রতিশব্দ, শব্দজোড়, বাগধারা প্রভৃতি)।","p":15,"id":"q76"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":16,"exam":"১৮তম বিসিএস","q":"সন্ধির প্রধান সুবিধা কি?","o":["পড়ার সুবিধা","লেখার সুবিধা","উচ্চারণের সুবিধা","শোনার সুবিধা"],"a":2,"e":"","p":15,"id":"q77"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":17,"exam":"১৭তম বিসিএস","q":"ষড়ঋতু শব্দের সন্ধি বিচ্ছেদ-","o":["ষড় + ঋতু","ষড্ + ঋতু","ষট্ + ঋতু","ষট + ঋতু"],"a":2,"e":"ব্যঞ্জনবর্ণের প্রতিটি বর্গের প্রথম ধ্বনিগুলোর (যেমন- ক, চ, ট, ত, প) পরে স্বরধ্বনি থাকলে উক্ত বর্ণগুলোর প্রথম ধ্বনিগুলো বর্গের তৃতীয় ধ্বনিতে রূপান্তরিত হয়। যেমন- 'ক' হয়ে যায় 'গ', 'চ' হয়ে যায় 'জ', 'ট' হয়ে যায় 'ড', 'ত' হয়ে যায় 'দ' এবং 'প' হয়ে যায় 'ব'। পরবর্তী স্বরধ্বনি পূর্ববর্তী ব্যঞ্জন ধ্বনির সাথে যুক্ত হয়ে যায়। যেমন- ট্‌ + অ + অ = ড; ষট্‌ + ঋতু = ষড়ঋতু।","p":15,"id":"q78"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":18,"exam":"১৫তম বিসিএস","q":"'দ্যুলোক' শব্দের যথার্থ সন্ধি-বিচ্ছেদ কোনটি?","o":["দুঃ + লোক","দিব্ + লোক","দ্বি + লোক","দিঃ + লোক"],"a":1,"e":"","p":15,"id":"q79"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":19,"exam":"১০তম বিসিএস","q":"'রত্নাকর' শব্দটির সন্ধি বিচ্ছেদ-","o":["রত্না + কর","রত্ন + কর","রত্না + আকার","রত্ন + আকর"],"a":3,"e":"সন্ধির নিয়মানুসারে অ-কার কিংবা আ-কারের পর আ-কার কিংবা আ-কার থাকলে উভয়ে মিলে আ-কার হয়, আ-কার পূর্ববর্তী ব্যঞ্জনের সাথে যুক্ত হয় অর্থাৎ অ/আ+অ/আ=আ। এখানে, অ + আ = আ হয়েছে। এরূপ আরো কয়েকটি সন্ধির উদাহরণ- হিম + আলয় = হিমালয়, দেব + আলয় = দেবালয়, সিংহ + আসন = সিংহাসন ইত্যাদি।","p":16,"id":"q80"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.8","st":"বাংলা বানানের নিয়ম","n":1,"exam":"৫০তম বিসিএস","q":"কোন গুচ্ছের সবগুলো বানানই শুদ্ধ?","o":["সারথী, নিরীহ, নীরোগ","প্রমান, অঞ্জন, দর্পণ","অনাথা, সুকৃষ্টি, অনুশ্রেয়","একত্রিত, ছায়াবৃত, অর্ধাঙ্গিনী"],"a":-1,"e":"সারথি, প্রমাণ ও অনুশ্রেয় বানানের শুদ্ধরূপ যথাক্রমে সারথি, প্রমাণ এবং অনুশ্রেয়। তবে, একত্র এবং একত্রিত শব্দ দুটির মধ্যে একত্র শব্দটি বেশি শুদ্ধ ও প্রমিত হিসেবে গণ্য করা হয়। আধুনিক বাংলা ভাষার ব্যবহারে 'একত্রিত' শব্দটিও অনেকে ব্যবহার করে থাকেন। কিন্তু ব্যাকরণগত দিক থেকে 'একত্রিত' শব্দটি প্রত্যয়জনিত ভুল হিসেবে বিবেচিত হয়।","p":16,"id":"q81"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.8","st":"বাংলা বানানের নিয়ম","n":2,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"কোন বানানটি প্রমিত?","o":["পশ্চাদপদ","পশ্চাৎগামী","পশ্চাদ্‌ভূমি","পশ্চাৎবতী"],"a":2,"e":"প্রমিত বানান: পশ্চাদ্‌ভূমি, যার সন্ধিবিচ্ছেদ- পশ্চাৎ + ভূমি, শব্দটি বিশেষ্যপদ যা সংস্কৃত ভাষা থেকে এসেছে। শব্দটির অর্থ- পটভূমি।","p":16,"id":"q82"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.8","st":"বাংলা বানানের নিয়ম","n":3,"exam":"৪৭তম বিসিএস","q":"১৯৩৬ সালে কলিকাতা বিশ্ববিদ্যালয়ের বানান সংস্কারের মূল উদ্দেশ্য ছিল-","o":["বানানকে উচ্চারণের কাছাকাছি নেওয়া","বানানের ঐতিহ্যকে বজায় রাখা","বানানের নিয়ম প্রণয়ন করা","বানানে বিকল্প বর্জন করা"],"a":3,"e":"বাংলা বানান সংস্কারে ১৯৩৫ খ্রিষ্টাব্দে কলকাতা বিশ্ববিদ্যালয় গঠন করে বাংলা বানান সংস্কার কমিটি। বাংলা বানান সংস্কার কমিটির সভাপতি ছিলেন রাজশেখর বসু। ১৯৩৬ সালে এ কমিটির বানানরীতি সংক্রান্ত প্রতিবেদন প্রকাশিত হয়। ১৯৩৬ সালে কলকাতা বিশ্ববিদ্যালয়ের বানান সংস্কারের মূল লক্ষ্য ছিল, বানানে বিকল্প বর্জন করা। অর্থাৎ যেসব শব্দের একাধিক বানান প্রচলিত আছে (যেমন: ঔষধ/ওষুধ, কাণ্ড/কান্ড ইত্যাদি), সেসব শব্দের একটি বানানকে মান্য হিসেবে ঠিক করা।","p":16,"id":"q83"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":20,"exam":"৪৭তম বিসিএস","q":"'ব্যাং' শব্দটি ং দিয়ে লিখতে হবে, কারণ-","o":["ঙ-এর হ্রস্ব উচ্চারণ ং হয়","ট্যা-এর পর ং হয়","ং বাংলা ভাষার নিজস্ব বর্ণ","ব্যাং একটি একাক্ষর শব্দ"],"a":0,"e":"১৯৩৬ সালে কলকাতা বিশ্ববিদ্যালয় প্রণীত বাংলা বানান সংস্কার কমিটির সুপারিশ অনুযায়ী অতৎসম শব্দের ক্ষেত্রে: ঙ হ্রস্ব ধ্বনি হলে বিকল্পে ং বা ঙ বিধেয়। যেমন- ব্যাঙ > ব্যাং, রং > রঙ। স্বরাশ্রিত হলে ঙ বিধেয়। যেমন- ব্যাঙ, রঙ।","p":16,"id":"q84"},{"c":2,"ct":"ধ্বনিতত্ত্ব","s":"2.7","st":"সন্ধি","n":21,"exam":"৪৭তম বিসিএস","q":"পূর্ববঙ্গীয় উচ্চারণে 'স্মরণ' শব্দের ক্ষেত্রে কোনটি ঘটে?","o":["স-এর উচ্চারণ শ হয়ে যায়","ণ-এর ি বা গ্রন্থ।","p":19,"id":"q119"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":2,"exam":"৪৬তম বিসিএস","q":"বাংলা শব্দ ভাণ্ডারের অনার্য জাতির ব্যবহৃত শব্দ-","o":["তৎসম","তদ্ভব","দেশি","বিদেশি"],"a":2,"e":"ভারতীয় উপমহাদেশের স্থানীয় জনগোষ্ঠী যাদের ভাষা, সংস্কৃতি ও ধর্ম ছিল- আর্য বা ইন্দো-ইউরোপীয় জনগোষ্ঠী থেকে আলাদা, তাদের অনার্য বলা হয়। এই অনার্য বা বাংলাদেশের আদিম অধিবাসীদের (যেমন: কোল, মুণ্ডা প্রভৃতি) ভাষা ও সংস্কৃতির কিছু কিছু উপাদান বাংলায় রক্ষিত হয়েছে। এসব শব্দকে দেশি শব্দ বলে। যেমন: কুড়ি (বিশ-কোলভাষা), পেট (উদর- তামিল ভাষা), কুলা, গঞ্জ, চোড়া, টোপর, ডাব, ডাগর, ডিডি, ঢেঁকি।","p":19,"id":"q120"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":3,"exam":"৪৬তম বিসিএস","q":"যোগরূঢ় শব্দ কোনটি?","o":["কলম","মলম","বাঁশি","শাখামৃগ"],"a":3,"e":"অর্থ অনুসারে বাংলা শব্দ তিন ধরনের: ক. যৌগিক, খ. রূঢ় বা রূঢ়ি এবং গ. যোগরূঢ়। সমাস নিষ্পন্ন যে সকল শব্দ সম্পূর্ণভাবে সমস্যমান পদসমূহের অনুগামী না হয়ে কোনো বিশিষ্ট অর্থ গ্রহণ করে তাদের যোগরূঢ় শব্দ বলে। যেমন: শাখামৃগ। শাখা অর্থ গাছ এবং মৃগ অর্থ হরিণ। শাখামৃগ অর্থ হওয়া উচিত গাছের হরিণ। কিন্তু শাখামৃগ শব্দের অর্থ বানর। অন্যান্য যোগরূঢ় শব্দ- পঙ্কজ, রাজপুত, মহাযাত্রা, জলধি, জলদ, তুরঙ্গম।","p":19,"id":"q121"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":4,"exam":"৪৫তম বিসিএস","q":"নিচের কোনটি যৌগিক শব্দ?","o":["প্রবীণ","জ্যেঠামি","সরোজ","মিতালি"],"a":3,"e":"যেসব শব্দের ব্যুৎপত্তিগত অর্থ ও প্রচলিত অর্থের মধ্যে কোনো পার্থক্য নেই, অর্থাৎ একই রকম, সেসব শব্দকে যৌগিক শব্দ বলে। যেমন: বাংলা 'মিতালি' শব্দের ব্যুৎপত্তিগত অর্থ 'মিতার ভাব, বন্ধুত্ব' ('মিতা' শব্দের পর 'ভাব'- অর্থে তদ্ধিত প্রত্যয় 'আলি'-যোগে 'মিতালি' হয়েছে); শব্দটি এই অর্থেই একই; ফলে 'মিতালি' বাংলাতে যৌগিক শব্দ। এরকম- গায়ক, কর্তব্য, মধুর, বাবুয়ানা, দৌহিত্র, মানব, ধাতব, পানসা, একাক, চিকামারা ইত্যাদি। অন্যদিকে যেসব শব্দ বিশ্লেষণ করা যায় না বা ভেঙে আলাদা করা যায় না, সেসব শব্দকে মৌলিক শব্দ বলে। যেমন- গোলাপ, তিন, নাক, লাল, মা, পা।","p":19,"id":"q122"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":5,"exam":"৪৫তম বিসিএস","q":"আরবি 'কলম' শব্দটি 'কলমোস' শব্দ থেকে এসেছে। 'কলমোস' কোন ভাষার শব্দ?","o":["পাঞ্জাবি","ফরাসি","গ্রিক","স্পেনিশ"],"a":2,"e":"আরবি কলম শব্দটি প্রাচীন গ্রিক শব্দ কোলামাস (Kalamos) থেকে এসেছে, যার অর্থ লম্বা ঘাস জাতীয় উদ্ভিদ। মূলত এসকল ঘাসের নলাকৃতির কাণ্ড ফুকিয়ে তা দিয়ে কলম হিসেবে লেখার কাজে ব্যবহার করা হতো বলে আরবিতে কোলামাস শব্দটি থেকে কলম শব্দটির উদ্ভব হয়। গ্রিক থেকে বাংলায় আগত আরো কিছু শব্দের মধ্যে রয়েছে- দাম (দ্রাখমে), সেমাই (সেমাদালিম), সুড়ঙ্গ (সুরিঙ্গ), ইউনানি (আইওনিয়ন)। এছাড়া পাঞ্জাবি ভাষা থেকে আগত শব্দের মধ্যে রয়েছে- চাহিদা, শিখ, গুরুদুয়ারা, খালসা; স্পেনিশ থেকে আগত- ডেঙ্গু, কুইনাইন।","p":19,"id":"q123"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":6,"exam":"৪৪তম বিসিএস","q":"'হরতাল' কোন ভাষা থেকে আগত শব্দ?","o":["পর্তুগিজ","হিন্দি","ফরাসি","গুজরাটি"],"a":3,"e":"গুজরাটি ভাষা থেকে আগত শব্দ: খদ্দর, হরতাল, খাদি, গবরা, চরকা ইত্যাদি। এছাড়া হিন্দি ভাষা থেকে আগত শব্দ: পানি, ধোলাই, লাগাতার, সমঝোতা, হালুয়া, আচ্ছা, চাচা, চাটা, দাদা, দাদি, দুলা, ফুফা, ফুফি, ছিনতাই; ফরাসি ভাষা থেকে আগত শব্দ: কার্তুজ, কুপন, ডিপো, রেস্তোরাঁ, ওলন্দাজ, দিনেমার, বুর্জোয়া, রেনেসাঁস।","p":19,"id":"q124"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":7,"exam":"৪৪তম বিসিএস","q":"নিচের কোনটি তৎসম শব্দ?","o":["পছন্দ","হিসাব","ধূলি","শৌখিন"],"a":2,"e":"যেসব শব্দ সংস্কৃত ভাষা থেকে সরাসরি বাংলায় এসেছে এবং যাদের রূপ অপরিবর্তিত রয়েছে তাকে তৎসম শব্দ বলে। কয়েকটি তৎসম শব্দ হলো: চন্দ্র, সূর্য, নক্ষত্র, ভবন, ধর্ম, পাত্র, ধূলি, মনুষ্য, কার্য, পদ্ম, অগ্ন, নিমন্ত্রণ, গগন ইত্যাদি। এর বাইরে সংস্কৃত ব্যাকরণের নিয়মানুসারে গঠিত পারিভাষিক শব্দও তৎসম। যেমন- অধ্যাদেশ, গণপ্রজাতন্ত্রী, মহাপরিচালক, সচিবালয়।","p":20,"id":"q125"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":8,"exam":"৪৩তম বিসিএস","q":"'আসমান' কোন ভাষা থেকে আগত শব্দ?","o":["পর্তুগিজ","ফরাসি","আরবি","ফারসি"],"a":3,"e":"'আসমান' শব্দটি ফারসি ভাষা থেকে আগত। ফারসি ভাষা থেকে আগত কয়েকটি শব্দ- আইন, আফগান, খবির, গোয়েন্দা, নামাজ, রোজা, চশমা, আমদানি, রফতানি, দফতর, বেগম, মেথর, পেরেশান।","p":20,"id":"q126"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":9,"exam":"৪২তম, ৩৮তম বিসিএস","q":"'বাবা' কোন ভাষার অন্তর্গত শব্দ?","o":["তৎসম","তদ্ভব","ফারসী","তুর্কি"],"a":3,"e":"তুর্কি ভাষা থেকে বাংলায় আগত শব্দের মধ্যে রয়েছে- চাকর, বাবা, চাকু, তোপ, উজবুক, দারোগা, কাঁচি, খাতুন, বাইজি, মুচলেকা, সওগাত, বিবি, লাশ, ঠাকুর, খোকা, বাবুর্চি, উর্দি।","p":20,"id":"q127"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":10,"exam":"৪১তম বিসিএস","q":"'সোমত্ত' শব্দটির উৎপত্তি কোন শব্দ থেকে?","o":["সোপান","সমর্থ","সোল্লাস","সওয়ার"],"a":1,"e":"'সোমত্ত' ব্যুৎপত্তিগতভাবে সমর্থের অর্ধতৎসম রূপ। সোমত্ত, সমর্থ (বিশেষণ) এটি তৎসম বা সংস্কৃত থেকে উৎপন্ন। অর্থ-বিয়ের উপযুক্ত, যৌবনপ্রাপ্ত, সমর্থ বয়ঃপ্রাপ্ত (সোমত্ত মেয়ে মাথার উপরে-কাজী আবদুল ওদুদ)।","p":20,"id":"q128"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":11,"exam":"৪০তম বিসিএস","q":"'গীর্জা' কোন ভাষার অন্তর্গত শব্দ?","o":["ফারসি","পর্তুগিজ","ওলন্দাজ","পাঞ্জাবি"],"a":1,"e":"পর্তুগিজ ভাষা হতে আগত কতিপয় বাংলা শব্দ হলো: আলকাতরা, আলপিন, আলমারি, পেরেক, জানালা, বারান্দা, কামরা, ইরেজ, গুদাম, গির্জা, পাদ্রি, কেরানি, আয়া, পেঁপে, পেয়ারা, আতা, আচার, পাউরুটি, তামাক, বোতাম, ফিতা, টুপি, সেমিজ, কামিজ, সাবান, তোয়ালে, গামলা, বালতি।","p":20,"id":"q129"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":12,"exam":"৪০তম বিসিএস","q":"'জোছনা' কোন শ্রেণির শব্দ?","o":["যৌগিক","তৎসম","দেশি","অর্ধ-তৎসম"],"a":3,"e":"বাংলা ভাষায় কিছু সংস্কৃত শব্দ কিঞ্চিৎ পরিবর্তিত আকারে ব্যবহৃত হয়। এগুলোকে বলে অর্ধ-তৎসম শব্দ। যেমন- জ্যোৎস্না > জোছনা, শ্রাদ্ধ > ছেরাদ্দ, গৃহিণী > গিন্নি, বৈভব > বোইঠম, কুৎসিত > কুচ্ছিত।","p":20,"id":"q130"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":" "ওলন্দাজ ভাষা হতে"],"a":0,"e":"","p":21,"id":"q149"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.1","st":"শব্দের শ্রেণিবিভাগ ও শব্দ ভাণ্ডার","n":32,"exam":"১০তম বিসিএস","q":"কোনটি তদ্ভব শব্দ?","o":["চাঁদ","সূর্য","নক্ষত্র","গগন"],"a":0,"e":"প্রাচীন ভারতীয় আর্যভাষা থেকে বিবর্তিত যেসব শব্দ বাংলা ভাষায় একেবারেই স্বতন্ত্র তাদেরকে তদ্ভব শব্দ বলে। যেমন: হস্ত > হাত, চন্দ্র > চাঁদ, চর্মকার > চামার; এরূপ- পা, কান, নাক, জিভ, দাঁত, হাতি, ঘোড়া, সাপ, পাখি।","p":21,"id":"q150"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":1,"exam":"৫০তম বিসিএস","q":"'বেতার, বিপত্নীক'-শব্দ দুটি কোন সমাসের উদাহরণ?","o":["নঞ তৎপুরুষ, বহুব্রীহি","কর্মধারয়, বহুব্রীহি","অব্যয়ীভাব, তৎপুরুষ","তৃতীয় তৎপরুষ, দ্বিগু সমাস"],"a":0,"e":"বাংলা ব্যাকরণে 'বেতার' ও 'বিপত্নীক' শব্দ দুটি সমাসের ক্ষেত্রে নঞ তৎপুরুষ এবং বহুব্রীহি উভয় নিয়মেই ব্যাখ্যা করা যায়, তবে সমাসবদ্ধ পদের অর্থ অনুযায়ী এদের প্রয়োগ ভিন্ন হয়। যেমন: বেতার: নঞ তৎপুরুষ সমাস: নেই তার = বেতার, বহুব্রীহি সমাস: নেই তার যার = বেতার। বিপত্নীক: নঞ তৎপুরুষ সমাস: নেই পত্নী = বিপত্নীক, বহুব্রীহি সমাস: বি (বিগত) হয়েছে পত্নী যার = বিপত্নীক।","p":22,"id":"q151"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":2,"exam":"৫০তম বিসিএস","q":"'রাজপথ' শব্দের ব্যাসবাক্য কোনটি?","o":["রাজা ও পথ","রাজার পথ","বিশাল পথ","পথের রাজা"],"a":3,"e":"ষষ্ঠী তৎপুরুষ সমাসের ক্ষেত্রে ব্যাসবাক্যে 'রাজা' শব্দ পরে থাকলে সম্বন্ধপদে তা আগে আসে। যেমন- পথের রাজা = রাজপথ, হাঁসের রাজা = রাজহাঁস ইত্যাদি।","p":22,"id":"q152"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":3,"exam":"৪৯তম বিসিএস (শিক্ষা)","q":"'স্বাধীন' শব্দের ব্যাসবাক্য কোনটি?","o":["স্বীয়-এর অধীন","স্বদার অধীন","স্ব-এর অধীন","স্বতের-অধীন"],"a":2,"e":"স্বাধীন শব্দটির ব্যাসবাক্য হলো: স্ব-এর অধীন। 'স্ব' অর্থ 'নিজের' এবং 'অধীন' অর্থ 'নিয়ন্ত্রণাধীন'। এটি ষষ্ঠী তৎপুরুষ সমাস।","p":22,"id":"q153"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":4,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"বাংলা অব্যয়ীভাব সমাসের উদাহরণ ব্যাকরণের কোন অংশের অন্তর্ভুক্ত করা যায়?","o":["সন্ধি","উপসর্গ","কারক","প্রত্যয়"],"a":1,"e":"যে সমাসে পূর্বপদে অব্যয় বা উপসর্গ থাকে, উত্তরপদে বিশেষ্য থাকে এবং অব্যয়ের অর্থ প্রধান হয়ে দেখা দেয় তাকে অব্যয়ীভাব সমাস বলে। বাংলা ভাষায় ব্যবহৃত অব্যয়সূচক শব্দাংশকেও উপসর্গ বলে। তাই উপসর্গযোগে গঠিত সব শব্দই অব্যয়ীভাব সমাস হয়। অব্যয়ীভাব সমাসের উদাহরণ: আ (উপসর্গ) + কণ্ঠ = আকণ্ঠ; পরি (উপসর্গ) + পূর্ণ = পরিপূর্ণ; উপ (উপসর্গ) + গ্রহ = উপগ্রহ।","p":22,"id":"q154"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":5,"exam":"৪৬তম বিসিএস","q":"'নীলকর' কোন সমাসের দৃষ্টান্ত?","o":["দ্বন্দ্ব","বহুব্রীহি","নিত্য","উপপদ তৎপুরুষ"],"a":3,"e":"ক্রিয়াপদের পরবর্তী পদের সঙ্গে উপপদ (কৃদন্ত পদের আগের পদকে উপপদ বলে) এর সাথে যে সমাস হয় তাকে উপপদ তৎপুরুষ বলে। যেমন: পদ্মে জন্মে যা = পঙ্কজ, অগ্রে গমন করে যে = অগ্রগামী, নীল সংক্রান্ত কর আদায় করে যে = নীলকর, জল দেয় যে = জলদ। অনুরূপভাবে- হেলেপরা, পকেটমার, গৃহস্থ, সত্যবাদী, ইন্দ্রজিৎ, পাতাচাটা, বর্ণচোরা, হাড়ভাঙা।","p":22,"id":"q155"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":6,"exam":"৪৪তম বিসিএস","q":"'যথারীতি' কোন সমাসের দৃষ্টান্ত?","o":["অব্যয়ীভাব","দ্বিগু","বহুব্রীহি","দ্বন্দ্ব"],"a":0,"e":"পূর্বপদে অব্যয়যোগে নিষ্পন্ন সমাসে যদি অব্যয়ের অর্থই প্রাধান্য থাকে, তবে তাকে অব্যয়ীভাব সমাস বলে। যেমন: রীতিকে অতিক্রম না করে = যথারীতি, ঈষৎ নত = আনত এরূপ: যথাসাধ্য, যথাবিধি, যথাযোগ্য, পরোক্ষ উপকণ্ঠ, উপকূল, নিরামিষ, নির্জল, উপশহর।","p":22,"id":"q156"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":7,"exam":"৪৩তম বিসিএস","q":"'চিকিৎসাশাস্ত্র' কোন সমাস?","o":["কর্মধারয়","বহুব্রীহি","অব্যয়ীভাব","তৎপুরুষ"],"a":0,"e":"বিশেষণ বা বিশেষণভাবাপন্ন পদের সাথে বিশেষ্য বা বিশেষ্যভাবাপন্ন পদের সমাস, যেখানে পরপদের অর্থ প্রাধান্য পায় তাকে কর্মধারয় সমাস বলে। যেমন: চিকিৎসা বিষয়ক শাস্ত্র = চিকিৎসাশাস্ত্র, যিনি জজ তিনিই সাহেব = জজসাহেব; এরূপ- সাহিত্যসভা, স্মৃতিসৌধ, নীলপদ্ম, মহাপুরুষ, খাসমহল, শান্তিশিষ্ট, কাঁচামিঠা, মহাকীর্তি, গোলাপফুল, কনকচাঁপা, ঘরজামাই।","p":22,"id":"q157"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":8,"exam":"৪২তম বিসিএস","q":"মধ্যপদলোপী কর্মধারয় সমাস কোনটি?","o":["সিংহ চিহ্নিত আসন = সিংহাসন","মহান যে পুরুষ = মহাপুরুষ","কুসুমের মতো কোমল = কুসুমকোমল","জায়া ও পতি = দম্পতি"],"a":0,"e":"যে কর্মধারয় সমাসে ব্যাসবাক্যের মধ্যপদ লোপ পায় তাকে মধ্যপদলোপী কর্মধারয় সমাস বলে। যেমন- সিংহ চিহ্নিত আসন = সিংহাসন, জ্যোৎস্না শোভিত রাত = জ্যোৎস্নারাত, স্মৃতি রক্ষার্থে সৌধ = স্মৃতিসৌধ; এরূপ- পলাশ, হাসিমুখ, জীবনবীমা, বাষ্পযান, ষোড়শ, প্রীতিভোজ।","p":22,"id":"q158"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":9,"exam":"৪১তম বিসিএস","q":"উপমান কর্মধারয় সমাসের উদাহরণ কোনটি?","o":["শশব্যস্ত","কালচক্র","পরাণপাখি","বহুব্রীহি"],"a":0,"e":"উপমান অর্থ তুলনীয় বস্তু। প্রত্যেক কোনো বস্তুর (উপমেয়) সাথে পরোক্ষ বস্তুর (উপমান) তুলনা করলে যে সমাস হয় তাকে উপমান কর্মধারয় সমাস বলে। যেমন: শশকের ন্যায় ব্যস্ত = শশব্যস্ত। তুষারের ন্যায় শুভ্র = তুষারশুভ্র।","p":23,"id":"q159"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":10,"exam":"৩৯তম বিসিএস","q":"কোনটি ব্যতিহার বহুব্রীহির উদাহরণ?","o":["অজানা","দোতলা","আশীবিষ","কানাকানি"],"a":3,"e":"যে বহুব্রীহি সমাসে দুটি একরূপ বিশেষ্য দিয়ে এক জাতীয় কাজ বোঝায় তাকে ব্যতিহার বহুব্রীহি সমাস বলে। যেমন: কানে কানে যে কথা = কানাকানি, লাঠিতে লাঠিতে যে লড়াই = লাঠালাঠি; এরূপ- হাতাহাতি, হাসাহাসি, কোলাকুলি, চুলাচুলি। অন্যদিকে অজানা, দোতলা ও আশীবিষ যথাক্রমে নঞ, প্রত্যয়ান্ত ও ব্যধিকরণ বহুব্রীহি সমাস।","p":23,"id":"q160"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":11,"exam":"৩৮তম বিসিএস","q":"'পুষ্পসৌরভ' কোন সমাসের উদাহরণ?","o":["তৎপুরুষ","কর্মধারয়","অব্যয়ীভাব","বহুব্রীহি"],"a":0,"e":"পুষ্পসৌরভ = পুষ্পের সৌরভ; এটি ষষ্ঠী তৎপুরুষ সমাস। পূর্বপদে ষষ্ঠী বিভক্তির (র, এর) লোপ হয়ে যে সমাস হয় তাকে ষষ্ঠী তৎপুরুষ সমাস বলে। আরও কয়েকটি ষষ্ঠী তৎপুরুষ সমাস হলো- শত্রুবাড়ি, বৃহস্পতি, চাবাগান, কবিকঙ্ক, পূর্বাহ্ন, ছাগদুগ্ধ, বনস্পতি, গণতন্ত্র, রাজপথ, রাজপুত্র, শ্বেয়াঘাট, ছাত্রসমাজ, দেশসেবা, বিদ্যাসাগর।","p":23,"id":"q161"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":12,"exam":"৩৭তম বিসিএস","q":"'জলে-স্থলে' কী সমাস?","o":["সমার্থক দ্বন্দ্ব","বিপরীতার্থক দ্বন্দ্ব","অলুক দ্বন্দ্ব","একশেষ দ্বন্দ্ব"],"a":2,"e":"পূর্বপদ ও পরপদ উভয়ের অর্থ প্রাধান্য পেলে তাকে দ্বন্দ্ব সমাস বলে। যেমন- ভাই-বোন, স্বর্গ-নরক, আলো-ছায়া ইত্যাদি। দ্বন্দ্ব সমাসে যদি পদের মধ্যকার বিভক্তি লোপ না পায় তবে সেটি অলুক দ্বন্দ্ব। যেমন- জলে ও স্থলে = জলে-স্থলে; এরূপ- দেশে-বিদেশে, নয়ে-ছয়ে, দুধে-ভাতে ইত্যাদি। সম অর্থপূর্ণ দুটি পদের মিলন হলে তাকে বলা হয় সমার্থক দ্বন্দ্ব। যেমন- জন-মানব, কাজ-কর্ম, নাম-ডাক, হাট-বাজার ইত্যাদি। বিপরীত অর্থপূর্ণ দুটি পদের মিলন হলে তাকে বলা হয় বিপরীতার্থক দ্বন্দ্ব। যেমন- লাভ-লোকসান, আয়-ব্যয়, ছোট-বড় ইত্যাদি। এর বাইরে একশেষ দ্বন্দ্ব এর উদাহরণ- জায়া ও পতি = দম্পতি, তুমি ও সে = তোমরা।","p":23,"id":"q162"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":13,"exam":"৩৭তম বিসিএস","q":"'বিস্ময়াপন্ন' সমস্ত পদটির সঠিক ব্যাসবাক্য কোনটি?","o":["বিস্ময় দ্বারা আপন্ন","বিস্ময়কে আপন্ন","বিস্ময়েকে আপন্ন","বিস্ময়ে যে আপন্ন"],"a":1,"e":"পূর্বপদের দ্বিতীয়া বিভক্তি লোপ পেয়ে দ্বিতীয়া তৎপুরুষ সমাস হয়। যেমন- বিস্ময়কে আপন্ন = বিস্ময়াপন্ন; তবে কিছুক্ষেত্রে ব্যক্তি অর্থেও দ্বিতীয়া তৎপুরুষ হয়। যেমন- চিরকাল ব্যাপিয়া সুখী = চিরসুখী। দ্বিতীয়া তৎপুরুষ সমাসের আরো কিছু উদাহরণ- বিপদাপন্ন, রথচালন, পুত্রলাভ, শরণাগত, তারাপ্রাপ্ত।","p":23,"id":"q163"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":14,"exam":"৩৬তম বিসিএস","q":"বহুব্রীহি সমাসবদ্ধ পদ কোনটি?","o":["জনশ্রুতি","অনন্যমনা","খাসমহল","তপোবন"],"a":1,"e":"যে সমাসে সমস্যমান পদগুলোর কোনোটির অর্থ না বুঝিয়ে, অন্য কোনো পদকে বোঝায়, তাকে বহুব্রীহি সমাস বলে। বিশেষ পূর্বপদের আগে নঞ (না অর্থবোধক) অব্যয় যোগ করে বহুব্রীহি সমাস করা হলে তাকে নঞ বহুব্রীহি বলে। যেমন- নেই মনন যার = অনন্যমনা, নাচার, অজানা।","p":23,"id":"q164"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":15,"exam":"৩৫তম বিসিএস","q":"'জজ সাহেব' কোন সমাসের উদাহরণ?","o":["দ্বিগু","কর্মধারয়","দ্বন্দ্ব","বহুব্রীহি"],"a":1,"e":"","p":23,"id":"q165"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":16,"exam":"৩২তম বিসিএস","q":"'আলোছায়া' পদটি কোন সমাসের অন্তর্গত?","o":["দ্বন্দ্ব সমাস","অব্যয়ীভাব সমাস","তৎপুরুষ সমাস","কর্মধারয় সমাস"],"a":0,"e":"","p":23,"id":"q166"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":17,"exam":"৩১তম বিসিএস","q":"সমাসবদ্ধ শব্দ 'আনত' কোন সমাসের উদাহরণ?","o":["বহুব্রীহি","কর্মধারয়","সুপসুপা","অব্যয়ীভাব"],"a":3,"e":"","p":23,"id":"q167"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":18,"exam":"৩০তম বিসিএস","q":"'জ্যোৎস্নারাত' কোন সমাসের দৃষ্টান্ত?","o":["মধ্যপদলোপী কর্মধারয়","ষষ্ঠী তৎপুরুষ","পঞ্চমী তৎপুরুষ","উপমান কর্মধারয়"],"a":0,"e":"","p":23,"id":"q168"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":19,"exam":"২৯তম, ১১তম বিসিএস","q":"সমাস ভাষাকে কি করে?","o":["সংক্ষেপ করে","বিস্তৃত করে","অর্থপূর্ণ করে","অর্থের রূপান্তর ঘটায়"],"a":0,"e":"সমাস শব্দের অর্থ সংক্ষেপণ, মিলন, একাধিক পদের একপদীকরণ। পরস্পর সম্পর্কযুক্ত একাধিক পদের এক পদে মিলিত হয়ে নতুন একটি শব্দ গঠনের প্রক্রিয়াকে সমাস বলে। যেমন- দেশের সেবা = দেশসেবা।","p":23,"id":"q169"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":20,"exam":"২৭তম বিসিএস","q":"প্রত্যক্ষ কোনো বস্তুর সাথে পরোক্ষ কোনো বস্তুর তুলনা করলে প্রত্যক্ষ বস্তুটিকে বলা হয়___।","o":["উপমিত","উপমান","উপমেয়","রূপক"],"a":2,"e":"কর্মধারয় সমাসে উপমেয় (যাকে তুলনা করা হয়) এর সাথে উপমান (যার সাথে তুলনা করা হয়) পদের যে সমাস হয় তাকে উপমিত কর্মধারয় সমাস বলে। যেমন: পুরুষ সিংহের ন্যায় = সিংহপুরুষ, আঁখি পদ্মের ন্যায় = পদ্মআঁখি, চাঁদের মত মুখ = চাঁদমুখ; এরূপ- সোনামুখ, ফুলকুমারী, পদ্মলোচন, চরণকমল।","p":24,"id":"q170"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":21,"exam":"২৬তম, ১৭তম বিসিএস","q":"'লাঠালাঠি'-এটি কোন সমাস?","o":["প্রাদি সমাস","ব্যতিহার বহুব্রীহি সমাস","তৎপুরুষ সমাস","কর্মধারয় সমাস"],"a":1,"e":"","p":24,"id":"q171"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":22,"exam":"২৫তম বিসিএস","q":"যে সমাসের পূর্বপদ সংখ্যাবাচক এবং সমস্ত পদের দ্বারা সমাহার বোঝায় তাকে বলে-","o":["দ্বন্দ্ব সমাস","রূপক সমাস","বহুব্রীহি সমাস","দ্বিগু সমাস"],"a":3,"e":"যে সমাসে সমাহার অর্থাৎ সমষ্টি অর্থে সংখ্যাবাচক পূর্বপদের সাথে উত্তরপদের অর্থ প্রধানরূপে প্রতীয়মান হয় তাকে দ্বিগু সমাস বলে। যেমন: সে (তিন) তারের সমাহার = সেতার, শত অন্দের সমাহার = শতাব্দী, তিন মাথার সমাহার = তেমাথা, তিন কালের সমাহার = ত্রিকাল।","p":24,"id":"q172"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":23,"exam":"২৫তম বিসিএস","q":"'চাঁদমুখ'-এর ব্যাসবাক্য হলো-","o":["চাঁদমুখের ন্যায়","চাঁদের মত মুখ","চাঁদ মুখ যার","চাঁদরূপ মুখ"],"a":1,"e":"","p":24,"id":"q173"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":24,"exam":"২৩তম বিসিএস","q":"যে সমাসের ব্যাসবাক্য হয় না, কিংবা তা করতে গেলে অন্য পদের সাহায্য নিতে হয়, তাকে বলা হয়-","o":["দ্বন্দ্ব সমাস","অব্যয়ীভাব সমাস","কর্মধারয় সমাস","নিত্য সমাস"],"a":3,"e":"যে সমাসের পদগুলো নিত্য সমাসবদ্ধ থাকে, ব্যাসবাক্যের প্রয়োজন হয় না তাকে নিত্যসমাস বলে। যেমন: দুই এবং নব্বই = বিরানব্বই, সে, তুমি ও আমি = আমরা; এরূপ- কালসাপ, গ্রামান্তর, দর্শনমাত্র, গৃহান্তর।","p":24,"id":"q174"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":25,"exam":"২০তম বিসিএস","q":"কোনটি দ্বন্দ্ব সমাসের উদাহরণ?","o":["সিংহাসন","ভাই-বোন","কানাকানি","গাছপাকা"],"a":1,"e":"","p":24,"id":"q175"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.2","st":"সমাস","n":26,"exam":"১৩তম বিসিএস","q":"মধ্যপদলোপী কর্মধারয়-এর দৃষ্টান্ত?","o":["ঘর থেকে ছাড়া-ঘড়ছাড়া","অরুণের মতো রাঙা- অরুণরাঙা","হাসিমাখা মুখ-হাসিমুখ","ক্ষণ ব্যাপিয়া স্থায়ী-ক্ষণস্থায়ী"],"a":2,"e":"","p":24,"id":"q176"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.3","st":"ধাতু","n":1,"exam":"৫০তম বিসিএস","q":"কোন বাক্যে সমধাতুজ কর্ম রয়েছে?","o":["সে বই পড়ছে","সে গভীর চিন্তায় মগ্ন","আজ এমন ঘুম ঘুমিয়েছি","সে খেলা করছে"],"a":2,"e":"'আজ এমন ঘুম ঘুমিয়েছি'-বাক্যে ঘুম পদটি একটি সমধাতুজ কর্ম। যখন বাক্যের ক্রিয়া (ঘুমিয়েছি) এবং কর্ম (ঘুম) একই ধাতু (ঘুম) থেকে গঠিত হয়, তখন সেই কর্মকে সমধাতুজ কর্ম বলে।","p":24,"id":"q177"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.3","st":"ধাতু","n":2,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"ক্রিয়াপদের মূল অংশকে কী বলে?","o":["কর্ম","ধাতু","প্রত্যয়","বিভক্তি"],"a":1,"e":"ক্রিয়াপদের মূল অংশকে বলা হয় ধাতু বা ক্রিয়ামূল। ক্রিয়াপদকে বিশ্লেষণ করলে দুটি অংশ পাওয়া যায়: ধাতু বা ক্রিয়ামূল এবং ক্রিয়া বিভক্তি।","p":24,"id":"q178"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.3","st":"ধাতু","n":3,"exam":"৪৪তম বিসিএস","q":"নিচের কোনটি বাংলা 'ধাতু'র দৃষ্টান্ত?","o":["কহ","বুধ","কথ","গঠ"],"a":0,"e":"কিছু বাংলা ধাতুর উদাহরণ: আঁক, কহ, কাট, কর, কাঁদ, কিন, খা, গড়, ঘষ, দেখ, ধর, পড়, বাঁধ, বুঝ, রাখ, তন, থাক, হাস্‌। কিছু সংস্কৃত ধাতুর উদাহরণ: অন্ত, কথ, কৃষ্‌, কৃ, ক্রন্দ, ক্রী, খাদ, গঠ, ঘৃষ্‌, দৃশ্‌, ধৃ, পঠ, বন্ধ, বুধ, বৃক্ষ, শ্রু, স্থা, হস্‌।","p":24,"id":"q179"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.3","st":"ধাতু","n":4,"exam":"৪৩তম বিসিএস","q":"কোনটি নামধাতুর উদাহরণ?","o":["চল","কর","বেতা","পড়"],"a":2,"e":"সাধারণ বিশেষ্য বা বিশেষণের সাথে 'আ' যুক্ত করে গঠিত ধাতুকে নাম ধাতু বলা হয়। যেমন- হাত + আ = হাতা, লাথি + আ = লাথা, বেত + আ = বেতা।","p":24,"id":"q180"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.3","st":"ধাতু","n":5,"exam":"২৬তম বিসিএস","q":"'যা কিছু হারায় গিন্নী বলেন, কেষ্টা বেটাই চোর'-এখানে 'হারায়' কোন ধাতু?","o":["প্রযোজ্য ধাতু","ভাববাচ্যের ধাতু","সংযোগমূলক ধাতু","নাম ধাতু"],"a":-1,"e":"সঠিক হবে প্রযোজক ধাতু। মৌলিক ধাতুর পরে প্রেরণার্থে (অপরকে নিয়োজিত করা অর্থে) 'আ' প্রত্যয় যোগ করে যে ধাতু গঠিত হয় তাকেই প্রযোজক বা নিজন্ত ধাতু বা কখনও কখনও কর্মবাচ্যের ধাতু বলা হয়।","p":24,"id":"q181"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.3","st":"ধাতু","n":6,"exam":"১৮তম বিসিএস","q":"ধাতুর পর কোন প্রত্যয় যুক্ত করে ভাববাচক বিশেষ্য বুঝায়?","o":["আন","আই","আল","আও"],"a":0,"e":"ভাববাচক বিশেষ্য গঠনে 'আই প্রত্যয়' এবং 'আও' প্রত্যয় উভয়ই ব্যবহৃত হয়। যেমন- চড়্‌ + আই = চড়াই, সিল্‌ + আই = সিলাই > সেলাই, √পাকড়্‌ + আও = পাকড়াও।","p":25,"id":"q182"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.3","st":"ধাতু","n":7,"exam":"১৫তম বিসিএস","q":"কোন বাক্যটিতে সমধাতুজ কর্ম আছে?","o":["সে বই পড়ছে","সে গভীর চিন্তায় মগ্ন","সে ঘুমিয়ে আছে","সে যে চাল চেলেছে তাতে তাকে ষড়যন্ত্রকারী ছাড়া আর কিছু বলা যায় না"],"a":3,"e":"বাক্যের ক্রিয়া ও কর্ম যদি একই ধাতু থেকে উৎপন্ন হয় তবে সেই বাক্যের কর্মকে সমধাতুজ কর্ম বলে। এই বাক্যে 'চাল' কর্ম এবং চেলেছে 'ক্রিয়াপদ' একই ধাতু থেকে উৎপন্ন হয়েছে।","p":25,"id":"q183"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.3","st":"ধাতু","n":8,"exam":"১২তম, ১০তম বিসিএস","q":"ক্রিয়া পদের মূল অংশকে বলা হয়?","o":["বিভক্তি","ধাতু","প্রত্যয়","কৃৎ"],"a":1,"e":"","p":25,"id":"q184"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":1,"exam":"৪৯তম বিসিএস (শিক্ষা)","q":"কোন শব্দটি প্রত্যয়যোগে গঠিত?","o":["ডাক্তারখানা","হাসপাতাল","আকাশছোঁয়া","গুণমান"],"a":0,"e":"ডাক্তারখানা-শব্দটি বিদেশি তদ্ধিত প্রত্যয়যোগে গঠিত। ডাক্তার + খানা = ডাক্তারখানা। এখানে 'ডাক্তার' শব্দটির সঙ্গে 'খানা' প্রত্যয় যোগ হয়েছে। এরূপ- ছাপা + খানা = ছাপাখানা।","p":25,"id":"q185"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":2,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"প্রত্যয়যোগে গঠিত শব্দ কোনটি?","o":["ডাক্তারখানা","অনুগমন","দিলখোলা","সম্রাট"],"a":0,"e":"ডাক্তার + খানা = ডাক্তারখানা শব্দটি বিদেশি তদ্ধিত প্রত্যয়যোগে গঠিত। অনুগমন শব্দটি অনু উপসর্গ, সংস্কৃত গম্‌ ধাতু এবং অন প্রত্যয় যুক্ত হয়ে গঠিত। অনুগমন = অনু (উপসর্গ) + √গম্‌ (ধাতু) + অন (প্রত্যয়)। শব্দটি প্রত্যয় ও উপসর্গ যোগে গঠিত। দিলখোলা শব্দটি সমাসবদ্ধ পদ। এটি প্রত্যয়যোগে গঠিত শব্দ নয়। সম্রাট শব্দটি সংস্কৃত উপসর্গ সম্‌ যোগে গঠিত, এখানে প্রত্যয় যুক্ত হয়নি। উল্লিখিত অপশনগুলোর মধ্যে ডাক্তারখানা শব্দটি শুধু প্রত্যয়যোগে গঠিত হয়েছে তাই উত্তর ডাক্তারখানা অধিক গ্রহণযোগ্য।","p":25,"id":"q186"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":3,"exam":"৪৬তম বিসিএস","q":"কোনটি প্রত্যয়-সাধিত শব্দ?","o":["ভাইবোন","রাজপথ","বকলম","ঐকিক"],"a":3,"e":"শব্দ ও ধাতুর পরে অর্থহীন যে সব শব্দাংশ যুক্ত হয়ে নতুন শব্দ তৈরি করে তাদের প্রত্যয় বলে। এর মধ্যে যে প্রত্যয় ধাতুর সাথে যুক্ত হয় তাদের বলে কৃৎ প্রত্যয় এবং শব্দের সাথে যুক্ত প্রত্যয়কে বলে তদ্ধিত প্রত্যয়। যেমন: √ডুব + অন্ত = ডুবন্ত, মনু + ষ্য = মানব, এক + ইক = ঐকিক।","p":25,"id":"q187"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":4,"exam":"৪২তম বিসিএস","q":"কৃষি শব্দের সঠিক প্রকৃতি-প্রত্যয়-","o":["কৃষ্‌+তি","কৃষ্‌+টি","কৃ+ইষ্টি","কৃষ্‌+ইষ্টি"],"a":0,"e":"সংস্কৃত প্রত্যয় সাধিত কিছু শব্দের উদাহরণ: ত (ক্ত) প্রত্যয়- √খ্যা+ত = খ্যাত, √খণ্ড+ত = খণ্ডিত, √জ্ঞা+ত = জ্ঞাত; এরূপ- পঠিত, লিখিত, চলিত, লুণ্ঠিত, সিক্ত, মুক্ত, ভুক্ত, গত, প্রথিত, চূর্ণ, ছিন্ন, জাত, উক্ত, সৃষ্ট, হত, দগ্ধ। তি (ক্তি) প্রত্যয়- √কৃষ্‌+তি = কৃষি; এরূপ- সৃষ্টি, উক্তি, চাকতি, দৃষ্টি। ণক (অক) প্রত্যয়- √পঠ্‌+ণক = পাঠক; এরূপ- নায়ক, গায়ক, লেখক, জনক, চালক, স্বাবক। য (কৃৎ) প্রত্যয়- √দা+য = দেয়, √হ্‌+য = হেয়; এরূপ- অজেয়, পরিমেয়, অনুমেয়। য (তদ্ধিত) প্রত্যয়- সম্‌+য = সাম্য, সহচর+য = সাহচর্য; এরূপ- মাধুর্য, প্রাচুর্য, কাব্য, প্রাচ্য। ঈন (ই) তদ্ধিত- সর্বাঙ্গ+ঈন = সর্বাঙ্গীণ, সর্বজন+ঈন = সার্বজনীন; এরূপ- কুলীন, সমকালীন, গ্রামীণ।","p":25,"id":"q188"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":5,"exam":"৪১তম বিসিএস","q":"প্রচুর + য = প্রাচুর্য, কোন প্রত্যয়?","o":["কৃৎ প্রত্যয়","তদ্ধিত প্রত্যয়","বাংলা কৃৎ প্রত্যয়","সংস্কৃত কৃৎ প্রত্যয়"],"a":1,"e":"","p":26,"id":"q189"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":6,"exam":"৪০তম বিসিএস","q":"বাংলা কৃৎ-প্রত্যয় সাধিত শব্দ কোনটি?","o":["কারক","লিখিত","বেদনা","খেলনা"],"a":3,"e":"বাংলা প্রত্যয় সাধিত কিছু শব্দের উদাহরণ: অনা প্রত্যয়- √দুল্‌+অনা = দোলনা, √খেল্‌+অনা = খেলনা; এরূপ- চিরুনি, পাওনা ইত্যাদি। অক প্রত্যয়- √মুড়্‌+অক = মোড়ক, √ঝল্‌+অক = ঝলক। উয়া প্রত্যয়- মাছ+উয়া = মাছুয়া > মেছো (তদ্ধিত প্রত্যয়), √পড়্‌+উয়া = পড়ুয়া।","p":26,"id":"q190"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":7,"exam":"৪০তম বিসিএস","q":"'সর্বাঙ্গীণ' শব্দের সঠিক প্রকৃতি-প্রত্যয়-","o":["সর্বঙ্গ + ঈন","সর্ব + অঙ্গীন","সর্ব + ঈন","সর্বাঙ্গ + ঈন"],"a":3,"e":"","p":26,"id":"q191"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":8,"exam":"৩৯তম, ১৮তম বিসিএস","q":"বিভক্তিহীন নাম-শব্দকে কী বলে?","o":["প্রাতিপদিক","নাম-পদ","মৌলিক শব্দ","কৃদন্ত শব্দ"],"a":0,"e":"বিভক্তিহীন নাম শব্দকে প্রাতিপদিক বলে। যেমন- হাত, বই, কলম ইত্যাদি। নাম বা শব্দ শেষে বিভক্তি যোগে গঠিত পদকে নামপদ বলে। কৃৎ প্রত্যয় যোগে যে শব্দ গঠিত হয় তাকে কৃদন্ত শব্দ বলে।","p":26,"id":"q192"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":9,"exam":"৩৮তম বিসিএস","q":"কোনটিতে অপপ্রয়োগ ঘটেছে?","o":["জবাবদিহি","মিথক্রিয়া","একত্রিত","গৌরবিত"],"a":2,"e":"একত্রিত শব্দটির সঠিক ব্যবহার্য রূপ- একত্র। একত্র এর সাথে সংস্কৃত তদ্ধিত প্রত্যয় 'ইত' যুক্ত করে গঠিত 'একত্রিত' প্রত্যয়জনিত অপপ্রয়োগের উদাহরণ। অন্যদিকে 'জবাবদিহি' মিশ্রশব্দ (আরবি + ফারসি)।","p":26,"id":"q193"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":10,"exam":"৩৮তম বিসিএস","q":"'শ্রদ্ধা' শব্দের সঠিক প্রকৃতি-প্রত্যয় কোনটি?","o":["শ্রৎ + √ধা + অ + আ","শ্রৎ + √ধা + অ","শ্র + √ধা + আ","শ্র + √ধা + অ + আ"],"a":0,"e":"","p":26,"id":"q194"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":11,"exam":"৩৮তম বিসিএস","q":"বাংলা কৃৎ-প্রত্যয় সাধিত শব্দ কোনটি?","o":["চামার","ধারালো","মোড়ক","পোষ্টাই"],"a":2,"e":"","p":26,"id":"q195"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":12,"exam":"৩৬তম বিসিএস","q":"নিচের কোন শব্দটি প্রত্যয়যোগে গঠিত হয়নি?","o":["সভাসদ","শুভেচ্ছা","ফলবান","তন্বী"],"a":1,"e":"'শুভেচ্ছা' শব্দটি সন্ধিসাধিত শব্দ (শুভ + ইচ্ছা)। অন্যদিকে সভাসদ (সভা + √সদ্‌ + কিপ), ফলবান (ফল + বৎ), তন্বী (তনু + ঈ) শব্দগুলো প্রত্যয় সাধিত।","p":26,"id":"q196"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":13,"exam":"৩৫তম বিসিএস","q":"নিচের কোন শব্দটি প্রত্যয়সাধিত?","o":["প্রলয়","খণ্ডিত","নিশ্বাস","অনুপম"],"a":1,"e":"","p":26,"id":"q197"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":14,"exam":"৩০তম বিসিএস","q":"'সাহচর্য' শব্দের শুদ্ধ গঠন কোনটি?","o":["সহ + চর + য ফলা","সহচর + য ফলা","সহচর + য","কোনটিই নয়"],"a":2,"e":"","p":26,"id":"q198"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.4","st":"প্রকৃতি ও প্রত্যয়","n":15,"exam":"২৭তম বি া, সংখ্যা, পরিমাণ নির্দেশ করে। সৎ: বিশেষণ (গুণবাচক); একতা: বিশেষ্য (গুণবাচক); দর্শন: বিশেষ্য (ভাববাচক); জনতা: বিশেষ্য (সমষ্টিবাচক)।","p":28,"id":"q221"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.6","st":"পদ","n":4,"exam":"৪৫তম, ৩৯তম বিসিএস","q":"'তুমি তো ভারি সুন্দর ছবি আঁক।'-বাক্যটিতে কোন প্রকারের অব্যয় পদ ব্যবহৃত হয়েছে?","o":["পদান্বয়ী অব্যয়","অনুসর্গ অব্যয়","অনন্বয়ী অব্যয়","অনুকার অব্যয়"],"a":2,"e":"যে অব্যয় বাক্যের অন্যান্য পদের সাথে কোনো সঙ্গতি না রেখে স্বাধীনভাবে নানাবিধ ভাব প্রকাশে ব্যবহৃত হয়, তাকে অনন্বয়ী অব্যয় বলে। যেমন- 'তুমি তো ভারি সুন্দর ছবি আঁক।' এখানে 'ভারি' হচ্ছে অনন্বয়ী অব্যয়। এরূপ আরো কিছু অনন্বয়ী অব্যয়ের মধ্যে রয়েছে- মরি মরি! কী সুন্দর প্রভাতের রূপ; হায়, আমি যাব; ছি ছি, তুমি এত নীচ; পাছে লোকে কিছু বলে।","p":28,"id":"q222"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.6","st":"পদ","n":5,"exam":"৪৫তম বিসিএস","q":"কৃদন্ত পদের পূর্ববর্তী পদকে কী বলে?","o":["উপপদ","প্রাতিপদিক","প্রপদ","পূর্বপদ"],"a":0,"e":"কৃদন্ত পদের পূর্ববর্তী পদকে উপপদ বলে। বিভক্তিহীন নাম শব্দকে প্রাতিপদিক শব্দ বলে।","p":29,"id":"q223"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.6","st":"পদ","n":6,"exam":"৪৫তম বিসিএস","q":"'তোমার নাম কী?'-এখানে 'কী' কোন প্রকারের শব্দ?","o":["প্রশ্নবাচক","অব্যয়","সর্বনাম","বিশেষণ"],"a":2,"e":"'তোমার নাম কী?' বাক্যে ব্যবহৃত 'কী' হলো একটি সর্বনাম পদ। এটি প্রশ্নবোধক বাক্যে কোনো কিছু জিজ্ঞাসা করার জন্য ব্যবহৃত হয় এবং সাধারণত 'কী' (দীর্ঘ-ঈ কার) সর্বনাম পদ হিসেবে গণ্য হয়, যা কোনো বিশেষ বস্তুর পরিচয় জানতে ব্যবহৃত হয়। কিন্তু এখানে নামের পরিচয় জানতে চাওয়া হয়েছে, তাই 'কী' সর্বনাম।","p":29,"id":"q224"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.6","st":"পদ","n":7,"exam":"৩৬তম বিসিএস","q":"নিচের কোনটি বিশেষ্য পদ?","o":["জাত","গৌরিক","উদ্ধত","গাম্ভীর্য"],"a":3,"e":"একই শব্দের রূপ পরিবর্তন করে বিশেষ্য ও বিশেষণ রূপে ব্যবহার করা হয়। যেমন: ইচ্ছা(বি.)-ঐচ্ছিক(বিণ), ইন্দ্রজাল(বি.)-ঐন্দ্রজালিক(বিণ), জীবন(বি.)-জীবনী(বিণ), মন(বি.)-মানসিক(বিণ); লাজ(বি.)-লাজুক(বিণ), লবণ(বি.)-লবণাক্ত(বিণ), সৌন্দর্য(বি.)-সুন্দর(বিণ), গাম্ভীর্য(বি.)-গম্ভীর(বিণ)।"," ীত, অতীত + বর্তমান, বর্তমান + ভবিষ্যৎ। 'করেছি' পুরাঘটিত বর্তমান কাল। ক্রিয়া পূর্বে শেষ হলে এবং তার ফল এখন ও বর্তমান থাকলে, পুরাঘটিত বর্তমান কাল ব্যবহৃত হয় অর্থাৎ যৌগিক কাল নির্দেশ করে।","p":31,"id":"q246"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.8","st":"ক্রিয়ার কাল ও বাংলা অনুজ্ঞা","n":2,"exam":"২১তম বিসিএস","q":"কোনটি অনুজ্ঞা?","o":["তুমি গিয়েছিলে","তুমি যাও","তুমি যাচ্ছিলে","তুমি যাচ্ছ"],"a":1,"e":"কিছু করার আদেশ, উপদেশ, নিষেধ, অনুরোধ, আশীর্বাদ, অনুনয়, অনুমতি, প্রার্থনা-কামনা ইত্যাদি বোঝাতে বর্তমান এবং ভবিষ্যৎ কালে মধ্যম পুরুষে ক্রিয়ার যে বিশেষ রীতি ব্যবহৃত হয় তাকে অনুজ্ঞা (ভাব) বলা হয়। যেমন- বর্তমান কালে: কলমটি দাও। ভবিষ্যৎ কালে: কাল দেখা হবে, ক্ষমা কর মোর অপরাধ ইত্যাদি। সুতরাং 'তুমি যাও' একটি অনুজ্ঞা।","p":31,"id":"q247"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.9","st":"কারক ও বিভক্তি","n":1,"exam":"৪৮তম বিসিএস (স্বাস্থ্য)","q":"বাক্যের অন্তর্গত শব্দের পারস্পরিক সম্পর্ক ব্যাকরণের কোন অংশে আলোচিত হয়?","o":["সন্ধি","পদ","কাল","কারক"],"a":3,"e":"'কারক' শব্দটির অর্থ যা ক্রিয়া সম্পাদন করে। বাক্যের অন্তর্গত শব্দের (বিশেষত বিশেষ্য বা সর্বনাম পদের) সঙ্গে ক্রিয়াপদের যে পারস্পরিক সম্পর্ক তা ব্যাকরণের কারক অংশে আলোচিত হয়।","p":31,"id":"q248"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.9","st":"কারক ও বিভক্তি","n":2,"exam":"৪৬তম বিসিএস","q":"বিভক্তিযুক্ত শব্দ কোনটি?","o":["সরোবরে","চশমা","সরোজ","চম্পক"],"a":0,"e":"বাক্যস্থিত একটি শব্দের সঙ্গে অন্য শব্দের অন্বয় সাধনের জন্য শব্দের সঙ্গে যে সকল বর্ণ যুক্ত হয় তাদেরকে বিভক্তি বলে। বাংলা ভাষায় ব্যবহৃত ক্রিয়া বিভক্তিগুলো হলো: শূন্য (০) বিভক্তি, এ, তে, কে, রে, র। এখানে সরোবরে- সরোবর + এ (৭মী বিভক্তি)।","p":31,"id":"q249"},{"c":3,"ct":"শব্দতত্ত্ব / রূপতত্ত্ব","s":"3.9","st":"কারক ও বিভক্তি","n":3,"exam":"৪৩তম বিসিএস","q":"রবীন্দ্রনাথ কোন কারক বাদ দিতে চেয়েছিলেন?","o":["করণ কারক","সম্প্রদান কারক","অপাদান কারক","অধিকরণ কারক"],"a":1,"e":"বাংলায় সম্প্রদান কারকের প্রয়োজন নেই, এ কথা রবীন্দ্রনাথ অনেক আগেই বলেছিলেন। কারণ, কর্মকারক দ্বারাই সম্প্রদান কারকের কাজ সুন্দরভাবে সম্পাদন করা যায়। নতুন ব্যাকরণে সম্প্রদান
