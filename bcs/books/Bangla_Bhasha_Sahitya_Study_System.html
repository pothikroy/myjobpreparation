<style>
:root{
  --bg:#f7f5f1; --surface:#ffffff; --surface-2:#f1efe9; --border:#e4e0d6;
  --text:#241f16; --text-dim:#6b6455; --accent:#0e6b52; --accent-2:#b6862c;
  --danger:#a13d3d; --warn:#b6862c; --good:#2f7d52; --info:#2c6faf;
  --radius:14px; --shadow:0 2px 10px rgba(30,25,10,.06);
  --font: 'Noto Sans Bengali','Noto Serif Bengali',sans-serif;
}
[data-theme="dark"]{
  --bg:#15130f; --surface:#1e1b15; --surface-2:#26221a; --border:#3a352a;
  --text:#efe9dc; --text-dim:#a89d86; --accent:#37a888; --accent-2:#d9a847;
  --shadow:0 2px 14px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);transition:background .2s,color .2s}
button,input,select,textarea{font-family:inherit}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:8px 10px 18px;font-weight:800;font-size:15px;line-height:1.4;color:var(--accent)}
.brand small{display:block;font-weight:400;color:var(--text-dim);font-size:11px;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--text);font-size:14px;margin-bottom:2px;user-select:none}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-emoji{font-size:16px;width:20px;text-align:center}
/* Main */
.main{flex:1;min-width:0;padding:22px 26px 80px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.topbar h1{font-size:20px;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.grid{display:grid;gap:14px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat-card{padding:14px 16px}
.stat-card .label{font-size:12px;color:var(--text-dim);margin-bottom:6px}
.stat-card .value{font-size:24px;font-weight:800}
.progress-bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.section-title{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{opacity:.9}
.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600}
.tag.green{background:#e2f3ea;color:var(--good)}
.tag.yellow{background:#fbf0dc;color:var(--warn)}
.tag.red{background:#f8e4e1;color:var(--danger)}
.tag.blue{background:#e2eefa;color:var(--info)}
[data-theme="dark"] .tag.green{background:#123a2b}
[data-theme="dark"] .tag.yellow{background:#3a2e12}
[data-theme="dark"] .tag.red{background:#3a1512}
[data-theme="dark"] .tag.blue{background:#122a3a}
.list-item{padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--surface)}
.muted{color:var(--text-dim);font-size:13px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-size:13px}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Reader */
.toc{width:230px;flex-shrink:0;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.reader-flex{display:flex;gap:20px;align-items:flex-start}
@media(max-width:900px){
  .reader-flex{flex-direction:column}
  .toc{width:100%;position:relative;top:0;max-height:38vh;box-shadow:inset 0 -10px 8px -8px rgba(0,0,0,.08)}
}
.toc-chapter{font-weight:700;font-size:13px;margin:10px 0 6px;color:var(--accent)}
.toc-section{padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--text-dim)}
.toc-section:hover{background:var(--surface-2)}
.toc-section.active{background:var(--accent);color:#fff}
.reader-content{flex:1;min-width:0;line-height:1.9;font-size:16px}
.reader-content h2{font-size:19px;margin-top:0}
.reader-content .qa-block{border-left:3px solid var(--accent);padding:8px 0 8px 14px;margin:14px 0;background:var(--surface-2);border-radius:0 10px 10px 0}
.reader-content .qa-block .q{font-weight:700;margin-bottom:6px}
.reader-content .qa-block .a{color:var(--text)}
.fact-box{background:var(--surface-2);border:1px dashed var(--accent-2);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:14px}
/* Flashcard */
.flash-wrap{max-width:560px;margin:0 auto}
.flashcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;box-shadow:var(--shadow);cursor:pointer;line-height:1.7}
.flash-meta{text-align:center;margin-top:10px;color:var(--text-dim);font-size:12px}
.rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate-btn{padding:12px 6px;border-radius:10px;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
/* MCQ */
.mcq-opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--surface);cursor:pointer;font-size:14px}
.mcq-opt:hover{border-color:var(--accent)}
.mcq-opt.correct{background:#e2f3ea;border-color:var(--good)}
.mcq-opt.wrong{background:#f8e4e1;border-color:var(--danger)}
[data-theme="dark"] .mcq-opt.correct{background:#123a2b}
[data-theme="dark"] .mcq-opt.wrong{background:#3a1512}
.explain-box{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:14px}
input[type=text],input[type=number],input[type=date],select,textarea{padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;width:100%}
.mobile-nav{display:none}
@media(max-width:800px){
 .sidebar{display:none}
 .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);justify-content:space-around;padding:6px 0;z-index:50}
 .mobile-nav .nav-item{flex-direction:column;font-size:10px;gap:2px;padding:6px 4px}
 .main{padding:16px 14px 90px}
}
.hidden{display:none!important}
.center{text-align:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.top-actions{display:flex;gap:8px;align-items:center}
.badge-count{background:var(--danger);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px;margin-right:2px}
.source-note{font-size:12px;color:var(--text-dim);margin-top:4px}
</style>
</head>

<script>
/* ================= DATA LAYER ================= */
const LS_KEY = 'bcsBanglaStudy_v1';
const DEFAULT_STATE = {
  settings:{theme:'system', dailyGoalCards:20, dailyGoalMcq:15, negMark:0.5, examDate:''},
  streak:{count:0, lastDate:null},
  xp:0,
  studyLog:{}, // date -> {cards,mcqs,minutes}
  srs:{}, // cardId -> {due, interval, reps, ease, lastRating}
  mcqStats:{}, // mcqId -> {attempts, correct, wrong, lastAttempt}
  mistakes:{}, // mcqId -> {count, lastDate}
  masteredMistakes:{},
  bookmarks:[], // {type, id, note, date}
  notes:{}, // sectionId -> text
  readProgress:{}, // sectionId -> true
  sessionHistory:[] // {date, cards, mcqs, accuracy}
};
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const parsed = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed);
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
let STATE = loadState();
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function markActivity(kind, n){
  const t = todayStr();
  if(!STATE.studyLog[t]) STATE.studyLog[t] = {cards:0,mcqs:0,minutes:0};
  STATE.studyLog[t][kind] = (STATE.studyLog[t][kind]||0) + n;
  // streak
  const last = STATE.streak.lastDate;
  if(last !== t){
    const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
    STATE.streak.count = (last === y) ? STATE.streak.count + 1 : 1;
    STATE.streak.lastDate = t;
  }
  saveState();
}

/* ================= BOOK CONTENT (extracted & organized from the source PDF via OCR) =================
   NOTE: This pilot covers Chapter 1 (বাঙালি ও বাংলা ভাষা) in full, transcribed and lightly
   cleaned from OCR of the actual book. Explanatory paragraphs are written in original wording
   drawn directly from the source's Q&A structure; nothing is invented. Remaining chapters
   (ব্যাকরণ, ছন্দ-অলঙ্কার, বাংলা সাহিত্য যুগভিত্তিক) will be added in follow-up passes. */
const BOOK = {
  title: "বাংলা ভাষা ও সাহিত্য জিজ্ঞাসা",

            "এই অঞ্চলে মানুষের আগমনক্রম: প্রথমে নিগ্রোপ্রতিম (নিগ্রিটো-সদৃশ) মানুষ, এরপর অস্ট্রিক, এরপর দ্রাবিড়ভাষী, প্রাক-ঐতিহাসিক কালে নর্ডিক ও মোঙ্গল — পরে ঐতিহাসিক কালে আফগান, মোগল, ইংরেজ, পাকিস্তানি।",

            "আর্য জাতির বৈশিষ্ট্য: দীর্ঘকায়, পৌরবর্ণ (উজ্জ্বল গায়ের রং), উন্নত নাসিকা, পাতলা ঠোঁট, স্পষ্ট চোখ — বিপরীত বৈশিষ্ট্যের মানুষকে বলা হতো অনার্য।",
            "উপমহাদেশে আর্যভাষার প্রাচীনতম বর্ণমালার সন্ধান মেলে খ্রিষ্টপূর্ব তৃতীয় শতকে, সম্রাট অশোকের অনুশাসনের সময়ে — এই লিপির নাম ব্রাহ্মী লিপি।",

          {q:"কার সময়ে বাংলাদেশ সর্বপ্রথম এক রাষ্ট্রীয় ঐক্য লাভ করে?", a:"গৌড়ের রাজা শশাঙ্কের সময়ে, এবং পরবর্তীকালে পাল আমলে। উল্লেখ্য, 'গৌড়' বাংলাদেশের অখণ্ড জনপদ-সত্তার আরেক নাম।"},
          {q:"সম্রাট আকবর এই অখণ্ড জনপদ-সত্তার কী নাম দিয়েছিলেন?", a:"সুবা-বাংলা।"},
          {q:"সুবা-বাংলা সম্পর্কে উল্লেখ কোন গ্রন্থে পাওয়া যায়?", a:"আইন-ই-আকবরি গ্রন্থে।"}
        ]},
        { id:'ch1-s3', title:'লিপি-বিষয়ক জিজ্ঞাসা', type:'qa', qa:[

          {q:"মহাস্থানগড়ে প্রাপ্ত লিপির সঙ্গে কোন লিপির সাদৃশ্য আছে?", a:"অশোকের সময়ের ব্রাহ্মী লিপির সঙ্গে।"},

          {q:"ব্রাহ্মী লিপির কোন রূপ থেকে বাংলা লিপি এসেছে?", a:"কুটিল রূপ থেকে।"},
          {q:"কোন সম্রাট তাঁর অধিকাংশ রাজকীয় নির্দেশ ব্রাহ্মী লিপিতে লেখান?", a:"সম্রাট অশোক।"},
          {q:"ব্রাহ্মী লিপিতে কখন উল্লেখযোগ্য পরিবর্তন আসে?", a:"কুষাণ ও গুপ্ত রাজাদের আমলে।"},
          {q:"'কুটিল' লিপির নাম কুটিল কেন?", a:"এর মাত্রা ও বর্ণ জটিল — কোথাও পূর্ণ, কোথাও অর্ধ, কোথাও মাত্রাহীন, এবং যুক্তাক্ষরগুলো বিশেষভাবে জটিল বলে।"},
          {q:"কুটিল রূপ থেকে বাংলা ছাড়া আর কোন কোন লিপির উদ্ভব হয়েছে?", a:"অসমিয়া, উড়িয়া ও মৈথিলি লিপির।"},

          {q:"পঞ্চানন কর্মকার কার কাছ থেকে লিপি তৈরির কৌশল শেখেন?", a:"ইংরেজ কর্মচারী চার্লস উইলকিন্সের কাছ থেকে, যিনি নিজেও তাঁর মাতামহের কাছে ইংরেজি লিপি তৈরির কৌশল শিখেছিলেন।"},
          {q:"উড়িয়া লিপির বর্ণ গোলাকার হওয়ার কারণ কী?", a:"প্রাচীনকালে কলাপাতায় লেখার সময় উড়িয়ারা লোহার 'খৃপ্তি' ব্যবহার করত; পাতা যাতে ছিঁড়ে না যায়, তাই বর্ণ গোল করে লেখা হতো — বাংলাভাষীরা খাগ/বাঁশের লেখনী ব্যবহার করত বলে বাংলা বর্ণের কোণাগুলো কৌণিক থেকে যায়।"}
        ]},
        { id:'ch1-s4', title:'ভাষা-বিষয়ক জিজ্ঞাসা', type:'qa', qa:[

          {q:"ইন্দো-ইউরোপীয় ভাষাবংশ প্রধানত কয়ভাগে ও কী কী নামে বিভক্ত?", a:"দুই ভাগে — কেন্তুম শাখা (ইউরোপীয় ভাষাসমূহ) ও শতম শাখা (ইন্দো-ইরানীয় ভাষাসমূহ)।"},
          {q:"বাংলা ভাষা এই বিভাজনের কোন শাখার অন্তর্গত?", a:"শতম শাখার।"},
          {q:"বাংলা ভাষার উদ্ভব সম্পর্কে আধুনিক মত কী?", a:"ভারতীয় গৌড়ী প্রাকৃত ভাষা থেকে প্রাচীন বাংলা ভাষার উদ্ভব হয়েছে।"},
          {q:"বাংলা ভাষার উৎপত্তিকাল নিয়ে প্রধান দুটি মত কী?", a:"মুহম্মদ শহীদুল্লাহ্‌র মতে সপ্তম শতাব্দী; সুনীতিকুমার চট্টোপাধ্যায়সহ অধিকাংশ পণ্ডিতের মতে দশম শতাব্দী।"},
          {q:"'ব্রজবুলি' কোন ধরনের ভাষা?", a:"একটি কৃত্রিম (Artificial) ভাষা — মৈথিলি ভাষার সঙ্গে অবহট্‌ঠ/বাংলার বিশেষ রূপের সংমিশ্রণে তৈরি; স্বাভাবিক কথ্যভাষা হিসেবে এর প্রচলন ছিল না।"},

          {q:"অপভ্রংশের বিস্তারকাল কত ধরা হয়?", a:"ষষ্ঠ থেকে দ্বাদশ শতাব্দী পর্যন্ত।"},
          {q:"অপভ্রংশে রচিত পরিচিত একটি কাব্যসংকলনের নাম কী?", a:"'প্রাকৃত পৈঙ্গল' (চতুর্দশ শতাব্দীর শেষ দিকে সংকলিত)।"},
          {q:"'অবহট্‌ঠ' বলতে কী বোঝায়?", a:"প্রাচীন অপভ্রংশের অপেক্ষাকৃত আধুনিক রূপ — সুকুমার সেন এই নামকরণ করেন।"},

          {q:"বাংলা ভাষার উৎপত্তি নিয়ে অধিকাংশ ভাষাবিজ্ঞানীর (জর্জ গ্রিয়ার্সন, সুনীতিকুমার চট্টোপাধ্যায় প্রমুখ) মত কী?", a:"মাগধী প্রাকৃত থেকে বাংলা ভাষার উৎপত্তি।"},
          {q:"মুহম্মদ শহীদুল্লাহ্‌র মতে বাংলা ভাষার উদ্ভব-ধারা কী?", a:"গৌড় অপভ্রংশ থেকে 'বঙ্গ কামরূপী' ভাষা, এবং তা থেকে আনুমানিক ৬৫০ খ্রিষ্টাব্দে বাংলা ভাষার স্বতন্ত্র রূপ পরিগ্রহণ।"},
          {q:"শহীদুল্লাহ্‌র কোন গ্রন্থে 'বাংলা ভাষার কুলজী' নামে একটি ভাষাচিত্র আছে?", a:"'বাঙ্গালা ভাষার ইতিবৃত্ত' গ্রন্থে।"}
        ]},
        { id:'ch1-s5', title:'বাংলা ভাষা: সংজ্ঞার্থ ও স্থান', type:'qa', qa:[
          {q:"ভাষা কাকে বলে?", a:"মনের ভাব প্রকাশ করার জন্য মানুষ বাগ্‌যন্ত্রের সাহায্যে যেসব ধ্বনি উচ্চারণ করে বা স্বীকৃত বর্ণে যা কিছু লিপিবদ্ধ করে, অথবা কোনো বিশেষ সংকেতের (ধ্বনি, অঙ্গভঙ্গি, লেখা, অঙ্কন) মাধ্যমে প্রকাশ করে, তাকে ভাষা বলে।"},
          {q:"ভাষা প্রকাশের মাধ্যম কয়টি ও কী কী?", a:"তিনটি — কণ্ঠস্বরের মাধ্যমে, লেখনীর মাধ্যমে, এবং ইশারা-ইঙ্গিতের মাধ্যমে।"}
        ]}
      ]
    },
    {

      sections: [
        { id:'ch2-s1', title:'সন্ধি: সংজ্ঞা ও প্রকারভেদ', type:'qa', qa:[
          {q:"সন্ধি কাকে বলে?", a:"দ্রুত উচ্চারণের ফলে পরস্পর সন্নিহিত দুই ধ্বনি পরিবর্তিত হয়ে এক ধ্বনিতে রূপান্তরিত হওয়াকে সন্ধি বলে। বাংলা ভাষার তুলনায় সংস্কৃতে সন্ধি বেশি হয়।"},

          {q:"সন্ধির উদ্দেশ্য কী?", a:"দুটি — শব্দরাজির উচ্চারণ সহজ করা এবং ধ্বনিগত মাধুর্য স্থাপন করা।"},
          {q:"যে দুটি শব্দে সন্ধি হয়, তাদের কী বলে?", a:"প্রথমটিকে পূর্বপদ, পরেরটিকে অন্ত্যপদ বলে।"},

          {q:"বহিঃসন্ধি কাকে বলে?", a:"পৃথক অর্থবিশিষ্ট দুটি শব্দ একত্র বসে যে সন্ধি হয়, তাকে বহিঃসন্ধি বলে। যেমন: বিদ্যা+আলয় = বিদ্যালয়।"},
          {q:"স্বরসন্ধি কাকে বলে?", a:"স্বরধ্বনির সঙ্গে স্বরধ্বনি মিলে যে সন্ধি হয়। পালি ও প্রাকৃত ভাষায় এই সন্ধি বেশি দেখা যায়, এবং এই রীতি প্রাকৃত থেকে বাংলায় এসেছে। যেমন: শুভ+ইচ্ছা=শুভেচ্ছা।"},
          {q:"ব্যঞ্জনসন্ধি কাকে বলে?", a:"ব্যঞ্জনধ্বনির আগে বা পরে স্বর অথবা ব্যঞ্জন যেকোনো ধ্বনি যুক্ত হয়ে যে সন্ধি হয়, তাকে ব্যঞ্জনসন্ধি বলে। যেমন: দিক্+অন্ত=দিগন্ত।"},
          {q:"বিসর্গসন্ধি কাকে বলে?", a:"পূর্বপদের বিসর্গের সঙ্গে পরের পদের ব্যঞ্জনধ্বনি বা স্বরধ্বনির সন্ধিকে বিসর্গসন্ধি বলে। যেমন: ততঃ+অধিক=ততোধিক।"},
          {q:"বিসর্গসন্ধিকে কয়ভাগে ভাগ করা হয়েছে?", a:"দুইভাগে — র-জাত বিসর্গ (যেমন প্রাতঃ < প্রাতর্) এবং স-জাত বিসর্গ (যেমন নমঃ < নমস্)।"},
          {q:"নিপাতনে সিদ্ধ কাকে বলে?", a:"ব্যাকরণের সাধারণ বা বিশেষ কোনো নিয়ম দিয়ে ব্যাখ্যা করা যায় না, অথচ ভাষায় প্রচলিত ও সংঘটিত হয় — এমন ব্যতিক্রমকে বৈধতা দেওয়ার নাম নিপাতনে সিদ্ধ।"}
        ]},

        { id:'ch2-s5', title:'ধ্বনি পরিবর্তন', type:'qa', qa:[
          {q:"ধ্বনি পরিবর্তন কাকে বলে?", a:"শব্দের ধ্বনিক্রমে পরিবর্তন হওয়া, বা কোনো ধ্বনির লোপ বা আগমন ঘটা — অথচ শব্দের মূল অর্থ অক্ষুণ্ণ থাকা — একে ধ্বনি পরিবর্তন বলে। যেমন: স্কুল > ইস্কুল, পিশাচ > পিচাশ।"},
          {q:"ধ্বনি পরিবর্তনের কারণগুলো কী কী?", a:"উচ্চারণের দ্রুততা, উচ্চারণে সহজপ্রবণতা, উচ্চারণে অসাবধানতা, এবং মুখগহ্বরের স্বাভাবিক আড়ষ্টতা।"},
          {q:"ধ্বন্যাগম কী?", a:"উচ্চারণের সুবিধার জন্য শব্দে মূলত না-থাকা কোনো ধ্বনি এসে যুক্ত হওয়া। আগত ধ্বনি স্বরধ্বনি হলে স্বরাগম, ব্যঞ্জনধ্বনি হলে ব্যঞ্জনাগম বলে।"},
          {q:"মধ্য স্বরাগম কাকে বলে ও উদাহরণ দাও।", a:"শব্দের মধ্যে নতুন স্বরধ্বনি যুক্ত হওয়া। যেমন: রত্ন > রতন, ধর্ম > ধরম, স্বপ্ন > স্বপন, গ্রাম > গেরাম, মুরগ > মুরোগ।"},
          {q:"অপিনিহিতি কাকে বলে?", a:"পরের অক্ষরের স্বরধ্বনি আগেভাগে উচ্চারিত হয়ে আগের ব্যঞ্জনধ্বনির সঙ্গে মিলে যাওয়া, এক প্রকার মধ্য স্বরাগম। যেমন: ভাগ্য > ভাইগ্য, বাক্য > বাইক্য, সত্য > সইত্য, কন্যা > কইন্যা।"},
          {q:"স্বরসঙ্গতি (উচ্চতাসাম্য) কাকে বলে?", a:"পাশাপাশি দুটি স্বরধ্বনির একটি অন্যটির প্রভাবে কাছাকাছি রূপে উচ্চারিত হওয়া। যেমন: দেশি>দিশি, মিথ্যা>মিথ্যে, তুলা>তুলো, মোজা>মুজো, জুতা>জুতো।"},
          {q:"ধ্বনিলোপ কাকে বলে?", a:"উচ্চারণের সময় শব্দস্থিত কোনো ধ্বনি উচ্চারিত না হওয়া। স্বরধ্বনি লোপ পেলে স্বরধ্বনিলোপ, ব্যঞ্জনধ্বনি লোপ পেলে ব্যঞ্জনধ্বনিলোপ বলে।"},
          {q:"আদিস্বরলোপ ও অন্ত্যস্বরলোপের উদাহরণ দাও।", a:"আদিস্বরলোপ: অলাবু>লাবু, উদ্ধার>ধার। অন্ত্যস্বরলোপ: আশা>আশ্‌, চারি>চার।"},
          {q:"আদিব্যঞ্জনলোপ ও মধ্যব্যঞ্জনলোপের উদাহরণ দাও।", a:"আদিব্যঞ্জনলোপ: শ্রাবণ>শাবন, স্ফটিক>ফটিক। মধ্যব্যঞ্জনলোপ: মজদুর>মজুর, দুগ্ধ>দুধ।"},
          {q:"অন্তর্হতি কাকে বলে?", a:"শব্দের মধ্যবর্তী কোনো ব্যঞ্জনধ্বনি লোপ পাওয়া। যেমন: আলাহিদা>আলাদা, ফাল্গুন>ফাগুন, ফলাহার>ফলার।"},
          {q:"ব্যঞ্জন বিকৃতি কাকে বলে?", a:"একটি ব্যঞ্জনধ্বনির স্থানে নতুন ভিন্ন ব্যঞ্জনধ্বনি ব্যবহৃত হওয়া। যেমন: ধোবা>ধোপা, কবাট>কপাট।"},
          {q:"ব্যঞ্জনচ্যুতি (ধ্বনিচ্যুতি) ও সমাক্ষর লোপ কাকে বলে?", a:"পাশাপাশি একই রকম উচ্চারণের দুটি ব্যঞ্জনধ্বনির একটি লোপ পাওয়াকে ব্যঞ্জনচ্যুতি বলে (বড়দাদা>বড়দা)। একই বা সমজাতীয় অক্ষর লোপ পাওয়াকে সমাক্ষর লোপ বলে (ঠাকুরদাদা>ঠাকুরদা) — এটি ব্যঞ্জনচ্যুতিরও উদাহরণ।"},
          {q:"ধ্বনিবিপর্যয় (বর্ণবিপর্যয়) কাকে বলে?", a:"উচ্চারণের সময় শব্দের কোনো ধ্বনির স্থান পরিবর্তন হওয়া। যেমন: রিক্সা>রিস্কা, পিশাচ>পিচাশ, লাফ>ফাল, তলোয়ার>তরোয়াল।"},
          {q:"সমীকরণ কাকে বলে?", a:"পরপর দুটি ভিন্ন উচ্চারণস্থানীয় ব্যঞ্জনধ্বনির একটির উচ্চারণস্থান বদলে গিয়ে অপরটির কাছাকাছি হয়ে যাওয়া। যেমন: অনু+স্থান>অনুষ্ঠান।"},
          {q:"সমীভবন (ব্যঞ্জনসঙ্গতি) কাকে বলে?", a:"পাশাপাশি দুটি ব্যঞ্জনধ্বনি একই রকম হয়ে যাওয়া বা তার প্রবণতা তৈরি হওয়া। যেমন: দুর্গা>দুগ্গা, জন্ম>জম্ম।"},
          {q:"পরাগত সমীভবন ও প্রগত সমীভবনের পার্থক্য কী?", a:"পরাগত সমীভবনে প্রথম ধ্বনি দ্বিতীয় ধ্বনির প্রভাবে বদলে যায় (তৎ+জন্য>তজ্জন্য, উৎ+মুখ>উন্মুখ)। প্রগত সমীভবনে দ্বিতীয় ধ্বনি প্রথম ধ্বনির প্রভাবে বদলে যায় (চন্দন>চন্নন, পদ্ম>পদ্দ)।"},
          {q:"বিষমীভবন কাকে বলে?", a:"শব্দে থাকা দুটি সমবর্ণের একটি ভিন্ন ধ্বনিতে রূপান্তরিত হওয়া। যেমন: শরীর>শরীল, লাল>নাল, লাঙ্গল>নাঙ্গল।"},
          {q:"শ্রুতি (Glide) কী?", a:"দুটি স্বরধ্বনির মাঝে উচ্চারণ সহজ করতে য়-ধ্বনি, ই-ধ্বনি বা (অন্তঃস্থ) ব-ধ্বনির আগমন ঘটাকে শ্রুতি বলে। যেমন: যাআ>যাওয়া (ব-শ্রুতি), মোআ>মোয়া (য়-শ্রুতি)।"},
          {q:"র-ভ্রান্তি কী?", a:"উচ্চারণে ভুলবশত এমন স্থানে 'র' ধ্বনি চলে আসা, যেখানে মূলত তা ছিল না — সাধারণত গ্রাম্য বা স্বল্পশিক্ষিত উচ্চারণে দেখা যায়। যেমন: সাহায্য়>সাহার্য্য। এটি এক প্রকার ব্যঞ্জনাগমও বটে।"}
        ]},
        { id:'ch2-s6', title:'ণ-ত্ব ও ষ-ত্ব বিধান', type:'mixed', qa:[
          {q:"ণ-ত্ব ও ষ-ত্ব বিধান কী?", a:"বাংলা ভাষায় বহু তৎসম (সংস্কৃত/সংস্কৃতসম) শব্দে সংস্কৃত ব্যাকরণের স্বীকৃত বানানরীতি অনুসারে ণ ও ষ ব্যবহারের যেসব নিয়ম মানা হয়, তাকে ণ-ত্ব ও ষ-ত্ব বিধান বলে।"},
          {q:"ণ ব্যবহারের একটি নিয়ম লেখ (ট-বর্গ সম্পর্কিত)।", a:"ট-বর্গীয় ধ্বনির আগে ণ হয়। যেমন: বণ্টন, খণ্ড, ঘণ্টা, কাণ্ড।"},
          {q:"ণ ব্যবহারের আরেকটি নিয়ম লেখ (ঋ/র/ষ সম্পর্কিত)।", a:"ঋ, র বা ষ ধ্বনির পর ক-বর্গ, প-বর্গ, য, ব বা হ ধ্বনি অন্তরে রেখে স্বরবর্ণ এলে তার পরে ণ হয়। যেমন: শ্রবণ, পরিমাণ, রোপণ, ভ্রমণ, দর্পণ, গ্রহণ, ব্রাহ্মণ, নির্মাণ।"},
          {q:"কোন ক্ষেত্রে ঋ/র/ষ-এর পরও ণ না হয়ে ন হয়?", a:"ঋ/র/ষ-এর পরে চ-বর্গ, ত-বর্গ বা ট-বর্গের কোনো বর্ণ এলে তার পরের ধ্বনি ণ না হয়ে ন হয়। যেমন: রচনা, রটনা, প্রার্থনা, আবর্জনা।"},
          {q:"নিত্য মূর্ধন্য-ণ রীতি কী?", a:"কিছু তৎসম শব্দে কোনো নির্দিষ্ট নিয়ম ছাড়াই স্বাভাবিকভাবে ণ ব্যবহৃত হয়; এদের নিত্য মূর্ধন্য-ণ শব্দ বলে। যেমন: অণু, কঙ্কণ, নিপুণ, পণ্য, পাণি, পুণ্য, ফণী, বণিক, বাণ, লাবণ্য, চাণক্য, মাণিক্য, বাণিজ্য, লবণ, মণ, বেণু, বীণা, কণিকা, মণি, বেণী।"},
          {q:"ষ-ত্ব বিধানের একটি নিয়ম লেখ (ট/ঠ সম্পর্কিত)।", a:"ট বা ঠ ধ্বনির আগে যুক্তবর্ণরূপে সর্বদা ষ হয়। যেমন: স্পষ্ট, কাষ্ঠ, কষ্ট, নিষ্ঠুর, নষ্ট।"},
          {q:"ষ-ত্ব বিধানের আরেকটি নিয়ম লেখ (ক/র সম্পর্কিত)।", a:"ক-কার ও র-এর পর ষ হয়। যেমন: কৃষক, বর্ষা, কর্ষণ, বৃষ্টি, তৃষ্ণা।"},
          {q:"ই-কার ও উ-কারান্ত উপসর্গের পরে কোন ধরনের ধাতুতে ষ হয়?", a:"সদ্‌, সিচ্‌, সজ্জ্‌, সিধ্‌, সেন্‌-জাতীয় নির্দিষ্ট ধাতুর আগে ই/উ-কারান্ত উপসর্গ যুক্ত হলে ষ হয়। যেমন: অভিষেক, সুষুপ্ত, অনুষঙ্গ, প্রতিষেধক, প্রতিষ্ঠান, অনুষ্ঠান।"},
          {q:"নিত্য মূর্ধন্য-ষ রীতি কী?", a:"কিছু শব্দে স্বভাবতই ষ বসে, এক্ষেত্রে ব্যত্যয় ঘটলে বানান ভুল হয়। যেমন: আষাঢ়, বাষ্প, মহিষ, উষা, অভিলাষ, মানুষ, সরিষা, ষোড়শ, পৌষ, ভূষণ, রোষ।"},
          {q:"ণ-ত্ব ও ষ-ত্ব নিষেধ কী?", a:"যেসব ক্ষেত্রে ণ/ষ ব্যবহার করা যায় না, তাকে ণ-ত্ব ও ষ-ত্ব নিষেধ বলে — বিদেশি শব্দে ণ/ষ ব্যবহার ভুল, এবং খাঁটি দেশি শব্দেও ণ/ষ ব্যবহার ভুল ধরা হয়।"},
          {q:"ত-বর্গীয় বর্ণের সঙ্গে যুক্ত 'ন' কখনো কী রূপ নেয়?", a:"ত-বর্গীয় বর্ণের সঙ্গে যুক্ত 'ন' কখনো 'ণ' হয় না — সবসময় 'ন'-ই থাকে। যেমন: শান্ত, গ্রন্থ, অন্ত, ক্রন্দন।"}
        ], memoryAids:[
          "🧠 নিত্য মূর্ধন্য-ণ মনে রাখার গল্প (বইয়ের ভাষায়): 'এক বণিক কয়েকশ মণ লবণ বাণিজ্য করে। মণি, মাণিক্য তার পণ্যের তালিকায় নেই। অণু নামের এক নিপুণ লাবণ্যময়ী নারী কঙ্কণ, বেণু আর বীণা হাতে স্থাণু হয়ে বসা বন্ধু পুণ্য ও চাণক্যের সঙ্গে আলাপে ব্যস্ত বণিকের বিপণীতে আসে। অণু পণ করেছিল, তার দেহে এক কণিকা শোণিত থাকলেও বণিকের মুখোমুখি হবে সে, আর পাণিতে থাকবে তার মৃত্যুবাণ।' — এই গল্পের প্রতিটি বিশেষ শব্দ নিত্য মূর্ধন্য-ণ যুক্ত।",
          "🧠 নিত্য মূর্ধন্য-ষ মনে রাখার গল্প: 'বাষ্পহীন আষাঢ়ের উষাকালে সরিষা ক্ষেতে মহিষ চরে। ঔষধ খেয়ে পঙ্গু মানুষেরা অভিলাষ করে, রোষ ভুলে ষোড়শ ভূষণ পরবে সে আগামী পৌষে।'"
        ]},
        { id:'ch2-s7', title:'কারক ও বিভক্তি: সংজ্ঞা ও প্রকারভেদ', type:'qa', qa:[
          {q:"কারক শব্দের অর্থ কী?", a:"যা ক্রিয়া সম্পাদন করে (কৃ + ণক)।"},
          {q:"কারক কাকে বলে?", a:"বাক্যস্থিত ক্রিয়াপদের সঙ্গে নামপদের যে সম্পর্ক, তাকে কারক বলে।"},
          {q:"বিভক্তি কাকে বলে?", a:"শব্দকে বাক্যে ব্যবহারের উপযোগী পদে রূপান্তরিত করার জন্য শব্দের সঙ্গে যা যুক্ত করতে হয়, তাকে বিভক্তি বলে। যেমন: মাকে — এখানে 'কে' বিভক্তি।"},
          {q:"বিভক্তি কয়টি ও কী কী?", a:"সাতটি — প্রথমা, দ্বিতীয়া, তৃতীয়া, চতুর্থী, পঞ্চমী, ষষ্ঠী, সপ্তমী।"},
          {q:"বাংলায় ব্যবহৃত 'কারক অব্যয়' কোনগুলো?", a:"দ্বারা, দিয়া, কর্তৃক, হইতে, থেকে — এই পাঁচটি কারক অব্যয়।"},
          {q:"কর্মকারক কত প্রকার?", a:"চার প্রকার — সকর্মক ক্রিয়ার কর্ম, প্রযোজক ক্রিয়ার কর্ম, সমধাতুজ কর্ম, উদ্দেশ্য-বিধেয় কর্ম।"},
          {q:"কোন দুটি কারকে কোনো পৃথক বিভক্তি নেই?", a:"করণ ও অপাদান কারকে।"},
          {q:"শূন্য বিভক্তি কাকে বলে?", a:"বাক্যের কোনো পদে যখন কোনো বিভক্তি দৃশ্যমান হয় না, সেই আপাত বিভক্তিহীন পদেও যে বিভক্তি থাকে বলে ধরা হয়, তাকে শূন্য বিভক্তি বলে। যেমন: 'ছেলেটি সকালের চা নিজে করে' — এখানে 'চা'-এর সঙ্গে শূন্য বিভক্তি আছে।"},
          {q:"কর্তৃকারক কাকে বলে?", a:"বাক্যে কর্তাপদের কারকের নাম। যেমন: পাখি উড়ে।"},
          {q:"ক্রিয়া সম্পাদনের বৈচিত্র্য অনুযায়ী কর্তৃকারক কত প্রকার?", a:"চার প্রকার — মুখ্য, প্রযোজক, প্রযোজ্য, ব্যতিহার।"},
          {q:"বাচ্য ও প্রকাশভঙ্গি অনুসারে কর্তৃকারক কত প্রকার?", a:"তিন প্রকার — কর্মবাচ্যের কর্তা, ভাববাচ্যের কর্তা, কর্মকর্তৃবাচ্যের কর্তা।"},
          {q:"করণ কারক কাকে বলে?", a:"কর্তা যার সাহায্যে ক্রিয়া সম্পাদন করে, তাকে করণ কারক বলে। যেমন: আমি পেনসিল দিয়ে লিখি।"},
          {q:"সমধাতুজ করণ কাকে বলে?", a:"কোনো বাক্যে করণ কারক ও ক্রিয়াপদ একই ধাতু থেকে উৎপন্ন হলে, তাকে সমধাতুজ করণ কারক বলে। যেমন: মনের জ্বালায় জ্বলছে।"},
          {q:"সম্প্রদান কারক কাকে বলে?", a:"স্বত্ব ত্যাগ করে যাকে কিছু দান করা হয় বা যার উদ্দেশে কিছু করা হয়, তাকে সম্প্রদান কারক বলে। যেমন: ক্ষুধার্তকে অন্ন দান কর।"},
          {q:"বাংলায় সম্প্রদান কারক টিকে থাকার মূল কারণ কী?", a:"মূলত সংস্কৃত ব্যাকরণের সঙ্গে সঙ্গতি রক্ষার জন্য — কারণ বাংলায় কর্ম ও সম্প্রদান কারকের বিভক্তি অভিন্ন। সুনীতিকুমার চট্টোপাধ্যায়ের মতে দুটিকে পৃথক করার বিশেষ সার্থকতা বাংলায় নেই।"},
          {q:"সম্প্রদান কারক নিয়ে রামমোহন রায়, রবীন্দ্রনাথ ও শহীদুল্লাহ্‌র মত কী?", a:"রামমোহন রায় তাঁর 'গৌড়ীয় ব্যাকরণ'-এ সম্প্রদান কারক স্বীকার করেননি; রবীন্দ্রনাথ ঠাকুরও বাংলায় এর জন্য আলাদা কারকের প্রয়োজনীয়তা অস্বীকার করেছেন। তবে মুহম্মদ শহীদুল্লাহ্‌ সম্প্রদান কারক তুলে দেওয়াকে অযৌক্তিক মনে করেন।"},
          {q:"অপাদান কারক কাকে বলে?", a:"বাক্যে ক্রিয়াটি যে জায়গা থেকে সম্পাদিত হয়, ক্রিয়ার সঙ্গে তার সম্পর্কের নাম অপাদান কারক। যেমন: তিলে তৈল হয়।"},

          {q:"সমানাধিকরণ বহুব্রীহি সমাস কাকে বলে?", a:"যে বহুব্রীহি সমাসের পূর্বপদে বিশেষণ ও পরপদে বিশেষ্য থাকে। যেমন: নীলকণ্ঠ (নীল কণ্ঠ যার)।"},
          {q:"ব্যধিকরণ বহুব্রীহি সমাস কাকে বলে?", a:"যে বহুব্রীহি সমাসে পূর্ব বা পরপদ কোনোটিই সাধারণত বিশেষণ নয়। যেমন: বীণাপাণি (বীণা পাণিতে যার)।"},

          {q:"অলুক বহুব্রীহি সমাস কাকে বলে?", a:"বহুব্রীহি সমাসে পূর্বপদের বিভক্তি বজায় থাকলে ও কোনো পদের পরিবর্তন না হলে, তাকে অলুক বহুব্রীহি বলে। যেমন: হাতেখড়ি, গায়েহলুদ।"},
          {q:"সংখ্যাবাচক বহুব্রীহি সমাস কাকে বলে?", a:"যে বহুব্রীহি সমাসের পূর্বপদ সংখ্যাবাচক ও পরপদ বিশেষ্য। যেমন: দশানন (দশ আনন যার), তেপায়া (তিন পা বিশিষ্ট যা)।"}

        { id:'ch2-s15', title:'অন্যান্য সমাস: অলুক, নিত্য ও প্রাদি', type:'qa', qa:[
          {q:"অলুক সমাস কাকে বলে?", a:"যে সমাসে পূর্বপদের বিভক্তি কখনো লোপ পায় না। অলুক কোনো স্বতন্ত্র সমাস নয় — যেকোনো শ্রেণির সমাসই অলুক হতে পারে। যেমন: যুধিষ্ঠির (যুদ্ধে স্থির যে)।"},
          {q:"নিত্য সমাস কাকে বলে?", a:"যে সমাসে সমস্যমান পদগুলো সবসময় একসঙ্গে থাকে এবং আলাদা ব্যাসবাক্য হয় না, তাকে নিত্য সমাস বলে। এটিও কোনো স্বতন্ত্র সমাস নয়। যেমন: গ্রামান্তর (অন্য গ্রাম), কৃষ্ণসর্প।"},
          {q:"প্রাদি সমাস কাকে বলে?", a:"প্র, পরা ইত্যাদি উপসর্গ পূর্বপদে বসে যে তৎপুরুষ সমাস হয়, তাকে প্রাদি সমাস বলে (প্র+আদি=প্রাদি)। ব্যাসবাক্য না থাকায় একে নিত্য সমাসের অন্তর্ভুক্তও করা হয়। যেমন: অনুতাপ (অনু/পশ্চাৎ তাপ)।"},
          {q:"সুপ্সুপা সমাস কাকে বলে?", a:"সংস্কৃত ব্যাকরণের একটি ধারণা — বিভক্তিযুক্ত (সুপ্‌) একটি নামপদের সঙ্গে আরেকটি বিভক্তিযুক্ত নামপদের যে সমাস হয়, তাকে সুপ্সুপা সমাস বলে। বাংলায় এটি তৎপুরুষ বা কর্মধারয় পর্যায়ে আলোচিত হয়। যেমন: ভূতপূর্ব (পূর্বে ভূত)।"}
        ]},
        { id:'ch2-s16', title:'উপসর্গ', type:'mixed', promptLabel:'উপসর্গটি নির্দেশ করো ও অর্থ লেখ', qa:[
          {q:"উপসর্গ কাকে বলে?", a:"উপসর্গ সাধারণত কতিপয় অব্যয়, যা ধাতু বা শব্দের আগে যুক্ত হয়ে তার অর্থে পরিবর্তন ঘটায়। উপসর্গের নিজের কোনো অর্থ নাও থাকতে পারে, তবে তা অর্থ পরিবর্তনে গুরুত্বপূর্ণ ভূমিকা রাখে; একই উপসর্গ একাধিক অর্থেও ব্যবহৃত হতে পারে।"},
          {q:"উপসর্গকে ইংরেজি ব্যাকরণে কী বলে?", a:"Prefix।"},

          {q:"উপসর্গ প্রধানত কত প্রকার ও কী কী?", a:"তিন প্রকার — খাঁটি বাংলা, তৎসম (সংস্কৃত) ও বিদেশি।"},
          {q:"খাঁটি বাংলা ও তৎসম উপসর্গ কতগুলো করে?", a:"খাঁটি বাংলা উপসর্গ একুশটি (২১টি) এবং তৎসম উপসর্গ কুড়িটি (২০টি)।"},
          {q:"কোন চারটি উপসর্গ খাঁটি বাংলা ও তৎসম উভয় ক্ষেত্রেই ব্যবহৃত হয়?", a:"সু, বি, নি, আ — তবে ব্যবহারভেদে ভিন্ন শব্দ গঠন করে। যেমন খাঁটি বাংলায়: সুনজর, সুনাম, নিলাজ, আধোয়া; তৎসমে: সুনিপুণ, সুলভ, নিষ্কাম, আকণ্ঠ।"},
          {q:"'অপ' উপসর্গ সাধারণত কী অর্থ বোঝায়, এবং এর ব্যতিক্রম কোথায়?", a:"'অপ' সাধারণত বৈপরীত্য বা নেতিবাচক অর্থ বোঝায় (অপব্যবহার, অপব্যয়)। তবে 'অপ+রূপ = অপরূপ/অপরূপা' শব্দে এটি ব্যতিক্রমীভাবে ইতিবাচক অর্থ প্রকাশ করে।"},
          {q:"বিদেশি উপসর্গের কয়েকটি উৎস-ভাষা ও উদাহরণ দাও।", a:"ইংরেজি (ফুল-হাতা, হাফ-বেতন, সাব-ইন্সপেক্টর), হিন্দি-উর্দু (হররোজ, হরেক রকম), ফারসি (কারচুপি, বেকার, বদনাম, নিমরাজি), আরবি (আমজনতা, খাসমহল, লাপাত্তা, গরমিল)।"}
        ], examples:[
          ["অপরূপ","অপ (এখানে ব্যতিক্রমীভাবে ইতিবাচক অর্থে) + রূপ"], ["প্রভাব","প্র (আধিক্য অর্থে) + ভাব"],
          ["পরাজয়","পরা (বৈপরীত্য অর্থে) + জয়"], ["সুনিপুণ","সু (উত্তম অর্থে, তৎসম) + নিপুণ"],
          ["নিলাজ","নি (নিষেধ অর্থে, খাঁটি বাংলা) + লাজ"], ["আকণ্ঠ","আ (সীমা অর্থে, তৎসম) + কণ্ঠ"],

        ], memoryAids:[
          "🧠 খাঁটি বাংলা উপসর্গ (২১টি) মনে রাখার গল্প (লেখকের ভাষায়): 'অঘা রাম অকেজো। অজ পাড়াগাঁয়ে অনাদরে বড়ো। আধোয়া চালের ভাতও ভরপেট সে খেতে পায় না। তবে সে আড়চোখে আড়ালে-আবডালে ইতিহাসের দিকে লক্ষ করে। ভাবে, কবে সে সাজোয়ানের মতো একাই উনিশটি কদবেল খাবে, কুঅভ্যাসগুলো ত্যাগ করবে, নিখুঁতভাবে চলবে। এ নিয়ে আনকোরার মতো সে হাপিত্যেশ করতে থাকে। তার এই বিফল স্বপ্নে পাতিকাক তোমার আসবে না।' — বাঁকা অক্ষরে থাকা শব্দাংশগুলোই একেকটি উপসর্গ।",
          "🧠 তৎসম (সংস্কৃত) উপসর্গ (২০টি) মনে রাখার গল্প: 'এই অপমান, অবজ্ঞা, দুর্ভাগ্য ও পরাজয় অতিশয় দুঃখজনক। আরক্ত হয়ে তার সমাদরহীন প্রস্থানও হৃদয়বিদারক। জীবনের বিশুদ্ধ ও উত্তপ্ত উপকূলে বসে প্রতিদিন নিরক্ষর অনুগামীদের যন্ত্রণা সে সহ্য করেছে। পরিশেষে অভি নামের এক সুকঠিন অভিযান চালিয়ে তার নিগূঢ় প্রতিষ্ঠা করে।'",

        ]},
        { id:'ch2-s17', title:'প্রত্যয়', type:'mixed', promptLabel:'ধাতু/শব্দ ও প্রত্যয় নির্দেশ করো', qa:[
          {q:"প্রত্যয় কাকে বলে ও কত প্রকার?", a:"ধাতুর সঙ্গে যুক্ত হয়ে শব্দ বা ক্রিয়ার কালরূপ গঠন করে, অথবা শব্দের সঙ্গে যুক্ত হয়ে অন্য শব্দ গঠন করে — এমন অংশকে প্রত্যয় বলে। প্রত্যয় দুই প্রকার: ধাতুপ্রত্যয় বা কৃৎপ্রত্যয়, এবং শব্দপ্রত্যয় বা তদ্ধিত প্রত্যয়। যেমন: কৃ (ধাতু) + তব্য (কৃৎপ্রত্যয়) = কর্তব্য (শব্দ)।"},
          {q:"ধাতু বোঝানোর জন্য ধাতুর আগে কোন চিহ্ন ব্যবহার করা হয়?", a:"'√' চিহ্ন (যেমন: √পড়্‌)। এই চিহ্ন ব্যবহার করলে আলাদা করে 'ধাতু' শব্দটি লেখার প্রয়োজন হয় না।"},

          {q:"উপধা কাকে বলে?", a:"শব্দের অন্ত্য বর্ণের ঠিক পূর্ব বর্ণকে উপধা বলে। যেমন: রাজা=রাজ্‌+আ — এখানে 'জ্‌' উপধা।"},

          {q:"গুণ প্রক্রিয়ায় কী পরিবর্তন ঘটে? উদাহরণ দাও।", a:"এই প্রক্রিয়ায় ই/ঈ → এ-তে এবং উ/ঊ → ও-তে পরিণত হয়। যেমন: শী+অন=শয়ন; শু+অন=পবন; কৃ+অন=করণ।"},
          {q:"বৃদ্ধি প্রক্রিয়ায় কী পরিবর্তন ঘটে? উদাহরণ দাও।", a:"এই প্রক্রিয়ায় অ→আ, ই/ঈ→ঐ, উ/ঊ→ঔ পরিণত হয়। যেমন: অলস+য=আলস্য; নিশা+অ=নৈশ; ভূত+ইক=ভৌতিক।"},
          {q:"সম্প্রসারণ প্রক্রিয়ায় কী পরিবর্তন ঘটে? উদাহরণ দাও।", a:"এই প্রক্রিয়ায় ব→উ এবং য→ই-তে পরিণত হয়। যেমন: বচ্‌+ত=উক্ত; যজ্‌+তি=ইষ্টি।"}

          {q:"নিত্য পুরুষবাচক শব্দের কয়েকটি উদাহরণ দাও।", a:"কবিরাজ, যোদ্ধা, সেনাপতি, দলপতি, রাষ্ট্রপতি, বিচারপতি, কৃতদার।"},

          {q:"স্ত্রীলিঙ্গান্তর করলে ক্ষুদ্রার্থ প্রকাশ পায়, এমন কয়েকটি শব্দ লেখ।", a:"একাঙ্ক>একাঙ্কিকা, নাটক>নাটিকা, মালা>মালিকা, গীত>গীতিকা, পুস্তক>পুস্তিকা।"},
          {q:"স্ত্রীলিঙ্গান্তর করলে বৃহৎ অর্থ বোঝায়, এমন শব্দের উদাহরণ দাও।", a:"অরণ্য>অরণ্যানী, হিম>হিমানী।"},
          {q:"অবজ্ঞাসূচক স্ত্রীবাচক শব্দের উদাহরণ দাও।", a:"ডাক্তার>ডাক্তারনী, দারোগা>দারোগানী, জমিদার>জমিদারনী, মাস্টার>মাস্টারনী।"}

          {q:"কোন বিভক্তি বহুবচন বোঝাতে ব্যবহৃত হয়?", a:"'গণ'-বিভক্তি। যেমন: শিক্ষকগণ জ্ঞান দান করেন।"},
          {q:"বিশেষ্য দ্বিত্ব প্রয়োগে বহুবচন বোঝানোর উদাহরণ দাও।", a:"'পাগল হইয়া ফিরি বনে বনে' (রবীন্দ্রনাথ); 'চরকার ঘর্‌ ঘর্‌ পল্লীর ঘরে ঘরে' (সত্যেন্দ্রনাথ)।"},
          {q:"বিশেষণ দ্বিত্ব প্রয়োগে বহুবচন বোঝানোর উদাহরণ দাও।", a:"'ছোট ছোট ফল' — এখানে অনেকগুলো ফলের কথা বোঝানো হচ্ছে, যাদের প্রতিটিই ছোট।"},
          {q:"বিদেশি শব্দে সবসময় কি বিদেশি নিয়মে বহুবচন হয়?", a:"না, সবক্ষেত্রে নয়। যেমন: জনাব>সর্বজনাব বিদেশি নিয়মে বহুবচন হয় না, কিন্তু সাহেব>সাহেবান, বুজুর্গ>বুজুর্গান বিদেশি নিয়মে হয়েছে।"}
        ]},
        { id:'ch2-s20', title:'পদ-প্রকরণ: বিশেষ্য ও বিশেষণ', type:'qa', qa:[
          {q:"পদ কাকে বলে?", a:"বিভক্তিযুক্ত শব্দকে পদ বলে।"},
          {q:"বাক্যে ব্যবহৃত প্রতিটি শব্দকে পদ বলা হয় কেন?", a:"বাক্যে ব্যবহৃত হওয়ামাত্র প্রতিটি শব্দ বিভক্তিযুক্ত হয়ে যায়; যে শব্দে বিভক্তি দৃশ্যমান হয় না, সেখানেও শূন্য বিভক্তি থাকে বলে ধরা হয় — তাই বাক্যের প্রতিটি শব্দই পদ।"},
          {q:"পদ প্রধানত কত প্রকার?", a:"দুই প্রকার — নামপদ ও ক্রিয়াপদ।"},
          {q:"নামপদ কাকে বলে?", a:"বাক্যে ক্রিয়াপদ ব্যতীত সব পদই (বিশেষ্য, বিশেষণ, সর্বনাম, অব্যয়) নামপদ।"},
          {q:"ক্রিয়াপদকে বাক্যের আবশ্যিক পদ বলা হয় কেন?", a:"বাংলা ব্যাকরণের নিয়মানুসারে ক্রিয়াপদ ছাড়া কোনো বাংলা বাক্য গঠিত হয় না — প্রকাশ্য না থাকলেও ক্রিয়াপদ উহ্যভাবে বাক্যে থাকে বলে একে আবশ্যিক পদ বলা হয়। যেমন: 'রাম ও রহিম বন্ধু' — এখানে 'হয়' উহ্য।"},
          {q:"বিশেষ্য কাকে বলে?", a:"যে পদে কোনো কিছুর নাম বোঝায়, তাকে বিশেষ্য বলে।"},
          {q:"বিশেষ্যের প্রকারভেদ নিয়ে ভাষাবিজ্ঞানীদের মধ্যে মতভেদ কী?", a:"বিশেষ্যের প্রকার-সংখ্যা নিয়ে ভাষাবিজ্ঞানীদের মধ্যে মতভেদ আছে (যেমন জগদীশচন্দ্র ঘোষ সাত প্রকারের কথা বলেন); তবে প্রচলিত পাঠ্যক্রমে সাধারণত ছয়টি প্রকার আলোচিত হয় — নামবাচক, বস্তুবাচক, ভাববাচক, জাতিবাচক, সমষ্টিবাচক ও গুণবাচক।"},
          {q:"বিভিন্ন প্রকারের বিশেষ্যের উদাহরণ দাও।", a:"নামবাচক/সংজ্ঞাবাচক (পদ্মা, বুড়িগঙ্গা), বস্তুবাচক (লেখনী, চাল, চিনি), ভাববাচক (গমন, আনন্দ, দুঃখ), জাতিবাচক (মানুষ, বাঙালি, ইংরেজ), সমষ্টিবাচক (ঝাঁক, গোষ্ঠী, দল), গুণবাচক (তারুণ্য, সৌন্দর্য, সাহস)।"},
          {q:"বিশেষণ কাকে বলে?", a:"বাক্যস্থিত কোনো পদের গুণ, পরিমাণ, অবস্থা, সংখ্যা, ধর্ম ইত্যাদি বোঝানোর জন্য ব্যবহৃত পদকে বিশেষণ বলে।"},
          {q:"বিশেষণ প্রধানত কত প্রকার?", a:"দুই প্রকার — নাম বিশেষণ ও ভাব বিশেষণ।"},
          {q:"নাম বিশেষণ ও ভাব বিশেষণ কাকে বলে?", a:"বাক্যে বিশেষ্য ও সর্বনাম পদের বিশেষণকে নাম বিশেষণ বলে; বাক্যে বিশেষণ, অব্যয় ও ক্রিয়ার বিশেষণকে ভাব বিশেষণ বলে।"},
          {q:"বিশেষণের বিশেষণ কাকে বলে?", a:"বাক্যের বিশেষণ পদকে বিশেষায়িত করে যে বিশেষণ। যেমন: 'খুব মিষ্টি দই' — এখানে 'খুব' বিশেষণের বিশেষণ।"},
          {q:"ক্রিয়া-বিশেষণ কাকে বলে?", a:"যে পদ বাক্যের ক্রিয়াপদের গুণ, প্রকৃতি, তীব্রতা ইত্যাদি চিহ্নিত করে। যেমন: 'গুনগুনিয়ে ঘরেতে ভ্রমর এল', 'বায়ু ধীরে বয়'।"},
          {q:"অব্যয়-বিশেষণ কাকে বলে?", a:"যে পদ বাক্যে অব্যয় পদকে বিশেষায়িত করে। যেমন: 'তুমি তো প্রায় পাগলের মতো দৌড়াচ্ছ' — এখানে 'প্রায়' অব্যয় 'মতো'-কে বিশেষায়িত করছে।"},
          {q:"বাক্যের বিশেষণ কী?", a:"বিশেষণ কখনো শুধু একটি পদকে নয়, পুরো বাক্যকেই বিশেষায়িত করে — একে বাক্যের বিশেষণ বলে। যেমন: 'দুর্ভাগ্যক্রমে দেশে অপশক্তির উত্থান ঘটেছে'।"},
          {q:"বিশেষণের অতিশায়ন কাকে বলে?", a:"বিশেষণ পদ যখন একের চেয়ে অন্যের উৎকর্ষ বা অপকর্ষ বোঝায়, তখন তাকে বিশেষণের অতিশায়ন বলে। যেমন: 'কাঞ্চন ক্লাসের সবচেয়ে ভালো ছেলে' — 'সবচেয়ে' অতিশায়িত রূপ।"}
        ]},
        { id:'ch2-s21', title:'পদ-প্রকরণ: সর্বনাম ও অব্যয়', type:'qa', qa:[
          {q:"সর্বনাম কাকে বলে?", a:"বিশেষ্যের পরিবর্তে বাক্যে যে শব্দ ব্যবহৃত হয়, তাকে সর্বনাম বলে। যেমন: সে, তারা, তুমি।"},
          {q:"সর্বনামের শ্রেণিবিভাগ লেখ।", a:"ব্যক্তি/পুরুষবাচক (আমি, তুমি, সে), আত্মবাচক (স্বয়ং, নিজ), সামীপ্যবাচক (এ, এই), দূরত্ববাচক (ওই, ওইসব), সাকুল্যবাচক (সব, সমুদয়), প্রশ্নবাচক (কী, কে), অনির্দিষ্টতাজ্ঞাপক (কোন, কেউ), ব্যতিহারিক (আপনা-আপনি), সংযোগজ্ঞাপক (যে, যিনি), অন্যাদিবাচক (অন্য, অপর) — মোট দশ প্রকার।"},
          {q:"সর্বনামে সম্ভ্রমার্থে বিশেষ কী ব্যবহৃত হয়?", a:"চন্দ্রবিন্দু। যেমন: 'রবীন্দ্রনাথ ঠাকুর তাঁর নোবেল পুরস্কারের সমস্ত টাকা দান করে দিলেন' — এখানে 'তাঁর' চন্দ্রবিন্দুযুক্ত সম্ভ্রমসূচক রূপ।"},
          {q:"সব্যয় ও অব্যয় শব্দ কাকে বলে?", a:"যেসব শব্দের লিঙ্গ, বচন বা বিভক্তিযোগে কোনো পরিবর্তন হয় না, সেগুলোকে অব্যয় পদ বলে (যেমন: বাঃ, যেন, তথাপি); এ ধরনের শব্দ ছাড়া বাকি সব শব্দই সব্যয়।"},
          {q:"অব্যয় কত প্রকার ও কী কী?", a:"চার প্রকার — সমুচ্চয়ী বা সম্বন্ধবাচক, অনন্বয়ী, অনুসর্গ (পদান্বয়ী), অনুকার অব্যয়।"},
          {q:"সমুচ্চয়ী (সম্বন্ধবাচক) অব্যয় কাকে বলে?", a:"যে অব্যয় বাক্যে অন্যপদগুলোকে যোজন, বিয়োজন বা সংকোচন ঘটায়। যেমন: সংযোজক (সিদ্ধার্থ ও আলি দুই বন্ধু), বিয়োজক (সুরুজ অথবা শেফালি রান্না করবে), সংকোচক (সাগর অল্প পড়ে, কিন্তু খুব মেধাবী)।"},
          {q:"পদান্বয়ী (অনুসর্গ) অব্যয় কাকে বলে?", a:"যে অব্যয় বাক্যের দুটি পদের মধ্যে অন্বয় বা সম্বন্ধ নিরূপণ করে এবং এক প্রকার কারকবাচকতা প্রকাশ করে। যেমন: 'তোমাকে দিয়ে এ কাজ হবে'।"},
          {q:"অনন্বয়ী অব্যয় কাকে বলে?", a:"যে অব্যয় বাক্যের অন্য পদের সঙ্গে সম্পর্কযুক্ত নয়, সাধারণত বিস্ময়াত্মক শব্দ এর অন্তর্গত। যেমন: আহা, বাহ, 'শত ধিক্‌!'"},
          {q:"অনুকার (ধ্বন্যাত্মক) অব্যয় কাকে বলে?", a:"বাংলায় যেসব ধ্বন্যাত্মক শব্দ বাক্যে অব্যয় হিসেবে ব্যবহৃত হয়, তাকে অনুকার অব্যয় বলে। যেমন: খাঁ খাঁ (শূন্যতা), কুহু (কোকিলের ডাক), কলকল (স্রোতের ধ্বনি), ভেউ ভেউ (কান্না)।"}
        ]},
        { id:'ch2-s22', title:'পদ-প্রকরণ: ক্রিয়া', type:'qa', qa:[
          {q:"ক্রিয়াপদ কাকে বলে?", a:"বাক্যে যে পদে কোনো কাজ করা, ঘটা বা হওয়া বোঝায়, তাকে ক্রিয়াপদ বলে। যেমন: আমি পড়ি।"},
          {q:"অনুক্ত ক্রিয়া কাকে বলে?", a:"বাক্যে ক্রিয়াপদ প্রকাশ্যে না থেকে উহ্য থাকলে, তাকে অনুক্ত ক্রিয়া বলে। যেমন: 'তোমার শরীর কেমন?' — এখানে 'আছে' অনুক্ত।"},
          {q:"ভাবপ্রকাশের দিক থেকে ক্রিয়া কত ভাগে বিভক্ত?", a:"দুই ভাগে — সমাপিকা ক্রিয়া ও অসমাপিকা ক্রিয়া।"},
          {q:"সমাপিকা ও অসমাপিকা ক্রিয়ার পার্থক্য কী?", a:"যে ক্রিয়া প্রয়োগে বাক্যের ভাব সম্পূর্ণরূপে প্রকাশ পায়, অন্য ক্রিয়ার প্রত্যাশা থাকে না, তাকে সমাপিকা ক্রিয়া বলে (আমি বিশ্ববিদ্যালয়ে যাব)। যে ক্রিয়া প্রয়োগে বাক্যের অর্থ অসম্পূর্ণ থাকে, তাকে অসমাপিকা ক্রিয়া বলে (তুমি ভাত খেয়ে...)।"},
          {q:"সকর্মক ও অকর্মক ক্রিয়া কাকে বলে?", a:"যে ক্রিয়ার কর্মপদ আছে তাকে সকর্মক ক্রিয়া বলে (সে বই পড়ে); যে ক্রিয়ার কর্মপদ নেই তাকে অকর্মক ক্রিয়া বলে (আমি যাচ্ছি)।"},
          {q:"দ্বিকর্মক ক্রিয়া কাকে বলে?", a:"যে ক্রিয়ার দুটি কর্মপদ থাকে (একটি মুখ্য কর্ম, একটি গৌণ কর্ম) তাকে দ্বিকর্মক ক্রিয়া বলে। যেমন: 'স্বপনকে বই দাও' — এখানে 'স্বপনকে' গৌণ কর্ম ও 'বই' মুখ্য কর্ম।"},
          {q:"দুটি কর্মপদ একই ধরনের (উভয়ই ব্যক্তিবাচক বা বস্তুবাচক) হলে কি ক্রিয়া দ্বিকর্মক হয়?", a:"না। যেমন: 'মা ছেলে ও মেয়েকে আদর করছেন' — এটি প্রকৃতপক্ষে দুটি পৃথক বাক্যের সংক্ষেপ (মা ছেলেকে আদর করছেন + মা মেয়েকে আদর করছেন), দ্বিকর্মক নয়।"},
          {q:"সমধাতুজ কর্ম কাকে বলে?", a:"বাক্যের ক্রিয়াপদ ও কর্মপদ একই ধাতু থেকে গঠিত হলে, সেই কর্মপদকে সমধাতুজ কর্ম বা ধাত্বর্থক কর্মপদ বলে। যেমন: 'এমন খেলা সে খেলেছে!'"},
          {q:"প্রযোজক ক্রিয়া কাকে বলে?", a:"যে ক্রিয়ায় কর্তা নিজে না করে অন্যকে দিয়ে করানো বোঝায়, তাকে প্রযোজক ক্রিয়া বলে (সংস্কৃতে একে ণিজন্ত ক্রিয়া বলে)। যেমন: মা শিশুকে পড়াচ্ছেন।"},
          {q:"'জাদুকর জাদু দেখায়' — এই বাক্যে প্রযোজক পদ কীভাবে বিশ্লেষিত হয়?", a:"প্রযোজক কর্তা: জাদুকর; প্রযোজ্য কর্তা: জাদু; প্রযোজক ক্রিয়া: দেখায়।"}
        ]},
        { id:'ch2-s23', title:'বাক্য-প্রকরণ: গঠন অনুসারে বাক্যের প্রকারভেদ', type:'mixed', promptLabel:'বাক্যের প্রকার নির্ণয় কর', qa:[
          {q:"ভাষার প্রাণ কী?", a:"অর্থবোধক বাক্য।"},
          {q:"বিশ্বনাথ কবিরাজ তাঁর 'সাহিত্যদর্পণ' গ্রন্থে বাক্যের সংজ্ঞায় কী বলেছেন?", a:"তিনি বলেছেন 'বাক্যং স্যাদ্‌ যোগ্যতাকাঙ্ক্ষাসত্তিযুক্তঃ পদোচ্চয়ঃ' — অর্থাৎ যোগ্যতা, আকাঙ্ক্ষা ও আসত্তি (নৈকট্য) সহযোগে গঠিত পদসমষ্টিই বাক্য।"},
          {q:"গঠন অনুসারে বাক্য কত প্রকার ও কী কী?", a:"তিন প্রকার — সরল বাক্য, মিশ্র বা জটিল বাক্য, যৌগিক বাক্য।"},
          {q:"সরল বাক্য কাকে বলে?", a:"যে বাক্যে একটি মাত্র সমাপিকা ক্রিয়া থাকে এবং যা অন্য কোনো বাক্যের সঙ্গে যুক্ত বা সম্পর্কিত নয়, তাকে সরল বাক্য (সাধারণ বাক্য) বলে। যেমন: বিমল খুব ভালো ছাত্র।"},
          {q:"মিশ্র বা জটিল বাক্য কাকে বলে?", a:"একটি প্রধান বাক্যের সঙ্গে এক বা একাধিক খণ্ড বাক্য কোনো সমুচ্চয়ী অব্যয় বা সাপেক্ষ সর্বনাম দিয়ে যুক্ত হয়ে পরস্পর সাপেক্ষভাবে ব্যবহৃত হলে, তাকে মিশ্র বা জটিল বাক্য বলে। যেমন: 'কাকলি বলল যে, শম্পা-ই কাজটি করেছে' — এখানে 'কাকলি বলল যে' প্রধান বাক্য, আর 'শম্পা-ই কাজটি করেছে' অপ্রধান বাক্য।"},
          {q:"যৌগিক বাক্য কাকে বলে?", a:"সম্পূর্ণ পৃথক ও নিরপেক্ষ একাধিক খণ্ডবাক্য সংযোগবাচক অব্যয়ের (ও, অথবা, এবং, অথচ, কিন্তু, বরং, তথাপি) সাহায্যে যুক্ত হয়ে পরিপূর্ণ অর্থ প্রকাশ করলে, তাকে যৌগিক বাক্য বলে। যেমন: 'মানুষ সূর্যোদয়ে আনন্দিত হয় এবং রাত্রির আগমনে পুলকিত হয়ে থাকে।'"},
          {q:"গুরুচণ্ডালী দোষ কাকে বলে?", a:"তৎসম শব্দের সঙ্গে দেশীয় (তদ্ভব/দেশি) শব্দের একত্র ব্যবহার গুরুচণ্ডালী দোষ সৃষ্টি করে। যেমন: 'ঘোড়াশকট' গুরুচণ্ডালী দোষে দুষ্ট — শুদ্ধ হবে 'ঘোড়াগাড়ি' বা 'অশ্বশকট'।"}
        ], examples:[
          ["বিমল খুব ভালো ছাত্র।","সরল বাক্য"], ["যে পরিশ্রম করে, সেই সুখলাভ করে।","মিশ্র বা জটিল বাক্য"],
          ["লেখাপড়া করে যেই, গাড়ি ঘোড়া চড়ে সেই।","মিশ্র বা জটিল বাক্য"], ["যতই করিবে দান, ততই যাবে বেড়ে।","মিশ্র বা জটিল বাক্য"],
          ["মানুষ সূর্যোদয়ে আনন্দিত হয় এবং রাত্রির আগমনে পুলকিত হয়।","যৌগিক বাক্য"],
          ["তাঁর টাকা আছে, কিন্তু তিনি দান দেন না।","যৌগিক বাক্য"], ["মেঘ গর্জন করে, তবে ময়ূর নৃত্য করে।","যৌগিক বাক্য"],
          ["যেহেতু বৃষ্টিতে ভিজেছ, সেহেতু সর্দি তোমার হবেই।","মিশ্র বা জটিল বাক্য"]
        ]},
        { id:'ch2-s24', title:'যতি বা ছেদ-চিহ্ন', type:'qa', qa:[
          {q:"যতি বা ছেদ-চিহ্ন কী?", a:"বাক্য লেখার সময় লেখক নিজের আনন্দ-আবেগ, জিজ্ঞাসা-প্রশ্ন ইত্যাদি প্রকাশ এবং বাক্যের বিরতি নির্দেশ করতে যেসব চিহ্ন ব্যবহার করেন, তাকে যতি বা ছেদ-চিহ্ন বলে।"},
          {q:"আগে বাংলায় কী ধরনের ছেদ-চিহ্ন ছিল?", a:"আজকের মতো বিচিত্র ছেদ-চিহ্ন ছিল না; শুধু এক দাঁড়ি (।) ও দুই দাঁড়ি (॥) ছিল — এক দাঁড়ি দিয়ে কমার মতো অল্প বিরাম এবং দুই দাঁড়ি দিয়ে অধিক বিরাম বোঝাত।"},
          {q:"বাংলা ভাষায় যতি বা ছেদ-চিহ্নের প্রবর্তক কে?", a:"ঈশ্বরচন্দ্র বিদ্যাসাগর। তাঁর আগে বাংলা গদ্য বা কবিতায় যথাযথ যতিচিহ্ন ব্যবহৃত হতো না — শুধু পূর্ণচ্ছেদ জ্ঞাপক দাঁড়ি চিহ্নটি ছিল। গদ্য রচনায় বক্তব্য যথাযথভাবে প্রকাশের প্রয়োজনে তিনি ইংরেজি গদ্য থেকে অন্যান্য যতিচিহ্নগুলো বাংলায় প্রবর্তন করেন।"},
          {q:"বিদ্যাসাগর ফুলস্টপ (.) গ্রহণ না করে কী রাখলেন এবং কেন?", a:"যেহেতু বাংলায় পূর্ণচ্ছেদ-জ্ঞাপক দাঁড়ি (।) আগে থেকেই প্রচলিত ছিল, তাই তিনি ফুলস্টপ গ্রহণ না করে বাংলার নিজস্ব সম্পদ দাঁড়ি-কেই পূর্ণচ্ছেদ চিহ্নরূপে বহাল রাখলেন।"},
          {q:"বিদ্যাসাগর-প্রবর্তিত সব যতিচিহ্নের কি বাংলা নাম হয়েছে?", a:"না — আজও এর সবগুলোর বাংলা নাম হয়নি; কোনোটির বাংলা নাম থাকলেও তা ইংরেজি নামেই বেশি পরিচিত।"},
          {q:"দাঁড়ি (।) কখন ব্যবহৃত হয়?", a:"বাক্যের পূর্ণ পরিসমাপ্তি বোঝাতে। যেমন: 'রহিম ঘরে ঢুকে করুণ দৃষ্টিতে মায়ের দিকে চাইল।'"},
          {q:"জিজ্ঞাসাচিহ্ন (?) কখন ব্যবহৃত হয়?", a:"বাক্যে কোনো জিজ্ঞাসা বা প্রশ্ন করা হলে। যেমন: 'তুমি কি রবীন্দ্রনাথের গীতাঞ্জলি পাঠ করেছ?'"},
          {q:"বিস্ময়চিহ্ন (!) কখন ব্যবহৃত হয়?", a:"হৃদয়ের বিস্ময় ও আবেগ প্রকাশের জন্য; সম্বোধনে আবেগ বোঝালেও এই চিহ্ন বসে। যেমন: 'আহা! কী করুণ দৃশ্য।'"},
          {q:"কোলন (:) কখন ব্যবহৃত হয়?", a:"বাক্য অসম্পূর্ণ রেখে প্রাসঙ্গিক অন্য তথ্য জ্ঞাপনের সময়। যেমন: 'কমিটিতে সিদ্ধান্ত হলো: আগামী মাসেই নির্বাচন অনুষ্ঠিত হবে।'"},
          {q:"ড্যাস (—) কখন ব্যবহৃত হয়?", a:"(ক) কোনো কথার উদাহরণ, দৃষ্টান্ত বা বিস্তার বোঝাতে (যেমন: গঠনানুসারে শব্দ দুই প্রকার — মৌলিক শব্দ, সাধিত শব্দ), (খ) পৃথক ভাবাপন্ন একাধিক বাক্য এক বাক্যে স্থাপনের সময়।"},
          {q:"কমা (,) কখন ব্যবহৃত হয়?", a:"(ক) সম্বোধন পদের পরে (যেমন: 'স্যার, আমাকে ব্যাপারটি বুঝিয়ে দেবেন?'), (খ) সমজাতীয় একাধিক পদ পাশাপাশি বসলে তাদের মাঝে (যেমন: হাঁস, মুরগি, ভেড়া, ছাগল গৃহপালিত পশু), (গ) জটিল বাক্যের অন্তর্গত প্রতিটি খণ্ডবাক্যের পরে।"},
          {q:"যতিচিহ্নের বিরতিকাল সম্পর্কে সাধারণ ধারণা কী?", a:"দাঁড়ি, বিস্ময়চিহ্ন, প্রশ্নবোধক চিহ্ন, কোলন ও ড্যাশে প্রায় ১ সেকেন্ড বিরতি নেওয়া হয়; কমা ও উদ্ধরণচিহ্নে তার চেয়ে কম সময়; সেমিকোলনে কমার প্রায় দ্বিগুণ সময় বিরতি নেওয়া হয়।"}
        ]},
        { id:'ch2-s25', title:'বানানরীতি: প্রচলিত ভুল বানান', type:'qa', qa:[
          {q:"শব্দের শুদ্ধরূপ কাকে বলে?", a:"বাংলা ভাষায় ব্যবহৃত প্রতিটি শব্দই কোনো না কোনো নিয়ম দিয়ে ব্যাখ্যা করা যায়; বানানের এই নিয়মকেন্দ্রিকতাকেই শব্দের শুদ্ধরূপ বলে। ভুল বানান প্রচলিত থাকলেও পরিশুদ্ধবাদীরা সর্বদা শুদ্ধ বানানের পক্ষে থাকেন।"},
          {q:"'সাক্ষর' ও 'স্বাক্ষর' — এই দুটি বানান কি শুদ্ধ, অর্থ কী?", a:"দুটোই শুদ্ধ, তবে অর্থ ভিন্ন — সাক্ষর অর্থ শিক্ষিত বা অক্ষরজ্ঞানসম্পন্ন; স্বাক্ষর অর্থ সহি বা দস্তখত।"},
          {q:"'অক্ষরজ্ঞ' ও 'অক্ষরাজ্ঞ' — উভয় বানান কি শুদ্ধ, অর্থ কী?", a:"দুটোই শুদ্ধ — অক্ষরজ্ঞ অর্থ যিনি অক্ষর/বিদ্যা সম্পর্কে জ্ঞানী; অক্ষরাজ্ঞ অর্থ যিনি অক্ষর সম্পর্কে অজ্ঞ (বিদ্যাহীন)।"},
          {q:"'অত্র বিদ্যালয়' প্রয়োগ কি শুদ্ধ?", a:"ভুল। 'অত্র' অর্থ 'এইখানে' — তাই 'অত্র বিদ্যালয়' মানে দাঁড়ায় 'এইখানে বিদ্যালয়', কিন্তু বোঝাতে চাওয়া হয় 'এই বিদ্যালয়'।"},
          {q:"'বঁধু' ও 'বধূ' শব্দ দুটির অর্থ কী?", a:"'বঁধু' অর্থ বন্ধু (স্বামী অর্থেও ব্যবহৃত); আর 'বধূ' অর্থ নববধূ/স্ত্রী।"},
          {q:"'প্রজ্বলন' ও 'প্রোজ্জ্বল' বানান দুটো কি সঠিক?", a:"হ্যাঁ, দুটোই সঠিক — কারণ প্র+জ্বলন=প্রজ্বলন; আবার প্র+উজ্জ্বল=প্রোজ্জ্বল (সন্ধিজনিত পরিবর্তন)।"},
          {q:"'বন্দোপাধ্যায়' বানানটি কি শুদ্ধ?", a:"না, ভুল। শুদ্ধ হবে 'বন্দ্যোপাধ্যায়' (বন্দ্য+উপাধ্যায়=বন্দ্যোপাধ্যায়)।"},
          {q:"'বিভিষীকা' বানানটি কি শুদ্ধ?", a:"না, ভুল। শুদ্ধরূপ 'বিভীষিকা'।"},
          {q:"'আপোষ' বানানটি শুদ্ধ নয় কেন?", a:"শব্দটি ফারসি; ফারসি শব্দে সাধারণত মূর্ধন্য-ষ বসে না, তাই শুদ্ধ বানান 'আপোস'।"},
          {q:"'শ্রেণি' বানান কি শুদ্ধ?", a:"হ্যাঁ, শুদ্ধ — সংস্কৃতে 'শ্রেণী' ও 'শ্রেণি' উভয় বানানই সিদ্ধ ও একই অর্থবাহী।"},
          {q:"'শ্রদ্ধাঞ্জলী' বানানটি কি ভুল?", a:"হ্যাঁ, ভুল। 'অঞ্জলি' অর্থ জোড়হাত — তাই শুদ্ধ হবে 'শ্রদ্ধাঞ্জলি' (হ্রস্ব ই-কার)। একই নিয়মে প্রেমাঞ্জলি, গীতাঞ্জলি, পুষ্পাঞ্জলি, জলাঞ্জলি শুদ্ধ।"},
          {q:"'উপরোক্ত' ও 'উল্লেখিত' শব্দ দুটির সঠিক রূপ কী?", a:"'উপরোক্ত'-এর সঠিক রূপ 'উপরিউক্ত'; আর 'উল্লেখিত'-এর সঠিক রূপ 'উল্লিখিত' (উপরে উল্লেখ করা হয়েছে এই অর্থে)।"},
          {q:"'ইতিপূর্বে' ও 'ইতিমধ্যে' শব্দ দুটি কি শুদ্ধ?", a:"ভুল, যদিও প্রচলিত। শুদ্ধরূপ 'ইতঃপূর্বে' ও 'ইতোমধ্যে'।"},
          {q:"'এতদ্বারা' বানানটি কি শুদ্ধ?", a:"না, ভুল বানান। সন্ধির নিয়ম অনুসারে শুদ্ধ বানান 'এতদ্‌দ্বারা'।"},
          {q:"'পরিষ্কার', 'আবিষ্কার', 'পুরস্কার', 'তিরস্কার' — এই চারটি বানান কোন বিধান অনুসারে শুদ্ধ?", a:"ষ-ত্ব বিধান অনুসারে।"},
          {q:"'দুরাবস্থা' বানানটি কি শুদ্ধ?", a:"না, ভুল। এটি সন্ধিঘটিত বানান — শুদ্ধরূপ 'দুরবস্থা'।"},
          {q:"ভেঙে পড়া অর্থে 'ধস' না 'ধ্বস' কোনটি শুদ্ধ?", a:"'ধস' শুদ্ধ।"},
          {q:"'উর্ধ্ব' না 'ঊর্ধ্ব' কোন বানান শুদ্ধ?", a:"'ঊর্ধ্ব' শুদ্ধ (দীর্ঘ ঊ-কার)।"},
          {q:"'মুহুর্মুহু' শব্দের সঠিক বানান কী?", a:"'মুহুর্মুহু' নয় — সঠিক বানান 'মুহুমুহু', যেখানে চারটি স্থানেই হ্রস্ব উ-কার এবং একটি স্থানে রেফ্‌ থাকে।"}
        ]}
      ]

    {
      id:'ch3', title:'বাংলা-বিদ্যার অন্যান্য শৃঙ্খলা: ছন্দ-প্রকরণ', status:'partial',
      sections: [
        { id:'ch3-s1', title:'ছন্দ-প্রকরণ: মৌলিক ধারণা', type:'qa', qa:[
          {q:"ছন্দ কাকে বলে?", a:"সুনিয়মিত ও সুপরিমিত ভাবে ধ্বনিবিন্যাস করার বিবিধ প্রণালির নাম ছন্দ। কবিতার মতো গদ্যেরও নিজস্ব ছন্দ থাকে।"},
          {q:"কবিতা ও পদ্যের মধ্যে পার্থক্য কী?", a:"পঙ্‌ক্তি-সমাবেশ যখন একটি নির্দিষ্ট ছন্দে রূপায়িত হয়, যেখানে চিন্তার খোরাক না থেকে শুধু ভালোলাগার আবেশ বা নীতিকথা থাকে, তাকে পদ্য বলে। আর যেখানে গভীর অর্থজ্ঞাপক, অনুভূতির বহুমাত্রিকতায় ধ্বনি-স্পন্দনময় হয়ে বাঙ্‌ময় রূপ লাভ করে, তখন তাকে কবিতা বলে। কবিতা গদ্যেও রচিত হতে পারে — সেক্ষেত্রে সুনির্দিষ্ট ছন্দের বন্ধনের প্রয়োজন নেই।"},
          {q:"অক্ষর (Syllable) কাকে বলে?", a:"বাগ্‌যন্ত্রের ক্ষুদ্রতম প্রয়াসে উচ্চারিত ধ্বনি বা শব্দাংশের নাম অক্ষর (Syllable)। যেমন: 'রবিবার' শব্দে তিনটি অক্ষর — (র)(বি)(বার)।"},
          {q:"অক্ষর কত প্রকার ও কী কী?", a:"দুই প্রকার — মুক্তাক্ষর (Open syllable) ও বদ্ধাক্ষর (Closed syllable)।"},
          {q:"মুক্তাক্ষর ও বদ্ধাক্ষরের পার্থক্য কী?", a:"অযুগ্ম বা মুক্ত স্বরান্ত ধ্বনিকে মুক্তাক্ষর বলে (যেমন: ভা-লো-বা-সো)। যুগ্মস্বরান্ত বা ব্যঞ্জনান্ত ধ্বনিকে বদ্ধাক্ষর বলে (যেমন: সোম্‌, বার্‌, দিন্‌, রাত্‌)।"},
          {q:"পঙ্‌ক্তি ও ছত্রের মধ্যে পার্থক্য কী?", a:"কবিতায় পূর্ণযতি দিয়ে নিরূপিত ছন্দোবিভাগের নাম পঙ্‌ক্তি; আর ছত্র নিরূপিত হয় যতিচিহ্নের সঙ্গে। যেমন ত্রিপদীতে একটি পঙ্‌ক্তি তিন ছত্রে সাজানো থাকে।"},
          {q:"যতি, পূর্ণপর্ব, অপূর্ণপর্ব ও অতিপর্ব কাকে বলে?", a:"কবিতা পাঠের সুবিধার্থে প্রতি ছত্রে এক বা একাধিক বিশ্রামস্থান সৃষ্টি হয়, একে যতি বলে। ছত্রে 'যতি' পতনের পূর্ব অংশকে পর্ব বলে। নির্দিষ্ট মাত্রার পর্বকে পূর্ণপর্ব; নির্দিষ্ট মাত্রার চেয়ে কম হয়েও ছত্রের শেষে থাকা পর্বকে অপূর্ণপর্ব; নির্দিষ্ট মাত্রার চেয়ে কম হয়েও ছত্রের শুরুতে থাকা পর্বকে অতিপর্ব বলে।"},
          {q:"মধ্যখণ্ডন কাকে বলে?", a:"পর্ব বিভাগের প্রয়োজনে কোনো শব্দকে বিভক্ত করে উচ্চারণ করতে হলে, সেই শব্দখণ্ডনের স্থানটিকে মধ্যখণ্ডন বলে।"},
          {q:"বাংলা ছন্দ-বিচার কোন নিরিখে করা হয়?", a:"পর্বের গঠনরীতিগত পার্থক্য অনুসারে।"},
          {q:"বাংলা ছন্দ কত প্রকার ও কী কী?", a:"তিন প্রকার — অক্ষরবৃত্ত, মাত্রাবৃত্ত, স্বরবৃত্ত।"},
          {q:"তিন ছন্দের অপর নাম কী কী?", a:"অক্ষরবৃত্তকে কেউ কেউ কলামাত্রিক বা যৌগিক ছন্দ; মাত্রাবৃত্তকে দলবৃত্ত ছন্দ; স্বরবৃত্তকে ছড়ার ছন্দ বা লৌকিক ছন্দ নামেও অভিহিত করেন।"},
          {q:"তিন ছন্দ কোন কোন লয়ে রচিত হয়?", a:"অক্ষরবৃত্ত ধীর লয়ের, মাত্রাবৃত্ত মধ্য লয়ের, স্বরবৃত্ত দ্রুত লয়ের ছন্দ।"},
          {q:"তিন ছন্দে মুক্তাক্ষর ও বদ্ধাক্ষরের মাত্রা কীভাবে গণনা করা হয়?", a:"স্বরবৃত্তে মুক্তাক্ষর ও বদ্ধাক্ষর সর্বত্র একমাত্রা। মাত্রাবৃত্তে মুক্তাক্ষর একমাত্রা ও বদ্ধাক্ষর দুই মাত্রা। অক্ষরবৃত্তে সাধারণত মুক্তাক্ষর একমাত্রা ও বদ্ধাক্ষর দুই মাত্রা — তবে বদ্ধাক্ষর শব্দের প্রথমে বা মধ্যে থাকলে তা একমাত্রা ধরা হয়।"}
        ]},
        { id:'ch3-s2', title:'তিন ছন্দের পরিচয়: স্বরবৃত্ত, মাত্রাবৃত্ত, অক্ষরবৃত্ত', type:'qa', qa:[
          {q:"স্বরবৃত্ত ছন্দের পরিচয় দাও।", a:"স্বরধ্বনির সংখ্যার উপর পর্বের মাত্রাসংখ্যা নির্ভরশীল যে ছন্দ, তার নাম স্বরবৃত্ত ছন্দ। এই ছন্দে সাধারণত প্রতি পর্বে চারটি অক্ষর থাকে এবং এর লয় দ্রুত। যেমন: 'আবার যদি / ইচ্ছা কর / আবার আসি / ফিরে' (৪+৪+৪+২)।"},
          {q:"স্বরবৃত্ত ছন্দকে ছড়ার ছন্দ বা লৌকিক ছন্দ বলা হয় কেন?", a:"রবীন্দ্রনাথ ঠাকুর একে 'ছড়ার ছন্দ' বলেছেন; ছান্দসিকগণ একে 'লৌকিক ছন্দ'ও বলেন — কারণ বাংলার গ্রামীণ লৌকিক ছড়া, মেয়েলি ব্রতকথা, পল্লীগাথা, বাউলের গান, মন্ত্র প্রভৃতি মুখে মুখে রচিত লোকজ উপাদানে এই ছন্দ ব্যবহৃত হতো।"},
          {q:"মাত্রাবৃত্ত ছন্দের পরিচয় দাও।", a:"যে ছন্দে যুগ্মধ্বনি সর্বদা বিশ্লিষ্ট ভঙ্গিতে উচ্চারিত হয়ে দুই মাত্রার মর্যাদা পায় এবং অযুগ্মধ্বনি একমাত্রা বলে গণনা করা হয়, তাকে মাত্রাবৃত্ত ছন্দ বলে। এই ছন্দে ছয় মাত্রার পর্বই বেশি দেখা যায়, তবে চার, পাঁচ, সাত, আট মাত্রার পর্বও পাওয়া যায়। যেমন: 'সোনার পাখি ছিল / সোনার খাচাটিতে' (৭+৭)।"},
          {q:"মাত্রাবৃত্ত ছন্দের বৈশিষ্ট্য কী কী?", a:"(১) দুই পদের অন্তর যুক্তব্যঞ্জনের পূর্ববর্তী স্বর দীর্ঘ বা দ্বিমাত্রিক, (২) অনুস্বর ও বিসর্গের পূর্ববর্তী স্বর দীর্ঘ, (৩) যৌগিক স্বরান্ত অক্ষর (যেমন: এ, ও) দ্বিমাত্রিক, (৪) অবশিষ্ট সমস্ত স্বরধ্বনি একমাত্রিক।"},
          {q:"অক্ষরবৃত্ত ছন্দের পরিচয় দাও।", a:"যে ছন্দের পর্বে শব্দের আদি ও মধ্যবর্তী যুগ্মধ্বনি সংকুচিত ও একমাত্রা, আর শব্দের অন্তস্থিত যুগ্মধ্বনি সম্প্রসারিত ও দুই মাত্রা ধরা হয়, তাকে অক্ষরবৃত্ত ছন্দ বলে। এই ছন্দে পর্ব সাধারণত আট বা দশ মাত্রার হয়, শব্দধ্বনির অতিরিক্ত একটা সুর বা তান থাকে এবং এই ছন্দ সুরপ্রধান। যেমন: 'মধ্য দিনে যবে গান / বন্ধ করে পাখি' (৮+৬) — রবীন্দ্রনাথ।"},
          {q:"অক্ষরবৃত্ত ছন্দের বৈশিষ্ট্য কী কী?", a:"(১) মূল পর্ব আট বা দশ মাত্রার হয়, (২) শব্দধ্বনির অতিরিক্ত তান বা সুর থাকে, (৩) শব্দান্তের হলন্ত বা যৌগিক স্বরান্ত অক্ষর দ্বিমাত্রিক হয়, (৪) সমাসবদ্ধ শব্দের আদিতে হলন্ত অক্ষর থাকলে তা কখনো কখনো দুই মাত্রা ধরা হয়, (৫) যুক্তব্যঞ্জনের সংশ্লিষ্ট উচ্চারণ হওয়ায় পূর্ববর্তী অক্ষর দীর্ঘ ও দ্বিমাত্রিক হওয়ার সম্ভাবনা থাকে না; এই ছন্দে লয় দীর্ঘ থাকে।"}
        ]},
        { id:'ch3-s3', title:'অমিত্রাক্ষর ছন্দ ও সনেট', type:'qa', qa:[
          {q:"অমিত্রাক্ষর ছন্দের জনক কে?", a:"মাইকেল মধুসূদন দত্ত।"},
          {q:"অমিত্রাক্ষর ছন্দ কীভাবে গঠিত?", a:"এই ছন্দ অক্ষরবৃত্তের পয়ার অবলম্বন করেই তৈরি — প্রতি ছত্রে ১৪ মাত্রা থাকে, প্রথম ৮ মাত্রায় অর্ধযতি ও শেষ ৬ মাত্রায় পূর্ণযতি হয়।"},
          {q:"অমিত্রাক্ষর ছন্দের প্রধান বৈশিষ্ট্য কী?", a:"এই ছন্দে অন্ত্যমিল বা অন্ত্যানুপ্রাস নেই; ছন্দটির প্রধান বৈশিষ্ট্য হলো, কত মাত্রার পর যতি পড়বে তা সুনির্দিষ্ট নয় — ভাবের প্রয়োজন অনুসারে শীঘ্র বা বিলম্বে যতির পতন হয়।"},
          {q:"সনেট কী?", a:"সনেট একটি পাশ্চাত্য ধারার কাব্য প্রকরণ; মধুসূদন দত্ত এর বাংলা নাম দিয়েছেন 'চতুর্দশপদী কবিতা'।"},
          {q:"বাংলা সনেটের জনক কে?", a:"মাইকেল মধুসূদন দত্ত।"},
          {q:"সনেটের আদি ও আধুনিক ধারার প্রবর্তক কারা?", a:"সনেটের আদি ধারা ইতালীয় কবি পেত্রার্ক (Francesco Petrarca, ১৩০৪-১৩৭৪ খ্রি.) কর্তৃক এবং আধুনিক ধারা ইংরেজ কবি শেক্‌সপিয়র (William Shakespeare, ১৫৬৪-১৬১৬ খ্রি.) কর্তৃক প্রতিষ্ঠিত।"},
          {q:"একটি আদর্শ সনেটের গঠন কেমন?", a:"সনেট ১৪ ছত্র বিশিষ্ট একটি কবিতা, যার দুটি অংশ থাকে — প্রথম ৮ ছত্রকে অষ্টক (Octave) এবং পরবর্তী ৬ ছত্রকে ষটক (Sestet) বলে।"},
          {q:"পেত্রার্কীয় সনেটের মিল-বিন্যাস কেমন?", a:"অষ্টকের মিল-বিন্যাস: abba, abba; ষটকের মিল-বিন্যাস: cde, cde (ষটক cdc-dcd রূপেও হতে পারে)।"},
          {q:"শেক্‌সপিয়রীয় সনেটের মিল-বিন্যাস কেমন?", a:"অষ্টকের মিল-বিন্যাস: abab, cdcd; ষটকের মিল-বিন্যাস: efef, gg।"},
          {q:"পেত্রার্কীয় ও শেক্‌সপিয়রীয় সনেটে ভাবের মোড় (turn) কোথায় ঘটে?", a:"পেত্রার্কীয় সনেটে ৮ পঙ্‌ক্তির পর 'volta' (ইতালীয় শব্দ, অর্থ মোড়/আবর্তন) ঘটে; শেক্‌সপিয়রীয় সনেটে ১২ পঙ্‌ক্তির পর এই মোড় ঘটে এবং শেষ দুই পঙ্‌ক্তি (couplet/দ্বিপদী) ভাবের চূড়ান্ত পরিণতি প্রকাশ করে।"}
        ]},
        { id:'ch3-s4', title:'অলঙ্কার: পরিচয় ও শব্দালঙ্কার', type:'qa', qa:[
          {q:"অলঙ্কার কাকে বলে?", a:"কাব্যকে সৌন্দর্যমণ্ডিত ও সহৃদয়-হৃদয়-সংবেদ্য করার জন্য কবি যেসব কৌশল অবলম্বন করেন, তাকে অলঙ্কার বলে।"},
          {q:"'অলঙ্কার' শব্দটি প্রথম কোথায় পাওয়া যায় এবং প্রথম সংজ্ঞা কে দেন?", a:"কৌষীতকী উপনিষদে প্রথম 'অলঙ্কার' শব্দটি পাওয়া যায় ('ব্রহ্মালঙ্কারেণ অলঙ্কৃত')। তবে ষষ্ঠ শতাব্দীতে আচার্য দণ্ডী প্রথম অলঙ্কারের সংজ্ঞা দেন — তাঁর মতে, অভীষ্ট অর্থ সংবলিত পদবিন্যাসই অলঙ্কার।"},
          {q:"অলঙ্কার কত প্রকার ও কী কী?", a:"দুই প্রকার — শব্দালঙ্কার ও অর্থালঙ্কার।"},
          {q:"শব্দালঙ্কার কাকে বলে?", a:"শব্দের ধ্বনিরূপের আশ্রয়ে যে সমস্ত অলঙ্কারের সৃষ্টি হয়, তাকে শব্দালঙ্কার বলে। শব্দালঙ্কার শব্দের ধ্বনির পরিবর্তন সহ্য করে না — সমার্থক শব্দ বসালেও অলঙ্কার ক্ষুণ্ন হয়। যেমন: 'কুলায় কাঁপিছে কাতর কপোত' — এখানে 'কাতর'-এর জায়গায় 'ভীত' লিখলে অর্থ ঠিক থাকলেও অনুপ্রাস অলঙ্কার নষ্ট হয়ে যাবে।"},
          {q:"উল্লেখযোগ্য শব্দালঙ্কারের নাম লেখ।", a:"অনুপ্রাস, যমক, শ্লেষ, বক্রোক্তি, পুনরুক্তবদাভাস, ধ্বন্যুক্তি — এই ছয়টি প্রধান।"},
          {q:"অনুপ্রাস কাকে বলে?", a:"একই ব্যঞ্জনধ্বনির বাক্যের মধ্যে পৌনঃপুনিক ব্যবহারকে অনুপ্রাস বলে — অর্থাৎ একই বর্ণ বা বর্ণগুচ্ছ যুক্ত বা বিযুক্তভাবে একাধিকবার ধ্বনিত হলে অনুপ্রাস অলঙ্কার হয়। যেমন: 'কাক কালো কোকিল কালো কালো কন্যার কেশ' (ক-ধ্বনির অনুপ্রাস)।"},
          {q:"অনুপ্রাস কত প্রকার ও কী কী?", a:"ছয় প্রকার — সরল, অন্ত্য, গুচ্ছ, ছেক, শ্রুতি, মালা অনুপ্রাস।"},
          {q:"সরল অনুপ্রাস ও অন্ত্যানুপ্রাস কাকে বলে?", a:"কবিতার কোনো ছত্রে এক/দুটি বর্ণ একাধিকবার ধ্বনিত হলে তাকে সরল অনুপ্রাস বলে (যেমন: 'পেলব প্রাণের প্রথম পশরা নিয়ে')। কবিতার প্রতি চরণান্তে যে মিল থাকে, তাকে অন্ত্যানুপ্রাস বলে (যেমন: 'গগনে গরজে মেঘ, ঘন বরষা। কূলে একা বসে আছি, নাহি ভরসা।' — বরষা/ভরসার মিল)।"},
          {q:"গুচ্ছানুপ্রাস ও ছেকানুপ্রাস কাকে বলে?", a:"একাধিক ব্যঞ্জনধ্বনি দুয়ের বেশি বার একই ছত্রে ব্যবহৃত হলে গুচ্ছানুপ্রাস বলে (যেমন: 'না মানে শাসন, বসন বাসন অশন আসন যত' — '-সন' ধ্বনির গুচ্ছানুপ্রাস)। একাধিক ব্যঞ্জনধ্বনি ঠিক দুবার ব্যবহৃত হলে ছেকানুপ্রাস বলে (যেমন: 'এখনি অস্তদ্বন্দ্ব করো না পাখা')।"},
          {q:"শ্রুত্যনুপ্রাস ও মালানুপ্রাস কাকে বলে?", a:"ভিন্ন উচ্চারণস্থান থেকে উৎপন্ন কিন্তু শুনতে পারস্পরিক বলে মনে হয় এমন শ্রবণসুখকর ধ্বনির অনুপ্রাসকে শ্রুত্যনুপ্রাস বলে। একই ছত্র বা কবিতায় একাধিক অনুপ্রাসের পরম্পরা তৈরি হলে তাকে মালানুপ্রাস বলে।"},
          {q:"যমক কাকে বলে ও কত প্রকার?", a:"প্রায় একই রকম উচ্চার্য শব্দ নির্দিষ্ট ক্রমে দুই বা তার বেশিবার ভিন্ন ভিন্ন অর্থে ব্যবহৃত হলে তাকে যমক বলে (যেমন: 'গুরু কাছে লব গুরু দুখ' — ১ম গুরু=পুরোহিত, ২য় গুরু=কঠিন/বড়)। যমক তিন প্রকার — আদ্যযমক, মধ্যযমক, অন্ত্যযমক।"},
          {q:"আদ্যযমক ও অন্ত্যযমকের উদাহরণ দাও।", a:"আদ্যযমক (ছত্রের শুরুতে): 'ভারত, ভারত খ্যাত আপনার গুণে' (ভারতচন্দ্র) — ১ম ভারত=কবি ভারতচন্দ্র, ২য় ভারত=ভারতবর্ষ। অন্ত্যযমক (ছত্রের শেষে): 'দুহিতা আনিয়া যদি না দেহ...নিশ্চয় আমি ত্যাজিব দেহ' (ঈশ্বর গুপ্ত) — ১ম দেহ=দেয়া, ২য় দেহ=শরীর।"},
          {q:"শ্লেষ কাকে বলে ও কত প্রকার?", a:"চরণে একটিমাত্র শব্দ একাধিক অর্থ প্রকাশ করলে এবং পাঠক তাকে একাধিক অর্থেই গ্রহণ করলে তাকে শ্লেষ বলে (যেমন: 'মধুহীন করো না মা তব মনঃ কোরকদে' — এখানে 'মধুহীন' মিষ্টিহীন ও মধুসূদনহীন — এই দুই অর্থ প্রকাশ করে)। শ্লেষ দুই প্রকার — অভঙ্গ শ্লেষ ও সভঙ্গ শ্লেষ।"},
          {q:"অভঙ্গ শ্লেষ ও সভঙ্গ শ্লেষের উদাহরণ দাও।", a:"শব্দকে না ভেঙে কাঙ্ক্ষিত অর্থ পাওয়া গেলে অভঙ্গ শ্লেষ (যেমন: 'ঈশ্বর গুপ্ত' — ভগবান ও কবি ঈশ্বর গুপ্ত, উভয় অর্থে)। শব্দকে ভেঙে কাঙ্ক্ষিত অর্থ পাওয়া গেলে সভঙ্গ শ্লেষ (যেমন: 'জগৎ টাকার বশ?' — এখানে 'টা কার' বা 'টাকার' উভয় অর্থে ব্যবহৃত)।"},
          {q:"বক্রোক্তি কাকে বলে?", a:"কবিতায় এক অর্থে ব্যবহৃত কোনো শব্দকে প্রশ্ন বা স্বরবিকৃতির দ্বারা অন্য অর্থে ব্যাখ্যা করা গেলে বক্রোক্তি অলঙ্কার হয় — বক্তা বলতে চান এক, শ্রোতা তা বেঁকিয়ে অর্থ করেন অন্য।"},
          {q:"পুনরুক্তবদাভাস কাকে বলে?", a:"একই চরণে একার্থক একাধিক শব্দ ভিন্নরূপে ব্যবহৃত হলেও বিশ্লেষণে সেই পুনরাবৃত্তির ভিন্ন অর্থ প্রতীয়মান হলে, তাকে পুনরুক্তবদাভাস বলে। যেমন: 'নিশীথ রাতে একা বসে গান গাই' — এখানে নিশীথ ও রাত একার্থ হলেও নিশীথ 'গভীর' অর্থে ব্যবহৃত।"},
          {q:"ধ্বন্যুক্তি কাকে বলে?", a:"কবিতার চরণে ধ্বনিরূপ দিয়ে বিষয়বস্তুকে দৃশ্যমান করা গেলে তাকে ধ্বন্যুক্তি বলে। যেমন: 'বৃষ্টি পড়ে টাপুর টুপুর' — এখানে শব্দের ধ্বনি দিয়েই বৃষ্টি হওয়ার দৃশ্য তৈরি হয়েছে।"}
        ]},
        { id:'ch3-s5', title:'অর্থালঙ্কার: সাদৃশ্যমূল অলঙ্কার', type:'mixed', qa:[
          {q:"অর্থালঙ্কার কাকে বলে?", a:"যে অলঙ্কার একান্তভাবে শব্দের অর্থের উপর নির্ভর করে — অর্থাৎ অর্থপ্রকাশক শব্দকে পরিবর্তন করে সমার্থক অন্য শব্দ বসালেও যে অলঙ্কার অক্ষুণ্ণ থাকে, তাকে অর্থালঙ্কার বলে। যেমন জীবনানন্দের 'বনলতা সেন'-এ প্রকাশিত উপমা — 'পাখির বনলতা সেন' লিখলেও অলঙ্কার অটুট থাকে।"},
          {q:"অর্থালঙ্কারকে প্রধানত কয় শ্রেণিতে ভাগ করা যায়?", a:"পাঁচ শ্রেণিতে — সাদৃশ্যমূল, বিরোধমূল, শৃঙ্খলামূল, ন্যায়মূল, গূঢ়ার্থমূল।"},
          {q:"সাদৃশ্যমূল অলঙ্কার কাকে বলে?", a:"কোনোরকম ঐক্য, সঙ্গতি কিংবা সাদৃশ্য নির্মাণে যেসব অলঙ্কার প্রয়োগ করা হয়, তাকে সাদৃশ্যমূল অলঙ্কার বলে — এর মধ্যে উপমা, রূপক, উৎপ্রেক্ষা, ভ্রান্তিমান, অতিশয়োক্তি, সমাসোক্তি প্রধান।"},
          {q:"উপমা অলঙ্কার কাকে বলে?", a:"স্বভাবধর্মে বিজাতীয় দুটি পদার্থের বিসদৃশ কোনো ধর্মের উল্লেখ না করে যদি বস্তুদুটোর মধ্যে শুধু সাদৃশ্য বা সাম্যজ্ঞাপক গুণগুলো উল্লেখ করা হয়, তবে তাকে উপমা অলঙ্কার বলে।"},
          {q:"উপমা অলঙ্কারের চারটি অঙ্গ কী কী?", a:"উপমান (যার সঙ্গে তুলনা করা হয়), উপমেয় (যাকে তুলনা করা হয়), সাধারণ ধর্ম (যে গুণ দিয়ে তুলনা), সাদৃশ্যবাচক শব্দ (যেমন: মতো, সম, যেন, ন্যায়)। যেমন: 'বেতের ফলের মত তার ম্লান চোখ মনে আসে' — উপমান: বেতের ফল, উপমেয়: চোখ, সাধারণ ধর্ম: ম্লান, সাদৃশ্যবাচক শব্দ: মত।"},
          {q:"উপমা অলঙ্কার প্রধানত কয় প্রকার?", a:"পাঁচ প্রকার — পূর্ণোপমা, লুপ্তোপমা, বস্তুপ্রতিবস্তুভাবের উপমা, বিম্বপ্রতিবিম্বভাবের উপমা, মালোপমা।"},
          {q:"রূপক অলঙ্কার কাকে বলে?", a:"উপমান ও উপমেয়ের তুলনা না করে অভেদ কল্পনা করাকে রূপক বলে। যেমন: 'জীবন-সিন্ধু মথিয়া যে কেহ আনিবে অমৃত বারি' (নজরুল) — এখানে 'জীবন' উপমেয়, 'সিন্ধু' উপমান। রূপকে উপমেয় সাধারণত বিমূর্ত ও উপমান মূর্ত থাকে। রূপক অনেক রকম, প্রধান তিনটি — নিরঙ্গ, সাঙ্গ, পরস্পরিত।"},
          {q:"উৎপ্রেক্ষা অলঙ্কার কাকে বলে ও কত প্রকার?", a:"প্রবল সাদৃশ্যের জন্য উপমেয়কে উপমান বলে ভুল বা সংশয় হলে তাকে উৎপ্রেক্ষা বলে; এতে যেন, বুঝি, মনে হয়, প্রায় ইত্যাদি সম্ভাবনাবাচক শব্দ থাকে। উৎপ্রেক্ষা দুই প্রকার — বাচ্যোৎপ্রেক্ষা (সম্ভাবনাবাচক শব্দ উল্লিখিত) ও প্রতীয়মানোৎপ্রেক্ষা (সম্ভাবনাবাচক শব্দ অনুপস্থিত, তবু অর্থ থেকে ভাবটি স্পষ্ট)।"},
          {q:"ভ্রান্তিমান অলঙ্কার কাকে বলে?", a:"প্রবল সাদৃশ্যবশত এক বস্তুকে অন্য বস্তু বলে ভুল হলে এবং সে ভুল যদি সাধারণ না হয়ে কবি-কল্পনায় চমৎকারিত্ব লাভ করে, তবে তাকে ভ্রান্তিমান অলঙ্কার বলে। যেমন: 'নিদ্রায় আকুল রাধা হন অচেতন। চরণ-পঙ্কজ ভ্রমে ধায় অলিগণ' (মুকুন্দরাম) — রাধার পা পদ্মফুল ভেবে মৌমাছি সেখানে বসছে।"},
          {q:"অতিশয়োক্তি অলঙ্কার কাকে বলে?", a:"উপমার চরম পরিণতিই অতিশয়োক্তি — উপমেয়কে উল্লেখ না করে উপমানকেই উপমেয়রূপে উল্লেখ করলে তাকে অতিশয়োক্তি বলে। যেমন: 'দুই হাতে সোনা মুঠি মুঠি' (বিষ্ণু দে) — এখানে 'সোনা' বলতে সোনার মতো রোদ বোঝানো হয়েছে, রোদ শব্দটি লুপ্ত।"},
          {q:"সমাসোক্তি অলঙ্কার কাকে বলে?", a:"বর্ণনীয় নির্জীব পদার্থে সজীব পদার্থের সমান কাজ ও বিশেষণ আরোপিত হলে তাকে সমাসোক্তি অলঙ্কার বলে। যেমন: 'পর্বত চাহিল হতে বৈশাখের নিরুদ্দেশ মেঘ' (রবীন্দ্রনাথ) — নিশ্চল পর্বতে চলমান মেঘের গতিময়তা আরোপিত হয়েছে।"}
        ]},
        { id:'ch3-s6', title:'অর্থালঙ্কার: বিরোধমূল অলঙ্কার', type:'qa', qa:[
          {q:"বিরোধমূল অলঙ্কার কাকে বলে?", a:"বক্তব্যকে সুন্দর করে প্রকাশ করার জন্য কবি তাঁর উক্তিতে আপাত বিরোধের সৃষ্টি করতে পারেন। এই কল্পিত বিরোধকে কেন্দ্র করে যে অলঙ্কার গড়ে ওঠে, তাকে বিরোধমূল অলঙ্কার বলে।"},
          {q:"বিরোধমূল অলঙ্কারের প্রধান পাঁচটি প্রকার কী কী?", a:"বিরোধাভাস, বিষম, বিভাবনা, বিশেষোক্তি, অসঙ্গতি।"},
          {q:"বিরোধাভাস অলঙ্কার কাকে বলে?", a:"দুটি বস্তুর মধ্যে আপাত বিরোধ দেখা গেলে এবং সেই বিরোধে কাব্যে চমৎকারিত্ব বা উৎকর্ষ সৃষ্টি হলে, তাকে বিরোধাভাস অলঙ্কার বলে। যেমন: 'সীমার মাঝে অসীম তুমি বাজাও আপন সুর' (রবীন্দ্রনাথ) — সীমার মধ্যে অসীমের স্থিতি আপাত বিরোধ মনে হলেও, তা কাব্যে চারুত্ব দান করছে।"},
          {q:"বিষম অলঙ্কার কাকে বলে?", a:"কার্য ও কারণের মধ্যে বৈষম্য দেখা গেলে, বা কারণ থেকে প্রত্যাশিত ফলের বদলে অবাঞ্ছিত ফল দেখা দিলে, তখন তাকে বিষম অলঙ্কার বলে। যেমন: 'যমুনার জলে যদি দিই গিয়া ঝাঁপ, পরাণ জুড়াবে কি, অধিক উঠে তাপ' — জলে প্রাণ জুড়ানোর কথা, অথচ উল্টো তাপ বাড়ছে।"},
          {q:"বিভাবনা অলঙ্কার কাকে বলে?", a:"সাধারণত কারণ ছাড়া কোনো কার্য হয় না (কার্যকারণ সম্বন্ধ); কিন্তু কাব্যে যখন প্রকাশ্য কারণ ছাড়াই কোনো কার্য হতে দেখা যায় (আসলে গূঢ় কারণ থাকে), তখন তাকে বিভাবনা বলে। যেমন: 'মদ না খেয়েও মাতাল তুমি টাকার গরমে' — মাতাল হবার প্রকাশ্য কারণ (মদ) অনুপস্থিত, তবু মাতাল হওয়া ঘটছে।"},
          {q:"বিশেষোক্তি অলঙ্কার কাকে বলে?", a:"বিভাবনার ঠিক বিপরীত — কারণ থাকা সত্ত্বেও যেখানে কাজ বা ফল ঘটে না, তাকে বিশেষোক্তি অলঙ্কার বলে। যেমন: 'আছে চক্ষু, কিন্তু তায় দেখা নাহি যায়। আছে কর্ণ, কিন্তু তা শব্দ নাহি ধায়।' (ঈশ্বর গুপ্ত) — চোখ-কান থাকা সত্ত্বেও তাদের স্বাভাবিক কাজ ঘটছে না।"},
          {q:"অসঙ্গতি অলঙ্কার কাকে বলে?", a:"কার্য ও কারণের ঘটনাস্থান ভিন্ন হলে — এক জায়গায় কারণ ঘটছে আর অন্যত্র তার ফল দেখা যাচ্ছে — তখন তাকে অসঙ্গতি অলঙ্কার বলে। যেমন: 'শ্রাবণের কালো মেঘ ছাইল গগনে, আঁখি জল বরষিল রাধিকা নয়নে' — আকাশ মেঘে ঢাকা পড়ছে, কিন্তু জল ঝরছে রাধার চোখ থেকে।"}
        ]},
        { id:'ch3-s7', title:'অর্থালঙ্কার: শৃঙ্খলামূল ও ন্যায়মূল অলঙ্কার', type:'qa', qa:[
          {q:"শৃঙ্খলামূল অলঙ্কার কাকে বলে?", a:"কবি কবিতা রচনার সময় অনেক সময় বাক্য এমনভাবে সাজান, যাতে এক বাক্যের কাজ অন্য বাক্যের কারণ হয়, আর সেই কারণ আবার অন্য কারণের কারণ হয়ে ওঠে — এভাবে উৎকর্ষবাচক শব্দ সবশেষে বসে ও কবিতাটি একটি পারম্পর্যের অংশ হয়। এরূপ অলঙ্কারকে শৃঙ্খলামূল অলঙ্কার বলে।"},
          {q:"শৃঙ্খলামূল অলঙ্কারের প্রধান তিনটি প্রকার কী কী?", a:"কারণমালা, একাবলি, সার।"},
          {q:"কারণমালা অলঙ্কার কাকে বলে?", a:"কোনো কাব্যের বাক্যে কারণের কাজ যদি পরের বাক্যে কারণরূপে প্রতীয়মান হয়, এবং সেই কারণের কাজ যদি তার পরের বাক্যের কারণ হয়ে ওঠে, তখন তাকে কারণমালা অলঙ্কার বলে। যেমন: 'বিদ্যা হতে জ্ঞান হয়, জ্ঞানে হয় ভক্তি, ভক্তি হতে মুক্তি হয়, এই সার যুক্তি' (কাশীরাম দাস)।"},
          {q:"একাবলি অলঙ্কার কাকে বলে?", a:"যখন একটি বাক্যের বিশেষ্যপদ তার আগের বাক্যে বিশেষণরূপে বসে, তখন তাকে একাবলি অলঙ্কার বলে। যেমন: 'সুনীল আকাশ, স্নিগ্ধ বাতাস, বিমল নদীর জল / গাছে গাছে ফুল, ফুলে ফুলে অলি সুন্দর ধরাতল' (যতীন্দ্রনাথ) — 'গাছে গাছে ফুল' বিশেষণের ভাব নিয়ে বসেছে, পরে 'ফুল' বিশেষ্যপদ হিসেবে বসেছে।"},
          {q:"সার অলঙ্কার কাকে বলে?", a:"আগে বর্ণিত পদার্থগুলোর চেয়ে পরে বর্ণিত পদার্থে যখন উৎকর্ষ বোঝানো হয়, তখন তাকে সার অলঙ্কার বলে (কোনো কোনো অলঙ্কারিক একে 'উদার'ও বলেন)। যেমন: 'আমাদের দেশের অধিকাংশ পুরুষ গৃহপালিত, পত্নীচালিত, মাতৃলালিত' — স্ত্রীর চালনা ও মাতার লালনই এখানে মূল/সার কথা।"},
          {q:"ন্যায়মূল অলঙ্কার কাকে বলে?", a:"কবি যখন কোনো বক্তব্যের মধ্যে ন্যায়বাচক (যুক্তিসংগত) উক্তি করেন এবং সেই উক্তিকে কেন্দ্র করে কাব্যিক সৌন্দর্য সৃষ্টি হয়, তখন তাকে ন্যায়মূল অলঙ্কার বলে।"},
          {q:"ন্যায়মূল অলঙ্কারের দুটি বিশেষ উল্লেখযোগ্য প্রকার কী কী?", a:"অর্থান্তরন্যাস ও কাব্যলিঙ্গ।"},
          {q:"অর্থান্তরন্যাস অলঙ্কার কাকে বলে?", a:"সামান্যের দ্বারা বিশেষ অথবা বিশেষের দ্বারা সামান্য যখন সমর্থিত হয়, এবং কার্যের দ্বারা কারণ অথবা কারণের দ্বারা কার্য যখন সমর্থিত হয়, তখন তাকে অর্থান্তরন্যাস অলঙ্কার বলে। যেমন: 'চির সুখী জন, ভ্রমে কি কখন ব্যথিত বেদন বুঝিতে পারে? কি যাতনা বিষে, বুঝিবে সে কিসে কভু আশীবিষে দংশেনি যারে' (কৃষ্ণচন্দ্র মজুমদার) — সাপে না-কাটা মানুষ বিষের জ্বালা বুঝবে না, এই সাধারণ সত্য দিয়ে সুখী মানুষের দুঃখীর বেদনা না-বোঝার কথাটি সমর্থিত হয়েছে।"},
          {q:"কাব্যলিঙ্গ অলঙ্কার কাকে বলে?", a:"যখন কোনো পদ বা বাক্যের অর্থ ব্যঞ্জনার দ্বারা বর্ণনীয় বিষয়ের কারণ বলে মনে হয়, তখন তাকে কাব্যলিঙ্গ অলঙ্কার বলে। যেমন: 'তুমি আমায় ভালোবাসো তাই তো আমি কবি' (নজরুল) — প্রেমিকার ভালোবাসাই কবি হবার প্রকৃত কারণ না হলেও, পাঠকের কাছে তা কারণ বলে মনে হওয়ার আবহ তৈরি হয়েছে।"}
        ]},
        { id:'ch3-s8', title:'অর্থালঙ্কার: গূঢ়ার্থমূল অলঙ্কার', type:'qa', qa:[
          {q:"গূঢ়ার্থমূল অলঙ্কার কাকে বলে?", a:"কবি তাঁর কাব্যে যখন কোনো বাক্যের আসল বক্তব্য বা গূঢ়ার্থ অন্য বাচ্যার্থের আড়ালে লুকিয়ে রাখেন, তখন তাকে গূঢ়ার্থমূল অলঙ্কার বলে।"},
          {q:"গূঢ়ার্থমূল অলঙ্কারের উল্লেখযোগ্য প্রকারগুলো কী কী?", a:"ব্যাজস্তুতি, স্বভাবোক্তি, অপ্রস্তুত প্রশংসা, সূক্ষ্ম, অর্থাপত্তি, আক্ষেপ।"},
          {q:"ব্যাজস্তুতি অলঙ্কার কাকে বলে?", a:"যে অলঙ্কারে নিন্দার ছলে স্তুতি অথবা স্তুতির ছলে নিন্দা বোঝানো হয়, তাকে ব্যাজস্তুতি অলঙ্কার বলে। যেমন: 'অতি বড় বৃদ্ধ পতি সিদ্ধিতে নিপুণ, কোন গুণ নাই তার কপালে আগুন' (ভারতচন্দ্র) — আপাত নিন্দা মনে হলেও, প্রকৃতপক্ষে এখানে স্বামীর জ্ঞানবৃদ্ধতা ও সিদ্ধিলাভের প্রশংসাই প্রকাশ পাচ্ছে।"},
          {q:"স্বভাবোক্তি অলঙ্কার কাকে বলে?", a:"বস্তু-স্বভাবের সমস্ত গুণ ও ধর্ম সাধারণ মানুষের চোখে সবসময় পড়ে না, অথচ কবির সূক্ষ্ম দৃষ্টিতে তা ধরা পড়ে; কোনো পদার্থের রূপগুণের সূক্ষ্মাতিসূক্ষ্ম, যথাযথ অথচ চমৎকার বর্ণনাকে স্বভাবোক্তি অলঙ্কার বলে। যেমন: 'একখানি ছোট ক্ষেত, আমি একেলা' (রবীন্দ্রনাথ) — গ্রামবাংলার সূক্ষ্ম বর্ণনা কবির গভীর পর্যবেক্ষণের প্রকাশ।"},
          {q:"অপ্রস্তুত প্রশংসা অলঙ্কার কাকে বলে?", a:"অপ্রস্তুত (অ-বর্ণনীয়) বিষয়ের উল্লেখ করে যখন প্রস্তুত (আসল বক্তব্য) বিষয়কে বোঝানো হয়, তখন তাকে অপ্রস্তুত প্রশংসা অলঙ্কার বলে। যেমন: 'কামড় দিয়েছে পায়, তাই বলে কুকুরে কামড়ানো কি রে মানুষের শোভা পায়?' (সত্যেন্দ্রনাথ) — কুকুরের প্রসঙ্গের আড়ালে বলা হচ্ছে, উত্তম ব্যক্তি অধমের আচরণ প্রতিদান দিতে পারেন না।"},
          {q:"সূক্ষ্ম অলঙ্কার কাকে বলে?", a:"কোনো সূক্ষ্ম বা অপরিস্ফুট অর্থ ভাবভঙ্গি, আকার-ইঙ্গিত বা কোনো সংকেতের মাধ্যমে প্রকাশ করা হলে, তাকে সূক্ষ্ম অলঙ্কার বলে। যেমন: 'কখন মিলন হবে শুধানু যখন, হাসি প্রিয়া লীলাপদ্ম কৈল নিমীলন' — পদ্ম রাতে নিমীলিত (মুদিত) হয়, তাই পদ্ম-নিমীলনের সংকেতে মিলনের সময় বোঝানো হয়েছে।"},
          {q:"অর্থাপত্তি অলঙ্কার কাকে বলে?", a:"একটি বিষয়ের উল্লেখে সেই বিষয়টি এবং সঙ্গে সঙ্গে তার জোরে সংশ্লিষ্ট অন্য বিষয়গুলোর অর্থবোধ জন্মালে, তখন তাকে অর্থাপত্তি অলঙ্কার বলে। যেমন: 'হাতি ঘোড়া গেল তল, মশা বলে কত জল' — যা শক্তিশালীরা করতে পারে না, দুর্বলের অহমিকা সেখানে তুচ্ছ।"},
          {q:"আক্ষেপ অলঙ্কার কাকে বলে?", a:"বলতে ইচ্ছুক বিষয়ে সৌন্দর্যারোপ করার জন্য বক্তা যখন সেই বিষয়ের উপর আপাত নিষেধাভাস আরোপ করেন, তখন তাকে আক্ষেপ অলঙ্কার বলে। যেমন 'মেঘনাদবধ কাব্যে' মেঘনাদ বিভীষণকে বলেন: 'নিজগৃহ পথ, তাত, দেখাও তক্করে? চম্পকতালে বসাও আনি রাজার আলয়ে? কিন্তু নাহি গঞ্জি তোমা, গুরুজন তুমি পিতৃ-তুল্য' — 'তিরস্কার করব না' বলেও আসলে যতটা তিরস্কার করার তা করেই ফেলা হয়েছে।"}
        ]},
