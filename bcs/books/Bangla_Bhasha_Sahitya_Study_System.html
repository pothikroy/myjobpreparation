          {q:"চর্যাপদগুলো কারা রচনা করেন?", a:"বৌদ্ধ সহজিয়াগণ।"},
          {q:"সহজিয়া বলতে কী বোঝায়?", a:"সহজিয়াগণ বৌদ্ধ সহজযান পন্থী — তান্ত্রিক বৌদ্ধধর্মের বিভিন্ন পরিবর্তনের ধারায় সহজিয়াদের উৎপত্তি। তাঁরা স্বদেহকেন্দ্রিক সহজপন্থায় সাধনা করতেন বলে তাঁদের সহজিয়া বলা হয়। তাঁদের মতে সমস্ত সত্য দেহের মধ্যেই অবস্থিত, সেই সত্যই 'সহজ'।"},
          {q:"কবিদের নামের সঙ্গে 'পা' যুক্ত থাকে কেন?", a:"তাঁরা পদ (কবিতা) রচনা করতেন বলে তাঁদের সম্মান করে 'পাদ' বলা হতো; 'পাদ' থেকেই সংক্ষেপে 'পা' হয়েছে — আজকের দিনে যেমন 'কবি' বলা হয়।"},
          {q:"চর্যাপদের আবিষ্কারক কে ও কবে আবিষ্কৃত হয়?", a:"মহামহোপাধ্যায় হরপ্রসাদ শাস্ত্রী নেপালের রয়েল লাইব্রেরি থেকে ১৯০৭ সালে চর্যাপদ আবিষ্কার করেন।"},
          {q:"চর্যাপদ কবে, কোথা থেকে প্রকাশিত হয়?", a:"১৯১৬ খ্রিষ্টাব্দে (১৩২৩ বঙ্গাব্দে) কলকাতার বঙ্গীয় সাহিত্য পরিষদ থেকে হরপ্রসাদ শাস্ত্রীর সম্পাদনায় চর্যাপদ আধুনিক লিপিতে প্রকাশিত হয়।"},
          {q:"চর্যাপদের রচনাকাল সম্পর্কে ভিন্ন ভিন্ন মত কী?", a:"মুহম্মদ শহীদুল্লাহ্‌র মতে ৬৫০ খ্রিষ্টাব্দ থেকে; সুনীতিকুমার চট্টোপাধ্যায়ের মতে ৯৫০ থেকে ১২০০ খ্রিষ্টাব্দের মধ্যে পদগুলো রচিত হয়েছিল। সুকুমার সেনসহ বাংলা সাহিত্যের প্রায় সব পণ্ডিতই সুনীতিকুমারের মতের সমর্থক।"},
          {q:"আধুনিক পণ্ডিতদের মতে চর্যাপদের প্রকৃত গ্রন্থনাম কী?", a:"'চর্য্যাচর্য্যবিনিশ্চয়'। তবে 'চর্যাপদ' নামটিই সবার কাছে গ্রহণযোগ্য নাম হিসেবে প্রচলিত।"},
          {q:"চর্যার কবিদের মধ্যে কোন কবি সর্বাপেক্ষা প্রাচীন বলে মনে করা হয়?", a:"মুহম্মদ শহীদুল্লাহ্‌র মতে, শবরপা (৬৮০ থেকে ৭৬০ খ্রিষ্টাব্দ)।"},
          {q:"চর্যাপদের মূল পাণ্ডুলিপির বর্তমান অবস্থা কী?", a:"হরপ্রসাদ শাস্ত্রীর আবিষ্কৃত পাণ্ডুলিপি নেপালের রাজদরবারের গ্রন্থাগারে ছিল, যা পরে জাদুঘরে পরিণত হয়। বইগুলো নেপালের জাতীয় আর্কাইভসে নেওয়া হলেও, চর্যাপদের মূল ও সম্পূর্ণ পাণ্ডুলিপি আর অক্ষত নেই — হয়তো তা হারিয়ে গেছে। ১৯৬৫ সালে নীলরত্ন সেন এই পাণ্ডুলিপি থেকে গ্রন্থ সম্পাদনা করেন।"},
          {q:"চর্যাপদ নিয়ে গবেষকদের প্রথম দিককার গুরুত্বপূর্ণ আলোচনা কাদের?", a:"বিজয়চন্দ্র মজুমদার (১৯২০), সুনীতিকুমার চট্টোপাধ্যায় (১৯২৬), মুহম্মদ শহীদুল্লাহ্‌ (১৯২৭) চর্যার বিভিন্ন দিক নিয়ে আলোচনা করেন। ১৯৩৮ সালে প্রবোধচন্দ্র বাগচী চর্যার তিব্বতি অনুবাদ আবিষ্কার করেন।"}
        ]},
        { id:'ch4-s3', title:'প্রাচীনযুগ: চর্যাপদ — কবি ও পদসংখ্যা', type:'qa', qa:[
          {q:"চর্যায় মোট কতজন কবির পদ পাওয়া গেছে?", a:"এ নিয়ে মতান্তর আছে — মুহম্মদ শহীদুল্লাহ্‌ সম্পাদিত 'বুড্ডিস্ট মিস্টিক সঙ্স' গ্রন্থে ২৩ জন কবির নাম আছে; সুকুমার সেন তাঁর 'বাঙ্গালা সাহিত্যের ইতিহাস' (১ম খণ্ড) গ্রন্থে ২৪ জন কবির কথা বলেছেন। সংক্ষেপে বলা যায়, চর্যাপদের কবির সংখ্যা ২৩, মতান্তরে ২৪।"},
          {q:"চর্যাপদে মোট কয়টি পদ বা গান ছিল বলে ধারণা করা হয়?", a:"এর সংখ্যা নিয়েও মতান্তর আছে — সুকুমার সেনের হিসাবে ৫১টি (টীকা-না-থাকা অংশসহ ধরলে), মুহম্মদ শহীদুল্লাহ্‌ ৫০টি বলেছেন।"},
          {q:"চর্যাপদ গ্রন্থে মোট কয়টি পদ পাওয়া গেছে?", a:"সাড়ে ছেচল্লিশটি (৪৬টি সম্পূর্ণ, একটি পদের ছেঁড়া বা খণ্ডিত অংশসহ)।"},
          {q:"চর্যায় কোন কোন পদ পাওয়া যায়নি?", a:"২৪ নং (কাহ্নপা রচিত), ২৫ নং (তন্ত্রীপা রচিত) এবং ৪৮ নং (কুক্কুরীপা রচিত) পদ পাওয়া যায়নি।"},
          {q:"চর্যায় কোন পদটি খণ্ডিত আকারে পাওয়া গেছে?", a:"২৩ নং পদটি — এর ৬টি পঙ্‌ক্তি পাওয়া গেছে, বাকি ৪ পঙ্‌ক্তি পাওয়া যায়নি। এর রচয়িতা ভুসুকুপা।"},
          {q:"চর্যার পদগুলো কোন ভাষায় রচিত?", a:"সন্ধ্যা বা সান্ধ্য ভাষায় রচিত।"},
          {q:"সন্ধ্যা বা সান্ধ্য ভাষা কী?", a:"যে ভাষা সুনির্দিষ্ট রূপ পায়নি, যে ভাষার অর্থও একাধিক অর্থাৎ আলো-আঁধারের মতো, পণ্ডিতগণ সেই ভাষাকে সন্ধ্যা বা সান্ধ্য ভাষা বলেছেন।"},
          {q:"চর্যাপদ গ্রন্থে অন্তর্ভুক্ত প্রথম পদটি কার রচনা?", a:"লুইপার। এটি প্রথম পদ (পদ-১) হিসেবে গ্রন্থে স্থান পেয়েছে।"},
          {q:"চর্যাপদের সর্বাধিক পদ-রচয়িতা কোন কবি এবং তিনি কয়টি পদ লেখেন?", a:"কাহ্নপা — তিনি ১৩টি পদ রচনা করেন (এর মধ্যে ১২টি পাওয়া গেছে, ২৪ নং পদটি পাওয়া যায়নি)।"},
          {q:"কাহ্নপার পর দ্বিতীয় সর্বাধিক পদ কোন কবি রচনা করেন?", a:"ভুসুকুপা — ৮টি পদ (৬, ২১, ২৩, ২৭, ৩০, ৪১, ৪৩, ৪৯ নং)।"},
          {q:"কাহ্নপা ব্যক্তিগতভাবে কেমন ছিলেন?", a:"কাহ্নপা একজন সহজিয়া তান্ত্রিক বৌদ্ধযোগী ছিলেন। তিনি ধর্মশাস্ত্র ও সঙ্গীতশাস্ত্র — উভয় দিকেই দক্ষ ছিলেন। চর্যাপদে তাঁর অন্য কয়েকটি নাম পাওয়া যায় — কাহ্নিল, কৃষ্ণচর্য, কৃষ্ণবজ্রপাদ।"},
          {q:"কুক্কুরীপা সম্পর্কে কী জানা যায়?", a:"কুক্কুরীপা তিব্বতের কাছাকাছি কোনো অঞ্চলের বাসিন্দা ছিলেন এবং খ্রিস্টীয় অষ্টম শতকে বর্তমান ছিলেন। তিনি ২টি পদ (২ ও ২০ নং) রচনা করেন, এবং না-পাওয়া ৪৮ নং পদটিও সম্ভবত তাঁর রচনা — সে হিসেবে মোট ৩টি। তাঁকে মহিলা কবি বলে মনে করার কোনো সুনিশ্চিত প্রমাণ নেই, তবে ড. সুকুমার সেনের মতে কুক্কুরীপার ভাষার সঙ্গে নারীদের ভাষার মিল আছে।"}
        ]},
        { id:'ch4-s4', title:'প্রাচীনযুগ: চর্যাপদ — সমাজচিত্র ও সাহিত্যমূল্য', type:'qa', qa:[
          {q:"চর্যাপদকে বাঙালি সমাজের বিশ্বস্ত দলিল বলা হয় কেন?", a:"চর্যাপদে কাপালিক, ব্রাহ্মণ, যোগী, ডোমনী প্রভৃতি নানা বর্ণের মানুষের উল্লেখ আছে; তারা মন্ত্রী, পণ্ডিত-আচার্য, শিষ্য প্রভৃতি পদে যুক্ত, এবং মাঝি, বেশ্যা, শিকারি, নেয়ে (নৌবাহী) প্রভৃতি নানা পেশায় কর্মরত। মানুষের আত্মীয়-পরিজনের (মা, বাবা, পুত্র, বধূ, শাশুড়ি) সম্পর্কও এখানে চিত্রিত হয়েছে — তাই চর্যাপদকে তৎকালীন বাঙালি সমাজের বিশ্বস্ত দলিল বলা হয়।"},
          {q:"চর্যাপদে নারীদের স্থান ও ভূমিকা কেমন ছিল?", a:"চর্যাপদের যুগে নারীরা খুবই স্বাধীন ছিল — তারা স্বেচ্ছায় পেশা ও সঙ্গী নির্বাচনের অধিকার রাখত। যেমন, কুক্কুরীপার একটি পদে (২ নং) এক গৃহবধূর ছল জানার এবং রাতে প্রেমিকের সঙ্গে দেখা করতে যাওয়ার কথা আছে; কাহ্নপার একটি পদে (১৪ নং) এক ডোমনীর নগরে তাঁত ও চাঙারি বিক্রির কথা আছে। নারীরা গুরুর স্থানও অধিকার করেছিল।"},
          {q:"চর্যাপদে দারিদ্র্যের চিত্র কীভাবে ফুটে উঠেছে?", a:"চর্যাপদে উল্লিখিত অধিকাংশ মানুষ দরিদ্র — কাপালিক, যোগী, ডোমনী, মাঝি, শিকারি প্রমুখ সম্পন্ন মানুষ ছিলেন না। ঢেণ্ডপার একটি চর্যায় (৩৩ নং) আছে: 'টালত মোর ঘর নাহি পড়বেষী। হাড়ীত ভাত নাহি নিতি আবেশী॥' — অর্থাৎ উঁচু স্থানে ঘর, কোনো প্রতিবেশী নেই, হাঁড়িতে ভাতও নেই, তবু প্রেমিক এসে ভিড় করে। এই চর্যা থেকেই তৎকালীন মানুষের তীব্র দারিদ্র্যের চিত্র বোঝা যায়।"},
          {q:"চর্যাপদের সাহিত্যিক মূল্য কেমন?", a:"চর্যাপদ সাহিত্য সৃষ্টির উদ্দেশ্যে রচিত হয়নি, বরং ধর্মসাধনার নির্দেশিকা হিসেবে রচিত হয়েছিল। তবু ধর্মদর্শন প্রকাশের সময় চিত্রকল্পের আশ্রয় নেওয়া হয়েছে (যেমন: দেহ তরুর মতো, তার পাঁচ ডাল — চর্যা: ১), প্রতীক ও রূপক ব্যবহৃত হয়েছে (ভবনদী, নৌকায় বাহিত পণ্য, হরিণ শিকার ইত্যাদি), ব্যঞ্জনাময় কাব্যভাষা ব্যবহৃত হয়েছে (অপনা মাংসে হরিণ বৈরী — চর্যা: ৬), এবং চমৎকার ছন্দ ব্যবহৃত হয়েছে। এগুলো গাওয়া হতো বলে প্রতিটির ছিল নির্দিষ্ট রাগিনী।"},
          {q:"চর্যাপদ কোন ছন্দে রচিত?", a:"এর পদগুলো ঠিক কোন প্রাচীন ছন্দে রচিত তা সুনির্দিষ্টভাবে বলা কঠিন, তবে ছন্দের বিচারে এগুলো মাত্রাবৃত্ত ছন্দের অধীনে বিবেচিত হয়।"}
        ]},
        { id:'ch4-s5', title:'অন্ধকার যুগ', type:'qa', qa:[
          {q:"অন্ধকার যুগ কোন সময়কে বলে এবং কেন?", a:"বাংলা সাহিত্যের ইতিহাসে ১২০১ থেকে ১৩৫০ খ্রিষ্টাব্দ পর্যন্ত সময়কে অন্ধকার যুগ বলা হয়। এই সময়ে বাংলা ভাষায় রচিত কোনো সাহিত্যিক নিদর্শন পাওয়া যায় না — তুর্কি আক্রমণে বঙ্গীয় সমাজ ও জনজীবন বিপর্যস্ত হওয়ার কারণে মানুষ সাহিত্য রচনায় আত্মনিয়োগ করতে ব্যর্থ হয়।"},
          {q:"এই সময়ে রচিত যে সাহিত্যকর্মের সন্ধান পাওয়া যায়, সেগুলো কী এবং কোন ভাষায় রচিত?", a:"শূন্যপুরাণ ও সেক শুভোদয়া — এই দুটি গ্রন্থের সন্ধান পাওয়া যায় (যদিও এদের রচনাকাল নিয়ে মতপার্থক্য আছে); তবে এগুলো মূলত সংস্কৃত ভাষায় রচিত, বাংলায় নয়।"},
          {q:"অন্ধকার যুগ সৃষ্টির কারণগুলো কী কী?", a:"(১) রাজনৈতিক ও সামাজিক বিশৃঙ্খলা, (২) এই সময়ের মধ্যে বাংলায় রচিত কোনো সাহিত্যিক নিদর্শন না পাওয়া, (৩) মধ্যযুগের সাহিত্যে প্রাচীনযুগের সাহিত্যের প্রভাব বা যোগাযোগ না পাওয়া, (৪) বহির্বাংলার ব্রজবুলি ভাষা ও রাধা-কৃষ্ণকথার ব্যাপক প্রভাব মধ্যযুগের বাংলা সাহিত্যে পরিদৃষ্ট হওয়া।"},
          {q:"'মগের মুলুক' ও 'তুর্কি নাচন' বাগধারা দুটির অর্থ ও উৎস কী?", a:"এই সময় বাংলাদেশে মগ দস্যু ও তুর্কি বহিরাগতদের আগমন ও কৃতকর্মের প্রেক্ষিতে এ দুটি বাগধারার জন্ম হয়। 'মগের মুলুক' অর্থ অরাজক দেশ, আর 'তুর্কি নাচন' অর্থ নাজেহাল অবস্থা।"},
          {q:"মুহম্মদ শহীদুল্লাহ্‌ তাঁর 'বাঙ্গালা ভাষার ইতিবৃত্ত' গ্রন্থে অন্ধকার যুগ সম্পর্কে কী লিখেছেন?", a:"তিনি লিখেছেন, ১২০১ খ্রিষ্টাব্দে বাংলাদেশে তুর্কি আক্রমণ হয়; সমস্ত বাংলা অধিকার করতে প্রায় ১০০ বছর লাগে, এবং শান্তি-শৃঙ্খলা স্থাপিত হতে আরও প্রায় ৫০ বছর কেটে যায় — এই ১২০০ থেকে ১৩৫০ খ্রিষ্টাব্দ পর্যন্ত বাংলা সাহিত্যের ইতিহাসে এক শূন্যস্থান।"},
          {q:"অন্ধকার যুগের অবসানে বাংলার কোন শাসকের ভূমিকা ছিল?", a:"১৩৪২ সালে ইলিয়াস শাহ্‌ বাংলার সিংহাসনে বসলে রাজনৈতিক স্থায়িত্বের সম্ভাবনার সূচনা ঘটে। এই রাজবংশ প্রথম পর্যায়ে ৭১ বছর রাজত্ব করে শান্তি ও শৃঙ্খলা স্থাপনে সচেষ্ট হন।"},
          {q:"চর্যাপদের রচয়িতা সহজিয়াদের বিলুপ্তির সঙ্গে অন্ধকার যুগের সম্পর্ক নিয়ে গ্রন্থকারের বক্তব্য কী?", a:"গ্রন্থকারের মতে, সেন ও পরবর্তী পাঠান আমলে রাজনৈতিক-ধর্মীয়-সাংস্কৃতিক পটভূমি পরিবর্তিত হওয়ায় সহজিয়া সম্প্রদায়ের বিলুপ্তি ঘটে; যেহেতু সহজিয়ারাই এ যুগে বাংলা ভাষার একমাত্র ধারক-বাহক ছিলেন, তাই তাঁদের ধর্মসাধনা ও জ্ঞানসাধনা রুদ্ধ হওয়ার সঙ্গে সঙ্গে বাংলা সাহিত্যচর্চার পথও রুদ্ধ হয়ে যায় — এই রুদ্ধতাই অন্ধকার যুগ সৃষ্টির কারণ।"},
          {q:"'শূন্যপুরাণ' গ্রন্থের রচয়িতা কে এবং এর বিষয়বস্তু কী?", a:"রামাই পণ্ডিত রচিত বলে মনে করা হয় (ভনিতা থেকে অনুমিত, সুনিশ্চিত নয়); এটি একটি বৌদ্ধ ধর্মীয় তত্ত্বের গ্রন্থ, ৫১টি অধ্যায়ে বিভক্ত। প্রথম ৫টি অধ্যায় সৃষ্টিতত্ত্ব সম্বন্ধীয় (মহাযান বৌদ্ধ ধর্মের প্রভাবযুক্ত), বাকি অধ্যায়গুলোতে বিভিন্ন ধর্মপূজার পদ্ধতি বিশ্লেষিত হয়েছে। এই গ্রন্থে 'শূন্যময় দেবতা' ধর্মঠাকুরের পূজা পদ্ধতির বর্ণনা আছে।"},
          {q:"'শূন্যপুরাণ' গ্রন্থটি কে, কবে সম্পাদনা করে প্রকাশ করেন?", a:"'বিশ্বকোষ' প্রণেতা নগেন্দ্রনাথ বসু তিনটি পুথির পাঠ সংগ্রহ করে ১৩১৪ বঙ্গাব্দে 'শূন্যপুরাণ' নামে গ্রন্থটি সম্পাদনা করে প্রকাশ করেন।"},
          {q:"'শূন্যপুরাণ'-এর রচনাকাল নিয়ে পণ্ডিতদের মধ্যে মতভেদ কী?", a:"পণ্ডিত যোগেনচন্দ্র রায় বিদ্যানিধির মতে ত্রয়োদশ থেকে অষ্টাদশ শতাব্দীর মধ্যে রচিত; সুকুমার সেনের মতে ষোড়শ থেকে অষ্টাদশ শতকের মধ্যবর্তী সময়ে রচিত।"},
          {q:"'সেক শুভোদয়া' গ্রন্থের রচয়িতা কে এবং এটি কী ধরনের গ্রন্থ?", a:"হলায়ুধ মিশ্র রচিত এই গ্রন্থ পীর মাহাত্ম্য-ব্যঞ্জক কাব্য।"},
          {q:"চম্পুকাব্য কাকে বলে?", a:"গদ্য ও পদ্য মিশ্রিত কাব্যকে চম্পুকাব্য বলে।"}
        ]},
        { id:'ch4-s6', title:'মধ্যযুগ: শ্রীকৃষ্ণকীর্তন', type:'qa', qa:[
          {q:"শ্রীকৃষ্ণকীর্তন কাব্যের মূল বিষয়বস্তু কী?", a:"এখানে শ্রীকৃষ্ণের প্রেমে রাধা ও গোপীদের গোপাল-প্রায় অবস্থা বর্ণিত হয়েছে। মূলত রাধা-কৃষ্ণকথার আড়ালে ঈশ্বরের প্রতি জীবকুলের আকুলতা প্রকাশিত। বাংলা ভাষায় কোনো লেখকের এটিই প্রথম একক গ্রন্থ।"},
          {q:"শ্রীকৃষ্ণকীর্তন কাব্যগ্রন্থের কবি কে?", a:"বড়ু চণ্ডীদাস — কবির ভনিতায় 'চণ্ডীদাস' এবং অধিকাংশ ক্ষেত্রে 'বড়ু চণ্ডীদাস' পাওয়া যাওয়ায় তাঁকেই এই গ্রন্থের কবি হিসেবে গ্রহণ করা হয়।"},
          {q:"'শ্রীকৃষ্ণকীর্তন' কাব্য কে, কীভাবে আবিষ্কার করেন?", a:"কলকাতা বিশ্ববিদ্যালয়ের বাংলা বিভাগের অধ্যাপক ও পুথিশালার অধ্যক্ষ বসন্তরঞ্জন রায় ১৯০৯ খ্রিষ্টাব্দে (১৩১৬ বঙ্গাব্দে) বাঁকুড়া জেলার বনবিষ্ণুপুরের কাছে কাকিল্যা গ্রামে দেবেন্দ্রনাথ মুখোপাধ্যায় নামক এক ব্রাহ্মণের বাড়ির গোয়ালঘরে অযত্নে রক্ষিত একরাশ পুথির মধ্যে এই গ্রন্থটি খুঁজে পান।"},
          {q:"শ্রীকৃষ্ণকীর্তন কাব্যের পুথিটি কি সম্পূর্ণ অবস্থায় পাওয়া গিয়েছিল?", a:"না — পুথির প্রথম দুটি পৃষ্ঠা এবং শেষ পৃষ্ঠা পাওয়া যায়নি, ফলে গ্রন্থের প্রকৃত নাম ও কবির সম্পূর্ণ পরিচয় স্পষ্টভাবে জানা যায়নি।"},
          {q:"শ্রীকৃষ্ণকীর্তন কাব্য কবে ও কার সম্পাদনায় প্রকাশিত হয়?", a:"১৯১৬ খ্রিষ্টাব্দে (১৩২৩ বঙ্গাব্দে) কলকাতার বঙ্গীয় সাহিত্য পরিষৎ থেকে বসন্তরঞ্জন রায়ের সম্পাদনায় পুথিটি গ্রন্থাকারে প্রকাশিত হয়।"},
          {q:"'শ্রীকৃষ্ণকীর্তন' নামকরণ কে করেন এবং কীভাবে?", a:"পুথির প্রথম দিকের পৃষ্ঠা ছিন্ন থাকায় প্রকৃত নাম পাওয়া যায়নি; সম্পাদক বসন্তরঞ্জন রায় ব্রজসুন্দর সান্ন্যাল রচিত 'চণ্ডীদাস চরিত', ত্রৈলোক্যনাথ আচার্যের 'বিদ্যাপতি' প্রভৃতি গ্রন্থ অবলম্বনে এই নামকরণ করেন। একে 'সন্দর্ভ'ও বলা হয়।"},
          {q:"শ্রীকৃষ্ণকীর্তন কাব্যকে মধ্যযুগের প্রথম গ্রন্থ বলা হয় কেন?", a:"বাংলা সাহিত্যের মধ্যযুগের প্রথম কাব্য হিসেবে শ্রীকৃষ্ণকীর্তন স্বীকৃত, কারণ এটিই মধ্যযুগের প্রথম নিদর্শন হিসেবে প্রাপ্ত হয়েছে এবং এর ভাষাগত বৈশিষ্ট্য প্রাচীনযুগ-পরবর্তী সময়ের প্রমাণ বহন করে।"},
          {q:"কবি বড়ু চণ্ডীদাস কোন দেবীর ভক্ত ছিলেন?", a:"তিনি বাশুলি দেবীর ভক্ত ছিলেন।"},
          {q:"শ্রীকৃষ্ণকীর্তন কাব্যের রচনাকাল/লিপিকাল নিয়ে বিভিন্ন পণ্ডিতের মত কী?", a:"সুকুমার সেন মনে করেন, প্রাপ্ত পুথি প্রাচীন না হলেও ভাষায় প্রাচীনত্বের ছাপ আছে, লিপির মিল দেখে তা চতুর্দশ শতাব্দীর বলে মনে হয়। মুহম্মদ শহীদুল্লাহ্‌র মতে গ্রন্থের লিপিকাল আনুমানিক ১৪০০ খ্রিষ্টাব্দ, বড়ু চণ্ডীদাস এর পূর্বে বিদ্যমান ছিলেন। সুনীতিকুমার চট্টোপাধ্যায়ের মতে এর ভাষা ১৪০০-১৪৫০ খ্রিষ্টাব্দের আগে হতে পারে না। রাখালদাস বন্দ্যোপাধ্যায়ের মতে এই পুথি সম্ভবত চতুর্দশ শতাব্দীর প্রথমার্ধে লিখিত। গোপাল হালদারের মতে পদগুলো ১৪৫০-১৫০০ খ্রিষ্টাব্দের মধ্যে রচিত।"},
          {q:"শ্রীকৃষ্ণকীর্তন কাব্য কয়টি খণ্ডে বিভক্ত এবং সেগুলো কী কী?", a:"মোট ১৩টি খণ্ডে বিভক্ত — জন্মখণ্ড, তাম্বুলখণ্ড, দানখণ্ড, নৌকাখণ্ড, ভারখণ্ড, ছত্রখণ্ড, বৃন্দাবনখণ্ড, কালিয়দমনখণ্ড, যমুনাখণ্ড, হারখণ্ড, বাণখণ্ড, বংশীখণ্ড, বিরহখণ্ড।"},
          {q:"শ্রীকৃষ্ণকীর্তন কাব্যের বিশেষ গুণ কী?", a:"রাধা-কৃষ্ণের প্রণয়কাহিনির মধ্যে বাঙালির লৌকিক জীবনের যে প্রতিবিম্ব ধরা পড়ে, তা এই কাব্যের একটি উল্লেখযোগ্য বৈশিষ্ট্য।"},
          {q:"জন্মখণ্ডে কী বর্ণিত হয়েছে?", a:"কৃষ্ণ ও রাধা উভয়ে ঈশ্বরের ইচ্ছায় মর্তে মানবরূপে জন্ম নেয়। কৃষ্ণ পাপী কংস রাজাকে বধ করার জন্য দেবকী ও বাসুদেবের সন্তান হিসেবে জন্ম নেয়, কিন্তু জন্মমাত্র বাসুদেব গোপনে কৃষ্ণকে বৃন্দাবনে নন্দ গোপের ঘরে রেখে আসেন। রাধা জন্ম নেয় গোয়ালা সাগর গোপের স্ত্রী পদ্মার গর্ভে। দৈব নির্দেশে বালিকা বয়সে নপুংসক (ক্লীব) আয়ান গোপের সঙ্গে রাধার বিয়ে হয়, এবং আয়ান গোচারণে গেলে বৃদ্ধা পিসি বড়ায়ি রাধার তত্ত্বাবধানে থাকেন।"},
          {q:"তাম্বুলখণ্ডে কী বর্ণিত হয়েছে?", a:"'তাম্বুল' অর্থ পান। রাধা বড়ায়ির সঙ্গে ঘর থেকে বের হয়ে অন্য গোপীদের সঙ্গে মথুরায় দই-দুধ বিক্রি করতে যায়। পথে বড়ায়ি রাধাকে হারিয়ে ফেলে এবং কৃষ্ণকে রাধার রূপের বর্ণনা দিয়ে জিজ্ঞেস করে। রূপের বর্ণনা শুনে কৃষ্ণ রাধার প্রতি পূর্বরাগ অনুভব করে এবং বড়ায়ির মাধ্যমে রাধার জন্য পান ও ফুলের উপহারসহ প্রস্তাব পাঠায়, কিন্তু বিবাহিতা রাধা সেই উপহার পদদলিত করে।"},
          {q:"শ্রীকৃষ্ণকীর্তন কাব্যে রাধা-কৃষ্ণের কাহিনি কতটুকু বর্ণিত হয়েছে?", a:"রাধার পূর্বরাগ থেকে শুরু করে প্রেমে মিলন এবং কৃষ্ণ-বিরহকাতর রাধাকে পরিত্যাগ করে কৃষ্ণের মথুরায় গমন পর্যন্ত।"}
        ]},
        { id:'ch4-s7', title:'মধ্যযুগ: শ্রীচৈতন্যদেব ও বৈষ্ণব জীবনীসাহিত্য', type:'qa', qa:[
          {q:"কোন মহাপুরুষ বাংলা সাহিত্যে একটি পঙ্‌ক্তি না লিখেও তাঁর নামে একটি যুগের সৃষ্টি হয়েছে?", a:"শ্রীচৈতন্যদেব।"},
          {q:"চৈতন্যদেবের জন্ম ও মৃত্যুসাল লেখ।", a:"জন্ম ১৪৮৬ খ্রিষ্টাব্দ, নবদ্বীপ; মৃত্যু ১৫৩৩ খ্রিষ্টাব্দ, পুরী।"},
          {q:"শ্রীচৈতন্যের পিতৃদত্ত নাম কী ছিল?", a:"বিশ্বম্ভর মিশ্র; ডাকনাম নিমাই।"},
          {q:"শ্রীচৈতন্য স্মরণীয় কেন?", a:"সামন্তযুগের অনুদার মতাদর্শকে অস্বীকার করেই তিনি প্রচার করলেন জীবে দয়া, ঈশ্বরে ভক্তি এবং সকলের অধিকার। তাঁর কল্যাণেই বাঙালির স্বজাত্যবোধ ও নিজস্ব সংস্কৃতি রক্ষিত হলো।"},
          {q:"বৈষ্ণব সাহিত্য কত প্রকার ও কী কী?", a:"তিন প্রকার — জীবনীকাব্য, বৈষ্ণবশাস্ত্র ও পদাবলি।"},
          {q:"কার জীবনী রচনার মধ্য দিয়ে বাংলায় জীবনীসাহিত্য রচনা আরম্ভ হয়?", a:"শ্রীচৈতন্যদেবের।"},
          {q:"বাংলায় চৈতন্যদেবের প্রথম জীবনীগ্রন্থের নাম কী ও কে রচনা করেন?", a:"বৃন্দাবন দাস রচিত 'চৈতন্য-ভাগবত'।"},
          {q:"চৈতন্য-ভাগবতের পরিচয় দাও।", a:"নিত্যানন্দের উৎসাহে চৈতন্যদেবের মৃত্যুর (১৫৩৩ খ্রি.) পনেরো বছরের মধ্যেই গ্রন্থটি রচিত বলে পণ্ডিতগণ মনে করেন। চৈতন্যদেবের জীবিত অনুচরদের মুখ থেকে তথ্য সংগ্রহ করে এই জীবনী রচিত হয়েছে বলে গ্রন্থটি প্রামাণিক, তবে চৈতন্যদেবকে নিয়ে ভক্তসমাজে প্রচলিত অলৌকিক কাহিনির মিশ্রণও এতে আছে। এটি প্রায় পঁচিশ হাজার পঙ্‌ক্তিবিশিষ্ট এবং পয়ার ছন্দে রচিত।"},
          {q:"বাংলায় চৈতন্যদেবের দ্বিতীয় জীবনীগ্রন্থের নাম কী?", a:"লোচন দাসের 'চৈতন্য-মঙ্গল'।"},
          {q:"বাংলা ভাষায় অদ্বিতীয় ও সর্বাপেক্ষা তথ্যবহুল চৈতন্যজীবনী কোনটি?", a:"কৃষ্ণদাস কবিরাজের 'চৈতন্য-চরিতামৃত' (১৬১৫)।"},
          {q:"বাংলা সাহিত্যে কোন সময়কে চৈতন্য-যুগ বলে?", a:"১৫০০ থেকে ১৭০০ খ্রিষ্টাব্দ পর্যন্ত।"},
          {q:"কড়চা বলতে কী বোঝায়?", a:"কড়চার আধুনিক অর্থ দিনলিপি বা ডায়েরি। তবে মুরারি গুপ্ত ও স্বরূপ দামোদরের রচিত চৈতন্যজীবনী গ্রন্থকে কড়চা বলে অভিহিত করা হয় (তাঁরা চৈতন্যজীবন কাহিনি শ্লোকে রচনা করেছেন বলে)। সুকুমার সেনের মতে, 'কড়চা' শব্দটি সংস্কৃত 'কৃতকৃত্য' থেকে এসেছে এবং এর অর্থ খসড়া রচনা, স্মারকলিপি বা সংক্ষিপ্ত বক্তব্য।"},
          {q:"ষড়গোস্বামী বলতে কাদের বোঝায়?", a:"শ্রীচৈতন্যদেবের প্রত্যক্ষ শিষ্য ও পরম ভক্তদের মধ্যে ছয়জনকে ষড়গোস্বামী বলা হয় — রঘুনাথ ভট্ট গোস্বামী, রঘুনাথ দাস গোস্বামী, গোপাল ভট্ট গোস্বামী, সনাতন গোস্বামী, রূপ গোস্বামী ও জীব গোস্বামী। শ্রীচৈতন্যের নির্দেশে তাঁরা বৃন্দাবনে বসবাস করে চৈতন্যপ্রেমের ভাবধারাকে একটি নির্দিষ্ট পরিকাঠামো ও অনুশাসনসমন্বিত ধর্মমতে রূপ দেন — এ কারণে তাঁদের বৃন্দাবনের ষড়গোস্বামীও বলা হয়।"},
          {q:"'ধুয়া' কাকে বলে?", a:"বৈষ্ণব সাহিত্যে প্রত্যেক অধ্যায়ের সূচনায় নির্দিষ্ট সুর-তাল-লয়ে গেয় যে ধ্রুবপদটি থাকত, তাকে ধুয়া বলে। শব্দটি এসেছে সংস্কৃত 'ধ্রুবক' থেকে — ধ্রুবক > ধ্রুঅ > ধুয়া।"},
          {q:"গৌরচন্দ্রিকা কাকে বলে ও এর শ্রেষ্ঠ পদকর্তা কে?", a:"রাধাকৃষ্ণবিষয়ক পালাগানের ভূমিকা রূপে গৌরাঙ্গের জীবনেও অনুরূপ ঘটনার অনুবর্তন হয়েছিল, তা স্মরণ করে রচিত গৌরলীলার পদকেই বলে গৌরচন্দ্রিকা। এর শ্রেষ্ঠ পদকর্তা গোবিন্দ দাস।"}
        ]},
        { id:'ch4-s8', title:'মধ্যযুগ: বৈষ্ণব পদাবলি — পরিভাষা ও পর্যায়', type:'qa', qa:[
          {q:"বৈষ্ণব পদাবলিকে কী কী পর্যায়ে ভাগ করা হয়?", a:"পূর্বরাগ, অভিসার, মিলন, মান-বিরহ, মাথুর, ভাবসম্মিলন, আক্ষেপানুরাগ, নিবেদন, প্রার্থনা প্রভৃতি পর্যায়ে।"},
          {q:"বাংলায় বৈষ্ণবধর্ম কীভাবে প্রচারিত হয়েছিল?", a:"ভাগবতধর্ম বা প্রাচীন বৈষ্ণবধর্ম মধ্যযুগেই বাংলায় প্রবেশ করেছিল। নবদ্বীপ-শান্তিপুর অঞ্চলে অদ্বৈতাদি পণ্ডিতগণ গোপনে এই ধর্মাচরণ করতেন। পরে চৈতন্যদেব এই ধর্মের নতুন তাৎপর্য দিয়ে তা সারা দেশে প্রচার করেন।"},
          {q:"বৈষ্ণব পদাবলির প্রথম পদকর্তা কাকে বলা যায়?", a:"বাঙালি কবি জয়দেবকে বৈষ্ণব পদাবলির প্রথম পদকর্তা বলা হয়। রাধাকৃষ্ণের প্রেমলীলা অবলম্বনে রচিত তাঁর 'গীতগোবিন্দম্‌' কাব্যটি আদি বৈষ্ণব পদাবলির নিদর্শন — তবে তা বাংলা ভাষায় নয়, সংস্কৃতে রচিত।"},
          {q:"'মৈথিল কোকিল' বলতে কাকে বোঝায় ও কেন?", a:"'মৈথিল কোকিল' বলতে মিথিলার কবি বিদ্যাপতিকে বোঝায়। কোকিল যেমন সুললিত সুমধুর গান গেয়ে সকলকে মুগ্ধ করে, মিথিলার রাজসভার কবি বিদ্যাপতিও মৈথিলী ভাষায় সুন্দর পদাবলি ও গীতিকবিতা রচনা করে সকলকে মুগ্ধ করেছেন বলে তাঁকে মৈথিল কোকিল বলা হয়।"},
          {q:"পূর্বরাগ কাকে বলে ও এর শ্রেষ্ঠ পদকর্তা কে?", a:"রূপ গোস্বামী তাঁর 'উজ্জ্বলনীলমণি' গ্রন্থে পূর্বরাগের সংজ্ঞায় বলেছেন — মিলনের পূর্বে দর্শন, নাম শ্রবণ প্রভৃতির দ্বারা নায়ক-নায়িকার মনে যে অনুরাগ জন্মে, তাকে পূর্বরাগ বলে। এর শ্রেষ্ঠ পদকর্তা চণ্ডীদাস।"},
          {q:"বৈষ্ণব পদাবলিতে অভিসার কাকে বলে?", a:"প্রেমিক বা প্রেমিকা যখন গোপনে কোনো নির্দিষ্ট স্থানে পরস্পরের সঙ্গে মিলিত হবার জন্য যাত্রা করে, তখন তাকে অভিসার বলে। বৈষ্ণব পদাবলিতে কৃষ্ণের নিকট রাধার অভিযাত্রা নিয়েই অধিকাংশ অভিসার পদ রচিত হয়েছে।"},
          {q:"'বিরহ' কাকে বলে?", a:"বৈষ্ণব পদাবলিতে 'বিরহ' প্রেমেরই একটি বিশেষ পর্যায়, যা মিলনের আনন্দধারাকে পূর্ণ করে তোলে। রাধা ও কৃষ্ণের মধ্যে সাময়িক বিচ্ছেদজনিত অবস্থাকে বিরহ বলা হয়, যা বৈষ্ণব পদাবলির ভাষায় 'বিপ্রলম্ভ শৃঙ্গার' নামে পরিচিত।"},
          {q:"প্রেমবৈচিত্ত্য কাকে বলে?", a:"প্রেমাবিষ্ট হৃদয়ের একটি বিশিষ্ট ভাবকে প্রেমবৈচিত্ত্য বলা হয়। প্রেমিকের নিবিড় সান্নিধ্যে থাকা সত্ত্বেও প্রেমিকার মনে হয় এই বুঝি প্রেমিক চলে যাচ্ছেন, কিংবা প্রেমিককে তিনি হারাচ্ছেন — এই সংশয়পূর্ণ অনুভূতিই প্রেমবৈচিত্ত্য।"},
          {q:"'মাথুর' কাকে বলে?", a:"'মাথুর' শব্দটি এসেছে 'মথুরা' শব্দ থেকে। মাথুর পদাবলি চিরবিরহের আর্তিমূলক পদাবলি — কংসাসুর বধের জন্য কৃষ্ণ তাঁর প্রিয় লীলাভূমি বৃন্দাবন ত্যাগ করে মথুরায় চলে যান এবং রাধার সঙ্গে তাঁর আর দেখা হয় না; কৃষ্ণকে হারিয়ে রাধার এই করুণ ক্রন্দন নিয়েই রচিত হয় মাথুর পদাবলি।"},
          {q:"বিরহের সঙ্গে মাথুরের পার্থক্য কী?", a:"বিরহ হলো রাধাকৃষ্ণের মধ্যে সাময়িক বিচ্ছেদ, আর মাথুর চিরবিচ্ছেদ। উভয় পর্যায়েরই পদাবলি রচিত হয়েছে।"},
          {q:"'ভাবসম্মিলন' কাকে বলে?", a:"কৃষ্ণ রাধাকে ত্যাগ করে কংসদমনার্থে চিরতরে মথুরায় চলে যান। রাধা মনে মনে কল্পনা করে নেন যে কৃষ্ণের সঙ্গে ভাবলোকে তাঁর নিত্যমিলন চলছে — একেই বলে ভাবসম্মিলন।"},
          {q:"বৈষ্ণব পদাবলিতে 'ভণিতা' কাকে বলে?", a:"প্রাচীন কাব্যে কবিরা কবিতার শেষে নিজের নাম যোজনা করে আত্মপরিচয় দিতেন। বৈষ্ণব পদাবলিতেও এই রীতি অনুসৃত — কবি পদের শেষে নিজের নামের উল্লেখ করে যে পরিচয় দেন, তাকেই ভণিতা বলা হয়।"},
          {q:"বৈষ্ণব পদাবলিতে নায়িকা কাকে বলে ও নায়িকার কয়টি অবস্থা কী কী?", a:"বৈষ্ণব পদাবলিতে কৃষ্ণের প্রধান প্রেমিকা শ্রীরাধাকে নায়িকা বলা হয়। নায়িকার আটটি অবস্থা — অভিসারিকা, বাসকসজ্জা, উৎকণ্ঠিতা, বিপ্রলব্ধা, খণ্ডিতা, কলহান্তরিতা, প্রোষিতভর্তৃকা ও স্বাধীনভর্তৃকা।"},
          {q:"'সমর্থা' নায়িকা বলতে কী বোঝায়?", a:"যে নায়িকা অন্তরে স্বতঃসিদ্ধ কৃষ্ণরতি ধারণ করেন এবং যাঁর প্রেমে পরকীয়া দোষ নেই, তাঁকে সমর্থা নায়িকা বলে। বৈষ্ণব রসশাস্ত্র অনুসারে চন্দ্রাবলী প্রমুখ সমর্থা নায়িকা, এঁদের মধ্যে শ্রীরাধা সর্বশ্রেষ্ঠ।"},
          {q:"'খণ্ডিতা' কী?", a:"নায়িকা সাজসজ্জা করে সারারাত কুঞ্জবনে নায়কের জন্য প্রতীক্ষারত থাকেন। নায়ক প্রতিনায়িকার সান্নিধ্যে রাত্রিযাপন করে প্রভাতে নায়িকার নিকট এলে নায়িকা অত্যন্ত কুপিতা হন — এই অবস্থাকে খণ্ডিতা বলা হয়।"},
          {q:"'রাগানুগা ভক্তি' কাকে বলে?", a:"গোপীদের ভক্তির অনুসরণে অন্যরা যখন কৃষ্ণকে ভক্তি করেন, তাকে রাগানুগা ভক্তি বলে।"}
        ]},
        { id:'ch4-s9', title:'মধ্যযুগ: মঙ্গলকাব্য — সাধারণ পরিচিতি', type:'qa', qa:[
          {q:"মঙ্গলকাব্য বলতে কী বোঝায়?", a:"যে কাব্য রচনা, পাঠ ও শ্রবণ করলে নিজের, প্রতিবেশীর ও সমাজের মঙ্গল বা কল্যাণ হয় বলে বিশ্বাস করা হতো, তাকে মঙ্গলকাব্য বলে। পঞ্চদশ থেকে অষ্টাদশ শতকের শেষ অবধি এই ধারার কাব্য বাংলায় রচিত হয়।"},
          {q:"মঙ্গলকাব্যের প্রধান শাখা কয়টি ও কী কী?", a:"তিনটি — মনসামঙ্গল, চণ্ডীমঙ্গল, অন্নদামঙ্গল।"},
          {q:"একটি সম্পূর্ণ মঙ্গলকাব্যে সাধারণত কয়টি অংশ থাকে?", a:"পাঁচটি — বন্দনা, আত্মপরিচয়, দেবখণ্ড, মর্ত্যখণ্ড, শ্রুতিফল।"},
          {q:"মঙ্গলকাব্যে কতজন কবির সন্ধান পাওয়া যায়?", a:"৬২ জন।"},
          {q:"মঙ্গলকাব্যের সাধারণ লক্ষণগুলি উল্লেখ কর।", a:"(১) প্রায় সব কবি স্বপ্নে দেবতার নির্দেশ পেয়ে কাব্যরচনা করেছেন। (২) কাব্যের প্রথমেই থাকে গণেশের বন্দনা। (৩) কাব্যের অধিকাংশ ঘটনা সাধারণ নয়, অসাধারণ। (৪) মঙ্গলকাব্যের নায়ক-নায়িকারা সবাই শাপভ্রষ্ট দেবতা, শাপান্তে স্বর্গে ফিরে যান। (৫) মর্ত্যে পূজা প্রচারের সময় দেবতাদের আচরণ মানুষের মতো।"},
          {q:"বিষয়বস্তু অনুসারে মঙ্গলকাব্যকে কয়টি ধারায় বিভক্ত করা যায়?", a:"দুটি — একটি খাঁটি মঙ্গলকাব্যের ধারা, অপরটি পুরাণাশ্রয়ী ধারা। মনসামঙ্গল, চণ্ডীমঙ্গল, ধর্মমঙ্গল ও কালিকামঙ্গল প্রথম ধারায় অন্তর্ভুক্ত; অপ্রধান শ্রেণি হিসেবে শীতলামঙ্গল, ষষ্ঠীমঙ্গল, রায়মঙ্গল, বাসুলীমঙ্গল প্রভৃতি।"},
          {q:"মনসা, চণ্ডী ও ধর্মঠাকুর দেবতাদের উদ্ভবের সঙ্গে কোন জনগোষ্ঠীর সম্পর্ক আছে?", a:"বিশুদ্ধ বাংলার গ্রামীণ পরিবেশে ও সমাজে এই দেবদেবীদের উদ্ভব ও প্রতিষ্ঠা ঘটেছে — অস্ট্রিকদের দেবী হলেন শিবের মানসকন্যা মনসা, অনার্য ব্যাধ জাতির দেবী চণ্ডী হলেন শিবের গৃহিণী, আর সূর্যদেবতা হলেন কূর্মরূপী ধর্মঠাকুর।"},
          {q:"ধর্মমঙ্গল কাব্যের দুজন প্রধান কবি কে এবং তাঁদের মধ্যে শ্রেষ্ঠ কবি কে?", a:"রূপরাম চক্রবর্তী ও ঘনরাম চক্রবর্তী — এই দুই প্রধান কবির মধ্যে শ্রেষ্ঠ কবি ঘনরাম চক্রবর্তী।"},
          {q:"ধর্মমঙ্গলের শ্রেষ্ঠ কবি ঘনরাম চক্রবর্তীর কাব্যের নাম ও উপজীব্য কী?", a:"তাঁর কাব্যের নাম 'শ্রীধর্মমঙ্গল', এবং এর উপজীব্য লাউসেনের কাহিনি।"},
          {q:"ধর্মমঙ্গল কাব্য কয়টি পালায় বিভক্ত?", a:"দুটি পালায় বিভক্ত — রাজা হরিশচন্দ্রের গল্প এবং লাউসেনের গল্প।"},
          {q:"'বাইশা' কাকে বলে?", a:"'বাইশা' বলতে বোঝায় বাইশজন কবি রচিত মনসামঙ্গলের বিভিন্ন অংশের সংকলন। গায়েনরা কাহিনির প্রয়োজনে বিভিন্ন মনসামঙ্গল কাব্য থেকে অংশ নিয়ে পালা বাঁধতেন। তবে সবসময় ঠিক বাইশজন কবির অংশ থাকতেন এমন নয়।"},
          {q:"'বারোমাসী' বা 'বারমাস্যা' কাকে বলে?", a:"'বারোমাসী' বা 'বারমাস্যা' শব্দের অর্থ বারোমাস অর্থাৎ পুরো এক বছরের বিবরণ। প্রাচীন বাংলা সাহিত্যে বারোমাসের সুখ-দুঃখের বিবরণ প্রদানের যে রীতি দেখা যায়, তাকেই বারোমাসী বা বারমাস্যা বলে।"},
          {q:"'চৌতিশা' কী?", a:"বিপন্ন নায়ক-নায়িকা চৌত্রিশটি ব্যঞ্জনবর্ণ ('ক' থেকে 'হ' পর্যন্ত) পদের আদিতে প্রয়োগ করে ইষ্টদেবতার উদ্দেশে যে স্তব রচনা করে, তাকে 'চৌতিশা' বলে।"}
        ]},
        { id:'ch4-s10', title:'মধ্যযুগ: মনসামঙ্গল', type:'qa', qa:[
          {q:"মনসামঙ্গল সম্পর্কে সংক্ষেপে লেখ।", a:"সাপের দেবী মনসার স্তব, স্তুতি, কাহিনি ইত্যাদি নিয়ে রচিত কাব্য মনসামঙ্গল, যাকে 'পদ্মাপুরাণ'ও বলা হয়। রামায়ণ বা রাধাকৃষ্ণ-কাহিনি মূলত সংস্কৃত প্রভাবিত হলেও, মনসামঙ্গলের উদ্ভব বাংলার লৌকিক জীবনভাবনা থেকে। চাঁদ সদাগরের প্রথম দিকে মনসাবিরূপতা, পরে মনসার বশ্যতা স্বীকার করাই মনসামঙ্গল কাব্যসমূহের প্রধান আখ্যান।"},
          {q:"মনসামঙ্গল কাব্য মূলত কী প্রকৃতির এবং এর কবিসংখ্যা কেমন?", a:"মনসামঙ্গল মূলত পাঁচালি-পালা প্রকৃতির। এর কবির সংখ্যা শতাধিক এবং মুদ্রিত-অমুদ্রিত পুথির সংখ্যাও অনেক।"},
          {q:"মনসামঙ্গল কাব্যের আদি কবি কে?", a:"কানা হরি দত্ত (হরিদত্ত)।"},
          {q:"মনসামঙ্গল কাব্যধারার প্রধান আর কোন কবিদের নাম পাওয়া যায়?", a:"বিজয়গুপ্ত, বিপ্রদাস পিপলাই, দ্বিজ বংশীদাস, কেতকা দাস ক্ষেমানন্দ, নারায়ণ দেব প্রমুখ।"},
          {q:"মনসামঙ্গল কাব্যগুলোকে আর কী নামে অভিহিত করা হয়?", a:"পদ্মাপুরাণ।"},
          {q:"মনসাবিজয় সম্পর্কে লেখ।", a:"মনসামঙ্গল কাব্যধারাকেই মনসাবিজয়ও বলা হয়। অনেক পণ্ডিত 'মনসামঙ্গল' নামটি ব্যবহার করতে চান না — সুকুমার সেন মনে করেন, মনসা ব্রতগীতকে মঙ্গল বলা ঠিক নয়, কারণ এই ব্রত গার্হস্থ্য মঙ্গলকর্মের জন্য করা হতো না। মনসাকে নিয়ে ব্রতরচয়িতাদের অন্যতম বিপ্রদাস পিপলাই নিজের রচনাকে মনসামঙ্গল না বলে মনসাবিজয় বলে নির্দেশ করেছেন।"},
          {q:"মনসাবিজয় কার রচনা ও কত সালে রচিত?", a:"বিপ্রদাস পিপলাই রচিত, ১৪৯৫ খ্রিষ্টাব্দে।"},
          {q:"'সুকবি বল্লভ' উপাধি কার এবং তাঁর কাব্যের নাম কী?", a:"কবি নারায়ণ দেবের উপাধি ছিল 'সুকবি বল্লভ'। তাঁর কাব্যের নাম 'পদ্মাপুরাণ'।"},
          {q:"মনসামঙ্গলের কোন কবির কাব্য সর্বপ্রথম মুদ্রণ সৌভাগ্য লাভ করে এবং কেন তিনি সবচেয়ে বেশি পরিচিত?", a:"কবি কেতকাদাস ক্ষেমানন্দ। তাঁর কাব্যের নাম 'কেতকাপুরাণ'। ক্ষেমানন্দের মনসামঙ্গল সর্বপ্রথম (১৮৪৪ খ্রিষ্টাব্দে) মুদ্রণ সৌভাগ্য লাভ করে বলে ঊনবিংশ শতকের বাঙালি শিক্ষিত সমাজে তিনি সবচেয়ে বেশি পরিচিত ছিলেন।"},
          {q:"মনসামঙ্গলের উদ্ভব সম্পর্কে সংক্ষিপ্ত টীকা লেখ।", a:"মনসা দেবীর উদ্ভব সম্পর্কে বলা হয়, কোনো এক সমাজের প্রজনন-শক্তিপূজা, দক্ষিণ ভারতের সর্পদেবী 'মনচা' প্রভৃতির মিশ্র প্রেরণা এতে সক্রিয় ছিল, এর সঙ্গে সিদ্ধ গাছ ও টোটেমের ব্যাপারও ছিল। পরে সর্পদেবী মনসা শিবের কন্যা পরিচয়ে অভিজাত সমাজে স্থান লাভ করে। অভিজাত শ্রেণির উপর প্রান্তিক মানুষের আধিপত্য প্রতিষ্ঠাই মনসামঙ্গলের মূল কথা।"},
          {q:"মনসামঙ্গল কাব্যের প্রধান চরিত্র ও মূল কাহিনি কী?", a:"চাঁদ সওদাগর, বেহুলা, লখিন্দর প্রধান চরিত্র। পূজা দিতে অস্বীকার করায় বণিক চাঁদ সওদাগরকে মনসা দেবী ধনহারা করেন এবং তাঁর পুত্র লখিন্দরকে সর্পদংশনে হত্যা করে পুত্রহারাও করেন। বেহুলা লখিন্দরের নবপরিণীতা স্ত্রী। পরে পুত্রের পুনর্জীবন ও ধনলাভের বিনিময়ে চাঁদ সওদাগর মনসার পূজা করতে রাজি হন।"}
        ]},
        { id:'ch4-s11', title:'মধ্যযুগ: চণ্ডীমঙ্গল, ধর্মমঙ্গল ও অন্নদামঙ্গল', type:'qa', qa:[
          {q:"চণ্ডীমঙ্গল কাব্যের আদি কবি কে এবং তিনি কোন শতকের?", a:"কবি মানিক দত্ত; চতুর্দশ শতকের কবি।"},
          {q:"চণ্ডীমঙ্গল ধারার শ্রেষ্ঠ কবির নাম কী এবং তিনি কোন শতকের?", a:"মুকুন্দরাম চক্রবর্তী; ষোড়শ শতকের কবি।"},
          {q:"'চণ্ডীমঙ্গল' কী নিয়ে রচিত?", a:"চণ্ডী নামক লৌকিক-পৌরাণিক দেবীর মাহাত্ম্য নিয়ে রচিত কাব্য।"},
          {q:"চণ্ডীমঙ্গলের কয়েকজন খ্যাতনামা কবির নাম লেখ।", a:"মানিক দত্ত, মুকুন্দরাম চক্রবর্তী, দ্বিজমাধব (কাব্যের নাম সারদাচরিত) প্রমুখ।"},
          {q:"চণ্ডীমঙ্গলের দুটি উপাখ্যান কী কী?", a:"একটি ব্যাধ-উপাখ্যান — মূলত কালকেতু ও ফুল্লরার কাহিনি, যেখানে কালকেতু রাজার সঙ্গে যুদ্ধে পরাজিত হয়েও শেষ পর্যন্ত চণ্ডীর কৃপায় হৃতরাজ্য পুনঃপ্রাপ্তি করেন। দ্বিতীয় উপাখ্যানের নায়ক ধনপতি সদাগর, অন্যান্য প্রধান চরিত্র তাঁর দুই স্ত্রী লহনা ও খুল্লনা।"},
          {q:"চণ্ডীমঙ্গল কাব্যধারায় কোন কবিকে 'স্বভাবকবি' বলা হয়?", a:"কবি দ্বিজমাধবকে 'স্বভাবকবি' বলা হয়।"},
          {q:"'অভয়ামঙ্গল' নামটি কীসের সঙ্গে সম্পর্কিত?", a:"কবিকঙ্কণ মুকুন্দরাম চক্রবর্তীর 'চণ্ডীমঙ্গল' কাব্যের অপর নাম 'অভয়ামঙ্গল'।"},
          {q:"অন্নদামঙ্গল কাব্যধারার প্রধান কবি কে?", a:"ভারতচন্দ্র রায় (রায়গুণাকর)।"},
          {q:"অন্নদামঙ্গল কাব্য কত খণ্ডে বিভক্ত ও কী কী?", a:"তিন খণ্ডে — অন্নদামঙ্গল (শিবনারায়ণ) খণ্ড, কালিকামঙ্গল খণ্ড এবং মানসিংহ-ভবানন্দ (বিদ্যাসুন্দর) খণ্ড।"},
          {q:"কালিকামঙ্গল কী?", a:"দেবী কালীর মাহাত্ম্য বর্ণনামূলক গ্রন্থ।"},
          {q:"কালিকামঙ্গল নামে অভিহিত কাব্যধারাকে আর কী নামে অভিহিত করা হয়?", a:"বিদ্যাসুন্দরের কাহিনি নামে।"},
          {q:"কালিকামঙ্গলের আদি কবি কে?", a:"কবি কঙ্ক।"},
          {q:"বিদ্যাসুন্দর বিষয়ে রায়গুণাকর ভারতচন্দ্র ছাড়া আর কোন কবিদের নাম পাওয়া যায়?", a:"শ্রীধর সেন ও সাবিরিদ খান।"},
          {q:"বিদ্যাসুন্দর কাহিনির মূল বিষয়বস্তু কী?", a:"রূপগুণসম্পন্ন রাজকুমার সুন্দর দেবী কালিকার আরাধনা করে তাঁর সন্তুষ্টির মাধ্যমে বিদুষী রাজকন্যা বিদ্যার পাণিলাভের বর পান। রাজঅন্তঃপুরের বৃদ্ধা মালিনীর সাহায্যে এবং নিজের ধৈর্য, সাহসিকতা ও কৃতকর্মের ফলে অবশেষে সুন্দর বিদ্যার সান্নিধ্য ও সঙ্গ লাভ করেন।"},
          {q:"অন্নদামঙ্গল কাব্যের উল্লেখযোগ্য চরিত্র কী কী?", a:"মানসিংহ, ভবানন্দ, বিদ্যা, সুন্দর, মালিনী প্রমুখ।"}
        ]},
        { id:'ch4-s12', title:'মধ্যযুগ: নাথসাহিত্য', type:'qa', qa:[
          {q:"নাথসাহিত্য কী?", a:"বাংলা সাহিত্যের মধ্যযুগে শিব উপাসক নাথ-যোগী ও সিদ্ধাচার্যদের রচিত সাহিত্যই নাথসাহিত্য হিসেবে পরিচিত।"},
          {q:"নাথসাহিত্য প্রধান কয় ভাগে বিভক্ত ও কী কী?", a:"প্রধান দুই ভাগে বিভক্ত — ১) গোরক্ষনাথের কাহিনি, ২) রাজা গোপীচন্দ্রের সন্ন্যাস। এই দুই কাহিনি অবলম্বন করেই নাথ যোগীদের অলৌকিক গল্প পল্লবিত হয়েছে।"},
          {q:"গোরক্ষবিজয়ের পুথি কখন ও কোথায় পাওয়া যায়?", a:"অষ্টাদশ শতকে, বাংলায় সহদেব চক্রবর্তী ও রামাই পণ্ডিতের ধর্মপুরাণ বা অনিলপুরাণে।"},
          {q:"গোপীচন্দ্র কাহিনির প্রথম উল্লেখ কোথায় পাওয়া যায়?", a:"মালিক মুহম্মদ জায়সীর 'পদুমাবত' কাব্যে। এ বিষয়ে প্রথম বাংলা গ্রন্থ নেপালে রচিত সপ্তদশ শতাব্দীর নাটক 'গোপীচন্দ্র নাটক'।"},
          {q:"'গোপীচন্দ্রের সন্ন্যাস' কার রচনা?", a:"সুকুর মামুদের।"}
        ]},

/* ================= UTIL ================= */
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}
function allFacts(){
  let facts = [];
  BOOK.chapters.forEach(ch=>ch.sections.forEach(sec=>{
    if(sec.keyFacts) facts = facts.concat(sec.keyFacts.map(f=>({text:f, section:sec.title})));
  }));
  return facts;
}
function totalSections(){ let n=0; BOOK.chapters.forEach(ch=>n+=ch.sections.length); return n; }
function readSectionsCount(){ return Object.keys(STATE.readProgress).filter(k=>STATE.readProgress[k]).length; }

/* SRS: simplified SM-2-like */
const RATING_INTERVALS = { again: 10/1440, hard: 1, good: 3, easy: 7 }; // days ('again' ~10 min)
function getCardSrs(id){
  return STATE.srs[id] || {due: Date.now(), interval:0, reps:0, ease:2.5, lastRating:null};
}
function rateCard(id, rating){
  const s = getCardSrs(id);
  s.reps += 1; s.lastRating = rating;
  let baseDays = RATING_INTERVALS[rating];
  if(rating==='again'){ s.ease = Math.max(1.3, s.ease-0.2); s.interval = baseDays; }
  else if(rating==='hard'){ s.ease = Math.max(1.3, s.ease-0.1); s.interval = Math.max(baseDays, s.interval*1.2 || baseDays); }
  else if(rating==='good'){ s.interval = s.reps<=1? baseDays : Math.round(s.interval * s.ease) || baseDays; }
  else if(rating==='easy'){ s.ease += 0.1; s.interval = Math.round((s.interval||baseDays) * s.ease * 1.3) || baseDays*2; }
  s.due = Date.now() + s.interval*86400000;
  STATE.srs[id] = s;
  saveState();
}
function dueCards(){
  const now = Date.now();
  return FLASHCARDS.filter(c=>{
    const s = STATE.srs[c.id];
    if(!s) return true; // never studied = due
    return s.due <= now;
  });
}
function memoryStrength(){
  if(FLASHCARDS.length===0) return 0;
  let sum=0;
  FLASHCARDS.forEach(c=>{
    const s = STATE.srs[c.id];
    if(!s) return;
    sum += Math.min(1, (s.ease-1.3)/(2.8) + s.reps*0.08);
  });
  return Math.round(100*sum/FLASHCARDS.length);
}
function mcqAccuracy(){
  let att=0, cor=0;
  Object.values(STATE.mcqStats).forEach(s=>{att+=s.attempts; cor+=s.correct;});
  return att===0? 0 : Math.round(100*cor/att);
}
function questionsToday(){ const t=STATE.studyLog[todayStr()]; return t? (t.mcqs||0) : 0; }
function cardsToday(){ const t=STATE.studyLog[todayStr()]; return t? (t.cards||0) : 0; }
function weakSections(){
  const bySection = {};
  MCQS.forEach(m=>{
    const s = STATE.mcqStats[m.id];
    if(!s || s.attempts===0) return;
    if(!bySection[m.section]) bySection[m.section] = {correct:0, attempts:0};
    bySection[m.section].correct += s.correct;
    bySection[m.section].attempts += s.attempts;
  });
  return Object.entries(bySection).map(([sec,v])=>({
    section:sec, acc: Math.round(100*v.correct/v.attempts), attempts:v.attempts
  })).sort((a,b)=>a.acc-b.acc);
}

        }
      }}, sec.title));
    });
  });
  flex.appendChild(toc);

  const content = el('div',{class:'reader-content card', id:'readerContent'});
  let sec, chap;
  BOOK.chapters.forEach(ch=>ch.sections.forEach(s=>{ if(s.id===currentSectionId){sec=s;chap=ch;} }));
  content.appendChild(el('h2',{}, chap.title + ' › ' + sec.title));

  if(sec.type==='reading'){
    const fb = el('div',{class:'fact-box'},[el('strong',{},'⭐ মূল তথ্যসমূহ (Quick Facts)')]);
    const ul = el('ul',{style:'margin:8px 0 0;padding-right:18px'});

    fb.appendChild(ul);
    content.appendChild(fb);
    if(sec.note) content.appendChild(el('div',{class:'source-note'}, '📖 উৎস: ' + sec.note));
  } else if(sec.type==='qa'){
    sec.qa.forEach(item=>{
      content.appendChild(el('div',{class:'qa-block'},[
        el('div',{class:'q'}, '❓ ' + item.q),
        el('div',{class:'a'}, '✅ ' + item.a)
      ]));
    });

    if(sec.note) content.appendChild(el('div',{class:'source-note', style:'margin-bottom:10px'}, '📖 ' + sec.note));
    if(sec.qa && sec.qa.length){
      sec.qa.forEach(item=>{
        content.appendChild(el('div',{class:'qa-block'},[
          el('div',{class:'q'}, '❓ ' + item.q),
          el('div',{class:'a'}, '✅ ' + item.a)
        ]));
      });

    if(sec.examples && sec.examples.length){
      const fb = el('div',{class:'fact-box'},[el('strong',{},'⭐ শব্দ ও সন্ধি-বিচ্ছেদ')]);
      const tbl = el('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px'});
      sec.examples.forEach(([word,split])=>{
        tbl.appendChild(el('div',{style:'font-weight:600'}, word));
        tbl.appendChild(el('div',{class:'muted'}, '= ' + split));
      });
      fb.appendChild(tbl);
      content.appendChild(fb);

    if(sec.memoryAids && sec.memoryAids.length){
      content.appendChild(el('div',{class:'section-title', style:'margin-top:18px'}, '🧠 মেমরি টেকনিক (BOOK FACT নয় — কেবল মুখস্থ রাখার কৌশল)'));

    }}, done? '✅ শেখা হয়ে গেছে' : '✓ পড়া সম্পন্ন চিহ্নিত করুন')
  ]));
  flex.appendChild(content);
  wrap.appendChild(flex);
  return wrap;
}

/* ---- Quick Quiz ---- */
function viewQuiz(){
  const wrap = el('div',{});
  wrap.appendChild(el('div',{class:'topbar'},[el('h1',{},'⚡ কুইক কুইজ')]));
  if(!quizState){
    wrap.appendChild(el('div',{class:'card'},[
      el('div',{class:'muted', style:'margin-bottom:10px'},'কতগুলো প্রশ্ন নিয়ে কুইজ দিতে চান?'),
      el('div',{class:'chip-row'},[5,10,MCQS.length].map(n=>
        el('button',{class:'chip', onclick:()=>startQuickQuiz(n)}, n+'টি প্রশ্ন')
      ))
    ]));
    return wrap;
  }
  if(quizState.idx >= quizState.queue.length){
    return renderQuizResult();
  }
  wrap.appendChild(renderQuizRunner(true));
  return wrap;
}
function startQuickQuiz(n){
  const pool = MCQS.slice().sort(()=>Math.random()-0.5).slice(0, Math.min(n, MCQS.length));
  quizState = {queue: pool, idx:0, selected:null, correctCount:0, answers:[], mode:'quiz', startTime:Date.now()};
  setView('quiz');
}
function renderQuizRunner(isQuizMode){
  const wrap = el('div',{});
  if(quizState.idx >= quizState.queue.length){
    return renderQuizResult();
  }
  const q = quizState.queue[quizState.idx];
  wrap.appendChild(el('div',{class:'muted', style:'margin-bottom:10px'}, `প্রশ্ন ${quizState.idx+1} / ${quizState.queue.length} · ${q.section} · `+
    (q.difficulty==='easy'?'🟢 সহজ':q.difficulty==='medium'?'🟡 মধ্যম':'🔴 কঠিন')));
  const card = el('div',{class:'card'});
  card.appendChild(el('div',{style:'font-size:16px;font-weight:600;margin-bottom:14px'}, q.q));
  const optsWrap = el('div',{});
  q.options.forEach((opt,i)=>{
    const btn = el('button',{class:'mcq-opt', onclick:()=>{
      if(quizState.selected!=null) return;
      quizState.selected = i;
      const correct = i===q.answer;
      if(!STATE.mcqStats[q.id]) STATE.mcqStats[q.id] = {attempts:0, correct:0, wrong:0};
      STATE.mcqStats[q.id].attempts++;
      if(correct){ STATE.mcqStats[q.id].correct++; quizState.correctCount++; STATE.xp+=2; }
      else {
        STATE.mcqStats[q.id].wrong++;
        if(!STATE.mistakes[q.id]) STATE.mistakes[q.id] = {count:0, lastDate:null};
        STATE.mistakes[q.id].count++; STATE.mistakes[q.id].lastDate = todayStr();
      }
      quizState.answers.push({id:q.id, correct});
      markActivity('mcqs',1); saveState();
      render();
    }}, `${String.fromCharCode(2453+i)}. ${opt}`); // placeholder, replaced below
    btn.textContent = `${['ক','খ','গ','ঘ'][i]}. ${opt}`;
    if(quizState.selected!=null){
      if(i===q.answer) btn.classList.add('correct');
      else if(i===quizState.selected) btn.classList.add('wrong');
    }
    optsWrap.appendChild(btn);
  });
  card.appendChild(optsWrap);
  if(quizState.selected!=null){
    const correct = quizState.selected===q.answer;
    card.appendChild(el('div',{class:'explain-box'},[
      el('div',{style:`font-weight:700;color:${correct?'var(--good)':'var(--danger)'};margin-bottom:6px`}, correct? '✅ সঠিক!' : '❌ ভুল হয়েছে'),
      el('div',{}, q.explain)
    ]));
    card.appendChild(el('div',{class:'btn-row', style:'margin-top:14px'},[
      el('button',{class:'btn', onclick:()=>{ quizState.idx++; quizState.selected=null; render(); }}, quizState.idx+1<quizState.queue.length? 'পরবর্তী প্রশ্ন →' : 'ফলাফল দেখুন →')
    ]));
  }
  wrap.appendChild(card);
  return wrap;
}
function renderQuizResult(){
  const wrap = el('div',{});
  const total = quizState.queue.length;
  const correct = quizState.correctCount;
  const acc = total? Math.round(100*correct/total):0;
  wrap.appendChild(el('div',{class:'card center'},[
    el('h2',{},'📊 ফলাফল'),
    el('div',{style:'font-size:38px;font-weight:800;color:var(--accent);margin:10px 0'}, `${correct}/${total}`),
    el('div',{class:'muted'}, `নির্ভুলতা: ${acc}%`),
    el('div',{class:'btn-row center', style:'justify-content:center;margin-top:16px'},[
      el('button',{class:'btn', onclick:()=>{quizState=null; setView('dashboard');}}, 'ড্যাশবোর্ড'),
      el('button',{class:'btn secondary', onclick:()=>{quizState=null; render();}}, 'আবার চেষ্টা করুন')
    ])
  ]));
  STATE.sessionHistory.push({date:todayStr(), cards:0, mcqs:total, accuracy:acc});
  saveState();
  return wrap;
}

  const wk = weakSections();
  if(wk.length===0){
    wrap.appendChild(el('div',{class:'card muted'},'এখনো পর্যাপ্ত MCQ ডেটা নেই — অনুশীলন শুরু করুন।'));
  } else {
    wk.forEach(w=>{
      const color = w.acc<60?'red':w.acc<80?'yellow':'green';
      const item = el('div',{class:'list-item flex-between'},[
        el('div',{},[el('div',{style:'font-weight:600'}, w.section), el('div',{class:'muted'}, `${w.attempts}টি প্রশ্ন চেষ্টা করা হয়েছে`)]),
        el('span',{class:'tag '+color}, w.acc+'%')
      ]);
      wrap.appendChild(item);
    });
  }
  wrap.appendChild(el('div',{class:'section-title'},'📆 সাম্প্রতিক স্টাডি লগ'));
  const days = Object.keys(STATE.studyLog).sort().reverse().slice(0,7);
  if(days.length===0) wrap.appendChild(el('div',{class:'card muted'},'এখনো কোনো স্টাডি সেশন রেকর্ড হয়নি।'));
  days.forEach(d=>{
    const v = STATE.studyLog[d];
    wrap.appendChild(el('div',{class:'list-item flex-between'},[
      el('div',{}, d),
      el('div',{class:'muted'}, `🃏 ${v.cards||0}  ❓ ${v.mcqs||0}`)
    ]));
  });
  return wrap;
}

/* ---- Search ---- */
function viewSearch(){
  const wrap = el('div',{});
  wrap.appendChild(el('div',{class:'topbar'},[el('h1',{},'🔍 অনুসন্ধান')]));
  const input = el('input',{type:'text', placeholder:'বইয়ের মধ্যে খুঁজুন (যেমন: ব্রাহ্মী, ব্রজবুলি)...'});
  wrap.appendChild(el('div',{class:'card'},input));
  const results = el('div',{style:'margin-top:14px'});
  wrap.appendChild(results);
  input.addEventListener('input', ()=>{
    const term = input.value.trim();
    results.innerHTML='';
    if(!term){ return; }
    const hits = [];
    BOOK.chapters.forEach(ch=>ch.sections.forEach(sec=>{
      if(sec.keyFacts) sec.keyFacts.forEach(f=>{ if(f.includes(term)) hits.push({type:'তথ্য', text:f, sec}); });
      if(sec.qa) sec.qa.forEach(item=>{
        if(item.q.includes(term) || item.a.includes(term)) hits.push({type:'প্রশ্ন-উত্তর', text:item.q+' — '+item.a, sec});
      });
    }));
    if(hits.length===0){ results.appendChild(el('div',{class:'muted'},'কোনো ফলাফল পাওয়া যায়নি।')); return; }
    hits.forEach(h=>{
      results.appendChild(el('div',{class:'list-item'},[
        el('div',{class:'tag blue', style:'margin-bottom:6px'}, h.type + ' · ' + h.sec.title),
        el('div',{}, h.text)
      ]));
    });
  });
  return wrap;
}

/* ---- Settings ---- */
function viewSettings(){
  const wrap = el('div',{});
  wrap.appendChild(el('div',{class:'topbar'},[el('h1',{},'⚙️ সেটিংস')]));

  const themeCard = el('div',{class:'card'});
  themeCard.appendChild(el('div',{style:'font-weight:600;margin-bottom:10px'},'থিম'));
  themeCard.appendChild(el('div',{class:'chip-row'}, ['light','dark','system'].map(t=>
    el('button',{class:'chip'+(STATE.settings.theme===t?' active':''), onclick:()=>{STATE.settings.theme=t; saveState(); render();}},
      t==='light'?'☀️ লাইট':t==='dark'?'🌙 ডার্ক':'🖥️ সিস্টেম')
  )));
  wrap.appendChild(themeCard);

  const dataCard = el('div',{class:'card', style:'margin-top:14px'});
  dataCard.appendChild(el('div',{style:'font-weight:600;margin-bottom:10px'},'ডেটা ব্যাকআপ'));
  dataCard.appendChild(el('div',{class:'btn-row'},[
    el('button',{class:'btn secondary', onclick:exportData}, '⬇️ এক্সপোর্ট করুন (JSON)'),
    el('label',{class:'btn secondary', style:'cursor:pointer'},[
      '⬆️ ইমপোর্ট করুন',
      (()=>{ const inp = el('input',{type:'file', accept:'.json', style:'display:none', onchange:importData}); return inp; })()
    ]),
    el('button',{class:'btn danger', onclick:resetProgress}, '🗑️ অগ্রগতি রিসেট করুন')
  ]));
  wrap.appendChild(dataCard);

  const goalCard = el('div',{class:'card', style:'margin-top:14px'});
  goalCard.appendChild(el('div',{style:'font-weight:600;margin-bottom:10px'},'দৈনিক লক্ষ্য'));
  const goalInput = el('input',{type:'number', value:STATE.settings.dailyGoalCards, oninput:(e)=>{STATE.settings.dailyGoalCards=+e.target.value; saveState();}});
  goalCard.appendChild(el('div',{class:'muted', style:'margin-bottom:6px'},'দৈনিক ফ্ল্যাশকার্ড লক্ষ্য'));
  goalCard.appendChild(goalInput);
  wrap.appendChild(goalCard);

  return wrap;
}
function exportData(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'bcs-bangla-study-backup.json'; a.click();
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      STATE = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), data);
      saveState(); render();
      alert('ডেটা সফলভাবে ইমপোর্ট করা হয়েছে!');
    }catch(err){ alert('ফাইলটি সঠিক নয়।'); }
  };
  reader.readAsText(file);
}
function resetProgress(){
  if(confirm('আপনি কি নিশ্চিত? সব অগ্রগতি মুছে যাবে এবং এটি পূর্বাবস্থায় ফেরানো যাবে না।')){
    STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
    saveState(); render();
  }
}
function applyTheme(){
  let t = STATE.settings.theme;
  if(t==='system'){ t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'; }
  document.documentElement.setAttribute('data-theme', t);
}

/* ================= INIT ================= */
render();
</script>
</body>
</html>
