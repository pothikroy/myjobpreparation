<meta charset="UTF-8">

<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --ink:#12203A;         /* deep ledger navy - background */
  --ink-2:#1A2C4C;       /* raised panels on navy */
  --ink-3:#24375E;       /* hover / border on navy */
  --parchment:#F6EFE2;   /* card surface, light mode bg */
  --parchment-2:#EFE5D2; /* subtle panel on parchment */
  --parchment-line:#DCCFB2;
  --gold:#C9A24B;        /* brass accent - primary */
  --gold-deep:#9C7A2E;
  --burgundy:#7A2E2E;    /* exam-trap / important accent */
  --burgundy-2:#9C4141;
  --ink-text:#1B1F27;
  --paper-text:#3B3120;
  --muted:#6B6455;
  --good:#3E7A4E;
  --bad:#B23B3B;
  --radius:10px;
  --radius-lg:16px;
  --shadow: 0 8px 24px -8px rgba(18,32,58,.25);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  --font-bn:'Noto Serif Bengali','Kalpurush','Noto Sans Bengali',serif;
}
html[data-theme="dark"]{
  --bg:var(--ink); --surface:var(--ink-2); --surface-2:var(--ink-3);
  --border: rgba(201,162,75,.28);
  --text:#F3EFE4; --text-dim:#C7CEE3; --text-mute:#AAB3CA;
  --card-shadow: 0 10px 30px -10px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:var(--parchment); --surface:#FFFDF8; --surface-2:var(--parchment-2);
  --border: var(--parchment-line);
  --text:var(--ink-text); --text-dim:#4B4536; --text-mute:#7A7360;
  --card-shadow: 0 6px 20px -8px rgba(60,45,10,.15);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
::selection{background:var(--gold); color:#12203A;}
a{color:inherit;}
.bn{font-family:var(--font-bn);}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:600; letter-spacing:-.01em;}
button{font-family:var(--font-body); cursor:pointer; color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ===================== LAYOUT ===================== */
#appRoot{display:flex; min-height:100vh;}
.sidebar{
  width:248px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
  z-index:40;
}
.sidebar-brand{padding:20px 18px 14px; border-bottom:1px solid var(--border);}
.sidebar-brand .seal{
  width:40px;height:40px;border-radius:50%; border:2px solid var(--gold); display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display); font-weight:700; color:var(--gold); font-size:15px; margin-bottom:10px;
}
.sidebar-brand h1{font-size:17px; margin:0 0 2px; line-height:1.25;}
.sidebar-brand p{font-size:11px; color:var(--text-mute); margin:0; letter-spacing:.04em; text-transform:uppercase;}
.nav-group{padding:10px 10px;}
.nav-label{font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-mute); padding:12px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 10px; border-radius:8px;
  border:none; background:transparent; color:var(--text-dim); font-size:13.5px; font-weight:500; margin-bottom:1px;
  transition:background .15s, color .15s;
}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--gold); color:#1B1608; font-weight:700;}
.nav-item .ic{width:18px; text-align:center; font-size:14px; flex-shrink:0;}
.nav-item .badge{margin-left:auto; font-size:10.5px; background:var(--burgundy); color:#fff; border-radius:20px; padding:1px 7px; font-weight:700;}
.nav-item.active .badge{background:#1B1608; color:var(--gold);}
.sidebar-foot{margin-top:auto; padding:14px 16px; border-top:1px solid var(--border); font-size:11px; color:var(--text-mute);}
.streak-pill{display:flex;align-items:center;gap:6px; font-size:12.5px; color:var(--gold); font-weight:700; margin-bottom:8px;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 22px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.topbar-left{display:flex; align-items:center; gap:12px; flex:1; min-width:0;}
.topbar .search-fake{
  flex:1; display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:9px;
  background:var(--surface); border:1px solid var(--border); color:var(--text-mute); font-size:13px;
}
.topbar .search-fake kbd{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; background:var(--surface-2); padding:2px 6px; border-radius:5px; border:1px solid var(--border);}
.icon-btn{
  width:36px;height:36px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text);
  display:flex;align-items:center;justify-content:center; font-size:15px; flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-2);}
.hamburger{display:none;}
.content{padding:22px 26px 80px; max-width:1100px; width:100%; margin:0 auto;}
.view{display:none;}
.view.active{display:block; animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

/* mobile bottom nav */
.bottom-nav{display:none; position:fixed; bottom:0; left:0; right:0; z-index:50; background:var(--surface);
  border-top:1px solid var(--border); padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.bottom-nav-inner{display:flex; justify-content:space-between; overflow-x:auto; gap:2px;}
.bn-item{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 4px; border:none; background:none; color:var(--text-mute); font-size:9.5px; font-weight:600; border-radius:8px;}
.bn-item.active{color:var(--gold);}
.bn-item .ic{font-size:17px;}

/* ===================== COMPONENTS ===================== */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.page-head h2{font-size:26px; margin:0 0 4px;}
.page-head p.sub{color:var(--text-mute); margin:0; font-size:13.5px;}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold-deep); font-weight:700; margin-bottom:6px;}
html[data-theme="dark"] .eyebrow{color:var(--gold);}

.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:18px; box-shadow:var(--card-shadow);
}
.card h3{font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
.stat-card .num{font-family:var(--font-display); font-size:32px; font-weight:700; line-height:1;}
.stat-card .lbl{font-size:12px; color:var(--text-mute); margin-top:6px;}
.stat-card .delta{font-size:11px; margin-top:6px; font-weight:600;}
.stat-card .delta.up{color:var(--good);} .stat-card .delta.down{color:var(--bad);}

.progress-track{height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border);}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--gold-deep),var(--gold)); border-radius:5px; transition:width .4s ease;}
.progress-row{display:flex; justify-content:space-between; font-size:12px; color:var(--text-mute); margin-bottom:6px;}

.seal-ring{position:relative; width:96px;height:96px; flex-shrink:0;}
.seal-ring svg{transform:rotate(-90deg);}
.seal-ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:20px;}

.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:13px; font-weight:600;
}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--gold); border-color:var(--gold); color:#1B1608;}
.btn-primary:hover{background:var(--gold-deep); border-color:var(--gold-deep); color:#fff;}
.btn-outline-burgundy{border-color:var(--burgundy); color:var(--burgundy-2);}
.btn-sm{padding:6px 11px; font-size:12px;}
.btn-block{width:100%; justify-content:center;}
.btn[disabled]{opacity:.45; pointer-events:none;}

.tag{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;}
.tag-gold{background:rgba(201,162,75,.16); color:var(--gold-deep);} html[data-theme="dark"] .tag-gold{color:var(--gold);}
.tag-burgundy{background:rgba(122,46,46,.14); color:var(--burgundy-2);}
.tag-good{background:rgba(62,122,78,.14); color:var(--good);}
.tag-muted{background:var(--surface-2); color:var(--text-mute);}

.divider{height:1px; background:var(--border); margin:16px 0; border:none;}

.list-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}

input[type=text], input[type=number], input[type=date], textarea, select{
  font-family:var(--font-body); background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:9px 11px; font-size:13.5px; width:100%;
}
textarea{resize:vertical; min-height:70px;}
label.field-label{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-mute); display:block; margin-bottom:5px;}
input::placeholder, textarea::placeholder{color:var(--text-mute); opacity:1;}

/* modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(10,14,26,.6); backdrop-filter:blur(3px); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:8vh 16px;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); width:100%; max-width:640px; box-shadow:0 30px 60px -20px rgba(0,0,0,.5); max-height:78vh; display:flex; flex-direction:column;}
.modal-search-input{border:none; background:transparent; font-size:17px; padding:16px 18px; width:100%; color:var(--text); border-bottom:1px solid var(--border);}
.modal-body{overflow-y:auto; padding:6px;}
.search-hit{display:block; width:100%; text-align:left; padding:10px 12px; border-radius:8px; border:none; background:none; color:var(--text);}
.search-hit:hover{background:var(--surface-2);}
.search-hit .cat{font-size:10px; color:var(--gold-deep); font-weight:700; text-transform:uppercase;}
html[data-theme=dark] .search-hit .cat{color:var(--gold);}

/* flashcard */
.flash-stage{display:flex; flex-direction:column; align-items:center; gap:18px; padding:10px 0 20px;}
.flashcard{
  width:100%; max-width:560px; min-height:260px; border-radius:18px; border:1px solid var(--border);
  background:var(--surface); box-shadow:var(--card-shadow); padding:30px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; gap:14px; cursor:pointer; position:relative;
}
.flashcard .kicker{position:absolute; top:16px; left:18px; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-mute);}
.flashcard .front-text{font-family:var(--font-display); font-size:22px; font-weight:600; line-height:1.35;}
.flashcard .back-text{font-size:14.5px; line-height:1.6; color:var(--text-dim);}
.flashcard .hint{font-size:11.5px; color:var(--text-mute); margin-top:6px;}
.srs-btns{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:100%; max-width:560px;}
.srs-btn{padding:11px 6px; border-radius:9px; text-align:center; font-weight:700; font-size:12.5px; border:1px solid var(--border);}
.srs-btn small{display:block; font-weight:500; opacity:.7; font-size:10px; margin-top:2px;}
.srs-again{background:rgba(178,59,59,.12); color:var(--bad); border-color:rgba(178,59,59,.3);}
.srs-hard{background:rgba(201,162,75,.1); color:var(--gold-deep);}
.srs-good{background:rgba(62,122,78,.12); color:var(--good); border-color:rgba(62,122,78,.3);}
.srs-easy{background:rgba(62,122,78,.22); color:var(--good); border-color:rgba(62,122,78,.4);}

/* quiz */
.quiz-opt{display:flex; align-items:center; gap:10px; padding:13px 14px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); margin-bottom:9px; text-align:left; width:100%; font-size:14px;}
.quiz-opt .letter{width:24px;height:24px;border-radius:50%; background:var(--surface-2); display:flex;align-items:center;justify-content:center; font-size:11.5px; font-weight:700; flex-shrink:0;}
.quiz-opt.correct{border-color:var(--good); background:rgba(62,122,78,.12);}
.quiz-opt.wrong{border-color:var(--bad); background:rgba(178,59,59,.12);}
.quiz-opt:disabled{opacity:1;}

.qcard-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.qopt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media (max-width:560px){.qopt-grid{grid-template-columns:1fr;}}
.qopt-box{display:flex; align-items:center; gap:10px; padding:12px 13px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); font-size:13.5px;}
.qopt-box .letter{width:22px;height:22px;border-radius:50%; background:var(--surface); display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}
.qopt-box.correct{border-color:var(--good); background:rgba(62,122,78,.16); color:var(--good);}
.qopt-box.correct .letter{color:var(--good);}
.qcard-answer{margin-top:10px; padding:11px 14px; border-radius:9px; border:1.5px solid var(--good); background:rgba(62,122,78,.14); color:var(--good); font-size:13.5px;}
.qcard textarea{width:100%;}

.timer-chip{font-family:var(--font-mono); font-weight:600; font-size:13px; background:var(--surface-2); border:1px solid var(--border); padding:6px 12px; border-radius:20px;}

.author-card{cursor:pointer;}
.author-card h4{font-family:var(--font-display); font-size:16.5px; margin:0 0 4px;}
.author-card .dates{font-size:11.5px; color:var(--text-mute); font-family:var(--font-mono);}
.author-card p{font-size:12.5px; color:var(--text-dim); line-height:1.55; margin:8px 0 0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}

.timeline{position:relative; padding-left:26px;}
.timeline:before{content:''; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:var(--border);}
.tl-item{position:relative; padding-bottom:22px; cursor:pointer;}
.tl-item:before{content:''; position:absolute; left:-26px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--gold); border:2px solid var(--surface); box-shadow:0 0 0 2px var(--gold);}
.tl-item h4{font-family:var(--font-display); font-size:17px; margin:0 0 2px;}
.tl-item .dur{font-family:var(--font-mono); font-size:12px; color:var(--gold-deep); font-weight:700;} html[data-theme=dark] .tl-item .dur{color:var(--gold);}
.tl-sub{margin:8px 0 0 0; padding:10px 12px; background:var(--surface-2); border-radius:8px; font-size:12.5px; color:var(--text-dim); margin-bottom:6px;}

.empty-state{text-align:center; padding:50px 20px; color:var(--text-mute);}
.empty-state .ic{font-size:34px; margin-bottom:10px;}

.chip-row{display:flex; flex-wrap:wrap; gap:7px;}
.chip{padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:600; color:var(--text-dim);}
.chip.on{background:var(--gold); color:#1B1608; border-color:var(--gold);}

.kbd-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
.kbd{font-family:var(--font-mono); background:var(--surface-2); border:1px solid var(--border); padding:2px 8px; border-radius:5px; font-size:11.5px;}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#F6EFE2; padding:11px 18px; border-radius:9px; font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:all .25s ease; border:1px solid var(--gold);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (max-width:880px){
  .sidebar{position:fixed; left:-260px; top:0; transition:left .25s ease; box-shadow:0 0 40px rgba(0,0,0,.3);}
  .sidebar.open{left:0;}
  .hamburger{display:flex;}
  .content{padding:16px 14px 90px;}
  .bottom-nav{display:block;}
  body{padding-bottom:0;}
}
.sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:39;}
.sidebar-scrim.open{display:block;}
</style>
</head>

<div id="appRoot"></div>
<div id="modalRoot"></div>

<script>
const APP_DATA = {"meta": {"title": "A Handbook on English Literature", "author": "Sharif Hossain Ahmad Chowdhury", "pages": 247}, "periods": [{"id": "old-english", "name": "The Old English Period", "alt": "The Anglo-Saxon Period", "duration": "450–1066", "notes": ["Also called The Anglo Saxon Period.", "'Saxon' was the name of a Germanic tribe; England was under the Saxons of Germany at this time.", "Literature was largely oral in this period.", "English is a West Germanic language."], "sub": []}, {"id": "middle-english", "name": "The Middle English Period", "alt": "", "duration": "1066–1500", "notes": ["In 1066 the Normans of France, led by William, defeated the Saxons and took control of England — so 1066–1340 is called the Anglo-Norman Period; French language and culture were imposed on the English.", "1400–1500 is called the Barren/Dark Period.", "Oxford (1168) and Cambridge (1209) universities were founded in this Anglo-Norman age, primarily to spread religious education.", "Magna Carta was passed on 15 June 1215 — a great charter that limited the power of the monarch, later called the Bible of the British constitution and the great charter of freedom.", "In 1295, the English Parliament was established.", "William Caxton established the first printing press in England in 1476, and is called the First English Printer.", "The Hundred Years' War between England and France lasted 1337-1453.", "English writers of this age followed the Italian poets Dante, Petrarch and Boccaccio.", "Miracle Play, Mystery Play, Morality Play and Interlude — early forms of English drama — began in this period.", "Distinction: a Drama is so called before it is staged; once staged it is called a Play. A playwright is a dramatist."], "sub": [{"name": "The Anglo-Norman Period", "duration": "1066–1340", "note": "Language: French. England was under the Normans of France at this time."}, {"name": "The Age of Chaucer", "duration": "1340–1400", "note": "Part of the 14th century; the journey of English literature effectively begins through Chaucer."}, {"name": "The Dark / Barren Period", "duration": "1400–1485/1500", "note": ""}]}, {"id": "renaissance", "name": "The Renaissance", "alt": "Also called the Early Modern Period", "duration": "1500–1660", "notes": ["The European Renaissance actually began in the 14th century in Italy (Florence, then Venice and Rome); some date its start to 1453. It began in England around 1500.", "'Renaissance' is an Italian word meaning revival/regeneration/rebirth — the rediscovery of classical (ancient Greek) learning, culture and free thinking; also called the Early Modern Period.", "The Italian poet Petrarch is regarded by many as the Father of the Renaissance and Father of Humanism.", "Key features of the Renaissance age: Humanism, Free Thinking, Nationalism, Individualism."], "sub": [{"name": "Préparation for Renaissance", "duration": "1500–1558", "note": "রেনেসাঁর প্রস্তুতি যুগ (Preparation period for the Renaissance)."}, {"name": "The Elizabethan Period", "duration": "1558–1603", "note": "Part of the 2nd half of the 16th century. Titles of the age: 'Golden/Glorious Period of English Literature/Drama' and 'A nest of singing birds'. Named after Queen Elizabeth I (b.1533), called the 'Virgin Queen', daughter of Henry VIII and Anne Boleyn. First staged play of the age: The Tragedy of Gorboduc (1562). Elizabethan theatre: no female writers, women were not allowed to act (boys played women's roles); Elizabethan tragedy's chief features were revenge and love; the first English theatre was established in 1576."}, {"name": "The Jacobean Period", "duration": "1603–1625", "note": "Named after King James I. 1590–1616 is also called the Age of Shakespeare; 1620–1660 is known as the Puritan Period (due to the dominance of Puritan Christians)."}, {"name": "The Caroline Period", "duration": "1625–1649", "note": "Named after King Charles I. His execution marked the first fall of monarchy in England."}, {"name": "The Commonwealth Period", "duration": "1649–1660", "note": "England had no Monarch during this age — it was the age of the republic (Puritan Interregnum)."}]}, {"id": "neoclassical", "name": "The Neoclassical Period", "alt": "", "duration": "1660–1798", "notes": ["Also called 17th & 18th Century Literature, or the Pseudo-classical Period ('pseudo' = mock/artificial) or The Enlightenment Period.", "Writers of this age imitated ancient Greek and Roman literary tradition but lacked the originality of those classical writers.", "Slogan of this age: 'Art for Humanity's Sake' (in the Romantic age it became 'Art for Art's Sake').", "The 18th century saw the rise of the English novel through Daniel Defoe, Samuel Richardson and Henry Fielding.", "An epistolary novel is a novel in the form of letters; an omniscient narrator is the narrator of a novel written in third person."], "sub": [{"name": "The Restoration Period", "duration": "1660–1700", "note": "Restoration refers to the restoration of the monarchy. Also called the Age of poet John Dryden. Two political parties were formed in this age: Whig (against the king) and Tory (in favour of the king). The Royal Society was formed in 1662 to promote scientific research. The 1688 Glorious Revolution established Britain's constitutional monarchy/parliamentary democracy. The Bill of Rights was adopted in 1689, restricting royal power and enhancing Parliament's power."}, {"name": "The Augustan Period", "duration": "1700–1745", "note": "Also called the Age of poet Alexander Pope. Writers of this age imitated the ancient Roman poets of Emperor Augustus's time (e.g. Virgil, 70-19 BC). In 1707 Scotland was united with England to form 'Great Britain'. This age is noted for satire and the Gothic novel (pioneered by Ann Radcliffe). Literary clubs formed in this period included The Scriblerus Club, The Kit-Kat Club, and The Spectator Club."}, {"name": "The Age of Sensibility", "duration": "1745–1785/98", "note": "Other name: The Age of Reason / Transition. Also called the Age of Dr. Samuel Johnson. Writers of this age valued sense, reason, feeling and original genius above all — hence also called the Age of Reason. Dr. Samuel Johnson was the leading author of the age. This period saw the American Revolution (1775-1785) and the French Revolution (1789), whose slogan was Liberty, Equality, Fraternity."}]}, {"id": "romantic", "name": "The Romantic Period", "alt": "", "duration": "1798–1832", "notes": ["Also called The Golden Age of Lyric poetry / Age of Revolution; English poetry reached its highest peak in this age.", "Slogan: Art for Art's Sake (art needs no moral purpose behind its creation) — contrasted with the Neoclassical slogan 'Art for Humanity's Sake'.", "Romanticism is not mere imitation but creation with the help of imagination.", "Pioneers of Romanticism: William Wordsworth and S.T. Coleridge — their joint 1798 poetry collection Lyrical Ballads marks the start of the English Romantic period; it proved that poetry could be written even in the language of ordinary people (unlike the previous Neoclassical age, whose poetry centred on heroes, kings/queens and the aristocracy).", "Key features of the Romantic age: Subjectivity (frequent use of 'I' in poetry), High Imagination, bringing the language of the lower and middle classes into poetry, love for nature/beauty/common people/common language, and Supernaturalism.", "Wordsworth, Coleridge and Robert Southey together are called the 'Lake Poets'."], "sub": []}, {"id": "victorian", "name": "The Victorian Period", "alt": "", "duration": "1832–1901", "notes": ["Named after Queen Victoria, who ascended the throne in 1837 — for the British people this was the longest and one of the most stable/prosperous periods.", "After the 1857 Sepoy Mutiny/uprising, the British Crown took direct control of the Indian subcontinent from the East India Company in 1858.", "Key features of this age: Symbolism, Medievalism, Sensuousness; the concept of communism also influenced this age.", "Charles Darwin's Theory of Evolution was propagated in this age, which conflicted with prevailing religious sentiment.", "In 1833, slavery was abolished (declared free) in the British Empire; the Fabian Society was also formed in 1833.", "Three principal Victorian poets: Alfred Tennyson, Robert Browning, Matthew Arnold."], "sub": [{"name": "The Pre-Raphaelites", "duration": "1848–1860", "note": ""}, {"name": "Aestheticism and Decadence", "duration": "1880–1901", "note": ""}]}, {"id": "modern-postmodern", "name": "The Modern & Post-Modern Periods", "alt": "", "duration": "1901–present", "notes": ["Modernism is believed to have begun with poet Ezra Pound's dictum 'Make it new'.", "The Modern Period has two shorter ages: The Edwardian (1901-1910, under Edward VII) and The Georgian (1910-1936, under George V).", "Nobel Prize in Literature (English-language-relevant winners): Rudyard Kipling (1907, UK); W.B. Yeats (1923, Ireland); George Bernard Shaw (1925, Ireland); Sinclair Lewis (1930, US); John Galsworthy (1932, UK); Eugene O'Neill (1936, US); Pearl S. Buck (1938, US); T.S. Eliot (1948, UK); William Faulkner (1949, US); Bertrand Russell (1950, UK); Winston Churchill (1953, UK); Ernest Hemingway (1954, US); John Steinbeck (1962, US); Samuel Beckett (1969, Ireland); Patrick White (1973, Australia); Saul Bellow (1976, US); William Golding (1983, UK); Wole Soyinka (1986, Nigeria); Nadine Gordimer (1991, South Africa); Toni Morrison (1993, US); Seamus Heaney (1995, Ireland); V.S. Naipaul (2001, UK); J.M. Coetzee (2003, South Africa); Harold Pinter (2005, UK); Doris Lessing (2007, UK); Alice Munro (2013, Canada).", "Part of the second half of the 20th century onward."], "sub": [{"name": "The Edwardian Period", "duration": "1901–1910", "note": ""}, {"name": "The Georgian Period", "duration": "1910–1936", "note": ""}, {"name": "The Post-Modern Period", "duration": "1939–present", "note": "Part of the second half of the 20th century onward."}]}], "periodsNote": "Note: these ages/periods are mostly named after a contemporary famous king, queen, or particular writer, or after some special feature of that age — so the same period can carry different names in different sources.", "authors": [{"name": "Caedmon", "dates": null, "period": "The Old English Period", "text": "Known as the earliest poet / first known poet in English Literature. Called the Father of English Sacred Song. Some also call him the Milton of the Anglo-Saxon age. His major work is Paraphrase. He was a religious (Christian) poet.", "id": "a0"}, {"name": "Cynewulf", "dates": null, "period": "The Old English Period", "text": "One of twelve Old English poets known by name, and one of four whose work is known to survive today. 'Juliana' is one of his famous poems.", "id": "a1"}, {"name": "Saint Venerable Bede", "dates": "673-735", "period": "The Old English Period", "text": "(673-735). Title: Doctor of the Church. Also called Father of Learning and the first historian in the English language.", "id": "a2"}, {"name": "King Alfred the Great", "dates": "849-899", "period": "The Old English Period", "text": "(849-899). Title: 'The Law Governing'. Ruled England from 871 to 899 AD. He compiled the Anglo-Saxon Chronicle, considered the first monument/first prose work in English — for which he is also called the Founder of English Prose. Exam trap: if 'Alfred the Great' or Middle-English 'John Wycliffe' are not among the options for 'Founder of English Prose', the answer defaults to Francis Bacon (Elizabethan period).", "id": "a3"}, {"name": "Beowulf", "dates": null, "period": "The Old English Period", "text": "Author unknown. Considered the earliest surviving epic in England / the First Monument in English Literature. Believed to have been composed around 650 AD. Set in Scandinavia but recognised as England's national epic. The heroic epic contains 3,182 lines. Its hero, Beowulf, first frees the Danes from the monster Grendel and later dies fighting a dragon. The original manuscript is preserved in the British Museum, London. Related shorter Old English poems of unknown authorship include: The Wanderer, The Seafarer, The Husband's Message, The Wife's Lament, and Traveler.", "id": "a4"}, {"name": "Geoffrey Chaucer", "dates": null, "period": "The Middle English Period", "text": "(1340-1400). A representative poet of the 14th century — the 'Age of Chaucer' (1340-1400) is named after him. He was at once a diplomat, philosopher, clerk, royal envoy, and ambassador. Titles: Morning Star of the Renaissance, The first great modernist, Father of English Language, Father of English Literature, First Humourist in English Literature, Father of English Modern Poetry, The first great English story-teller. He was the first to write poetry in pure/standard English (English literature was not 'pure' in the Saxon/Norman periods). Masterpiece: The Canterbury Tales — first printed in 1478; about 17,000 lines; an unfinished collection of 24 stories told by pilgrims travelling from London to Canterbury to visit the shrine of Saint Thomas Becket, starting from the Tabard Inn at Southwark (the winner of the storytelling contest gets a free meal). Chaucer's poetic career is divided into three periods: The French Period, The Italian Period, The English Period. Other famous works: The House of Fame, Troilus and Criseyde, The Nun's Priest's Tale, The Parliament of Fowls, The Legend of Good Women.", "id": "a5"}, {"name": "John Wycliff", "dates": null, "period": "The Middle English Period", "text": "(1331-1384). Titles: Morning Star of the Reformation, Reformer of the English Church, Evening Star of English Scholasticism, Father of English Prose / First Prose Writer in English (used if Alfred the Great is not among the options). An English scholastic philosopher, theologian, Biblical translator, reformer, and seminary professor at Oxford; an influential dissident within the Roman Catholic priesthood in the 14th century. His followers were known as the Lollards, who were later admired for the anti-Papal movement and the Protestant Reformation. He was the first to translate the Bible (New Testament, 2nd part) into English, in prose style.", "id": "a6"}, {"name": "Sir Thomas Malory", "dates": "1415-1471", "period": "The Middle English Period", "text": "(1415-1471). His famous prose work is Morte D'Arthur, published by William Caxton in 1485. It is regarded as the First Romance in Prose in English literature. (Note: the poem 'King Morte D'Arthur' was later written by the Victorian poet Alfred Tennyson.)", "id": "a7"}, {"name": "Dante", "dates": null, "period": "The Middle English Period", "text": "Dante Alighieri (1265-1321), born in Florence, Italy. Titles: The Father of the Italian Language, The Supreme Poet of Italy. His famous epic is The Divine Comedy. Dante, Petrarch, and Boccaccio together are called The Three Crowns / The Three Fountains of Italian literature. Inferno ('Hell') is a famous part of Dante's Divine Comedy — its first part.", "id": "a8"}, {"name": "William Langland", "dates": null, "period": "The Middle English Period", "text": "His famous long poem/work is Piers Plowman.", "id": "a9"}, {"name": "Thomas Norton", "dates": "1532-1584", "period": "The Renaissance", "text": "(1532-1584) and Thomas Sackville (1536-1608) were literary collaborators, called the pioneers of English tragedy. Together they wrote the First Tragedy in English: The Tragedy of Gorboduc (also called Ferrex and Porrex), first staged before Queen Elizabeth on 18 January 1562.", "id": "a10"}, {"name": "Christopher Marlowe", "dates": "1564-1593", "period": "The Renaissance", "text": "(1564-1593). Born in Canterbury, England. A 'University Wit'. Died at 29 in 1593, stabbed in a scuffle (having been arrested on a charge of atheism 18 days earlier). Title: Father of English Drama/Tragedy. He was England's greatest playwright before Shakespeare, who was strongly influenced by Marlowe's writing — Marlowe was Shakespeare's contemporary/predecessor (though born the same year, Shakespeare rose to prominence only after Marlowe's mysterious early death). Marlowe introduced blank verse into drama. Famous lyric poems: 'The Passionate Shepherd to His Love' and 'Hero and Leander' (completed after Marlowe's death by George Chapman). Famous tragedies: (i) Doctor Faustus — full title The Tragical History of Doctor Faustus, also called a Morality play; Faustus is called the Renaissance Hero, who sells his soul to the devil (Lucifer, Mephistophilis) for 24 years of power. (ii) The Jew of Malta — about a Maltese Jew named Barabas seeking revenge; Shakespeare is thought to have been influenced by it when writing The Merchant of Venice. (iii) Tamburlaine the Great — about Timur (ancestor of the Mughal emperor Babur), who rises from shepherd to conqueror. (iv) Edward II — a historical play. (v) The Massacre at Paris (1593). (vi) Dido, Queen of Carthage (1586) — Marlowe's first play.", "id": "a11"}, {"name": "Edmund Spenser", "dates": null, "period": "The Renaissance", "text": "(1552-1599). Titles: Poets' Poet / The Poet of Poets, The Child of Renaissance and Reformation, Second Father of English Poetry, Court Poet / Divine Master / The Prince of Poets. After his death many poets, especially the Romantics (1798-1832), followed his poetic style — hence 'Poets' Poet'. He introduced the Spenserian Sonnet. His sonnet collection is Amoretti (89 sonnets). Famous epic: The Faerie Queene — written in praise of Queen Elizabeth, also considered an Allegory; its theme is Patriotism; it is an unfinished epic; its hero is the Red Cross Knight and heroine is Una. Other famous books/poems: The Shepherd's Calendar, The Ruins of Time. He also wrote 'Astrophel', a pastoral elegy on the death of Sir Philip Sidney.", "id": "a12"}, {"name": "Nicholas Udall", "dates": "1505-1556", "period": "The Renaissance", "text": "(1505-1556). Title: Father of English Comedy. First comedy in English: Ralph Roister Doister — a comedy of failed love whose hero is Ralph; first staged in 1553 before Queen Mary. He also wrote an Interlude called Respublica. (Some instead consider John Still's Gammer Gurton's Needle, 1533, the first English comedy.)", "id": "a13"}, {"name": "Sir Thomas Wyatt", "dates": "1503-1542", "period": "The Renaissance", "text": "(1503-1542). Titles: Father of English Sonnet, First Sonneteer in English literature. His literary collaborator was the poet Henry Howard, Earl of Surrey (who translated Virgil's Aeneid into English). Wyatt followed the Italian poet Petrarch and wrote sonnets in his style. Their joint poetic work is Tottel's Miscellany, also called the First Fruit of the Renaissance. (Reminder: a Sonnet is a 14-line poem of three quatrains ending in a rhyming couplet; father of the sonnet form was Petrarch.)", "id": "a14"}, {"name": "Sir Philip Sidney", "dates": "1554-1586", "period": "The Renaissance", "text": "(1554-1586). A famous critic, poet, and soldier; one of the leading members of Queen Elizabeth's court. Famous books: The Lady of May; An Apology for Poetry (a work of literary criticism); Arcadia (full title The Countess of Pembroke's Arcadia) — called the embryo/seed of the English novel.", "id": "a15"}, {"name": "John Webster", "dates": "1580-1634", "period": "The Renaissance", "text": "(1580-1634). His greatest plays were written in the Jacobean period. Famous tragedies: The White Devil; The Devil's Law Case; The Duchess of Malfi — a revenge play whose notorious/Machiavellian (selfish) character is Bosola.", "id": "a16"}, {"name": "Richard Hooker", "dates": "1554-1600", "period": "The Renaissance", "text": "(1554-1600). The greatest prose writer of the Elizabethan period; an influential theologian and clergyman.", "id": "a17"}, {"name": "George Chapman", "dates": "1559-1634", "period": "The Renaissance", "text": "(1559-1634). Translated Homer's Iliad and Odyssey into English. (The Iliad is an ancient Greek epic of about 16,000 lines about the Trojan War, fought over Helen; its greatest Greek warrior is Achilles and greatest Trojan warrior is Hector; the Greeks finally destroy the fortified city of Troy.)", "id": "a18"}, {"name": "Ben Jonson", "dates": "1572-1637", "period": "The Renaissance", "text": "(1572-1637). Titles: Father of English Realistic Comedy, Father of Comedy of Humours (based on the medieval medical theory of the four bodily 'humours' — blood, phlegm, choler/yellow bile, and melancholy/black bile — whose balance was believed to shape a person's physical and mental character). Note: 'Jonson' has no 'h'. He began writing in the Elizabethan period but became most successful/famous in the Jacobean period; under King James I he was considered the greatest playwright after Shakespeare. Famous plays: Every Man in His Humour; Every Man Out of His Humour; The Silent Woman (or Epicoene); Volpone, or the Fox (whose notorious character is Mosca; also called a beast fable); The Alchemist.", "id": "a19"}, {"name": "Thomas Kyd", "dates": "1558-1594", "period": "The Renaissance", "text": "(1558-1594). A 'University Wit'. Title: Father of English Revenge Tragedy (though the Italian dramatist Seneca is called the Father of Revenge Tragedy generally). Famous play: The Spanish Tragedy (his first play), also called a Bloody Drama; Shakespeare is thought to have drawn inspiration from it for Hamlet.", "id": "a20"}, {"name": "Thomas More", "dates": "1478-1535", "period": "The Renaissance", "text": "(1478-1535). Beheaded by King Henry VIII. Famous book: Utopia (an imaginary kingdom/island with no problems — 'a kingdom of nowhere'), translated by him from Latin into English.", "id": "a21"}, {"name": "Thomas Dekker", "dates": "1572 –1632", "period": "The Renaissance", "text": "(1572-1632). An English Elizabethan dramatist and pamphleteer, a versatile and prolific writer.", "id": "a22"}, {"name": "Arthur Golding", "dates": "1536 –1606", "period": "The Renaissance", "text": "(1536-1606). An English translator of more than 30 works from Latin into English.", "id": "a23"}, {"name": "Niccolo Machiavelli", "dates": null, "period": "The Renaissance", "text": "(1469-1527). Title: Father of Modern Political Science. Born in Italy. Famous book: The Prince. In literature, a 'Machiavellian Character' means a selfish character; the Machiavellian belief is 'the end justifies the means.' During the Italian Renaissance, Machiavelli founded modern political science on direct empirical observation of political institutions, arguing that even evil means could be justified to create or preserve a desired regime.", "id": "a24"}, {"name": "Cyril Tourneur", "dates": "1575-1626", "period": "The Renaissance", "text": "(1575-1626). Famous plays: The Revenger's Tragedy (1607); The Atheist's Tragedy (1611).", "id": "a25"}, {"name": "Migunl de Cervantes", "dates": "1547-1616", "period": "The Renaissance", "text": "Miguel de Cervantes (1547-1616), Spain's famous poet, dramatist and novelist. Chief work: Don Quixote — considered the first and one of the greatest modern European novels.", "id": "a26"}, {"name": "Francis Bacon", "dates": "1561-1626", "period": "The Renaissance", "text": "(1561-1626). Titles: Father of English Essay, Father of Modern Prose, Father of Empiricism, First Essayist in English Literature. An English courtier (statesman), lawyer, and natural philosopher, educated at Cambridge University; he served as Attorney General and Lord Chancellor of England. All his essay titles begin with 'Of' (e.g. Of Studies, Of Love). Famous books: Advancement of Learning; Novum Organum; The Wisdom of the Ancients; Of the Dignity and Advancement of Learning ('Divine and Humane'); The New Atlantis. Famous quotations: 'Reading maketh a full man; conference a ready man; writing an exact man' (from Of Studies); 'Studies serve for delight, for ornament, and for ability'; 'History makes man wise'; 'Some books are to be tasted, others to be swallowed, and some few to be chewed and digested' (all four from Of Studies); 'Wives are young men's mistresses, companions for middle age, and old men's nurses' (Of Marriage and Single Life); 'A mixture of lie doth ever add pleasure' (Of Truth); 'A good friend is another himself' (Of Friendship); 'It is impossible to love and be wise' (Of Love); 'Suspicions among thoughts are like bats among birds'; 'Opportunity makes a thief'; 'The secret of success is the constancy of purpose'; 'Revenge is a kind of wild justice' (Of Revenge); 'Silence is the sleep that nourishes wisdom'; 'Unmarried men are the best friends, best masters, best servants, but not always best subjects' (Of Marriage and Single Life); 'Old wood is best to burn, old wine to drink, old friends to trust, and old authors to read.' Exam trap: if neither Alfred the Great nor John Wycliffe is among the options for 'Father of English Prose', the answer is Francis Bacon ('Father of English Prose').", "id": "a27"}, {"name": "William Shakespeare", "dates": "1564-1616", "period": "The Renaissance", "text": "(1564-1616). Born 23 April 1564 (some say 26 April) in Stratford-upon-Avon, Warwickshire (Avon is a river); died 23 April 1616, aged 52. Titles: National Poet of England, The Greatest Dramatist, The Greatest Superstar of the World, King without Crown, The Bard of Avon, The Swan of Avon. Dr. Samuel Johnson called him the 'Poet of Human Nature'. Father: John Shakespeare (an artisan). Mother: Mary Shakespeare (Shakespeare was their fourth child). Wife: Anne Hathaway (8 years his senior), married 1582; they had three children — daughter Susanna and twins Hamnet and Judith. He worked as an actor, performing at the Globe Theatre, and is buried at Holy Trinity Church. In 1598 the lawyer Francis Meres declared Shakespeare 'Britain's greatest dramatist'. He was famous for 37 plays (some say 38 — 25 written in Elizabeth's lifetime, the rest in the Jacobean period, though he is still generally called an Elizabethan dramatist), 154 sonnets, and 2 long narrative poems. He wrote four types of play: Tragedy (12), Comedy (15), Tragi-comedy (a form he himself pioneered), and Historical plays. Each of his plays has five acts, mostly written in iambic pentameter. Soliloquy = a speech by an actor alone on stage revealing inner thoughts to the audience; Aside = a brief remark by a character to the audience, unheard by other characters. He innovated the Shakespearean Sonnet (three quatrains + a couplet, rhyme scheme abab cdcd efef gg); many sonnets are dedicated to his friend the Earl of Southampton, and 26 are addressed to a so-called 'Dark Lady'. Famous narrative poems: The Rape of Lucrece; A Lover's Complaint; The Passionate Pilgrim; The Phoenix and the Turtle; Venus and Adonis (the Romantic poet P.B. Shelley later wrote a famous elegy called 'Adonais'). He wrote about 10 historical plays centred on three kings: King Henry, King John, King Richard — famous lines include 'Uneasy lies the head that wears a crown' (Henry IV) and 'Men of few words are the best men' (Henry V); Henry VI was his first play. Famous tragi-comedies/problem plays: The Merchant of Venice (characters Antonio, Shylock, Portia, Bassonio, Jessica; famous lines: 'It is a wise father that knows his own child', 'All that glitters is not gold', 'Love is blind'); All's Well That Ends Well; Measure for Measure (a dark/black comedy — 'neither a pure tragedy nor a fair comedy... ends with forced marriages, not necessarily true love'). Famous tragedies: Hamlet (1602; set in Denmark; characters King Hamlet, Prince Hamlet, Gertrude, Claudius, Horatio, Ophelia, Laertes; famous lines: 'To be or not to be, that is the question', 'Frailty, thy name is woman', 'What a piece of work is a man', 'Brevity is the soul of wit', 'There are more things in heaven and earth, Horatio, than are dreamt of in our philosophy', 'Neither a borrower nor a lender be'); Macbeth (Scotland's King Duncan is murdered; characters Three Witches, Macbeth, Lady Macbeth, Banquo, Macduff; famous lines: 'Fair is foul, and foul is fair', 'Look like the innocent flower, but be the serpent under it', 'Here's the smell of the blood still... all the perfumes of Arabia will not sweeten this little hand', 'Life's but a walking shadow', \"Life is a tale told by an idiot, full of sound and fury, signifying nothing\"); Othello (the Moor of Venice; a domestic tragedy of jealousy; Othello gives Desdemona a handkerchief as a token of love; characters Othello, Desdemona, Brabantio, Iago, Cassio; 'Othello syndrome' in psychology refers to pathological/delusional jealousy); King Lear (an arrogant king with three daughters — Goneril, Regan, Cordelia; famous lines: 'I am a man more sinned against than sinning', 'How sharper than a serpent's tooth it is to have a thankless child', 'My love's more richer than my tongue', 'Nothing will come of nothing'); Julius Caesar (Caesar's betrayer/friend is Brutus; famous lines: 'Veni, Vidi, Vici' [I came, I saw, I conquered — an example of climax], 'Cowards die many times before their deaths, the valiant never taste of death but once', 'Et tu, Brute?'); Romeo and Juliet (a tragedy of eternal love between two feuding families, ending in double suicide); Antony and Cleopatra (Cleopatra called the 'Serpent of the Nile'; G.B. Shaw, called the 'Father of Modern English Literature', wrote a related play Caesar and Cleopatra); Titus Andronicus (a tragedy; Titus was a renowned Roman general); Timon of Athens (an unfinished play, sometimes called his 38th play; famous quote: 'Life is an uncertain voyage').", "id": "a28"}, {"name": "John Donne", "dates": null, "period": "The Renaissance", "text": "(1572-1631). Titles: Father/Leader of the Metaphysical poets, Poet of Love (though after his wife Anne Donne's death he wrote much religious poetry). Famous book: An Anatomy of the World. Famous poems: The Good Morrow; The Sun Rising (the poet reproaches the sun; the American novelist Ernest Hemingway wrote a novel called The Sun Also Rises); The Canonization; A Valediction: Forbidding Mourning; The Flea; The Undertaking; Twicknam Garden; For Whom the Bell Tolls (also known as 'No Man Is An Island'; Ernest Hemingway also wrote a famous novel titled For Whom the Bell Tolls). Famous quotes: 'I wonder by my truth, what thou and I did till we love' (The Good Morrow); 'For love, all love of other sights control, and make a little room an everywhere' (The Good Morrow); 'Busy old fool, unruly sun, why dost thou thus...' (The Sun Rising); 'She's all states, and all princes I, nothing else is' (The Sun Rising); 'For God's sake hold your tongue, and let me love' (The Canonization — quoted by Rabindranath Tagore in his novel Shesher Kobita); 'If they be two, they are two so as stiff twin compasses are two' (A Valediction: Forbidding Mourning).", "id": "a29"}, {"name": "Andrew Marvell", "dates": "1621-1678", "period": "The Renaissance", "text": "(1621-1678). A close friend and admirer of the epic poet Milton, and a follower of John Donne. Famous poems: To His Coy Mistress (his best-known poem); The Definition of Love (theme: 'out of sight, near to mind'); The Garden; An Horatian Ode.", "id": "a30"}, {"name": "Henry Vaughan", "dates": null, "period": "The Renaissance", "text": "Henry Vaughan (1621-1695). A famous Metaphysical poet who was a physician by profession. Famous poems: Mount of Olives; The Chemist's Key; Silex Scintillans (he is chiefly known for this religious poetry).", "id": "a31"}, {"name": "George Herbert", "dates": "1593-1633", "period": "The Renaissance", "text": "(1593-1633). Title: Religious Poet. He was both a poet and a priest (clergyman). Famous poems: The Collar; The Easter Wings (about the resurrection of Jesus Christ); On the Progress of Soul; The Temple; Affliction. Quote: 'Help thyself, and God will help thee.'", "id": "a32"}, {"name": "Cowley", "dates": null, "period": "The Renaissance", "text": "Abraham Cowley (1618-1667). Poem: Constantia and Philetus. Famous quotes: 'Life is an incurable disease'; 'Of all ills that one endures, hope is a cheap and universal cure'; 'Curiosity does, no less than devotion, pilgrims make'; 'God the first garden made, and the first city Cain'; 'For the whole world, without a native home, is nothing but a prison of larger room.'", "id": "a33"}, {"name": "John Milton", "dates": "1608-1674", "period": "The Neoclassical Period", "text": "(1608-1674). Titles: Epic poet (called the 'Milton' of Bengali literature is poet Michael Madhusudan Dutt); a great master of verse in the Puritan Period; also called the last great poet of the Renaissance age. Famous epics: Paradise Lost (12 books, composed 1658-1664 in blank verse while blind, dramatizing man's fall from grace per the Biblical story of Adam and Eve) and Paradise Regained (both epics composed while Milton was blind; in Bengali literature the only epic in prose is Michael Madhusudan Dutt's... note: Bishad Sindhu is a famous Bengali prose epic). Theme of Paradise Lost: 'To justify the ways of God to man.' Famous elegies: Lycidas (written on the death of his friend Edward King; an elegy is a poem of lamentation/sadness); Song on Shakespeare. His first poem: On the Morning of Christ's Nativity (1629). Famous poetic dramas: Samson Agonistes (a tragedy); Comus. Famous prose: Of Education (essay); Areopagitica (a defence of freedom of the press and speech). Famous sonnets: On His Blindness; On the Late Massacre. Famous quotes: 'It is better to reign in hell than to serve in heaven' (spoken by Satan); 'Childhood shows the man as morning shows the day'; 'Death is the golden key that opens the palace of eternity.' Note: there are two types of epic — Primary Epic (originally oral, later written, e.g. Homer's Iliad and Odyssey) and Secondary Epic (written from the start, e.g. Paradise Lost, Paradise Regained).", "id": "a34"}, {"name": "John Dryden", "dates": null, "period": "The Neoclassical Period", "text": "(1631-1700). Titles: Father of Modern English Criticism, England's First Poet Laureate (appointed 1670); Sir Walter Scott called him 'Glorious John'. He wrote The Enchanted Island, a sharp critique/parody of Shakespeare's The Tempest. The Restoration Period (1660-1700) is called the Age of Dryden. Famous works: All for Love (a heroic tragedy); The Mistaken Husband (1674); Absalom and Achitophel (a poetic political satire); The Indian Emperor (a famous tragedy); Mac Flecknoe (a satirical poem); An Evening's Love (a comedy); The Conquest of Granada (1670); Preface to the Fables. Famous poem: Heroic Stanzas on the Death of Cromwell. Famous quotes: 'They think too little who talk too much'; 'We first make our habits, then habits make us'; 'Jealousy is the proof of love.'", "id": "a35"}, {"name": "William Congreve", "dates": null, "period": "The Neoclassical Period", "text": "(1670-1729). A friend of Jonathan Swift. Famous for Comedy of Manners (subject matter: upper-class manners/behaviour, romantic intrigues of gentlemen and ladies, worldly pursuit of pleasure, indifference to morality). Famous plays: The Way of the World; Love for Love; The Double Dealer; The Old Bachelor; The Mourning Bride.", "id": "a36"}, {"name": "John Bunyan", "dates": null, "period": "The Neoclassical Period", "text": "(1628-1688). The most powerful/strongest prose writer of the Puritan period. During the English Civil War he fought vigorously on the Parliamentary side, and as a result spent 12 years in jail (where he wrote his famous allegorical prose). Famous books: Pilgrim's Progress (1678); The Holy War; The Life and Death of Mr. Badman (Pilgrim's Progress and The Holy War are his famous allegories in prose). Famous quote: 'In prayer it is better to have a heart without words than words without a heart.'", "id": "a37"}, {"name": "Samuel Butler", "dates": "1613-1680", "period": "The Neoclassical Period", "text": "(1613-1680) A famous poet and satirist Famous work: Hudibars (1663) Samuel Butler Victorian novelist", "id": "a38"}, {"name": "John Locke", "dates": null, "period": "The Neoclassical Period", "text": "(1632-1704). Title: Father of Modern Democracy. Famous books: An Essay Concerning Human Understanding (1690); Some Thoughts Concerning Education; Two Treatises on Civil Government. Quote: 'Where there is no law, there is no freedom.'", "id": "a39"}, {"name": "William Wycherley", "dates": null, "period": "The Neoclassical Period", "text": "Famous works: The Country Wife; The Plain Dealer.", "id": "a40"}, {"name": "Aphra Behn", "dates": null, "period": "The Neoclassical Period", "text": "Known as 'a woman in a world of men' — Aphra Behn was the Restoration period's first female poet/writer, who had the courage to take up writing as a profession after overcoming long-standing obstacles/prejudice. Famous work: The Rover (a comedy); Oroonoko (prose fiction).", "id": "a41"}, {"name": "George Farquhar", "dates": null, "period": "The Neoclassical Period", "text": "Famous works: The Recruiting Officer; The Beaux' Stratagem.", "id": "a42"}, {"name": "Alexander Pope", "dates": "1688-1744", "period": "The Neoclassical Period", "text": "(1688-1744). Title: Mock Heroic Poet — famous for mock-heroic epic. Also famous for his 'Translation of Homer' — he translated the Greek poet Homer's Iliad and Odyssey into English (though George Chapman had earlier translated these two epics in the Renaissance period). The Oxford Dictionary of Quotations contains more quotations from Pope's writing than from any writer except Shakespeare. He used the Heroic Couplet in his poetry. Famous mock-epic: The Rape of the Lock (hero Baron, heroine Belinda, god Ariel) — written in 1712, its central subject is quarrels among the upper class; Henry Fielding wrote a play called Rape Upon Rape. Famous poems: An Essay on Man (theme: 'To vindicate the ways of God to man'; Dr. Muhammad Shahidullah wrote a related 'Essay on Islam'); The Dunciad; An Essay on Criticism (1711); Epistle to Dr. Arbuthnot. Famous quotes: 'A little learning is a dangerous thing'; 'To err is human, to forgive divine'; 'An honest man's the noblest work of God'; 'The proper study of mankind is man'; 'Charms strike the sight, but merit wins the soul' (also rendered 'merit strikes the heart'); 'Hope springs eternal in the human breast'; 'Fools rush in where angels fear to tread.'", "id": "a43"}, {"name": "Jonathan Swift", "dates": "1667-1745", "period": "The Neoclassical Period", "text": "(1667-1745). Title: The greatest satirist of the 18th century. Famous novels: Gulliver's Travels (4 books/parts — Part I: A Voyage to Lilliput; Part II: A Voyage to Brobdingnag; Part III: A Voyage to Laputa, Balnibarbi, Luggnagg, Glubbdubdrib and Japan; Part IV: A Voyage to the Country of the Houyhnhnms), considered the best satire of the 18th century; for Part IV he is called a Misanthropist; the book has never been out of print. Other works: A Tale of a Tub; A Modest Proposal; A Journey to Stella; The Battle of the Books (a pamphlet).", "id": "a44"}, {"name": "Daniel Defoe", "dates": "1660-1731", "period": "The Neoclassical Period", "text": "(1660-1731). Imprisoned for 7 years after England's 1688 revolution. Famous satirical poem: The True Born English Man. Famous novels: Robinson Crusoe (called the first realistic fiction in English); Colonel Jack; Captain Singleton; Moll Flanders. Famous quotes: 'He is not poor that has little, but he that desires much'; 'Today we love what tomorrow we hate; today we seek what tomorrow we shun; today we desire what tomorrow we fear'; 'The fear of danger is ten thousand times more terrifying than danger itself.'", "id": "a45"}, {"name": "Samuel Richardson", "dates": "1689-1761", "period": "The Neoclassical Period", "text": "(1689-1761). Famous novels: Pamela, or Virtue Rewarded (published 1740, considered by many the first true novel in English); The History of Sir Charles Grandison; Clarissa (1748) — Samuel Johnson called it 'the first book in the world for the knowledge it displays of the human heart'.", "id": "a46"}, {"name": "Joseph Addison and Richard Steele", "dates": null, "period": "The Neoclassical Period", "text": "Literary collaborators, jointly known as 'Addison & Steele'; both famous essayists. Joint prose works: The Spectator; The Tatler. Famous comedy by Addison: The Drummer.", "id": "a47"}, {"name": "Dr. Samuel Johnson", "dates": "1709-1784", "period": "The Neoclassical Period", "text": "(1709-1784). Titles: Father of English Dictionary, Shakespeare's Critic, First Lexicographer in English. He compiled the first English Dictionary in 1755, containing about 40,000 words with illustrative examples. Famous books: A Preface to Shakespeare (literary criticism of Shakespeare's merits and demerits); Rasselas: Prince of Abissinia (a novel); Life of the English Poets (one of English literature's finest works of literary biography). Famous poem: The Vanity of Human Wishes. He called William Shakespeare the 'Poet of Human Nature', and described Samuel Richardson's Clarissa as 'the first book in the world for the knowledge it displays of the human heart'. (Reminder: John Dryden wrote 'Preface to the Fables'; William Wordsworth wrote 'Preface to the Lyrical Ballads'.)", "id": "a48"}, {"name": "Goethe", "dates": null, "period": "The Neoclassical Period", "text": "(1749-1832). Born in Frankfurt, Germany, 28 August 1749. The greatest/national poet of Germany. Famous dramatic poem: Faust. Famous novel: The Sorrows of Young Werther (autobiographical). Quote: 'Man errs so long as he strives.'", "id": "a49"}, {"name": "Henry Fielding", "dates": "1707-1754", "period": "The Neoclassical Period", "text": "(1707-1754). Many consider him the Father of English Novel (though critics also credit Daniel Defoe, Samuel Richardson and Jonathan Swift jointly for their contributions). Famous for the Picaresque Novel (whose hero is typically a rogue/vagabond). His pen name was Captain Hercules Vinegar. Famous plays: The Tragedy of Tragedies; The Temple Beau; The Modern Husband; The Mock Doctor; The Miser; Rape Upon Rape (a response to Alexander Pope's The Rape of the Lock). Famous novels: Tom Jones; Amelia; Joseph Andrews (full title The History of the Adventures of Joseph Andrews).", "id": "a50"}, {"name": "Oliver Goldsmith", "dates": "1728-1774", "period": "The Neoclassical Period", "text": "(1728-1774). A famous Anglo-Irish novelist, playwright and poet. Famous books/poems: The Citizen of the World (a series of letters); The Vicar of Wakefield (a satiric novel); The Deserted Village (poem); The Good Natur'd Man (comedy); She Stoops to Conquer (comedy); The Traveller (a philosophical poem); An Elegy on the Death of a Mad Dog (an ironic poem); The Hermit (poem, a romantic ballad). Quote: 'Handsome is that handsome does.'", "id": "a51"}, {"name": "Thomas Gray", "dates": "1716-1771", "period": "The Neoclassical Period", "text": "(1716-1771). Known as the 'Graveyard poet'. In 1757 he was offered the position of Poet Laureate but declined it. Famous elegy: Elegy Written in a Country Churchyard (written on the death of common villagers/humble folk). Famous poem: Ode on the Death of a Favourite Cat. Famous quotes: 'Full many a flower is born to blush unseen, and waste its sweetness on the desert air' (Elegy Written in a Country Churchyard); 'Where ignorance is bliss, 'tis folly to be wise'; 'The paths of glory lead but to the grave.'", "id": "a52"}, {"name": "Edmund Burke", "dates": null, "period": "The Neoclassical Period", "text": "(12 January 1729 – 9 July 1797). A famous essayist, orator and politician of the 18th century, an Irish-born 'Whig politician' who served for many years as an MP for the British Whig party in the House of Commons. He supported the American colonies in their dispute with King George III, and was a fierce opponent of the French Revolution. Famous speeches: Speech on Conciliation with America (1775); Speech on Mr. Fox's East India Bill (about British tyranny/oppression in the Indian subcontinent); On American Taxation. Famous book: Reflections on the Revolution in France (a fierce criticism of the French Revolution). Famous quotes: 'The greater the power, the more dangerous the abuse'; 'Superstition is the religion of feeble minds'; 'Fear is the mother of safety'; 'Power and authority are sometimes bought by kindness.'", "id": "a53"}, {"name": "Edward Gibbon", "dates": "1737-1794", "period": "The Neoclassical Period", "text": "(1737-1794). A historian and British MP. Famous historical book: The Decline and Fall of the Roman Empire (in 6 volumes; recognised as one of the greatest history books ever written in English).", "id": "a54"}, {"name": "Lindley Murray", "dates": "1745-1826", "period": "The Neoclassical Period", "text": "(1745-1826). Title: Father of English Grammar. Wrote his famous English Grammar book in 1794.", "id": "a55"}, {"name": "Herasim Lebedeff", "dates": null, "period": "The Neoclassical Period", "text": "Gerasim Lebedev, also spelled Herasim Lebedeff (1749-1817), was a Russian adventurer, linguist, pioneer of Bengali theatre (he founded the Hindu Theatre / Bengally Theatre in Calcutta in 1795), translator, musician and writer, and a pioneer of Indology. He staged two plays, The Disguise and Love is the Best Doctor, translated and performed by native actors.", "id": "a56"}, {"name": "Sir Walter Scott", "dates": "1771-1832", "period": "The Neoclassical Period", "text": "(1771-1832). A famous Scottish writer of historical novels, and a poet. Title: Father of the Regional and Historical Novel. In Bengal, Bankim Chandra Chattopadhyay is called the 'Scott of Bengal'. His finest (historical) novel: Ivanhoe. Famous works: Patriotism (the Victorian poet Robert Browning wrote a different famous poem called 'The Patriot'); The Lady of the Lake (poem); Waverley (his first, once-anonymous novel — his subsequent novels are called his 'Waverley novels'); Talisman (poem).", "id": "a57"}, {"name": "Herold J Laski", "dates": null, "period": "The Neoclassical Period", "text": "Harold J. Laski. Book: A Grammar of Politics. Quotes: 'Law is above the state'; 'Democracy is the rule of the poor, ignorant and unfit.'", "id": "a58"}, {"name": "Adam Smith", "dates": null, "period": "The Neoclassical Period", "text": "(born Scotland; 1723-1790). Title: Father of Economics / Classical Economics. Proponent of the 'laissez-faire' policy and the theory of the 'division of labour'. A Scottish moral philosopher, pioneer of political economy, and a key figure of the Scottish Enlightenment. Best known for two classic works: The Theory of Moral Sentiments (1759) and An Inquiry into the Nature and Causes of the Wealth of Nations (1776) — the first full-scale economics book, ranked among the 100 best Scottish books of all time in 2005. (Note: the modern 'father of economics' is often instead said to be Paul Samuelson, who won the Nobel Prize in Economics in 1970.)", "id": "a59"}, {"name": "William Carey", "dates": null, "period": "The Neoclassical Period", "text": "(1761-1834). A British missionary, a Particular Baptist minister, translator, and activist; known as the 'father of modern missions'. He opened the first university offering degrees in India, at Serampore. He translated the Bible into Bengali, Oriya, Assamese, Arabic, Hindi and Sanskrit, and wrote 'Grammar of the Bengalee Language' (English text) in 1801.", "id": "a60"}, {"name": "Rousseau", "dates": null, "period": "The Neoclassical Period", "text": "Jean-Jacques Rousseau. A French philosopher (though born in Switzerland). A pioneer/forerunner of the French Revolution; his doctrine of 'Liberty, Equality, Fraternity' inspired the Revolution. Famous books: The Social Contract; Emile, or On Education; Julie; Discourse on the Origin and Foundation of Inequality. Quotes: 'Man is born free, but everywhere he is in chains'; 'Patience is bitter, but its fruit is sweet.'", "id": "a61"}, {"name": "Voltaire", "dates": null, "period": "The Neoclassical Period", "text": "Full name Francois-Marie Arouet (Voltaire is his pen name). Born in Paris, France, in 1694; a writer, playwright and philosopher, famous for advocating civil liberties including freedom of religion and a fair judiciary. Famous books: Candide (a satirical novel — G.B. Shaw wrote an unrelated famous play called 'Candida'); Zaire; Essays on Morals; Spirit of Nations. Quotes: 'Prejudice is the reason of fools'; 'If God did not exist, it would be necessary to invent Him'; 'I disapprove of what you say, but I will defend to the death your right to say it.'", "id": "a62"}, {"name": "William Wordsworth", "dates": "1770-1850", "period": "The Romantic Period", "text": "(1770-1850) Poet of Poet of Childhood Lake Poet Believer in Pantheism Father of Romantic Age Pantheist Everything is God Monotheist Everything is He became a Poet Laureate in 1839. (Poet Laureate poet of England; Oxford Doctor of Civil Wordsworth The Borderers The Prelude Poetic Autobiography Famous book of poems Lyrical Ballads - Wordsworth Coleridge Famous poems of The Daffodils wondered lonely as a Simile The of using the or as known to Daffodil Nature a healing to a heart. Tintern Abbey Tintern of 1560 Westminister The Solitary Reaper on Immortality Michael Written in March Revolution and Independence Rainbow Rainbow novel Modern Period The Excursion Lucy Poems Lucy is a of five poems an", "id": "a63"}, {"name": "S.T. Coleridge", "dates": "1772-1834", "period": "The Romantic Period", "text": "Samuel Taylor Coleridge (1772-1834). Title: Poet of Supernaturalism. Bosom friend and literary collaborator of Wordsworth. Addicted to opium. Famous book: Biographia Literaria (a critical work). Reading his poetry produces in the reader a 'willing suspension of disbelief'. Coleridge said of John Keats: 'Keats was a Greek.' Famous poems: The Rime of the Ancient Mariner (features an Albatross); Kubla Khan (an unfinished 'dream poem' — Coleridge dreamed it after reading a description of the Mongol ruler/Chinese emperor Kublai Khan's summer palace, having fallen asleep under the influence of opium); Dejection: An Ode; Christabel. Famous quotes from The Rime of the Ancient Mariner: 'Water, water, every where, nor any drop to drink'; 'Alone, alone, all, all alone, alone on a wide, wide sea' (an example of assonance); 'He prayeth best, who loveth best, all things both great and small.'", "id": "a64"}, {"name": "P.B. Shelley", "dates": "1792-1822", "period": "The Romantic Period", "text": "Percy Bysshe Shelley (1792-1822). Titles: Revolutionary Poet, Lyrical Poet/Poet of Wind, Poet of Hope and Regeneration. Expelled from Oxford University for atheism. He greatly admired Keats and always carried Keats's poems with him. Drowned while crossing the Adriatic Sea at age 30 (1822); his unfinished work is The Triumph of Life. Bengali poet Jibanananda Das is often called 'the Shelley of Bangladesh'. Famous books: The Revolt of Islam (Syed Ameer Ali wrote an unrelated book called The Spirit of Islam); A Defence of Poetry (literary criticism); The Necessity of Atheism (the pamphlet that got him expelled from Oxford); Prometheus Unbound (a four-act play/tragedy — note: Aeschylus, called the Father of Greek tragedy, wrote 'Prometheus Bound' and 'Agamemnon'); Cenci (a tragedy); Adonais (an elegy on the death of Keats). Famous poems: Ode to the West Wind (calls the west wind 'destroyer and preserver'); Ode to a Skylark; The Cloud; Ozymandias (a famous sonnet, about the Pharaoh Ramses II); Queen Mab (his first long poem); Alastor (his 'autobiography' in verse); When Soft Voices Die (Victorian poet Tennyson wrote an unrelated poem 'Two Voices'); The Masque of Anarchy (Victorian poet Matthew Arnold wrote an unrelated 'Culture and Anarchy'). Famous quotes: 'If winter comes, can spring be far behind?' (Ode to the West Wind); 'Oh! lift me as a wave, a leaf, a cloud! I fall upon the thorns of life' (Ode to the West Wind); 'Poets are the unacknowledged legislators of the world'; 'We look before and after, and pine for what is not'; 'Fear not the future, weep not for the past'; 'My name is Ozymandias, king of kings' (an example of Irony); 'Our sweetest songs are those that tell of saddest thought' (Ode to a Skylark); 'The more we study, the more we discover our ignorance.' Note: Shelley's wife Mary Shelley wrote the world-famous novel Frankenstein, or The Modern Prometheus, published 1818, inspired by Shelley and Byron — about how, if humans become reckless, their creations may destroy them.", "id": "a65"}, {"name": "John Keats", "dates": "1795-1821", "period": "The Romantic Period", "text": "(1795-1821). Titles: Poet of Beauty, Poet of Sensuousness (his poetry awakens all five senses in the reader), 'a death-hunted poet', the youngest poet of English literature. Also a physician, surgeon and doctor by training. His poetic career lasted only about 5 years. Features of his poetry: Escapism, Negative Capability, Hellenism. Died of tuberculosis at age 26 in Rome, Italy. Unlike Coleridge, Keats used opium but was not addicted. Famous books of poems: Endymion; Hyperion; Lamia. Famous sonnet: On First Looking into Chapman's Homer (Chapman was the Renaissance-era translator of Homer's epics). Famous poems: Ode to a Nightingale; Ode on a Grecian Urn (an ancient Greek sculpture/vase); Ode to Autumn; Ode on Melancholy; Ode to Psyche; Ode to Fancy; Isabella. Famous quotes: 'Beauty is truth, truth beauty' (Ode on a Grecian Urn); 'A thing of beauty is a joy forever' (Endymion); 'Heard melodies are sweet, but those unheard are sweeter' (Ode on a Grecian Urn); 'My heart aches, and a drowsy numbness pains my sense, as though of hemlock I had drunk' (Ode to a Nightingale); 'If poetry comes not as naturally as the leaves to a tree it had better not come at all.' (Note: the Egyptian singer Umm Kulthum is called the 'Nightingale of Arabia'; the Indian poet Sarojini Naidu is called the 'Nightingale of India'; the Italian nurse Florence Nightingale's title is 'Lady with the Lamp'.)", "id": "a66"}, {"name": "William Blake", "dates": "1757-1827", "period": "The Romantic Period", "text": "(1757-1827). Both a poet and a painter. He began writing during the Neo-classical period, so many consider him a Neo-classical writer. Books of poems: Songs of Innocence; Songs of Experience (Pakistan's Fatima Bhutto wrote an unrelated book, Songs of Blood and Sword); Milton: A Poem (Milton himself wrote an unrelated elegy called 'On Shakespeare'). Famous book: Marriage of Heaven and Hell (a theological work). Famous quotes: 'The road of excess leads to the palace of wisdom'; 'All pray in their distress'; 'Little Lamb, who made thee?'; 'It is easier to forgive an enemy than to forgive a friend.'", "id": "a67"}, {"name": "Charles Lamb", "dates": "1775-1834", "period": "The Romantic Period", "text": "(1775-1834). Never married. Also a famous essayist; wrote under the pen name 'Elia'. Famous books: The Essays of Elia; The Last Essays of Elia; Tales from Shakespeare (a children's book, co-written with his sister Mary Lamb, 1807). Famous poem: The Old Familiar Faces.", "id": "a68"}, {"name": "William Hazlitt", "dates": null, "period": "The Romantic Period", "text": "A famous critic and essayist. On the Romantic age he wrote: 'It was a time of promise, a renewal of the world and of letters.' Books: The Spirit of the Age; The Dramatic Literature of the Age of Elizabeth. Quotes: 'Poverty is the test of civility and the touchstone of friendship'; 'Prejudice is the child of ignorance.' (Other famous books with 'Spirit' in the title: The Spirit of Islam by Sir Syed Ameer Ali; Spirit of Nations by Voltaire; The Spirit of Capitalism by Max Weber, who is called the father of sociology, and whose other book is The Protestant Ethic [and the Spirit of Capitalism].)", "id": "a69"}, {"name": "Lord Byron", "dates": "1788-1824", "period": "The Romantic Period", "text": "George Gordon, Lord Byron (1788-1824). Died at 36 of a fever in Missolonghi, Greece. Title: Rebel Poet (Kazi Nazrul Islam is called the rebel poet of Bengali literature). He suffered from bipolar disorder and manic depression. He took part in the Greek war of independence against the Ottoman Empire, and the Greeks regard him as a national hero. Famous books: The Vision of Judgement; Hours of Idleness; Heaven and Earth. Famous poem: Childe Harold's Pilgrimage. Famous epic: Don Juan — an epic satire (characters include Don Alfonso, Don Juan, Donna Julia). Famous lyric: 'She Walks in Beauty'. Famous quotes: \"Man's love is of man's life a thing apart, 'tis woman's whole existence\" (Don Juan); 'Revenge is sweet, especially to women'; 'Man's conscience is the oracle of God.' Note: Cambridge mathematics professor Charles Babbage designed the Difference Engine (1822) and Analytical Engine (1833), forerunners of the modern computer; his daughter, Byron's daughter Lady Ada Augusta Lovelace, wrote the software for the Analytical Engine and is considered the world's first computer programmer (the programming language Ada is named after her; Bangladesh's first computer programmer is Hanif Uddin Miah).", "id": "a70"}, {"name": "Alexander Pushkin", "dates": "1799-1837", "period": "The Romantic Period", "text": "(1799-1837). Titles: Father of Modern Russian Literature, National Poet of Russia. Famous works: Boris Godunov (a novel); Eugene Onegin (a novel in verse).", "id": "a71"}, {"name": "Lord Alfred Tennyson", "dates": null, "period": "The Victorian Period", "text": "(1809-1892). Became Poet Laureate of England in 1850, after Wordsworth's death. A representative/lyric poet of the Victorian age; taught at Cambridge University. He called William Shakespeare the 'Dazzling Sun'. Famous elegy: In Memoriam (written on the death of his friend Arthur Henry Hallam). Famous comedies: The Falcon; Queen Mary (note: Queen Mab is a famous poem by Shelley, not related); Harold. Famous poems: Oenone (Oenone was daughter of the River-God); Ulysses (a Greek hero — James Joyce wrote an unrelated famous novel also called Ulysses); Lotus Eaters; The Lady of Shalott (note: 'The Lady of the Lake' is a different, famous poem by the Neoclassical-era novelist Sir Walter Scott); Locksley Hall (heroine: Amy); Tears, Idle Tears; Tithonus (a mortal man who was married to the goddess of dawn, Aurora); The Two Voices; Vision of Sin; The Charge of the Light Brigade; The Lover's Tale; Morte D'Arthur (a poem about the legendary King Arthur, featuring the sword Excalibur — note: Sir Thomas Malory of the Middle English period wrote a famous prose work also called Morte D'Arthur). Famous quotes: 'Sorrows are the best educator'; 'A man can see farther through a tear than through a telescope'; 'The old order changeth, yielding place to new' (Morte D'Arthur); 'I will drink life to the lees' (Ulysses); 'Authority forgets a dying king' (Morte D'Arthur); 'More things are wrought by prayer' (Morte D'Arthur); 'Death is the end of life; ah, why should life all labour be?' (Lotus Eaters); 'Knowledge comes, but wisdom lingers' (Locksley Hall); 'Tis better to have loved and lost than never to have loved at all' (In Memoriam); 'Who are wise in love, love most, say least.'", "id": "a72"}, {"name": "Robert Browning", "dates": "1812-1889", "period": "The Victorian Period", "text": "(1812-1889). A famous poet, playwright, and 'psycho-analyst' of the Victorian period. His wife was the famous poet Elizabeth Barrett Browning. He said, 'Italy was my university.' He greatly admired the poet P.B. Shelley. Famous for the Dramatic Monologue (a poem with a single speaker and one or more silent listeners). In Bengali literature the finest dramatic monologue is the poet Jasimuddin's 'Kabar' ('The Grave'). Books of poems: Men and Women; Dramatic Lyrics; The Ring of the Book. Famous poems: My Last Duchess; Andrea del Sarto; Porphyria's Lover; A Grammarian's Funeral; Home Thoughts from Abroad (a political poem); Rabbi Ben Ezra (a Jewish scholar — a Jewish clergyman is called a 'Rabbi'); Fra Lippo Lippi; The Pied Piper of Hamelin; The Patriot (note: 'Patriotism' is a different poem by Sir Walter Scott); The Ring and the Book (an epic poem). Famous quotes: 'Ignorance is not innocence but sin' (The Inn Album); 'So absolutely good is truth, truth never hurts the teller'; 'Oppression makes the wise man mad'; 'God's in His heaven — all's right with the world.'", "id": "a73"}, {"name": "Matthew Arnold", "dates": null, "period": "The Victorian Period", "text": "(1822-1888). Title: Melancholic / Elegiac poet (in Bengali literature Jatindranath Sengupta is called a similarly melancholic/pessimist poet). Served as Oxford's Professor of Poetry for 5 years; also a critic and essayist. Famous books: The Study of Poetry (literary criticism); Literature and Dogma; Culture and Anarchy; Essays in Criticism. Famous elegies: Thyrsis (on the death of his friend Arthur Clough); Rugby Chapel (on the death of his father); Heine's Grave (on the death of his brother — 'Heine'). Famous poems: Dover Beach (Dover is a strait/coast separating England and France); The Scholar Gypsy; Sohrab and Rustum; Cromwell. Famous quotes: 'Truth sits upon the lips of dying men'; 'Poetry is the criticism of life'; 'The Sea of Faith was once, too, at the full' (Dover Beach).", "id": "a74"}, {"name": "Charles Dickens", "dates": "1812-1870", "period": "The Victorian Period", "text": "(1812-1870). Called the greatest novelist of the Victorian Period. His first book: Sketches by Boz. Famous novels: David Copperfield (a largely autobiographical novel — about an orphaned child, David Copperfield, growing up and the cruel torment of a harsh stepfather); Oliver Twist (the hardship of a young boy's life); Great Expectations (central characters Pip, Estella, Miss Havisham — the story of an English boy named Pip growing up); A Tale of Two Cities (two cities — London and Paris — set against the backdrop of the French Revolution; note: Jonathan Swift wrote a different work called A Tale of a Tub); A Christmas Carol; The Bleak House; The Old Curiosity Shop; The Pickwick Papers; Hard Times (a depiction of the social and economic instability of contemporary England); Our Mutual Friend; The Mystery of Edwin Drood (an unfinished n
