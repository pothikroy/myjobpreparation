er", "d": "Charles Dickens"}, "answer": "c", "source": null, "id": "q3"}, {"period": "Old English–Renaissance", "q": "Who is the father of Modern English Poetry?", "options": {"a": "Cynewulf", "b": "Geoffrey Chaucer", "c": "Robert Browning", "d": "None of the above"}, "answer": "b", "source": null, "id": "q4"}, {"period": "Old English–Renaissance", "q": "'The Canterbury Tales' are told by-", "options": {"a": "Geoffrey Chaucer", "b": "John Wycliffe", "c": "Boccaccio", "d": "Thomas Barth"}, "answer": "a", "source": null, "id": "q5"}, {"period": "Old English–Renaissance", "q": "The Canterbury Tales is as alive and---today as it was nearly 600 years ago.", "options": {"a": "appealing", "b": "fruitful", "c": "repelling", "d": "enhanting"}, "answer": "a", "source": null, "id": "q6"}, {"period": "Old English–Renaissance", "q": "Geoffrey Chaucer wrote—", "options": {"a": "Canterbury Tales", "b": "Piers Plowman", "c": "Morte d‘ Arthur", "d": "The Maid‘s Tragedy"}, "answer": "a", "source": null, "id": "q7"}, {"period": "Old English–Renaissance", "q": "Who is considered to be the father of English Poem?", "options": {"a": "William Langland", "b": "Thomas Moore", "c": "Rozer Bacon", "d": "Geoffrey Chaucer"}, "answer": "d", "source": null, "id": "q8"}, {"period": "Old English–Renaissance", "q": "Who translated the Bible into English for the first time?", "options": {"a": "Nicolas Udall", "b": "Thomas Norton", "c": "John Wycliffe", "d": "Edmund Spenser"}, "answer": "c", "source": null, "id": "q9"}, {"period": "Old English–Renaissance", "q": "Who translated 'The New Testament'?", "options": {"a": "Langland", "b": "John Wycliffe", "c": "Layaman", "d": "Touci"}, "answer": "b", "source": null, "id": "q10"}, {"period": "Old English–Renaissance", "q": "'Renaissance' means—", "options": {"a": "regain", "b": "reborn", "c": "re-arrange", "d": "rebirth"}, "answer": "d", "source": null, "id": "q11"}, {"period": "Old English–Renaissance", "q": "'Renaissance' means —", "options": {"a": "the revival of learning", "b": "the revival of hard task", "c": "the revival of life", "d": "the revival of new country"}, "answer": "a", "source": null, "id": "q12"}, {"period": "Old English–Renaissance", "q": "The beginning of the Renaissance may be traced to the city of—", "options": {"a": "Venice", "b": "London", "c": "Paris", "d": "Florence"}, "answer": "d", "source": null, "id": "q13"}, {"period": "Old English–Renaissance", "q": "Renaissance is — word.", "options": {"a": "an Italian", "b": "a Russian", "c": "a European", "d": "a French"}, "answer": "a", "source": null, "id": "q14"}, {"period": "Old English–Renaissance", "q": "Where did the Renaissance start from?", "options": {"a": "England", "b": "Germany", "c": "Italy", "d": "U.S.A"}, "answer": "c", "source": null, "id": "q15"}, {"period": "Old English–Renaissance", "q": "Who is the 'University Wits' in the following list?", "options": {"a": "William Shakespeare", "b": "Thomas Gray", "c": "Robert Greene", "d": "John Dryden"}, "answer": "c", "source": null, "id": "q16"}, {"period": "Old English–Renaissance", "q": "Elizabethan tragedy is centred on-", "options": {"a": "love", "b": "war", "c": "revenge", "d": "philosophy"}, "answer": "c", "source": null, "id": "q17"}, {"period": "Old English–Renaissance", "q": "Which period is known as 'the golden age' of English Literature?", "options": {"a": "the Victorian age", "b": "the Eighteenth century", "c": "the Restoration", "d": "the Elizabethan Age"}, "answer": "d", "source": null, "id": "q18"}, {"period": "Old English–Renaissance", "q": "Who wrote the plays 'The Tempest' and 'The Mid Summer Night's Dream'?", "options": {"a": "Ben Jonson", "b": "Christopher Marlowe", "c": "John Dryden", "d": "William Shakespeare"}, "answer": "d", "source": "29th BCS", "id": "q19"}, {"period": "Old English–Renaissance", "q": "Julius Caesar was the ruler of Rome about—", "options": {"a": "1000 years ago", "b": "1500 years ago", "c": "2000 years ago", "d": "3000 years ago"}, "answer": "c", "source": "28th BCS", "id": "q20"}, {"period": "Old English–Renaissance", "q": "Shakespeare is known mostly for his-", "options": {"a": "poetry", "b": "novels", "c": "autobiography", "d": "plays"}, "answer": "d", "source": null, "id": "q21"}, {"period": "Old English–Renaissance", "q": "Which of the following is a play by Shakespeare —", "options": {"a": "King Lear", "b": "The Duchess of Malfi", "c": "Candida", "d": "Waiting for Godot"}, "answer": "a", "source": null, "id": "q22"}, {"period": "Old English–Renaissance", "q": "William Shakespeare was an English dramatist and poet of the- ---- century.", "options": {"a": "fifteenth", "b": "sixteenth", "c": "fourteenth", "d": "seventeenth"}, "answer": "b", "source": null, "id": "q23"}, {"period": "Old English–Renaissance", "q": "Which of the following plays is by William Shakespeare?", "options": {"a": "Desire Under the Elms", "b": "Measure for Measure", "c": "Pygmalion", "d": "Cocktail Party"}, "answer": "b", "source": null, "id": "q24"}, {"period": "Old English–Renaissance", "q": "'Shakespeare' is the writer of—", "options": {"a": "The Tempest", "b": "The Idea of University", "c": "The Hairy Ape", "d": "Riders to the Sea"}, "answer": "a", "source": null, "id": "q25"}, {"period": "Old English–Renaissance", "q": "A sonnet is a lyric poem of—", "options": {"a": "12 lines", "b": "24 lines", "c": "14 lines", "d": "10 lines"}, "answer": "c", "source": null, "id": "q26"}, {"period": "Old English–Renaissance", "q": "William Shakespeare is the author of—", "options": {"a": "Pride and Prejudice", "b": "Waiting for Godot", "c": "Sound of Music", "d": "King Lear"}, "answer": "d", "source": null, "id": "q27"}, {"period": "Old English–Renaissance", "q": "“Twelfth Night” is—", "options": {"a": "a comedy", "b": "an elegy", "c": "a novel", "d": "a tragedy"}, "answer": "a", "source": null, "id": "q28"}, {"period": "Old English–Renaissance", "q": "Which book is a Tragedy?", "options": {"a": "Hamlet", "b": "Measure for Measure", "c": "As : "Modern & Post-Modern Periods", "q": "Lines of a song or a poem repeated at the end of each verse is called a-", "options": {"a": "simile", "b": "metaphor", "c": "quatrain", "d": "refrain"}, "answer": "d", "source": null, "id": "q587"}, {"period": "Modern & Post-Modern Periods", "q": "A 'dirge' is a song to be sung at --", "options": {"a": "weddings", "b": "reunions", "c": "funerals", "d": "temples"}, "answer": "c", "source": null, "id": "q588"}, {"period": "Modern & Post-Modern Periods", "q": "A funny imitation of a poem__", "options": {"a": "Counterfeit", "b": "Sonnet", "c": "Caricature", "d": "Parody"}, "answer": "d", "source": null, "id": "q589"}, {"period": "Modern & Post-Modern Periods", "q": "A story, with animals as the main characters, and a moral, is called a__", "options": {"a": "legend", "b": "fiction", "c": "parody", "d": "fable"}, "answer": "d", "source": null, "id": "q590"}, {"period": "Modern & Post-Modern Periods", "q": "'Myth' means __.", "options": {"a": "The story of the old time heroes", "b": "The story of the civilization", "c": "The story the childhood", "d": "the story of the ancient history"}, "answer": "d", "source": null, "id": "q591"}, {"period": "Modern & Post-Modern Periods", "q": "Mythology is the study of various beliefs about__", "options": {"a": "monsters and fairies", "b": "kings and queens", "c": "gods and goddesses", "d": "knights and acquires"}, "answer": "c", "source": null, "id": "q592"}, {"period": "Modern & Post-Modern Periods", "q": "'Poetic Licence' means", "options": {"a": "freedom to write poetry", "b": "freedom to read poetry", "d": "doing what one likes"}, "answer": "c", "source": null, "id": "q593"}, {"period": "Modern & Post-Modern Periods", "q": "Guy de Maupassant is a famous_shory writer.", "options": {"a": "French", "b": "Italian", "c": "German", "d": "Russian"}, "answer": "a", "source": null, "id": "q594"}, {"period": "Modern & Post-Modern Periods", "q": "Earnest Hemingway is a famous -", "options": {"a": "British novelist", "b": "Irish novelist", "c": "American novelist", "d": "Latin American novelist"}, "answer": "c", "source": null, "id": "q595"}, {"period": "Modern & Post-Modern Periods", "q": "\"Langston Hughes\" is-", "options": {"a": "Russian poet", "b": "British poet", "c": "American poet", "d": "Rumanian poet"}, "answer": "c", "source": null, "id": "q596"}, {"period": "Modern & Post-Modern Periods", "q": "Of the following authors, one is American. Who is he?", "options": {"a": "Alexander Pope", "b": "Daniel Defoe", "c": "William Faulkner", "d": "Robert Browning"}, "answer": "c", "source": null, "id": "q597"}, {"period": "Modern & Post-Modern Periods", "q": "Among the following who is not a poet?", "options": {"a": "Matthew Arnold", "b": "Robert Frost", "c": "John Donne", "d": "Doris Lessing"}, "answer": "d", "source": null, "id": "q598"}, {"period": "Modern & Post-Modern Periods", "q": "Among the following who is not a novelist?", "options": {"a": "Hardy", "b": "Joyce", "c": "Thackeray", "d": "Blake"}, "answer": "d", "source": null, "id": "q599"}, {"period": "Modern & Post-Modern Periods", "q": "Who is regarded as the 'Father of the Science Fiction'?", "options": {"a": "Isaac Asimov", "b": "Jules Verne", "c": "H.G. Wells", "d": "Arthur C.Clarke"}, "answer": "b", "source": null, "id": "q600"}, {"period": "Modern & Post-Modern Periods", "q": "The only medium of literature is -", "options": {"a": "language", "b": "painting", "c": "sculptor", "d": "architecture"}, "answer": "a", "source": null, "id": "q601"}, {"period": "Modern & Post-Modern Periods", "q": "What is the salient feature of all literatures?", "options": {"a": "Artistic quality", "b": "Sensuous quality", "c": "Joyous/Suggestive quality", "d": "Reflective quality"}, "answer": "a", "source": null, "id": "q602"}, {"period": "Modern & Post-Modern Periods", "q": "Which of the Bronte sisters wrote Jane Eyre ?", "options": {"a": "Anne", "b": "Charlotte", "c": "Emily", "d": "Louise"}, "answer": "b", "source": null, "id": "q603"}, {"period": "Modern & Post-Modern Periods", "q": "Virginia Woolf was a contemporary of__", "options": {"a": "Jane Austen", "b": "Arnold", "c": "Browning", "d": "Joyce"}, "answer": "d", "source": null, "id": "q604"}, {"period": "Modern & Post-Modern Periods", "q": "Who is known as an \"Icon of peace and reconciliation\" ?", "options": {"a": "Malala Yousafzai", "b": "Dr. Muhammad Yunus", "c": "Nelson Mandela", "d": "Kailash Satyarthi"}, "answer": "c", "source": null, "id": "q605"}, {"period": "Modern & Post-Modern Periods", "q": "Who was not awarded the Nobel Prize?", "options": {"a": "John Galsworthy", "b": "Orhan Pamuk", "c": "Winston Churchill", "d": "Elizabeth Barrett"}, "answer": "d", "source": null, "id": "q606"}, {"period": "Modern & Post-Modern Periods", "q": "A senator and a poet who won the Nobel prize for literature was __", "options": {"a": "Winston Churchill", "b": "Matthew Arnold", "c": "J M Synge", "d": "W.B. Yeats"}, "answer": "d", "source": null, "id": "q607"}, {"period": "Modern & Post-Modern Periods", "q": "'Alice in Wonderland' is written by - Who is the author of Alice Adventures in Wonderland __", "options": {"a": "G.B. Shaw", "b": "Lewis Carrol", "c": "John Keats", "d": "P. B. Shelley"}, "answer": "b", "source": null, "id": "q608"}, {"period": "Modern & Post-Modern Periods", "q": "'Alice in Wonderland' belongs to -", "options": {"a": "detective literature", "b": "satirical literature", "c": "juvenile literature", "d": "religious literature"}, "answer": "c", "source": null, "id": "q609"}, {"period": "Modern & Post-Modern Periods", "q": "The book \"Glimpses of World History\" was written by-", "options": {"a": "Rabindranath Tagore", "b": "Carlyle", "c": "Jawaharlal Nehru", "d": "Karl Marx"}, "answer": "c", "source": null, "id": "q610"}, {"period": "Modern & Post-Modern Periods", "q": "Who is the author of Les Miserables?", "options": {"a": "Victor Hugo", "b": "Alexander Dumas", "c": "Emile Zola", "d": "Jean de La Fontaine"}, "answer": "a", "source": null, "id": "q611"}, {"period": "Modern & Post-Modern Periods", "q": "The epic 'Odyssey' was written by__", "options": {"a": "Milton", "b": "Tennyson", "c": "Homer", "d": "Shakespeare"}, "answer": "c", "source": null, "id": "q612"}, {"period": "Modern & Post-Modern Periods", "q": "The novel ‘Roots’ was written by__", "options": {"a": "Henry Miller", "b": "H.G. Wells", "c": "Alex Haley", "d": "P.B.Shelley"}, "answer": "c", "source": null, "id": "q613"}, {"period": "Modern & Post-Modern Periods", "q": "\"The dairy of a young girl\" is written by-", "options": {"a": "Otto Frank", "b": "James Frank", "c": "Anne Frank", "d": "Henry Frank"}, "answer": "c", "source": null, "id": "q614"}, {"period": "Modern & Post-Modern Periods", "q": "Who is the author of the novel 'The Trial’?", "options": {"a": "Ernest Hemingway", "b": "Leo Tolstoy", "c": "Gabriel Garica Marquez", "d": "Franz Kafka"}, "answer": "d", "source": null, "id": "q615"}, {"period": "Modern & Post-Modern Periods", "q": "A Thousand Splendid Suns is a novel written by__", "options": {"a": "Khaled Hosseini", "b": "Adeep Khan", "c": "Mawlana Jalal Uddin Rumi", "d": "Monsur Hallaj"}, "answer": "a", "source": null, "id": "q616"}, {"period": "Modern & Post-Modern Periods", "q": "Adela is a character in a novel written by-", "options": {"a": "Joseph Conrad", "b": "James Joyce", "c": "E.M.Forster", "d": "Bertrand Russell"}, "answer": "c", "source": null, "id": "q617"}, {"period": "Modern & Post-Modern Periods", "q": "\"Be You Ever So High, the Law is Above You\" G Dw³wU Kvi?", "options": {"a": "Justice Atkinson", "b": "Justice Marshal", "c": "Lord Denning", "d": "Justice Coke"}, "answer": "c", "source": null, "id": "q618"}, {"period": "Modern & Post-Modern Periods", "q": "Who authored the statement 'The government is the best which governs least'?", "options": {"a": "Herber Spencer", "b": "Harold Lasky", "c": "Henry David Thoreau", "d": "Alexander Pope"}, "answer": "c", "source": null, "id": "q619"}, {"period": "Modern & Post-Modern Periods", "q": "In the sentence, \"Death lays his icy hands on kings\", \"Death\" is an example of__.", "options": {"a": "symbolism", "b": "metaphor", "c": "hyperbole", "d": "personification"}, "answer": "d", "source": null, "id": "q620"}, {"period": "Modern & Post-Modern Periods", "q": "The technique of treating non-living things as humans is called-", "options": {"a": "Living", "b": "Description", "c": "Feeding", "d": "Personification"}, "answer": "d", "source": null, "id": "q621"}, {"period": "Modern & Post-Modern Periods", "q": "'Paradox' is ____", "options": {"a": "A statement which is false", "b": "A statement which is apparently self-contradictory", "c": "A statement which is apparently false", "d": "A statement which is apparently true"}, "answer": "b", "source": null, "id": "q622"}, {"period": "Modern & Post-Modern Periods", "q": "In the sentence \"The man is a mad dog.\" \"mad dog\" is an example of a/an-", "options": {"a": "simile", "b": "metaphor", "c": "assonance", "d": "alliteration"}, "answer": "b", "source": null, "id": "q623"}, {"period": "Modern & Post-Modern Periods", "q": "'Metaphor' is a word or phrase that is applied to an object or action to which it is not literally applicable. Which one is an example of metaphor?", "options": {"a": "He is the eternal summer", "b": "He is youthful and happy", "c": "Death will never touch him", "d": "He will live forever"}, "answer": "a", "source": null, "id": "q624"}, {"period": "Modern & Post-Modern Periods", "q": "Assonance refers to the repetition of similar vowel sounds. Which of the following is an example of assonance?", "options": {"a": "the rain in Spain falls", "b": "burning broom", "c": "cawing crow", "d": "buzzing bell"}, "answer": "a", "source": null, "id": "q625"}, {"period": "Modern & Post-Modern Periods", "q": "Apostrophe is an exclamatory addressing of imagianry person or abstract idea. Ans. a Which of the following is not an example of apostrophe?", "options": {"a": "Death! be not proud", "b": "Roll on thou dark deep ocean", "c": "Where, O Death! the sting?", "d": "Is Science a Daughter of Art"}, "answer": "a", "source": null, "id": "q626"}, {"period": "Modern & Post-Modern Periods", "q": "Oxymoron refers to a term made of two words that contradict each other. Which of the following is an example of oxymoron?", "options": {"a": "screaming bull", "b": "bluest eyes", "c": "big sleep", "d": "open sercret"}, "answer": "d", "source": null, "id": "q627"}, {"period": "Modern & Post-Modern Periods", "q": "A climax is -", "options": {"a": "a climbing apparatus", "b": "point of greatest intesity", "c": "a crisis in a drama", "d": "the latest scene in a drama"}, "answer": "c", "source": null, "id": "q628"}], "figures": [{"num": "1", "name": "Alliteration", "text": "The repetition of an initial consonant sound, put side by side. Examples: 'Sleepy sun sank slowly over the sea'; 'But a better butter makes a batter better'; 'A big bully beats a baby boy.' Bengali examples appear in Jibanananda Das and Rabindranath Tagore's poetry too.", "id": "f0"}, {"num": "2", "name": "Allegory", "text": "A story or picture with two or more different meanings — a literal meaning and one or more symbolic meanings. The setting, characters, and events inside an allegory are symbols for ideas or qualities. Examples in literature: Edmund Spenser's The Faerie Queene — the knights stand for various virtues. William Shakespeare's The Tempest — a fight between good and evil on a deserted island. John Bunyan's The Pilgrim's Progress — the journey of Christian and Evangelist symbolises the soul's ascension from earth to Heaven. Nathaniel Hawthorne's Young Goodman Brown — the Devil's Staff symbolises defiance of God, and the characters' names 'Goodman' and 'Faith' ironically serve as paradox in the story's conclusion. Nathaniel Hawthorne's The Scarlet Letter — the scarlet letter and characters are allegorical, representing ways of seeing the world. George Orwell's Animal Farm — the pigs stand for political figures of the Russian Revolution.", "id": "f1"}, {"num": "3", "name": "Allusion", "text": "A short mention of a famous historical or literary person or event; not confined to literature, fairly common in everyday speech. Examples: 'Don't act like a Romeo in front of her' — a reference to Shakespeare's Romeo, the passionate lover of Juliet. 'The rise in poverty will unlock the Pandora's box of crimes' — an allusion to Greek mythology's origin myth 'Pandora's box'. 'This place is like a Garden of Eden' — a biblical allusion to the Book of Genesis. 'Guess who the new Newton of our school is?' — alludes to the scientist Isaac Newton.", "id": "f2"}, {"num": "4", "name": "Anecdote", "text": "A short and humorous (or amusing but serious) story about a real event or person, which may depict a real or fictional incident or character. Example: a mother tells her son a story about a family vacation when she was growing up.", "id": "f3"}, {"num": "5", "name": "Anaphora", "text": "The repetition of the same word or phrase at the beginning of successive clauses or verses. Examples: 'Every day, every night, in every way, I am getting better and better'; 'My life is my purpose. My life is my goal. My life is my inspiration.'", "id": "f4"}, {"num": "6", "name": "Antithesis", "text": "The combination of contrasting ideas in balanced phrases; a rhetorical device in which two opposite ideas are put together in a sentence to achieve a contrasting effect. Common examples: 'Give every man thy ear, but few thy voice'; 'Man proposes, God disposes'; 'Speech is silver, but silence is gold'; 'Patience is bitter, but it has a sweet fruit.' Literary examples: Alexander Pope, 'An Essay on Criticism' — 'To err is human; to forgive divine.' Charles Dickens's A Tale of Two Cities opens with an unforgettable antithesis: 'It was the best of times, it was the worst of times...' (a portion of this passage was translated from English into Bengali in the 35th BCS written exam). Shakespeare's Julius Caesar — the antithetical characters of Mark Antony and Marcus Brutus (Brutus, 'noblest of Romans', loved Rome and Caesar; Antony is shown harming Caesar to take charge of Rome). John Milton's Paradise Lost — 'Better to reign in Hell, than serve in Heav'n.'", "id": "f5"}, {"num": "7", "name": "Apostrophe", "text": "Breaking off discourse to address some absent person or thing, some abstract quality, an inanimate object, or a nonexistent character. Examples: 'Oh! Lift me as a wave, a leaf, a cloud!' (P.B. Shelley); the nursery rhyme 'Twinkle, Twinkle, Little Star' by Jane Taylor, which addresses the star directly.", "id": "f6"}, {"num": "8", "name": "Assonance", "text": "The repetition of similar vowel sounds within nearby words, unlike alliteration which repeats consonant sounds. Common examples: 'We light fire on the mountain'; 'I feel depressed and restless'; 'Go and mow the lawn'; 'Alone, alone, all, all alone, alone on a wide, wide sea' (Coleridge, The Rime of the Ancient Mariner). William Wordsworth employs assonance to create internal rhyme in 'Daffodils': 'I wandered lonely as a cloud / That floats on high o'er vales and hills...'", "id": "f7"}, {"num": "9", "name": "Aside vs Soliloquy", "text": "An aside is a dramatic device in which a character speaks to the audience; by convention the audience realises the character's speech is unheard by the other characters on stage. It may be addressed to the audience expressly or represent an unspoken thought. Example: in Shakespeare's Macbeth, Macbeth's aside 'Time, thou anticipatest my dread exploits'; in Hamlet, 'A little more than kin, and less than kind.' A soliloquy is a device often used in drama when a character speaks to himself or herself, relating thoughts and feelings and thereby sharing them with the audience as a series of unspoken reflections; other characters, if present, keep silent and/or are disregarded by the speaker. Example: Hamlet's 'To be, or not to be, that is the question... the slings and arrows of outrageous fortune...' — the most famous soliloquy in Shakespeare's Hamlet.", "id": "f8"}, {"num": "10", "name": "Blank Verse", "text": "A poem with no rhyme but which does have iambic pentameter — lines of five feet, each foot being iambic (one unstressed syllable followed by one stressed syllable). Michael Madhusudan Dutt is the pioneer of the corresponding unrhymed metre (Amitrakkhor Chhando) in Bengali literature.", "id": "f9"}, {"num": "11", "name": "Ballad", "text": "A form of verse, often a narrative set to music; considered the earliest form of lyric poetry. The word derives from the Italian 'ballare' meaning 'to dance', reflecting an original mixture of song and dance/drama. Ballads often deal with love, religion, heroism, politics, social matters, humour, or folk/rural life, typically carrying the sorrow or grief of an individual or community; also called Romantic Folk Songs. English poets such as Wordsworth, Hardy, Coleridge and Keats wrote many ballads — e.g. John Keats's 'La Belle Dame sans Merci', Thomas Hardy's 'During Wind and Rain', and Edgar Allan Poe's 'Annabel Lee'. In Bengali literature, examples include 'Mahmansingha Gitika', and, in the ballad-inspired tradition following Rabindranath, Jasimuddin's 'Nakshi Kanthar Math' and 'Sojon Badiyar Ghat'.", "id": "f10"}, {"num": "12", "name": "Couplet", "text": "Two lines with rhyming ends. Shakespeare often used a couplet to end a sonnet, as in the final two lines of Sonnet 18: 'So long as men can breathe or eyes can see, / So long lives this and this gives life to thee.'", "id": "f11"}, {"num": "13", "name": "Comedy", "text": "According to Aristotle, a comedy is an imitation of men worse than average — worse, however, not in every respect, but only in the particular quality of the ridiculous. When a light-hearted, joyful drama depicted through romantic union between hero and heroine is staged, it is called a comedy. The classification of comedy includes several types: Romantic/poetic comedy (theme drawn from imagination — e.g. Shakespeare's Twelfth Night); Plot-driven/intrigue comedy (built on scheming between characters — e.g. Dryden's The Spanish Friar); Comedy of dialogue (relies on the wit of dialogue more than plot or character — e.g. Shakespeare's As You Like It); Farce (relies on artificial, exaggerated comic situations rather than character or dialogue); Comedy of Humours (built on exaggerated, eccentric character traits); and Comedy of Manners (focuses on the manners and affectations of a social class rather than emotion, and is also known as Restoration Comedy).", "id": "f12"}, {"num": "14", "name": "Chiasmus", "text": "A verbal pattern in which the second half of an expression is balanced against the first but with the parts reversed. Examples: 'Love as if you would one day hate, and hate as if you would one day love' (Bias, 6th century BC); 'Bad men live that they may eat and drink, whereas good men eat and drink that they may live' (Socrates, 5th century BC); 'His time a moment, and a point his space' (Alexander Pope, Essay on Man); 'Do I love you because you're beautiful? Or are you beautiful because I love you?' (Oscar Hammerstein).", "id": "f13"}, {"num": "15", "name": "Elegy", "text": "From the Greek 'elegeia' meaning lament — a poem of lamentation/sadness, or mourning for the dead. In ancient Greek and Latin literature, elegiac verse followed a specific metrical form, but over time 'elegy' came to mean simply a poem of sorrow, typically expressing the poet's personal grief. According to S.T. Coleridge, elegy is a form of poetry natural to the reflective mind — it may treat of any subject, but always with reference to the poet, expressing regret for the past or desire for the future; sorrow and love became its principal themes. Famous example: Thomas Gray's 'Elegy Written in a Country Churchyard' (1750). Also: Milton's 'Lycidas' (on the death of his friend Edward King) and Shelley's 'Adonais' (on the death of Keats). In Bengali literature: Jatindranath Sengupta's '22 Shey Shrabon 1348', Rabindranath's 'Smaran', Kazi Nazrul Islam's 'Choturnama', and Jasimuddin's 'Kobor' are notable elegies.", "id": "f14"}, {"num": "16", "name": "Euphemism", "text": "The substitution of an inoffensive expression for one considered offensively explicit. Everyday examples: 'You are becoming a little thin on top' (bald); 'Our teacher is in the family way' (pregnant); 'He is always tired and emotional' (drunk); 'He is a special child' (disabled). Literary examples: John Donne's poem 'The Flea' employs euphemism to persuade his beloved to sleep with him. In Shakespeare's Othello, Iago tells Brabantio: 'your daughter and the Moor are now making the beast with two backs' — a euphemism for the act of having sex. In George Orwell's Animal Farm, the character Squealer announces a reduction in food as 'a readjustment of rations' — a euphemism to suppress the animals' complaints about hunger.", "id": "f15"}, {"num": "17", "name": "Hyperbole", "text": "An extravagant statement; the use of exaggerated terms for emphasis or heightened effect — the opposite of understatement. Common examples: 'I've told you a million times'; 'I am so hungry I could eat a horse'; 'That joke is so old I heard it riding a dinosaur.' A famous literary example comes from Shakespeare's Hamlet: 'I loved Ophelia. Forty thousand brothers could not with all their quantity of love make up my sum.'", "id": "f16"}, {"num": "18", "name": "Irony", "text": "The use of words to convey the opposite of their literal meaning; a statement or situation where the meaning is contradicted by the appearance or presentation of the idea. Examples: 'The boy showed his merit by making twenty mistakes in ten minutes'; 'Brutus is an honourable man' (Julius Caesar — said sarcastically). Literary examples: in Shakespeare's Romeo and Juliet, Juliet says 'My grave is like to be my wedding bed' — verbal irony, since the audience knows she is going to die on her wedding bed. In King Lear, Lear banishes his youngest daughter Cordelia, who in the end becomes his only shelter — a situational irony. In Coleridge's The Rime of the Ancient Mariner: 'Water, water, everywhere, nor any drop to drink' — the irony of being surrounded by undrinkable seawater.", "id": "f17"}, {"num": "19", "name": "Litotes", "text": "A figure of speech consisting of an understatement in which an affirmative is expressed by negating its opposite — derived from a Greek word meaning 'simple'. Examples: 'The ice cream was not too bad' (meaning it was good); 'New York is not an ordinary city' (meaning it's extraordinary); 'William Shakespeare was not a bad playwright at all.' A literary example is Jonathan Swift's A Tale of a Tub: 'I am not unaware how the productions of the Grub Street brotherhood have of late years fallen under many prejudices.' Robert Frost's 'Fire and Ice' also contains litotes-like understated phrasing.", "id": "f18"}, {"num": "20", "name": "Limerick", "text": "A humorous verse of three long and two short lines rhyming aabba; the third and fourth lines are usually shorter than the other three — in short, a funny poem of five lines.", "id": "f19"}, {"num": "21", "name": "Lyric", "text": "A short poem with a song-like quality, designed to be set to music, often conveying feelings, emotions, or personal thoughts. Lyric poetry is a formal type of poetry which expresses personal emotions or feelings, typically spoken in the first person. In ancient times, a song performed with the accompaniment of a lyre (a stringed instrument) was called a lyric.", "id": "f20"}, {"num": "22", "name": "Metaphor", "text": "An implied comparison between two unlike things that actually have something important in common, without using words such as 'like' or 'as' (that would make it a simile) — e.g. 'the curtain of night', or 'all the world's a stage'. A metaphor is a word or phrase used to make a comparison between two people, things, animals, or places, helpful for visualising an idea. Examples: 'Life is a roller coaster'; 'Time is money'; 'The world is a stage'; 'Her lovely voice was music to his ears.' Metaphor is different from metonymy: a metaphor draws resemblance between two different things (e.g. 'You are sunlight and I moon' — from Miss Saigon's 'Sun and Moon'), whereas metonymy is based on close association rather than resemblance (e.g. 'The White House is concerned about terrorism', where the White House represents the people who work there).", "id": "f21"}, {"num": "23", "name": "Metonymy", "text": "A figure of speech that replaces the name of a thing with the name of something else with which it is closely associated. Metonymy is often confused with synecdoche: synecdoche refers to a thing by the name of one of its parts (e.g. calling a car 'a wheel'), while metonymy uses a word that is closely linked to a thing but is not a part of it (e.g. 'Crown', meaning power/authority). Everyday examples: 'England decides to keep check on immigration' (England = the government); 'The pen is mightier than the sword' (pen = written words, sword = military force); 'Let me give you a hand' (hand = help). Literary examples: 'Friends, Romans, countrymen, lend me your ears' (Shakespeare's Julius Caesar — 'ears' replaces the concept of attention); 'The life from spilling' (Robert Frost, 'Out, Out' — refers to spilling of blood); John Milton's Lycidas uses 'oat' to represent the song the poet is composing.", "id": "f22"}, {"num": "24", "name": "Ode", "text": "A gravely dignified lyric poem addressing and often celebrating a person, object, or abstract concept, using a variety of elaborate metrical forms to express deep feeling. In Bengali literature, examples of odes include Rabindranath's 'Barsha Shesh', Satyen Dutta's 'Nomoshkar', and Mohitlal's 'Rabindra Jayanti'. In English literature, famous odes include Thomas Gray's 'The Bard', Milton's 'Ode on the Morning of Christ's Nativity', and Keats's 'Ode to a Nightingale'.", "id": "f23"}, {"num": "25", "name": "Onomatopoeia", "text": "The use of words that imitate the sounds associated with the objects or actions they refer to — a word's pronunciation imitates its sound. Poets use onomatopoeia to engage the reader's auditory sense and create rich soundscapes; it is distinct from interjections (like 'ouch' or 'wow'), which are sudden outbursts of emotion. Common examples: bark, beep, buzz, chirp, clang, crash, croak, growl, hiss, howl, moo, purr, rustle, sizzle, and similar sound-imitating words.", "id": "f24"}, {"num": "26", "name": "Oxymoron", "text": "A figure of speech in which incongruous or contradictory terms appear side by side — e.g. 'I see a wild civility.' Everyday examples: 'open secret'; 'tragic comedy'; 'deafening silence'; 'jumbo shrimp'; 'living dead'; 'pretty ugly'; 'bittersweet'. Literary examples: 'Why, then, O brawling love! O loving hate!... O heavy lightness! Serious vanity!' (Shakespeare, Romeo and Juliet — expressing Romeo's mental conflict over unrequited love); 'I must be cruel, only to be kind' (Hamlet). Difference from paradox: an oxymoron combines two contradictory words, while a paradox is a full sentence (or group of sentences) that seems self-contradictory yet contains an implied truth; an oxymoron may produce a dramatic effect but does not need to make literal sense.", "id": "f25"}, {"num": "27", "name": "Paradox", "text": "A statement that appears to contradict itself, e.g. 'That I may rise and stand, overthrow me and bend.' A paradox can be very revealing about human nature and the way people speak — at the most basic level, it is a statement that is self-contradictory because it often contains two statements that are both true, but in general cannot both be true at the same time. Common examples: 'There is no one so poor as a wealthy miser'; 'I'm nobody'; 'What a pity that youth must be wasted on the young' (George Bernard Shaw); 'Be cruel to be kind.' Literary examples: George Orwell's Animal Farm — 'All animals are equal, but some are more equal than others' — a political paradox pointing to a truth even though it doesn't make logical sense. Shakespeare's Hamlet — 'I must be cruel to be kind' — Hamlet's plan to avenge his father by killing Claudius, while not wanting his mother to remain married to her husband's murderer.", "id": "f26"}, {"num": "28", "name": "Personification", "text": "A figure of speech in which an inanimate object or abstraction is endowed with human qualities or abilities — e.g. 'Let not Ambition mock their useful toil.' Common examples: 'The wind whispered through dry grass'; 'Time and tide waits for none'; 'The waves beside them danced' (from Wordsworth's 'I Wandered Lonely as a Cloud'). Personification is also common in advertising, e.g. 'Oreo: Milk's favorite cookie.' Literary examples: Shakespeare's Romeo and Juliet — 'When well-appareled April on the heel of limping winter treads' (April and winter given human qualities); Emily Dickinson's 'Have You Got A Brook In Your Little Heart' — bashful flowers, blushing birds and trembling shadows; William Blake's 'Two Sunflowers Move in the Yellow Room' — sunflowers speak of being 'weary of weather'.", "id": "f27"}, {"num": "29", "name": "Pun", "text": "A play on words, sometimes on different senses of the same word and sometimes on the similar sense or sound of different words; also called paronomasia. A pun is a joke that makes a play on words that have several meanings or that sound similar but have different meanings. Examples: 'A chicken crossing the road is poultry in motion'; 'The flock of doves decided to stage a coo'; 'She had a photographic memory but never developed it'; 'A pessimist's blood type is always B-negative.' In Bengali literature, Ishwar Gupta's line 'Ke bole Ishwar gupto byakto...' plays on the double meaning of 'Ishwar' (Creator / the poet's own name Ishwar Gupta) and 'Provakor' (the sun / the name of a newspaper, Sangbad Prabhakar).", "id": "f28"}, {"num": "30", "name": "Satire", "text": "From the Latin 'satura' — a literary composition, in verse or prose, in which human folly and vice are held up to scorn, derision, or ridicule, aimed at correcting manners and social/political corruption. Jonathan Swift's 1726 novel Gulliver's Travels is a famous example of satirical fiction. Horatian satire (named for the Roman poet Horace) is gentle, urbane, and smiling, aiming to correct through gentle and sympathetic laughter, as opposed to harsher (Juvenalian) satire.", "id": "f29"}, {"num": "31", "name": "Simile", "text": "A stated comparison (usually formed with 'like' or 'as') between two fundamentally dissimilar things that have certain qualities in common. Common examples beginning with 'as': 'as brave as a lion'; 'as busy as a bee'; 'as clear as crystal'; 'as cold as ice'; 'as blind as a bat'; 'as good as gold.' Examples beginning with 'like': 'sing like an angel'; 'fight like cats and dogs'; 'like two peas in a pod.' Literary examples: 'My love is like a red, red rose'; 'I wandered lonely as a cloud' (Wordsworth).", "id": "f30"}, {"num": "32", "name": "Sonnet", "text": "A poem of fourteen lines using any of a number of formal rhyme schemes, in English typically having ten syllables per line. The word derives from the Italian 'sonetto' ('little song'), from 'sound'. The Italian poet Petrarch is considered the father of the sonnet. In Bengali poetry, Michael Madhusudan Dutt wrote the first sonnet — celebrated not just as its pioneer but as one of its finest practitioners. A sonnet's first eight lines are called the Octave, and the remaining six lines the Sestet. In the Octave, a thought or problem is proposed, which finds resolution in the Sestet. Shakespeare did not follow the strict Octave/Sestet division; Milton and Wordsworth followed the Italian (Petrarchan) pattern more closely. Milton largely favoured classical metre, but English sonnets more often use a different rhyme scheme — ababcdcdefefgg — as seen most in Shakespeare's sonnets.", "id": "f31"}, {"num": "33", "name": "Synecdoche", "text": "A figure of speech in which a part is used to represent the whole (e.g. 'ABCs' for the alphabet) or the whole is used to represent a part (e.g. 'England won the World Cup in 1966'). Difference from metonymy: synecdoche refers to the whole of a thing by naming one of its parts (e.g. calling a car 'wheels'), whereas metonymy uses a word closely linked to — but not literally part of — the thing it represents (e.g. 'crown' for king/queen). Everyday examples: 'bread and butter' (= livelihood); 'gray beard' (= old man); 'sails' (= a whole ship); 'suits' (= businessmen). Literary examples: Coleridge's The Rime of the Ancient Mariner — 'the western wave' (= the sea); Shakespeare's Sonnet 116 — 'an ever-fixed mark' (= a lighthouse); Shelley's Ozymandias — 'the hand that mocked them' (= the sculptor).", "id": "f32"}, {"num": "34", "name": "Tragedy", "text": "Aristotle, in defining tragedy, wrote: 'A tragedy is the imitation of an action that is serious and also, as having magnitude, complete in itself; in appropriate and pleasurable language;... in a dramatic rather than narrative form; with incidents arousing pity and fear, wherewith to accomplish a catharsis of these emotions.' A tragedy generally ends through death, separation, or a sorrowful event, arising from life's inevitable suffering, failure, or incompleteness rather than gentle development. In Greek tragedy, this sorrowful outcome is determined by fate/destiny; in Shakespeare's tragedies, it more often results from an acknowledged flaw (hamartia) in the protagonist — meaning the character is themselves partly responsible for their downfall, though not always fated to die, unlike in Greek tragedy. Christopher Marlowe's Doctor Faustus dramatizes the tragedy of a man who is neither a king nor of royal descent.", "id": "f33"}, {"num": "35", "name": "Understatement", "text": "A figure of speech in which a writer or speaker deliberately makes a situation seem less important or serious than it is, minimising the significance of something through restraint and less emphasis than the situation would seem to demand — the opposite of hyperbole. A famous real-life example occurred during a 1982 plane crash: after all four engines of a British Airways flight failed due to volcanic ash, the captain announced: 'Ladies and Gentlemen, this is your Captain speaking. We have a small problem. All four engines have stopped. We are doing our damnedest to get them going again. I trust you are not in too much distress.' Ernest Hemingway was known as a master of understatement — in his short story 'Hills Like White Elephants', a couple discuss a difficult decision with deliberate emotional restraint. Mark Twain also used understatement to devastating effect in Huckleberry Finn, where Huck's flatly casual answer about a fatal accident — describing an enslaved man's death in the callous, dehumanising language of his era — starkly exposes the racism of the antebellum South the novel critiques.", "id": "f34"}]};
// ============================================================
// BCS English Literature — Command Center
// Vanilla JS single-file app. No build tools, no backend.
// ============================================================
(function(){
"use strict";

/* ---------------- STATE ---------------- */
const STORE_KEY = "bcsLitApp_v2";
function todayStr(d){ d=d||new Date(); return d.toISOString().slice(0,10); }
function defaultState(){
  return {
    settings:{ theme:"dark", fontSize:"md", negMarking:false },
    srs:{},          // cardId -> {ease,interval,due,reps,lapses}
    bookmarks:[],     // [{type,id}]
    notes:{},         // key -> text
    marks:{},         // key -> 'important'|'confusing'|'memorise'|'review'
    qStatus:{},        // questionId -> 'mastered'|'revision'|'learning'
    mistakes:[],       // question ids currently missed
    testHistory:[],    // {date,score,total,period,length}
    dailyLog:{},       // date -> {questions:0,correct:0,cardsReviewed:0,studySeconds:0}
    lastVisit:{ view:"dashboard", detail:null },
    createdAt: new Date().toISOString(),
  };
}
let STATE = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(STATE));
}
function todayLog(){
  const t = todayStr();
  if(!STATE.dailyLog[t]) STATE.dailyLog[t] = {questions:0, correct:0, cardsReviewed:0, studySeconds:0};
  return STATE.dailyLog[t];
}
function logActivity(patch){
  const l = todayLog();
  Object.keys(patch).forEach(k=> l[k] = (l[k]||0) + patch[k]);
  saveState();
}

/* ---------------- DATA INDEX ---------------- */
const D = (typeof APP_DATA !== "undefined") ? APP_DATA : window.APP_DATA;
const AUTHORS = D.authors;
const QUESTIONS = D.questions;
const FIGURES = D.figures;
const PERIODS = D.periods;
const AUTH_BY_ID = Object.fromEntries(AUTHORS.map(a=>[a.id,a]));
const Q_BY_ID = Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
const F_BY_ID = Object.fromEntries(FIGURES.map(f=>[f.id,f]));
const PERIOD_NAMES = PERIODS.map(p=>p.name);

/* build flashcard deck from all content types */
function buildDeck(){
  const cards = [];
  AUTHORS.forEach(a=>{
    cards.push({id:"c-a-"+a.id, kind:"author", refId:a.id,
      front: a.name + (a.dates? " ("+a.dates+")" : ""),
      back: a.text || "No further detail captured yet.",
      period:a.period});
  });
  FIGURES.forEach(f=>{
    cards.push({id:"c-f-"+f.id, kind:"figure", refId:f.id,
      front: "Figure of speech: "+f.name,
      back: f.text, period:"Figures of Speech"});
    cards.push({id:"c-f2-"+f.id, kind:"figure-rev", refId:f.id,
      front: (f.text||"").slice(0,160)+"…",
      back: "Answer: "+f.name, period:"Figures of Speech"});
  });
  QUESTIONS.forEach(q=>{
    cards.push({id:"c-q-"+q.id, kind:"question", refId:q.id,
      front: q.q,
      back: "Answer: "+(q.options[q.answer]||q.answer)+(q.source? "  ["+q.source+"]":""),
      period:q.period});
  });
  return cards;
}
const DECK = buildDeck();
const DECK_BY_ID = Object.fromEntries(DECK.map(c=>[c.id,c]));

/* ---------------- SRS (SM-2 lite) ---------------- */
function srsOf(cardId){
  if(!STATE.srs[cardId]) STATE.srs[cardId] = {ease:2.5, interval:0, due:Date.now(), reps:0, lapses:0};
  return STATE.srs[cardId];
}
function srsGrade(cardId, grade){ // grade: again|hard|good|easy
  const c = srsOf(cardId);
  c.reps++;
  const DAY = 86400000;
  if(grade==="again"){
    c.lapses++; c.interval=0; c.ease=Math.max(1.3, c.ease-0.2);
    c.due = Date.now() + 5*60000; // due again in 5 min (same session)
  }else{
    if(grade==="hard"){ c.ease=Math.max(1.3,c.ease-0.15); c.interval = Math.max(1, Math.round((c.interval||1)*1.2)); }
    if(grade==="good"){ c.interval = c.interval<1 ? 1 : Math.round(c.interval*c.ease); }
    if(grade==="easy"){ c.ease += 0.15; c.interval = c.interval<1 ? 3 : Math.round(c.interval*c.ease*1.3); }
    c.interval = Math.min(c.interval, 180);
    c.due = Date.now() + c.interval*DAY;
  }
  saveState();
  logActivity({cardsReviewed:1});
}
function dueCards(){
  const now = Date.now();
  return DECK.filter(c=>{
    const s = STATE.srs[c.id];
    if(!s) return false; // only "seen" cards count as due; new cards are separate
    return s.due <= now;
  });
}
function newCards(limit){
  const out=[];
  for(const c of DECK){ if(!STATE.srs[c.id]){ out.push(c); if(out.length>=limit) break; } }
  return out;
}

/* ---------------- UTIL ---------------- */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function fmtPct(n){ return Math.round(n)+"%"; }
function toast(msg){
  const t=document.getElementById('toastRoot'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),2200);
}
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function itemKey(type,id){ return type+":"+id; }
function isBookmarked(type,id){ return STATE.bookmarks.some(b=>b.type===type && b.id===id); }
function toggleBookmark(type,id,label){
  const idx = STATE.bookmarks.findIndex(b=>b.type===type && b.id===id);
  if(idx>=0){ STATE.bookmarks.splice(idx,1); toast("Removed bookmark"); }
  else { STATE.bookmarks.push({type,id,label,at:Date.now()}); toast("Bookmarked"); }
  saveState();
}
function setMark(type,id,mark){
  const k=itemKey(type,id);
  if(STATE.marks[k]===mark){ delete STATE.marks[k]; } else { STATE.marks[k]=mark; }
  saveState();
}

/* ---------------- ROUTER ---------------- */
const VIEWS = {}; // name -> render(container, params)
let currentView = "dashboard";
function navigate(view, params){
  currentView = view;
  STATE.lastVisit = {view, detail: params||null};
  saveState();
  location.hash = "#"+view + (params&&params.id? "/"+encodeURIComponent(params.id):"");
  renderApp();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', ()=>{
  const [v,idRaw] = location.hash.replace('#','').split('/');
  currentView = v || 'dashboard';
  renderApp(idRaw?decodeURIComponent(idRaw):null);
});

/* ============================================================
   SHELL (sidebar / topbar / bottom nav)
   ============================================================ */
const NAV = [
  {group:"Overview", items:[
    {id:"dashboard", ic:"◆", label:"Dashboard"},
  ]},
  {group:"Study", items:[
    {id:"periods", ic:"⏳", label:"Periods & Timeline"},
    {id:"authors", ic:"✎", label:"Authors"},
    {id:"figures", ic:"❋", label:"Figures of Speech"},
    {id:"terms", ic:"§", label:"Titles & Quick Facts"},
  ]},
  {group:"Practice", items:[
    {id:"pq", ic:"▤", label:"Previous Questions"},
    {id:"test", ic:"⏱", label:"Practice Test"},
    {id:"flashcards", ic:"▢", label:"Flashcards", badgeFn:()=>dueCards().length||null},
    {id:"mistakes", ic:"✕", label:"My Mistakes", badgeFn:()=>STATE.mistakes.length||null},
  ]},
  {group:"My Study", items:[
    {id:"bookmarks", ic:"★", label:"Bookmarks"},
    {id:"progress", ic:"▦", label:"Progress"},
    {id:"planner", ic:"◷", label:"Revision Planner"},
    {id:"settings", ic:"⚙", label:"Settings & Help"},
  ]},
];

function streakCount(){
  let n=0; let d=new Date();
  while(true){
    const key = todayStr(d);
    if(STATE.dailyLog[key] && (STATE.dailyLog[key].questions||STATE.dailyLog[key].cardsReviewed||STATE.dailyLog[key].studySeconds)){
      n++; d.setDate(d.getDate()-1);
    } else break;
  }
  return n;
}

function renderShell(){
  const root = document.getElementById('appRoot');
  root.innerHTML = "";
  const scrim = el(`<div class="sidebar-scrim"></div>`);
  scrim.onclick = ()=>{ document.querySelector('.sidebar').classList.remove('open'); scrim.classList.remove('open'); };

  const sidebar = el(`<aside class="sidebar">
    <div class="sidebar-brand">
      <div class="seal">BCS</div>
      <h1>Lit. Command Center</h1>
      <p>English Literature · BCS Prep</p>
    </div>
    <nav id="navGroups"></nav>
    <div class="sidebar-foot">
      <div class="streak-pill">🔥 ${streakCount()} day streak</div>
      <div>${D.meta.title}</div>
      <div style="opacity:.7">by ${D.meta.author}</div>
    </div>
  </aside>`);
  const navGroups = sidebar.querySelector('#navGroups');
  NAV.forEach(g=>{
    navGroups.appendChild(el(`<div class="nav-label">${g.group}</div>`));
    const wrap = el(`<div class="nav-group" style="padding:0 10px 4px"></div>`);
    g.items.forEach(it=>{
      const badge = it.badgeFn ? it.badgeFn() : null;
      const btn = el(`<button class="nav-item ${currentView===it.id?'active':''}">
        <span class="ic">${it.ic}</span><span>${it.label}</span>
        ${badge?`<span class="badge">${badge}</span>`:""}
      </button>`);
      btn.onclick = ()=>{ navigate(it.id); document.querySelector('.sidebar').classList.remove('open'); scrim.classList.remove('open'); };
      wrap.appendChild(btn);
    });
    navGroups.appendChild(wrap);
  });

  const topbar = el(`<div class="topbar">
    <div class="topbar-left">
      <button class="icon-btn hamburger" id="hamBtn">☰</button>
      <button class="search-fake" id="openSearch"><span>🔍</span><span>Search authors, works, questions…</span><kbd>Ctrl K</kbd></button>
    </div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">${STATE.settings.theme==='dark'?'☀':'🌙'}</button>
  </div>`);
  topbar.querySelector('#hamBtn').onclick=()=>{ sidebar.classList.add('open'); scrim.classList.add('open'); };
  topbar.querySelector('#openSearch').onclick = openSearchModal;
  topbar.querySelector('#themeBtn').onclick = ()=>{
    STATE.settings.theme = STATE.settings.theme==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme', STATE.settings.theme);
    saveState();
    const [,idRaw] = location.hash.replace('#','').split('/');
    renderApp(idRaw?decodeURIComponent(idRaw):null);
  };

  const main = el(`<main class="main"></main>`);
  main.appendChild(topbar);
  const content = el(`<div class="content" id="viewContainer"></div>`);
  main.appendChild(content);

  const bottomNav = el(`<div class="bottom-nav"><div class="bottom-nav-inner" id="bnInner"></div></div>`);

function buildSearchIndex(){
  const idx=[];
  AUTHORS.forEach(a=> idx.push({cat:"Author", label:a.name, sub:a.period, go:()=>navigate('authors',{id:a.id}), text:(a.name+" "+a.text).toLowerCase()}));
  FIGURES.forEach(f=> idx.push({cat:"Figure of Speech", label:f.name, sub:"Figures of Speech", go:()=>navigate('figures',{id:f.id}), text:(f.name+" "+f.text).toLowerCase()}));
  QUESTIONS.forEach(q=> idx.push({cat:"Previous Question", label:q.q.slice(0,90), sub:q.period, go:()=>navigate('pq',{id:q.id}), text:(q.q+" "+Object.values(q.options).join(" ")).toLowerCase()}));
  PERIODS.forEach(p=> idx.push({cat:"Period", label:p.name, sub:p.duration, go:()=>navigate('periods',{id:p.id}), text:(p.name+" "+p.alt).toLowerCase()}));
  return idx;
}
const SEARCH_INDEX = buildSearchIndex();

function openSearchModal(){
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = "";
  const backdrop = el(`<div class="modal-backdrop open">
    <div class="modal">
      <input class="modal-search-input" placeholder="Search the whole book… (authors, works, questions, periods)" autofocus>
      <div class="modal-body" id="searchResults"></div>
    </div>
  </div>`);
  function closeModal(){ backdrop.remove(); document.removeEventListener('keydown', escHandler); }
  function escHandler(e){ if(e.key==='Escape') closeModal(); }
  backdrop.onclick=(e)=>{ if(e.target===backdrop) closeModal(); };
  document.addEventListener('keydown', escHandler);
  modalRoot.appendChild(backdrop);
  const input = backdrop.querySelector('.modal-search-input');
  const results = backdrop.querySelector('#searchResults');
  function doSearch(q){
    q=q.trim().toLowerCase();
    if(!q){ results.innerHTML=`<div class="empty-state" style="padding:24px"><div class="ic">🔎</div>Type to search the entire book</div>`; return; }
    const hits = SEARCH_INDEX.filter(h=>h.text.includes(q)).slice(0,40);
    if(!hits.length){ results.innerHTML=`<div class="empty-state" style="padding:24px">No matches for "${escapeHtml(q)}"</div>`; return; }
    results.innerHTML = "";
    hits.forEach(h=>{
      const btn = el(`<button class="search-hit"><div class="cat">${h.cat}</div><div>${escapeHtml(h.label)}</div><div style="font-size:11px;color:var(--text-mute)">${escapeHtml(h.sub||"")}</div></button>`);
      btn.onclick = ()=>{ closeModal(); h.go(); };
      results.appendChild(btn);
    });
  }
  input.addEventListener('input', ()=>doSearch(input.value));
  doSearch("");
}
document.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openSearchModal(); }
});

function renderHeatmap(){
  let html="";
  let d = new Date(); d.setDate(d.getDate()-27);
  for(let i=0;i<28;i++){
    const key = todayStr(d);
    const log = STATE.dailyLog[key];
    const level = log ? Math.min(4, 1+Math.floor(((log.questions||0)+(log.cardsReviewed||0))/8)) : 0;
    const bg = ["var(--surface-2)","rgba(201,162,75,.25)","rgba(201,162,75,.5)","rgba(201,162,75,.75)","var(--gold)"][level];
    html += `<div title="${key}" style="width:16px;height:16px;border-radius:4px;background:${bg}"></div>`;
    d.setDate(d.getDate()+1);
  }
  return html;
}

function computeWeakAreas(){
  const byPeriod = {};
  STATE.testHistory.forEach(h=>{
    if(!h.periodBreak) return;
    Object.entries(h.periodBreak).forEach(([p,v])=>{
      byPeriod[p]=byPeriod[p]||{c:0,t:0};
      byPeriod[p].c+=v.c; byPeriod[p].t+=v.t;
    });
  });
  return Object.entries(byPeriod).map(([period,v])=>({period, acc:Math.round(100*v.c/v.t), t:v.t}))
    .filter(w=>w.t>=2).sort((a,b)=>a.acc-b.acc);
}

function startGuessFigure(){
  const modalRoot = document.getElementById('modalRoot');
  let score=0, round=0, MAX=10;

  const backdrop = el(`<div class="modal-backdrop open"><div class="modal" style="padding:22px" id="gModalInner"></div></div>`);
  function closeModal(){
    backdrop.remove();
    document.removeEventListener('keydown', escHandler);
  }
  function escHandler(e){ if(e.key==='Escape') closeModal(); }
  backdrop.onclick = (e)=>{ if(e.target===backdrop) closeModal(); };
  document.addEventListener('keydown', escHandler);
  modalRoot.innerHTML = "";
  modalRoot.appendChild(backdrop);
  const inner = backdrop.querySelector('#gModalInner');

  function nextRound(){
    if(round>=MAX){
      inner.innerHTML = `<div style="padding:8px; text-align:center">
        <h2>Round complete</h2><p>You scored <b>${score}/${MAX}</b> on Guess the Figure.</p>
        <button class="btn btn-primary" id="closeG">Close</button></div>`;
      inner.querySelector('#closeG').onclick = closeModal;
      return;
    }
    round++;
    const correct = FIGURES[Math.floor(Math.random()*FIGURES.length)];
    let opts = [correct];
    while(opts.length<4){ const r=FIGURES[Math.floor(Math.random()*FIGURES.length)]; if(!opts.includes(r)) opts.push(r); }
    opts.sort(()=>Math.random()-0.5);
    const snippet = correct.text.slice(0, 170);
    inner.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center">
        <div class="eyebrow">Round ${round}/${MAX} · Score ${score}</div>
        <button class="icon-btn" id="gClose" style="width:30px;height:30px" title="Close (Esc)">✕</button>
      </div>
      <p style="font-size:15px; line-height:1.6; margin:10px 0 16px">${escapeHtml(snippet)}…</p>
      <div id="gOpts"></div>`;
    inner.querySelector('#gClose').onclick = closeModal;
    const wrap = inner.querySelector('#gOpts');
    opts.forEach(o=>{
      const b = el(`<button class="quiz-opt"><span class="letter">?</span><span>${escapeHtml(o.name)}</span></button>`);
      b.onclick=()=>{
        wrap.querySelectorAll('.quiz-opt').forEach(x=>x.disabled=true);
        if(o.id===correct.id){ b.classList.add('correct'); score++; }
        else{ b.classList.add('wrong');
          [...wrap.children].find(x=>x.textContent.includes(correct.name)).classList.add('correct'); }
        setTimeout(nextRound, 900);
      };
      wrap.appendChild(b);
    });
  }
  nextRound();
}

  [...new Set(QUESTIONS.map(q=>q.period))].forEach(p=>filterRow.appendChild(el(`<button class="chip" data-p="${escapeHtml(p)}">${escapeHtml(p)}</button>`)));
  const list = el(`<div id="qList"></div>`);
  c.appendChild(list);
  const loadMoreWrap = el(`<div style="text-align:center; padding:14px"></div>`);
  c.appendChild(loadMoreWrap);
  let active="";
  let shown=0;
  const BATCH=40;
  function filtered(){ return QUESTIONS.filter(q=>!active||q.period===active); }
  function draw(){
    list.innerHTML=""; shown=0; loadMoreWrap.innerHTML="";
    renderMore();
  }
  function renderMore(){
    const items = filtered();
    const next = items.slice(shown, shown+BATCH);
    next.forEach(q=> list.appendChild(renderQuestionCard(q)));
    shown += next.length;
    loadMoreWrap.innerHTML = "";
    const remaining = items.length - shown;
    if(remaining>0){
      const btn = el(`<button class="btn btn-primary">Load ${Math.min(BATCH,remaining)} more (${remaining} left)</button>`);
      btn.onclick = renderMore;
      loadMoreWrap.appendChild(btn);
    }
  }
  filterRow.querySelectorAll('.chip').forEach(chip=>chip.onclick=()=>{filterRow.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));chip.classList.add('on');active=chip.dataset.p;draw();});
  draw();
  if(paramId && Q_BY_ID[paramId]){
    const targetIdx = filtered().findIndex(q=>q.id===paramId);
    if(targetIdx>=0){ while(shown<=targetIdx) renderMore(); }
    setTimeout(()=>{ const target = list.querySelector(`[data-qid="${paramId}"]`); if(target) target.scrollIntoView({block:'center'}); }, 50);
  }
};
const Q_STATUS_META = {
  mastered: {label:"Mastered", emoji:"🟢", tagClass:"tag-good"},
  revision: {label:"Need Revision", emoji:"🔴", tagClass:"tag-burgundy"},
  learning: {label:"Learning", emoji:"🟡", tagClass:"tag-gold"},
};
function renderQuestionCard(q){
  const status = STATE.qStatus[q.id];
  const meta = status ? Q_STATUS_META[status] : null;
  const card = el(`<div class="card qcard" style="margin-bottom:10px" data-qid="${q.id}">
    <div class="qcard-head">
      <span class="tag tag-muted">${escapeHtml(q.source||q.period)}</span>
      <span class="tag ${meta?meta.tagClass:'tag-muted'}" id="statusTag-${q.id}">${meta? meta.emoji+' '+meta.label : '○ Not studied yet'}</span>
      <button class="icon-btn" style="width:28px;height:28px;margin-left:auto;flex-shrink:0" title="Bookmark">${isBookmarked('question',q.id)?'★':'☆'}</button>
    </div>
    <p style="font-weight:600; font-size:14px; margin:10px 0 12px">${escapeHtml(q.q)}</p>
    <div class="qopt-grid" id="optsGrid-${q.id}"></div>
    <button class="btn btn-sm" id="showAns-${q.id}" style="margin-top:10px">👁 Show Answer</button>
    <div class="qcard-answer" id="ansBox-${q.id}" style="display:none"></div>
    <div class="chip-row" style="margin-top:12px" id="statusRow-${q.id}"></div>
    <button class="btn btn-sm" id="toggleNote-${q.id}" style="margin-top:8px">📝 Note</button>
    <textarea id="note-${q.id}" style="display:none; margin-top:8px" placeholder="Write a personal note (optional)…">${escapeHtml(STATE.notes[itemKey('question',q.id)]||'')}</textarea>
  </div>`);

  card.querySelector('.icon-btn').onclick=(e)=>{ toggleBookmark('question',q.id,q.q); e.target.textContent = isBookmarked('question',q.id)?'★':'☆'; };

  // options — static display, no click-to-score (this is a study view, not a quiz)
  const grid = card.querySelector(`#optsGrid-${q.id}`);
  Object.entries(q.options).forEach(([k,v])=>{
    grid.appendChild(el(`<div class="qopt-box" data-letter="${k}"><span class="letter">${k}</span><span>${escapeHtml(v)}</span></div>`));
  });

  // show/hide answer
  const showAnsBtn = card.querySelector(`#showAns-${q.id}`);
  const ansBox = card.querySelector(`#ansBox-${q.id}`);
  let revealed = false;
  showAnsBtn.onclick = ()=>{
    revealed = !revealed;
    if(revealed){
      grid.querySelectorAll('.qopt-box').forEach(b=>{ if(b.dataset.letter===q.answer) b.classList.add('correct'); });
      ansBox.style.display='block';
      ansBox.innerHTML = `<b>Answer: ${escapeHtml(q.answer)}) ${escapeHtml(q.options[q.answer]||'')}</b>`;
      showAnsBtn.textContent = '🙈 Hide Answer';
    } else {
      grid.querySelectorAll('.qopt-box').forEach(b=>b.classList.remove('correct'));
      ansBox.style.display='none';
      showAnsBtn.textContent = '👁 Show Answer';
    }
  };

  // self-assessment status chips
  const statusRow = card.querySelector(`#statusRow-${q.id}`);
  const statusTag = card.querySelector(`#statusTag-${q.id}`);
  Object.entries(Q_STATUS_META).forEach(([key,m])=>{
    const on = STATE.qStatus[q.id]===key;
    const chip = el(`<button class="chip ${on?'on':''}">${m.emoji} ${m.label}</button>`);
    chip.onclick = ()=>{
      if(STATE.qStatus[q.id]===key) delete STATE.qStatus[q.id];
      else STATE.qStatus[q.id]=key;
      saveState();
      statusRow.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      const now = STATE.qStatus[q.id];
      if(now){ chip.classList.add('on'); statusTag.className = `tag ${Q_STATUS_META[now].tagClass}`; statusTag.textContent = `${Q_STATUS_META[now].emoji} ${Q_STATUS_META[now].label}`; }
      else { statusTag.className = 'tag tag-muted'; statusTag.textContent = '○ Not studied yet'; }
    };
    statusRow.appendChild(chip);
  });

  // personal note toggle
  const noteBtn = card.querySelector(`#toggleNote-${q.id}`);
  const noteArea = card.querySelector(`#note-${q.id}`);
  noteBtn.onclick = ()=>{
    const hidden = noteArea.style.display==='none';
    noteArea.style.display = hidden?'block':'none';
    if(hidden) noteArea.focus();
  };
  noteArea.addEventListener('blur', ()=>{ STATE.notes[itemKey('question',q.id)] = noteArea.value; saveState(); });

  return card;
}

let TEST_SESSION = null;
VIEWS.test = function(c){

    const timedMins = parseInt(card.querySelector('#tTime').value,10)||0;
    const negMarking = card.querySelector('#tNeg').checked;
    const onlyMistakes = card.querySelector('#tMistakes').checked;

  };

      hc.appendChild(el(`<div class="list-row"><div style="flex:1">${new Date(h.date).toLocaleDateString()} — ${escapeHtml(h.period||'Entire book')}</div><div class="tag ${h.score/h.total>=0.6?'tag-good':'tag-burgundy'}">${h.score}/${h.total}</div></div>`));
    });

};

function startTest({period, length, timedMins, negMarking, onlyMistakes}){
  let pool = onlyMistakes ? QUESTIONS.filter(q=>STATE.mistakes.includes(q.id)) : QUESTIONS.filter(q=>!period||q.period===period);
  if(!pool.length){ toast("No questions available for that filter"); return; }
  pool = [...pool].sort(()=>Math.random()-0.5).slice(0, length||pool.length);
  TEST_SESSION = { pool, idx:0, answers:{}, period, negMarking, timedMins, startedAt:Date.now(), endsAt: timedMins? Date.now()+timedMins*60000 : null };
  navigate('test-run');
}
VIEWS['test-run'] = function(c){
  if(!TEST_SESSION){ navigate('test'); return; }
  const s = TEST_SESSION;
  if(s.idx>=s.pool.length){ return renderTestResults(c); }
  const q = s.pool[s.idx];
  c.appendChild(el(`<div class="page-head">
    <div><div class="eyebrow">Question ${s.idx+1} of ${s.pool.length}</div><h2 style="font-size:19px">${escapeHtml(q.period)}</h2></div>
    <div id="timerChip"></div>
  </div>`));
  const progWrap = el(`<div class="progress-track" style="margin-bottom:18px"><div class="progress-fill" style="width:${100*s.idx/s.pool.length}%"></div></div>`);
  c.appendChild(progWrap);
  const card = el(`<div class="card"><p style="font-size:16px; font-weight:600; line-height:1.5">${escapeHtml(q.q)}</p><div id="optsWrap" style="margin-top:14px"></div></div>`);
  c.appendChild(card);
  const optsWrap = card.querySelector('#optsWrap');
  Object.entries(q.options).forEach(([k,v])=>{
    const b = el(`<button class="quiz-opt"><span class="letter">${k}</span><span>${escapeHtml(v)}</span></button>`);
    b.onclick=()=>{
      s.answers[q.id]=k;
      optsWrap.querySelectorAll('.quiz-opt').forEach(x=>x.disabled=true);
      b.classList.add(k===q.answer?'correct':'wrong');
      if(k!==q.answer){ [...optsWrap.children].forEach(x=>{ if(x.querySelector('.letter').textContent===q.answer) x.classList.add('correct'); }); }
      setTimeout(()=>{ s.idx++; navigate('test-run'); }, 550);
    };
    optsWrap.appendChild(b);
  });
  const nav = el(`<div style="display:flex; justify-content:space-between; margin-top:16px">
    <button class="btn btn-sm" id="quitBtn">✕ Quit test</button>
    <button class="btn btn-sm" id="skipBtn">Skip →</button></div>`);
  c.appendChild(nav);
  nav.querySelector('#quitBtn').onclick=()=>{ TEST_SESSION=null; navigate('test'); };
  nav.querySelector('#skipBtn').onclick=()=>{ s.idx++; navigate('test-run'); };

  if(s.timedMins){
    const chip = c.querySelector('#timerChip');
    function tick(){
      const left = Math.max(0, s.endsAt-Date.now());
      chip.innerHTML = `<span class="timer-chip">⏱ ${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}</span>`;
      if(left<=0){ s.idx = s.pool.length; navigate('test-run'); return; }
      if(currentView==='test-run') requestAnimationFrame(()=>setTimeout(tick,500));
    }
    tick();
  }
};
function renderTestResults(c){
  const s = TEST_SESSION;
  let correct=0, wrong=0, skipped=0; const periodBreak={};
  const wrongList=[];
  s.pool.forEach(q=>{
    const a = s.answers[q.id];
    periodBreak[q.period]=periodBreak[q.period]||{c:0,t:0};
    periodBreak[q.period].t++;
    if(!a){ skipped++; return; }
    if(a===q.answer){ correct++; periodBreak[q.period].c++;
      const mi = STATE.mistakes.indexOf(q.id); if(mi>=0) STATE.mistakes.splice(mi,1);
    } else { wrong++; wrongList.push(q); if(!STATE.mistakes.includes(q.id)) STATE.mistakes.push(q.id); }
  });
  const rawScore = s.negMarking ? Math.max(0, correct - wrong*0.25) : correct;
  STATE.testHistory.push({date:Date.now(), score:Math.round(rawScore*100)/100, total:s.pool.length, period:s.period, periodBreak, correct, wrong, skipped});
  STATE.qAttemptedIds = Array.from(new Set([...(STATE.qAttemptedIds||[]), ...s.pool.map(q=>q.id)]));
  logActivity({questions:s.pool.length, correct});
  saveState();

  const pct = Math.round(100*correct/s.pool.length);
  c.appendChild(el(`<div class="page-head"><div><div class="eyebrow">Test complete</div><h2>Score: ${Math.round(rawScore*100)/100} / ${s.pool.length}</h2></div></div>`));
  const grid = el(`<div class="grid grid-4"></div>`);
  [["Correct",correct,"tag-good"],["Wrong",wrong,"tag-burgundy"],["Skipped",skipped,"tag-muted"],["Accuracy",pct+"%","tag-gold"]].forEach(([l,v])=>
    grid.appendChild(el(`<div class="card stat-card"><div class="num">${v}</div><div class="lbl">${l}</div></div>`)));
  c.appendChild(grid);

  if(wrongList.length){
    const rc = el(`<div class="card" style="margin-top:14px"><h3>Question review — your mistakes</h3></div>`);
    wrongList.forEach(q=>{
      rc.appendChild(el(`<div class="list-row" style="flex-direction:column; align-items:flex-start; gap:4px">
        <div style="font-weight:600; font-size:13.5px">${escapeHtml(q.q)}</div>
        <div style="font-size:12.5px; color:var(--text-mute)">Your answer: ${escapeHtml(s.answers[q.id]||'—')} · Correct: <b style="color:var(--good)">${escapeHtml(q.answer)}) ${escapeHtml(q.options[q.answer])}</b></div>
      </div>`));
    });
    c.appendChild(rc);
  }
  const actions = el(`<div class="chip-row" style="margin-top:16px">
    <button class="btn" id="retryBtn">Retry mistakes</button>
    <button class="btn btn-primary" id="doneBtn">Back to Practice Test</button>
  </div>`);
  c.appendChild(actions);
  actions.querySelector('#doneBtn').onclick=()=>{ TEST_SESSION=null; navigate('test'); };
  actions.querySelector('#retryBtn').onclick=()=>{ TEST_SESSION=null; startTest({onlyMistakes:true, length:99}); };
}

  byPeriod.forEach(w=>{
    pc.appendChild(el(`<div class="progress-row"><span>${escapeHtml(w.period)}</span><span>${w.acc}% (${w.t} qs)</span></div>`));
    pc.appendChild(el(`<div class="progress-track" style="margin-bottom:10px"><div class="progress-fill" style="width:${w.acc}%"></div></div>`));
  });
  c.appendChild(pc);

  c.appendChild(el(`<div class="card" style="margin-top:14px"><h3>Study heatmap (last 28 days)</h3><div style="display:flex; gap:6px; flex-wrap:wrap">${renderHeatmap()}</div></div>`));
};

/* ============================================================
   VIEW: REVISION PLANNER
   ============================================================ */
VIEWS.planner = function(c){
  c.appendChild(el(`<div class="page-head"><div><div class="eyebrow">Plan ahead</div><h2>Revision Planner</h2><p class="sub">Set your exam date to get a suggested daily plan.</p></div></div>`));
  const card = el(`<div class="card"><label class="field-label">Exam date</label><input type="date" id="examDate" value="${STATE.settings.examDate||''}"><button class="btn btn-primary" style="margin-top:12px" id="saveDate">Save</button></div>`);
  c.appendChild(card);
  card.querySelector('#saveDate').onclick=()=>{ STATE.settings.examDate = card.querySelector('#examDate').value; saveState(); renderApp(); };
  if(!STATE.settings.examDate) return;
  const days = Math.max(1, Math.ceil((new Date(STATE.settings.examDate)-new Date())/86400000));
  const remainingAuthors = AUTHORS.length - AUTHORS.filter(a=>STATE.srs["c-a-"+a.id]).length;
  const perDay = Math.max(3, Math.ceil(remainingAuthors/Math.max(1,days)));
  const weak = computeWeakAreas();
  c.appendChild(el(`<div class="grid grid-3" style="margin-top:14px">
    <div class="card stat-card"><div class="num">${days}</div><div class="lbl">Days remaining</div></div>
    <div class="card stat-card"><div class="num">${remainingAuthors}</div><div class="lbl">Authors left to study</div></div>
    <div class="card stat-card"><div class="num">${perDay}</div><div class="lbl">Suggested authors/day</div></div>
  </div>`));
  const plan = el(`<div class="card" style="margin-top:14px"><h3>Suggested focus</h3></div>`);
  plan.appendChild(el(`<div class="list-row"><b>Today</b><span style="flex:1; margin-left:10px">${perDay} new authors + ${dueCards().length} due flashcards</span></div>`));
  plan.appendChild(el(`<div class="list-row"><b>This week</b><span style="flex:1; margin-left:10px">Finish ${weak[0]? weak[0].period : 'one full period'} + 2 practice tests</span></div>`));
  plan.appendChild(el(`<div class="list-row"><b>Final week</b><span style="flex:1; margin-left:10px">Switch to Titles & Quick Facts + retry all mistakes</span></div>`));
  c.appendChild(plan);
  if(days<=14){
    const btn = el(`<button class="btn btn-primary" style="margin-top:12px" id="rapidBtn">Enter Rapid Revision Mode</button>`);
    btn.onclick=()=>navigate('terms');
    c.appendChild(btn);
  }
};

/* ============================================================
   VIEW: SETTINGS & HELP
   ============================================================ */
VIEWS.settings = function(c){
  c.appendChild(el(`<div class="page-head"><div><div class="eyebrow">Configure</div><h2>Settings & Help</h2></div></div>`));

  const dataCard = el(`<div class="card"><h3>💾 Data — export / import / reset</h3>
    <p style="font-size:12.5px;color:var(--text-mute)">Everything (progress, flashcard schedule, bookmarks, notes, mistakes, test history) lives only in this browser. Export regularly to avoid losing it.</p>
    <div class="chip-row" style="margin-top:10px">
      <button class="btn" id="exportBtn">⬇ Export progress (.json)</button>
      <label class="btn">⬆ Import progress<input type="file" id="importFile" accept="application/json" style="display:none"></label>
    </div>
    <hr class="divider">
    <div class="chip-row">
      <button class="btn btn-outline-burgundy btn-sm" id="resetToday">Reset today's progress</button>
      <button class="btn btn-outline-burgundy btn-sm" id="resetQuiz">Reset quiz history</button>
      <button class="btn btn-outline-burgundy btn-sm" id="resetCards">Reset flashcards</button>
      <button class="btn btn-outline-burgundy btn-sm" id="resetAll">Reset everything</button>
    </div>
  </div>`);
  c.appendChild(dataCard);
  dataCard.querySelector('#exportBtn').onclick=()=>{
    const blob = new Blob([JSON.stringify(STATE,null,2)], {type:"application/json"});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="bcs-lit-progress.json"; a.click();
  };
  dataCard.querySelector('#importFile').addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ try{ STATE = Object.assign(defaultState(), JSON.parse(r.result)); saveState(); toast("Progress restored"); renderApp(); }catch(err){ toast("Invalid file"); } };
    r.readAsText(f);
  });
  function confirmAnd(msg, fn){ if(confirm(msg)) fn(); }
  dataCard.querySelector('#resetToday').onclick=()=>confirmAnd("Reset today's progress?", ()=>{ delete STATE.dailyLog[todayStr()]; saveState(); toast("Today's progress reset"); renderApp(); });
  dataCard.querySelector('#resetQuiz').onclick=()=>confirmAnd("Reset all quiz/test history?", ()=>{ STATE.testHistory=[]; STATE.mistakes=[]; STATE.qAttemptedIds=[]; saveState(); toast("Quiz history reset"); renderApp(); });
  dataCard.querySelector('#resetCards').onclick=()=>confirmAnd("Reset all flashcard scheduling?", ()=>{ STATE.srs={}; saveState(); toast("Flashcards reset"); renderApp(); });
  dataCard.querySelector('#resetAll').onclick=()=>confirmAnd("This wipes ALL progress permanently. Continue?", ()=>{ STATE=defaultState(); saveState(); toast("Everything reset"); renderApp(); });

  const appearance = el(`<div class="card" style="margin-top:14px"><h3>🎨 Appearance</h3>
    <label class="field-label">Bengali font</label>
    <p style="font-size:12.5px;color:var(--text-mute)">Set to <b>Kalpurush</b> with automatic fallback to Noto Serif Bengali. If you have the Kalpurush.ttf file, you can embed it by editing the <code>@font-face</code> rule at the top of this HTML file's &lt;style&gt; section.</p>
  </div>`);
  c.appendChild(appearance);

  const help = el(`<div class="card" style="margin-top:14px"><h3>⌨ Keyboard shortcuts</h3></div>`);
  [["Ctrl / Cmd + K","Open global search"],["Space","Flip flashcard"],["1 / 2 / 3 / 4","Again / Hard / Good / Easy (on flashcards)"],["Esc","Close modal"]].forEach(([k,v])=>
    help.appendChild(el(`<div class="kbd-row"><span>${v}</span><span class="kbd">${k}</span></div>`)));
  c.appendChild(help);

  const about = el(`<div class="card" style="margin-top:14px"><h3>ℹ About this app & source fidelity</h3>
    <p style="font-size:13px; line-height:1.7; color:var(--text-dim)">
    This app is built entirely from <b>${escapeHtml(D.meta.title)}</b> by ${escapeHtml(D.meta.author)} (${D.meta.pages} pages), converted from the source PDF.
    English content (author facts, dates, titles, works, previous questions, figures of speech) is extracted directly from the book's text layer.
    The book also contains extensive Bengali (Bangla) explanatory text set in a legacy, non-Unicode font (SutonnyMJ). That font renders correctly in the
    original PDF but does not extract as valid Unicode text — so some Bangla passages could not be automatically and reliably converted for this pass,
    and were conservatively filtered out rather than guessed at, to avoid showing you incorrect Bangla. The Period Timeline and the Old English chapter
    were manually verified against the original page images for full accuracy, including their Bangla notes. All other Bangla content can be refined in
    a follow-up pass — the English facts, dates, titles, and previous questions throughout are drawn straight from the source.</p>
  </div>`);
  c.appendChild(about);
};

/* ============================================================
   BOOT
   ============================================================ */
document.documentElement.setAttribute('data-theme', STATE.settings.theme);
const initialHash = location.hash.replace('#','').split('/');
currentView = initialHash[0] || STATE.lastVisit.view || 'dashboard';
renderApp(initialHash[1]?decodeURIComponent(initialHash[1]):null);

})();

</script>
</body>
</html>
