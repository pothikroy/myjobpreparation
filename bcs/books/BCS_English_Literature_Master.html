ovel); Little Dorrit; The Battle of Life (note: Jonathan Swift wrote a different work, The Battle of the Books). Famous quote: 'Charity begins at home, and justice begins next door.'", "id": "a75"}, {"name": "Maxim Gorky", "dates": null, "period": "The Victorian Period", "text": "Alexei Maximovich Peshkov, known as Maxim Gorky, a Russian writer. Called the Father of Socialist Realism. His pen name 'Gorky' means 'bitter'. Novels: Mother (originally written in Russian, published 1906; translated into nearly every language of the world within a century; set against the backdrop of a revolutionary workers' movement, with its two main characters Pavel and his mother); My Childhood.", "id": "a76"}, {"name": "William Makepeace Thackary", "dates": "1811-1863", "period": "The Victorian Period", "text": "(1811-1863). An Indian-born British novelist (born in British India, Calcutta, in 1811). His writing focused heavily on the vices/hypocrisy of contemporary society. Famous novels: Vanity Fair (a novel with no hero; Thackeray uses it to satirise England; theme: man's sinful attachment to worldly things); The Virginians: A Tale of the Last Century (1857-59, his historical novel); Catherine: A Story (his first novel); The Newcomes (first published 1855).", "id": "a77"}, {"name": "Edward Fitzgerald", "dates": null, "period": "The Victorian Period", "text": "Translated the Rubaiyat of Omar Khayyam (the Persian poet Omar Khayyam's quatrains) into English.", "id": "a78"}, {"name": "John Stuart Mill", "dates": null, "period": "The Victorian Period", "text": "The chief proponent of 'individual liberty' (libertarianism). Books: On Liberty; Utilitarianism; A System of Logic.", "id": "a79"}, {"name": "Thomas Hardy", "dates": "1840-1928", "period": "The Victorian Period", "text": "(1840-1928). Title: Pessimistic Novelist. He wrote novels in the Victorian age and poems/short stories in the Modern period. He was influenced by Wordsworth and Charles Dickens. His collected poems are called Wessex Poems. Famous poem: At an Inn. Famous novels: Tess of the d'Urbervilles (full subtitle 'A Pure Woman Faithfully Presented', 1891; characters Tess, Alec, Angel); Far From the Madding Crowd; The Return of the Native (1886); The Poor Man and the Lady; The Mayor of Casterbridge; Jude the Obscure (Hardy exposed his deepest feelings in this bleak, angry novel and, stung by the hostile response, never wrote another novel); The Trumpet Major (his only historical novel, set against the Battle of Trafalgar); A Pair of Blue Eyes (Bengali novelist Sharatchandra drew on this to write his famous novel Grihadaha); Under the Greenwood Tree (Shakespeare's As You Like It contains a song with the same title). Famous quote: 'The greater the sinner, the greater the saint.'", "id": "a80"}, {"name": "Christina Rossetti", "dates": null, "period": "The Victorian Period", "text": "Poems: A Daughter of Eve; My Dream; Bride Song; Dream Land.", "id": "a81"}, {"name": "Dante Gabriella Rossetti", "dates": null, "period": "The Victorian Period", "text": "Dante Gabriel Rossetti. Poems: Heart's Compass; Love and Hope; Supreme Surrender; Nuptial Sleep; Redemption.", "id": "a82"}, {"name": "R.L. Stevenson", "dates": null, "period": "The Victorian Period", "text": "Robert Louis Stevenson, a Scottish writer, famous for English travelogue writing; one of the 28 most-translated authors in the world. Famous novels: The Treasure Island; Kidnapped (a thrilling adventure story, gripping history and fascinating study of Scottish character); The New Arabian Nights; Black Arrow.", "id": "a83"}, {"name": "Sir Richard Francis Burton", "dates": null, "period": "The Victorian Period", "text": "In 1883 he translated the ancient Indian scholar Vatsyayana's Kama Sutra into English. Famous novel/work: Arabian Nights (an Arab folk story; 'One Thousand and One Nights' is a collection of Middle Eastern and South Asian folk tales compiled during the Islamic Golden Age).", "id": "a84"}, {"name": "Benjamin Franklin", "dates": null, "period": "The Victorian Period", "text": "A scientist, philosopher, and one of the Founding Fathers of the USA. Quotes: 'Early to bed and early to rise makes a man healthy, wealthy and wise'; 'Honesty is the best policy'; 'Admiration is the daughter of ignorance'; 'A penny saved is a penny earned'; 'Eat to please thyself, but dress to please others'; 'Eat to live, not live to eat.'", "id": "a85"}, {"name": "Charlotte Bronte", "dates": null, "period": "The Victorian Period", "text": "The eldest daughter of the Bronte family. Her biography, The Life of Charlotte Bronte, was written by Elizabeth Gaskell. Novels: Jane Eyre (an immortal love story, largely autobiographical, published under the pen name 'Currer Bell'); Shirley; The Professor (her first novel). (Reminder: the 'Bronte Sisters' refers to three sisters who were all famous writers: 1. Emily Bronte 2. Charlotte Bronte 3. Anne Bronte.)", "id": "a86"}, {"name": "Emily Bronte", "dates": null, "period": "The Victorian Period", "text": "The second daughter of the Bronte family. Her only novel: Wuthering Heights (the story of two vengeful neighbouring families), published under the pen name 'Ellis Bell'. Famous poems: A Death Scene; Day Dream; A Little While.", "id": "a87"}, {"name": "Leo Tolstoy", "dates": null, "period": "The Victorian Period", "text": "(1828-1910). A Russian novelist, playwright and political thinker. In his final years he wished to live alone, made his own shoes, and left home secretly without telling anyone; he caught a chill on the way and developed pneumonia, dying at a remote railway station on 20 November 1910. His collected works (short stories, novellas, novels, plays, children's literature, essays, diaries, letters) span roughly 90 volumes. He never won the Nobel Prize. Famous plays: The Power of Darkness; The Fruits of Enlightenment. Famous novels: War and Peace (set against Napoleon Bonaparte's Russian campaign; its central message concerns the horror of war and mankind's struggle for peace); Anna Karenina (heroine Anna; theme: adultery/the consequences of an illicit love affair); Childhood (his first published novel); Resurrection (1899, his last novel); The Kingdom of God is Within You.", "id": "a88"}, {"name": "George Eliot", "dates": null, "period": "The Victorian Period", "text": "Real name Mary Ann Evans. A famous female novelist of the Victorian age who used a male pen name to ensure her work was taken seriously, protect her privacy, and avoid scandal over her relationship with the married George Henry Lewes, with whom she lived for over 20 years. Famous novels: Silas Marner; Adam Bede; The Mill on the Floss; Middlemarch; Romola. Dramatic poem: The Spanish Gypsy (reminder: Matthew Arnold wrote 'The Scholar-Gypsy'; Ralph Hodgson wrote 'Time, You Old Gypsy Man'). Quote: 'No man can be wise on an empty stomach.'", "id": "a89"}, {"name": "Elizabeth Barret Browning", "dates": null, "period": "The Victorian Period", "text": "A famous female poet, wife of poet Robert Browning. Poems: How Do I Love Thee (Sonnet 43); Grief; Lost Mistress; Consolation; Sonnets from the Portuguese. Famous quotes: 'How do I love thee? Let me count the ways'; 'I love thee to the depth and breadth and height.'", "id": "a90"}, {"name": "Charles Robert Darwin", "dates": null, "period": "The Victorian Period", "text": "(1809-1882). An English naturalist, the first to demonstrate through direct observation that all species evolved from a few common ancestors — his theory of Natural Selection. He is the Father of the Theory of Evolution. Famous books: The Origin of Species; The Origin of Life and Earth; The Descent of Man. Famous quote: 'Tomorrow, as yesterday, only the fittest will survive in the struggle for existence.' (Reminder: Sir James Jeans wrote a related prose work, 'The Origin of Life on Earth'.)", "id": "a91"}, {"name": "John Henry Cardinal Newman", "dates": null, "period": "The Victorian Period", "text": "A leader of the 'Oxford Movement'. Famous books: Loss and Gain (a novel); The Idea of a University. (Reminder: Nobel laureate economist Amartya Sen wrote two famous prose books called 'Idea and Justice' and 'Poverty and Famine'.)", "id": "a92"}, {"name": "Gladstone", "dates": null, "period": "The Victorian Period", "text": "Title: Grand Old Man of Britain (compare: the Indian politician Dadabhai Naoroji is called the 'Grand Old Man of India'). Famous quote: 'Justice delayed, justice denied; justice hurried, justice buried.'", "id": "a93"}, {"name": "Alexandre Dumas", "dates": null, "period": "The Victorian Period", "text": "A French playwright and novelist, famous as a writer of historical adventure novels; his published writing totals about a million pages. Novels: Three Musketeers (also known as 'The Three Musketeers' — a historical adventure novel narrating the adventures of a young man, d'Artagnan, who leaves home to travel to Paris to join the Musketeers of the Guard); Twenty Years After; Black Tulip; The New Troy.", "id": "a94"}, {"name": "Karl Marx", "dates": null, "period": "The Victorian Period", "text": "Born 5 May 1818 into a Jewish family in Prussia, Germany; born in Germany but settled in England. Father of socialism and modern scientific communism. A famous German philosopher and pioneer of Marxism, propounder of the 'Theory of Surplus Value' and the 'Theory of Exploitation'. Died in England in 1883. Famous books: Das Kapital (often called the 'Bible of socialism'); Communist Manifesto; The Holy Family. Famous quotes: 'Religion is the opium of the people'; 'The history of all hitherto existing society is the history of class struggles'; 'Men make their own history.' (In Bengali literature, the Marxist poet is Bishnu Dey; the Marxist novelist is Manik Bandyopadhyay.)", "id": "a95"}, {"name": "Mark Twain", "dates": null, "period": "The Victorian Period", "text": "Real name Samuel Langhorne Clemens (pen name Mark Twain). An American writer, entrepreneur, publisher and lecturer. Books: The Adventures of Tom Sawyer (1876); Adventures of Huckleberry Finn (1885).", "id": "a96"}, {"name": "H. Christian Unlerson", "dates": null, "period": "The Victorian Period", "text": "Hans Christian Andersen, a Danish author, called the father of English (modern) fairy tales. His most famous fairy tales: 'The Emperor's New Clothes'; 'The Little Mermaid'; 'The Nightingale'; 'The Snow Queen'; 'The Ugly Duckling'.", "id": "a97"}, {"name": "Elizabeth Gaskell", "dates": null, "period": "The Victorian Period", "text": "Books: North and South; Wives and Daughters; Mary Barton. (She also wrote the biography The Life of Charlotte Bronte.)", "id": "a98"}, {"name": "Sir Arthur Conan Doyle", "dates": null, "period": "The Victorian Period", "text": "A British author and physician. Books: Sherlock Holmes (detective stories); A Study in Scarlet; The Sign of Four (1890, Sherlock Holmes's second appearance); The Hound of the Baskervilles.", "id": "a99"}, {"name": "A. S. Hornby", "dates": null, "period": "The Victorian Period", "text": "Famous for dictionary writing (compiled the Oxford Advanced Learner's Dictionary).", "id": "a100"}, {"name": "Kiran Desai", "dates": null, "period": "The Victorian Period", "text": "Novel: The Inheritance of Loss.", "id": "a101"}, {"name": "Samuel Butler", "dates": "1832-1902", "period": "The Victorian Period", "text": "(1832-1902), a Victorian novelist (distinct from the Restoration-era poet/satirist of the same name). Famous work: The Way of All Flesh — a semi-autobiographical novel. (Reminder: William Congreve of the Restoration period wrote a different work, 'The Way of the World'.) Quote: 'Self-preservation is the first law of nature.'", "id": "a102"}, {"name": "Oscar Wilde", "dates": "1856-1900", "period": "The Victorian Period", "text": "(1856-1900). An Irish-born novelist and dramatist. Famous books and plays: A Woman of No Importance; An Ideal Husband; The Selfish Giant; Lady Windermere's Fan (1890); The Picture of Dorian Gray (a brilliantly allusive moral tale of youth, beauty and corruption, greeted with howls of protest on publication); The Importance of Being Earnest (a play; principal characters Ernest, Algernon, and Cecily/Gwendolen types).", "id": "a103"}, {"name": "Edgar Allan Poe", "dates": null, "period": "The Victorian Period", "text": "(1809-1849). An American poet, editor, short-story writer, and a leading figure of the American Romantic movement. Title: Father of the English Short Story and the Modern Detective Story (in Bengali literature, Rabindranath Tagore is the father of the short story; the first successful Bengali short story is 'Dena Paona'; the first published Bengali short story is 'Bhikharini'; the last is 'Laboratory'). His only novel: The Narrative of Arthur Gordon Pym of Nantucket (a classic adventure story with supernatural elements). Famous poem: To Helen — this poem influenced Jibanananda Das's Bengali poem 'Banalata Sen'. Famous short stories: The Black Cat (reminder: German writer Günter Grass wrote an unrelated novel Cat and Mouse); The Oval Portrait; The Tell-Tale Heart; The Gold Bug; The Light House (reminder: modern-era writer Virginia Woolf wrote an unrelated novel 'To the Lighthouse').", "id": "a104"}, {"name": "Napoleon", "dates": null, "period": "The Victorian Period", "text": "Napoleon Bonaparte (1769-1821). Title: 'Child of the French Revolution'; nickname 'Little Corporal'. Considered one of the greatest military commanders of all time. Born on the island of Corsica, Italy. Emperor of France from 1804 to 1815. Had a deep love affair with Josephine (his lover was older than him). Died in exile on the island of Saint Helena in 1821. (The ancient Indian king Samudragupta of the Gupta dynasty is called the 'Napoleon of Ancient India'.) Famous quotes: 'Give me a good mother; I will give you a good nation'; 'The career is open to the talents'; 'England is a nation of shopkeepers'; \"'Impossible' is a word to be found only in the dictionary of fools.\"", "id": "a105"}, {"name": "Abraham Lincoln", "dates": null, "period": "The Victorian Period", "text": "(1861-1865). The 16th President of the United States. Propounder of the theory of 'good neighbourliness'. Assassinated by John Wilkes Booth on 15 April 1865. In 1863 he ended slavery in the United States through the Emancipation Proclamation. Famous quotes: 'Democracy is the government of the people, by the people, for the people' (from his 272-word Gettysburg Address, delivered in just over 2 minutes on 21 November 1863 — Bangabandhu Sheikh Mujib's historic 7th March speech is often compared to the Gettysburg Address); 'With malice toward none, with charity for all'; 'The ballot is stronger than the bullet'; 'You can fool all the people some of the time, and some of the people all the time, but you cannot fool all the people all the time'; 'The best way to destroy an enemy is to make him a friend'; 'No man has a good enough memory to be a successful liar'; 'Marriage is neither heaven nor hell, it is simply purgatory.'", "id": "a106"}, {"name": "A.P.J. Abdul Kalam", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Full name: Abul Pakir Jainulabdeen Abdul Kalam. 11th President of India and the 4th Muslim president of India. Born 15 October 1931; died 27 July 2015 (age 84), in Rameswaram, Tamil Nadu, India. Titles: Missile Man, 'People's President'. Famous books: Wings of Fire (an autobiography); Ignited Minds; Inspiring Thought; The Luminous Sparks; Turning Points; You Are Born to Bloom; Target 3 Billion; Indomitable Spirit; My Journey. Quote: 'Dream is not that which you see while sleeping; it is something that will not let you sleep.'", "id": "a107"}, {"name": "A.C. Bradley", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Full name Andrew Cecil Bradley. A famous critic of Shakespeare. Famous book: Shakespearean Tragedy.", "id": "a108"}, {"name": "Anthony Mascarenhas", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "1928 – 3 1986) A famous Pakistani journalist and author Mascarenhas was born into a Goan Catholic family in and educated in 1971 13 Genocide Article The is that played its in ending the war. It helped world Pakistan and encouraged India to play a decisive Indian Prime Minister Indira Gandhi stating that her \"to the for armed intervention\". Books: The Rape of Bangladesh (1971) 1971 Bangladesh: A Legacy of Blood 1986 Alexander The Rape of the Lock epic) Henry Fielding: Rape upon Rape (novel) William The Rape of Laurece (poem)", "id": "a109"}, {"name": "Adlof Hitler", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Adolf Hitler. An Austrian-born German politician; became Chancellor of Germany on 30 January 1933; his secret police was called the Gestapo; on 2 August 1934 he declared himself 'Führer' (Leader); leader of the Nazi party; his secret lover was Eva Braun; on 30 April 1945 he and Eva Braun committed suicide together to avoid capture by the Red Army. Famous autobiography: Mein Kampf (My Struggle). Quote: 'War is life; war is universal.'", "id": "a110"}, {"name": "Allen Ginsberg", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(June 3, 1926 – April 5, 1997). A famous American poet. Famous poem: 'September on Jessore Road' (152 lines) — Ginsberg was a leading figure of the Beat Generation and counterculture of the 1950s; in 1971 he toured Bangladeshi refugee camps in India with Bengali writer Sunil Gangopadhyay during the Liberation War, and wrote this poem about the refugees' suffering, later turning it into a song with Bob Dylan to raise aid money for Bangladeshi refugees.", "id": "a111"}, {"name": "Arther Clarke", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Arthur C. Clarke, a famous science fiction writer.", "id": "a112"}, {"name": "Alexander Campbell", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Book: The Heart of India (a history book).", "id": "a113"}, {"name": "Arundhuty Roy", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Arundhati Roy (born 24 November 1961, Shillong, Meghalaya, India). Books: The God of Small Things (novel; won the Booker Prize in 1997); Field Notes on Democracy.", "id": "a114"}, {"name": "Alice Munro", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A Canadian short-story writer; won the Nobel Prize in 2013. Novel/story collection: My Mother's Dream.", "id": "a115"}, {"name": "Amitav Ghosh", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An Indian literary figure. Works: The Glen Palace; Sea of Poppies; River of Smoke; The Shadow Lines (novel).", "id": "a116"}, {"name": "Aldus Huxley", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Aldous Huxley. Novels: Point Counter Point; Ends and Means; Brave New World (Huxley's vision of a future human race controlled by global capitalism is every bit as prescient as Orwell's more famous dystopia).", "id": "a117"}, {"name": "Amartya Sen", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Born 3 November 1933. A Nobel Prize-winning (1998) Bangladeshi-Indian Bengali economist and philosopher, born in Manikganj, Bangladesh; his ancestral home is in Wari, Dhaka. Reportedly Rabindranath Tagore named him 'Amartya', meaning immortal/imperishable. Currently Thomas W. Lamont University Professor at Harvard, and honorary professor at various universities. He devised the 'Human Development Index' to help the UN assess countries' education and human resource development. His books have been translated into about thirty languages over the past forty years. He was ranked 14th greatest Bangalee in a BBC poll. Notable books: Poverty and Famines: An Essay on Entitlement and Deprivation; On Ethics and Economics; Development as Freedom; An Uncertain Glory: India and its Contradictions; The Country of First Boys.", "id": "a118"}, {"name": "Arbinda Adigaon", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Aravind Adiga. Novel: The White Tiger.", "id": "a119"}, {"name": "Albert Camus", "dates": "1913-1960", "period": "The Modern & Post-Modern Periods", "text": "(1913-1960). Famous books: The Outsider (or The Stranger, 1992 English edition); The Myth of Sisyphus (Le Mythe de Sisyphe, 1942); The Plague (1947).", "id": "a120"}, {"name": "Aiub Khan", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Ayub Khan. Book: Friend Not Master.", "id": "a121"}, {"name": "Anita Desai", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Anita Mazumdar Desai (born 24 June 1937). An Indian novelist, Emerita John E. Burchard Professor of Humanities at MIT. Works: Games at Twilight; Fire on the Mountain.", "id": "a122"}, {"name": "Anne Frank", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Work: The Diary of a Young Girl (originally written in Dutch) — describes events during the German Nazi occupation of the Netherlands in WWII; the writer recounts two years hiding in secret with her family.", "id": "a123"}, {"name": "Bangabandhu Sheikh Mujibur Rahman", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "The founding leader of Bangladesh / Father of the Nation (17 March 1920 – 15 August 1975). Famous book: his unfinished autobiography (published 12 June 2012), with a foreword by Sheikh Hasina; English translation 'The Unfinished Memoirs' (translated by Fakrul Alam); also translated into Arabic, Japanese (by Kazuhiro Watanabe) and Chinese (by Chi Jhee, former Chinese ambassador to Bangladesh); published by University Press Ltd. Another book: 'Amar Kichu Kotha'. On 5 April 1971, Newsweek magazine (US) published a famous report on Bangabandhu titled 'Poet of Politics'. (Reminder: Gi Maola's compilation of Bangabandhu's 7 March speech translated into 12 languages, with his life story, is also titled 'Poet of Politics'.) On 5 December 1969 Mujib declared that henceforth East Pakistan would be called 'Bangladesh'. On the night of 26 March 1971 he declared Bangladesh's independence: 'This may be my last message, from today Bangladesh is independent...' Famous quotes: 'This time the struggle is for our freedom, this time the struggle is for our independence!' (7 March 1971); 'My greatest strength is the love for my people. My greatest weakness is that I love them too much' (interview with Sir David Frost, BBC, 1972); 'I have given you independence, now go and preserve it' (to Awami League leaders hours before his arrest, 25 March 1971).", "id": "a124"}, {"name": "Barak Obama", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Barack Obama. Kenyan-descended Barack (Hussein) Obama became the first African-American US president; was a senator from Illinois; in 2009 elected the 44th US President and in the same year won the Nobel Peace Prize. (Reminder: a total of 4 US presidents have won the Nobel Peace Prize — besides Obama: Theodore Roosevelt [1901, renamed the White House], Woodrow Wilson [USA's only president with a doctorate degree], and Jimmy Carter [wrote 'White House Diary'].) Famous books: The Audacity of Hope; Dreams From My Father; It Takes A Nation; Change We Can Believe In; Of Thee I Sing: A Letter to My Daughters. (Reminder: W.B. Yeats wrote a famous poem 'A Prayer for My Daughter'.)", "id": "a125"}, {"name": "Bertrand Russell", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(18 May 1872 – 2 February 1970). A British philosopher, logician, mathematician, historian, writer, social critic and political activist; awarded the Nobel Prize in Literature in 1950. Jailed for 6 months for anti-war statements during WWI. In Bengali literature, Motaher Hossain Chowdhury is called 'Bertrand Russell's spirit-kin'; his book 'Sukh' is a translation of Russell's 'The Conquest of Happiness'. Famous books: The Elements of Ethics; Human Knowledge; The Problems of Philosophy; Introduction to Mathematical Philosophy; Religion and Science; Marriage and Morals; The Impact of Science on Society.", "id": "a126"}, {"name": "Chinua Achebe", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A Nigerian novelist, poet and professor. Title: Father of Modern African Literature. Novels: Things Fall Apart; Arrow of God; The African Trilogy; The Man of the People.", "id": "a127"}, {"name": "Condoleezza Rice", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Book: No Higher Honour.", "id": "a128"}, {"name": "Dan Brown", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(born June 22, 1964). An American author of thriller fiction. Best-selling novels: The Da Vinci Code (a 2003 mystery-detective novel); Angels and Demons.", "id": "a129"}, {"name": "Doris Lessing", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An African (Zimbabwe-raised) English writer. Famous novels: The Grass is Singing; Children of Violence; The Good Terrorist; The Golden Notebook (won her the 2007 Nobel Prize).", "id": "a130"}, {"name": "D.H. Lawrence", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "David Herbert Richards Lawrence. A famous novelist of the Modern Age; his characters always portray himself. Famous novels: Sons and Lovers (autobiographical); Lady Chatterley's Lovers; The Rainbow (reminder: William Wordsworth wrote a famous poem of the same name); Women in Love; The White Peacock (reminder: Aravind Adiga wrote 'The White Tiger'; the peacock is India's national bird). Famous short stories: The Virgin and the Gypsy; The Rocking-Horse Winner.", "id": "a131"}, {"name": "Dylan Thomas", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Poems: Fern Hill; The Map of Love.", "id": "a132"}, {"name": "E. M. Milford", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Book: The Field of Embroidered Quilt (an English translation of the folk poet Jasimuddin's 'Nakshi Kanthar Math'; Jasimuddin's famous English-language prose work is 'Folk Songs of East Bengal').", "id": "a133"}, {"name": "Emerson", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Ralph Waldo Emerson (May 25, 1803 – April 27, 1882). An American essayist, lecturer and poet who led the Transcendentalist movement of the mid-19th century. Famous book: The American Scholar.", "id": "a134"}, {"name": "Erik Axel Karlfeldt", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "The only posthumous Nobel Prize winner in Literature (1931). (Only 3 people have ever received a posthumous Nobel Prize; the other two were Dag Hammarskjöld [Peace, 1961] and Ralph M. Steinman [Medicine, 2011].)", "id": "a135"}, {"name": "E.M Forster", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Edward Morgan Forster. Famous essay: 'My Wood'. Famous novels: A Passage to India (characters Dr. Aziz, Ronny Heaslop, Stella Moore, Miss Adela Quested); Howards End; A Room with a View (reminder: Virginia Woolf wrote 'A Room of One's Own', a work of fiction/essay); Where Angels Fear to Tread. Collection of short stories: The Celestial Omnibus.", "id": "a136"}, {"name": "Ernesto Che Guevara", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Che Guevara (born 14 June 1928, Rosario, Argentina; 1928-1967). Title: Che Ernesto. A leading figure of the Cuban revolution. Famous book: Guerrilla Warfare.", "id": "a137"}, {"name": "Ernest Hemingway", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(1899-1961). A famous American novelist and journalist; published 7 novels, 6 short-story collections and two non-fiction books in his lifetime. Famous book (of stories): 'In Our Time'. On 2 July 1961 he shot himself with his favourite shotgun. Novels: A Farewell to Arms (an autobiographical anti-war novel, 1929; Bengali translation by Niaz Morshed); The Old Man and the Sea (written while living in Cuba, 1951; won him the 1953 Pulitzer Prize and the 1954 Nobel Prize; Bengali translation by Fateh Lohani; the story of an old fisherman Santiago's struggle with a giant marlin fish; reminder: Indian politician Dadabhai Naoroji is called 'The Grand Old Man of India'); For Whom the Bell Tolls (reminder: John Donne of the Jacobean period wrote a poem of the same title); The Sun Also Rises (Hemingway's first and best novel, exploring courage, cowardice and manly authenticity — reminder: John Donne wrote the poem 'The Sun Rising'); The Dangerous Summer; True at First Light; The Torrents of Spring. Short stories: Indian Camp (1924); Cat in the Rain (1925); Men Without Women (a collection); The Killers.", "id": "a138"}, {"name": "Francis Fokuama", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Francis Fukuyama, currently a senior fellow at Stanford University. Book: The End of History and the Last Man.", "id": "a139"}, {"name": "Fidel Castro", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Former President of Cuba. Books: The Guerrilla of Time; The Strategic Victory. On Bangabandhu, Fidel Castro said: 'I have not seen the Himalayas, but I have seen Sheikh Mujib. In personality and in courage, this man is the Himalayas. I have thus had the experience of witnessing the Himalayas' [at a Non-Aligned Movement summit in Algiers, 1973].", "id": "a140"}, {"name": "Fyodor Dostoyevsky", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A Russian writer and philosopher. Famous novels: Crime and Punishment (theme: 'Crime never goes without punishment'); The Idiot; The Eternal Husband; A Little Hero; The House of the Dead; Notes from Underground.", "id": "a141"}, {"name": "Gunnar Myrdal", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A Swedish Nobel laureate economist, sociologist, and politician. Famous book: The Asian Drama.", "id": "a142"}, {"name": "Gunter Grass", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Günter Grass. A famous German poet and novelist; worked in Hitler's paramilitary force in his youth; won the Nobel Prize in Literature in 1999; visited Bangladesh in 1986; died 13 April 2015. Novels: The Tin Drum (his finest novel); Cat and Mouse (reminder: W.B. Yeats wrote a different poem, 'The Cat and the Moon'); Dog Years; What Must Be Said.", "id": "a143"}, {"name": "Gabriel Garcia Marquez", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(1927-2014). A Colombian writer/novelist; died 17 April 2014 in Mexico; won the Nobel Prize in 1982; considered the most important Latin American writer of the 20th century. Novels: Love in the Time of Cholera; Autumn of the Patriarch; One Hundred Years of Solitude (originally written in Spanish; famous quote: 'They were so close to each other that they preferred death to separation').", "id": "a144"}, {"name": "George Orwell", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Real name Eric Arthur Blair. A British colonial-era police officer; born in Motihari, undivided Bengal Presidency, India. Strongly influenced by the novelist Jonathan Swift. Died of tuberculosis at just 46. Famous novels: Animal Farm (a Soviet-critical allegorical novel using barnyard animals to satirise contemporary politics and society); Nineteen Eighty-Four (written 1949, imagining a 1984 world with no freedom of speech and total state surveillance/control; a famous line — 'Big Brother is watching you' — introduced the phrase 'Big Brother'; both novels rank among the 20th century's greatest books); Homage to Catalonia; The Road to Wigan Pier. Famous essay: 'Shooting an Elephant'.", "id": "a145"}, {"name": "George Bernard Shaw", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Born in Ireland in 1856. Short name G.B. Shaw. Wrote more than 60 plays. Title: Father of Modern English Literature/Drama; the greatest playwright of the Modern period, strongly influenced by Henrik Ibsen; a member of the Fabian Society; won the Nobel Prize in Literature in 1925. Famous plays: Man and Superman (1902-03, a famous 'Comedy of Ideas'); Arms and the Man (1894); Caesar and Cleopatra (1898; reminder: 'Antony and Cleopatra' is a famous play by Shakespeare, 'King without crown'); Doctor's Dilemma; Saint Joan (of Arc); Major Barbara; You Never Can Tell; Heartbreak House (1919); The Philanderer; Man of Destiny (1895; reminder: O. Henry wrote 'Roads of Destiny'); The Apple Cart; Widowers' Houses; Candida; Press Cuttings (1909); Beauty's Duty; The Devil's Disciple; Mrs. Warren's Profession; How He Lied to Her Husband; Buoyant Billions; Macbeth Skit; Getting Married; Pygmalion (won him the Academy Award); Too True to Be Good. Famous quotes: 'Nine soldiers out of ten are born fools'; 'God is on the side of the big battalions'; 'Beware of false knowledge; it is more dangerous than ignorance'; 'It is our duty to live as long as we can'; 'This is the lesson of history, that man learns nothing from history.' On the Prophet Muhammad (SAW), Shaw said: 'I have always held the religion of Muhammad in high estimation because of its wonderful vitality... he must be called the Saviour of Humanity.'", "id": "a146"}, {"name": "H. G. Wells", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Full name Herbert George Wells. Famous science fiction: The Time Machine; The Invisible Man.", "id": "a147"}, {"name": "Hilary Clinton", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Hillary Clinton. Former Secretary of State of the USA. Books: Invitation of the White House; Hard Choice (2014); Living History (autobiographical) (reminder: 'My Life' is the autobiography of her husband, 42nd US President Bill Clinton).", "id": "a148"}, {"name": "Henry Kissinger", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An American diplomat and political scientist; former Secretary of State of the USA. Books: Years of Upheaval; White House Years; Diplomacy; Ending the Vietnam War.", "id": "a149"}, {"name": "Harold Pinter", "dates": "1930-2008", "period": "The Modern & Post-Modern Periods", "text": "(1930-2008). Born in the USA in 1930; won the Nobel Prize in 2005. Famous works: The Room; The Birthday Party (reminder: T.S. Eliot wrote a famous novel(-length work) called 'The Cocktail Party'); No Man's Land; The Dumb Waiter; The Caretaker; The Homecoming.", "id": "a150"}, {"name": "Henrik Ibsen", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A Norwegian playwright. Title: Father of Modern Drama. Famous play: A Doll's House (theme: realisation of true freedom; significant for its critical attitude toward 19th-century marriage norms — though sadly, this great writer never won the Nobel Prize).", "id": "a151"}, {"name": "Herman Melville", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An American novelist. Famous novels: Moby Dick (about a white whale); White Jacket; Bartleby the Scrivener.", "id": "a152"}, {"name": "Henry James", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Famous novels: The Wings of the Dove; The Portrait of a Lady; The Tragic Muse; The American; The Ambassadors; The Golden Bowl.", "id": "a153"}, {"name": "Irwin Shaw", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A prolific American playwright, screenwriter, novelist, and short-story author whose written works have sold more than 14 million copies. Famous play: Bury the Dead (an anti-war drama; Bengali writer Munir Chowdhury drew on it to write his play 'Kabar').", "id": "a154"}, {"name": "Irin Khan", "dates": "1992-2002", "period": "The Modern & Post-Modern Periods", "text": "Irene Khan (1992-2002 as Amnesty International Secretary General). Famous book: The Unheard Truth: Poverty and Human Rights.", "id": "a155"}, {"name": "Jimmy Carter", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Ex-President of the USA; 39th President, 1977 to 1981; awarded the 2002 Nobel Peace Prize for his work with the Carter Center. Book: White House Diary (reminder: Henry Kissinger wrote 'The White House Years').", "id": "a156"}, {"name": "John Masefield", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Novels: Mid Summer Night; End and Beginning; The Bird of Dawning. (Reminder: Shakespeare wrote the play 'A Midsummer Night's Dream'; Salman Rushdie wrote 'Midnight's Children'.)", "id": "a157"}, {"name": "J.K. Rawling", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "J.K. Rowling. A British female novelist, screenwriter and film producer. Famous children's book series: Harry Potter. 'Harry Potter and the Half-Blood Prince' is part of a series of seven fantasy novels. (Reminder: Harry Potter actress Emma Watson's famous book is 'He for She'.) Quote: 'We are only as strong as we are united, as weak as we are divided.'", "id": "a158"}, {"name": "Jhumpa Lahiri", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An Indian-born novelist. Famous books: The Namesake; The Lowland; Interpreter of Maladies; A Temporary Matter (short story).", "id": "a159"}, {"name": "Jean Paul Sartre", "dates": "1905-1980", "period": "The Modern & Post-Modern Periods", "text": "(1905-1980). A French novelist, playwright and philosopher; a Marxist-existentialist thinker. In 1964 he voluntarily declined the Nobel Prize. His play 'No Exit' was translated into Bengali as 'Dwarabaddha' by Zia Haider (1936-2008). Books: The Road to Freedom; Nausea; Age of Reason; Iron in the Soul. (Reminder: Russian writer Boris Pasternak also declined the 1958 Nobel Prize in Literature, under government pressure; his books: Dr. Zhivago; Blind Beauty.)", "id": "a160"}, {"name": "James Joyce", "dates": "1882-1941", "period": "The Modern & Post-Modern Periods", "text": "(1882-1941). A famous Irish novelist and poet, known for pioneering the 'Stream of Consciousness' technique in literature. Famous books: Exiles (play, 1918); Ulysses (novel, 1922 — many critics consider this novel, based on Homer's Odyssey, the finest of the 20th century; in 1999 the American publisher Modern Library ranked it top of its list of the 100 best English-language novels of the century; reminder: Tennyson wrote a famous poem also called 'Ulysses'); A Portrait of the Artist as a Young Man (his first novel); Dubliners (a short-story collection).", "id": "a161"}, {"name": "Jane Taylor", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Famous poem: 'Twinkle Twinkle Little Star'.", "id": "a162"}, {"name": "Thomas Jefferson", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An American Founding Father, principal author of the Declaration of Independence (1776); 3rd President of the United States. Quote: 'Eternal vigilance is the price of liberty.'", "id": "a163"}, {"name": "J. M. Synge", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Full name John Millington Synge. A famous dramatist. Famous works: Riders to the Sea (a one-act play; reminder: Ernest Hemingway wrote the novel 'The Old Man and the Sea'); The Playboy of the Western World; The Shadow of the Glen; The Well of the Saints.", "id": "a164"}, {"name": "Joseph Conrad", "dates": "1857-1924", "period": "The Modern & Post-Modern Periods", "text": "(1857-1924). Real name Józef Teodor Konrad; born in what is now Ukraine. Famous short story: The Lagoon. Famous novels: Heart of Darkness (theme: the hypocrisy of imperialism; his masterpiece, about a life-changing journey in search of Mr Kurtz, has the simplicity of great myth — reminder: Alexander Campbell wrote a history book, 'The Heart of India'); Lord Jim: A Tale; Under Western Eyes; Typhoon; The Rover; The Rescue; An Island Tale; A Tale in Two Parts (collection of short stories). (Reminder: Jonathan Swift wrote 'A Tale of a Tub'; Charles Dickens wrote 'A Tale of Two Cities' [London & Paris]; R.M. Ballantyne wrote 'A Tale of the Pacific Ocean' [adventure fiction].)", "id": "a165"}, {"name": "Jules Verne", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Born in France. Title: Father of Science Fiction. Novels: Around the World in Eighty Days (an adventure novel); Journey to the Centre of the Earth. Science fiction: Twenty Thousand Leagues Under the Sea.", "id": "a166"}, {"name": "John F. Kennedy", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "35th US President. Famous quotes: 'Ask not what your country can do for you — ask what you can do for your country'; 'Let us never negotiate out of fear, but let us never fear to negotiate.'", "id": "a167"}, {"name": "Kaiser Hamidul Haq", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(born 7 December 1950). A Bangladeshi poet, translator, essayist, critic and academic; a professor of English at the University of Dhaka. Famous poems and books: Ode on the Lungi; Black Orchid; A Little Ado; A Happy Farewell; Poor Man Eating.", "id": "a168"}, {"name": "Lee kuan Yew", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(1923-2015). The founding father of independent Singapore; its first elected Prime Minister (1965-1990); died 23 March 2015. Book: From Third World to First: The Singapore Story, 1965-2000.", "id": "a169"}, {"name": "Momota Banerjee", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Mamata Banerjee. Book: My Unforgettable Memories.", "id": "a170"}, {"name": "Mahatma Gandhi", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(1869-1948). Title: Bapuji. Full name Mohandas Karamchand Gandhi; born in Gujarat, India, 2 October 1869. Rabindranath Tagore gave him the title 'Mahatma'. Father of the independent Indian nation and leader of the non-violence movement; pioneer of the 'hartal' (non-violent strike) in the Indian subcontinent. His birthday, 2 October, is marked as the International Day of Non-Violence. During the Non-Cooperation Movement he renounced the 'Kaiser-i-Hind' title given by the British government. Winston Churchill called Mahatma Gandhi a 'Half-Naked Indian Fakir'. He edited a South African newspaper called 'The Chronicle'. His life story was made into the world-famous film 'Gandhi', directed by Richard Attenborough. Famous book: The Story of My Experiments with Truth. On 30 January 1948 he was assassinated by Nathuram Godse.", "id": "a171"}, {"name": "Martin Luther King Junior", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An American Baptist minister, activist, humanitarian and leader of the African-American Civil Rights Movement; born 15 January 1929; his birthday was declared an American holiday by President Ronald Reagan (1986). A non-violent leader of the movement for Black civil rights in the US; in 1959 he visited India to study Mahatma Gandhi's philosophy of non-violence; won the Nobel Peace Prize in 1964; assassinated by a sniper on 4 April 1968, in Memphis, Tennessee, USA. Famous speech: 'I Have a Dream' (delivered 28 August, to over 250,000 civil rights supporters, from the steps of the Lincoln Memorial in Washington, DC). Quote: 'Injustice anywhere is a threat to justice everywhere.'", "id": "a172"}, {"name": "Marshall Mcluhan", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A famous Canadian philosopher. First coined the term 'Global Village'. Famous books: The Gutenberg Galaxy: The Making of Typographic Man; Understanding Media (both books developed the concept of the 'global village').", "id": "a173"}, {"name": "Monika Ali", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Monica Ali. A Bangladeshi-born British writer and novelist. Books: Brick Lane; Untold Story.", "id": "a174"}, {"name": "Muhammad Asad", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A Pakistani journalist of Austrian Muslim descent. Famous book: The Road to Mecca. (Reminder: 'The Road to Freedom' is by Jean-Paul Sartre, who declined the Nobel Prize in 1964.)", "id": "a175"}, {"name": "Nathaniel Hawthorne", "dates": "1804–1864", "period": "The Modern & Post-Modern Periods", "text": "(1804-1864). An American novelist. Famous novels: The Scarlet Letter (about the red letter 'A'); The House of the Seven Gables.", "id": "a176"}, {"name": "Nirod C. Chowdhury", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Nirad C. Chaudhuri (born 23 November 1897 – died 1 August 1999). A famous long-lived Bengali intellectual writer and eminent thinker. Wrote a biography of the scholar Max Müller titled 'Scholar Extraordinary' (1975), for which he received India's second-highest literary honour, the Sahitya Akademi award. Known especially for his historical insight and sharp prose in both English and Bengali; published 11 books in English and 5 in Bengali, besides various essay/prose collections. Pen name: Balahak Nandi. Home: Kishoreganj, Mymensingh. Editor of 'Shanibarer Chithi'. Famous novel: A Passage to England (1953). Famous books: 'Atmaghati Bangali'; The Autobiography of an Unknown Indian (1951, his principal literary work; dedicated to the British administration, ironically, as India's newly independent nation; contains an account of rural Bengal in the early 20th century under British rule).", "id": "a177"}, {"name": "Neil Armstrong", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An American astronaut. On 20 July 1969 he became the first person to set foot on the Moon, at which time he made the famous remark: 'That's one small step for a man, one giant leap for mankind.'", "id": "a178"}, {"name": "Nelson Mandela", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(18 July 1918 - 5 December 2013). Title: Icon of peace, freedom & reconciliation. Former President of South Africa; won the Nobel Peace Prize in 1993 and visited Bangladesh in 1997; South Africa's first democratically elected president (1994-1999); his political party was the African National Congress (ANC); had six nicknames — Madiba, Tata, Khulu, Dalibhunga, Rolihlahla and Nelson. Was imprisoned for 27 years, 1964-1990, mostly on Robben Island. 'The 46664' was an anti-AIDS campaign (named for his prisoner number, 466, in 1964). Founded 'Yes for the Children'. Autobiographical books: A Long Walk to Freedom; Conversation with Myself. Quote: 'Education is the most powerful weapon which you can use to change the world.'", "id": "a179"}, {"name": "Noam Chomsky", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A Jewish American linguist, philosopher and logician. Famous book: The Common Good.", "id": "a180"}, {"name": "Orhan Pamuk", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A Turkish writer; won the Nobel Prize in 2006. Famous books: My Name is Red; The White Castle; The New Life; The Black Book; The Museum of Innocence (reminder: 'Songs of Innocence' is a poetry collection by the Romantic poet William Blake).", "id": "a181"}, {"name": "Pandit Nehru", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Jawaharlal Nehru. Title: Chacha (Uncle). One of the founders of the Non-Aligned Movement (NAM). Books: Discovery of India (written in prison during the Quit India Movement); Glimpses of World History. Quote: 'The country is good if its universities are good.'", "id": "a182"}, {"name": "Pablo Neruda", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A Chilean poet, diplomat and politician; won the Nobel Prize in 1971. Colombian novelist Gabriel García Márquez called him 'The Greatest Poet of the 20th Century in any language'. Famous books of poems: Twenty Love Poems and a Song of Despair; 100 Love Sonnets. Famous poem: Winter Garden.", "id": "a183"}, {"name": "Pearl S. Buck", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A famous female novelist; the first American woman to win the Nobel Prize in Literature (1938), for her novel 'The Good Earth' (about Chinese life; the folk poet Jasimuddin is often compared with Pearl S. Buck). Other famous books/novels: The Big Wave; Dragon Seed; East Wind: West Wind (reminder: P.B. Shelley wrote the poem 'Ode to the West Wind'); A House Divided; Command the Morning.", "id": "a184"}, {"name": "Parvez Mosharraf", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Pervez Musharraf. Former President of Pakistan. Book: In the Line of Fire (reminder: A.P.J. Abdul Kalam wrote the autobiography 'Wings of Fire').", "id": "a185"}, {"name": "R.K. Narayan", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Works: The Financial Expert; Waiting for the Mahatma (reminder: 'Waiting for Godot' is a famous play by Samuel Beckett); The Guide.", "id": "a186"}, {"name": "Rudyard Kipling", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(1856-1936). A British journalist; achieved fame as a children's writer; of Indian descent, a British novelist. Famous novel: Kim (in this spy story a boy, an orphan in British India, must choose between East and West). Other works: Plain Tales from the Hills; Soldiers Three; Just So Stories (reminder: Kamala Das wrote 'My Story'); The White Man's Burden (a famous poem); Captain Courageous; The Jungle Book (1894, a short-story collection — for this children's classic he won the Nobel Prize in 1907). Famous poems: The Fight; The Blue Roses. Quote: 'East is East, and West is West, and never the twain shall meet.'", "id": "a187"}, {"name": "Steve Jobs", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(1955-2011). Co-founder of the world-famous tech company Apple; an American information-technology entrepreneur and inventor. Quote: 'Innovation distinguishes between a leader and a follower.'", "id": "a188"}, {"name": "Sully Prodhomme", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "First Nobel Prize winner in Literature.", "id": "a189"}, {"name": "Seamus Heaney", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An Irish poet and playwright. Works: Death of a Naturalist; Field Work; Human Chain; Punishment. Famous poems: Digging; Follower; Midterm Break.", "id": "a190"}, {"name": "Salman Rushdi", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Salman Rushdie. A British-Indian novelist and essayist. Books: Satanic Verses; Midnight's Children (reminder: John Masefield wrote a novel called 'Mid Summer Night'; Shakespeare wrote the play 'A Midsummer Night's Dream'); Shame.", "id": "a191"}, {"name": "Sheikh Hasina", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "The current Prime Minister of Bangladesh. Famous books: Who is the Father of My Son (1972); Ora Tokai Keno (1989); Bangladeshe Swairotontrer Jonmo (1993); People and Democracy (1997); Democracy in Distress (2003); Sohena Manobotar Obomanona (2003); Amra Janogoner Kotha Bolte Eshechhi; Living with Tears (2004); Sheikh Mujib Amar Pita (an autobiographical memoir); Sabuj Math Periye.", "id": "a192"}, {"name": "Sigmund Freud", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A famous Austrian neurologist and psychoanalyst; called the father of modern psychology / psychoanalysis. Novelist Manik Bandyopadhyay was influenced early on by Freudian theory, though later by Marxism. Books: Psychopathology in Everyday Life; The Interpretation of Dreams. Reminder box: according to Freud, 'everything is controlled by sex'; according to Karl Marx, 'everything is controlled by money'.", "id": "a193"}, {"name": "Sir Arthur Miller", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Arthur Miller. A famous American playwright. Plays: The Death of a Salesman; A View from the Bridge; All My Sons.", "id": "a194"}, {"name": "Stephen Hawking", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(born 8 January 1942, Britain). Suffered from motor neurone disease. A leading theoretical physicist of the modern world; a well-known interpreter of the Big Bang Theory (though the theory itself was proposed by Georges Lemaître). Famous books: A Brief History of Time; The Theory of Everything; The Universe in a Nutshell.", "id": "a195"}, {"name": "Saul Bellow", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An American novelist; won the Nobel Prize in Literature in 1976. Novels: Seize the Day (theme: 'live the present to the fullest'); The Adventures of Augie March.", "id": "a196"}, {"name": "Samuel Beckett", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An Irish-born dramatist who wrote in both English and French; won the Nobel Prize in 1969. Famous plays: Waiting for Godot (an Absurd play); Endgame; Murphy (Beckett's first published novel is an absurdist masterpiece, a showcase for his uniquely comic voice); The Unnamable; Breathe (his shortest dramatic work); Catastrophe; More Pricks Than Kicks (a short-story collection). Quote: 'Nothing to be done.'", "id": "a197"}, {"name": "Samuel Huntington", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(April 18, 1927 – December 24, 2008). An influential American conservative political scientist, adviser and academic; spent over half a century at Harvard University. Famous essay: The Clash of Civilizations: The Next Pattern of Conflict (1993 — Huntington argued that in the post-Cold-War world, conflict between seven or eight civilizations would be the next pattern of conflict).", "id": "a198"}, {"name": "Salvador Dali", "dates": "1904-1989", "period": "The Modern & Post-Modern Periods", "text": "(1904-1989). A prominent Spanish surrealist painter. Artworks: The Persistence of Memory; The Elephants; Crucifixion.", "id": "a199"}, {"name": "T.S. Eliot", "dates": "1888-1965", "period": "The Modern & Post-Modern Periods", "text": "(1888-1965). Full name Thomas Stearns Eliot. Born in the USA, 1888. One of the most influential poets, playwrights and literary critics of the 20th century. Moved to England at just 25, in 1914, and gained British citizenship in 1927 at age 39. Famous for the 'Theory of Objective Correlative'. The female poet Ezra Pound was his literary collaborator. Famous poem: The Waste Land (1922; theme: the meaninglessness of the modern world; this poem draws on Hindu myth/philosophical allusion; won him the Nobel Prize in 1948 for his outstanding contribution to modern literature). The Waste Land consists of five important parts: The Burial of the Dead ('April is the cruellest month'); A Game of Chess; The Fire Sermon; Death by Water; What the Thunder Said. Rabindranath Tagore's poem 'Tirthajatra' is a translation of Eliot's 'Journey of the Magi'; Rabindranath was the first to translate Eliot's work into Bengali; the Marxist poet Bishnu Dey later translated several of Eliot's famous poems in a book called 'Eliot-er Kobita'. Other famous poem: The Love Song of J. Alfred Prufrock (written around 1915, an outstanding modern dramatic monologue). Famous criticism: Tradition and the Individual Talent. Famous plays: Murder in the Cathedral (his finest play); The Cocktail Party (reminder: Harold Pinter wrote the play 'The Birthday Party'); The Trial of a Judge; The Family Reunion. Other famous poems: The Hollow Men (1925); Gerontion (narrates the opinions of a gerontic/elderly man, through a dramatic monologue reflecting on Europe after WWI through the eyes of a man who lived through most of the 19th century); Ash Wednesday (1930); Four Quartets (1945).", "id": "a200"}, {"name": "Thomas Carlyle", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A Scottish philosopher. Books: The French Revolution; Past and Present. Quotes: 'Speech is great, but silence is greater'; 'Popular opinion is the greatest lie'; 'A loving heart is the beginning of all knowledge'; 'Go as far as you can see; when you get there you'll be able to see farther'; 'A man lives by believing something: not by debating and arguing about many things.'", "id": "a201"}, {"name": "Ted Hughes", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Full name Edward James Hughes. A children's/nature poet from England; served as Poet Laureate 1984-1998 (until his death). Famous poems: Pike; Jaguar; Relic; Thought Fox; Examination at the Womb Door; A Childish Prank; Daffodils (reminder: the Romantic poet Wordsworth also has a famous poem called 'The Daffodils').", "id": "a202"}, {"name": "Toni Morrison", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An American novelist, editor and professor; was Black. Famous novels: Beloved; Song of Solomon; The Bluest Eye (won her the 1993 Nobel Prize).", "id": "a203"}, {"name": "Tahmima Anam", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Editor of The Daily Star, Mahfuz Anam's daughter and Abul Mansur Ahmed's granddaughter. Her English-language trilogy of novels based on the Liberation War: A Golden Age (Sonar Bangla); The Good Muslim; The Bones of Grace (the final part of the trilogy).", "id": "a204"}, {"name": "V. S. Neipaul", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "V.S. Naipaul (full name Vidyadhar Surajprasad Naipaul). Won the Nobel Prize in 2001. Famous novels: The Enigma of Arrival; India: A Wounded Civilization; The Masque of Africa.", "id": "a205"}, {"name": "Virginia Woolf", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A famous female novelist known for the 'presentation of inner realities' (an interior-monologue/stream-of-consciousness technique); died by suicide in secrecy. Finest fiction: A Room of One's Own. Finest essay: Shakespeare's Sister (central character Judith). Famous novels: The Voyage Out (her first published novel); To the Lighthouse (reminder: Edgar Allan Poe wrote the short story 'The Light House'); Mrs Dalloway (a psychological novel; two important characters Clarissa and Peter); The Waves; A Haunted House; Night and Day; The Years; Orlando: A Biography. Quote: 'As a woman, I have no country. As a woman, I want no country. As a woman, my country is the whole world.'", "id": "a206"}, {"name": "Victor Hugo", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(1802-1885). A French novelist and politician; called the most influential Romantic writer of the 19th century. Novels: Les Misérables; The Hunchback of Notre-Dame. Quote: 'Men are the women's playthings, but women are devils.'", "id": "a207"}, {"name": "William Golding", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A famous British novelist; won the Nobel Prize in 1983. Novels: Lord of the Flies; The Scorpion God (a triptych of three novellas); The Pyramid; The Paper Men; Darkness Visible.", "id": "a208"}, {"name": "W. B. Yeats", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Full name William Butler Yeats. National poet of Ireland; a famous critic, poet and dramatist. Famous for symbolism and mysticism; a senator and Nobel Prize-winning poet. Famous books of poems: The Wild Swans at Coole; The Tower; The Cat and the Moon (reminder: 'The Moon and Sixpence' is a novel by William Somerset Maugham). Famous poems: The Second Coming (referring to Christ's Second Coming); A Prayer for My Daughter (reminder: 'Daughter of the East' is a book by Benazir Bhutto); Easter 1916 (about Ireland's yearning for independence); A Prayer for Old Age; The Lake Isle of Innisfree (Yeats wanted to leave the noise of the city for the quiet, natural place Innisfree); No Second Troy (about womanhood, that such destruction as Troy's should not happen again in the world); A Dream of Death; Leda and the Swan; Sailing to Byzantium (Byzantium symbolises: a place out of time and nature, a world of art and philosophy, a utopia, a retreat from ageing and decaying, a world of intellect and spirit). Yeats and Rabindranath Tagore: Tagore himself translated Gitanjali into English as 'Song Offerings' — of 157 songs, 103 are translated in it; it was first published by the Indian Society, London, in 1912; W.B. Yeats wrote its introduction in 1912; in 1913 Tagore won the Nobel Prize in Literature, and in 1923 so did Yeats. (The Argentine female poet Victoria Ocampo was given the title 'Bijoya' by Tagore, and he dedicated 'Purabi' to her; the Roman Catholic scholar Brajendranath Seal was the first to call Tagore 'Biswakobi' [world poet]; Tagore wrote the national anthems of three countries — Bangladesh, India and Sri Lanka; the national poets of India are Kalidas, Tulsidas and Rabindranath Tagore.) Yeats and Jibanananda Das: Yeats's 'Falling of the Leaves' bears resemblance to Jibanananda's 'Dhushor Pandulipi'; Yeats's 'He Reproves the Curlew' bears resemblance to Jibanananda's 'Hai Chil'; Clinton B. Seely has researched Jibanananda Das.", "id": "a209"}, {"name": "William Hunter", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Famous book: The Indian Musalmans (reminder: 'The Good Muslim' is a novel by Tahmima Anam).", "id": "a210"}, {"name": "W.H. Auden", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Full name Weston Hugh Auden (usually rendered Wystan Hugh Auden). Born in England but settled in the USA. Play: The Dog Beneath the Skin. Poems: Lullaby; The Shield of Achilles; In Memory of W.B. Yeats (an elegy on Yeats's death); The Age of Anxiety (a famous poem).", "id": "a211"}, {"name": "William Somerset Maugham", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An English novelist who studied medicine but never practised. Short stories: The Ant and the Grasshopper; The Luncheon. Novels: Of Human Bondage (a semi-autobiographical novel showing the author's savage honesty and gift for storytelling at their best); The Moon and Sixpence; The Sacred Flame; The Razor's Edge; Cakes and Ale; Liza of Lambeth.", "id": "a212"}, {"name": "Wole Soyinka", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An African (Nigerian) novelist; won the Nobel Prize in 1986. Famous books: The Lion and the Jewel; The Road.", "id": "a213"}, {"name": "Wallace Stevens", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(October 2, 1879 – August 2, 1955). An American Modernist poet. Best-known poems: The Emperor of Ice-Cream; Sunday Morning; The Snow Man; Thirteen Ways of Looking at a Blackbird.", "id": "a214"}, {"name": "Winston Churchill", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "British Prime Minister during WWII. A statesman/political leader of the UK who was awarded the Nobel Prize in Literature in 1953; in 1963 the US Congress made him 'an honorary citizen of the USA'. Famous books: History of the Second World War; Into Battle; Memoirs of the Second World War. Quotes: 'I hate Indians. They are a beastly people with a beastly religion' (attributed remark on Indians); 'When there is no enemy within, the enemies outside cannot hurt you.'", "id": "a215"}, {"name": "William Faulkner", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An American writer; won the Nobel Prize in 1949. Famous novels: The Sound and the Fury (his finest novel); Light in August; Absalom, Absalom!; As I Lay Dying (the influence of Faulkner's immersive tale of raw Mississippi rural life can be felt to this day); A Rose for Emily. Famous plays: Soldier's Play; Mosquitoes.", "id": "a216"}, {"name": "William Caxton", "dates": "d.1492", "period": "The Middle English Period", "text": "Established the first English printing press in 1476, for which he is called the First English Printer. (Note: James Hicky set up the first press in Bengal in 1777 for the newspaper business there; Charles Wilkins is called the Father of Bengali typography, under whose direction Panchanan Karmakar cut Bengali type.) Caxton published Malory's Morte D'Arthur in 1485.", "id": "a-caxton"}, {"name": "Roger Bacon", "dates": "1214-1292", "period": "The Middle English Period", "text": "A famous literary/scholarly figure of the Anglo-Norman Period. His famous book is Opus Majus. He is also called the Father of Modern Science.", "id": "a-rogerbacon"}, {"name": "Galileo Galilei", "dates": "1564-1642", "period": "The Renaissance", "text": "Called the Father of Modern Astronomy — also called the 'father of observational astronomy', the 'father of modern physics', and the 'father of science'. An Italian physicist, astronomer, mathematician and philosopher who played a major role in the scientific revolution of the Renaissance. His contributions include the telescopic confirmation of the phases of Venus, discovery of Jupiter's four largest moons (the Galilean moons), and observation of sunspots. Famous quotation (often attributed to him): 'The Sun does not go around the Earth; rather the Earth goes around the Sun.'", "id": "a-galileo"}, {"name": "Robert Greene", "dates": "1558-1592", "period": "The Renaissance", "text": "One of the 'University Wits' (a group of about seven Oxford/Cambridge-educated young dramatists and pamphleteers of the Elizabethan period, including Marlowe, Kyd, Greene, Peele, Nashe, Lyly and Lodge — they gained fame by writing and staging many famous plays). Famous comedy: Friar Bacon (and Friar Bungay).", "id": "a-greene"}, {"name": "George Peele", "dates": "1556-1596", "period": "The Renaissance", "text": "One of the 'University Wits'. Famous works: The Old Wife's Tale; The Famous Chronicle of King Edward I.", "id": "a-peele"}, {"name": "Thomas Nashe", "dates": "1567-1601", "period": "The Renaissance", "text": "One of the 'University Wits'; called the greatest of the English Elizabethan pamphleteers. Famous play: Summer's Last Will and Testament.", "id": "a-nashe"}, {"name": "John Lyly", "dates": "1553-1606", "period": "The Renaissance", "text": "One of the 'University Wits'. Famous plays: King Midas; The Woman in the Moon. His best-known book: The Anatomy of Wit.", "id": "a-lyly"}, {"name": "Thomas Lodge", "dates": "1553-1606", "period": "The Renaissance", "text": "One of the 'University Wits'; was also a physician. He wrote during both the Elizabethan and Jacobean periods.", "id": "a-lodge"}, {"name": "Robert Herrick", "dates": "1591-1674", "period": "The Renaissance", "text": "A famous poet of the Caroline period, called the greatest Cavalier poet (a supporter of the King) and a clergyman. Famous poem: 'To Daffodils' (theme: the short-living nature of human life — 'life is short, so live to the fullest'; compares human life to a daffodil flower and to 'Summer's morning dew'). [Note: the Romantic poet William Wordsworth wrote a different famous poem also about daffodils, 'The Daffodils' / 'I Wandered Lonely as a Cloud'.] Other poems: Delight in Disorder; The Night Piece to Julia; His Litany to the Holy Spirit (a sacred poem). Famous quotes from 'To Daffodils': 'Fair daffodils, we weep to see you haste away so soon'; 'We have short time to stay, as you, we have as short a spring; never to be found again.'", "id": "a-herrick"}, {"name": "Thomas Hobbes", "dates": "1588-1679", "period": "The Renaissance", "text": "An English political philosopher of the Commonwealth Period. Famous book: Leviathan (1651) — argues for the social contract, that people are naturally cruel, greedy and selfish, and that only a powerful government (absolute monarchy) can ensure an orderly society. Quote: 'The end of knowledge is power.'", "id": "a-hobbes"}, {"name": "Jeremy Taylor", "dates": "1613-1667", "period": "The Renaissance", "text": "A writer of the Commonwealth Period. Famous prose works: Holy Living and Holy Dying.", "id": "a-jeremytaylor"}, {"name": "Nathaniel Brassey Halhed", "dates": null, "period": "The Neoclassical Period", "text": "Wrote A Grammar of the Bengal Language in 1778, the first standard/scholarly Bengali grammar, printed using Bengali type; the book itself was written in English.", "id": "a-halhed"}, {"name": "Jane Austen", "dates": "1775-1817", "period": "The Romantic Period", "text": "An anti-Romantic female novelist of the Romantic Period. Never married; largely educated herself in her father's library; lived only 42 years. Her unfinished novel: Sanditon. Novels: Pride and Prejudice (a domestic novel, written at age 22; has sold over 20 million copies to date; characters include Mr. Darcy and protagonist Elizabeth Bennet); Sense and Sensibility; Emma; Mansfield Park; Persuasion; Northanger Abbey. Famous quote: 'A lady's imagination is very rapid; it jumps from admiration to love, from love to matrimony in a moment' (Pride and Prejudice).", "id": "a-austen"}, {"name": "Henry Louis Vivian Derozio", "dates": "1808-1832", "period": "The Romantic Period", "text": "A Eurasian thinker/intellectual of Calcutta. His students were called 'Young Bengal' (Bengali youths steeped in English ideas). At just 17 he became a teacher of English literature and history at Presidency College, Calcutta (then Hindu College). In 1828 he founded an organisation called the 'Academic Association'. His main book: The Fakeer of Jungheera. In 1831 he edited the Bengali paper 'Gyananneshan' and the English paper 'The Enquirer'. In 1832 he was dismissed from Hindu College, and died the same year at just 22.", "id": "a-derozio"}, {"name": "Peary Chand Mitra", "dates": "1814-1883", "period": "The Victorian Period", "text": "Title: 'Defence of Bengal'. Wrote the first novel in Bengali literature, Alaler Gharer Dulal; its English translation is titled 'The Spoilt Child: A Tale of Hindu Domestic Life' (translated by George Devereux Oswell).", "id": "a-pearychand"}, {"name": "Ishwar Chandra Vidyasagar", "dates": "1820-1891", "period": "The Victorian Period", "text": "Father of Bengali prose. During Lord Dalhousie's administration, through his efforts the Hindu Widow Remarriage Act was passed on 26 July 1856. Drawing on Chambers's 'Rudiments of Knowledge' he wrote 'Bodhoday' (1851), and drawing on the ancient fabulist Aesop's Fables he wrote 'Kathamala' (1856). In 1869 he translated Shakespeare's Comedy of Errors into Bengali as 'Bhrantibilas'.", "id": "a-vidyasagar"}, {"name": "Bankim Chandra Chattopadhyay", "dates": "1838-1898", "period": "The Victorian Period", "text": "Father of the Bengali novel. Rajmohan's Wife is the first novel written in English by a native Indian author. Inspired by the English Romantic-era writer Thomas De Quincey's 'Confessions of an English Opium-Eater', Bankim Chandra wrote 'Kamalakanter Daptar'. His novel Anandamath was translated into English by Naresh Chandra Sengupta as 'The Abbey of Bliss'.", "id": "a-bankim"}, {"name": "Babul Chowdhury", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Work: Innocent Millions (a documentary on the Liberation War).", "id": "a-mod-1"}, {"name": "Begum Rokeya", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Rokeya Sakhawat Hossain. Work: Sultana's Dream (her only novel, written in English).", "id": "a-mod-2"}, {"name": "Colonel Gaddafi", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Book: The Green Book.", "id": "a-mod-3"}, {"name": "David Émile Durkheim", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A French sociologist, social psychologist and philosopher. Novel: Suicide.", "id": "a-mod-4"}, {"name": "Suniti Kumar Chatterji", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Wrote a famous linguistics book called 'Origin and Development of the Bengali Language' (ODBL) in 1926.", "id": "a-mod-5"}, {"name": "Akbar Ali Khan", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A Bangladeshi economist and educationist. Famous book: Gresham's Law Syndrome and Beyond: An Analysis of the Bangladesh Bureaucracy.", "id": "a-mod-6"}, {"name": "Eugene O'Neill", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An American dramatist; won the Nobel Prize in 1936. Plays: The Hairy Ape (protagonist Yank; a tragedy of class division); Long Day's Journey into Night (a four-act play); Desire Under the Elms.", "id": "a-mod-7"}, {"name": "Florence Nightingale", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Title: 'Lady with the Lamp'.", "id": "a-mod-8"}, {"name": "Gita Mehta", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Book: Dateline Bangladesh (a documentary on the Liberation War, made in London).", "id": "a-mod-9"}, {"name": "Jahanara Imam", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A memoir based on the Liberation War, 'Ekattorer Dinguli' ('Of Blood and Fire', English translation by Mustafizur Rahman); a film based on it is titled 'Dip Nive Jay'.", "id": "a-mod-10"}, {"name": "Julian Assange", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Founder of the world-famous WikiLeaks.", "id": "a-mod-11"}, {"name": "Zahir Raihan", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Liberation War documentaries: Stop Genocide; A State is Born; Let There Be Light.", "id": "a-mod-12"}, {"name": "Zia Haider Rahman", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A British novelist of Bangladeshi descent. First novel: 'In the Light of What We Know' — won him the James Tait Black Prize, Britain's oldest literary award.", "id": "a-mod-13"}, {"name": "Lord Acton", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Quote: 'Power tends to corrupt, and absolute power corrupts absolutely.'", "id": "a-mod-14"}, {"name": "Maulana Abul Kalam Azad", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Book: India Wins Freedom.", "id": "a-mod-15"}, {"name": "Malala Yousafzai", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Born 12 July 1997 in Swat, Khyber Pakhtunkhwa, Pakistan. Youngest-ever Nobel laureate; won the Nobel Peace Prize in 2014. Title: Daughter of Pakistan (reminder: Benazir Bhutto's title was 'Daughter of the East'). Wrote under the pen name 'Gul Makai' for a BBC Urdu blog titled 'I am Afraid'. Shot in Mingora city. Autobiography: I Am Malala.", "id": "a-mod-16"}, {"name": "Munir Chowdhury", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "In 1965 he built the first Bengali typewriter, named 'Munir Optima'. Drawing on American playwright Irwin Shaw's 'Bury the Dead', he wrote his play 'Kabar'. Translated plays: 'Mukhra Romoni Boshikoron' (from Shakespeare's The Taming of the Shrew); 'Ropar Kota' (from John Galsworthy's The Silver Box); 'Keu Kichu Bolte Pare Na'.", "id": "a-mod-17"}, {"name": "Michael Madhusudan Dutt", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(1824-1873). Wrote English poetry under the pen name 'Timothy Pen Poem'. Drawing on the Italian poet Ovid's 'Heroides', he wrote 'Birangana Kabya' — the first epistolary poem in Bengali literature. Drawing on the Greek myth of the Apple of Discord, he wrote 'Padmavati', the first successful comedy in Bengali literature. Under the pen name 'A Native' he translated Dinabandhu Mitra's play 'Nil Darpan' into English as 'The Indigo Planting Mirror'. Famous books: Vision of the Past; The Captive Lady.", "id": "a-mod-18"}, {"name": "O. Henry", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Real name William Sidney Porter. An American short-story writer. Famous short stories: The Gift of the Magi; Sixes and Sevens; Roads of Destiny; Cabbage and Kings; The Four Million; The Voice of the City; The Ransom of Red Chief; Hearts and Hands; Heart of the West.", "id": "a-mod-19"}, {"name": "Pablo Picasso", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(1881-1973). Born in Málaga, Spain; a painter. Famous artworks: The Blue Room; Old Guitarist; Self Portrait; Three Dancers; Two Nudes; The Young Ladies of Avignon; Guernica.", "id": "a-mod-20"}, {"name": "Richard Eaton", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Book: The Rise of Islam and the Bengal Frontier.", "id": "a-mod-21"}, {"name": "Rehman Sobhan", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Founder of the Centre for Policy Dialogue (CPD). Books: From Two Economies to Two Nations: My Journey to Bangladesh; Untranquil Recollections: The Years of Fulfilment.", "id": "a-mod-22"}, {"name": "Sun Tzu", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "An ancient Chinese philosopher and military strategist. Famous book: The Art of War.", "id": "a-mod-23"}, {"name": "Selma Lagerlof", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "The first female writer to win the Nobel Prize in Literature; wrote in Swedish; won the Nobel Prize in 1909.", "id": "a-mod-24"}, {"name": "Syed Mujtaba Ali", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Famous travelogue about Kabul, 'Deshe-Bideshe', translated into English as 'In a Land Far from Home: A Bengali in Afghanistan'.", "id": "a-mod-25"}, {"name": "Syed Ali Ahsan", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Translated Bangladesh's national anthem into English. Translated Sophocles's tragedy Oedipus Rex into Bengali. First translated Walt Whitman's poetry into Bengali.", "id": "a-mod-26"}, {"name": "Syed Waliullah", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(1922-1971). English translation of his novel Lalsalu: Tree Without Roots (1967). French translation: 'L'Arbre sans Racines' (1961), by his wife Anne Marie. His play 'The Ugly Asian' was translated by Shibbroto Barman.", "id": "a-mod-27"}, {"name": "Shaista Ikramullah", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "Novel: From Purdah to Parliament.", "id": "a-mod-28"}, {"name": "Thomas Usk", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "A petty bureaucrat, scrivener, and author.", "id": "a-mod-29"}, {"name": "Vladimir Ilyich Ulyanov (Lenin)", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "(1870-1924). A Russian communist revolutionary, politician and political theorist; the most translated author in the world in 2005. Leader of the Russian Bolshevik Revolution. Introduced the New Economic Policy (NEP). Famous book: The State and Revolution. Quote: 'Imperialism is the highest stage of capitalism.'", "id": "a-mod-30"}, {"name": "Walt Whitman, Robert Frost & Emily Dickinson", "dates": null, "period": "The Modern & Post-Modern Periods", "text": "These three are regarded as America's national poets. Robert Frost's famous poems: 'The Road Not Taken', 'Mending Wall', 'Stopping By Woods on a Snowy Evening'. Whitman's famous poems: 'Leaves of Grass', 'Song of Myself' (Whitman is also called the father of free verse). Dickinson's famous poems include: 'I'm Nobody! Who are you?', 'Because I could not stop for Death'.", "id": "a-mod-31"}], "questions": [{"period": "Old English–Renaissance", "q": "Which is the oldest period in English Literature?", "options": {"a": "Anglo-Norman", "b": "Anglo-Saxon", "c": "Chaucer's Period", "d": "Middle"}, "answer": "b", "source": null, "id": "q0"}, {"period": "Old English–Renaissance", "q": "Which one of the following is first long poem in English?", "options": {"a": "The Wanderer", "b": "Beowulf", "c": "The Seafarer", "d": "Dream of the Road"}, "answer": "b", "source": null, "id": "q1"}, {"period": "Old English–Renaissance", "q": "Choose the right answer: Chaucer is the representative poet of-", "options": {"a": "17th century", "b": "14th century", "c": "16 the century", "d": "18th century"}, "answer": "b", "source": null, "id": "q2"}, {"period": "Old English–Renaissance", "q": "Who is known as the father of English poetry? Who is called the father of English Poetry?", "options": {"a": "Milton", "b": "Wordsworth", "c": "Chauc
