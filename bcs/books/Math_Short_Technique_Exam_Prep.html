:root{
  --ink:#1b2a2e;
  --ink-soft:#3c4f52;
  --paper:#f6f2e9;
  --paper-raised:#fffdf8;
  --paper-line:#e4dcc8;
  --rule:#c9bfa2;
  --forest:#2d5a4a;
  --forest-deep:#1e4136;
  --forest-tint:#e4ede9;
  --amber:#b5730f;
  --amber-tint:#f6e9d3;
  --clay:#a3432f;
  --clay-tint:#f5e4de;
  --verified:#2d6a4f;
  --verified-tint:#e2f2e8;
  --caution:#b5730f;
  --caution-tint:#fbf0da;
  --wrong:#a3432f;
  --wrong-tint:#f6e2dd;
  --shadow: 0 1px 2px rgba(27,42,46,.06), 0 4px 14px rgba(27,42,46,.07);
  --radius: 10px;
  --serif: "Kalpurush","Iowan Old Style","Palatino Linotype","Noto Serif Bengali",Georgia,"Charis SIL",serif;
  --sans: "Kalpurush",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Bengali","Hind Siliguri",Roboto,sans-serif;
  --mono: "Kalpurush",ui-monospace,"SF Mono","Cascadia Code","Noto Sans Bengali",Menlo,Consolas,monospace;
  --maxw: 1180px;
}
[data-theme="dark"]{
  --ink:#eef2ef;
  --ink-soft:#b9c6c2;
  --paper:#12191a;
  --paper-raised:#1a2426;
  --paper-line:#2a3638;
  --rule:#3a4749;
  --forest:#6fb897;
  --forest-deep:#8fd0ac;
  --forest-tint:#16241f;
  --amber:#e0a94a;
  --amber-tint:#2a2213;
  --clay:#e08a6f;
  --clay-tint:#2a1c17;
  --verified:#6fb897;
  --verified-tint:#15241d;
  --caution:#e0a94a;
  --caution-tint:#2a2213;
  --wrong:#e08a6f;
  --wrong-tint:#2a1c17;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.55;
  transition:background .25s ease,color .25s ease;
  background-image:
    linear-gradient(var(--paper-line) 1px, transparent 1px);
  background-size: 100% 32px;
  background-attachment: local;
}
[data-theme="dark"] body{ background-image:linear-gradient(var(--paper-line) 1px, transparent 1px); }
::selection{ background:var(--amber-tint); color:var(--ink); }
a{color:inherit;}
button{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; margin:0 0 .4em; letter-spacing:.2px;}
.formula{font-family:var(--mono); background:var(--paper-raised); border:1px solid var(--paper-line); border-left:4px solid var(--forest); border-radius:6px; padding:12px 16px; font-size:1.05rem; overflow-x:auto; white-space:pre-wrap; box-shadow:var(--shadow);}
code{font-family:var(--mono);}
.container{max-width:var(--maxw); margin:0 auto; padding:0 22px;}
.skip-link{position:absolute; left:-999px; top:0; background:var(--forest); color:#fff; padding:10px 16px; z-index:999;}
.skip-link:focus{left:10px; top:10px;}

/* ---------- header / nav ---------- */
header.topbar{
  position:sticky; top:0; z-index:50;
  background:var(--paper); border-bottom:1px solid var(--rule);
  backdrop-filter: blur(4px);
}
.topbar-inner{display:flex; align-items:center; gap:18px; padding:12px 22px; max-width:var(--maxw); margin:0 auto; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
.brand-mark{
  width:38px; height:38px; border-radius:8px; background:var(--forest); color:#fdfaf3;
  display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; font-size:1.15rem; flex-shrink:0;
  box-shadow: var(--shadow);
}
.brand-text{display:flex; flex-direction:column; line-height:1.15;}
.brand-text b{font-family:var(--serif); font-size:1.08rem;}
.brand-text span{font-size:.72rem; color:var(--ink-soft); letter-spacing:.4px;}
nav.tabs{display:flex; gap:2px; flex-wrap:wrap; overflow-x:auto;}
nav.tabs button{
  border:none; background:transparent; color:var(--ink-soft); padding:9px 13px; border-radius:8px; cursor:pointer;
  font-size:.86rem; font-weight:600; white-space:nowrap; display:flex; align-items:center; gap:6px;
  transition: background .15s, color .15s;
}
nav.tabs button:hover{background:var(--forest-tint); color:var(--forest-deep);}
nav.tabs button.active{background:var(--forest); color:#fdfaf3;}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{
  border:1px solid var(--rule); background:var(--paper-raised); color:var(--ink); width:38px; height:38px; border-radius:8px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.05rem;
}
.icon-btn:hover{border-color:var(--forest);}
.search-box{position:relative; display:flex; align-items:center;}
.search-box input{
  border:1px solid var(--rule); background:var(--paper-raised); color:var(--ink); border-radius:8px; padding:9px 12px 9px 34px;
  font-size:.86rem; width:190px; transition:width .2s;
}
.search-box input:focus{outline:2px solid var(--forest); outline-offset:1px; width:260px;}
.search-box .si{position:absolute; left:11px; opacity:.55; pointer-events:none;}

main{max-width:var(--maxw); margin:0 auto; padding:26px 22px 90px;}
.view{display:none; animation:fadein .25s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.page-head{margin-bottom:22px;}
.page-head h1{font-size:1.7rem;}
.page-head p{color:var(--ink-soft); max-width:70ch; margin:0;}
.eyebrow{font-family:var(--mono); font-size:.72rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--forest); font-weight:700; margin-bottom:6px; display:block;}

/* ---------- dashboard ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:26px;}
.stat-card{
  background:var(--paper-raised); border:1px solid var(--paper-line); border-radius:var(--radius); padding:16px 16px 14px;
  box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.stat-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--forest);}
.stat-card .num{font-family:var(--serif); font-size:1.9rem; font-weight:700; line-height:1;}
.stat-card .lbl{font-size:.78rem; color:var(--ink-soft); margin-top:6px;}
.dash-grid{display:grid; grid-template-columns:2fr 1fr; gap:20px;}
@media(max-width:860px){.dash-grid{grid-template-columns:1fr;}}
.panel{background:var(--paper-raised); border:1px solid var(--paper-line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); margin-bottom:18px;}
.panel h3{font-size:1.02rem; display:flex; align-items:center; gap:8px;}
.mini-list{list-style:none; margin:0; padding:0;}
.mini-list li{padding:9px 0; border-bottom:1px dashed var(--paper-line); display:flex; justify-content:space-between; gap:10px; font-size:.88rem; align-items:center;}
.mini-list li:last-child{border-bottom:none;}
.pill{font-size:.68rem; font-weight:700; padding:2px 9px; border-radius:99px; letter-spacing:.3px;}
.pill.verified{background:var(--verified-tint); color:var(--verified);}
.pill.caution{background:var(--caution-tint); color:var(--caution);}
.pill.mnemonic{background:var(--wrong-tint); color:var(--wrong);}
.progress-bar{height:8px; background:var(--paper-line); border-radius:99px; overflow:hidden; margin-top:4px;}
.progress-bar > i{display:block; height:100%; background:var(--forest); border-radius:99px;}
.btn{
  border:1px solid var(--forest); background:var(--forest); color:#fdfaf3; padding:9px 16px; border-radius:8px; font-weight:700;
  font-size:.85rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
}
.btn.secondary{background:transparent; color:var(--forest);}
.btn.ghost{background:transparent; color:var(--ink-soft); border-color:var(--rule);}
.btn.small{padding:5px 11px; font-size:.76rem;}
.btn:hover{filter:brightness(1.06);}
.btn:disabled{opacity:.4; cursor:not-allowed;}

/* ---------- topic browsing ---------- */
.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}
.chip{
  border:1px solid var(--rule); background:var(--paper-raised); color:var(--ink-soft); padding:6px 13px; border-radius:99px;
  font-size:.79rem; cursor:pointer; font-weight:600;
}
.chip.active{background:var(--forest); border-color:var(--forest); color:#fdfaf3;}
.topic-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px;}
.topic-card{
  background:var(--paper-raised); border:1px solid var(--paper-line); border-radius:var(--radius); padding:16px 17px;
  box-shadow:var(--shadow); cursor:pointer; position:relative; transition:transform .12s ease, box-shadow .12s ease;
}
.topic-card:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(27,42,46,.12);}
.topic-card .tnum{font-family:var(--mono); font-size:.72rem; color:var(--forest); font-weight:700;}
.topic-card h4{font-size:.98rem; margin:4px 0 6px;}
.topic-card p.excerpt{font-size:.82rem; color:var(--ink-soft); margin:0 0 10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.topic-card .meta-row{display:flex; align-items:center; gap:8px; justify-content:space-between;}
.star-btn{background:none; border:none; font-size:1.05rem; cursor:pointer; color:var(--rule); line-height:1;}
.star-btn.on{color:var(--amber);}
.learned-check{position:absolute; top:14px; right:14px; font-size:1.1rem;}

/* ---------- topic detail ---------- */
.topic-detail{background:var(--paper-raised); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.td-head{padding:22px 26px 18px; border-bottom:1px solid var(--paper-line); background:linear-gradient(180deg, var(--forest-tint), transparent);}
.td-head .back{background:none; border:none; color:var(--forest); font-weight:700; font-size:.82rem; cursor:pointer; margin-bottom:10px; display:inline-flex; align-items:center; gap:4px;}
.td-head h2{font-size:1.5rem; margin-bottom:4px;}
.td-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.td-body{padding:22px 26px 30px;}
.section-block{margin-bottom:24px;}
.section-block h3{font-size:1rem; display:flex; align-items:center; gap:8px; color:var(--forest-deep);}
.section-block .content{font-size:.94rem; color:var(--ink);}
.tag-src{display:inline-block; font-size:.68rem; font-weight:800; letter-spacing:.4px; padding:2px 8px; border-radius:5px; margin-right:6px;}
.tag-src.pdf{background:var(--forest-tint); color:var(--forest-deep);}
.tag-src.verified{background:var(--verified-tint); color:var(--verified);}
.tag-src.insight{background:var(--amber-tint); color:var(--amber);}
.tag-src.tip{background:var(--clay-tint); color:var(--clay);}
.verify-banner{border-radius:8px; padding:10px 14px; font-size:.85rem; display:flex; gap:8px; align-items:flex-start; margin:10px 0;}
.verify-banner.verified{background:var(--verified-tint); color:var(--verified);}
.verify-banner.caution{background:var(--caution-tint); color:var(--caution);}
.example-box{border:1px solid var(--paper-line); border-radius:8px; padding:12px 15px; margin:10px 0; background:var(--paper);}
.example-box b{font-family:var(--serif);}
.calc-box{border:1px dashed var(--forest); border-radius:8px; padding:16px; background:var(--forest-tint); margin-top:8px;}
.calc-box .row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.calc-box label{font-size:.78rem; font-weight:700; display:block; margin-bottom:4px; color:var(--ink-soft);}
.calc-box input{border:1px solid var(--rule); border-radius:6px; padding:8px 10px; font-family:var(--mono); width:110px; background:var(--paper-raised); color:var(--ink);}
.calc-result{font-family:var(--mono); font-weight:700; font-size:1.05rem; margin-top:8px; padding:10px; background:var(--paper-raised); border-radius:6px;}
figure.diagram{margin:10px 0; text-align:center; background:var(--paper); border:1px solid var(--paper-line); border-radius:8px; padding:14px;}
figure.diagram svg{max-width:280px; width:100%; height:auto;}
figure.diagram figcaption{font-size:.76rem; color:var(--ink-soft); margin-top:6px;}
details.proof-steps{border:1px solid var(--paper-line); border-radius:8px; padding:2px 14px; background:var(--paper);}
details.proof-steps summary{cursor:pointer; padding:10px 0; font-weight:700; font-size:.86rem; color:var(--forest-deep);}
details.proof-steps .step{padding:8px 0 12px; border-top:1px dashed var(--paper-line); font-size:.88rem;}
.trap-box{background:var(--wrong-tint); color:var(--wrong); border-radius:8px; padding:10px 14px; font-size:.85rem;}
.checklist{list-style:none; margin:0; padding:0;}
.checklist li{padding:5px 0; font-size:.88rem;}
.checklist li::before{content:"— "; color:var(--forest);}

/* ---------- quiz / practice ---------- */
.setup-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:16px;}
.setup-card{background:var(--paper-raised); border:1px solid var(--paper-line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.setup-card h4{font-size:.86rem; margin-bottom:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px;}
select{border:1px solid var(--rule); border-radius:8px; padding:9px 10px; background:var(--paper-raised); color:var(--ink); font-family:inherit; width:100%; font-size:.88rem;}
.quiz-shell{background:var(--paper-raised); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px 26px;}
.quiz-progress{display:flex; justify-content:space-between; align-items:center; font-size:.82rem; color:var(--ink-soft); margin-bottom:10px;}
.quiz-q{font-size:1.15rem; font-family:var(--serif); margin:16px 0;}
.opt-list{display:grid; gap:10px;}
.opt{
  border:1px solid var(--rule); border-radius:8px; padding:12px 15px; cursor:pointer; background:var(--paper); font-size:.94rem;
  display:flex; align-items:center; gap:10px;
}
.opt:hover{border-color:var(--forest);}
.opt.correct{background:var(--verified-tint); border-color:var(--verified); color:var(--verified); font-weight:700;}
.opt.incorrect{background:var(--wrong-tint); border-color:var(--wrong); color:var(--wrong); font-weight:700;}
.opt.disabled{pointer-events:none;}
.quiz-explain{margin-top:16px; padding:14px 16px; border-radius:8px; background:var(--forest-tint); font-size:.88rem; display:none;}
.quiz-explain.show{display:block;}
.quiz-nav{display:flex; justify-content:space-between; margin-top:20px;}
.timer{font-family:var(--mono); font-weight:700;}
.timer.low{color:var(--wrong);}
.result-summary{text-align:center; padding:20px 0;}
.result-summary .score{font-family:var(--serif); font-size:3rem; font-weight:700; color:var(--forest);}

/* ---------- revision / mistakes ---------- */
.rev-item, .mistake-item{background:var(--paper-raised); border:1px solid var(--paper-line); border-radius:var(--radius); padding:14px 18px; margin-bottom:10px; box-shadow:var(--shadow);}
.rev-item .rev-actions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty-state .glyph{font-size:2.4rem; margin-bottom:10px;}

footer.app-footer{border-top:1px solid var(--rule); padding:20px 22px; text-align:center; font-size:.78rem; color:var(--ink-soft);}

@media (max-width:640px){
  .search-box input{width:120px;}
  .search-box input:focus{width:160px;}
  .td-head, .td-body{padding-left:16px; padding-right:16px;}
}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--rule); border-radius:99px;}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,25,24,.55); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:center; z-index:200; padding:20px;
}
.modal-overlay.open{ display:flex; }
.modal-box{
  background:var(--paper-raised); border:1px solid var(--paper-line); border-radius:14px; padding:26px 26px 22px;
  max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3); animation:modalIn .18s ease;
}
@keyframes modalIn{ from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;} }
.modal-box h3{font-size:1.15rem; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
.modal-box p{font-size:.9rem; color:var(--ink-soft); margin:0 0 16px;}
.modal-box .modal-actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;}
.modal-box .reset-option{
  display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 4px;
  border-bottom:1px dashed var(--paper-line); font-size:.86rem;
}
.modal-box .reset-option:last-of-type{border-bottom:none;}
.modal-box .reset-option span{color:var(--ink);}
</style>
</head>

// ---------- Persistent state (localStorage) ----------
const STORE_KEY = "mathmastery_state_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    learned:{}, bookmarks:{}, mistakes:[], quizHistory:[],
    revision:{}, // topicId -> {due: isoDate, interval: days}
    streak:0, lastStudyDate:null, theme:"light",
    totalQuizAttempts:0, totalCorrect:0
  };
}
let STATE = loadState();
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }catch(e){}
}
function touchStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(STATE.lastStudyDate === today) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  STATE.streak = (STATE.lastStudyDate === y) ? STATE.streak+1 : 1;
  STATE.lastStudyDate = today;
  saveState();
}

// ---------- Utility: Bengali digit conversion ----------
const BN_DIGITS = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
function toBn(n){
  if(n===null||n===undefined||isNaN(n)) return "—";
  let s = (typeof n === "number") ? (Number.isInteger(n) ? n.toString() : n.toFixed(2).replace(/\.?0+$/,"")) : n.toString();
  let neg = s.startsWith("-");
  if(neg) s = s.slice(1);
  s = s.replace(/[0-9]/g, d => BN_DIGITS[+d]);
  return (neg?"−":"") + s;
}
function fmt(n, dec=2){
  if(n===null||n===undefined||!isFinite(n)) return "—";
  const rounded = Math.round(n*Math.pow(10,dec))/Math.pow(10,dec);
  return toBn(rounded);
}

// ---------- Prime helpers ----------
function isPrimeNum(n){
  if(n<2) return false;
  if(n%2===0) return n===2;
  for(let i=3;i*i<=n;i+=2){ if(n%i===0) return false; }
  return true;
}
function primeFactorize(n){
  const factors = {};
  let d = 2;
  let x = n;
  while(d*d<=x){
    while(x%d===0){ factors[d]=(factors[d]||0)+1; x/=d; }
    d++;
  }
  if(x>1) factors[x]=(factors[x]||0)+1;
  return factors;
}
function gcd(a,b){ return b===0?a:gcd(b,a%b); }
function lcm(a,b){ return a*b/gcd(a,b); }

          note = " — উৎপাদক: "+Object.entries(f).map(([k,v])=>toBn(k)+(v>1?"^"+toBn(v):"")).join("×");
        }
        return `${toBn(n)} ${p?"<b>মৌলিক সংখ্যা</b>":"<b>মৌলিক সংখ্যা নয়</b>"}${note} (√${toBn(n)}≈${fmt(Math.sqrt(n),2)} পর্যন্ত যাচাই করা হয়েছে)`;
      }
      case "partial_sum": {
        const k=+vals.k, sum1=+vals.sum1, mode=vals.mode;
        if([k,sum1].some(isNaN)) return null;
        const ans = mode==="last" ? sum1+k*k : sum1-k*k;
        return `${mode==="last"?"শেষ":"প্রথম"} ${toBn(k)}-টির যোগফল = ${fmt(sum1)} ${mode==="last"?"+":"−"} ${toBn(k)}² = <b>${fmt(ans)}</b>`;
      }
      case "hexagon": {
        const a=+vals.a, h=+vals.h;
        if(isNaN(a)) return null;
        const per = 6*a;
        const area = (3*Math.sqrt(3)/2)*a*a;
        let out = `পরিসীমা = 6×${fmt(a)} = <b>${fmt(per)}</b><br>ক্ষেত্রফল = (3√3/2)×${fmt(a)}² = <b>${fmt(area)}</b>`;
        if(!isNaN(h)&&vals.h!==""){
          const vol = area*h;
          const lateral = 6*a*h;
          const total = lateral+2*area;
          out += `<br>প্রিজম আয়তন (h=${fmt(h)}) = <b>${fmt(vol)}</b>, সমগ্রতল = <b>${fmt(total)}</b>`;
        }
        return out;
      }
      default: return null;
    }
  }catch(e){ return "গণনায় ত্রুটি — ইনপুট মান যাচাই করুন"; }
}

function statusPillHTML(status){
  const map = {verified:["যাচাইকৃত ✓","verified"], caution:["সতর্কতা প্রয়োজন ⚠","caution"], mnemonic:["স্মৃতিসহায়ক","mnemonic"]};

function navigate(view, opts={}){
  currentView = view;
  if(opts.topicId) currentTopicId = opts.topicId;
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.classList.toggle("active", b.dataset.view===view);
  });
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function render(){
  switch(currentView){
    case "dashboard": main.innerHTML = renderDashboard(); attachDashboardEvents(); break;
    case "topics": main.innerHTML = renderTopicsList(); attachTopicsListEvents(); break;
    case "topicDetail": main.innerHTML = renderTopicDetail(currentTopicId); attachTopicDetailEvents(); break;
    case "formulas": main.innerHTML = renderFormulaBank(); attachFormulaBankEvents(); break;
    case "practice": main.innerHTML = renderPracticeSetup(); attachPracticeSetupEvents(); break;
    case "revision": main.innerHTML = renderRevision(); attachRevisionEvents(); break;
    case "mistakes": main.innerHTML = renderMistakes(); attachMistakesEvents(); break;
    case "bookmarks": main.innerHTML = renderBookmarks(); attachTopicsListEvents(); break;
    case "fastrev": main.innerHTML = renderFastRev(); break;
    case "searchResults": main.innerHTML = renderSearchResults(topicFilter.q); attachTopicsListEvents(); break;
    default: main.innerHTML = renderDashboard();
  }
}

function renderCalcBox(t){

    }
    return `<div><label>${inp.label}</label><input type="text" data-calcinput="${inp.id}" placeholder="${inp.placeholder||""}"></div>`;
  }).join("");
  return `
  <div class="calc-box">
    <div class="row">${inputsHTML}</div>
    <button class="btn small" data-runcalc="${t.id}">গণনা করুন ▶</button>

}

function attachRevisionEvents(){
  document.querySelectorAll("[data-rev]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const id = b.dataset.rev;
      const grade = b.dataset.grade;
      const cur = STATE.revision[id] || {interval:1};
      let interval = cur.interval||1;
      if(grade==="again") interval = 1;
      else if(grade==="hard") interval = Math.max(1,Math.round(interval*1.3));
      else if(grade==="good") interval = Math.round(interval*2.2);
      else interval = Math.round(interval*3.5);
      const due = new Date(Date.now()+interval*86400000).toISOString();
      STATE.revision[id] = {due, interval};
      saveState();
      touchStreak();
      render();
    });
  });
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click", ()=>navigate("topicDetail",{topicId:b.dataset.open})));
}

// গণিতের শর্ট টেকনিক — অ্যাপ্লিকেশন লজিক (পার্ট ৩: কুইজ ইঞ্জিন)

// ---------- Question generators (parametrized, per topic) ----------
function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
function makeOptions(correct, distractors, fmtFn){
  const all = shuffle([correct, ...distractors]);
  return all.map((v,i)=>({id:"o"+i, text: fmtFn?fmtFn(v):toBn(v), isCorrect: v===correct}));
}

const QUIZ_GENERATORS = {
  t01: ()=>{
    const r = rnd(5,40);
    const inc = Math.random()>0.5;
    const ans = Math.round((r/(inc?100+r:100-r))*10000)/100;
    const distractors = [Math.round(r*100)/100, Math.round((ans+5)*100)/100, Math.round((ans-3)*100)/100].filter(d=>d!==ans);
    return {
      topicId:"t01",
      prompt:`একটি জিনিসের মূল্য ${toBn(r)}% ${inc?"বৃদ্ধি":"হ্রাস"} পেলে, ব্যয় অপরিবর্তিত রাখতে ব্যবহার শতকরা কত ${inc?"কমাতে":"বাড়াতে"} হবে?`,
      options: makeOptions(ans, distractors, v=>fmt(v)+"%"),
      explanation:`সূত্র: r/(100${inc?"+":"−"}r)×100 = ${toBn(r)}/${toBn(inc?100+r:100-r)}×100 = ${fmt(ans)}%`
    };
  },
  t02: ()=>{
    const x = rnd(5,30)*(Math.random()>0.5?1:1);
    const y = rnd(-30,30);
    const ans = Math.round((x+y+(x*y)/100)*100)/100;
    const distractors = [x+y, x*y/100, ans+4].filter(d=>Math.round(d*100)/100!==ans);
    return {
      topicId:"t02",
      prompt:`একটি রাশি প্রথমে ${toBn(x)}% বৃদ্ধি পায়, তারপর ${toBn(Math.abs(y))}% ${y>=0?"বৃদ্ধি":"হ্রাস"} পায়। সামগ্রিক শতকরা পরিবর্তন কত?`,
      options: makeOptions(ans, distractors, v=>fmt(v)+"%"),
      explanation:`x+y+xy/100 = ${toBn(x)}+${toBn(y)}+(${toBn(x)}×${toBn(y)})/100 = ${fmt(ans)}%`
    };
  },
  t13: ()=>{
    const p = rnd(2,10)*100;
    const r = rnd(4,12);
    const t = rnd(2,8);
    const i = Math.round(p*t*r/100);
    const distractors = [i+p*0.1, i-20, i+50].map(Math.round);
    return {
      topicId:"t13",
      prompt:`${toBn(p)} টাকার উপর ${toBn(r)}% হারে ${toBn(t)} বছরের সরল সুদ কত?`,
      options: makeOptions(i, distractors, v=>fmt(v)+" টাকা"),
      explanation:`সুদ = PTR/100 = (${toBn(p)}×${toBn(t)}×${toBn(r)})/100 = ${toBn(i)} টাকা`
    };
  },
  t04: ()=>{
    const s1=rnd(80,200), s2=rnd(80,200), v1=rnd(20,60), v2=rnd(20,60);
    if(v1===v2) return QUIZ_GENERATORS.t04();
    const relVms = (v1+v2)*5/18;
    const t = Math.round((s1+s2)/relVms*100)/100;
    const distractors = [t+2, Math.round(t*0.7*100)/100, t+5];
    return {
      topicId:"t04",
      prompt:`${toBn(s1)} মি ও ${toBn(s2)} মি লম্বা দুইটি ট্রেন পরস্পরের দিকে যথাক্রমে ${toBn(v1)} ও ${toBn(v2)} কিমি/ঘণ্টা বেগে আসছে। কত সেকেন্ডে তারা একে অপরকে অতিক্রম করবে?`,
      options: makeOptions(t, distractors, v=>fmt(v)+" সে."),
      explanation:`সময় = (${toBn(s1)}+${toBn(s2)})/[(${toBn(v1)}+${toBn(v2)})×5/18] = ${fmt(t)} সেকেন্ড`
    };
  },
  t28: ()=>{
    const n = rnd(11,99);
    const ans = n*n;
    const distractors = [ans+10, ans-11, (n+1)*(n-1)];
    return {
      topicId:"t28",
      prompt:`${toBn(n)}² এর মান কত?`,
      options: makeOptions(ans, distractors, v=>toBn(v)),
      explanation:`${toBn(n)}² = ${toBn(ans)}`
    };
  },
  t26: ()=>{
    const k = rnd(1,5);
    const a=rnd(1,3),b=rnd(1,5),c=rnd(1,10);
    const val = a*k*k*k - b*k*k + c;
    const distractors = [val+3, val-4, val+7];
    return {
      topicId:"t26",
      prompt:`f(x) = ${toBn(a)}x³ − ${toBn(b)}x² + ${toBn(c)} কে (x−${toBn(k)}) দ্বারা ভাগ করলে ভাগশেষ কত?`,
      options: makeOptions(val, distractors, v=>toBn(v)),
      explanation:`f(${toBn(k)}) = ${toBn(a)}×${toBn(k)}³−${toBn(b)}×${toBn(k)}²+${toBn(c)} = ${toBn(val)}`
    };
  },
  t27: ()=>{
    const candidates = [12,18,24,28,36,45,48,60,72,90,100];
    const n = candidates[rnd(0,candidates.length-1)];
    const f = primeFactorize(n);
    const count = Object.values(f).reduce((a,e)=>a*(e+1),1);
    const distractors = [count+2, count-1, count+4].filter(d=>d>0&&d!==count);
    return {
      topicId:"t27",
      prompt:`${toBn(n)} সংখ্যাটির মোট কতগুলো ভাজক আছে?`,
      options: makeOptions(count, distractors, v=>toBn(v)+"টি"),
      explanation:`${toBn(n)} = ${Object.entries(f).map(([p,e])=>toBn(p)+(e>1?"^"+toBn(e):"")).join("×")}; ভাজক সংখ্যা = ${Object.values(f).map(e=>"("+toBn(e)+"+1)").join("×")} = ${toBn(count)}`
    };
  },
  t35: ()=>{
    const candidates = [97,91,101,143,89,111,113,161,127,169];
    const n = candidates[rnd(0,candidates.length-1)];
    const p = isPrimeNum(n);
    return {
      topicId:"t35",
      prompt:`${toBn(n)} কি একটি মৌলিক সংখ্যা?`,
      options: [{id:"o1",text:"হ্যাঁ, মৌলিক",isCorrect:p},{id:"o2",text:"না, মৌলিক নয়",isCorrect:!p}],
      explanation: p ? `${toBn(n)} মৌলিক — √${toBn(n)} পর্যন্ত কোনো মৌলিক সংখ্যা দ্বারা নিঃশেষে বিভাজ্য নয়।` : `${toBn(n)} মৌলিক নয় — এটি ${Object.entries(primeFactorize(n)).map(([k,v])=>toBn(k)).join("×")} দ্বারা বিভাজ্য।`
    };
  },
  t06: ()=>{
    const n = rnd(5,12);
    const ans = (n-2)*180;
    const distractors = [ans+180, ans-90, n*180];
    return {
      topicId:"t06",
      prompt:`${toBn(n)}-বাহুবিশিষ্ট বহুভুজের অন্তঃকোণের সমষ্টি কত?`,
      options: makeOptions(ans, distractors, v=>toBn(v)+"°"),
      explanation:`(n−2)×180° = (${toBn(n)}−2)×180° = ${toBn(ans)}°`
    };
  },
  t11: ()=>{
    const x=rnd(50,300), y=rnd(50,300);
    const ans = (x+y)/2;
    const distractors=[ans+10,ans-15,x-y];
    return {
      topicId:"t11",
      prompt:`একটি সংখ্যা ${toBn(x)} হতে যত বড়, ${toBn(y)} হতে তত ছোট। সংখ্যাটি কত?`,
      options: makeOptions(ans, distractors, v=>fmt(v)),
      explanation:`সংখ্যাটি = (${toBn(x)}+${toBn(y)})/2 = ${fmt(ans)}`
    };
  }
};

// ---------- Quiz state ----------
let quizState = null; // {questions, index, score, mode, answered}

function generateQuiz(count, topicFilterList, mode){
  const genKeys = Object.keys(QUIZ_GENERATORS).filter(k => !topicFilterList || topicFilterList.includes(k));
  const keys = genKeys.length ? genKeys : Object.keys(QUIZ_GENERATORS);
  const questions = [];
  for(let i=0;i<count;i++){
    const key = keys[rnd(0,keys.length-1)];
    questions.push(QUIZ_GENERATORS[key]());
  }
  return {questions, index:0, score:0, mode, answered:false, timePerQ: mode==="speed"?15:(mode==="timed"?45:0), startTime:Date.now()};
}

    </div>
    <div class="setup-card">
      <h4>বিষয় (ঐচ্ছিক)</h4>
      <select id="qTopic">
        <option value="">সবগুলো মিশ্রিত</option>
        ${Object.keys(QUIZ_GENERATORS).map(k=>{ const t=getTopic(k); return `<option value="${k}">${t.title}</option>`; }).join("")}
      </select>
    </div>
  </div>
  <button class="btn" id="startQuizBtn">কুইজ শুরু করুন ▶</button>
  <div id="quizArea" style="margin-top:20px;"></div>
  `;
}
function attachPracticeSetupEvents(){
  document.getElementById("startQuizBtn").addEventListener("click", ()=>{
    const count = +document.getElementById("qCount").value;
    const mode = document.getElementById("qMode").value;
    const topic = document.getElementById("qTopic").value;
    quizState = generateQuiz(count, topic?[topic]:null, mode);
    renderQuizQuestion();
  });
}

function renderQuizQuestion(){
  const area = document.getElementById("quizArea");
  if(!quizState || quizState.index >= quizState.questions.length){
    renderQuizResults();
    return;
  }
  const q = quizState.questions[quizState.index];
  area.innerHTML = `
  <div class="quiz-shell">
    <div class="quiz-progress">
      <span>প্রশ্ন ${toBn(quizState.index+1)} / ${toBn(quizState.questions.length)}</span>
      <span>স্কোর: ${toBn(quizState.score)}</span>
      ${quizState.timePerQ ? `<span class="timer" id="quizTimer">${toBn(quizState.timePerQ)}s</span>` : ""}
    </div>
    <div class="quiz-q">${q.prompt}</div>
    <div class="opt-list">
      ${q.options.map(o=>`<div class="opt" data-oid="${o.id}">${o.text}</div>`).join("")}
    </div>
    <div class="quiz-explain" id="quizExplain">${q.explanation}</div>
    <div class="quiz-nav">
      <button class="btn ghost" id="quizSkip">এড়িয়ে যান</button>
      <button class="btn" id="quizNext" style="display:none;">পরবর্তী →</button>
    </div>
  </div>`;
  quizState.answered = false;
  document.querySelectorAll(".opt").forEach(el=>{
    el.addEventListener("click", ()=>answerQuiz(el.dataset.oid));
  });
  document.getElementById("quizSkip").addEventListener("click", ()=>{ quizState.index++; renderQuizQuestion(); });
  document.getElementById("quizNext").addEventListener("click", ()=>{ quizState.index++; renderQuizQuestion(); });

  if(quizState.timePerQ){
    let t = quizState.timePerQ;
    const timerEl = document.getElementById("quizTimer");
    quizState.timerInterval = setInterval(()=>{
      t--;
      if(timerEl){ timerEl.textContent = toBn(t)+"s"; if(t<=5) timerEl.classList.add("low"); }
      if(t<=0){ clearInterval(quizState.timerInterval); if(!quizState.answered) answerQuiz(null); }
    },1000);
  }
}
function answerQuiz(oid){
  if(quizState.answered) return;
  quizState.answered = true;
  if(quizState.timerInterval) clearInterval(quizState.timerInterval);
  const q = quizState.questions[quizState.index];
  const correct = q.options.find(o=>o.isCorrect);
  const chosen = q.options.find(o=>o.id===oid);
  document.querySelectorAll(".opt").forEach(el=>{
    el.classList.add("disabled");
    const opt = q.options.find(o=>o.id===el.dataset.oid);
    if(opt.isCorrect) el.classList.add("correct");
    else if(el.dataset.oid===oid) el.classList.add("incorrect");
  });
  STATE.totalQuizAttempts++;
  if(chosen && chosen.isCorrect){
    quizState.score++;
    STATE.totalCorrect++;
  } else {
    STATE.mistakes.push({
      topicId: q.topicId, prompt: q.prompt,
      yourAnswer: chosen ? chosen.text : "(সময় শেষ — উত্তর দেওয়া হয়নি)",
      correctAnswer: correct.text,
      explanation: q.explanation,
      errorType: chosen ? "গণনা/ধারণাগত ভুল" : "সময়স্বল্পতা",
      date: new Date().toISOString()
    });
  }
  saveState();
  document.getElementById("quizExplain").classList.add("show");
  document.getElementById("quizNext").style.display = "inline-flex";
  document.getElementById("quizSkip").style.display = "none";
  touchStreak();
}
function renderQuizResults(){
  const area = document.getElementById("quizArea");
  const pct = Math.round(100*quizState.score/quizState.questions.length);
  STATE.quizHistory.push({date:new Date().toISOString(), score:quizState.score, total:quizState.questions.length});
  saveState();
  area.innerHTML = `
  <div class="quiz-shell result-summary">
    <div class="score">${toBn(quizState.score)}/${toBn(quizState.questions.length)}</div>
    <p style="font-size:1.1rem;color:var(--ink-soft);">সঠিক উত্তর — ${pct}% accuracy</p>
    <div class="td-actions" style="justify-content:center;margin-top:16px;">
      <button class="btn" id="retryQuiz">আবার চেষ্টা করুন</button>
      <button class="btn secondary" id="goMistakes">ভুল খাতা দেখুন</button>
      <button class="btn ghost" id="goDash">ড্যাশবোর্ডে ফিরুন</button>
    </div>
  </div>`;
  document.getElementById("retryQuiz").addEventListener("click", ()=>navigate("practice"));
  document.getElementById("goMistakes").addEventListener("click", ()=>navigate("mistakes"));
  document.getElementById("goDash").addEventListener("click", ()=>navigate("dashboard"));
}

// ============================================================
// THEME TOGGLE
// ============================================================
function applyTheme(theme){
  document.body.setAttribute("data-theme", theme);
  document.getElementById("themeToggle").textContent = theme==="dark" ? "☀️" : "🌙";
  STATE.theme = theme;
  saveState();
}
document.getElementById("themeToggle").addEventListener("click", ()=>{
  applyTheme(STATE.theme==="dark" ? "light" : "dark");
});

// ============================================================
// SETTINGS / PROGRESS RESET MODAL
// ============================================================
const modalOverlay = document.getElementById("modalOverlay");
const modalBox = document.getElementById("modalBox");
function openModal(html){
  modalBox.innerHTML = html;
  modalOverlay.classList.add("open");
}
function closeModal(){ modalOverlay.classList.remove("open"); }
modalOverlay.addEventListener("click", (e)=>{ if(e.target===modalOverlay) closeModal(); });
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeModal(); });

function dataFootprintHTML(){
  const learnedCount = Object.values(STATE.learned).filter(Boolean).length;
  const bookmarkCount = Object.values(STATE.bookmarks).filter(Boolean).length;
  return `
  <div class="reset-option"><span>শেখা টপিক (learned)</span><b>${toBn(learnedCount)}</b></div>
  <div class="reset-option"><span>বুকমার্ক</span><b>${toBn(bookmarkCount)}</b></div>
  <div class="reset-option"><span>ভুল খাতার এন্ট্রি</span><b>${toBn(STATE.mistakes.length)}</b></div>
  <div class="reset-option"><span>কুইজ চেষ্টা</span><b>${toBn(STATE.totalQuizAttempts)}</b></div>
  <div class="reset-option"><span>রিভিশন তালিকাভুক্ত</span><b>${toBn(Object.keys(STATE.revision).length)}</b></div>
  <div class="reset-option"><span>স্টাডি স্ট্রিক</span><b>${toBn(STATE.streak||0)} দিন</b></div>`;
}
function openSettingsModal(){
  openModal(`
    <h3 id="modalTitle">⚙️ সেটিংস ও ডেটা</h3>
    <p>আপনার সব অগ্রগতি শুধুমাত্র এই ব্রাউজারে (localStorage) সংরক্ষিত আছে — অন্য কোথাও পাঠানো হয় না।</p>
    ${dataFootprintHTML()}
    <div class="modal-actions" style="margin-top:18px; flex-direction:column; align-items:stretch;">
      <button class="btn ghost" id="resetPartialBtn" style="justify-content:center;">শুধু কুইজ ইতিহাস ও ভুল খাতা মুছুন</button>
      <button class="btn ghost" id="resetRevisionBtn" style="justify-content:center;">শুধু রিভিশন সময়সূচি মুছুন</button>
      <button class="btn" id="resetFullBtn" style="justify-content:center;background:var(--wrong);border-color:var(--wrong);">🗑️ সম্পূর্ণ অগ্রগতি রিসেট করুন</button>
      <button class="btn secondary" id="modalCancelBtn" style="justify-content:center;">বাতিল</button>
    </div>
  `);
  document.getElementById("modalCancelBtn").addEventListener("click", closeModal);
  document.getElementById("resetPartialBtn").addEventListener("click", ()=>{
    STATE.mistakes = []; STATE.quizHistory = []; STATE.totalQuizAttempts = 0; STATE.totalCorrect = 0;
    saveState(); closeModal(); render();
  });
  document.getElementById("resetRevisionBtn").addEventListener("click", ()=>{
    STATE.revision = {};
    saveState(); closeModal(); render();
  });
  document.getElementById("resetFullBtn").addEventListener("click", openConfirmFullReset);
}
function openConfirmFullReset(){
  openModal(`
    <h3 id="modalTitle">⚠️ সম্পূর্ণ অগ্রগতি রিসেট করুন?</h3>
    <p>এই কাজটি আপনার সব শেখা টপিক, বুকমার্ক, ভুল খাতা, কুইজ ইতিহাস, রিভিশন সময়সূচি ও স্টাডি স্ট্রিক স্থায়ীভাবে মুছে দেবে। এটি পূর্বাবস্থায় ফেরানো যাবে না।</p>
    <div class="modal-actions">
      <button class="btn secondary" id="cancelFullReset">বাতিল</button>
      <button class="btn" id="confirmFullReset" style="background:var(--wrong);border-color:var(--wrong);">হ্যাঁ, সব মুছে দিন</button>
    </div>
  `);
  document.getElementById("cancelFullReset").addEventListener("click", openSettingsModal);
  document.getElementById("confirmFullReset").addEventListener("click", ()=>{
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    STATE = {
      learned:{}, bookmarks:{}, mistakes:[], quizHistory:[],
      revision:{}, streak:0, lastStudyDate:null, theme:STATE.theme,
      totalQuizAttempts:0, totalCorrect:0
    };
    saveState();
    closeModal();
    navigate("dashboard");
  });
}
document.getElementById("settingsBtn").addEventListener("click", openSettingsModal);

// ============================================================
// BOOT
// ============================================================
applyTheme(STATE.theme || "light");
navigate("dashboard");

</script>
</body>
</html>
