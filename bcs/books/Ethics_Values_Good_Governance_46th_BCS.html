:root{
  --maroon:#7a1f2b; --maroon-dark:#5c1620; --gold:#c8972f; --gold-light:#e3b955;
  --paper:#faf5ec; --paper-2:#f3ead9; --ink:#2b2420; --ink-soft:#5a5048;
  --card:#ffffff; --border:#e6dac2; --shadow:0 2px 10px rgba(90,60,20,0.08);
  --green:#2f7d4f; --red:#b3362c; --blue:#2f5f8a;
  --radius:14px; --sidebar-w:250px;
  --font-scale:1; --line-height:1.8; --read-width:760px;
}
:root[data-theme="dark"]{
  --maroon:#e0596a; --maroon-dark:#c8455a; --gold:#e3b955; --gold-light:#f0cd7c;
  --paper:#1c1712; --paper-2:#241d16; --ink:#f0e6d6; --ink-soft:#c9bba4;
  --card:#26201a; --border:#3c3226; --shadow:0 2px 14px rgba(0,0,0,0.35);
  --green:#5cbf82; --red:#e2685c; --blue:#6fa8d6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Kalpurush','Noto Sans Bengali','Hind Siliguri',-apple-system,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:calc(16px * var(--font-scale));
  line-height:var(--line-height);
  min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
::selection{background:var(--gold-light);color:var(--maroon-dark);}
a{color:var(--maroon);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:linear-gradient(180deg,var(--maroon) 0%, var(--maroon-dark) 100%);
  color:#fbe9c8; padding:18px 14px; position:fixed; top:0; bottom:0; left:0; overflow-y:auto; z-index:40;
  transition:transform .25s ease;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px 8px;border-bottom:1px solid rgba(255,255,255,0.15);margin-bottom:12px;}
.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--maroon-dark);font-size:18px;flex-shrink:0;}
.brand-text{font-weight:700;font-size:15px;line-height:1.3;}
.brand-text small{display:block;font-weight:400;font-size:11px;opacity:.75;}
.nav-group{margin-bottom:16px;}
.nav-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;padding:4px 10px;font-weight:600;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;
  color:#f6e6c8; text-decoration:none; font-size:14px; font-weight:500; margin:1px 0;
}
.nav-item:hover{background:rgba(255,255,255,0.08);}
.nav-item.active{background:rgba(255,255,255,0.16);color:#fff;}
.nav-icon{width:18px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;font-size:11px;background:rgba(255,255,255,0.15);padding:1px 7px;border-radius:20px;}

#hamburger{display:none;position:fixed;top:12px;left:12px;z-index:60;background:var(--maroon);color:#fff;border:none;border-radius:10px;width:42px;height:42px;font-size:20px;box-shadow:var(--shadow);}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;}

#main{flex:1;margin-left:var(--sidebar-w);padding:22px 26px 60px;max-width:1200px;}
#view{animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

@media (max-width:880px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #hamburger{display:block;}
  #overlay.show{display:block;}
  #main{margin-left:0;padding:70px 14px 50px;}
}

/* ---------- Common components ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

h1,h2,h3,h4{font-family:'Kalpurush','Noto Sans Bengali','Hind Siliguri',serif;color:var(--maroon-dark);margin:0 0 10px;}
:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] h3,:root[data-theme="dark"] h4{color:var(--gold-light);}
h1{font-size:1.5em;} h2{font-size:1.25em;} h3{font-size:1.08em;}
.page-title{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.muted{color:var(--ink-soft);font-size:.92em;}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.78em;font-weight:600;background:var(--paper-2);border:1px solid var(--border);color:var(--ink-soft);}
.pill.gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--maroon-dark);border:none;}
.pill.green{background:rgba(47,125,79,.15);color:var(--green);border:none;}
.pill.red{background:rgba(179,54,44,.15);color:var(--red);border:none;}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-weight:600;font-size:.92em;cursor:pointer;text-decoration:none;font-family:inherit;}
.btn:hover{border-color:var(--maroon);}
.btn-primary{background:linear-gradient(135deg,var(--maroon),var(--maroon-dark));color:#fbe9c8;border:none;}
.btn-primary:hover{opacity:.92;}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--maroon-dark);border:none;}
.btn-ghost{background:transparent;border:1px dashed var(--border);}
.btn-sm{padding:5px 11px;font-size:.82em;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
select,input[type=text],input[type=number],input[type=search]{
  font-family:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-size:.92em;
}
.lec-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:7px;background:linear-gradient(135deg,var(--maroon),var(--gold));color:#fff;font-weight:700;font-size:.78em;}

.progress-bar{height:9px;border-radius:6px;background:var(--paper-2);overflow:hidden;border:1px solid var(--border);}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--maroon),var(--gold));}

.stat-card{display:flex;flex-direction:column;gap:2px;}
.stat-num{font-size:1.7em;font-weight:700;color:var(--maroon-dark);}
:root[data-theme="dark"] .stat-num{color:var(--gold-light);}
.stat-label{font-size:.82em;color:var(--ink-soft);}

.disc-label{font-weight:700;color:var(--maroon-dark);margin-bottom:4px;}
:root[data-theme="dark"] .disc-label{color:var(--gold-light);}
.disc-list{margin:0;padding-left:22px;}
.disc-list li{margin-bottom:6px;}

/* MCQ */
.q-card{margin-bottom:16px;}
.q-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;}
.q-num{font-weight:700;color:var(--maroon-dark);}
:root[data-theme="dark"] .q-num{color:var(--gold-light);}
.q-text{font-weight:600;margin-bottom:12px;}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--paper-2);}
.opt:hover{border-color:var(--maroon);}
.opt.correct{background:rgba(47,125,79,.15);border-color:var(--green);}
.opt.incorrect{background:rgba(179,54,44,.15);border-color:var(--red);}
.opt.disabled{cursor:default;}
.opt-letter{font-weight:700;flex-shrink:0;width:20px;}
.q-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px;}
.tag-chip{font-size:.76em;padding:2px 9px;border-radius:20px;background:var(--paper-2);border:1px solid var(--border);color:var(--ink-soft);}

/* Flashcard */
.flash-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
.flashcard{width:100%;max-width:620px;min-height:220px;perspective:1200px;cursor:pointer;}
.flash-inner{position:relative;width:100%;height:100%;min-height:220px;transition:transform .5s;transform-style:preserve-3d;}
.flashcard.flipped .flash-inner{transform:rotateY(180deg);}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--border);padding:26px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--card);box-shadow:var(--shadow);font-size:1.08em;font-weight:600;}
.flash-back{transform:rotateY(180deg);background:var(--paper-2);}
.rate-row{display:flex;gap:10px;}
.rate-btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;color:#fff;}
.rate-again{background:var(--red);} .rate-good{background:var(--gold);color:var(--maroon-dark);} .rate-easy{background:var(--green);}

/* Sidebar nav toggles etc.*/
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}

table{width:100%;border-collapse:collapse;font-size:.92em;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
th{color:var(--ink-soft);font-weight:600;}

.timer{font-weight:700;color:var(--maroon-dark);}
:root[data-theme="dark"] .timer{color:var(--gold-light);}

.empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}

.search-hit{padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer;background:var(--card);}
.search-hit:hover{border-color:var(--maroon);}
mark{background:var(--gold-light);color:var(--maroon-dark);padding:0 2px;border-radius:3px;}

.toc-scroll{max-height:60vh;overflow-y:auto;}

.settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;}

footer.app-footer{margin-top:30px;text-align:center;color:var(--ink-soft);font-size:.82em;}
</style>

<script type="text/x-study-script">
/* ===================== Data decode ===================== */
const APP_DATA = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('app-data').textContent.trim()))));
const STORE_KEY = 'ethics46_bcs_state_v1';
const LETTERS = ['ক','খ','গ','ঘ'];

/* ===================== State ===================== */
function defaultState(){
  return {
    theme:'light', fontScale:1, lineHeight:1.8, readWidth:760,
    completedSections:[], bookmarks:[],
    mcqHistory:{}, // id -> {correct:bool, chosen:letter, ts, tag, lec}
    flashcards:{}, // id -> {ease,interval,due,reps,lastResult}
    streak:{count:0,lastDate:null},
    studyMinutes:0, xp:0,
    dailyGoal:20,
    mockResults:[] // {date, score, total, lec, durationSec}
  };
}
let STATE = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }catch(e){}
  applyTheme(); renderSidebar();
}
function touchStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(STATE.streak.lastDate === today) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  STATE.streak.count = (STATE.streak.lastDate === y) ? STATE.streak.count+1 : 1;
  STATE.streak.lastDate = today;
  STATE.xp += 5;
}

/* ===================== Helpers ===================== */
function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v===null || v===undefined || v===false) continue; // skip falsy: keeps e.g. selected/disabled off
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(v===true) e.setAttribute(k, ''); // boolean attrs: selected, disabled, checked...
    else e.setAttribute(k, v);
  }
  for(const c of children.flat()){
    if(c==null) continue;
    e.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  }
  return e;
}
function allLectures(){ return APP_DATA.lectures; }
function getLecture(id){ return APP_DATA.lectures.find(l=>l.id===Number(id)); }
function lecLabelText(l){ return l.title + ' — ' + l.topic; }
function allMcq(){
  let out=[];
  for(const l of APP_DATA.lectures) for(const m of l.mcq) out.push({lec:l.id, lecTitle:l.title, num:m[0], q:m[1], opts:m[2], ans:m[3], tag:m[4], id:l.id+'-'+m[0]});
  return out;
}
let MCQ_ALL = allMcq();
function mcqById(id){ return MCQ_ALL.find(m=>m.id===id); }
function fmtPct(n,d){ return d? Math.round(100*n/d)+'%' : '0%'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* ===================== Router ===================== */
let ROUTE = {view:'dashboard', params:{}};
function navigate(view, params={}){
  ROUTE = {view, params};
  location.hash = view + (Object.keys(params).length? ('?'+new URLSearchParams(params).toString()) : '');
  render();
  window.scrollTo(0,0);
  if(window.innerWidth<=880) closeSidebar();
}
function parseHash(){
  const h = location.hash.replace(/^#/,'');
  if(!h) return {view:'dashboard', params:{}};
  const [view, qs] = h.split('?');
  const params = {};
  if(qs) new URLSearchParams(qs).forEach((v,k)=>params[k]=v);
  return {view: view||'dashboard', params};
}
window.addEventListener('hashchange', ()=>{ ROUTE = parseHash(); render(); });

/* ===================== Sidebar ===================== */
const NAV = [
  {group:'পড়াশোনা', items:[
    {view:'dashboard', label:'ড্যাশবোর্ড', icon:'⌂'},
    {view:'reading', label:'পড়া (লেকচার)', icon:'▤'},
    {view:'cheatsheet', label:'গুরুত্বপূর্ণ তথ্যকণিকা', icon:'✦'},
  ]},
  {group:'অনুশীলন', items:[
    {view:'mcq', label:'MCQ অনুশীলন', icon:'☑'},
    {view:'flashcards', label:'Active Recall', icon:'◈'},
    {view:'terminology', label:'পরিভাষা ফ্ল্যাশকার্ড', icon:'⇄'},
    {view:'mock', label:'মক টেস্ট', icon:'⏱'},
  ]},
  {group:'পর্যালোচনা', items:[
    {view:'bookmarks', label:'বুকমার্ক', icon:'★'},
    {view:'weak', label:'ভুল বই / দুর্বল বিষয়', icon:'⚠'},
    {view:'analytics', label:'অগ্রগতি বিশ্লেষণ', icon:'📊'},
  ]},
  {group:'অন্যান্য', items:[
    {view:'search', label:'সার্চ', icon:'🔍'},
    {view:'settings', label:'সেটিংস', icon:'⚙'},
    {view:'guide', label:'গাইড', icon:'?'},
  ]},
];
function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML='';
  sb.appendChild(el('div',{class:'brand'},
    el('div',{class:'brand-mark'},'নৈ'),
    el('div',{class:'brand-text'}, APP_DATA.meta.title, el('small',null,'৪৬তম BCS প্রিলিমিনারি'))
  ));
  for(const g of NAV){
    const grp = el('div',{class:'nav-group'}, el('div',{class:'nav-group-label'}, g.group));
    for(const it of g.items){
      const active = ROUTE.view===it.view;
      const a = el('a',{class:'nav-item'+(active?' active':''), onclick:(e)=>{e.preventDefault();navigate(it.view);}, href:'#'+it.view},
        el('span',{class:'nav-icon'}, it.icon), it.label);
      grp.appendChild(a);
    }
    sb.appendChild(grp);
  }
  document.getElementById('sidebar').appendChild(el('div',{style:'height:20px'}));
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

function applyTheme(){
  document.documentElement.setAttribute('data-theme', STATE.theme);
  document.documentElement.style.setProperty('--font-scale', STATE.fontScale);
  document.documentElement.style.setProperty('--line-height', STATE.lineHeight);
  document.documentElement.style.setProperty('--read-width', STATE.readWidth+'px');
}

/* ===================== Stats helpers ===================== */
function mcqStats(){
  const hist = STATE.mcqHistory;
  const attempted = Object.keys(hist).length;
  const correct = Object.values(hist).filter(h=>h.correct).length;
  return {attempted, correct, total: MCQ_ALL.length};
}
function lecStats(lecId){
  const lec = getLecture(lecId);
  const ids = lec.mcq.map(m=>lecId+'-'+m[0]);
  let attempted=0, correct=0;
  ids.forEach(id=>{ const h=STATE.mcqHistory[id]; if(h){attempted++; if(h.correct) correct++;} });
  return {attempted, correct, total: ids.length};
}
function overallProgressPct(){
  const {attempted,total} = mcqStats();
  return total? Math.round(100*attempted/total):0;
}

/* ===================== VIEW: Dashboard ===================== */
function viewDashboard(){
  const wrap = el('div');
  wrap.appendChild(el('div',{class:'page-title'}, el('h1',null,'ড্যাশবোর্ড'), el('span',{class:'pill gold'}, todayStr())));

  const stats = mcqStats();
  const grid = el('div',{class:'grid grid-4'});
  grid.appendChild(statCard('সার্বিক অগ্রগতি', overallProgressPct()+'%'));
  grid.appendChild(statCard('স্ট্রিক', STATE.streak.count+' দিন'));
  grid.appendChild(statCard('XP', STATE.xp));
  grid.appendChild(statCard('MCQ সঠিক', stats.correct+'/'+stats.attempted));

/* ===================== VIEW: MCQ practice ===================== */
let MCQ_STATE = { lec:'all', tag:'all', pool:[], idx:0, showAnswer:false };
function buildMcqPool(){
  let pool = MCQ_ALL.slice();
  if(MCQ_STATE.lec!=='all') pool = pool.filter(m=>String(m.lec)===String(MCQ_STATE.lec));
  if(MCQ_STATE.tag!=='all') pool = pool.filter(m=>m.tag===MCQ_STATE.tag);
  MCQ_STATE.pool = pool;
  if(MCQ_STATE.idx>=pool.length) MCQ_STATE.idx=0;
}
function viewMcq(params){
  if(params.lec) MCQ_STATE.lec = params.lec;
  buildMcqPool();
  const wrap = el('div');
  wrap.appendChild(el('div',{class:'page-title'}, el('h1',null,'MCQ অনুশীলন'), el('span',{class:'pill'}, MCQ_STATE.pool.length+' টি প্রশ্ন')));

  const lecSel = el('select',{onchange:(e)=>{MCQ_STATE.lec=e.target.value; MCQ_STATE.idx=0; buildMcqPool(); render();}});
  lecSel.appendChild(el('option',{value:'all'},'সবগুলো লেকচার'));
  allLectures().forEach(l=> lecSel.appendChild(el('option',{value:l.id, selected:String(MCQ_STATE.lec)===String(l.id)?'selected':null}, lecLabelText(l))));
  const tagSel = el('select',{onchange:(e)=>{MCQ_STATE.tag=e.target.value; MCQ_STATE.idx=0; buildMcqPool(); render();}});
  tagSel.appendChild(el('option',{value:'all'},'সব বিষয়ভিত্তিক ট্যাগ'));
  APP_DATA.tags.forEach(t=> tagSel.appendChild(el('option',{value:t, selected:MCQ_STATE.tag===t?'selected':null}, t)));
  wrap.appendChild(el('div',{class:'filter-row'}, lecSel, tagSel,
    el('button',{class:'btn btn-sm', onclick:()=>{MCQ_STATE.idx = Math.floor(Math.random()*MCQ_STATE.pool.length); MCQ_STATE.showAnswer=false; render();}}, '🔀 এলোমেলো')
  ));

  if(!MCQ_STATE.pool.length){ wrap.appendChild(el('div',{class:'empty-state'},'কোনো প্রশ্ন পাওয়া যায়নি।')); return wrap; }

  const m = MCQ_STATE.pool[MCQ_STATE.idx];
  const hist = STATE.mcqHistory[m.id];
  const card = el('div',{class:'card q-card'});
  card.appendChild(el('div',{class:'q-head'},
    el('span',{class:'q-num'}, el('span',{class:'lec-badge'}, String(m.lec).padStart(2,'0')), ' প্রশ্ন '+m.num),
    el('div',null,
      el('span',{class:'tag-chip'}, m.tag),
      ' ',
      el('button',{class:'btn btn-sm '+(STATE.bookmarks.includes(m.id)?'btn-gold':''), onclick:()=>toggleBookmark(m.id)}, STATE.bookmarks.includes(m.id)?'★ বুকমার্কড':'☆ বুকমার্ক')
    )
  ));
  card.appendChild(el('div',{class:'q-text'}, m.q));
  const optList = el('div',{class:'opt-list'});
  const answered = MCQ_STATE.showAnswer;
  m.opts.forEach((opt,i)=>{
    const letter = LETTERS[i];
    let cls='opt'+(answered?' disabled':'');
    if(answered){
      if(letter===m.ans) cls+=' correct';
      else if(hist && hist.chosen===letter) cls+=' incorrect';
    }
    optList.appendChild(el('div',{class:cls, onclick:()=>{ if(!answered) answerMcq(m, letter); }},
      el('span',{class:'opt-letter'}, letter),
      el('span',null, opt)
    ));
  });
  card.appendChild(optList);

  if(answered){
    card.appendChild(el('div',{class:'q-footer'},
      el('span',{class: hist && hist.correct ? 'pill green':'pill red'}, hist && hist.correct? '✓ সঠিক উত্তর': '✗ ভুল উত্তর — সঠিক: '+m.ans)
    ));
  }

  const nav = el('div',{class:'btn-row', style:'margin-top:14px'});
  nav.appendChild(el('button',{class:'btn', onclick:()=>{ MCQ_STATE.idx=(MCQ_STATE.idx-1+MCQ_STATE.pool.length)%MCQ_STATE.pool.length; MCQ_STATE.showAnswer=false; render(); }}, '← আগের'));
  nav.appendChild(el('button',{class:'btn btn-primary', onclick:()=>{ MCQ_STATE.idx=(MCQ_STATE.idx+1)%MCQ_STATE.pool.length; MCQ_STATE.showAnswer=false; render(); }}, 'পরবর্তী →'));
  card.appendChild(nav);
  card.appendChild(el('p',{class:'muted', style:'margin-top:8px'}, (MCQ_STATE.idx+1)+' / '+MCQ_STATE.pool.length));

  wrap.appendChild(card);
  return wrap;
}
function answerMcq(m, letter){
  const correct = letter===m.ans;
  STATE.mcqHistory[m.id] = {correct, chosen:letter, ts:Date.now(), tag:m.tag, lec:m.lec};
  STATE.xp += correct? 2:1;
  touchStreak();
  MCQ_STATE.showAnswer = true;
  saveState();
  render();
}
function toggleBookmark(id){
  const i = STATE.bookmarks.indexOf(id);
  if(i>=0) STATE.bookmarks.splice(i,1); else STATE.bookmarks.push(id);
  saveState(); render();
}

/* ===================== VIEW: Flashcards (Active Recall, SM-2-ish) ===================== */
let FLASH_STATE = {lec:'all', queue:[], idx:0, flipped:false};
function flashDeckFromMcq(lecFilter){
  let items = MCQ_ALL.slice();
  if(lecFilter && lecFilter!=='all') items = items.filter(m=>String(m.lec)===String(lecFilter));
  return items.map(m=>({id:'fc-'+m.id, front:m.q, back: m.ans+') '+m.opts[LETTERS.indexOf(m.ans)], tag:m.tag, lec:m.lec}));
}
function sm2(card, rating){
  // rating: 0 again, 1 good, 2 easy
  let fc = STATE.flashcards[card.id] || {ease:2.5, interval:0, due:Date.now(), reps:0};
  if(rating===0){ fc.reps=0; fc.interval=0; fc.ease=Math.max(1.3, fc.ease-0.2); }
  else{
    fc.reps+=1;
    if(rating===1){ fc.interval = fc.reps===1?1:Math.round(fc.interval*fc.ease); }
    else { fc.ease += 0.15; fc.interval = fc.reps===1?3:Math.round(fc.interval*fc.ease*1.3)||4; }
  }
  fc.due = Date.now() + Math.max(fc.interval,0)*86400000;
  fc.lastResult = rating;
  STATE.flashcards[card.id] = fc;
}
function viewFlashcards(params){
  if(params.lec) FLASH_STATE.lec = params.lec;
  if(!FLASH_STATE.queue.length || params.reset) { FLASH_STATE.queue = flashDeckFromMcq(FLASH_STATE.lec); FLASH_STATE.idx=0; FLASH_STATE.flipped=false; }

  const wrap = el('div');
  wrap.appendChild(el('div',{class:'page-title'}, el('h1',null,'Active Recall ফ্ল্যাশকার্ড'), el('span',{class:'pill'}, FLASH_STATE.queue.length+' টি কার্ড')));

  const lecSel = el('select',{onchange:(e)=>{FLASH_STATE.lec=e.target.value; FLASH_STATE.queue=flashDeckFromMcq(FLASH_STATE.lec); FLASH_STATE.idx=0; FLASH_STATE.flipped=false; render();}});
  lecSel.appendChild(el('option',{value:'all'},'সবগুলো লেকচার'));
  allLectures().forEach(l=> lecSel.appendChild(el('option',{value:l.id, selected:String(FLASH_STATE.lec)===String(l.id)?'selected':null}, lecLabelText(l))));
  wrap.appendChild(el('div',{class:'filter-row'}, lecSel,
    el('button',{class:'btn btn-sm', onclick:()=>{FLASH_STATE.queue.sort(()=>Math.random()-0.5); FLASH_STATE.idx=0; render();}}, '🔀 শাফল')
  ));

  if(!FLASH_STATE.queue.length){ wrap.appendChild(el('div',{class:'empty-state'},'কোনো কার্ড নেই।')); return wrap; }
  const card = FLASH_STATE.queue[FLASH_STATE.idx % FLASH_STATE.queue.length];

  const fwrap = el('div',{class:'flash-wrap'});
  const fc = el('div',{class:'flashcard'+(FLASH_STATE.flipped?' flipped':''), onclick:()=>{FLASH_STATE.flipped=!FLASH_STATE.flipped; render();}});
  const inner = el('div',{class:'flash-inner'},
    el('div',{class:'flash-face flash-front'}, card.front),
    el('div',{class:'flash-face flash-back'}, card.back)
  );
  fc.appendChild(inner);
  fwrap.appendChild(fc);
  fwrap.appendChild(el('p',{class:'muted'}, 'কার্ডে ক্লিক করুন উত্তর দেখতে · '+(FLASH_STATE.idx%FLASH_STATE.queue.length+1)+' / '+FLASH_STATE.queue.length));

  if(FLASH_STATE.flipped){
    const rr = el('div',{class:'rate-row', style:'max-width:620px;width:100%'});
    rr.appendChild(el('button',{class:'rate-btn rate-again', onclick:()=>rateCard(card,0)}, 'আবার (Again)'));
    rr.appendChild(el('button',{class:'rate-btn rate-good', onclick:()=>rateCard(card,1)}, 'ভালো (Good)'));
    rr.appendChild(el('button',{class:'rate-btn rate-easy', onclick:()=>rateCard(card,2)}, 'সহজ (Easy)'));
    fwrap.appendChild(rr);
  }
  wrap.appendChild(fwrap);
  return wrap;
}
function rateCard(card, rating){
  sm2(card, rating);
  STATE.xp += rating===0?0:2;
  touchStreak();
  FLASH_STATE.idx = (FLASH_STATE.idx+1) % FLASH_STATE.queue.length;
  FLASH_STATE.flipped=false;
  saveState(); render();
}

    grid.appendChild(el('button',{class:'btn btn-sm '+(answered?'btn-gold':''), style: i===MOCK_STATE.idx?'outline:2px solid var(--maroon)':'', onclick:()=>{MOCK_STATE.idx=i; render();}}, i+1));
  });
  jump.appendChild(grid);
  jump.appendChild(el('div',{style:'margin-top:10px'}, el('button',{class:'btn', onclick:submitMock}, '✓ এখনই জমা দিন')));
  wrap.appendChild(jump);

  if(!MOCK_STATE.timerHandle){
    MOCK_STATE.timerHandle = setInterval(()=>{
      if(!MOCK_STATE.active || MOCK_STATE.submitted){ clearInterval(MOCK_STATE.timerHandle); MOCK_STATE.timerHandle=null; return; }
      if(Date.now() >= MOCK_STATE.endsAt){ submitMock(); }
      else if(ROUTE.view==='mock'){ render(); }
    }, 1000);
  }

  return wrap;
}
function startMock(){
  const lec = document.getElementById('mock-lec').value;
  const count = Math.max(5, Math.min(100, Number(document.getElementById('mock-count').value)||20));
  const minutes = Math.max(2, Math.min(60, Number(document.getElementById('mock-min').value)||15));
  let pool = MCQ_ALL.slice();
  if(lec!=='all') pool = pool.filter(m=>String(m.lec)===String(lec));
  pool.sort(()=>Math.random()-0.5);
  MOCK_STATE = {active:true, lec, count, minutes, questions:pool.slice(0,count), answers:{}, idx:0, endsAt:Date.now()+minutes*60000, timerHandle:null, submitted:false};
  render();
}
function submitMock(){
  if(MOCK_STATE.submitted) return;
  if(MOCK_STATE.timerHandle){ clearInterval(MOCK_STATE.timerHandle); MOCK_STATE.timerHandle=null; }
  let score=0;
  MOCK_STATE.questions.forEach(q=>{
    const chosen = MOCK_STATE.answers[q.id];
    const correct = chosen===q.ans;
    if(correct) score++;
    STATE.mcqHistory[q.id] = {correct: !!chosen && correct, chosen: chosen||null, ts:Date.now(), tag:q.tag, lec:q.lec};
  });
  STATE.mockResults.push({date:Date.now(), score, total:MOCK_STATE.questions.length, lec:MOCK_STATE.lec});
  STATE.xp += score*2;
  touchStreak();
  MOCK_STATE.submitted = true;
  saveState();
  render();
}

function mcqReviewCard(m){

function exportData(){
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='ethics46_bcs_progress.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      STATE = Object.assign(defaultState(), parsed);
      saveState(); render();
      alert('ডেটা সফলভাবে ইমপোর্ট হয়েছে।');
    }catch(err){ alert('ফাইলটি সঠিক নয়।'); }
  };
  reader.readAsText(file);
}
function resetData(){
  if(confirm('আপনি কি নিশ্চিত? এতে আপনার সকল অগ্রগতি মুছে যাবে।')){

  }
}

function viewSearch(params){
  const wrap = el('div');
  wrap.appendChild(el('div',{class:'page-title'}, el('h1',null,'সার্চ')));
  const q = params.q || '';
  const inp = el('input',{type:'search', placeholder:'প্রশ্ন বা পড়ার বিষয় খুঁজুন...', value:q, style:'width:100%;max-width:520px', oninput:(e)=>{ doSearch(e.target.value); }});
  wrap.appendChild(inp);
  const results = el('div',{id:'search-results', style:'margin-top:16px'});
  wrap.appendChild(results);
  if(q) doSearch(q);
  return wrap;
}
function doSearch(q){
  const results = document.getElementById('search-results');
  if(!results) return;
  results.innerHTML='';
  if(!q || q.trim().length<2){ results.appendChild(el('p',{class:'muted'},'কমপক্ষে ২ অক্ষর লিখুন।')); return; }
  const needle = q.trim().toLowerCase();
  let hits=[];
  MCQ_ALL.forEach(m=>{
    const hay = (m.q+' '+m.opts.join(' ')).toLowerCase();
    if(hay.includes(needle)) hits.push({type:'mcq', m});
  });
  allLectures().forEach(l=>{
    l.sections.forEach(s=>{
      const hay=(s.heading+' '+s.body).toLowerCase();
      if(hay.includes(needle)) hits.push({type:'reading', l, s});
    });
  });
  if(!hits.length){ results.appendChild(el('p',{class:'muted'},'কোনো ফলাফল পাওয়া যায়নি।')); return; }
  hits.slice(0,60).forEach(h=>{
    if(h.type==='mcq'){
      const div = el('div',{class:'search-hit', onclick:()=>{ MCQ_STATE.lec=String(h.m.lec); MCQ_STATE.tag='all'; buildMcqPool(); MCQ_STATE.idx = MCQ_STATE.pool.findIndex(x=>x.id===h.m.id); MCQ_STATE.showAnswer=false; navigate('mcq',{lec:h.m.lec}); }},
        el('div',null, el('span',{class:'lec-badge'}, String(h.m.lec).padStart(2,'0')), ' প্রশ্ন '+h.m.num),
        el('div',{style:'margin-top:4px'}, h.m.q)
      );
      results.appendChild(div);
    } else {
      const div = el('div',{class:'search-hit', onclick:()=>navigate('reading',{lec:h.l.id})},
        el('div',null, el('span',{class:'lec-badge'}, String(h.l.id).padStart(2,'0')), ' '+h.l.title+' — পড়া'),
        el('div',{style:'margin-top:4px'}, h.s.heading)
      );
      results.appendChild(div);
    }
  });
}

    <p>উৎস PDF-এ কেবল সিলেবাস-স্কোপ বুলেট পয়েন্ট এবং MCQ ব্যাংক ছিল — কোনো বিস্তারিত অনুচ্ছেদ-ভিত্তিক পাঠ্য বা PYQ পরীক্ষার বছরের ট্যাগ ছিল না, তাই এখানেও তা যোগ করা হয়নি। সবগুলো উত্তর মূল উৎসের ছাপানো উত্তরমালার সাথে দুইবার মিলিয়ে যাচাই করা হয়েছে। উৎসে যেভাবে ছাপা হয়েছে, উত্তর ঠিক সেভাবেই রাখা হয়েছে — কোনো উত্তর নিজে থেকে "সংশোধন" করা হয়নি, এমনকি কিছু ক্ষেত্রে (যেমন লেকচার-০২ প্রশ্ন ৩৫ ও ৪৪) উত্তরমালার পছন্দ ভাষাগতভাবে প্রত্যাশিত উত্তর থেকে ভিন্ন মনে হলেও।</p>
    <h3>ডেটা কোথায় সংরক্ষিত হয়?</h3>
    <p>আপনার অগ্রগতি এই ডিভাইসে সংরক্ষিত থাকে এবং সাইন ইন করা অ্যাকাউন্টে সিঙ্ক হয়। ব্রাউজারের ডেটা মোছার আগে মূল ড্যাশবোর্ডের Progress record থেকে সম্পূর্ণ ব্যাকআপ নিন।</p>
  `;
  wrap.appendChild(card);
  return wrap;
}

/* ===================== Master render ===================== */
function render(){
  const viewEl = document.getElementById('view');
  viewEl.innerHTML='';
  let node;
  switch(ROUTE.view){
    case 'dashboard': node = viewDashboard(); break;
    case 'reading': node = viewReading(ROUTE.params); break;
    case 'cheatsheet': node = viewCheatsheet(); break;
    case 'mcq': node = viewMcq(ROUTE.params); break;
    case 'flashcards': node = viewFlashcards(ROUTE.params); break;
    case 'terminology': node = viewTerminology(); break;
    case 'mock': node = viewMock(); break;
    case 'bookmarks': node = viewBookmarks(); break;
    case 'weak': node = viewWeak(); break;
    case 'analytics': node = viewAnalytics(); break;
    case 'search': node = viewSearch(ROUTE.params); break;
    case 'settings': node = viewSettings(); break;
    case 'guide': node = viewGuide(); break;
    default: node = viewDashboard();
  }
  viewEl.appendChild(node);
  renderSidebar();
  applyTheme();
}

/* ===================== Init ===================== */
ROUTE = parseHash();
applyTheme();
renderSidebar();
render();

</script>
