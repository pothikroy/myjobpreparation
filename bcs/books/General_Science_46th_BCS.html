<title>সাধারণ বিজ্ঞান — ৪৬তম বিসিএস প্রিলিমিনারি</title>
<style>
:root{
  --paper:#f7f2e7; --paper-2:#efe7d4; --ink:#241c14; --ink-soft:#5b5041;
  --maroon:#7a2321; --maroon-dark:#5c1a18; --gold:#b8863b; --gold-soft:#e4c98a;
  --teal:#1f5c56; --teal-soft:#dceceb;
  --card:#fffdf8; --border:#ddd0af; --shadow:rgba(36,28,20,.12);
  --green:#276b34; --green-bg:#e4f3e6; --red:#a12f2f; --red-bg:#fbe6e6;
  --radius:10px;
  --font-ui:"Hind Siliguri","Kalpurush","Noto Sans Bengali",-apple-system,sans-serif;
  --font-content:"Kalpurush","SolaimanLipi","Noto Serif Bengali",Georgia,serif;
  --font-size:17px; --line-height:1.9; --read-width:760px;
}
[data-theme="dark"]{
  --paper:#181410; --paper-2:#211b15; --ink:#ede4d3; --ink-soft:#b7ab95;
  --maroon:#d97a72; --maroon-dark:#b85e56; --gold:#dcb567; --gold-soft:#a3873f;
  --teal:#5fb3a9; --teal-soft:#1c2c2a;
  --card:#211b15; --border:#3a3025; --shadow:rgba(0,0,0,.4);
  --green:#7bc98d; --green-bg:#173a22; --red:#e08a8a; --red-bg:#3a1a1a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-ui);
  font-size:var(--font-size); line-height:1.6; min-height:100vh;
}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:.95em;}
table th,table td{border:1px solid var(--border);padding:8px 10px;text-align:left;}
table th{background:var(--paper-2);}
h1,h2,h3,h4{font-family:var(--font-ui);color:var(--maroon);margin:1.1em 0 .5em;}
mark{background:var(--gold-soft);color:var(--ink);padding:0 2px;border-radius:3px;}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:270px;flex-shrink:0;background:var(--paper-2);border-right:1px solid var(--border);
  padding:18px 12px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:40;
  transition:transform .25s ease;
}
#main{flex:1;margin-left:270px;padding:22px 26px 80px;max-width:1100px;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand-mark{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,var(--maroon),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0;}
.brand-text{line-height:1.25;}
.brand-text b{display:block;font-size:15px;color:var(--maroon);}
.brand-text span{font-size:12px;color:var(--ink-soft);}
.nav-group{margin-bottom:14px;}
.nav-label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;padding:6px 10px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14.5px;color:var(--ink);}
.nav-item:hover{background:var(--paper);}
.nav-item.active{background:var(--maroon);color:#fff;}
.nav-item .ic{width:18px;text-align:center;flex-shrink:0;}
#hamburger{display:none;}
#overlay{display:none;}

/* ---------- Cards / common ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px var(--shadow);}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
.stat{text-align:center;}
.stat b{display:block;font-size:26px;color:var(--maroon);}
.stat span{font-size:12.5px;color:var(--ink-soft);}
.progressbar{background:var(--paper-2);border-radius:20px;height:10px;overflow:hidden;border:1px solid var(--border);}
.progressbar > div{background:linear-gradient(90deg,var(--teal),var(--gold));height:100%;transition:width .4s;}
.btn{display:inline-block;padding:9px 16px;border-radius:8px;border:1px solid var(--maroon);background:var(--maroon);color:#fff;font-size:14px;font-weight:600;}
.btn-ghost{display:inline-block;padding:6px 12px;border-radius:7px;border:1px solid var(--maroon);background:#fff;color:var(--maroon);font-weight:600;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--maroon);}
.btn.small{padding:5px 10px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;background:var(--paper-2);color:var(--ink-soft);border:1px solid var(--border);}
.pill.ready{background:var(--green-bg);color:var(--green);border-color:var(--green);}
.pill.pending{background:var(--gold-soft);color:var(--maroon-dark);}
.hr{border:0;border-top:1px solid var(--border);margin:18px 0;}
input[type=text],input[type=number],input[type=search]{
  font-family:inherit;font-size:14.5px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--paper);color:var(--ink);width:100%;
}
select{font-family:inherit;font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--paper);color:var(--ink);}
input[type=range]{width:100%;}

/* ---------- Reading ---------- */
.reading-wrap{max-width:var(--read-width);margin:0 auto;}
.content-body{font-family:var(--font-content);font-size:var(--font-size);line-height:var(--line-height);}
.content-body p{margin:0 0 14px;}
.section-block{margin-bottom:26px;padding-bottom:22px;border-bottom:1px dashed var(--border);}
.section-block:last-child{border-bottom:none;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.section-head h3{margin:0;}
.icon-btn{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:13px;color:var(--ink-soft);}
.icon-btn.on{background:var(--gold-soft);color:var(--maroon-dark);border-color:var(--gold);}

/* ---------- MCQ / PYQ ---------- */
.q-card{margin-bottom:18px;}
.q-num{color:var(--maroon);font-weight:700;margin-right:6px;}
.opt-list{display:grid;gap:8px;margin-top:12px;}
.opt{
  border:1px solid var(--border);border-radius:8px;padding:10px 13px;background:var(--paper);
  display:flex;gap:10px;align-items:flex-start;
}
.opt:not(.answered){cursor:pointer;}
.opt:not(.answered):hover{border-color:var(--maroon);}
.opt .k{font-weight:700;color:var(--ink-soft);flex-shrink:0;}
.opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);}
.opt.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red);}
.opt.reveal-correct{background:var(--green-bg);border-color:var(--green);}
.tag-year{font-size:12px;color:var(--teal);background:var(--teal-soft);padding:2px 9px;border-radius:20px;}
.tag-cat{font-size:12px;color:#6b4fa0;background:#efe9fb;padding:2px 9px;border-radius:20px;}
.lec-badge{display:inline-block;background:linear-gradient(135deg,var(--maroon),var(--gold));color:#fff;font-weight:700;padding:1px 8px;border-radius:6px;font-size:0.92em;letter-spacing:0.5px;}
.answer-box{margin-top:10px;padding:10px 13px;border-radius:8px;background:var(--teal-soft);color:var(--teal);font-size:14.5px;display:none;}
.answer-box.show{display:block;}

/* ---------- Flashcard ---------- */
.flash-stage{max-width:520px;margin:10px auto;}
.flash-card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;min-height:230px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;
  font-size:19px;box-shadow:0 3px 10px var(--shadow);cursor:pointer;position:relative;
}
.flash-card .badge{position:absolute;top:12px;left:16px;font-size:12px;color:var(--ink-soft);}
.flash-rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;}
.flash-rate button{padding:11px 4px;border-radius:9px;border:1px solid var(--border);font-size:13.5px;background:var(--paper-2);color:var(--ink);}
.flash-rate button.again{border-color:var(--red);color:var(--red);}
.flash-rate button.good{border-color:var(--green);color:var(--green);}
.flash-rate button.easy{border-color:var(--teal);color:var(--teal);}

/* ---------- Search ---------- */
.search-hit{padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;background:var(--card);cursor:pointer;}
.search-hit:hover{border-color:var(--maroon);}
.search-hit .meta{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}

/* ---------- Lecture list ---------- */
.lec-list{display:grid;gap:8px;}
.lec-item{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border:1px solid var(--border);border-radius:9px;background:var(--card);cursor:pointer;}
.lec-item.disabled{cursor:not-allowed;opacity:.6;}
.lec-item:hover:not(.disabled){border-color:var(--maroon);}
.lec-item b{display:block;}
.lec-item small{color:var(--ink-soft);}
.lec-picker{padding-bottom:14px;}
.lec-chip-strip{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}
.lec-chip{
  width:38px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--paper);
  color:var(--ink-soft);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
}
.lec-chip.ready{color:var(--ink);border-color:var(--teal);cursor:pointer;}
.lec-chip.ready:hover{background:var(--teal-soft);}
.lec-chip.pending{opacity:.45;cursor:not-allowed;}
.lec-chip.active{background:var(--maroon);border-color:var(--maroon);color:#fff;}

/* ---------- Mock test ---------- */
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;color:var(--maroon);}

footer.appfoot{font-size:12.5px;color:var(--ink-soft);text-align:center;padding:20px 0 4px;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:30px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .25s,bottom .25s;z-index:200;
}
#toast.show{opacity:1;bottom:32px;}

/* ---------- Mobile ---------- */
#topbar{display:none;}
@media(max-width:880px){
  #sidebar{transform:translateX(-100%);width:78vw;max-width:300px;box-shadow:2px 0 14px var(--shadow);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;padding:16px 14px 70px;}
  #topbar{
    display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--paper-2);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;
  }
  #hamburger{display:flex;background:none;border:1px solid var(--border);border-radius:8px;width:38px;height:38px;align-items:center;justify-content:center;font-size:18px;color:var(--ink);}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;}
  #overlay.show{display:block;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:1fr;}
  .grid-2{grid-template-columns:1fr;}
}
</style>
</head>

<script>
/* ============================================================
   সাধারণ বিজ্ঞান — ৪৬তম বিসিএস প্রিলিমিনারি — অফলাইন স্টাডি অ্যাপ
   ============================================================ */
(function(){
"use strict";

/* ---------- Load embedded data ---------- */
var APP_DATA;
try{
  var raw = document.getElementById('app-data').textContent.trim();
  var jsonStr = decodeURIComponent(escape(atob(raw)));
  APP_DATA = JSON.parse(jsonStr);
}catch(e){
  document.getElementById('view').innerHTML = '<div class="card">ডেটা লোড করতে সমস্যা হয়েছে।</div>';
  throw e;
}
var LECTURES = APP_DATA.lectures;
function getLecture(id){ return LECTURES.find(function(l){ return l.id === id; }); }
function lecNum(l){ return String(l.id).length<2 ? '0'+l.id : String(l.id); }
function lecBaseTitle(l){ return l.title.split('#')[0].trim(); }
function lecLabelText(l){ return lecBaseTitle(l)+' '+lecNum(l) + (l.topic? ' — '+l.topic : ''); }
function lecLabelHTML(l){
  var arr = [lecBaseTitle(l)+' ', el('span',{class:'lec-badge'},[lecNum(l)])];
  if(l.topic) arr.push(' — '+l.topic);
  return arr;
}
function lecLabelRawHTML(l){
  var s = lecBaseTitle(l)+' <span class="lec-badge">'+lecNum(l)+'</span>';
  if(l.topic) s += ' — '+escapeHtml(l.topic);
  return s;
}

/* ---------- State (persisted) ---------- */
var STORE_KEY = 'gs46_bcs_state_v1';
var DEFAULT_STATE = {
  theme: 'light',
  fontSize: 17, lineHeight: 1.9, readWidth: 760,
  dailyGoal: 20,
  completedSections: {},      // "lecId:sectionIdx" -> true
  bookmarks: [],              // ["lecId:sectionIdx", ...]
  mcqHistory: {},             // "lecId:mcq:num" -> {attempts:[{choice,correct,ts}]}
  pyqHistory: {},
  flashcards: {},             // "lecId:practice:num" -> {ease,interval,due,reps}
  streak: { lastDate: null, count: 0 },
  studyMinutes: 0,
  xp: 0,
  mockResults: []             // [{date,total,correct,byLecture}]
};
var STATE = loadState();

function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(STORE_KEY));
    if(!s) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    // merge missing defaults (future-proofing)
    for(var k in DEFAULT_STATE){ if(!(k in s)) s[k] = DEFAULT_STATE[k]; }
    return s;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(STATE));
}
function bumpStreak(){
  var today = new Date().toISOString().slice(0,10);
  if(STATE.streak.lastDate === today) return;
  var y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  STATE.streak.count = (STATE.streak.lastDate === y) ? STATE.streak.count+1 : 1;
  STATE.streak.lastDate = today;
  saveState();
}
function addXP(n){ STATE.xp += n; saveState(); }

/* ---------- Utilities ---------- */
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else if(k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){ if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function highlight(text, q){
  if(!q) return escapeHtml(text);
  var esc = escapeHtml(text);
  var qEsc = escapeHtml(q);
  try{
    var re = new RegExp('('+qEsc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return esc.replace(re, '<mark>$1</mark>');
  }catch(e){ return esc; }
}
function stripHtml(html){
  var d = document.createElement('div'); d.innerHTML = html; return d.textContent || '';
}
var OPT_KEYS = ['ক','খ','গ','ঘ'];

/* ---------- Routing ---------- */
var ROUTE = { view: 'dashboard', params: {} };
function navigate(view, params){
  ROUTE = { view: view, params: params || {} };
  closeSidebar();
  renderNav();
  RENDER[view]();
  document.getElementById('main').scrollTop = 0;
  window.scrollTo(0,0);
}

/* ---------- Sidebar ---------- */
var NAV_TREE = [
  { label: 'পড়াশোনা', items: [
    ['dashboard','⌂','ড্যাশবোর্ড'],
    ['today','☀','আজকের পড়া'],
    ['reading','▤','মূল বিষয়বস্তু'],
    ['search','🔍','সার্চ'],
    ['bookmarks','★','বুকমার্ক']
  ]},
  { label: 'অনুশীলন', items: [
    ['flashcards','◆','ফ্ল্যাশকার্ড'],
    ['recall','◈','Active Recall'],
    ['mcqPractice','☑','MCQ অনুশীলন'],
    ['pyq','⏱','Previous Year (PYQ)'],
    ['mockTest','▦','মক টেস্ট']
  ]},
  { label: 'পর্যালোচনা', items: [
    ['weak','⚠','দুর্বল বিষয় / রিভিশন'],
    ['mistakes','✎','ভুল বই'],
    ['progress','📈','অগ্রগতি']
  ]},
  { label: 'অন্যান্য', items: [
    ['settings','⚙','সেটিংস'],
    ['guide','?','গাইড / সাহায্য']
  ]}
];
function renderNav(){
  var nav = document.getElementById('navtree');
  nav.innerHTML = '';
  NAV_TREE.forEach(function(group){
    var g = el('div',{class:'nav-group'});
    g.appendChild(el('div',{class:'nav-label'},[group.label]));
    group.items.forEach(function(it){
      var item = el('div',{class:'nav-item'+(ROUTE.view===it[0]?' active':'')},[
        el('span',{class:'ic'},[it[1]]), it[2]
      ]);
      item.addEventListener('click', function(){ navigate(it[0]); });
      g.appendChild(item);
    });
    nav.appendChild(g);
  });
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
document.getElementById('hamburger').addEventListener('click', function(){
  var sb = document.getElementById('sidebar');
  sb.classList.contains('open') ? closeSidebar() : openSidebar();
});
document.getElementById('overlay').addEventListener('click', closeSidebar);

/* ============================================================
   RENDER FUNCTIONS
   ============================================================ */
var RENDER = {};
function view(){ return document.getElementById('view'); }

/* ---- helpers for stats ---- */
function lectureStats(lec){
  var mcqTotal = lec.mcq.length, pyqTotal = lec.pyq.length, practiceTotal = lec.practice.length;
  var mcqDone = 0, mcqCorrect = 0;
  lec.mcq.forEach(function(q){
    var h = STATE.mcqHistory[lec.id+':mcq:'+q[0]];
    if(h && h.attempts.length){ mcqDone++; if(h.attempts[h.attempts.length-1].correct) mcqCorrect++; }
  });
  var pyqDone=0, pyqCorrect=0;
  lec.pyq.forEach(function(q){
    var h = STATE.pyqHistory[lec.id+':pyq:'+q[0]];
    if(h && h.attempts.length){ pyqDone++; if(h.attempts[h.attempts.length-1].correct) pyqCorrect++; }
  });
  var secTotal = lec.sections.length, secDone=0;
  lec.sections.forEach(function(_,i){ if(STATE.completedSections[lec.id+':'+i]) secDone++; });
  return {mcqTotal:mcqTotal,mcqDone:mcqDone,mcqCorrect:mcqCorrect,pyqTotal:pyqTotal,pyqDone:pyqDone,pyqCorrect:pyqCorrect,
          practiceTotal:practiceTotal, secTotal:secTotal, secDone:secDone};
}
function overallStats(){
  var total=0, done=0;
  LECTURES.forEach(function(lec){
    if(lec.status!=='ready') return;
    var s = lectureStats(lec);
    total += s.mcqTotal+s.pyqTotal+s.secTotal;
    done += s.mcqDone+s.pyqDone+s.secDone;
  });
  return {total:total, done:done, pct: total? Math.round(done/total*100):0};
}

function doSearch(q){
  var results = document.getElementById('searchresults');
  results.innerHTML='';
  if(q.length < 2) return;
  var ql = q.toLowerCase();
  var hits = [];
  LECTURES.forEach(function(lec){
    if(lec.status!=='ready') return;
    lec.sections.forEach(function(sec, idx){
      var text = sec.heading+' '+stripHtml(sec.body);
      if(text.toLowerCase().indexOf(ql) !== -1){
        hits.push({type:'পড়া',lec:lec,label:sec.heading, snippet:stripHtml(sec.body).slice(0,140), go:function(){navigate('reading',{lec:lec.id,scrollTo:idx});}});
      }
    });
    lec.mcq.forEach(function(m){
      if(m[1].toLowerCase().indexOf(ql)!==-1){
        hits.push({type:'MCQ',lec:lec,label:'প্রশ্ন '+m[0], snippet:m[1], go:function(){navigate('mcqPractice',{lec:lec.id,jump:m[0]});}});
      }
    });
    lec.pyq.forEach(function(p){
      if(p[1].toLowerCase().indexOf(ql)!==-1){
        hits.push({type:'PYQ',lec:lec,label:p[4], snippet:p[1], go:function(){navigate('pyq',{lec:lec.id,jump:p[0]});}});
      }
    });
    lec.practice.forEach(function(p){
      if(p[1].toLowerCase().indexOf(ql)!==-1 || p[2].toLowerCase().indexOf(ql)!==-1){
        hits.push({type:'অনুশীলনী',lec:lec,label:'প্রশ্ন '+p[0], snippet:p[1]+' — উত্তর: '+p[2], go:function(){navigate('recall',{lec:lec.id,jump:p[0]});}});
      }
    });
  });
  if(!hits.length){ results.appendChild(el('div',{class:'card'},['কিছু পাওয়া যায়নি।'])); return; }
  hits.slice(0,60).forEach(function(h){
    var hit = el('div',{class:'search-hit'},[
      el('div',{class:'meta'},[h.type+' · '+h.lec.title]),
      el('div',{html:'<b>'+highlight(h.label,q)+'</b>'}),
      el('div',{style:'font-size:13.5px;color:var(--ink-soft);margin-top:3px;',html:highlight(h.snippet,q)+'…'})
    ]);
    hit.addEventListener('click', h.go);
    results.appendChild(hit);
  });
}

/* ---------------- MCQ Practice (shared for main MCQ + PYQ) ---------------- */
function renderQuizList(kind){
  // kind: 'mcqPractice' -> lec.mcq / STATE.mcqHistory ; 'pyq' -> lec.pyq / STATE.pyqHistory
  var isMcq = kind==='mcqPractice';
  var v = el('div',{});
  v.appendChild(el('h2',{},[isMcq? 'MCQ অনুশীলন' : 'Previous Year Questions (PYQ)']));

  var readyLectures = LECTURES.filter(function(l){return l.status==='ready';});
  var lecId = ROUTE.params.lec || (readyLectures[0] && readyLectures[0].id);
  var selectWrap = el('div',{class:'card',style:'display:flex;gap:10px;align-items:center;flex-wrap:wrap;'});
  var sel = el('select',{});
  readyLectures.forEach(function(l){ sel.appendChild(el('option',{value:l.id},[lecLabelText(l)])); });
  sel.value = lecId;
  sel.addEventListener('change', function(){ navigate(kind,{lec:Number(sel.value)}); });
  selectWrap.appendChild(el('span',{},['লেকচার:'])); selectWrap.appendChild(sel);

  var lec = getLecture(lecId);
  var pool = isMcq? lec.mcq : lec.pyq;
  var yearSel = null;
  if(!isMcq){
    var years = Array.from(new Set(pool.map(function(p){return p[4];})));
    yearSel = el('select',{});
    yearSel.appendChild(el('option',{value:''},['সব বছর']));
    years.forEach(function(y){ yearSel.appendChild(el('option',{value:y},[y])); });
    yearSel.addEventListener('change', function(){ renderQuiz(); });
    selectWrap.appendChild(el('span',{},['পরীক্ষা:'])); selectWrap.appendChild(yearSel);
  }
  v.appendChild(selectWrap);
  var list = el('div',{id:'quizlist'});
  v.appendChild(list);
  view().innerHTML=''; view().appendChild(v);

  function renderQuiz(){
    list.innerHTML='';
    if(!lec || !pool.length){ list.appendChild(el('div',{class:'card'},['এই লেকচারে এখনো কোনো প্রশ্ন যুক্ত করা হয়নি।'])); return; }
    var filtered = pool;
    if(!isMcq && yearSel && yearSel.value) filtered = pool.filter(function(p){return p[4]===yearSel.value;});
    filtered.forEach(function(q){
      var num=q[0], qtext=q[1], opts=q[2], ans=q[3];
      var year = isMcq ? null : q[4];
      var meta = isMcq ? q[4] : null; // for mcq, q[4] holds unverified-answer metadata (pyq uses q[4] for year)
      var unverified = isMcq && meta && meta.verified===false;
      var histKey = lec.id+':'+(isMcq?'mcq':'pyq')+':'+num;
      var hist = (isMcq?STATE.mcqHistory:STATE.pyqHistory)[histKey];
      var lastAttempt = hist && hist.attempts.length ? hist.attempts[hist.attempts.length-1] : null;
      var answered = !!lastAttempt;
      var lastChoice = lastAttempt ? lastAttempt.choice : null;
      var revealed = lastAttempt ? !!lastAttempt.revealed : false;

      var card = el('div',{class:'card q-card',id:(isMcq?'mcq-':'pyq-')+num});
      var headLine = el('div',{},[
        el('span',{class:'q-num'},[num+'.']), qtext
      ]);
      if(year) headLine.appendChild(el('span',{class:'tag-year',style:'margin-left:8px;'},[year]));
      if(isMcq) headLine.appendChild(el('span',{class:'tag-cat',style:'margin-left:8px;'},['Teacher Student\'s Work']));
      card.appendChild(headLine);
      if(unverified){
        card.appendChild(el('div',{style:'font-size:12px;color:#a15c00;background:#fff6e5;border:1px solid #f0d9a8;border-radius:6px;padding:4px 8px;margin:6px 0;'},
          ['⚠ উত্তর সোর্স-ভেরিফায়েড নয় — '+(meta.note||'Claude কর্তৃক অনুমিত।')]));
      }
      var optList = el('div',{class:'opt-list'});
      OPT_KEYS.forEach(function(k,i){
        if(opts[i]===undefined) return;
        var optDiv = el('div',{class:'opt'+(answered? ' answered':'')},[
          el('span',{class:'k'},[k+'.']), el('span',{},[opts[i]])
        ]);
        if(answered){
          if(k===ans) optDiv.classList.add('correct');
          else if(!revealed && k===lastChoice) optDiv.classList.add('wrong');
        } else {
          optDiv.addEventListener('click', function(){
            var store = isMcq?STATE.mcqHistory:STATE.pyqHistory;
            if(!store[histKey]) store[histKey] = {attempts:[]};
            var correct = (k===ans);
            store[histKey].attempts.push({choice:k, correct:correct, revealed:false, ts:Date.now()});
            if(correct) addXP(3); else addXP(1);
            saveState();
            renderQuiz();
          });
        }
        optList.appendChild(optDiv);
      });
      card.appendChild(optList);
      if(!answered){
        var revealBtn = el('button',{class:'btn-ghost',style:'margin-top:8px;font-size:12.5px;'},['উত্তর দেখুন']);
        revealBtn.addEventListener('click', function(){
          var store = isMcq?STATE.mcqHistory:STATE.pyqHistory;
          if(!store[histKey]) store[histKey] = {attempts:[]};
          store[histKey].attempts.push({choice:null, correct:false, revealed:true, ts:Date.now()});
          saveState();
          renderQuiz();
        });
        card.appendChild(revealBtn);
      } else if(revealed){
        card.appendChild(el('div',{style:'font-size:12.5px;color:var(--ink-soft);margin-top:6px;'},['উত্তর প্রকাশ করা হয়েছে — ভুল বই-এ যোগ হয়েছে।']));
      }
      list.appendChild(card);
    });
    if(ROUTE.params.jump){
      var t = document.getElementById((isMcq?'mcq-':'pyq-')+ROUTE.params.jump);
      if(t) setTimeout(function(){t.scrollIntoView({behavior:'smooth',block:'center'});}, 50);
    }
  }
  renderQuiz();
}

/* ---------------- Flashcards (SM-2 on Practice Q&A) ---------------- */
function sm2(card, rating){
  // rating: 0 again,1 hard,2 good,3 easy
  card = card || {ease:2.5, interval:0, reps:0, due:Date.now()};
  var q = [2,3,4,5][rating];
  if(rating===0){ card.reps=0; card.interval=1; }
  else{
    card.reps = (card.reps||0)+1;
    card.ease = Math.max(1.3, (card.ease||2.5) + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
    if(card.reps===1) card.interval=1;
    else if(card.reps===2) card.interval=3;
    else card.interval = Math.round((card.interval||1) * card.ease);
  }
  card.due = Date.now() + card.interval*86400000;
  return card;
}

  var btnGood = el('button',{class:'good'},['ভালো (Good)']);
  var btnEasy = el('button',{class:'easy'},['সহজ (Easy)']);
  [btnAgain,btnHard,btnGood,btnEasy].forEach(function(b,ri){
    b.style.display='none';
    b.addEventListener('click', function(){ rate(ri); });
    rateRow.appendChild(b);
  });
  stage.appendChild(rateRow);
  var hint = el('div',{style:'text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:8px;'},['কার্ডে ক্লিক করে উত্তর দেখুন, অথবা R চাপুন']);
  stage.appendChild(hint);

    if(!queue.length){
      counter.textContent='';
      cardEl.innerHTML = '<div>🎉 এই মুহূর্তে রিভিউ করার মতো কোনো কার্ড বাকি নেই।</div>';
      rateRow.style.display='none'; hint.style.display='none';
      return;
    }
    var p = queue[idxBox.i % queue.length];
    counter.textContent = 'কার্ড '+((idxBox.i%queue.length)+1)+' / '+queue.length;
    idxBox.showAnswer = false;
    cardEl.innerHTML = '<div class="badge">প্রশ্ন '+p[0]+'</div><div>'+escapeHtml(p[1])+'</div>';
    [btnAgain,btnHard,btnGood,btnEasy].forEach(function(b){b.style.display='none';});
  }
  cardEl.addEventListener('click', function(){
    var p = queue[idxBox.i % queue.length];
    if(!p) return;
    idxBox.showAnswer = !idxBox.showAnswer;
    if(idxBox.showAnswer){
      cardEl.innerHTML = '<div class="badge">উত্তর</div><div>'+escapeHtml(p[2])+'</div>';

      [btnAgain,btnHard,btnGood,btnEasy].forEach(function(b){b.style.display='none';});

    if(k==='r'){ cardEl.click(); }
  };
};

function renderMockActive(v){
  var remainingSec = MOCK.durationSec - Math.floor((Date.now()-MOCK.startedAt)/1000);
  var timerCard = el('div',{class:'card',style:'display:flex;justify-content:space-between;align-items:center;'});

  MOCK.items.forEach(function(item, i){
    var q = item.q;
    var card = el('div',{class:'card q-card'});
    var mHead = el('div',{},[el('span',{class:'q-num'},[(i+1)+'.']), q[1], el('span',{class:'pill',style:'margin-left:8px;'},[item.lecTitle])]);
    if(item.src==='mcq') mHead.appendChild(el('span',{class:'tag-cat',style:'margin-left:8px;'},['Teacher Student\'s Work']));
    else if(item.src==='pyq' && q[4]) mHead.appendChild(el('span',{class:'tag-year',style:'margin-left:8px;'},[q[4]]));
    card.appendChild(mHead);
    if(item.src==='mcq' && q[4] && q[4].verified===false){
      card.appendChild(el('div',{style:'font-size:12px;color:#a15c00;background:#fff6e5;border:1px solid #f0d9a8;border-radius:6px;padding:4px 8px;margin:6px 0;'},
        ['⚠ উত্তর সোর্স-ভেরিফায়েড নয় — Claude কর্তৃক অনুমিত।']));
    }
    var optList = el('div',{class:'opt-list'});
    OPT_KEYS.forEach(function(k,oi){
      if(q[2][oi]===undefined) return;
      var chosen = MOCK.answers[i];
      var optDiv = el('div',{class:'opt'+(chosen?' answered':'')},[el('span',{class:'k'},[k+'.']), el('span',{},[q[2][oi]])]);
      if(chosen===k) optDiv.style.borderColor='var(--maroon)', optDiv.style.background='var(--paper-2)';
      optDiv.addEventListener('click', function(){ if(!MOCK.finished){ MOCK.answers[i]=k; navigate('mockTest'); } });
      optList.appendChild(optDiv);
    });
    card.appendChild(optList);
    v.appendChild(card);
  });
  var submit = el('button',{class:'btn'},['টেস্ট জমা দিন']);
  submit.addEventListener('click', finishMock);
  v.appendChild(submit);
  view().innerHTML=''; view().appendChild(v);
  clearInterval(RENDER._mockTimer);
  RENDER._mockTimer = setInterval(function(){
    var rem = MOCK.durationSec - Math.floor((Date.now()-MOCK.startedAt)/1000);
    if(rem<=0){ clearInterval(RENDER._mockTimer); finishMock(); return; }
    timerEl.textContent = fmtTime(rem);
  }, 1000);
}
function fmtTime(s){ var m=Math.floor(s/60), ss=s%60; return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; }
function finishMock(){
  clearInterval(RENDER._mockTimer);
  MOCK.finished = true;
  var correct=0; var byLecture={};
  MOCK.items.forEach(function(item,i){
    var ok = MOCK.answers[i]===item.q[3];
    if(ok) correct++;
    byLecture[item.lecTitle] = byLecture[item.lecTitle]||{correct:0,total:0};
    byLecture[item.lecTitle].total++;
    if(ok) byLecture[item.lecTitle].correct++;
  });
  STATE.mockResults.unshift({date:new Date().toISOString(), total:MOCK.items.length, correct:correct, byLecture:byLecture});
  STATE.mockResults = STATE.mockResults.slice(0,20);
  addXP(correct*2);
  saveState();
  navigate('mockTest');
}

        ['⚠ উত্তর সোর্স-ভেরিফায়েড নয় — Claude কর্তৃক অনুমিত।']));

    row.appendChild(el('div',{class:'progressbar'},[el('div',{style:'width:'+pct+'%'})]));
    barsCard.appendChild(row);
  });
  v.appendChild(barsCard);

  if(STATE.mockResults.length){
    var mockCard = el('div',{class:'card'});
    mockCard.appendChild(el('h3',{style:'margin-top:0'},['সাম্প্রতিক মক টেস্ট ফলাফল']));
    var table = el('table',{});
    table.appendChild(el('tr',{},[el('th',{},['তারিখ']),el('th',{},['স্কোর'])]));
    STATE.mockResults.slice(0,10).forEach(function(r){
      table.appendChild(el('tr',{},[el('td',{},[new Date(r.date).toLocaleString('bn-BD')]), el('td',{},[r.correct+'/'+r.total])]));
    });
    mockCard.appendChild(table);
    v.appendChild(mockCard);
  }
  view().innerHTML=''; view().appendChild(v);
};

  goalInput.addEventListener('change', function(){ STATE.dailyGoal=Number(goalInput.value)||20; saveState(); });

  v.appendChild(goalCard);

  var dataCard = el('div',{class:'card'});

  exportBtn.addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gs46_progress_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
  });
  var importInput = el('input',{type:'file',accept:'.json',style:'display:none;'});
  importInput.addEventListener('change', function(){
    var f = importInput.files[0]; if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var s = JSON.parse(reader.result);
        STATE = s; saveState(); applyTheme(); applyReadingPrefs();
        toast('প্রোগ্রেস ইমপোর্ট করা হয়েছে।'); navigate('dashboard');
      }catch(e){ toast('ফাইলটি সঠিক নয়।'); }

  var importBtn = el('button',{class:'btn ghost small',style:'margin-left:8px;'},['প্রোগ্রেস ইমপোর্ট']);

  var resetCard = el('div',{class:'card'});
  resetCard.appendChild(el('h3',{style:'margin-top:0;color:var(--red);'},['প্রোগ্রেস রিসেট']));

  resetBtn.addEventListener('click', function(){

        toast('প্রোগ্রেস রিসেট করা হয়েছে।'); navigate('dashboard');

  });
  resetCard.appendChild(resetBtn);
  v.appendChild(resetCard);

  view().innerHTML=''; view().appendChild(v);
};

/* ---------------- Theme / reading prefs ---------------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', STATE.theme);
}
function applyReadingPrefs(){
  document.documentElement.style.setProperty('--font-size', STATE.fontSize+'px');
  document.documentElement.style.setProperty('--line-height', STATE.lineHeight);
  document.documentElement.style.setProperty('--read-width', STATE.readWidth+'px');
}

/* ---------------- Keyboard shortcuts ---------------- */
document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea' || tag==='select') return;
  var k = e.key.toLowerCase();
  if(k==='d'){ STATE.theme = STATE.theme==='dark'?'light':'dark'; applyTheme(); saveState(); if(ROUTE.view==='settings') RENDER.settings(); }
  else if(k==='s'){ navigate('search'); }
  else if(k==='r' && RENDER._flashKeyHandler){ RENDER._flashKeyHandler('r'); }
  else if(k==='b' && ROUTE.view==='reading'){
    var lecId = ROUTE.params.lec||1;
    var key = lecId+':0';
    var i = STATE.bookmarks.indexOf(key);
    if(i===-1) STATE.bookmarks.push(key); else STATE.bookmarks.splice(i,1);
    saveState(); RENDER.reading();
  }
});

/* ---------------- Boot ---------------- */
applyTheme();
applyReadingPrefs();
renderNav();
navigate('dashboard');

})();

</script>
