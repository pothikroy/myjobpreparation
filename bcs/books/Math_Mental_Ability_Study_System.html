  {id:"l14tw16", lec:"lec14", section:"teacherWork", sourceNo:"16", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"কোনো ত্রিভুজের তিন কোণের সমদ্বিখন্ডকগুলোর ছেদবিন্দুর নাম কি?", opts:["বহিঃকেন্দ্র", "অন্তঃকেন্দ্র", "পরিকেন্দ্র", "ভরকেন্দ্র"], ans:1, sol:"ত্রিভুজের তিন কোণের সমদ্বিখণ্ডক পরস্পর যে বিন্দুতে মিলিত হয় তাকে অন্তঃকেন্দ্র (Incenter) বলে।", src:true},
  {id:"l14tw17", lec:"lec14", section:"teacherWork", sourceNo:"17", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি ত্রিভুজের দু'টি কোণের পরিমাণ ৩৫° ও ৫৫°। ত্রিভুজটি কোন ধরনের?", opts:["সমকোণী", "সমবাহু", "সমদ্বিবাহু", "স্থুলকোণী"], ans:0, sol:"তৃতীয় কোণ = ১৮০°−৩৫°−৫৫° = ৯০°। একটি কোণ ৯০° হওয়ায় ত্রিভুজটি সমকোণী।", year:"৩৩তম বিসিএস", src:true},
  {id:"l14tw18", lec:"lec14", section:"teacherWork", sourceNo:"18", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"ত্রিভুজের একটি কোণ এর অপর দুটি কোণের সমষ্টির সমান হলে ত্রিভুজটি -", opts:["সমকোণী", "স্থুলকোণী", "সমবাহু", "সূক্ষ্ণকোণী"], ans:0, sol:"ধরি একটি কোণ A = B+C। যেহেতু A+B+C=১৮০°, তাই A+A=১৮০° ⟹ A=৯০°। সুতরাং ত্রিভুজটি সমকোণী।", year:"১০ম বিসিএস", src:true},
  {id:"l14tw19", lec:"lec14", section:"teacherWork", sourceNo:"19", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"সমকোণী ত্রিভুজের অতিভুজ সংলগ্ন কোণ দুটির প্রত্যেকটি -", opts:["সরল কোণ", "সূক্ষ্ণকোণ", "পূরক কোণ", "স্থুলকোণ"], ans:1, sol:"সমকোণী ত্রিভুজে বাকি দুই কোণের সমষ্টি ৯০° (যেহেতু এক কোণ ৯০°); প্রতিটি পৃথকভাবে ৯০°-এর কম, অর্থাৎ প্রতিটি সূক্ষ্ণকোণ।", src:true},
  {id:"l14tw20", lec:"lec14", section:"teacherWork", sourceNo:"20", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"কোনো ত্রিভুজের একবাহুর উপর অঙ্কিত বর্গক্ষেত্র অপর দুই বাহুর উপর অঙ্কিত বর্গক্ষেত্রদ্বয়ের যোগফলের সমান হলে, ত্রিভুজটি হবে -", opts:["সমকোণী", "সূক্ষ্ণকোণী", "সমবাহু", "স্থুলকোণী"], ans:0, sol:"এটি পিথাগোরাসের উপপাদ্যের বিপরীত (Converse of Pythagorean theorem) — এক বাহুর বর্গ অপর দুই বাহুর বর্গের সমষ্টির সমান হলে ত্রিভুজটি সমকোণী হবে।", src:true},
  {id:"l14tw21", lec:"lec14", section:"teacherWork", sourceNo:"21", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি বাড়ি ৪০ ফুট উঁচু। একটি মইয়ের তলদেশ মাটিতে বাড়িটির দেয়াল থেকে ৯ ফুট দূরে রাখা আছে। উপরে মইটি বাড়ির ছাদ ছুঁয়ে আছে। মই কত ফুট লম্বা?", opts:["৪৮ ফুট", "৪১ ফুট", "৪৪ ফুট", "৪৩ ফুট"], ans:1, sol:"মইয়ের দৈর্ঘ্য = অতিভুজ = √(৪০²+৯²) = √(১৬০০+৮১) = √১৬৮১ = ৪১ ফুট।", year:"১৮তম বিসিএস", src:true},
  {id:"l14tw22", lec:"lec14", section:"teacherWork", sourceNo:"22", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"কোন ত্রিভুজের বাহুগুলোর অনুপাত নিচের কোনটি হলে একটি সমকোণী ত্রিভুজ সম্ভব হবে?", opts:["৬ ঃ ৫ ঃ ৪", "৩ ঃ ৪ ঃ ৫", "১২ ঃ ৮ ঃ ৪", "৬ ঃ ৪ ঃ ৩"], ans:1, sol:"পিথাগোরাসের শর্ত যাচাই করলে: ৩²+৪²=৯+১৬=২৫=৫² — এটি একটি বৈধ সমকোণী ত্রিভুজের অনুপাত (৩:৪:৫)।", year:"৩০তম বিসিএস", src:true},
  {id:"l14tw23", lec:"lec14", section:"teacherWork", sourceNo:"23", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমকোণী ত্রিভুজের লম্ব ভূমি অপেক্ষা ২ সে.মি. ছোট। কিন্তু অতিভুজ ভূমি অপেক্ষা ২ সে.মি. বড়। অতিভুজের দৈর্ঘ্য কত?", opts:["১০ সে.মি.", "৮ সে.মি.", "৪ সে.মি.", "৬ সে.মি."], ans:0, sol:"ভূমি = b ধরি। লম্ব = b−২, অতিভুজ = b+২। পিথাগোরাসের সূত্রে: (b+২)² = b² + (b−২)² ⟹ b²+4b+4 = b²+b²-4b+4 ⟹ 8b = b² ⟹ b=৮। অতিভুজ = ৮+২ = ১০ সে.মি.।", year:"৩৩তম বিসিএস", src:true},
  {id:"l14tw24", lec:"lec14", section:"teacherWork", sourceNo:"24", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি ত্রিভুজের তিনটি কোন সমান হলে, তাকে কি ত্রিভুজ বলে?", opts:["সমকোণী ত্রিভুজ", "সমদ্বিবাহু ত্রিভুজ", "সমবাহু ত্রিভুজ", "বিষমবাহু ত্রিভুজ"], ans:2, sol:"তিনটি কোণ সমান হলে তিনটি বাহুও সমান হয় — এটি সমবাহু ত্রিভুজের সংজ্ঞা।", src:true},
  {id:"l14tw25", lec:"lec14", section:"teacherWork", sourceNo:"25", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমবাহু ত্রিভুজের একটি বাহু ১৬ মিটার। ত্রিভুজটির ক্ষেত্রফল কত?", opts:["৬৪√৩ বর্গমিটার", "১৯২ বর্গমিটার", "৬৪ বর্গমিটার", "৩২√৩ বর্গমিটার"], ans:0, sol:"ক্ষেত্রফল = (√৩/৪) × ১৬² = (√৩/৪) × ২৫৬ = ৬৪√৩ বর্গমিটার।", year:"১২তম বিসিএস", src:true},
  {id:"l14tw26", lec:"lec14", section:"teacherWork", sourceNo:"26", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"ΔABC এ ∠A = ৪০°, ∠B = ৭০° হলে ΔACB কি ধরনের ত্রিভুজ?", opts:["সমকোণী", "স্থুলকোণী", "সমদ্বিবাহু", "সমবাহু"], ans:2, sol:"∠C = ১৮০°−৪০°−৭০° = ৭০°। যেহেতু ∠B = ∠C = ৭০° (দুটি কোণ সমান), ত্রিভুজটি সমদ্বিবাহু।", year:"৩৬তম বিসিএস", src:true},
  {id:"l14tw27", lec:"lec14", section:"teacherWork", sourceNo:"27", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"কোনো ত্রিভুজের একটি বাহু উভয় দিকে বর্ধিত করায় উৎপন্ন বহিঃস্থ কোণগুলো পরস্পর মান হয়, ত্রিভুজটি-", opts:["সমদ্বিবাহু", "সমবাহু", "বিষমবাহু", "সূক্ষ্ণকোণী"], ans:0, sol:"বহিঃস্থ কোণ = ১৮০° − সংশ্লিষ্ট অন্তঃস্থ কোণ। দুই বহিঃস্থ কোণ সমান হলে সংশ্লিষ্ট দুই অন্তঃস্থ (ভূমি) কোণও সমান হবে, যা সমদ্বিবাহু ত্রিভুজের বৈশিষ্ট্য।", src:true},
  {id:"l14tw28", lec:"lec14", section:"teacherWork", sourceNo:"28", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমদ্বিবাহু ত্রিভুজের ভূমি ১৬ মি. এবং অপর দুটি বাহুর প্রতিটি ১০ মি. হলে ত্রিভুজটির ক্ষেত্রফল কত?", opts:["৩৬ ব.মি.", "৪২ ব.মি.", "৪৮ ব.মি.", "৫০ ব.মি."], ans:2, sol:"উচ্চতা = √(১০²−৮²) = √(১০০−৬৪) = √৩৬ = ৬ মি.। ক্ষেত্রফল = ½ × ১৬ × ৬ = ৪৮ বর্গমিটার।", year:"২৩তম ও ২০তম বিসিএস", src:true},
  {id:"l14tw29", lec:"lec14", section:"teacherWork", sourceNo:"29", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"১৭ সে.মি., ১৫ সে.মি., ৮ সে.মি. বাহু বিশিষ্ট ত্রিভুজটি হবে -", opts:["সমবাহু", "সমদ্বিবাহু", "সমকোণী", "স্থুলকোণী"], ans:2, sol:"যাচাই: ৮²+১৫² = ৬৪+২২৫ = ২৮৯ = ১৭²। পিথাগোরাসের শর্ত পূরণ হওয়ায় ত্রিভুজটি সমকোণী।", year:"৩৭তম বিসিএস", src:true},
  {id:"l14tw30", lec:"lec14", section:"teacherWork", sourceNo:"30", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি ত্রিভুজাকৃতি মাঠের বাহুগুলোর দৈর্ঘ্য যথাক্রমে 20m, 21m এবং 29m হলে এর ক্ষেত্রফল কত?", opts:["২০০m²", "২১০m²", "২৯০m²", "৩০০m²"], ans:1, sol:"যাচাই: ২০²+২১² = ৪০০+৪৪১ = ৮৪১ = ২৯²। ত্রিভুজটি সমকোণী, লম্ব বাহুদ্বয় ২০ ও ২১। ক্ষেত্রফল = ½ × ২০ × ২১ = ২১০ বর্গমিটার।", year:"৩১তম বিসিএস", src:true},
  {id:"l14sw01", lec:"lec14", section:"studentWork", sourceNo:"1", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"অতিভুজের বিপরীতে থাকে-", opts:["সমকোণ", "সরলকোণ", "স্থুলকোণ", "সূক্ষ্ণকোণ"], ans:0, sol:"সমকোণী ত্রিভুজে অতিভুজ সর্বদা সমকোণের বিপরীত বাহু। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw02", lec:"lec14", section:"studentWork", sourceNo:"2", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমকোণী ত্রিভুজের অতিভুজ ছাড়া অন্য দুটি বাহুর দৈর্ঘ্য যথাক্রমে ০.১ এবং ০.২ মিটার। ত্রিভুজটির ক্ষেত্রফল কত?", opts:["১০০ বর্গ সে.মি.", "০.০১ বর্গ মিটার", "২০০ বর্গ সে.মি.", "০.০২ বর্গ মিটার"], ans:1, sol:"ক্ষেত্রফল = ½ × ০.১ × ০.২ = ০.০১ বর্গ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw03", lec:"lec14", section:"studentWork", sourceNo:"3", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"ত্রিভুজের ক্ষেত্রফল নির্ণয়ের সূত্র কোনটি?", opts:["½ (ভূমি × উচ্চতা)", "½ (ভূমি + উচ্চতা)", "½ (ভূমি − উচ্চতা)", "½ (ভূমি / উচ্চতা)"], ans:0, sol:"ত্রিভুজের ক্ষেত্রফল = ½ × ভূমি × উচ্চতা। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw04", lec:"lec14", section:"studentWork", sourceNo:"4", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি ত্রিভুজের একটি কোণের মাপ ৮২°। বাকি দুটি কোণের মাপের অনুপাত হচ্ছে ২ : ৫। সব থেকে ছোট কোণের মাপ কত?", opts:["১৪°", "২৫°", "২৮°", "৭০°"], ans:2, sol:"বাকি দুই কোণ 2x ও 5x ধরি: 2x+5x = ১৮০°−৮২° = ৯৮° ⟹ 7x=৯৮° ⟹ x=১৪°। ছোট কোণ = 2×১৪° = ২৮°। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw05", lec:"lec14", section:"studentWork", sourceNo:"5", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি ত্রিভুজের ভূমির পরিমাণ ৪ মিটার ও উচ্চতা ৩ মিটার। ত্রিভুজের ক্ষেত্রফল কত?", opts:["৯ বর্গমিটার", "১৮ বর্গমিটার", "১২ বর্গমিটার", "৬ বর্গমিটার"], ans:3, sol:"ক্ষেত্রফল = ½ × ৪ × ৩ = ৬ বর্গমিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw06", lec:"lec14", section:"studentWork", sourceNo:"6", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমকোণী ত্রিভুজাকৃতি জমির অতিভুজ ১০ মি. এবং এক বাহু ৮ মি.। ঐ জমির ক্ষেত্রফল কত?", opts:["২৪ বর্গ মিটার", "২৮ বর্গ মিটার", "৩৬ বর্গ মিটার", "২৮ বর্গ মিটার"], ans:0, sol:"অপর বাহু = √(১০²−৮²) = √(১০০−৬৪) = √৩৬ = ৬ মি.। ক্ষেত্রফল = ½ × ৬ × ৮ = ২৪ বর্গ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true, needsVerification:true, verifyNote:"উৎসে বিকল্প 'খ' ও 'ঘ' উভয়ই '২৮ বর্গ মিটার' মুদ্রিত (একটি ছাপা-ত্রুটি/পুনরাবৃত্তি) — তবে সঠিক উত্তর (ক = ২৪) সুস্পষ্ট ও উৎসের নিজস্ব কী দ্বারা নিশ্চিত, তাই এই ডুপ্লিকেটে কোনো প্রভাব নেই।"},
  {id:"l14sw07", lec:"lec14", section:"studentWork", sourceNo:"7", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমকোণী ত্রিভুজের অতিভুজ ব্যতীত অন্য দুই বাহুর দৈর্ঘ্য যথাক্রমে ১০ ফুট ও ৬ ফুট। উহার ক্ষেত্রফল কত?", opts:["১৫ বর্গফুট", "৩০ বর্গফুট", "৬০ বর্গফুট", "১২০ বর্গফুট"], ans:1, sol:"ক্ষেত্রফল = ½ × ১০ × ৬ = ৩০ বর্গফুট। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw08", lec:"lec14", section:"studentWork", sourceNo:"8", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমদ্বিবাহু সমকোণী ত্রিভুজের অতিভুজের দৈর্ঘ্য ১৬ সেমি হলে ত্রিভুজটির ক্ষেত্রফল কত বর্গ সেমি?", opts:["৪৮", "৫৬", "৬৪", "৭২"], ans:2, sol:"সমান বাহু x ধরি: x²+x²=১৬² ⟹ 2x²=২৫৬ ⟹ x²=১২৮। ক্ষেত্রফল = ½×x×x = ½×১২৮ = ৬৪ বর্গ সেমি। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw09", lec:"lec14", section:"studentWork", sourceNo:"9", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"কোন ত্রিভুজের বাহু গুলোর দৈর্ঘ্য যথাক্রমে a, b, c হলে এবং 2s = a+b+c হলে, ঐ ত্রিভুজের ক্ষেত্রফল কত?", opts:["√(s(+a)(s+b)(s+c))", "√(s(s−a)(s+b)(s−c))", "√(s(s−a)(s−b)(s−c))", "√(s(s−a)(s−b)(s+c))"], ans:2, sol:"হেরনের সূত্র (Heron's formula): ক্ষেত্রফল = √(s(s−a)(s−b)(s−c))। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw10", lec:"lec14", section:"studentWork", sourceNo:"10", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমদ্বিবাহু ত্রিভুজের ভূমি ২ সেমি এবং এক বাহুর দৈর্ঘ্য ৩ সেমি হলে, উহার ক্ষেত্রফল কত?", opts:["৯ বর্গ সে.মি.", "৬ বর্গ সে.মি.", "১২ বর্গ সে.মি.", "√৮ বর্গ সে.মি."], ans:3, sol:"উচ্চতা = √(৩²−১²) = √৮। ক্ষেত্রফল = ½ × ২ × √৮ = √৮ বর্গ সে.মি.। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw11", lec:"lec14", section:"studentWork", sourceNo:"11", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমদ্বিবাহু ত্রিভুজের সমান বাহুদ্বয়ের প্রত্যেকটির দৈর্ঘ্য ১০ সেমি এবং বাহুদ্বয়ের অন্তর্ভুক্ত কোণ ৪৫° হলে, ত্রিভুজটির ক্ষেত্রফল কত বর্গ সেমি?", opts:["২৫", "২৫√২", "৩০", "২৫√৫"], ans:1, sol:"ক্ষেত্রফল = ½ × a² × sinθ = ½ × ১০০ × sin৪৫° = ½ × ১০০ × (√২/২) = ২৫√২ বর্গ সেমি। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw12", lec:"lec14", section:"studentWork", sourceNo:"12", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমকোণী ত্রিভুজের অতিভুজ ছাড়া অন্য দুই বাহুর দৈর্ঘ্য ০.২ মিটার এবং ০.৩ মিটার হলে, ত্রিভুজটির ক্ষেত্রফল কত?", opts:["০.০৬ বর্গমিটার", "০.০৩ বর্গমিটার", "০.০৫ বর্গমিটার", "০.০১ বর্গমিটার"], ans:1, sol:"ক্ষেত্রফল = ½ × ০.২ × ০.৩ = ০.০৩ বর্গমিটার।", src:true},
  {id:"l14sw13", lec:"lec14", section:"studentWork", sourceNo:"13", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"কোনো সমকোণী ত্রিভুজের অতিভুজ ১৩ সেমি এবং পরিসীমা ৩০ সেমি। ত্রিভুজটির ক্ষেত্রফল নির্ণয় করুন।", opts:["২৪ বর্গ সেমি", "২৭ বর্গ সেমি", "২৮ বর্গ সেমি", "৩০ বর্গ সেমি"], ans:3, sol:"অপর দুই বাহুর সমষ্টি x+y = ৩০−১৩ = ১৭। x²+y²=১৩²=১৬৯। (x+y)²=x²+y²+2xy ⟹ ১৭²=১৬৯+2xy ⟹ xy=৬০। সমাধান করলে বাহুদ্বয় ১২ ও ৫। ক্ষেত্রফল = ½×১২×৫ = ৩০ বর্গ সেমি। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw14", lec:"lec14", section:"studentWork", sourceNo:"14", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি ত্রিভুজাকৃতি জমির ভূমি ৫০ মিটার এবং উচ্চতা ২০ মিটার। প্রতি বর্গমিটার ১.৫ টাকা হিসেবে ঘাস লাগাতে কত খরচ হবে?", opts:["৬০০ টাকা", "৬৫০ টাকা", "৭০০ টাকা", "৭৫০ টাকা"], ans:3, sol:"জমির ক্ষেত্রফল = ½×৫০×২০ = ৫০০ বর্গ মি.। মোট খরচ = ৫০০×১.৫ = ৭৫০ টাকা। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw15", lec:"lec14", section:"studentWork", sourceNo:"15", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"ত্রিভুজ ABC এর ক্ষেত্রফল ২০ বর্গ একক। D, AB এর এবং E, AC এর মধ্যবিন্দু। ত্রিভুজ ADE এর ক্ষেত্রফল কত বর্গ একক?", opts:["২", "৪", "৫", "১০"], ans:2, sol:"D ও E যথাক্রমে AB ও AC এর মধ্যবিন্দু হওয়ায় ΔADE, ΔABC এর সদৃশ এবং ক্ষেত্রফলের অনুপাত (১/২)²=১/৪। ΔADE এর ক্ষেত্রফল = ২০/৪ = ৫ বর্গ একক। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw16", lec:"lec14", section:"studentWork", sourceNo:"16", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমকোণী ত্রিভুজের ভূমি ৮ ফুট এবং লম্ব ৬ ফুট হলে অতিভুজের দৈর্ঘ্য কত?", opts:["৯ ফুট", "১০ ফুট", "১১ ফুট", "১২ ফুট"], ans:1, sol:"অতিভুজ = √(৮²+৬²) = √(৬৪+৩৬) = √১০০ = ১০ ফুট। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw17", lec:"lec14", section:"studentWork", sourceNo:"17", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমকোণী ত্রিভুজের দুইটি বাহু যথাক্রমে ৫ মিটার ও ১২ মিটার। অতিভুজের দৈর্ঘ্য হচ্ছে-", opts:["১০ মিটার", "১১ মিটার", "১২ মিটার", "১৩ মিটার"], ans:3, sol:"অতিভুজ = √(৫²+১২²) = √(২৫+১৪৪) = √১৬৯ = ১৩ মিটার (আগের প্রশ্নের অনুরূপ পদ্ধতি)। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw18", lec:"lec14", section:"studentWork", sourceNo:"18", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমকোণী ত্রিভুজের ভূমির দৈর্ঘ্য লম্ব অপেক্ষা ১ মিটার কম এবং লম্ব অপেক্ষা অতিভুজের দৈর্ঘ্য ১ মিটার বেশি হলে, এর অতিভুজের দৈর্ঘ্য কত?", opts:["৪ মি.", "৩ মি.", "৬ মি.", "৫ মি."], ans:3, sol:"লম্ব = x+১, ভূমি = x, অতিভুজ = x+২ ধরি। (x+২)² = (x+১)²+x² ⟹ x²+4x+4 = x²+2x+1+x² ⟹ x²−2x−3=0 ⟹ (x−3)(x+1)=0 ⟹ x=৩ (গ্রহণযোগ্য)। অতিভুজ = x+২ = ৫ মি.। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw19", lec:"lec14", section:"studentWork", sourceNo:"19", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি ত্রিভুজের দুই বাহুর দৈর্ঘ্য ৬ সেন্টিমিটার এবং ৭ সেন্টিমিটার হলে তৃতীয় বাহু ______ হতে পারে না।", opts:["৫ সেমি দৈর্ঘ্য বিশিষ্ট", "৮ সেমি দৈর্ঘ্য বিশিষ্ট", "৯ সেমি দৈর্ঘ্য বিশিষ্ট", "১৩ সেমি দৈর্ঘ্য বিশিষ্ট"], ans:3, sol:"ত্রিভুজ অসমতা অনুযায়ী তৃতীয় বাহু |৭−৬|=১ থেকে ৭+৬=১৩ এর মধ্যে (উভয় প্রান্ত বাদে) হতে হবে। যেহেতু দুই বাহুর সমষ্টি তৃতীয় বাহু অপেক্ষা বৃহত্তর হতেই হবে, ১৩ (=৬+৭) নিজেই বৈধ নয়। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw20", lec:"lec14", section:"studentWork", sourceNo:"20", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমকোণী ত্রিভুজের অতিভুজ ১৫ সে.মি. এবং অপর দুই বাহুর অন্তর ৩ সে.মি. হলে অপর বাহু দুটির দৈর্ঘ্য নির্ণয় করুন।", opts:["১৩ সেমি., ১৬ সেমি.", "১১ সেমি., ১৪ সেমি.", "১০ সেমি., ১৩ সেমি.", "৯ সেমি., ১২ সেমি."], ans:3, sol:"বাহুদ্বয় x, x+৩ ধরি: x²+(x+৩)²=১৫² ⟹ 2x²+6x−216=0 ⟹ x²+3x−108=0 ⟹ (x+12)(x−9)=0 ⟹ x=৯ (গ্রহণযোগ্য)। বাহুদ্বয় = ৯ ও ১২ সেমি.। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw21", lec:"lec14", section:"studentWork", sourceNo:"21", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি ত্রিভুজাকৃতি ক্ষেত্রের ক্ষেত্রফল ৮৪ বর্গগজ। ত্রিভুজটির ভূমির দৈর্ঘ্য ১৪ গজ হলে শীর্ষ বিন্দু হতে ভূমির উপর অংকিত লম্বের দৈর্ঘ্য কত?", opts:["১০ গজ", "১২ গজ", "১৪ গজ", "১৬ গজ"], ans:1, sol:"উচ্চতা = (২×৮৪)/১৪ = ১২ গজ। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw23", lec:"lec14", section:"studentWork", sourceNo:"23", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"ত্রিভুজের তিন বাহুর দৈর্ঘ্য সেন্টিমিটার এককে দেয়া হলো। কোন ক্ষেত্রে ত্রিভুজ অংকন সম্ভব?", opts:["2, 3, 4", "3, 4, 5", "3, 4, 8", "1, 2, 3"], ans:1, sol:"এক্ষেত্রে ত্রিভুজের যেকোনো দুই বাহুর সমষ্টি তৃতীয় বাহু অপেক্ষা বৃহত্তর হতে হবে। (গ)-এর জন্য 3+4=7<8 (অসম্ভব)। (ঘ)-এর জন্য 1+2=3 (সমান, ফলে বিলীন ত্রিভুজ — অসম্ভব)। উৎসের নিজস্ব সমাধান অনুযায়ী উত্তর 'খ' (3,4,5), একটি সুপরিচিত সমকোণী ত্রিভুজের অনুপাত।", src:true, needsVerification:true, verifyNote:"উৎসের সমাধানে (ক) 2,3,4-এর জন্য শুধু '2+3=5cm' গণনাটি দেখানো হয়েছে কিন্তু এটি কেন অবৈধ তা স্পষ্ট করা হয়নি — গাণিতিকভাবে 2+3=5>4 শর্ত পূরণ করে বলে (ক)-ও প্রকৃতপক্ষে একটি বৈধ ত্রিভুজ গঠন করতে পারে বলে মনে হয়। উৎসের কাঠামো ও জোর অনুযায়ী উদ্দিষ্ট একক উত্তর 'খ' (3,4,5) বলে ধরে নেওয়া হয়েছে, তবে (ক)-ও প্রযুক্তিগতভাবে বৈধ কিনা তা সম্পূর্ণ নিশ্চিত করা যায়নি।"},
  {id:"l14sw24", lec:"lec14", section:"studentWork", sourceNo:"24", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমকোণী ত্রিভুজের ক্ষেত্রফল ১৪৪ বর্গ একক। সমকোণ সন্নিহিত বাহুদ্বয়ের একটির দৈর্ঘ্য ১২ একক হলে, অপরটি কত?", opts:["১৫ একক", "৩০ একক", "২০ একক", "২৪ একক"], ans:3, sol:"½ × ১২ × x = ১৪৪ ⟹ x = (১৪৪×২)/১২ = ২৪ একক। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw25", lec:"lec14", section:"studentWork", sourceNo:"25", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"ΔABC এর ∠B এবং ∠C এর অন্তর্দ্বিখন্ডকদ্বয় O বিন্দুতে মিলিত হলে, ∠BOC = কত?", opts:["৯০°−½∠A", "৯০°−½∠B", "৯০°+½∠C", "৯০°+½∠A"], ans:3, sol:"প্রমাণসিদ্ধ সূত্র: ∠BOC = ৯০°+½∠A। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw26", lec:"lec14", section:"studentWork", sourceNo:"26", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"ΔABC-এ AD, ∠A এর সমদ্বিখণ্ডক এবং ∠ADB সূক্ষ্মকোণ হলে-", opts:["AD > AC", "AB > AC", "AB < AC", "BD < CD"], ans:2, sol:"চিত্রানুযায়ী ∠ADB সূক্ষ্মকোণ হলে ∠ADC স্থূলকোণ হবে (যেহেতু ∠ADB+∠ADC=১৮০°)। স্থূলকোণের বিপরীত বাহু (AC) সবচেয়ে বড় বাহু হবে। উৎসের উত্তর-কী অনুযায়ী উত্তর 'গ' নির্দেশিত।", src:true, needsVerification:true, verifyNote:"উৎসের সমাধানে দেখানো চূড়ান্ত সিদ্ধান্ত আক্ষরিকভাবে 'AD < AC' (যা তালিকাভুক্ত কোনো বিকল্পের সাথে হুবহু মেলে না — নিকটতম সম্পর্কিত বিকল্প 'গ' হলো 'AB < AC')। এটি সম্ভবত উৎসের একটি ছোট লেবেলিং-ত্রুটি (AD-কে ভুলবশত AB লেখা)। উৎসের নিজস্ব ছাপা 'উত্তর: গ' সরাসরি ব্যবহার করা হয়েছে।"},
  {id:"l14sw27", lec:"lec14", section:"studentWork", sourceNo:"27", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"সমকোণী ত্রিভুজের সমকোণ সংলগ্ন বাহুদ্বয় যথাক্রমে ৩ ও ৪ সেন্টিমিটার হলে, এর অতিভুজের মান কত?", opts:["৬", "৫", "৮", "৭"], ans:1, sol:"অতিভুজ = √(৩²+৪²) = √(৯+১৬) = √২৫ = ৫ সেমি। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw28", lec:"lec14", section:"studentWork", sourceNo:"28", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি ঘুড়ি ভূমি থেকে ৫৫ মিটার উপরে উড়ছে, যার সুতা ভূমির সঙ্গে ৬০° কোণ উৎপন্ন করে। সুতার দৈর্ঘ্য কত?", opts:["৬৫ মিটার", "১১০ মিটার", "৬৩.৫ মিটার", "৬৫.৫ মিটার"], ans:2, sol:"sin৬০° = উচ্চতা/সুতার দৈর্ঘ্য ⟹ সুতার দৈর্ঘ্য = ৫৫/sin৬০° = ৫৫/(√৩/২) = ১১০/√৩ ≈ ৬৩.৫ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw29", lec:"lec14", section:"studentWork", sourceNo:"29", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"সূর্যের উন্নতি কোণ ৬০° হলে একটি মিনারের ছায়ার দৈর্ঘ্য ২৪০ মিটার। মিনারটির উচ্চতা কত?", opts:["৪১৫.৬৯২ মিটার", "১১০ মিটার", "২৪০ মিটার", "৬৫.৫ মিটার"], ans:0, sol:"tan৬০° = উচ্চতা/ছায়া ⟹ উচ্চতা = ২৪০×tan৬০° = ২৪০×√৩ ≈ ২৪০×১.৭৩২০৫৮ ≈ ৪১৫.৬৯২ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw30", lec:"lec14", section:"studentWork", sourceNo:"30", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি মিনারের শীর্ষবিন্দুতে ঐ বিন্দু থেকে ১৫ মিটার দূরের ভূতলস্থ একটি বিন্দুর অবনতি কোণ ৪৫° হলে, মিনারটির উচ্চতা কত?", opts:["৩৭.৫ মিটার", "১০ মিটার", "১০.৬০৭ মিটার", "১৫ মিটার"], ans:2, sol:"sin৪৫° = উচ্চতা/১৫ ⟹ উচ্চতা = ১৫×sin৪৫° = ১৫/√২ ≈ ১০.৬০৭ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw31", lec:"lec14", section:"studentWork", sourceNo:"31", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সরল রেখার উপর অংকিত বর্গ ঐ সরল রেখার অর্ধেকের উপর অংকিত বর্গের কত গুণ?", opts:["দ্বিগুণ", "তিন গুণ", "চারগুণ", "পাঁচগুণ"], ans:2, sol:"রেখা x হলে বর্গ x²। অর্ধেক রেখা x/২, তার বর্গ (x/২)²=x²/৪। অনুপাত = x²/(x²/৪) = ৪ গুণ। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw32", lec:"lec14", section:"studentWork", sourceNo:"32", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি গাছের পাদবিন্দু থেকে ১৯ মিটার দূরবর্তী স্থান থেকে গাছের শীর্ষবিন্দুর উন্নতি কোণ ৪৫° হলে গাছটির উচ্চতা কত?", opts:["২১ মি.", "২০ মি.", "১৯ মি.", "১৭ মি."], ans:2, sol:"tan৪৫° = উচ্চতা/১৯ = ১ ⟹ উচ্চতা = ১৯ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw33", lec:"lec14", section:"studentWork", sourceNo:"33", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"City B is 5 miles east of city A. City C is 10 miles southeast of city B. Which of the following is the closest to the distance from city A to City C?", opts:["11 miles", "12 miles", "13 miles", "14 miles"], ans:3, sol:"AB=৫ মাইল, BC=১০ মাইল দক্ষিণ-পূর্ব দিকে (৪৫° কোণে)। লম্ব টেনে BD=DC=x ধরলে x²+x²=১০² ⟹ x=√৫০≈৭। AD=AB+BD=৫+৭=১২, CD=৭। AC=√(১২²+৭²)=√(১৪৪+৪৯)=√১৯৩≈১৪ মাইল। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", year:"২৯তম বিসিএস", src:true},
  {id:"l14sw34", lec:"lec14", section:"studentWork", sourceNo:"34", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"৬ ফুট দীর্ঘ একটি বাঁশের ৪ ফুট দীর্ঘ ছায়া হয়। একই সময়ে গাছের ছায়া ৬৪ ফুট লম্বা। গাছটির উচ্চতা কত ফুট?", opts:["৭২ ফুট", "৮০ ফুট", "৮৪ ফুট", "৯৬ ফুট"], ans:3, sol:"সদৃশ ত্রিভুজ থেকে: বাঁশের উচ্চতা/বাঁশের ছায়া = গাছের উচ্চতা/গাছের ছায়া ⟹ ৬/৪ = গাছের উচ্চতা/৬৪ ⟹ গাছের উচ্চতা = (৬×৬৪)/৪ = ৯৬ ফুট। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw35", lec:"lec14", section:"studentWork", sourceNo:"35", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সরলরেখার উপর অংকিত বর্গের ক্ষেত্রফল ঐ সরল রেখার এক চতুর্থাংশের উপর অংকিত বর্গের ক্ষেত্রফলের কত গুণ?", opts:["১৬", "৮", "৮", "২"], ans:0, sol:"রেখা x হলে বর্গ x²। এক-চতুর্থাংশ x/৪, তার বর্গ x²/১৬। অনুপাত = x²/(x²/১৬) = ১৬ গুণ। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", year:"২১তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎসে বিকল্প 'খ' ও 'গ' উভয়ই '৮' মুদ্রিত (একটি ছাপা-ত্রুটি/পুনরাবৃত্তি) — তবে সঠিক উত্তর (ক = ১৬) সুস্পষ্ট ও উৎসের নিজস্ব কী দ্বারা নিশ্চিত, তাই এই ডুপ্লিকেটে কোনো প্রভাব নেই।"},
  {id:"l14sw36", lec:"lec14", section:"studentWork", sourceNo:"36", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"AB ও CD সরলরেখাদ্বয় 'O' বিন্দুতে ছেদ করলে নিচের কোন গাণিতিক বাক্যটি সঠিক হবে?", opts:["∠AOD = ∠BOC", "∠AOD = ∠BOD", "∠BOC = ∠AOC", "কোনোটিই নয়"], ans:0, sol:"দুটি সরলরেখা পরস্পরকে ছেদ করলে উৎপন্ন বিপ্রতীপ কোণগুলো (vertically opposite angles) পরস্পর সমান হয়: ∠AOC=∠BOD এবং ∠AOD=∠BOC। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", year:"১৭তম বিসিএস", src:true},
  {id:"l14sw37", lec:"lec14", section:"studentWork", sourceNo:"37", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"3x − y = 2 এবং 2x + 3y = 5 সরলরেখা দুইটি যে বিন্দু দিয়ে অতিক্রম করবে-", opts:["(2, 4)", "(4, −1)", "(1, 1)", "(0, 2)"], ans:2, sol:"প্রথম সমীকরণ থেকে y=3x−2। দ্বিতীয় সমীকরণে বসিয়ে: 2x+3(3x−2)=5 ⟹ 11x=11 ⟹ x=1, y=1। বিন্দু (1,1)। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw38", lec:"lec14", section:"studentWork", sourceNo:"38", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"দুটি কোণ পরস্পর সমান এবং এদের বাহু অপরটির এক বাহুর সমান্তরাল। কোণ দুটির অপর বাহুদ্বয়ের মধ্যে সম্পর্ক কিরূপ?", opts:["এরা পরস্পর সমান", "এরা পরস্পর সমান্তরাল", "এরা পরস্পর উপর লম্ব", "এরা পরস্পর ছেদক"], ans:1, sol:"উৎসের উত্তর-কী অনুযায়ী অপর বাহুদ্বয়ও পরস্পর সমান্তরাল হবে।", src:true},
  {id:"l14sw39", lec:"lec14", section:"studentWork", sourceNo:"39", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সরল রেখার উপর অংকিত বর্গ ঐ সরল রেখার এক-তৃতীয়াংশের উপর অংকিত বর্গের কত গুণ?", opts:["১২ গুণ", "৩ গুণ", "৯ গুণ", "১৭ গুণ"], ans:2, sol:"রেখা x হলে বর্গ x²। এক-তৃতীয়াংশ x/৩, তার বর্গ x²/৯। অনুপাত = x²/(x²/৯) = ৯ গুণ। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw40", lec:"lec14", section:"studentWork", sourceNo:"40", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"বিষুবরেখার দৈর্ঘ্য যদি ৪০ মিলিয়ন মিটার হয়, তবে পৃথিবীর ব্যাসার্ধ কত কিলোমিটার?", opts:["৬৩৬", "৬৩৬০", "৬৩৬০০", "৬৩.৬"], ans:1, sol:"পরিধি = 2πR = ৪০,০০০,০০০ মি. ⟹ R = ৪০,০০০,০০০/(২×৩.১৪১৬) মিটার ≈ ৬৩৬০ কিলোমিটার (একক রূপান্তরসহ)। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw41", lec:"lec14", section:"studentWork", sourceNo:"41", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একজন লোক একটি নির্দিষ্ট স্থান A থেকে যাত্রা শুরু করে ১২ কিলোমিটার ঠিক উত্তর দিকে গেল এবং সেখান থেকে ৫ কিলোমিটার ঠিক পূর্ব দিকে গেল। যাত্রা শেষে সে A থেকে কত দূরে থাকবে?", opts:["১৭ কিলোমিটার", "১৫ কিলোমিটার", "১৪ কিলোমিটার", "১৩ কিলোমিটার"], ans:3, sol:"দূরত্ব = √(১২²+৫²) = √(১৪৪+২৫) = √১৬৯ = ১৩ কিলোমিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw42", lec:"lec14", section:"studentWork", sourceNo:"42", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমবাহু ত্রিভুজের বাহুর প্রত্যেকটির দৈর্ঘ্য ২ মিটার বাড়ালে এর ক্ষেত্রফল ৩√৩ বর্গ মিটার বেড়ে যায়। সমবাহু ত্রিভুজের বাহুর দৈর্ঘ্য কত?", opts:["১ মিটার", "২ মিটার", "৩ মিটার", "৪ মিটার"], ans:1, sol:"মূল বাহু x ধরি। (√৩/৪)(x+২)² − (√৩/৪)x² = ৩√৩ ⟹ সমাধান করলে x=২ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", year:"৩২তম বিসিএস", src:true},
  {id:"l14sw43", lec:"lec14", section:"studentWork", sourceNo:"43", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"ত্রিভুজের যে কোনো দুই বাহুর মধ্য বিন্দুর সংযোজক সরলরেখা তৃতীয় বাহুর-", opts:["সমান", "এক-তৃতীয়াংশ", "দ্বিগুণ", "অর্ধেক"], ans:3, sol:"মধ্যবিন্দু উপপাদ্য (Midsegment theorem): ত্রিভুজের যেকোনো দুই বাহুর মধ্যবিন্দুদ্বয়ের সংযোজক রেখাংশ তৃতীয় বাহুর সমান্তরাল এবং তার অর্ধেক দৈর্ঘ্যের হয়। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw44", lec:"lec14", section:"studentWork", sourceNo:"44", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"x + y − 1 = 0, x − y + 1 = 0 এবং y + 3 = 0 সরল রেখা তিনটি দ্বারা গঠিত ত্রিভুজটি-", opts:["সমবাহু", "বিষমবাহু", "সমকোণী", "সমদ্বিবাহু"], ans:3, sol:"সমীকরণগুলো সমাধান করে শীর্ষবিন্দুত্রয় পাওয়া যায় (০,১), (৪,−৩), (−৪,−৩)। দূরত্ব নির্ণয় করলে AB=AC=৪√২ এবং BC=৮ — অর্থাৎ দুইটি বাহু সমান, তাই ত্রিভুজটি সমদ্বিবাহু। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true, needsVerification:true, verifyNote:"উৎসে এই প্রশ্নটির নম্বর ভুলবশত '৮৮' ছাপা হয়েছে (একটি স্পষ্ট মুদ্রণ-ত্রুটি) — প্রশ্নের ধারাবাহিক অবস্থান (৪৩ ও ৪৫-এর মাঝে) অনুযায়ী এটি প্রকৃতপক্ষে প্রশ্ন ৪৪।"},
  {id:"l14sw45", lec:"lec14", section:"studentWork", sourceNo:"45", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"২৫৩০° কোণকে কি কোণ বলে?", opts:["সূক্ষ্মকোণ", "স্থুলকোণ", "পূরককোণ", "প্রবৃদ্ধ কোণ"], ans:3, sol:"উৎসের নিজস্ব উত্তর-কী অনুযায়ী উত্তর 'ঘ' (প্রবৃদ্ধ কোণ) নির্দেশিত।", src:true, needsVerification:true, verifyNote:"উৎসে কোণের মান '২৫৩০' হিসেবে ছাপা হয়েছে, কোনো ডিগ্রি/মিনিট চিহ্নবিহীন অস্পষ্ট আকারে। আক্ষরিক অর্থে ২৫৩০° কে ৩৬০° দিয়ে ভাগশেষ নিলে (২৫৩০ mod ৩৬০ = ১০°) একটি সূক্ষ্মকোণ পাওয়া যায়, যা উৎসের 'প্রবৃদ্ধ কোণ' উত্তরের সাথে সাংঘর্ষিক। সম্ভবত মূল কোণের মান (যেমন ২৫°৩০' বা অন্য কোনো >১৮০° মান) ভিন্নভাবে ছাপা হওয়ার কথা ছিল। উৎসের নিজস্ব ছাপা উত্তরই সরাসরি ব্যবহার করা হয়েছে।"},
  {id:"l14sw46", lec:"lec14", section:"studentWork", sourceNo:"46", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"ইউক্লিডের মহাগ্রন্থ কয়টি খণ্ডে বিন্যস্ত?", opts:["৭টি", "৯টি", "১১টি", "১৩টি"], ans:3, sol:"ইউক্লিডের বিখ্যাত গ্রন্থ 'দি এলিমেন্টস' (The Elements) ১৩টি খণ্ড/বইয়ে বিন্যস্ত। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l14sw47", lec:"lec14", section:"studentWork", sourceNo:"47", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"রেখার প্রান্ত বিন্দুর সংখ্যা হল-", opts:["একটি", "দুটি", "তিনটি", "কোন প্রান্তবিন্দু নেই"], ans:3, sol:"রেখা (line) উভয় দিকে অসীম পর্যন্ত বিস্তৃত থাকে বলে এর কোনো প্রান্তবিন্দু নেই (রেখাংশ/line segment থেকে ভিন্ন, যার ২টি প্রান্তবিন্দু থাকে)। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15tw1", lec:"lec15", section:"teacherWork", sourceNo:"1", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের কর্ণের দৈর্ঘ্য ১৫ সে.মি. এবং প্রস্থ ১০ সে.মি. হলে আয়তক্ষেত্রের ক্ষেত্রফল কত বর্গমিটার?", opts:["৩৫√৫", "৪০√৫", "৪৫√৫", "৫০√৫"], ans:3, sol:"দৈর্ঘ্য = √(১৫²−১০²) = √(২২৫−১০০) = √১২৫ = ৫√৫। ক্ষেত্রফল = দৈর্ঘ্য×প্রস্থ = ৫√৫×১০ = ৫০√৫।", year:"৩৭তম বিসিএস", src:true},
  {id:"l15tw2", lec:"lec15", section:"teacherWork", sourceNo:"2", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি বর্গক্ষেত্রের কর্ণের দৈর্ঘ্য ৪√২ একক হলে, ঐ বর্গক্ষেত্রের ক্ষেত্রফল কত বর্গ একক?", opts:["২৪", "৮", "১৬", "৩২"], ans:2, sol:"বর্গক্ষেত্রের ক্ষেত্রফল = (কর্ণ)²/২ = (৪√২)²/২ = ৩২/২ = ১৬।", year:"৩৬তম বিসিএস", src:true},
  {id:"l15tw3", lec:"lec15", section:"teacherWork", sourceNo:"3", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি রম্বসের কর্ণদ্বয়ের দৈর্ঘ্য ৮ সে.মি. ও ৯ সে.মি.। এই রম্বসের ক্ষেত্রফলের সমান ক্ষেত্রফলবিশিষ্ট বর্গক্ষেত্রের পরিসীমা কত?", opts:["২৪ সে.মি.", "১৮ সে.মি.", "৩৬ সে.মি.", "১২ সে.মি."], ans:0, sol:"রম্বসের ক্ষেত্রফল = ½×৮×৯ = ৩৬। বর্গক্ষেত্রের ক্ষেত্রফল = ৩৬ হলে বাহু = ৬। পরিসীমা = ৪×৬ = ২৪ সে.মি.।", year:"৩৩তম বিসিএস", src:true},
  {id:"l15tw4", lec:"lec15", section:"teacherWork", sourceNo:"4", topic:"ঘনক (Cubes)", q:"একটি সাবানের আকার ৫ সে.মি. × ৪ সে.মি. × ১.৫ সে.মি. হলে ৫৫ সে.মি. দৈর্ঘ্য, ৪৮ সে.মি. প্রস্থ এবং ৩০ সে.মি. উচ্চতাবিশিষ্ট একটি বাক্সের মধ্যে কতটি সাবান রাখা যাবে?", opts:["২৬৪০ টি", "১৩২০ টি", "৩৬০০ টি", "৫২৪০ টি"], ans:0, sol:"সাবানের আয়তন = ৫×৪×১.৫ = ৩০ ঘন সে.মি.। বাক্সের আয়তন = ৫৫×৪৮×৩০ = ৭৯২০০ ঘন সে.মি.। সাবানের সংখ্যা = ৭৯২০০/৩০ = ২৬৪০টি।", year:"৩৩তম বিসিএস", src:true},
  {id:"l15tw5", lec:"lec15", section:"teacherWork", sourceNo:"5", topic:"ঘনক (Cubes)", q:"৩ সে.মি., ৪ সে.মি. ও ৫ সে.মি. বাহুবিশিষ্ট তিনটি ঘনক গলিয়ে নতুন একটি ঘনক তৈরি করা হল। নতুন ঘনকের বাহুর দৈর্ঘ্য কত হবে?", opts:["৭.৫ সে.মি.", "৬.৫ সে.মি.", "৬ সে.মি.", "৭ সে.মি."], ans:2, sol:"মোট আয়তন = ৩³+৪³+৫³ = ২৭+৬৪+১২৫ = ২১৬ ঘন সে.মি.। নতুন ঘনকের বাহু = ৩√২১৬ = ৬ সে.মি.।", year:"৩৩তম বিসিএস", src:true},
  {id:"l15tw6", lec:"lec15", section:"teacherWork", sourceNo:"6", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার ঘরের প্রস্থ তার দৈর্ঘ্যের ২/৩ অংশ। ঘরটির পরিসীমা ৪০ মিটার হলে, তার ক্ষেত্রফল কত?", opts:["৬০ বর্গ মিটার", "৯৬ বর্গ মিটার", "৭২ বর্গ মিটার", "৬৪ বর্গ মিটার"], ans:1, sol:"দৈর্ঘ্য=l, প্রস্থ=(২/৩)l। পরিসীমা: ২(l+(২/৩)l)=৪০ ⟹ l+(২/৩)l=২০ ⟹ (৫/৩)l=২০ ⟹ l=১২, প্রস্থ=৮। ক্ষেত্রফল=১২×৮=৯৬।", year:"৩৩তম বিসিএস", src:true},
  {id:"l15tw7", lec:"lec15", section:"teacherWork", sourceNo:"7", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার ঘরের দৈর্ঘ্য প্রস্থ অপেক্ষা ৪ মিটার বেশি। ঘরটির পরিসীমা ৩২ মিটার হলে, ঘরটির দৈর্ঘ্য কত?", opts:["৬ মিটার", "১০ মিটার", "১৮ মিটার", "১২ মিটার"], ans:1, sol:"দৈর্ঘ্য=w+৪ (w=প্রস্থ)। পরিসীমা: ২((w+৪)+w)=৩২ ⟹ w+৪+w=১৬ ⟹ ২w=১২ ⟹ w=৬, দৈর্ঘ্য=১০।", year:"৩০তম বিসিএস", src:true},
  {id:"l15tw8", lec:"lec15", section:"teacherWork", sourceNo:"8", topic:"চতুর্ভুজ (Quadrilaterals)", q:"ABCD চতুর্ভুজে AB||CD, AC = BD এবং ∠A = 90° হলে সঠিক চতুর্ভুজ কোনটি?", opts:["সামান্তরিক", "রম্বস", "ট্রাপিজিয়াম", "আয়তক্ষেত্র"], ans:3, sol:"AB||CD একটি ট্রাপিজিয়াম নিশ্চিত করে; AC=BD (কর্ণদ্বয় সমান) এই ট্রাপিজিয়ামকে সমদ্বিবাহু ট্রাপিজিয়ামে পরিণত করে, যার ধর্ম অনুযায়ী ∠A=∠B। যেহেতু ∠A=90°, তাই ∠B-ও 90° হবে, ফলে AD⊥AB এবং BC⊥AB — অর্থাৎ AD||BC-ও সত্য হয়ে যায়। উভয় জোড়া বিপরীত বাহু সমান্তরাল হওয়ায় ও একটি কোণ সমকোণ হওয়ায় চতুর্ভুজটি আয়তক্ষেত্র।", year:"৩২তম বিসিএস", src:true},
  {id:"l15tw9", lec:"lec15", section:"teacherWork", sourceNo:"9", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি রম্বসের কর্ণদ্বয় যথাক্রমে ৪ cm এবং ৬ cm হয়, তবে রম্বসের ক্ষেত্রফল কত?", opts:["৬", "৮", "১২", "২৪"], ans:2, sol:"রম্বসের ক্ষেত্রফল = ½×কর্ণ১×কর্ণ২ = ½×৪×৬ = ১২।", year:"৩১তম বিসিএস", src:true},
  {id:"l15tw10", lec:"lec15", section:"teacherWork", sourceNo:"10", topic:"চতুর্ভুজ (Quadrilaterals)", q:"চতুর্ভুজের চার কোণের অনুপাত ১ : ২ : ২ : ৩ হলে বৃহত্তম কোণের পরিমাণ হবে-", opts:["১০০°", "১১৫°", "১৩৫°", "২২৫°"], ans:2, sol:"চতুর্ভুজের কোণগুলোর সমষ্টি ৩৬০°। অনুপাতের অংশ = ১+২+২+৩ = ৮। প্রতি অংশ = ৩৬০/৮ = ৪৫°। বৃহত্তম কোণ = ৩×৪৫° = ১৩৫°।", year:"১৬তম বিসিএস", src:true},
  {id:"l15tw11", lec:"lec15", section:"teacherWork", sourceNo:"11", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের দৈর্ঘ্য প্রস্থের দ্বিগুণ। আয়তক্ষেত্রটির ক্ষেত্রফল ১২৫০ বর্গমিটার হলে, এর দৈর্ঘ্য কত?", opts:["৩০ মিটার", "৪০ মিটার", "৫০ মিটার", "৬০ মিটার"], ans:2, sol:"দৈর্ঘ্য=২w। ক্ষেত্রফল: ২w²=১২৫০ ⟹ w²=৬২৫ ⟹ w=২৫, দৈর্ঘ্য=৫০।", src:true},
  {id:"l15tw12", lec:"lec15", section:"teacherWork", sourceNo:"12", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার ঘরের দৈর্ঘ্য বিস্তারের দ্বিগুণ। এর ক্ষেত্রফল ৫১২ বর্গমিটার হলে, পরিসীমা কত?", opts:["৯৮ মিটার", "৯৬ মিটার", "৯৪ মিটার", "৯২ মিটার"], ans:1, sol:"দৈর্ঘ্য=২w। ক্ষেত্রফল: ২w²=৫১২ ⟹ w²=২৫৬ ⟹ w=১৬, দৈর্ঘ্য=৩২। পরিসীমা=২(৩২+১৬)=৯৬।", year:"২৫তম বিসিএস", src:true},
  {id:"l15tw13", lec:"lec15", section:"teacherWork", sourceNo:"13", topic:"চতুর্ভুজ (Quadrilaterals)", q:"20x পরিসীমা বিশিষ্ট আয়তক্ষেত্রের এক বাহুর দৈর্ঘ্য 4x + 3 হলে, অপর বাহুর দৈর্ঘ্য কত?", opts:["4x – 3", "5x + 3", "5x – 3", "6x – 3"], ans:3, sol:"পরিসীমা = ২(দৈর্ঘ্য+প্রস্থ) = ২০x ⟹ দৈর্ঘ্য+প্রস্থ = ১০x। অপর বাহু = ১০x − (৪x+৩) = ৬x−৩।", src:true},
  {id:"l15tw14", lec:"lec15", section:"teacherWork", sourceNo:"14", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের পরিসীমা ৩৬ মিটার এবং ক্ষেত্রফল ৮০ বর্গমিটার হলে, তার দৈর্ঘ্য ও প্রস্থ কত মিটার?", opts:["১৬ ও ৫ মিটার", "১০ ও ৮ মিটার", "১২ ও ৮ মিটার", "২০ ও ৪ মিটার"], ans:1, sol:"দৈর্ঘ্য+প্রস্থ = ১৮ (পরিসীমা=৩৬), দৈর্ঘ্য×প্রস্থ = ৮০। এই দুটি শর্ত মেটায় দৈর্ঘ্য=১০, প্রস্থ=৮ (t²−১৮t+৮০=০ এর মূল ১০ ও ৮)।", src:true},
  {id:"l15tw15", lec:"lec15", section:"teacherWork", sourceNo:"15", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের ক্ষেত্রে দৈর্ঘ্য ২০% বৃদ্ধি ও প্রস্থ ১০% হ্রাস করা হলে, ক্ষেত্রফলের শতকরা কত পরিবর্তন হবে?", opts:["৮% (বৃদ্ধি)", "৮% (হ্রাস)", "১৮% (বৃদ্ধি)", "১০৮% (হ্রাস)"], ans:0, sol:"নতুন ক্ষেত্রফল = ১.২L × ০.৯W = ১.০৮LW — অর্থাৎ ৮% বৃদ্ধি।", year:"১৪তম বিসিএস", src:true},
  {id:"l15tw16", lec:"lec15", section:"teacherWork", sourceNo:"16", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার বাগানের দৈর্ঘ্য ১৬ গজ ও প্রস্থ ১২ গজ। এর ভেতরে চারদিকে ২ গজ চওড়া একটি রাস্তা আছে। রাস্তার ক্ষেত্রফল কত?", opts:["৮০ বর্গগজ", "৯৬ বর্গগজ", "৯০ বর্গগজ", "৯৫ বর্গগজ"], ans:1, sol:"মোট ক্ষেত্রফল = ১৬×১২ = ১৯২। রাস্তা বাদে ভেতরের ক্ষেত্রফল = (১৬−৪)×(১২−৪) = ১২×৮ = ৯৬। রাস্তার ক্ষেত্রফল = ১৯২−৯৬ = ৯৬।", src:true},
  {id:"l15tw17", lec:"lec15", section:"teacherWork", sourceNo:"17", topic:"চতুর্ভুজ (Quadrilaterals)", q:"১৫ মিটার দীর্ঘ ও ১০ মিটার প্রশস্ত বাগানের চারদিকে ১ মিটার চওড়া একটি হাঁটাপথ আছে। পথটির ক্ষেত্রফল-", opts:["৫৪ বর্গমিটার", "৬০ বর্গমিটার", "৪২ বর্গমিটার", "৪৬ বর্গমিটার"], ans:0, sol:"পথ বাগানের চারদিকে বাইরে অবস্থিত ধরে নিলে, পথসহ মোট ক্ষেত্রফল = (১৫+২)×(১০+২) = ১৭×১২ = ২০৪। পথের ক্ষেত্রফল = ২০৪−(১৫×১০) = ২০৪−১৫০ = ৫৪।", src:true},
  {id:"l15tw18", lec:"lec15", section:"teacherWork", sourceNo:"18", topic:"চতুর্ভুজ (Quadrilaterals)", q:"কোনটি সামান্তরিকের ক্ষেত্রফল নির্ণয়ের সূত্র?", opts:["½ (ভূমি × উচ্চতা)", "দৈর্ঘ্য × প্রস্থ", "২ (দৈর্ঘ্য + প্রস্থ)", "ভূমি × উচ্চতা"], ans:3, sol:"সামান্তরিকের ক্ষেত্রফল = ভূমি × উচ্চতা।", year:"১৪তম বিসিএস", src:true},
  {id:"l15tw19", lec:"lec15", section:"teacherWork", sourceNo:"19", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি বর্গক্ষেত্রের বাহুর দৈর্ঘ্য ৮ ফুট হলে, ঐ বর্গক্ষেত্রের কর্ণের উপর অংকিত বর্গক্ষেত্রের ক্ষেত্রফল কত?", opts:["১৫৬ ব.ফু.", "১৬৪ ব.ফু.", "১২৮ ব.ফু.", "২১৮ ব.ফু."], ans:2, sol:"বর্গক্ষেত্রের কর্ণ = ৮√২। কর্ণের উপর অঙ্কিত বর্গক্ষেত্রের ক্ষেত্রফল = (৮√২)² = ৬৪×২ = ১২৮।", year:"২৬তম বিসিএস", src:true},
  {id:"l15tw20", lec:"lec15", section:"teacherWork", sourceNo:"20", topic:"চতুর্ভুজ (Quadrilaterals)", q:"চারটি সমান বাহু দ্বারা সীমাবদ্ধ একটি ক্ষেত্র যার একটি কোণও সমকোণ নয়, এইরূপ চিত্রকে বলা হয়-", opts:["বর্গক্ষেত্রে", "চতুর্ভুজ", "রম্বস", "সামান্তরিক"], ans:2, sol:"চারটি বাহু সমান কিন্তু কোনো কোণ সমকোণ নয় — এটি রম্বসের সংজ্ঞা (বর্গক্ষেত্রে সব কোণ সমকোণ হয়, তাই বাদ)।", year:"১২তম বিসিএস", src:true},
  {id:"l15tw21", lec:"lec15", section:"teacherWork", sourceNo:"21", topic:"ত্রিকোণমিতি (Trigonometry — Height & Distance)", q:"একটি মিনারের পাদদেশ হতে ২০ মিটার দূরের একটি স্থান হতে মিনারটির শীর্ষবিন্দুর উন্নতি কোণ ৩০° হলে মিনারটির উচ্চতা কত?", opts:["২০√৩ মিটার", "২০/√৩ মিটার", "২০ মিটার", "১০√৩ মিটার"], ans:1, sol:"tan৩০° = উচ্চতা/২০ ⟹ উচ্চতা = ২০×tan৩০° = ২০×(১/√৩) = ২০/√৩ মিটার।", year:"৩০তম বিসিএস", src:true},
  {id:"l15tw22", lec:"lec15", section:"teacherWork", sourceNo:"22", topic:"ত্রিকোণমিতি (Trigonometry — Height & Distance)", q:"একটি ৪৮ মিটার লম্বা বাঁশ ভেঙে গিয়ে সম্পূর্ণভাবে বিচ্ছিন্ন না হয়ে ভূমির সাথে ৩০° কোণ উৎপন্ন করে। বাঁশটি কত উঁচুতে ভেঙেছিল?", opts:["১৪ মিটার", "১৬ মিটার", "১৮ মিটার", "২০ মিটার"], ans:1, sol:"ভাঙা স্থানের উচ্চতা = h, অবশিষ্ট অংশ (৪৮−h) মাটির সাথে ৩০° কোণে হেলে থাকে (এটি অতিভুজ হিসেবে কাজ করে)। sin৩০° = h/(৪৮−h) ⟹ ১/২ = h/(৪৮−h) ⟹ ৪৮−h = ২h ⟹ h = ১৬ মিটার।", year:"২৫তম বিসিএস", src:true},
  {id:"l15tw23", lec:"lec15", section:"teacherWork", sourceNo:"23", topic:"ত্রিকোণমিতি (Trigonometry — Height & Distance)", q:"একটি তাল গাছের পাদবিন্দু হতে ১০ মিটার দূরবর্তী স্থানে গাছের শীর্ষের উন্নতি কোণ ৬০° হলে গাছটি উচ্চতা নির্ণয় করুন।", opts:["১৬.৬৫ মি.", "১৭.৭২ মি.", "১৭.৩২ মি.", "১৭.৭৫ মি."], ans:2, sol:"tan৬০° = উচ্চতা/১০ ⟹ উচ্চতা = ১০×tan৬০° = ১০×√৩ ≈ ১৭.৩২ মিটার।", src:true},
  {id:"l15sw01", lec:"lec15", section:"studentWork", sourceNo:"1", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার মেঝের ক্ষেত্রফল ২৭৩ বর্গফিটার। দৈর্ঘ্য ৫ মিটার বেশি হলে মেঝের ক্ষেত্রফল হতো ৩৩৮ বর্গমিটার। ঐ মেঝের প্রস্থ কত?", opts:["১৩ মিটার", "২১ মিটার", "২৬ মিটার", "২৭ মিটার"], ans:0, sol:"xy=২৭৩ এবং (x+৫)y=৩৩৮ ধরি। বিয়োগ করে: ৫y=৬৫ ⟹ y=১৩ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw02", lec:"lec15", section:"studentWork", sourceNo:"2", topic:"চতুর্ভুজ (Quadrilaterals)", q:"যদি কোনো আয়তক্ষেত্রের প্রস্থ ৪ মি. এবং এর ক্ষেত্রফল, ২৪ মি. পরিসীমাবিশিষ্ট বর্গক্ষেত্রের ক্ষেত্রফলের সমান হয়, তবে আয়তক্ষেত্রের পরিসীমা কত হবে?", opts:["২০ মি.", "১৬ মি.", "২৪ মি.", "২৬ মি."], ans:3, sol:"বর্গের বাহু = ২৪/৪ = ৬। বর্গের ক্ষেত্রফল = ৬²=৩৬। আয়তক্ষেত্রের দৈর্ঘ্য = ৩৬/৪=৯। পরিসীমা = ২×(৯+৪)=২৬ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw03", lec:"lec15", section:"studentWork", sourceNo:"3", topic:"চতুর্ভুজ (Quadrilaterals)", q:"আয়তাকার বাগানের দৈর্ঘ্য ৪০ মিটার ও প্রস্থ ৩০ মিটার এবং ভেতরের চতুর্দিকে ১ মিটার চওড়া ১টি রাস্তা আছে। রাস্তাটির ক্ষেত্রফল কত?", opts:["২১৬ ব.মি.", "১৩৬ ব.মি.", "১২০ ব.মি.", "১৪৮ ব.মি."], ans:1, sol:"রাস্তাসহ বাগানের ক্ষেত্রফল = ৪০×৩০ = ১২০০। রাস্তা বাদে বাগানের দৈর্ঘ্য={৪০−(২×১)}=৩৮, প্রস্থ={৩০−(২×১)}=২৮। রাস্তাছাড়া ক্ষেত্রফল=৩৮×২৮=১০৬৪। রাস্তার ক্ষেত্রফল=১২০০−১০৬৪=১৩৬। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw04", lec:"lec15", section:"studentWork", sourceNo:"4", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার মেঝের দৈর্ঘ্য তার প্রস্থের দ্বিগুণ। যদি মেঝেটি পাকা করতে প্রতি বর্গমিটার ২ টাকা হিসেবে ১৪৪ টাকা খরচ হয় তবে মেঝের দৈর্ঘ্য কত?", opts:["১০ মিটার", "১২ মিটার", "১৪ মিটার", "১৬ মিটার"], ans:1, sol:"প্রস্থ=x, দৈর্ঘ্য=২x। ক্ষেত্রফল=২x². শর্তমতে ২×২x²=১৪৪ ⟹ x²=৩৬ ⟹ x=৬। দৈর্ঘ্য=২x=১২ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw05", lec:"lec15", section:"studentWork", sourceNo:"5", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার মসজিদের ১৫ মিটার দীর্ঘ এবং ১১ মিটার প্রশস্ত মেঝে ২.২ মিটার লম্বা এবং ১.২৫ মিটার চওড়া কতটি মাদুর দিয়ে ঢাকা যাবে?", opts:["৪০ টি", "৫০ টি", "৭০ টি", "৬০ টি"], ans:3, sol:"মসজিদের ক্ষেত্রফল = ১৫×১১ = ১৬৫ বর্গ মি.। মাদুরের ক্ষেত্রফল = ২.২×১.২৫ = ২.৭৫ বর্গ মি.। মাদুরের সংখ্যা = ১৬৫/২.৭৫ = ৬০টি। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw06", lec:"lec15", section:"studentWork", sourceNo:"6", topic:"চতুর্ভুজ (Quadrilaterals)", q:"দুটি আয়তাকার কক্ষের ক্ষেত্রফল সমান। প্রথম কক্ষের দৈর্ঘ্য ও প্রস্থ যথাক্রমে ২০ মিটার এবং ১৫ মিটার, দ্বিতীয় কক্ষের দৈর্ঘ্য ১৮ মিটার হলে প্রস্থ কত?", opts:["১৫ মিটার", "১৫⅟₂ মিটার", "১৬⅓ মিটার", "১৬⅔ মিটার"], ans:3, sol:"প্রথম কক্ষের ক্ষেত্রফল = ২০×১৫ = ৩০০। দ্বিতীয় কক্ষের প্রস্থ a হলে, ১৮a=৩০০ ⟹ a=১৬⅔ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw07", lec:"lec15", section:"studentWork", sourceNo:"7", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি কামরার পরিসীমা ৪৪ ফুট এবং ক্ষেত্রফল ১২০ বর্গফুট। কামরার দৈর্ঘ্য ও প্রস্থ কত?", opts:["৩০, ১৪", "২০, ৬", "১২, ১০", "২৪, ১৮"], ans:2, sol:"দৈর্ঘ্য+প্রস্থ=২২ (যেহেতু পরিসীমা=২(দৈর্ঘ্য+প্রস্থ)=৪৪), দৈর্ঘ্য×প্রস্থ=১২০। এই দুটি শর্ত মেটায় দৈর্ঘ্য=১২, প্রস্থ=১০। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw08", lec:"lec15", section:"studentWork", sourceNo:"8", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার ঘরের দৈর্ঘ্য বিস্তারের দেড়গুণ। এর ক্ষেত্রফল ১৫০ বর্গমিটার হলে, পরিসীমা কত?", opts:["৫০ মিটার", "৫৫ মিটার", "৬০ মিটার", "৬৬ মিটার"], ans:0, sol:"বিস্তার=a, দৈর্ঘ্য=১.৫a। ক্ষেত্রফল: ১.৫a²=১৫০ ⟹ a²=১০০ ⟹ a=১০। পরিসীমা=২×(১০×১.৫+১০)=২×২৫=৫০ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw09", lec:"lec15", section:"studentWork", sourceNo:"9", topic:"চতুর্ভুজ (Quadrilaterals)", q:"দুইটি আয়তাকার কক্ষের ক্ষেত্রফল সমান। প্রথম কক্ষের দৈর্ঘ্য এবং প্রস্থ যথাক্রমে ২০ মিটার এবং ১৫ মিটার। দ্বিতীয় কক্ষের প্রস্থ ১২ মিটার হলে উহার দৈর্ঘ্য কত?", opts:["২০ মিটার", "২২ মিটার", "২৪ মিটার", "২৫ মিটার"], ans:3, sol:"প্রথম কক্ষের ক্ষেত্রফল = ২০×১৫ = ৩০০। দ্বিতীয় কক্ষের দৈর্ঘ্য a হলে, ১২a=৩০০ ⟹ a=২৫ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw10", lec:"lec15", section:"studentWork", sourceNo:"10", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার বাগানের দৈর্ঘ্য ২০ গজ এবং প্রস্থ ১৪ গজ। এর ভিতরে চারদিকে ২ গজ চওড়া একটি রাস্তা আছে। রাস্তার ক্ষেত্রফল কত?", opts:["১০০ বর্গগজ", "১১০ বর্গগজ", "১১৫ বর্গগজ", "১২০ বর্গগজ"], ans:3, sol:"(৩নং প্রশ্নের অনুরূপ পদ্ধতি) মোট ক্ষেত্রফল=২০×১৪=২৮০। রাস্তা বাদে ক্ষেত্রফল=(২০−৪)×(১৪−৪)=১৬×১০=১৬০। রাস্তার ক্ষেত্রফল=২৮০−১৬০=১২০। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw11", lec:"lec15", section:"studentWork", sourceNo:"11", topic:"চতুর্ভুজ (Quadrilaterals)", q:"৪ ঘরের দৈর্ঘ্য ১৬ মিটার, প্রস্থ ১২ মিটার। ৪ মিটার দীর্ঘ ও ৩ মিটার প্রস্থবিশিষ্ট কার্পেট দিয়ে মুড়তে কয়টি কার্পেট লাগবে?", opts:["১০ টি", "১২ টি", "১৪ টি", "১৬ টি"], ans:3, sol:"(৫নং প্রশ্নের অনুরূপ পদ্ধতি) ঘরের ক্ষেত্রফল=১৬×১২=১৯২। কার্পেটের ক্ষেত্রফল=৪×৩=১২। কার্পেটের সংখ্যা=১৯২/১২=১৬টি। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw12", lec:"lec15", section:"studentWork", sourceNo:"12", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রাকার জমির উপর ২৫ ফুট বাই ২৪ ফুট একটি 'শেড' মাত্র ৫% জায়গা ঢাকতে পারে। উক্ত জমির ক্ষেত্রফল কত বর্গফুট?", opts:["৫,৭০০", "১২,০০০", "২২,৫০০", "৩০,০০০"], ans:1, sol:"শেডের ক্ষেত্রফল = ২৫×২৪ = ৬০০ বর্গফুট। শর্তমতে, ৬০০ = ৫% × জমির ক্ষেত্রফল ⟹ জমির ক্ষেত্রফল = (৬০০×১০০)/৫ = ১২,০০০ বর্গফুট। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw13", lec:"lec15", section:"studentWork", sourceNo:"13", topic:"চতুর্ভুজ (Quadrilaterals)", q:"যদি একটি আয়তক্ষেত্রের বিস্তার ২৫% বৃদ্ধি এবং দৈর্ঘ্য ২৫% হ্রাস করা হয় তবে পরিবর্তিত ক্ষেত্রফল মূল ক্ষেত্রফলের শতকরা কত ভাগ?", opts:["৯০%", "৯৩.৭৫%", "৯৫.২৫%", "১০০%"], ans:1, sol:"বিস্তার ২৫% বৃদ্ধি পেলে নতুন বিস্তার = (৫/৪)y। দৈর্ঘ্য ২৫% হ্রাস পেলে নতুন দৈর্ঘ্য = (৩/৪)x। পরিবর্তিত ক্ষেত্রফল = (৫/৪)y×(৩/৪)x = (১৫/১৬)xy, যা মূল ক্ষেত্রফলের (১৫/১৬)×১০০% = ৯৩.৭৫%।", src:true},
  {id:"l15sw14", lec:"lec15", section:"studentWork", sourceNo:"14", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার বাগানের দৈর্ঘ্য ৩২ মিটার এবং প্রস্থ ২৪ মিটার। বাগানের ভিতরে চারদিকে ২ মিটার চওড়া রাস্তা আছে। রাস্তাটির ক্ষেত্রফল?", opts:["২৬৮ বর্গমিটার", "২৪৮ বর্গমিটার", "২০৮ বর্গমিটার", "২১৮ বর্গমিটার"], ans:2, sol:"(৩নং প্রশ্নের অনুরূপ পদ্ধতি) মোট ক্ষেত্রফল=৩২×২৪=৭৬৮। রাস্তা বাদে ক্ষেত্রফল=(৩২−৪)×(২৪−৪)=২৮×২০=৫৬০। রাস্তার ক্ষেত্রফল=৭৬৮−৫৬০=২০৮। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw15", lec:"lec15", section:"studentWork", sourceNo:"15", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের দৈর্ঘ্য ৫ মিটার কম এবং প্রস্থ ৩ মিটার অধিক হলে এর ক্ষেত্রফল অপরিবর্তিত থাকে। আবার দৈর্ঘ্য ৫ মিটার অধিক এবং প্রস্থ ২ মিটার কম হলেও এর ক্ষেত্রফল অপরিবর্তিত থাকে। এর দৈর্ঘ্য ও প্রস্থ-", opts:["দৈর্ঘ্য ২০ মিটার এবং প্রস্থ ১৫ মিটার", "দৈর্ঘ্য ২১ মিটার এবং প্রস্থ ১৪ মিটার", "দৈর্ঘ্য ২৪ মিটার এবং প্রস্থ ১৩ মিটার", "দৈর্ঘ্য ২৫ মিটার এবং প্রস্থ ১২ মিটার"], ans:3, sol:"দৈর্ঘ্য=x, প্রস্থ=y ধরি। (x−৫)(y+৩)=xy এবং (x+৫)(y−২)=xy — এই দুটি সমীকরণ সমাধান করলে x=২৫ মিটার, y=১২ মিটার পাওয়া যায়। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw16", lec:"lec15", section:"studentWork", sourceNo:"16", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার ঘরের দৈর্ঘ্য প্রস্থের ১½ গুণ। তার ক্ষেত্রফল ২১৬ বর্গমিটার হলে পরিসীমা কত?", opts:["৫০ মি.", "৪৮ মি.", "৬০ মি.", "৪৮০ মি."], ans:2, sol:"(৮নং প্রশ্নের অনুরূপ পদ্ধতি) প্রস্থ=a, দৈর্ঘ্য=১.৫a। ক্ষেত্রফল: ১.৫a²=২১৬ ⟹ a²=১৪৪ ⟹ a=১২। প্রস্থ=১২, দৈর্ঘ্য=১৮। পরিসীমা=২×(১৮+১২)=৬০ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw17", lec:"lec15", section:"studentWork", sourceNo:"17", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের দৈর্ঘ্য ১২ সেমি এবং প্রস্থ ৫ সেমি হলে এর একটি কর্ণের দৈর্ঘ্য কত?", opts:["১৭ সেমি", "১৫ সেমি", "১৩ সেমি", "১৪ সেমি"], ans:2, sol:"কর্ণ = √(দৈর্ঘ্য²+প্রস্থ²) = √(১২²+৫²) = √(১৪৪+২৫) = √১৬৯ = ১৩ সেমি। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw18", lec:"lec15", section:"studentWork", sourceNo:"18", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের দৈর্ঘ্য প্রস্থের ১½ গুণ। দৈর্ঘ্য ৬০ মিটার হলে, ক্ষেত্রটির পরিসীমা কত?", opts:["১৬০ মিটার", "১৮০ মিটার", "২০০ মিটার", "৯৬ মিটার"], ans:2, sol:"দৈর্ঘ্য=৬০ মিটার ⟹ প্রস্থ = ৬০÷১.৫ = ৪০ মিটার। পরিসীমা = ২×(৬০+৪০) = ২০০ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw19", lec:"lec15", section:"studentWork", sourceNo:"19", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি ঘরের দৈর্ঘ্য বিস্তারের ৩ গুণ। প্রতি বর্গমিটার ৭.৫০ টাকা দরে ঘরের মেঝে কার্পেট দিয়ে মুড়তে ১১০২.৫০ টাকা ব্যয় হয়। ঘরটির বিস্তার কত মিটার?", opts:["৯ মিটার", "৩ মিটার", "৮ মিটার", "৭ মিটার"], ans:3, sol:"বিস্তার=x, দৈর্ঘ্য=৩x। ক্ষেত্রফল=৩x²। শর্তমতে ৩x²×৭.৫০=১১০২.৫০ ⟹ x²=১১০২.৫/(৭.৫×৩)=৪৯ ⟹ x=৭ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw20", lec:"lec15", section:"studentWork", sourceNo:"20", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের দৈর্ঘ্য ১০% বাড়ানো হলো এবং প্রস্থ ১০% কমানো হলো। এ অবস্থায় আয়তক্ষেত্রের ক্ষেত্রফল-", opts:["১% বাড়বে", "২% বাড়বে", "১% কমবে", "একই থাকবে"], ans:2, sol:"পরিবর্তিত ক্ষেত্রফল = (১১০%of x)×(৯০%of y) = (১১/১০)x×(৯/১০)y = (৯৯/১০০)xy = ৯৯% of মূল ক্ষেত্রফল — অর্থাৎ ১% হ্রাস পাবে। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw21", lec:"lec15", section:"studentWork", sourceNo:"21", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার বাগানের দৈর্ঘ্য ৩০ মিটার এবং প্রস্থ ২০ মিটার। বাগানের সীমানা সংলগ্ন বাহিরে ২ মিটার চওড়া একটি রাস্তা আছে। রাস্তাসহ বাগানের পরিসীমা কত?", opts:["১১৬ মিটার", "২১৬ মিটার", "৬০০ মিটার", "১০০ মিটার"], ans:0, sol:"রাস্তাসহ বাগানের দৈর্ঘ্য = {৩০+(২+২)} = ৩৪ মি.। রাস্তাসহ বাগানের প্রস্থ = {২০+(২×২)} = ২৪ মি.। রাস্তাসহ বাগানের পরিসীমা = ২×(৩৪+২৪) = ১১৬ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true, needsVerification:true, verifyNote:"উৎসে বিকল্প 'ক'-এর মান '১১' (11) হিসেবে ছাপা হয়েছে, যা স্পষ্টতই '১১৬'-এর একটি মুদ্রণ-ত্রুটি (একটি অঙ্ক বাদ পড়েছে) — গণনা করা সঠিক মান (১১৬ মিটার) উৎসের নিজস্ব সমাধানেই দেখানো আছে এবং তা 'ক' হিসেবেই চিহ্নিত। তাই এখানে সংশোধিত মান '১১৬' ব্যবহার করা হয়েছে।"},
  {id:"l15sw22", lec:"lec15", section:"studentWork", sourceNo:"22", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের পরিসীমা ৩০ সে.মি.। এর ক্ষেত্রফল ৫০ বর্গ সে.মি. হলে আয়তক্ষেত্রটির দৈর্ঘ্য কত?", opts:["১০ সেমি", "৯ সেমি", "১১ সেমি", "১৫ সেমি"], ans:0, sol:"(৭নং প্রশ্নের অনুরূপ পদ্ধতি) দৈর্ঘ্য+প্রস্থ=১৫ (পরিসীমা=৩০), দৈর্ঘ্য×প্রস্থ=৫০ — এই দুটি শর্ত মেটায় দৈর্ঘ্য=১০, প্রস্থ=৫। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw23", lec:"lec15", section:"studentWork", sourceNo:"23", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের দৈর্ঘ্য ৫ মিটার কম এবং প্রস্থ ৩ মিটার অধিক হলে ক্ষেত্রফল ৯ বর্গমিটার কম হয়। আবার দৈর্ঘ্য ৩ মিটার এবং প্রস্থ ২ মিটার বেশি হলে, ক্ষেত্রফল ৬৭ বর্গমিটার বেশি হয়। আয়তক্ষেত্রটির দৈর্ঘ্য ও প্রস্থ নির্ণয় করুন।", opts:["দৈর্ঘ্য ১৫ মিটার, প্রস্থ ১১ মিটার", "দৈর্ঘ্য ১৭ মিটার, প্রস্থ ৯ মিটার", "দৈর্ঘ্য ১৯ মিটার, প্রস্থ ৭ মিটার", "দৈর্ঘ্য ২১ মিটার, প্রস্থ ৬ মিটার"], ans:1, sol:"দৈর্ঘ্য=x, প্রস্থ=y ধরি: (x−৫)(y+৩)=xy−৯ এবং (x+৩)(y+২)=xy+৬৭ — এই দুটি সমীকরণ সমাধান করলে x=১৭ মিটার, y=৯ মিটার পাওয়া যায়। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw24", lec:"lec15", section:"studentWork", sourceNo:"24", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার বাগানের পরিসীমা ৫৬ মিটার এবং একটি কর্ণ ২০ মিটার। ঐ বাগানের সমান ক্ষেত্রফল বিশিষ্ট বর্গক্ষেত্রের একটি বাহুর দৈর্ঘ্য কত?", opts:["৮√৩ মিটার", "৮√২ মিটার", "৮ মিটার", "৭√৯ মিটার"], ans:0, sol:"দৈর্ঘ্য+প্রস্থ=২৮ (পরিসীমা=৫৬), এবং দৈর্ঘ্য²+প্রস্থ²=২০²=৪০০ (কর্ণ)। (দৈর্ঘ্য+প্রস্থ)²=দৈর্ঘ্য²+প্রস্থ²+২×দৈর্ঘ্য×প্রস্থ ⟹ ২৮²=৪০০+২×ক্ষেত্রফল ⟹ ক্ষেত্রফল=১৯২। সমান ক্ষেত্রফলের বর্গক্ষেত্রের বাহু=√১৯২=৮√৩ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw25", lec:"lec15", section:"studentWork", sourceNo:"25", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার বাগানের দৈর্ঘ্য ৮০ মিটার ও প্রস্থ ৩০ মিটার। বাগানের ভিতরে সীমানার পাশ দিয়ে ২ মিটার চওড়া রাস্তা আছে। রাস্তাটির ক্ষেত্রফল কত?", opts:["৩৮০ বর্গমিটার", "৪২৪ বর্গমিটার", "৪০০ বর্গমিটার", "৩৮৪ বর্গমিটার"], ans:1, sol:"(৩নং প্রশ্নের অনুরূপ পদ্ধতি) মোট ক্ষেত্রফল=৮০×৩০=২৪০০। রাস্তা বাদে ক্ষেত্রফল=(৮০−৪)×(৩০−৪)=৭৬×২৬=১৯৭৬। রাস্তার ক্ষেত্রফল=২৪০০−১৯৭৬=৪২৪। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw26", lec:"lec15", section:"studentWork", sourceNo:"26", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি বর্গাকৃতি বাগানের ক্ষেত্রফল ১ হেক্টর। বাগানটির পরিসীমা কত?", opts:["২০০ মিটার", "৩০০ মিটার", "৪০০ মিটার", "৫০০ মিটার"], ans:2, sol:"১ হেক্টর = ১০,০০০ বর্গ মি.। বর্গের বাহু a হলে a²=১০,০০০ ⟹ a=১০০। পরিসীমা = ৪×১০০ = ৪০০ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw27", lec:"lec15", section:"studentWork", sourceNo:"27", topic:"চতুর্ভুজ (Quadrilaterals)", q:"কোন চতুর্ভুজটির কেবলমাত্র দুটি বাহু সমান্তরাল?", opts:["বর্গক্ষেত্র", "আয়তক্ষেত্র", "রম্বস", "ট্রাপিজিয়াম"], ans:3, sol:"ট্রাপিজিয়ামের একজোড়া বাহু সমান্তরাল এবং অপর জোড়া বাহু সমান্তরাল নয় — এটিই একমাত্র বিকল্প যেখানে ঠিক দুটি বাহু (একজোড়া) সমান্তরাল। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw28", lec:"lec15", section:"studentWork", sourceNo:"28", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি বর্গক্ষেত্রের এক বাহু অপর এক বর্গক্ষেত্রের পরিসীমার সমান হলে, বর্গক্ষেত্র দুটির কর্ণের অনুপাত হবে-", opts:["১ : ২", "২ : ১", "৫ : ২", "৪ : ১"], ans:3, sol:"১ম বর্গক্ষেত্রের বাহু=a, ২য়টির বাহু=b। শর্তমতে a=৪b (পরিসীমা=৪×বাহু)। কর্ণের অনুপাত = (√২×a) : (√২×b) = a:b = ৪b:b = ৪:১। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw29", lec:"lec15", section:"studentWork", sourceNo:"29", topic:"চতুর্ভুজ (Quadrilaterals)", q:"বর্গক্ষেত্রের ক্ষেত্রফল কত?", opts:["২ (দৈর্ঘ্য × প্রস্থ)", "ভূমি × উচ্চতা", "(বাহু)²", "৪ × বাহু"], ans:2, sol:"বর্গক্ষেত্রের ক্ষেত্রফল = (বাহু)²।", src:true, needsVerification:true, verifyNote:"উৎসের নিজস্ব সমাধানে সরাসরি লেখা আছে 'বর্গক্ষেত্রের ক্ষেত্রফল (বাহু)²' — যা হুবহু বিকল্প 'গ'-এর সাথে মেলে। কিন্তু ছাপা 'উত্তর' চিহ্নটি ভুলবশত 'ঘ' (৪×বাহু, যা প্রকৃতপক্ষে পরিসীমার সূত্র, ক্ষেত্রফলের নয়) দেখাচ্ছে — একটি সুস্পষ্ট মুদ্রণ-ত্রুটি। গাণিতিকভাবে সঠিক ও উৎসের নিজস্ব দেখানো কাজের সাথে সামঞ্জস্যপূর্ণ উত্তর (গ) এখানে ব্যবহার করা হয়েছে।"},
  {id:"l15sw30", lec:"lec15", section:"studentWork", sourceNo:"30", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি বর্গক্ষেত্রের ক্ষেত্রফল x বর্গ একক। এর কর্ণের দৈর্ঘ্য হবে-", opts:["√x", "√৩", "√২x", "১/√x"], ans:2, sol:"বর্গক্ষেত্রের ক্ষেত্রফল = x বর্গ একক হলে বাহুর দৈর্ঘ্য = √x একক। কর্ণের দৈর্ঘ্য = √((√x)²+(√x)²) = √(x+x) = √২x। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw31", lec:"lec15", section:"studentWork", sourceNo:"31", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের দৈর্ঘ্য প্রস্থের ৩ গুণ। আয়তক্ষেত্রটির ক্ষেত্রফল ৩০০ বর্গমিটার হলে উহার পরিসীমা কত?", opts:["৭০ মিটার", "৭৫ মিটার", "৮০ মিটার", "৯০ মিটার"], ans:2, sol:"প্রস্থ=x, দৈর্ঘ্য=৩x। ক্ষেত্রফল: ৩x²=৩০০ ⟹ x²=১০০ ⟹ x=১০। দৈর্ঘ্য=৩০, প্রস্থ=১০। পরিসীমা=২×(৩০+১০)=৮০ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", year:"২৪তম বিসিএস", src:true},
  {id:"l15sw32", lec:"lec15", section:"studentWork", sourceNo:"32", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার ক্ষেত্রের দৈর্ঘ্য বিস্তারের ৩ গুণ। দৈর্ঘ্য ৪৮ মিটার হলে, ক্ষেত্রটির পরিসীমা কত?", opts:["১২৮ মিটার", "১৪৪ মিটার", "৬৪ মিটার", "৯৬ মিটার"], ans:0, sol:"দৈর্ঘ্য=৪৮ মিটার ⟹ বিস্তার = ৪৮/৩ = ১৬ মিটার। পরিসীমা = ২×(৪৮+১৬) = ১২৮ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", year:"১১তম বিসিএস", src:true},
  {id:"l15sw33", lec:"lec15", section:"studentWork", sourceNo:"33", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তক্ষেত্রের দৈর্ঘ্য প্রস্থের দেড় গুণ। ক্ষেত্রটির ক্ষেত্রফল ৯৬ বর্গমিটার হলে ক্ষেত্রটির দৈর্ঘ্য কত?", opts:["১২ মিটার", "৬ মিটার", "৮ মিটার", "১৬ মিটার"], ans:0, sol:"প্রস্থ=২a, দৈর্ঘ্য=৩a (দেড়গুণ অনুপাতে)। ক্ষেত্রফল=২a×৩a=৬a²=৯৬ ⟹ a²=১৬ ⟹ a=৪। দৈর্ঘ্য=৩a=১২ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw34", lec:"lec15", section:"studentWork", sourceNo:"34", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি বর্গক্ষেত্রের এক পার্শ্ব ১০% বৃদ্ধি করলে ক্ষেত্রফলের কি পরিবর্তন হবে?", opts:["২০% হ্রাস", "২১% বৃদ্ধি", "২১% হ্রাস", "৫০% হ্রাস"], ans:1, sol:"ক্ষেত্রফলের পরিবর্তন = (x+y+xy/১০০)% যেখানে x=y=১০ (উভয় বাহু একই হারে বাড়ে): = (১০+১০+(১০×১০)/১০০)% = ২১% বৃদ্ধি। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw35", lec:"lec15", section:"studentWork", sourceNo:"35", topic:"চতুর্ভুজ (Quadrilaterals)", q:"পাড়সহ একটি পুকুরের দৈর্ঘ্য ৭০ মিটার এবং প্রস্থ ৬০ মিটার। যদি পুকুরের প্রত্যেক পাড়ের বিস্তার ৪ মিটার হয়, তবে পুকুরের পাড়ের ক্ষেত্রফল কত?", opts:["১১৫০ বর্গ মিটার", "১০০০ বর্গ মিটার", "১০৫০ বর্গ মিটার", "৯৭৬ বর্গ মিটার"], ans:3, sol:"পাড়সহ পুকুরের ক্ষেত্রফল = ৭০×৬০ = ৪২০০ বর্গ মি.। পাড় ছাড়া পুকুরের দৈর্ঘ্য = {৭০−(৪×২)} = ৬২ মি., প্রস্থ = {৬০−(৪×২)} = ৫২ মি.। পাড় ছাড়া পুকুরের ক্ষেত্রফল = ৫২×৬২ = ৩২২৪ বর্গ মি.। পাড়ের ক্ষেত্রফল = ৪২০০−৩২২৪ = ৯৭৬ বর্গ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw36", lec:"lec15", section:"studentWork", sourceNo:"36", topic:"চতুর্ভুজ (Quadrilaterals)", q:"একটি আয়তাকার কক্ষের ক্ষেত্রফল ১৯২ বর্গমিটার। এর দৈর্ঘ্য ৪ মিটার কমালে এবং প্রস্থ ৪ মিটার বাড়ালে ক্ষেত্রফল অপরিবর্তিত থাকে। বর্গাকার ক্ষেত্রের পরিসীমাবিশিষ্ট ক্ষেত্রফল কত?", opts:["২২৫ বর্গ মিটার", "১৪৪ বর্গ মিটার", "১৬৯ বর্গ মিটার", "১৯৬ বর্গ মিটার"], ans:3, sol:"দৈর্ঘ্য=x, প্রস্থ=y ধরি: xy=১৯২ এবং (x−৪)(y+৪)=১৯২। সমাধান করলে y=১২ মিটার, x=১৬ মিটার পাওয়া যায়। আয়তক্ষেত্রের পরিসীমা=২×(১৬+১২)=৫৬ মিটার। এই পরিসীমার সমান পরিসীমাবিশিষ্ট বর্গক্ষেত্রের একবাহু=৫৬/৪=১৪ মিটার। বর্গক্ষেত্রের ক্ষেত্রফল=১৪²=১৯৬ বর্গ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l15sw37", lec:"lec15", section:"studentWork", sourceNo:"37", topic:"চতুর্ভুজ (Quadrilaterals)", q:"কোন বর্গক্ষেত্রের ক্ষেত্রফল ১০ একর হলে, এর এক বাহুর দৈর্ঘ্য কত?", opts:["২২০ গজ", "২৬০ গজ", "১৯৬ গজ", "১০০ গজ"], ans:0, sol:"১ একর = ৪৮৪০ বর্গগজ। শর্তমতে বাহু x গজ হলে x²=১০×৪৮৪০=৪৮৪০০ ⟹ x=√৪৮৪০০=২২০ গজ। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16tw1", lec:"lec16", section:"teacherWork", sourceNo:"1", topic:"বৃত্ত (Circles)", q:"13 সে.মি. ব্যাসার্ধ বিশিষ্ট বৃত্তের একটি জ্যা-এর দৈর্ঘ্য 24 হলে কেন্দ্র থেকে উক্ত জ্যা-এর লম্ব দূরত্ব কত সে.মি.?", opts:["৩", "৪", "৫", "৬"], ans:2, sol:"কেন্দ্র থেকে জ্যা-এর লম্ব দূরত্ব = √(ব্যাসার্ধ²−(জ্যা/২)²) = √(১৩²−১২²) = √(১৬৯−১৪৪) = √২৫ = ৫ সে.মি.।", year:"৩৭তম বিসিএস", src:true},
  {id:"l16tw2", lec:"lec16", section:"teacherWork", sourceNo:"2", topic:"বৃত্ত (Circles)", q:"চিত্র অনুসারে O কেন্দ্র বিশিষ্ট বৃত্তে ΔABC অন্তর্লিখিত। AC বৃত্তের একটি ব্যাস (A, O, C একই সরলরেখায়) এবং কেন্দ্র থেকে B পর্যন্ত OB টানা আছে। ∠AOB = y = 112° এবং ∠BOC = x হলে, ∠x = ?", opts:["৬৮°", "৩৪°", "৪৫°", "৩৯°"], ans:0, sol:"যেহেতু A, O, C একই সরলরেখায় (AC ব্যাস), তাই ∠AOB ও ∠BOC পরস্পর সম্পূরক কোণ (সমষ্টি ১৮০°)। ∠x = ১৮০°−১১২° = ৬৮°।", year:"৩৬তম বিসিএস", src:true, needsVerification:true, verifyNote:"এই প্রশ্নটি একটি চিত্রের (বৃত্তে অন্তর্লিখিত ত্রিভুজ, কেন্দ্র থেকে একটি শীর্ষবিন্দু পর্যন্ত টানা রেখা) উপর নির্ভরশীল। চিত্রটি সরাসরি পর্যবেক্ষণ করে (A, O, C একই সরলরেখায়, অর্থাৎ AC একটি ব্যাস) এই ব্যাখ্যাটি প্রতিষ্ঠিত করা হয়েছে, তবে চিত্রের নির্ভুল জ্যামিতিক গঠন সরাসরি পিক্সেল-স্তরে পরিমাপ করে যাচাই করা সম্ভব হয়নি — এটি একটি সুপরিচিত ৩৬তম বিসিএস প্রশ্ন এবং এই ব্যাখ্যা বিকল্পগুলোর সাথে সঙ্গতিপূর্ণ।"},
  {id:"l16tw3", lec:"lec16", section:"teacherWork", sourceNo:"3", topic:"বৃত্ত (Circles)", q:"একটি বৃত্তের পরিধি ও ক্ষেত্রফল যথাক্রমে ১৩২ সেন্টিমিটার ও ১৩৮৬ বর্গসেন্টিমিটার। বৃত্তির বৃহত্তম জ্যা-এর দৈর্ঘ্য কত?", opts:["৬৬ সেন্টিমিটার", "৪২ সেন্টিমিটার", "২১ সেন্টিমিটার", "২২ সেন্টিমিটার"], ans:1, sol:"পরিধি = ২πr = ১৩২ ⟹ r = ১৩২/(২×২২/৭) = ২১ সেমি। বৃত্তের বৃহত্তম জ্যা হলো ব্যাস = ২r = ৪২ সেমি।", year:"৩৪তম বিসিএস", src:true},
  {id:"l16tw4", lec:"lec16", section:"teacherWork", sourceNo:"4", topic:"বৃত্ত (Circles)", q:"বৃত্তের পরিধির উপর কোনো দুটি বিন্দু যোগ করলে যোজক রেখাকে বলে-", opts:["ব্যাস", "ব্যাসার্ধ", "পরিধি", "জ্যা"], ans:3, sol:"বৃত্তের পরিধির উপর যেকোনো দুটি বিন্দু সংযোগকারী রেখাংশকে জ্যা (Chord) বলে।", src:true},
  {id:"l16tw5", lec:"lec16", section:"teacherWork", sourceNo:"5", topic:"বৃত্ত (Circles)", q:"বৃত্তের কেন্দ্র ছেদকারী জ্যা-কে কি বলা হয়?", opts:["ব্যাস", "ব্যাসার্ধ", "বৃত্তচাপ", "পরিধি"], ans:0, sol:"কেন্দ্রগামী জ্যাকে ব্যাস (Diameter) বলা হয়।", year:"৩০তম বিসিএস", src:true},
  {id:"l16tw6", lec:"lec16", section:"teacherWork", sourceNo:"6", topic:"বৃত্ত (Circles)", q:"বৃত্তের ব্যাস তিনগুণ বৃদ্ধি পেলে ক্ষেত্রফল কতগুণ বৃদ্ধি পাবে?", opts:["৩ গুণ", "৯ গুণ", "১২ গুণ", "১৬ গুণ"], ans:1, sol:"ক্ষেত্রফল ব্যাসের বর্গের সমানুপাতিক। ব্যাস ৩ গুণ হলে ক্ষেত্রফল ৩²=৯ গুণ বৃদ্ধি পাবে।", year:"৩২ ও ২৭তম বিসিএস", src:true},
  {id:"l16tw7", lec:"lec16", section:"teacherWork", sourceNo:"7", topic:"বৃত্ত (Circles)", q:"একটি বৃত্তের বাসার্ধকে যদি r থেকে বৃদ্ধি করে r + n করা হয়, তবে তার ক্ষেত্রফল দ্বিগুণ হয়। r-এর মান কত?", opts:["n/(√2 − 1)", "n + √2", "√2n", "n/(√2 − n)"], ans:0, sol:"নতুন ক্ষেত্রফল = ২×পুরাতন ক্ষেত্রফল ⟹ π(r+n)²=২πr² ⟹ (r+n)²=২r² ⟹ r+n=r√২ ⟹ n=r(√২−১) ⟹ r=n/(√২−১)।", year:"১১তম বিসিএস", src:true},
  {id:"l16tw8", lec:"lec16", section:"teacherWork", sourceNo:"8", topic:"বৃত্ত (Circles)", q:"বৃত্তের পরিধি ও ব্যাসের অনুপাত কত?", opts:["২৯/৩", "২২/৭", "২৫/৯", "৩১/৬"], ans:1, sol:"পরিধি ও ব্যাসের অনুপাত সর্বদা π (পাই), যার আসন্ন মান ২২/৭।", src:true},
  {id:"l16tw9", lec:"lec16", section:"teacherWork", sourceNo:"9", topic:"বৃত্ত (Circles)", q:"একটি চাকা ১.৭৬ কি.মি. পথ যেতে ৪০০ বার ঘোরে। চাকাটির ব্যাসার্ধ কত?", opts:["৬ মি.", "০.৭ মি.", "৮ মি.", "৭.৫ মি."], ans:1, sol:"প্রতি ঘূর্ণনে অতিক্রান্ত দূরত্ব (পরিধি) = ১৭৬০ মি./৪০০ = ৪.৪ মি.। ২πr=৪.৪ ⟹ r=৪.৪×৭/(২×২২)=০.৭ মি.।", src:true},
  {id:"l16tw10", lec:"lec16", section:"teacherWork", sourceNo:"10", topic:"বৃত্ত (Circles)", q:"একটি ঘোড়ার গাড়ির সামনের চাকার পরিধি ৪ মিটার। পেছনের চাকার পরিধি ৫ মিটার। গাড়িটি কত পথ অতিক্রম করলে সামনের চাকা পেছনের চাকার চেয়ে ২০০ বার বেশি ঘুরবে?", opts:["৬ কি. মি.", "৫ কি. মি.", "৪ কি. মি.", "২ কি. মি."], ans:2, sol:"দূরত্ব=D ধরি। সামনের চাকার ঘূর্ণন সংখ্যা=D/৪, পেছনের=D/৫। শর্তমতে D/৪−D/৫=২০০ ⟹ D/২০=২০০ ⟹ D=৪০০০ মি.=৪ কি.মি.।", src:true},
  {id:"l16tw11", lec:"lec16", section:"teacherWork", sourceNo:"11", topic:"বৃত্ত (Circles)", q:"একটি গাড়ির চাকা প্রতি মিনিটে ৯০ বার ঘোরে। ১ সেকেন্ডে চাকাটি কত ডিগ্রি ঘুরবে?", opts:["১৮০°", "২৭০°", "৩৬০°", "৫৪০°"], ans:3, sol:"প্রতি মিনিটে ৯০ ঘূর্ণন = প্রতি সেকেন্ডে ৯০/৬০=১.৫ ঘূর্ণন। প্রতি ঘূর্ণন=৩৬০°, তাই ১ সেকেন্ডে=১.৫×৩৬০°=৫৪০°।", year:"৩২ ও ২১তম বিসিএস", src:true},
  {id:"l16tw12", lec:"lec16", section:"teacherWork", sourceNo:"12", topic:"বৃত্ত (Circles)", q:"১৩ সে.মি. ব্যাসার্ধের বৃত্তের কেন্দ্র হতে ৫ সেমি. দূরত্বে অবস্থিত জ্যা-এর দৈর্ঘ্য-", opts:["২৪", "১৮", "১৬", "১২"], ans:0, sol:"জ্যা-এর অর্ধেক দৈর্ঘ্য = √(১৩²−৫²) = √(১৬৯−২৫) = √১৪৪ = ১২। সম্পূর্ণ জ্যা = ২×১২ = ২৪।", year:"২৬তম বিসিএস", src:true},
  {id:"l16tw13", lec:"lec16", section:"teacherWork", sourceNo:"13", topic:"বৃত্ত (Circles)", q:"O কেন্দ্রবিশিষ্ট বৃত্তে D, AB জ্যায়ের মধ্যবিন্দু। ∠ODB = কত?", opts:["৪৫°", "৯০°", "১১০°", "১৮০°"], ans:1, sol:"কেন্দ্র থেকে কোনো জ্যা-এর মধ্যবিন্দুতে টানা রেখা সর্বদা জ্যা-এর উপর লম্ব হয়। তাই ∠ODB = ৯০°।", src:true},
  {id:"l16tw14", lec:"lec16", section:"teacherWork", sourceNo:"14", topic:"বৃত্ত (Circles)", q:"কোনো বৃত্তের উপর অবস্থিত একটি বিন্দু থেকে কয়টি স্পর্শক আঁকা যেতে পারে?", opts:["২টি", "৪টি", "১টি", "৩টি"], ans:2, sol:"বৃত্তের উপর অবস্থিত (পরিধিস্থ) কোনো বিন্দু থেকে ঠিক ১টি স্পর্শক আঁকা যায় (সেই বিন্দুতে স্পর্শরেখা)।", src:true},
  {id:"l16tw15", lec:"lec16", section:"teacherWork", sourceNo:"15", topic:"বৃত্ত (Circles)", q:"O কেন্দ্র বিশিষ্ট বৃত্তে AB, A বিন্দুতে স্পর্শক। ∠AOB = ৬০° হলে ∠ABO = কত?", opts:["৩০°", "৪৫°", "৪০°", "৬০°"], ans:0, sol:"স্পর্শবিন্দুতে ব্যাসার্ধ স্পর্শকের উপর লম্ব, তাই ∠OAB=৯০°। ত্রিভুজ OAB-তে কোণের সমষ্টি ১৮০° থেকে: ∠ABO = ১৮০°−৯০°−৬০° = ৩০°।", src:true},
  {id:"l16tw16", lec:"lec16", section:"teacherWork", sourceNo:"16", topic:"বৃত্ত (Circles)", q:"'O' ABC বৃত্তের কেন্দ্র। OA = ৩ সেমি.। AT এবং BT উক্ত বৃত্তের দুইটি স্পর্শক, AT + BT = ৮ সেমি.। OT = কত?", opts:["৬ সেমি.", "৯.৫ সেমি.", "৭ সেমি.", "৫ সেমি."], ans:3, sol:"বহিঃস্থ বিন্দু T থেকে টানা দুটি স্পর্শকের দৈর্ঘ্য সমান, তাই AT=BT=৪ সেমি করে। যেহেতু ব্যাসার্ধ স্পর্শকের উপর লম্ব (∠OAT=৯০°), OT²=OA²+AT²=৩²+৪²=২৫ ⟹ OT=৫ সেমি।", src:true},
  {id:"l16tw17", lec:"lec16", section:"teacherWork", sourceNo:"17", topic:"বৃত্ত (Circles)", q:"A ও B কেন্দ্রবিশিষ্ট দুটি বৃত্ত O বিন্দুতে বহিঃস্থভাবে স্পর্শ করেছে। ∠AOB = কত?", opts:["৯০°", "১২০°", "১৬০°", "১৮০°"], ans:3, sol:"দুটি বৃত্ত বহিঃস্থভাবে স্পর্শ করলে উভয় কেন্দ্র ও স্পর্শবিন্দু একই সরলরেখায় অবস্থিত করে, তাই ∠AOB=১৮০° (সরলকোণ)।", src:true},
  {id:"l16tw18", lec:"lec16", section:"teacherWork", sourceNo:"18", topic:"বৃত্ত (Circles)", q:"(x − 4)² + (y + 3)² = 100 বৃত্তের কেন্দ্রের স্থানাংক কত?", opts:["(0, 0)", "(4, −3)", "(−4, 3)", "(10, 10)"], ans:1, sol:"বৃত্তের আদর্শ সমীকরণ (x−h)²+(y−k)²=r² এ কেন্দ্র (h,k)। এখানে (x−৪)²+(y+৩)²=১০০ কে (x−৪)²+(y−(−৩))²=১০² আকারে লিখলে কেন্দ্র = (৪, −৩)।", src:true},
  {id:"l16tw19", lec:"lec16", section:"teacherWork", sourceNo:"19", topic:"বৃত্ত (Circles)", q:"r ব্যাসার্ধবিশিষ্ট একটি অর্ধবৃত্তের মধ্যে অঙ্কিত করা যায় এরূপ সর্ববৃহৎ ত্রিভুজের ক্ষেত্রফল কত?", opts:["r²", "2r²", "½ r²", "r³"], ans:0, sol:"অর্ধবৃত্তে অন্তর্লিখিত সর্ববৃহৎ ত্রিভুজের ভূমি = ব্যাস = ২r এবং সর্বোচ্চ উচ্চতা = ব্যাসার্ধ = r। ক্ষেত্রফল = ½×২r×r = r²।", src:true},
  {id:"l16tw20", lec:"lec16", section:"teacherWork", sourceNo:"20", topic:"বৃত্ত (Circles)", q:"৭ সে. মি. ব্যাসার্ধবিশিষ্ট বৃত্তের অন্তলিখিত বর্গক্ষেত্রের ক্ষেত্রফল কত?", opts:["৯৮ ব.সে.মি.", "৪৯ ব.সে.মি.", "১৯৬ ব.সে.মি.", "১৪৬ ব.সে.মি."], ans:0, sol:"বৃত্তে অন্তর্লিখিত বর্গের কর্ণ = ব্যাস = ২×৭=১৪ সেমি। বর্গের ক্ষেত্রফল = কর্ণ²/২ = ১৪²/২ = ৯৮ ব.সে.মি.।", src:true},
  {id:"l16tw21", lec:"lec16", section:"teacherWork", sourceNo:"21", topic:"বৃত্ত (Circles)", q:"২ সেমি. ব্যাসার্ধবিশিষ্ট একটি বৃত্তের অন্তঃস্থ একটি বর্গক্ষেত্রের চারটি বাহু এবং বৃত্ত দ্বারা আবদ্ধ অঞ্চলের ক্ষেত্রফল কত বর্গ সে.মি.?", opts:["4π − 8", "4π + 8", "2π − 4", "2π + 4"], ans:0, sol:"বৃত্তের ক্ষেত্রফল = πr²=π×২²=৪π। অন্তর্লিখিত বর্গের কর্ণ=২r=৪, ক্ষেত্রফল=৪²/২=৮। বৃত্ত ও বর্গের মধ্যবর্তী ক্ষেত্রফল = ৪π−৮।", src:true},
  {id:"l16tw23", lec:"lec16", section:"teacherWork", sourceNo:"23", topic:"বহুভুজ (Polygons)", q:"একটি পঞ্চভুজের সমষ্টি-", opts:["৪ সমকোণ", "৬ সমকোণ", "৮ সমকোণ", "১০ সমকোণ"], ans:1, sol:"পঞ্চভুজের কোণগুলোর সমষ্টি = (৫−২)×১৮০° = ৫৪০°। এক সমকোণ=৯০° ধরলে, ৫৪০°/৯০°=৬ সমকোণ।", year:"৩৪তম বিসিএস", src:true},
  {id:"l16tw24", lec:"lec16", section:"teacherWork", sourceNo:"24", topic:"বহুভুজ (Polygons)", q:"সুষম বহুভুজের একটি অন্তঃকোণের পরিমাণ ১৩৫° হলে, এর বাহুর সংখ্যা কত?", opts:["৪", "৭", "৯", "৮"], ans:3, sol:"সুষম বহুভুজের অন্তঃকোণ = (n−২)×১৮০°/n = ১৩৫° ⟹ ১৮০n−৩৬০=১৩৫n ⟹ ৪৫n=৩৬০ ⟹ n=৮।", year:"১২তম বিসিএস", src:true},
  {id:"l16tw25", lec:"lec16", section:"teacherWork", sourceNo:"25", topic:"বহুভুজ (Polygons)", q:"সুষম ষড়ভুজের একটি বাহুকে বর্ধিত করলে উৎপন্ন বহিঃস্থ কোণের পরিমাণ কত ডিগ্রী?", opts:["৬০°", "৭৫°", "৯০°", "১৮০°"], ans:0, sol:"সুষম বহুভুজের বহিঃস্থ কোণ = ৩৬০°/n। ষড়ভুজে n=৬, তাই বহিঃস্থ কোণ = ৩৬০°/৬ = ৬০°।", src:true},
  {id:"l16tw26", lec:"lec16", section:"teacherWork", sourceNo:"26", topic:"বহুভুজ (Polygons)", q:"একটি সুষম বহুভুজের বহিঃস্থ কোণের পরিমাণ ৭২° হলে, বাহুর সংখ্যা কত?", opts:["৪", "৫", "৬", "৭"], ans:1, sol:"বাহুর সংখ্যা n = ৩৬০°/বহিঃস্থ কোণ = ৩৬০°/৭২° = ৫।", src:true},
  {id:"l16sw01", lec:"lec16", section:"studentWork", sourceNo:"1", topic:"বৃত্ত (Circles)", q:"বৃত্তাকার একটি পুকুরের ব্যাস ১০০ গজ। পুকুরের পাড়ে ২ গজ চওড়া ঘাসে ঢাকা একটি পথ আছে। ঘাসের পথটির ক্ষেত্রফল কত বর্গগজ?", opts:["১০২ π", "১৯৬ π", "৯৮ π", "২০৪ π"], ans:3, sol:"পুকুরের ব্যাসার্ধ = ৫০ গজ। পথসহ সম্পূর্ণ বৃত্তের ব্যাসার্ধ = ৫০+২=৫২ গজ। ঘাসের পথের ক্ষেত্রফল = π(৫২²−৫০²) = π(৫২+৫০)(৫২−৫০) = π×১০২×২ = ২০৪π। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw02", lec:"lec16", section:"studentWork", sourceNo:"2", topic:"বৃত্ত (Circles)", q:"দুইটি বৃত্ত পরস্পর স্পর্শ করলে তাদের কেন্দ্রদ্বয় এবং স্পর্শবিন্দুর সংযোজন রেখা কেমন হবে?", opts:["বক্ররেখা", "সরলরেখা", "পরাবৃত্ত", "উপবৃত্ত"], ans:1, sol:"দুইটি বৃত্ত পরস্পর স্পর্শ করলে এদের কেন্দ্রদ্বয়ের সংযোজক রেখা এদের ব্যাসার্ধগুলোর যোগফলের (বা পার্থক্যের) সমান হয় এবং A, O, B একই রেখার উপর অবস্থিত হয় — ফলে ∠AOB=১৮০° এবং AB একটি সরলরেখা হবে। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw03", lec:"lec16", section:"studentWork", sourceNo:"3", topic:"বৃত্ত (Circles)", q:"কোন বৃত্তের তিনটি সমান জ্যা একই বিন্দুতে ছেদ করলে ঐ বিন্দুটি বৃত্তের-", opts:["পরিধিতে অবস্থিত হবে", "কেন্দ্র ও পরিধির মধ্যস্থানে", "কেন্দ্রে অবস্থিত হবে", "ব্যাস ভিন্ন জ্যায়ের অবস্থিত"], ans:2, sol:"বৃত্তের তিনটি সমান জ্যা একই বিন্দুতে ছেদ করলে, সেই বিন্দুটি বৃত্তের কেন্দ্রে অবস্থিত হবে।", src:true, needsVerification:true, verifyNote:"উৎসের নিজস্ব সমাধানে সরাসরি লেখা আছে 'ঐ বিন্দুটি হবে বৃত্তের কেন্দ্র' — যা হুবহু বিকল্প 'গ'-এর সাথে মেলে। কিন্তু ছাপা 'উত্তর' চিহ্নটি ভুলবশত 'খ' দেখাচ্ছে — একটি সুস্পষ্ট মুদ্রণ-ত্রুটি। উৎসের নিজস্ব দেখানো সিদ্ধান্তের সাথে সামঞ্জস্যপূর্ণ সঠিক উত্তর (গ) এখানে ব্যবহার করা হয়েছে।"},
  {id:"l16sw04", lec:"lec16", section:"studentWork", sourceNo:"4", topic:"বৃত্ত (Circles)", q:"বৃত্তের ক্ষেত্রফল ১৮π একক হলে, বৃত্তের পরিধি কত?", opts:["5√2π", "8π", "6π√2", "4√3"], ans:2, sol:"ব্যাসার্ধ=r ধরি: πr²=১৮π ⟹ r²=১৮ ⟹ r=√১৮=৩√২। পরিধি = ২πr = ২π×৩√২ = ৬√২π।", src:true},
  {id:"l16sw05", lec:"lec16", section:"studentWork", sourceNo:"5", topic:"বৃত্ত (Circles)", q:"যে বৃত্তের ব্যাস ১৪ মিটার তার ক্ষেত্রফল আসন্ন বর্গমিটারে-", opts:["১৫০ বর্গমিটার", "১৫৪ বর্গমিটার", "২০৮ বর্গমিটার", "১৫৬ বর্গমিটার"], ans:1, sol:"ব্যাসার্ধ = ১৪/২ = ৭ মি.। ক্ষেত্রফল = πr² = (২২/৭)×৭² = ২২×৭ = ১৫৪ বর্গমিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw06", lec:"lec16", section:"studentWork", sourceNo:"6", topic:"বৃত্ত (Circles)", q:"৪ সেমি. ব্যাসের একটি লৌহ গোলককে পিটিয়ে ২/৯ সেমি. পুরু একটি বৃত্তাকার লৌহপাত প্রস্তুত করা হলো। ঐ পাতের ব্যাসার্ধ কত?", opts:["৮ সেমি.", "৬ সেমি.", "৫ সেমি.", "৪ সেমি."], ans:3, sol:"৪ সেমি. ব্যাস (২ সেমি. ব্যাসার্ধ) বিশিষ্ট গোলকের আয়তন = (৪/৩)πr³ = (৪/৩)×π×২³ = (৩২/৩)π ঘন সেমি.। লৌহপাত একটি পাতলা বৃত্তাকার চাকতি (উচ্চতা = পুরুত্ব = ২/৯ সেমি.), যার আয়তন = πR²×(২/৯), যেখানে R পাতের ব্যাসার্ধ। শর্তমতে (২/৯)πR²=(৩২/৩)π ⟹ R²=১৬ ⟹ R=৪ সেমি.।", src:true},
  {id:"l16sw07", lec:"lec16", section:"studentWork", sourceNo:"7", topic:"বৃত্ত (Circles)", q:"O কেন্দ্রবিশিষ্ট বৃত্তের AB ও CD জ্যা দুটি বৃত্তের অভ্যন্তরে অবস্থিত কোনো বিন্দুতে সমকোণে মিলিত হলে ∠AOD + ∠BOC = কত?", opts:["৯০°", "১২০°", "১৮০°", "২৭০°"], ans:2, sol:"AB ও CD জ্যাদ্বয় বৃত্তের অভ্যন্তরে সমকোণে মিলিত হলে ∠AOD+∠BOC = ৯০°+৯০° = ১৮০°। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw08", lec:"lec16", section:"studentWork", sourceNo:"8", topic:"বৃত্ত (Circles)", q:"কোনো বৃত্তের পরিধি ৪৪ মিটার হলে তার ব্যাস কত?", opts:["২১ মিটার", "১৮ মিটার", "১৬ মিটার", "১৪ মিটার"], ans:3, sol:"পরিধি = πd = ৪৪ মি. ⟹ d = ৪৪/(২২/৭) = ৪৪×৭/২২ = ১৪ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw09", lec:"lec16", section:"studentWork", sourceNo:"9", topic:"বৃত্ত (Circles)", q:"দুটি বৃত্তের ব্যাসার্ধের অনুপাত ৩ ঃ ২। বৃত্ত দু'টির ক্ষেত্রফলের অনুপাত কত?", opts:["২ ঃ ৩", "৩ ঃ ৪", "৪ ঃ ৯", "৯ ঃ ৪"], ans:3, sol:"ক্ষেত্রফলের অনুপাত = ব্যাসার্ধের অনুপাতের বর্গ = (৩:২)² = ৯:৪। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw10", lec:"lec16", section:"studentWork", sourceNo:"10", topic:"বৃত্ত (Circles)", q:"একটি বৃত্তাকার পার্কের ব্যাস ৬০ মিটার এবং π = ৩.১৪১৬ হলে, পার্কটির পরিধির দৈর্ঘ্য কত মিটার?", opts:["১৯৮.৪৯৬ মি.", "১৮৯.৪৯৬ মি.", "১৮৮.৪৯৬ মি.", "১৮৭.৪৯৬ মি."], ans:2, sol:"পরিধি = ২×ব্যাসার্ধ×π = ২×৩০×৩.১৪১৬ = ১৮৮.৪৯৬ মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw11", lec:"lec16", section:"studentWork", sourceNo:"11", topic:"বৃত্ত (Circles)", q:"পরস্পরকে স্পর্শ করে আছে এমন তিনটি বৃত্তের কেন্দ্র P, Q, R এবং PQ = a, QR = b, RP = c হলে P কেন্দ্রিক বৃত্তের ব্যাস হবে-", opts:["a + b + c", "b + c − a", "c + a − b", "a + b − c"], ans:2, sol:"P, Q, R কেন্দ্রবিশিষ্ট বৃত্তত্রয়ের ব্যাসার্ধ যথাক্রমে x, y, z ধরে PQ=x+y=a, QR=y+z=b, RP=z+x=c — এই তিনটি সমীকরণ যোগ করে ও সমাধান করে পাওয়া যায় x=½(a−b+c)। P কেন্দ্রিক বৃত্তের ব্যাস = ২x = a−b+c = c+a−b। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw12", lec:"lec16", section:"studentWork", sourceNo:"12", topic:"বৃত্ত (Circles)", q:"একই সরলরেখায় অবস্থিত তিনটি বিন্দুর মধ্য দিয়ে কয়টি বৃত্ত আঁকা যাবে?", opts:["১টি", "২টি", "৩টি", "একটিও না"], ans:3, sol:"একই সরলরেখায় (সমরেখ) অবস্থিত তিনটি বিন্দুর মধ্য দিয়ে কোনো বৃত্তই আঁকা সম্ভব নয়। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw13", lec:"lec16", section:"studentWork", sourceNo:"13", topic:"বৃত্ত (Circles)", q:"r ব্যাসার্ধ বিশিষ্ট বৃত্ত এবং b ভূমি বিশিষ্ট আয়তক্ষেত্রের ক্ষেত্রফল সমান হলে, আয়তক্ষেত্রের উচ্চতা কত?", opts:["πr²/b", "πr²/b²", "πr/b", "π/b"], ans:0, sol:"আয়তক্ষেত্রের ক্ষেত্রফল = h×b = বৃত্তের ক্ষেত্রফল = πr² ⟹ h = πr²/b। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw14", lec:"lec16", section:"studentWork", sourceNo:"14", topic:"বহুভুজ (Polygons)", q:"সুষম পঞ্চভুজের প্রতিটি অন্তঃস্থ কোণের পরিমাণ-", opts:["১৪০°", "১২৮°", "১০৮°", "১০০°"], ans:2, sol:"সুষম পঞ্চভুজের অন্তঃস্থ কোণ = (n−২)×১৮০°/n = (৫−২)×১৮০°/৫ = ৩×৩৬° = ১০৮°। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw15", lec:"lec16", section:"studentWork", sourceNo:"15", topic:"বৃত্ত (Circles)", q:"কোন বৃত্তের কেন্দ্র O। A, P, B তিনটি পরিধিস্থ বিন্দু এবং ∠APB = 90° হলে ∠AOB সমান কত?", opts:["৯০°", "১২°", "১৫০°", "১৮০°"], ans:3, sol:"∠APB=৯০° একটি অর্ধবৃত্তস্থ কোণ (অর্ধবৃত্তস্থ কোণ সর্বদা সমকোণ), তাই AB বৃত্তের ব্যাস এবং A, O, B একই রেখার উপর থাকবে। সুতরাং ∠AOB=১৮০°। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw16", lec:"lec16", section:"studentWork", sourceNo:"16", topic:"বৃত্ত (Circles)", q:"৪ মিটার ব্যাস বিশিষ্ট একটি বলকে একটি ঘনবাক্সে রাখা যায় এমন ঘনবাক্সের আয়তন নির্ণয় করুন।", opts:["৭২ ঘন মিটার", "৬৪ ঘন মিটার", "৮৪ ঘন মিটার", "৩৬ ঘন মিটার"], ans:1, sol:"বলের ব্যাস (৪ মি.) = ঘনবাক্সের একবাহু। ঘনবাক্সের আয়তন = ৪×৪×৪ = ৬৪ ঘন মিটার। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l16sw17", lec:"lec16", section:"studentWork", sourceNo:"17", topic:"বৃত্ত (Circles)", q:"দু' মিটার দীর্ঘ একটি তারকে এমনভাবে দু'টুকরা করা হলো, যা দিয়ে একটি বর্গক্ষেত্র ও একটি বৃত্ত এমন ভাবে বানানো যায় যে, বৃত্তটি বর্গক্ষেত্রটির চারটি কোণা দিয়ে অতিক্রম করে। বৃত্তের ব্যাসার্ধ কত?", opts:["২১.৯৪ সেমি.", "১৮.২৫ সেমি.", "১৬.৭৫ সেমি.", "৩৩.৫০ সেমি."], ans:2, sol:"উৎপন্ন বৃত্ত বর্গক্ষেত্রটির চারটি কোণা (শীর্ষবিন্দু) দিয়ে অতিক্রম করলে, বৃত্তের ব্যাস = বর্গক্ষেত্রের কর্ণ। ব্যাসার্ধ=r হলে বৃত্তের তার-দৈর্ঘ্য=২πr এবং বর্গক্ষেত্রের বাহু=√২r, পরিসীমা=৪√২r। মোট তারের দৈর্ঘ্য (২ মিটার = ২০০ সেমি.) সমীকরণে বসিয়ে সমাধান করলে r≈১৬.৭৫ সেমি. পাওয়া যায়।", src:true},

const STATE_VERSION = 1;
const DEFAULT_STATE = {
  v: STATE_VERSION,
  settings:{theme:'light', fontSize:17, lineHeight:1.7, readWidth:720, dailyTarget:10},
  completedPages:{}, topicStatus:{}, topicRead:{}, bookmarks:[], notes:{},
  mcqAttempts:{}, // id -> {chosen, correct, ts, wrongCount}
  qaAttempts:{},

  mockResults:[],
  streak:{last:null, count:0},

};

function loadState(){
  try{
    const raw = localStorage.getItem('bcsmath_state');
    if(!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULT_STATE), parsed, {
      settings: Object.assign({}, DEFAULT_STATE.settings, parsed.settings||{})
    });
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
let S = loadState();
function saveState(){ localStorage.setItem('bcsmath_state', JSON.stringify(S)); }

function touchStreak(){
  const today = new Date().toDateString();
  if(S.streak.last === today) return;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  S.streak.count = (S.streak.last === yesterday) ? S.streak.count+1 : 1;
  S.streak.last = today;
  saveState();
}
touchStreak();

function addXP(n){ S.xp += n; saveState(); }

const $ = sel => document.querySelector(sel);
const el = (tag, attrs={}, ...children) => {
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if(typeof attrs[k] === 'boolean'){ if(attrs[k]) e.setAttribute(k, ''); } // boolean attrs (disabled, etc.) must be OMITTED when false, not set to "false"
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{ if(c==null) return; e.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c); });
  return e;
};
function toast(msg){
  const t = el('div',{class:'toast'}, msg);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

}
/* ---- BCS year label normalization (source data mixes Bengali/English
   ordinals, "&"/"ও"/comma separators, and the odd typo like "৩৭ম") ---- */
const BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
const BN_TO_EN_DIGIT = {'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};
function toBnNum(n){ return String(n).split('').map(d=>BN_DIGITS[+d]).join(''); }
function bnOrdinal(n){ return n===10 ? toBnNum(n)+'ম' : toBnNum(n)+'তম'; }
function parseYearTokens(raw){
  if(!raw) return [];
  const s = raw.replace(/[০-৯]/g, d=>BN_TO_EN_DIGIT[d]);
  const nums = [];
  s.split(/,|ও|&|and/i).forEach(part=>{
    const m = part.match(/(\d+)/);
    if(m) nums.push(parseInt(m[1],10));
  });
  return [...new Set(nums)];
}
function canonicalYear(raw){
  const nums = parseYearTokens(raw);
  if(!nums.length) return raw;
  const labels = [...nums].sort((a,b)=>b-a).map(bnOrdinal);
  const joined = labels.length===1 ? labels[0]
    : labels.length===2 ? labels[0]+' ও '+labels[1]
    : labels.slice(0,-1).join(', ')+' ও '+labels[labels.length-1];
  return joined+' বিসিএস';
}
function bookmarked(type,id){ return S.bookmarks.some(b=>b.type===type && b.id===id); }
function toggleBookmark(type,id,label){
  const idx = S.bookmarks.findIndex(b=>b.type===type && b.id===id);
  if(idx>=0) S.bookmarks.splice(idx,1);
  else S.bookmarks.push({type,id,label,ts:Date.now()});
  saveState();
}

  document.querySelectorAll('.drawer-backdrop').forEach(d=>d.style.display='none');
  const sb = document.querySelector('.sidebar'); if(sb) sb.classList.remove('open');
  render();
  window.scrollTo(0,0);
}

  const app = $('#app');
  app.innerHTML='';
  const totalMcq = MCQS.length;
  const totalPages = LECTURES.reduce((a,l)=>a+l.pages,0);
  const totalQuestions = MCQS.length;

  // Sidebar
  const sidebar = el('div',{class:'sidebar'},

    ),
    el('div',{class:'nav-scroll'}, NAV.map(g=>
      el('div',{class:'nav-group'},

        g.items.map(it=> el('button',{class:'nav-item'+(ROUTE===it.id?' active':''), onclick:()=>navigate(it.id)},

        ))
      )

      el('div',{}, el('span',{},'মোট পৃষ্ঠা'), el('b',{}, totalPages)),
      el('div',{}, el('span',{},'মোট এমসিকিউ'), el('b',{}, totalMcq)),
      el('div',{}, el('span',{},'অফলাইন স্ট্যাটাস'), el('b',{style:'color:var(--green)'},'✓ প্রস্তুত'))
    )
  );

  const topbar = el('div',{class:'topbar'},
    el('button',{class:'hamburger', onclick:()=>document.querySelector('.sidebar').classList.toggle('open')},'☰'),
    el('div',{style:'font-weight:700;color:var(--maroon)'},'গণিত স্টাডি সিস্টেম')
  );

  const content = el('div',{class:'content'});
  renderRoute(content);

  const main = el('div',{class:'main'}, topbar, content);
  app.appendChild(sidebar);
  app.appendChild(main);
