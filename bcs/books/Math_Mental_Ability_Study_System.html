function injectMobileCss(){
  if(document.getElementById('mobile-css')) return;
  const s = document.createElement('style'); s.id='mobile-css';
  s.textContent = `
  @media(max-width:820px){
    .topbar{display:flex;}
    .sidebar{position:fixed; left:-270px; top:0; z-index:30; transition:left .2s; width:250px;}
    .sidebar.open{left:0; box-shadow:6px 0 20px rgba(0,0,0,.2);}
    .main{width:100%;}
  }`;
  document.head.appendChild(s);
}

function renderRoute(content){
  const routes = {
    dashboard: renderDashboard, today: renderToday, reading: renderReadingHome,
    search: renderSearch, bookmarks: renderBookmarks, revision: renderRevision,
    flashcards: renderFlashcards, recall: renderRecall, mcq: renderMcqPractice,
    pyq: renderPYQ, mock: renderMock, mistakes: renderMistakes, progress: renderProgress,
    settings: renderSettings, help: renderHelp,
    'lecture-detail': renderLectureDetail,
  };
  (routes[ROUTE]||renderDashboard)(content);
}

/* ============ DASHBOARD ============ */
function computeStats(){
  const totalPages = LECTURES.reduce((a,l)=>a+l.pages,0);
  const completedPages = Object.keys(S.completedPages).length;
  const attempts = Object.values(S.mcqAttempts);
  const correct = attempts.filter(a=>a.correct).length;
  const accuracy = attempts.length? Math.round(correct/attempts.length*100) : 0;
  return {totalPages, completedPages, attempts:attempts.length, correct, accuracy};
}
function renderDashboard(c){
  const st = computeStats();
  c.appendChild(el('h1',{class:'page-title'},'ড্যাশবোর্ড'));
  c.appendChild(el('div',{class:'page-sub'},'আপনার প্রকৃত পড়াশোনার তথ্যের ওপর ভিত্তি করে (পাইলট: লেকচার ০১-০৬)'));

  const stats = [
    ['পৃষ্ঠা সম্পন্ন', `${st.completedPages}/${st.totalPages}`],
    ['সামগ্রিক অগ্রগতি', `${Math.round(st.completedPages/st.totalPages*100)}%`],
    ['সামগ্রিক সঠিকতা', `${st.accuracy}%`],
    ['প্রশ্ন অ্যাটেম্পট', st.attempts],
    ['পড়ার ধারাবাহিকতা (streak)', S.streak.count+' দিন'],
    ['ভুল বইয়ে প্রশ্ন', getMistakes().length],
    ['মোট এক্সপি', S.xp],
    ['বুকমার্ক', S.bookmarks.length],
  ];
  c.appendChild(el('div',{class:'grid grid-4', style:'margin-bottom:22px'}, stats.map(([lbl,num])=>
    el('div',{class:'card stat-card'}, el('div',{class:'num'},num), el('div',{class:'lbl'},lbl))
  )));

  // Recommendations
  const recs = [];
  const dueFlash = dueFlashcards();
  if(dueFlash.length) recs.push(`🧠 আজ ${dueFlash.length}টি ফ্ল্যাশকার্ড রিভিউ করার সময় হয়েছে।`);
  const mistakes = getMistakes();
  if(mistakes.length) recs.push(`❌ আপনার ভুল বইয়ে ${mistakes.length}টি প্রশ্ন অপেক্ষা করছে।`);
  const unattempted = MCQS.filter(m=>!S.mcqAttempts[m.id]);
  if(unattempted.length) recs.push(`🎯 এখনো ${unattempted.length}টি এমসিকিউ অ্যাটেম্পট করা বাকি।`);
  if(st.completedPages < st.totalPages) recs.push(`📖 লেকচার ০১-এর পড়া এখনো সম্পূর্ণ হয়নি — চালিয়ে যান।`);
  if(!recs.length) recs.push('চমৎকার! আপাতত কোনো জরুরি কাজ নেই। নতুন কিছু অনুশীলন করুন।');

  c.appendChild(el('div',{class:'card', style:'margin-bottom:22px'},
    el('h3',{style:'margin-top:0'},'💡 বুদ্ধিদীপ্ত সুপারিশ'),
    el('div',{}, recs.map(r=>el('div',{style:'padding:6px 0'}, r)))
  ));

  // Lecture-wise performance
  const rows = LECTURES.map(l=>{
    const qs = allMcqsForLec(l.id);
    const att = qs.filter(q=>S.mcqAttempts[q.id]);
    const corr = att.filter(q=>S.mcqAttempts[q.id].correct).length;
    const acc = att.length? Math.round(corr/att.length*100):0;
    const pagesDone = Object.keys(S.completedPages).filter(p=>p.startsWith(l.id+'-')).length;
    return {l, pagesDone, attempted:att.length, corr, acc, total:qs.length};
  });
  c.appendChild(el('div',{class:'card'},
    el('h3',{style:'margin-top:0'},'লেকচার-ভিত্তিক পারফরম্যান্স'),
    el('table',{class:'simple'},
      el('tr',{}, el('th',{},'লেকচার'), el('th',{},'পৃষ্ঠা'), el('th',{},'অ্যাটেম্পট'), el('th',{},'সঠিক'), el('th',{},'সঠিকতা')),
      rows.map(r=> el('tr',{},
        el('td',{style:'text-align:left;cursor:pointer;color:var(--maroon)', onclick:()=>navigate('lecture-detail', r.l.id)}, `লেকচার ${r.l.number}: ${r.l.title}`),
        el('td',{}, `${r.pagesDone}/${r.l.pages}`),
        el('td',{}, `${r.attempted}/${r.total}`),
        el('td',{}, r.corr),
        el('td',{}, r.acc+'%')
      ))
    )
  ));
}

function renderLectureDetail(c){
  const lecId = ROUTE_PARAM || 'lec1';
  const lec = LECTURES.find(l=>l.id===lecId);
  const blocks = TOPIC_BLOCKS[lecId] || [];
  c.appendChild(el('div',{class:'reading-toolbar'},
    el('button',{class:'btn sm', onclick:()=>navigate('reading')},'← লেকচার তালিকা'),
    el('span',{style:'font-weight:700'}, `লেকচার ${lec.number}: ${lec.title}`),
    el('div',{style:'flex:1'}),
    el('button',{class:'btn sm', onclick:()=>{S.settings.fontSize=Math.max(13,S.settings.fontSize-1);saveState();render();}},'A-'),
    el('button',{class:'btn sm', onclick:()=>{S.settings.fontSize=Math.min(24,S.settings.fontSize+1);saveState();render();}},'A+'),
    el('button',{class:'btn sm', onclick:()=>{markLectureRead(lecId);}},'✓ সম্পন্ন হিসেবে চিহ্নিত করুন')
  ));

  const body = el('div',{class:'reading-body', style:`font-size:${S.settings.fontSize}px; max-width:${S.settings.readWidth}px; line-height:${S.settings.lineHeight}`});
  blocks.forEach(b=>{
    if(b.type==='para') body.appendChild(el('div',{class:'block block-para'}, b.title?el('h3',{},b.title):null, el('p',{},b.text)));
    else if(b.type==='keyfact') body.appendChild(el('div',{class:'block block-keyfact'}, '💡 ', b.text));
    else if(b.type==='note') body.appendChild(el('div',{class:'block block-note'}, b.text));
    else if(b.type==='warning') body.appendChild(el('div',{class:'block block-warning'}, b.text));
    else if(b.type==='shortcut') body.appendChild(el('div',{class:'block block-keyfact'}, '⚡ ', b.text));
    else if(b.type==='table' && b.ref){
      const L = LECTURES.find(x=>x.id===b.ref);
      body.appendChild(el('div',{class:'block block-table'},
        el('h3',{}, b.title),
        el('table',{},
          el('tr',{}, el('th',{},'নং'), el('th',{},'বিষয়'), el('th',{},'মান')),
          L.syllabus.map(row=> el('tr',{}, el('td',{},row.no), el('td',{style:'text-align:left'},row.text), el('td',{},row.marks))),
          el('tr',{style:'font-weight:700'}, el('td',{},''), el('td',{},'মোট'), el('td',{},L.syllabusTotal))
        )
      ));
    }
  });
  c.appendChild(body);

  // Topic-wise quick links straight into MCQ practice, from within the reading page itself
  c.appendChild(el('h3',{style:'margin-top:30px'},'বিষয়ভিত্তিক এমসিকিউ অনুশীলন'));
  c.appendChild(el('div',{class:'pill-row'}, lec.topics.map(t=>{
    const n = MCQS.filter(m=>m.lec===lecId && m.topic===t).length;
    if(!n) return null;
    return el('button',{class:'pill', onclick:()=>{ mcqFilterState={status:'all', topic:t, section:'all'}; navigate('mcq', {lec:lecId}); }}, `${t} (${n})`);
  })));

  c.appendChild(el('div',{class:'mcq-foot', style:'margin-top:14px'},
    el('button',{class:'btn primary', onclick:()=>{ mcqFilterState={status:'all', topic:'all', section:'all'}; navigate('mcq', {lec:lecId}); }},'🎯 এই লেকচারের সব এমসিকিউ অনুশীলন করুন →'),
    el('button',{class:'btn', onclick:()=>{ mcqFilterState={status:'all', topic:'all', section:'studentWork'}; navigate('mcq', {lec:lecId}); }}, `📗 Student Work (${MCQS.filter(m=>m.lec===lecId && m.section==='studentWork').length}টি) অনুশীলন করুন →`),
    el('button',{class:'btn', onclick:()=>navigate('pyq', {lec:lecId})},'🏆 এই লেকচারের PYQ অনুশীলন করুন →')
  ));

  // PYQ as reference content, shown right inside মূল বিষয়বস্তু
  const pyqs = MCQS.filter(m=>m.lec===lecId && m.year);
  if(pyqs.length){
    c.appendChild(el('h3',{style:'margin-top:30px'},'🏆 পূর্ববর্তী প্রশ্ন (PYQ) — এই লেকচার থেকে'));
    c.appendChild(el('div',{class:'page-sub'}, `এই লেকচারে বিসিএস-সালসহ চিহ্নিত মোট ${pyqs.length}টি প্রশ্ন পাওয়া গেছে। নিচে রেফারেন্স হিসেবে দেখানো হলো — আলাদাভাবে অনুশীলন করতে উপরের বাটন ব্যবহার করুন।`));
    pyqs.forEach(m=>{
      c.appendChild(el('div',{class:'card', style:'margin-bottom:10px'},
        el('div',{}, el('span',{class:'tag year'}, canonicalYear(m.year))),
        el('div',{style:'margin:8px 0;font-weight:600'}, m.q),
        el('div',{style:'font-size:13.5px;color:var(--text2)'}, m.opts.map((o,i)=>`${['ক','খ','গ','ঘ'][i]}. ${o}`).join('   ')),
        el('button',{class:'btn sm', style:'margin-top:8px', onclick:()=>navigate('mcq',{single:m.id})},'এই প্রশ্নটি অনুশীলন করুন')
      ));
    });
  }
}
function markLectureRead(lecId){
  const lec = LECTURES.find(l=>l.id===lecId);
  for(let i=1;i<=lec.pages;i++) S.completedPages[lecId+'-'+i]=true;
  addXP(10);
  saveState(); toast('লেকচার সম্পন্ন হিসেবে চিহ্নিত হয়েছে ✓'); render();
}

/* ============ SEARCH ============ */
function renderSearch(c){
  c.appendChild(el('h1',{class:'page-title'},'খুঁজুন'));
  const input = el('input',{type:'text', placeholder:'বাংলা বা ইংরেজিতে লিখুন...', style:'width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);margin-bottom:18px;font-size:15px;'});
  const results = el('div',{});
  input.addEventListener('input', ()=>doSearch(input.value, results));
  c.appendChild(input);
  c.appendChild(results);
  doSearch('', results);
}
function doSearch(term, container){
  container.innerHTML='';
  if(!term.trim()){
    container.appendChild(el('div',{class:'empty-state'}, el('div',{class:'emoji'},'🔍'), 'বিষয়বস্তু, এমসিকিউ বা নোটে খুঁজতে লিখুন'));
    return;
  }
  const t = term.trim().toLowerCase();
  const hits = [];
  MCQS.forEach(m=>{
    const hay = (m.q+' '+m.opts.join(' ')+' '+(m.sol||'')+' '+m.topic).toLowerCase();
    if(hay.includes(t)) hits.push({type:'এমসিকিউ', title:m.q, action:()=>navigate('mcq',{single:m.id})});
  });
  (TOPIC_BLOCKS.lec1||[]).forEach(b=>{
    const text = (b.text||'')+' '+(b.title||'');
    if(text.toLowerCase().includes(t)) hits.push({type:'বিষয়বস্তু', title:(b.title||b.text).slice(0,80), action:()=>navigate('lecture-detail','lec1')});
  });
  if(!hits.length){ container.appendChild(el('div',{class:'empty-state'}, el('div',{class:'emoji'},'🤷'), 'এই ফিল্টারে কোনো ফলাফল নেই')); return; }
  hits.slice(0,50).forEach(h=>{
    container.appendChild(el('div',{class:'card', style:'margin-bottom:10px;cursor:pointer', onclick:h.action},
      el('span',{class:'tag src', style:'margin-left:8px'}, h.type), h.title, ' — এখানে যান'
    ));
  });
}

/* ============ BOOKMARKS ============ */
function renderBookmarks(c){
  c.appendChild(el('h1',{class:'page-title'},'বুকমার্ক'));
  if(!S.bookmarks.length){ c.appendChild(el('div',{class:'empty-state'}, el('div',{class:'emoji'},'🔖'), 'No bookmarks yet')); return; }
  const groups = {};
  S.bookmarks.forEach(b=>{ (groups[b.type]=groups[b.type]||[]).push(b); });
  Object.keys(groups).forEach(type=>{

let mcqFilterState = {status:'all', topic:'all', section:'all'};
let mcqCursor = 0;
function renderMcqPractice(c){

      ),

        topics.map(t=>el('option',{value:t, selected:mcqFilterState.topic===t}, t==='all'?'সব বিষয়':t))
      ),
      el('button',{class:'pill', onclick:()=>{pool=shuffle(pool); renderMcqCard(c,pool,0,param);}},'🔀 শাফল')
    ));

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function renderMcqCard(holder, pool, idx, param){
  holder.innerHTML='';
  const m = pool[idx];
  const attempt = S.mcqAttempts[m.id];
  const card = el('div',{class:'card mcq-card'});
  card.appendChild(el('div',{class:'mcq-head'},
    el('div',{},
      el('span',{class:'tag src', style:m.generated?'':'display:inline-block'}, m.generated?'🧠 Generated':'📘 উৎস'),
      m.needsVerification? el('span',{class:'tag verify', style:'margin-right:6px'},'⚠️ যাচাই প্রয়োজন'): null,
      m.year? el('span',{class:'tag year', style:'margin-right:6px'}, canonicalYear(m.year)): null,
      el('span',{class:'tag src', style:'margin-right:6px'}, m.topic)
    ),
    el('button',{class:'btn sm', onclick:()=>{toggleBookmark('mcq', m.id, m.q.slice(0,60)); render();}}, bookmarked('mcq',m.id)?'🔖 বুকমার্কড':'🔖 বুকমার্ক')
  ));
  card.appendChild(el('div',{class:'mcq-q'}, `${idx+1}. ${m.q}`));

  const labels=['ক','খ','গ','ঘ'];
  const optWrap = el('div',{class:'mcq-options'});
  m.opts.forEach((opt,i)=>{
    const btn = el('button',{class:'opt-btn'}, `${labels[i]}. ${opt}`);
    if(attempt){
      btn.disabled=true;
      if(i===m.ans) btn.classList.add('correct');
      else if(i===attempt.chosen) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', ()=>{ answerMcq(m, i); renderMcqCard(holder, pool, idx, param); });
    }
    optWrap.appendChild(btn);
  });
  card.appendChild(optWrap);

  if(m.needsVerification && attempt){
    card.appendChild(el('div',{class:'solution-box', style:'border-right:4px solid var(--red)'}, '⚠️ '+m.verifyNote));
  }

  if(attempt){
    card.appendChild(el('div',{class:'solution-box'}, m.sol));
  } else {
    card.appendChild(el('div',{class:'mcq-foot'},
      el('button',{class:'btn sm', onclick:()=>{ revealAnswer(m); renderMcqCard(holder,pool,idx,param); }},'সঠিক উত্তর দেখুন')
    ));
  }

  if(!(pool.length===1)){
    card.appendChild(el('div',{class:'mcq-foot', style:'margin-top:14px'},
      el('button',{class:'btn', disabled:idx===0, onclick:()=>{mcqCursor=idx-1; renderMcqCard(holder,pool,idx-1,param);}},'← আগেরটি'),
      el('span',{style:'flex:1'}),
      el('span',{style:'color:var(--text2);font-size:13px'}, `${idx+1} / ${pool.length}`),
      el('span',{style:'flex:1'}),
      el('button',{class:'btn', disabled:idx===pool.length-1, onclick:()=>{mcqCursor=idx+1; renderMcqCard(holder,pool,idx+1,param);}},'পরেরটি →')
    ));
  }
  holder.appendChild(card);
}
function answerMcq(m, chosenIdx){
  const correct = chosenIdx===m.ans;
  const prev = S.mcqAttempts[m.id];
  S.mcqAttempts[m.id] = {chosen:chosenIdx, correct, ts:Date.now(), wrongCount: (prev?prev.wrongCount:0) + (correct?0:1), revealed:false};
  addXP(correct?4:1);
  saveState();
}
function revealAnswer(m){
  const prev = S.mcqAttempts[m.id];
  S.mcqAttempts[m.id] = {chosen:-1, correct:false, ts:Date.now(), wrongCount:(prev?prev.wrongCount:0)+1, revealed:true};
  saveState();
}

/* ============ FLASHCARDS ============ */
function buildFlashDeck(){
  // derived from key facts in the reading content + MCQ Q/A pairs
  const cards = [];
  (TOPIC_BLOCKS.lec1||[]).forEach((b,i)=>{
    if(b.type==='keyfact'||b.type==='shortcut'){
      cards.push({id:'kf'+i, front: b.type==='shortcut'?'শর্টকাট কী মনে আছে? (গড় একত্রীকরণ সূত্র)':'এই তথ্যটি মনে করার চেষ্টা করুন:', back: b.text});
    }
  });
  MCQS.filter(m=>!m.needsVerification).forEach(m=>{
    cards.push({id:'mc_'+m.id, front:m.q, back:`উত্তর: ${['ক','খ','গ','ঘ'][m.ans]}. ${m.opts[m.ans]}\n\n${m.sol}`});
  });
  return cards;
}
const FLASH_DECK = buildFlashDeck();
function dueFlashcards(){
  const now = Date.now();
  return FLASH_DECK.filter(f=>{
    const srs = S.flashSRS[f.id];
    return !srs || srs.due<=now;
  });
}
let flashIdx=0, flashFlipped=false, flashDeckCache=null;
function renderFlashcards(c){
  const deck = flashDeckCache || (flashDeckCache = dueFlashcards());
  c.appendChild(el('h1',{class:'page-title'},'ফ্ল্যাশকার্ড'));
  c.appendChild(el('div',{class:'page-sub'}, `আজ ${deck.length}টি কার্ড due`));
  if(!deck.length){ c.appendChild(el('div',{class:'empty-state'}, el('div',{class:'emoji'},'✅'), 'আজ কোনো flashcard due নেই')); return; }
  if(flashIdx>=deck.length) flashIdx=0;
  const card = deck[flashIdx];
  const wrap = el('div',{class:'flash-wrap'});
  const fc = el('div',{class:'flashcard', onclick:()=>{flashFlipped=!flashFlipped; renderFlashcards(c.parentElement? c: c);}},
    flashFlipped? card.back : card.front
  );
  fc.style.whiteSpace='pre-wrap';
  wrap.appendChild(el('div',{style:'text-align:left;color:var(--text2);font-size:12px;margin-bottom:6px'}, `${flashIdx+1} / ${deck.length}`));
  wrap.appendChild(fc);
  if(flashFlipped){
    const controls = el('div',{class:'flash-controls'},
      el('button',{style:'background:var(--red)', onclick:()=>rateFlash(card,0,deck)},'🔴 Again'),
      el('button',{style:'background:var(--gold);color:#231a08', onclick:()=>rateFlash(card,1,deck)},'🟡 Hard'),
      el('button',{style:'background:var(--green)', onclick:()=>rateFlash(card,2,deck)},'🟢 Good'),
      el('button',{style:'background:var(--blue)', onclick:()=>rateFlash(card,3,deck)},'🔵 Easy')
    );
    wrap.appendChild(controls);
  } else {
    wrap.appendChild(el('p',{style:'text-align:center;color:var(--text2);font-size:13px;margin-top:10px'},'কার্ডে ক্লিক করে উত্তর দেখুন'));
  }
  // re-render fully to keep it simple
  c.innerHTML=''; c.appendChild(el('h1',{class:'page-title'},'ফ্ল্যাশকার্ড')); c.appendChild(wrap);
}
function rateFlash(card, rating, deck){
  const srs = S.flashSRS[card.id] || {ease:2.5, reps:0, interval:1, wrongCount:0};
  srs.reps++;
  if(rating===0){ srs.interval=1; srs.ease=Math.max(1.3, srs.ease-0.2); srs.wrongCount++; }
  else if(rating===1){ srs.interval=Math.max(1, Math.round(srs.interval*1.2)); srs.ease=Math.max(1.3, srs.ease-0.05); }
  else if(rating===2){ srs.interval=Math.round(srs.interval*srs.ease); }
  else { srs.interval=Math.round(srs.interval*srs.ease*1.3); srs.ease+=0.1; }
  srs.due = Date.now() + srs.interval*86400000;
  srs.last = Date.now();
  S.flashSRS[card.id]=srs;
  addXP(2);
  saveState();
  flashDeckCache = flashDeckCache.filter(f=>f.id!==card.id);
  flashFlipped=false;
  render();
}

  } else {
    wrap.appendChild(el('div',{class:'solution-box', style:'margin-top:10px'}, `সঠিক উত্তর: ${['ক','খ','গ','ঘ'][m.ans]}. ${m.opts[m.ans]}\n\n${m.sol}`));
    wrap.appendChild(el('div',{class:'mcq-foot', style:'margin-top:10px'},

      el('button',{class:'btn', style:'border-color:var(--red)', onclick:()=>{recordRecall(m,false); nextRecall(deck);}},'❌ আমি ভুল করেছি')
    ));
  }

function recordRecall(m, correct){
  const prev = S.qaAttempts[m.id];
  S.qaAttempts[m.id] = {correct, ts:Date.now(), wrongCount:(prev?prev.wrongCount:0)+(correct?0:1)};
  if(!correct){
    const prevM = S.mcqAttempts[m.id];
    S.mcqAttempts[m.id] = Object.assign({}, prevM, {wrongCount:(prevM?prevM.wrongCount:0)+1, ts:Date.now(), correct:false, chosen:-1});
  }
  addXP(correct?3:1); saveState();
}
function nextRecall(deck){ recallIdx=(recallIdx+1)%deck.length; recallRevealed=false; render(); }

/* ============ MOCK TEST ============ */
let mockConfig = null, mockState = null, mockTimerHandle=null;
function renderMock(c){
  if(!mockConfig){ renderMockConfig(c); return; }
  if(mockState && !mockState.submitted){ renderMockRunning(c); return; }
  if(mockState && mockState.submitted){ renderMockResult(c); return; }
}
function renderMockConfig(c){
  c.appendChild(el('h1',{class:'page-title'},'মক টেস্ট'));
  const maxQ = MCQS.length;
  const counts = [10,20,30].filter(n=>n<=maxQ); counts.push(maxQ);
  let count = counts[0], lecFilter='all', timer=0;
  const body = el('div',{class:'card', style:'max-width:500px'});
  body.appendChild(el('div',{}, el('label',{},'প্রশ্ন সংখ্যা'), el('div',{class:'pill-row'},
    counts.map(n=>el('button',{class:'pill'+(count===n?' active':''), onclick:(e)=>{count=n; [...e.target.parentElement.children].forEach(x=>x.classList.remove('active')); e.target.classList.add('active');}}, n))
  )));
  body.appendChild(el('div',{}, el('label',{},'সময়সীমা'), el('div',{class:'pill-row'},
    [['no timer',0],['১০ মিনিট',10],['২০ মিনিট',20],['৩০ মিনিট',30]].map(([lbl,val])=>
      el('button',{class:'pill'+(timer===val?' active':''), onclick:(e)=>{timer=val; [...e.target.parentElement.children].forEach(x=>x.classList.remove('active')); e.target.classList.add('active');}}, lbl)
    )
  )));
  body.appendChild(el('button',{class:'btn primary', style:'margin-top:14px', onclick:()=>{
    mockConfig = {count, timer};
    startMock();
    render();
  }},'মক টেস্ট শুরু করুন'));
  c.appendChild(body);
}
function startMock(){
  const pool = shuffle(MCQS).slice(0, mockConfig.count);
  mockState = {
    questions: pool, answers:{}, marked:{}, current:0, submitted:false,
    startedAt:Date.now(), timeLimitSec: mockConfig.timer*60, elapsed:0
  };
  if(mockConfig.timer>0){
    clearInterval(mockTimerHandle);
    mockTimerHandle = setInterval(()=>{
      mockState.elapsed++;
      if(mockState.elapsed>=mockState.timeLimitSec){ clearInterval(mockTimerHandle); submitMock(); }
      const td = document.getElementById('mock-timer');
      if(td) td.textContent = formatTime(mockState.timeLimitSec-mockState.elapsed);
    },1000);

function submitMock(){
  clearInterval(mockTimerHandle);
  let correct=0, wrong=0, unanswered=0;
  mockState.questions.forEach(q=>{
    const a = mockState.answers[q.id];
    if(a===undefined) unanswered++;
    else if(a===q.ans) correct++;
    else wrong++;
    const prev = S.mcqAttempts[q.id];
    S.mcqAttempts[q.id] = {chosen:a===undefined?-1:a, correct:a===q.ans, ts:Date.now(), wrongCount:(prev?prev.wrongCount:0)+(a===q.ans?0:1)};
  });
  mockState.submitted = true;
  mockState.result = {correct, wrong, unanswered, total:mockState.questions.length, timeTaken: mockConfig.timer>0? mockState.elapsed : Math.round((Date.now()-mockState.startedAt)/1000)};
  S.mockResults.unshift({date:Date.now(), ...mockState.result});
  S.mockResults = S.mockResults.slice(0,20);
  addXP(correct*3);
  saveState();
  render();
}

function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='bcs-math-progress.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      S = Object.assign(structuredClone(DEFAULT_STATE), imported);
      saveState(); toast('ইমপোর্ট সফল হয়েছে'); render();
    }catch(err){ toast('ইমপোর্ট ব্যর্থ হয়েছে — ফাইলটি সঠিক নয়'); }
  };
  reader.readAsText(file);
}

    ['⚠️ উৎস-বিশ্বস্ততা সংক্রান্ত সীমাবদ্ধতা', 'মূল পিডিএফটি একটি লিগ্যাসি বাংলা ফন্টে (SutonnyMJ) লেখা, যা থেকে ইউনিকোড রূপান্তর করতে হয়েছে। প্রায় সব লেখা সঠিকভাবে রূপান্তরিত হলেও, কিছু গাণিতিক এক্সপ্রেশন ও দুই-কলাম লে-আউটের প্রশ্ন-উত্তর মিলকরণে ত্রুটি থাকতে পারে। প্রতিটি এমসিকিউ হাতে-হাতে পুনঃগণনা করে যাচাই করা হয়েছে; যেখানে উৎসের ছাপা উত্তরের সাথে গরমিল পাওয়া গেছে, সেগুলো "⚠️ যাচাই প্রয়োজন" ট্যাগ দিয়ে স্পষ্টভাবে চিহ্নিত করা হয়েছে।']
  ];
  sections.forEach(([t,d])=> c.appendChild(el('div',{class:'card', style:'margin-bottom:12px'}, el('h3',{style:'margin-top:0'},t), el('p',{style:'margin-bottom:0'},d))));
}

/* ============ KEYBOARD SHORTCUTS ============ */
document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(['input','textarea','select'].includes(tag)) return;
  if(e.key==='d'||e.key==='D'){ setTheme(S.settings.theme==='light'?'dark':'light'); }
  if(e.key==='s'||e.key==='S'){ navigate('search'); }
});

/* ============ INIT ============ */
document.documentElement.setAttribute('data-theme', S.settings.theme);
render();
setInterval(()=>{ S.studyTime = (S.studyTime||0) + 1; saveState(); }, 60000);
</script>
</body>
