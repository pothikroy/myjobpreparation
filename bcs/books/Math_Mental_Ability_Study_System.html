  {id:'l4sw1', lec:'lec4', section:'studentWork', sourceNo:'1', topic:"ল.সা.গু ও গ.সা.গু", q:"কোনো লঘিষ্ঠ সংখ্যাকে ২৪ ও ৩৬ দ্বারা ভাগ করলে যথাক্রমে ১৪ ও ২৬ অবশিষ্ট থাকবে?", opts:["৪৮", "৭২", "৬২", "৮৪"], ans:2, sol:"২৪-১৪=১০ এবং ৩৬-২৬=১০ (উভয়ক্ষেত্রে একই পার্থক্য)। সংখ্যাটি = ল.সা.গু(২৪,৩৬) - ১০ = ৭২-১০ = ৬২।", src:true},
  {id:'l4sw2', lec:'lec4', section:'studentWork', sourceNo:'2', topic:"ল.সা.গু ও গ.সা.গু", q:"কোন ক্ষুদ্রতম সংখ্যাকে ৪, ৫, ৬ দ্বারা ভাগ করলে প্রতিক্ষেত্রে ১ অবশিষ্ট থাকে?", opts:["১২১", "১৬৯", "৬১", "১১১"], ans:2, sol:"ল.সা.গু(৪,৫,৬) = ৬০। সংখ্যাটি = ৬০+১ = ৬১।", src:true},
  {id:'l4sw3', lec:'lec4', section:'studentWork', sourceNo:'3', topic:"ল.সা.গু ও গ.সা.গু", q:"কোন বৃহত্তম সংখ্যা দিয়ে ১০২ ও ১৮৬ কে ভাগ করলে প্রত্যেকবার ৬ অবশিষ্ট থাকবে?", opts:["১২", "১৫", "১৬", "২২"], ans:0, sol:"গ.সা.গু(১০২-৬, ১৮৬-৬) = গ.সা.গু(৯৬,১৮০) = ১২।", src:true},
  {id:'l4sw4', lec:'lec4', section:'studentWork', sourceNo:'4', topic:"ল.সা.গু ও গ.সা.গু", q:"একটি স্কুলে ছাত্রদের ড্রিল করবার সময় ৮, ১০ এবং ১২ সারিতে সাজানো যায়। আবার বর্গাকারেও সাজানো যায়। ঐ স্কুলে কমপক্ষে কত ছাত্র আছে?", opts:["৩৬০০", "২৪০০", "১২০০", "৩০০০"], ans:0, sol:"ল.সা.গু(৮,১০,১২) = ১২০ = ২³×৩×৫। পূর্ণবর্গ করতে ২×৩×৫=৩০ দিয়ে গুণ করতে হবে। ১২০×৩০ = ৩৬০০।", year:"১২তম বিসিএস", src:true},
  {id:'l4sw5', lec:'lec4', section:'studentWork', sourceNo:'5', topic:"ল.সা.গু ও গ.সা.গু", q:"সবচেয়ে ছোট কোন সংখ্যা যেটাকে ৩, ৪, ৫, ৬ ও ৭ দিয়ে ভাগ করলে প্রতিক্ষেত্রেই ২ অবশিষ্ট থাকে?", opts:["৪২২", "৮৪২", "২৫২২", "১২৬২"], ans:0, sol:"ল.সা.গু(৩,৪,৫,৬,৭) = ৪২০। সংখ্যাটি = ৪২০+২ = ৪২২।", src:true},
  {id:'l4sw6', lec:'lec4', section:'studentWork', sourceNo:'6', topic:"ল.সা.গু ও গ.সা.গু", q:"তিন অঙ্কের ক্ষুদ্রতম সংখ্যা হতে কোন লঘিষ্ঠ সংখ্যা বিয়োগ করলে বিয়োগফল ৫, ১০ ও ১৫ দ্বারা বিভাজ্য হবে?", opts:["৫", "১০", "১৫", "২০"], ans:1, sol:"তিন অঙ্কের ক্ষুদ্রতম সংখ্যা = ১০০। ল.সা.গু(৫,১০,১৫) = ৩০। ১০০÷৩০ ভাগশেষ ১০, তাই ১০ বিয়োগ করলে (১০০-১০=৯০) ৩০ দ্বারা নিঃশেষে বিভাজ্য হবে।", src:true},
  {id:'l4sw7', lec:'lec4', section:'studentWork', sourceNo:'7', topic:"ল.সা.গু ও গ.সা.গু", q:"কোন ক্ষুদ্রতম সংখ্যার সাথে ২ যোগ করলে যোগফল ৩, ৬, ৯, ১২ এবং ১৫ দ্বারা নিঃশেষে বিভাজ্য হবে?", opts:["১৭৮", "৩৫৮", "৩৬৮", "৭১৮"], ans:0, sol:"ল.সা.গু(৩,৬,৯,১২,১৫) = ১৮০। সংখ্যাটি = ১৮০-২ = ১৭৮।", src:true},
  {id:'l4sw8', lec:'lec4', section:'studentWork', sourceNo:'8', topic:"ল.সা.গু ও গ.সা.গু", q:"১৬ এবং ১০০ এর মধ্যে (এ ২টি সংখ্যাসহ) ৪ দ্বারা বিভাজ্য সংখ্যা কয়টি?", opts:["২২টি", "২৩টি", "২১টি", "২৪টি"], ans:0, sol:"১৬,২০,২৪,...,১০০ — মোট সংখ্যা = (১০০-১৬)/৪ + ১ = ২২টি।", src:true},
  {id:'l4sw9', lec:'lec4', section:'studentWork', sourceNo:'9', topic:"ল.সা.গু ও গ.সা.গু", q:"৯ দিয়ে বিভাজ্য ৩ অঙ্কবিশিষ্ট একটি সংখ্যার প্রথম অঙ্ক ৩। তৃতীয় অঙ্ক ৮ হলে মধ্যম অঙ্কটি কত?", opts:["৬", "৭", "৮", "৯"], ans:1, sol:"সংখ্যাটি ৩_৮ আকারে। ৯ দ্বারা বিভাজ্য হতে অঙ্কের সমষ্টি ৯-এর গুণিতক হতে হবে: ৩+x+৮=১১+x। x=৭ হলে ১৮ (৯-এর গুণিতক)। যাচাই: ৩৭৮÷৯=৪২ (নিঃশেষ)।", src:true},
  {id:'l4sw10', lec:'lec4', section:'studentWork', sourceNo:'10', topic:"ল.সা.গু ও গ.সা.গু", q:"পাঁচ অঙ্কের বৃহত্তম সংখ্যার সাথে কোন ক্ষুদ্রতম সংখ্যা যোগ করলে যোগফল ৬, ৮, ১০ ও ১৪ দ্বারা বিভাজ্য হবে?", opts:["৭০১", "৭০৯", "৮০১", "৮০৩"], ans:2, sol:"পাঁচ অঙ্কের বৃহত্তম সংখ্যা = ৯৯৯৯৯। ল.সা.গু(৬,৮,১০,১৪) = ৮৪০। ৯৯৯৯৯ = ৮৪০×১১৯+৩৯, তাই পরবর্তী গুণিতকে পৌঁছাতে (৮৪০-৩৯) = ৮০১ যোগ করতে হবে।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের চারটি অপশনের মধ্যে দুটি (\"৭০১\", \"৭০৯\") স্পষ্ট দেখা গেলেও বাকি দুটি নিষ্কাশনে অস্পষ্ট ছিল। সমাধানের শেষ ধাপে সঠিক উত্তর ৮০১ স্পষ্টভাবে লেখা আছে (উৎসে \"উত্তর ঃ গ\" ট্যাগসহ), তাই সেটিকেই তৃতীয় অপশন ধরে দেখানো হলো।"},
  {id:'l4sw11', lec:'lec4', section:'studentWork', sourceNo:'11', topic:"ল.সা.গু ও গ.সা.গু", q:"৫৩২০ সংখ্যাটির ভাজকের সংখ্যা বের কর।", opts:["২৫", "৩০", "৩২", "৩৫"], ans:2, sol:"৫৩২০ = ২³×৫×৭×১৯। ভাজকের সংখ্যা = (৩+১)(১+১)(১+১)(১+১) = ৪×২×২×২ = ৩২।", src:true},
  {id:'l4sw12', lec:'lec4', section:'studentWork', sourceNo:'12', topic:"ল.সা.গু ও গ.সা.গু", q:"৫৪০ সংখ্যাটির কয়টি ভাজক আছে?", opts:["২০টি", "২৪টি", "২৭টি", "৩০টি"], ans:1, sol:"৫৪০ = ২²×৩³×৫। ভাজকের সংখ্যা = (২+১)(৩+১)(১+১) = ৩×৪×২ = ২৪টি।", src:true},
  {id:'l4sw13', lec:'lec4', section:'studentWork', sourceNo:'13', topic:"ল.সা.গু ও গ.সা.গু", q:"১০০৮ সংখ্যাটির কতটি ভাজক আছে?", opts:["২০", "২৪", "২৭", "৩০"], ans:3, sol:"১০০৮ = ২⁴×৩²×৭। ভাজকের সংখ্যা = (৪+১)(২+১)(১+১) = ৫×৩×২ = ৩০।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের অপশন তালিকায় শুধু \"২০\" ও \"২৪\" স্পষ্টভাবে দেখা গেছে; বাকি দুটি অপশন নিকটবর্তী প্রশ্নের (৫৪০-এর) অপশনের সাথে সাদৃশ্যপূর্ণ ধরে অনুমান করা হয়েছে। গাণিতিক হিসাব অনুযায়ী সঠিক উত্তর ৩০, তবে এটি ঠিক কোন অপশন-অক্ষরে ছাপা ছিল তা নিশ্চিত নয়।"},
  {id:'l4sw14', lec:'lec4', section:'studentWork', sourceNo:'14', topic:"ল.সা.গু ও গ.সা.গু", q:"৫৬৭২৮ জন সৈন্য থেকে কমপক্ষে কত সৈন্য সরিয়ে দিলে দলকে বর্গাকারে সাজানো যায়?", opts:["৪২ জন", "১৬৮ জন", "৮৪ জন", "১২৬ জন"], ans:2, sol:"√৫৬৭২৮ ≈ ২৩৮.২। ২৩৮² = ৫৬৬৪৪। ৫৬৭২৮-৫৬৬৪৪ = ৮৪ জন সরাতে হবে।", src:true},
  {id:'l4sw15', lec:'lec4', section:'studentWork', sourceNo:'15', topic:"ল.সা.গু ও গ.সা.গু", q:"৪৭০৮০ জন সৈন্য থেকে কমপক্ষে কত সৈন্য সরিয়ে নিলে সৈন্যদলকে বর্গাকারে সাজানো যাবে?", opts:["১২৪ জন", "২২৪ জন", "৪২৪ জন", "২০৪ জন"], ans:2, sol:"√৪৭০৮০ ≈ ২১৬.৯। ২১৬² = ৪৬৬৫৬। ৪৭০৮০-৪৬৬৫৬ = ৪২৪ জন সরাতে হবে।", src:true},
  {id:'l4sw16', lec:'lec4', section:'studentWork', sourceNo:'16', topic:"ল.সা.গু ও গ.সা.গু", q:"পাঁচটি ঘণ্টা একত্রে বেজে যথাক্রমে ৩, ৫, ৭, ৮ ও ১০ সেকেন্ড অন্তর অন্তর বাজতে লাগল। কতক্ষণ পরে ঘণ্টাগুলো পুনরায় একত্রে বাজবে?", opts:["১০ মিনিট", "৯০ সেকেন্ড", "১৪ মিনিট", "২৪০ সেকেন্ড"], ans:2, sol:"ল.সা.গু(৩,৫,৭,৮,১০) = ৮৪০ সেকেন্ড = ১৪ মিনিট।", src:true},
  {id:'l4sw17', lec:'lec4', section:'studentWork', sourceNo:'17', topic:"ল.সা.গু ও গ.সা.গু", q:"দুইটি সংখ্যার ল.সা.গু ২৪ ও গ.সা.গু ৪। সংখ্যা দুইটির বিয়োগফল ৪ হলে সংখ্যা দুইটি কত?", opts:["১০, ৬", "১২, ৮", "১৪, ১০", "১৬, ১২"], ans:1, sol:"সংখ্যা দুটি ৪x ও ৪y ধরে ৪xy=২৪ ⟹ xy=৬, x-y=১। সমাধানে x=৩,y=২। সংখ্যা দুটি = ১২, ৮।", src:true},
  {id:'l4sw18', lec:'lec4', section:'studentWork', sourceNo:'18', topic:"ল.সা.গু ও গ.সা.গু", q:"দুইটি সংখ্যার ল.সা.গু ৬০ এবং গ.সা.গু ৩। একটি সংখ্যা ১৫ হলে অপরটি কত?", opts:["১০", "১২", "১৪", "১৬"], ans:1, sol:"সংখ্যা দুটির গুণফল = ল.সা.গু×গ.সা.গু = ৬০×৩ = ১৮০। অপরটি = ১৮০/১৫ = ১২।", src:true},
  {id:'l4sw19', lec:'lec4', section:'studentWork', sourceNo:'19', topic:"ল.সা.গু ও গ.সা.গু", q:"দুইটি সংখ্যার গুণফল ১৩৭৬। সংখ্যা দুটির ল.সা.গু ৮৬ হলে, গ.সা.গু কত?", opts:["১৬", "১৮", "২২", "২৪"], ans:0, sol:"গ.সা.গু = গুণফল/ল.সা.গু = ১৩৭৬/৮৬ = ১৬।", src:true},
  {id:'l4sw20', lec:'lec4', section:'studentWork', sourceNo:'20', topic:"ল.সা.গু ও গ.সা.গু", q:"দুইটি সংখ্যার অনুপাত ৫ : ৭ এবং তাদের গ.সা.গু ৬ হলে, সংখ্যা দুইটির ল.সা.গু কত?", opts:["২১০", "১৮০", "১৫০", "১২০"], ans:0, sol:"সংখ্যা দুটি ৫×৬=৩০ ও ৭×৬=৪২। ল.সা.গু = ৫×৭×৬ = ২১০।", src:true},
  {id:'l4sw21', lec:'lec4', section:'studentWork', sourceNo:'21', topic:"ল.সা.গু ও গ.সা.গু", q:"দুইটি সংখ্যার অনুপাত ৫ : ৬ এবং তাদের গ.সা.গু ৪ হলে, তাদের ল.সা.গু কত?", opts:["১১০", "১১৫", "১২০", "১২৫"], ans:2, sol:"সংখ্যা দুটি ৫×৪=২০ ও ৬×৪=২৪। ল.সা.গু = ৫×৬×৪ = ১২০।", src:true},
  {id:'l4sw22', lec:'lec4', section:'studentWork', sourceNo:'22', topic:"সুদ-আসল", q:"কোনো আসল ৩ বছরে সুদে-আসলে ৪৬০ টাকা এবং ৫ বছরে সুদে-আসলে ৫০০ টাকা হয়, আসল কত?", opts:["৪০০ টাকা", "৪২৫ টাকা", "৪৩০ টাকা", "৪৫০ টাকা"], ans:0, sol:"২ বছরের সুদ = ৫০০-৪৬০ = ৪০। ১ বছরের সুদ = ২০। ৩ বছরের সুদ = ৬০। আসল = ৪৬০-৬০ = ৪০০ টাকা।", src:true},
  {id:'l4sw23', lec:'lec4', section:'studentWork', sourceNo:'23', topic:"সুদ-আসল", q:"শতকরা বার্ষিক ৬ টাকা হার সুদে, কত টাকা ৭ বছরে সুদে-আসলে ১,০৬৫ টাকা হবে?", opts:["৭০০", "৭৫০", "৮০০", "১০০০"], ans:1, sol:"১০০ টাকার ৭ বছরের সুদ = ৪২ টাকা। সুদ-আসল = ১৪২ টাকা হলে আসল ১০০ টাকা। সুদ-আসল ১০৬৫ টাকা হলে আসল = ১০০×১০৬৫/১৪২ = ৭৫০ টাকা।", src:true},
  {id:'l4sw24', lec:'lec4', section:'studentWork', sourceNo:'24', topic:"সুদ-আসল", q:"সুদের হার ৫.৫% থেকে ২.৫% হওয়ায় এক ব্যক্তির বার্ষিক আয় ১৫ টাকা কমে গেল। তার মূলধন কত?", opts:["৪০০ টাকা", "৭০০ টাকা", "৮০০ টাকা", "৫০০ টাকা"], ans:3, sol:"হার কমেছে ৩%। ৩% কমায় আয় ১৫ টাকা কমেছে, তাই মূলধন = ১৫×১০০/৩ = ৫০০ টাকা।", src:true},
  {id:'l4sw25', lec:'lec4', section:'studentWork', sourceNo:'25', topic:"সুদ-আসল", q:"বার্ষিক ৫% হার সুদে কত টাকার মাসিক সুদ ১০০ টাকা হবে?", opts:["২০,০০০ টাকা", "২২,০০০ টাকা", "২৪,০০০ টাকা", "৩০,০০০ টাকা"], ans:2, sol:"মাসিক সুদ ১০০ টাকা হলে বার্ষিক সুদ = ১২০০ টাকা। মূলধন = ১২০০×১০০/৫ = ২৪,০০০ টাকা।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের সমাধান অংশে পরবর্তী প্রশ্নের (২৬ নং, হার নির্ণয়ের) সমাধান-পদ্ধতি ভুলবশত মিশে গেছে বলে মনে হচ্ছে, ফলে \"উত্তর ঃ ঘ\" ট্যাগটি অবিশ্বস্ত। স্বাধীনভাবে হিসাব করে সঠিক উত্তর ২৪,০০০ টাকা (অপশন \"গ\") দেখানো হলো।"},
  {id:'l4sw26', lec:'lec4', section:'studentWork', sourceNo:'26', topic:"সুদ-আসল", q:"শতকরা বার্ষিক কত হার সুদে ১২০০ টাকার ৩ বৎসরের সুদ ২১৬ টাকা হবে?", opts:["৩%", "৪%", "৫%", "৬%"], ans:3, sol:"হার = ২১৬×১০০/(১২০০×৩) = ৬%।", src:true},
  {id:'l4sw27', lec:'lec4', section:'studentWork', sourceNo:'27', topic:"সুদ-আসল", q:"শতকরা বার্ষিক ৪ টাকা হার সরল মুনাফায় কত টাকা ১৫ বছরে সমৃদ্ধমূল ১০৪০ টাকা হলে, মূলধন কত?", opts:["৫০০ টাকা", "৫৫০ টাকা", "৬০০ টাকা", "৬৫০ টাকা"], ans:3, sol:"১০০ টাকার ১৫ বছরের সুদ = ৬০ টাকা। সুদ-মূল ১৬০ টাকা হলে মূল ১০০ টাকা। সুদ-মূল ১০৪০ টাকা হলে মূল = ১০০×১০৪০/১৬০ = ৬৫০ টাকা।", src:true},
  {id:'l4sw28', lec:'lec4', section:'studentWork', sourceNo:'28', topic:"সুদ-আসল", q:"কোনো মূলধন ৩ বছরের জন্য বিনিয়োগ করা হলো। সুদের হার ৫ টাকা হলে, সুদ আসলের কত অংশ?", opts:["১/৩ অংশ", "১/৪ অংশ", "১/৫ অংশ", "৩/২০ অংশ"], ans:3, sol:"মূলধন ১০০ ধরলে, ৩ বছরের সুদ = ১০০×৫×৩/১০০ = ১৫। সুদ আসলের ১৫/১০০ = ৩/২০ অংশ।", src:true},
  {id:'l4sw29', lec:'lec4', section:'studentWork', sourceNo:'29', topic:"সুদ-আসল", q:"শতকরা ৫ টাকা হার সুদে ২০ বছরে সুদে-আসলে ৪০,০০০ টাকা হয়। মূলধনের পরিমাণ কত ছিল?", opts:["২৫,০০০", "১০,০০০", "১৫,০০০", "২০,০০০"], ans:3, sol:"মূলধন=P হলে ২০ বছরের সুদ = P×৫×২০/১০০ = P। সুদ-আসল = P+P = 2P = ৪০,০০০ ⟹ P = ২০,০০০ টাকা।", src:true},
  {id:'l4sw30', lec:'lec4', section:'studentWork', sourceNo:'30', topic:"সুদ-আসল", q:"২% সুদে ১০০ টাকার ৩ বছরের সুদ অপেক্ষা ৩% সুদে ঐ টাকার ৩ বছরের সুদ কত বেশি হবে?", opts:["১ টাকা", "২ টাকা", "৩ টাকা", "৪ টাকা"], ans:2, sol:"২%-এ সুদ = ১০০×২×৩/১০০ = ৬। ৩%-এ সুদ = ১০০×৩×৩/১০০ = ৯। পার্থক্য = ৯-৬ = ৩ টাকা।", src:true},
  {id:'l4sw31', lec:'lec4', section:'studentWork', sourceNo:'31', topic:"সুদ-আসল", q:"শতকরা বার্ষিক কত হার সুদে ৭০০ টাকার ৫ বছরের সুদ ১০৫ টাকা হবে?", opts:["৩%", "৫%", "৭%", "১০%"], ans:0, sol:"হার = ১০৫×১০০/(৭০০×৫) = ৩%।", src:true},
  {id:'l4sw32', lec:'lec4', section:'studentWork', sourceNo:'32', topic:"সুদ-আসল", q:"৮% সরল মুনাফায় ৬,০০০ টাকা বিনিয়োগে ৫ বছরের যে মুনাফা হয়, কোন সরল হারে বিনিয়োগে ১০,০০০ টাকার ৩ বছরের ঐ মুনাফা হবে?", opts:["১০%", "১২%", "৯%", "৮%"], ans:3, sol:"মুনাফা = ৬০০০×৮×৫/১০০ = ২৪০০ টাকা। হার = ২৪০০×১০০/(১০০০০×৩) = ৮%।", src:true},
  {id:'l4sw33', lec:'lec4', section:'studentWork', sourceNo:'33', topic:"সুদ-আসল", q:"৫০০ টাকার ৪ বছরের সুদ এবং ৬০০ টাকার ৫ বছরের সুদ একত্রে ৭৫০ টাকা হলে সুদের হার কত হবে?", opts:["১০%", "১২%", "১৪%", "১৫%"], ans:3, sol:"হার x% ধরে ৫০০×৪×x/১০০ + ৬০০×৫×x/১০০ = ৭৫০ ⟹ ২০x+৩০x=৭৫০ ⟹ x=১৫%।", src:true},
  {id:'l4sw34', lec:'lec4', section:'studentWork', sourceNo:'34', topic:"সুদ-আসল", q:"বকুল ও মুকুল একই ব্যাংক থেকে একই দিনে ১০% হার সরল মুনাফায় আলাদা আলাদা পরিমাণ অর্থ ধার করে। বকুল ২ বছর পর মুনাফা-আসলে যত টাকা শোধ করে, ৩ বছর পর মুকুল মুনাফা-আসলে তত টাকা শোধ করে। তাদের ঋণের অনুপাত কী ছিল?", opts:["বকুল : মুকুল = ১০ : ৯", "বকুল : মুকুল = ১১ : ১০", "বকুল : মুকুল = ১২ : ১১", "বকুল : মুকুল = ১৩ : ১২"], ans:3, sol:"বকুল=x, মুকুল=y ধরে x×১.২ = y×১.৩ ⟹ x:y = ১৩:১২।", src:true},

  {id:'l4sw36', lec:'lec4', section:'studentWork', sourceNo:'36', topic:"সুদ-আসল", q:"৬,৬৬৬ টাকা বার্ষিক ১০% সুদে কয় বছরে সুদে-আসলে ১৩,৩৩২ টাকা হবে?", opts:["৮", "১০", "১৫", "২০"], ans:1, sol:"সুদ = ১৩৩৩২-৬৬৬৬ = ৬৬৬৬। সময় = ৬৬৬৬×১০০/(৬৬৬৬×১০) = ১০ বছর।", src:true},

  {id:'l4sw38', lec:'lec4', section:'studentWork', sourceNo:'38', topic:"সুদ-আসল", q:"x টাকার x% হার সরল মুনাফায় ৪ বছরে মুনাফা x টাকা হলে x কত?", opts:["৭৫ টাকা", "২৫.৫০ টাকা", "২৫ টাকা", "৫০ টাকা"], ans:2, sol:"x = x×x×৪/১০০ ⟹ ১০০=৪x ⟹ x=২৫।", src:true},
  {id:'l4sw39', lec:'lec4', section:'studentWork', sourceNo:'39', topic:"সুদ-আসল", q:"৮,৮৮৮ টাকা বার্ষিক ১০% সুদে কত বছরে সুদ-আসলে ১৭,৭৭৬ টাকা হবে?", opts:["২০ বছরে", "১০ বছরে", "৩০ বছরে", "২৫ বছরে"], ans:1, sol:"সুদ = ১৭৭৭৬-৮৮৮৮ = ৮৮৮৮। সময় = ৮৮৮৮×১০০/(৮৮৮৮×১০) = ১০ বছর।", src:true},
  {id:'l4sw40', lec:'lec4', section:'studentWork', sourceNo:'40', topic:"সুদ-আসল", q:"বার্ষিক ১২.৫% সরল মুনাফায় কত বছরে মুনাফা আসলের সমান হবে?", opts:["৪ বছরে", "৬ বছরে", "৮ বছরে", "১০ বছরে"], ans:2, sol:"মুনাফা=আসল ধরে: আসল = আসল×১২.৫×t/১০০ ⟹ ১০০=১২.৫t ⟹ t=৮ বছর।", src:true},
  {id:'l4sw41', lec:'lec4', section:'studentWork', sourceNo:'41', topic:"সুদ-আসল", q:"বার্ষিক ৬% সরল মুনাফায় কত টাকা ৪ বছরে মুনাফা ৮০৬০ টাকা হবে?", opts:["৩০,৫৮৩.৫০ টাকা", "৩২,৮৩৫.৩০ টাকা", "৩৩,৩৫৮.৩৩ টাকা", "৩৩,৫৮৩.৩৩ টাকা"], ans:3, sol:"মূলধন = ৮০৬০×১০০/(৬×৪) = ৩৩,৫৮৩.৩৩ টাকা।", src:true},
  {id:'l4sw42', lec:'lec4', section:'studentWork', sourceNo:'42', topic:"সুদ-আসল", q:"শতকরা বার্ষিক কত হার সুদে কোনো নির্দিষ্ট পরিমাণ টাকা ৩ বছরে ৫৬০ টাকা ও ৫ বছরে ৬০০ টাকায় পরিণত হয়?", opts:["৫%", "৪%", "৪.৫%", "৬%"], ans:1, sol:"২ বছরের সুদ = ৬০০-৫৬০ = ৪০। ১ বছরের সুদ = ২০। ৩ বছরের সুদ = ৬০। আসল = ৫৬০-৬০ = ৫০০। হার = ২০×১০০/৫০০ = ৪%।", src:true},
  {id:'l4sw43', lec:'lec4', section:'studentWork', sourceNo:'43', topic:"সুদ-আসল", q:"এক ব্যক্তি ১৫,০০০ টাকা ব্যাংকে জমা করে বছরে সুদ বাবদ ১,২৭৫ টাকা আয় করে। ঐ ব্যাংকে বছরে সুদের হার কত?", opts:["৮%", "৮.২৫%", "৮.৭৫%", "৮.৫০%"], ans:3, sol:"হার = ১২৭৫×১০০/১৫০০০ = ৮.৫%।", src:true},

  {id:'l4sw45', lec:'lec4', section:'studentWork', sourceNo:'45', topic:"ল.সা.গু ও গ.সা.গু", q:"১২৫টি কলম ও ১৪৫টি পেন্সিল কতজনের মধ্যে সমানভাবে ভাগ করে দেয়া যাবে?", opts:["১০", "১৫", "৫", "২০"], ans:2, sol:"গ.সা.গু(১২৫,১৪৫) = ৫। ৫ জনের মধ্যে সমানভাবে ভাগ করে দেওয়া যাবে।", src:true},
  {id:'l4sw46', lec:'lec4', section:'studentWork', sourceNo:'46', topic:"ল.সা.গু ও গ.সা.গু", q:"দুইটি সংখ্যার গ.সা.গু ও ল.সা.গু যথাক্রমে ২ ও ৩৬০। একটি সংখ্যা ১০ হলে, অপর সংখ্যাটি কত?", opts:["২৪", "৪৮", "৬০", "৭২"], ans:3, sol:"সংখ্যা দুটির গুণফল = ল.সা.গু×গ.সা.গু = ৩৬০×২ = ৭২০। অপর সংখ্যাটি = ৭২০/১০ = ৭২।", src:true},
  {id:'l4sw47', lec:'lec4', section:'studentWork', sourceNo:'47', topic:"সুদ-আসল", q:"৬.২৫% হার সুদে কত সময়ে ৯৬ টাকায় সুদ ১৮ টাকা হয়?", opts:["২ বছর", "২.৫ বছর", "৩ বছর", "৪ বছর"], ans:2, sol:"সময় = ১৮×১০০/(৯৬×৬.২৫) = ১৮০০/৬০০ = ৩ বছর।", src:true},

  {id:'l5sw1', lec:'lec5', section:'studentWork', sourceNo:'1', topic:"কাজ-সময়", q:"ক একটি কাজ ১০ দিনে এবং খ ঐ কাজটি ১৫ দিনে করতে পারে। ক ও খ একত্রে ৫ দিন কাজ করার পর খ চলে গেল। বাকি কাজ ক একা কত দিনে করতে পারবে?", opts:["২ দিনে", "১⅔ দিনে", "১দিনে", "১⅓ দিনে"], ans:1, sol:"ক ও খ একত্রে ৫ দিনে করে ৫×(১/১০+১/১৫)=৫/৬ অংশ। বাকি ১/৬ অংশ ক একা করে (১/৬)÷(১/১০)=৫/৩=১⅔ দিনে।", src:true},
  {id:'l5sw2', lec:'lec5', section:'studentWork', sourceNo:'2', topic:"কাজ-সময়", q:"একটি কাজ ১২ জন লোক ৮ দিনে অর্ধেক (১/২ অংশ) শেষ করল, অতিরিক্ত কত জন লোক নিয়োগ করলে কাজটি ১২ দিনে শেষ হবে?", opts:["৩ জন", "৪ জন", "৫ জন", "৬ জন"], ans:1, sol:"১২ জনে অর্ধেক করে ৮ দিনে, তাই পূর্ণ কাজ করতে লাগে ১৬ দিন (১২ জনে)। মোট কাজ = ১২×১৬ = ১৯২ লোক-দিন। ১২ দিনে শেষ করতে লোক লাগবে ১৯২/১২=১৬ জন। অতিরিক্ত = ১৬-১২ = ৪ জন।", src:true},
  {id:'l5sw3', lec:'lec5', section:'studentWork', sourceNo:'3', topic:"কাজ-সময়", q:"কামাল ২০ মিনিটে একটি বাগানের ঘাস কাটতে পারে। জামাল ৩০ মিনিটে ঐ বাগানের ঘাস কাটতে পারে। তারা এক সাথে কাজ করলে ঐ বাগানের ঘাস কাটতে কত সময় লাগবে?", opts:["১০ মিনিট", "১২ মিনিট", "১২.৫ মিনিট", "১৫ মিনিট"], ans:1, sol:"একত্রে হার = ১/২০+১/৩০ = ৫/৬০ = ১/১২। সময় = ১২ মিনিট।", src:true},
  {id:'l5sw4', lec:'lec5', section:'studentWork', sourceNo:'4', topic:"কাজ-সময়", q:"ক একটি কাজ ২০ দিনে করতে পারে এবং খ কাজটি ৩০ দিনে করতে পারে। ক ও খ একত্রে ৮ দিন কাজ করার পর ক চলে গেল। বাকী কাজ খ একা কত দিনে সম্পন্ন করতে পারবে?", opts:["৯ দিনে", "১০ দিনে", "১১ দিনে", "১২ দিনে"], ans:1, sol:"৮ দিনে একত্রে করে ৮×(১/২০+১/৩০)=২/৩ অংশ। বাকি ১/৩ অংশ খ একা করে (১/৩)÷(১/৩০)=১০ দিনে।", src:true},
  {id:'l5sw5', lec:'lec5', section:'studentWork', sourceNo:'5', topic:"কাজ-সময়", q:"১০ জন পুরুষ বা ১৫ জন বালক একটি কাজ ৩০ দিনে করতে পারে। ৭ জন পুরুষ ও ১২ জন বালক ঐ কাজ কত দিনে করতে পারবে?", opts:["২০ দিন", "২১ দিন", "২২ দিন", "২৪ দিন"], ans:0, sol:"১৫ বালক=১০ পুরুষ, তাই ১ বালক=২/৩ পুরুষ। ১২ বালক=৮ পুরুষ-সমতুল্য। মোট=৭+৮=১৫ পুরুষ-সমতুল্য। ১০ পুরুষ×৩০ দিন=৩০০ পুরুষ-দিন। ১৫ পুরুষের জন্য=৩০০/১৫=২০ দিন।", src:true},
  {id:'l5sw6', lec:'lec5', section:'studentWork', sourceNo:'6', topic:"কাজ-সময়", q:"একজন শ্রমিক প্রতিদিন প্রথম ৮ ঘণ্টা কাজের জন্য ঘণ্টায় ১০ টাকা করে এবং পরবর্তী সময়ের জন্য ঘণ্টায় ১৫ টাকা করে মজুরি পায়। দৈনিক ১০ ঘণ্টা কাজ করলে তার ঘণ্টা প্রতি গড় মজুরি কত?", opts:["১১ টাকা", "১২ টাকা", "১২.৫০ টাকা", "১৩ টাকা"], ans:0, sol:"প্রথম ৮ ঘণ্টার মজুরি=৮০ টাকা। পরের ২ ঘণ্টার মজুরি=৩০ টাকা। মোট=১১০ টাকা। গড়=১১০/১০=১১ টাকা।", year:"২৪তম বিসিএস", src:true},
  {id:'l5sw7', lec:'lec5', section:'studentWork', sourceNo:'7', topic:"কাজ-সময়", q:"৩ জন পুরুষ বা ৫ জন বালক একটি কাজ ২০ দিনে করতে পারে। ৪ জন পুরুষ ও ১০ জন বালক ঐ কাজ কত দিনে করতে পারবে?", opts:["৬ দিনে", "৭ দিনে", "৮ দিনে", "৯ দিনে"], ans:0, sol:"৫ বালক=৩ পুরুষ, তাই ১ বালক=৩/৫ পুরুষ। ১০ বালক=৬ পুরুষ-সমতুল্য। মোট=৪+৬=১০ পুরুষ-সমতুল্য। ৩ পুরুষ×২০ দিন=৬০ পুরুষ-দিন। ১০ পুরুষের জন্য=৬০/১০=৬ দিন।", year:"২৪তম বিসিএস", src:true},
  {id:'l5sw8', lec:'lec5', section:'studentWork', sourceNo:'8', topic:"কাজ-সময়", q:"তিনটি মেশিন একটি কাজ যথাক্রমে ৪, ৫ ও ৬ ঘণ্টায় করতে পারে। দুটি দ্রুততম মেশিন সর্বোচ্চ ক্ষমতায় কাজ করে এক ঘণ্টায় কতটুকু কাজ করতে পারবে?", opts:["৯/২০ অংশ", "১৯/৩০ অংশ", "১/১৫ অংশ", "৩/১১ অংশ"], ans:0, sol:"দ্রুততম দুটি মেশিনের হার ১/৪ ও ১/৫। একত্রে ১ ঘণ্টায় = ১/৪+১/৫ = ৯/২০ অংশ।", year:"১৮তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে অপশন তালিকা জটিল ভগ্নাংশ আকারে ঘনভাবে ছাপা থাকায় নিষ্কাশনে সম্পূর্ণ স্পষ্ট ছিল না। সঠিক উত্তর (৯/২০) সমাধানসূত্র থেকে নিশ্চিতভাবে জানা যায়।"},
  {id:'l5sw9', lec:'lec5', section:'studentWork', sourceNo:'9', topic:"কাজ-সময়", q:"৪ জন পুরুষ বা ৮ জন স্ত্রীলোক একটি কাজ ৯ দিনে করতে পারে। ৬ জন পুরুষ এবং ৬ জন স্ত্রীলোক সেই কাজ কত দিনে করতে পারবে?", opts:["৪ দিনে", "৬ দিনে", "৫ দিনে", "৩ দিনে"], ans:0, sol:"৪ পুরুষ=৮ স্ত্রীলোক, তাই ১ পুরুষ=২ স্ত্রীলোক। ৬ পুরুষ=১২ স্ত্রীলোক-সমতুল্য। মোট=১২+৬=১৮ স্ত্রীলোক-সমতুল্য। ৮ স্ত্রীলোক×৯ দিন=৭২ লোক-দিন। ১৮ জনের জন্য=৭২/১৮=৪ দিন।", src:true},
  {id:'l5sw10', lec:'lec5', section:'studentWork', sourceNo:'10', topic:"কাজ-সময়", q:"কয়েকজন শ্রমিক একটি কাজ ১৮ দিনে করে দিবে বলে ঠিক করে। কিন্তু তাদের মধ্যে ৯ জন অনুপস্থিত থাকায় কাজটি ৩৬ দিনে সম্পন্ন হয়। ৩৬ জন শ্রমিক নিযুক্ত হলে কতদিনে কাজটি সম্পন্ন হতো?", opts:["৯ দিনে", "১০ দিনে", "১২ দিনে", "১৮ দিনে"], ans:0, sol:"মূল শ্রমিক সংখ্যা x ধরে: ১৮x=৩৬(x-৯) ⟹ x=১৮। (x-৯)=৯ জনে করে ৩৬ দিনে, তাই মোট কাজ=৯×৩৬=৩২৪ লোক-দিন। ৩৬ জনের জন্য=৩২৪/৩৬=৯ দিন।", src:true},
  {id:'l5sw11', lec:'lec5', section:'studentWork', sourceNo:'11', topic:"কাজ-সময়", q:"মতি ১০ মিনিটে ৫০০ শব্দ এবং বকুল ১০ মিনিটে ৪০০ শব্দ টাইপ করে। দু'জনে এক সাথে কাজ করে ৩৬০০ শব্দ মোট কত মিনিটে টাইপ করবে?", opts:["৪০", "৬০", "৪৫", "৩০"], ans:0, sol:"দুজনে ১০ মিনিটে ৯০০ শব্দ টাইপ করে, অর্থাৎ ৯০ শব্দ/মিনিট। ৩৬০০ শব্দের জন্য সময়=৩৬০০/৯০=৪০ মিনিট।", src:true},
  {id:'l5sw12', lec:'lec5', section:'studentWork', sourceNo:'12', topic:"কাজ-সময়", q:"যে কাজটি ৭০ জন শ্রমিক ৩০ দিনে করতে পারে, সে কাজটি ১২ দিনে সম্পন্ন করতে হলে, কত জন শ্রমিকের প্রয়োজন হবে?", opts:["১৫৫", "১৭৫", "১৯৫", "২১৫"], ans:1, sol:"মোট কাজ=৭০×৩০=২১০০ লোক-দিন। ১২ দিনে=২১০০/১২=১৭৫ জন।", src:true},
  {id:'l5sw13', lec:'lec5', section:'studentWork', sourceNo:'13', topic:"কাজ-সময়", q:"একটি হোটেলে ৫০০ জনের ২০ দিনের খাদ্য মজুদ আছে। ৫ দিন পর ২০০ জন চলে গেলে বাকি খাদ্যে আর কত দিন চলবে?", opts:["২০ দিন", "২২ দিন", "২৪ দিন", "২৫ দিন"], ans:3, sol:"বাকি দিন=১৫, বাকি লোক=৩০০। মোট খাদ্য=৫০০×১৫=৭৫০০ লোক-দিন। ৩০০ জনের জন্য=৭৫০০/৩০০=২৫ দিন।", src:true},
  {id:'l5sw14', lec:'lec5', section:'studentWork', sourceNo:'14', topic:"কাজ-সময়", q:"একজন লোক দৈনিক ১১ ঘণ্টা চলে ৪ দিনে ২৭৫ কিমি পথ অতিক্রম করে। দৈনিক ৮ ঘণ্টা চলে কত দিনে সে ৪৫০ কি.মি. পথ অতিক্রম করবে?", opts:["৬ দিন", "৮ দিন", "৯ দিন", "১০ দিন"], ans:2, sol:"গতিবেগ=২৭৫/(১১×৪)=৬.২৫ কিমি/ঘণ্টা। সময়=৪৫০/(৬.২৫×৮)=৯ দিন।", src:true},
  {id:'l5sw15', lec:'lec5', section:'studentWork', sourceNo:'15', topic:"কাজ-সময়", q:"একটি বাড়ির ছাদের ট্যাঙ্কটি একটি নল দ্বারা ২৫ মিনিটে পূর্ণ হয়। আবার বাড়ির ব্যবহারের জন্য ট্যাঙ্কটির যে নল আছে, তা খুলে দিলে তা ৫০ মিনিটে সম্পূর্ণ খালি হয়ে যায়। ট্যাঙ্কটি অর্ধপূর্ণ থাকা অবস্থায় দুটি নল একসঙ্গে কাজ করলে ট্যাঙ্কটি কতক্ষণে পূর্ণ হবে?", opts:["২৫ মিনিট", "১ ঘণ্টা", "আধ ঘণ্টা", "২০ মিনিট"], ans:0, sol:"দুটি নল একসাথে খুললে পূর্ণ হতে সময় লাগে ১/(১/২৫-১/৫০)=৫০ মিনিট। অর্ধেক পূর্ণ করতে সময় লাগবে ৫০/২=২৫ মিনিট।", src:true},
  {id:'l5sw16', lec:'lec5', section:'studentWork', sourceNo:'16', topic:"কাজ-সময়", q:"একটি পিপার দুটি নল সংযুক্ত আছে। প্রথম নলটি দিয়ে খালি পিপাটি ২০ মিনিটে পূর্ণ হয়, দ্বিতীয় নলটি খুলে দিলে পরিপূর্ণ পিপাটি ৩০ মিনিটে খালি হয়। দুটি নলই একসাথে খুলে দিলে খালি পিপাটি কত সময়ে পূর্ণ হবে?", opts:["৮০ মিনিটে", "৯০ মিনিটে", "৭০ মিনিটে", "৬০ মিনিটে"], ans:3, sol:"একত্রে হার=১/২০-১/৩০=১/৬০। সময়=৬০ মিনিট।", src:true},
  {id:'l5sw17', lec:'lec5', section:'studentWork', sourceNo:'17', topic:"কাজ-সময়", q:"৮ জন লোক একটি কাজ ১২ দিনে করতে পারে। দুজন লোক কমিয়ে দিলে কাজটি সমাধা করতে শতকরা কত দিন বেশি লাগবে?", opts:["২৫%", "৩৩%", "৫০%", "৬৬%"], ans:1, sol:"মোট কাজ=৮×১২=৯৬ লোক-দিন। ৬ জনে সময়=৯৬/৬=১৬ দিন। বৃদ্ধি=৪ দিন। শতকরা বৃদ্ধি=৪/১২×১০০%=৩৩⅓%।", year:"২১তম বিসিএস", src:true},
  {id:'l5sw18', lec:'lec5', section:'studentWork', sourceNo:'18', topic:"কাজ-সময়", q:"একটি কাজ মনির করতে পারে ৬ দিনে এবং জহির করতে পারে ১২ দিনে। তারা কাজটি একত্রে শুরু করে এবং কয়েক দিন পর কাজটি অসমাপ্ত রেখে মনির চলে যায়। বাকি কাজ জহির ৩ দিনে শেষ করে। মোট কত দিনে কাজটি সম্পন্ন হলো?", opts:["৯ দিনে", "৬ দিনে", "৮ দিনে", "৭ দিনে"], ans:1, sol:"জহির ৩ দিনে করে ৩/১২=১/৪ অংশ। বাকি ৩/৪ অংশ একত্রে করেছিল। একত্রে হার=১/৬+১/১২=১/৪। সময়=(৩/৪)÷(১/৪)=৩ দিন। মোট=৩+৩=৬ দিন।", src:true},
  {id:'l5sw19', lec:'lec5', section:'studentWork', sourceNo:'19', topic:"কাজ-সময়", q:"দুই ব্যক্তি একত্রে একটি কাজ ৮ দিনে করতে পারে। প্রথম ব্যক্তি একাকী কাজটি ১২ দিনে করতে পারে। দ্বিতীয় ব্যক্তি একাকী কাজটি কত দিনে করতে পারবে?", opts:["২০ দিনে", "২২ দিনে", "২৪ দিনে", "২৬ দিনে"], ans:2, sol:"দ্বিতীয় ব্যক্তির হার=১/৮-১/১২=১/২৪। সময়=২৪ দিন।", year:"১৬তম বিসিএস", src:true},
  {id:'l5sw20', lec:'lec5', section:'studentWork', sourceNo:'20', topic:"কাজ-সময়", q:"ক, খ ও গ একত্রে ব্যবসা করে ১,২০০ টাকা লাভ করে। যদি ক, খ ও গ এর মূলধনের অনুপাত ২ : ৩ : ৫ হয়, তবে ক কত লভ্যাংশ পাবে?", opts:["৪৮০ টাকা", "১৮০ টাকা", "২৪০ টাকা", "২৮০ টাকা"], ans:2, sol:"ক-এর লভ্যাংশ = ১২০০ × ২/(২+৩+৫) = ২৪০ টাকা।", src:true},
  {id:'l5sw21', lec:'lec5', section:'studentWork', sourceNo:'21', topic:"কাজ-সময়", q:"ক, খ ও গ-এর বেতনের অনুপাত ৭ : ৫ : ৩। ক, খ অপেক্ষা ২২২ টাকা বেশি পেলে, ক-এর বেতন কত?", opts:["৫৫৫ টাকা", "৩৩৩ টাকা", "৭৭৭ টাকা", "৮৮৮ টাকা"], ans:2, sol:"বেতন ৭x, ৫x, ৩x ধরে ৭x-৫x=২২২ ⟹ x=১১১। ক-এর বেতন=৭×১১১=৭৭৭ টাকা।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের বাক্যাংশ (\"খ ও গ অপেক্ষা ২২২ টাকা বেশি\") নিষ্কাশনে অস্পষ্ট ছিল এবং আক্ষরিকভাবে ব্যবহার করলে গাণিতিকভাবে অসঙ্গতি (ঋণাত্মক মান) দেখা দেয়। সমাধানের প্রকৃত ধাপ (৫x-৩x=২২২ ব্যবহার করে x=১১১, উত্তর ৭৭৭) থেকে বোঝা যায় প্রকৃত শর্ত ছিল \"ক, খ অপেক্ষা ২২২ টাকা বেশি\" — সে অনুযায়ী প্রশ্নের বাক্য সংশোধন করে দেখানো হলো।"},
  {id:'l5sw22', lec:'lec5', section:'studentWork', sourceNo:'22', topic:"অনুপাত-সমানুপাত", q:"দুটি সংখ্যা 'a' ও 'b'-র মধ্যে অনুপাত নির্ধারণের একটি সূত্র হলো—", opts:["a/b", "a/(a+b)", "b/(a+b)", "উপরের কোনটিই নয়"], ans:0, sol:"যেহেতু a:b, তাই অনুপাত = a/b।", src:true},
  {id:'l5sw23', lec:'lec5', section:'studentWork', sourceNo:'23', topic:"অনুপাত-সমানুপাত", q:"৪২ গ্রাম ওজনের একটি গয়নায় সোনা ও তামার অনুপাত ৪ : ৩। এতে আর কত গ্রাম সোনা মিশালে সোনা ও তামার অনুপাত ৫ : ৩ হবে?", opts:["৬ গ্রাম", "৮ গ্রাম", "৫ গ্রাম", "১০ গ্রাম"], ans:0, sol:"সোনা=২৪ গ্রাম, তামা=১৮ গ্রাম। (২৪+x):১৮=৫:৩ ⟹ x=৬ গ্রাম।", src:true},
  {id:'l5sw24', lec:'lec5', section:'studentWork', sourceNo:'24', topic:"অনুপাত-সমানুপাত", q:"৩০ লিটার পরিমাণ মিশ্রণে এসিড ও পানির অনুপাত ৭ : ৩। ঐ মিশ্রণে কি পরিমাণ পানি মিশ্রিত করলে এসিড ও পানির অনুপাত ৩ : ৭ হবে?", opts:["৩০ লিটার", "৩৫ লিটার", "৪০ লিটার", "৪৫ লিটার"], ans:2, sol:"এসিড=২১ লিটার, পানি=৯ লিটার। ২১:(৯+x)=৩:৭ ⟹ x=৪০ লিটার।", src:true},
  {id:'l5sw25', lec:'lec5', section:'studentWork', sourceNo:'25', topic:"অনুপাত-সমানুপাত", q:"a : b = 4 : 7 এবং b : c = 5 : 6 হলে, a : b : c = কত?", opts:["4 : 7 : 6", "20 : 35 : 24", "20 : 35 : 42", "24 : 35 : 30"], ans:2, sol:"দুটি অনুপাতকে b-এর মান সমান করতে প্রথমটিকে ৫ ও দ্বিতীয়টিকে ৭ দ্বারা গুণ করে: a:b=20:35, b:c=35:42 ⟹ a:b:c=20:35:42।", src:true},
  {id:'l5sw26', lec:'lec5', section:'studentWork', sourceNo:'26', topic:"অনুপাত-সমানুপাত", q:"৭,৫০০ টাকা ১ : ২ : ৩ : ৪ : ৫ অনুপাতে ভাগ করলে বৃহত্তর ও ক্ষুদ্রতর অংশের পার্থক্য হবে-", opts:["২০০০", "২৫০০", "২৬০০", "৩০০০"], ans:0, sol:"সমষ্টি অনুপাত=১৫। x+2x+3x+4x+5x=7500 ⟹ ১৫x=৭৫০০ ⟹ x=৫০০। বৃহত্তম=৫x=২৫০০, ক্ষুদ্রতম=x=৫০০। পার্থক্য=২০০০।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে অনুপাতটি \"১:২:৪:৫\" (চার অংশ) হিসেবে ছাপা হয়েছে বলে মনে হলেও, সমাধানের ধাপে \"x+2x+3x+4x+5x=7500\" (পাঁচ অংশ, অনুপাত ১:২:৩:৪:৫) ব্যবহৃত হয়েছে। সমাধানের গাণিতিক ধাপকে অনুসরণ করে প্রশ্নের অনুপাতটি সংশোধন করে দেখানো হলো।"},
  {id:'l5sw27', lec:'lec5', section:'studentWork', sourceNo:'27', topic:"অনুপাত-সমানুপাত", q:"একটি গহনার ওজন ৩২ গ্রাম। এতে সোনার পরিমাণ : তামার পরিমাণ = ৩ : ১। এতে কি পরিমাণ সোনা মিশালে অনুপাত ৪ : ১ হবে?", opts:["২ গ্রাম", "৩ গ্রাম", "৬ গ্রাম", "৮ গ্রাম"], ans:3, sol:"সোনা=২৪ গ্রাম, তামা=৮ গ্রাম। (২৪+x):৮=৪:১ ⟹ x=৮ গ্রাম।", src:true},
  {id:'l5sw28', lec:'lec5', section:'studentWork', sourceNo:'28', topic:"অনুপাত-সমানুপাত", q:"x : y = 5 : 6 হলে 3x : 5y = কত?", opts:["2 : 3", "1 : 2", "1 : 3", "1 : 5"], ans:1, sol:"x=5, y=6 ধরে 3x:5y = 15:30 = 1:2।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে প্রশ্নটি \"3x : 5x\" আকারে ছাপা মনে হলেও (যা x-নিরপেক্ষভাবে সর্বদা 3:5 হতো), সমাধানের ধাপে প্রকৃতপক্ষে \"3x : 5y\" হিসাব করা হয়েছে (15:30=1:2)। সমাধানের ধাপ অনুযায়ী প্রশ্নটি সংশোধন করে দেখানো হলো।"},
  {id:'l5sw29', lec:'lec5', section:'studentWork', sourceNo:'29', topic:"অনুপাত-সমানুপাত", q:"৩৪ কিলোগ্রামের বালি ও পাথর টুকরার মিশ্রণে বালির পরিমাণ ২৫%। কত কিলোগ্রাম বালি মিশালে নতুন মিশ্রণে পাথর টুকরার পরিমাণ ৪০% হবে?", opts:["৯.৬", "১১.০", "৪৮.০", "২৯.৭৫"], ans:3, sol:"পাথর=৭৫%=২৫.৫ কেজি (অপরিবর্তিত)। নতুন মিশ্রণে পাথর ৪০% হলে নতুন মোট=২৫.৫/০.৪=৬৩.৭৫ কেজি। নতুন বালি=৬৩.৭৫-২৫.৫=৩৮.২৫। যোগ করতে হবে=৩৮.২৫-৮.৫=২৯.৭৫ কেজি।", src:true},
  {id:'l5sw30', lec:'lec5', section:'studentWork', sourceNo:'30', topic:"অনুপাত-সমানুপাত", q:"দুটি সংখ্যার বিয়োগফল ৬৬। তাদের অনুপাত ৭ : ৫ হলে সংখ্যা দুটি কত?", opts:["৩৪,১০০", "১১০,১৭৬", "২৩১,১৬৫", "২৭,৩৩৬"], ans:2, sol:"সংখ্যা দুটি ৭x ও ৫x ধরে ৭x-৫x=৬৬ ⟹ x=৩৩। সংখ্যা দুটি ২৩১ ও ১৬৫।", src:true},
  {id:'l5sw31', lec:'lec5', section:'studentWork', sourceNo:'31', topic:"অনুপাত-সমানুপাত", q:"কোনো ক্লাসে x সংখ্যক ছাত্রী আছে এবং ছাত্রী ও ছাত্রের অনুপাত a : b। ক্লাসে কতজন ছাত্র আছে?", opts:["x/(ab)", "ax/b", "bx/a", "a/(bx)"], ans:2, sol:"ছাত্রী=ar=x ⟹ r=x/a। ছাত্র=br=bx/a।", src:true},
  {id:'l5sw32', lec:'lec5', section:'studentWork', sourceNo:'32', topic:"অনুপাত-সমানুপাত", q:"দুইটি সংখ্যার যোগফল ১৪৪ এবং তাদের অনুপাত ৬ : ২ হলে সংখ্যাদ্বয় কত?", opts:["৯৮, ৪৬", "১০০, ৪৪", "১০৪, ৪০", "১০৮, ৩৬"], ans:3, sol:"সংখ্যা দুটি ৬x ও ২x ধরে ৮x=১৪৪ ⟹ x=১৮। সংখ্যা দুটি ১০৮ ও ৩৬।", src:true},
  {id:'l5sw33', lec:'lec5', section:'studentWork', sourceNo:'33', topic:"অনুপাত-সমানুপাত", q:"একটি ত্রিভুজের তিনটি কোণের অনুপাত ৩ : ৪ : ৫ হলে, কোণ তিনটি ডিগ্রিতে প্রকাশ কর।", opts:["45°, 60°, 75°", "42°, 56°, 70°", "40°, 60°, 80°", "30°, 60°, 90°"], ans:0, sol:"সমষ্টি অনুপাত=১২। ১২x=১৮০ ⟹ x=১৫। কোণ তিনটি=৪৫°, ৬০°, ৭৫°।", src:true},

  {id:'l5sw41', lec:'lec5', section:'studentWork', sourceNo:'41', topic:"অনুপাত-সমানুপাত", q:"দুই জন ছাত্রের গণিতে প্রাপ্ত নম্বরের অনুপাত ৩ : ১। ১ম ছাত্র ৫ নম্বর কম ও ২য় ছাত্র ১০ নম্বর বেশি পেলে তাদের অনুপাত হবে ২ : ১। তাদের প্রাপ্ত নম্বর হচ্ছে-", opts:["৭৫, ২৫", "৬০, ২০", "২৫, ৭৫", "২০, ৬০"], ans:0, sol:"নম্বর ৩x ও x ধরে (৩x-৫):(x+১০)=২:১ ⟹ x=২৫। নম্বর ৭৫ ও ২৫।", src:true},
  {id:'l5sw42', lec:'lec5', section:'studentWork', sourceNo:'42', topic:"অনুপাত-সমানুপাত", q:"দু'টি বৃত্তের ব্যাসার্ধের অনুপাত ৩ : ২। বৃত্ত দু'টির ক্ষেত্রফলের অনুপাত কত হবে?", opts:["২ : ৩", "৩ : ৪", "৪ : ৯", "৯ : ৪"], ans:3, sol:"ক্ষেত্রফল ∝ ব্যাসার্ধ²। অনুপাত = ৯:৪।", src:true},
  {id:'l5sw43', lec:'lec5', section:'studentWork', sourceNo:'43', topic:"অনুপাত-সমানুপাত", q:"শফির মাসিক আয় ও ব্যয়ের অনুপাত ১১ : ১০ এবং তার মাসিক সঞ্চয় ১,০০০ টাকা হলে তার মাসিক আয় কত টাকা?", opts:["১২,০০০", "১১,০০০", "১১,৫০০", "১২,২০০"], ans:1, sol:"আয়=১১x, ব্যয়=১০x। সঞ্চয়=x=১০০০। আয়=১১×১০০০=১১,০০০ টাকা।", src:true},
  {id:'l5sw44', lec:'lec5', section:'studentWork', sourceNo:'44', topic:"অনুপাত-সমানুপাত", q:"একটি কুকুর একটি খরগোশকে ধরার জন্য দৌড়াচ্ছে। কুকুর যে সময়ে ৪ বার লাফ দেয়, খরগোশ সে সময়ে ৫ বার লাফ দেয়। কিন্তু খরগোশ ৪ লাফে যতদূর যায়, কুকুর ৩ লাফে ততদূর যায়। কুকুর ও খরগোশের গতিবেগের অনুপাত কত?", opts:["১৫:১৬", "২০:১২", "১৬:১৫", "১২:২০"], ans:2, sol:"খরগোশের ৪ লাফ=কুকুরের ৩ লাফ (দূরত্বে)। কুকুরের ৪ লাফের দূরত্ব=খরগোশের ৫×(৩/৪)=১৫/৪ লাফের সমান। গতিবেগের অনুপাত=৪:(১৫/৪)=১৬:১৫।", year:"২১তম বিসিএস", src:true},
  {id:'l5sw45', lec:'lec5', section:'studentWork', sourceNo:'45', topic:"অনুপাত-সমানুপাত", q:"৬০ মিটার উচ্চতা বিশিষ্ট একটি বাঁশকে ৩ : ৭ : ১০ অনুপাতে ভাগ করলে টুকরাগুলোর সাইজ কত?", opts:["৮ মি; ২২ মি; ৩০ মি", "১০ মি; ২০ মি; ৩০ মি", "৯ মি; ২১ মি; ৩০ মি", "১২ মি; ২০ মি; ২৮ মি"], ans:2, sol:"সমষ্টি অনুপাত=২০। ২০x=৬০ ⟹ x=৩। টুকরাগুলো=৯, ২১, ৩০ মিটার।", year:"২২তম বিসিএস", src:true},
  {id:'l5sw46', lec:'lec5', section:'studentWork', sourceNo:'46', topic:"অনুপাত-সমানুপাত", q:"১,০০০ টাকা ক ও খ ১ : ৪ অনুপাতে ভাগ করে নেয়। খ-এর অংশ সে এবং তার মা ও মেয়ের মধ্যে ২ : ১ : ১ অনুপাতে ভাগ করে নেয়। মেয়ে কত টাকা পাবে?", opts:["১০০ টাকা", "৪০০ টাকা", "২০০ টাকা", "৮০০ টাকা"], ans:2, sol:"খ-এর অংশ=১০০০×৪/৫=৮০০ টাকা। এই ৮০০ টাকা ২:১:১ ভাগ করলে মেয়ে পায় ৮০০×১/৪=২০০ টাকা।", year:"২১তম বিসিএস", src:true},
  {id:'l5sw47', lec:'lec5', section:'studentWork', sourceNo:'47', topic:"অনুপাত-সমানুপাত", q:"If two typists can type two pages in two minutes, how many typists will it take to type 18 pages in six minutes?", opts:["3", "6", "9", "18"], ans:1, sol:"2 typists type 2 pages in 2 minutes ⟹ rate = 0.5 page/min/typist. For 18 pages in 6 minutes: need 3 pages/min ÷ 0.5 = 6 typists.", year:"২৮তম বিসিএস", src:true},
  {id:'l5sw48', lec:'lec5', section:'studentWork', sourceNo:'48', topic:"অনুপাত-সমানুপাত", q:"১২ জন শ্রমিক ৩ দিনে ৭২০ টাকা আয় করে। তবে ৯ জন শ্রমিক সমপরিমাণ টাকা আয় করবে-", opts:["৫ দিনে", "৪ দিনে", "৬ দিনে", "৩ দিনে"], ans:1, sol:"কাজের পরিমাণ স্থির ধরে: ১২×৩=৩৬ লোক-দিন সমান আয়ের জন্য প্রয়োজন। ৯ জনের জন্য=৩৬/৯=৪ দিন।", src:true},
  {id:'l5sw49', lec:'lec5', section:'studentWork', sourceNo:'49', topic:"অনুপাত-সমানুপাত", q:"৩ দিনে একটি কাজের ১/২৭ অংশ শেষ হলে (কাজের গতি ত্বরান্বিত, সম্পন্ন কাজ সময়ের ঘনফলের সমানুপাতিক হলে) সম্পূর্ণ কাজ শেষ করতে মোট কতদিন লাগবে?", opts:["৮১ দিন", "৯ দিন", "২৪৩ দিন", "২৭ দিন"], ans:1, sol:"কাজ ∝ t³ ধরে t³/T³=১/২৭ ⟹ t/T=১/৩ ⟹ T=৩t=৯ দিন (t=৩)।", year:"২৫তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের বাক্য নিষ্কাশনে অসম্পূর্ণ ছিল (\"৩ গুণ কাজ করতে কতদিন\" আক্ষরিকভাবে ছাপা, যা সমাধানের সাথে মেলে না)। সমাধানের ধাপ (১/২৭ = (১/৩)³ ব্যবহার করে সম্পূর্ণ কাজের সময় ৯ দিন বের করা) থেকে বোঝা যায় প্রকৃত প্রশ্নটি ত্বরান্বিত-হারে কাজ সম্পন্ন হওয়ার একটি ক্লাসিক সমস্যা। সে অনুযায়ী প্রশ্নের বাক্য পুনর্গঠন করা হয়েছে।"},
  {id:'l5sw50', lec:'lec5', section:'studentWork', sourceNo:'50', topic:"অনুপাত-সমানুপাত", q:"একজন মাঝি স্রোতের অনুকূলে ২ ঘণ্টায় ৫ মাইল যায় এবং ৪ ঘণ্টায় প্রাথমিক অবস্থানে ফিরে আসে। তার মোট ভ্রমণে প্রতি ঘণ্টায় গড় বেগ কত?", opts:["৫/২ মাইল/ঘণ্টা", "৫/৩ মাইল/ঘণ্টা", "১ মাইল/ঘণ্টা", "৩ মাইল/ঘণ্টা"], ans:1, sol:"মোট দূরত্ব=৫+৫=১০ মাইল। মোট সময়=২+৪=৬ ঘণ্টা। গড় বেগ=১০/৬=৫/৩ মাইল/ঘণ্টা।", year:"২৩তম বিসিএস", src:true},

  {id:'l5sw2_1', lec:'lec5', section:'studentWork', sourceNo:'1', topic:"ঐকিক নিয়ম ও বিবিধ", q:"মামুন ২৪০ টাকায় একই রকম কতগুলি কলম কিনে দেখল যে, যদি সে একটি কলম বেশি পেত তাহলে প্রতিটি কলমের মূল্য ১ টাকা কম পড়ত। সে কতগুলি কলম কিনেছিল?", opts:["১৩ টি", "১৪ টি", "১৫ টি", "১৬ টি"], ans:2, sol:"x=কলম সংখ্যা ধরে ২৪০/x - ২৪০/(x+১) = ১ ⟹ x²+x-২৪০=০ ⟹ (x-১৫)(x+১৬)=০ ⟹ x=১৫।", year:"৩৪তম বিসিএস", src:true},
  {id:'l5sw2_2', lec:'lec5', section:'studentWork', sourceNo:'2', topic:"ঐকিক নিয়ম ও বিবিধ", q:"এক ব্যক্তি খাড়া পূর্বদিকে ৫ মাইল দূরত্ব অতিক্রম করে প্রতি মাইল ২ মিনিটে এবং খাড়া পশ্চিম দিকে পূর্বস্থানে ফিরে আসে প্রতি মিনিটে ২ মাইল হিসেবে। ঐ ব্যক্তির গড় গতিবেগ ঘণ্টায় কত মাইল?", opts:["৪৮ মাইল", "৭৫ মাইল", "২৪ মাইল", "৪৫ মাইল"], ans:0, sol:"মোট দূরত্ব=১০ মাইল। যেতে সময়=৫×২=১০ মিনিট। ফিরতে সময়=৫÷২=২.৫ মিনিট। মোট সময়=১২.৫ মিনিট=৫/২৪ ঘণ্টা। গড় বেগ=১০÷(৫/২৪)=৪৮ মাইল/ঘণ্টা।", src:true},
  {id:'l5sw2_3', lec:'lec5', section:'studentWork', sourceNo:'3', topic:"ঐকিক নিয়ম ও বিবিধ", q:"ঘণ্টায় ৪ কিমি. বেগে চললে কোন স্থানে পৌঁছাতে যে সময় লাগে, ঘণ্টায় ৫ কিমি. বেগে চললে তার চেয়ে আধা ঘণ্টা কম সময় লাগে। স্থানটির দূরত্ব কত হবে?", opts:["১৫ কিমি", "১২ কিমি", "৭.৫ কিমি", "১০ কিমি"], ans:3, sol:"দূরত্ব=x ধরে x/৪-x/৫=১/২ ⟹ x/২০=১/২ ⟹ x=১০ কিমি।", src:true},

  {id:'l5sw2_6', lec:'lec5', section:'studentWork', sourceNo:'6', topic:"ঐকিক নিয়ম ও বিবিধ", q:"একটি পাহাড় থেকে নামতে যে সময় লাগে, উঠতে তার তিনগুণ সময় লাগে। পাহাড়ে ওঠা-নামা আর সেই সঙ্গে ২ ঘণ্টা বিশ্রাম নিয়ে যদি সর্বমোট ১৪ ঘণ্টা লাগে তাহলে পাহাড়ের চূড়ায় উঠতে কত সময় লাগবে?", opts:["৭ ঘণ্টা", "৮ ঘণ্টা", "৯ ঘণ্টা", "১১ ঘণ্টা"], ans:2, sol:"ওঠা=x, নামা=x/৩। x+x/৩+২=১৪ ⟹ ৪x/৩=১২ ⟹ x=৯ ঘণ্টা।", src:true},
  {id:'l5sw2_7', lec:'lec5', section:'studentWork', sourceNo:'7', topic:"ঐকিক নিয়ম ও বিবিধ", q:"তিনটি ছাপাখানা একটি কাজ ৬০ মিনিটে করতে পারে। পাঁচটি ছাপাখানা কত মিনিটে করতে পারবে?", opts:["১৫", "২০", "৩০", "৩৬"], ans:3, sol:"সময়=৬০×৩/৫=৩৬ মিনিট।", src:true},
  {id:'l5sw2_8', lec:'lec5', section:'studentWork', sourceNo:'8', topic:"ঐকিক নিয়ম ও বিবিধ", q:"একটি ট্রেন ঘণ্টায় ৪৮ কিমি. বেগে চলে ২২০ মিটার দীর্ঘ একটি প্ল্যাটফর্ম ৩০ সেকেন্ডে অতিক্রম করে, ট্রেনটির দৈর্ঘ্য কত?", opts:["১৪০ মিটার", "১৬০ মিটার", "১৮০ মিটার", "২০০ মিটার"], ans:2, sol:"গতিবেগ=৪৮কিমি/ঘ=১৩.৩৩ মি/সে। ৩০ সেকেন্ডে দূরত্ব=৪০০ মিটার। ট্রেনের দৈর্ঘ্য=৪০০-২২০=১৮০ মিটার।", src:true},

  {id:'l5sw2_20', lec:'lec5', section:'studentWork', sourceNo:'20', topic:"ঐকিক নিয়ম ও বিবিধ", q:"কোনো অফিসে উপস্থিতির দিন ২০.০০ টাকা পাওয়া আর অনুপস্থিতির দিন ৫.০০ টাকা জরিমানা দেয়ার শর্তে এক ব্যক্তি ১৯৯৬ সনের ফেব্রুয়ারি মাসে ৩৮০ টাকা বেতন পেল। লোকটি ঐ অফিসে কয়দিন উপস্থিত ছিল?", opts:["১৮ দিন", "২০ দিন", "২১ দিন", "২৪ দিন"], ans:2, sol:"১৯৯৬ অধিবর্ষ, ফেব্রুয়ারি ২৯ দিন। উপস্থিত=x, অনুপস্থিত=(২৯-x)। ২০x-৫(২৯-x)=৩৮০ ⟹ ২৫x=৫২৫ ⟹ x=২১ দিন।", src:true},

  {id:'l5sw2_26', lec:'lec5', section:'studentWork', sourceNo:'26', topic:"ঐকিক নিয়ম ও বিবিধ", q:"১৯৬৬ সালে বাংলাদেশের কোনো একটি শহরে রেডিওর সংখ্যা টেলিভিশনের সংখ্যার দ্বিগুণ ছিল। ১৯৭০ সালের মধ্যে ঐ শহরে আরো ২০০টি টেলিভিশন কেনা হলো। তবুও রেডিওর সংখ্যা টেলিভিশনের চেয়ে ৪০টি বেশি। রেডিওর সংখ্যা কত?", opts:["২৪০", "১২০", "৪৮০", "৮০"], ans:2, sol:"টিভি১৯৬৬=y, রেডিও=২y (অপরিবর্তিত)। টিভি১৯৭০=y+২০০। শর্তমতে ২y=(y+২০০)+৪০ ⟹ y=২৪০। রেডিও=২×২৪০=৪৮০।", src:true},

  {id:'l5sw2_28', lec:'lec5', section:'studentWork', sourceNo:'28', topic:"ঐকিক নিয়ম ও বিবিধ", q:"পানি ভর্তি একটি বালতির ওজন ১২ কেজি। বালতির অর্ধেক পানি ভর্তি হলে তার ওজন ৭ কেজি। খালি বালতির ওজন কত?", opts:["২ কেজি", "৫ কেজি", "৪ কেজি", "৭ কেজি"], ans:0, sol:"অর্ধেক পানির ওজন=১২-৭=৫ কেজি। সম্পূর্ণ পানির ওজন=১০ কেজি। খালি বালতির ওজন=১২-১০=২ কেজি।", src:true},
  {id:'l5sw2_29', lec:'lec5', section:'studentWork', sourceNo:'29', topic:"ঐকিক নিয়ম ও বিবিধ", q:"১৫ টি ভেড়ার মূল্য ৫ টি গরুর মূল্যের সমান। ২টি গরুর মূল্য ৩,০০০ টাকা হলে ৩টি ভেড়ার মূল্য কত?", opts:["৫০০ টাকা", "১,৫০০ টাকা", "১,০০০ টাকা", "২,০০০ টাকা"], ans:1, sol:"১ গরু=১৫০০ টাকা। ৫ গরু=৭৫০০ টাকা=১৫ ভেড়ার মূল্য। ১ ভেড়া=৫০০ টাকা। ৩ ভেড়া=১৫০০ টাকা।", src:true},
  {id:'l5sw2_30', lec:'lec5', section:'studentWork', sourceNo:'30', topic:"ঐকিক নিয়ম ও বিবিধ", q:"৫০০ গ্রাম ১ কুইন্টালের কত অংশ?", opts:["১/৪০", "১/৪", "১/১০০", "১/২০০"], ans:3, sol:"১ কুইন্টাল=১০০ কেজি=১,০০,০০০ গ্রাম। ৫০০/১,০০,০০০ = ১/২০০ অংশ।", src:true},

  {id:'l5sw2_32', lec:'lec5', section:'studentWork', sourceNo:'32', topic:"ঐকিক নিয়ম ও বিবিধ", q:"১০০ গজ লম্বা একটি সড়কের উভয় পার্শ্বে ১৫ ফুট অন্তর বৃক্ষচারা রোপণ করতে কতটি বৃক্ষচারার প্রয়োজন?", opts:["১২", "২১", "৪০", "৪২"], ans:3, sol:"১০০ গজ=৩০০ ফুট। এক পাশে=৩০০/১৫+১=২১টি। উভয় পাশে=২১×২=৪২টি।", src:true},
  {id:'l5sw2_33', lec:'lec5', section:'studentWork', sourceNo:'33', topic:"ঐকিক নিয়ম ও বিবিধ", q:"একটি নতুন বাইসাইকেলের দাম ২৫০০ টাকা। প্রতি বছর শেষে সাইকেলটির মূল্য পূর্বতন মূল্যের ৪/৫ এ দাঁড়ায়। ৩য় বছর শেষে সাইকেলটির মূল্য কত হবে?", opts:["১,০০০ টাকা", "১,২০০ টাকা", "১,২৮০ টাকা", "১,৩৪০ টাকা"], ans:2, sol:"২৫০০×(৪/৫)³ = ২৫০০×০.৮×০.৮×০.৮ = ১২৮০ টাকা।", src:true},

  {id:'l5sw2_35', lec:'lec5', section:'studentWork', sourceNo:'35', topic:"ঐকিক নিয়ম ও বিবিধ", q:"৫০ কে এমন দুই অংশে বিভক্ত করুন যেন, এক অংশের দ্বিগুণ ৭৫ অপেক্ষা যত কম, অপর অংশের তিনগুণ ৪৫ অপেক্ষা তত বেশি হয়?", opts:["৪০, ১০", "৩০, ২০", "৪৫, ৫", "৩৫, ১৫"], ans:1, sol:"একটি অংশ=x, অপরটি=(৫০-x)। ৭৫-২x=৩(৫০-x)-৪৫ ⟹ x=৩০। অংশ দুটি ৩০ ও ২০।", src:true},
  {id:'l5sw2_36', lec:'lec5', section:'studentWork', sourceNo:'36', topic:"ঐকিক নিয়ম ও বিবিধ", q:"বনভোজনে যাওয়ার জন্য ৫,৭০০ টাকায় একটি বাস ভাড়া করা হয় এই শর্তে যে, প্রত্যেক যাত্রী সমান ভাড়া বহন করবে। ৫ জন যাত্রী না আসায় মাথাপিছু ভাড়া ৩ টাকা বৃদ্ধি পেল। বাসে কতজন যাত্রী ছিল?", opts:["৮০", "৮৫", "৯৫", "১০০"], ans:2, sol:"৫৭০০/(x-৫) - ৫৭০০/x = ৩। সমাধানে x=৯৫ (ঋণাত্মক মান বাদ দিয়ে)।", src:true},
  {id:'l5sw2_37', lec:'lec5', section:'studentWork', sourceNo:'37', topic:"ঐকিক নিয়ম ও বিবিধ", q:"(০.৭² − ০.৩²) ÷ (০.৭ + ০.৩) = কত?", opts:["০.৭", "০.৩", "০.৪", "০.৫"], ans:2, sol:"(a²-b²)/(a+b)=(a-b)। =০.৭-০.৩=০.৪।", src:true},
  {id:'l5sw2_38', lec:'lec5', section:'studentWork', sourceNo:'38', topic:"ঐকিক নিয়ম ও বিবিধ", q:"চাল ভর্তি একটি পাত্রের ওজন খালি পাত্রটির ওজনের ৭ গুণ। ঐরূপ ৭টি খালি পাত্রের ওজন ১৪ কেজি হলে প্রতিটি পাত্রে কত কেজি চাল ধরে?", opts:["১২ কেজি", "১৩ কেজি", "১৪ কেজি", "১৫ কেজি"], ans:0, sol:"খালি পাত্র=১৪/৭=২ কেজি। চালভর্তি পাত্র=৭×২=১৪ কেজি। শুধু চাল=১৪-২=১২ কেজি।", src:true},

  {id:'l5sw2_41', lec:'lec5', section:'studentWork', sourceNo:'41', topic:"ঐকিক নিয়ম ও বিবিধ", q:"কোনো বইয়ের দোকানে প্রতিটি নোট বই ৫৯ টাকা দরে বিক্রয় হয়। বিশেষ হ্রাসকৃত মূল্যে কেবল শুক্রবার ২টি বই ৯৯ টাকায় কেনা যায়। শুক্রবার ১০টি নোটবই কিনলে ক্রেতার কত খরচ বেঁচে যাবে?", opts:["৮৫ টাকা", "৯৫ টাকা", "১১০ টাকা", "১১৫ টাকা"], ans:1, sol:"সাধারণ দামে ১০টি=৫৯০ টাকা। শুক্রবারের দামে ১০টি=৫×৯৯=৪৯৫ টাকা। সাশ্রয়=৫৯০-৪৯৫=৯৫ টাকা।", src:true},

  {id:'l5sw2_43', lec:'lec5', section:'studentWork', sourceNo:'43', topic:"ঐকিক নিয়ম ও বিবিধ", q:"একটি বড় বাক্সের মধ্যে ৪টি বাক্স আছে এবং তার প্রত্যেকটির ভেতর ৩টি করে ছোট বাক্স আছে। মোট বাক্সের সংখ্যা কত?", opts:["১৩ টি", "১৭ টি", "২১ টি", "২৫ টি"], ans:1, sol:"বড়=১, মাঝারি=৪, ছোট=৪×৩=১২। মোট=১+৪+১২=১৭টি।", src:true},
  {id:'l5sw2_44', lec:'lec5', section:'studentWork', sourceNo:'44', topic:"ঐকিক নিয়ম ও বিবিধ", q:"করিম ২ টাকা ও ৩ টাকা মানের সমান সংখ্যক স্ট্যাম্প কিনেছে। যদি স্ট্যাম্প ক্রয়ের মোট খরচ ১০০ টাকা হয় তাহলে করিম মোট কতটি স্ট্যাম্প কিনেছিল?", opts:["২৫", "৩৪", "৪০", "৪৬"], ans:2, sol:"২x+৩x=১০০ ⟹ x=২০। মোট স্ট্যাম্প=২x=৪০টি।", src:true},

  {id:'l5sw2_49', lec:'lec5', section:'studentWork', sourceNo:'49', topic:"ঐকিক নিয়ম ও বিবিধ", q:"ঢাকা ও চট্টগ্রাম এই দুই রেল স্টেশন থেকে প্রতি ঘণ্টায় একটা ট্রেন এক স্টেশন থেকে অন্য স্টেশনের দিকে যাত্রা করে। সব ট্রেনগুলোই সমান গতিতে চলে এবং গন্তব্যস্থলে পৌঁছাতে প্রত্যেক ট্রেনের ৫ ঘণ্টা সময় লাগে। এক স্টেশন থেকে যাত্রা করে অন্য স্টেশনে পৌঁছানো পর্যন্ত একটা ট্রেন কয়টা ট্রেনের দেখা পাবে?", opts:["৮", "১০", "১১", "১২"], ans:1, sol:"৫টি ট্রেন আগে থেকেই পথে ছিল, আর যাত্রাকালীন ৫ ঘণ্টায় আরও ৫টি নতুন ট্রেন ছাড়বে। মোট দেখা হবে ৫+৫=১০টি ট্রেনের সাথে।", year:"১৭তম বিসিএস", src:true},
  {id:'l5sw2_50', lec:'lec5', section:'studentWork', sourceNo:'50', topic:"ঐকিক নিয়ম ও বিবিধ", q:"একটি শ্রেণিতে প্রতি বেঞ্চে ৪ জন করে ছাত্র বসলে ৩ খান বেঞ্চ খালি থাকে। কিন্তু প্রতি বেঞ্চে ৩ জন করে বসলে ৬ জন ছাত্রকে দাঁড়িয়ে থাকতে হয়। ঐ শ্রেণির ছাত্র সংখ্যা কত?", opts:["৫৫ জন", "৬০ জন", "৬৫ জন", "৭০ জন"], ans:1, sol:"বেঞ্চ সংখ্যা=b ধরে ৪(b-৩)=৩b+৬ ⟹ b=১৮। ছাত্র সংখ্যা=৪×১৫=৬০ জন।", year:"২৮তম বিসিএস", src:true},

  {id:'l5sw2_54', lec:'lec5', section:'studentWork', sourceNo:'54', topic:"ঐকিক নিয়ম ও বিবিধ", q:"দুটি লম্বালম্বি (পরস্পর লম্ব) শক্তির পরিমাণ ৫N এবং ৪N, তাদের লব্ধির পরিমাণ কত?", opts:["৩N", "১১N", "√৪১ N", "১N"], ans:2, sol:"লব্ধি = √(৫²+৪²) = √(২৫+১৬) = √৪১ N।", year:"১৭তম বিসিএস", src:true},

  {id:'l5sw2_57', lec:'lec5', section:'studentWork', sourceNo:'57', topic:"ঐকিক নিয়ম ও বিবিধ", q:"কোনো পরীক্ষায় একজন ছাত্র প্রথম ২০টি প্রশ্নের মধ্যে ১৫টি প্রশ্নের শুদ্ধ উত্তর দেয় এবং বাকি প্রশ্নগুলোর এক-চতুর্থাংশ শুদ্ধ উত্তর দিতে পারে। এভাবে সে যদি ৫০% প্রশ্নের শুদ্ধ উত্তর দিয়ে থাকে, তবে ঐ পরীক্ষায় প্রশ্নের সংখ্যা কত ছিল?", opts:["২০ টি", "৩০ টি", "৪০ টি", "৫০ টি"], ans:2, sol:"মোট প্রশ্ন=n। সঠিক=১৫+(n-২০)/৪=n/২। সমাধানে n=৪০।", year:"১৩তম বিসিএস", src:true},
  {id:'l5sw2_58', lec:'lec5', section:'studentWork', sourceNo:'58', topic:"ঐকিক নিয়ম ও বিবিধ", q:"একটি গোল মুদ্রা টেবিলে রাখা হলো। এই মুদ্রার চারপাশে একই আকৃতির মুদ্রা কতটি রাখা যেতে পারে যেন তারা মাঝের মুদ্রাটিকে এবং তাদের দু'পাশের রাখা দু'টি মুদ্রাকে স্পর্শ করে?", opts:["৪", "৬", "৮", "১০"], ans:1, sol:"একটি বৃত্তাকার মুদ্রার চারপাশে একই আকৃতির ৬টি মুদ্রা এমনভাবে বসানো যায় যাতে প্রতিটি মাঝেরটিকে ও পাশেরগুলোকে স্পর্শ করে।", year:"১৩তম বিসিএস", src:true},
  {id:'l5sw2_59', lec:'lec5', section:'studentWork', sourceNo:'59', topic:"ঐকিক নিয়ম ও বিবিধ", q:"[2⁻¹ − 3⁻¹(2⁻¹ − 3⁻¹)⁻¹]⁻¹ = কত?", opts:["৫", "১/৫", "−৫", "−১/৫"], ans:1, sol:"ধাপে ধাপে সরলীকরণ করে ফলাফল ১/৫ পাওয়া যায়।", year:"১৩তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই বীজগাণিতিক এক্সপ্রেশনের মধ্যবর্তী ধাপগুলো জটিল সূচক-বিন্যাসের কারণে নিষ্কাশনে সম্পূর্ণ স্পষ্ট ছিল না। চূড়ান্ত উত্তর (১/৫ = খ) উৎসে স্পষ্টভাবে লেখা আছে বলে সেটিই দেখানো হলো, তবে মধ্যবর্তী ধাপ স্বাধীনভাবে পুনর্গণনা করে নিশ্চিত করা যায়নি।"},
  {id:'l5sw2_60', lec:'lec5', section:'studentWork', sourceNo:'60', topic:"ঐকিক নিয়ম ও বিবিধ", q:"বালক-বালিকার একটি দল নিম্নরূপ খেলা হচ্ছে। প্রথম বালক ৫ জন বালিকার সঙ্গে খেলছে, দ্বিতীয় বালক ৬ জন বালিকার সঙ্গে খেলছে, এভাবে শেষ বালক সব কটি বালিকার সঙ্গে খেলছে। যদি b বালকের সংখ্যা এবং g বালিকার সংখ্যা প্রকাশ করে, তবে b এর মান কত?", opts:["b = g", "b = g − 4", "b = −g/4", "b = −g/5"], ans:1, sol:"প্রতিটি ধাপে বালিকার সংখ্যা বালকের ক্রম অনুযায়ী ৪+ক্রম হয়, শেষ বালক সব g জনের সাথে খেলে, তাই b+৪=g অর্থাৎ b=g-৪।", year:"১৩তম বিসিএস", src:true},
  {id:'l5sw2_61', lec:'lec5', section:'studentWork', sourceNo:'61', topic:"ঐকিক নিয়ম ও বিবিধ", q:"২০৫৭৩.৪ মিলিগ্রামে কত কিলোগ্রাম?", opts:["২.০৫৭৩৪", "০.২০৫৭৩৪", "০.০২০৫৭৩৪", "২০.৫৭৩৪০"], ans:2, sol:"২০৫৭৩.৪ মিলিগ্রাম = ২০.৫৭৩৪ গ্রাম = ০.০২০৫৭৩৪ কিলোগ্রাম।", year:"১২তম বিসিএস", src:true},
  {id:'l5sw2_62', lec:'lec5', section:'studentWork', sourceNo:'62', topic:"ঐকিক নিয়ম ও বিবিধ", q:"একটি বন্দুকের গুলি প্রতি সেকেন্ডে ১,৫৪০ ফুট গতিবেগে লক্ষ্যভেদ করে। এক ব্যক্তি গুলি ছোঁড়ার ৩ সেকেন্ডে শব্দ শুনতে পায়। শব্দের গতি প্রতি সেকেন্ডে ১১০০ ফুট। লক্ষ্য বস্তুর দূরত্ব কত?", opts:["২০২৫ ফুট", "১৯২৫ ফুট", "১৯৭৫ ফুট", "১৮৭৫ ফুট"], ans:1, sol:"দূরত্ব = (বেগদ্বয়ের গুণফল × মোট সময়) ÷ (বেগদ্বয়ের সমষ্টি) = (১৫৪০×১১০০×৩)/(১৫৪০+১১০০) = ১৯২৫ ফুট।", year:"১১তম বিসিএস", src:true},
  {id:'l5sw2_63', lec:'lec5', section:'studentWork', sourceNo:'63', topic:"ঐকিক নিয়ম ও বিবিধ", q:"একটা থলিয়ায় ১ টাকা, ৫০ পয়সা, ২৫ পয়সা ও ১০ পয়সার সমান সংখ্যক মুদ্রা আছে এবং সর্বসমেত ৫৫.৫০ টাকা আছে। প্রত্যেক প্রকার মুদ্রার সংখ্যা কত?", opts:["৩০", "২৫", "৩৫", "৪০"], ans:0, sol:"প্রতি প্রকার মুদ্রা=x টি। ১x+০.৫x+০.২৫x+০.১x=৫৫.৫০ ⟹ ১.৮৫x=৫৫.৫০ ⟹ x=৩০।", src:true},
  {id:'l5sw2_64', lec:'lec5', section:'studentWork', sourceNo:'64', topic:"ঐকিক নিয়ম ও বিবিধ", q:"একটি ক্রিকেট দলের যতজন স্ট্যাম্প আউট হলো তার দেড়গুণ কট আউট হলো এবং মোট উইকেটের অর্ধেক বোল্ড আউট হলো (মোট উইকেট ১০টি)। এই দলের কতজন কট আউট হলো?", opts:["৪ জন", "৩ জন", "২ জন", "৫ জন"], ans:1, sol:"স্ট্যাম্প=x, কট=১.৫x, বোল্ড=৫। x+১.৫x+৫=১০ ⟹ ২.৫x=৫ ⟹ x=২। কট=১.৫×২=৩ জন।", year:"১১তম বিসিএস", src:true},
  {id:'l5sw2_65', lec:'lec5', section:'studentWork', sourceNo:'65', topic:"ঐকিক নিয়ম ও বিবিধ", q:"কোনো স্থানে যত লোক ছিল তারা প্রত্যেকে তত ৫ পয়সা করে দেওয়ায় ৩১.২৫ টাকা হলো। ঐ স্থানে কত লোক ছিল?", opts:["২৫ জন", "৩০ জন", "৪০ জন", "৫০ জন"], ans:0, sol:"৫x²=৩১২৫ পয়সা ⟹ x²=৬২৫ ⟹ x=২৫।", src:true},
  {id:'l5sw2_66', lec:'lec5', section:'studentWork', sourceNo:'66', topic:"ঐকিক নিয়ম ও বিবিধ", q:"ঢাকা থেকে চট্টগ্রামের দূরত্ব ১৮৫ মাইল। একটি বাস ২ ঘণ্টায় প্রথম ৮৫ মাইল যাওয়ার পর পরবর্তী ১০০ মাইল কত সময়ে গেলে গড়ে ঘণ্টায় ৫০ মাইল যাওয়া হবে?", opts:["১০০ মিনিট", "১০২ মিনিট", "১১০ মিনিট", "১১২ মিনিট"], ans:1, sol:"মোট সময় প্রয়োজন=১৮৫/৫০=৩.৭ ঘণ্টা। প্রথম ২ ঘণ্টা বাদে বাকি সময়=১.৭ ঘণ্টা=১০২ মিনিট।", year:"২৪তম বিসিএস", src:true},
  {id:'l5sw2_67', lec:'lec5', section:'studentWork', sourceNo:'67', topic:"ঐকিক নিয়ম ও বিবিধ", q:"এক ব্যক্তি স্রোতের অনুকূলে দাঁড় বেয়ে ৫/২ ঘণ্টায় কোন স্থানে পৌঁছাল এবং স্রোতের প্রতিকূলে দাঁড় বেয়ে পুনরায় সে স্থানে ১৫/৪ ঘণ্টায় ফিরে এলো। দাঁড়ের বেগ স্রোতের বেগের কত গুণ?", opts:["২ গুণ", "৩ গুণ", "৪ গুণ", "৫ গুণ"], ans:3, sol:"নৌকার বেগ=a, স্রোতের বেগ=b, দূরত্ব=x। ২x/৫=a+b, ৪x/১৫=a-b। যোগ-বিয়োগ করে a=x/৩, b=x/১৫। a/b=৫ গুণ।", src:true},

  {id:'l6cd2', lec:'lec6', section:'contentDiscussion', sourceNo:'2', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"x² + y² = 8 এবং xy = 7 হলে (x + y)² এর মান কত?", opts:["১৪", "১৬", "২২", "৩০"], ans:2, sol:"(x+y)² = x²+y²+2xy = ৮+১৪ = ২২।", year:"৪৩তম বিসিএস", generated:true},
  {id:'l6cd3', lec:'lec6', section:'contentDiscussion', sourceNo:'3', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"a + b = 7 এবং a² + b² = 25 হলে, ab এর মান কত?", opts:["12", "10", "6", "কোনোটিই নয়"], ans:0, sol:"(a+b)² = a²+b²+2ab ⟹ 49=25+2ab ⟹ ab=12।", year:"৪১তম বিসিএস", generated:true},
  {id:'l6cd4', lec:'lec6', section:'contentDiscussion', sourceNo:'4', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"a + 1/a = √3 হলে a² + 1/a² এর মান কত?", opts:["6", "4", "2", "1"], ans:3, sol:"a²+1/a² = (a+1/a)²-2 = 3-2 = 1।", year:"৪৪তম বিসিএস", generated:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের প্রদত্ত মান (a+1/a=?) সূচক/মূল চিহ্নসহ ঘনভাবে ছাপা থাকায় নিষ্কাশনে সম্পূর্ণ স্পষ্ট ছিল না। \"√৩\" ধরে সমাধান করলে চূড়ান্ত উত্তর বিকল্প \"ঘ\" (১)-এর সাথে মেলে, তাই সেটি ব্যবহার করা হলো।"},
  {id:'l6cd5', lec:'lec6', section:'contentDiscussion', sourceNo:'5', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"যদি a² + 1/a² = 51 হয়, তবে a − 1/a এর মান কত?", opts:["৯", "৭", "৫", "৩"], ans:1, sol:"(a-1/a)² = a²+1/a²-2 = 51-2 = 49 ⟹ a-1/a = 7।", year:"৩৯তম বিসিএস", generated:true},
  {id:'l6cd7', lec:'lec6', section:'contentDiscussion', sourceNo:'7', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"x + y = 7 এবং xy = 10 হলে (x − y)² এর মান কত?", opts:["3", "6", "9", "12"], ans:2, sol:"(x-y)² = (x+y)²-4xy = 49-40 = 9।", year:"৪৫তম বিসিএস", generated:true},
  {id:'l6cd8', lec:'lec6', section:'contentDiscussion', sourceNo:'8', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"a + b + c = 9, a² + b² + c² = 29 হলে, 2(ab + bc + ca) এর মান কত?", opts:["52", "46", "26", "22"], ans:0, sol:"(a+b+c)² = a²+b²+c²+2(ab+bc+ca) ⟹ 81=29+2(ab+bc+ca) ⟹ 2(ab+bc+ca)=52।", year:"১৬তম বিসিএস", generated:true},
  {id:'l6cd9', lec:'lec6', section:'contentDiscussion', sourceNo:'9', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"x + y = 8, x − y = 6 হলে, x² + y² এর মান-", opts:["40", "60", "50", "80"], ans:2, sol:"x²+y² = [(x+y)²+(x-y)²]/2 = (64+36)/2 = 50।", generated:true},
  {id:'l6cd10', lec:'lec6', section:'contentDiscussion', sourceNo:'10', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"x² − 3x + 1 = 0 হলে x² − 1/x² এর মান কত?", opts:["৫√৩", "৩√৫", "৪√৫", "√৬৫"], ans:1, sol:"সমীকরণকে x দ্বারা ভাগ করে x+1/x=3 পাওয়া যায়। x-1/x=√(9-4)=√5। x²-1/x²=(x-1/x)(x+1/x)=√5×3=3√5।", year:"৩৭তম বিসিএস", generated:true, needsVerification:true, verifyNote:"উৎস পিডিএফে প্রশ্নটি ঠিক কোন রাশি জিজ্ঞাসা করছে (x-1/x নাকি x²-1/x²) তা সূচক-চিহ্নের নিষ্কাশন-জনিত ক্ষতির কারণে সরাসরি স্পষ্ট ছিল না। সমাধানের চূড়ান্ত মান (৩√৫) থেকে বিপরীতমুখী যুক্তিতে বোঝা যায় প্রশ্নটি \"x²-1/x²\" জিজ্ঞাসা করছিল, তাই সে অনুযায়ী পুনর্গঠন করা হলো।"},
  {id:'l6cd12', lec:'lec6', section:'contentDiscussion', sourceNo:'12', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"a + 1/a = 3 হলে, a³ + 1/a³ এর মান কত?", opts:["9", "18", "27", "36"], ans:1, sol:"a³+1/a³ = (a+1/a)³-3(a+1/a) = 27-9 = 18।", year:"৩০তম বিসিএস", generated:true},
  {id:'l6cd13', lec:'lec6', section:'contentDiscussion', sourceNo:'13', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"x − y = 2, x² + y² = 4 হলে x³ + y³ = কত?", opts:["8", "9", "16", "25"], ans:0, sol:"(x-y)²=x²+y²-2xy ⟹ 4=4-2xy ⟹ xy=0। (x+y)²=x²+y²+2xy=4 ⟹ x+y=2। x³+y³=(x+y)(x²-xy+y²)=2×4=8।", year:"৩৪তম বিসিএস", generated:true},
  {id:'l6cd14', lec:'lec6', section:'contentDiscussion', sourceNo:'14', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"x − 1/x = 1 হলে, x³ − 1/x³ এর মান কত?", opts:["1", "2", "3", "4"], ans:3, sol:"x³-1/x³ = (x-1/x)³+3(x-1/x) = 1+3 = 4।", generated:true},
  {id:'l6cd15', lec:'lec6', section:'contentDiscussion', sourceNo:'15', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"যদি a³ − b³ = 513 এবং a − b = 3 হয়, তবে ab-এর মান কত?", opts:["54", "35", "45", "55"], ans:0, sol:"a³-b³=(a-b)[(a-b)²+3ab] ⟹ 513=3[9+3ab] ⟹ 171=9+3ab ⟹ ab=54।", year:"১১তম বিসিএস", generated:true},
  {id:'l6cd16', lec:'lec6', section:'contentDiscussion', sourceNo:'16', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"a + b + c = 0 হলে, a³ + b³ + c³ এর মান কত?", opts:["abc", "3abc", "6abc", "9abc"], ans:1, sol:"যখন a+b+c=0 তখন সর্বদা a³+b³+c³=3abc (প্রমিত অভেদ)।", year:"১০ম বিসিএস", generated:true},
  {id:'l6cd17', lec:'lec6', section:'contentDiscussion', sourceNo:'17', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"a + b = 5 এবং a − b = 3 হলে ab এর মান কত?", opts:["2", "3", "4", "5"], ans:2, sol:"ab = [(a+b)²-(a-b)²]/4 = (25-9)/4 = 4।", year:"১০ম বিসিএস", generated:true},
  {id:'l6cd18', lec:'lec6', section:'contentDiscussion', sourceNo:'18', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"x + y = 12 এবং x − y = 2 হলে xy এর মান কত?", opts:["35", "140", "70", "144"], ans:0, sol:"xy = [(x+y)²-(x-y)²]/4 = (144-4)/4 = 35।", year:"২২তম বিসিএস", generated:true},
  {id:'l6cd19', lec:'lec6', section:'contentDiscussion', sourceNo:'19', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"যদি a + b = 2, ab = 1 হয় তবে a এবং b এর মান যথাক্রমে-", opts:["0, 2", "1, 1", "−1, 3", "−3, 4"], ans:1, sol:"a,b সমীকরণ t²-2t+1=0 এর মূল ⟹ (t-1)²=0 ⟹ a=b=1।", year:"৩১তম বিসিএস", generated:true},
  {id:'l6cd20', lec:'lec6', section:'contentDiscussion', sourceNo:'20', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"x − y = 2 এবং xy = 24 হলে, x-এর ধনাত্মক মানটি-", opts:["3", "4", "5", "6"], ans:3, sol:"y=x-2 বসিয়ে x(x-2)=24 ⟹ x²-2x-24=0 ⟹ (x-6)(x+4)=0 ⟹ x=6 (ধনাত্মক মান)।", year:"৩৫তম বিসিএস", generated:true},
  {id:'l6cd22', lec:'lec6', section:'contentDiscussion', sourceNo:'22', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"x² − 8x − 8y + 16 + y² এর সঙ্গে কত যোগ করলে যোগফল একটি পূর্ণ বর্গ হবে?", opts:["4xy", "2xy", "6xy", "8xy"], ans:1, sol:"এটি একটি সুপরিচিত পুনরাবৃত্ত বিসিএস প্রশ্ন যার প্রতিষ্ঠিত উত্তর 2xy।", year:"৩২তম, ২৬তম ও ১২তম বিসিএস", generated:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের সমাধানের ধাপ সূচক-নিষ্কাশন জনিত সমস্যায় সম্পূর্ণ স্পষ্ট ছিল না। প্রশ্নটি একাধিক প্রকৃত বিসিএস পরীক্ষায় (৩২তম, ২৬তম, ১২তম) পুনরাবৃত্ত হয়েছে বলে বিসিএস প্রশ্নব্যাংকে সুপরিচিত, যেখানে প্রতিষ্ঠিত উত্তর 2xy — সেটিই এখানে ব্যবহার করা হলো, তবে স্বাধীনভাবে পুনর্গণনা করে নিশ্চিত করা যায়নি।"},
  {id:'l6sw101', lec:'lec6', section:'studentWork', sourceNo:'101', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"x + 1/x = a হলে x⁴ + 1/x⁴ এর মান কত?", opts:["a² + 4a + 4", "a⁴ − 4a² + 2", "a² + 4a + 2", "a⁴ + 4a² − 2"], ans:1, sol:"x²+1/x² = a²-2। x⁴+1/x⁴ = (x²+1/x²)²-2 = (a²-2)²-2 = a⁴-4a²+2।", src:true},
  {id:'l6sw102', lec:'lec6', section:'studentWork', sourceNo:'102', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"p − 1/p = 5 হলে, p² + 1/p² এর মান কত?", opts:["29", "27", "25", "21"], ans:1, sol:"p²+1/p² = (p-1/p)²+2 = 25+2 = 27।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের পাশে ছাপা \"উত্তর ঃ\" ট্যাগটি \"ক\" (২৯) দেখাচ্ছিল, যা প্রমিত অভেদ (p²+1/p²=(p-1/p)²+2) থেকে হিসাব করা মান (২৭, বিকল্প \"খ\") এর সাথে মেলে না। গাণিতিক অভেদ অনুযায়ী \"খ\" দেখানো হলো।"},
  {id:'l6sw103', lec:'lec6', section:'studentWork', sourceNo:'103', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"a + 1/a = 2 হলে, a² + 1/a² এর মান কত?", opts:["2", "4", "8", "12"], ans:0, sol:"a²+1/a² = (a+1/a)²-2 = 4-2 = 2।", src:true},
  {id:'l6sw104', lec:'lec6', section:'studentWork', sourceNo:'104', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"যদি x − 6/x = 1 হয়, তবে 6/(x² − x + 1) এর মান কত?", opts:["3/7", "5/6", "7/6", "6/7"], ans:3, sol:"x-6/x=1 থেকে x²-x-6=0, অর্থাৎ x²-x=6। হর=x²-x+1=6+1=7। রাশিটি=6/7।", src:true},
  {id:'l6sw105', lec:'lec6', section:'studentWork', sourceNo:'105', topic:"বীজগাণিতিক সূত্রাবলি (মান নির্ণয়)", q:"a + b = 5, a − b = 3 হলে ab এর মান কত?", opts:["2", "3", "4", "5"], ans:2, sol:"ab = [(a+b)²-(a-b)²]/4 = (25-9)/4 = 4।", src:true},

  {id:"l7cd1", lec:"lec7", section:"contentDiscussion", sourceNo:"1", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"\"RAPIS\" অক্ষরগুলোকে নতুন করে সাজালে নিচের কোনটি পাওয়া যায়?", opts:["একটি মহাসাগর", "একটি শহর", "একটি দেশ", "একটি প্রাণী"], ans:1, sol:"RAPIS-এর অক্ষর দিয়ে সাজালে পাওয়া যায় PARIS (ফ্রান্সের রাজধানী) — যা একটি শহর।", year:"৩৮তম বিসিএস", src:true},
  {id:"l7cd2", lec:"lec7", section:"contentDiscussion", sourceNo:"2", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"If LOYAL is coded as 'JOWAJ', then PRONE is coded as-", opts:["QRPNE", "NRMND", "ORNMG", "NRMNC"], ans:3, sol:"কোডে বিজোড় অবস্থানের অক্ষর ২ ধাপ পিছিয়ে যায়, জোড় অবস্থানের অক্ষর অপরিবর্তিত থাকে (L→J:-2, O→O:0, Y→W:-2, A→A:0, L→J:-2)। PRONE-এ প্রয়োগ করলে: P→N, R→R, O→M, N→N, E→C, অর্থাৎ NRMNC।", year:"৩৭তম বিসিএস", src:true},
  {id:"l7cd3", lec:"lec7", section:"contentDiscussion", sourceNo:"3", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"TRAIN = 98726 হয়, তবে TARIN = কত হবে?", opts:["97862", "97826", "97682", "69782"], ans:1, sol:"T=9, R=8, A=7, I=2, N=6 ধরে TARIN = 9,7,8,2,6 = 97826।", year:"৩৭ম ও ৩২তম বিসিএস", src:true},
  {id:"l7cd4", lec:"lec7", section:"contentDiscussion", sourceNo:"4", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"Give the serial order in which the following word will come last in the dictionary?", opts:["Beauttity", "Beautiful", "Beat", "Begin"], ans:3, sol:"বর্ণানুক্রমে সাজালে ক্রম: Beat, Beautiful, Beauttity, Begin — অর্থাৎ অভিধানে সবার শেষে আসবে Begin।", year:"৩২তম বিসিএস", src:true},
  {id:"l7cd5", lec:"lec7", section:"contentDiscussion", sourceNo:"5", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"What letter in the word SUPERFLUOUS is the same number in word as it is in the alphabet?", opts:["R", "F", "L", "U"], ans:1, sol:"SUPERFLUOUS-এর ৬ষ্ঠ অক্ষর F, এবং ইংরেজি বর্ণমালাতেও F-এর অবস্থান ৬ — মিলে যায়।", year:"৩২তম বিসিএস", src:true},
  {id:"l7cd6", lec:"lec7", section:"contentDiscussion", sourceNo:"6", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"If 1394 = ACID then 4516 = ?", opts:["DEAD", "DEAL", "DEAN", "DEAF"], ans:3, sol:"সংকেতে প্রতিটি অঙ্ক বর্ণমালায় তার ক্রমিক অবস্থান নির্দেশ করে (1=A, 3=C, 9=I, 4=D)। তাহলে 4=D, 5=E, 1=A, 6=F, অর্থাৎ DEAF।", year:"৩০তম বিসিএস", src:true},
  {id:"l7cd7", lec:"lec7", section:"contentDiscussion", sourceNo:"7", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"নিচের দেশগুলোকে ইংরেজি বর্ণানুক্রমে সাজালে কোন ক্রমটি সঠিক হবে? — Bangladesh, Maldives, India, Sri Lanka, Pakistan, Nepal", opts:["BIMNPS", "PIBNSM", "NBISPM", "BMISPN"], ans:0, sol:"প্রথম অক্ষর অনুযায়ী বর্ণানুক্রমে সাজালে: Bangladesh, India, Maldives, Nepal, Pakistan, Sri Lanka — অর্থাৎ BIMNPS।", src:true},
  {id:"l7cd8", lec:"lec7", section:"contentDiscussion", sourceNo:"8", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"নিচের কোন শব্দটি THERMOLYSIS শব্দটির অক্ষর দ্বারা গঠন করা যাবে না?", opts:["SISTER", "LOTUS", "LORIS", "LOITER"], ans:1, sol:"THERMOLYSIS-এ থাকা অক্ষর দিয়ে SISTER, LORIS, LOITER গঠন করা যায়, কিন্তু LOTUS গঠনে প্রয়োজনীয় \"U\" অক্ষরটি THERMOLYSIS-এ নেই।", year:"৩০তম বিসিএস", src:true},
  {id:"l7cd9", lec:"lec7", section:"contentDiscussion", sourceNo:"9", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"নিচের কোন শব্দটি PHOTOSYNTHETIC শব্দটি দ্বারা গঠন করা যায় না?", opts:["THOSE", "SCENT", "PRONE", "COTTON"], ans:2, sol:"PHOTOSYNTHETIC-এ থাকা অক্ষর দিয়ে THOSE, SCENT, COTTON গঠন করা যায়, কিন্তু PRONE গঠনে প্রয়োজনীয় \"R\" অক্ষরটি PHOTOSYNTHETIC-এ নেই।", year:"৩০তম বিসিএস", src:true},
  {id:"l7cd10", lec:"lec7", section:"contentDiscussion", sourceNo:"10", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"যদি TALE = LATE হয়, তবে CAFE = ?", opts:["FACE", "CAEF", "EAFC", "AEFC"], ans:0, sol:"TALE-এর ১ম ও ৩য় অক্ষর পরস্পর জায়গা বদল করলে LATE পাওয়া যায় (T-A-L-E → L-A-T-E)। একই নিয়মে CAFE-তে C ও F জায়গা বদল করলে পাওয়া যায় FACE।", year:"৩০তম বিসিএস", src:true},
  {id:"l7cd11", lec:"lec7", section:"contentDiscussion", sourceNo:"11", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"একটি সংকেত পদ্ধতিতে VACATE-কে লেখা হয় AVACET, তা হলে LITERATE-কে কি লেখা হবে?", opts:["ILETRAET", "ILTEARTE", "ILETARET", "ILTREATE"], ans:2, sol:"VACATE-এর প্রতিটি জোড়া অক্ষর (১-২, ৩-৪, ৫-৬) পরস্পর অদল-বদল করলে AVACET পাওয়া যায় (VA→AV, CA→AC, TE→ET)। একই নিয়মে LITERATE-এর জোড়াগুলো (LI,TE,RA,TE) বদলে পাওয়া যায় IL-ET-AR-ET = ILETARET।", year:"৩০তম বিসিএস", src:true},
  {id:"l7cd12", lec:"lec7", section:"contentDiscussion", sourceNo:"12", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"ADMINISTRATION শব্দটি দ্বারা নিম্নের কোন শব্দটি গঠন করা যায় না?", opts:["STATION", "TRADITION", "MINISTER", "RTION"], ans:2, sol:"ADMINISTRATION-এ থাকা অক্ষর দিয়ে STATION ও TRADITION গঠন করা যায়, কিন্তু MINISTER গঠনে প্রয়োজনীয় \"E\" অক্ষরটি ADMINISTRATION-এ নেই।", year:"৩০তম বিসিএস", src:true},
  {id:"l7cd13", lec:"lec7", section:"contentDiscussion", sourceNo:"13", topic:"মৌখিক যুক্তি (Verbal Reasoning)", q:"If GAMES is spelt as HBNFT, what will be the spelling of SPORTS?", opts:["RQNOSR", "TQPSUT", "RQNOSR", "TOQSUT"], ans:1, sol:"GAMES-এর প্রতিটি অক্ষর বর্ণমালায় এক ধাপ এগিয়ে গিয়ে কোড তৈরি হয়েছে (G→H, A→B, M→N, E→F, S→T)। একই নিয়মে SPORTS-এর প্রতিটি অক্ষর এক ধাপ এগিয়ে: S→T, P→Q, O→P, R→S, T→U, S→T = TQPSUT।", year:"৩০তম বিসিএস", src:true},
