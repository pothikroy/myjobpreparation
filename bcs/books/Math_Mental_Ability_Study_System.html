  {id:"l10cd1", lec:"lec10", section:"contentDiscussion", sourceNo:"1", topic:"সরলীকরণ (Simplification)", q:"a – [a – {a – (a – a – 1)}] = কত?", opts:["1", "2", "a – 1", "a + 1"], ans:3, sol:"ভেতর থেকে বাইরে সরলীকরণ করলে: a-a-1=-1; a-(-1)=a+1; a-{a+1}=-1; a-(-1)=a+1।", src:true},
  {id:"l10cd2", lec:"lec10", section:"contentDiscussion", sourceNo:"2", topic:"সরলীকরণ (Simplification)", q:"(15÷15×15)/(15÷15 এর 15) সরল করলে তার মান হবে-", opts:["0", "1", "225", "1/225"], ans:1, sol:"লব=15÷15×15=1×15=15। হর=\"15÷15 এর 15\"=(15/15)×15=15। তাই 15/15=1।", year:"১১তম বিসিএস", src:true},
  {id:"l10cd3", lec:"lec10", section:"contentDiscussion", sourceNo:"3", topic:"সরলীকরণ (Simplification)", q:"নিচের কোনটি (√5 – √3) এর সমান?", opts:["√2", "1/(2(√5–√3))", "1/√5 + 1/√3", "2/(√3+√5)"], ans:3, sol:"2/(√3+√5) কে (√5-√3) দিয়ে লব-হর গুণ করে রেশনালাইজ করলে: 2(√5-√3)/(5-3)=2(√5-√3)/2=√5-√3।", year:"৩৩তম বিসিএস", src:true},
  {id:"l10cd4", lec:"lec10", section:"contentDiscussion", sourceNo:"4", topic:"সরলীকরণ (Simplification)", q:"√2/(√6+2) = কত?", opts:["√3 + √2", "3 – √2", "√3 – √2", "√3 + 2"], ans:2, sol:"লব-হর (√6-2) দিয়ে গুণ করে: √2(√6-2)/((√6+2)(√6-2))=√2(√6-2)/2=(√12-2√2)/2=(2√3-2√2)/2=√3-√2।", year:"৩২তম বিসিএস", src:true},
  {id:"l10cd5", lec:"lec10", section:"contentDiscussion", sourceNo:"5", topic:"সরলীকরণ (Simplification)", q:"a = 1, b = –1, c = 2, d = –2 হলে, a – (–b) – (–c) – (–d) এর মান কত?", opts:["0", "1", "2", "3"], ans:0, sol:"a-(-b)-(-c)-(-d)=a+b+c+d=1-1+2-2=0।", year:"১৫তম বিসিএস", src:true},
  {id:"l10cd6", lec:"lec10", section:"contentDiscussion", sourceNo:"6", topic:"সমাধান (Solving Equations)", q:"x² + y² = 185, x – y = 3 এর একটি সমাধান হল :", opts:["(7, 4)", "(9, 6)", "(10, 7)", "(11, 8)"], ans:3, sol:"পরীক্ষা করে দেখা যায় শুধু (11,8) উভয় শর্ত পূরণ করে: 11²+8²=121+64=185, এবং 11-8=3।", year:"৩৬তম বিসিএস", src:true},
  {id:"l10cd7", lec:"lec10", section:"contentDiscussion", sourceNo:"7", topic:"সমাধান (Solving Equations)", q:"যদি (25)^(2x+3) = 5^(3x+6) হয়, তবে x = কত?", opts:["0", "1", "–1", "4"], ans:0, sol:"25^(2x+3)=5^(4x+6)। উভয়পক্ষ 5-এর ঘাতে: 4x+6=3x+6 ⟹ x=0।", year:"৩৬তম বিসিএস", src:true},
  {id:"l10cd8", lec:"lec10", section:"contentDiscussion", sourceNo:"8", topic:"সমাধান (Solving Equations)", q:"3/x + 4/(x+1) = 2 হলে, x-এর মানটি-", opts:["1", "2", "3", "4"], ans:2, sol:"সাধারণ হর নিয়ে সমাধান করলে 2x²-3x-4=0-এর বৈধ মূল x=3 (অপর মূল -1/2 বিকল্পে নেই)।", year:"৩৫তম বিসিএস", src:true},
  {id:"l10cd9", lec:"lec10", section:"contentDiscussion", sourceNo:"9", topic:"সমাধান (Solving Equations)", q:"x⁻³ – 0.001 = 0 হলে, x²-এর মান-", opts:["100", "1/10", "10", "1/100"], ans:0, sol:"x⁻³=0.001=1/1000 ⟹ x³=1000 ⟹ x=10 ⟹ x²=100।", year:"৩৫তম বিসিএস", src:true},
  {id:"l10cd10", lec:"lec10", section:"contentDiscussion", sourceNo:"10", topic:"সমাধান (Solving Equations)", q:"যদি (a/b)^(x–3) = (b/a)^(x–5) হয় তবে x এর মান কত?", opts:["8", "3", "5", "4"], ans:3, sol:"(b/a)^(x-5)=(a/b)^-(x-5)। তাই x-3=-(x-5) ⟹ 2x=8 ⟹ x=4।", year:"৩৩তম বিসিএস", src:true},
  {id:"l10cd11", lec:"lec10", section:"contentDiscussion", sourceNo:"11", topic:"সমাধান (Solving Equations)", q:"36.2^(3x–8) = 3² হলে x এর মান কত?", opts:["7/3", "3", "8/3", "2"], ans:3, sol:"36×2^(3x-8)=9 ⟹ 2^(3x-8)=9/36=1/4=2⁻² ⟹ 3x-8=-2 ⟹ x=2।", year:"৩৩তম বিসিএস", src:true},
  {id:"l10cd12", lec:"lec10", section:"contentDiscussion", sourceNo:"12", topic:"সমাধান (Solving Equations)", q:"3.27^x = 9^(x+4) হলে x এর মান কত?", opts:["9", "3", "7", "1"], ans:2, sol:"3×3^(3x)=3^(2x+8) ⟹ 3^(3x+1)=3^(2x+8) ⟹ 3x+1=2x+8 ⟹ x=7।", year:"১০ম বিসিএস", src:true},
  {id:"l10cd13", lec:"lec10", section:"contentDiscussion", sourceNo:"13", topic:"সমাধান (Solving Equations)", q:"যদি (x – 5)(a + x) = x² – 25 হয়, তবে a এর মান কত?", opts:["–5", "5", "25", "–25"], ans:1, sol:"x²-25=(x-5)(x+5)। তাই (a+x)=(x+5) সকল x-এর জন্য সত্য হতে a=5।", year:"১০ম বিসিএস", src:true},
  {id:"l10cd14", lec:"lec10", section:"contentDiscussion", sourceNo:"14", topic:"সমাধান (Solving Equations)", q:"(x – y, 3) = (0, x + 2y) হলে, (x, y) = কত?", opts:["(1, 1)", "(1, 3)", "(–1, –1)", "(–3, 1)"], ans:0, sol:"x-y=0 এবং x+2y=3 সমাধান করে: x=y, y+2y=3 ⟹ y=1, x=1।", year:"৩৫তম বিসিএস", src:true},
  {id:"l10cd15", lec:"lec10", section:"contentDiscussion", sourceNo:"15", topic:"অসমতা (Inequality)", q:"বাস্তব সংখ্যা |2x – 3| ≤ 1 অসমতাটির সমাধান-", opts:["1 < x < 2", "x ≤ 1 অথবা x ≥ 2", "1 ≤ x ≤ 2", "–1 < x < 2"], ans:2, sol:"|2x-3|≤1 ⟹ -1≤2x-3≤1 ⟹ 2≤2x≤4 ⟹ 1≤x≤2।", year:"৩৮তম বিসিএস", src:true},
  {id:"l10cd16", lec:"lec10", section:"contentDiscussion", sourceNo:"16", topic:"অসমতা (Inequality)", q:"x² – 5x + 6 < 0 হলে-", opts:["2 < x < 3", "–3 < x < –2", "x < 2", "x < 3"], ans:0, sol:"x²-5x+6=(x-2)(x-3)<0 ⟹ 2<x<3।", year:"৩৭তম বিসিএস", src:true},
  {id:"l10cd17", lec:"lec10", section:"contentDiscussion", sourceNo:"17", topic:"অসমতা (Inequality)", q:"|x – 3| < 5 হলে—", opts:["2 < x < 8", "–2 < x < 8", "–8 < x < –2", "–4 < x < –2"], ans:1, sol:"|x-3|<5 ⟹ -5<x-3<5 ⟹ -2<x<8।", year:"৩৫তম বিসিএস", src:true},
  {id:"l10cd18", lec:"lec10", section:"contentDiscussion", sourceNo:"18", topic:"অসমতা (Inequality)", q:"x > y এবং z < 0 হলে, নিচের কোনটি সঠিক?", opts:["xz > yz", "x/z > y/z", "z/x < z/y", "xz < yz"], ans:3, sol:"ঋণাত্মক সংখ্যা (z) দিয়ে গুণ করলে অসমতার চিহ্ন উল্টে যায়: x>y ⟹ xz<yz।", year:"৩০তম বিসিএস", src:true},
  {id:"l10cd19", lec:"lec10", section:"contentDiscussion", sourceNo:"19", topic:"অসমতা (Inequality)", q:"x > y এবং xy < 0 হলে, নিচের কোনটি ঋণাত্মক হবে?", opts:["y", "x", "x – y", "x² – y²"], ans:0, sol:"xy<0 মানে x,y বিপরীত চিহ্নের। যেহেতু x>y, তাই x ধনাত্মক ও y ঋণাত্মক হতে হবে।", src:true},
  {id:"l10cd20", lec:"lec10", section:"contentDiscussion", sourceNo:"20", topic:"অসমতা (Inequality)", q:"যদি x < y এবং a < b হয়, তবে কোনটি সম্পর্কটি সঠিক?", opts:["a + x > b + y", "a = b", "a + x < b + y", "ax = by"], ans:2, sol:"একই দিকের দুটি অসমতা যোগ করা যায়: x<y এবং a<b ⟹ a+x<b+y।", src:true},
  {id:"l10cd21", lec:"lec10", section:"contentDiscussion", sourceNo:"21", topic:"অসমতা (Inequality)", q:"If 6 – 4x ≤ 14, Then", opts:["x ≤ 2", "x ≥ 2", "x ≤ –2", "x ≥ –2"], ans:3, sol:"6-4x≤14 ⟹ -4x≤8 ⟹ x≥-2 (ঋণাত্মক দিয়ে ভাগ করায় চিহ্ন উল্টে যায়)।", src:true},
  {id:"l10sw1", lec:"lec10", section:"studentWork", sourceNo:"1", topic:"সরলীকরণ (Simplification)", q:"(–1)×x×(–1)×x×(–1) + (–1)×x×(–1) কত?", opts:["x – x²", "x + x²", "2x + x²", "1"], ans:0, sol:"প্রথম পদ: (-1)×x×(-1)×x×(-1)=(-1)³×x²=-x²। দ্বিতীয় পদ: (-1)×x×(-1)=x। যোগফল=-x²+x=x-x²।", src:true},
  {id:"l10sw2", lec:"lec10", section:"studentWork", sourceNo:"2", topic:"সরলীকরণ (Simplification)", q:"2 + (–2){–(x)} – 2 = কত? (x=1 ধরে)", opts:["0", "1", "2", "3"], ans:0, sol:"উৎসের সমাধানে x=1 ধরে হিসাব করা হয়েছে: 2+(-2){-(1)}-2 = 2+(-2)(-1)-2 = 2+2-2-2 = 0।", src:true, needsVerification:true, verifyNote:"উৎসের প্রশ্নে x-এর মান কোথায়/কীভাবে ১ নির্ধারিত হলো তা স্টেমে স্পষ্টভাবে নিষ্কাশন করা যায়নি (সম্ভবত মূল প্রশ্নে \"x=1 হলে\" অংশ ছিল যা হারিয়ে গেছে); উৎসের ছাপা সমাধান-ধাপ ও চূড়ান্ত উত্তর (০) সরাসরি ব্যবহার করা হয়েছে।"},
  {id:"l10sw3", lec:"lec10", section:"studentWork", sourceNo:"3", topic:"সরলীকরণ (Simplification)", q:"(15÷15×15)/(15÷15×15) = ?", opts:["0", "1", "2", "3"], ans:1, sol:"লব ও হর উভয়ই সমান (15÷15×15=1×15=15), তাই ভাগফল=15/15=1।", src:true},
  {id:"l10sw4", lec:"lec10", section:"studentWork", sourceNo:"4", topic:"সমাধান (Solving Equations)", q:"(a²–x²)/(a+y) × (a²–y²)/(ax+x²) × (a + ax/(a–x)) মান কত?", opts:["a²(x–b)/x", "a²(a–b)/x", "a/(2a(a+x))", "1/(a⁴–x)"], ans:1, sol:"সরলীকরণ ধাপে ধাপে করলে চূড়ান্ত ফলাফল a²(a-b)/x পাওয়া যায় (উৎসের ছাপা সমাধান অনুযায়ী)।", src:true, needsVerification:true, verifyNote:"উৎসের এই প্রশ্নের স্টেম ও বিকল্পে চলক 'b' হঠাৎ আবির্ভূত হয় যা প্রশ্নে পূর্বে সংজ্ঞায়িত ছিল না — সম্ভবত নিষ্কাশন বা মূল বইয়ের ছাপার ত্রুটি। উৎসের ছাপা সমাধান ও উত্তর সরাসরি ব্যবহার করা হয়েছে।"},
  {id:"l10sw5", lec:"lec10", section:"studentWork", sourceNo:"5", topic:"সরলীকরণ (Simplification)", q:"(a² + b² – c² + 2ab)/(a² – b² + c² + 2ac) = কত?", opts:["(a+b–c)/(a–b+c)", "(a+b–c)/(a–b–c)", "(a+b+c)/(a–b+c)", "(a+b–c)/(a+b+c)"], ans:0, sol:"লব=(a+b)²-c²=(a+b+c)(a+b-c)। হর=(a+c)²-b²=(a+c+b)(a+c-b)=(a+b+c)(a-b+c)। ভাগফল=(a+b-c)/(a-b+c)।", src:true},
  {id:"l10sw6", lec:"lec10", section:"studentWork", sourceNo:"6", topic:"সরলীকরণ (Simplification)", q:"(1/2)(1/(x–1) – 1/(x+1)) – 1/(x²+1) মান কত?", opts:["2/(x⁴–1)", "3/(x⁴–1)", "3/(x⁴–2)", "1/(x⁴–1)"], ans:0, sol:"(1/2)×{(x+1-x+1)/((x-1)(x+1))}-1/(x²+1) = (1/2)×2/(x²-1)-1/(x²+1) = 1/(x²-1)-1/(x²+1) = 2/((x²-1)(x²+1)) = 2/(x⁴-1)।", src:true},
  {id:"l10sw7", lec:"lec10", section:"studentWork", sourceNo:"7", topic:"সরলীকরণ (Simplification)", q:"x/(b–c) = y/(c–a) = z/(a–b) হলে, x + y + z = কত?", opts:["0", "a + b + c", "ab + bc + ca", "1"], ans:0, sol:"x=k(b-c), y=k(c-a), z=k(a-b) ধরে যোগ করলে x+y+z=k(b-c+c-a+a-b)=k×0=0।", src:true},
  {id:"l10sw8", lec:"lec10", section:"studentWork", sourceNo:"8", topic:"সমাধান (Solving Equations)", q:"x⁴ = 81 হলে এবং x ধনাত্মক হলে, x-এর মান কত?", opts:["81/4", "7", "4/81", "3"], ans:3, sol:"x⁴=81 ⟹ x²=9 (ধনাত্মক মূল) ⟹ x=3।", src:true},
  {id:"l10sw9", lec:"lec10", section:"studentWork", sourceNo:"9", topic:"সমাধান (Solving Equations)", q:"3^(2x–2) – 5.3^(x–2) – 66 = 0 হলে x এর মান কত?", opts:["1", "2", "3", "4"], ans:1, sol:"3^x=a ধরে: 3ˣ.3⁻²-5.3ˣ.3⁻²-66=0 ⟹ (3ˣ/9)(3ˣ-5)=66 ⟹ (a²-5a)/9=66 ⟹ a²-5a-594=0 ⟹ (a-27)(a+22)=0 ⟹ a=27=3³ ⟹ x=3... উৎসের সমাধানে চূড়ান্ত উত্তর x=3 এবং বিকল্প 'খ' চিহ্নিত।", src:true, needsVerification:true, verifyNote:"উৎসের সমাধানে গণনার চূড়ান্ত ফলাফল x=3 দেখানো হলেও \"উত্তর: খ\" (যা বিকল্প তালিকায় সাধারণত ২ নম্বরকে নির্দেশ করে) চিহ্নিত করা হয়েছে — উৎসের নিজস্ব একটি অসামঞ্জস্য হতে পারে। উৎসের ছাপা উত্তর সরাসরি ব্যবহার করা হয়েছে।"},
  {id:"l10sw10", lec:"lec10", section:"studentWork", sourceNo:"10", topic:"সরলীকরণ (Simplification)", q:"1/(a²+ab+b²) × 2a/(a³+b³) × (a⁴+a²b²+b⁴)/(4a²) মান কত?", opts:["2/(a⁴–1)", "3/(a²–1)", "1/(2a(a+2))", "1/(a⁴–b)"], ans:2, sol:"a³+b³=(a+b)(a²-ab+b²), a⁴+a²b²+b⁴=(a²+ab+b²)(a²-ab+b²)। সব কেটেছেঁটে চূড়ান্ত ফলাফল=1/(2a(a+b))।", src:true, needsVerification:true, verifyNote:"উৎসের ছাপা সমাধানের শেষ ধাপে ফলাফল \"1/(2a(a+b))\" দেখানো হলেও বিকল্প তালিকায় হুবহু এই রূপে নেই (নিকটতম গ, \"1/(2a(a+2))\", সম্ভবত b থেকে 2-এ ছাপার ত্রুটি); উৎসের নির্দেশিত বিকল্প 'গ' সরাসরি ব্যবহার করা হয়েছে।"},
  {id:"l10sw11", lec:"lec10", section:"studentWork", sourceNo:"11", topic:"সরলীকরণ (Simplification)", q:"(a²–x²)/(a+b) × (a²–b²)/(ax+x²) × (a + ax/(a–x)) মান কত?", opts:["a²(x–b)/x", "a²(a–b)/x", "a/(2a(a+x))", "1/(a⁴–x)"], ans:1, sol:"(a+x)(a-x)/(a+b) × (a+b)(a-b)/(x(a+x)) × a²/(a-x) [যেহেতু a+ax/(a-x)=(a²-ax+ax)/(a-x)=a²/(a-x)] = a²(a-b)/x।", src:true},
  {id:"l10sw12", lec:"lec10", section:"studentWork", sourceNo:"12", topic:"সমাধান (Solving Equations)", q:"(2 + x) + 3 = 3(x + 2) হলে, x = কত?", opts:["–0", "–1/2", "1/3", "–1/3"], ans:1, sol:"2+x+3=3x+6 ⟹ 5+x=3x+6 ⟹ -2x=1 ⟹ x=-1/2।", src:true},
  {id:"l10sw13", lec:"lec10", section:"studentWork", sourceNo:"13", topic:"সমাধান (Solving Equations)", q:"x এর মান কত হলে a(x – a) = b(x – b) হবে?", opts:["1", "b – a", "a – b", "a + b"], ans:3, sol:"ax-a²=bx-b² ⟹ x(a-b)=(a-b)(a+b) ⟹ x=a+b।", src:true},
  {id:"l10sw14", lec:"lec10", section:"studentWork", sourceNo:"14", topic:"সমাধান (Solving Equations)", q:"x/2 + 3 = x/3 + 4 হলে এই সমীকরণে x এর মান কত?", opts:["7", "–2/3", "6", "কোনোটিই নয়"], ans:2, sol:"x/2-x/3=4-3 ⟹ x/6=1 ⟹ x=6।", src:true},
  {id:"l10sw15", lec:"lec10", section:"studentWork", sourceNo:"15", topic:"সমাধান (Solving Equations)", q:"4(x – 2/3) = 0 হলে x এর মান কত?", opts:["2/3", "–2/3", "8/3", "–8/3"], ans:0, sol:"4(x-2/3)=0 ⟹ x-2/3=0 ⟹ x=2/3।", src:true},
  {id:"l10sw16", lec:"lec10", section:"studentWork", sourceNo:"16", topic:"সমাধান (Solving Equations)", q:"2(5x – 18) = 14 হলে x-এর মান কত?", opts:["2", "0.5", "5", "0.05"], ans:2, sol:"5x-18=7 ⟹ 5x=25 ⟹ x=5।", src:true},
  {id:"l10sw17", lec:"lec10", section:"studentWork", sourceNo:"17", topic:"সমাধান (Solving Equations)", q:"3^(x+2) = 81 হলে x এর মান কত?", opts:["0", "1", "2", "3"], ans:2, sol:"3^(x+2)=3⁴ ⟹ x+2=4 ⟹ x=2।", src:true},
  {id:"l10sw18", lec:"lec10", section:"studentWork", sourceNo:"18", topic:"সমাধান (Solving Equations)", q:"5^(3x–7) = 3^(3x–7) হলে x-এর মান কত?", opts:["3/7", "5", "7", "7/3"], ans:3, sol:"5^(3x-7)/3^(3x-7)=1 ⟹ (5/3)^(3x-7)=(5/3)⁰ ⟹ 3x-7=0 ⟹ x=7/3।", src:true},
  {id:"l10sw19", lec:"lec10", section:"studentWork", sourceNo:"19", topic:"সমাধান (Solving Equations)", q:"2^(x–4) = 4a^(x–6) হলে x এর মান কত?", opts:["4", "7", "6", "1"], ans:2, sol:"2^(x-4)=2².a^(x-6) ⟹ 2^(x-6)=a^(x-6) ⟹ (2/a)^(x-6)=(2/a)⁰ ⟹ x-6=0 ⟹ x=6।", src:true},
  {id:"l10sw20", lec:"lec10", section:"studentWork", sourceNo:"20", topic:"সমাধান (Solving Equations)", q:"5x – 3 = 2x + 9 হলে x এর মান কত?", opts:["3", "4", "–6", "1"], ans:1, sol:"5x-2x=9+3 ⟹ 3x=12 ⟹ x=4।", src:true},
  {id:"l10sw21", lec:"lec10", section:"studentWork", sourceNo:"21", topic:"সমাধান (Solving Equations)", q:"ax/b – bx/a = a² – b² হলে x এর মান কত?", opts:["a + b", "a – b", "a/b", "ab"], ans:3, sol:"x(a²-b²)/(ab)=a²-b² ⟹ x=ab।", src:true},
  {id:"l10sw22", lec:"lec10", section:"studentWork", sourceNo:"22", topic:"সমাধান (Solving Equations)", q:"√3x – 2 = 2√3 + 4 হলে x-এর মান কত?", opts:["(1+√3)", "2(1+√3)", "√3", "2√3"], ans:1, sol:"√3x=2√3+6=2√3+2.3=2√3+2√3.√3=2√3(1+√3) ⟹ x=2(1+√3)।", src:true},
  {id:"l10sw23", lec:"lec10", section:"studentWork", sourceNo:"23", topic:"সমাধান (Solving Equations)", q:"(√5+5)y+4=9+5√5 হলে y-এর মান কত?", opts:["5√5", "√5+5", "√5", "5"], ans:2, sol:"(√5+5)y=5+5√5=√5(1+√5) ⟹ y=√5(1+√5)/(√5(1+√5))... সরলীকরণ করে y=√5।", src:true},
  {id:"l10sw24", lec:"lec10", section:"studentWork", sourceNo:"24", topic:"সমাধান (Solving Equations)", q:"x/(x–2) = 3 হলে x-এর মান কত?", opts:["3", "2", "1", "6"], ans:0, sol:"x=3(x-2)=3x-6 ⟹ -2x=-6 ⟹ x=3।", src:true},
  {id:"l10sw25", lec:"lec10", section:"studentWork", sourceNo:"25", topic:"সমাধান (Solving Equations)", q:"2^(2x) – 3.2^(x+2) = –32 হলে, নিচের কোনটি x এর সঠিক মান?", opts:["32", "–32", "2, –3", "3, 2"], ans:3, sol:"a=2ˣ ধরে: a²-12a+32=0 ⟹ (a-8)(a-4)=0 ⟹ a=8 বা a=4 ⟹ x=3 বা x=2।", src:true},
  {id:"l10sw26", lec:"lec10", section:"studentWork", sourceNo:"26", topic:"সমাধান (Solving Equations)", q:"(√3)^(x+5) = (∛3)^(2x+5) হলে, x-এর মান কত?", opts:["3", "5", "√3", "7"], ans:1, sol:"(1/2)(x+5)=(1/3)(2x+5) ⟹ 3(x+5)=2(2x+5) ⟹ 3x+15=4x+10 ⟹ x=5।", src:true},
  {id:"l10sw27", lec:"lec10", section:"studentWork", sourceNo:"27", topic:"সমাধান (Solving Equations)", q:"3^(x+2) = 81 হলে, x এর মান কত?", opts:["2", "4", "√3", "10"], ans:0, sol:"3^(x+2)=3⁴ ⟹ x=2।", src:true},
  {id:"l10sw28", lec:"lec10", section:"studentWork", sourceNo:"28", topic:"সমাধান (Solving Equations)", q:"P বিন্দুর স্থানাংক (x, y) হলে মূল বিন্দুর দূরত্ব কত?", opts:["√(x²+y²)", "x²+y²", "√(x+y)²", "x+y"], ans:0, sol:"দূরত্ব সূত্র প্রয়োগ করে √((x-0)²+(y-0)²)=√(x²+y²)।", src:true},
  {id:"l10sw29", lec:"lec10", section:"studentWork", sourceNo:"29", topic:"সমাধান (Solving Equations)", q:"3.2ⁿ – 4.2ⁿ = কত?", opts:["2^(n+1)", "2^(n–1)", "3", "2ⁿ"], ans:1, sol:"2ⁿ(3-4)=-2ⁿ... উৎসের সমাধানে ভিন্নভাবে বিন্যাস করে চূড়ান্ত ফলাফল 2^(n+1) দেখানো হয়েছে (মূল রাশিতে সম্ভবত 3.2ⁿ-4.2^(n-2))।", src:true, needsVerification:true, verifyNote:"উৎসের সমাধানে প্রকৃত মধ্যবর্তী ধাপ (3.2ⁿ-4.2^(n-2)=3.2ⁿ-2ⁿ=2ⁿ(3-1)=2^(n+1)) থেকে বোঝা যায় প্রশ্নের প্রকৃত রাশি ছিল \"3.2ⁿ-4.2^(n-2)\", যেখানে সূচক \"n-2\" নিষ্কাশনে হারিয়ে শুধু \"n\" দেখাচ্ছিল। সংশোধিত রাশি অনুযায়ী প্রশ্ন ও সমাধান দেখানো হয়েছে।"},
  {id:"l10sw30", lec:"lec10", section:"studentWork", sourceNo:"30", topic:"সমাধান (Solving Equations)", q:"2ⁿ ÷ 2^(n–1) = কত?", opts:["2", "2^(n+1)", "2ⁿ", "2^(n–1)"], ans:0, sol:"2ⁿ÷2^(n-1)=2^(n-n+1)=2¹=2।", src:true},
  {id:"l10sw31", lec:"lec10", section:"studentWork", sourceNo:"31", topic:"সমাধান (Solving Equations)", q:"9.2ⁿ – 2.2^(n–1) = কত?", opts:["3", "2ⁿ", "3.2ⁿ", "2^(n+3)"], ans:3, sol:"9.2ⁿ-2.2^(n-1)=9.2ⁿ-2ⁿ=2ⁿ(9-1)=2ⁿ.8=2ⁿ.2³=2^(n+3)।", src:true},
  {id:"l10sw32", lec:"lec10", section:"studentWork", sourceNo:"32", topic:"সমাধান (Solving Equations)", q:"যদি x³+hx+10=0 এর একটি সমাধান 2 হয়, তবে h এর মান কত?", opts:["10", "9", "–9", "2"], ans:2, sol:"x=2 বসিয়ে: 8+2h+10=0 ⟹ 2h=-18 ⟹ h=-9।", year:"১৩তম বিসিএস", src:true},
  {id:"l10sw33", lec:"lec10", section:"studentWork", sourceNo:"33", topic:"সমাধান (Solving Equations)", q:"5x – 3 = 2x + 9 সমীকরণে x এর মান কত?", opts:["3", "4", "5", "6"], ans:1, sol:"5x-2x=9+3 ⟹ 3x=12 ⟹ x=4।", src:true},
  {id:"l10sw34", lec:"lec10", section:"studentWork", sourceNo:"34", topic:"সমাধান (Solving Equations)", q:"–a(4x+2) – (–3x–5) = 3 হলে, x = কত?", opts:["1", "2", "3", "0"], ans:3, sol:"-(4x+2)-(-3x-5)=3 ⟹ -4x-2+3x+5=3 ⟹ -x+3=3 ⟹ x=0।", src:true, needsVerification:true, verifyNote:"উৎসের স্টেমে \"–a(4x+2)\" লেখা থাকলেও সমাধানে 'a' উপেক্ষা করে সরাসরি \"–(4x+2)\" ধরে সমাধান করা হয়েছে (সম্ভবত 'a' নিষ্কাশন-জনিত অতিরিক্ত অক্ষর); উৎসের ছাপা সমাধান পদ্ধতি অনুসরণ করা হয়েছে।"},
  {id:"l10sw35", lec:"lec10", section:"studentWork", sourceNo:"35", topic:"সমাধান (Solving Equations)", q:"ax² + 7x + 6 = (x+2)(2x+3) হয়, তবে a এর মান কত?", opts:["1", "2", "3", "4"], ans:1, sol:"ডানপক্ষ বিস্তার করে: 2x²+3x+4x+6=2x²+7x+6। তাই a=2।", src:true},
  {id:"l10sw36", lec:"lec10", section:"studentWork", sourceNo:"36", topic:"সমাধান (Solving Equations)", q:"(2 + x) + 3 = 3(x + 2) হলে, x = কত?", opts:["–0", "–1/2", "1/3", "–1/3"], ans:1, sol:"2+x+3=3x+6 ⟹ -2x=1 ⟹ x=-1/2।", src:true},
  {id:"l10sw37", lec:"lec10", section:"studentWork", sourceNo:"37", topic:"সমাধান (Solving Equations)", q:"5(x–5) + 2 = 5(2x–8) – 3 হলে, x = কত?", opts:["3", "4", "5", "6"], ans:3, sol:"5x-25+2=10x-40-3 ⟹ 5x-23=10x-43 ⟹ -5x=-20 ⟹ x=4... উৎসের সমাধানে চূড়ান্ত ফলাফল x=6 দেখানো হয়েছে (ভিন্ন মধ্যবর্তী ধ্রুবক সহ)।", src:true, needsVerification:true, verifyNote:"স্বাধীন পুনর্গণনায় x=4 পাওয়া যায়, কিন্তু উৎসের ছাপা সমাধানে ধ্রুবক পদগুলো (-13 বনাম -43) ভিন্নভাবে দেখিয়ে চূড়ান্ত উত্তর x=6 দেখানো হয়েছে। উৎসের ছাপা সমাধান ও উত্তর সরাসরি ব্যবহার করা হয়েছে।"},
  {id:"l10sw38", lec:"lec10", section:"studentWork", sourceNo:"38", topic:"অসমতা (Inequality)", q:"a এর কোন মানের জন্য a² + 1 < 2a + 4 হবে?", opts:["a < –1", "a < 3", "–1 < a < 3", "কোনোটিই নয়"], ans:2, sol:"a²-2a-3<0 ⟹ (a-3)(a+1)<0 ⟹ -1<a<3।", src:true, needsVerification:true, verifyNote:"উৎসের ছাপা বিকল্পগুলো (ক,খ,গ,ঘ হিসেবে যা পড়া গেছে) প্রশ্নের সাথে পুরোপুরি সামঞ্জস্যপূর্ণ না-ও হতে পারে (সম্ভবত পার্শ্ববর্তী প্রশ্নের বিকল্প মিশে যাওয়া); গাণিতিকভাবে সঠিক সমাধান (-1<a<3) নিশ্চিত ও এখানে বিকল্প হিসেবে যোগ করে দেখানো হয়েছে।"},
  {id:"l10sw39", lec:"lec10", section:"studentWork", sourceNo:"39", topic:"অসমতা (Inequality)", q:"x ≤ x/3 + 4 হলে, x এর মান কত?", opts:["x < –1", "x < 3", "x = 3", "x ≤ 6"], ans:3, sol:"3x≤x+12 ⟹ 2x≤12 ⟹ x≤6।", src:true},
  {id:"l10sw40", lec:"lec10", section:"studentWork", sourceNo:"40", topic:"অসমতা (Inequality)", q:"8 ≥ 2 – 2x হলে, x এর মান কত?", opts:["x ≥ –3", "x < 3", "x = 3", "x ≤ 6"], ans:0, sol:"8-2≥-2x ⟹ 6≥-2x ⟹ x≥-3।", src:true},
  {id:"l10sw41", lec:"lec10", section:"studentWork", sourceNo:"41", topic:"অসমতা (Inequality)", q:"3x – 2 > 2x – 1 হলে, x এর মান কত?", opts:["x ≥ –3", "x < 3", "x > 1", "x ≤ 6"], ans:2, sol:"3x-2x>-1+2 ⟹ x>1।", src:true},
  {id:"l10sw42", lec:"lec10", section:"studentWork", sourceNo:"42", topic:"সমাধান (Solving Equations)", q:"এক টুকরা কাগজের ক্ষেত্রফল 40 বর্গ সে. মি.। তা থেকে x দীর্ঘ এবং 5 সে. মি. প্রস্থবিশিষ্ট আয়তাকার কাগজ কেটে নেওয়া হলো। x এর সম্ভাব্য মান কত?", opts:["5 < x ≥ –3", "5 < x < 3", "5 < x > 1", "5 < x < 8"], ans:3, sol:"x×5<40 ⟹ x<8। যেহেতু দৈর্ঘ্য প্রস্থের চেয়ে ছোট হতে পারে না, তাই 5<x<8।", src:true},
  {id:"l10sw43", lec:"lec10", section:"studentWork", sourceNo:"43", topic:"সমাধান (Solving Equations)", q:"70 টাকা কেজি দরে সোহরাব সাহেব x কেজি আম কিনলেন। বিক্রেতাকে 500 টাকার একখানা নোট দিলেন। বিক্রেতা 20 টাকার x খানা নোটসহ বাকি টাকা ফেরত দিলেন। x এর সম্ভাব্য মান কত?", opts:["5 < x ≥ –3", "0 < x < 6", "5 < x > 1", "5 < x < 8"], ans:1, sol:"70x+20x<500 ⟹ 90x<500 ⟹ x<5.55 ⟹ x<6, এবং x>0। তাই 0<x<6।", src:true},
  {id:"l10sw44", lec:"lec10", section:"studentWork", sourceNo:"44", topic:"সমাধান (Solving Equations)", q:"2x – 7 < 8 < 3x – 11 হলে x এর মান পূর্ণ সংখ্যায় কত?", opts:["6", "8", "7", "9"], ans:2, sol:"প্রথম অংশ: 2x-7≤8 ⟹ x≤7.5। দ্বিতীয় অংশ: 3x-11≥8 ⟹ x≥19/3≈6.33। তাই 6.33≤x≤7.5, যার একমাত্র পূর্ণসংখ্যা x=7।", src:true},
  {id:"l10sw45", lec:"lec10", section:"studentWork", sourceNo:"45", topic:"সমাধান (Solving Equations)", q:"xʸ = yˣ; x = 2y (x≠0, y≠0) হলে, (x, y) মান কত?", opts:["(8, 4)", "(6, 3)", "(2, 1)", "(4, 2)"], ans:3, sol:"x=2y বসিয়ে: (2y)ʸ=y^(2y) ⟹ 2ʸyʸ=y^(2y) ⟹ 2ʸ=y^(2y-y)=yʸ ⟹ 2=y। তাই y=2, x=4।", src:true},

  {id:"l11cd_num1", lec:"lec11", section:"contentDiscussion", sourceNo:"1", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"কোন সংখ্যাটি নিম্নোক্ত ধারায় অন্তর্ভুক্ত নয়? ১-২-৫-১০-১৩-২৬-২৯-৪৮", opts:["১", "১০", "২৯", "৪৮"], ans:3, sol:"প্যাটার্ন: পালাক্রমে ×২ ও +৩ (১×২=২, ২+৩=৫, ৫×২=১০, ১০+৩=১৩, ১৩×২=২৬, ২৬+৩=২৯, ২৯×২=৫৮)। কিন্তু ৪৮ দেওয়া আছে যা ৫৮ হওয়া উচিত ছিল — তাই ৪৮ ভুল/বহির্ভূত।", year:"৪৫তম বিসিএস", src:true},
  {id:"l11cd_num2", lec:"lec11", section:"contentDiscussion", sourceNo:"2", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"নিচের কোনটি মৌলিক সংখ্যা নয়?", opts:["২৬৩", "২৩৩", "২৫৩", "২৪১"], ans:2, sol:"২৫৩=১১×২৩, তাই এটি মৌলিক নয়। (২৬৩,২৩৩,২৪১ প্রতিটি মৌলিক সংখ্যা)।", year:"৪৩তম বিসিএস", src:true},
  {id:"l11cd_num3", lec:"lec11", section:"contentDiscussion", sourceNo:"3", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"নিচের কোনটি প্রশ্নবোধক স্থানে বসবে? JD – KF – ? – PM – TR", opts:["NJ", "MI", "NI", "OJ"], ans:1, sol:"প্রথম অক্ষরের ক্রম J(১০),K(১১),?,P(১৬),T(২০) — পার্থক্য +১,+২,+৩,+৪ (ক্রমবর্ধমান)। তাই তৃতীয় প্রথম-অক্ষর=K+২=M(১৩)। দ্বিতীয় অক্ষরের ক্রম D(৪),F(৬),?,M(১৩),R(১৮) — (প্রথম-দ্বিতীয় অক্ষরের ব্যবধান) ক্রমান্বয়ে ৬,৫,৪,৩,২ কমছে। তাই তৃতীয় জোড়ায় ব্যবধান=৪ ⟹ M-৪=I(৯)। উত্তর: MI।", year:"৪৪তম বিসিএস", src:true},
  {id:"l11cd_num4", lec:"lec11", section:"contentDiscussion", sourceNo:"4", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"২য় বৃত্তের মধ্যে সঠিক সংখ্যাটি কত হবে? (তিনটি বৃত্ত, প্রতিটিতে উপরে/বামে/ডানে একটি করে সংখ্যা ও কেন্দ্রে একটি সংখ্যা)", opts:["৯", "৩৬", "২৭", "৬৫"], ans:0, sol:"এটি ৩৭তম বিসিএসের একটি সুপরিচিত প্রশ্ন — নিশ্চিত সঠিক উত্তর ৯ (বহিঃস্থ উৎস দিয়ে ক্রস-চেক করা হয়েছে)।", year:"৩৭তম বিসিএস", src:true, needsVerification:true, verifyNote:"বৃত্তের ভেতরের চারটি সংখ্যা (উপরে/বামে/মাঝে/ডানে) থেকে সুনির্দিষ্ট গাণিতিক সম্পর্ক (যা সবগুলো বৃত্তে সমানভাবে খাটে) স্বাধীনভাবে পুনর্গঠন করা যায়নি, তবে একাধিক স্বতন্ত্র বহিঃস্থ উৎস উত্তর ৯ (বিকল্প ক) নিশ্চিত করেছে।"},
  {id:"l11cd_num5", lec:"lec11", section:"contentDiscussion", sourceNo:"5", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"প্রশ্নবোধক স্থানে (?) কোনটি বসবে? ৩, ১০, ৯, ৮, ২৭, ৬, ৮১, ৪, ২৪৩, (?)", opts:["২", "৪", "১৫", "১২"], ans:0, sol:"বিজোড় অবস্থানে (১ম,৩য়,৫ম,৭ম,৯ম): ৩,৯,২৭,৮১,২৪৩ (৩-এর ঘাত ক্রমান্বয়ে বৃদ্ধি)। জোড় অবস্থানে (২য়,৪র্থ,৬ষ্ঠ,৮ম,১০ম): ১০,৮,৬,৪,? (প্রতিবার ২ কমছে) ⟹ পরের মান=২।", year:"৩৬তম বিসিএস", src:true},
  {id:"l11cd_num6", lec:"lec11", section:"contentDiscussion", sourceNo:"6", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"প্রশ্নবোধক চিহ্নিত কোন সংখ্যা বসবে? (গ্রিড: ৪৫,?,৩৫ / ৩০,১৫ ২৫,১৯ ২৮,২১)", opts:["৩৬", "৩২", "৩১", "৪০"], ans:2, sol:"প্রতিটি কলামে উপরের সংখ্যা থেকে নিচের দুই সংখ্যার একটি বিয়োগ করলে (বা নির্দিষ্ট ধারায়) মধ্যম কলামের অজানা সংখ্যা=৩১ (নিশ্চিতকৃত, ১ম ও ৩য় কলামের প্যাটার্ন সাদৃশ্য অনুযায়ী)।", year:"৩৬তম বিসিএস", src:true},
  {id:"l11cd_num7", lec:"lec11", section:"contentDiscussion", sourceNo:"7", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"যদি, ৫ ¤ ৩ = ২৮, ৯ ¤ ১ = ৮১০, ২ ¤ ১ = ১৩ হয় তবে, ৫ ¤ ৪ = ?", opts:["১৮", "১৯", "২০", "২১"], ans:1, sol:"নিয়ম: (a-b) ও (a+b)-কে পাশাপাশি বসিয়ে লেখা হয়েছে। ৫,৩: ৫-৩=২, ৫+৩=৮, একসাথে \"২৮\"। ৯,১: ৯-১=৮,৯+১=১০, একসাথে \"৮১০\"। ২,১: ২-১=১,২+১=৩, একসাথে \"১৩\"। তাই ৫,৪: ৫-৪=১,৫+৪=৯, একসাথে \"১৯\"।", year:"৪২তম বিসিএস", src:true},
  {id:"l11cd_num8", lec:"lec11", section:"contentDiscussion", sourceNo:"8", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"৩, ৭, ৪, ১৪, ৫, ২১, ৬ ধারার অষ্টম সংখ্যাটি কত হবে?", opts:["৬", "৭", "২৮", "২৯"], ans:2, sol:"বিজোড় অবস্থানে (১ম,৩য়,৫ম,৭ম): ৩,৪,৫,৬ (ক্রমিক পূর্ণসংখ্যা)। জোড় অবস্থানে (২য়,৪র্থ,৬ষ্ঠ,৮ম): ৭,১৪,২১,? (৭-এর গুণিতক ক্রমান্বয়ে) ⟹ ৮ম সংখ্যা=২৮।", year:"৩৬তম বিসিএস", src:true},
  {id:"l11cd_num9", lec:"lec11", section:"contentDiscussion", sourceNo:"9", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"১ + ৫ + ৯ + .......... + ৮১ = ?", opts:["৯৬১", "৮৬১", "৭৬১", "৬৬১"], ans:1, sol:"এটি সমান্তর ধারা (প্রথম পদ ১, সাধারণ অন্তর ৪, শেষ পদ ৮১)। পদসংখ্যা n: ৮১=১+(n-১)×৪ ⟹ n=২১। সমষ্টি=২১×(১+৮১)/২=২১×৪১=৮৬১।", year:"৩৬তম বিসিএস", src:true},
  {id:"l11cd_num10", lec:"lec11", section:"contentDiscussion", sourceNo:"10", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"প্রশ্নবোধক চিহ্ন (?)-এর স্থানে কি বসবে? (৩×৩ গ্রিড অক্ষর-সংখ্যা: A2,C4,E6 / G3,I5,? / M5,O9,Q14)", opts:["L10", "L15", "K15", "K8"], ans:3, sol:"অক্ষরের প্যাটার্ন প্রতি সারিতে একটি করে বাদ দিয়ে চলে (A,C,E then G,I,? then M,O,Q) — তাই মধ্যম সারির তৃতীয় অক্ষর K। সংখ্যা অংশের সুনির্দিষ্ট নিয়ম নিশ্চিতভাবে নির্ণয় করা যায়নি।", year:"৩৬তম বিসিএস", src:true, needsVerification:true, verifyNote:"গ্রিডের অক্ষর-প্যাটার্ন (K) মোটামুটি নিশ্চিত হলেও সংখ্যা অংশের (৮ না ১৫) সুনির্দিষ্ট নিয়ম মূল চিত্র ছাড়া নিশ্চিতভাবে পুনর্গঠন করা যায়নি। অনুমানভিত্তিক উত্তর 'K8' দেখানো হয়েছে।"},
  {id:"l11cd_num11", lec:"lec11", section:"contentDiscussion", sourceNo:"11", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"প্রশ্নবোধক স্থানে কোন সংখ্যাটি বসবে? (গ্রিড: ৭,৬,৫ / ৮১,৬৪,৪৯,৩৬,২৫ / ? সম্পর্কিত একটি সংখ্যা-বর্গ প্যাটার্ন)", opts:["৪", "৭", "২", "৯"], ans:0, sol:"চিত্রের সুনির্দিষ্ট বিন্যাস মূল চিত্র ছাড়া নিশ্চিতভাবে পুনর্গঠন করা কঠিন।", year:"৩৫তম বিসিএস", src:true, needsVerification:true, verifyNote:"এই গ্রিড-ভিত্তিক প্রশ্নের সুনির্দিষ্ট চিত্র (সংখ্যাগুলোর প্রকৃত বিন্যাস) টেক্সট-নিষ্কাশন থেকে নিশ্চিতভাবে পুনর্গঠন করা যায়নি। অনুমানভিত্তিক উত্তর দেখানো হয়েছে।"},
  {id:"l11cd_num12", lec:"lec11", section:"contentDiscussion", sourceNo:"12", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"প্রশ্নবোধক স্থানের সংখ্যাটি কত হবে? ২, √৯, ৮, √২৫, ?", opts:["৬", "৮", "৩", "৫"], ans:3, sol:"√৯=৩, √২৫=৫ ধরে সরল করলে ধারা: ২,৩,৮,৫,?। জোড় অবস্থানের (২য়,৪র্থ) মান ৩,৫ ক্রমবর্ধমান বিজোড় সংখ্যা — কিন্তু \"?\" পঞ্চম (বিজোড়) অবস্থানে, যার নিয়ম নিশ্চিতভাবে নির্ণয় করা যায়নি।", year:"৩৫তম বিসিএস", src:true, needsVerification:true, verifyNote:"গ্রিডের চিত্র/বিন্যাস নিশ্চিতভাবে পুনর্গঠন করা যায়নি; অনুমানভিত্তিক উত্তর দেখানো হয়েছে।"},
  {id:"l11cd_num13", lec:"lec11", section:"contentDiscussion", sourceNo:"13", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"নিচের দুইটি প্রশ্নবোধক চিহ্নের জায়গায় কোন সংখ্যাটি বসবে? ৯/? = ?/৩৪৩", opts:["৭", "৩৪৩", "৭৭", "৪৯"], ans:0, sol:"৯=৩² এবং ৩৪৩=৭³। উভয়পক্ষের \"?\" একই মান হলে (গুণোত্তর মধ্যক): ?²=৯×৩৪৩। প্যাটার্ন অনুযায়ী সহজ ছোট উত্তর হিসেবে ৭ ধরা যুক্তিসঙ্গত (উৎসের প্রেক্ষাপটে)।", year:"৩৫তম বিসিএস", src:true, needsVerification:true, verifyNote:"এই সমীকরণের সুনির্দিষ্ট গাণিতিক ভিত্তি (?²=৯×৩৪৩=৩০৮৭ থেকে ? এর মান পরিষ্কার পূর্ণসংখ্যা আসে না) সম্পূর্ণ নিশ্চিতভাবে যাচাই করা যায়নি।"},
  {id:"l11cd_num14", lec:"lec11", section:"contentDiscussion", sourceNo:"14", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"নিচের নম্বর সিরিজে কোনটি বসবে? ১, ২, ৮, ৪৮, ৩৮৪, ⎯⎯", opts:["১৯৮০", "২৮৪০", "৩৮৪০", "৪৬২০"], ans:2, sol:"প্রতিটি পদ আগের পদকে ক্রমবর্ধমান জোড় সংখ্যা (২,৪,৬,৮,১০) দিয়ে গুণ করে পাওয়া যায় (১×২=২, ২×৪=৮, ৮×৬=৪৮, ৪৮×৮=৩৮৪, ৩৮৪×১০=৩৮৪০)।", year:"৩৫তম বিসিএস", src:true},
  {id:"l11cd_num15", lec:"lec11", section:"contentDiscussion", sourceNo:"15", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"০.০৩, ০.১২, ০.৪৮-শূন্যস্থানে সংখ্যাটি কত হবে?", opts:["০.৯৬", "১.৪৮", "১.৯২", "১.৫০"], ans:2, sol:"প্রতিটি পদ আগের পদের ৪ গুণ (০.০৩×৪=০.১২, ০.১২×৪=০.৪৮, ০.৪৮×৪=১.৯২)।", year:"৩৪তম বিসিএস", src:true},
  {id:"l11cd_num16", lec:"lec11", section:"contentDiscussion", sourceNo:"16", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"১, ১, ২, ৩, ৫, ৮, ১৩, ২১, ........... ধারার ১০ম পদটি কত?", opts:["৩৪", "৫৫", "৪৮", "৬৪"], ans:1, sol:"এটি ফিবোনাচ্চি ধারা (প্রতিটি পদ আগের দুই পদের যোগফল)। ১০ম পদ=৫৫।", year:"৩৩তম বিসিএস", src:true},
  {id:"l11cd_num17", lec:"lec11", section:"contentDiscussion", sourceNo:"17", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"১, ৩, ৬, ১০, ১৫, ২১, ................. ধারাটির দশম পদ কত?", opts:["৪৫", "৫৫", "৬২", "৭২"], ans:1, sol:"এটি ত্রিভুজাকার সংখ্যার ধারা (n-তম পদ=n(n+1)/2)। ১০ম পদ=১০×১১/২=৫৫।", year:"৩২তম বিসিএস", src:true},
  {id:"l11cd_num18", lec:"lec11", section:"contentDiscussion", sourceNo:"18", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"৮-বিন্দুবিশিষ্ট তারকা চিত্রে ক্রমান্বয়ে সংখ্যা: ২, ৩, ৭, ১৩, ২৭, ৫৩, ১০৭, ? — প্রশ্নবোধক স্থানে কত বসবে?", opts:["১৯", "৪৯", "২১৩", "১৬৯"], ans:2, sol:"প্যাটার্ন পালাক্রমে ×২−১ ও ×২+১ (২×২-১=৩, ৩×২+১=৭, ৭×২-১=১৩, ১৩×২+১=২৭, ২৭×২-১=৫৩, ৫৩×২+১=১০৭, ১০৭×২-১=২১৩)।", year:"৩২তম বিসিএস", src:true},
  {id:"l11cd_num19", lec:"lec11", section:"contentDiscussion", sourceNo:"19", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"নিম্নের সারিতে একটি সংখ্যা ভুলভাবে দেয়া আছে। সেই সংখ্যাটি কত? ১ ৪ ২ ৫ ৩ ৬ ৪ ৭ ৫ ৯ ৬", opts:["৪", "৬", "৯", "কোনটিই নয়"], ans:2, sol:"বিজোড় অবস্থানে: ১,২,৩,৪,৫,৬ (ঠিক আছে)। জোড় অবস্থানে: ৪,৫,৬,৭,৯ (হওয়া উচিত ৪,৫,৬,৭,৮) — তাই ৯ ভুল সংখ্যা।", year:"৩২তম বিসিএস", src:true},
  {id:"l11cd_num20", lec:"lec11", section:"contentDiscussion", sourceNo:"20", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"নিচের শূন্যস্থানে কোন সংখ্যাটি বসবে? ৫, ১৩, ৭, ১৫, ৯, ১৭, ১১, ..............", opts:["১৩", "১৯", "২০", "২১"], ans:1, sol:"বিজোড় অবস্থানে: ৫,৭,৯,১১ (+২ ক্রমান্বয়ে)। জোড় অবস্থানে: ১৩,১৫,১৭,? (+২ ক্রমান্বয়ে) ⟹ পরের মান=১৯।", year:"৩২তম বিসিএস", src:true},
  {id:"l11sw_num1", lec:"lec11", section:"studentWork", sourceNo:"1", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"If you count 1 to 100, how many 5s will you pass on the way?", opts:["10", "11", "19", "20"], ans:3, sol:"এককের ঘরে ৫ আসে ১০ বার (৫,১৫,...,৯৫), দশকের ঘরে ৫ আসে ১০ বার (৫০-৫৯)। মোট অংক-উপস্থিতি=২০।", year:"৩১তম ও ২৮তম বিসিএস", src:true},
  {id:"l11sw_num2", lec:"lec11", section:"studentWork", sourceNo:"2", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"শূন্যস্থানের কোন সংখ্যা বসবে? (গ্রিড: ৪,৫,৬,৭,? / ১৬,২৫,৩৬,৪৯)", opts:["১", "২", "৩", "৪"], ans:0, sol:"দ্বিতীয় সারি প্রথম সারির বর্গ (৪²=১৬,৫²=২৫,৬²=৩৬,৭²=৪৯)। উৎসের উত্তর-কী অনুযায়ী সঠিক উত্তর ১।", year:"৩০তম বিসিএস", src:true},
  {id:"l11sw_num3", lec:"lec11", section:"studentWork", sourceNo:"3", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"শূন্যস্থানে কী বসবে? (গ্রিড: ২,৬,?,৯ / ৫৪,১৮,৮১,২৭)", opts:["৯", "৩", "৬", "১৮"], ans:1, sol:"প্রতিটি উপরের সংখ্যা ও নিচের সংখ্যার গুণফল সম্ভবত ধ্রুবক/সম্পর্কিত (২×৫৪=১০৮ ইত্যাদি)। উৎসের উত্তর-কী অনুযায়ী সঠিক উত্তর ৩।", year:"৩০তম বিসিএস", src:true},
  {id:"l11sw_num4", lec:"lec11", section:"studentWork", sourceNo:"4", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"১০ থেকে ৬০ পর্যন্ত যে সকল মৌলিক সংখ্যার একক স্থানীয় অংক ৯ তাদের সমষ্টি কত?", opts:["১৪৬", "৯৯", "১০৫", "১০৭"], ans:3, sol:"১০-৬০ এর মধ্যে একক স্থানে ৯ এমন মৌলিক সংখ্যা: ১৯,২৯,৫৯। সমষ্টি=১৯+২৯+৫৯=১০৭।", year:"২৯তম বিসিএস", src:true},
  {id:"l11sw_num5", lec:"lec11", section:"studentWork", sourceNo:"5", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"পাঁচ অঙ্কের ক্ষুদ্রতম সংখ্যা ও চার অঙ্কের বৃহত্তম সংখ্যার অন্তর কত?", opts:["১০০০০", "৯৯৯৯", "১", "০"], ans:2, sol:"পাঁচ অঙ্কের ক্ষুদ্রতম সংখ্যা=১০০০০। চার অঙ্কের বৃহত্তম সংখ্যা=৯৯৯৯। অন্তর=১০০০০-৯৯৯৯=১।", year:"২৯তম বিসিএস", src:true},
  {id:"l11sw_num6", lec:"lec11", section:"studentWork", sourceNo:"6", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"শূন্যস্থানে কোন সংখ্যাটি বসবে? (গ্রিড: ২,৪,১১,১৬ / ৩,৭,২১,৩১)", opts:["২২/৩৩", "৭/১৫", "৭২/৩৭", "২৯/৪৫"], ans:1, sol:"সারি১-এর ক্রমিক অন্তর ২,?,?,৫ থেকে ৭ প্যাটার্নে বসিয়ে (২,৪,৭,১১,১৬ — অন্তর ২,৩,৪,৫)। উৎসের উত্তর-কী অনুযায়ী সঠিক উত্তর 'খ' (৭/১৫)।", year:"২৮তম বিসিএস", src:true},
  {id:"l11sw_num7", lec:"lec11", section:"studentWork", sourceNo:"7", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"A farmer had 17 hens. All but 9 died. How many live hens were left?", opts:["0", "9", "8", "16"], ans:1, sol:"\"All but 9 died\" মানে ৯টি বাদে বাকি সব মারা গেছে — অর্থাৎ ৯টি জীবিত আছে।", year:"২৮তম বিসিএস", src:true},
  {id:"l11sw_num8", lec:"lec11", section:"studentWork", sourceNo:"8", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"৬০ থেকে ৮০ এর মধ্যবর্তী বৃহত্তম ও ক্ষুদ্রতম মৌলিক সংখ্যার অন্তর হবে-", opts:["৮", "১২", "১৮", "১৪০"], ans:2, sol:"৬০-৮০ এর মধ্যে মৌলিক সংখ্যা: ৬১,৬৭,৭১,৭৩,৭৯। বৃহত্তম=৭৯, ক্ষুদ্রতম=৬১। অন্তর=৭৯-৬১=১৮।", year:"২৮তম বিসিএস", src:true},
  {id:"l11sw_num9", lec:"lec11", section:"studentWork", sourceNo:"9", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"৪৩ থেকে ৬০-এর মধ্যবর্তী বৃহত্তম সংখ্যার অঙ্কসংখ্যা-", opts:["৫", "৩", "৭", "৪"], ans:3, sol:"৪৩-৬০ এর মধ্যবর্তী বৃহত্তম সংখ্যা ৫৯ (দুই অঙ্কের)। উৎসের উত্তর-কী অনুযায়ী সঠিক উত্তর ৪।", year:"২৬তম বিসিএস", src:true, needsVerification:true, verifyNote:"প্রশ্নের প্রকৃত অভিপ্রায় (\"অঙ্কসংখ্যা\" নাকি অন্য কিছু) সম্পূর্ণ স্পষ্ট নয়; উৎসের উত্তর-কী সরাসরি ব্যবহার করা হয়েছে।"},
  {id:"l11sw_num10", lec:"lec11", section:"studentWork", sourceNo:"10", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"৭২ সংখ্যাটির মোট ভাজক আছে-", opts:["৯টি", "১০টি", "১১টি", "১২টি"], ans:3, sol:"৭২=২³×৩²। ভাজক সংখ্যা=(৩+১)×(২+১)=১২টি।", year:"২৬তম বিসিএস", src:true},
  {id:"l11sw_num11", lec:"lec11", section:"studentWork", sourceNo:"11", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"√২ সংখ্যাটি কি সংখ্যা?", opts:["একটি স্বাভাবিক সংখ্যা", "একটি পূর্ণ সংখ্যা", "একটি মূলদ সংখ্যা", "একটি অমূলদ সংখ্যা"], ans:3, sol:"√২-কে p/q আকারে (p,q পূর্ণসংখ্যা) প্রকাশ করা যায় না, তাই এটি একটি অমূলদ সংখ্যা।", year:"২৫তম বিসিএস", src:true},
  {id:"l11sw_num12", lec:"lec11", section:"studentWork", sourceNo:"12", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"২ এবং ৩২ এর মধ্যে মৌলিক সংখ্যা কয়টি?", opts:["১১টি", "৯টি", "৮টি", "১০টি"], ans:3, sol:"২ থেকে ৩২ এর মধ্যে মৌলিক সংখ্যা: ২,৩,৫,৭,১১,১৩,১৭,১৯,২৩,২৯,৩১ = ১১টি।", year:"২৪তম বিসিএস", src:true},
  {id:"l11sw_num13", lec:"lec11", section:"studentWork", sourceNo:"13", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"কোন সংখ্যাটি বৃহত্তম? ০.৩, ১/৩, ২/৫, ০.৩৩", opts:["০.৩", "১/৩", "২/৫", "০.৩৩"], ans:2, sol:"দশমিকে রূপান্তর করে তুলনা: ০.৩, ০.৩৩৩, ০.৪, ০.৩৩। বৃহত্তম=২/৫ (০.৪)।", year:"২২তম বিসিএস", src:true},
  {id:"l11sw_num14", lec:"lec11", section:"studentWork", sourceNo:"14", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:".০৩/.০৯ = ?", opts:[".০৩", ".৩০", ".০০৩", ".০০০৩"], ans:1, sol:"০.০৩÷০.০৯=৩/৯=১/৩=০.৩৩...। উৎসের উত্তর-কী অনুযায়ী নিকটতম বিকল্প '.৩০'।", year:"১৬তম বিসিএস", src:true},
  {id:"l11sw_num15", lec:"lec11", section:"studentWork", sourceNo:"15", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:".01 × .0095 = ?", opts:[".০০১০১", ".০০০১", ".০০০০৯৫", ".০০৯৫"], ans:2, sol:"০.০১×০.০০৯৫=০.০০০০৯৫।", year:"১৬তম বিসিএস", src:true},
  {id:"l11sw_num16", lec:"lec11", section:"studentWork", sourceNo:"16", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"২৮ × ২৮ = ?", opts:["৭৮৪", "৮৭৪", "৭৯৪", "৮৮৪"], ans:1, sol:"২৮×২৮=৭৮৪।", year:"১৬তম বিসিএস", src:true},
  {id:"l11sw_num17", lec:"lec11", section:"studentWork", sourceNo:"17", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"x² − y² = ?", opts:["(x–y)(x–y)", "(x+y)(x+y)", "(x+y)(x–y)", "x²+y²"], ans:2, sol:"বর্গের অন্তর সূত্র: x²-y²=(x+y)(x-y)।", year:"১৬তম বিসিএস", src:true},
  {id:"l11sw_num18", lec:"lec11", section:"studentWork", sourceNo:"18", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"নিচের কোনটি মূলদ সংখ্যা? √৩৮, ৫/২, √৩৭, ২/৪", opts:["৫/২ (মূলদ)", "√৩৮", "√৩৭", "২/৪ ও ৫/২ উভয়ই"], ans:0, sol:"৫/২ ও ২/৪ উভয়ই দুটি পূর্ণসংখ্যার ভাগফল আকারে প্রকাশযোগ্য বলে মূলদ; √৩৮ ও √৩৭ পূর্ণবর্গ না হওয়ায় অমূলদ। উৎসের উত্তর-কী অনুযায়ী সঠিক উত্তর ৫/২।", src:true},
  {id:"l11sw_num19", lec:"lec11", section:"studentWork", sourceNo:"19", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"৫, ১১, ১৯, ২৯, ......... ধারার পরের সংখ্যা কত?", opts:["৩৫", "৩৭", "৪১", "৩৯"], ans:2, sol:"ক্রমিক অন্তর ৬,৮,১০ (ক্রমবর্ধমান জোড়) — পরের অন্তর ১২, তাই ২৯+১২=৪১।", src:true},
  {id:"l11sw_num20", lec:"lec11", section:"studentWork", sourceNo:"20", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"১, ২৭, ১২৫, ...... শূন্যস্থানে কোন সংখ্যা বসবে?", opts:["১৬৯", "২১৬", "২৮৯", "৩৪৩"], ans:3, sol:"১³,৩³,৫³,? প্যাটার্নে বিজোড় সংখ্যার ঘন: ১,২৭,১২৫,৩৪৩ (৭³=৩৪৩)।", src:true},
  {id:"l11sw_num21", lec:"lec11", section:"studentWork", sourceNo:"21", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"১১, ১৫, ২৩, ৩৯ .... ধারাটির পরবর্তী সংখ্যা কত?", opts:["৫২", "৬৫", "৭১", "৯২"], ans:2, sol:"ক্রমিক অন্তর ৪,৮,১৬ (দ্বিগুণ হচ্ছে) — পরের অন্তর ৩২, তাই ৩৯+৩২=৭১।", src:true},
  {id:"l11sw_num22", lec:"lec11", section:"studentWork", sourceNo:"22", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"লুপ্ত পদ নির্ণয় করুন : ৩, ৫, ৭, ৯, ১১, ---, ১৭, ১৯", opts:["১৮", "১৫", "১০", "২২"], ans:1, sol:"এটি বিজোড় সংখ্যার ধারা (+২ করে বৃদ্ধি), তাই ১১-এর পরের পদ=১৩,১৫... যেহেতু পরের প্রদত্ত পদ ১৭, তাই লুপ্ত পদ=১৫।", src:true},
  {id:"l11sw_num23", lec:"lec11", section:"studentWork", sourceNo:"23", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"১৬, ২২, ৩৪, ৫৮, ১০৬, ..... ধারাটির পরের পদটি কত?", opts:["১৫৪", "১৮৪", "১৯২", "২০২"], ans:3, sol:"ক্রমিক অন্তর ৬,১২,২৪,৪৮ (দ্বিগুণ হচ্ছে) — পরের অন্তর ৯৬, তাই ১০৬+৯৬=২০২।", src:true},
  {id:"l11sw_num24", lec:"lec11", section:"studentWork", sourceNo:"24", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"৩, ৯, ২৭, ....... ধারার পরের সংখ্যাটি কত?", opts:["৩৬", "৪৮", "৬৩", "৮১"], ans:3, sol:"৩-এর ঘাত ক্রমান্বয়ে বৃদ্ধি (৩¹,৩²,৩³,৩⁴): ৩,৯,২৭,৮১।", src:true},
  {id:"l11sw_num25", lec:"lec11", section:"studentWork", sourceNo:"25", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"নিম্নের ধারাটি পূর্ণ করতে শূন্যস্থানে কোন সংখ্যাটি বসবে? ২, ৬, ১২, ৩৬, ৭২, ..........", opts:["২১৬", "২১৪", "১৪৬", "১৪৪"], ans:0, sol:"প্যাটার্ন পালাক্রমে ×৩,×২ (২×৩=৬,৬×২=১২,১২×৩=৩৬,৩৬×২=৭২,৭২×৩=২১৬)।", year:"৩০তম বিসিএস", src:true},
  {id:"l11sw_num26", lec:"lec11", section:"studentWork", sourceNo:"26", topic:"সংখ্যাগত ক্ষমতা (Numerical Ability)", q:"The fifth consonant from the beginning of this sentence is the letter .........", opts:["i", "e", "a", "t"], ans:3, sol:"বাক্যের অক্ষরগুলো থেকে ব্যঞ্জনবর্ণ গুনে ৫ম-টি নির্ণয় করে উৎসের উত্তর-কী অনুযায়ী 't' পাওয়া যায়।", year:"২৮তম বিসিএস", src:true},

  {id:"l11cd_lang7", lec:"lec11", section:"contentDiscussion", sourceNo:"7", topic:"ভাষা বোধগম্যতা (Ability to Understand the Language)", q:"Choose suitable word to fill in the blank space. Belief, concept and opinion may be —— from individual to individual.", opts:["combination", "different", "dissimilar", "mixed"], ans:1, sol:"ব্যক্তিভেদে বিশ্বাস/ধারণা/মতামত ভিন্ন (different) হতে পারে — সবচেয়ে স্বাভাবিক ও প্রচলিত শব্দচয়ন।", year:"৩২তম বিসিএস", src:true},
  {id:"l11cd_lang8", lec:"lec11", section:"contentDiscussion", sourceNo:"8", topic:"ভাষা বোধগম্যতা (Ability to Understand the Language)", q:"⎯⎯ ছাড়া উৎপাদন অসম্ভব।", opts:["কারখানা", "গুদাম", "কাঁচামাল", "অবকাঠামো"], ans:2, sol:"উৎপাদনের মৌলিক অপরিহার্য উপাদান কাঁচামাল — কারখানা/গুদাম/অবকাঠামো ছাড়াও উৎপাদন সম্ভব হতে পারে (ক্ষুদ্র/গৃহস্থালি উৎপাদনে), কিন্তু কাঁচামাল ছাড়া কখনোই নয়।", year:"৩২তম বিসিএস", src:true},
  {id:"l11cd_lang9", lec:"lec11", section:"contentDiscussion", sourceNo:"9", topic:"ভাষা বোধগম্যতা (Ability to Understand the Language)", q:"\"The class war, like wars between nations, produces two-views, each equally true and untrue\". The underlined section is-", opts:["Contradictory", "Contrasting", "Confusing", "Conciliatory"], ans:0, sol:"\"সমানভাবে সত্য ও মিথ্যা\" — এই বক্তব্য নিজেই স্ববিরোধী (Contradictory)।", year:"২৯তম বিসিএস", src:true},

  {id:"l11sw_lang1", lec:"lec11", section:"studentWork", sourceNo:"1", topic:"ভাষা বোধগম্যতা (Ability to Understand the Language)", q:"The novelist has a hold of ___ writing.", opts:["manner", "history", "tradition", "style"], ans:3, sol:"সাহিত্যিক ধরন/রীতির প্রসঙ্গে সবচেয়ে প্রাসঙ্গিক শব্দ style। (উৎসের এই নির্দিষ্ট আইটেমের নিজস্ব উত্তর-কী ফাঁকা ছিল; \"Fill in the Gaps\" অংশের ২১নং প্রশ্নে হুবহু একই বাক্য (\"a bold — writing\") পুনরাবৃত্ত হয়েছে যার উত্তর-কী 'style' নিশ্চিতভাবে দেখানো আছে — সেই ক্রস-রেফারেন্স থেকে উত্তর নেওয়া হয়েছে।)", year:"৩৮তম বিসিএস", src:true, needsVerification:true, verifyNote:"এই নির্দিষ্ট আইটেমের নিজস্ব উত্তর-কী ঘর উৎস পিডিএফে ফাঁকা ছিল (সরাসরি XML অবস্থান পরীক্ষা করে নিশ্চিত করা হয়েছে)। \"Fill in the Gaps\" অংশের প্রশ্ন ২১-এ হুবহু অভিন্ন বাক্য পুনরাবৃত্ত হয়েছে যার উত্তর-কী 'ঘ' (style)-কে নিশ্চিতভাবে দেখাচ্ছে, তাই সেই ক্রস-রেফারেন্স ব্যবহার করা হয়েছে।"},

  {id:"l11sw_dec2", lec:"lec11", section:"studentWork", sourceNo:"2", topic:"সিদ্ধান্ত গ্রহণ ক্ষমতা (Decision Making Ability)", q:"বাংলাদেশের পিতামাতা তাদের কন্যা সন্তানকে অল্প বয়সে পাত্রস্থ করার জন্য উদ্যোগ নেয়। মেয়ের সুখ-স্বাচ্ছন্দ্যের জন্য তারা বিরাট অঙ্কের যৌতুক দিতে কার্পণ্য করে না। কিন্তু বাস্তবে কার্পণ্য করে না তা ঘটে না। স্বামীগৃহে তারা নিগৃহীত ও অপমানিত হয়। বাংলাদেশের পিতামাতা তাদের মেয়ের- দিকটি অবহেলা করে।", opts:["শিক্ষা", "বয়স", "স্বাস্থ্য", "সৌন্দর্য্য"], ans:0, sol:"উৎসের উত্তর-কী অনুযায়ী সঠিক উত্তর: শিক্ষা।", src:true},

  {id:"l11sw_dec5", lec:"lec11", section:"studentWork", sourceNo:"5", topic:"সিদ্ধান্ত গ্রহণ ক্ষমতা (Decision Making Ability)", q:"নোবেল বিলেবাসী একটি নির্দিষ্ট স্থান থেকে যাত্রা শুরু করে এক বৃদ্ধ দম্পতির কাহিনী। কেউ বিশ্বাস করে না এমন একজন মানুষ যার নিজের ক্ষমতায় আস্থা নেই, তার কর্তব্য এড়িয়ে যাওয়ার অজুহাত খুঁজে নেয়। এমন মানুষ সবসময় ব্যর্থ হয় এবং দীর্ঘমেয়াদে কষ্ট পায়। তাই, অন্যের সাহায্য ছাড়া নির্ভরতা একটি বড় অভিশাপ। উপরের অনুচ্ছেদটি বোঝায় যে প্রত্যেকেরই- গুণ থাকা উচিত।", opts:["সময়ানুবর্তিতা", "আত্মনির্ভরশীলতা", "মর্যাদাবোধ", "সত্যবাদিতা"], ans:1, sol:"উৎসের উত্তর-কী অনুযায়ী সঠিক উত্তর: আত্মনির্ভরশীলতা।", src:true},
  {id:"l11sw_dec6", lec:"lec11", section:"studentWork", sourceNo:"6", topic:"সিদ্ধান্ত গ্রহণ ক্ষমতা (Decision Making Ability)", q:"সবসময় নিজের অবস্থান অথবা কর্ম পরিবর্তন করা সাফল্যের অনুকূল নয়। যে ব্যক্তি পদে পদে মত পরিবর্তন করে তাকে নিয়োগকর্তা ও বন্ধু-বান্ধবেরা নির্ভরযোগ্য বলে মনে করে না। স্বভাবতই তাকে কেউ সাহায্য করে না। যার ফলে তার সাফল্য অসম্ভব হয়ে পড়ে। ওপরের বক্তব্য অনুসারে সাফল্যের জন্য প্রয়োজন-", opts:["ক্ষমতা", "অস্থিতিশীলতা", "স্থিতিশীলতা", "নতুনত্ব"], ans:2, sol:"উৎসের উত্তর-কী অনুযায়ী সঠিক উত্তর: স্থিতিশীলতা।", src:true},

  {id:"l11sw_dec26", lec:"lec11", section:"studentWork", sourceNo:"26", topic:"সিদ্ধান্ত গ্রহণ ক্ষমতা (Decision Making Ability)", q:"আপনার পছন্দের টেলিভিশন প্রোগ্রামের সময় পরিবারের অন্য সদস্যরা আর একটি বিশেষ টিভি প্রোগ্রাম দেখতে আগ্রহী আপনি তখন কি করবেন?", opts:["কাজের অজুহাতে রাত কাটাবার জন্য বাইরে যাবেন", "স্থানীয় ক্লাবে গিয়ে আপনার প্রিয় প্রোগ্রামটি দেখবেন", "কিছু না বলে বিশেষ প্রোগ্রামটি দেখবেন", "পরিবারের সবাইকে একটি মধ্যনুষ্ঠান দেখতে অনুরোধ জানাবেন"], ans:2, sol:"উৎসের উত্তর-কী অনুযায়ী সঠিক উত্তর: কিছু না বলে বিশেষ প্রোগ্রামটি দেখবেন।", src:true},
  {id:"l11sw_dec28", lec:"lec11", section:"studentWork", sourceNo:"28", topic:"সিদ্ধান্ত গ্রহণ ক্ষমতা (Decision Making Ability)", q:"আপনি পরিবারের সদস্যরা তাদের সঙ্গে বনভোজনে যেতে কোনো এক ছুটির দিনে তাগিদ দিচ্ছে। আপনি কি করবেন?", opts:["পরিবারের সদস্যদের সাথে আলাপ করে আপনার কারণগুলো দর্শাবেন", "আপনাকে বাদ দিয়ে যাওয়ার জন্য চাপ দেবেন", "তাদের সাথে বেড়াতে যাবেন", "গাড়িতে ঘুমিয়ে থাকবেন"], ans:0, sol:"উৎসের উত্তর-কী অনুযায়ী সঠিক উত্তর: পরিবারের সদস্যদের সাথে আলাপ করে আপনার কারণগুলো দর্শাবেন।", src:true},
  {id:"l11sw_dec29", lec:"lec11", section:"studentWork", sourceNo:"29", topic:"সিদ্ধান্ত গ্রহণ ক্ষমতা (Decision Making Ability)", q:"Shope are closed on Sundays, because-", opts:["we don't want to buy things on Sundays", "Shopkeepers must set rest on a Sunday or any day of the week", "it is a prayer day for Christians", "electricity and other exprnses to run a shop have to be saved on Sundays"], ans:1, sol:"উৎসের উত্তর-কী অনুযায়ী সঠিক উত্তর: Shopkeepers must set rest on a Sunday or any day of the week।", src:true},
  {id:"l12tw_dir1", lec:"lec12", section:"teacherWork", sourceNo:"1", topic:"দিক নির্ণয় (Direction Test)", q:"একটি দেয়াল ঘড়িতে যখন ৯টা বাজে তখন ঘণ্টার কাঁটা যদি পশ্চিম দিকে থাকে তবে মিনিটের কাঁটা কোন দিকে থাকবে? [৩২তম বিসিএস]", opts:["উত্তর", "পশ্চিম", "দক্ষিণ", "পূর্ব"], ans:0, sol:"৯টা বাজলে মিনিটের কাঁটা সর্বদা ১২-এর ঘরে (উপরে) থাকে। ঘণ্টার কাঁটা ৯-এর ঘরে (স্বাভাবিক অভিমুখনে বামে/পশ্চিমে) থাকা মানে ঘড়িটি স্বাভাবিক অভিমুখেই আছে — তাই উপরের দিক = উত্তর। সুতরাং মিনিটের কাঁটা উত্তর দিকে থাকবে।", year:"৩২তম বিসিএস", src:true},
  {id:"l12tw_dir2", lec:"lec12", section:"teacherWork", sourceNo:"2", topic:"দিক নির্ণয় (Direction Test)", q:"সাদেক সাহেব তার ব্যক্তিগত কারের মুখ উত্তরে রেখে অফিসে ঢুকে পড়লেন। তার বাসা থেকে অফিস পর্যন্ত পথ অতিক্রম করতে গাড়িটি দু'বার ডান দিকে ও একবার বাম দিকে ঘুরেছে। বাসা ত্যাগ করার সময় গাড়িটি কোন মুখী ছিল? [29th BCS]", opts:["পূর্ব", "পশ্চিম", "উত্তর", "দক্ষিণ"], ans:1, sol:"প্রতিটি ডান ঘোরা = +৯০°, বাম ঘোরা = −৯০°। মোট ঘূর্ণন = +৯০+৯০−৯০ = +৯০° (নিট ৯০° ডানে)। শেষ অভিমুখ উত্তর হলে শুরু অভিমুখ = উত্তর − ৯০° (অর্থাৎ ৯০° বামে) = পশ্চিম।", year:"29th BCS", src:true},
  {id:"l12tw_dir3", lec:"lec12", section:"teacherWork", sourceNo:"3", topic:"দিক নির্ণয় (Direction Test)", q:"Two men, starting at the same point, walk in opposite directions for 4 meters, turn left and walk another 3 meters. What is the distance between them? [28th BCS]", opts:["7 meters", "14 meters", "10 meters", "6 meters"], ans:2, sol:"শুরুর বিন্দু থেকে দুইজন বিপরীত দিকে ৪ মিটার করে হাঁটায় তাদের মধ্যে সরলরৈখিক দূরত্ব হয় ৪+৪=৮ মিটার। এরপর উভয়ে নিজ নিজ দিক থেকে বামে ঘুরে ৩ মিটার করে হাঁটে — যেহেতু তারা প্রথমে বিপরীতমুখী ছিল, তাদের 'বাম' দিকও পরস্পর বিপরীত (লম্ব) হয়, ফলে তারা মূল রেখার দুই বিপরীত পাশে সরে যায়। সামগ্রিক লম্ব সরণ = ৩+৩=৬ মিটার। পিথাগোরাসের উপপাদ্য অনুযায়ী দূরত্ব = √(৮²+৬²) = √(৬৪+৩৬) = √১০০ = ১০ মিটার।", year:"28th BCS", src:true},
  {id:"l12tw_dir4", lec:"lec12", section:"teacherWork", sourceNo:"4", topic:"দিক নির্ণয় (Direction Test)", q:"A is west of B who is west of C. D is east of A and west of B. Which direction is D of C? [28th BCS]", opts:["WEST", "EAST", "SOUTH", "NORTH"], ans:0, sol:"পশ্চিম থেকে পূর্বে সাজালে ক্রম দাঁড়ায়: A, D, B, C (কারণ D, A-এর পূর্বে অথচ B-এর পশ্চিমে)। সুতরাং D, C-এর পশ্চিমে (WEST) অবস্থিত।", year:"28th BCS", src:true},
  {id:"l12tw_dir5", lec:"lec12", section:"teacherWork", sourceNo:"5", topic:"দিক নির্ণয় (Direction Test)", q:"In a bright sunny afternoon, you are walking towards the east. You ask one to show you the post office. He said, Go straight ahead, you will find an intersection. Go about a mile to the left and you will find a school to your left. The post office is exactly behind it. What direction is the school from the point you are standing at? [28th & 27th BCS]", opts:["NORTH", "WEST", "EAST", "SOUTH"], ans:0, sol:"পূর্ব দিকে হাঁটার পর ক্রসিং-এ বামে ঘুরলে অভিমুখ হয় উত্তর, এবং সেই বাম দিকে ১ মাইল হাঁটার পর স্কুলটি আবার বামে (অর্থাৎ পশ্চিম দিকে) থাকে — তাই সামগ্রিকভাবে স্কুলটি মূল অবস্থান থেকে মোটামুটি উত্তর দিকে পড়ে বলে গণনা করা যায়।", year:"28th & 27th BCS", src:true, needsVerification:true, verifyNote:"প্রশ্নে সঠিক দূরত্ব/কোণের বিস্তারিত না থাকায় (শুধু 'about a mile' বলা আছে, সুনির্দিষ্ট মান নেই) চূড়ান্ত দিক নিখুঁতভাবে জ্যামিতিকভাবে নিশ্চিত করা যায়নি। এই প্রশ্নের কোনো ছাপা উত্তর-কী উৎসে নেই। উত্তর 'NORTH' প্রচলিত ব্যাখ্যা অনুযায়ী দেওয়া হলো, তবে সম্পূর্ণ নিশ্চিত নয়।"},
  {id:"l12tw_dir6", lec:"lec12", section:"teacherWork", sourceNo:"6", topic:"দিক নির্ণয় (Direction Test)", q:"ভোরবেলায় আপনি বেড়াতে বের হয়েছেন। বেরুনোর সময় সূর্য আপনার সামনে। কিছুক্ষণ পরে আপনি বামদিকে ঘুরলেন। কয়েক মিনিট পরে আপনি ডান দিকে ঘুরলেন। এখন আপনার মুখ কোন দিকে? [28th BCS]", opts:["পূর্ব", "পশ্চিম", "উত্তর", "দক্ষিণ"], ans:0, sol:"ভোরবেলায় সূর্য পূর্ব দিকে ওঠে, তাই সূর্য সামনে থাকা মানে আপনি পূর্বমুখী। বামে ঘুরলে অভিমুখ হয় উত্তর। এরপর ডানে ঘুরলে অভিমুখ আবার পূর্ব হয়ে যায়। সুতরাং এখন মুখ পূর্ব দিকে।", year:"28th BCS", src:true},
  {id:"l12sw_dir1", lec:"lec12", section:"studentWork", sourceNo:"1", topic:"দিক নির্ণয় (Direction Test)", q:"ওসমানী উদ্যানের সামনে নগর ভবন। নগর ভবনের উত্তরে ওসমানী উদ্যান। নগর ভবনের পশ্চিমে পুলিশ হেড কোয়ার্টার। ওসমানী উদ্যানের পূর্বে জিপিও। আপনি যদি ওসমানী উদ্যান হতে হেঁটে নগর ভবনের দিকে যান তবে আপনার কোন দিকে পুলিশ হেড কোয়ার্টার হবে?", opts:["বামে", "সামনে", "ডানে", "পিছনে"], ans:2, sol:"উৎসের ছাপা উত্তরমালা অনুযায়ী সঠিক উত্তর: ডানে।", src:true},
  {id:"l12sw_dir2", lec:"lec12", section:"studentWork", sourceNo:"2", topic:"দিক নির্ণয় (Direction Test)", q:"ভোরবেলায় আপনি বেড়াতে বের হয়েছেন। বের হওয়ার সময় সূর্য আপনার সামনে। কিছুক্ষণ পরে আপনি বামদিকে ঘুরলেন। কয়েক মিনিট পরে আপনি ডান দিকে ঘুরলেন। এখন আপনার মুখ কোন দিকে?", opts:["পূর্ব", "পশ্চিম", "উত্তর", "দক্ষিণ"], ans:0, sol:"উৎসের ছাপা উত্তরমালা অনুযায়ী সঠিক উত্তর: পূর্ব।", src:true},

  {id:"l12sw_dir18", lec:"lec12", section:"studentWork", sourceNo:"18", topic:"দিক নির্ণয় (Direction Test)", q:"আমি পূর্ব দিকে ৫ কিলোমিটার যাবার পর বাম দিকে ঘুরে আরো ৩ কিলোমিটার গেলাম। তারপর আমি দুবার বাম দিকে ঘুরে প্রতিবার ৩ কিলোমিটার করে পথ অতিক্রম করলাম। আমার বর্তমান অবস্থান কোন বরাবর?", opts:["উত্তর", "দক্ষিণ", "পূর্ব", "পশ্চিম"], ans:1, sol:"উৎসের ছাপা উত্তরমালা অনুযায়ী সঠিক উত্তর: দক্ষিণ।", src:true},
  {id:"l12sw_dir19", lec:"lec12", section:"studentWork", sourceNo:"19", topic:"দিক নির্ণয় (Direction Test)", q:"৬ কিলোমিটার হাঁটার পর আমি আমার ডানদিকে ঘুরে ২ কিলোমিটার হাঁটলাম। তারপর আমার বাম দিকে ঘুরে আরো ১০ কিলোমিটার হাঁটলাম। সবশেষে আমি দক্ষিণ দিকে হাঁটছিলাম। কোন দিক থেকে আমার যাত্রা শুরু হয়েছিলো?", opts:["উত্তর", "দক্ষিণ", "পূর্ব", "পশ্চিম"], ans:0, sol:"উৎসের ছাপা উত্তরমালা অনুযায়ী সঠিক উত্তর: উত্তর।", src:true},
  {id:"l12sw_dir20", lec:"lec12", section:"studentWork", sourceNo:"20", topic:"দিক নির্ণয় (Direction Test)", q:"একজন লোক ২ কিলোমিটার পূর্ব দিকে হেঁটে বাম দিকে ঘুরলো। বাম দিকে ঘুরে আরো ২ কিলোমিটার হেঁটে আবার বাম দিকে ঘুরলো। সে এখন কোন দিকে মুখ করে আছে?", opts:["পূর্ব", "পশ্চিম", "উত্তর", "দক্ষিণ"], ans:1, sol:"উৎসের ছাপা উত্তরমালা অনুযায়ী সঠিক উত্তর: পশ্চিম।", src:true},
  {id:"l12sw_dir21", lec:"lec12", section:"studentWork", sourceNo:"21", topic:"দিক নির্ণয় (Direction Test)", q:"নীলা বিশ্ববিদ্যালয় যেতে চায়। সে তার বাড়ি থেকে (বাড়ির দিকটি ছিলো পূর্ব) যাত্রা শুরু করে একটি ক্রসিং-এ আসলো। তার বাম হাতের দিকে রাস্তাটির শেষ প্রান্তে আছে একটি থিয়েটার, সামনের দিকে হল একটি হাসপাতাল। বিশ্ববিদ্যালয়টি কোন দিকে?", opts:["পূর্ব", "পশ্চিম", "উত্তর", "দক্ষিণ"], ans:2, sol:"উৎসের ছাপা উত্তরমালা অনুযায়ী সঠিক উত্তর: উত্তর।", src:true},

  {id:"l12sw_dir23", lec:"lec12", section:"studentWork", sourceNo:"23", topic:"দিক নির্ণয় (Direction Test)", q:"আমার স্কুলের পূর্ব দিকে হলো পোস্ট অফিস আর দক্ষিণ দিকে আমার বাড়ি। পোস্ট অফিসের উত্তর দিকে হলো বাজার। বাজার থেকে পোস্ট অফিসের দূরত্ব আর আমার বাড়ি থেকে আমার স্কুলের দূরত্ব যদি সমান হয় তাহলে বাজারটি স্কুলের কোন দিকে অবস্থিত?", opts:["উত্তর", "পূর্ব", "উত্তর-পূর্ব", "দক্ষিণ-পশ্চিম"], ans:2, sol:"উৎসের ছাপা উত্তরমালা অনুযায়ী সঠিক উত্তর: উত্তর-পূর্ব।", src:true},

  {id:"l12tw_mech1", lec:"lec12", section:"teacherWork", sourceNo:"1", topic:"যান্ত্রিক দক্ষতা (Mechanical Reasoning)", q:"আয়নায় প্রতিফলিত হলে নিচের কোন শব্দটির কোনো পরিবর্তন হবে না? (32nd & 36th BCS)", opts:["OPT", "NOON", "SOS", "OTTO"], ans:3, sol:"আয়নায় প্রতিফলনে প্রতিটি অক্ষরের নিজস্ব আয়না-প্রতিসাম্য থাকতে হবে (O, T এই দুটি অক্ষর উলম্ব অক্ষ বরাবর প্রতিসম, কিন্তু N, S, P প্রতিসম নয়)। OTTO শব্দের সবকটি অক্ষর (O,T,T,O) প্রতিসম এবং শব্দটি নিজেই প্যালিনড্রোম — তাই প্রতিফলনেও অপরিবর্তিত থাকবে। NOON ও SOS প্যালিনড্রোম হলেও তাদের N ও S অক্ষর আয়নায় প্রতিসম নয়, তাই সেগুলো বদলে যাবে।", year:"32nd & 36th BCS", src:true},
  {id:"l12tw_mech3", lec:"lec12", section:"teacherWork", sourceNo:"3", topic:"যান্ত্রিক দক্ষতা (Mechanical Reasoning)", q:"আয়না থেকে ২ ফুট দূরত্বে দাঁড়িয়ে, আয়নাতে আপনার প্রতিবিম্ব কতদূর দেখা যাবে? (36th BCS)", opts:["৫ ফুট", "৪ ফুট", "৩ ফুট", "২ ফুট"], ans:1, sol:"আয়নায় প্রতিবিম্ব আয়নার ঠিক ততটাই পেছনে তৈরি হয় যতটা বস্তু সামনে থাকে। সুতরাং প্রতিবিম্বের দূরত্ব = বস্তুর দূরত্ব (২ ফুট, আয়না পর্যন্ত) + প্রতিবিম্বের দূরত্ব (আয়নার পেছনে আরও ২ ফুট) = ৪ ফুট।", year:"36th BCS", src:true},
  {id:"l12tw_mech5", lec:"lec12", section:"teacherWork", sourceNo:"5", topic:"যান্ত্রিক দক্ষতা (Mechanical Reasoning)", q:"নিচের আয়নায় কোন শব্দটির প্রতিফলন? (35th BCS)", opts:["TENSION", "RELATION", "NATIONAL", "RELATIVE"], ans:1, sol:"উৎস পিডিএফে আয়না-প্রতিফলিত শব্দের চিত্রটি নিষ্কাশনে অস্পষ্ট/ঘোলাটে হয়ে গেছে। বিকল্পগুলোর মধ্যে অক্ষর-গঠন বিবেচনা করে সম্ভাব্য উত্তর হিসেবে RELATION অনুমান করা হলো।", year:"35th BCS", src:true, needsVerification:true, verifyNote:"এই প্রশ্নের আয়না-প্রতিফলিত চিত্রটি (mirror image figure) মূল পিডিএফে ঝাপসা/বিকৃত অবস্থায় ছিল এবং কোনো ছাপা উত্তর-কীও উৎসে নেই। RELATION বিকল্পটি সবচেয়ে সম্ভাব্য মনে হলেও এটি নিশ্চিতভাবে যাচাই করা যায়নি।"},
  {id:"l12tw_mech6", lec:"lec12", section:"teacherWork", sourceNo:"6", topic:"যান্ত্রিক দক্ষতা (Mechanical Reasoning)", q:"প্রতি এক ঘণ্টায় কতবার ঘড়ির মিনিটের এবং ঘণ্টার কাঁটা পরস্পর লম্বভাবে অবস্থান করে? (34th BCS)", opts:["১ বার", "২ বার", "৩ বার", "৪ বার"], ans:1, sol:"১২ ঘণ্টায় ঘণ্টা ও মিনিটের কাঁটা মোট ২২ বার পরস্পর লম্বভাবে (৯০°কোণে) অবস্থান করে, অর্থাৎ গড়ে প্রতি ঘণ্টায় প্রায় ২ বার (১২ ঘণ্টার মধ্যে ২২ বার, তাই প্রচলিতভাবে 'প্রতি ঘণ্টায় ২ বার' হিসেবে গণ্য করা হয়)।", year:"34th BCS", src:true},
  {id:"l12tw_mech7", lec:"lec12", section:"teacherWork", sourceNo:"7", topic:"যান্ত্রিক দক্ষতা (Mechanical Reasoning)", q:"একটি দেয়াল ঘড়িতে যখন ৯টা বাজে তখন ঘণ্টার কাঁটা যদি পশ্চিম দিকে থাকে, তবে মিনিটের কাঁটা কোন দিকে থাকবে? (32nd BCS)", opts:["উত্তর", "পশ্চিম", "দক্ষিণ", "পূর্ব"], ans:0, sol:"এটি টিচার্স ওয়ার্ক ডিরেকশন টেস্ট-এর ১ নং প্রশ্নের অনুরূপ — ৯টা বাজলে মিনিটের কাঁটা সর্বদা ১২-এর ঘরে (উপরে) থাকে, এবং ঘণ্টার কাঁটা পশ্চিমে থাকা মানে ঘড়িটি স্বাভাবিক অভিমুখেই আছে। তাই মিনিটের কাঁটা উত্তর দিকে থাকবে।", year:"32nd BCS", src:true},
