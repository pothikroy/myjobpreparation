  {id:"l12sw_mech2", lec:"lec12", section:"studentWork", sourceNo:"2", topic:"যান্ত্রিক দক্ষতা (Mechanical Reasoning)", q:"একটি মোটা ও একটি চিকন হাতলওয়ালা স্ক্রু-ড্রাইভার দিয়ে একই মাপের দুটি স্ক্রুকে কাঠবোর্ডের ভিতরে সমান গভীরতায় প্রবেশ করাতে চাইলে কোনটি ঘটবে? (37th BCS)", opts:["মোটা হাতলের ড্রাইভারটিকে বেশি বার ঘুরাতে হবে", "চিকন হাতলওয়ালা ড্রাইভারটিকে বেশি বার ঘুরাতে হবে", "দুটিকে একই সংখ্যকবার ঘুরাতে হবে", "কোনোটিই নয়"], ans:2, sol:"স্ক্রু কতটা গভীরে ঢুকবে তা নির্ভর করে থ্রেডের পিচের (pitch) উপর, হাতলের পুরুত্বের উপর নয়। যেহেতু স্ক্রু দুটি একই মাপের (একই পিচের), তাই একই গভীরতায় পৌঁছাতে উভয় ড্রাইভারকেই একই সংখ্যকবার ঘুরাতে হবে — উৎসের উত্তরমালা অনুযায়ীও এটি নিশ্চিত।", year:"37th BCS", src:true},
  {id:"l12sw_mech3", lec:"lec12", section:"studentWork", sourceNo:"3", topic:"যান্ত্রিক দক্ষতা (Mechanical Reasoning)", q:"একটি লন রোলারকে যদি দুইজন ব্যক্তির একজন টেনে নেয় ও একজন ঠেলে নেয় তবে কার কষ্ট বেশি হবে? (37th BCS)", opts:["টেনে নেওয়া ব্যক্তির", "ঠেলে নেওয়া ব্যক্তির", "দু'জনের সমান কষ্ট হবে", "কোনোটি নয়"], ans:1, sol:"রোলার ঠেলার সময় প্রয়োগকৃত বলের একটি নিচের দিকের উপাংশ থাকে যা রোলারের ভূমির উপর normal force (এবং তাই ঘর্ষণ) বাড়িয়ে দেয়; টানার সময় বলের উপাংশ উপরের দিকে হওয়ায় normal force কমে যায় (রোলারের ওজনের কিছুটা লাঘব হয়)। ফলে ঠেলে নেওয়া ব্যক্তির বেশি কষ্ট হয় — উৎসের উত্তরমালা অনুযায়ীও এটি নিশ্চিত।", year:"37th BCS", src:true},
  {id:"l13tw1", lec:"lec13", section:"teacherWork", sourceNo:"1", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"৪ জন মহিলা ও ৬ জন পুরুষের মধ্য থেকে ৪ সদস্যবিশিষ্ট একটি উপ-কমিটি গঠন করতে হবে যাতে ১ জন নির্দিষ্ট পুরুষ সর্বদাই উপস্থিত থাকেন। কত প্রকারে ঐ কমিটি গঠন করা যেতে পারে?", opts:["210", "304", "84", "120"], ans:2, sol:"১ জন নির্দিষ্ট পুরুষ সবসময় কমিটিতে থাকবেন ধরে নিলে, বাকি ৩ জনকে বাকি ৯ জন (৪ মহিলা + ৫ পুরুষ) থেকে বেছে নিতে হবে: C(9,3) = 84।", year:"৩৮তম বিসিএস", src:true},
  {id:"l13tw2", lec:"lec13", section:"teacherWork", sourceNo:"2", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"১০টি জিনিসের মধ্যে ২টি এক জাতীয় জিনিস এবং বাকীগুলো ভিন্ন ভিন্ন জিনিস। ঐ জিনিসগুলো থেকে প্রতিবারে ৫টি করে নিয়ে কত প্রকারে বাছাই করা যায়?", opts:["170", "182", "190", "192"], ans:1, sol:"২টি অভিন্ন জিনিস থেকে ০, ১ বা ২টি নেওয়া হতে পারে: (০টি নিলে ৮টি ভিন্ন থেকে ৫টি বাছাই = C(8,5)=56) + (১টি নিলে ৮টি ভিন্ন থেকে ৪টি বাছাই = C(8,4)=70) + (২টি নিলে ৮টি ভিন্ন থেকে ৩টি বাছাই = C(8,3)=56) = 56+70+56 = 182।", year:"৩৭তম বিসিএস", src:true},
  {id:"l13tw3", lec:"lec13", section:"teacherWork", sourceNo:"3", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"12টি পুস্তক থেকে 5টি কত প্রকারে বাছাই করা যায় যেখানে 2টি পুস্তক সর্বদাই অন্তর্ভুক্ত থাকবে?", opts:["252", "792", "224", "120"], ans:3, sol:"২টি নির্দিষ্ট বই সবসময় থাকবে ধরে নিলে, বাকি ৩টি বাকি ১০টি বই থেকে বেছে নিতে হবে: C(10,3) = 120।", year:"৩৬তম বিসিএস", src:true},
  {id:"l13tw4", lec:"lec13", section:"teacherWork", sourceNo:"4", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"CALCUTTA শব্দটির বর্ণগুলোকে একত্রে নিয়ে বিন্যাস সংখ্যা, AMERICA শব্দটির বর্ণগুলো একত্রে নিয়ে বিন্যাস সংখ্যার কত গুণ?", opts:["2", "3", "4", "5"], ans:0, sol:"CALCUTTA-তে ৮টি বর্ণ আছে যার মধ্যে C, A, T প্রতিটি ২ বার — বিন্যাস সংখ্যা = 8!/(2!2!2!) = 40320/8 = 5040। AMERICA-তে ৭টি বর্ণ আছে যার মধ্যে A ২ বার — বিন্যাস সংখ্যা = 7!/2! = 5040/2 = 2520। অনুপাত = 5040/2520 = 2 গুণ।", year:"৩৫তম বিসিএস", src:true},
  {id:"l13tw5", lec:"lec13", section:"teacherWork", sourceNo:"5", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"14 জন খেলোয়াড়ের মধ্য থেকে নির্দিষ্ট একজন অধিনায়কসহ 11 জনের একটি ক্রিকেট দল কতভাবে বাছাই করা যাবে?", opts:["728", "286", "364", "1001"], ans:1, sol:"১ জন নির্দিষ্ট অধিনায়ক সবসময় দলে থাকবেন ধরে নিলে, বাকি ১০ জনকে বাকি ১৩ জন থেকে বেছে নিতে হবে: C(13,10) = C(13,3) = 286।", year:"৩৫তম বিসিএস", src:true},
  {id:"l13tw6", lec:"lec13", section:"teacherWork", sourceNo:"6", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"২০ সদস্য বিশিষ্ট একটি ফুটবল দল থেকে একজন অধিনায়ক ও একজন সহ-অধিনায়ক কতভাবে নির্বাচন করা যাবে?", opts:["২০", "১৯০", "৩৮০", "৭৬০"], ans:2, sol:"অধিনায়ক ও সহ-অধিনায়ক দুটি ভিন্ন পদ বলে এটি একটি বিন্যাস (Permutation) সমস্যা: ২০ × ১৯ = ৩৮০ উপায়ে নির্বাচন করা যাবে।", year:"২৩তম বিসিএস", src:true},
  {id:"l13tw7", lec:"lec13", section:"teacherWork", sourceNo:"7", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"শাহবাগ থেকে ফার্মগেটে যাওয়ার তিনটি ভিন্ন রাস্তা আছে, আবার ফার্মগেট থেকে বনানীর ৪টি ভিন্ন রাস্তা আছে। শাহবাগ থেকে ফার্মগেট হয়ে বনানী যাবার কয়টি ভিন্ন রাস্তা আছে?", opts:["১০", "১২", "১৩", "১৪"], ans:1, sol:"গুণন নীতি (Multiplication Principle) অনুযায়ী মোট রাস্তা = ৩ × ৪ = ১২টি।", src:true},
  {id:"l13tw8", lec:"lec13", section:"teacherWork", sourceNo:"8", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"SCIENCE শব্দটির স্বরবর্ণ গুলোকে একত্রে রেখে সব কয়টি বর্ণকে সম্ভাব্য যত উপায়ে সাজানো যায় তার সংখ্যা নির্নয় কর।", opts:["১৪০", "১৭৬", "১৭৭", "১৮০"], ans:3, sol:"SCIENCE-এ ৭টি বর্ণ, স্বরবর্ণ ৩টি (I, E, E) ও ব্যঞ্জনবর্ণ ৪টি (S, C, N, C)। স্বরবর্ণ ৩টিকে একটি ব্লক ধরলে মোট ৫টি এককের (৪ ব্যঞ্জনবর্ণ + ১ ব্লক) বিন্যাস, যেখানে C ২ বার: 5!/2! = 60। ব্লকের ভেতরে (I,E,E) সাজানো যায় 3!/2! = 3 ভাবে। মোট = 60 × 3 = 180।", src:true},
  {id:"l13tw9", lec:"lec13", section:"teacherWork", sourceNo:"9", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একজন পরীক্ষার্থীকে ১৪টি প্রশ্নের মধ্যে ৬টি প্রশ্নের উত্তর দিতে হবে। তাকে প্রথম ৫টি থেকে অবশ্যই ৪টি বাছাই করতে হবে। সে কত প্রকারে প্রশ্নগুলো বাছাই করতে পারে?", opts:["১০২", "১০৫", "১০৮", "১৮০"], ans:3, sol:"প্রথম ৫টি প্রশ্ন থেকে ঠিক ৪টি বাছাই: C(5,4) = 5। বাকি ২টি প্রশ্ন বাকি ৯টি প্রশ্ন থেকে বাছাই: C(9,2) = 36। মোট = 5 × 36 = 180।", src:true},
  {id:"l13tw10", lec:"lec13", section:"teacherWork", sourceNo:"10", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"৫ জন বিজ্ঞান ও ৩ জন কলা অনুষদের ছাত্র থেকে ৪ জনের একটি কমিটি গঠন করতে হবে যাতে অন্তত একজন বিজ্ঞান ও একজন কলার ছাত্র থাকে। কত বিভিন্ন প্রকারে এই কমিটি গঠন করা যেতে পারে?", opts:["৬০", "৬৫", "৭০", "৭৫"], ans:1, sol:"মোট ৮ জন থেকে ৪ জনের কমিটি গঠনের মোট উপায় = C(8,4) = 70। এর থেকে বাদ দিতে হবে সম্পূর্ণ বিজ্ঞানের ছাত্র নিয়ে গঠিত কমিটি (C(5,4)=5) এবং সম্পূর্ণ কলার ছাত্র নিয়ে গঠিত কমিটি (C(3,4)=0, সম্ভব নয় কারণ কলার ছাত্র মাত্র ৩ জন)। নির্ণেয় সংখ্যা = 70 − 5 − 0 = 65।", src:true},
  {id:"l13tw11", lec:"lec13", section:"teacherWork", sourceNo:"11", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"১, ২, ৩, ৪, ৫ অঙ্কগুলির প্রতিটিকে যে কোনো সংখ্যক বার নিয়ে ৩ অঙ্কের কতগুলি সংখ্যা গঠন করা যাবে?", opts:["১৩০", "১৩৫", "১২৫", "১২৭"], ans:2, sol:"পুনরাবৃত্তি অনুমোদিত বলে প্রতিটি ঘরে ৫টি করে অঙ্ক বসানো যায়: ৫ × ৫ × ৫ = ১২৫টি সংখ্যা।", src:true},
  {id:"l13tw12", lec:"lec13", section:"teacherWork", sourceNo:"12", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"প্রতিটি অঙ্ক একবার ব্যবহার করে ৪, ৩, ২, ১, ০ অঙ্কগুলি দ্বারা ৫ অঙ্কের কতগুলি বিজোড় সংখ্যা গঠন করা যাবে?", opts:["২৪", "২৬", "২৮", "৩৬"], ans:3, sol:"শেষ অঙ্ক বিজোড় (১ বা ৩) হতে হবে এবং প্রথম অঙ্ক শূন্য হতে পারবে না। শেষ অঙ্ক = ১ হলে: বাকি {০,২,৩,৪} দিয়ে ৪টি ঘর সাজানোর মোট উপায় 4!=24, এর মধ্যে প্রথম ঘরে ০ বসা বাদ দিলে (3!=6): 24−6=18টি বৈধ সংখ্যা। শেষ অঙ্ক = ৩ হলে একই যুক্তিতে আরও 18টি। মোট = 18+18 = 36টি।", src:true},
  {id:"l13tw13", lec:"lec13", section:"teacherWork", sourceNo:"13", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"৩০ থেকে ৪০ পর্যন্ত সংখ্যা থেকে যে কোন একটিকে ইচ্ছেমত নিলে সে সংখ্যাটি মৌলিক অথবা ৫ এর গুণিতক হওয়ার সম্ভাবনা কত?", opts:["৫/১১", "১/২", "৩/৫", "৬/১১"], ans:0, sol:"৩০ থেকে ৪০ পর্যন্ত মোট ১১টি সংখ্যা আছে। এর মধ্যে মৌলিক সংখ্যা: ৩১, ৩৭ (২টি)। ৫-এর গুণিতক: ৩০, ৩৫, ৪০ (৩টি)। কোনো সংখ্যা দুই দলেই নেই (কোনো ওভারল্যাপ নেই)। অনুকূল ফলাফল = ২+৩ = ৫টি। সম্ভাবনা = ৫/১১।", year:"৩৮তম বিসিএস", src:true},
  {id:"l13tw14", lec:"lec13", section:"teacherWork", sourceNo:"14", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একটি থলিতে ৬টি নীল বল, ৮টি সাদা বল এবং ১০টি কালো বল আছে। দৈবভাবে একটি বল তুললে সেটি সাদা না হবার সম্ভাবনা কত?", opts:["২/৩", "১/৩", "৩/৪", "১/৪"], ans:0, sol:"মোট বল = ৬+৮+১০ = ২৪টি। P(সাদা) = ৮/২৪ = ১/৩। P(সাদা না হওয়া) = ১ − ১/৩ = ২/৩।", year:"৩৭তম বিসিএস", src:true},
  {id:"l13tw15", lec:"lec13", section:"teacherWork", sourceNo:"15", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"আবহাওয়া অফিসের রিপোর্ট অনুযায়ী 2015 সালের জুলাই মাসের ২য় সপ্তাহে বৃষ্টি হয়েছে মোট ৫ দিন। ঐ সপ্তাহের বুধবার বৃষ্টি না হওয়ার সম্ভাবনা কত?", opts:["১", "৫/৭", "২/৭", "১/৭"], ans:2, sol:"সপ্তাহের ৭ দিনের মধ্যে ৫ দিন বৃষ্টি হয়েছে, তাই যেকোনো একটি নির্দিষ্ট দিনে বৃষ্টি হওয়ার সম্ভাবনা ৫/৭। সুতরাং বুধবার বৃষ্টি না হওয়ার সম্ভাবনা = ১ − ৫/৭ = ২/৭।", year:"৩৬তম বিসিএস", src:true},
  {id:"l13tw16", lec:"lec13", section:"teacherWork", sourceNo:"16", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একটি নিরপেক্ষ ছক্কা নিক্ষেপ করা হলে, ৪ আসার সম্ভাবনা কত?", opts:["১", "১/৪", "১/৬", "৪/৬"], ans:2, sol:"ছক্কার ৬টি ফলাফলের যেকোনো একটি (যেমন ৪) আসার সম্ভাবনা = ১/৬।", src:true},
  {id:"l13tw17", lec:"lec13", section:"teacherWork", sourceNo:"17", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একটি নিরপেক্ষ ছক্কা নিক্ষেপ করা হলে, বিজোড় সংখ্যা আসার সম্ভাবনা কত?", opts:["৩", "১/২", "১", "২"], ans:1, sol:"ছক্কায় বিজোড় সংখ্যা {১, ৩, ৫} মোট ৩টি অনুকূল ফলাফল, সমগ্র সম্ভাব্য ফলাফল ৬টি। সম্ভাবনা = ৩/৬ = ১/২।", src:true},
  {id:"l13tw18", lec:"lec13", section:"teacherWork", sourceNo:"18", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একটি থলেতে একই ধরণের ৬টি কালো, ৫টি লাল, ৮টি সাদা মার্বেল আছে। থলে হতে একটি মার্বেল দৈবভাবে নির্বাচন করা হলে লাল মার্বেল আসার সম্ভাবনা কত?", opts:["৫/১৯", "৪/১৯", "১৯/৫", "১"], ans:0, sol:"মোট মার্বেল = ৬+৫+৮ = ১৯টি। লাল মার্বেল ৫টি। সম্ভাবনা = ৫/১৯।", src:true},
  {id:"l13tw19", lec:"lec13", section:"teacherWork", sourceNo:"19", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একটি পাত্রে ৫টি সাদা মোজা ও ৬টি কালো মোজা আছে, অন্ধকারে মোট কয়টি মোজা তুললে নিশ্চিতভাবে বলা যাবে যে, তাদের মধ্যে একটি সাদা মোজা আছে?", opts:["৫টি", "৬টি", "৭টি", "৮টি"], ans:2, sol:"সবচেয়ে খারাপ ক্ষেত্রে প্রথমে সবগুলো (৬টি) কালো মোজা উঠতে পারে। এরপর যে মোজাটি (৭ম) উঠবে সেটি অবশ্যই সাদা হতে বাধ্য (পিজিয়নহোল নীতি)। সুতরাং ৭টি মোজা তুললে নিশ্চিত করা যাবে।", src:true},
  {id:"l13tw20", lec:"lec13", section:"teacherWork", sourceNo:"20", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একটি ক্লাসে ৪০ জন ছাত্র-ছাত্রীদের মধ্যে ২৫জন ছাত্রী। একজনকে দৈবচয়ন পদ্ধতিতে নেয়া হলে তার ছাত্র হওয়ার সম্ভাবনা কত?", opts:["১/২", "১", "১৫", "৩/৮"], ans:3, sol:"ছাত্র সংখ্যা = ৪০ − ২৫ = ১৫ জন। সম্ভাবনা = ১৫/৪০ = ৩/৮।", src:true},
  {id:"l13sw01", lec:"lec13", section:"studentWork", sourceNo:"1", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"কোন ক্লাসের ৩২ জন ছাত্রের মধ্যে প্রত্যেক ছাত্র অন্তত ভূগোল বা ইতিহাস বিষয়ে পড়াশোনা করছে। তাদের মধ্যে ২২ জন ভূগোল এবং ১৫ জন ইতিহাসে। কতজন ছাত্র ইতিহাস ও ভূগোল উভয় বিষয়ে পড়ছে?", opts:["৭", "৫", "৩", "৬"], ans:1, sol:"|G∪H| = |G| + |H| − |G∩H| ⟹ ৩২ = ২২ + ১৫ − x ⟹ x = ৫ জন। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw02", lec:"lec13", section:"studentWork", sourceNo:"2", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"Parallel শব্দটির vowel গুলিকে একত্র রেখে মোট বিন্যাস সংখ্যা হবে?", opts:["৩৬০", "২৪০", "১৪০", "১২০"], ans:0, sol:"PARALLEL-এ ৮টি বর্ণ, ৫টি Consonant (P,R,L,L,L — L তিনবার) ও ৩টি vowel (A,A,E — A দুইবার)। vowel-ব্লক একটি একক ধরলে মোট ৬টি এককের বিন্যাস = 6!/3! = 120। vowel ব্লকের ভেতরের বিন্যাস = 3!/2! = 3। মোট = 120 × 3 = 360। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw03", lec:"lec13", section:"studentWork", sourceNo:"3", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"3, 4, 5, 3, 4, 5, 6 অংকগুলোর বিজোড় অংকগুলো সর্বদাই বিজোড় স্থানে রেখে সাত অংকের কতগুলো সংখ্যা গঠন করা যায়?", opts:["৩৬", "১৮", "৭২", "১২"], ans:1, sol:"৭ অঙ্কের সংখ্যায় ৪টি বিজোড় স্থান ও ৩টি জোড় স্থান আছে। বিজোড় অঙ্ক আছে ৪টি (৩,৩,৫,৫ — প্রতিটি দুইবার): ৪টি বিজোড় স্থানে এগুলো সাজানোর উপায় = 4!/(2!2!) = 6। জোড় অঙ্ক আছে ৩টি (4,6, এবং পুনরাবৃত্তি নেই ধরে): ৩টি জোড় স্থানে সাজানোর উপায় = 3!/2! = 3 (৪ যেহেতু একবারই আছে আর ৬ একবার, বাকি একটি অঙ্ক পুনরাবৃত্ত হতে পারে উৎসের হিসাব অনুযায়ী)। উৎসের নিজস্ব হিসাব অনুযায়ী মোট = 6 × 3 = 18। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw04", lec:"lec13", section:"studentWork", sourceNo:"4", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"১০ জন বালক থেকে ২ জন বালক কত উপায়ে বেছে নেয়া যায়?", opts:["৩৬", "১৮", "৭২", "৪৫"], ans:3, sol:"C(10,2) = (১০×৯)/(২×১) = ৪৫। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw05", lec:"lec13", section:"studentWork", sourceNo:"5", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"৮ জন বালিকা থেকে ২ জন বালিকা কত উপায়ে বেছে নেয়া যায়?", opts:["৩৬", "২৮", "৪২", "৪৮"], ans:1, sol:"C(8,2) = (৮×৭)/(২×১) = ২৮। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw06", lec:"lec13", section:"studentWork", sourceNo:"6", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"১০ জন বালক ও ৮ জন বালিকা থেকে ২ জন বালক ও ২ জন বালিকা কত বিভিন্ন উপায়ে বেছে নেয়া যায়?", opts:["৩৬০", "৭২০", "১০৮০", "১২৬০"], ans:3, sol:"১০ জন থেকে ২ জন বালক বেছে নেওয়ার উপায় C(10,2)=৪৫। ৮ জন থেকে ২ জন বালিকা বেছে নেওয়ার উপায় C(8,2)=২৮। মোট = ৪৫ × ২৮ = ১২৬০। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw07", lec:"lec13", section:"studentWork", sourceNo:"7", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"LOGARITHMS শব্দটির বর্ণগুলো হতে ৩টি Consonant ও ২টি Vowel কতভাবে বেছে নেওয়া যায়?", opts:["৩৫", "৭০", "১০৫", "১৪৪"], ans:2, sol:"LOGARITHMS-এ ৭টি Consonant (L,G,R,T,H,M,S) ও ৩টি Vowel (O,A,I) আছে। ৭টি থেকে ৩টি Consonant বাছাই = C(7,3)=৩৫। ৩টি থেকে ২টি Vowel বাছাই = C(3,2)=৩। মোট = ৩৫ × ৩ = ১০৫। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw08", lec:"lec13", section:"studentWork", sourceNo:"8", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"'SCIENCE' শব্দটির স্বরবর্ণগুলোকে একত্রে রেখে সব কয়টি বর্ণকে সম্ভাব্য যত উপায়ে সাজানো যায় তার সংখ্যা হচ্ছে -", opts:["৬০ বার", "১২০ বার", "১৮০ বার", "৪২০ বার"], ans:2, sol:"SCIENCE-এ ৭টি বর্ণ, স্বরবর্ণ ৩টি (I,E,E) ও ব্যঞ্জনবর্ণ ৪টি (S,C,C,N)। স্বরবর্ণ-ব্লক ধরে মোট ৫টি এককের বিন্যাস = 5!/2! = 60। ব্লকের ভেতরে (I,E,E) সাজানো = 3!/2! = 3। মোট = 60 × 3 = 180। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw09", lec:"lec13", section:"studentWork", sourceNo:"9", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"\"EQUATION\" শব্দটির সবগুলো অক্ষর ব্যবহার করে কতটি শব্দ গঠন করা যেতে পারে?", opts:["৪০৩২০", "৩৯৩২০", "৪০৪২০", "৪০৫২০"], ans:0, sol:"EQUATION-এ ৮টি ভিন্ন ভিন্ন বর্ণ আছে, কোনো পুনরাবৃত্তি নেই। বিন্যাস সংখ্যা = 8! = 40320। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw10", lec:"lec13", section:"studentWork", sourceNo:"10", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"১০ জন বালক এবং ৮ বালিকা থেকে ২ বালক ও ১ জন বালিকা কত উপায়ে নেয়া যায়?", opts:["৩৭০", "৩৬০", "৩৫০", "৩৮০"], ans:1, sol:"১০ জন থেকে ২ জন বালক বেছে নেওয়ার উপায় C(10,2)=৪৫। ৮ জন থেকে ১ জন বালিকা বেছে নেওয়ার উপায় C(8,1)=৮। মোট = ৪৫ × ৮ = ৩৬০। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw11", lec:"lec13", section:"studentWork", sourceNo:"11", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"কোন একজন পরীক্ষার্থীকে ১০টি প্রশ্নের ৭টি প্রশ্নের উত্তর দিতে হবে। কত প্রকারে সে প্রশ্নের উত্তর দিতে পারবে?", opts:["১৮০", "১১০", "১২০", "১৩০"], ans:2, sol:"C(10,7) = C(10,3) = (১০×৯×৮)/(৩×২×১) = ১২০। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw12", lec:"lec13", section:"studentWork", sourceNo:"12", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"১ থেকে ২০ পর্যন্ত মৌলিক সংখ্যাগুলোর গড় কত?", opts:["৯.৬২৫", "১২.৬২৫", "১৫.৬২৫", "১৭.৬২৫"], ans:0, sol:"১ থেকে ২০ পর্যন্ত মৌলিক সংখ্যা: ২,৩,৫,৭,১১,১৩,১৭,১৯ (৮টি)। যোগফল = ৭৭। গড় = ৭৭/৮ = ৯.৬২৫।", src:true},
  {id:"l13sw13", lec:"lec13", section:"studentWork", sourceNo:"13", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"[একটি উপাত্তের ১০টি মান পাওয়া গেল: ১৫০, ১৩০, ১৪৫, ১৭০, ২০০, ১৮০, ১৯০, ১৪০, ১৬৫, ১৭৫। এই উপাত্তের] পরিসর কত?", opts:["৫০", "৭১", "৮৫", "৯০"], ans:1, sol:"সর্বোচ্চ মান = ২০০, সর্বনিম্ন মান = ১৩০। পরিসর = (২০০−১৩০)+১ = ৭০+১ = ৭১ (শ্রেণিবদ্ধ উপাত্তে অন্তর্ভুক্তিমূলক পরিসর হিসাবে +১ যোগ করা হয়েছে)। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true, needsVerification:true, verifyNote:"মূল উৎস পিডিএফে এই প্রশ্নের প্রকৃত ১০টি উপাত্ত-মানের তালিকা প্রশ্নের নিজস্ব স্টেমে আলাদাভাবে ছাপা ছিল না — শুধু পরবর্তী প্রশ্ন ১৫-এর সমাধানে গড় নির্ণয়ের সময় Σxi সম্প্রসারণে মানগুলো (১৫০,১৩০,১৪৫,১৭০,২০০,১৮০,১৯০,১৪০,১৬৫,১৭৫) সরাসরি দেখা যায়। এই তালিকাটি প্রশ্ন ১৩-এর সর্বোচ্চ/সর্বনিম্ন মান (২০০/১৩০) এবং প্রশ্ন ১৫-এর গড়ের সাথে সামঞ্জস্যপূর্ণ বলে নিশ্চিতভাবে পুনর্গঠন করা হয়েছে, তবে মূল স্টেমে তালিকাটি এভাবে ছাপা ছিল কিনা তা স্বাধীনভাবে যাচাই করা যায়নি।"},
  {id:"l13sw14", lec:"lec13", section:"studentWork", sourceNo:"14", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"[পূর্বের প্রশ্নের উপাত্তের জন্য] ১০ শ্রেণির ব্যবধান নিয়ে শ্রেণি সংখ্যা কত হবে?", opts:["৮", "৬", "৪", "২"], ans:0, sol:"শ্রেণি সংখ্যা = পরিসর/শ্রেণি-ব্যবধান = ৭১/১০ = ৭.১, যাকে পূর্ণসংখ্যায় উন্নীত করলে (ceiling) হয় ৮। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true, needsVerification:true, verifyNote:"এই প্রশ্নটিও প্রশ্ন ১৩-এর মতো একই (পুনর্গঠিত) উপাত্তসেট ব্যবহার করে, যা মূল স্টেমে সরাসরি ছাপা ছিল না — দেখুন প্রশ্ন ১৩-এর টীকা।"},
  {id:"l13sw15", lec:"lec13", section:"studentWork", sourceNo:"15", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"[একটি উপাত্তের ১০টি মান: ১৫০, ১৩০, ১৪৫, ১৭০, ২০০, ১৮০, ১৯০, ১৪০, ১৬৫, ১৭৫।] উপাত্তের গড় কত?", opts:["১৬০", "১৬২.৫", "১৬৩", "১৬৪.৫"], ans:3, sol:"মোট (Σxi) = ১৫০+১৩০+১৪৫+১৭০+২০০+১৮০+১৯০+১৪০+১৬৫+১৭৫ = ১৬৪৫। গড় = ১৬৪৫/১০ = ১৬৪.৫।", src:true, needsVerification:true, verifyNote:"উৎসের সমাধানে ধাপে ধাপে গণনা করে স্পষ্টভাবে দেখানো হয়েছে গড় = ১৬৪.৫ (যা বিকল্প ঘ-এর সাথে মেলে), কিন্তু উৎসের ছাপা 'উত্তর' চিহ্নটি ভুলবশত 'ক' (১৬০) দেখাচ্ছে — নিজের দেখানো হিসাবের সাথেই সামঞ্জস্যহীন একটি সুস্পষ্ট মুদ্রণ-ত্রুটি (errata), অনুরূপ ইতিপূর্বে লেকচার ১১-এ দুটি প্রশ্নে পাওয়া গিয়েছিল। গাণিতিকভাবে সঠিক উত্তর (ঘ = ১৬৪.৫) এখানে ব্যবহার করা হয়েছে।"},
  {id:"l13sw16", lec:"lec13", section:"studentWork", sourceNo:"16", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"১ থেকে ২২ পর্যন্ত ৩ দ্বারা বিভাজ্য সংখ্যাগুলোর মধ্যক কত?", opts:["৯", "১২", "১৫", "১৮"], ans:1, sol:"১ থেকে ২২ পর্যন্ত ৩ দ্বারা বিভাজ্য সংখ্যা: ৩,৬,৯,১২,১৫,১৮,২১ (মোট ৭টি)। মধ্যক = (৭+১)/২ = ৪র্থ পদ = ১২। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw17", lec:"lec13", section:"studentWork", sourceNo:"17", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একটি থলিতে নীল বল ১২টি, সাদা বল ১৬টি এবং কালো বল ২০টি। থলে থেকে দৈব্যভাবে একটি বল নেওয়া হল, বলটি নীল হওয়ার সম্ভাবনা কত?", opts:["১/১৬", "১/১২", "১/৪", "১/৮"], ans:2, sol:"মোট বল = ১২+১৬+২০ = ৪৮টি। নীল বলের সম্ভাবনা = ১২/৪৮ = ১/৪। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw18", lec:"lec13", section:"studentWork", sourceNo:"18", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"উক্ত প্রশ্নে বলটি সাদা না হওয়ার সম্ভাবনা কত?", opts:["১/৩", "১/১৬", "২/৩", "১/৪৮"], ans:2, sol:"সাদা বলের সম্ভাবনা = ১৬/৪৮ = ১/৩। সাদা না হওয়ার সম্ভাবনা = ১ − ১/৩ = ২/৩।", src:true},
  {id:"l13sw19", lec:"lec13", section:"studentWork", sourceNo:"19", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একজন লোক ঢাকা থেকে যশোর হয়ে খুলনা যাবে। লোকটির ঢাকা হতে যশোরে প্লেনে যাওয়ার সম্ভাবনা ১/৯ এবং যশোর হতে খুলনা বাসে যাওয়ার সম্ভাবনা ৩/৫। ঢাকা হতে যশোরে প্লেনে না যাওয়ার সম্ভাবনা কত?", opts:["১/৯", "৮/৯", "২/৯", "৮/৩"], ans:1, sol:"একটি ঘটনা ঘটা ও না ঘটার সম্ভাবনার সমষ্টি ১। ঢাকা থেকে যশোরে প্লেনে না যাওয়ার সম্ভাবনা = ১ − ১/৯ = ৮/৯। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw20", lec:"lec13", section:"studentWork", sourceNo:"20", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"কোন একটি লটারিতে ২০০০ টিকিট বিক্রি হয়েছে। যার ১ম পুরস্কার একটি BMW গাড়ি। আপনি ১০টি টিকিট ক্রয় করেছেন। আপনার BMW পাওয়ার সম্ভাবনা কত?", opts:["১/২০০০", "১/২০০", "১/১০", "কোনটিই নয়"], ans:1, sol:"সমগ্র সম্ভাব্য ফলাফল = ২০০০। অনুকূল ফলাফল (আপনার টিকিট সংখ্যা) = ১০। সম্ভাবনা = ১০/২০০০ = ১/২০০। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw21", lec:"lec13", section:"studentWork", sourceNo:"21", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"উক্ত প্রশ্নের BMW না পাওয়ার সম্ভাবনা কত?", opts:["১/২০০", "১৯৯/২০০০", "১৯৯/২০০", "১/২"], ans:2, sol:"ঘটা ও না ঘটার সম্ভাবনার সমষ্টি ১। BMW না পাওয়ার সম্ভাবনা = ১ − ১/২০০ = ১৯৯/২০০। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw22", lec:"lec13", section:"studentWork", sourceNo:"22", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একটি মুদ্রা নিক্ষেপ করলে শাপলা আসার অনুকূল ফলাফল কয়টি?", opts:["২টি", "৩টি", "১টি", "৪টি"], ans:2, sol:"একটি মুদ্রায় নির্দিষ্ট একটি নির্দিষ্ট পিঠ (এখানে শাপলা) আসার অনুকূল ফলাফল সবসময় ১টি। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw23", lec:"lec13", section:"studentWork", sourceNo:"23", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একটি ছক্কা নিক্ষেপ করলে জোড় সংখ্যা হওয়ার অনুকূল ফলাফল কত?", opts:["১টি", "২টি", "৩টি", "৪টি"], ans:2, sol:"ছক্কার জোড় সংখ্যাগুলো হলো {২, ৪, ৬} — মোট ৩টি অনুকূল ফলাফল। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw24", lec:"lec13", section:"studentWork", sourceNo:"24", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"১ থেকে ২০০ পর্যন্ত সংখ্যাগুলো থেকে দৈবভাবে একটি সংখ্যা নেওয়া হল। সংখ্যাটি ঘন (পূর্ণঘন) হওয়ার সম্ভাবনা কত?", opts:["১/২০০", "১/৪০", "১/৫", "১"], ans:1, sol:"১ থেকে ২০০ পর্যন্ত পূর্ণঘন সংখ্যা: ১³=১, ২³=৮, ৩³=২৭, ৪³=৬৪, ৫³=১২৫ (৬³=২১৬ যা ২০০-এর বেশি বলে বাদ) — মোট ৫টি। সম্ভাবনা = ৫/২০০ = ১/৪০।", src:true, needsVerification:true, verifyNote:"উৎসের সমাধানে ঘন সংখ্যার তালিকা ভুলভাবে {১,২,৩,৪,৫} (অর্থাৎ মূল, ঘন নয়) হিসেবে দেখানো হয়েছে; প্রকৃত ঘন সংখ্যাগুলো হলো ১,৮,২৭,৬৪,১২৫। তবে গণনার সংখ্যা (৫টি) ও চূড়ান্ত সম্ভাবনা (১/৪০) ঠিক আছে এবং উৎসের ছাপা উত্তর-কীর সাথে মেলে — শুধু মধ্যবর্তী তালিকাটি উৎসে শর্টহ্যান্ড আকারে (মূল সংখ্যা দেখিয়ে) ছাপা হয়েছে।"},
  {id:"l13sw25", lec:"lec13", section:"studentWork", sourceNo:"25", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"সম্ভাবনার সর্বোচ্চ মান কত?", opts:["০", "১", "২", "৩"], ans:1, sol:"যেকোনো ঘটনার সম্ভাবনার মান সবসময় ০ ও ১-এর মধ্যে থাকে (অন্তর্ভুক্তিসহ); সর্বোচ্চ মান = ১ (নিশ্চিত ঘটনা)। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw26", lec:"lec13", section:"studentWork", sourceNo:"26", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"সম্ভাবনার সর্বনিম্ন মান কত?", opts:["০", "১", "২", "৩"], ans:0, sol:"সম্ভাবনার সর্বনিম্ন মান = ০ (অসম্ভব ঘটনা)। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw27", lec:"lec13", section:"studentWork", sourceNo:"27", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"কোনো একটি নির্দিষ্ট এলাকায় জরিপে দেখা গেল ৬৫ জন প্রথম আলো, ৪০ জন ভোরের কাগজ, ৪৫ জন জনকণ্ঠ, ৫২ জন যুগান্তর পত্রিকা পড়ে। এদের মধ্য হতে একজনকে দৈবভাবে নির্বাচন করলে তিনি যুগান্তর পত্রিকা পড়েন এর সম্ভাবনা কত?", opts:["৪২/২০২", "১৩৭/১০১", "১৩৭/২০২", "৫২/১০১"], ans:1, sol:"উৎসের ছাপা উত্তরমালা অনুযায়ী উত্তর 'খ' (১৩৭/১০১) নির্দেশিত।", src:true, needsVerification:true, verifyNote:"উৎসের ছাপা উত্তর 'খ' (১৩৭/১০১) একটি গাণিতিকভাবে অসম্ভব সম্ভাবনা-মান (১-এর চেয়ে বড়), যা স্পষ্টতই একটি মুদ্রণ/সম্পাদনা-ত্রুটি নির্দেশ করে। সরল হিসাবে (মোট ৬৫+৪০+৪৫+৫২=২০২ জনের মধ্যে ৫২ জন যুগান্তর পড়ে ধরলে) প্রত্যাশিত উত্তর হতো ৫২/২০২, কিন্তু এটি কোনো বিকল্পেই হুবহু নেই — যা ইঙ্গিত করে যে প্রশ্নের আসল প্রেক্ষাপটে (একাধিক পত্রিকা পড়া/ওভারল্যাপ ইত্যাদি সংক্রান্ত) অতিরিক্ত তথ্য থাকতে পারে যা নিষ্কাশিত টেক্সটে পাওয়া যায়নি। যেহেতু কোনো স্বাধীন গণনা নিশ্চিতভাবে করা সম্ভব হয়নি, উৎসের নিজস্ব ছাপা উত্তরই (খ) এখানে ব্যবহার করা হলো, তবে তা সন্দেহাতীতভাবে সঠিক নয় বলে চিহ্নিত করা হচ্ছে।"},
  {id:"l13sw28", lec:"lec13", section:"studentWork", sourceNo:"28", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"উপরোক্ত উদ্দিপক হতে দেখাও যে প্রথম আলো পত্রিকা পড়ে না কতজন?", opts:["১৩৭/২০২", "২৬/১০১", "৫২/২০২", "১৩৭/১০১"], ans:0, sol:"মোট = ৬৫+৪০+৪৫+৫২ = ২০২। প্রথম আলো পড়ে ৬৫ জন, তাই পড়ে না এমন সংখ্যা = ২০২−৬৫ = ১৩৭ জন, অর্থাৎ সম্ভাবনা = ১৩৭/২০২। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw29", lec:"lec13", section:"studentWork", sourceNo:"29", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"উপরোক্ত উদ্দিপকে জনকণ্ঠ পত্রিকা পড়ার সম্ভাবনা কত?", opts:["১৩৭/১০২", "১৩৭/১০১", "৪৫/২০২", "৪০/১০২"], ans:2, sol:"মোট = ২০২ জনের মধ্যে জনকণ্ঠ পড়ে ৪৫ জন। সম্ভাবনা = ৪৫/২০২। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw30i", lec:"lec13", section:"studentWork", sourceNo:"30(i)", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"একটি থলিতে ৪টা লাল, ৫টা সাদা ও ৬টা কালো বল আছে। দৈবভাবে একটা বল নেয়া হলো। (i) লাল হওয়ার সম্ভাবনা কত?", opts:["৪/১৫", "৫/১৫", "৭/১৫", "৮/১৫"], ans:0, sol:"মোট বল = ৪+৫+৬ = ১৫টি। লাল বল ৪টি। সম্ভাবনা P(R) = ৪/১৫। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw30ii", lec:"lec13", section:"studentWork", sourceNo:"30(ii)", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"[একই থলি — ৪টা লাল, ৫টা সাদা ও ৬টা কালো বল — থেকে দৈবভাবে একটা বল নেয়া হলো।] (ii) সাদা হওয়ার সম্ভাবনা কত?", opts:["২/৩", "৩/৭", "১/৩", "১/২"], ans:2, sol:"মোট বল = ১৫টি, সাদা বল ৫টি। সম্ভাবনা P(W) = ৫/১৫ = ১/৩। উৎসের উত্তর-কী অনুযায়ীও এটি নিশ্চিত।", src:true},
  {id:"l13sw30iii", lec:"lec13", section:"studentWork", sourceNo:"30(iii)", topic:"বিন্যাস, সমাবেশ ও সম্ভাবনা (Permutation, Combination & Probability)", q:"[একই থলি — ৪টা লাল, ৫টা সাদা ও ৬টা কালো বল — থেকে দৈবভাবে একটা বল নেয়া হলো।] (iii) কালো হওয়ার সম্ভাবনা কত?", opts:["১/৫", "৪/৫", "৩/৫", "২/৫"], ans:3, sol:"মোট বল = ১৫টি, কালো বল ৬টি। সম্ভাবনা P(B) = ৬/১৫ = ২/৫।", src:true},
  {id:"l14tw1", lec:"lec14", section:"teacherWork", sourceNo:"1", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি কোণের মান তার পূরক কোণের মানের অর্ধেকের সমান। কোনটির মান কত?", opts:["৬০°", "২২.৫°", "৩০°", "৬০°"], ans:2, sol:"কোণ = x ধরি, পূরক কোণ = ৯০°−x। শর্তমতে, x = (৯০°−x)/2 ⟹ 2x = ৯০°−x ⟹ 3x = ৯০° ⟹ x = ৩০°।", year:"৩৮তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎসে বিকল্প 'ক' ও 'ঘ' উভয়ই '৬০°' মুদ্রিত (একটি ছাপা-ত্রুটি/পুনরাবৃত্তি) — তবে গাণিতিকভাবে সঠিক উত্তর (৩০° = গ) সুস্পষ্ট ও নিশ্চিত, তাই এই ডুপ্লিকেট উত্তরে কোনো প্রভাব নেই।"},

  {id:"l14tw3", lec:"lec14", section:"teacherWork", sourceNo:"3", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"দুটি পূরক কোণের সমষ্টি কত?", opts:["৭০°", "৯০°", "১৮০°", "২৭০°"], ans:1, sol:"পূরক কোণদ্বয়ের সমষ্টি সবসময় ৯০° (এক সমকোণ)।", src:true},

  {id:"l14tw7", lec:"lec14", section:"teacherWork", sourceNo:"7", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"∠A ও ∠B পরস্পর সম্পূরক কোণ। ∠A = ১১৫° হলে ∠B = কত?", opts:["৬৫°", "৭৫°", "৮৫°", "৯০°"], ans:0, sol:"সম্পূরক কোণদ্বয়ের সমষ্টি ১৮০°। ∠B = ১৮০°−১১৫° = ৬৫°।", src:true},
  {id:"l14tw8", lec:"lec14", section:"teacherWork", sourceNo:"8", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"২৭০° মাপের কোণের নাম কি?", opts:["প্রবৃদ্ধ কোণ", "সরলকোণ", "পূরককোণ", "সম্পূরক কোণ"], ans:0, sol:"১৮০° অপেক্ষা বড় এবং ৩৬০° অপেক্ষা ছোট কোণকে প্রবৃদ্ধ কোণ (Reflex Angle) বলে। ২৭০° এই শর্ত পূরণ করে।", src:true},
  {id:"l14tw9", lec:"lec14", section:"teacherWork", sourceNo:"9", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি সমবাহু ত্রিভুজের একটি বাহুর দৈর্ঘ্য a একক হলে, ত্রিভুজটির ক্ষেত্রফল কত বর্গ একক?", opts:["(√৩/২) a²", "(২/৩) a²", "(২/√৩) a²", "(√৩/৪) a²"], ans:3, sol:"সমবাহু ত্রিভুজের ক্ষেত্রফলের সূত্র: (√৩/৪) × (বাহু)²।", year:"৩৮তম বিসিএস", src:true},
  {id:"l14tw10", lec:"lec14", section:"teacherWork", sourceNo:"10", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"ΔABC এ ∠B = ৯০°, যদি AC = 2AB হয় তবে, ∠C এর মান কত?", opts:["৪৫°", "২২.৫°", "৩০°", "৬০°"], ans:2, sol:"∠C এর বিপরীত বাহু AB। sin(∠C) = AB/AC = AB/(2AB) = ১/২ ⟹ ∠C = ৩০°।", year:"৩৮তম বিসিএস", src:true},
  {id:"l14tw11", lec:"lec14", section:"teacherWork", sourceNo:"11", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"যদি ত্রিভুজের দুই বাহুর দৈর্ঘ্য ৫ এবং ৬ হয়, তবে তৃতীয় বাহুর দৈর্ঘ্য হতে পারে না -", opts:["১২", "৯", "৮", "৪"], ans:0, sol:"ত্রিভুজ অসমতা অনুযায়ী তৃতীয় বাহু অবশ্যই |৬−৫|=১ এবং ৬+৫=১১ এর মধ্যে হতে হবে (১ ও ১১ বাদে)। ১২ এই সীমার বাইরে, তাই এটি তৃতীয় বাহু হতে পারে না।", src:true},
  {id:"l14tw12", lec:"lec14", section:"teacherWork", sourceNo:"12", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"কোনো ত্রিভুজের তিনটি বাহুকে বর্ধিত করলে উৎপন্ন বহিঃস্থ কোণ তিনটির সমষ্টি কত?", opts:["৩৬০°", "১৮০°", "১৩০°", "১৫০°"], ans:0, sol:"যেকোনো ত্রিভুজের (বা বহুভুজের) বহিঃস্থ কোণগুলোর সমষ্টি সবসময় ৩৬০°।", year:"৩২তম বিসিএস", src:true},
  {id:"l14tw13", lec:"lec14", section:"teacherWork", sourceNo:"13", topic:"জ্যামিতির মৌলিক বিষয়াবলি ও ত্রিভুজ (Basic Geometry & Triangles)", q:"একটি ত্রিভুজাকৃতি ক্ষেত্রের ক্ষেত্রফল ৮৪ বর্গগজ। ত্রিভুজটির শীর্ষবিন্দু হতে ভূমির উপর অংকিত লম্বের দৈর্ঘ্য ১২ গজ হলে ভূমির দৈর্ঘ্য কত?", opts:["১০ গজ", "১২ গজ", "১৪ গজ", "৭ গজ"], ans:2, sol:"ক্ষেত্রফল = ½ × ভূমি × উচ্চতা ⟹ ৮৪ = ½ × ভূমি × ১২ ⟹ ভূমি = (৮৪×২)/১২ = ১৪ গজ।", year:"১৭তম বিসিএস", src:true},
