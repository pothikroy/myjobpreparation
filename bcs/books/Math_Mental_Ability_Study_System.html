/* ============ THEME TOKENS ============ */
:root{
  --bg:#F6F1E4; --bg2:#EFE7D3; --card:#FFFDF7; --text:#2B2118; --text2:#6E6152;
  --border:#DDD1B4; --shadow:0 2px 8px rgba(80,60,20,.08);

}

  --bg:#1B1712; --bg2:#221D17; --card:#26211A; --text:#EDE6D6; --text2:#B2A78F;

}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans); background:var(--bg); color:var(--text);
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
a{color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ============ APP SHELL ============ */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:256px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
}
.sidebar-brand{padding:20px 18px 14px; border-bottom:1px solid var(--border);}
.sidebar-brand .logo{font-size:20px; font-weight:700; color:var(--maroon); font-family:var(--serif);}
.sidebar-brand .sub{font-size:12px; color:var(--text2); margin-top:4px;}
.pilot-tag{display:inline-block;margin-top:8px;background:var(--gold);color:#231a08;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}

.nav-scroll{flex:1; overflow-y:auto; padding:10px 10px;}
.nav-group{margin-bottom:14px;}
.nav-group-title{font-size:12px; color:var(--text2); padding:6px 10px 4px; letter-spacing:.02em;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
  color:var(--text); text-decoration:none; font-size:14.5px; border:none; background:none;
  width:100%; text-align:left; cursor:pointer;
}
.nav-item:hover{background:var(--card);}
.nav-item.active{background:var(--maroon); color:#fff;}
.nav-icon{width:20px; text-align:center; flex-shrink:0;}
.nav-label{flex:1; text-align:left;}

.sidebar-stats{border-top:1px solid var(--border); padding:12px 16px; font-size:12px; color:var(--text2);}
.sidebar-stats div{display:flex; justify-content:space-between; padding:2px 0;}
.sidebar-stats b{color:var(--text);}

.main{flex:1; min-width:0; height:100vh; overflow-y:auto;}
.topbar{
  display:none; align-items:center; gap:10px; padding:10px 14px; background:var(--bg2);
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
}
.hamburger{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:18px;}
.content{padding:22px 28px 60px; max-width:1200px; margin:0 auto;}

.drawer-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:29;}

/* ============ COMMON WIDGETS ============ */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card .num{font-size:26px; font-weight:700; color:var(--maroon); font-family:var(--serif);}
.stat-card .lbl{font-size:13px; color:var(--text2); margin-top:2px;}
.progress-bar{height:8px; background:var(--bg2); border-radius:6px; overflow:hidden; margin-top:8px;}
.progress-bar > div{height:100%; background:var(--teal); border-radius:6px;}

h1.page-title{font-family:var(--serif); font-size:26px; margin:0 0 4px; color:var(--maroon-dk);}
.page-sub{color:var(--text2); font-size:14px; margin-bottom:20px;}

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:8px; border:1px solid var(--border);
  background:var(--card); font-size:14px; font-weight:600; color:var(--text);
}
.btn:hover{border-color:var(--maroon);}
.btn.primary{background:var(--maroon); color:#fff; border-color:var(--maroon);}
.btn.primary:hover{background:var(--maroon-dk);}
.btn.ghost{background:none;}
.btn.sm{padding:5px 10px; font-size:12.5px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.tag{display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:20px; font-weight:600;}
.tag.year{background:rgba(180,134,47,.18); color:var(--gold);}
.tag.src{background:rgba(30,110,99,.15); color:var(--teal);}
.tag.gen{background:rgba(42,92,138,.15); color:var(--blue);}
.tag.verify{background:rgba(180,64,47,.15); color:var(--red);}
.tag.correct{background:rgba(47,125,79,.18); color:var(--green);}
.tag.wrong{background:rgba(180,64,47,.18); color:var(--red);}

.empty-state{text-align:center; padding:50px 20px; color:var(--text2);}
.empty-state .emoji{font-size:34px; margin-bottom:10px;}

.pill-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.pill{padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); font-size:13px;}
.pill.active{background:var(--maroon); color:#fff; border-color:var(--maroon);}

.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:var(--card); border-radius:12px; padding:22px; max-width:500px; width:100%; max-height:85vh; overflow-y:auto;}
.modal h3{margin-top:0;}
textarea.note-area{width:100%; min-height:100px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); padding:10px;}

.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--maroon); color:#fff; padding:10px 20px; border-radius:8px; z-index:200; font-size:14px; box-shadow:var(--shadow);}

.reading-toolbar{position:sticky; top:0; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; z-index:5;}
.reading-body{max-width:720px; margin:0 auto;}
.block{margin-bottom:18px;}
.block-para{}
.block-keyfact{background:rgba(180,134,47,.10); border-right:4px solid var(--gold); padding:12px 16px; border-radius:6px;}
.block-note{background:rgba(30,110,99,.08); border-right:4px solid var(--teal); padding:12px 16px; border-radius:6px;}
.block-warning{background:rgba(180,64,47,.08); border-right:4px solid var(--red); padding:12px 16px; border-radius:6px;}
.block-table table{width:100%; border-collapse:collapse; font-size:14px;}
.block-table td,.block-table th{border:1px solid var(--border); padding:8px; text-align:left;}
.block-table th{background:var(--bg2);}

.mcq-card{margin-bottom:16px;}
.mcq-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
.mcq-q{font-size:16px; font-weight:600; line-height:1.8;}
.mcq-options{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0;}

.opt-btn{text-align:left; padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg);}
.opt-btn:hover{border-color:var(--maroon);}
.opt-btn.correct{background:rgba(47,125,79,.18); border-color:var(--green);}
.opt-btn.wrong{background:rgba(180,64,47,.18); border-color:var(--red);}
.opt-btn:disabled{cursor:default;}
.mcq-foot{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center;}
.solution-box{margin-top:12px; padding:12px 14px; background:var(--bg2); border-radius:8px; font-size:14.5px; white-space:pre-wrap;}

.flash-wrap{max-width:520px; margin:0 auto;}

.flash-side-label{position:absolute; top:10px; right:14px; font-size:11px; color:var(--text2);}
.flash-controls{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px;}
.flash-controls button{padding:10px; border-radius:8px; border:none; color:#fff; font-weight:600;}

.palette{display:grid; grid-template-columns:repeat(8,1fr); gap:6px;}
.palette button{aspect-ratio:1; border-radius:6px; border:1px solid var(--border); background:var(--bg); font-size:13px;}
.palette button.answered{background:var(--teal); color:#fff; border-color:var(--teal);}
.palette button.marked{background:var(--gold); color:#231a08; border-color:var(--gold);}
.palette button.current{outline:2px solid var(--maroon); outline-offset:1px;}
.timer-display{font-weight:700; font-size:18px; color:var(--maroon);}

table.simple{width:100%; border-collapse:collapse; font-size:14px;}
table.simple th, table.simple td{border:1px solid var(--border); padding:8px 10px; text-align:left;}
table.simple th{background:var(--bg2);}

.kbd{font-size:11px; border:1px solid var(--border); border-radius:4px; padding:1px 6px; background:var(--bg);}

    {type:'para', title:'মূলদ ও অমূলদ সংখ্যা', text:'যে সংখ্যাকে p/q আকারে প্রকাশ করা যায় (যেখানে p, q পূর্ণসংখ্যা এবং q ≠ ০), তাকে মূলদ সংখ্যা বলে। যে সংখ্যাকে এভাবে প্রকাশ করা যায় না (যেমন √২, √৩, e) তাকে অমূলদ সংখ্যা বলে। উৎস পিডিএফে "√2 সংখ্যাটি কি সংখ্যা?" এবং "e কি ধরনের সংখ্যা?" — এই দুই ধরনের প্রশ্ন এসেছে, উভয়েরই উত্তর অমূলদ সংখ্যা।'},
    {type:'warning', text:'⚠️ যাচাই প্রয়োজন: উৎস পিডিএফের ফন্ট এনকোডিং সমস্যার (SutonnyMJ/Bijoy লিগ্যাসি ফন্ট) কারণে কিছু জটিল বীজগাণিতিক সূত্র/ভগ্নাংশ অপশন (যেমন প্রশ্ন ৩১, ৩২, ৪৭, ৪৮) সম্পূর্ণভাবে উদ্ধার করা যায়নি — এই এমসিকিউগুলো ⚠️ ট্যাগ দিয়ে চিহ্নিত এবং সমাধান সূত্র দেখানো আছে। এছাড়া দুটি প্রশ্নে (৪৩, ৫১) উৎসের নিজস্ব উত্তর-কী-তেই ছাপার ভুল পাওয়া গেছে, যা যাচাই করে সংশোধিত উত্তরসহ দেখানো হয়েছে।'},
    {type:'para', title:'গড় (Average)', text:'কতগুলো সংখ্যার সমষ্টিকে সংখ্যার পরিমাণ দিয়ে ভাগ করলে যে মান পাওয়া যায়, তাকে গড় বলে। গড় = (সমষ্টি) ÷ (সংখ্যার পরিমাণ)। এই লেকচারে বয়সের গড়, ওজনের গড়, ক্রমিক সংখ্যার গড়, এবং দুই দলের গড় একত্র করার সূত্র নিয়ে বিস্তারিত অনুশীলন করা হয়েছে।'},
    {type:'shortcut', text:'শর্টকাট: M সংখ্যক রাশির গড় A এবং N সংখ্যক রাশির গড় B হলে, সবগুলোর গড় = (AM + BN) / (M + N)। (উৎস: পৃষ্ঠা ৬, প্রশ্ন ৪৭)।'}

  lec2: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ৮–১৮ — এই লেকচারের বিষয়বস্তু সিলেবাসের ৩ নং ইউনিট (সূচক-লগারিদম-অনুক্রম-ধারা) এবং ১ নং ইউনিটের (ভগ্নাংশ) অংশবিশেষ নিয়ে গঠিত।'},
    {type:'table', title:'সিলেবাস ও মান বণ্টন', ref:'lec1'},
    {type:'keyfact', text:"Teacher's Content — এই লেকচারে তিনটি প্রধান বিষয় আলোচিত হয়েছে: সিরিজ (অনুক্রম ও ধারা), ভগ্নাংশ, এবং বয়স সংক্রান্ত সমস্যা।"},
    {type:'para', title:'সিরিজ / অনুক্রম ও ধারা', text:'একটি নির্দিষ্ট নিয়ম মেনে সাজানো সংখ্যার তালিকাকে সিরিজ বা অনুক্রম বলে। সমান্তর ধারায় পাশাপাশি দুই পদের অন্তর সর্বদা সমান থাকে; গুণোত্তর ধারায় পাশাপাশি দুই পদের অনুপাত সর্বদা সমান থাকে। এছাড়া ফিবোনাচি-ধরনের ধারা (যেখানে প্রতিটি পদ আগের দুই পদের সমষ্টি) এবং বর্গ-সংখ্যাভিত্তিক ধারাও এই লেকচারে অনুশীলন করানো হয়েছে।'},
    {type:'keyfact', text:'সমান্তর ধারার n-তম পদ = a + (n-1)d এবং n পদের সমষ্টি = n/2 × [2a + (n-1)d], যেখানে a=প্রথম পদ, d=সাধারণ অন্তর।'},
    {type:'para', title:'ভগ্নাংশ', text:'এই অংশে ভগ্নাংশ তুলনা (কোনটি বড়/ছোট/লঘিষ্ঠ), ভগ্নাংশের যোগ-বিয়োগ-গুণ-ভাগ, এবং "একটি খুঁটি/বাঁশের অংশবিশেষ" ধরনের বাস্তব-জীবনের ভগ্নাংশ সমস্যা ব্যাপকভাবে অনুশীলন করানো হয়েছে।'},
    {type:'warning', text:'⚠️ যাচাই প্রয়োজন: এই লেকচারের উৎস পিডিএফে বীজগাণিতিক ভগ্নাংশ-সংবলিত অপশন (যেমন জটিল ভগ্নাংশ তুলনা ও "অংশবিশেষ" ধরনের প্রশ্নের অপশন) ঘনভাবে ছাপা থাকায় Lecture 1-এর তুলনায় বেশি সংখ্যক প্রশ্নে (মোট ১০টি) অপশনের হুবহু লেখা অনিশ্চিত রয়ে গেছে, যদিও প্রতিটি প্রশ্নের সঠিক উত্তর স্বাধীনভাবে হিসাব করে যাচাই করা হয়েছে। প্রতিটি এমন প্রশ্নে ⚠️ ট্যাগ ও সুনির্দিষ্ট ব্যাখ্যা যুক্त করা আছে।'},
    {type:'para', title:'বয়স সংক্রান্ত সমস্যা', text:'পিতা-পুত্র, স্বামী-স্ত্রী, বা একাধিক ব্যক্তির বর্তমান/অতীত/ভবিষ্যৎ বয়সের অনুপাত ও সমষ্টি নিয়ে সমীকরণ গঠন করে সমাধান করার কৌশল এই অংশে অনুশীলন করানো হয়েছে।'},
    {type:'shortcut', text:'শর্টকাট: বয়স সংক্রান্ত সমস্যায় সাধারণত একজনের বর্তমান বয়সকে চলক (x) ধরে বাকিদের বয়স তার মাধ্যমে প্রকাশ করলে সমীকরণ সহজ হয়।'}

  lec3: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ১৯–২৫ — এই লেকচারের বিষয়বস্তু সিলেবাসের ১ নং ইউনিটের (শতকরা, লাভ-ক্ষতি) অংশবিশেষ এবং পরিমিতি/জ্যামিতি ইউনিটের ঘড়ি-কোণ সমস্যা নিয়ে গঠিত।'},
    {type:'table', title:'সিলেবাস ও মান বণ্টন', ref:'lec1'},
    {type:'keyfact', text:"Teacher's Content — এই লেকচারে চারটি প্রধান বিষয় আলোচিত হয়েছে: শতকরা লাভ-ক্ষতি, পাস ও ফেল, হ্রাস ও বৃদ্ধি, এবং ঘড়ির কাঁটার কোণ।"},
    {type:'para', title:'শতকরা লাভ-ক্ষতি', text:'ক্রয়মূল্য ও বিক্রয়মূল্যের পার্থক্য থেকে লাভ বা ক্ষতির হার নির্ণয় করা এই অংশের মূল বিষয়। লাভ% = (বিক্রয়মূল্য-ক্রয়মূল্য)/ক্রয়মূল্য × ১০০, এবং ক্ষতি% = (ক্রয়মূল্য-বিক্রয়মূল্য)/ক্রয়মূল্য × ১০০।'},
    {type:'keyfact', text:'চক্রবৃদ্ধি মুনাফার সূত্র: n বছর পর মোট টাকা = আসল × (১ + হার/১০০)ⁿ।'},
    {type:'para', title:'পাস ও ফেল (সেট তত্ত্ব প্রয়োগ)', text:'দুটি বিষয়ে পাস-ফেলের হিসাবে সাধারণত ভেন ডায়াগ্রামের নীতি ব্যবহার করা হয়: অন্তত একটি বিষয়ে পাস = (শুধু প্রথম বিষয়ে পাস) + (শুধু দ্বিতীয় বিষয়ে পাস) + (উভয় বিষয়ে পাস)। উভয় বিষয়ে ফেল = মোট - (অন্তত একটিতে পাস)।'},
    {type:'para', title:'হ্রাস ও বৃদ্ধি', text:'কোনো রাশির মূল্য বা পরিমাণ শতকরা হারে বাড়া-কমার প্রভাব হিসাব করার কৌশল। একাধিক ধারাবাহিক পরিবর্তন হলে প্রতিটি পরিবর্তনের গুণনীয়ক (multiplier) একসাথে গুণ করে চূড়ান্ত ফলাফল বের করা হয়।'},
    {type:'warning', text:'⚠️ যাচাই প্রয়োজন: এই লেকচারের উৎস পিডিএফের কিছু পৃষ্ঠায় (বিশেষত শুরুর দিকের প্রশ্নগুলোতে) সমাধানের হিসাব ও পাশে ছাপা "উত্তর ঃ" অক্ষরের মধ্যে অসংগতি একাধিকবার পাওয়া গেছে বলে মনে হয়েছে — সম্ভবত উৎস বইয়ের নিজস্ব ছাপার ত্রুটি। মোট ১৪টি প্রশ্নে ⚠️ ট্যাগ ব্যবহার করা হয়েছে, প্রতিটিতে হিসাব-ভিত্তিক সঠিক উত্তর দেখিয়ে সুনির্দিষ্ট ব্যাখ্যা যুক্ত করা আছে। এছাড়া উৎসের ৩টি প্রশ্ন (নং ৪৮, ৫২, ৫৩) এত বেশি অস্পষ্ট ছিল যে দায়িত্বশীলভাবে অন্তর্ভুক্ত করা যায়নি, তাই বাদ দেওয়া হয়েছে।'},
    {type:'para', title:'ঘড়ির কাঁটার কোণ', text:'ঘণ্টা H এবং মিনিট M হলে, ঘণ্টা ও মিনিটের কাঁটার মধ্যকার কোণ = |30H − 5.5M| ডিগ্রি (যদি ফলাফল ১৮০° এর বেশি হয়, তবে ৩৬০° থেকে বিয়োগ করতে হবে)।'}

  lec4: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ২৬–৩৩ — এই লেকচারের বিষয়বস্তু সিলেবাসের ১ নং ইউনিটের (ল.সা.গু, গ.সা.গু, সরল ও যৌগিক মুনাফা) অংশ নিয়ে গঠিত।'},
    {type:'table', title:'সিলেবাস ও মান বণ্টন', ref:'lec1'},
    {type:'keyfact', text:"Teacher's Content — এই লেকচারে দুটি প্রধান বিষয় আলোচিত হয়েছে: ল.সা.গু ও গ.সা.গু, এবং সুদ-আসল (সরল মুনাফা)।"},
    {type:'para', title:'ল.সা.গু ও গ.সা.গু', text:'একাধিক সংখ্যার লঘিষ্ঠ সাধারণ গুণিতক (ল.সা.গু) হলো তাদের সবার দ্বারা নিঃশেষে বিভাজ্য ক্ষুদ্রতম সংখ্যা। গরিষ্ঠ সাধারণ গুণনীয়ক (গ.সা.গু) হলো তাদের সবাইকে নিঃশেষে ভাগ করতে পারে এমন বৃহত্তম সংখ্যা। দুটি সংখ্যার ক্ষেত্রে: সংখ্যা দুটির গুণফল = ল.সা.গু × গ.সা.গু।'},
    {type:'keyfact', text:'"অবশিষ্ট রেখে ভাগ" ধরনের সমস্যায়: যদি প্রতিটি ভাজকের ক্ষেত্রে অবশিষ্টের সাথে ভাজকের পার্থক্য সমান হয়, তাহলে উত্তর সংখ্যা = ল.সা.গু − (সেই সমান পার্থক্য)। আর যদি প্রতিক্ষেত্রে অবশিষ্ট সমান হয়, তাহলে উত্তর সংখ্যা = ল.সা.গু + অবশিষ্ট।'},
    {type:'shortcut', text:'ভাজকের সংখ্যা নির্ণয়ের সূত্র: N = p₁^a × p₂^b × p₃^c ... (মৌলিক উৎপাদকে বিশ্লেষণ) হলে, N-এর মোট ভাজক সংখ্যা = (a+1)(b+1)(c+1)...।'},
    {type:'para', title:'সুদ-আসল (সরল মুনাফা)', text:'সরল সুদ (SI) = আসল(P) × হার(r) × সময়(t) ÷ ১০০। সুদে-আসল = আসল + সুদ। এই সূত্র থেকে আসল, হার, বা সময় — যেকোনো একটি অজানা রাশি বাকি তিনটি জানা থাকলে নির্ণয় করা যায়।'},
    {type:'warning', text:'⚠️ যাচাই প্রয়োজন: এই লেকচারের উৎস পিডিএফে জটিল ভাজক-গণনা ও একাধিক-ধাপবিশিষ্ট সুদ-আসল সমস্যার কিছু অংশে (মোট ৩টি প্রশ্নে) অপশন তালিকা সম্পূর্ণ স্পষ্টভাবে নিষ্কাশন করা যায়নি বা সমাধানের ধাপ পার্শ্ববর্তী প্রশ্নের সাথে মিশে গেছে বলে মনে হয়েছে। প্রতিটিতে ⚠️ ট্যাগ ও সুনির্দিষ্ট ব্যাখ্যা যুক্ত করা আছে; বাকি ৪৪টি প্রশ্ন সম্পূর্ণ পরিষ্কারভাবে যাচাই করা গেছে।'}
  ],
  lec5: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ৩৪–৫৩ (২০ পৃষ্ঠা — এই বইয়ের সবচেয়ে বড় লেকচার) — সিলেবাসের ১ নং ইউনিটের (অনুপাত ও সমানুপাত) অংশ এবং তার ব্যবহারিক প্রয়োগ (কাজ-সময়, ঐকিক নিয়ম, নৌকা-স্রোত, ট্রেন-বাস) নিয়ে গঠিত। এই লেকচারে দুটি পৃথক Student Work অনুশীলন সেট আছে (মোট ১১৭টি প্রশ্ন) — একটি কাজ-সময় ও অনুপাত-সমানুপাত নিয়ে (৫০টি), অন্যটি ঐকিক নিয়ম ও বিবিধ নিয়ে (৬৭টি)।'},
    {type:'table', title:'সিলেবাস ও মান বণ্টন', ref:'lec1'},
    {type:'keyfact', text:"Teacher's Content — এই লেকচারে আলোচিত বিষয়: অনুপাত-সমানুপাত, কাজ-সময়, ঐকিক নিয়ম, নৌকা-স্রোত, ট্রেন-প্ল্যাটফর্ম, এবং বিবিধ ধাঁধা-জাতীয় গাণিতিক সমস্যা।"},
    {type:'para', title:'কাজ-সময় (Work-Time)', text:'কারো কাজ করার হার = ১/(কাজ শেষ করতে লাগা মোট দিন)। একাধিক ব্যক্তি/বস্তু একত্রে কাজ করলে তাদের হার যোগ হয়। "M জন X দিনে করলে N জন কত দিনে করবে" জাতীয় প্রশ্নে মোট কাজ (লোক-দিন) স্থির থাকে: M×X = N×সময়।'},
    {type:'para', title:'অনুপাত-সমানুপাত', text:'দুই বা ততোধিক রাশির মধ্যে তুলনামূলক সম্পর্ককে অনুপাত বলে। একাধিক অনুপাতকে মেলাতে (যেমন a:b এবং b:c থেকে a:b:c বের করতে) common অংশটিকে (এখানে b) উভয় অনুপাতে সমান করে নিতে হয়।'},
    {type:'keyfact', text:'নৌকা-স্রোত সমস্যায়: স্রোতের অনুকূলে বেগ = নৌকার বেগ+স্রোতের বেগ; প্রতিকূলে বেগ = নৌকার বেগ−স্রোতের বেগ।'},
    {type:'shortcut', text:'শব্দ/গুলির শোনা-সংক্রান্ত দূরত্বের সূত্র: দূরত্ব = (বেগদ্বয়ের গুণফল × মোট সময়) ÷ (বেগদ্বয়ের সমষ্টি)।'},
    {type:'warning', text:'⚠️ যাচাই প্রয়োজন: এই বিশাল লেকচারে (১১৭ প্রশ্ন) মোট ৬টি প্রশ্নে ⚠️ ফ্ল্যাগ আছে — কিছু ক্ষেত্রে উৎসের প্রশ্নের বাক্য অসম্পূর্ণ/অস্পষ্ট থাকায় সমাধানের ধাপ অনুসরণ করে প্রশ্নটি সংগতিপূর্ণভাবে পুনর্গঠন করতে হয়েছে (যেমন প্রশ্ন ২৬, ২৮, ৪৯ — Set ১; প্রশ্ন ৫৯ — Set ২), আবার কিছু ক্ষেত্রে জটিল ভগ্নাংশ/বীজগাণিতিক অপশন সম্পূর্ণ নিষ্কাশন করা যায়নি। প্রতিটি ক্ষেত্রে সঠিক উত্তর স্বাধীনভাবে গণনা করে যাচাই করা হয়েছে।'}
  ],
  lec6: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ৫৪–৬৪ — সিলেবাসের ২ নং ইউনিটের (বীজগাণিতিক সূত্রাবলি) এবং ৫ নং ইউনিটের (সেট) অংশ নিয়ে গঠিত।'},
    {type:'table', title:'সিলেবাস ও মান বণ্টন', ref:'lec1'},
    {type:'keyfact', text:"Teacher's Content — এই লেকচারে দুটি প্রধান বিষয়: বীজগাণিতিক অভেদ ব্যবহার করে মান নির্ণয় (x+1/x জাতীয় রাশি থেকে x²+1/x², x³+1/x³ ইত্যাদি বের করা), এবং সেট তত্ত্ব (ইউনিয়ন, ইন্টারসেকশন, পাওয়ার সেট)।"},
    {type:'para', title:'গুরুত্বপূর্ণ বীজগাণিতিক অভেদ', text:'(a+b)² = a²+2ab+b² এবং (a−b)² = a²−2ab+b² থেকে a²+b² ও ab পরস্পর থেকে বের করা যায়। a³+b³ = (a+b)(a²−ab+b²) এবং a³−b³ = (a−b)(a²+ab+b²)। x+1/x = k জানা থাকলে: x²+1/x² = k²−2, এবং x³+1/x³ = k³−3k।'},
    {type:'keyfact', text:'a+b+c=0 হলে সর্বদা a³+b³+c³ = 3abc — এটি একটি ঘন ঘন পরীক্ষায় আসা বিশেষ অভেদ।'},
    {type:'warning', text:'⚠️⚠️ এই লেকচারের বিশেষ সীমাবদ্ধতা: উৎস পিডিএফে এই লেকচারের গাণিতিক রাশিগুলো (ভগ্নাংশ, সূচক) স্তরীভূত আকারে টাইপসেট করা, যা টেক্সট নিষ্কাশনে মারাত্মকভাবে এলোমেলো হয়ে যায় — শুধু ফরম্যাটিং নষ্ট হয় না, প্রশ্নের প্রকৃত রাশিই অস্পষ্ট হয়ে পড়ে। প্রতিটি প্রশ্ন প্রমিত বীজগাণিতিক অভেদ চিনে ও স্বাধীনভাবে গণনা করে পুনর্গঠন করা হয়েছে (অনুমান নয়, যাচাইকৃত পুনর্গঠন)। যেসব প্রশ্নে এটাও সম্ভব হয়নি, সেগুলো এখানে অন্তর্ভুক্ত করা হয়নি। সম্পূর্ণ সেট তত্ত্ব অংশ (ইউনিয়ন/ইন্টারসেকশন প্রশ্নগুলো) বাদ দেওয়া হয়েছে, কারণ সেখানে শুধু ফরম্যাট নয়, সেটের প্রকৃত সদস্য-তালিকা ও অপারেটর চিহ্নই নিষ্কাশনে হারিয়ে গেছে — যা অনুমান করে পূরণ করা তথ্য বানানোর শামিল হতো। ফলে এই লেকচারে প্রশ্ন সংখ্যা তুলনামূলক কম (২৩টি), তবে প্রতিটি সাবধানে যাচাই করা।'}
  ],
  lec7: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ৬৫–৭৯ — এটি বইয়ের প্রথম "মানসিক দক্ষতা" (Mental Ability) লেকচার, "গাণিতিক যুক্তি" বিষয় থেকে সম্পূর্ণ ভিন্ন একটি সিলেবাস ইউনিট। ছয়টি উপ-ইউনিটের সিলেবাস তালিকা উৎসে দেওয়া থাকলেও প্রতি-ইউনিট মার্কস-বণ্টন উল্লেখ ছিল না, তাই নিচের সারণিতে মার্কস কলাম "—" দেখানো হয়েছে (মোট ১৫ শুধুমাত্র সামগ্রিক পূর্ণমান)।'},
    {type:'table', title:'সিলেবাস (মানসিক দক্ষতা)', ref:'lec7'},
    {type:'keyfact', text:"এই লেকচারে ছয়টি প্রধান বিষয় আলোচিত হয়েছে: শব্দের যৌক্তিক ক্রম ও চাপ পরীক্ষা (৪৩টি), রক্তের সম্পর্ক ও গণনা (৩১টি), আসন বিন্যাস ও তুলনা (২০টি), সাদৃশ্য/Analogy (১০৪টি), অসম্ভবতা/Impossibility (৫১টি), এবং ভিন্নটি খুঁজুন/Odd-man-out (১২টি, শুধু টেক্সট-ভিত্তিক অংশ)। মোট ২৬১টি প্রশ্ন।"},
    {type:'para', title:'শব্দের যৌক্তিক ক্রম (Logical Sequence of Words)', text:'কতগুলো শব্দ দেওয়া থাকে যাদের মধ্যে একটি যৌক্তিক সম্পর্ক (কালানুক্রম, আকার, তীব্রতা, বর্ণানুক্রম ইত্যাদি) বিদ্যমান। প্রতিটি শব্দের প্রথম অক্ষর/অংশ নিয়ে সেই যৌক্তিক ক্রম অনুযায়ী সাজিয়ে সংক্ষিপ্তরূপ মেলাতে হয়। কিছু ক্ষেত্রে কোডিং-ডিকোডিং, অক্ষর-স্থানান্তর এবং অক্ষর-গণনার ধাঁধাও এই অংশে আসে।'},
    {type:'para', title:'রক্তের সম্পর্ক ও গণনা (Blood Relation & Counting)', text:'পারিবারিক সম্পর্ক-শৃঙ্খল (কে কার ভাই/বোন/মামা/ফুফু ইত্যাদি) ধাপে ধাপে বিশ্লেষণ করে চূড়ান্ত সম্পর্ক নির্ণয় করতে হয়। পরিবারের সদস্য সংখ্যা গণনার সমস্যাও এই অংশে আসে (দম্পতি, সন্তান, নাতি-নাতনি ইত্যাদি যোগ করে মোট সদস্য বের করা)।'},
    {type:'para', title:'আসন বিন্যাস ও তুলনা (Seating Arrangement & Comparison)', text:'কতগুলো তুলনামূলক শর্ত (A, B-এর চেয়ে লম্বা; B, C-এর চেয়ে বয়স্ক ইত্যাদি) দেওয়া থাকে, যেগুলো একত্র করে সম্পূর্ণ ক্রম (র‍্যাংকিং) সাজিয়ে নির্দিষ্ট ব্যক্তি/বস্তুর অবস্থান (সবচেয়ে লম্বা/ভারী/দামি ইত্যাদি) নির্ণয় করতে হয়।'},
    {type:'keyfact', text:'শর্টকাট: তুলনামূলক শর্তগুলোকে ছোট-থেকে-বড় (<) চিহ্ন দিয়ে একটি একক শৃঙ্খলে সাজিয়ে ফেললে (যেমন C<D<A<B) সর্বোচ্চ/সর্বনিম্ন সহজেই চেনা যায়।'},
    {type:'para', title:'সাদৃশ্য (Analogy)', text:'প্রথম জোড়া শব্দের মধ্যকার সম্পর্ক (প্রতিশব্দ, বিপরীতার্থক, কারণ-ফলাফল, অংশ-সমগ্র, স্রষ্টা-সৃষ্টি ইত্যাদি) চিহ্নিত করে দ্বিতীয় জোড়ার অসম্পূর্ণ অংশ পূরণ করতে হয়। এই লেকচারে ১০৪টি Analogy প্রশ্ন সম্পূর্ণভাবে উদ্ধার ও অন্তর্ভুক্ত করা হয়েছে (উৎসের নিজস্ব উত্তর-কী অনুযায়ী যাচাই করে)।'},
    {type:'para', title:'অসম্ভবতা (Impossibility)', text:'একটি অসম্পূর্ণ বাক্যের (\"...ছাড়া X করা অসম্ভব\") সবচেয়ে যৌক্তিক/অপরিহার্য পূরক অংশ (সাধারণ জ্ঞান-ভিত্তিক) খুঁজে বের করতে হয়। এই অংশে উৎসের নিজস্ব উত্তর সরাসরি হাইলাইট/উত্তর-কী আকারে দেওয়া ছিল, যা প্রতিটি প্রশ্নে ব্যবহার করা হয়েছে।'},
    {type:'para', title:'ভিন্নটি খুঁজুন (Odd-man-out)', text:'চারটি (বা ততোধিক) শব্দ/সংখ্যা/চিত্রের মধ্যে যেটি অন্যদের থেকে ভিন্ন শ্রেণির, তা চিহ্নিত করতে হয়। উৎসের এই অংশে বেশ কিছু প্রশ্ন সম্পূর্ণ চিত্র-ভিত্তিক (figure-based) ছিল যেখানে বিকল্পগুলো টেক্সট নয় বরং ছবি — সেগুলো এই অ্যাপে অন্তর্ভুক্ত করা হয়নি (নিচের সতর্কতা দেখুন); শুধুমাত্র সম্পূর্ণ টেক্সট-ভিত্তিক ১২টি প্রশ্ন অন্তর্ভুক্ত করা হয়েছে।'},
    {type:'warning', text:'⚠️⚠️ এই লেকচারের বিশেষ বিষয়সমূহ: (১) উৎসের Odd-man-out অংশে একাধিক প্রশ্নের বিকল্প ছিল শুধুই ছবি/চিত্র (টেক্সট নয়) — পূর্বে একবার এ ধরনের প্রশ্নে placeholder টেক্সট ("[বিকল্প ক]") ব্যবহারের চেষ্টা হয়েছিল যা ব্যবহারকারীর সিদ্ধান্তে সরাসরি প্রত্যাখ্যাত হয়েছিল, তাই এই সংস্করণে সেগুলো সম্পূর্ণ বাদ দেওয়া হয়েছে, শুধু ১২টি সম্পূর্ণ টেক্সট-ভিত্তিক প্রশ্ন রাখা হয়েছে। (২) উৎস পিডিএফে কয়েকটি প্রশ্নে নিজস্ব ছাপার ত্রুটি পাওয়া গেছে যেমন — শব্দক্রম প্রশ্ন ২২-এর উত্তর-কী ঘরটি ফাঁকা (স্বাধীনভাবে গণনা করে পূরণ করা হয়েছে), প্রশ্ন ২৯-এ দুটি বিকল্পের টেক্সট প্রশ্নের সাথে অসামঞ্জস্যপূর্ণ, রক্তের সম্পর্ক প্রশ্ন ৫-এ প্রশ্ন-বিকল্প অসামঞ্জস্য (পুরুষবাচক প্রশ্নে স্ত্রীবাচক বিকল্প), Impossibility প্রশ্ন ৩১ ও ৪৫-এ ভিন্ন প্রশ্নের অংশ মিশে যাওয়া, এবং Impossibility Student\'s Work প্রশ্ন ৩-এ দুটি বিকল্পে অভিন্ন টেক্সট ছাপা থাকা। এই প্রতিটি ক্ষেত্র ⚠️ ট্যাগ দিয়ে চিহ্নিত ও ব্যাখ্যাসহ দেখানো হয়েছে (মোট ১৯টি প্রশ্নে, ৭.৩%) — উৎসের নিজস্ব ত্রুটি হিসেবে, নিষ্কাশন-ত্রুটি নয়, XML স্থানাংক সরাসরি পরীক্ষা করে নিশ্চিত হওয়ার পর।'}
  ],
  lec8: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ৮০–৮৬ — "সমস্যা সমাধান" ইউনিটের তিনটি ভাগ: গাণিতিক যুক্তি, জ্যামিতিক যুক্তি এবং বার ও সময় নির্ণয়। প্রতিটি ভাগে Teacher\'s Work (উৎসে সাধারণত কোনো ছাপা উত্তর-কী নেই) ও Student\'s Work (হাইলাইট-করা উত্তরসহ) উভয়ই আছে।'},
    {type:'table', title:'সিলেবাস (মানসিক দক্ষতা)', ref:'lec8'},
    {type:'keyfact', text:"এই লেকচারে তিনটি প্রধান বিষয় আলোচিত হয়েছে: গাণিতিক সমস্যা সমাধান (৫৬টি — দুটি পৃথক সেট), জ্যামিতিক সমস্যা সমাধান (২২টি), এবং বার ও সময় নির্ণয় (২৭টি)। মোট ১০৫টি প্রশ্ন।"},
    {type:'para', title:'সমস্যা সমাধান: গাণিতিক যুক্তি (Math)', text:'শতকরা, গড়, অনুপাত, বীজগাণিতিক অভেদ, সূচক, ধারার সমষ্টি, সংখ্যা-প্যাটার্ন (যেমন সংখ্যা-বৃক্ষ) ইত্যাদি বিষয়ের ওপর মিশ্র গাণিতিক সমস্যা। এই লেকচারে দুটি পৃথক Student\'s Work সেট আছে (Set ১: ১৯টি, কোনো ছাপা উত্তর-কী ছাড়া; Set ২: ৩৮টি, ছাপা উত্তর-কীসহ)।'},
    {type:'keyfact', text:'সতর্কতা: এই ধরনের দশমিক গুণ-ভাগের প্রশ্নে (যেমন ০.৪×০.০২×০.০৮) উৎস পিডিএফের টেক্সট-নিষ্কাশনে মাঝে মাঝে পরপর-শূন্য দশমিক সংখ্যার একটি শূন্য হারিয়ে যেতে পারে — প্রতিটি উত্তর স্বাধীনভাবে গণনা করে যাচাই করা হয়েছে।'},
    {type:'para', title:'সমস্যা সমাধান: জ্যামিতিক যুক্তি (Geometry)', text:'বৃত্ত-ব্যাসার্ধ-ক্ষেত্রফল সম্পর্ক, ত্রিভুজ/বর্গ/আয়তক্ষেত্র গণনা, ঘড়ির কোণ, বহুভুজের কোণ-সমষ্টি ইত্যাদি। এই অংশে একাধিক প্রশ্নের স্টেম নিজেই একটি চিত্র (ত্রিভুজ/বর্গ গণনা, কোণ চিত্র) — বিকল্পগুলো টেক্সট/সংখ্যা হওয়ায় প্রশ্নগুলো অন্তর্ভুক্ত করা হয়েছে, তবে নিচের সতর্কতা অনুযায়ী কিছু চিত্র-গণনায় অনিশ্চয়তা থেকে যায়।'},
    {type:'para', title:'বার ও সময় নির্ণয় (Find out the Day & Time)', text:'কোনো একটি তারিখের বার জানা থেকে অন্য একটি তারিখের বার নির্ণয় (মড্যুলার পাটিগণিত: দিনসংখ্যা÷৭-এর ভাগশেষ দিয়ে বার এগিয়ে/পিছিয়ে যাওয়া), এবং "আগামীকাল/পরশু/গতকাল" জাতীয় আপেক্ষিক সময়-বাক্য বিশ্লেষণ।'},
    {type:'keyfact', text:'শর্টকাট: দুই তারিখের মধ্যবর্তী দিন-সংখ্যা বের করে তাকে ৭ দিয়ে ভাগ করলে যে ভাগশেষ পাওয়া যায়, প্রথম তারিখের বার থেকে সেই ভাগশেষ-সংখ্যক দিন এগিয়ে গেলেই দ্বিতীয় তারিখের বার পাওয়া যায়।'},
    {type:'warning', text:'⚠️⚠️ এই লেকচারের বিশেষ বিষয়সমূহ: (১) গাণিতিক সেট ২-এর প্রশ্ন ৩৬ (যদি ৬+২=৯...) বাদ দেওয়া হয়েছে কারণ উৎস পিডিএফে এর ৪টি বিকল্পের মধ্যে মাত্র ২টিতে (ক,খ) প্রকৃত টেক্সট আছে, বাকি দুটি (গ,ঘ) সম্পূর্ণ ফাঁকা। (২) জ্যামিতি প্রশ্ন ২ ("দুটি সমান্তরাল রেখা কটি বিন্দুতে ছেদ করে") একটি সুপরিচিত বিসিএস প্রশ্ন যার প্রকৃত সঠিক উত্তর "ছেদ করে না", কিন্তু উৎস বইয়ে চতুর্থ বিকল্প ভুলভাবে "১৬" ছাপা হয়েছে — একাধিক স্বতন্ত্র বহিঃস্থ উৎস দিয়ে যাচাই করে এই গরমিল নিশ্চিত করা হয়েছে। (৩) গাণিতিক সেট ২-এর প্রশ্ন ৩ (digit ৯ কতবার আসে) এবং সেট ২-এর প্রশ্ন ২৪-এ উৎসের ছাপা উত্তর-কী-এর সাথে স্বাধীন ব্রুট-ফোর্স গণনার ফলাফল মিলিয়ে/না-মিলিয়ে যাচাই করা হয়েছে (প্রথমটিতে সরাসরি গণনা উৎসের কী থেকে ভিন্ন ফলাফল দেয়, তাই স্বাধীন উত্তর ব্যবহৃত হয়েছে)। (৪) জ্যামিতি ও বার-সময়ের Teacher\'s Work অংশে (মোট ২০টি প্রশ্ন) কোনো ছাপা উত্তর-কী নেই — এর মধ্যে চিত্র-গণনাভিত্তিক প্রশ্নগুলোতে (ত্রিভুজ/বর্গ গণনা) কিছুটা অনিশ্চয়তা থেকে যায়, যা প্রতিটিতে ⚠️ ট্যাগ দিয়ে চিহ্নিত করা হয়েছে (মোট ১৫টি প্রশ্নে, ১৪.৩%)।'}
  ],
  lec9: [
    {type:'note', text:'\ud83d\udcd8 \u0989\u09ce\u09b8: \u09aa\u09c3\u09b7\u09cd\u09a0\u09be \u09ee\u09ed\u2013\u09ef\u09e9 \u2014 \u098f\u0987 \u09b2\u09c7\u0995\u099a\u09be\u09b0\u09c7 \u09ac\u0987\u09df\u09c7\u09b0 \u098f\u0995\u099f\u09bf \u0997\u09c1\u09b0\u09c1\u09a4\u09cd\u09ac\u09aa\u09c2\u09b0\u09cd\u09a3 \u09ac\u09c8\u09b6\u09bf\u09b7\u09cd\u099f\u09cd\u09af \u09b0\u09df\u09c7\u099b\u09c7: Student\u2019s Work-\u098f\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u09aa\u09cd\u09b0\u09b6\u09cd\u09a8\u09c7 \u09b8\u09ae\u09cd\u09aa\u09c2\u09b0\u09cd\u09a3 \u09a7\u09be\u09aa\u09c7-\u09a7\u09be\u09aa\u09c7 \u09b8\u09ae\u09be\u09a7\u09be\u09a8 \u099b\u09be\u09aa\u09be \u0986\u099b\u09c7\u0964'},
    {type:'table', title:'সিলেবাস (গাণিতিক যুক্তি)', ref:'lec1'},
    {type:'keyfact', text:"এই লেকচারে চারটি প্রধান বিষয় আলোচিত হয়েছে: উৎপাদক (২৩টি), ল.সা.গু ও গ.সা.গু (৯টি), সূচক (২০টি), এবং লগারিদম (১০টি)। মোট ৬২টি প্রশ্ন।"},
    {type:'para', title:'উৎপাদক (Factorization)', text:'বহুপদী রাশিকে ছোট ছোট উৎপাদকের গুণফল আকারে প্রকাশ করা। এই লেকচারে সাধারণ সূত্র (a³±b³, a⁴+4-এর সোফি জার্মেই অভেদ), মধ্যপদ বিভক্তিকরণ, এবং মূলনির্ণয় পদ্ধতি (factor theorem) ব্যবহার করা হয়েছে।'},
    {type:'para', title:'ল.সা.গু ও গ.সা.গু (LCM & GCD)', text:'একাধিক বীজগাণিতিক রাশির উৎপাদকে বিশ্লেষণ করে সাধারণ ও অসাধারণ উৎপাদকগুলো চিহ্নিত করে ল.সা.গু ও গ.সা.গু নির্ণয় করা হয়। গ.সা.গু নির্ণয়ে প্রায়ই মূলনির্ণয় পদ্ধতি (একটি সংখ্যা বসিয়ে রাশি শূন্য হয় কিনা যাচাই) ব্যবহৃত হয়েছে।'},
    {type:'para', title:'সূচক (Exponents/Indices)', text:'সূচকের মৌলিক সূত্রাবলি (aᵐ·aⁿ=aᵐ⁺ⁿ, (aᵐ)ⁿ=aᵐⁿ ইত্যাদি) প্রয়োগ করে জটিল সূচক-রাশি সরলীকরণ। বেশ কিছু প্রশ্নে সূচকের সমষ্টি শূন্য হয়ে গিয়ে চূড়ান্ত ফলাফল ১-এ পরিণত হওয়ার প্যাটার্ন লক্ষণীয়।'},
    {type:'para', title:'লগারিদম (Logarithm)', text:'লগারিদমের সংজ্ঞা ও সূত্র (log_a(mn)=log_a m+log_a n, পরিবর্তনের সূত্র ইত্যাদি) প্রয়োগ। পারস্পরিক লগারিদমের গুণফল সর্বদা ১ (logᵇa×logᵃb=1) — এই ধর্মটি একাধিক প্রশ্নে ব্যবহৃত হয়েছে।'},
    {type:'keyfact', text:'শর্টকাট: logₐx=1, logₐy=2 ইত্যাদি আকারে দেওয়া থাকলে, জটিল লগারিদমিক রাশিকে সরাসরি x,y-এর ঘাত আকারে রূপান্তর করে সরলীকরণ করা সহজ হয়।'},
    {type:'warning', text:'⚠️⚠️ এই লেকচারের বিশেষ বিষয়সমূহ: (১) Teacher\u2019s Work Content Discussion-এর ২২টি প্রশ্নে উৎস পিডিএফে কোনো সমাধান বা উত্তর-কী নেই — প্রতিটি প্রতীকী বীজগণিত (sympy) দিয়ে স্বাধীনভাবে যাচাই করা হয়েছে। (২) দুটি প্রশ্নে (Teacher\u2019s Work প্রশ্ন ২ ও ৯) উৎস পিডিএফের টেক্সট-নিষ্কাশনে সুপারস্ক্রিপ্ট/পদ হারিয়ে রাশি অসম্পূর্ণ দেখাচ্ছিল — একটি বহিঃস্থ উৎস দিয়ে ক্রস-চেক করে সঠিক রাশি (a\u2074+4 এবং x\u00b3-4x\u00b2-2x-15) নিশ্চিত করা হয়েছে। (৩) একটি প্রশ্নে (Teacher\u2019s Work ১৬, ঘনমূলের প্রশ্ন) মূল সংখ্যাটি (২ না ৩) নিশ্চিতভাবে পড়া যায়নি — বিকল্পের সাথে মিলিয়ে ২ ধরে নেওয়া হয়েছে। (৪) Student\u2019s Work-এর কয়েকটি প্রশ্নে (৯, ১৬, ৩২) উৎসের নিজস্ব ছাপা সমাধান/বিকল্পে ছোটখাটো অসামঞ্জস্য (যেমন দুটি বিকল্পের অভিন্ন টেক্সট) পাওয়া গেছে, যা প্রতিটি ⚠️ ট্যাগ দিয়ে চিহ্নিত করা হয়েছে (মোট ৭টি প্রশ্নে, ১১.৩%)।'}

  lec10: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ৯৪–১০৫ (এর মধ্যে ১০৪ একটি বিজ্ঞাপন পাতা ও ১০৫ ফাঁকা) — Student’s Work-এর প্রতিটি প্রশ্নে সম্পূর্ণ ধাপে-ধাপে সমাধান ছাপা আছে (লেকচার ৯-এর ধারাবাহিকতায়)।'},
    {type:'table', title:'সিলেবাস (গাণিতিক যুক্তি)', ref:'lec1'},
    {type:'keyfact', text:"এই লেকচারে তিনটি প্রধান বিষয় আলোচিত হয়েছে: সরলীকরণ (১৩টি), সমাধান/সমীকরণ (৪২টি), এবং অসমতা (১১টি)। মোট ৬৬টি প্রশ্ন।"},
    {type:'para', title:'সরলীকরণ (Simplification)', text:'জটিল বীজগাণিতিক ভগ্নাংশ ও রাশি ধাপে ধাপে সরল করা। সাধারণ কৌশল: সাধারণ হর নির্ণয়, লব-হর গুণনীয়কে বিশ্লেষণ করে কর্তন (cancel), এবং প্রতিসম রাশিতে (a+b)²-c² জাতীয় অভেদ প্রয়োগ।'},
    {type:'para', title:'সমাধান (Solving Equations)', text:'একচলক ও দ্বিচলক সমীকরণ সমাধান, সূচকীয় সমীকরণ (একই ভিত্তিতে রূপান্তর করে সূচক সমীকরণ), এবং প্রতিস্থাপন পদ্ধতিতে (t=a^x ধরে) দ্বিঘাত-রূপী সূচকীয় সমীকরণ সমাধান। কয়েকটি প্রশ্নে বাস্তব জীবনের গাণিতিক সমস্যা (দাম, পরিমাণ) থেকে সমীকরণ গঠন করে সমাধান করতে হয়।'},
    {type:'para', title:'অসমতা (Inequality)', text:'এক-চলক অসমতা সমাধান, পরম মান (|x-a|) সংবলিত অসমতা, এবং একাধিক অসমতা একত্রে সমাধান (যেমন ২x-৭<৮<৩x-১১ ধরনের যৌগিক অসমতা)। মনে রাখার বিষয়: ঋণাত্মক সংখ্যা দিয়ে গুণ/ভাগ করলে অসমতার চিহ্ন উল্টে যায়।'},
    {type:'keyfact', text:'শর্টকাট: |x-a|<k আকারের অসমতা সরাসরি -k<x-a<k আকারে ভেঙে সমাধান করা যায়; একইভাবে |x-a|≥k হলে x-a≤-k অথবা x-a≥k ধরে সমাধান করতে হয়।'},
    {type:'warning', text:'⚠️⚠️ এই লেকচারের বিশেষ বিষয়সমূহ: (১) Teacher’s Work Content Discussion-এর ২১টি প্রশ্নে উৎস পিডিএফে কোনো সমাধান/উত্তর-কী নেই — প্রতিটি sympy দিয়ে স্বাধীনভাবে যাচাই করা হয়েছে। (২) Student’s Work-এর কয়েকটি প্রশ্নে (১, ২, ৯, ২৯, ৩৪, ৩৭, ৩৮, এবং আরও কয়েকটি) উৎসের ছাপা প্রশ্ন/সমাধান/বিকল্পে ছোটখাটো অসামঞ্জস্য বা অসম্পূর্ণ তথ্য (যেমন চলক যার মান কোথাও উল্লেখ নেই, বা সমাধানের চূড়ান্ত ধাপ প্রশ্নের সাথে পুরোপুরি না মেলা) পাওয়া গেছে — প্রতিটি ক্ষেত্রে উৎসের ছাপা সমাধান/উত্তর অগ্রাধিকার দিয়ে ব্যবহার করা হয়েছে এবং ⚠️ ট্যাগে ব্যাখ্যা করা হয়েছে (মোট ৮টি প্রশ্নে, ১২.১%)। (৩) পৃষ্ঠা ১০৪ (বিজ্ঞাপন) ও ১০৫ (ফাঁকা) থেকে কোনো প্রশ্ন নেওয়া হয়নি।'}

  lec11: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ১০৭–১২১ — এই লেকচারে সবচেয়ে বেশি প্রশ্ন (২৭৪টি) রয়েছে। বানান, প্রতিশব্দ, শূন্যস্থান পূরণ ও সিদ্ধান্ত গ্রহণ অংশে উৎসের নিজস্ব হাইলাইট-করা উত্তর ও পূর্ণাঙ্গ উত্তর-কী টেবিল সরাসরি ব্যবহার করা হয়েছে।'},
    {type:'table', title:'সিলেবাস (মানসিক দক্ষতা)', ref:'lec11'},
    {type:'keyfact', text:"এই লেকচারে ছয়টি প্রধান বিষয় আলোচিত হয়েছে: সংখ্যাগত ক্ষমতা (৫২টি), বানান (৫৬টি), প্রতিশব্দ ও বিপরীতার্থক শব্দ (৪৩টি), ভাষা বোধগম্যতা (২৭টি), শূন্যস্থান পূরণ (৬৪টি), এবং সিদ্ধান্ত গ্রহণ ক্ষমতা (৩২টি)। মোট ২৭৪টি প্রশ্ন।"},
    {type:'para', title:'সংখ্যাগত ক্ষমতা (Numerical Ability)', text:'সংখ্যা-ধারা সনাক্তকরণ, মৌলিক সংখ্যা, ভাজক নির্ণয়, মূলদ-অমূলদ সংখ্যা, এবং সংখ্যা-গ্রিড/চিত্র-ভিত্তিক প্যাটার্ন প্রশ্ন। কিছু চিত্র-ভিত্তিক প্রশ্নে (বৃত্ত/গ্রিড আকারে সাজানো সংখ্যা) সুনির্দিষ্ট নিয়ম পুনর্গঠনে অনিশ্চয়তা থেকে যায়।'},
    {type:'para', title:'বানান (Spelling)', text:'বাংলা ও ইংরেজি শব্দের শুদ্ধ বানান চেনা। এই অংশে উৎসের নিজস্ব হাইলাইট-করা উত্তর ও একটি পূর্ণাঙ্গ উত্তর-কী টেবিল (৫৬টি আইটেম) সরাসরি ব্যবহার করা হয়েছে।'},
    {type:'para', title:'প্রতিশব্দ ও বিপরীতার্থক শব্দ (Synonyms & Antonyms)', text:'বাংলা ও ইংরেজি শব্দের সমার্থক/বিপরীতার্থক শব্দ এবং শব্দার্থ নির্ণয়।'},
    {type:'para', title:'ভাষা বোধগম্যতা (Ability to Understand the Language)', text:'বাক্যের অর্থ অনুধাবন করে সবচেয়ে উপযুক্ত শব্দ/ধারণা নির্বাচন। এই অংশের Teacher\u2019s Work-এর ১০টি প্রশ্নে উৎসে কোনো উত্তর-কী নেই — ব্যাকরণগত/অর্থগত যুক্তি দিয়ে স্বাধীনভাবে যাচাই করা হয়েছে।'},
    {type:'para', title:'শূন্যস্থান পূরণ (Fill in the Gaps)', text:'ইংরেজি বাক্যে প্রসঙ্গ-উপযোগী শব্দ বসিয়ে বাক্য সম্পূর্ণ করা — এই লেকচারের সবচেয়ে বড় অংশ (৬৪টি প্রশ্ন), সবগুলোতেই উৎসের নিজস্ব উত্তর-কী রয়েছে।'},
    {type:'para', title:'সিদ্ধান্ত গ্রহণ ক্ষমতা (Decision Making Ability)', text:'বাস্তবজীবনের পরিস্থিতি/আচরণগত প্রশ্ন এবং অনুচ্ছেদ-ভিত্তিক সিদ্ধান্ত গ্রহণ। এই ধরনের প্রশ্নের প্রকৃতিই বিষয়ীগত (subjective) — Teacher\u2019s Work-এর ৬টি প্রশ্নে উৎসে কোনো উত্তর-কী না থাকায় প্রচলিত সিভিল সার্ভিস কনভেনশন অনুযায়ী যুক্তিসঙ্গত অনুমান করা হয়েছে, যা নিশ্চিতভাবে যাচাইযোগ্য নয় বলে স্পষ্টভাবে চিহ্নিত।'},
    {type:'warning', text:'⚠️⚠️ এই লেকচারের বিশেষ বিষয়সমূহ: (১) সংখ্যাগত ক্ষমতার Teacher\u2019s Work অংশে কয়েকটি চিত্র/গ্রিড-ভিত্তিক প্রশ্নে (১০, ১১, ১২, ১৩ নং) সুনির্দিষ্ট চিত্র ছাড়া নিয়ম সম্পূর্ণ নিশ্চিতভাবে পুনর্গঠন করা যায়নি। (২) Decision Making Ability-এর Student\u2019s Work অংশে মূল উৎসে ২৯টি প্রশ্ন থাকলেও ৩টি প্রশ্ন (২৪, ২৫, ২৭ নং) বাদ দেওয়া হয়েছে, কারণ তাদের সঠিক উত্তর ছিল পঞ্চম বিকল্প "E" যা এই অ্যাপের চার-বিকল্প কাঠামোর সাথে খাপ খায় না। (৩) "Ability to Understand the Language"-এর Student\u2019s Work প্রশ্ন ১-এর উৎসের নিজস্ব উত্তর-কী ঘর ফাঁকা ছিল — "Fill in the Gaps" অংশে হুবহু অভিন্ন প্রশ্নের উত্তর-কী থেকে ক্রস-রেফারেন্স করে সমাধান করা হয়েছে। (৪) Teacher\u2019s Work Decision Making Ability-এর ৬টি প্রশ্ন প্রকৃতিগতভাবে বিষয়ীগত (কোনো বস্তুনিষ্ঠ সঠিক উত্তর নেই) এবং উৎসে কোনো উত্তর-কী নেই — এই ৬টি প্রশ্নে বিশেষভাবে সতর্ক থাকা উচিত। মোট ১৩টি প্রশ্নে (৪.৭%) ⚠️ ফ্ল্যাগ যুক্ত করা হয়েছে।'}

  lec12: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ১২২–১২৬ — এই লেকচারে তিনটি উপ-বিভাগ: স্থানাঙ্ক সম্পর্ক (Space Relation), দিক নির্ণয় (Direction Test), এবং যান্ত্রিক দক্ষতা (Mechanical Reasoning)। এই লেকচারের প্রায় সবকটি Teacher\u2019s Work প্রশ্নে কোনো ছাপা উত্তর-কী নেই, তাই স্বাধীন যুক্তি/গণনা দিয়ে যাচাই করা হয়েছে।'},
    {type:'table', title:'সিলেবাস (মানসিক দক্ষতা)', ref:'lec11'},
    {type:'keyfact', text:"এই লেকচারে তিনটি বিষয় আলোচিত হয়েছে: স্থানাঙ্ক সম্পর্ক (৯টি, সম্পূর্ণ চিত্র-ভিত্তিক বলে বাদ দেওয়া হয়েছে), দিক নির্ণয় (৩২টি অন্তর্ভুক্ত — Teacher\u2019s Work ৬ + Student\u2019s Work ২৬), এবং যান্ত্রিক দক্ষতা (৮টি অন্তর্ভুক্ত — Teacher\u2019s Work ৫ + Student\u2019s Work ৩)। মোট ৪০টি প্রশ্ন।"},
    {type:'para', title:'স্থানাঙ্ক সম্পর্ক (Space Relation)', text:'উৎস পিডিএফের এই অংশের ৯টি প্রশ্নের প্রতিটির চারটি বিকল্পই ছবি/চিত্র (বৃত্ত, জ্যামিতিক আকৃতি, তীরচিহ্ন ইত্যাদি) আকারে ছাপা — কোনো টেক্সট-ভিত্তিক বিকল্প নেই। এই ধরনের সম্পূর্ণ চিত্র-নির্ভর প্রশ্ন এই অ্যাপে অন্তর্ভুক্ত করা সম্ভব নয় (আগের লেকচারগুলোর নীতি অনুসরণ করে), তাই পুরো অংশটি বাদ দেওয়া হয়েছে।'},
    {type:'para', title:'দিক নির্ণয় (Direction Test)', text:'একজন ব্যক্তি/বস্তু বিভিন্ন দিকে হেঁটে/ঘুরে শেষে কোন দিকে অবস্থিত বা মুখ করে আছে তা নির্ণয় করতে হয়। মূল কৌশল: প্রতিটি ডানে ঘোরাকে +৯০° এবং বামে ঘোরাকে −৯০° হিসেবে ধরে ধারাবাহিকভাবে যোগ করে চূড়ান্ত অভিমুখ বের করা, অথবা স্থানাঙ্ক জ্যামিতি ব্যবহার করে (পূর্ব-পশ্চিম x-অক্ষ, উত্তর-দক্ষিণ y-অক্ষ ধরে) দূরত্ব/অবস্থান গণনা করা। Teacher\u2019s Work-এর ৬টি প্রশ্নে কোনো ছাপা উত্তর-কী নেই — প্রতিটি এই পদ্ধতিতে স্বাধীনভাবে যাচাই করা হয়েছে। Student\u2019s Work-এর ২৬টি প্রশ্নে উৎসের নিজস্ব সম্পূর্ণ উত্তরমালা টেবিল ব্যবহার করা হয়েছে।'},
    {type:'keyfact', text:'শর্টকাট: পরপর দিক পরিবর্তনের সমস্যায় প্রতিটি বাঁক-কে +৯০°/−৯০° হিসেবে যোগ করে নিট ঘূর্ণন বের করলে জটিল বাক্য না পড়েও দ্রুত উত্তর মেলানো যায়। দূরত্ব-নির্ণয়ের সমস্যায় সরাসরি (x,y) স্থানাঙ্কে প্রতিটি ধাপ বসিয়ে শেষে পিথাগোরাসের উপপাদ্য প্রয়োগ করাই সবচেয়ে নির্ভরযোগ্য।'},
    {type:'para', title:'যান্ত্রিক দক্ষতা (Mechanical Reasoning)', text:'আয়না-প্রতিফলন, ঘড়ির কাঁটার কোণ, স্ক্রু-ড্রাইভার/লন-রোলার জাতীয় ভৌত-যুক্তি প্রশ্ন। Teacher\u2019s Work-এর ৮টি প্রশ্নের মধ্যে ৩টি (আয়নার প্রতিফলিত চিত্র, ভারসাম্য/ওজন চিত্র, গিয়ার-ঘূর্ণন চিত্র) সম্পূর্ণ চিত্র-নির্ভর বলে বাদ দেওয়া হয়েছে; বাকি ৫টি টেক্সট-ভিত্তিক প্রশ্ন যুক্তি/গণনা দিয়ে স্বাধীনভাবে যাচাই করা হয়েছে। Student\u2019s Work-এর ৭টি প্রশ্নের মধ্যে প্রথম ৩টিতে উৎসের ছাপা উত্তর-কী আছে (বাকি ৪টি প্রশ্নে কোনো কী নেই এবং সেগুলোও চিত্র-নির্ভর বলে বাদ দেওয়া হয়েছে)।'},
    {type:'keyfact', text:'আয়না-প্রতিফলনে কোনো শব্দ অপরিবর্তিত থাকতে হলে তার প্রতিটি অক্ষরকে অবশ্যই উলম্ব অক্ষ বরাবর আয়না-প্রতিসম হতে হবে (যেমন O, T, A, H, I, M, U, V, W, X, Y) এবং শব্দটি নিজেও প্যালিনড্রোম হতে হবে — যেমন OTTO।'},
    {type:'warning', text:'⚠️⚠️ এই লেকচারের বিশেষ বিষয়সমূহ: (১) স্থানাঙ্ক সম্পর্ক (Space Relation) অংশের সবকটি প্রশ্ন (৯টি) সম্পূর্ণ চিত্র-ভিত্তিক হওয়ায় বাদ দেওয়া হয়েছে। (২) যান্ত্রিক দক্ষতার Teacher\u2019s Work প্রশ্ন ২, ৪ ও ৮ (আয়না-প্রতিফলন চিত্র, ভারসাম্য চিত্র, গিয়ার চিত্র) এবং Student\u2019s Work প্রশ্ন ৪–৭ (গিয়ার দিক, পানি-প্রবাহ ব্যবস্থা, স্কিড-দিক, পরিমাপ-কাপ চিত্র) — এই ৭টি প্রশ্নও চিত্র-নির্ভর বলে বাদ দেওয়া হয়েছে। (৩) Teacher\u2019s Work Mechanical Reasoning প্রশ্ন ৫ (আয়না-প্রতিফলিত শব্দ) এবং Teacher\u2019s Work Direction Test প্রশ্ন ৫ (দূরত্ব-অনির্দিষ্ট পোস্ট-অফিস সমস্যা) — এই দুটি প্রশ্নে সম্পূর্ণ নিশ্চিত উত্তর দেওয়া সম্ভব হয়নি এবং ⚠️ ট্যাগ দিয়ে চিহ্নিত করা হয়েছে। মোট ৪০টি প্রশ্নের মধ্যে ২টিতে (৫%) ⚠️ ফ্ল্যাগ যুক্ত করা হয়েছে।'}

  lec13: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ১২৭–১৩২ — বিন্যাস, সমাবেশ ও সম্ভাবনা, সাথে পরিসংখ্যানের কয়েকটি মৌলিক প্রশ্ন (পরিসর, শ্রেণি সংখ্যা, গড়, মধ্যক)। Teacher\u2019s Work-এর ২০টি প্রশ্নে কোনো ছাপা উত্তর-কী নেই — প্রতিটি স্বাধীনভাবে গণনা করে যাচাই করা হয়েছে। Student\u2019s Work-এর ৩২টি প্রশ্নের প্রায় সবকটিতে উৎসের নিজস্ব উত্তর-কী আছে।'},
    {type:'table', title:'সিলেবাস (গাণিতিক যুক্তি)', ref:'lec11'},
    {type:'keyfact', text:'মূল সূত্র — বিন্যাস (ক্রমের গুরুত্ব আছে): nPr = n!/(n-r)!; সমাবেশ (ক্রমের গুরুত্ব নেই): nCr = n!/[r!(n-r)!]; পুনরাবৃত্ত বস্তুসহ সাজানো: n!/(p!q!r!...) যেখানে p,q,r... প্রতিটি পুনরাবৃত্ত বস্তুর সংখ্যা।'},
    {type:'para', title:'নির্দিষ্ট সদস্য/বস্তু বাধ্যতামূলক থাকলে', text:'কোনো কমিটি/দল গঠনের সময় যদি ১ বা একাধিক নির্দিষ্ট সদস্য সবসময় অন্তর্ভুক্ত থাকতে হয়, তবে সেই সদস্য(দের) আলাদাভাবে ধরে নিয়ে বাকি জায়গার জন্য বাকি সদস্যদের মধ্য থেকে সমাবেশ (nCr) হিসাব করতে হয়। যেমন ১৪ জন থেকে ১১ জনের দল গঠনে ১ জন নির্দিষ্ট অধিনায়ক থাকলে বাকি ১০ জনকে বাকি ১৩ জন থেকে বেছে নিতে হয়: C(13,10)।'},
    {type:'para', title:'শব্দের অক্ষর বিন্যাস', text:'কোনো শব্দে পুনরাবৃত্ত অক্ষর থাকলে মোট বিন্যাস সংখ্যা = n!/(পুনরাবৃত্ত প্রতিটি অক্ষরের গুণিতক-ফ্যাক্টরিয়াল)। স্বরবর্ণ/ব্যঞ্জনবর্ণ একত্রে রাখার শর্ত থাকলে সেই দলকে একটি একক (ব্লক) ধরে প্রথমে মোট এককগুলো সাজিয়ে, তারপর ব্লকের ভেতরের সদস্যদের নিজেদের মধ্যে সাজানোর সংখ্যা দিয়ে গুণ করতে হয়।'},
    {type:'keyfact', text:'সম্ভাবনার মৌলিক সূত্র: P(ঘটনা) = অনুকূল ফলাফল / সমগ্র সম্ভাব্য ফলাফল। যেকোনো ঘটনার সম্ভাবনা সবসময় ০ ও ১-এর মধ্যে থাকে। P(ঘটনা ঘটা না) = ১ − P(ঘটনা ঘটা)। কমপক্ষে একজন/একটি শর্তের সমস্যায় প্রায়ই সরাসরি গণনার চেয়ে "মোট − অবাঞ্ছিত" পদ্ধতি সহজ হয়।'},
    {type:'para', title:'পরিসংখ্যান (মৌলিক)', text:'পরিসর = সর্বোচ্চ মান − সর্বনিম্ন মান (কখনো কখনো শ্রেণিবদ্ধ উপাত্তে +১ যোগ করে অন্তর্ভুক্তিমূলক পরিসর ধরা হয়)। শ্রেণি সংখ্যা ≈ পরিসর ÷ শ্রেণি-ব্যবধান (ভগ্নাংশ হলে পরবর্তী পূর্ণসংখ্যায় উন্নীত করতে হয়)। গড় = সকল মানের সমষ্টি ÷ মোট মানের সংখ্যা। মধ্যক (জোড় সংখ্যক পদ হলে মাঝের দুই পদের গড়; বিজোড় হলে ঠিক মাঝের পদ, অর্থাৎ (n+1)/2-তম পদ)।'},
    {type:'warning', text:'⚠️ এই লেকচারে দুটি প্রশ্নে সমস্যা চিহ্নিত হয়েছে। Student\u2019s Work প্রশ্ন ১৫-এ উৎসের নিজস্ব সমাধান ধাপে ধাপে গণনা করে গড় = ১৬৪.৫ (বিকল্প ঘ) দেখালেও ছাপা \u2018উত্তর\u2019 চিহ্নটি ভুলবশত \u2018ক\u2019 দেখাচ্ছে — একটি সুস্পষ্ট মুদ্রণ-ত্রুটি (errata), যেখানে গাণিতিকভাবে সঠিক উত্তর (ঘ) ব্যবহার করা হয়েছে। প্রশ্ন ২৭-এ উৎসের ছাপা উত্তর-কী একটি গাণিতিকভাবে অসম্ভব সম্ভাবনা-মান (১-এর বেশি) দেখাচ্ছে, যা সমাধান করা যায়নি — উৎসের নিজস্ব উত্তরই ব্যবহার করা হয়েছে তবে অনিশ্চিত হিসেবে চিহ্নিত। এছাড়া, Student\u2019s Work প্রশ্ন ১৩–১৫-এর মূল উপাত্ত-তালিকাটি প্রশ্নের নিজস্ব স্টেমে ছাপা ছিল না (শুধু সমাধানে দেখা যায়) — নির্ভরযোগ্যভাবে পুনর্গঠন করে প্রতিটি প্রশ্নের স্টেমে বন্ধনীতে যোগ করা হয়েছে (প্রশ্ন ১৩ ও ১৪-ও একই কারণে ⚠️ চিহ্নিত)। প্রশ্ন ২৪-এ উৎসের সমাধানে ঘন সংখ্যার তালিকা ভুলভাবে দেখানো হলেও চূড়ান্ত উত্তর সঠিক আছে বলে সেটিও সতর্কতাসহ চিহ্নিত করা হয়েছে। মোট ৫২টি প্রশ্নের মধ্যে ৫টিতে (৯.৬%) ⚠️ ফ্ল্যাগ যুক্ত করা হয়েছে।'}
  ],
  lec14: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ১৩৩–১৪৬ — জ্যামিতির মৌলিক ধারণা ও ত্রিভুজ, উচ্চতা-দূরত্ব এবং সংক্ষিপ্ত স্থানাঙ্ক জ্যামিতি। Teacher\u2019s Work-এর ৩০টি প্রশ্নে কোনো ছাপা উত্তর-কী নেই — প্রতিটি স্বাধীনভাবে গণনা করে যাচাই করা হয়েছে। Student\u2019s Work-এর ৪৭টি প্রশ্নের প্রায় সবকটিতে উৎসের নিজস্ব উত্তর-কী আছে (১টি প্রশ্ন গাণিতিক অসঙ্গতির কারণে বাদ দেওয়া হয়েছে)।'},
    {type:'table', title:'সিলেবাস (জ্যামিতি)', ref:'lec11'},
    {type:'keyfact', text:'কোণ সংক্রান্ত মৌলিক শব্দ: পূরক কোণ (দুটি কোণের সমষ্টি ৯০°), সম্পূরক কোণ (সমষ্টি ১৮০°), সন্নিহিত কোণ (পাশাপাশি, একটি সাধারণ বাহু ও শীর্ষবিন্দু থাকে), প্রবৃদ্ধ কোণ (১৮০°-৩৬০°)। দুটি সরলরেখা পরস্পর ছেদ করলে বিপ্রতীপ কোণ (vertically opposite angles) সমান হয়।'},
    {type:'para', title:'ত্রিভুজের ক্ষেত্রফল', text:'সাধারণ সূত্র: ক্ষেত্রফল = ½ × ভূমি × উচ্চতা। সমবাহু ত্রিভুজ: (√৩/৪) × (বাহু)²। সমদ্বিবাহু ত্রিভুজে উচ্চতা = √(সমান বাহু² − (ভূমি/২)²)। দুই বাহু ও অন্তর্ভুক্ত কোণ জানা থাকলে: ক্ষেত্রফল = ½ × a × b × sinθ। তিন বাহু জানা থাকলে হেরনের সূত্র: ক্ষেত্রফল = √(s(s−a)(s−b)(s−c)), যেখানে s = (a+b+c)/২ (অর্ধপরিসীমা)।'},
    {type:'keyfact', text:'পিথাগোরাসের উপপাদ্য ও তার বিপরীত: সমকোণী ত্রিভুজে (অতিভুজ)² = (ভূমি)² + (লম্ব)²। বিপরীতভাবে, কোনো ত্রিভুজে এক বাহুর বর্গ যদি অপর দুই বাহুর বর্গের সমষ্টির সমান হয়, তবে ত্রিভুজটি সমকোণী। ত্রিভুজ অসমতা: যেকোনো দুই বাহুর সমষ্টি সর্বদা তৃতীয় বাহু অপেক্ষা বৃহত্তর হতে হবে (নাহলে ত্রিভুজ গঠিত হবে না)।'},
    {type:'para', title:'উচ্চতা ও দূরত্ব (Height & Distance)', text:'উন্নতি কোণ (angle of elevation) ও অবনতি কোণ (angle of depression) সংক্রান্ত সমস্যায় সমকোণী ত্রিভুজ কল্পনা করে ত্রিকোণমিতিক অনুপাত (sin, cos, tan) প্রয়োগ করতে হয়। সাধারণ সূত্র: tanθ = লম্ব/ভূমি, sinθ = লম্ব/অতিভুজ। সদৃশ ত্রিভুজের ধর্ম (ছায়া-উচ্চতা সমানুপাতিক) দিয়েও অনেক সমস্যা সমাধান করা যায়।'},
    {type:'keyfact', text:'মধ্যবিন্দু উপপাদ্য (Midsegment Theorem): ত্রিভুজের যেকোনো দুই বাহুর মধ্যবিন্দুদ্বয়ের সংযোজক রেখাংশ তৃতীয় বাহুর সমান্তরাল ও তার ঠিক অর্ধেক দৈর্ঘ্যের। কোনো ত্রিভুজের মধ্যমা (median) তাকে সর্বদা সমান ক্ষেত্রফলের দুটি ত্রিভুজে বিভক্ত করে।'},
    {type:'warning', text:'⚠️ এই লেকচারে কয়েকটি সমস্যা চিহ্নিত হয়েছে। Student\u2019s Work প্রশ্ন ২২-এ প্রদত্ত মান থেকে সঠিকভাবে গণনা করলে উত্তর হয় ৮ সেমি, যা প্রদত্ত চারটি বিকল্পের কোনোটির সাথেই মেলে না — তাই এই প্রশ্নটি সম্পূর্ণ বাদ দেওয়া হয়েছে। প্রশ্ন ১,৬,৩৫-এ উৎসের বিকল্পগুলোর মধ্যে ছাপা-ডুপ্লিকেট (একই মান দুইবার) পাওয়া গেছে, তবে প্রতিটি ক্ষেত্রে সঠিক উত্তর সুস্পষ্ট ও অসংশয়িত। প্রশ্ন ২৬-এ উৎসের দেখানো সমাধানের চূড়ান্ত সিদ্ধান্ত ও তার লেবেলকৃত বিকল্পের বাক্যের মধ্যে সামান্য অসামঞ্জস্য আছে (উৎসের নিজস্ব উত্তর-কী সরাসরি ব্যবহার করা হয়েছে)। প্রশ্ন ৪৪-এ উৎসে প্রশ্ন নম্বর ভুলবশত \u201888\u2019 ছাপা হয়েছে (প্রকৃতপক্ষে ৪৪)। প্রশ্ন ৪৫-এ কোণের মান (২৫৩০°) আক্ষরিকভাবে উৎসের নিজস্ব উত্তরের (প্রবৃদ্ধ কোণ) সাথে সাংঘর্ষিক বলে মনে হয়, তবু উৎসের নিজস্ব উত্তর-কী ব্যবহার করা হয়েছে। মোট ৭৬টি প্রশ্নের মধ্যে ৫টিতে (৬.৬%) ⚠️ ফ্ল্যাগ যুক্ত করা হয়েছে, এবং ১টি প্রশ্ন সম্পূর্ণ বাদ দেওয়া হয়েছে।'}
  ],
  lec15: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ১৪৭–১৫৭ — চতুর্ভুজ, ঘনক, এবং ত্রিকোণমিতির মাধ্যমে উচ্চতা-দূরত্ব। Teacher\u2019s Work-এর ২৩টি প্রশ্নে কোনো ছাপা উত্তর-কী নেই — প্রতিটি স্বাধীনভাবে গণনা করে যাচাই করা হয়েছে। Student\u2019s Work-এর ৩৭টি প্রশ্নের প্রায় সবকটিতে উৎসের নিজস্ব উত্তর-কী আছে।'},
    {type:'table', title:'সিলেবাস (জ্যামিতি)', ref:'lec11'},
    {type:'keyfact', text:'চতুর্ভুজের ক্ষেত্রফল সূত্র — আয়তক্ষেত্র: দৈর্ঘ্য×প্রস্থ; বর্গক্ষেত্র: (বাহু)² = (কর্ণ)²/২; রম্বস/ঘুড়ি: ½×কর্ণ১×কর্ণ২; সামান্তরিক: ভূমি×উচ্চতা। আয়তক্ষেত্রের কর্ণ = √(দৈর্ঘ্য²+প্রস্থ²)।'},
    {type:'para', title:'পথ/রাস্তার ক্ষেত্রফল', text:'বাগান বা জমির ভেতরে একটি নির্দিষ্ট চওড়া পথ থাকলে: পথের ক্ষেত্রফল = (মূল ক্ষেত্রফল) − (পথ বাদে ভেতরের ক্ষেত্রফল), যেখানে ভেতরের দৈর্ঘ্য/প্রস্থ প্রতিটি পাশ থেকে ২×(পথের প্রস্থ) বিয়োগ করে পাওয়া যায়। পথ যদি বাগানের বাইরে/চারপাশে থাকে, তবে উল্টো পদ্ধতিতে মূল ক্ষেত্রফলের সাথে ২×(পথের প্রস্থ) যোগ করে বর্ধিত দৈর্ঘ্য/প্রস্থ বের করে পথসহ মোট ক্ষেত্রফল থেকে মূল ক্ষেত্রফল বিয়োগ করতে হয়। প্রশ্নের ভাষা ("ভেতরে" বনাম "চারদিকে/সংলগ্ন বাহিরে") মনোযোগ সহকারে পড়ে সঠিক পদ্ধতি বেছে নেওয়া জরুরি।'},
    {type:'keyfact', text:'ঘনক সংক্রান্ত: আয়তন = (বাহু)³। একাধিক ঘনক গলিয়ে নতুন ঘনক গঠন করলে আয়তনের সমষ্টি সংরক্ষিত থাকে — নতুন ঘনকের বাহু = ঘনমূল(পুরনো ঘনকসমূহের আয়তনের সমষ্টি)।'},
    {type:'para', title:'ত্রিকোণমিতি — উচ্চতা ও দূরত্ব', text:'উন্নতি কোণ/অবনতি কোণ সংক্রান্ত সমস্যায় সাধারণত tanθ = লম্ব/ভূমি প্রয়োগ করা হয়। বাঁশ/গাছ ভেঙে যাওয়ার সমস্যায় sinθ = ভাঙা-স্থানের-উচ্চতা/অবশিষ্ট-অংশ (যেহেতু ভাঙা অংশ অতিভুজ হিসেবে কাজ করে) প্রয়োগ করতে হয়।'},
    {type:'warning', text:'⚠️ এই লেকচারে কয়েকটি সমস্যা চিহ্নিত হয়েছে। Student\u2019s Work প্রশ্ন ২১-এ উৎসের একটি বিকল্পে অঙ্ক বাদ পড়ে গেছে (ছাপা হয়েছে \u2018১১\u2019, প্রকৃতপক্ষে \u2018১১৬\u2019 হওয়া উচিত ছিল) — সংশোধিত মান ব্যবহার করা হয়েছে। প্রশ্ন ২৯-এ উৎসের নিজস্ব সমাধান সরাসরি \u2018(বাহু)²\u2019 বলে দেখালেও ছাপা উত্তর-কী ভুলবশত অন্য একটি বিকল্প (\u2018৪×বাহু\u2019, যা পরিসীমার সূত্র) নির্দেশ করছে — উৎসের নিজস্ব দেখানো কাজের সাথে সামঞ্জস্যপূর্ণ সঠিক উত্তর ব্যবহার করা হয়েছে। এছাড়া কয়েকটি প্রশ্নে (১,৬,৩৫ ইত্যাদির অনুরূপ ধরনে) সামান্য ছাপা-ডুপ্লিকেট থাকলেও প্রতিটির সঠিক উত্তর সুস্পষ্ট। মোট ৬০টি প্রশ্নের মধ্যে ২টিতে (৩.৩%) ⚠️ ফ্ল্যাগ যুক্ত করা হয়েছে।'}
  ],
  lec16: [
    {type:'note', text:'📘 উৎস: পৃষ্ঠা ১৫৮–১৬৭ — বইয়ের শেষ লেকচার। বৃত্ত ও বহুভুজ সংক্রান্ত প্রশ্ন। Teacher\u2019s Work-এর ২৬টি প্রশ্নে কোনো ছাপা উত্তর-কী নেই (১টি বাদ দেওয়া হয়েছে, দেখুন সতর্কতা) — বাকিগুলো স্বাধীনভাবে গণনা করে যাচাই করা হয়েছে। Student\u2019s Work-এর ২৮টি প্রশ্নের প্রায় সবকটিতে উৎসের নিজস্ব উত্তর-কী আছে।'},
    {type:'table', title:'সিলেবাস (জ্যামিতি)', ref:'lec11'},
    {type:'keyfact', text:'বৃত্তের মৌলিক অংশ — জ্যা (Chord): পরিধির যেকোনো দুই বিন্দুর সংযোজক রেখাংশ; ব্যাস (Diameter): কেন্দ্রগামী জ্যা, বৃহত্তম জ্যা; ব্যাসার্ধ (Radius): কেন্দ্র থেকে পরিধির দূরত্ব; স্পর্শক (Tangent): বৃত্তকে ঠিক একটি বিন্দুতে স্পর্শকারী রেখা — স্পর্শবিন্দুতে ব্যাসার্ধ সর্বদা স্পর্শকের উপর লম্ব।'},
    {type:'para', title:'ক্ষেত্রফল ও পরিধি', text:'বৃত্তের ক্ষেত্রফল = πr², পরিধি = ২πr = πd। ক্ষেত্রফল ব্যাসার্ধ/ব্যাসের বর্গের সমানুপাতিক — তাই ব্যাস/ব্যাসার্ধ n গুণ বাড়লে ক্ষেত্রফল n² গুণ বাড়ে। কেন্দ্র থেকে কোনো জ্যা পর্যন্ত লম্ব দূরত্ব d হলে, জ্যা-এর অর্ধেক দৈর্ঘ্য = √(r²−d²) (পিথাগোরাসের উপপাদ্য)। দুটি স্পর্শকের ছেদবিন্দু বহিঃস্থ হলে, সেই বিন্দু থেকে বৃত্তে টানা উভয় স্পর্শকের দৈর্ঘ্য সর্বদা সমান।'},
    {type:'keyfact', text:'বৃত্তস্থ কোণ উপপাদ্য: একই চাপের উপর দণ্ডায়মান কেন্দ্রস্থ কোণ সর্বদা পরিধিস্থ কোণের দ্বিগুণ। অর্ধবৃত্তস্থ কোণ সর্বদা সমকোণ (৯০°)। বৃত্তস্থ চতুর্ভুজের বিপরীত কোণগুলোর সমষ্টি সর্বদা ১৮০°। দুইটি বৃত্ত বহিঃস্থভাবে স্পর্শ করলে উভয় কেন্দ্র ও স্পর্শবিন্দু একই সরলরেখায় থাকে (∠=১৮০°)।'},

  {id:'sw19', lec:'lec1', section:'studentWork', sourceNo:'19', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"দুই অঙ্কবিশিষ্ট একটি সংখ্যার মান ৫৪ বেশি হয় যদি অঙ্ক দুটি বিপরীতভাবে লেখা হয়। অঙ্ক দুটির যোগফল ১২ হলে সংখ্যাটি কত?", opts:["৪৮", "৮৪", "৩৯", "৯৩"], ans:2, sol:"৩৯ ধরলে: অঙ্কদ্বয়ের সমষ্টি=১২ ✓। বিপরীতে লিখলে ৯৩; ৯৩-৩৯=৫৪ ✓।", src:true},
  {id:'sw20', lec:'lec1', section:'studentWork', sourceNo:'20', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"দুই অঙ্কের কোন সংখ্যার অঙ্কদ্বয়ের সমষ্টি ৫, সংখ্যাটির সাথে ৯ যোগ করলে অঙ্কদ্বয় স্থান পরিবর্তন করে। সংখ্যাটি কত?", opts:["৩২", "৪১", "২৩", "৫০"], ans:2, sol:"২৩ ধরলে: অঙ্কদ্বয়ের সমষ্টি=৫ ✓। ২৩+৯=৩২, যা ২৩-এর স্থান-বিনিময় রূপ ✓।", src:true},
  {id:'sw21', lec:'lec1', section:'studentWork', sourceNo:'21', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"দুটি ক্রমিক পূর্ণ সংখ্যার বর্গের অন্তর ৯৩ হলে সংখ্যাদ্বয় কত?", opts:["৪৬, ৪৭", "৪৪, ৪৫", "৪৩, ৪৪", "৫০, ৫১"], ans:0, sol:"পরপর দুই সংখ্যা n, n+1 হলে বর্গের অন্তর = 2n+1 = ৯৩ ⟹ n=৪৬। সংখ্যাদ্বয় ৪৬, ৪৭।", src:true},
  {id:'sw22', lec:'lec1', section:'studentWork', sourceNo:'22', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"একটি স্বাভাবিক সংখ্যার বর্গের সাথে সংখ্যাটি যোগ করলে তা পরবর্তী স্বাভাবিক সংখ্যার নয়গুণের সমান হয়। সংখ্যাটি কত?", opts:["১৩", "১১", "৯", "৭"], ans:2, sol:"x²+x = 9(x+1) ⟹ x²-8x-9=0 ⟹ (x-9)(x+1)=0 ⟹ x=৯।", src:true},
  {id:'sw23', lec:'lec1', section:'studentWork', sourceNo:'23', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"দুইটি সংখ্যার বর্গের সমষ্টি ১৩ এবং সংখ্যা দুইটির গুণফল ৬ হলে সংখ্যা দুইটির বর্গের অন্তর কত?", opts:["৬", "৩", "৮", "৫"], ans:3, sol:"(x+y)²=13+12=25⟹x+y=5। (x-y)²=13-12=1⟹x-y=1। x=৩,y=২। x²-y²=(x-y)(x+y)=৫।", src:true},
  {id:'sw24', lec:'lec1', section:'studentWork', sourceNo:'24', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"দুটি সংখ্যার বিয়োগফল ৩৭ এবং যোগফল বিয়োগফলের ১১ গুণ। সংখ্যা দুটি কত?", opts:["২০, ৫৭৮", "১৯, ৫৬", "১৮৫, ২২২", "১৭০, ২০৭"], ans:2, sol:"x-y=৩৭, x+y=১১×৩৭=৪০৭। x=(৪০৭+৩৭)/২=২২২, y=(৪০৭-৩৭)/২=১৮৫।", src:true},
  {id:'sw25', lec:'lec1', section:'studentWork', sourceNo:'25', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"একটি সংখ্যা ৬৫০ থেকে যতো বড়, ৮২০ থেকে ততো ছোট। সংখ্যাটি কত?", opts:["৭৩০", "৭৩৫", "৮০০", "৭৮০"], ans:1, sol:"সংখ্যাটি = (৬৫০+৮২০)/২ = ৭৩৫।", year:"২২তম বিসিএস", src:true},
  {id:'sw26', lec:'lec1', section:'studentWork', sourceNo:'26', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"ছয়টি পরপর (consecutive) সংখ্যা দেয়া আছে। যদি প্রথম তিনটি সংখ্যার যোগফল ১৮৩ হয়, তবে শেষ তিনটি সংখ্যার যোগফল কত?", opts:["১৯০", "১৯২", "১৯৬", "২০২"], ans:1, sol:"সংখ্যাগুলো x,x+1,...,x+5 ধরলে x+(x+1)+(x+2)=183 ⟹ 3x=180 ⟹ x=60। শেষ তিনটির যোগফল = (x+3)+(x+4)+(x+5) = 3x+12 = 192।", src:true},
  {id:'sw27', lec:'lec1', section:'studentWork', sourceNo:'27', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"৭৬৫ থেকে ৬৫৬ যত কম, কোন সংখ্যা ৮২৫ থেকে ততটুকু বেশি?", opts:["৯৩৩", "৯৩২", "৯৩৪", "৯৩৫"], ans:2, sol:"৭৬৫ – ৬৫৬ = ১০৯। ৮২৫ + ১০৯ = ৯৩৪।", src:true},
  {id:'sw28', lec:'lec1', section:'studentWork', sourceNo:'28', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"০.০২৩ এর ১% হচ্ছে-", opts:["০.২৩", "০.০০২৩", "০.০০০২৩", "২.৩"], ans:2, sol:"০.০২৩ এর ১% = ০.০২৩ × (১/১০০) = ০.০০০২৩।", src:true},
  {id:'sw29', lec:'lec1', section:'studentWork', sourceNo:'29', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"১২, কোন সংখ্যার ১৫০%?", opts:["৮", "১৬", "২৪", "১০০"], ans:0, sol:"x এর ১৫০% = ১২ ⟹ x = ১২÷১.৫ = ৮।", src:true},
  {id:'sw30', lec:'lec1', section:'studentWork', sourceNo:'30', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"৮৮ এর ১২.৫% কত?", opts:["১১", "১২", "১৩", "১০"], ans:0, sol:"৮৮ এর ১২.৫% = ৮৮ × (১২৫/১০০০) = ১১।", src:true},
  {id:'sw31', lec:'lec1', section:'studentWork', sourceNo:'31', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"৩/৮ + ০.০৫ = কত?", opts:["১৭/৪০", "১৩/৪০", "২৭/৪০", "[উৎসে অস্পষ্ট]"], ans:0, sol:"৩/৮ + ০.০৫ = ০.৩৭৫ + ০.০৫ = ০.৪২৫ = ১৭/৪০।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের চারটি ভগ্নাংশ অপশন (ক,খ,গ,ঘ) খুব ঘনভাবে পাশাপাশি ছাপা থাকায় নিষ্কাশনের সময় সংখ্যাগুলো মিশে গেছে। শুধুমাত্র সঠিক উত্তরটি (১৭/৪০) নির্ভরযোগ্যভাবে পুনর্গঠন করা গেছে; বাকি তিনটি অপশনের সঠিক মান উৎস থেকে নিশ্চিতভাবে উদ্ধার করা যায়নি।"},
  {id:'sw32', lec:'lec1', section:'studentWork', sourceNo:'32', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"(-৪) এবং (+৩) এর গুণফলকে (-২) দিয়ে ভাগ দিলে কত হবে?", opts:["-৬", "৬", "[উৎসে অস্পষ্ট]", "[উৎসে অস্পষ্ট]"], ans:1, sol:"(-৪)×(+৩) = -১২। -১২ ÷ (-২) = ৬।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে অপশন গ ও ঘ এর সংখ্যা (সম্ভবত ভগ্নাংশ) নিষ্কাশনের সময় পাশের রেখার সাথে মিশে গেছে বলে নির্ভরযোগ্যভাবে উদ্ধার করা যায়নি। সঠিক উত্তর (৬) হিসাব ও উৎসের \"উত্তর ঃ (খ)\" ট্যাগ — উভয়ের সাথেই সামঞ্জস্যপূর্ণ।"},
  {id:'sw33', lec:'lec1', section:'studentWork', sourceNo:'33', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"নিচের কোনটি বৃহত্তম সংখ্যা?", opts:["০.০০০২৫০", "০.০০০২৫৫", "০.০০০৫৫", "০.০০১০"], ans:3, sol:"চারটি সংখ্যার মধ্যে ০.০০১০ সবচেয়ে বড়।", src:true},
  {id:'sw34', lec:'lec1', section:'studentWork', sourceNo:'34', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"১, ২, ও ৩ দ্বারা তিন অঙ্কের যতগুলো সংখ্যা লেখা যায় তাদের সমষ্টি কত?", opts:["১২২৩", "১২৩৩", "১৩২২", "১৩৩২"], ans:3, sol:"১২৩+১৩২+২১৩+২৩১+৩১২+৩২১ = ১৩৩২।", src:true},
  {id:'sw35', lec:'lec1', section:'studentWork', sourceNo:'35', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"-১ থেকে কত বিয়োগ করলে বিয়োগফল শূন্য হবে?", opts:["-১", "১", "-২", "২"], ans:0, sol:"(-১) - (-১) = -১ + ১ = ০। অর্থাৎ (-১) বিয়োগ করতে হবে।", src:true},
  {id:'sw36', lec:'lec1', section:'studentWork', sourceNo:'36', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"কোন দুটি সংখ্যার যোগফল ১০ এবং গুণফল ২৪?", opts:["-৪, -৬", "-৬, -৪", "১২, -২", "৪, ৬"], ans:3, sol:"৪ + ৬ = ১০ এবং ৪ × ৬ = ২৪।", src:true},
  {id:'sw37', lec:'lec1', section:'studentWork', sourceNo:'37', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"শূন্য সংখ্যার আদি ধারণা কাদের?", opts:["গ্রিক", "আরব", "ভারতীয়", "চীন"], ans:2, sol:"শূন্যের ধারণার প্রবর্তক ভারতীয়রা।", src:true},
  {id:'sw38', lec:'lec1', section:'studentWork', sourceNo:'38', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"১ কে ১০০ বার ১ দিয়ে গুণ করে গুণফলকে ১ দিয়ে ভাগ করে, ভাগফল থেকে ১ বিয়োগ করে বিয়োগফলকে ১০০ দ্বারা ভাগ করলে ভাগফল কত হবে?", opts:["১", "[উৎসে অস্পষ্ট]", "[উৎসে অস্পষ্ট]", "০"], ans:3, sol:"১ কে ১০০ বার ১ দিয়ে গুণ করলে থাকে ১। ১÷১=১। ১-১=০। ০÷১০০=০।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে অপশন খ ও গ দুটিতেই \"১০০\" ছাপা হয়েছে বলে মনে হচ্ছে (সম্ভবত একটির আগে ঋণাত্মক চিহ্ন বা ভিন্ন মান ছিল যা নিষ্কাশনের সময় হারিয়ে গেছে), এবং এই প্রশ্নের জন্য কোনো স্পষ্ট \"উত্তর ঃ\" ট্যাগও উৎসে খুঁজে পাওয়া যায়নি। সরাসরি হিসাব অনুযায়ী উত্তর ০ (ঘ) দেখানো হলো।"},
  {id:'sw39', lec:'lec1', section:'studentWork', sourceNo:'39', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"দুটি সংখ্যার অন্তর ১২, বড়টির সঙ্গে ১ যোগ করলে ছোটটির দ্বিগুণ হয়। সংখ্যা দুটি কি কি?", opts:["৩৫, ২৩", "২০, ৮", "৩০, ১৮", "২৫, ১৬"], ans:3, sol:"x-y=১২ এবং x+১=2y ধরে সমাধান করলে y≈১৩ পাওয়া যায় (উৎসের ছাপা অপশন ও ধাপের মধ্যে ছোট গরমিল আছে)।", src:true, needsVerification:true, verifyNote:"এই প্রশ্নের সমাধানে প্রাপ্ত মান (y=১৩) এবং উৎসের ছাপা অপশন \"ঘ. ২৫, ১৬\" এর দ্বিতীয় সংখ্যাটি (১৬) ঠিক মিলছে না — সম্ভবত OCR/মুদ্রণজনিত ছোট সংখ্যা-বিভ্রম (১৩ বনাম ১৬)। উৎসের চূড়ান্ত \"উত্তর ঃ (ঘ)\" ট্যাগ অনুযায়ী ঘ দেখানো হলো।"},
  {id:'sw40', lec:'lec1', section:'studentWork', sourceNo:'40', topic:"গড়", q:"তিনটি পরপর মৌলিক সংখ্যার গড় যদি ১৯.৬৭ হয় তবে সংখ্যা তিনটি কত?", opts:["১৭, ১৯, ২৩", "১৩, ১৭, ১৯", "১৯, ২৩, ২৯", "২৩, ২৯, ৩১"], ans:0, sol:"১৯.৬৭ এর নিকটতম মৌলিক সংখ্যা ১৯। এর আগের ও পরের মৌলিক সংখ্যা যথাক্রমে ১৭ ও ২৩। গড় = (১৭+১৯+২৩)/৩ = ১৯.৬৭।", src:true},
  {id:'sw41', lec:'lec1', section:'studentWork', sourceNo:'41', topic:"গড়", q:"এক ব্যক্তি ঘণ্টায় ৩০ মাইল বেগে দুই ঘণ্টা ভ্রমণ করার পর পরবর্তী ৩ ঘণ্টায় মোট ৬০ মাইল পথ অতিক্রম করে। সম্পূর্ণ পথের জন্য গড় গতিবেগ কত?", opts:["১৮", "২৪", "৩৬", "৪৫"], ans:1, sol:"প্রথম অংশে দূরত্ব = ৩০×২ = ৬০ মাইল। মোট দূরত্ব = ৬০+৬০ = ১২০ মাইল। মোট সময় = ২+৩ = ৫ ঘণ্টা। গড় গতিবেগ = ১২০÷৫ = ২৪ মাইল/ঘণ্টা।", src:true},
  {id:'sw42', lec:'lec1', section:'studentWork', sourceNo:'42', topic:"গড়", q:"২০টি বালকের গড় বয়স ১২ হলে ৭ বছর গড় বয়সের ৫টি বালক যোগ দিলে প্রত্যেকের গড় বয়স কত?", opts:["১১ বছর", "১০ বছর", "৯ বছর", "৮ বছর"], ans:0, sol:"২০ জনের মোট বয়স = ২৪০। নতুন ৫ জনের মোট বয়স = ৩৫। মোট ২৫ জনের গড় = (২৪০+৩৫)÷২৫ = ১১ বছর।", src:true},
  {id:'sw43', lec:'lec1', section:'studentWork', sourceNo:'43', topic:"গড়", q:"১১ জন লোকের গড় ওজন ৭০ কেজি। ৯০ কেজি ওজনের একজন লোক চলে গেলে বাকিদের গড় ওজন কত?", opts:["৬২ কেজি", "৬৮ কেজি", "৮০ কেজি", "৭২ কেজি"], ans:1, sol:"১১ জনের মোট ওজন = ৭৭০ কেজি। একজন (৯০ কেজি) বাদ দিলে বাকি ১০ জনের মোট = ৬৮০ কেজি। গড় = ৬৮০÷১০ = ৬৮ কেজি।", src:true, needsVerification:true, verifyNote:"এটি এক্সট্র্যাকশন-জনিত সমস্যা নয় — পরিষ্কার কলাম-ভিত্তিক পুনঃনিষ্কাশনের পরও উৎস পিডিএফে নিজেই ছাপার ভুল হিসেবে \"উত্তর ঃ (ক)\" দেখাচ্ছে, যেখানে ঠিক তার আগের লাইনেই সমাধানে স্পষ্ট লেখা আছে \"= ৬৮ কেজি\" (যা অপশন \"খ\")। অর্থাৎ এটি মূল বইয়ের নিজস্ব উত্তর-কী ত্রুটি বলে মনে হচ্ছে। হিসাব অনুযায়ী সঠিক উত্তর \"খ\" দেখানো হলো।"},
  {id:'sw44', lec:'lec1', section:'studentWork', sourceNo:'44', topic:"গড়", q:"তিন ভাই-বোনের বয়সের গড় ১৬ বছর। পিতাসহ ভাই-বোনের বয়সের গড় ২৫ বছর। পিতার বয়স কত?", opts:["৪৮ বছর", "৫০ বছর", "৫২ বছর", "৬০ বছর"], ans:2, sol:"ভাই-বোনের বয়সের সমষ্টি = ১৬×৩ = ৪৮। পিতাসহ সমষ্টি = ২৫×৪ = ১০০। পিতার বয়স = ১০০-৪৮ = ৫২ বছর।", src:true},
  {id:'sw45', lec:'lec1', section:'studentWork', sourceNo:'45', topic:"গড়", q:"১ হতে ৭৯ পর্যন্ত ক্রমিক সংখ্যাগুলোর গড় কত?", opts:["৪৫", "৩০", "৪০", "৫১"], ans:2, sol:"১ থেকে n পর্যন্ত সংখ্যার গড় = (n+1)/2 = (৭৯+১)/২ = ৪০।", src:true},
  {id:'sw46', lec:'lec1', section:'studentWork', sourceNo:'46', topic:"গড়", q:"পরপর সাজানো পাঁচটি সংখ্যার গাণিতিক গড় ১২ হলে, ক্ষুদ্রতম ও বৃহত্তম সংখ্যার যোগফল কত?", opts:["২৬", "২৪", "২২", "১৮"], ans:1, sol:"গড় ১২ হলে মধ্যেরটি (৩য়) = ১২। সংখ্যাগুলো ১০,১১,১২,১৩,১৪। ক্ষুদ্রতম+বৃহত্তম = ১০+১৪ = ২৪।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের বাক্যাংশটি (\"ক্ষুদ্রতম সংখ্যার যোগফল কোনটি\") অসম্পূর্ণ/ছাপার ত্রুটিযুক্ত মনে হয়েছে — সম্ভবত মূল প্রশ্ন ছিল \"ক্ষুদ্রতম ও বৃহত্তম সংখ্যার যোগফল কত\"। এই অনুমান সমাধানের ধাপ ও বিকল্পগুলোর সাথে সামঞ্জস্যপূর্ণ, তবে প্রশ্নের হুবহু বাক্য উৎসে স্পষ্ট নয়।"},
  {id:'sw47', lec:'lec1', section:'studentWork', sourceNo:'47', topic:"গড়", q:"M সংখ্যক রাশির গড় A এবং N সংখ্যক রাশির গড় B হলে, সবগুলো রাশির গড় কত?", opts:["(A+B)/2", "(AM+BN)/2", "(AM+BN)/(M+N)", "[উৎসে অস্পষ্ট]"], ans:2, sol:"M সংখ্যক রাশির সমষ্টি = AM। N সংখ্যক রাশির সমষ্টি = BN। মোট (M+N) সংখ্যক রাশির গড় = (AM+BN)/(M+N)।", year:"২২তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে চারটি অপশনই ঘনবদ্ধ ভগ্নাংশ আকারে (বীজগাণিতিক রাশি) ছাপা থাকায় নিষ্কাশনের সময় হুবহু আলাদা করা যায়নি। সমাধানের ধাপ থেকে সঠিক সূত্র — (AM+BN)/(M+N) — নিশ্চিতভাবে জানা যায় এবং এটি একটি প্রমিত, সুপরিচিত সূত্র।"},
  {id:'sw48', lec:'lec1', section:'studentWork', sourceNo:'48', topic:"গড়", q:"ঢাকা থেকে কুমিল্লা x km দূরত্বে একটি গাড়ির গতিবেগ p km/h। কুমিল্লা থেকে চট্টগ্রামের y km দূরত্বে গাড়িটির গতিবেগ q km/h। ঢাকা থেকে চট্টগ্রাম পর্যন্ত ঘণ্টায় গড় গতিবেগ কত?", opts:["pq(x+y)/(qx+py)", "(x+y)/(p+q)", "(px+qy)/(x+y)", "[উৎসে অস্পষ্ট]"], ans:0, sol:"ঢাকা-কুমিল্লা সময় = x/p। কুমিল্লা-চট্টগ্রাম সময় = y/q। মোট দূরত্ব = x+y। মোট সময় = x/p + y/q = (qx+py)/pq। গড় গতিবেগ = (x+y) ÷ [(qx+py)/pq] = pq(x+y)/(qx+py)।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে চারটি অপশনই জটিল বীজগাণিতিক ভগ্নাংশ আকারে ছাপা থাকায় নিষ্কাশনের সময় হুবহু আলাদা করা যায়নি। সমাধানের ধাপ থেকে সঠিক সূত্র নিশ্চিতভাবে জানা যায়।"},
  {id:'sw49', lec:'lec1', section:'studentWork', sourceNo:'49', topic:"গড়", q:"x ও y এর মানের গড় ৯ এবং z = ১২ হলে, x, y এবং z এর মানের গড় কত হবে?", opts:["৬", "৯", "১০", "১২"], ans:2, sol:"x+y = ৯×২ = ১৮। x+y+z = ১৮+১২ = ৩০। গড় = ৩০÷৩ = ১০।", year:"২০তম বিসিএস", src:true},
  {id:'sw50', lec:'lec1', section:'studentWork', sourceNo:'50', topic:"গড়", q:"তিন ভাই-বোনের বয়সের গড় ১৬ বছর। পিতাসহ ভাই-বোনের বয়সের গড় ২৫ বছর। পিতার বয়স কত?", opts:["৪৮ বছর", "৫০ বছর", "৫২ বছর", "৬০ বছর"], ans:2, sol:"ভাই-বোনের বয়সের সমষ্টি = ১৬×৩ = ৪৮। পিতাসহ সমষ্টি = ২৫×৪ = ১০০। পিতার বয়স = ১০০-৪৮ = ৫২ বছর। (উৎস পিডিএফে এই প্রশ্নটি প্রশ্ন ৪৪-এর অনুরূপ, হুবহু একই বাক্যে দ্বিতীয়বার ছাপা হয়েছে — সততার সাথে দুটোই এখানে রাখা হলো।)", src:true},
  {id:'sw51', lec:'lec1', section:'studentWork', sourceNo:'51', topic:"গড়", q:"পিতা ও চার পুত্রের বয়সের গড়, মাতা ও চার পুত্রের বয়সের গড় অপেক্ষা ২ বছর বেশি। পিতার বয়স ৬০ বছর হলে মাতার বয়স কত?", opts:["৪৮ বছর", "৫২ বছর", "৫০ বছর", "৫৬ বছর"], ans:2, sol:"ধরি চার পুত্রের বয়সের সমষ্টি = S। (৬০+S)/৫ = (মাতা+S)/৫ + ২ ⟹ মাতা = ৬০-১০ = ৫০ বছর।", src:true, needsVerification:true, verifyNote:"এটিও এক্সট্র্যাকশন-জনিত সমস্যা নয় — পরিষ্কার কলাম-ভিত্তিক পুনঃনিষ্কাশনের পরও উৎস পিডিএফ নিজেই সমাধানের শেষ লাইনে স্পষ্ট \"মাতার বয়স = ৫০ বছর\" লিখেও তার ঠিক পরে \"উত্তর ঃ (খ)\" ছাপিয়েছে, যেখানে ৫০ আসলে অপশন \"গ\"। এটি মূল বইয়ের নিজস্ব উত্তর-কী ত্রুটি বলে মনে হচ্ছে। হিসাব অনুযায়ী সঠিক উত্তর \"গ\" দেখানো হলো।"},
  {id:'sw52', lec:'lec1', section:'studentWork', sourceNo:'52', topic:"গড়", q:"পিতা ও দুই সন্তানের বয়সের গড় ১৭ বছর। দুই সন্তানের বয়সের গড় ২ বছর হলে পিতার বয়স কত?", opts:["৪৭ বছর", "৪১ বছর", "৩৮ বছর", "৩৫ বছর"], ans:0, sol:"তিনজনের সমষ্টি = ১৭×৩ = ৫১। দুই সন্তানের সমষ্টি = ২×২ = ৪। পিতার বয়স = ৫১-৪ = ৪৭ বছর।", src:true},
  {id:'sw53', lec:'lec1', section:'studentWork', sourceNo:'53', topic:"গড়", q:"তিন ভাইয়ের দুইজন করে নেয়া গড় বয়স ২২ বছর, ১৮ বছর ও ১৬ বছর। সবচেয়ে ছোট ভাইয়ের বয়স কত?", opts:["১৪ বছর", "১২ বছর", "১৩ বছর", "১৫ বছর"], ans:1, sol:"A+B=44, B+C=36, C+A=32 (প্রতিটি জোড়ের গড়কে ২ দিয়ে গুণ করে)। যোগ করে 2(A+B+C)=112 ⟹ A+B+C=56। C=56-44=12, A=56-36=20, B=56-32=24। সবচেয়ে ছোট = C = ১২ বছর।", src:true},
  {id:'sw54', lec:'lec1', section:'studentWork', sourceNo:'54', topic:"গড়", q:"১০টি সংখ্যার যোগফল ৪৬২। এদের প্রথম ৪টির গড় ৫২ এবং শেষের ৫টির গড় ৩৮। পঞ্চম সংখ্যাটি কত?", opts:["৬০", "৬৪", "৬২", "৫০"], ans:1, sol:"প্রথম ৪টির সমষ্টি=২০৮, শেষ ৫টির সমষ্টি=১৯০। এই ৯টির সমষ্টি=৩৯৮। পঞ্চম সংখ্যা = ৪৬২-৩৯৮ = ৬৪।", year:"১১তম বিসিএস", src:true},

  {id:'sw57', lec:'lec1', section:'studentWork', sourceNo:'57', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"পাঁচ অঙ্কের ক্ষুদ্রতম সংখ্যা ও চার অঙ্কের বৃহত্তম সংখ্যার অন্তর কত?", opts:["৯", "১০", "১", "-১"], ans:2, sol:"পাঁচ অঙ্কের ক্ষুদ্রতম = ১০০০০। চার অঙ্কের বৃহত্তম = ৯৯৯৯। অন্তর = ১০০০০-৯৯৯৯ = ১।", year:"২৯তম বিসিএস", src:true},

  {id:'cd4', lec:'lec1', section:'contentDiscussion', sourceNo:'4', topic:"মৌলিক সংখ্যা", q:"৪৩ থেকে ৬০ পর্যন্ত মৌলিক সংখ্যার সংখ্যা-", opts:["৫টি", "৩টি", "৭টি", "৪টি"], ans:3, sol:"৪৭, ৫৩, ৫৯ — মোট ৩টি নয়, প্রশ্নে \"৪৩ থেকে ৬০\" ধরলে ৪৩,৪৭,৫৩,৫৯ = ৪টি।", year:"২৬তম বিসিএস", generated:true},

  {id:'cd7', lec:'lec1', section:'contentDiscussion', sourceNo:'7', topic:"মূলদ ও অমূলদ সংখ্যা", q:"যদি p একটি মৌলিক সংখ্যা হয় তবে √p —", opts:["একটি স্বাভাবিক সংখ্যা", "একটি পূর্ণ সংখ্যা", "একটি মূলদ সংখ্যা", "একটি অমূলদ সংখ্যা"], ans:3, sol:"যেকোনো মৌলিক সংখ্যার বর্গমূল সর্বদা অমূলদ সংখ্যা।", year:"২৬তম বিসিএস", generated:true},
  {id:'cd9', lec:'lec1', section:'contentDiscussion', sourceNo:'9', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"দুই অংক বিশিষ্ট একটি সংখ্যা, অংকদ্বয়ের স্থান বিনিময়ের ফলে ৫৪ বৃদ্ধি পায়। অংক দুইটির যোগফল ১২ হলে সংখ্যাটি কত?", opts:["৫৭", "৭৫", "৩৯", "৯৩"], ans:2, sol:"দশক=a, একক=b ধরে a+b=১২ এবং স্থান-বিনিময়ে সংখ্যা ৫৪ বেশি হয় ⟹ b-a=৬। সমাধানে a=৩,b=৯ ⟹ সংখ্যাটি ৩৯।", year:"৩৭তম বিসিএস", generated:true},
  {id:'cd10', lec:'lec1', section:'contentDiscussion', sourceNo:'10', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"পরপর তিনটি সংখ্যার গুণফল ১২০ হলে তাদের যোগফল হবে-", opts:["৯", "১২", "১৪", "১৫"], ans:3, sol:"৪×৫×৬=১২০। যোগফল = ৪+৫+৬ = ১৫।", year:"৩২তম বিসিএস", generated:true},
  {id:'cd11', lec:'lec1', section:'contentDiscussion', sourceNo:'11', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"পরপর দশটি সংখ্যার প্রথম ৫টির যোগফল ৫৬০ হলে শেষ ৫টির যোগফল কত?", opts:["৫৮৫", "৫৮০", "৫৭৫", "৫৭০"], ans:0, sol:"ধারাবাহিক ১০টি সংখ্যা n থেকে শুরু হলে প্রথম ৫টির যোগফল = 5n+10 = ৫৬০ ⟹ n=১১০। শেষ ৫টির যোগফল = 5n+35 = ৫৮৫।", year:"১৮তম বিসিএস", generated:true},

  {id:'cd14', lec:'lec1', section:'contentDiscussion', sourceNo:'14', topic:"সংখ্যা বিষয়ক প্রশ্নাবলী", q:"তিনটি ক্রমিক পূর্ণসংখ্যা নির্ণয় কর, যাদের প্রথম দুইটির গুণফল শেষ দুইটির গুণফল অপেক্ষা ১০ কম।", opts:["৪, ৫, ৬", "৪, ৬, ৮", "৪, ৩, ২", "১, ৪, ৬"], ans:0, sol:"n,n+1,n+2 ধরে n(n+1) = (n+1)(n+2)-১০ ⟹ n=৪। সংখ্যাগুলো ৪,৫,৬।", generated:true},

  {id:'l2sw25', lec:'lec2', section:'studentWork', sourceNo:'25', topic:"ভগ্নাংশ", q:"নিম্নের কোন সংখ্যাটি সবচেয়ে বড়?", opts:["১/২", "০.২", "(০.২)²", "(০.২)³"], ans:0, sol:"১/২=০.৫, ০.২, ০.০৪, ০.০০৮ — এদের মধ্যে ১/২ সবচেয়ে বড়।", src:true},
  {id:'l2sw26', lec:'lec2', section:'studentWork', sourceNo:'26', topic:"ভগ্নাংশ", q:"নিম্নে উল্লিখিত ভগ্নাংশগুলোর মধ্যে কোনটির মান সবচেয়ে বেশি?", opts:["১/২০", "১/১৬", "১/১৫", "১/১২"], ans:3, sol:"১/২০=০.০৫, ১/১৬=০.০৬২৫, ১/১৫≈০.০৬৬৭, ১/১২≈০.০৮৩৩ — সবচেয়ে ছোট হর হওয়ায় ১/১২-এর মান সবচেয়ে বেশি।", src:true},
  {id:'l2sw27', lec:'lec2', section:'studentWork', sourceNo:'27', topic:"ভগ্নাংশ", q:"কোন সংখ্যার ৩/৭ অংশ ৪৮-এর সমান?", opts:["১২৮", "১৩২", "১১২", "১৪০"], ans:2, sol:"x × ৩/৭ = ৪৮ ⟹ x = ৪৮×৭/৩ = ১১২।", src:true},
  {id:'l2sw28', lec:'lec2', section:'studentWork', sourceNo:'28', topic:"ভগ্নাংশ", q:"কোনো ভগ্নাংশকে লঘিষ্ঠ আকারে প্রকাশ করতে হলে এর লব ও হরের গরিষ্ঠ সাধারণ গুণনীয়ক (গ.সা.গু) দিয়ে-", opts:["লব ও হরকে গুণ করতে হবে", "লব ও হরকে ভাগ করতে হবে", "হরকে ভাগ করতে হবে", "লবকে গুণ করতে হবে"], ans:1, sol:"লঘিষ্ঠ আকারে আনতে লব ও হর উভয়কেই তাদের গ.সা.গু দিয়ে ভাগ করতে হয়।", src:true},
  {id:'l2sw29', lec:'lec2', section:'studentWork', sourceNo:'29', topic:"ভগ্নাংশ", q:"দুইটি ভগ্নাংশের গুণফল ১৫/২৮। এদের একটি ৫/৭ হলে অপর ভগ্নাংশটি কত?", opts:["২/৩", "১/৩", "৩/৪", "১/৪"], ans:2, sol:"অপর ভগ্নাংশ = (১৫/২৮) ÷ (৫/৭) = ১৫/২৮ × ৭/৫ = ৩/৪।", src:true},
  {id:'l2sw30', lec:'lec2', section:'studentWork', sourceNo:'30', topic:"ভগ্নাংশ", q:"২০/১৭ এর মধ্যে ১/২ কত বার আছে?", opts:["২ বার", "৩ বার", "৪ বার", "৫ বার"], ans:1, sol:"(২০/১৭) ÷ (১/২) = ৪০/১৭ ≈ ২.৩৫ — অর্থাৎ সম্পূর্ণভাবে ২ বার থাকে, তবে উৎসের সমাধানে চূড়ান্ত ধাপ পুরোপুরি উদ্ধার করা যায়নি।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের সমাধানের চূড়ান্ত ধাপ ও উত্তর-ট্যাগ পার্শ্ববর্তী প্রশ্নের সাথে মিশে যাওয়ায় নিশ্চিতভাবে নিষ্কাশন করা যায়নি। প্রশ্নের সরাসরি গাণিতিক মান (৪০/১৭ ≈ ২.৩৫) থেকে সবচেয়ে যুক্তিসঙ্গত অপশন হিসেবে \"২ বার\" দেখানো হলো, তবে এটি উৎসের নিশ্চিত উত্তর-কী নয়।"},
  {id:'l2sw31', lec:'lec2', section:'studentWork', sourceNo:'31', topic:"ভগ্নাংশ", q:"একটি ভগ্নাংশের লব ও হর উভয় থেকে এক বিয়োগ করলে ভগ্নাংশটি ২/৩ হয়। কিন্তু লব ও হর উভয়ের সঙ্গে এক যোগ করলে ভগ্নাংশটি ৩/৪ হয়। ভগ্নাংশটি কত?", opts:["৫/৭", "৭/৯", "৯/১১", "১১/১৩"], ans:0, sol:"লব=x, হর=y ধরে (x-1)/(y-1)=২/৩ এবং (x+1)/(y+1)=৩/৪ থেকে সমাধান করলে x=৫, y=৭ পাওয়া যায়। ভগ্নাংশটি ৫/৭।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের চারটি অপশনের সঠিক মান নিষ্কাশনে অস্পষ্ট ছিল (পার্শ্ববর্তী কলামের সংখ্যার সাথে মিশে গেছে)। সমাধানের ধাপ থেকে সঠিক উত্তর (৫/৭) স্পষ্টভাবে জানা যায়, বাকি তিনটি অপশন অনুমানভিত্তিক।"},
  {id:'l2sw32', lec:'lec2', section:'studentWork', sourceNo:'32', topic:"ভগ্নাংশ", q:"একটি ভগ্নাংশের লব ও হরের সমষ্টি ১১। লব থেকে ২ বিয়োগ এবং হরের সাথে ৩ যোগ করলে ভগ্নাংশের মান হয় ১/২। ভগ্নাংশটি নির্ণয় কর।", opts:["৬/৫", "৪/৭", "৩/৮", "৫/৬"], ans:0, sol:"লব+হর=১১। লব=x হলে হর=১১-x। (x-2)/(১১-x+3)=1/2 ⟹ (x-2)/(14-x)=1/2 ⟹ 2x-4=14-x ⟹ 3x=18 ⟹ x=6। লব=৬, হর=৫। ভগ্নাংশ = ৬/৫।", src:true},
  {id:'l2sw33', lec:'lec2', section:'studentWork', sourceNo:'33', topic:"ভগ্নাংশ", q:"একটি খুঁটির অর্ধাংশ মাটির নিচে, এক তৃতীয়াংশ পানির মধ্যে ও ১২ ফুট পানির ওপরে আছে। খুঁটির দৈর্ঘ্য কত?", opts:["৭২ ফুট", "৮০ ফুট", "৬০ ফুট", "৫৪ ফুট"], ans:0, sol:"দৈর্ঘ্য=x ধরে x/2+x/3+12=x ⟹ x(1-5/6)=12 ⟹ x/6=12 ⟹ x=৭২ ফুট।", src:true},
  {id:'l2sw34', lec:'lec2', section:'studentWork', sourceNo:'34', topic:"ভগ্নাংশ", q:"এক গোয়ালা তার কিছু সংখ্যক গাভীকে চার পুত্রের মধ্যে বন্টন করে দিল — প্রথম পুত্রকে ১/২ অংশ, দ্বিতীয় পুত্রকে ১/৪ অংশ, তৃতীয় পুত্রকে ১/৫ অংশ এবং বাকি ৭টি গাভী চতুর্থ পুত্রকে দিল। গাভীর সংখ্যা কত ছিল?", opts:["১০০ টি", "১৪০ টি", "১৮০ টি", "২০০ টি"], ans:1, sol:"মোট=x ধরে x - (x/2+x/4+x/5) = 7 ⟹ x/20 = 7 ⟹ x = ১৪০টি।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে ২য় ও ৩য় পুত্রের ভগ্নাংশের সংখ্যা (এখানে ১/৪ ও ১/৫ ধরা হয়েছে) নিষ্কাশনে সম্পূর্ণ স্পষ্ট ছিল না — তবে চূড়ান্ত হিসাব ও উত্তর (১৪০) উৎসের সাথে সামঞ্জস্যপূর্ণ।"},
  {id:'l2sw35', lec:'lec2', section:'studentWork', sourceNo:'35', topic:"ভগ্নাংশ", q:"কোনো একটি স্কুলের শিক্ষক-শিক্ষয়িত্রীদের ২/৩ অংশ মহিলা। পুরুষ শিক্ষকদের ১২ জন অবিবাহিত এবং ৩/৫ অংশ বিবাহিত। ঐ স্কুলে শিক্ষক-শিক্ষয়িত্রীর সংখ্যা কত?", opts:["৩০", "৬০", "৭২", "৯০"], ans:3, sol:"মোট=x। পুরুষ=x/3। পুরুষদের ২/৫ অংশ অবিবাহিত = ১২ ⟹ (2/5)(x/3)=12 ⟹ x=৯০।", src:true},
  {id:'l2sw36', lec:'lec2', section:'studentWork', sourceNo:'36', topic:"ভগ্নাংশ", q:"একটি বাঁশের ১/৩ অংশ লাল, ১/৪ অংশ কালো এবং অবশিষ্ট অংশ সাদা। সাদা অংশটি কত?", opts:["১/৩ অংশ", "১/৫ অংশ", "৫/১২ অংশ", "৩/৪ অংশ"], ans:2, sol:"অবশিষ্ট = ১ - (১/৩+১/৪) = ১ - ৭/১২ = ৫/১২।", src:true},
  {id:'l2sw37', lec:'lec2', section:'studentWork', sourceNo:'37', topic:"ভগ্নাংশ", q:"একটি বাঁশের ১/৫ অংশ লাল, ১/৪ অংশ সবুজ ও ১/৪ অংশ কালো কাগজে আবৃত ও অবশিষ্ট অংশ ৬ মিটার হলে মোট বাঁশটির দৈর্ঘ্য কত?", opts:["৬০.২৩ মিটার", "১২০ মিটার", "২৭.৬৯ মিটার", "৩৬০ মিটার"], ans:2, sol:"মোট=x ধরে x - (x/5+x/4+x/4) = 6 থেকে সমাধান করলে x = ৩৬০/১৩ ≈ ২৭.৬৯ মিটার।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের তিনটি ভগ্নাংশের সঠিক মান পুরোপুরি স্পষ্ট ছিল না, তবে সমাধানের শেষ ধাপ (x=৩৬০/১৩≈২৭.৬৯) স্পষ্টভাবে নিষ্কাশন করা গেছে এবং তা অপশন \"গ\"-এর সাথে মেলে।"},
  {id:'l2sw38', lec:'lec2', section:'studentWork', sourceNo:'38', topic:"ভগ্নাংশ", q:"একটি পাত্র অর্ধেক ভর্তি আছে। যদি ৮ গ্যালন সরানো হয় তবে ৩/১০ অংশ ভর্তি থাকে। পাত্রে কত গ্যালন পানি ছিল?", opts:["১২", "১৬", "২০", "২৪"], ans:2, sol:"মোট ধারণক্ষমতা=x ধরে x/2 - 8 = 3x/10 ⟹ x=৪০। পাত্রে ছিল = x/2 = ২০ গ্যালন।", src:true},
  {id:'l2sw39', lec:'lec2', section:'studentWork', sourceNo:'39', topic:"ভগ্নাংশ", q:"৪ টাকার ৫/৮ অংশ এবং ২ টাকার ৪/৫ অংশের মধ্যে পার্থক্য কত?", opts:["০.০৯ টাকা", "১.৬০ টাকা", "২.২৫ টাকা", "০.৯০ টাকা"], ans:3, sol:"(৪×৫/৮) - (২×৪/৫) = ২.৫ - ১.৬ = ০.৯০ টাকা।", src:true},
  {id:'l2sw40', lec:'lec2', section:'studentWork', sourceNo:'40', topic:"ভগ্নাংশ", q:"একটি খুঁটির ১/৩ অংশ কাদার ভেতরে এবং ১/২ অংশ পানিতে আছে। বাকি অংশ পানির উপর ৫ ফুট হলে, খুঁটির দৈর্ঘ্য কত?", opts:["২০ ফুট", "২৪ ফুট", "২৫ ফুট", "৩০ ফুট"], ans:3, sol:"দৈর্ঘ্য=x ধরে x - (x/3+x/2) = 5 ⟹ x/6=5 ⟹ x=৩০ ফুট।", src:true},
  {id:'l2sw41', lec:'lec2', section:'studentWork', sourceNo:'41', topic:"ভগ্নাংশ", q:"একটি বাঁশের ২/৫ অংশ লাল, ১/৪ অংশ কালো ও ১/৩ অংশ সবুজ কাগজে আবৃত ও অবশিষ্ট অংশ ২ মিটার হলে, মোট বাঁশটির দৈর্ঘ্য কত?", opts:["১০০ মিটার", "১১০ মিটার", "১২০ মিটার", "১২৫ মিটার"], ans:2, sol:"দৈর্ঘ্য=x ধরে x - (2x/5+x/4+x/3) = 2 ⟹ x/60=2 ⟹ x=১২০ মিটার।", src:true},
  {id:'l2sw42', lec:'lec2', section:'studentWork', sourceNo:'42', topic:"ভগ্নাংশ", q:"এক ফল বিক্রেতার মোট ফলের ১/৬ অংশ লিচু, ১/৮ অংশ আম, ১/৪ অংশ কলা এবং ৬৬টি কমলা ছিল। বিক্রেতার মোট কতগুলো ফল ছিল?", opts:["৩৬০", "১৬৮", "১৪৪", "১২০"], ans:2, sol:"মোট=x ধরে x - (x/6+x/8+x/4) = 66 ⟹ 11x/24=66 ⟹ x=১৪৪টি।", src:true},

  {id:'l3sw1', lec:'lec3', section:'studentWork', sourceNo:'1', topic:"পাস ও ফেল", q:"কোনো কম্পিউটার বিজ্ঞান পরীক্ষায় ৩০% পরীক্ষার্থী পাস করেছে। যারা পাস করতে পারেনি তাদের ১২ জন কম্পিউটার বিজ্ঞান কোর্সে অংশগ্রহণ করেছে এবং ৩০ জন উক্ত কোর্সে অংশগ্রহণ করেনি। কত জন পরীক্ষার্থী পরীক্ষায় অংশগ্রহণ করেছে?", opts:["৬০ জন", "৮০ জন", "১০০ জন", "১২০ জন"], ans:0, sol:"পাস করতে পারেনি = ১২+৩০ = ৪২ জন, যা মোটের ৭০%। মোট = ৪২÷০.৭ = ৬০ জন।", year:"১৮তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে সমাধানের হিসাব স্পষ্টভাবে ৬০ (অপশন \"ক\") দেখালেও তার পাশে ছাপা \"উত্তর ঃ\" ট্যাগটি \"ঘ\" দেখাচ্ছিল, যা হিসাবের সাথে মেলে না। হিসাব অনুযায়ী সঠিক উত্তর \"ক\" দেখানো হলো।"},
  {id:'l3sw2', lec:'lec3', section:'studentWork', sourceNo:'2', topic:"শতকরা লাভ-ক্ষতি", q:"একজন দোকানদার ৭.৫% ক্ষতিতে একটি দ্রব্য বিক্রয় করল। যদি দ্রব্যটির ক্রয়মূল্য ১০% কম হতো এবং বিক্রয়মূল্য ৩১ টাকা বেশি হতো, তাহলে তার ২০% লাভ হতো। দ্রব্যটির ক্রয়মূল্য কত?", opts:["১০০ টাকা", "২০০ টাকা", "৩০০ টাকা", "৪০০ টাকা"], ans:1, sol:"মূল ক্রয়মূল্য=x। বিক্রয়মূল্য=০.৯২৫x। নতুন ক্রয়মূল্য=০.৯x, নতুন বিক্রয়মূল্য=০.৯২৫x+৩১=১.২×০.৯x=১.০৮x ⟹ ৩১=০.১৫৫x ⟹ x=২০০।", year:"১৬তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে সমাধানের হিসাব স্পষ্টভাবে ২০০ (অপশন \"খ\") দেখালেও পাশে ছাপা \"উত্তর ঃ\" ট্যাগটি \"ঘ\" দেখাচ্ছিল। হিসাব অনুযায়ী সঠিক উত্তর \"খ\" দেখানো হলো।"},
  {id:'l3sw3', lec:'lec3', section:'studentWork', sourceNo:'3', topic:"শতকরা লাভ-ক্ষতি", q:"টাকায় ১০টা দরে কোনো দ্রব্য ক্রয় করে টাকায় ৮টা দরে বিক্রয় করলে, শতকরা কত লাভ হবে?", opts:["৮", "১০", "২০", "২৫"], ans:3, sol:"লাভ = (১০-৮)/৮ × ১০০% = ২৫%।", src:true},

  {id:'l3sw5', lec:'lec3', section:'studentWork', sourceNo:'5', topic:"শতকরা লাভ-ক্ষতি", q:"বার্ষিক পরীক্ষায় একটি ছাত্র ক সংখ্যক প্রশ্নের প্রথম ২০টির মধ্যে ১৫টি নির্ভুল উত্তর দিল। বাকি প্রশ্নের ১/৩ অংশ সে নির্ভুল উত্তর দিল। সমস্ত প্রশ্নের মান সমান হলে, যদি ছাত্রটি শতকরা ৭৫ ভাগ নম্বর পায় তবে প্রশ্নের সংখ্যা কত ছিল?", opts:["১৫টি", "২০টি", "২৫টি", "১৮টি"], ans:1, sol:"নির্ভুল উত্তর = ১৫+(ক-২০)/৩। মোট প্রশ্ন ক-এর ৭৫% এই রাশির সমান ধরে সমাধান করলে ক=২০।", src:true},

  {id:'l3sw11', lec:'lec3', section:'studentWork', sourceNo:'11', topic:"শতকরা লাভ-ক্ষতি", q:"একজন গ্রামের ২৫,০০০ জনসংখ্যার মধ্যে ১,৫০০ জন শিক্ষিত। ঐ গ্রামে শিক্ষিতের শতকরা হার কত?", opts:["৪%", "৫%", "৬%", "৭%"], ans:2, sol:"শিক্ষিতের হার = (১৫০০/২৫০০০) × ১০০% = ৬%।", src:true},

  {id:'l3sw39', lec:'lec3', section:'studentWork', sourceNo:'39', topic:"শতকরা লাভ-ক্ষতি", q:"একটি ছাগল ৯৬০ টাকায় বিক্রয় করায় ৪০ টাকা ক্ষতি হলো। শতকরা ক্ষতির হার কত?", opts:["৪%", "৩%", "৫%", "২%"], ans:0, sol:"ক্রয়মূল্য = ৯৬০+৪০ = ১০০০। শতকরা ক্ষতি = ৪০/১০০০ × ১০০% = ৪%।", src:true},
  {id:'l3sw40', lec:'lec3', section:'studentWork', sourceNo:'40', topic:"পাস ও ফেল", q:"কোনো বিদ্যালয়ে গণিতে ৭৫% এবং ইংরেজিতে ৪৫% পরীক্ষার্থী কৃতকার্য হয়েছে। যদি উভয় বিষয়ে ৩০% পরীক্ষার্থী কৃতকার্য হয়ে থাকে, তবে উভয় বিষয়ে শতকরা কত জন অকৃতকার্য হয়েছে?", opts:["৩০%", "৪৫%", "১০%", "১৫%"], ans:2, sol:"শুধু গণিতে = ৭৫-৩০ = ৪৫%। শুধু ইংরেজিতে = ৪৫-৩০ = ১৫%। অন্তত একটিতে পাস = ৪৫+১৫+৩০ = ৯০%। উভয়ে ফেল = ১০০-৯০ = ১০%।", src:true},
  {id:'l3sw41', lec:'lec3', section:'studentWork', sourceNo:'41', topic:"পাস ও ফেল", q:"কোনো পরীক্ষায় মোট পরীক্ষার্থীদের ৪০% ছাত্রী। পরীক্ষায় ছাত্রীদের পাসের হার ৪০% এবং ছাত্রদের পাসের হার ৬০% হলে মোট পাসের হার কত?", opts:["৩৬%", "৪২%", "৪৮%", "৫২%"], ans:3, sol:"ধরি মোট ১০০ জন: ছাত্রী ৪০ জন (পাস ৪০%×৪০=১৬ জন), ছাত্র ৬০ জন (পাস ৬০%×৬০=৩৬ জন)। মোট পাস = ১৬+৩৬ = ৫২ জন। মোট পাসের হার = ৫২%।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে চারটি অপশনের মধ্যে শুধু \"৩৬%\" ও \"৪২%\" নিষ্কাশনে স্পষ্ট দেখা গেছে; বাকি দুটি অনুমান করা হয়েছে। সমাধানের চূড়ান্ত হিসাব থেকে সঠিক উত্তর ৫২% নিশ্চিতভাবে জানা যায়।"},
  {id:'l3sw42', lec:'lec3', section:'studentWork', sourceNo:'42', topic:"পাস ও ফেল", q:"কোনো শ্রেণীতে ১০০ জন পরীক্ষার্থী ছিল। ৯৪ জন বাংলায় এবং ৮০ জন গণিতে পাস করেছে। ৭৫ জন উভয় বিষয়ে পাস করলে কত জন উভয় বিষয়ে ফেল করেছে?", opts:["৫ জন", "৩ জন", "১ জন", "২ জন"], ans:2, sol:"শুধু বাংলায় পাস = ৯৪-৭৫ = ১৯ জন। শুধু গণিতে পাস = ৮০-৭৫ = ৫ জন। অন্তত একটিতে পাস = ১৯+৫+৭৫ = ৯৯ জন। উভয়ে ফেল = ১০০-৯৯ = ১ জন।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের অপশন তালিকায় \"৫\" ও \"৩\" দেখা গেলেও সমাধানের হিসাব অনুযায়ী প্রকৃত উত্তর ১ জন, যা দৃশ্যমান অপশনগুলোর কোনোটির সাথে মেলে না — সম্ভবত বাকি দুটি অপশনের একটি \"১\"। এই সংখ্যাগত উত্তরটি (১ জন) নির্ভরযোগ্য গণনার ফল, তবে সঠিক অপশন-অক্ষর অনিশ্চিত।"},
  {id:'l3sw43', lec:'lec3', section:'studentWork', sourceNo:'43', topic:"পাস ও ফেল", q:"কোনো পরীক্ষায় ২০০ জনের মধ্যে ৭০% বাংলায়, ৬০% ইংরেজিতে এবং ৪০% উভয় বিষয়ে পাস করে। উভয় বিষয়ে ফেল করে কত জন?", opts:["১০ জন", "১৫ জন", "২০ জন", "২৫ জন"], ans:2, sol:"শুধু বাংলায় = ৭০-৪০ = ৩০%। শুধু ইংরেজিতে = ৬০-৪০ = ২০%। অন্তত একটিতে পাস = ৩০+২০+৪০ = ৯০%। উভয়ে ফেল = ১০%, অর্থাৎ ২০০ জনের ১০% = ২০ জন।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে দৃশ্যমান অপশনের মধ্যে \"১০ জন\" ও \"১৫ জন\" দেখা গেছে; বাকি দুটি অপশন নিষ্কাশনে অস্পষ্ট ছিল। সমাধানের হিসাব থেকে সঠিক উত্তর ২০ জন নিশ্চিত।"},
  {id:'l3sw44', lec:'lec3', section:'studentWork', sourceNo:'44', topic:"পাস ও ফেল", q:"কোনো পরীক্ষায় পরীক্ষার্থীর ৮০% গণিতে এবং ৭০% বাংলায় পাস করল। উভয় বিষয়ে ৬০% পাস করল। তাহলে উভয় বিষয়ে শতকরা কত জন ফেল করল?", opts:["২৫%", "২০%", "১৫%", "১০%"], ans:3, sol:"শুধু গণিতে = ৮০-৬০ = ২০%। শুধু বাংলায় = ৭০-৬০ = ১০%। অন্তত একটিতে পাস = ২০+১০+৬০ = ৯০%। উভয়ে ফেল = ১০০-৯০ = ১০%।", src:true},
  {id:'l3sw45', lec:'lec3', section:'studentWork', sourceNo:'45', topic:"হ্রাস-বৃদ্ধি", q:"যদি একটি আয়তক্ষেত্রের প্রস্থ ২৫% বৃদ্ধি এবং দৈর্ঘ্য ২৫% হ্রাস করা হয়, তবে পরিবর্তিত ক্ষেত্রফল মূল ক্ষেত্রফলের শতকরা কত ভাগ?", opts:["৯০%", "৯৩.৭৫%", "৯৫.২৫%", "১০০%"], ans:1, sol:"দৈর্ঘ্য হয় ৭৫% (০.৭৫ গুণ), প্রস্থ হয় ১২৫% (১.২৫ গুণ)। নতুন ক্ষেত্রফল = ০.৭৫×১.২৫ = ০.৯৩৭৫ = মূলের ৯৩.৭৫%।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে এই প্রশ্নের সমাধানে (দৈর্ঘ্য-প্রস্থ-উচ্চতা তিনটি চলক ব্যবহার করে একটি ঘনবস্তুর ধাঁচে) ব্যাখ্যা করা হয়েছে যা মূল প্রশ্নের (আয়তক্ষেত্র, দুই চলক) সাথে পুরোপুরি সঙ্গতিপূর্ণ মনে হয়নি — সম্ভবত নিষ্কাশনে দুটি ভিন্ন প্রশ্নের অংশ মিশে গেছে। তবে চূড়ান্ত উত্তর \"৯৩.৭৫ ভাগ (খ)\" উৎসে স্পষ্টভাবে লেখা আছে এবং প্রমিত সূত্র দিয়েও তা যাচাই করা যায়।"},
  {id:'l3sw46', lec:'lec3', section:'studentWork', sourceNo:'46', topic:"হ্রাস-বৃদ্ধি", q:"চিনির মূল্য ২০% কমে গেল, কিন্তু এর ব্যবহার ২০% বৃদ্ধি পেল। এতে চিনি বাবদ ব্যয় শতকরা কত বাড়লো বা কমলো?", opts:["৫% বাড়ালো", "৫% কমলো", "৪% বাড়লো", "৪% কমলো"], ans:3, sol:"নতুন ব্যয় = ০.৮ × ১.২ = ০.৯৬ = মূলের ৯৬%, অর্থাৎ ৪% কমলো।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে সমাধানের হিসাব \"৪% কমলো\" (অপশন \"ঘ\") নির্দেশ করলেও পাশে ছাপা \"উত্তর ঃ\" ট্যাগটি \"ক\" দেখাচ্ছিল, যা মেলে না। হিসাব অনুযায়ী সঠিক উত্তর \"ঘ\" দেখানো হলো।"},
  {id:'l3sw47', lec:'lec3', section:'studentWork', sourceNo:'47', topic:"হ্রাস-বৃদ্ধি", q:"চিনির মূল্য ২৫% কমে গেলে চিনির ব্যবহার শতকরা কি পরিমাণ বাড়ালে একটি পরিবারের চিনির জন্য খরচের কোনো পরিবর্তন হবে না?", opts:["১৮%", "১৫%", "৩৩%", "৩৩⅓%"], ans:3, sol:"প্রয়োজনীয় বৃদ্ধি = ২৫/(১০০-২৫) × ১০০% = ৩৩⅓%।", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে অপশন \"গ\" ও \"ঘ\" প্রায় একই রকম (\"৩৩%\") দেখাচ্ছিল, শুধু ভগ্নাংশ অংশে সামান্য পার্থক্য থাকার সম্ভাবনা আছে (ওসিআর দ্ব্যর্থকতা)। গাণিতিকভাবে সঠিক মান ৩৩⅓%।"},
  {id:'l3sw49', lec:'lec3', section:'studentWork', sourceNo:'49', topic:"ঘড়ি (কোণ)", q:"সকাল ৯.৩০ মিনিটে ঘড়ির ঘণ্টার কাঁটা ও মিনিটের কাঁটার অন্তর্গত কোণকে ডিগ্রিতে প্রকাশ করলে কত ডিগ্রি হবে?", opts:["৬৫", "৭৫", "৮৫", "১০৫"], ans:3, sol:"কোণ = |৩০H - ৫.৫M| = |৩০×৯ - ৫.৫×৩০| = |২৭০-১৬৫| = ১০৫ ডিগ্রি।", src:true},
  {id:'l3sw50', lec:'lec3', section:'studentWork', sourceNo:'50', topic:"শতকরা লাভ-ক্ষতি", q:"30% of 10 is 10% of which?", opts:["30", "60", "30", "600"], ans:0, sol:"30% of 10 = 3. 3 is 10% of x ⟹ x = 30.", year:"২৮তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে অপশন \"ক\" ও \"গ\" উভয়ই \"৩০\" দেখাচ্ছিল (ওসিআর ডুপ্লিকেশন)। গাণিতিকভাবে সঠিক উত্তর ৩০।"},
  {id:'l3sw51', lec:'lec3', section:'studentWork', sourceNo:'51', topic:"হ্রাস-বৃদ্ধি", q:"একটি বৃত্তের ব্যাসার্ধ শতকরা ৫০% বৃদ্ধি করলে বৃত্তের ক্ষেত্রফল শতকরা কত বৃদ্ধি পাবে?", opts:["৫০%", "২৫%", "১২৫%", "২৫০%"], ans:2, sol:"ক্ষেত্রফল ∝ ব্যাসার্ধ²। নতুন ক্ষেত্রফল = (১.৫)² = ২.২৫ গুণ, অর্থাৎ ১২৫% বৃদ্ধি।", src:true},
