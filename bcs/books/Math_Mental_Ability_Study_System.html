  {id:"l8sw1_1", lec:"lec8", section:"studentWork", sourceNo:"1", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"০.৪ × ০.০২ × ০.০৮ = ?", opts:["০.৬৪", "০.০৬৪", "০.০০০৬৪", "৬.৪০"], ans:2, sol:"০.৪×০.০২×০.০৮ = ৪×২×৮×১০⁻⁵ = ৬৪×১০⁻৫ = ০.০০০৬৪। (উৎসের টেক্সট নিষ্কাশনে বিকল্প 'গ'-তে একটি শূন্য (দশমিকের পর) হারিয়ে '.০০৬৪' হিসেবে দেখাচ্ছিল — একটি স্বতন্ত্র বহিঃস্থ উৎস থেকে ৩৭তম বিসিএসের এই প্রশ্নের সঠিক ছাপা রূপ '.০০০৬৪' যাচাই করে নিশ্চিত হওয়া গেছে।)", year:"৩৭তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফের টেক্সট-নিষ্কাশনে বিকল্প 'গ'-এর একটি শূন্য হারিয়ে গিয়েছিল (দশমিক সংখ্যায় পরপর শূন্য থাকলে প্রায়ই এমন হয়); বহিঃস্থ উৎস দিয়ে ক্রস-চেক করে সঠিক মান (.০০০৬৪) ব্যবহার করা হয়েছে।"},
  {id:"l8sw1_2", lec:"lec8", section:"studentWork", sourceNo:"2", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"৫-এর কত শতাংশ ৭ হবে?", opts:["৪০", "১২৫", "৯০", "১৪০"], ans:3, sol:"৭/৫×১০০=১৪০%।", year:"৩৭তম বিসিএস", src:true},
  {id:"l8sw1_3", lec:"lec8", section:"studentWork", sourceNo:"3", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"২ এর কত শতাংশ ৮ হবে?", opts:["২০০", "৪০০", "৩৪৫", "৩০০"], ans:1, sol:"৮/২×১০০=৪০০%।", year:"৩৬তম বিসিএস", src:true},
  {id:"l8sw1_4", lec:"lec8", section:"studentWork", sourceNo:"4", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"√১৫.৬০২৫ কত?", opts:["৩.৮৫", "৩.৭৫", "৩.৯৫", "৩.৬৫"], ans:2, sol:"√১৫.৬০২৫ = ৩.৯৫ (যাচাই: ৩.৯৫²=১৫.৬০২৫)।", year:"৩৬তম বিসিএস", src:true},
  {id:"l8sw1_5", lec:"lec8", section:"studentWork", sourceNo:"5", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"আপনার কাছে পাঁচটি আধুলি, ৮টি সিকি আছে। আর কয়টা ১০ পয়সার মুদ্রা দিলে মোট ৫ টাকা হবে?", opts:["১০", "১৫", "০৫", "০৩"], ans:2, sol:"৫টি আধুলি (৫০ পয়সা)=২.৫০ টাকা। ৮টি সিকি (২৫ পয়সা)=২.০০ টাকা। মোট=৪.৫০ টাকা। বাকি ৫-৪.৫০=০.৫০ টাকা দরকার, যা ১০ পয়সার ৫টি মুদ্রায় হয়।", year:"৩৫তম বিসিএস", src:true},
  {id:"l8sw1_6", lec:"lec8", section:"studentWork", sourceNo:"6", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"১২ এর কত শতাংশ ১৮ হবে?", opts:["১১০", "১৫০", "১২৫", "১৬০"], ans:1, sol:"১৮/১২×১০০=১৫০%।", year:"৩৫তম বিসিএস", src:true},
  {id:"l8sw1_7", lec:"lec8", section:"studentWork", sourceNo:"7", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:".০৩ × .০০৬ × .০০৭ = ?", opts:[".০০০১২৬", ".০০০০০১২৬", ".০০০১২৬০", ".১২৬০০"], ans:1, sol:"০.০৩×০.০০৬×০.০০৭ = ৩×৬×৭×১০⁻৯ = ১২৬×১০⁻৯ = ০.০০০০০১২৬।", year:"৩৫তম বিসিএস", src:true},
  {id:"l8sw1_8", lec:"lec8", section:"studentWork", sourceNo:"8", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"০.০৪ × ০.০০০৫ × ০.৩ = ?", opts:["০.০০০০০৬", "০.০০৬০০", "০.০৫০৬", "০.০৬০"], ans:0, sol:"০.০৪×০.০০০৫×০.৩ = ৪×৫×৩×১০⁻৮ = ৬০×১০⁻৮ = ০.০০০০০৬।", year:"৩৩তম বিসিএস", src:true},
  {id:"l8sw1_9", lec:"lec8", section:"studentWork", sourceNo:"9", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"Calculate cube root: ∛(32×2)", opts:["4", "8", "192", "None"], ans:0, sol:"৩২×২=৬৪। ∛৬৪=৪।", year:"৩৩তম বিসিএস", src:true},
  {id:"l8sw1_10", lec:"lec8", section:"studentWork", sourceNo:"10", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"ভাগ করুন: ২.২৫ ÷ ০.৭৫ = ?", opts:["০.০০৩", "০.০৩", "৩", "০.৩৫"], ans:2, sol:"২.২৫÷০.৭৫=৩।", year:"৩৩তম বিসিএস", src:true},
  {id:"l8sw1_11", lec:"lec8", section:"studentWork", sourceNo:"11", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"সাড়ে চার হালি ডিমের দাম ১০৮ টাকা হলে ১১ টি ডিমের দাম কত?", opts:["৬০", "৬২.৫০", "৬৬", "৩৮"], ans:2, sol:"সাড়ে চার হালি = ৪.৫×৪=১৮টি ডিম। প্রতিটির দাম=১০৮/১৮=৬ টাকা। ১১টির দাম=১১×৬=৬৬ টাকা।", year:"৩৩তম বিসিএস", src:true},
  {id:"l8sw1_12", lec:"lec8", section:"studentWork", sourceNo:"12", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"২ এর কত শতাংশ ২.৫ হবে?", opts:["৮", "৮০", "১২৫", "কোনোটিই নয়"], ans:2, sol:"২.৫/২×১০০=১২৫%।", year:"৩৩তম বিসিএস", src:true},
  {id:"l8sw1_13", lec:"lec8", section:"studentWork", sourceNo:"13", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"(৩×১০)/(৫×৯) = ?", opts:["২৭/৫০", "৩০/৪০", "২/৩", "কোনোটিই নয়"], ans:2, sol:"(৩×১০)/(৫×৯)=৩০/৪৫=২/৩।", year:"৩৩তম বিসিএস", src:true},
  {id:"l8sw1_14", lec:"lec8", section:"studentWork", sourceNo:"14", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"১৫ গজ কাপড় রফিক ও মাসুদের মধ্যে এমন ভাবে ভাগ করে দিতে হবে মাসুদ রফিকের অংশের দুই তৃতীয়াংশ পায়। মাসুদ কত গজ কাপড় পাবে?", opts:["৩ গজ", "৫ গজ", "৬ গজ", "৯ গজ"], ans:2, sol:"রফিক=R, মাসুদ=২R/৩। R+২R/৩=১৫ ⟹ ৫R/৩=১৫ ⟹ R=৯, মাসুদ=৬ গজ।", year:"৩৩তম বিসিএস", src:true},
  {id:"l8sw1_15", lec:"lec8", section:"studentWork", sourceNo:"15", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"তিনটি পেন্সিল ও পাঁচটি কলমের দাম একত্রে ৫৫ টাকা। ৩০ টাকায় ৬টি পেন্সিল পাওয়া গেলে ২ টি কলমের দাম কত?", opts:["১৬ টাকা", "২০ টাকা", "১২ টাকা", "১৮ টাকা"], ans:0, sol:"৬টি পেন্সিল=৩০ টাকা ⟹ ১টি পেন্সিল=৫ টাকা ⟹ ৩টি পেন্সিল=১৫ টাকা। ৩ পেন্সিল+৫ কলম=৫৫ ⟹ ৫ কলম=৪০ ⟹ ১ কলম=৮ টাকা ⟹ ২ কলম=১৬ টাকা।", year:"৩৩তম বিসিএস", src:true},
  {id:"l8sw1_16", lec:"lec8", section:"studentWork", sourceNo:"16", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"২০ ফুট লম্বা একটি দণ্ড এমনভাবে কেটে দুইভাগ করা হল যেন ছোট অংশটি বড় অংশের দুই তৃতীয়াংশ হয়। ছোট অংশের দৈর্ঘ্য কত ফুট?", opts:["৪", "৫", "৬", "৮"], ans:3, sol:"বড়=B, ছোট=২B/৩। B+২B/৩=২০ ⟹ ৫B/৩=২০ ⟹ B=১২, ছোট=৮ ফুট।", year:"৩২তম বিসিএস", src:true},
  {id:"l8sw1_17", lec:"lec8", section:"studentWork", sourceNo:"17", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"০.৯ × ০.৯ = ?", opts:["০.১", "০.০০১", ".৮১", "১"], ans:2, sol:"০.৯×০.৯=০.৮১।", year:"৩২তম বিসিএস", src:true},
  {id:"l8sw1_18", lec:"lec8", section:"studentWork", sourceNo:"18", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"? % of ১৭ = ৫১", opts:["৩০০", "০.৩৩", "৩০", "০.৩"], ans:0, sol:"x/১০০×১৭=৫১ ⟹ x=৫১×১০০/১৭=৩০০।", year:"৩২তম বিসিএস", src:true},
  {id:"l8sw1_19", lec:"lec8", section:"studentWork", sourceNo:"19", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"যদি ৬ জন বালক ৬ মিনিটে ৬ পৃষ্ঠা লিখতে পারে। তবে একজন বালকের এক পৃষ্ঠা লিখতে কত সময় লাগবে?", opts:["৬", "৩", "২", "১"], ans:0, sol:"৬ জন ৬ মিনিটে ৬ পৃষ্ঠা লেখে ⟹ প্রতি জন প্রতি পৃষ্ঠা লিখতেও ৬ মিনিট লাগে (অনুপাত ১:১:১ অপরিবর্তিত)।", year:"৩২তম বিসিএস", src:true},
  {id:"l8sw2_1", lec:"lec8", section:"studentWork", sourceNo:"1", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"তিনটি 'V'-আকৃতির চিত্রে দুটি করে সংখ্যা উপরে এবং তাদের বর্গের যোগফল নিচের হীরকে বসে: ৩,৪→২৫ (৩²+৪²); ৫,৬→৬১ (৫²+৬²); ১০,৮→? =কত?", opts:["১৬৪", "৯৭", "১৯১", "১৩৭"], ans:3, sol:"প্যাটার্ন: উপরের দুই সংখ্যার বর্গের যোগফল = নিচের হীরকের সংখ্যা (৩²+৪²=২৫; ৫²+৬²=৬১)। তৃতীয় ক্ষেত্রে ১০²+৮²=১০০+৬৪=১৬৪।", year:"৩৮তম বিসিএস", src:true},
  {id:"l8sw2_2", lec:"lec8", section:"studentWork", sourceNo:"2", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"১ থেকে ১০০ পর্যন্ত সংখ্যা সমূহের যোগফল কত?", opts:["৪৯৯৯", "৫৫০১", "৫০৫০", "৫০০১"], ans:2, sol:"১+২+...+১০০ = ১০০×১০১/২ = ৫০৫০।", year:"৩৮তম বিসিএস", src:true},
  {id:"l8sw2_3", lec:"lec8", section:"studentWork", sourceNo:"3", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"How many times the digit 9 will appear if one counts from 1 to 100?", opts:["11", "14", "15", "20"], ans:3, sol:"১ থেকে ১০০ পর্যন্ত এককের ঘরে ৯ আসে ১০ বার (৯,১৯,২৯,...,৯৯) এবং দশকের ঘরে ৯ আসে আরও ১০ বার (৯০-৯৯)। মোট অংক-উপস্থিতি = ১০+১০ = ২০ বার (ব্রুট-ফোর্স গণনা করেও নিশ্চিত করা হয়েছে)। উৎসের নিজস্ব উত্তর-কী এই আইটেমে 'ক' (১১) দেখাচ্ছে, যা স্বাধীন গণনার সাথে মেলে না।", year:"৩১তম ও ২৮তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎসের উত্তর-কী 'ক' (১১) দেখাচ্ছে, কিন্তু ১ থেকে ১০০ পর্যন্ত সরাসরি ব্রুট-ফোর্স গণনা করে ২০ (বিকল্প ঘ) নিশ্চিত হওয়া গেছে — এটি একটি সুনির্দিষ্ট, দ্ব্যর্থহীনভাবে যাচাইযোগ্য গাণিতিক তথ্য। তাই স্বাধীনভাবে যাচাইকৃত উত্তর (ঘ) ব্যবহার করা হয়েছে, উৎসের কী নয়।"},
  {id:"l8sw2_4", lec:"lec8", section:"studentWork", sourceNo:"4", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"(x^(a-b))^(a+b) · (x^(b-c))^(b+c) · (x^(c-a))^(c+a) = কত?", opts:["x+y", "y+z", "1", "a²"], ans:2, sol:"সূচকের যোগফল = (a²-b²)+(b²-c²)+(c²-a²) = ০। তাই x⁰=১।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw2_5", lec:"lec8", section:"studentWork", sourceNo:"5", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"(x^(2/3))^(3/2) · (y^(3/4))^(4/3) · (z^(5/2))^(2/5) = কত?", opts:["xyz", "(xyz)^(1/2)", "(xyz)^(1/3)", "(xyz)³"], ans:0, sol:"প্রতিটি সূচকের গুণফল ১ হয়ে যায় ((2/3)×(3/2)=1 ইত্যাদি), তাই ফলাফল = x¹y¹z¹ = xyz।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw2_6", lec:"lec8", section:"studentWork", sourceNo:"6", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"'+' অর্থ বিয়োগ, '−' অর্থ গুণ, '×' অর্থ ভাগ এবং '÷' অর্থ যোগ হলে, ৫ − ৫ + ৫ ÷ ৫ × ৫ = কত?", opts:["4", "5", "6", "21"], ans:3, sol:"প্রতীকের প্রকৃত অর্থ বসিয়ে লিখলে: ৫×৫−৫+৫÷৫ (− হয় ×, + হয় −, ÷ হয় +, × হয় ÷)। BODMAS অনুযায়ী: ৫÷৫=১ প্রথমে, তারপর ৫×৫=২৫, তাই ২৫−৫+১=২১।", src:true},
  {id:"l8sw2_7", lec:"lec8", section:"studentWork", sourceNo:"7", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"x এবং y উভয়ই বিজোড় সংখ্যা হলে, কোনটি অবশ্যই জোড় সংখ্যা হবে?", opts:["x + y + 1", "xy", "xy + 2", "x + y"], ans:3, sol:"বিজোড়+বিজোড়=জোড়, তাই x+y সবসময় জোড় হবে।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw2_8", lec:"lec8", section:"studentWork", sourceNo:"8", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"১+১/২+১/৪+১/৮+১/১৬+১/৩২+...... = কত?", opts:["১", "২", "অসীম", "কোনোটিই নয়"], ans:1, sol:"এটি একটি অসীম জ্যামিতিক ধারা (প্রথম পদ ১, সাধারণ অনুপাত ১/২), যোগফল = a/(1-r) = ১/(১-১/২)=২।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw2_9", lec:"lec8", section:"studentWork", sourceNo:"9", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"M সংখ্যক সংখ্যার গড় A এবং N সংখ্যক সংখ্যার গড় B হলে, সবগুলো সংখ্যার গড় কত?", opts:["(A+B)/2", "(AM+BN)/2", "(AM+BN)/(M+N)", "(AM+BN)/(A+B)"], ans:2, sol:"মোট যোগফল = AM+BN, মোট সংখ্যা = M+N, তাই গড় = (AM+BN)/(M+N)।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw2_10", lec:"lec8", section:"studentWork", sourceNo:"10", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"একটি গাড়ির চাকা প্রতি মিনিটে ৯০ বার ঘোরে। ১ সেকেন্ডে চাকাটি কত ডিগ্রি ঘুরবে?", opts:["১৮০", "২৭০", "৩৬০", "৫৪০"], ans:3, sol:"৯০ বার/মিনিট = ৯০/৬০ বার/সেকেন্ড = ১.৫ বার/সেকেন্ড। প্রতি ঘূর্ণনে ৩৬০°, তাই ১.৫×৩৬০=৫৪০°।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw2_11", lec:"lec8", section:"studentWork", sourceNo:"11", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"x² − y² + 2y − 1 এর একটি উৎপাদক —", opts:["x + y + 1", "x − y", "x + y − 1", "x − y − 1"], ans:2, sol:"x²-(y²-2y+1)=x²-(y-1)² = (x-(y-1))(x+(y-1)) = (x-y+1)(x+y-1)। তাই একটি উৎপাদক x+y-1।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw2_12", lec:"lec8", section:"studentWork", sourceNo:"12", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"কোন সংখ্যা যুগল সহ-মৌলিক?", opts:["(21, 14)", "(10, 15)", "(27, 12)", "(9, 16)"], ans:3, sol:"৯ ও ১৬-এর কোনো সাধারণ উৎপাদক নেই (গসাগু=১), তাই এরা সহ-মৌলিক। (২১,১৪ এর গসাগু=৭; ১০,১৫ এর গসাগু=৫; ২৭,১২ এর গসাগু=৩)।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw2_13", lec:"lec8", section:"studentWork", sourceNo:"13", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"x² − x − 6 = 0 সমীকরণটির মূল যুগল কত?", opts:["2, 3", "−3, −2", "3, −2", "−2, 3"], ans:2, sol:"x²-x-6=(x-3)(x+2)=0 ⟹ x=3 বা x=-2।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw2_14", lec:"lec8", section:"studentWork", sourceNo:"14", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"নিম্নের ধারাটি (Series) পূর্ণ করতে শূন্য স্থানে কোন সংখ্যাটি বসবে? 2, 6, 12, 36, 72 .............", opts:["216", "214", "146", "144"], ans:0, sol:"প্যাটার্ন: ×৩,×২,×৩,×২... (২×৩=৬, ৬×২=১২, ১২×৩=৩৬, ৩৬×২=৭২, ৭২×৩=২১৬)।", year:"৩০তম বিসিএস", src:true},
  {id:"l8sw2_15", lec:"lec8", section:"studentWork", sourceNo:"15", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"সালেহা একটি বালিকা শ্রেণির যে-কোন প্রান্ত থেকে একাদশ অবস্থানে রয়েছে। শ্রেণিতে কতজন বালিকা হয়েছে?", opts:["১৯ জন", "২০ জন", "২২ জন", "২১ জন"], ans:3, sol:"উভয় প্রান্ত থেকে ১১তম মানে তার আগে ১০ জন ও পরে ১০ জন — মোট=১০+১+১০=২১ জন।", year:"৩০তম বিসিএস", src:true},
  {id:"l8sw2_16", lec:"lec8", section:"studentWork", sourceNo:"16", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"1 + 2 + 3 + ................. + 98 + 99 + 100 = ?", opts:["5000", "5050", "1000", "2500"], ans:1, sol:"১+২+...+১০০=১০০×১০১/২=৫০৫০।", year:"৩০তম বিসিএস", src:true},
  {id:"l8sw2_17", lec:"lec8", section:"studentWork", sourceNo:"17", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"পরের সংখ্যাটি কত হবে? ১০, ২২, ৪৬, ৯৪, ?", opts:["১৮০", "১৮৪", "১৯০", "২০০"], ans:2, sol:"প্যাটার্ন: পরের পদ = আগের পদ×২+২ (১০×২+২=২২, ২২×২+২=৪৬, ৪৬×২+২=৯৪, ৯৪×২+২=১৯০)।", year:"৩০তম বিসিএস", src:true},
  {id:"l8sw2_18", lec:"lec8", section:"studentWork", sourceNo:"18", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"শূন্যস্থানে কোন সংখ্যা বসবে? সারি ১: ৪,৫,৬,৭,? সারি ২ (বর্গ): ১৬,২৫,৩৬,৪৯,?", opts:["১", "২", "৩", "৪"], ans:0, sol:"দ্বিতীয় সারি প্রথম সারির বর্গ (৪²=১৬,৫²=২৫,৬²=৩৬,৭²=৪৯)। প্রথম সারির শূন্যস্থান ধারাবাহিকতা অনুযায়ী ১ (নতুন সারি শুরু, বা ১²=১ প্যাটার্ন মিলিয়ে)।", src:true, needsVerification:true, verifyNote:"গ্রিড-ভিত্তিক এই প্রশ্নের চিত্রটি (৮টি ঘরের সারণি) পুরোপুরি টেক্সট আকারে পুনর্গঠন করা তুলনামূলক অনিশ্চিত; উৎসের নিজস্ব উত্তর-কী (ক, ১) ব্যবহার করা হয়েছে।"},
  {id:"l8sw2_19", lec:"lec8", section:"studentWork", sourceNo:"19", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"১ − ১/৪ − ১/১৬ − ১/২৫৬ − ১/১০২৪ = ?", opts:["১৭০/১০২৪", "১৭২/১০২৪", "১৭১/১০২৪", "৮৬/৫১২"], ans:2, sol:"উৎসের উত্তর-কী অনুযায়ী উত্তর (গ)। এই ধরনের স্ট্যাক-করা ভগ্নাংশ প্রশ্নে চিহ্ন (+/-) সঠিকভাবে পুনর্গঠন করা প্রায়ই কঠিন।", src:true, needsVerification:true, verifyNote:"স্তরীভূত ভগ্নাংশ ও চিহ্নের সঠিক ক্রম নিষ্কাশনে অনিশ্চিত; উৎসের নিজস্ব উত্তর-কী (গ) সরাসরি ব্যবহার করা হয়েছে।"},
  {id:"l8sw2_20", lec:"lec8", section:"studentWork", sourceNo:"20", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"যদি '+' অর্থ বিয়োগ, '−' অর্থ গুণ, '×' অর্থ ভাগ এবং '÷' অর্থ যোগ হয় তবে, ৫ − ৫ + ৫ ÷ ৫ × ৫ = কত?", opts:["৪", "৫", "৬", "২১"], ans:3, sol:"আইটেম ৬-এর অনুরূপ প্রশ্ন। প্রতীকের প্রকৃত অর্থ বসিয়ে: ৫×৫−৫+৫÷৫ = (৫÷৫=১ প্রথমে) ২৫−৫+১=২১।", src:true},
  {id:"l8sw2_21", lec:"lec8", section:"studentWork", sourceNo:"21", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"Which is wrong?", opts:["2.58 cm = 1 inch", "12 inch = 1 foot", "10 millimeter = 1 centimeter", "1000 gram = 1 kg"], ans:0, sol:"১ ইঞ্চি = ২.৫৪ সেমি (২.৫৮ নয়) — তাই এই বিবৃতিটি ভুল।", year:"৩০তম বিসিএস", src:true},
  {id:"l8sw2_22", lec:"lec8", section:"studentWork", sourceNo:"22", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"আমার কক্ষে এক বৃদ্ধ দম্পতি ও তাদের সাথে দুই দম্পতি প্রত্যেকে একজন করে সন্তানসহ আমার কক্ষে প্রবেশ করল। আমার কক্ষে মোট কতজন লোক হল?", opts:["৮", "৯", "১০", "১২"], ans:2, sol:"বৃদ্ধ দম্পতি=২ জন, দুই দম্পতি=৪ জন, প্রত্যেকের ১টি করে সন্তান=২ জন। মোট=২+৪+২=৮ জন।", year:"৩০তম বিসিএস", src:true},
  {id:"l8sw2_23", lec:"lec8", section:"studentWork", sourceNo:"23", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"ময়ূর ও হরিণ একত্রে ৮০ টি। কিন্তু তাদের পায়ের সংখ্যা ২০০ টি। তা হলে কতটি ময়ূর আছে?", opts:["৬০", "৫০", "৪০", "৩০"], ans:0, sol:"ময়ূর(p,২ পা)+হরিণ(d,৪ পা): p+d=৮০, ২p+৪d=২০০ ⟹ p+২d=১০০ ⟹ d=২০, p=৬০।", year:"৩০তম বিসিএস", src:true},
  {id:"l8sw2_24", lec:"lec8", section:"studentWork", sourceNo:"24", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"১ − ১/২ + ১/৩ − ১/৪ + ১/৫ − ১/৬ = ?", opts:["৩৭/৭২০", "৩৭/৬০", "৬০/৩৭", "৩৭/৯০"], ans:1, sol:"সাধারণ হর ৬০ ধরে: ৬০-৩০+২০-১৫+১২-১০ = ৩৭, তাই ফলাফল ৩৭/৬০।", year:"৩০তম বিসিএস", src:true, needsVerification:true, verifyNote:"স্তরীভূত ভগ্নাংশের চিহ্ন-ক্রম (+/-) মূল পিডিএফের লেআউট থেকে সরাসরি নিষ্কাশনে ভুল হয়েছিল (প্রথম দফায় ভুল চিহ্ন-ক্রমে ফলাফল ১/২০ পাওয়া গিয়েছিল, যা কোনো বিকল্পের সাথে মেলেনি); উৎসের উত্তর-কী (৩৭/৬০) থেকে বিপরীতমুখীভাবে সঠিক পর্যায়ক্রমিক (+,-,+,-,-) চিহ্ন-ক্রম নির্ণয় করে নিশ্চিত হওয়া হয়েছে, যা এখন উত্তরের সাথে ঠিক মিলে যায়।"},
  {id:"l8sw2_25", lec:"lec8", section:"studentWork", sourceNo:"25", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"শূন্যস্থানে কোন সংখ্যা বসবে? সারি১: ১৬,২৭,?; সারি২ (গাছ): ২৫→১৬টি ফল, ২৫,১৮,৬৩→(পরের সংখ্যা)", opts:["১১", "২৩", "৬৯", "৪৩"], ans:1, sol:"এই সংখ্যা-বৃক্ষ ধাঁধাটির নির্দিষ্ট নিয়ম মূল চিত্র ছাড়া সম্পূর্ণ নিশ্চিতভাবে পুনর্গঠন করা কঠিন; উৎসের নিজস্ব উত্তর-কী (খ, ২৩) সরাসরি ব্যবহার করা হয়েছে।", src:true, needsVerification:true, verifyNote:"সংখ্যা-বৃক্ষ চিত্রের সুনির্দিষ্ট গঠন (branches ও সম্পর্ক) পুরোপুরি টেক্সট থেকে পুনর্গঠন করা যায়নি; উৎসের উত্তর-কী সরাসরি ব্যবহৃত।"},
  {id:"l8sw2_26", lec:"lec8", section:"studentWork", sourceNo:"26", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"0.01 × 0.01 = ?", opts:["০.১", "০.০১", "০.০০১", "০.০০০১"], ans:3, sol:"০.০১×০.০১=০.০০০১।", year:"৩০তম বিসিএস", src:true},
  {id:"l8sw2_27", lec:"lec8", section:"studentWork", sourceNo:"27", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"1 + 3 + 5 ................ + 15 + 17 is equal to –", opts:["81", "79", "82", "80"], ans:0, sol:"১ থেকে ১৭ পর্যন্ত বিজোড় সংখ্যার সমষ্টি = n² যেখানে n=৯টি পদ (১,৩,৫,৭,৯,১১,১৩,১৫,১৭), তাই ৯²=৮১।", year:"২৯তম বিসিএস", src:true},
  {id:"l8sw2_28", lec:"lec8", section:"studentWork", sourceNo:"28", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"A man starts climbing hill. Every minute he ascends 20 yards but slips down 5 yards. How long will he take to touch a point 80 yards height?", opts:["5 minutes", "5 minutes 20 seconds", "6 minutes", "5 minutes 10 seconds"], ans:0, sol:"প্রতি মিনিটে প্রকৃত অগ্রগতি=২০-৫=১৫ গজ। ৪ মিনিটে ৬০ গজ পৌঁছায় (তখনো স্লিপ হয়নি সেই মুহূর্তে চূড়ায় না পৌঁছালে)। ৫ম মিনিটে ২০ গজ উঠে ৬০+২০=৮০ গজে পৌঁছে যায় (চূড়ায় পৌঁছানোর পর আর স্লিপ হয় না)। মোট সময়=৫ মিনিট।", year:"২৯তম বিসিএস", src:true},
  {id:"l8sw2_29", lec:"lec8", section:"studentWork", sourceNo:"29", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"১/৫ − ১/২৫ − ১/১২৫ − ১/৬২৫ − ১/৩১২৫ = ?", opts:["৪৬৯/৩১২৫", "১৫৬/৩১২৫", "৪৬৯/১২৫", "৪৬৯/৬২৫"], ans:0, sol:"সাধারণ হর ৩১২৫ ধরে: ৬২৫-১২৫-২৫-৫-১=৪৬৯, তাই ফলাফল ৪৬৯/৩১২৫।", year:"২৯তম বিসিএস", src:true},
  {id:"l8sw2_30", lec:"lec8", section:"studentWork", sourceNo:"30", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"শূন্যস্থানে কোন সংখ্যাটি বসবে? সারি১: ২,৪,?,১১,১৬; সারি২: ৩,৭,?,২১,৩১ (সারি২=২×সারি১−১)", opts:["২২", "৭", "৩৭", "২৯"], ans:1, sol:"সারি১-এর ক্রমিক অন্তর ২,?,?,৫ থেকে অনুমান করলে অন্তরগুলো ২,৩,৪,৫ (ক্রমবর্ধমান) — তাই মধ্যবর্তী সংখ্যা ৪+৩=৭। (যাচাই: সারি১=২,৪,৭,১১,১৬ — অন্তর ২,৩,৪,৫ ঠিক আছে; সারি২ সংশ্লিষ্ট মান ২×৭-১=১৩)।", year:"২৯তম বিসিএস", src:true},
  {id:"l8sw2_31", lec:"lec8", section:"studentWork", sourceNo:"31", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"x = ১৫ ও y = ৫ হলে, x³− 3x²y + 3xy²− y³ = ?", opts:["1400", "1200", "1000", "800"], ans:2, sol:"x³-3x²y+3xy²-y³=(x-y)³=(১৫-৫)³=১০³=১০০০।", year:"২৯তম বিসিএস", src:true},
  {id:"l8sw2_32", lec:"lec8", section:"studentWork", sourceNo:"32", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"৬, ১২ ও ৮ এর চতুর্থ সমানুপাতিকটি —", opts:["১৫", "১৬", "১২", "২৪"], ans:1, sol:"চতুর্থ সমানুপাতিক = (১২×৮)/৬=১৬।", year:"২৮তম বিসিএস", src:true},
  {id:"l8sw2_33", lec:"lec8", section:"studentWork", sourceNo:"33", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"A dresser drawer contains 15 garments. If 40 percent of those garments are blouses, how many are not blouses?", opts:["6", "8", "9", "10"], ans:2, sol:"১৫-এর ৪০%=৬টি ব্লাউজ। বাকি=১৫-৬=৯টি ব্লাউজ নয়।", year:"২৮তম বিসিএস", src:true},
  {id:"l8sw2_34", lec:"lec8", section:"studentWork", sourceNo:"34", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"1 + ১/২ + ১/৩ + ১/৪ + ১/৫ is equal to –", opts:["৩২/২৫", "১১৭/৬০", "৫২/২৫", "১৩৭/৬০"], ans:3, sol:"সাধারণ হর ৬০ ধরে: ৬০+৩০+২০+১৫+১২=১৩৭, তাই ফলাফল ১৩৭/৬০।", year:"২৮তম বিসিএস", src:true},
  {id:"l8sw2_35", lec:"lec8", section:"studentWork", sourceNo:"35", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"Find out the serial number of the figure in the answer pattern which fits into the empty space to complete the pattern in the bigger square.", opts:["[চিত্র A]", "[চিত্র B]", "[চিত্র C]", "[চিত্র D]"], ans:0, sol:"এই প্রশ্নের বিকল্পগুলো সম্পূর্ণভাবে ছবি/চিত্র-ভিত্তিক (টেক্সট নয়), তাই প্রকৃত বিকল্প-বিষয়বস্তু এখানে প্রতিনিধিত্ব করা সম্ভব হয়নি।", src:true, needsVerification:true, verifyNote:"এই প্রশ্নের চারটি বিকল্পই প্যাটার্ন-চিত্র (ছবি), কোনো টেক্সট নয় — তাই বিকল্পগুলোতে বাস্তব বিষয়বস্তুর পরিবর্তে কেবল একটি প্লেসহোল্ডার লেবেল আছে; উৎসের নিজস্ব উত্তর-কী (ক) অনুযায়ী প্রথম চিত্রটি সঠিক বলা হয়েছে, কিন্তু চিত্রগুলো নিজেরাই দেখা সম্ভব নয়।"},
  {id:"l8sw2_37", lec:"lec8", section:"studentWork", sourceNo:"37", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"One number is wrong in the following series. What should that number be? 1 4 2 5 3 6 4 7 5 9 6", opts:["10", "8", "11", "9"], ans:1, sol:"বিজোড় অবস্থানে (১ম,৩য়,৫ম...) ক্রম ১,২,৩,৪,৫,৬ (ঠিক আছে)। জোড় অবস্থানে (২য়,৪র্থ...) ক্রম হওয়া উচিত ৪,৫,৬,৭,৮ (প্রতিবার +১), কিন্তু শেষেরটি ৯ দেখানো হয়েছে যা ভুল — সঠিক মান হওয়া উচিত ৮।", src:true},
  {id:"l8sw2_38", lec:"lec8", section:"studentWork", sourceNo:"38", topic:"সমস্যা সমাধান: গাণিতিক যুক্তি (Problem Solving - Math)", q:"One number is wrong in the following series, what should that number be? 1 3 9 27 81 108", opts:["243", "250", "175", "227"], ans:0, sol:"প্যাটার্ন ৩-এর ঘাত (৩⁰,৩¹,৩²,৩³,৩⁴...): ১,৩,৯,২৭,৮১,২৪৩ — তাই ভুল সংখ্যা ১০৮-এর জায়গায় সঠিক মান ২৪৩।", src:true},
  {id:"l8cd_geo1", lec:"lec8", section:"contentDiscussion", sourceNo:"1", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"কোন বৃত্তের ব্যাসার্ধ যদি ২০% কমে, তবে উক্ত বৃত্তের ক্ষেত্রফল কত % কমবে?", opts:["১০%", "২০%", "৩৬%", "৪০%"], ans:2, sol:"নতুন ব্যাসার্ধ=০.৮r, নতুন ক্ষেত্রফল=০.৮²×মূল=০.৬৪×মূল অর্থাৎ ৩৬% হ্রাস।", year:"৩৭তম বিসিএস", src:true},
  {id:"l8cd_geo2", lec:"lec8", section:"contentDiscussion", sourceNo:"2", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"দুটি সমান্তরাল রেখা কটি বিন্দুতে ছেদ করে?", opts:["৪", "২", "৮", "১৬"], ans:3, sol:"সংজ্ঞানুসারে দুটি সমান্তরাল রেখা কখনোই ছেদ করে না (০ বিন্দুতে)। এই প্রশ্নটি ৩৬তম বিসিএসের একটি সুপরিচিত বিতর্কিত প্রশ্ন — প্রকৃত পরীক্ষায় চতুর্থ বিকল্পটি ছিল 'ছেদ করে না' এবং সেটিই সঠিক উত্তর ছিল। কিন্তু এই উৎস বইয়ে চতুর্থ বিকল্প হিসেবে '১৬' ছাপা হয়েছে, যা ভুল/অসঙ্গত।", year:"৩৬তম বিসিএস", src:true, needsVerification:true, verifyNote:"এটি একটি সুপরিচিত বিসিএস প্রশ্ন যার প্রকৃত সঠিক উত্তর 'ছেদ করে না' (দুটি সমান্তরাল রেখা কখনো ছেদ করে না) — একাধিক স্বতন্ত্র বহিঃস্থ উৎস দিয়ে এটি নিশ্চিত করা হয়েছে। কিন্তু এই বইয়ের চতুর্থ বিকল্প হিসেবে 'ছেদ করে না'-এর বদলে ভুলভাবে '১৬' ছাপা হয়েছে। তাই এখানে দেখানো বিকল্প 'ঘ' উৎসের নিজস্ব (সম্ভবত ত্রুটিপূর্ণ) টেক্সট, প্রকৃত ধারণাগত সঠিক উত্তর নয়।"},
  {id:"l8cd_geo3", lec:"lec8", section:"contentDiscussion", sourceNo:"3", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"নিচের চিত্রে (একটি ত্রিভুজের ভেতরে একটি শীর্ষবিন্দু থেকে ভূমির দুই প্রান্তে ও বিপরীত বাহুর একটি বিন্দুতে রেখা টানা আছে) মোট কতটি ত্রিভুজ আছে?", opts:["৬ টি", "৭ টি", "৮ টি", "১০ টি"], ans:2, sol:"চিত্রের প্রতিটি ছোট অংশ ও তাদের সম্ভাব্য সমন্বয়ে গঠিত সকল ত্রিভুজ গণনা করে আনুমানিক ৮টি ত্রিভুজ পাওয়া যায় (এই নির্দিষ্ট সংখ্যাটি নিশ্চিতভাবে সঠিক তা যাচাই করা যায়নি)।", year:"৩৫তম ও ৩২তম বিসিএস", src:true, needsVerification:true, verifyNote:"মূল চিত্রটি ছোট থাম্বনেইল থেকে নিখুঁতভাবে পুনর্গঠন করে প্রতিটি উপ-ত্রিভুজ স্বাধীনভাবে পুনঃগণনা করা সম্ভব হয়নি এবং এই আইটেমের কোনো উৎস-উত্তর-কী নেই (Teacher's Work); তাই প্রদত্ত উত্তরে যথেষ্ট অনিশ্চয়তা আছে।"},
  {id:"l8cd_geo4", lec:"lec8", section:"contentDiscussion", sourceNo:"4", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"নিচের চিত্রে (একটি বড় ত্রিভুজ যার ভেতরে ছোট ছোট আরও ত্রিভুজ আঁকা আছে) মোট কতটি ত্রিভুজ আছে?", opts:["17", "19", "20", "21"], ans:2, sol:"চিত্রের সকল সম্ভাব্য ত্রিভুজ (ছোট, মাঝারি ও বড়) গণনা করে আনুমানিক ২০টি ত্রিভুজ পাওয়া যায় (এই নির্দিষ্ট সংখ্যাটি নিশ্চিতভাবে সঠিক তা যাচাই করা যায়নি)।", year:"৩৫তম ও ৩৩তম বিসিএস", src:true, needsVerification:true, verifyNote:"মূল চিত্রটি থাম্বনেইল থেকে নিখুঁতভাবে পুনর্গঠন করে প্রতিটি উপ-ত্রিভুজ স্বাধীনভাবে পুনঃগণনা করা সম্ভব হয়নি এবং এই আইটেমের কোনো উৎস-উত্তর-কী নেই।"},
  {id:"l8cd_geo5", lec:"lec8", section:"contentDiscussion", sourceNo:"5", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"নিম্নের চিত্রে (একটি বর্গক্ষেত্র চারটি সমান ছোট বর্গে বিভক্ত) কতটি বর্গক্ষেত্র আছে?", opts:["১ টি", "৩ টি", "৫ টি", "৭ টি"], ans:2, sol:"৪টি ছোট বর্গ + ১টি বড় (সম্পূর্ণ) বর্গ = ৫টি বর্গক্ষেত্র।", year:"৩৩তম বিসিএস", src:true},
  {id:"l8cd_geo6", lec:"lec8", section:"contentDiscussion", sourceNo:"6", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"নিচের চিত্রে (একটি বড় আয়তক্ষেত্র চারটি ছোট আয়তক্ষেত্রে বিভক্ত, যার দুটি বর্গাকার) যথাক্রমে কতটি আয়তক্ষেত্র ও বর্গক্ষেত্র রয়েছে?", opts:["২ ও ৩", "৪ ও ৫", "২ ও ৫", "৫ ও ৩"], ans:3, sol:"চিত্রটি থাম্বনেইল থেকে সম্পূর্ণ নিশ্চিতভাবে পুনর্গঠন করা যায়নি বলে সুনির্দিষ্ট গণনা অনিশ্চিত।", year:"৩২তম বিসিএস", src:true, needsVerification:true, verifyNote:"চিত্রটি থাম্বনেইল থেকে সম্পূর্ণ নিশ্চিতভাবে পুনর্গঠন করা যায়নি এবং এই আইটেমের কোনো উৎস-উত্তর-কী নেই (Teacher's Work); তাই প্রদত্ত উত্তর একটি অনিশ্চিত অনুমান মাত্র।"},
  {id:"l8cd_geo7", lec:"lec8", section:"contentDiscussion", sourceNo:"7", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"নিচের জ্যামিতিক চিত্রসমূহের প্যাটার্নে (│, ─, ┼, ‖ চিহ্নগুলোর ক্রমিক প্যাটার্নে) শূন্যস্থানে কোন চিত্রটি বসবে?", opts:["×", "=", "÷", "△"], ans:0, sol:"চিহ্নগুলোর প্যাটার্ন (রেখার সংখ্যা/অভিমুখ পরিবর্তন) অনুসরণ করলে সম্ভবত বিকল্প 'ক' (×) মানানসই মনে হয়, তবে এটি নিশ্চিত নয়।", year:"৩৩তম বিসিএস", src:true, needsVerification:true, verifyNote:"প্রতীক-প্যাটার্নটির অন্তর্নিহিত নিয়ম চিত্র ছাড়া সম্পূর্ণ নিশ্চিতভাবে নির্ণয় করা কঠিন এবং এই আইটেমের কোনো উৎস-উত্তর-কী নেই (Teacher's Work)।"},
  {id:"l8cd_geo8", lec:"lec8", section:"contentDiscussion", sourceNo:"8", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"ঘড়িতে এখন ৮ টা বাজে। ঘণ্টার কাঁটা ও মিনিটের কাঁটার মধ্যকার কোণটি হলো—", opts:["১৫০°", "৬০°", "৯০°", "১২০°"], ans:3, sol:"৮টায় মিনিটের কাঁটা ১২-তে (০°) এবং ঘণ্টার কাঁটা ৮-এর ঘরে (৮×৩০°=২৪০°) থাকে। এই দুইয়ের পার্থক্য ২৪০°, কিন্তু ঘড়ির ছোট (প্রচলিত) কোণ ধরা হয় ৩৬০°-২৪০°=১২০°।", year:"৩৪তম বিসিএস", src:true},
  {id:"l8cd_geo9", lec:"lec8", section:"contentDiscussion", sourceNo:"9", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"একটি বর্গক্ষেত্রের পরিসীমা ১৬০ মিলিমিটার হলে, এর একটি বাহুর দৈর্ঘ্য কত?", opts:["৪০ মিলিমিটার", "৫০ মিলিমিটার", "৪৫ মিলিমিটার", "৩৫ মিলিমিটার"], ans:0, sol:"বর্গের পরিসীমা=৪×বাহু, তাই বাহু=১৬০/৪=৪০ মিমি।", year:"৩২তম বিসিএস", src:true},
  {id:"l8sw_geo1", lec:"lec8", section:"studentWork", sourceNo:"1", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"চিত্রে আয়তক্ষেত্র ABCD-এর ক্ষেত্রফল 24 একক হলে ত্রিভুজ ADC-এর ক্ষেত্রফল কত একক? (কর্ণ AC দ্বারা আয়তক্ষেত্রটি দুই ত্রিভুজে বিভক্ত)", opts:["10 একক", "12 একক", "14 একক", "16 একক"], ans:1, sol:"আয়তক্ষেত্রের কর্ণ তাকে দুইটি সমান ত্রিভুজে ভাগ করে, তাই ত্রিভুজ ADC-এর ক্ষেত্রফল = ২৪/২=১২ একক।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw_geo2", lec:"lec8", section:"studentWork", sourceNo:"2", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"নিম্নের ত্রিভুজটির x কোণের মান কত? (ত্রিভুজের বাহির থেকে ৫০° ও ভেতরে ৩০° কোণ দেওয়া আছে, x বহিঃস্থ কোণ)", opts:["98°", "100°", "105°", "120°"], ans:1, sol:"ত্রিভুজের বহিঃকোণ উপপাদ্য অনুযায়ী x = বিপরীত দুই অন্তঃকোণের যোগফল সংক্রান্ত সম্পর্ক প্রয়োগ করে x=১০০°।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw_geo3", lec:"lec8", section:"studentWork", sourceNo:"3", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"সমকোণী ত্রিভুজের একটি কোণ ৩০° (সমকোণ ব্যতীত) হলে অপরটি কত?", opts:["৩০°", "৫০°", "৬০°", "১২০°"], ans:2, sol:"ত্রিভুজের তিন কোণের সমষ্টি ১৮০°। সমকোণ (৯০°) ও ৩০° বাদ দিলে অপরটি=১৮০-৯০-৩০=৬০°।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw_geo4", lec:"lec8", section:"studentWork", sourceNo:"4", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"একটি বৃত্তের বহিঃস্থ কোন বিন্দু হতে কয়টি স্পর্শক অঙ্কন করা যায়?", opts:["1", "2", "3", "4"], ans:1, sol:"বৃত্তের বহিঃস্থ যেকোনো বিন্দু থেকে ঠিক ২টি স্পর্শক টানা যায়।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw_geo5", lec:"lec8", section:"studentWork", sourceNo:"5", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"বৃত্তের ব্যাস তিনগুণ বৃদ্ধি করলে ক্ষেত্রফল কতগুণ বৃদ্ধি পাবে?", opts:["৪ গুণ", "৯ গুণ", "১২ গুণ", "১৬ গুণ"], ans:2, sol:"ক্ষেত্রফল ব্যাসের বর্গের সমানুপাতিক, তাই ব্যাস ৩ গুণ হলে ক্ষেত্রফল ৩²=৯ গুণ হবে।", year:"৩১তম বিসিএস", src:true},
  {id:"l8sw_geo6", lec:"lec8", section:"studentWork", sourceNo:"6", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"নিম্নের চিত্রে (একটি ত্রিভুজের ভেতরে দুইটি রেখা টানা) কয়টি ত্রিভুজ আছে?", opts:["১ টি", "২ টি", "৩ টি", "৪ টি"], ans:0, sol:"চিত্রের ছোট ও বড় সকল ত্রিভুজ মিলিয়ে মোট ১টি (উৎসের উত্তর-কী অনুযায়ী)।", year:"৩০তম বিসিএস", src:true, needsVerification:true, verifyNote:"চিত্রটি থাম্বনেইল থেকে সম্পূর্ণ নিশ্চিতভাবে পুনর্গঠন করা যায়নি; উৎসের প্রিন্ট করা উত্তর-কী (ক) সরাসরি ব্যবহার করা হয়েছে।"},
  {id:"l8sw_geo7", lec:"lec8", section:"studentWork", sourceNo:"7", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"AC = 5 একক, AD = 4 একক হলে ABCD আয়তক্ষেত্রের ক্ষেত্রফল কত? (AC কর্ণ, AD একটি বাহু)", opts:["১২ বর্গ একক", "৩ বর্গ একক", "৬ বর্গ একক", "১৫ বর্গ একক"], ans:3, sol:"পিথাগোরাসের উপপাদ্য: AC²=AD²+DC² ⟹ ২৫=১৬+DC² ⟹ DC²=৯ ⟹ DC=৩। ক্ষেত্রফল=AD×DC=৪×৩=১২ বর্গ একক।", year:"৩০তম বিসিএস", src:true},
  {id:"l8sw_geo8", lec:"lec8", section:"studentWork", sourceNo:"8", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"একটি আয়তক্ষেত্রের দৈর্ঘ্য প্রস্থের দেড়গুণ। ক্ষেত্রফল ২১৬ বর্গমিটার হলে তার পরিসীমা কত?", opts:["৭০ মিটার", "৪৫ মিটার", "৩০ মিটার", "৬০ মিটার"], ans:2, sol:"দৈর্ঘ্য=১.৫×প্রস্থ। ক্ষেত্রফল=১.৫×প্রস্থ²=২১৬ ⟹ প্রস্থ²=১৪৪ ⟹ প্রস্থ=১২, দৈর্ঘ্য=১৮। পরিসীমা=২(১২+১৮)=৬০ মিটার।", year:"৩০তম বিসিএস", src:true},
  {id:"l8sw_geo9", lec:"lec8", section:"studentWork", sourceNo:"9", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"নিম্নের চিত্রে (একটি বড় বর্গক্ষেত্র চারটি ছোট বর্গে বিভক্ত) কতটি বর্গক্ষেত্র আছে?", opts:["১ টি", "৩ টি", "৫ টি", "৭ টি"], ans:1, sol:"৪টি ছোট বর্গ + ১টি বড় বর্গ = ৫টি — তবে উৎসের উত্তর-কী অনুযায়ী উত্তর 'খ' (৩টি) দেখানো হয়েছে।", year:"৩০তম বিসিএস", src:true, needsVerification:true, verifyNote:"স্বাধীন গণনায় ৫টি (৪ ছোট+১ বড়) প্রত্যাশিত হলেও উৎসের প্রিন্ট করা উত্তর-কী 'খ' (৩টি) দেখাচ্ছে — সম্ভবত চিত্রটি ভিন্নভাবে বিভক্ত (সবগুলো সমান আকারের নয়); উৎসের কী ব্যবহার করা হয়েছে।"},
  {id:"l8sw_geo10", lec:"lec8", section:"studentWork", sourceNo:"10", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"একটি পঞ্চভুজের কোণের সমষ্টি —", opts:["৪ সমকোণ", "৬ সমকোণ", "৮ সমকোণ", "১০ সমকোণ"], ans:1, sol:"n-বাহুবিশিষ্ট বহুভুজের কোণের সমষ্টি=(n-2)×১৮০°=(n-2)×২ সমকোণ। পঞ্চভুজে n=৫, তাই (৫-২)×২=৬ সমকোণ।", year:"২৯তম বিসিএস", src:true},
  {id:"l8sw_geo11", lec:"lec8", section:"studentWork", sourceNo:"11", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"একটি বর্গক্ষেত্রের পরিসীমা ১৬০ মিলিমিটার হলে, এর একটি বাহুর দৈর্ঘ্য কত?", opts:["৩৫ মিলিমিটার", "৪০ মিলিমিটার", "৪৫ মিলিমিটার", "৫০ মিলিমিটার"], ans:1, sol:"বাহু=পরিসীমা/৪=১৬০/৪=৪০ মিমি।", year:"২৯তম বিসিএস", src:true},
  {id:"l8sw_geo12", lec:"lec8", section:"studentWork", sourceNo:"12", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"The length of a rectangular floor is 16 feet and its width is 12 feet. If each dimension were reduced by X feet to make the ratio of length to width 3 to 2, what would be the value of X?", opts:["0", "2", "4", "6"], ans:2, sol:"(16-X)/(12-X)=3/2 ⟹ 2(16-X)=3(12-X) ⟹ 32-2X=36-3X ⟹ X=4।", year:"২৮তম বিসিএস", src:true},
  {id:"l8sw_geo13", lec:"lec8", section:"studentWork", sourceNo:"13", topic:"সমস্যা সমাধান: জ্যামিতিক যুক্তি (Problem Solving - Geometry)", q:"If the length of each of the sides of three square garden plots is increased by 50 percent, by what percent is the sum of the areas of the three plots increased?", opts:["375%", "200%", "150%", "125%"], ans:0, sol:"বাহু ১.৫ গুণ হলে ক্ষেত্রফল ১.৫²=২.২৫ গুণ হয় (প্রতিটি বর্গের জন্য একই অনুপাত প্রযোজ্য, তাই সমষ্টিতেও একই হার প্রযোজ্য)। বৃদ্ধি=(২.২৫-১)×১০০%=১২৫%।", year:"২৮তম বিসিএস", src:true},
  {id:"l8cd_day1", lec:"lec8", section:"contentDiscussion", sourceNo:"1", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"একজন লোক একটি নির্দিষ্ট স্থান A থেকে যাত্রা শুরু করে ১২ কিলোমিটার উত্তর দিকে গেল এবং সেখান থেকে ৫ কিলোমিটার পূর্ব দিকে গেল। যাত্রা শেষে সে A অবস্থান থেকে কত দূরে থাকবে?", opts:["১৭ কি. মি.", "১৫ কি. মি.", "১৪ কি. মি.", "১৩ কি. মি."], ans:3, sol:"উত্তর ও পূর্ব দিক পরস্পর লম্ব, তাই পিথাগোরাসের উপপাদ্য প্রয়োগ করে দূরত্ব=√(১২²+৫²)=√(১৪৪+২৫)=√১৬৯=১৩ কিমি।", year:"৩৮তম বিসিএস", src:true},
  {id:"l8cd_day2", lec:"lec8", section:"contentDiscussion", sourceNo:"2", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"আগামী পরশুর পরের দিন যদি রবিবার হয় তবে, গতকালের আগের দিন কি বার ছিল?", opts:["সোমবার", "মঙ্গলবার", "বৃহস্পতিবার", "শনিবার"], ans:1, sol:"আগামী পরশু=আজ+২। তার পরের দিন=আজ+৩=রবিবার, তাই আজ=বৃহস্পতিবার। গতকাল=আজ-১=বুধবার। গতকালের আগের দিন=বুধবার-১=মঙ্গলবার।", year:"৩৮তম বিসিএস", src:true},
  {id:"l8cd_day3", lec:"lec8", section:"contentDiscussion", sourceNo:"3", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"১৯৯৪ সালের ১ ডিসেম্বর বৃহস্পতিবার হলে ১৯৯৫ সালের একই তারিখ কি বার হবে?", opts:["বৃহস্পতিবার", "শুক্রবার", "বুধবার", "শনিবার"], ans:1, sol:"১৯৯৪ ডিসেম্বর১ থেকে ১৯৯৫ ডিসেম্বর১ পর্যন্ত ৩৬৫ দিন (কোনো অধিবর্ষ ফেব্রুয়ারি ২৯ মাঝে পড়েনি)। ৩৬৫÷৭ ভাগশেষ ১, তাই বার এক ধাপ এগিয়ে বৃহস্পতিবার→শুক্রবার।", year:"৩৮তম বিসিএস", src:true},
  {id:"l8cd_day4", lec:"lec8", section:"contentDiscussion", sourceNo:"4", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"২০০৯ সালের ২৮ আগস্ট শুক্রবার ছিল। ঐ বছরের ১ অক্টোবর কি বার ছিল?", opts:["বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"], ans:1, sol:"২৮ আগস্ট থেকে ১ অক্টোবর পর্যন্ত দিন সংখ্যা= (৩১-২৮)+৩০+১=৩৪ দিন। ৩৪÷৭ ভাগশেষ ৬। শুক্রবার+৬=বৃহস্পতিবার।", year:"৩৭তম বিসিএস", src:true},
  {id:"l8cd_day5", lec:"lec8", section:"contentDiscussion", sourceNo:"5", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"১৭ দিন আগে আবদুর রহিম বলেছিল যে তার জন্মদিন 'আগামীকাল'। আজ ২৩ তারিখ হলে, তার জন্মদিন কোন তারিখে?", opts:["৭", "৮", "৯", "১০"], ans:0, sol:"১৭ দিন আগে=২৩-১৭=৬ তারিখ। সেদিন থেকে 'আগামীকাল'=৭ তারিখ, যা তার জন্মদিন।", year:"৩৪তম বিসিএস", src:true},
  {id:"l8cd_day6", lec:"lec8", section:"contentDiscussion", sourceNo:"6", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"চলতি বছর অর্থাৎ ২০০৯ সালের ১ জানুয়ারি বৃহস্পতিবার ছিল। এ বছরের ৩১ ডিসেম্বর কি বার হবে?", opts:["সোমবার", "বৃহস্পতিবার", "বুধবার", "শনিবার"], ans:1, sol:"২০০৯ অধিবর্ষ নয় (৩৬৫ দিন)। জানুয়ারি১ থেকে ডিসেম্বর৩১ পর্যন্ত ৩৬৪ দিন পার হয়, যা ৭-এ নিঃশেষে বিভাজ্য (৩৬৪=৫২×৭), তাই বার একই থাকবে — বৃহস্পতিবার।", year:"৩০তম বিসিএস", src:true},
  {id:"l8cd_day7", lec:"lec8", section:"contentDiscussion", sourceNo:"7", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"চলতি বছর অর্থাৎ ২০১০ সালের ১লা জানুয়ারি শুক্রবার ছিল। এ বছর ৩১ ডিসেম্বর কি বার হবে?", opts:["রবিবার", "বুধবার", "শুক্রবার", "সোমবার"], ans:2, sol:"২০১০ অধিবর্ষ নয়, তাই জানুয়ারি১ থেকে ডিসেম্বর৩১ পর্যন্ত ৩৬৪ দিন (৭-এ নিঃশেষে বিভাজ্য), বার অপরিবর্তিত থাকবে — শুক্রবার।", year:"৩০তম ও ২৯তম বিসিএস", src:true},
  {id:"l8cd_day8", lec:"lec8", section:"contentDiscussion", sourceNo:"8", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"আগামী পরশু রফিকের জন্মদিন। পরের সপ্তাহের সেই দিনে একটি উৎসব। আজ রবিবার হলে উৎসবের পরের দিন কি বার হবে?", opts:["মঙ্গলবার", "বুধবার", "রবিবার", "শুক্রবার"], ans:1, sol:"আগামী পরশু=আজ+২=রবিবার+২=মঙ্গলবার (রফিকের জন্মদিনের বার)। পরের সপ্তাহের সেই দিনও মঙ্গলবার (৭ দিন পর, বার অপরিবর্তিত) — এটিই উৎসবের দিন। উৎসবের পরের দিন=মঙ্গলবার+১=বুধবার।", year:"৩০তম বিসিএস", src:true},
  {id:"l8cd_day9", lec:"lec8", section:"contentDiscussion", sourceNo:"9", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"If the second day of month is a Monday, the eighteenth day of the month is a-", opts:["Sunday", "Tuesday", "Wednesday", "Monday"], ans:2, sol:"১৮-২=১৬ দিন পর। ১৬÷৭ ভাগশেষ ২। সোমবার+২=বুধবার।", year:"২৮তম বিসিএস", src:true},
  {id:"l8cd_day10", lec:"lec8", section:"contentDiscussion", sourceNo:"10", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"১৯৯৪ সালের ১ ডিসেম্বর বৃহস্পতিবার হলে, ১৯৯৫ সালের ঐ একই তারিখে হবে-", opts:["বৃহস্পতিবার", "শুক্রবার", "রবিবার", "শনিবার"], ans:1, sol:"আইটেম ৩-এর অনুরূপ হিসাব: ৩৬৫ দিন পর, ভাগশেষ ১, তাই বৃহস্পতিবার→শুক্রবার।", year:"১৭তম বিসিএস", src:true},
  {id:"l8cd_day11", lec:"lec8", section:"contentDiscussion", sourceNo:"11", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"১৯৯৯ সালের ১ ফেব্রুয়ারি সোমবার হলে ১৯৯৮ সনের ১ ফেব্রুয়ারি কি বার ছিল?", opts:["রবিবার", "সোমবার", "শনিবার", "মঙ্গলবার"], ans:0, sol:"১৯৯৮ সালের ১ ফেব্রুয়ারি থেকে ১৯৯৯ সালের ১ ফেব্রুয়ারি পর্যন্ত সময়কালে কোনো অধিবর্ষের ফেব্রুয়ারি ২৯ পড়েনি (১৯৯৮ অধিবর্ষ নয়), তাই ৩৬৫ দিন, ভাগশেষ ১। পেছনের দিকে হিসাব করলে সোমবার-১=রবিবার।", src:true},
  {id:"l8sw_day1", lec:"lec8", section:"studentWork", sourceNo:"1", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"যদি কোন মাসের তৃতীয় দিনটি শুক্রবার হয়, তাহলে ২১-র পর কোন দিনটি হবে চতুর্থ দিন?", opts:["সোমবার", "বৃহস্পতিবার", "শনিবার", "মঙ্গলবার"], ans:2, sol:"৩ তারিখ=শুক্রবার। ২১ তারিখ=৩+১৮ দিন পর; ১৮÷৭ ভাগশেষ ৪, শুক্রবার+৪=মঙ্গলবার। ২১-এর পর চতুর্থ দিন=২৫ তারিখ=২১+৪ দিন পর=মঙ্গলবার+৪=শনিবার।", src:true},
  {id:"l8sw_day2", lec:"lec8", section:"studentWork", sourceNo:"2", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"আমার জন্মদিন হল আমার ভাইয়ের জন্মদিনের ৬৪ দিন পরে। আমার ভাইয়ের জন্মদিন যদি সোমবারে পড়ে, আমার জন্মদিন কি বারে হবে?", opts:["মঙ্গলবার", "রবিবার", "শনিবার", "বুধবার"], ans:0, sol:"৬৪÷৭ ভাগশেষ ১ (৬৪=৯×৭+১)। সোমবার+১=মঙ্গলবার।", src:true},
  {id:"l8sw_day3", lec:"lec8", section:"studentWork", sourceNo:"3", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"আমার ভাই আমার থেকে ৩৫২ দিনের বড়, আবার আমার বোন, ভাইয়ের থেকে ৬৫ সপ্তাহের বড়। আমার বোনের জন্ম যদি শনিবার হয়, তাহলে আমি কি বারে জন্মেছিলাম?", opts:["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার"], ans:1, sol:"৬৫ সপ্তাহ=৬৫×৭=৪৫৫ দিন (৭-এ নিঃশেষে বিভাজ্য, ভাগশেষ ০), তাই ভাইয়ের জন্মদিনও শনিবার (বোনের মতো একই বার, বোন ভাইয়ের চেয়ে ৬৫ সপ্তাহ *পরে* জন্মেছে ধরে)। ভাই আমার চেয়ে ৩৫২ দিনের বড় (অর্থাৎ আমি ভাইয়ের ৩৫২ দিন পরে জন্মেছি)। ৩৫২÷৭ ভাগশেষ ২ (৩৫২=৫০×৭+২)। শনিবার+২=সোমবার।", src:true},
  {id:"l8sw_day4", lec:"lec8", section:"studentWork", sourceNo:"4", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"আমার ভাই আমার থেকে ৫৬২ দিনের বড়, আমার বোন, ভাইয়ের থেকে ৭৫ সপ্তাহের বড়। যদি আমার বোন মঙ্গলবারে জন্মায়, আমি কোন দিনে জন্মেছিলাম?", opts:["রবিবার", "বৃহস্পতিবার", "বুধবার", "শনিবার"], ans:1, sol:"৭৫ সপ্তাহ=৭৫×৭=৫২৫ দিন (৭-এ নিঃশেষে বিভাজ্য), তাই ভাইয়ের জন্মদিনও মঙ্গলবার। ৫৬২÷৭ ভাগশেষ ২ (৫৬২=৮০×৭+২)। আমি ভাইয়ের ৫৬২ দিন পরে জন্মেছি, তাই মঙ্গলবার+২=বৃহস্পতিবার।", src:true},
  {id:"l8sw_day5", lec:"lec8", section:"studentWork", sourceNo:"5", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"পরশুদিন যদি শুক্রবার হয়, তাহলে গতকাল কি বার ছিল?", opts:["রবিবার", "মঙ্গলবার", "বুধবার", "শনিবার"], ans:1, sol:"পরশু=আজ+২=শুক্রবার, তাই আজ=বুধবার। গতকাল=আজ-১=মঙ্গলবার।", src:true},
  {id:"l8sw_day6", lec:"lec8", section:"studentWork", sourceNo:"6", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"একটি আয়নায় দেখলে যদি মনে হয় ঘড়িতে এখন ৯.৩০ মিনিট বাজে, তাহলে তখন আসল সময় কত?", opts:["৪.৩০", "৬.৩০", "২.৩০", "৬.১০"], ans:2, sol:"আয়নার সময়=১১:৬০-প্রকৃত সময় সূত্র প্রয়োগ করে: ১২:০০-৯:৩০=২:৩০। প্রকৃত সময়=২.৩০।", src:true},
  {id:"l8sw_day7", lec:"lec8", section:"studentWork", sourceNo:"7", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"The Day that will come after two days after tomorrow will be Friday. What was the day that dawned two days before yesterday?", opts:["Friday", "Saturday", "Sunday", "Monday"], ans:0, sol:"আজ+২(tomorrow)+২(after two days)=আজ+৪=শুক্রবার, তাই আজ=সোমবার। গতকালের ২ দিন আগে=আজ-১-২=আজ-৩=সোমবার-৩=শুক্রবার।", src:true},
  {id:"l8sw_day8", lec:"lec8", section:"studentWork", sourceNo:"8", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"If the 23rd of July falls on the day proceeding Friday, on what day will the 8th of the month fall?", opts:["Monday", "Sunday", "Wednesday", "Thursday"], ans:2, sol:"২৩ তারিখ=বৃহস্পতিবার (শুক্রবারের ঠিক আগের দিন)। ৮ তারিখ থেকে ২৩ তারিখ পর্যন্ত ১৫ দিনের ব্যবধান; ১৫÷৭ ভাগশেষ ১, তাই ৮ তারিখ=বৃহস্পতিবার-১=বুধবার।", src:true},
  {id:"l8sw_day9", lec:"lec8", section:"studentWork", sourceNo:"9", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"If the day that will dawn two days after tomorrow is Monday, what day of the week dawned day before yesterday?", opts:["Tuesday", "Friday", "Wednesday", "Thursday"], ans:1, sol:"আজ+২(tomorrow)+২=আজ+৪=সোমবার, তাই আজ=বৃহস্পতিবার। গতকালের আগের দিন=আজ-২=মঙ্গলবার।", src:true},
  {id:"l8sw_day10", lec:"lec8", section:"studentWork", sourceNo:"10", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"Reaching a place of appointment day before yesterday, I found myself three days late. If day after tomorrow is Tuesday, on what day should I have reached there?", opts:["Sunday", "Tuesday", "Saturday", "Thursday"], ans:1, sol:"আজ+২(day after tomorrow)=মঙ্গলবার, তাই আজ=রবিবার। গতকালের আগের দিন (day before yesterday)=আজ-২=শুক্রবার (যেদিন পৌঁছেছি)। ৩ দিন দেরিতে পৌঁছেছি মানে নির্ধারিত দিন ছিল তার ৩ দিন আগে=শুক্রবার-৩=মঙ্গলবার।", src:true},
  {id:"l8sw_day11", lec:"lec8", section:"studentWork", sourceNo:"11", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"If Friday dawned three days before yesterday, what day will dawn three days after tomorrow?", opts:["Sunday", "Saturday", "Monday", "Tuesday"], ans:1, sol:"গতকালের ৩ দিন আগে=শুক্রবার, তাই গতকাল=সোমবার, আজ=মঙ্গলবার। আগামীকালের ৩ দিন পরে=আজ+১+৩=আজ+৪=মঙ্গলবার+৪=শনিবার।", src:true},
  {id:"l8sw_day12", lec:"lec8", section:"studentWork", sourceNo:"12", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"A মনে করতে চাইল তার কাকা তাদের দেখতে এসেছিল কোন মাসের ১৩ তারিখের পরে, কিন্তু ১৮ তারিখের আগে, আবার B মনে করলো কাকা তাদের দেখতে এসেছিল ১৬ তারিখের পর কিন্তু ২০ তারিখের আগে। কত তারিখে কাকা A ও B এর সাথে দেখা করতে এসেছিল?", opts:["১৪", "১৬", "১৫", "১৭"], ans:3, sol:"A অনুযায়ী সম্ভাব্য তারিখ: ১৪,১৫,১৬,১৭। B অনুযায়ী সম্ভাব্য তারিখ: ১৭,১৮,১৯। উভয়ের মিলনস্থল=১৭ তারিখ।", src:true},
  {id:"l8sw_day13", lec:"lec8", section:"studentWork", sourceNo:"13", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"জ্যোতি মনে করলো তার ভাইয়ের জন্মদিন ১৭ তারিখের পর, কিন্তু ২১ শে ফেব্রুয়ারির আগে। কিন্তু তার ভাই মনে করলো তার জন্মদিন ১৯ তারিখের পরে কিন্তু ২৪ ফেব্রুয়ারি তারিখের আগে। কোন দিনটা তাহলে তার জন্মদিন?", opts:["২২ শে ফেব্রুয়ারি", "২১ শে ফেব্রুয়ারি", "১৮ই ফেব্রুয়ারি", "২০ শে ফেব্রুয়ারি"], ans:3, sol:"জ্যোতি অনুযায়ী সম্ভাব্য তারিখ: ১৮,১৯,২০। ভাই অনুযায়ী সম্ভাব্য তারিখ: ২০,২১,২২,২৩। উভয়ের মিলনস্থল=২০ ফেব্রুয়ারি।", src:true},
  {id:"l8sw_day14", lec:"lec8", section:"studentWork", sourceNo:"14", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"লোকেশ মনে করল তার ভাই লক্ষ্মণের জন্মদিন হল ২০ তারিখের পরে কিন্তু ২৮ তারিখের আগে। রীতা আবার মনে করল লক্ষ্মণের জন্মদিন ১২ তারিখের পরে কিন্তু ২২ শে আগস্টের আগে। লক্ষ্মণের জন্মদিন কবে?", opts:["২০ শে আগস্ট", "২১ শে আগস্ট", "২২ আগস্ট", "সিদ্ধান্তে আসা যাচ্ছে না"], ans:1, sol:"লোকেশ অনুযায়ী সম্ভাব্য তারিখ: ২১-২৭। রীতা অনুযায়ী সম্ভাব্য তারিখ: ১৩-২১। উভয়ের মিলনস্থল=শুধু ২১ তারিখ।", src:true},
  {id:"l8sw_day15", lec:"lec8", section:"studentWork", sourceNo:"15", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"If Wednesday falls on the 4th of the month, what day will dawn three weeks preceding the 24th of the month?", opts:["Saturday", "Monday", "Wednesday", "Tuesday"], ans:3, sol:"৪ তারিখ=বুধবার। ২৪ তারিখের তিন সপ্তাহ (২১ দিন) আগে = ২৪-২১=৩ তারিখ। ৩ তারিখ = ৪ তারিখের ঠিক একদিন আগে = মঙ্গলবার।", src:true, needsVerification:true, verifyNote:"উৎসের ইংরেজি প্রশ্নে লেখা ছিল 'three days preceding' কিন্তু সেই অনুযায়ী হিসাব করলে (২৪-৩=২১ তারিখ) ফলাফল হয় শনিবার, যা উৎসের নিজস্ব হাইলাইট-করা উত্তর (Tuesday)-এর সাথে মেলে না। কিন্তু 'three days' এর বদলে 'three weeks' (তিন সপ্তাহ) ধরে হিসাব করলে (২৪-২১=৩ তারিখ=মঙ্গলবার) হাইলাইট-করা উত্তরের সাথে নিখুঁতভাবে মিলে যায় — তাই সম্ভবত উৎসের ইংরেজি অনুবাদে 'সপ্তাহ'-কে ভুলবশত 'days' লেখা হয়েছে। এই ধারণা অনুযায়ী প্রশ্নটি সংশোধন করে দেখানো হয়েছে।"},
  {id:"l8sw_day16", lec:"lec8", section:"studentWork", sourceNo:"16", topic:"বার ও সময় নির্ণয় (Find out the Day & Time)", q:"১৯৯৯ সালের ১ ফেব্রুয়ারি সোমবার হলে ১৯৯৮ সনের ১ ফেব্রুয়ারি কি বার ছিল?", opts:["রবিবার", "সোমবার", "শনিবার", "মঙ্গলবার"], ans:0, sol:"আইটেম ১১-এর (Teacher's Work) অনুরূপ হিসাব: ৩৬৫ দিন আগে, ভাগশেষ ১, সোমবার-১=রবিবার।", src:true},

  {id:"l9cd1", lec:"lec9", section:"contentDiscussion", sourceNo:"1", topic:"উৎপাদক (Factorization)", q:"a³ – 1 এর একটি উৎপাদক (a – 1) হলে অপরটি কত?", opts:["a + 1", "a² – 1", "a² + a + 1", "a² – a + 1"], ans:2, sol:"a³-1=(a-1)(a²+a+1), তাই অপর উৎপাদক a²+a+1।", src:true},
  {id:"l9cd2", lec:"lec9", section:"contentDiscussion", sourceNo:"2", topic:"উৎপাদক (Factorization)", q:"a⁴ + 4 এর উৎপাদক কি কি?", opts:["(a² + 2 + 2)(a² + 2a – 2)", "(a² + 2a + 2)(a² – 2a + 2)", "(a² – 2 + 2)(a² + 2a – 2)", "(a² – 2 – 2)(a² – 2a + 2)"], ans:1, sol:"সোফি জার্মেই অভেদ প্রয়োগ করে: a⁴+4=(a²)²+2²=(a²+2)²-(2a)²=(a²+2a+2)(a²-2a+2)।", year:"১২তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎসের মূল প্রশ্নে সম্ভবত \"a⁴+4\" ছিল, কিন্তু টেক্সট-নিষ্কাশনে সুপারস্ক্রিপ্ট হারিয়ে \"a²+4\" দেখাচ্ছিল (যার প্রকৃতপক্ষে এই আকারে কোনো সাধারণ বীজগাণিতিক উৎপাদক নেই)। সোফি জার্মেই অভেদ অনুযায়ী a⁴+4 ধরে সমাধান করা হয়েছে, যা বিকল্পগুলোর গঠনের সাথেও সামঞ্জস্যপূর্ণ।"},
  {id:"l9cd3", lec:"lec9", section:"contentDiscussion", sourceNo:"3", topic:"উৎপাদক (Factorization)", q:"x² – y² + 2y – 1 এর একটি উৎপাদক-", opts:["x + y + 1", "x – y", "x + y – 1", "x – y – 1"], ans:2, sol:"x²-(y²-2y+1)=x²-(y-1)²=(x-y+1)(x+y-1)। তাই একটি উৎপাদক x+y-1।", year:"৩২তম ও ২৬তম বিসিএস", src:true},
  {id:"l9cd4", lec:"lec9", section:"contentDiscussion", sourceNo:"4", topic:"উৎপাদক (Factorization)", q:"2x² + x – 15 এর উৎপাদক কোনটি?", opts:["(x + 3)(2x – 5)", "(x – 3)(2x – 5)", "(x – 3)(2x + 5)", "(x + 3)(2x + 5)"], ans:0, sol:"2x²+x-15=(x+3)(2x-5) (বিস্তার করে যাচাই: 2x²-5x+6x-15=2x²+x-15)।", year:"২৪তম বিসিএস", src:true},
  {id:"l9cd5", lec:"lec9", section:"contentDiscussion", sourceNo:"5", topic:"উৎপাদক (Factorization)", q:"2x² – x – 3 এর উৎপাদক কি কি?", opts:["(2x + 3)(x + 1)", "(2x + 3)(x – 1)", "(2x – 3)(x – 1)", "(2x – 3)(x + 1)"], ans:3, sol:"2x²-x-3=(2x-3)(x+1) (বিস্তার করে যাচাই: 2x²+2x-3x-3=2x²-x-3)।", year:"১২তম বিসিএস", src:true},
  {id:"l9cd6", lec:"lec9", section:"contentDiscussion", sourceNo:"6", topic:"উৎপাদক (Factorization)", q:"3x³ + 2x² – 21x – 20 রাশিটির একটি উৎপাদক হচ্ছে-", opts:["x + 2", "x – 2", "x + 1", "x – 1"], ans:2, sol:"x=-1 বসালে রাশিটি শূন্য হয় (3(-1)+2(1)+21-20=0), তাই (x+1) একটি উৎপাদক।", year:"৩০তম বিসিএস", src:true},
  {id:"l9cd7", lec:"lec9", section:"contentDiscussion", sourceNo:"7", topic:"ল.সা.গু ও গ.সা.গু (LCM & GCD)", q:"x³ + x²y, x²y + xy² এর ল.সা.গু কোনটি?", opts:["xy", "x + y", "xy(x + y)", "x²y(x + y)"], ans:3, sol:"১ম রাশি=x²(x+y), ২য় রাশি=xy(x+y)। ল.সা.গু=x²y(x+y) (প্রতিটি উৎপাদকের সর্বোচ্চ ঘাত নিয়ে)।", year:"৩২তম বিসিএস", src:true},
  {id:"l9cd8", lec:"lec9", section:"contentDiscussion", sourceNo:"8", topic:"ল.সা.গু ও গ.সা.গু (LCM & GCD)", q:"(4x² – 16) এবং 6x² + 24x + 24 এর গ.সা.গু?", opts:["x + 2", "x + 4", "x + 2²", "2(x + 2)"], ans:3, sol:"১ম রাশি=4(x-2)(x+2), ২য় রাশি=6(x+2)²। সাধারণ উৎপাদক=2(x+2) (সংখ্যার গ.সা.গু ২, এবং (x+2) সর্বনিম্ন ঘাতে)।", year:"৩১তম বিসিএস", src:true},
  {id:"l9cd9", lec:"lec9", section:"contentDiscussion", sourceNo:"9", topic:"ল.সা.গু ও গ.সা.গু (LCM & GCD)", q:"(x² – 11x + 30) ও (x³ – 4x² – 2x – 15) এর গ.সা.গু. কত?", opts:["x – 5", "x – 6", "x² + x + 3", "x² – x + 3"], ans:0, sol:"১ম রাশি=(x-5)(x-6)। x=5 বসালে ২য় রাশি শূন্য হয় (125-100-10-15=0), তাই ২য় রাশি=(x-5)(x²+x+3)। সাধারণ উৎপাদক=(x-5)।", year:"২৫তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে দ্বিতীয় রাশিতে \"-2x\" পদটি টেক্সট-নিষ্কাশনে হারিয়ে গিয়ে \"x³-4x²-15\" দেখাচ্ছিল; একটি স্বতন্ত্র বহিঃস্থ উৎস থেকে ২৫তম বিসিএসের এই প্রশ্নের সঠিক রাশি (x³-4x²-2x-15) নিশ্চিত হওয়া গেছে।"},
  {id:"l9cd10", lec:"lec9", section:"contentDiscussion", sourceNo:"10", topic:"সূচক (Exponents/Indices)", q:"2ˣ + 2¹⁻ˣ = 3 হলে, x = কত?", opts:["১, ২", "০, ২", "১, ৩", "০, ১"], ans:3, sol:"t=2ˣ ধরলে সমীকরণ: t+2/t=3 ⟹ t²-3t+2=0 ⟹ (t-1)(t-2)=0 ⟹ t=1 বা t=2 ⟹ x=0 বা x=1।", year:"৩৮তম বিসিএস", src:true},
  {id:"l9cd11", lec:"lec9", section:"contentDiscussion", sourceNo:"11", topic:"সূচক (Exponents/Indices)", q:"aᵐ·aⁿ = aᵐ⁺ⁿ কখন হবে?", opts:["m ধনাত্মক হলে", "n ধনাত্মক হলে", "m ও n ধনাত্মক হলে", "m ও n ঋণাত্মক হলে"], ans:2, sol:"সূচকের সূত্র aᵐ·aⁿ=aᵐ⁺ⁿ যেকোনো বাস্তব m,n-এর জন্য সত্য (a>0 হলে); তবে উৎসের প্রশ্নের প্রেক্ষাপটে সাধারণ/স্বাভাবিক ব্যবহারের শর্ত হিসেবে m ও n উভয়ে ধনাত্মক ধরা হয়েছে।", year:"১৪তম বিসিএস", src:true, needsVerification:true, verifyNote:"গাণিতিকভাবে এই সূত্রটি m,n-এর যেকোনো বাস্তব মানের জন্যই সত্য (শর্তহীন অভেদ), তাই প্রশ্নটির \"কখন হবে\" অংশ কিছুটা দ্ব্যর্থবোধক। উৎসে এই প্রশ্নের কোনো সমাধান/উত্তর-কী দেখানো হয়নি বলে প্রচলিত পাঠ্যবই-সম্মত ব্যাখ্যা (উভয়ে ধনাত্মক) অনুসরণ করা হয়েছে।"},
  {id:"l9cd12", lec:"lec9", section:"contentDiscussion", sourceNo:"12", topic:"সূচক (Exponents/Indices)", q:"m > n হলে aᵐ⁺ⁿ × aᵐ⁻ⁿ এর মান কত?", opts:["a²ᵐ", "a²ⁿ", "a²ᵐ⁻²ⁿ", "aᵐⁿ"], ans:0, sol:"aᵐ⁺ⁿ×aᵐ⁻ⁿ=a⁽ᵐ⁺ⁿ⁾⁺⁽ᵐ⁻ⁿ⁾=a²ᵐ।", src:true},
  {id:"l9cd13", lec:"lec9", section:"contentDiscussion", sourceNo:"13", topic:"সূচক (Exponents/Indices)", q:"(5ⁿ⁺² + 35×5ⁿ⁻¹)/(4×5ⁿ) এর মান কত?", opts:["4", "8", "5", "7"], ans:1, sol:"লব=5ⁿ(5²+35×5⁻¹)=5ⁿ(25+7)=5ⁿ×32। ভাগফল=32/4=8।", year:"৩৪তম বিসিএস", src:true},
  {id:"l9cd14", lec:"lec9", section:"contentDiscussion", sourceNo:"14", topic:"সূচক (Exponents/Indices)", q:"∛(∛(a³)) = কত?", opts:["a", "1", "a^(1/3)", "a³"], ans:2, sol:"ভেতরের ঘনমূল: ∛(a³)=a। বাইরের ঘনমূল: ∛a=a^(1/3)।", year:"৩৩তম বিসিএস", src:true},
  {id:"l9cd15", lec:"lec9", section:"contentDiscussion", sourceNo:"15", topic:"সূচক (Exponents/Indices)", q:"4ˣ + 4ˣ + 4ˣ + 4ˣ এর মান নিচের কোনটি?", opts:["16ˣ", "4⁴ˣ", "2²ˣ⁺²", "2⁸ˣ"], ans:2, sol:"4×4ˣ=4ˣ⁺¹=(2²)ˣ⁺¹=2²ˣ⁺²।", year:"৩৩তম বিসিএস", src:true},
  {id:"l9cd16", lec:"lec9", section:"contentDiscussion", sourceNo:"16", topic:"সূচক (Exponents/Indices)", q:"(∛2 × ∛6)⁶ = কত?", opts:["12", "48", "36", "144"], ans:3, sol:"∛2×∛6=∛(2×6)=∛12=12^(1/3)। ষষ্ঠ ঘাত করলে: (12^(1/3))⁶=12²=144।", year:"৩৩তম বিসিএস", src:true, needsVerification:true, verifyNote:"উৎস পিডিএফে প্রথম রাশিমূলের ভেতরের সংখ্যাটি (২ না ৩) সুনির্দিষ্টভাবে পড়া কঠিন ছিল। \"৩\" ধরে হিসাব করলে (∛3×∛6)⁶=18²=324 (কোনো বিকল্পের সাথে মেলে না), কিন্তু \"২\" ধরলে (∛2×∛6)⁶=12²=144 (বিকল্প ঘ-এর সাথে নিখুঁতভাবে মেলে) — তাই সংখ্যাটি ২ ধরে নেওয়া হয়েছে।"},
  {id:"l9cd17", lec:"lec9", section:"contentDiscussion", sourceNo:"17", topic:"লগারিদম (Logarithm)", q:"logₓ(1/8) = –2 হলে x = কত?", opts:["2√2", "√2", "২", "৪"], ans:0, sol:"x⁻²=1/8 ⟹ x²=8 ⟹ x=√8=2√2।", year:"৩৮তম বিসিএস", src:true},
  {id:"l9cd18", lec:"lec9", section:"contentDiscussion", sourceNo:"18", topic:"লগারিদম (Logarithm)", q:"log₂8 = কত?", opts:["2", "3", "2", "1"], ans:1, sol:"log₂8=log₂2³=3।", year:"৩২তম বিসিএস", src:true},
  {id:"l9cd19", lec:"lec9", section:"contentDiscussion", sourceNo:"19", topic:"লগারিদম (Logarithm)", q:"log_√3(81) = কত?", opts:["4", "27√3", "8", "1/8"], ans:2, sol:"81=3⁴, √3=3^(1/2)। log_{3^(1/2)}(3⁴)=4÷(1/2)=8।", year:"৩৬তম বিসিএস", src:true},
  {id:"l9cd20", lec:"lec9", section:"contentDiscussion", sourceNo:"20", topic:"লগারিদম (Logarithm)", q:"log₃(1/9) এর মান-", opts:["2", "–2", "3", "–3"], ans:1, sol:"log₃(1/9)=log₃(3⁻²)=–2।", year:"৩৫তম বিসিএস", src:true},
  {id:"l9cd21", lec:"lec9", section:"contentDiscussion", sourceNo:"21", topic:"লগারিদম (Logarithm)", q:"logₐx=1, logₐy=2 এবং logₐz=3 হলে, logₐ(x³y²/z) এর মান কত?", opts:["1", "2", "4", "5"], ans:2, sol:"logₐ(x³y²/z)=3logₐx+2logₐy-logₐz=3(1)+2(2)-3=4।", year:"৩৫তম বিসিএস", src:true},
  {id:"l9cd22", lec:"lec9", section:"contentDiscussion", sourceNo:"22", topic:"লগারিদম (Logarithm)", q:"logₓ(3/2)=–1/2 হলে, x এর মান-", opts:["4/9", "9/4", "√(3/2)", "√(2/3)"], ans:0, sol:"x^(-1/2)=3/2 ⟹ x^(1/2)=2/3 ⟹ x=(2/3)²=4/9।", year:"৩৭তম বিসিএস", src:true},
  {id:"l9sw1", lec:"lec9", section:"studentWork", sourceNo:"1", topic:"উৎপাদক (Factorization)", q:"কোনটি a³ + 1এর উৎপাদন?", opts:["(a + b)(a + 1)(a – 1)", "(a + 1)(a² – a + 1)", "(a + 1)(a² + a + 1)", "(a – b)(a² – a + 1)"], ans:1, sol:"a³+1=(a+1)(a²-a+1)।", src:true},
  {id:"l9sw2", lec:"lec9", section:"studentWork", sourceNo:"2", topic:"উৎপাদক (Factorization)", q:"x⁶ – y⁶ এর উৎপাদক কোনটি?", opts:["(x + y)(x – y)(x² + xy + y²)(x² – xy + y²)", "(x³ + y³)(x³ – y³)", "(x + y)(x – y)(x² + 2xy)(x² – xy + y²)", "(x² – y²)(x² + xy + y²)(x² – xy + y²)"], ans:0, sol:"x⁶-y⁶=(x³)²-(y³)²=(x³+y³)(x³-y³)=(x+y)(x²-xy+y²)(x-y)(x²+xy+y²)।", src:true},
  {id:"l9sw3", lec:"lec9", section:"studentWork", sourceNo:"3", topic:"উৎপাদক (Factorization)", q:"4x⁴ + 1 কে উৎপাদকে বিশ্লেষণ করুন।", opts:["(2x² + 2x – 1)(2x² – 2x + 1)", "(2x² + 2x + 1)(2x² – 2x + 1)", "(2x² + 2x - 1)(2x² – 2x – 1)", "(2x² + 2x + 1)(2x² – 2x – 1)"], ans:1, sol:"4x⁴+1=(2x²)²+1²=(2x²+1)²-2×2x²×1=(2x²+1)²-(2x)²=(2x²+2x+1)(2x²-2x+1)।", src:true},
  {id:"l9sw4", lec:"lec9", section:"studentWork", sourceNo:"4", topic:"উৎপাদক (Factorization)", q:"a³ – 7a – 6 এর উৎপাদক কত?", opts:["(a + 1)(a – 2)(a – 3)", "(a – 1)(a + 2)(a – 3)", "(a + 1)(a + 2)(a – 3)", "(a – 1)(a – 2)(a – 3)"], ans:2, sol:"a³-7a-6=a³+a²-a²-a-6a-6=a²(a+1)-a(a+1)-6(a+1)=(a+1)(a²-a-6)=(a+1)(a+2)(a-3)।", src:true},
  {id:"l9sw5", lec:"lec9", section:"studentWork", sourceNo:"5", topic:"উৎপাদক (Factorization)", q:"x² – 3x – 10 এর সঠিক উৎপাদক কোন দুটি?", opts:["(x – 2)(x + 5)", "(x + 2)(x – 5)", "(x + 3)(x – 5)", "(x + 5)(x – 3)"], ans:1, sol:"x²-3x-10=x²-5x+2x-10=x(x-5)+2(x-5)=(x-5)(x+2)।", src:true},
  {id:"l9sw6", lec:"lec9", section:"studentWork", sourceNo:"6", topic:"উৎপাদক (Factorization)", q:"x² – x – 2 এর একটি উৎপাদক ?", opts:["x – 1", "x + 1", "x – 3", "x + 2"], ans:1, sol:"x²-x-2=x²-2x+x-2=(x-2)(x+1)।", src:true},
  {id:"l9sw7", lec:"lec9", section:"studentWork", sourceNo:"7", topic:"উৎপাদক (Factorization)", q:"x² – 3x + 2-এর একটি উৎপাদক কোনটি?", opts:["x + 1", "x – 1", "x + 2", "x – 3"], ans:1, sol:"x²-3x+2=x²-2x-x+2=x(x-2)-1(x-2)=(x-2)(x-1)।", src:true},
  {id:"l9sw8", lec:"lec9", section:"studentWork", sourceNo:"8", topic:"উৎপাদক (Factorization)", q:"উৎপাদক বিশ্লেষণ করুন: x² – 2ax + (a + b)(a – b)", opts:["(x – a + b)(x + a – b)", "(x – a – b)(x – a + b)", "(x + a – b)(x – a – b)", "(x + a + b)(x – a – b)"], ans:1, sol:"x²-2ax+(a²-b²)=(x-a)²-b²=(x-a+b)(x-a-b)।", src:true},
  {id:"l9sw9", lec:"lec9", section:"studentWork", sourceNo:"9", topic:"উৎপাদক (Factorization)", q:"(x – y)(y + 3) কোন রাশির উৎপাদক?", opts:["x² – 3y + 3", "xy – 3y + y²", "xy – y² – 3y + 3x", "xy – y² – 3y + 3x"], ans:2, sol:"(x-y)(y+3)=xy+3x-y²-3y।", src:true, needsVerification:true, verifyNote:"উৎসের চারটি বিকল্পের মধ্যে গ ও ঘ অভিন্ন দেখাচ্ছে (সম্ভবত নিষ্কাশন বা মূল বইয়ের ছাপার পুনরাবৃত্তি); স্বাধীন গণনায় সঠিক রাশি (xy-y²-3y+3x)-এর সাথে মিলিয়ে বিকল্প 'গ' নির্বাচন করা হয়েছে।"},
  {id:"l9sw10", lec:"lec9", section:"studentWork", sourceNo:"10", topic:"উৎপাদক (Factorization)", q:"a⁴ + a²b² + b⁴ এর একটি উৎপাদক a² + ab + b² হলে অপর উৎপাদক কত?", opts:["a² + ab + b²", "a² – ab + b²", "a² + b²", "a² – b²"], ans:1, sol:"a⁴+a²b²+b⁴=(a²+b²)²-(ab)²=(a²+ab+b²)(a²-ab+b²)।", src:true},
  {id:"l9sw11", lec:"lec9", section:"studentWork", sourceNo:"11", topic:"উৎপাদক (Factorization)", q:"(a – b)³ + (b – c)³ + (c – a)³ উৎপাদকে বিশ্লেষণ করুন।", opts:["9(a – b)(b – c)(c – a)", "3(a – b)(b – c)(c – a)", "–3(a – b)(b – c)(c – a)", "(a – b)(b – c)(c – a)"], ans:1, sol:"(a-b)+(b-c)+(c-a)=0 হওয়ায় অভেদ x³+y³+z³=3xyz (যখন x+y+z=0) প্রয়োগ করে: =3(a-b)(b-c)(c-a)।", src:true},
  {id:"l9sw12", lec:"lec9", section:"studentWork", sourceNo:"12", topic:"ল.সা.গু ও গ.সা.গু (LCM & GCD)", q:"x³ – 1, x³ + 1, x⁴ + x² + 1 এর ল.সা.গু. কত?", opts:["x⁸ – 1", "x⁷ – 1", "x⁶ – 1", "x⁵ – 1"], ans:2, sol:"১ম ও ২য় রাশির ল.সা.গু=(x³-1)(x³+1)=x⁶-1=(x²-1)(x⁴+x²+1)। ৩টি রাশির ল.সা.গু=(x²-1)(x⁴+x²+1)=x⁶-1।", src:true},
  {id:"l9sw13", lec:"lec9", section:"studentWork", sourceNo:"13", topic:"ল.সা.গু ও গ.সা.গু (LCM & GCD)", q:"4x²y²z এবং 6xy² এর ল.সা.গু কত?", opts:["24xyz", "16x²yz", "12x²y²z", "12xy²z"], ans:2, sol:"৪x²y²z=2×2×x²y²z, ৬xy²=2×3×xy²। ১ম ও ২য় রাশির x,y,z সহগুণিতকের ল.সা.গু=12। নির্ণেয় ল.সা.গু=12x²y²z।", src:true},
  {id:"l9sw14", lec:"lec9", section:"studentWork", sourceNo:"14", topic:"ল.সা.গু ও গ.সা.গু (LCM & GCD)", q:"ল.সা.গু নির্ণয় করুন: x² + 3x + 2, x² + x – 2", opts:["(x – 1)²(x + 1)", "(x – 1)(x + 1)(x + 2)", "(x – 2)(x + 2)(x + 1)", "(x + 1)²(x + 2)"], ans:1, sol:"১ম রাশি=x²+2x+x+2=(x+2)(x+1)। ২য় রাশি=x²+2x-x-2=(x+2)(x-1)। ল.সা.গু=(x+2)(x-1)(x+1)।", src:true},
  {id:"l9sw15", lec:"lec9", section:"studentWork", sourceNo:"15", topic:"ল.সা.গু ও গ.সা.গু (LCM & GCD)", q:"x³ – x – 24 এবং x³ – 6x² + 18x – 27 এর গ.সা.গু নির্ণয় করুন।", opts:["(x – 1)", "(x – 2)", "(x – 3)", "(x – 4)"], ans:2, sol:"১ম রাশি=x²(x-3)+3x(x-3)+8(x-3)=(x-3)(x²+3x+8)। ২য় রাশি=x²(x-3)-3x(x-3)+9(x-3)=(x-3)(x²-3x+9)। সাধারণ উৎপাদক=(x-3)।", src:true},
  {id:"l9sw16", lec:"lec9", section:"studentWork", sourceNo:"16", topic:"ল.সা.গু ও গ.সা.গু (LCM & GCD)", q:"(x–4)(2x–4)(x–4)(3x+1),(3x+1)(2x–1)(x–4) এর গ.সা.গু হবে-", opts:["(x – 4)", "(x – 4)(2x – 4)(2x – 1)(3x + 1)", "(x – 4)(2x – 1)", "(x – 4)(3x + 1)"], ans:1, sol:"১ম রাশি=(x-4)(2x-4)(x-4)(3x+1)=2(x-4)²(x-2)(3x+1)। ২য় রাশি=(3x+1)(2x-1)(x-4)। ল.সা.গু নয়, গ.সা.গু চাওয়া হয়েছে হলেও উৎসের সমাধান অনুযায়ী উভয় রাশির সকল উৎপাদক গুণ করে দেখানো হয়েছে।", src:true, needsVerification:true, verifyNote:"উৎসের প্রশ্নে \"গ.সা.গু\" চাওয়া হলেও উৎসের নিজস্ব সমাধানে ল.সা.গু-এর মতো সবগুলো উৎপাদক গুণ করে দেখানো হয়েছে — এটি উৎসের নিজস্ব একটি অসামঞ্জস্য হতে পারে। উৎসের ছাপা সমাধান/উত্তর সরাসরি ব্যবহার করা হয়েছে।"},
  {id:"l9sw17", lec:"lec9", section:"studentWork", sourceNo:"17", topic:"ল.সা.গু ও গ.সা.গু (LCM & GCD)", q:"ax² + 2a, x⁴ – 4, x⁴ + 4x² + 4 এদের গ. সা. ঊ কত?", opts:["1", "x² + 2", "x² – 2", "a(x² + 2)"], ans:1, sol:"১ম রাশি=a(x²+2)। ২য় রাশি=(x²-2)(x²+2)। ৩য় রাশি=(x²+2)²। সাধারণ উৎপাদক=x²+2।", src:true},
  {id:"l9sw18", lec:"lec9", section:"studentWork", sourceNo:"18", topic:"সূচক (Exponents/Indices)", q:"logbᵃ × logᵃb-এর মান কত?", opts:["1/2", "1", "1/2", "√2"], ans:1, sol:"logᵇᵃ×logᵃᵇ=1 (পারস্পরিক লগারিদমের গুণফল সর্বদা ১)।", src:true},
  {id:"l9sw19", lec:"lec9", section:"studentWork", sourceNo:"19", topic:"লগারিদম (Logarithm)", q:"log₂√6 + log₂√(2/3) = কত?", opts:["0", "2", "1", "3"], ans:2, sol:"log₂√6+log₂√2-log₂√3=log₂√2+log₂√3+log₂√2-log₂√3=2log₂√2=2×(1/2)log₂2=1।", src:true},
  {id:"l9sw20", lec:"lec9", section:"studentWork", sourceNo:"20", topic:"লগারিদম (Logarithm)", q:"log11 + log121 + log1331 + ......... ধারাটির প্রথম দশটি পদের সমষ্টি কত?", opts:["45 log 11", "55 log 11", "36 log 11", "66 log 11"], ans:1, sol:"log11+log(11)²+log(11)³+...+log(11)¹⁰=(1+2+...+10)log11=(10×11/2)log11=55log11।", src:true},
  {id:"l9sw21", lec:"lec9", section:"studentWork", sourceNo:"21", topic:"লগারিদম (Logarithm)", q:"1/log_a(abc) + 1/log_b(abc) + 1/log_c(abc) = কত?", opts:["0", "1", "1/2", "1/3"], ans:1, sol:"1/log_a(abc)=log_{abc}a (পারস্পরিক সম্পর্ক)। তাই সমষ্টি=log_{abc}a+log_{abc}b+log_{abc}c=log_{abc}(abc)=1।", src:true},
  {id:"l9sw22", lec:"lec9", section:"studentWork", sourceNo:"22", topic:"সূচক (Exponents/Indices)", q:"√[mn]{(xᵐ/xⁿ)} × √[ml]{(xⁿ/xˡ)} × √[lm]{(xˡ/xᵐ)} = কত?", opts:["0", "1", "x^(lmn)", "1/x^(lmn)"], ans:1, sol:"প্রতিটি পদকে সূচক আকারে লিখে যোগ করলে সূচকের সমষ্টি শূন্য হয়ে যায় (l/n-l/m+l/l-l/n+l/m-l/l=0), তাই ফলাফল x⁰=1।", src:true},
  {id:"l9sw23", lec:"lec9", section:"studentWork", sourceNo:"23", topic:"সূচক (Exponents/Indices)", q:"(xᵖ/xᵠ)^(p+q) · (xᵠ/xʳ)^(q+r) · (xʳ/xᵖ)^(r+p) = কত?", opts:["x^(p+q+r)", "1/x^(p+q+r)", "x^(p+q+r)", "1"], ans:3, sol:"সূচক বিস্তার করে যোগ করলে p²-q²+q²-r²+r²-p²=0, তাই ফলাফল x⁰=1।", src:true},
  {id:"l9sw24", lec:"lec9", section:"studentWork", sourceNo:"24", topic:"সূচক (Exponents/Indices)", q:"(aᵐ/aⁿ)¹ · (aⁿ/aˡ)ᵐ · (aˡ/aᵐ)ⁿ = কত?", opts:["0", "aˡᵐⁿ", "1", "1/a^(lmn)"], ans:2, sol:"সূচক বিস্তার করে যোগ করলে (m-n)+(n-l)m+(l-m)n=ml-nl+mn-lm+ln-mn=0, তাই ফলাফল a⁰=1।", src:true},
  {id:"l9sw25", lec:"lec9", section:"studentWork", sourceNo:"25", topic:"সূচক (Exponents/Indices)", q:"(1000)^(y/3) = 10 হলে y এর মান কত?", opts:["2", "1", "3", "25"], ans:1, sol:"1000^(y/3)=10 ⟹ (10³)^(y/3)=10¹ ⟹ 10^y=10¹ ⟹ y=1।", src:true},
  {id:"l9sw26", lec:"lec9", section:"studentWork", sourceNo:"26", topic:"সূচক (Exponents/Indices)", q:"{(x+y)⁻¹ – (x–y)⁻¹}⁻¹ × 2y(x² – y²)⁻¹ রাশিটির মান কত?", opts:["1", "0", "2", "–1"], ans:3, sol:"{(x+y)⁻¹-(x-y)⁻¹}⁻¹=(x-y-x-y)⁻¹/((x²-y²)⁻¹)... সরলীকরণে: {1/(x+y)-1/(x-y)}⁻¹=(x²-y²)/(-2y)। এর সাথে 2y/(x²-y²) গুণ করলে ফলাফল = -1।", src:true},
  {id:"l9sw27", lec:"lec9", section:"studentWork", sourceNo:"27", topic:"সূচক (Exponents/Indices)", q:"30 – {5⁻¹(2–3)⁻³}⁻² = কত?", opts:["29", "5", "20", "31"], ans:1, sol:"5⁻¹(2-3)⁻³=(1/5)×(-1)⁻³=(1/5)×(-1)=-1/5। {-1/5}⁻²=25। 30-25=5।", src:true},
  {id:"l9sw28", lec:"lec9", section:"studentWork", sourceNo:"28", topic:"লগারিদম (Logarithm)", q:"(x+y)/x + (x–y)/y – (x²–y²)/(xy) সমান কত?", opts:["y/x", "x/y", "2y/x", "2x/y"], ans:2, sol:"সাধারণ হর xy নিয়ে: (xy+y²+x²-xy-x²+y²)/xy=2y²/xy=2y/x।", src:true},
  {id:"l9sw29", lec:"lec9", section:"studentWork", sourceNo:"29", topic:"সূচক (Exponents/Indices)", q:"(a²–x²)/(a+y) × (a²–y²)/(ax+x²) × 1/(a–x) = ?", opts:["(a+y)/x", "(a–y)/x", "(x+a)/x", "(x–y)/a"], ans:1, sol:"(a+x)(a-x)/(a+y) × (a+y)(a-y)/(x(a+x)) × 1/(a-x) = (a-y)/x।", src:true},
  {id:"l9sw30", lec:"lec9", section:"studentWork", sourceNo:"30", topic:"সূচক (Exponents/Indices)", q:"(ab+b²)/(ab) ÷ (a+b)/a = কত?", opts:["(a+b)/a²", "a/b", "1", "(a–b)/a²"], ans:2, sol:"b(a+b)/(ab) × a/(a+b) = 1।", src:true},
  {id:"l9sw31", lec:"lec9", section:"studentWork", sourceNo:"31", topic:"সূচক (Exponents/Indices)", q:"b/((a–b)(b–c)) + a/((c–a)(a–b)) + c/((b–c)(c–a)) = কত?", opts:["1", "0", "(a+b+c)/((a–b)(b–c)(c–a))", "1/((a–b)(b–c)(c–a))"], ans:1, sol:"সাধারণ হর নিয়ে লব=b(c-a)+a(b-c)+c(a-b)=bc-ab+ab-ac+ca-bc=0। তাই ফলাফল=0।", src:true},
  {id:"l9sw32", lec:"lec9", section:"studentWork", sourceNo:"32", topic:"সূচক (Exponents/Indices)", q:"1/2 – 3/4 + 5/16 এর সাথে 4/25 এর গুণফল = ?", opts:["5", "2/5", "–1/5", "1 1/5"], ans:2, sol:"1/2-3/4+5/16=8/16-12/16+5/16=1/16। কিন্তু উৎসের সমাধানে ভিন্ন পদ্ধতিতে (গুণ আগে করে) হিসাব করে চূড়ান্ত ফলাফল -1/5 দেখানো হয়েছে।", src:true, needsVerification:true, verifyNote:"উৎসের ছাপা সমাধানে ধাপগুলো (গুণ ও যোগ-বিয়োগের ক্রম) কিছুটা অস্বাভাবিকভাবে সাজানো মনে হয়, তবে চূড়ান্ত উত্তর (-1/5, বিকল্প 'গ') উৎসে সরাসরি দেখানো হয়েছে বলে তা-ই ব্যবহার করা হলো।"},
  {id:"l9sw33", lec:"lec9", section:"studentWork", sourceNo:"33", topic:"সূচক (Exponents/Indices)", q:"x সংখ্যক আমের দাম y টাকা হলে, x টাকায় কতটি আম পাওয়া যাবে?", opts:["y/x", "x/y", "1/x", "x²/y"], ans:3, sol:"y টাকায় পাওয়া যায় x টি আম ⟹ ১ টাকায় x/y টি ⟹ x টাকায় x²/y টি।", src:true},
  {id:"l9sw34", lec:"lec9", section:"studentWork", sourceNo:"34", topic:"উৎপাদক (Factorization)", q:"16x² + px + 25 রাশিটি পূর্ণবর্গ হতে হলে p-এর মান কত হবে?", opts:["20", "10", "40", "15"], ans:2, sol:"4x=a, 5=b ধরে (a+b)²=(4x+5)²=16x²+25+40x। তাই p=40।", src:true},
  {id:"l9sw35", lec:"lec9", section:"studentWork", sourceNo:"35", topic:"উৎপাদক (Factorization)", q:"(a–b)/(ab) + (b–c)/(bc) + (c–a)/(ca) = কত?", opts:["0", "1", "1/2", "1/4"], ans:0, sol:"সাধারণ হর abc নিয়ে লব=(a-b)c+(b-c)a+(c-a)b=ca-bc+ab-ca+bc-ab=0।", src:true},
  {id:"l9sw36", lec:"lec9", section:"studentWork", sourceNo:"36", topic:"উৎপাদক (Factorization)", q:"(a+b)/(a–b) – (a–b)/(a+b) – 2ab/(a²–b²) = কত?", opts:["4ab/(a²–b²)", "2ab/(a²–b²)", "2ab/(a²+b²)", "0"], ans:1, sol:"(a+b)²-(a-b)²)/(a²-b²) - 2ab/(a²-b²) = 4ab/(a²-b²) - 2ab/(a²-b²) = 2ab/(a²-b²)।", src:true},
  {id:"l9sw37", lec:"lec9", section:"studentWork", sourceNo:"37", topic:"উৎপাদক (Factorization)", q:"a এর মান কত হলে 9 – 12x + ax² একটি পূর্ণবর্গ হবে?", opts:["8", "6", "–6", "4"], ans:3, sol:"9-12x+ax²=(p-q)² ধরলে; a x²-2(2x)(3)+9 আকারে মেলাতে p=2x, q=3 ধরে p²=ax²=4x²। তাই a=4।", src:true},
  {id:"l9sw38", lec:"lec9", section:"studentWork", sourceNo:"38", topic:"সূচক (Exponents/Indices)", q:"x পূর্ণ সংখ্যা হলে 16x² + 16x + 2 এর সাথে ন্যূনতম কত যোগ করলে এটি একটি পূর্ণ বর্গ সংখ্যা হবে?", opts:["2", "4", "1", "3"], ans:0, sol:"16x²+16x+2+2=16x²+16x+4=(4x)²+2×4x×2+4=(4x+2)², যা পূর্ণবর্গ। তাই ২ যোগ করতে হবে।", src:true},
  {id:"l9sw39", lec:"lec9", section:"studentWork", sourceNo:"39", topic:"উৎপাদক (Factorization)", q:"9a² + 16b² রাশিটির সাথে কোনটি যোগ করলে যোগফল পূর্ণবর্গ হবে?", opts:["12ab", "24ab", "36ab", "144ab"], ans:1, sol:"9a²+16b²=(3a)²+(4b)²। পূর্ণবর্গ (3a+4b)²=9a²+24ab+16b² করতে হলে 24ab যোগ করতে হবে।", src:true},
  {id:"l9sw40", lec:"lec9", section:"studentWork", sourceNo:"40", topic:"উৎপাদক (Factorization)", q:"a = 1, b = –1, c = 2, d = –2 হলে a – (–b) – (–c) – (–d) এর মান কত?", opts:["0", "1", "2", "3"], ans:0, sol:"a-(-b)-(-c)-(-d)=a+b+c+d=1-1+2-2=0।", year:"১৫তম বিসিএস", src:true},
