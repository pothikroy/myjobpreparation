<style>
/* ============ TOKENS ============ */
:root{
  --bg:#f3f5fa;
  --panel:#ffffff;
  --panel-2:#f8f9fd;
  --text:#161b2c;
  --muted:#636f8c;
  --faint:#98a2ba;
  --border:#e4e8f2;
  --border-2:#eef1f8;
  --accent:#28527a;
  --accent-2:#c98a3e;
  --accent-soft:#e9eef7;
  --red:#c94a4a;
  --red-soft:#fbe9e9;
  --orange:#d98033;
  --orange-soft:#fdefe1;
  --yellow:#c9a227;
  --yellow-soft:#faf3dc;
  --green:#3f8f5f;
  --green-soft:#e6f4ec;
  --blue:#2f6690;
  --blue-soft:#e6eef5;
  --purple:#6a5a9c;
  --purple-soft:#ece9f6;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,25,45,.04), 0 6px 20px -8px rgba(20,25,45,.10);
  --serif:Georgia,'Noto Serif Bengali','Iowan Old Style','Palatino Linotype',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Bengali','Hind Siliguri',Roboto,Helvetica,Arial,sans-serif;
  --mono:'SF Mono',Consolas,'Liberation Mono',Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#0c0f17;
  --panel:#131826;
  --panel-2:#171e2f;
  --text:#e7ebf6;
  --muted:#93a0bd;
  --faint:#5c6685;
  --border:#232c42;
  --border-2:#1c2438;
  --accent:#7ba6d6;
  --accent-2:#e3a75e;
  --accent-soft:#1b2740;
  --red:#e2777a;
  --red-soft:#33191c;
  --orange:#e3a166;
  --orange-soft:#332413;
  --yellow:#dcc169;
  --yellow-soft:#332c13;
  --green:#6fc294;
  --green-soft:#122a1d;
  --blue:#7fb0d8;
  --blue-soft:#132234;
  --purple:#a89bd6;
  --purple-soft:#221e35;
  --shadow:0 1px 2px rgba(0,0,0,.2), 0 10px 30px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;margin:0 0 6px;letter-spacing:.1px;}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ LAYOUT ============ */
#appwrap{display:flex;min-height:100vh;}
#sidebar{
  width:242px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20;
}
#sidebar .brand{padding:20px 18px 14px;border-bottom:1px solid var(--border-2);}
#sidebar .brand .mark{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.15;}
#sidebar .brand .mark span{color:var(--accent-2);}
#sidebar .brand .sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.4px;text-transform:uppercase;}
.navgroup{padding:10px 10px 4px;}
.navgroup .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);padding:10px 10px 4px;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);
  cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:500;margin-bottom:1px;
  transition:background .12s, color .12s;
}
.navitem:hover{background:var(--panel-2);color:var(--text);}
.navitem.active{background:var(--accent-soft);color:var(--accent);}
.navitem .ic{width:17px;text-align:center;font-size:13px;opacity:.9;}
.navitem .badge{margin-left:auto;font-size:10.5px;background:var(--red-soft);color:var(--red);padding:1px 6px;border-radius:20px;font-weight:700;}
#sidebar .foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border-2);font-size:11px;color:var(--faint);}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;
  padding:12px 22px;background:var(--bg);border-bottom:1px solid var(--border);
  backdrop-filter:blur(6px);
}
#topbar .pagetitle{font-family:var(--serif);font-size:20px;font-weight:700;}
#topbar .pagesub{font-size:12px;color:var(--muted);margin-top:1px;}
#searchbox{
  margin-left:auto;position:relative;width:280px;
}
#searchbox input{
  width:100%;padding:8px 12px 8px 30px;border-radius:20px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:13px;outline:none;
}
#searchbox input:focus{border-color:var(--accent);}
#searchbox .sic{position:absolute;left:11px;top:8px;color:var(--faint);font-size:13px;}
#searchresults{
  position:absolute;top:38px;left:0;right:0;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-sm);box-shadow:var(--shadow);max-height:400px;overflow:auto;display:none;z-index:50;
}
#searchresults .sr-item{padding:9px 12px;border-bottom:1px solid var(--border-2);cursor:pointer;font-size:12.5px;}
#searchresults .sr-item:hover{background:var(--panel-2);}
#searchresults .sr-item .t{font-weight:600;}
#searchresults .sr-item .m{color:var(--faint);font-size:11px;}
.themebtns{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:3px;}
.themebtns button{border:none;background:transparent;color:var(--faint);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:12px;}
.themebtns button.active{background:var(--accent-soft);color:var(--accent);}

#content{padding:20px 22px 60px;flex:1;}
.view{display:none;}
.view.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

/* ============ COMMON COMPONENTS ============ */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:16px 18px;}
.grid{display:grid;gap:14px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr);}.g-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:700px){.g-4,.g-3,.g-2{grid-template-columns:1fr;}}

.kpi{padding:15px 16px;}
.kpi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.kpi .val{font-family:var(--serif);font-size:26px;margin-top:4px;font-weight:700;}
.kpi .sub{font-size:11.5px;color:var(--faint);margin-top:3px;}

.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;}
.section-title h3{font-size:16px;}
.section-title .hint{font-size:11.5px;color:var(--faint);}
.section-title:first-child{margin-top:0;}

.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{opacity:.9;color:#fff;}
.btn.danger{background:var(--red-soft);border-color:var(--red-soft);color:var(--red);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.sm{padding:4px 9px;font-size:11.5px;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
.tag.gray{background:var(--panel-2);color:var(--muted);border:1px solid var(--border);}
.tag.red{background:var(--red-soft);color:var(--red);}
.tag.orange{background:var(--orange-soft);color:var(--orange);}
.tag.yellow{background:var(--yellow-soft);color:var(--yellow);}
.tag.green{background:var(--green-soft);color:var(--green);}
.tag.blue{background:var(--blue-soft);color:var(--blue);}
.tag.purple{background:var(--purple-soft);color:var(--purple);}

.pbar{height:7px;border-radius:6px;background:var(--panel-2);overflow:hidden;border:1px solid var(--border-2);}
.pbar > div{height:100%;border-radius:6px;}

.label-official{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--blue);background:var(--blue-soft);padding:2px 7px;border-radius:5px;}
.label-suggested{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--purple);background:var(--purple-soft);padding:2px 7px;border-radius:5px;}
.label-personal{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--green);background:var(--green-soft);padding:2px 7px;border-radius:5px;}
.label-demo{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--orange);background:var(--orange-soft);padding:2px 7px;border-radius:5px;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--border);}
table td{padding:9px 10px;border-bottom:1px solid var(--border-2);vertical-align:top;}
table tr:hover td{background:var(--panel-2);}
.small{font-size:11.5px;color:var(--muted);}
.muted{color:var(--muted);}
.faint{color:var(--faint);}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);font-size:12.8px;font-family:inherit;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:60px;}
label.f{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.formrow{margin-bottom:10px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);font-size:11.5px;cursor:pointer;background:var(--panel);color:var(--muted);margin:2px 3px 2px 0;user-select:none;}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700;}
.chip.weak{border-color:var(--red);}

.modalbg{position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px;}
.modalbg.show{display:flex;}
.modal{background:var(--panel);border-radius:var(--radius);max-width:640px;width:100%;box-shadow:var(--shadow);border:1px solid var(--border);}
.modal .mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
.modal .mhead h3{font-size:16px;}
.modal .mbody{padding:16px 18px;max-height:70vh;overflow:auto;}
.modal .mfoot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.xbtn{background:none;border:none;font-size:18px;color:var(--faint);cursor:pointer;line-height:1;}

.crumbs{font-size:12px;color:var(--faint);margin-bottom:10px;}
.crumbs a{cursor:pointer;color:var(--accent);}
.crumbs a:hover{text-decoration:underline;}

.emptystate{text-align:center;padding:50px 20px;color:var(--muted);}
.emptystate .big{font-size:34px;margin-bottom:8px;}

.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tabbtn{padding:8px 14px;font-size:12.8px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabbtn.active{color:var(--accent);border-color:var(--accent);}

.hm-cell{width:100%;aspect-ratio:1.6/1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:pointer;text-align:center;padding:2px;}

.acc{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;background:var(--panel);}
.acc-head{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;}
.acc-head:hover{background:var(--panel-2);}
.acc-head .car{transition:transform .15s;color:var(--faint);font-size:11px;}
.acc.open > .acc-head .car{transform:rotate(90deg);}
.acc-body{display:none;padding:0 13px 13px 34px;}
.acc.open > .acc-body{display:block;}
.acc-head .ttl{font-weight:600;font-size:13px;flex:1;}
.acc-head .meta{display:flex;gap:6px;align-items:center;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:12.5px;z-index:200;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;}
.toast.show{opacity:1;transform:none;}

.qcard{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;background:var(--panel);}
.qcard .qtext{font-weight:600;font-size:13.3px;margin-bottom:6px;}
.qcard .qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.attemptrow{display:flex;gap:10px;align-items:center;padding:5px 0;border-top:1px dashed var(--border-2);font-size:12px;}

.hub-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
@media(max-width:1000px){.hub-grid{grid-template-columns:1fr;}}

.mono{font-family:var(--mono);}
.center{text-align:center;}
.mt2{margin-top:8px;} .mt3{margin-top:14px;} .mt4{margin-top:22px;}
.flex{display:flex;} .aic{align-items:center;} .jcsb{justify-content:space-between;} .gap8{gap:8px;} .gap6{gap:6px;} .wrap{flex-wrap:wrap;}
hr.div{border:none;border-top:1px solid var(--border-2);margin:14px 0;}
.iconbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;}
.iconbtn:hover{color:var(--red);border-color:var(--red);}
.notebox{white-space:pre-wrap;font-size:12.8px;background:var(--panel-2);border-radius:8px;padding:10px 12px;border:1px solid var(--border-2);min-height:40px;}

::placeholder{color:var(--faint);}
@media(max-width:880px){
  #sidebar{position:fixed;left:-260px;transition:left .2s;box-shadow:var(--shadow);}
  #sidebar.open{left:0;}
  #searchbox{width:150px;}
  #content{padding:14px;}
  .formgrid{grid-template-columns:1fr;}
}
#menutoggle{display:none;background:none;border:1px solid var(--border);border-radius:7px;width:34px;height:34px;color:var(--text);cursor:pointer;}
@media(max-width:880px){#menutoggle{display:block;}}
</style>
</head>

<script>
/* =====================================================================
   BCS PRELIMINARY MASTER TRACKER
   Single-file offline application.
   Data layers are explicitly tagged:
     OFFICIAL   -> verbatim from the 50th BCS Preliminary Syllabus PDF
     SUGGESTED  -> analytical breakdown / possible question areas (not official)
     PERSONAL   -> data entered by the user (progress, notes, attempts, etc.)
   ===================================================================== */

/* ---------------------------- CONSTANTS ---------------------------- */
const STORE_KEY = 'bcs_master_tracker_v1';

const CHECKLIST_STEPS = [
  {k:'readOnce', l:'Read once'},
  {k:'basicUnderstanding', l:'Basic understanding'},
  {k:'notesCompleted', l:'Notes completed'},
  {k:'firstRevision', l:'First revision completed'},
  {k:'mcqStarted', l:'MCQ practice started'},
  {k:'mcqCompleted', l:'MCQ practice completed'},
  {k:'secondRevision', l:'Second revision'},
  {k:'thirdRevision', l:'Third revision'},
  {k:'strong', l:'Strong'},
  {k:'mastered', l:'Mastered'}
];

const PATTERN_TAGS = [
  'Direct factual','Conceptual','Definition','Chronological','Matching','Statement-based',
  'Multiple statements','Assertion/reason','Cause/effect','Comparison','Location-based',
  'Person-based','Institution-based','Date/year-based','Numerical','Formula-based',
  'Application-based','Exception-based','Which is NOT','All EXCEPT','Correct/incorrect statement',
  'Pair matching','Sequence/order','Data/table-based','Current-affairs-linked','Static + current affairs combo'
];

const MISTAKE_TYPES = [
  "Didn't know","Forgot","Misread question","Conceptual mistake","Calculation mistake",
  "Careless mistake","Confused between options","Guessing error","Time-pressure error","Silly mistake"
];

const QUESTION_TYPES = ['MCQ - Direct','MCQ - Statement based','MCQ - Matching','MCQ - Numerical','MCQ - Assertion/Reason','Other'];

const REVISION_PRESETS = [1,3,7,14,30,60];

const STAGE_ORDER = ['Not Started','Started','Learning','Practicing','Revising','Strong','Mastered'];

// Category → suggested (non-official) breakdown templates.
// These are clearly analytical/heuristic, never presented as official syllabus.
const CATEGORY_MAP = {
  'history': {
    areas:['Dates & years','Key persons involved','Places/locations','Causes','Consequences','Important documents/declarations','Chronology of events','Related institutions','Firsts/lasts/records','Comparisons with related events'],
    patterns:['Direct factual','Chronological','Statement-based','Multiple statements','Date/year-based','Person-based','Location-based','Cause/effect','Sequence/order','Current-affairs-linked'],
    frame:['DATES','PEOPLE','PLACES','CAUSES','EFFECTS','SEQUENCES','INSTITUTIONS']
  },
  'grammar': {
    areas:['Rule identification','Correct vs. incorrect usage','Common student errors','Exception cases','Sentence transformation','Spotting the item in a passage'],
    patterns:['Application-based','Correct/incorrect statement','Which is NOT','Definition','Exception-based','Matching'],
    frame:['CONCEPTS','EXCEPTIONS','COMMON CONFUSIONS','POSSIBLE MCQ TRAPS']
  },
  'literature': {
    areas:['Author ↔ work matching','Famous quotations','Literary period/era','Notable characters','Genre classification'],
    patterns:['Matching','Direct factual','Chronological','Pair matching'],
    frame:['PEOPLE','CLASSIFICATIONS','DATES']
  },
  'science-physical': {
    areas:['Definitions & terminology','Units & formulas','Cause–effect relationships','Real-life applications','Comparisons/classifications','Simple numerical problems'],
    patterns:['Definition','Numerical','Formula-based','Application-based','Comparison','Which is NOT'],
    frame:['FACTS','CONCEPTS','NUMBERS','COMPARISONS','EXCEPTIONS']
  },
  'science-bio': {
    areas:['Terminology','Classification','Human body facts','Disease & prevention','Process/sequence (e.g. photosynthesis)'],
    patterns:['Definition','Statement-based','Sequence/order','Exception-based','Comparison'],
    frame:['FACTS','CLASSIFICATIONS','SEQUENCES','COMMON CONFUSIONS']
  },
  'geography': {
    areas:['Location/boundary facts','Physical features','Resource distribution','Climate & environment factors','Comparative statistics'],
    patterns:['Location-based','Data/table-based','Statement-based','Comparison','Current-affairs-linked'],
    frame:['PLACES','NUMBERS','COMPARISONS','CURRENT AFFAIRS CONNECTIONS']
  },
  'economy-polity': {
    areas:['Definitions & institutions','Key statistics/figures','Policy names & years','Roles & functions','Comparisons between bodies'],
    patterns:['Direct factual','Institution-based','Statement-based','Date/year-based','Current-affairs-linked','All EXCEPT'],
    frame:['FACTS','INSTITUTIONS','NUMBERS','DATES','CURRENT AFFAIRS CONNECTIONS']
  },
  'constitution-law': {
    areas:['Article numbers','Amendment years','Key provisions','Definitions','Comparisons between provisions'],
    patterns:['Direct factual','Statement-based','Assertion/reason','Numerical','Matching'],
    frame:['FACTS','NUMBERS','DATES','COMMON CONFUSIONS']
  },
  'international': {
    areas:['Organization names & HQ','Member countries','Key events & dates','Treaties/agreements','Leaders/officials','Recent developments'],
    patterns:['Institution-based','Person-based','Date/year-based','Current-affairs-linked','Matching','Statement-based'],
    frame:['INSTITUTIONS','PEOPLE','DATES','CURRENT AFFAIRS CONNECTIONS']
  },
  'ict': {
    areas:['Terminology/definitions','Abbreviations','Real-world applications','Comparisons between technologies','Recent developments'],
    patterns:['Definition','Direct factual','Application-based','Current-affairs-linked','Which is NOT'],
    frame:['FACTS','CONCEPTS','CURRENT AFFAIRS CONNECTIONS']

var _idc = 1;
function uid(prefix){ return prefix+'_'+(_idc++)+'_'+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;} }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(n){ return Math.round(n)+'%'; }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function masteryColor(m){
  if(m<21) return getCss('--red');
  if(m<41) return getCss('--orange');
  if(m<61) return getCss('--yellow');
  if(m<76) return getCss('--blue');
  if(m<91) return getCss('--green');
  return getCss('--purple');
}
function masteryBand(m){
  if(m<21) return 'Unknown';
  if(m<41) return 'Weak';
  if(m<61) return 'Developing';
  if(m<76) return 'Moderate';
  if(m<91) return 'Strong';
  return 'Mastered';
}
function masteryTagClass(m){
  if(m<21) return 'red'; if(m<41) return 'orange'; if(m<61) return 'yellow'; if(m<76) return 'blue'; if(m<91) return 'green'; return 'purple';
}
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

/* =====================================================================
   COMPUTATION ENGINE — accuracy, coverage, mastery, priority, readiness
   All formulas are documented in the Settings/About view.
   ===================================================================== */
function allAttempts(topicId){
  const qs = questionsOfTopic(topicId);
  let atts = [];
  qs.forEach(q=> q.attempts.forEach(a=> atts.push({...a, qid:q.id})));
  return atts.sort((a,b)=> new Date(a.date)-new Date(b.date));
}
function latestAttemptsPerQuestion(topicId){
  const qs = questionsOfTopic(topicId);
  return qs.map(q=> q.attempts.length? q.attempts[q.attempts.length-1] : null).filter(Boolean);
}
function topicAccuracy(topicId){
  const atts = latestAttemptsPerQuestion(topicId);
  if(!atts.length) return null;
  const correct = atts.filter(a=>a.correct).length;
  return Math.round(correct/atts.length*100);
}
function topicRecentAccuracy(topicId, n){
  n = n||10;
  const atts = allAttempts(topicId).slice(-n);
  if(!atts.length) return null;
  const correct = atts.filter(a=>a.correct).length;
  return Math.round(correct/atts.length*100);
}
function topicCoverage(topic){
  const total = CHECKLIST_STEPS.length;
  let done = 0;
  CHECKLIST_STEPS.forEach(s=>{ if(topic.checklist[s.k]) done++; });
  return Math.round(done/total*100);
}
function topicAvgTime(topicId){
  const atts = allAttempts(topicId).filter(a=>a.timeSec);
  if(!atts.length) return null;
  return Math.round(atts.reduce((s,a)=>s+Number(a.timeSec),0)/atts.length);
}
function revisionStatus(topic){
  if(!topic.nextRevision) return 'none';
  const d = daysBetween(todayISO(), topic.nextRevision);
  if(d < 0) return 'overdue';
  if(d === 0) return 'today';
  if(d <= 3) return 'soon';
  return 'upcoming';
}
function topicMastery(topic){
  const coverage = topicCoverage(topic); // 0-100
  const acc = topicAccuracy(topic.id);   // null or 0-100
  const recentAcc = topicRecentAccuracy(topic.id, 8);
  const accuracyScore = acc==null ? 0 : Math.round(0.5*acc + 0.5*(recentAcc==null?acc:recentAcc));
  const revisions = topic.revisionHistory.length;
  const revisionConsistency = clamp(Math.round((revisions/3)*100), 0, 100); // 3+ revisions = full score
  // retention: decays if not studied recently; 0 if never studied at all
  let retention = 0;
  if(topic.lastStudied){
    const d = daysBetween(topic.lastStudied, todayISO());
    retention = clamp(100 - d*2, 5, 100);
  }
  // time efficiency: compare avg time to a generic benchmark; 0 if no practice data exists yet
  // (a neutral/default score here would falsely inflate mastery for untouched topics)
  const avgTime = topicAvgTime(topic.id);
  let timeEff = 0;
  if(avgTime!=null){ timeEff = clamp(Math.round(100 - (avgTime-30)*1.2), 10, 100); }

  const mastery = clamp(Math.round(
    0.25*coverage + 0.35*accuracyScore + 0.20*revisionConsistency + 0.10*retention + 0.10*timeEff
  ), 0, 100);
  return mastery;
}
function topicQuestionCount(topicId){ return questionsOfTopic(topicId).reduce((s,q)=>s+q.attempts.length,0); }

function topicPriorityScore(topic){
  const w = STATE.settings.priorityWeights;
  const acc = topicAccuracy(topic.id);
  const weakness = acc==null ? 50 : (100-acc); // higher = weaker = more urgent
  const freq = STATE.currentAffairs.filter(c=>c.topicId===topic.id).length>0 ? 70 : 40; // uses recorded current-affairs links as a proxy signal
  const diff = topic.difficulty*20; // 1-5 -> 20-100
  let revUrgency = 40;
  const rs = revisionStatus(topic);
  if(rs==='overdue') revUrgency=100; else if(rs==='today') revUrgency=85; else if(rs==='soon') revUrgency=60; else if(rs==='upcoming') revUrgency=30; else revUrgency = topic.lastStudied? 20:70;
  const caRel = STATE.currentAffairs.filter(c=>c.topicId===topic.id).length*15;
  const userP = topic.priorityUser*20;

  const raw = (freq*w.freq + weakness*w.weak + diff*w.diff + revUrgency*w.revUrgency + clamp(caRel,0,100)*w.ca + userP) /
              (w.freq+w.weak+w.diff+w.revUrgency+w.ca+1);
  return clamp(Math.round(raw),0,100);
}
function priorityLabel(score){
  if(score>=85) return {l:'🔥 Critical', c:'red'};
  if(score>=70) return {l:'🟥 Very High', c:'orange'};
  if(score>=55) return {l:'🟧 High', c:'yellow'};
  if(score>=35) return {l:'🟨 Medium', c:'blue'};
  return {l:'🟩 Low', c:'green'};
}

function subjectStats(sid){
  const tps = topicsOfSubject(sid);
  const n = tps.length || 1;
  const masteries = tps.map(topicMastery);
  const avgMastery = Math.round(masteries.reduce((a,b)=>a+b,0)/n);
  let attempted=0, correct=0;
  tps.forEach(t=>{ questionsOfTopic(t.id).forEach(q=>{ attempted+=q.attempts.length; correct+=q.attempts.filter(a=>a.correct).length; }); });
  const accuracy = attempted? Math.round(correct/attempted*100) : null;
  const coverageAvg = Math.round(tps.reduce((a,t)=>a+topicCoverage(t),0)/n);
  const mastered = tps.filter(t=>topicMastery(t)>=91).length;
  const weak = tps.filter(t=>topicMastery(t)<41).length;
  const needsRevision = tps.filter(t=>['overdue','today'].includes(revisionStatus(t))).length;
  const started = tps.filter(t=>t.checklist.readOnce).length;
  let status = 'Not Started';
  if(started===0) status='Not Started';
  else if(avgMastery>=91) status='Mastered';
  else if(avgMastery>=76) status='Strong';
  else if(started>0 && tps.some(t=>revisionStatus(t)!=='none')) status='Revising';
  else if(attempted>0) status='Practicing';
  else if(started>0) status='Learning';
  else status='Started';
  const lastDates = tps.map(t=>t.lastStudied).filter(Boolean).sort();
  const lastStudied = lastDates.length? lastDates[lastDates.length-1] : null;
  return { topicCount:tps.length, subtopicCount: tps.reduce((a,t)=>a+(t.subtopics.length||1),0),
    avgMastery, accuracy, attempted, correct, coverageAvg, mastered, weak, needsRevision, status, lastStudied };
}

function overallReadiness(){
  const w = STATE.settings.readinessWeights;
  const tps = STATE.topics;
  const n = tps.length||1;
  const knowledge = Math.round(tps.reduce((a,t)=>a+topicCoverage(t),0)/n);
  let attempted=0, correct=0;
  tps.forEach(t=>{ questionsOfTopic(t.id).forEach(q=>{ attempted+=q.attempts.length; correct+=q.attempts.filter(a=>a.correct).length; }); });
  const practiceVolumeScore = clamp(Math.round(attempted/ (STATE.settings.weeklyQuestionTarget*4) * 100),0,100); // ~1 month target proxy
  const practiceAccuracy = attempted? Math.round(correct/attempted*100) : 0;
  const practice = Math.round(0.5*practiceVolumeScore + 0.5*practiceAccuracy);
  // Revision health only makes sense among topics you've actually engaged with
  // (started studying, or scheduled a revision). A topic that was never touched
  // is neither "healthy" nor "overdue" — it shouldn't count as revision progress.
  const startedTopics = tps.filter(t=> t.checklist.readOnce || t.lastStudied || t.nextRevision);
  let revision = 0;
  if(startedTopics.length){
    const notOverdue = startedTopics.filter(t=>revisionStatus(t)!=='overdue').length;
    revision = Math.round(notOverdue/startedTopics.length*100);
  }
  const overall = Math.round(knowledge*w.knowledge + practice*w.practice + revision*w.revision);
  return { knowledge, practice, revision, overall };
}

/* =====================================================================
   VIEW: TODAY'S PLAN
   ===================================================================== */
function renderToday(){
  const c = document.getElementById('content');
  const overdue = STATE.topics.filter(t=>revisionStatus(t)==='overdue').sort((a,b)=>topicPriorityScore(b)-topicPriorityScore(a));
  const dueToday = STATE.topics.filter(t=>revisionStatus(t)==='today');
  const weak = STATE.topics.filter(t=>t.checklist.readOnce && topicMastery(t)<41 && topicMastery(t)>0)
     .sort((a,b)=>topicPriorityScore(b)-topicPriorityScore(a));
  const neverStarted = STATE.topics.filter(t=>!t.checklist.readOnce);
  const highPriorityNotStarted = [...neverStarted].sort((a,b)=>topicPriorityScore(b)-topicPriorityScore(a)).slice(0,2);

  const plan = [];
  overdue.slice(0,2).forEach(t=> plan.push({t, action:'Revise (overdue)', minutes:25, kind:'revision'}));
  dueToday.slice(0,1).forEach(t=> plan.push({t, action:'Revise (due today)', minutes:20, kind:'revision'}));
  weak.slice(0,2).forEach(t=> plan.push({t, action:'Practice weak topic — 15 MCQs', minutes:35, kind:'practice'}));
  highPriorityNotStarted.forEach(t=> plan.push({t, action:'Start studying (new, high priority)', minutes:40, kind:'learn'}));

  const seen = new Set(); const uniquePlan = plan.filter(p=>{ if(seen.has(p.t.id)) return false; seen.add(p.t.id); return true; }).slice(0,6);
  const totalMin = uniquePlan.reduce((s,p)=>s+p.minutes,0);

  let h = `<div class="card card-pad">
    <div class="flex jcsb aic"><h3 style="margin:0">Recommended session — ${todayISO()}</h3><span class="tag blue">~${totalMin} min</span></div>
    <p class="small muted mt2">This plan is generated from your own recorded revision schedule, mastery, and priority weights (Settings). You can override anything below — nothing here is enforced.</p>
  </div>`;

  if(uniquePlan.length===0){
    h += `<div class="emptystate card mt4"><div class="big">🗓️</div><h3>No urgent items yet</h3><p class="small">Start a topic in the Syllabus Explorer, or record a question attempt, and a plan will appear here.</p><div class="btnrow center" style="justify-content:center"><button class="btn primary" onclick="navigate('syllabus')">Open Syllabus</button></div></div>`;
  } else {
    h += `<div class="section-title"><h3>Plan</h3><span class="hint">Ordered by urgency</span></div>`;
    uniquePlan.forEach((p,i)=>{
      const m = topicMastery(p.t); const subj = getSubject(p.t.subjectId);
      h += `<div class="card card-pad mt2 flex jcsb aic" style="gap:14px">
        <div class="flex aic gap8" style="flex:1;min-width:0">
          <div style="width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none">${i+1}</div>
          <div style="min-width:0">
            <div style="font-weight:700;font-size:13.5px">${esc(p.t.title)}</div>
            <div class="small muted">${esc(subj.name)} · ${p.action}</div>
          </div>
        </div>
        <div class="flex aic gap8">
          <span class="tag ${masteryTagClass(m)}">${m}% mastery</span>
          <span class="tag gray">${p.minutes} min</span>
          <button class="btn sm primary" onclick="navigate('topic','${p.t.id}')">Open →</button>
        </div>
      </div>`;
    });
  }

  h += `<div class="section-title"><h3>Manual override</h3><span class="hint">Add anything to today's plan yourself</span></div>
  <div class="card card-pad">
    <div class="formgrid">
      <div class="formrow"><label class="f">Topic</label><select id="todayTopicSel">${STATE.topics.map(t=>`<option value="${t.id}">${esc(getSubject(t.subjectId).name)} — ${esc(t.title)}</option>`).join('')}</select></div>
      <div class="formrow"><label class="f">Note to self</label><input type="text" id="todayNote" placeholder="e.g. Focus on dates and chronology"></div>
    </div>
    <button class="btn" onclick="addManualPlanItem()">Add to journal</button>
  </div>`;

  c.innerHTML = h;
}
function addManualPlanItem(){
  const tid = document.getElementById('todayTopicSel').value;
  const note = document.getElementById('todayNote').value;
  STATE.timeline.push({id:uid('tl'), date:todayISO(), type:'plan', text:`Planned: ${getTopic(tid).title}${note? ' — '+note:''}`});
  saveState(); toast('Added to your journal');
}

function recommendedAction(t){
  const m = topicMastery(t);
  const rs = revisionStatus(t);
  if(!t.checklist.readOnce) return `You haven't started this topic yet. Begin with a first read-through, then log a study session.`;
  if(rs==='overdue') return `Revision is overdue — revise this topic today before adding new material.`;
  if(m<41) return `Mastery is currently weak (${m}%). Focus on practicing MCQs and reviewing mistakes rather than re-reading.`;
  if(!t.checklist.mcqStarted) return `You've studied this but haven't practiced questions yet. Record a batch of MCQ attempts to test recall.`;
  if(m>=91) return `This topic looks mastered. A light revision closer to the exam date should be enough.`;
  return `Solid progress (${m}%). Keep practicing a few questions periodically and schedule your next revision.`;
}

function resourcesForTopic(tid){
  const rs = STATE.resources.filter(r=>r.linkedTopics.includes(tid));
  if(!rs.length) return `<div class="small faint">No resources linked.</div>`;
  return rs.map(r=>`<div class="small mt2"><b>${esc(r.name)}</b> <span class="faint">(${esc(r.type)})</span>${r.pageChapter?` — ${esc(r.pageChapter)}`:''}</div>`).join('');
}

function renderTopicQuestions(tid){
  const qs = questionsOfTopic(tid);
  if(!qs.length) return `<div class="small faint">No questions recorded yet for this topic.</div>`;
  return qs.slice().reverse().map(q=>{
    const last = q.attempts[q.attempts.length-1];
    return `<div class="qcard">
      <div class="flex jcsb aic">
        <div class="qtext">${esc(q.text)}</div>
        <button class="iconbtn" onclick="deleteQuestion('${q.id}')" title="Delete question">✕</button>
      </div>
      <div class="qmeta">
        <span class="tag gray">${esc(q.type)}</span>
        ${q.year?`<span class="tag blue">${esc(q.year)}</span>`:''}
        ${q.source?`<span class="tag gray">${esc(q.source)}</span>`:''}
        <span class="tag ${last&&last.correct?'green':'red'}">${q.attempts.length} attempt(s)${last? (last.correct?' · last ✓':' · last ✕'):''}</span>
      </div>
      ${q.attempts.map((a,i)=>`<div class="attemptrow"><b>#${i+1}</b> ${fmtDate(a.date)} <span class="tag ${a.correct?'green':'red'}">${a.correct?'Correct':'Incorrect'}</span> ${a.timeSec?`<span class="faint">${a.timeSec}s</span>`:''} ${a.confidence?`<span class="faint">conf ${a.confidence}/5</span>`:''} ${a.mistakeType?`<span class="tag orange">${esc(a.mistakeType)}</span>`:''}</div>`).join('')}
      <div class="flex jcsb aic mt2">
        <span class="small faint">${q.explanation? 'Has explanation':''}</span>
        <button class="btn sm" onclick="openAttemptModal('${q.id}')">+ New attempt</button>
      </div>
    </div>`;
  }).join('');
}

/* ---------------------------- TOPIC MUTATIONS ---------------------------- */
function toggleChecklist(tid,key,val){
  const t = getTopic(tid); t.checklist[key]=val;
  // derive status text
  const stage = ['mastered','strong','thirdRevision','secondRevision','mcqCompleted','mcqStarted','firstRevision','notesCompleted','basicUnderstanding','readOnce'];
  let status='Not Started';
  for(const k of stage){ if(t.checklist[k]){ status = ({mastered:'Mastered',strong:'Strong',thirdRevision:'Revising',secondRevision:'Revising',mcqCompleted:'Practicing',mcqStarted:'Practicing',firstRevision:'Revising',notesCompleted:'Learning',basicUnderstanding:'Learning',readOnce:'Started'})[k]; break; } }
  t.status = status;
  if(val && !t.lastStudied) t.lastStudied = todayISO();
  saveState(); navigate('topic',tid);
}
function updateTopicField(tid,field,val,isNumber){
  const t = getTopic(tid); t[field] = isNumber? Number(val): val; saveState();
}
function saveTopicNotes(tid){
  const t = getTopic(tid);
  const n = document.getElementById('notesArea_'+tid), d = document.getElementById('doubtsArea_'+tid);

}
function scheduleRevision(tid, days){
  const t = getTopic(tid);
  const dt = new Date(); dt.setDate(dt.getDate()+days);
  t.nextRevision = dt.toISOString().slice(0,10);
  saveState(); toast(`Revision scheduled in ${days} day(s)`); navigate('topic',tid);
}
function markStudiedNow(tid){
  const t = getTopic(tid);
  t.lastStudied = todayISO();
  t.revisionHistory.push({date:todayISO(), note:'Studied / revised'});
  if(!t.nextRevision){ const dt=new Date(); dt.setDate(dt.getDate()+STATE.settings.defaultRevisionInterval); t.nextRevision=dt.toISOString().slice(0,10); }
  STATE.timeline.push({id:uid('tl'),date:todayISO(),type:'study',text:`Studied: ${t.title}`});

function logStudySession(tid){
  const t = getTopic(tid);
  const mins = Number(document.getElementById('minsInput_'+tid).value||0);

  if(!mins){ toast('Enter minutes first'); return; }
  t.studyHours += mins; t.sessions += 1; t.lastStudied = todayISO();
  STATE.studyLog.push({id:uid('log'), date:todayISO(), topicId:tid, minutes:mins, note});
  STATE.timeline.push({id:uid('tl'),date:todayISO(),type:'study',text:`${mins} min on ${t.title}${note?' — '+note:''}`});
  saveState(); toast('Session logged'); navigate('topic',tid);

function addCustomArea(tid){
  const inp = document.getElementById('addAreaInput_'+tid); const v = inp.value.trim();
  if(!v) return; const t=getTopic(tid); t.customQuestionAreas.push(v); saveState(); navigate('topic',tid);
}
function addCustomPattern(tid){
  const inp = document.getElementById('addPatternInput_'+tid); const v = inp.value.trim();
  if(!v) return; const t=getTopic(tid); if(!t.customPatternTags.includes(v)) t.customPatternTags.push(v); saveState(); navigate('topic',tid);
}
function cyclePattern(tid, pattern){
  const t = getTopic(tid);
  const order = [undefined,'likely','frequent','possible','weak','unlikely'];
  const cur = t.relevantPatterns[pattern];
  const idx = order.indexOf(cur);
  const next = order[(idx+1)%order.length];
  if(next===undefined) delete t.relevantPatterns[pattern]; else t.relevantPatterns[pattern]=next;
  saveState(); navigate('topic',tid);
}

    STATE.questions = STATE.questions.filter(q=>q.id!==qid);

  }, {title:'Delete question', confirmLabel:'Delete'});
}

/* =====================================================================
   VIEW: ANALYTICS
   ===================================================================== */
function renderAnalyticsView(){
  const c = document.getElementById('content');
  const now = new Date();
  function inLastNDays(dateStr,n){ if(!dateStr) return false; return daysBetween(dateStr, todayISO()) <= n && daysBetween(dateStr,todayISO())>=0; }
  const allAtt = []; STATE.questions.forEach(q=>q.attempts.forEach(a=>allAtt.push(a)));
  function statsFor(n){
    const atts = allAtt.filter(a=>inLastNDays(a.date,n));
    const correct = atts.filter(a=>a.correct).length;
    const mins = STATE.studyLog.filter(l=>inLastNDays(l.date,n)).reduce((s,l)=>s+l.minutes,0);
    const revisions = STATE.topics.reduce((s,t)=>s+t.revisionHistory.filter(r=>inLastNDays(r.date,n)).length,0);
    return {attempted:atts.length, correct, acc: atts.length? Math.round(correct/atts.length*100):null, mins, revisions};
  }
  const d1=statsFor(1), d7=statsFor(7), d30=statsFor(30);
  const allTimeAtt = allAtt.length, allTimeCorrect = allAtt.filter(a=>a.correct).length;

  let h = `<div class="section-title"><h3>Study time & activity</h3><span class="hint">Derived only from your own recorded sessions and attempts</span></div>`;
  h += `<div class="grid g-4">
    ${[['Today',d1],['Last 7 days',d7],['Last 30 days',d30],['All-time',{attempted:allTimeAtt,correct:allTimeCorrect,acc:allTimeAtt?Math.round(allTimeCorrect/allTimeAtt*100):null,mins:STATE.studyLog.reduce((s,l)=>s+l.minutes,0),revisions:STATE.topics.reduce((s,t)=>s+t.revisionHistory.length,0)}]].map(([label,d])=>`
      <div class="card kpi"><div class="lbl">${label}</div>
        <div class="val" style="font-size:20px">${d.mins||0} min</div>
        <div class="sub">${d.attempted} Qs · ${d.acc==null?'—':d.acc+'%'} acc · ${d.revisions} revisions</div>
      </div>`).join('')}
  </div>`;

  h += `<div class="section-title"><h3>Study minutes — last 14 days</h3></div><div class="card card-pad">${barChart(last14DaysStudy())}</div>`;
  h += `<div class="section-title"><h3>Accuracy trend — last 20 attempts</h3></div><div class="card card-pad">${lineChartAccuracy()}</div>`;

  h += `<div class="section-title"><h3>Subject-wise study time (all-time)</h3></div><div class="card card-pad">`;
  const subjMins = STATE.subjects.map(s=>({name:s.name, mins: topicsOfSubject(s.id).reduce((sum,t)=>sum+t.studyHours,0)}));
  h += hBarChart(subjMins);
  h += `</div>`;

  h += `<div class="section-title"><h3>Question pattern distribution (from recorded questions)</h3></div><div class="card card-pad">`;
  const typeCounts = {};
  STATE.questions.forEach(q=>{ typeCounts[q.type]=(typeCounts[q.type]||0)+1; });
  const patternData = Object.entries(typeCounts).map(([k,v])=>({name:k,mins:v}));
  h += patternData.length? hBarChart(patternData,'') : `<div class="small faint">No questions recorded yet.</div>`;
  h += `</div>`;

  const daily = STATE.settings.dailyStudyTargetMin, weekly = STATE.settings.weeklyQuestionTarget;
  h += `<div class="section-title"><h3>Targets</h3></div>
  <div class="grid g-2">
    <div class="card card-pad"><div class="small muted">Daily study target</div><div style="font-family:var(--serif);font-size:22px">${d1.mins}/${daily} min</div><div class="pbar mt2"><div style="width:${clamp(d1.mins/daily*100,0,100)}%;background:${getCss('--accent')}"></div></div></div>
    <div class="card card-pad"><div class="small muted">Weekly question target</div><div style="font-family:var(--serif);font-size:22px">${d7.attempted}/${weekly}</div><div class="pbar mt2"><div style="width:${clamp(d7.attempted/weekly*100,0,100)}%;background:${getCss('--accent')}"></div></div></div>
  </div>`;

  c.innerHTML = h;
}
function last14DaysStudy(){
  const arr = [];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i); const iso = d.toISOString().slice(0,10);
    const mins = STATE.studyLog.filter(l=>l.date===iso).reduce((s,l)=>s+l.minutes,0);
    arr.push({name: iso.slice(5), mins});
  }
  return arr;
}
function barChart(data){
  const max = Math.max(1, ...data.map(d=>d.mins));
  return `<div style="display:flex;align-items:flex-end;gap:6px;height:120px">` +
    data.map(d=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="width:100%;background:${getCss('--accent')};opacity:.85;border-radius:3px 3px 0 0;height:${Math.max(2,d.mins/max*95)}px" title="${d.name}: ${d.mins} min"></div>
      <div style="font-size:9px;color:var(--faint);writing-mode:vertical-rl;">${d.name}</div>
    </div>`).join('') + `</div>`;
}
function hBarChart(data){
  const max = Math.max(1, ...data.map(d=>d.mins));
  if(!data.length) return `<div class="small faint">No data yet.</div>`;
  return data.map(d=>`<div class="flex aic gap8 mt2">
    <div style="width:170px;font-size:11.5px" class="muted">${esc(d.name)}</div>
    <div style="flex:1;background:var(--panel-2);border-radius:4px;overflow:hidden;height:14px"><div style="width:${d.mins/max*100}%;background:${getCss('--accent-2')};height:100%"></div></div>
    <div style="width:44px;text-align:right;font-size:11.5px" class="muted">${d.mins}</div>
  </div>`).join('');
}
function lineChartAccuracy(){
  const allAtt = []; STATE.questions.forEach(q=>q.attempts.forEach(a=>allAtt.push(a)));
  allAtt.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const last20 = allAtt.slice(-20);
  if(!last20.length) return `<div class="small faint">No attempts recorded yet.</div>`;
  const w=680,h=130,pad=20;
  let cum=0, correct=0;
  const pts = last20.map((a,i)=>{ cum++; if(a.correct) correct++; const y = 100-(correct/cum*100); return {x: pad+(i/(last20.length-1||1))*(w-2*pad), y: pad+(y/100)*(h-2*pad)}; });
  const path = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="${getCss('--border')}"/>
    <path d="${path}" fill="none" stroke="${getCss('--accent')}" stroke-width="2"/>
    ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="2.5" fill="${getCss('--accent-2')}"/>`).join('')}
  </svg><div class="small faint">Running accuracy (%) across your most recent 20 attempts</div>`;
}

/* =====================================================================
   VIEW: WEAK / STRONG INSIGHTS
   ===================================================================== */
function renderInsightsView(){
  const c = document.getElementById('content');
  const started = STATE.topics.filter(t=>t.checklist.readOnce || questionsOfTopic(t.id).length);
  let h = `<div class="tabbar"><div class="tabbtn active" data-tab="weak" onclick="switchInsightTab(this)">My Weaknesses</div><div class="tabbtn" data-tab="strong" onclick="switchInsightTab(this)">My Strengths</div></div>`;
  h += `<div id="insight-weak">`;
  if(!started.length){
    h += `<div class="emptystate card"><div class="big">🔍</div><h3>Not enough data yet</h3><p class="small">Weakness detection needs some study/practice history first.</p></div>`;
  } else {
    const weakTopics = started.filter(t=>topicMastery(t)<41).sort((a,b)=>topicMastery(a)-topicMastery(b));
    const overdueTopics = STATE.topics.filter(t=>revisionStatus(t)==='overdue');
    const mistakeCounts = {};
    STATE.questions.forEach(q=>q.attempts.forEach(a=>{ if(a.mistakeType) mistakeCounts[a.mistakeType]=(mistakeCounts[a.mistakeType]||0)+1; }));
    const patternMiss = {};
    STATE.questions.forEach(q=>{ const last=q.attempts[q.attempts.length-1]; if(last && !last.correct){ patternMiss[q.type]=(patternMiss[q.type]||0)+1; } });

    h += `<div class="section-title"><h3>Weak topics</h3><span class="hint">Mastery under 41%</span></div>`;
    h += weakTopics.length? weakTopics.map(t=>topicRow(t)).join('') : `<div class="small faint">No clearly weak topics yet — keep practicing to surface any.</div>`;

    h += `<div class="section-title"><h3>Revision overdue</h3></div>`;
    h += overdueTopics.length? overdueTopics.map(t=>topicRow(t)).join('') : `<div class="small faint">Nothing overdue.</div>`;

    h += `<div class="section-title"><h3>Frequently repeated mistake types</h3></div>`;
    const mtEntries = Object.entries(mistakeCounts).sort((a,b)=>b[1]-a[1]);
    h += mtEntries.length? `<div class="card card-pad">${hBarChart(mtEntries.map(([k,v])=>({name:k,mins:v})))}</div>` : `<div class="small faint">No mistake types recorded yet.</div>`;

    h += `<div class="section-title"><h3>Question types you get wrong most</h3></div>`;
    const pmEntries = Object.entries(patternMiss).sort((a,b)=>b[1]-a[1]);
    h += pmEntries.length? `<div class="card card-pad">${hBarChart(pmEntries.map(([k,v])=>({name:k,mins:v})))}</div>` : `<div class="small faint">No incorrect attempts recorded yet.</div>`;
  }
  h += `</div><div id="insight-strong" style="display:none">`;
  const masteredT = started.filter(t=>topicMastery(t)>=76).sort((a,b)=>topicMastery(b)-topicMastery(a));
  const highAcc = STATE.topics.filter(t=>{const a=topicAccuracy(t.id); return a!=null && a>=80 && questionsOfTopic(t.id).length>=3;});
  if(!masteredT.length && !highAcc.length){
    h += `<div class="emptystate card"><div class="big">🌱</div><h3>Strengths will show up here</h3><p class="small">Once topics reach strong mastery or high accuracy, they'll be listed.</p></div>`;
  } else {
    h += `<div class="section-title"><h3>Strong / mastered topics</h3></div>`;
    h += masteredT.length? masteredT.map(t=>topicRow(t)).join('') : `<div class="small faint">None yet.</div>`;
    h += `<div class="section-title"><h3>High accuracy topics (≥80%, 3+ questions)</h3></div>`;
    h += highAcc.length? highAcc.map(t=>topicRow(t)).join('') : `<div class="small faint">None yet.</div>`;
  }
  h += `</div>`;
  c.innerHTML = h;
}
function switchInsightTab(el){
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active')); el.classList.add('active');
  const tab = el.dataset.tab;
  document.getElementById('insight-weak').style.display = tab==='weak'?'block':'none';
  document.getElementById('insight-strong').style.display = tab==='strong'?'block':'none';
}
function topicRow(t){
  const m = topicMastery(t); const subj = getSubject(t.subjectId);
  return `<div class="card card-pad mt2 flex jcsb aic" style="cursor:pointer" onclick="navigate('topic','${t.id}')">
    <div><b style="font-size:13px">${esc(t.title)}</b><div class="small faint">${esc(subj.name)}</div></div>
    <span class="tag ${masteryTagClass(m)}">${m}%</span>

}

    <b>Mastery</b> = 0.25·Coverage + 0.35·Accuracy(50% overall + 50% recent) + 0.20·Revision Consistency + 0.10·Retention(0 until first studied, then decays with days since last studied) + 0.10·Time Efficiency(0 until at least one timed attempt exists)<br>
    <span class="faint">A topic with no recorded activity always scores 0% — no component defaults to a "neutral" value.</span><br>
    <span class="faint">Bands: 0–20 Unknown · 21–40 Weak · 41–60 Developing · 61–75 Moderate · 76–90 Strong · 91–100 Mastered</span><br><br>
    <b>Priority Score</b> = weighted average of: current-affairs-link signal (freq), weakness (100 − accuracy), difficulty×20, revision urgency, current-affairs count, and your own 1–5 priority — weights editable above.<br><br>
    <b>Readiness</b>: Knowledge = avg. coverage across all topics · Practice = 50% volume vs. target + 50% accuracy · Revision = % of <i>started</i> topics (studied or scheduled) that are not overdue — untouched topics are excluded rather than counted as "healthy". Overall = weighted sum (weights above). All three, and the overall score, are 0% on a fresh install.
  </div>`;

  h += `<div class="section-title"><h3>Appearance</h3></div>
  <div class="card card-pad">
    <div class="small muted">Theme is also available from the top bar.</div>
    <div class="themebtns mt2" style="width:fit-content">
      <button data-t="light" onclick="setTheme('light')" class="${s.theme==='light'?'active':''}">☀ Light</button>
      <button data-t="dark" onclick="setTheme('dark')" class="${s.theme==='dark'?'active':''}">☾ Dark</button>
      <button data-t="system" onclick="setTheme('system')" class="${s.theme==='system'?'active':''}">◐ System</button>
    </div>
  </div>`;

  h += `<div class="section-title"><h3>Data management</h3></div>
  <div class="card card-pad">
    <div class="btnrow">
      <button class="btn" onclick="exportData()">⬇ Export full backup (JSON)</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">⬆ Import backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
      <button class="btn" onclick="loadDemoData()">Load Demo Data</button>
      <button class="btn danger" onclick="clearDemoData()">Clear Demo Data only</button>
      <button class="btn danger" onclick="resetEverything()">Reset ALL data</button>
    </div>
    <p class="small faint mt3">Everything is stored only in this browser's local storage (localStorage). Nothing is sent to any server. Export regularly to keep a safe backup, especially before clearing browser data.</p>
  </div>`;

  h += `<div class="section-title"><h3>About this application</h3></div>
  <div class="card card-pad small" style="line-height:1.8">
    Built from the official <b>50th BCS Preliminary Test Syllabus</b> (200 marks across 10 subjects).
    <br><br>
    <span class="label-official">Official Syllabus</span> — subject names, sections, official wording and marks are taken directly from the syllabus PDF.<br>
    <span class="label-suggested">Suggested Preparation Breakdown / Possible Question Areas</span> — an analytical layer generated from general preparation heuristics per topic category. These are reasoned study aids, <b>not</b> guarantees of future question content or frequency.<br>
    <span class="label-personal">Personal data</span> — everything you record (progress, questions, attempts, notes, revisions, resources) and every analytic derived from it.<br><br>
    Historical question-frequency analysis only appears once you enter real past questions — nothing is fabricated. If no historical questions exist for a topic, the app will say so rather than inventing a number.
  </div>`;

  c.innerHTML = h;
}
function saveGeneralSettings(){
  const s = STATE.settings;
  s.examDate = document.getElementById('st_exam').value || null;
  s.dailyStudyTargetMin = Number(document.getElementById('st_daily').value)||120;
  s.weeklyQuestionTarget = Number(document.getElementById('st_weekq').value)||150;
  s.defaultRevisionInterval = Number(document.getElementById('st_revint').value)||7;
  s.masteryThreshold = Number(document.getElementById('st_mastthresh').value)||75;
  saveState(); toast('Settings saved');
}
function savePriorityWeights(){
  Object.keys(STATE.settings.priorityWeights).forEach(k=>{
    STATE.settings.priorityWeights[k] = Number(document.getElementById('pw_'+k).value)||0;
  });
  saveState(); toast('Priority weights saved');
}
function saveReadinessWeights(){
  Object.keys(STATE.settings.readinessWeights).forEach(k=>{
    STATE.settings.readinessWeights[k] = Number(document.getElementById('rw_'+k).value)||0;
  });
  saveState(); toast('Readiness weights saved');
}

/* =====================================================================
   THEME
   ===================================================================== */
function setTheme(t){
  STATE.settings.theme = t; saveState(); applyTheme();
}
function applyTheme(){
  const t = STATE.settings.theme;
  const effective = t==='system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : t;
  document.body.setAttribute('data-theme', effective);
  document.querySelectorAll('#themeBtns button').forEach(b=> b.classList.toggle('active', b.dataset.t===t));
}
window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(STATE.settings.theme==='system') applyTheme(); });

/* =====================================================================
   DATA MANAGEMENT: export / import / reset / demo
   ===================================================================== */
function exportData(){
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `bcs-tracker-backup-${todayISO()}.json`; a.click();
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function importData(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.subjects || !data.topics){ toast('This file does not look like a valid backup'); return; }
      customConfirm('Import will REPLACE your current data with the contents of this file. This cannot be undone. Continue?', ()=>{
        STATE = data; saveState(); toast('Data imported'); navigate('dashboard');
      }, {title:'Import backup', confirmLabel:'Import & Replace'});
    }catch(e){ toast('Could not read this file'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}
function resetEverything(){
  const body = `
    <p style="font-size:13.3px;line-height:1.6">This will permanently delete <b>all</b> your data — every subject's progress, checklists, questions and attempts, notes, resources, mock exams, current affairs links, and settings. This cannot be undone.</p>
    <p class="small muted mt3">Type <b>RESET</b> below to confirm.</p>
    <input type="text" id="resetConfirmInput" placeholder="Type RESET to confirm" autocomplete="off">
  `;
  const foot = `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" id="resetConfirmBtn" disabled style="opacity:.5;cursor:not-allowed">Reset ALL data</button>`;
  openModal('Reset all data', body, foot);
  const inp = document.getElementById('resetConfirmInput');
  const btn = document.getElementById('resetConfirmBtn');
  inp.addEventListener('input', ()=>{
    const ok = inp.value.trim().toUpperCase()==='RESET';
    btn.disabled = !ok;
    btn.style.opacity = ok? '1':'.5';
    btn.style.cursor = ok? 'pointer':'not-allowed';
  });
  btn.addEventListener('click', ()=>{
    if(inp.value.trim().toUpperCase()!=='RESET') return;
    localStorage.removeItem(STORE_KEY);
    STATE = freshState(); saveState();
    closeModal();
    toast('All data has been reset');
    navigate('dashboard');
  });
  setTimeout(()=>inp.focus(), 50);
}
function clearDemoData(){
  customConfirm('Remove all demo data (clearly marked as demo) while keeping your real progress?', ()=>{
    STATE.questions = STATE.questions.filter(q=>!q.isDemo);
    STATE.mocks = STATE.mocks.filter(m=>!m.isDemo);
    STATE.currentAffairs = STATE.currentAffairs.filter(x=>!x.isDemo);
    STATE.quickNotes = STATE.quickNotes.filter(x=>!x.isDemo);
    STATE.isDemoLoaded = false;
    saveState(); toast('Demo data cleared'); navigate('dashboard');
  }, {title:'Clear demo data', confirmLabel:'Clear demo data'});
}
function loadDemoData(){
  if(STATE.isDemoLoaded){ toast('Demo data already loaded'); return; }
  // pick a handful of topics across subjects and add clearly-labelled sample data
  const picks = [];
  STATE.subjects.forEach(s=>{ const tps = topicsOfSubject(s.id); if(tps.length) picks.push(tps[0]); });
  picks.forEach((t,i)=>{
    t.checklist.readOnce = true; t.checklist.basicUnderstanding = true;
    if(i%2===0){ t.checklist.notesCompleted = true; t.checklist.mcqStarted = true; }
    t.lastStudied = todayISO();
    t.revisionHistory.push({date:todayISO(), note:'[DEMO] initial revision'});
    const dt = new Date(); dt.setDate(dt.getDate()+ (i%2===0? -1: 5));
    t.nextRevision = dt.toISOString().slice(0,10);
    for(let k=0;k<3;k++){
      const q = {
        id:uid('q'), topicId:t.id, subjectId:t.subjectId, isDemo:true,
        text:`[DEMO] Sample practice question ${k+1} for "${t.title}"`,
        source:'Demo dataset', year:'', type: QUESTION_TYPES[k%QUESTION_TYPES.length],
        difficulty: 2+(k%3), correctAnswer:'Option A', explanation:'Demo explanation text.',
        attempts:[{attemptNo:1,date:todayISO(),userAnswer:'Option A',correct:(k!==1),timeSec:30+k*5,confidence:3,mistakeType:(k===1?'Conceptual mistake':null),notes:''}]
      };
      STATE.questions.push(q);
    }
  });
  STATE.currentAffairs.push({id:uid('ca'), topicId:picks[2]?picks[2].id:picks[0].id, isDemo:true, event:'[DEMO] Sample current affairs link', date:todayISO(), source:'Demo', related:'', notes:'This is sample data to show how current affairs linking works.'});
  STATE.mocks.push({id:uid('mock'), isDemo:true, name:'[DEMO] Sample Mock Test', date:todayISO(), totalQuestions:200, totalMarks:200, timeMin:120, score:126, notes:'[DEMO] Weak in Math and Bangladesh Affairs.'});
  STATE.quickNotes.push({id:uid('note'), isDemo:true, topicId:picks[0].id, tag:'Remember this', text:'[DEMO] This is a sample note.', date:todayISO()});
  STATE.isDemoLoaded = true;
  saveState(); toast('Demo data loaded — clearly marked, safe to clear anytime'); navigate('dashboard');
}

/* =====================================================================
   GLOBAL SEARCH
   ===================================================================== */
function runGlobalSearch(q){
  q = q.trim().toLowerCase();
  const box = document.getElementById('searchresults');
  if(!q){ box.style.display='none'; box.innerHTML=''; return; }
  const results = [];
  STATE.topics.forEach(t=>{
    const subj = getSubject(t.subjectId);
    const hay = (t.title+' '+t.official+' '+t.subtopics.join(' ')+' '+t.notes+' '+t.doubts).toLowerCase();
    if(hay.includes(q)) results.push({type:'Topic', label:t.title, meta:subj.name, go:()=>navigate('topic',t.id)});
  });
  STATE.questions.forEach(qu=>{
    if(qu.text.toLowerCase().includes(q)) results.push({type:'Question', label:qu.text.slice(0,70), meta:getTopic(qu.topicId)?.title||'', go:()=>navigate('topic',qu.topicId)});
  });
  STATE.quickNotes.forEach(n=>{
    if(n.text.toLowerCase().includes(q)) results.push({type:'Note', label:n.text.slice(0,70), meta:n.tag, go:()=>navigate('notes')});
  });
  STATE.resources.forEach(r=>{
    if((r.name+' '+r.author).toLowerCase().includes(q)) results.push({type:'Resource', label:r.name, meta:r.type, go:()=>navigate('resources')});
  });
  PATTERN_TAGS.forEach(p=>{
    if(p.toLowerCase().includes(q)) results.push({type:'Pattern', label:p, meta:'Question pattern tag', go:()=>navigate('patternmatrix')});
  });
  if(!results.length){ box.innerHTML = `<div class="sr-item faint">No matches</div>`; box.style.display='block'; return; }
  box.innerHTML = results.slice(0,25).map((r,i)=>`<div class="sr-item" data-i="${i}"><div class="t">${esc(r.label)}</div><div class="m">${esc(r.type)} · ${esc(r.meta)}</div></div>`).join('');
  box.style.display='block';
  Array.from(box.children).forEach((el,i)=> el.addEventListener('click', ()=>{ results[i].go(); box.style.display='none'; document.getElementById('globalSearch').value=''; }));
}

/* =====================================================================
   INIT
   ===================================================================== */
function init(){
  loadState();
  applyTheme();
  document.getElementById('themeBtns').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return; setTheme(b.dataset.t);
  });
  document.getElementById('globalSearch').addEventListener('input', debounce(e=>runGlobalSearch(e.target.value), 150));
  document.addEventListener('click', e=>{
    if(!e.target.closest('#searchbox')) document.getElementById('searchresults').style.display='none';
  });
  document.getElementById('menutoggle').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));
  navigate('dashboard');
}
init();
</script>
