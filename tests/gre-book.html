<!doctype html><html lang="en"><head><meta charset="utf-8"><title>GRE book workflow checks</title><style>body{font:14px system-ui;background:#f5f7fa;margin:24px}iframe{width:1250px;height:850px;border:1px solid #dbe4e9}li{padding:5px}.pass{color:#236a43}.fail{color:#a03535}</style></head><body><h1>GRE book workflow checks</h1><p id="status">Running…</p><ol id="results"></ol><iframe id="app-frame" title="GRE test account"></iframe><script>
(async()=>{
 const frame=document.getElementById('app-frame'),uid='qa-gre-'+Date.now(),results=[];let win,doc;
 const pause=ms=>new Promise(r=>setTimeout(r,ms)),assert=(x,m)=>{if(!x)throw new Error(m);};
 async function until(fn,timeout=15000){const end=Date.now()+timeout;while(Date.now()<end){if(fn())return;await pause(70);}throw new Error('Condition timed out');}
 async function check(name,fn){try{await fn();results.push({name,passed:true});}catch(e){results.push({name,passed:false,error:e.message});}const r=results.at(-1),li=document.createElement('li');li.className=r.passed?'pass':'fail';li.textContent=name+': '+(r.passed?'PASS':r.error);document.getElementById('results').append(li);}
 async function load(hash='overview',user=uid){await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Initialization timed out')),18000);frame.onload=()=>{const done=()=>{clearTimeout(timer);resolve();};frame.contentWindow.addEventListener('study-ready',done,{once:true});if(frame.contentDocument.getElementById('ag-overlay')?.style.display==='none')done();};frame.src='../bank/gre-big-book/reader.html?qa-user='+user+'&run='+Date.now()+'#'+hash;});win=frame.contentWindow;doc=win.document;await pause(250);}
 const click=selector=>{const el=doc.querySelector(selector);assert(el,'Missing '+selector);el.click();};
 const go=async view=>{click(`[data-view="${view}"]`);await until(()=>doc.querySelector(`.gre-tabs [data-view="${view}"]`)?.getAttribute('aria-current')==='page');};
 const state=()=>JSON.parse(win.localStorage.getItem('gre_big_book_v1'));
 await load();
 await check('Bank catalog includes the complete book',()=>{const mod=win.STUDY_CATALOG.find(m=>m.id==='gre-big-book');assert(mod?.category==='bank','Bank category missing');assert(win.GRE_BOOK.tests.length===27&&win.GRE_BOOK.questionCount===5020,'Incomplete source index');assert(doc.querySelector('#ui-studybar'),'Shared navigation missing');});
 await check('All tests and section filters are accessible',async()=>{await go('tests');assert(doc.querySelectorAll('.gre-test').length===27,'Missing tests');assert(doc.querySelectorAll('.gre-section-row').length===162,'Missing sections');const filter=doc.getElementById('ability-filter');filter.value='quantitative';filter.dispatchEvent(new win.Event('change',{bubbles:true}));assert(doc.querySelectorAll('.gre-section-row').length===54,'Quantitative filter wrong');filter.value='all';filter.dispatchEvent(new win.Event('change',{bubbles:true}));});
 await check('Original scan renders alongside a two-question study session',async()=>{click('[data-action="setup"][data-section="t01-s3"]');doc.getElementById('setup-last').value='2';doc.getElementById('setup-form').requestSubmit();await until(()=>doc.querySelector('.gre-answer-panel'));await until(()=>doc.getElementById('pdf-canvas')?.dataset.renderedPage==='43',25000);assert(doc.getElementById('pdf-canvas').width>200,'PDF canvas blank');assert(doc.querySelectorAll('[data-answer]').length===4,'Answer choices missing');});
 await check('Checking answers preserves the reader and records correct/wrong',()=>{const canvas=doc.getElementById('pdf-canvas');click('[data-answer=A]');click('[data-action=check]');assert(doc.querySelector('.gre-feedback.good'),'Correct feedback missing');click('[data-question="2"]');click('[data-answer=B]');click('[data-action=check]');assert(doc.querySelector('.gre-feedback.bad'),'Wrong feedback missing');assert(doc.getElementById('pdf-canvas')===canvas,'Answering unnecessarily recreated the reader');assert(state().questions['t01-s3-q01'].correctCount===1,'Correct answer missing');assert(state().questions['t01-s3-q02'].wrongCount===1,'Wrong answer missing');});
 await check('Notes, reason and bookmark survive reload in a draft',async()=>{click('[data-action=bookmark]');const note=doc.getElementById('question-note');note.value='Check <b>the method</b> before calculating.';note.dispatchEvent(new win.Event('input',{bubbles:true}));doc.getElementById('mistake-reason').value='calculation';doc.getElementById('mistake-reason').dispatchEvent(new win.Event('change',{bubbles:true}));await load('practice');assert(doc.getElementById('question-note').value.includes('<b>the method</b>'),'Note lost');assert(doc.getElementById('mistake-reason').value==='calculation','Error reason lost');assert(doc.querySelector('[data-action=bookmark]').getAttribute('aria-pressed')==='true','Bookmark lost');});
 await check('Submitting checked answers never double counts',async()=>{click('[data-action=finish]');click('#confirm-finish');const summary=(await win.StudyStore.summaries()).find(s=>s.id==='gre-big-book');assert(summary.attempted===2&&summary.correct===1,'Incorrect shared counts');assert(summary.bookmarks===1&&summary.notes===1,'Notes/bookmark missing from shared record');assert(state().history[0].correct===1&&state().history[0].wrong===1,'Session result wrong');});
 await check('Cloud sync and full-site backup include the new state',async()=>{await win.StudyStore.flush();const cloud=JSON.parse(localStorage.getItem('__qaCloud'));assert(cloud['/users/'+uid+'/progress/gre-big-book'].data.gre_big_book_v1,'Cloud record missing');const backup=await win.StudyStore.exportBackup();assert(JSON.parse(backup.modules['gre-big-book'].gre_big_book_v1).questions['t01-s3-q02'].note.includes('method'),'Backup lost notes');});
 await check('Timed expiry auto-submits answers and preserves blanks as skipped',async()=>{await go('tests');click('[data-action=setup][data-section="t01-s3"]');doc.getElementById('setup-last').value='2';doc.getElementById('setup-mode').value='timed';doc.getElementById('setup-mode').dispatchEvent(new win.Event('change',{bubbles:true}));doc.getElementById('setup-minutes').value='1';doc.getElementById('setup-form').requestSubmit();await until(()=>doc.querySelector('.gre-answer-panel'));click('[data-answer=A]');assert(!doc.querySelector('[data-action=check]'),'Timed mode exposes check');const original=win.Date.now;win.Date.now=()=>original()+61000;doc.dispatchEvent(new win.Event('visibilitychange'));win.Date.now=original;assert(state().history[0].skipped===1&&state().history[0].correct===1,'Expiry result wrong');assert(!state().drafts['t01-s3'],'Expired draft remains');});
 await check('Mistake journal renders notes safely and ratings do not alter accuracy',async()=>{await go('revision');const filter=doc.getElementById('review-filter');filter.value='notes';filter.dispatchEvent(new win.Event('change',{bubbles:true}));assert(doc.querySelectorAll('.gre-review-card').length===1,'Notes view missing');assert(doc.querySelector('.gre-review-note').textContent.includes('<b>the method</b>')&&!doc.querySelector('.gre-review-note b'),'Note was interpreted as markup');click('[data-action=rate-question][data-known=true]');const s=(await win.StudyStore.summaries()).find(s=>s.id==='gre-big-book');assert(s.attempted===3&&s.correct===2&&s.mastered===1,'Rating changed accuracy');});
 await check('Vocabulary cards, review dates and IBA goal persist',async()=>{await go('vocabulary');const form=doc.getElementById('word-form');form.elements.word.value='inference';form.elements.meaning.value='A conclusion supported by evidence';form.elements.example.value='Separate an inference from an assumption.';form.requestSubmit();assert(Object.values(state().words).length===1,'Word missing');click('[data-action=rate-word][data-known=true]');await go('plan');click('[data-target=iba]');const step=doc.querySelector('[data-plan=diagnostic]');step.checked=true;step.dispatchEvent(new win.Event('change',{bubbles:true}));await load('plan');assert(state().target==='iba'&&state().planDone.diagnostic,'Goal or plan lost');});
 await check('Mobile reading and answer panes fit a 390px screen',async()=>{frame.style.width='390px';await load('tests');click('[data-action=setup][data-section="t02-s2"]');doc.getElementById('setup-last').value='1';doc.getElementById('setup-form').requestSubmit();await until(()=>doc.querySelector('.gre-mobile-study-switch'));await pause(200);assert(win.getComputedStyle(doc.querySelector('.gre-answer-panel')).display==='none','Reading pane is crowded by answer form');click('[data-action=room-pane][data-pane=answer]');assert(win.getComputedStyle(doc.querySelector('.gre-reader')).display==='none','Reader does not switch away');assert(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth,'Mobile horizontal overflow');assert(win.QA_ERRORS.length===0,win.QA_ERRORS.map(e=>e.message).join('; '));});
 await check('A different account cannot inherit this book’s progress',async()=>{await load('overview',uid+'-other');assert(!win.localStorage.getItem('gre_big_book_v1'),'Account data leaked');});
 const failed=results.filter(r=>!r.passed).length;document.getElementById('status').textContent='Complete: '+(results.length-failed)+'/'+results.length+' checks passed';fetch('/__qa/report',{method:'POST',body:JSON.stringify({kind:'gre-book-complete',total:results.length,failed,results})});
})().catch(e=>{document.getElementById('status').textContent='Stopped: '+e.message;fetch('/__qa/report',{method:'POST',body:JSON.stringify({kind:'gre-book-error',message:e.message})});});
</script></body></html>
