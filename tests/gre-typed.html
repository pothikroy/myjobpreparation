<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Typed GRE workflow checks</title><style>body{font:15px system-ui;margin:24px}iframe{width:1250px;height:850px;border:1px solid #ccc}li{padding:5px}.pass{color:#235e3b}.fail{color:#a22}</style></head><body><h1>Typed GRE workflow checks</h1><p id="status">Running…</p><ol id="results"></ol><iframe id="frame" title="Isolated study account"></iframe><script>
(async()=>{
 const frame=document.getElementById('frame'),uid='qa-gre-typed-'+Date.now(),results=[];let w,d;
 const pause=ms=>new Promise(r=>setTimeout(r,ms)),assert=(x,m)=>{if(!x)throw Error(m);};
 async function until(fn){const end=Date.now()+20000;while(Date.now()<end){if(fn())return;await pause(60);}throw Error('Timed out');}
 async function load(hash='overview',user=uid){const run=Date.now()+'-'+Math.random();frame.src='/bank/gre-big-book/index.html?qa-user='+user+'&run='+run+'#'+hash;await until(()=>new URLSearchParams(frame.contentWindow.location.search).get('run')===run&&frame.contentWindow.GreTypedApp&&frame.contentDocument.querySelector('#gre-content h1'));w=frame.contentWindow;d=w.document;}
 const click=s=>{const x=d.querySelector(s);assert(x,'Missing '+s);x.click();},state=()=>JSON.parse(w.localStorage.getItem('gre_big_book_v1')||'{}');
 async function go(v){click('[data-view="'+v+'"]');await until(()=>w.location.hash==='#'+v);await pause(80);}
 function select(id,value){d.getElementById(id).value=value;d.getElementById(id).dispatchEvent(new w.Event('change',{bubbles:true}));}
 async function check(name,fn){try{await fn();results.push({name,passed:true});}catch(e){results.push({name,passed:false,error:e.message});}const x=results.at(-1),li=document.createElement('li');li.className=x.passed?'pass':'fail';li.textContent=name+': '+(x.passed?'PASS':x.error);document.getElementById('results').append(li);}
 await load();
 await check('Main experience is native text and does not load the PDF reader',()=>{assert(d.querySelector('h1').textContent.includes('Study the skill'),'Typed overview missing');assert(!d.querySelector('canvas,img,embed,object'),'Scanned content on main page');assert(!w.performance.getEntriesByType('resource').some(r=>/pdf\.mjs|pdf\.worker|gre-big-book\.pdf/.test(r.name)),'PDF unexpectedly loaded');});
 await check('All 14 skill lessons have an exam mapping and reusable method',async()=>{await go('topics');assert(d.querySelectorAll('.typed-topic').length===14,'Missing lessons');click('[data-act=lesson][data-topic=percent]');await until(()=>d.querySelector('.typed-example'));assert(d.querySelector('.typed-lesson').textContent.includes('94.24'),'Worked example missing');});
 await check('Search opens typed salary question, columns and complete answer choices',async()=>{await go('bank');const q=d.getElementById('typed-search');q.value='salary';q.dispatchEvent(new w.Event('input',{bubbles:true}));click('[data-act=open][data-id=t01-s3-q15]');await until(()=>d.querySelector('.typed-item'));assert(d.querySelector('.typed-columns').textContent.includes('Julio'),'Native columns missing');assert(d.querySelectorAll('.typed-options button').length===4,'Four choices missing');click('[data-act=single]');await until(()=>d.querySelector('.typed-session'));});
 await check('Answer checking, Bengali notes, bookmarks and the session survive reload',async()=>{click('[data-choice=A]');click('[data-act=check]');assert(d.querySelector('.typed-feedback.good'),'Answer feedback missing');click('[data-act=bookmark]');const n=d.getElementById('typed-note');n.value='শতকরা পরিবর্তনের ভিত্তি দেখুন <img src=x>';n.dispatchEvent(new w.Event('input',{bubbles:true}));select('typed-reason','Concept / method');await pause(250);await load('study');assert(d.getElementById('typed-note').value.includes('শতকরা'),'Note lost');assert(d.querySelector('[data-act=bookmark]').textContent.includes('Saved'),'Bookmark lost');assert(!d.querySelector('.typed-notes img'),'Note interpreted as markup');});
 await check('Submission retains original question IDs and never double counts',async()=>{click('[data-act=submit]');click('[data-act=finish]');await until(()=>w.location.hash==='#result');const s=state(),r=s.questions['t01-s3-q15'];assert(r.attempts===1&&r.correctCount===1,'Double counted');const sum=(await w.StudyStore.summaries()).find(s=>s.id==='gre-big-book');assert(sum.attempted===1&&sum.correct===1&&sum.bookmarks===1,'Shared progress mismatch');});
 await check('Drafts are labeled and require personal text confirmation before scoring',async()=>{await go('bank');const search=d.getElementById('typed-search');search.value='';search.dispatchEvent(new w.Event('input',{bubbles:true}));select('quality-filter','transcribed');const id=d.querySelector('[data-act=open]').dataset.id;click('[data-act=open][data-id="'+id+'"]');await until(()=>d.querySelector('.typed-warning'));assert(!d.querySelector('[data-act=single]'),'Draft could be practised without checking');d.getElementById('confirm-text').click();assert(d.querySelector('[data-act=single]'),'Personally confirmed draft still blocked');});
 await check('Reading questions include the retyped shared passage',async()=>{await go('bank');select('quality-filter','reviewed');select('topic-filter','reading');click('[data-act=open][data-id=t01-s1-q17]');await until(()=>d.querySelector('.typed-passage'));assert(d.querySelector('.typed-passage').textContent.includes('Maunder minimum'),'Passage missing');assert(d.querySelector('.typed-options').textContent.includes('terrestrial'),'Choices missing');});
 await check('Timed sets hide feedback, expire while away and preserve skips',async()=>{await go('bank');click('[data-act=custom-set]');d.getElementById('set-count').value='2';d.getElementById('set-minutes').value='1';d.getElementById('set-form').requestSubmit();await until(()=>d.querySelector('.typed-session'));assert(!d.querySelector('[data-act=check]'),'Timed answer exposed');click('[data-choice=C]');const old=w.Date.now;w.Date.now=()=>old()+61000;d.dispatchEvent(new w.Event('visibilitychange'));w.Date.now=old;await until(()=>w.location.hash==='#result');assert(state().history[0].skipped===1&&state().history[0].correct===1,'Incorrect expiry grading');});
 await check('Cloud and backup include typed sessions and the old progress schema',async()=>{await w.StudyStore.flush();const backup=await w.StudyStore.exportBackup(),s=JSON.parse(backup.modules['gre-big-book'].gre_big_book_v1);assert(s.questions['t01-s3-q15'].note.includes('শতকরা'),'Backup lost Bengali note');assert(s.history[0].kind==='typed','Typed result missing');});
 await check('The 390px mobile layout fits lessons, bank and question pages',async()=>{frame.style.width='390px';await go('topics');await pause(120);assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'Lesson overflow');await go('bank');await pause(100);assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'Bank overflow');click('[data-act=open][data-id=t01-s1-q17]');await until(()=>d.querySelector('.typed-passage'));assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'Question overflow');assert(!w.QA_ERRORS.length,JSON.stringify(w.QA_ERRORS));});
 await check('Exam map labels source authority and separates missing local exam subjects',async()=>{await go('plan');assert(d.querySelectorAll('.typed-source').length===4,'Source list missing');assert(d.body.textContent.includes('Secondary preparation guide')&&d.body.textContent.includes('Financial and banking knowledge'),'Authority or gaps missing');click('[data-target=iba]');assert(d.body.textContent.includes('Admission interview practice'),'IBA track missing');});
 await check('Another account does not inherit typed answers or notes',async()=>{await load('overview',uid+'-other');const fresh=state();assert(!Object.keys(fresh.questions||{}).length&&!Object.keys(fresh.words||{}).length&&!(fresh.history||[]).length&&!fresh.typedSession,'Account isolation failed');});
 const failed=results.filter(r=>!r.passed).length;document.getElementById('status').textContent=`Complete: ${results.length-failed}/${results.length} passed`;fetch('/__qa/report',{method:'POST',body:JSON.stringify({kind:'gre-typed-complete',total:results.length,failed,results})});
})().catch(e=>{document.getElementById('status').textContent='Stopped: '+e.message;});
</script></body></html>
