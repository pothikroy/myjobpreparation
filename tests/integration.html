<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Unified progress integration checks</title><style>body{font:14px system-ui;margin:25px;background:#f5f3ed}iframe{width:1200px;height:700px;border:1px solid #ccc}.pass{color:green}.fail{color:crimson}li{padding:6px}</style></head><body><h1>Unified progress integration checks</h1><p id="status">Starting…</p><ol id="results"></ol><div id="host"></div><script>
(async function(){
 const results=document.getElementById('results'),host=document.getElementById('host');let failed=0,passed=0;
 const assert=(value,message)=>{if(!value)throw new Error(message);};
 async function check(name,fn){try{await fn();passed++;const li=document.createElement('li');li.className='pass';li.textContent=name+': PASS';results.append(li);}catch(e){failed++;const li=document.createElement('li');li.className='fail';li.textContent=name+': '+e.message;results.append(li);}}
 async function load(url,uid){
  localStorage.setItem('__qa_uid',uid);const frame=document.createElement('iframe');host.replaceChildren(frame);
  return new Promise((resolve,reject)=>{
   let done=false;const complete=()=>{if(done)return;done=true;clearTimeout(timer);resolve(frame.contentWindow);};
   const timer=setTimeout(()=>reject(new Error('Page did not initialize')),16000);
   frame.onload=()=>{frame.contentWindow.addEventListener('study-ready',()=>setTimeout(complete,300),{once:true});if(frame.contentWindow.StudyStore?.status().uid && frame.contentDocument.getElementById('ag-overlay')?.style.display==='none')setTimeout(complete,300);};
   frame.src=url;
  });
 }
 const qaUser='integration-'+Date.now(),otherUser=qaUser+'-other';
 const cloud=JSON.parse(localStorage.getItem('__qaCloud') || '{}');
 const fixture={questions:{q1:{attempts:4,correctCount:3,wrongCount:1,status:'mastered',nextRevision:'2020-01-01'}}};
 cloud['/users/'+qaUser+'/progress/math']={data:{bcsMathStudy_v1:JSON.stringify(fixture)},__time:Date.now()};localStorage.setItem('__qaCloud',JSON.stringify(cloud));
 let app=await load('../index.html',qaUser),backup;
 await check('Cloud hydration before module use',async()=>{assert(JSON.parse(app.localStorage.getItem('bcsMathStudy_v1')).questions.q1.correctCount===3,'cloud data missing');const s=(await app.StudyStore.summaries()).find(s=>s.id==='math');assert(s.attempted===4 && s.correct===3 && s.due===1,'summary mismatch');});
 await check('Local edits upload to original cloud document',async()=>{fixture.questions.q1.correctCount=4;app.localStorage.setItem('bcsMathStudy_v1',JSON.stringify(fixture));await app.StudyStore.flush();const data=JSON.parse(localStorage.getItem('__qaCloud'));assert(JSON.parse(data['/users/'+qaUser+'/progress/math'].data.bcsMathStudy_v1).questions.q1.correctCount===4,'edit missing in cloud');});
 await check('All-module backup retains notes and original schemas',async()=>{app.localStorage.setItem('buApp_v2',JSON.stringify({progress:{q:{status:'knew',dueAt:1}},notes:{q:'preserve this note'}}));backup=await app.StudyStore.exportBackup();assert(Object.keys(backup.modules).length===app.STUDY_CATALOG.filter(m=>m.storage).length+1,'backup must include all persisted modules + hub');assert(JSON.parse(backup.modules['bangla-uttaran-app'].buApp_v2).notes.q==='preserve this note','note missing');});
 await check('Malformed backup rejected before any mutation',async()=>{const before=app.localStorage.getItem('buApp_v2');let rejected=false;try{await app.StudyStore.importBackup({format:'myjobpreparation-backup',version:1,modules:{evil:{password:'x'}}});}catch(e){rejected=true;}assert(rejected && before===app.localStorage.getItem('buApp_v2'),'invalid import changed progress');});
 await check('Whole-site restore recovers changed progress',async()=>{app.localStorage.removeItem('buApp_v2');await app.StudyStore.importBackup(backup);assert(JSON.parse(app.localStorage.getItem('buApp_v2')).notes.q==='preserve this note','restore failed');});
 await check('Offline writes remain pending and retry successfully',async()=>{localStorage.setItem('__qaOffline','1');fixture.questions.q1.correctCount=2;app.localStorage.setItem('bcsMathStudy_v1',JSON.stringify(fixture));await app.StudyStore.flush();assert(!!app.StudyStore.status().error,'offline status missing');assert(JSON.parse(app.localStorage.getItem('bcsMathStudy_v1')).questions.q1.correctCount===2,'local offline edit lost');localStorage.removeItem('__qaOffline');await app.StudyStore.flush();assert(!app.StudyStore.status().error,'retry did not recover');});
 await check('Module loads hydrated state inside the workspace',async()=>{app=await load('../bcs/question-bank/Math_Interactive_Study_System.html',qaUser);assert(JSON.parse(app.localStorage.getItem('bcsMathStudy_v1')).questions.q1.correctCount===2,'module loaded stale data');assert(app.QA_ERRORS.length===0,'module runtime error');});
 await check('IndexedDB exam writes mark records for cloud sync',async()=>{app=await load('../bcs/question-bank/BCS_44_50_Exam_Simulator.html',qaUser);await app.idbPut('attempts',{id:'qa-attempt',correct:8,wrong:2,total:20});await app.StudyStore.flush();const cloud=JSON.parse(localStorage.getItem('__qaCloud'));assert(cloud['/users/'+qaUser+'/progress/exam-simulator'].data.attempts[0].id==='qa-attempt','exam did not sync');const backup=await app.StudyStore.exportBackup();assert(backup.modules['exam-simulator'].attempts[0].correct===8,'exam missing from backup');});
 await check('A second account cannot inherit another account’s records',async()=>{app=await load('../index.html',otherUser);assert(app.localStorage.getItem('bcsMathStudy_v1')===null,'local records leaked');const s=(await app.StudyStore.summaries()).find(s=>s.id==='exam-simulator');assert(s.attempted===0,'exam records leaked');});
 await check('Returning account recovers its own saved progress',async()=>{app=await load('../index.html',qaUser);assert(JSON.parse(app.localStorage.getItem('bcsMathStudy_v1')).questions.q1.correctCount===2,'returning account lost data');});
 await check('Manual sync retrieves changes from another device',async()=>{const memory=JSON.parse(localStorage.getItem('__qaCloud'));fixture.questions.q1.correctCount=1;memory['/users/'+qaUser+'/progress/math']={data:{bcsMathStudy_v1:JSON.stringify(fixture)},__time:Date.now()+1000};localStorage.setItem('__qaCloud',JSON.stringify(memory));await app.StudyStore.syncNow();assert(JSON.parse(app.localStorage.getItem('bcsMathStudy_v1')).questions.q1.correctCount===1,'remote update missing');});
 await check('Mobile overview fits a 390px viewport',async()=>{const frame=host.querySelector('iframe');frame.style.border='0';frame.style.width='390px';await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));assert(app.document.documentElement.clientWidth<=390 && app.document.documentElement.clientWidth>=375,'test viewport mismatch: '+app.document.documentElement.clientWidth);assert(app.document.documentElement.scrollWidth<=app.document.documentElement.clientWidth,'horizontal overflow');assert(app.getComputedStyle(app.document.getElementById('mobile-menu')).display!=='none','mobile navigation missing');});
 host.replaceChildren();localStorage.removeItem('__qa_uid');localStorage.removeItem('__qaOffline');document.getElementById('status').textContent=`Complete: ${passed} passed, ${failed} failed`;
 fetch('/__qa/report',{method:'POST',body:JSON.stringify({kind:'integration-complete',passed,failed})});
})();
</script></body></html>
