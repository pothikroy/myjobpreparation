<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Large GRE progress cloud checks</title><style>body{font:14px system-ui;margin:24px}.pass{color:#236a43}.fail{color:#a03535}iframe{width:1100px;height:700px}</style></head><body><h1>Large GRE progress cloud checks</h1><p id="status">Running…</p><ol id="results"></ol><iframe id="frame" title="Isolated cloud test"></iframe><script>
(async()=>{
 const frame=document.getElementById('frame'),uid='qa-gre-cloud-'+Date.now(),key='gre_big_book_v1',path='/users/'+uid+'/progress/',results=[];let app;
 const assert=(x,m)=>{if(!x)throw new Error(m);},memory=()=>JSON.parse(localStorage.getItem('__qaCloud')||'{}');
 async function check(name,fn){try{await fn();results.push({name,passed:true});}catch(e){results.push({name,passed:false,error:e.message});}const r=results.at(-1),li=document.createElement('li');li.className=r.passed?'pass':'fail';li.textContent=name+': '+(r.passed?'PASS':r.error);document.getElementById('results').append(li);}
 async function load(){await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Load timed out')),15000);frame.onload=()=>{const done=()=>{clearTimeout(timer);resolve();};frame.contentWindow.addEventListener('study-ready',done,{once:true});if(frame.contentDocument.getElementById('ag-overlay')?.style.display==='none')done();};frame.src='../index.html?qa-user='+uid+'&run='+Date.now()+'#progress';});app=frame.contentWindow;}
 await load();const small=JSON.stringify({version:1,questions:{q:{note:'small original record'}}});
 const text='বাংলা🙂 reasoning '.repeat(17000),large=JSON.stringify({version:1,questions:{q:{note:text}}});let oldParts=[];
 await check('Small records retain the legacy cloud document',async()=>{app.localStorage.setItem(key,small);await app.StudyStore.flush();assert(memory()[path+'gre-big-book'].data[key]===small,'Inline data changed');});
 await check('Interrupted part upload preserves the preceding cloud snapshot',async()=>{localStorage.setItem('__qaFailPart','1');app.localStorage.setItem(key,large);await app.StudyStore.flush();localStorage.removeItem('__qaFailPart');assert(app.StudyStore.status().error,'Failed upload not reported');assert(memory()[path+'gre-big-book'].data[key]===small,'Incomplete upload replaced the valid snapshot');assert(app.localStorage.getItem(key)===large,'Pending local data lost');});
 await check('Retry publishes bounded Unicode parts and a complete manifest',async()=>{await app.StudyStore.flush();const cloud=memory(),manifest=cloud[path+'gre-big-book'];assert(!app.StudyStore.status().error,'Retry failed');assert(manifest.format==='study-text-parts-v1'&&manifest.parts.length>1,'Manifest missing');oldParts=manifest.parts;for(const id of oldParts)assert(new TextEncoder().encode(JSON.stringify(cloud[path+id])).length<1000000,'Part exceeds document size');});
 await check('Another page hydrates the exact large Unicode record',async()=>{const rawKey=Object.keys(localStorage).find(k=>k.includes(uid)&&k.endsWith(key));assert(rawKey,'Physical local key missing');localStorage.removeItem(rawKey);await load();assert(app.localStorage.getItem(key)===large,'Hydration changed Unicode or state');const backup=await app.StudyStore.exportBackup();assert(backup.modules['gre-big-book'][key]===large,'Backup changed the large record');});
 await check('Returning to inline storage removes obsolete parts after commit',async()=>{app.localStorage.setItem(key,small);await app.StudyStore.flush();const cloud=memory();assert(cloud[path+'gre-big-book'].data[key]===small,'Inline replacement failed');assert(oldParts.every(id=>!cloud[path+id]),'Obsolete parts remain');});
 await check('An incomplete manifest never overwrites valid local progress',async()=>{const cloud=memory(),previous=cloud[path+'gre-big-book'];cloud[path+'gre-big-book']={format:'study-text-parts-v1',parts:['gre-big-book--missing--0'],__time:Date.now()+5000};localStorage.setItem('__qaCloud',JSON.stringify(cloud));await load();assert(app.StudyStore.status().error,'Incomplete snapshot not reported');assert(app.localStorage.getItem(key)===small,'Valid local record was overwritten');const fixed=memory();fixed[path+'gre-big-book']=previous;localStorage.setItem('__qaCloud',JSON.stringify(fixed));});
 localStorage.removeItem('__qaFailPart');const failed=results.filter(r=>!r.passed).length;document.getElementById('status').textContent='Complete: '+(results.length-failed)+'/'+results.length+' checks passed';fetch('/__qa/report',{method:'POST',body:JSON.stringify({kind:'gre-cloud-complete',total:results.length,failed,results})});
})().catch(e=>{localStorage.removeItem('__qaFailPart');document.getElementById('status').textContent='Stopped: '+e.message;fetch('/__qa/report',{method:'POST',body:JSON.stringify({kind:'gre-cloud-error',message:e.message})});});
</script></body></html>
