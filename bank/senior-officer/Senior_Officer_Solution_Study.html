:root{--bg:var(--ui-bg,#f5f6f8);--sf:var(--ui-surface,#ffffff);--sf2:var(--ui-surface-2,#eef1f5);--tx:var(--ui-text,#1c2430);--mu:var(--ui-muted,#5c6675);--bd:var(--ui-border,#d9dee6);--ac:var(--ui-accent,#24508f);--acs:var(--ui-accent-soft,#e5edf8);--gd:var(--ui-gold,#a8803a);--gds:var(--ui-gold-soft,#f6eedb);--ok:var(--ui-good,#2e7d4f);--okb:var(--ui-good-bg,#e4f3e8);--bad:var(--ui-bad,#b3402f);--badb:var(--ui-bad-bg,#fae7e3);--bl:var(--ui-blue,#305f9e);--blb:var(--ui-blue-bg,#e6eef9);--r:10px;--f:'Noto Sans Bengali','Inter',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--f);background:var(--bg);color:var(--tx);font-size:16px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--ac)}
#app{max-width:1200px;margin:0 auto;padding:12px 16px 60px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin:6px 0 12px}
.title h1{font-size:20px;margin:0;line-height:1.3}.title small{color:var(--mu);font-size:13px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--bd);border-radius:999px;padding:4px 6px 4px 14px}
.who b{font-size:15px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding:6px 0 8px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:40px;font-size:15px}
.tab[aria-selected=true]{background:var(--ac);color:var(--sf);border-color:var(--ac)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:9px;padding:8px 14px;cursor:pointer;min-height:42px;font-size:15px}
.btn:hover{border-color:var(--ac)}.btn.primary{background:var(--ac);color:var(--sf);border-color:var(--ac)}
.btn.small{min-height:34px;padding:4px 10px;font-size:14px}.btn.danger{color:var(--bad)}.btn.on{background:var(--gds);border-color:var(--gd)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.card h2{font-size:18px;margin:0 0 10px}.card h3{font-size:16px;margin:12px 0 6px}
.stat b{display:block;font-size:26px;line-height:1.2}.stat span{color:var(--mu);font-size:14px}
.muted{color:var(--mu);font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:13px;background:var(--sf2);border:1px solid var(--bd);margin:2px 4px 2px 0}
.pill.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.pill.bad{background:var(--badb);border-color:var(--bad);color:var(--bad)}.pill.mid{background:var(--gds);border-color:var(--gd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mu)}
input[type=text],input[type=number],input[type=search],select,textarea{border:1px solid var(--bd);border-radius:9px;background:var(--sf);padding:8px 10px;min-height:42px}
textarea{width:100%;min-height:70px;resize:vertical}
.q{font-size:17px;font-weight:600;margin:4px 0 12px;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--bd);background:var(--sf);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sf2);font-weight:700;font-family:Inter,sans-serif}
.opt:hover{border-color:var(--ac)}
.opt.sel{border-color:var(--ac);background:var(--acs)}
.opt.right{border-color:var(--ok);background:var(--okb)}.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badb)}.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.exp{margin-top:12px;border-left:4px solid var(--ac);background:var(--sf2);border-radius:0 9px 9px 0;padding:10px 14px}
.exp p{margin:0 0 6px}.exp p.li{padding-left:14px}.exp p.eq{font-family:Inter,'Noto Sans Bengali',sans-serif;padding-left:14px}
.exp .ans{color:var(--ok);font-weight:700}
.note{background:var(--gds);border:1px solid var(--gd);border-radius:9px;padding:8px 12px;margin:8px 0}
.bar{height:10px;background:var(--sf2);border-radius:999px;overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:var(--ac)}
.bar.ok i{background:var(--ok)}.bar.bad i{background:var(--bad)}.bar.mid i{background:var(--gd)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mu);font-weight:600;background:var(--sf2)}
.tablewrap{overflow-x:auto}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.palette button{min-height:38px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);cursor:pointer;font-family:Inter,sans-serif;font-size:13px}
.palette button.ans{background:var(--acs);border-color:var(--ac)}
.palette button.mk{box-shadow:inset 0 -4px 0 var(--gd)}
.palette button.cur{outline:2px solid var(--tx);outline-offset:1px}
.palette button.right{background:var(--okb);border-color:var(--ok)}.palette button.wrong{background:var(--badb);border-color:var(--bad)}
.timer{font-family:Inter,sans-serif;font-weight:700;font-size:20px}
.timer.low{color:var(--bad)}
.testlay{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
@media(max-width:860px){.testlay{grid-template-columns:1fr}.side{position:static}}
@media(max-width:560px){.zone{grid-template-columns:1fr 90px 50px}}
.side{position:sticky;top:64px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px;min-height:34px}
.chip.on{background:var(--ac);color:var(--sf);border-color:var(--ac)}
.qcard{margin-bottom:12px}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.star{border:none;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--gd);min-height:34px;padding:0 6px}
.big{font-size:44px;font-weight:700;line-height:1.1;font-family:Inter,'Noto Sans Bengali',sans-serif}
.zone{display:grid;grid-template-columns:1fr 140px 60px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.empty{text-align:center;padding:30px;color:var(--mu)}
.welcome{max-width:560px;margin:30px auto}
.plist{display:grid;gap:8px;margin-top:10px}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:9px;padding:8px 12px;background:var(--sf)}
.pitem.act{border-color:var(--ac);background:var(--acs)}
svg text{fill:var(--mu);font-size:11px;font-family:Inter,sans-serif}
.kbd{font-family:Inter,sans-serif;font-size:12px;border:1px solid var(--bd);border-radius:5px;padding:0 5px;background:var(--sf2)}
@media print{.tabs,.top .who,.noprint{display:none!important}.card{break-inside:avoid}}

<script type="application/json" id="data-questions">{"sections":[{"id":"english","from":1,"en":"English Language & Grammar","bn":"ইংরেজি ভাষা ও ব্যাকরণ"},{"id":"bangla","from":21,"en":"Bangla Language & Literature","bn":"বাংলা ভাষা ও সাহিত্য"},{"id":"math","from":41,"en":"Mathematics","bn":"গণিত"},{"id":"banking","from":61,"en":"Banking & Finance","bn":"ব্যাংকিং ও ফাইন্যান্স"},{"id":"analytical","from":71,"en":"Analytical & Reasoning","bn":"অ্যানালিটিক্যাল ও রিজনিং"},{"id":"ict","from":91,"en":"Computer & ICT","bn":"কম্পিউটার ও আইসিটি"}],"questions":[{"id":"so001","n":1,"section":"english","q":"The financial crisis could have been averted, ______ the regulatory authorities acted promptly upon receiving the preliminary warnings.","options":{"A":"unless","B":"had","C":"should","D":"were"},"answer":"B","explain":"এটি Conditional Inversion-এর একটি গুরুত্বপূর্ণ উদাহরণ। বাক্যটি Third Conditional-এর অন্তর্ভুক্ত। অতীতে কোনো শর্ত পূরণ হলে কী ফলাফল হতে পারত, কিন্তু বাস্তবে তা ঘটেনি এমন কাল্পনিক পরিস্থিতি বোঝাতে Third Conditional ব্যবহৃত হয়। Third Conditional-এর সাধারণ গঠন: If + Subject + had + V3, Subject + would/could/might have + V3. প্রদত্ত বাক্যটির মূল গঠন হলো: If the regulatory authorities had acted promptly upon receiving the preliminary warnings, the financial crisis could have been averted. এখানে If বাদ দিয়ে Conditional Inversion করা হয়েছে। এ ক্ষেত্রে had-কে Subject-এর আগে বসাতে হয়। তাই বাক্যটি হবে: Had the regulatory authorities acted promptly upon receiving the preliminary warnings, the financial crisis could have been averted. বাংলা অর্থ: প্রাথমিক সতর্কবার্তা পাওয়ার পর নিয়ন্ত্রক কর্তৃপক্ষ দ্রুত পদক্ষেপ নিলে আর্থিক সংকটটি এড়ানো সম্ভব হতো।\n•  অন্যদিকে,\n- A. Unless: অর্থ 'যদি না'। এটি বাক্যের শর্তের অর্থের সঙ্গে সামঞ্জস্যপূর্ণ নয়।\n- C. Should: সাধারণত সম্ভাবনামূলক শর্ত প্রকাশে ব্যবহৃত হয়। যেমন: Should you need help, contact me.\n- D. Were: সাধারণত কাল্পনিক বর্তমান বা ভবিষ্যৎ পরিস্থিতিতে Second Conditional-এর Inversion-এ ব্যবহৃত হয়। যেমন: Were I rich, I would help the poor.\n•  গুরুত্বপূর্ণ নিয়ম:\n- Had + Subject + V3: Third Conditional Inversion।\n- Were + Subject + ...: Second Conditional Inversion।\n- Should + Subject + V1: সম্ভাবনামূলক শর্তের Inversion।\n•  অতিরিক্ত উদাহরণ:\n1. Had I known the truth, I would have helped him.\nঅর্থ: আমি সত্যটি জানলে তাকে সাহায্য করতাম।\n2. Should you face any problem, let me know.\nঅর্থ: আপনার কোনো সমস্যার সম্মুখীন হলে আমাকে জানাবেন।","topic":"Conditionals & Inversion"},{"id":"so002","n":2,"section":"english","q":"Had the researchers anticipated the methodological limitations of their initial design, they ______ a more comprehensive sampling strategy before commencing data collection.","options":{"A":"would adopt","B":"would have adopted","C":"had adopted","D":"will have adopted"},"answer":"B","explain":"বাক্যটি Third Conditional-এর Inverted Structure-এ গঠিত। এখানে Had the researchers anticipated দ্বারা বোঝানো হয়েছে, গবেষকেরা যদি আগে থেকেই তাঁদের প্রাথমিক গবেষণা নকশার পদ্ধতিগত সীমাবদ্ধতাগুলো বুঝতে পারতেন, তাহলে পরবর্তী সময়ে তাঁরা আরও বিস্তৃত নমুনায়ন কৌশল গ্রহণ করতেন। Third Conditional-এর নিয়ম অনুযায়ী, শর্তসূচক অংশে Had + Subject + V3 থাকলে ফলাফলসূচক অংশে Subject + would/could/might have + V3 ব্যবহৃত হয়। তাই শূন্যস্থানে would have adopted বসবে। এখানে adopted হলো adopt ক্রিয়ার V3। অন্যদিকে, would adopt Second Conditional-এর গঠন, had adopted শর্তসূচক অংশের গঠন এবং will have adopted Future Perfect Tense নির্দেশ করে। বাক্যটির মূল অর্থ হলো - গবেষকেরা যদি তাঁদের প্রাথমিক গবেষণা নকশার সীমাবদ্ধতাগুলো আগে বুঝতে পারতেন, তাহলে তথ্য সংগ্রহ শুরুর আগেই আরও বিস্তৃত নমুনায়ন কৌশল গ্রহণ করতেন।","topic":"Conditionals & Inversion"},{"id":"so003","n":3,"section":"english","q":"The committee's recommendations were predicated ______ the assumption that the institution would receive substantial financial assistance from external agencies.","options":{"A":"upon","B":"with","C":"at","D":"for"},"answer":"A","explain":"Appropriate Preposition-এর নিয়ম অনুযায়ী, predicated শব্দটির সঙ্গে সাধারণত on অথবা upon ব্যবহৃত হয়। Be predicated on/upon something একটি নির্দিষ্ট Phrase, যার অর্থ কোনো কিছু নির্দিষ্ট তথ্য, যুক্তি, অনুমান বা ভিত্তির উপর প্রতিষ্ঠিত হওয়া। প্রদত্ত বাক্যে বলা হয়েছে, কমিটির সুপারিশগুলো এমন একটি অনুমানের উপর ভিত্তি করে দেওয়া হয়েছিল যে প্রতিষ্ঠানটি বাইরের সংস্থাগুলোর কাছ থেকে উল্লেখযোগ্য আর্থিক সহায়তা পাবে। এখানে predicated upon the assumption অর্থ হলো 'অনুমানটির উপর ভিত্তি করে প্রতিষ্ঠিত'। অন্যদিকে, with, at এবং for-কোনোটিই predicated-এর সঙ্গে এ অর্থে উপযুক্ত Preposition হিসেবে ব্যবহৃত হয় না। তাই শূন্যস্থানে upon বসবে।\nমনে রাখুন:\n- Be predicated on/upon = কোনো কিছুর উপর ভিত্তি করে প্রতিষ্ঠিত হওয়া।\n- Be based on/upon = কোনো কিছুর উপর ভিত্তি করে গঠিত হওয়া।\n- Be dependent on/upon = কোনো কিছুর উপর নির্ভরশীল হওয়া।\nউদাহরণ: The success of the project is predicated upon effective management.\nঅর্থ: প্রকল্পটির সাফল্য কার্যকর ব্যবস্থাপনার উপর নির্ভরশীল।\nসুতরাং, সঠিক উত্তর: A. upon।","topic":"Prepositions"},{"id":"so004","n":4,"section":"english","q":"The criteria (by which the applications ______ evaluated) ______ clearly specified in the official guidelines.","options":{"A":"is, are","B":"are, is","C":"is, is","D":"are, are"},"answer":"D","explain":"এটি Subject-Verb Agreement-এর একটি গুরুত্বপূর্ণ প্রশ্ন, যেখানে দুটি পৃথক Subject-এর সঙ্গে সঠিক Verb ব্যবহারের বিষয়টি পরীক্ষা করা হয়েছে। প্রথমত, বন্ধনীর ভেতরের Relative Clause-এর Subject হলো the applications, যা একটি Plural Noun। তাই এর সঙ্গে Plural Verb are বসবে এবং বাক্যাংশটি হবে the applications are evaluated। দ্বিতীয়ত, মূল বাক্যের Subject হলো The criteria। এখানে মনে রাখতে হবে, Criterion শব্দের Plural রূপ হলো Criteria। অর্থাৎ, criterion Singular হলেও criteria Plural। তাই মূল বাক্যেও Plural Verb are ব্যবহৃত হবে। ফলে সম্পূর্ণ বাক্যটি হবে: The criteria (by which the applications are evaluated) are clearly specified in the official guidelines. বাক্যটির বাংলা অর্থ হলো-যেসব মানদণ্ডের ভিত্তিতে আবেদনগুলো মূল্যায়ন করা হয়, সেগুলো সরকারি নির্দেশিকায় স্পষ্টভাবে উল্লেখ করা হয়েছে। অতএব, প্রথম শূন্যস্থানে are এবং দ্বিতীয় শূন্যস্থানে are বসবে।","topic":"Subject-Verb Agreement"},{"id":"so005","n":5,"section":"english","q":"Choose the correct passive form: The authorities ought to have informed the affected residents about the potential environmental hazards.","options":{"A":"The affected residents ought to be informed about the potential environmental hazards.","B":"The affected residents ought to have informed about the potential environmental hazards.","C":"The affected residents ought to have been informed about the potential environmental hazards.","D":"The affected residents ought to have being informed about the potential environmental hazards."},"answer":"C","explain":"এটি Active to Passive Voice-এর একটি গুরুত্বপূর্ণ প্রশ্ন। প্রদত্ত বাক্যটি Active Voice-এ রয়েছে, যেখানে Subject হলো The authorities, Verb হলো ought to have informed এবং Object হলো the affected residents। বাক্যটিকে\nPassive Voice-এ রূপান্তর করতে Active Voice-এর Object-কে Subject-এর স্থানে বসাতে হয়। এখানে ought to have + V1 একটি Modal Perfect Structure, যার Passive গঠন হলো Subject + ought to have been + V3 + by + Object। তাই informed ক্রিয়ার আগে been বসিয়ে ought to have been informed গঠন করতে হবে। ফলে সঠিক Passive Voice হবে-The affected residents ought to have been informed about the potential environmental hazards. বাক্যটির বাংলা অর্থ হলো-সম্ভাব্য পরিবেশগত বিপদ সম্পর্কে ক্ষতিগ্রস্ত বাসিন্দাদের জানানো উচিত ছিল। এখানে A অপশনটি ভুল, কারণ ought to be informed বর্তমান বা ভবিষ্যৎ সময়ের কর্তব্য বোঝায়, B অপশনটি ভুল, কারণ Passive Voice-এর জন্য been প্রয়োজন, এবং D অপশনটি ভুল, কারণ ought to have being informed ব্যাকরণগতভাবে অশুদ্ধ গঠন।\nপরীক্ষার জন্য গুরুত্বপূর্ণ নিয়ম:\nModal Perfect-এর Active ও Passive Voice-এর গঠন:\n- Active: Subject + should/ought to/could/might + have + V1 + Object.\n- Passive: Object + should/ought to/could/might + have been + V3 + by + Subject.\nঅতিরিক্ত উদাহরণ:\nActive: They should have completed the project.\nPassive: The project should have been completed by them.","topic":"Voice Change"},{"id":"so006","n":6,"section":"english","q":"The professor remarked that he had never encountered such an inconsistency in his previous research. Choose the most appropriate direct speech.","options":{"A":"The professor remarked, \"I never encountered such an inconsistency in my previous research.\"","B":"The professor remarked, \"I have never encountered such an inconsistency in my previous research.\"","C":"The professor remarked, \"I had never encountered such an inconsistency in my previous research.\"","D":"The professor remarked, \"I would never have encountered such an inconsistency in my previous research.\""},"answer":"B","explain":"প্রদত্ত বাক্যটি Indirect Speech-এ রয়েছে। একে Direct Speech-এ রূপান্তর করতে হলে Reporting Verb-এর কাল এবং Reported Speech-এর Tense পরিবর্তনের নিয়ম অনুসরণ করতে হয়। এখানে Indirect Speech-এর had never encountered হলো Past Perfect Tense। Direct Speech-এ মূল বক্তব্যটি প্রকাশ করার সময় এটি Present Perfect Tense-এ পরিবর্তিত হবে, অর্থাৎ had + V3 → have/has + V3। একই সঙ্গে Indirect Speech-এর Third Person Pronoun he বক্তার পরিচয় অনুযায়ী First Person Pronoun I-তে এবং Possessive Adjective his পরিবর্তিত হয়ে my হবে। তাই সরাসরি উক্তিটি হবে: The professor remarked, \"I have never encountered such an inconsistency in my previous research.\" বাক্যটির বাংলা অর্থ হলো-অধ্যাপক মন্তব্য করেছিলেন, \"আমার পূর্ববর্তী গবেষণায় আমি কখনো এমন অসংগতি পাইনি।\" অন্যদিকে, A অপশনে never encountered Simple Past Tense, C অপশনে had never encountered Past Perfect Tense অপরিবর্তিত রাখা হয়েছে এবং D অপশনে would never have encountered ব্যবহার করায় মূল বক্তব্যের অর্থ পরিবর্তিত হয়েছে। তাই B-ই সবচেয়ে উপযুক্ত উত্তর।\n•  পরীক্ষার জন্য গুরুত্বপূর্ণ নিয়ম:\nIndirect Speech থেকে Direct Speech-এ Tense পরিবর্তনের ক্ষেত্রে সাধারণত-\n- Past Perfect → Present Perfect (প্রসঙ্গ অনুযায়ী)\n- Past Simple → Present Simple (প্রসঙ্গ অনুযায়ী)\n- Past Continuous → Present Continuous (প্রসঙ্গ অনুযায়ী)\n- Past Perfect Continuous → Present Perfect Continuous (প্রসঙ্গ অনুযায়ী)","topic":"Narration"},{"id":"so007","n":7,"section":"english","q":"Choose the correct use of despite: Although the investigators were under considerable political pressure, they refused to alter their findings.","options":{"A":"Despite being under considerable political pressure, the investigators refused to alter their findings.","B":"Despite they were under considerable political pressure, the investigators refused to alter their findings.","C":"Despite of being under considerable political pressure, the investigators refused to alter their findings.","D":"Despite having been under considerable political pressure, the investigators had refused to alter their findings."},"answer":"A","explain":"এটি Appropriate Conjunction ও Preposition-এর ব্যবহারসংক্রান্ত একটি প্রশ্ন। Despite একটি Preposition, যার অর্থ 'সত্ত্বেও' বা 'তা সত্ত্বেও'। এর পরে সাধারণত Noun, Pronoun অথবা Gerund (Verb + ing) বসে, সরাসরি পূর্ণ Subject ও Verb-যুক্ত Clause বসে না। প্রদত্ত বাক্যে Although the investigators were under considerable political pressure একটি পূর্ণ Subordinate Clause। একে Despite ব্যবহার করে সংক্ষিপ্ত করতে হলে Although বাদ দিয়ে being under considerable political pressure ব্যবহার করতে হয়। ফলে সঠিক বাক্যটি হয়: Despite being under considerable political pressure, the investigators refused to alter their findings. বাক্যটির বাংলা অর্থ হলো-যথেষ্ট রাজনৈতিক চাপের মধ্যে থাকা সত্ত্বেও তদন্তকারীরা তাঁদের অনুসন্ধানের ফলাফল পরিবর্তন করতে অস্বীকৃতি জানান। অন্যদিকে, B অপশনে despite-এর পরে সরাসরি Subject ও Verb ব্যবহৃত হয়েছে, যা ব্যাকরণগতভাবে ভুল, C অপশনে despite of ব্যবহার করা হয়েছে, অথচ despite-এর পরে of বসে না, এবং D অপশনে having been ও had refused ব্যবহারের ফলে মূল বাক্যের কালগত অর্থ অপ্রয়োজনীয়ভাবে পরিবর্তিত হয়েছে। তাই A-ই সঠিক উত্তর।\nপরীক্ষার জন্য গুরুত্বপূর্ণ নিয়ম:\n- Despite + Noun: Despite the rain, we went out.\n- Despite + Gerund (V-ing): Despite working hard, he failed.\n- Despite + Pronoun: Despite him, we succeeded.\n- Although + Subject + Verb: Although it was raining, we went out.","topic":"Conjunctions & Connectors"},{"id":"so008","n":8,"section":"english","q":"The independent commission recommended that the findings of the preliminary investigation ______ publicly disclosed until the confidential identities of the informants had been adequately protected.","options":{"A":"are not","B":"not be","C":"were not","D":"not being"},"answer":"B","explain":"টি Subjunctive Mood-এর একটি গুরুত্বপূর্ণ উদাহরণ। কোনো ব্যক্তি বা প্রতিষ্ঠান যখন সুপারিশ, পরামর্শ, দাবি, নির্দেশ বা প্রস্তাব প্রকাশ করে, তখন recommend, suggest, demand, insist, propose ইত্যাদি Verb-এর পরে ব্যবহৃত That-Clause-এ Subjunctive Mood প্রয়োগ করা হয়। এ ক্ষেত্রে That-Clause-এর গঠন হলো Subject + (should) + V1। তবে আধুনিক ইংরেজিতে should উহ্য থাকলেও চলে। প্রদত্ত বাক্যে recommended that ব্যবহৃত হয়েছে এবং বাক্যটির অর্থ অনুযায়ী তদন্তের ফলাফল প্রকাশ না করার সুপারিশ করা হয়েছে। তাই Passive Voice-এ not be + V3 গঠনটি ব্যবহার করতে হবে। এখানে disclosed হলো disclose ক্রিয়ার V3 এবং not be disclosed অর্থ হলো প্রকাশ না করা। সুতরাং সঠিক বাক্যটি হবে: The independent commission recommended that the findings of the preliminary investigation not be publicly disclosed until the confidential identities of the informants had been adequately protected. বাক্যটির বাংলা অর্থ হলো তথ্যদাতাদের গোপন পরিচয় যথাযথভাবে সুরক্ষিত না করা পর্যন্ত প্রাথমিক তদন্তের ফলাফল প্রকাশ্যে প্রকাশ না করার সুপারিশ করেছিল স্বাধীন কমিশন।\nপরীক্ষার জন্য গুরুত্বপূর্ণ নিয়ম:\nRecommend, Suggest, Demand, Insist, Propose, Require, Request, Order ইত্যাদি Verb-এর পরে That-Clause-এ সাধারণত-\n- Active: Subject + (should) + V1\n- Passive: Subject + (should) + be + V3\n- Negative: Subject + (should) + not + V1\n- Negative Passive: Subject + (should) + not be + V3\nউদাহরণ:\n1. The teacher suggested that he study harder.\nঅর্থ: শিক্ষক পরামর্শ দিলেন যে তার আরও মনোযোগ দিয়ে পড়াশোনা করা উচিত।\n2. The committee recommended that the proposal be approved.\nঅর্থ: কমিটি প্রস্তাবটি অনুমোদনের সুপারিশ করেছিল।\n3. The doctor insisted that the patient not be discharged immediately.\nঅর্থ: চিকিৎসক রোগীকে অবিলম্বে ছাড়পত্র না দেওয়ার জন্য জোর দিয়েছিলেন।","topic":"Subjunctive Mood"},{"id":"so009","n":9,"section":"english","q":"The supervisor would rather the researchers ______ the preliminary findings at yesterday's conference, given the unresolved methodological concerns.","options":{"A":"did not present","B":"had not presented","C":"would not present","D":"have not presented"},"answer":"B","explain":"এটি Would Rather ব্যবহারের একটি গুরুত্বপূর্ণ নিয়মভিত্তিক প্রশ্ন। যখন would rather-এর পরে ভিন্ন একটি Subject\n(এখানে the researchers) ব্যবহৃত হয়, তখন পরবর্তী Clause-এর Tense নির্ভর করে কাজটি কোন সময়ের তাৎপর্য বহন করছে তার উপর । বর্তমান বা ভবিষ্যতের কোনো কাজের ক্ষেত্রে Subject + Past Simple (V2) ব্যবহৃত হয়। অন্যদিকে, অতীতে ঘটে যাওয়া কোনো কাজ নিয়ে অনুশোচনা, অসন্তোষ বা ভিন্ন প্রত্যাশা প্রকাশ করতে Subject + Past Perfect (had + V3) ব্যবহৃত হয়। প্রদত্ত বাক্যে yesterday's conference অতীতের একটি নির্দিষ্ট সময় নির্দেশ করছে। সুপারভাইজার চেয়েছিলেন গবেষকেরা যেন গতকালের সম্মেলনে প্রাথমিক গবেষণার ফলাফল উপস্থাপন না করেন। অর্থাৎ, অতীতের একটি কাজ নিয়ে তাঁর ভিন্ন প্রত্যাশা বা অসন্তোষ প্রকাশ করা হয়েছে। তাই এখানে had not presented ব্যবহার করতে হবে। বাক্যটির বাংলা অর্থ হলো - পদ্ধতিগত বিষয়গুলো এখনো অমীমাংসিত থাকায় সুপারভাইজার বরং চাইতেন, গবেষকেরা যেন গতকালের সম্মেলনে প্রাথমিক ফলাফলগুলো উপস্থাপন                                         না                                              করতেন।\nপরীক্ষার জন্য গুরুত্বপূর্ণ নিয়ম:\nWould rather-এর পরে একই Subject ও ভিন্ন Subject ব্যবহারের নিয়ম আলাদা।\nএকই Subject হলে:\n- Present/Future: Subject + would rather + V1\nExample: I would rather stay home.\n- Past regret: Subject + would rather have + V3\nExample: I would rather have stayed home.\nভিন্ন Subject হলে:\n- Present/Future preference: Subject + would rather + অন্য Subject + Past Simple (V2)\nExample: I would rather he stayed here.\n- Past preference/regret: Subject + would rather + অন্য Subject + Past Perfect (had + V3)\nExample: I would rather he had stayed here.","topic":"Subjunctive Mood"},{"id":"so010","n":10,"section":"english","q":"Choose the appropriate noun form of Feasible:","options":{"A":"Feasible","B":"Feasibility","C":"Feasibilization","D":"Feasibly"},"answer":"B","explain":"এটি Word Formation বা Parts of Speech-এর একটি প্রশ্ন। Feasible একটি Adjective, যার অর্থ সম্ভব, বাস্তবায়নযোগ্য বা কার্যকর করা যায় এমন। এর Noun Form হলো Feasibility, যার অর্থ সম্ভাব্যতা, বাস্তবায়নযোগ্যতা বা কার্যকারিতা। কোনো পরিকল্পনা, প্রকল্প বা প্রস্তাব বাস্তবে কার্যকর করা সম্ভব কি না, তা বোঝাতে Feasibility শব্দটি ব্যবহৃত হয়। অন্যদিকে, Feasible Adjective, Feasibly Adverb এবং Feasibilization প্রচলিত ও স্বীকৃত সাধারণ Noun Form নয়। তাই শূন্যস্থানে Feasibility সঠিক উত্তর।\nগুরুত্বপূর্ণ Word Formation:\n- Feasible (Adjective) = সম্ভব বা বাস্তবায়নযোগ্য।\n- Feasibility (Noun) = সম্ভাব্যতা বা বাস্তবায়নযোগ্যতা।\n- Feasibly (Adverb) = বাস্তবসম্মতভাবে বা সম্ভবপরভাবে।\nউদাহরণ:\n1. The project is feasible.\nঅর্থ: প্রকল্পটি বাস্তবায়নযোগ্য।\n2. We need to assess the feasibility of the project.\nঅর্থ: প্রকল্পটির বাস্তবায়নযোগ্যতা মূল্যায়ন করা প্রয়োজন।\n3. The plan can feasibly be implemented within a year.\nঅর্থ: পরিকল্পনাটি বাস্তবসম্মতভাবে এক বছরের মধ্যে বাস্তবায়ন করা সম্ভব।","topic":"Word Formation"},{"id":"so011","n":11,"section":"english","q":"What is the closest antonym of the word Exacerbate?","options":{"A":"Alleviate","B":"Suppress","C":"Neutralize","D":"Prevent"},"answer":"A","explain":"Exacerbate একটি Verb, যার অর্থ কোনো সমস্যা, রোগ, ব্যথা, সংকট বা নেতিবাচক পরিস্থিতিকে আরও তীব্র, গুরুতর বা খারাপ করে তোলা (To make something worse or more severe)। অন্যদিকে, এর বিপরীতার্থক শব্দ (Antonym) হলো Alleviate, যার অর্থ কোনো সমস্যা, কষ্ট, ব্যথা বা পরিস্থিতির তীব্রতা কমানো কিংবা উপশম করা (To make something less severe or easier to bear)। অর্থাৎ, Exacerbate কোনো পরিস্থিতির অবনতি ঘটানো বোঝায়, আর Alleviate সেই পরিস্থিতির কষ্ট বা তীব্রতা কমানো বোঝায়। অন্যদিকে, Suppress অর্থ দমন করা, Neutralize অর্থ নিষ্ক্রিয় বা নিরপেক্ষ করা এবং Prevent অর্থ প্রতিরোধ করা। এগুলো Exacerbate-এর সরাসরি বিপরীতার্থক নয়। তাই সবচেয়ে উপযুক্ত Antonym হলো Alleviate।\nগুরুত্বপূর্ণ শব্দার্থ:\n- Exacerbate (Verb): তীব্রতর করা, অবনতি ঘটানো।\n- Alleviate (Verb): উপশম করা, লাঘব করা, কমানো।\n- Suppress (Verb): দমন করা, চেপে রাখা।\n- Neutralize (Verb): নিষ্ক্রিয় বা নিরপেক্ষ করা।\n- Prevent (Verb): প্রতিরোধ করা, বাধা দেওয়া।\nউদাহরণ:\n1. Lack of proper treatment may exacerbate the patient's condition.\nঅর্থ: যথাযথ চিকিৎসার অভাব রোগীর অবস্থার আরও অবনতি ঘটাতে পারে।\n2. The new policy aims to alleviate poverty.\nঅর্থ: নতুন নীতিটির লক্ষ্য দারিদ্র% কমানো।","topic":"Vocabulary"},{"id":"so012","n":12,"section":"english","q":"The neighbors were ______ by the noise from the construction.","options":{"A":"aggravated","B":"invigorated","C":"castigated","D":"incarcerated"},"answer":"A","explain":"বাক্যটির অর্থ হলো-নির্মাণকাজের শব্দে প্রতিবেশীরা বিরক্ত বা ক্ষু| হয়েছিল। এখানে Aggravated শব্দটি Aggravate ক্রিয়ার Past Participle, যার একটি অর্থ হলো কাউকে বিরক্ত, উত্তেজিত বা রাগান্বিত করা (To annoy or irritate someone)। সাধারণত Aggravate বলতে কোনো সমস্যা বা পরিস্থিতিকে আরও খারাপ করাকেও বোঝায়। প্রদত্ত বাক্যে নির্মাণকাজের অতিরিক্ত শব্দ প্রতিবেশীদের বিরক্তির কারণ হয়েছে। তাই aggravated শব্দটি অর্থ ও বাক্যের প্রেক্ষাপট-উভয় দিক থেকেই উপযুক্ত। অন্যদিকে, Invigorated অর্থ সতেজ বা প্রাণবন্ত করা, Castigated অর্থ কঠোরভাবে তিরস্কার করা এবং Incarcerated অর্থ কারাবন্দি করা। এসব শব্দ বাক্যের অর্থের সঙ্গে সামঞ্জস্যপূর্ণ নয়। তাই সঠিক উত্তর A. aggravated।\nগুরুত্বপূর্ণ শব্দার্থ:\n- Aggravate (Verb): বিরক্ত বা ক্ষু| করা, পরিস্থিতির অবনতি ঘটানো।\n- Invigorate (Verb): সতেজ, উদ্যমী বা প্রাণবন্ত করা।\n- Castigate (Verb): কঠোরভাবে তিরস্কার বা ভর্ৎসনা করা।\n- Incarcerate (Verb): কারাবন্দি করা।\nঅতিরিক্ত উদাহরণ:\n1. His rude behavior aggravated the situation.\nঅর্থ: তার অভদ্র আচরণ পরিস্থিতিকে আরও খারাপ করেছিল।\n2. A short walk can invigorate the mind.\nঅর্থ: অল্প হাঁটাহাঁটি মনকে সতেজ করতে পারে।\n3. The manager castigated the employees for their negligence.\nঅর্থ: অবহেলার জন্য ব্যবস্থাপক কর্মচারীদের কঠোরভাবে তিরস্কার করেছিলেন।","topic":"Vocabulary"},{"id":"so013","n":13,"section":"english","q":"His short stories ______ the political tensions prevalent in his contemporary times.","options":{"A":"abound in","B":"partake of","C":"steeped in","D":"sparked off"},"answer":"A","explain":": Abound in একটি গুরুত্বপূর্ণ Phrase, যার অর্থ কোনো কিছুতে পরিপূর্ণ থাকা, প্রুচর পরিমাণে বিদ্যমান থাকা বা কোনো কিছুর প্রাচুর্য থাকা (To be filled with or contain a large amount of something)। প্রদত্ত বাক্যে লেখকের ছোটগল্পগুলোতে তাঁর সমসাময়িক সময়ের রাজনৈতিক উত্তেজনার ব্যাপক উপস্থিতি বোঝানো হয়েছে। তাই এখানে abound in সবচেয়ে উপযুক্ত।\nঅন্যদিকে, Partake of অর্থ কোনো কিছুতে অংশগ্রহণ করা বা কোনো কিছুর স্বাদ গ্রহণ করা, Steeped in অর্থ কোনো বিষয় বা সংস্কৃতিতে গভীরভাবে নিমগ্ন বা আচ্ছন্ন থাকা, তবে এটি Adjective হিসেবে ব্যবহৃত হওয়ায় বাক্যে are steeped in প্রয়োজন হতো, এবং Sparked off অর্থ কোনো ঘটনা, বিতর্ক বা প্রতিক্রিয়ার সূচনা করা বা উসকে দেওয়া। সুতরাং, বাক্যের অর্থ ও গঠন বিবেচনায়\nA. abound in সঠিক উত্তর।\nগুরুত্বপূর্ণ Phrase-এর অর্থ:\n- Abound in: কোনো কিছুতে পরিপূর্ণ থাকা বা প্রুচর পরিমাণে বিদ্যমান থাকা।\n- Abound with: কোনো কিছুতে পরিপূর্ণ থাকা।\n- Partake of: অংশগ্রহণ করা বা কোনো কিছুর স্বাদ গ্রহণ করা।\n- Steeped in: কোনো বিষয় বা সংস্কৃতিতে গভীরভাবে নিমগ্ন বা আচ্ছন্ন থাকা।\n- Spark off: কোনো ঘটনার সূচনা করা বা উসকে দেওয়া।\nঅতিরিক্ত উদাহরণ:\n1. The region abounds in natural resources.\nঅর্থ: অঞ্চলটি প্রাকৃতিক সম্পদে পরিপূর্ণ।\n2. His writings abound with historical references.\nঅর্থ: তাঁর লেখাগুলোতে ঐতিহাসিক তথ্যের প্রুচর উল্লেখ রয়েছে।\n3. The novel is steeped in political history.\nঅর্থ: উপন্যাসটি রাজনৈতিক ইতিহাসে গভীরভাবে আচ্ছন্ন।\n4. The controversial decision sparked off widespread protests.\nঅর্থ: বিতর্কিত সিদ্ধান্তটি ব্যাপক বিক্ষোভের সূচনা করেছিল।","topic":"Phrases & Idioms"},{"id":"so014","n":14,"section":"english","q":"The new high-speed rail service encouraged thousands of passengers to ______ from bus travel.","options":{"A":"switch off","B":"switch over","C":"switch around","D":"be switched on"},"answer":"B","explain":"Switch over একটি গুরুত্বপূর্ণ Phrasal Verb, যার অর্থ হলো একটি ব্যবস্থা, মাধ্যম, পদ্ধতি বা বিকল্প ছেড়ে অন্যটিতে পরিবর্তিত হওয়া বা স্থানান্তরিত হওয়া (To change from one system, method or service to another)। সাধারণত Switch over from X to Y গঠনটি ব্যবহৃত হয়। প্রদত্ত বাক্যে নতুন উচ্চগতির রেলসেবা চালু হওয়ায় হাজার হাজার যাত্রীকে বাসে যাতায়াতের পরিবর্তে রেলপথে যাতায়াত করতে উৎসাহিত করার বিষয়টি বোঝানো হয়েছে। তাই এখানে switch over সবচেয়ে উপযুক্ত। অন্যদিকে, Switch off অর্থ বন্ধ করা বা নিষ্ক্রিয় করা, Switch around অর্থ অবস্থান বা ক্রম অদলবদল করা এবং Be switched on অর্থ চালু থাকা বা সচেতন ও আগ্রহী হওয়া। তাই বাক্যের অর্থ ও প্রেক্ষাপট অনুযায়ী B. switch over সঠিক উত্তর।\nগুরুত্বপূর্ণ Phrasal Verb-এর অর্থ:\n- Switch over: একটি মাধ্যম বা পদ্ধতি থেকে অন্যটিতে পরিবর্তিত হওয়া।\n- Switch off: বন্ধ করা বা নিষ্ক্রিয় করা।\n- Switch on: চালু করা।\n- Switch around: অদলবদল করা বা অবস্থান পরিবর্তন করা।\n- Switch to: অন্য কোনো মাধ্যম বা পদ্ধতি গ্রহণ করা।\nঅতিরিক্ত উদাহরণ:\n1. Many people have switched over from traditional banking to digital banking.\nঅর্থ: অনেক মানুষ প্রচলিত ব্যাংকিং ব্যবস্থা ছেড়ে ডিজিটাল ব্যাংকিংয়ে স্থানান্তরিত হয়েছেন।\n2. Please switch off the lights before leaving the room.\nঅর্থ: ঘর থেকে বের হওয়ার আগে অনুগ্রহ করে বাতিগুলো বন্ধ করুন।\n3. The company decided to switch over to renewable energy.\nঅর্থ: কোম্পানিটি নবায়নযোগ্য জ্বালানিতে পরিবর্তিত হওয়ার সিদ্ধান্ত নিয়েছে","topic":"Phrases & Idioms"},{"id":"so015","n":15,"section":"english","q":"He is infamous for poking fun at students' weaknesses with ______ remarks.","options":{"A":"sarcastic","B":"constructive","C":"uncynical","D":"optimistic"},"answer":"A","explain":"Infamous শব্দের অর্থু কখ্যাত বা দুর্নামসম্পন্ন এবং poking fun at weaknesses অর্থ কারও দুর্বলতা নিয়ে উপহাস বা বিদ্রূপ করা। বাক্যের এই শব্দগুলো থেকে বোঝা যায়, এখানে নেতিবাচক ও ব্যঙ্গাত্মক মনোভাব প্রকাশ করে-এমন একটি শব্দ প্রয়োজন। Sarcastic অর্থ বিদ্রূপাত্মক, ব্যঙ্গাত্মক বা শ্লেষপূর্ণ, অর্থাৎ কাউকে পরোক্ষভাবে কটাক্ষ বা উপহাস করার প্রবণতা। অন্যদিকে, Constructive অর্থ গঠনমূলক, Uncynical অর্থ সন্দেহপ্রবণতা বা নিন্দাবাদী মনোভাব থেকে মুক্ত এবং Optimistic অর্থ আশাবাদী। এসব শব্দের কোনোটিই বিদ্রূপ বা উপহাসের নেতিবাচক অর্থ প্রকাশ করে না। তাই বাক্যের ভাব ও অর্থের সঙ্গে সামঞ্জস্য রেখে A. Sarcastic সঠিক উত্তর।\nগুরুত্বপূর্ণ শব্দার্থ:\n- Sarcastic: বিদ্রূপাত্মক, ব্যঙ্গাত্মক।\n- Constructive: গঠনমূলক।\n- Uncynical: নিন্দাবাদী বা অতিরিক্ত সন্দেহপ্রবণ মনোভাবমুক্ত।\n- Optimistic: আশাবাদী।\n- Infamous: কুখ্যাত, দুর্নামসম্পন্ন।\nউদাহরণ: His sarcastic remarks often hurt other people's feelings.\nঅর্থ: তার বিদ্রূপাত্মক মন্তব্য প্রায়ই অন্যদের মনে আঘাত দেয়।","topic":"Vocabulary"},{"id":"so016","n":16,"section":"english","q":"Which of the following is correct?","options":{"A":"That he was foreign made it difficult for him to get the job.","B":"I realized the importance that we should be there in time.","C":"They insisted that he leave the room at once.","D":"I am sending you the book, as it was agreed."},"answer":"C","explain":"টি মূলত Subjunctive Mood-এর নিয়মভিত্তিক প্রশ্ন। ইংরেজি ব্যাকরণে insist, suggest, recommend, demand, propose, require ইত্যাদি Verb-এর মাধ্যমে কোনো দাবি, নির্দেশ, পরামর্শ বা সুপারিশ প্রকাশ করা হলে পরবর্তী That-Clause-এ Verb-এর Base Form (V1) ব্যবহৃত হয়। এ ক্ষেত্রে Subject Third Person Singular হলেও Verb-এর সঙ্গে s/es যুক্ত হয় না। এর গঠন হলো Subject + Verb + that + Subject + (should) + V1। প্রদত্ত C অপশনে They insisted that he leave the room at once বাক্যটিতে insisted that-এর পরে he leave ব্যবহৃত হয়েছে, যা Subjunctive Mood-এর নিয়ম অনুযায়ী সঠিক। এখানে he leaves না হয়ে he leave হবে। বাক্যটির অর্থ তারা জোর দিয়ে বলেছিল যে সে যেন অবিলম্বে ঘরটি ছেড়ে যায়। অপশন A-তে foreign-এর বদলে a foreigner হওয়া উচিত ছিল। B-তে the importance that we should... গঠনগতভাবে ত্রুটিপূর্ণ\n(the importance of our being...), এবং D-তে as it was agreed-এর বদলে as agreed বা as had been agreed শুদ্ধ।\nপরীক্ষার জন্য গুরুত্বপূর্ণ নিয়ম:\nSubjunctive Mood-এর গঠন:Subject + suggest/recommend/insist/demand + that + Subject + V1\nউদাহরণ:\n1. The teacher insisted that he attend the class.\nঅর্থ: শিক্ষক জোর দিয়েছিলেন যে সে যেন ক্লাসে উপস্থিত থাকে।\n2. The committee recommended that the proposal be approved.\nঅর্থ: কমিটি প্রস্তাবটি অনুমোদনের সুপারিশ করেছিল।\n3. The doctor suggested that she take adequate rest.\nঅর্থ: চিকিৎসক পরামর্শ দিয়েছিলেন যে সে যেন পর্যাপ্ত বিশ্রাম নেয়।","topic":"Sentence Correction"},{"id":"so017","n":17,"section":"english","q":"Which of the following is correct?","options":{"A":"I am feeling they should not start now.","B":"We will be happy for her to help him.","C":"May everybody apply for this post?","D":"It is probable for him to be in good temper."},"answer":"B","explain":"অপশন B-তে be happy for + Object + to + V1 গঠনটি সঠিকভাবে ব্যবহৃত হয়েছে। এই Structure-এর মাধ্যমে অন্য কোনো ব্যক্তি একটি কাজ করলে বক্তা বা সংশ্লিষ্ট ব্যক্তি খুশি হবেন-এমন মনোভাব প্রকাশ করা হয়। এখানে for her to help him অর্থ হলো 'সে তাকে সাহায্য করলে'। তাই We will be happy for her to help him বাক্যটি ব্যাকরণগতভাবে সঠিক। অন্যদিকে, A অপশনে feel শব্দটি মতামত বা ধারণা প্রকাশের ক্ষেত্রে Stative Verb হিসেবে ব্যবহৃত হয়েছে। এ ধরনের ব্যবহারে সাধারণত Continuous Tense গ্রহণযোগ্য নয়। তাই I am feeling না হয়ে I feel হবে। C অপশনে May সাধারণত অনুমতি বা প্রার্থনা প্রকাশে ব্যবহৃত হয়, কিন্তু কোনো পদে আবেদন করার যোগ্যতা বা সুযোগ সম্পর্কে জানতে Can everybody apply for this post? অথবা Is everybody eligible to apply for this post? বলা অধিক উপযুক্ত। D অপশনে It is probable for him to be গঠনটি প্রচলিত ও স্বাভাবিক নয়। এর পরিবর্তে It is probable that he is in a good temper অথবা He is likely to be in a good temper বলা যায়। সুতরাং, একমাত্র B অপশনটি সঠিক।\nপরীক্ষার জন্য গুরুত্বপূর্ণ নিয়ম:\n- Stative Verb: অনুভূতি, চিন্তা, বিশ্বাস, মালিকানা বা অবস্থা বোঝায়, সাধারণত Continuous Tense-এ ব্যবহৃত হয় না। যেমন: know, believe, understand, feel (মতামত অর্থে)।\n- Be happy for + Object + to + V1: অন্য কারও কোনো কাজ করায় খুশি হওয়া।\n- Be likely to + V1: কোনো কিছু ঘটার সম্ভাবনা থাকা।\n- It is probable that + Clause: কোনো কিছু ঘটার সম্ভাবনা বোঝানো।","topic":"Sentence Correction"},{"id":"so018","n":18,"section":"english","q":"It was the first time that they ______ to Cox's Bazaar.","options":{"A":"had been","B":"have been","C":"were","D":"visited"},"answer":"A","explain":"টি Tense-এর একটি গুরুত্বপূর্ণ নিয়মভিত্তিক প্রশ্ন। অতীতে কোনো নির্দিষ্ট সময় বা ঘটনা বোঝাতে It was the first time that ব্যবহৃত হলে এর পরবর্তী Clause-এ সাধারণত Past Perfect Tense (had + V3) বসে। কারণ, অতীতের সেই নির্দিষ্ট সময়ের আগেই কোনো অভিজ্ঞতা সম্পন্ন হয়েছিল কি না, তা বোঝাতে Past Perfect ব্যবহৃত হয়। এখানে It was the first time অতীতের একটি সময় নির্দেশ করছে এবং they জীবনে প্রথমবার কক্সবাজারে যাওয়ার অভিজ্ঞতা অর্জন করেছিল এটি বোঝানো হয়েছে। তাই শূন্যস্থানে had been বসবে। এখানে been হলো be ক্রিয়ার Past Participle বা V3। বাক্যটির বাংলা অর্থ হলো তারা এর আগে কখনো কক্সবাজারে যায়নি, সেটিই ছিল তাদের কক্সবাজারে যাওয়ার প্রথম অভিজ্ঞতা।\nপরীক্ষার জন্য গুরুত্বপূর্ণ নিয়ম:\n- It is the first time + Subject + have/has + V3.\n- It was the first time + Subject + had + V3.\nঅতিরিক্ত উদাহরণ:\n1. It is the first time that I have visited Dhaka.\nঅর্থ: এই প্রথম আমি ঢাকা ভ্রমণ করেছি।\n2. It was the first time that she had travelled abroad.\nঅর্থ: সেটিই ছিল তার বিদেশ ভ্রমণের প্রথম অভিজ্ঞতা।\n3. It was the first time that we had met each other.\nঅর্থ: সেটিই ছিল আমাদের একে অপরের সঙ্গে প্রথম দেখা।","topic":"Tense"},{"id":"so019","n":19,"section":"english","q":"I tried two shirts, ______ fitted me.","options":{"A":"neither of them","B":"none of these","C":"neither of which","D":"both of them"},"answer":"C","explain":"এটি Relative Pronoun ও Sentence Structure-এর একটি গুরুত্বপূর্ণ প্রশ্ন। বাক্যটিতে দুটি অংশ রয়েছে-I tried two shirts এবং fitted me। এই দুটি অংশকে একটি বাক্যে যুক্ত করতে Relative Pronoun which ব্যবহৃত হয়েছে। আবার, দুটি শার্টের কোনোটিই বক্তার গায়ে সঠিকভাবে মানানসই হয়নি-এমন অর্থ প্রকাশ করতে neither of which ব্যবহার করতে হয়। Neither of which একটি Relative Construction, যার মাধ্যমে পূর্বে উল্লেখিত দুটি ব্যক্তি বা বস্তুর কোনোটিই নয়-এমন অর্থ বোঝানো হয়। এখানে which পূর্ববর্তী Noun two shirts-কে নির্দেশ করছে এবং neither of which অর্থ 'যার কোনোটিই নয়'। বাক্যটির বাংলা অর্থ হলো-আমি দুটি শার্ট পরখ করে দেখেছিলাম, যার কোনোটিই আমার গায়ে মানানসই হয়নি। অন্যদিকে, neither of them ব্যবহার করলে দুটি স্বাধীন Clause-কে শুধু কমা দিয়ে যুক্ত করার কারণে Comma Splice তৈরি হয়, none of these সাধারণত তিন বা ততোধিক ব্যক্তি বা বস্তুর ক্ষেত্রে ব্যবহৃত হয় এবং এখানে Relative Pronoun-এর প্রয়োজনীয়তাও পূরণ করে না, আর both of them অর্থ দুটিই, যা বাক্যের উদ্দেশ্যবিরোধী। তাই C. neither of which সঠিক উত্তর।\nপরীক্ষার জন্য গুরুত্বপূর্ণ নিয়ম:\n- Neither: দুটি ব্যক্তি বা বস্তুর কোনোটিই নয়।\n- Either: দুটি ব্যক্তি বা বস্তুর যেকোনো একটি।\n- Both: দুটি ব্যক্তি বা বস্তুই।\n- None: সাধারণত তিন বা ততোধিক ব্যক্তি বা বস্তুর একটিও নয়।\n- Neither of which: পূর্বে উল্লেখিত দুটি বস্তু বা বিষয়কে নির্দেশ করে 'যার কোনোটিই নয়' বোঝায়। অতিরিক্ত উদাহরণ:\n1. I bought two books, neither of which was interesting.\nঅর্থ: আমি দুটি বই কিনেছিলাম, যার কোনোটিই আকর্ষণীয় ছিল না।\n2. She has two brothers, neither of whom lives in Dhaka.\nঅর্থ: তার দুজন ভাই আছে, যাদের কেউই ঢাকায় থাকে না।\n3. I tried two solutions, neither of which worked.\nঅর্থ: আমি দুটি সমাধান চেষ্টা করেছিলাম, যার কোনোটিই কাজ করেনি।","topic":"Pronouns & Relatives"},{"id":"so020","n":20,"section":"english","q":"We haven't met you for ______.","options":{"A":"such a long time","B":"so long time","C":"such long time","D":"so many times"},"answer":"A","explain":"খানে Time শব্দটি ‘সময়কাল’ বা ‘দীর্ঘ ব্যবধান’ অর্থে Singular Countable Noun হিসেবে ব্যবহৃত হয়েছে। ইংরেজি ব্যাকরণ অনুযায়ী, Singular Countable Noun-এর আগে Such বসলে সাধারণত Such + a/an + Adjective + Singular Noun গঠন অনুসরণ করতে হয়। তাই সঠিক গঠন হলো such a long time। অন্যদিকে, So সাধারণত Adjective বা Adverb-এর আগে বসে। তবে Noun-এর আগে Article-সহ এর বিশেষ গঠন হতে পারে-So + Adjective + a/an + Singular Noun, যেমন: so long a time। কিন্তু so long time সঠিক নয়। একইভাবে, such long time গঠনে প্রয়োজনীয় Article a অনুপস্থিত। তাই সঠিক উত্তর\nA. such a long time।\nপরীক্ষার জন্য গুরুত্বপূর্ণ নিয়ম:\n- Such + a/an + Adjective + Singular Noun\nExample: Such a beautiful place.\n- So + Adjective/Adverb\nExample: So beautiful, so quickly.\n- So + Adjective + a/an + Singular Noun\nExample: So difficult a question.\nঅতিরিক্ত উদাহরণ:\n1. It was such a difficult task.\nঅর্থ: এটি এত কঠিন একটি কাজ ছিল।\n2. I have never seen such a beautiful place.\nঅর্থ: আমি কখনো এত সুন্দর জায়গা দেখিনি।\nবাংলা ভাষা ও সাহিত্য","topic":"Usage"},{"id":"so021","n":21,"section":"bangla","q":"পাশাপাশি দুটি স্বরধ্বনি একটি সংযুক্ত ধ্বনিরূপে উচ্চারিত হলে, প্রথম স্বরটি দ্বিতীয়টির চেয়ে দীর্ঘ ও স্পষ্ট। এটি কোনটির লক্ষণ?","options":{"A":"অনুনাসিক স্বরধ্বনি","B":"মধ্যস্বরাগম","C":"মৌলিক স্বরধ্বনি","D":"দ্বিস্বরধ্বনি"},"answer":"D","explain":"পাশাপাশি দুটি স্বরধ্বনি দ্রুত উচ্চারণের ফলে যখন একটি সংযুক্ত বা যুগ্ম স্বরধ্বনি হিসেবে উচ্চারিত হয়, তখন তাকে দ্বিস্বরধ্বনি বা যৌগিক স্বরধ্বনি (Diphthong) বলে। দ্বিস্বরধ্বনি উচ্চারণের সময় জিহ্বা ও মুখের অবস্থান একটি স্বরধ্বনি থেকে অন্য স্বরধ্বনির দিকে পরিবর্তিত হয়। অর্থাৎ, একই উচ্চারণের মধ্যে দুটি স্বরধ্বনির সমন্বয় ঘটে। যেমন-‘অই’ ধ্বনির সমন্বয়ে ‘ঐ’ এবং ‘অউ’ ধ্বনির সমন্বয়ে ‘ঔ’ ধ্বনি গঠিত হয়। বাংলা ভাষায় প্রচলিত ব্যাকরণ অনুযায়ী মোট ২৫টি যৌগিক স্বরধ্বনি রয়েছে, তবে এগুলোর লিখিত বর্ণরূপ বা যৌগিক স্বরবর্ণ মাত্র ২টি - ঐ ও ঔ। তাই যৌগিক স্বরধ্বনি এবং যৌগিক স্বরবর্ণ এক বিষয় নয়।","topic":"ধ্বনি"},{"id":"so022","n":22,"section":"bangla","q":"'জ্বলন্ত আগুন', 'রেশমি চাদর', 'সপ্তদশ শতাব্দী' - বিশেষণের অর্থভিত্তিক শ্রেণি যথাক্রমে কোনটি?","options":{"A":"গুণবাচক-অবস্থাবাচক-সংখ্যাবাচক","B":"অবস্থাবাচক-গুণবাচক-ক্রমবাচক","C":"অবস্থাবাচক-উপাদানবাচক-ক্রমবাচক","D":"গুণবাচক-উপাদানবাচক-পরিমাণবাচক"},"answer":"C","explain":"অর্থের ভিত্তিতে বিশেষণ বিভিন্ন প্রকারের হয়ে থাকে। প্রদত্ত উদাহরণগুলোতে ‘জ্বলন্ত আগুন’-এ ‘জ্বলন্ত’ শব্দটি আগুনের অবস্থা বা দশা প্রকাশ করে বলে এটি অবস্থাবাচক বিশেষণ। ‘নতুন প্রমিত বাংলা ব্যাকরণ (নবম-দশম শ্রেণির বোর্ড বই) অনুযায়ী বিশেষণের অর্থভিত্তিক শ্রেণিবিভাগ বিশ্লেষণ করলে দেখা যায়: (১) 'জ্বলন্ত আগুন'-এখানে 'জ্বলন্ত' দ্বারা আগুনের চলমান অবস্থা বোঝাচ্ছে, তাই এটি অবস্থাবাচক বিশেষণ (২) 'রেশমি চাদর' এখানে 'রেশমি' দ্বারা চাদরটি কী উপাদান (রেশম) দিয়ে তৈরি তা বোঝাচ্ছে, তাই এটি উপাদানবাচক বিশেষণ, এবং (৩) 'সপ্তদশ শতাব্দী'-এখানে 'সপ্তদশ' (১৭তম) দ্বারা শতাব্দীর ক্রমিক অবস্থান বোঝাচ্ছে, তাই এটি ক্রমবাচক (বা পূরণবাচক) বিশেষণ।","topic":"পদ প্রকরণ"},{"id":"so023","n":23,"section":"bangla","q":"'দাতা', 'পঠিত' ও 'পাঠক' - প্রত্যয়যোগে গঠিত শব্দগুলোর পদশ্রেণি যথাক্রমে কোনটি?","options":{"A":"বিশেষণ-বিশেষ্য-বিশেষণ","B":"বিশেষ্য-বিশেষ্য-বিশেষণ","C":"বিশেষণ-বিশেষণ-বিশেষ্য","D":"বিশেষ্য-বিশেষণ-বিশেষ্য"},"answer":"D","explain":"প্রত্যয়যোগে গঠিত শব্দের পদশ্রেণি নির্ধারিত হয় বাক্যে বা শব্দের অর্থগত ব্যবহারের ভিত্তিতে। ‘দাতা’ শব্দটি ‘দা’ (দেওয়া) ধাতুর সঙ্গে ‘তৃ’ প্রত্যয় যুক্ত হয়ে গঠিত এবং এর অর্থ দানকারী ব্যক্তি, তাই এটি বিশেষ্য। ‘পঠিত’ শব্দটি ‘পঠ্’ ধাতুর সঙ্গে ‘ত’ প্রত্যয় যুক্ত হয়ে গঠিত, এর অর্থ যা পড়া হয়েছে। এটি কোনো ব্যক্তি বা বস্তুর অবস্থা বা বৈশিষ্ট্য প্রকাশ করে বলে বিশেষণ। অন্যদিকে, ‘পাঠক’ শব্দটি ‘পঠ্’ ধাতুর সঙ্গে ‘অক’ প্রত্যয় যুক্ত হয়ে গঠিত, এর অর্থ পাঠকারী ব্যক্তি। তাই এটি বিশেষ্য।","topic":"প্রত্যয়"},{"id":"so024","n":24,"section":"bangla","q":"'লাল জামা' এবং 'জামাটি লাল' - দুই প্রয়োগে 'লাল' শব্দের অবস্থানভিত্তিক শ্রেণি যথাক্রমে কী?","options":{"A":"বিধেয় বিশেষণ-সাক্ষাৎ বিশেষণ","B":"নাম বিশেষণ-ভাববিশেষণ","C":"ভাব বিশেষণ-নামবিশেষণ","D":"সাক্ষাৎ বিশেষণ-বিধেয় বিশেষণ"},"answer":"D","explain":"বাক্যে বিশেষণের অবস্থানের ভিত্তিতে বিশেষণ প্রধানত দুই প্রকার: সাক্ষাৎ বিশেষণ ও বিধেয় বিশেষণ। বিশেষণ যখন বিশেষ্য পদের আগে বসে সরাসরি সেই বিশেষ্যের গুণ, বৈশিষ্ট্য বা অবস্থা প্রকাশ করে, তখন তাকে সাক্ষাৎ বিশেষণ বলে। যেমন-‘লাল জামা’ ও ‘ভালো ছেলে’-এখানে ‘লাল’ ও ‘ভালো’ যথাক্রমে জামা ও ছেলের বৈশিষ্ট্য প্রকাশ করছে। অন্যদিকে, বিশেষণ যখন বাক্যের বিধেয় অংশে বসে বিশেষ্য সম্পর্কে কোনো গুণ বা বৈশিষ্ট্য প্রকাশ করে, তখন তাকে বিধেয় বিশেষণ বলে। যেমন-‘জামাটি লাল’ ও ‘ছেলেটি ভালো’-এখানে ‘লাল’ ও ‘ভালো’ বিধেয় অংশে অবস্থান করছে। সুতরাং ‘লাল জামা’ এবং ‘জামাটি লাল’-এ দুটি প্রয়োগে ‘লাল’ শব্দের শ্রেণি যথাক্রমে সাক্ষাৎ বিশেষণ ও বিধেয় বিশেষণ।","topic":"পদ প্রকরণ"},{"id":"so025","n":25,"section":"bangla","q":"'আমি স্বয়ং যাব' - এই বাক্যে 'স্বয়ং' কোন সর্বনাম?","options":{"A":"ব্যক্তিবাচক","B":"নির্দেশক","C":"আত্মবাচক","D":"প্রশ্নবাচক"},"answer":"C","explain":"যে সর্বনাম দ্বারা বাক্যের কর্তা নিজেকেই নির্দেশ করে বা নিজের উপর কাজের সম্পাদন নিশ্চিত করে, তাকে আত্মবাচক সর্বনাম বলে। যেমন-‘আমি নিজে কাজটি করব’, ‘তিনি স্বয়ং উপস্থিত ছিলেন’। প্রদত্ত বাক্যে ‘স্বয়ং’ শব্দটি ‘আমি’ কর্তার নিজের উপস্থিতি ও কাজ সম্পাদনের বিষয়টি জোর দিয়ে প্রকাশ করেছে। তাই ‘স্বয়ং’ আত্মবাচক সর্বনাম। অন্যদিকে, ‘আমি’ শব্দটি ব্যক্তিবাচক সর্বনাম।","topic":"পদ প্রকরণ"},{"id":"so026","n":26,"section":"bangla","q":"'ফি-সন' শব্দে 'ফি' কী অর্থে ব্যবহৃত?","options":{"A":"প্রতি","B":"বিনা","C":"বিপরীত","D":"অধিক"},"answer":"A","explain":"'ফি' একটি বিদেশি উপসর্গ, যা বাংলায় 'প্রতি' অর্থে ব্যবহৃত হয়। 'সন' অর্থ বছর বা সাল, তাই 'ফি-সন' অর্থ প্রতি বছর। অনুরূপ আরও কিছু পরিচিত উদাহরণ হলো: 'ফি-রোজ' (প্রতিদিন), 'ফি-হপ্তা' (প্রতি সপ্তাহ), 'ফি-বছর' (প্রতি বছর)।","topic":"উপসর্গ"},{"id":"so027","n":27,"section":"bangla","q":"কোন জোড়ায় প্রথমটি দ্বিগু, দ্বিতীয়টি বহুব্রীহি?","options":{"A":"দশানন-ত্রিফলা","B":"মনমাঝি-সপ্তাহ","C":"মুখচন্দ্র-ত্রিপদী","D":"ত্রিফলা-আয়তলোচনা"},"answer":"D","explain":"যে সমাসে সমাসবদ্ধ পদে সংখ্যাবাচক শব্দ থাকে এবং সমষ্টি বা সমাহার বোঝায়, তাকে দ্বিগু সমাস বলে। অন্যদিকে, যে সমাসে সমস্যমান পদগুলোর অর্থের পরিবর্তে অন্য কোনো ব্যক্তি বা বস্তুকে বোঝায়, তাকে বহুব্রীহি সমাস বলে। ‘ত্রিফলা’ শব্দের ব্যাসবাক্য ‘তিন ফলের সমাহার’-এখানে ‘ত্রি’ সংখ্যাবাচক শব্দ এবং তিনটি ফলের সমষ্টি বোঝানো হয়েছে। তাই এটি দ্বিগু সমাস। অন্যদিকে, ‘আয়তলোচনা’ শব্দের ব্যাসবাক্য ‘আয়ত লোচন যার’ এখানে আয়ত চোখবিশিষ্ট কোনো নারীকে বোঝানো হয়েছে। অর্থাৎ পদ দুটির সম্মিলিত অর্থের পরিবর্তে অন্য একজনকে নির্দেশ করছে বলে এটি বহুব্রীহি সমাস। সুতরাং সঠিক উত্তর D. ত্রিফলা-আয়তলোচনা।","topic":"সমাস"},{"id":"so028","n":28,"section":"bangla","q":"'অক্ষয় বট' বাগধারায় কী বোঝায়?","options":{"A":"দীর্ঘজীবী ব্যক্তি","B":"অবিনাশী প্রতিষ্ঠান","C":"প্রাচীন বংশ","D":"বিশাল বৃক্ষ"},"answer":"A","explain":"অক্ষয় বট’ বাগধারাটির অর্থ অতি প্রাচীন বা দীর্ঘজীবী ব্যক্তি, বিশেষত এমন প্রবীণ ব্যক্তিকে বোঝায়, যিনি দীর্ঘকাল ধরে বেঁচে আছেন। প্রাচীন ও চিরায়ু বটবৃক্ষের সঙ্গে তুলনা করে এ ধরনের ব্যক্তিকে ‘অক্ষয় বট’ বলা হয়। এর কাছাকাছি অর্থ প্রকাশক বাগধারা হলো ‘ভূষণ্ডির কাক’ ও ‘আদ্যিকালের বদ্যিবুড়ো’। সুতরাং এখানে ‘অক্ষয় বট’ বলতে দীর্ঘজীবী ব্যক্তিকে বোঝানো হয়েছে।","topic":"বাগধারা"},{"id":"so029","n":29,"section":"bangla","q":"'মৃগ' শব্দের অর্থ যেকোনো পশু থেকে 'হরিণ' হওয়া কোন প্রক্রিয়া?","options":{"A":"অর্থপ্রসার","B":"অর্থসংক্রম","C":"অর্থসংকোচ","D":"অর্থের উন্নতি"},"answer":"C","explain":"শব্দের আদি বা প্রচলিত অর্থ ব্যাপক ও বিস্তৃত হওয়া সত্ত্বেও কালক্রমে তা সীমিত হয়ে নির্দিষ্ট কোনো অর্থে ব্যবহৃত হলে তাকে অর্থসংকোচ বলে। ‘মৃগ’ শব্দের প্রাচীন অর্থ ছিল যেকোনো বন্য পশু বা জন্তু, কিন্তু আধুনিক বাংলায় শব্দটি প্রধানত ‘হরিণ’ অর্থে ব্যবহৃত হয়। অর্থাৎ, শব্দটির ব্যাপক অর্থ সংকুচিত হয়ে একটি নির্দিষ্ট অর্থে সীমাবদ্ধ হয়েছে। তাই এটি অর্থসংকোচের উদাহরণ। অনুরূপ\nউদাহরণ-‘অন্ন’ শব্দের অর্থ খাদ্য থেকে সংকুচিত হয়ে ভাত এবং ‘সন্দেশ’ শব্দের অর্থ সংবাদ থেকে সংকুচিত হয়ে একপ্রকার মিষ্টান্ন বোঝায়।","topic":"শব্দার্থ"},{"id":"so030","n":30,"section":"bangla","q":"'অনুসন্ধানের ইচ্ছা' - এর বাক্য সংকোচন কোনটি?","options":{"A":"অনুসন্ধান","B":"অনুসন্ধিৎসা","C":"অনুধাবন","D":"অন্বেষণ"},"answer":"B","explain":"কোনো কাজ করার ইচ্ছা বা প্রবল আকাঙ্ক্ষা বোঝাতে বিশেষ শব্দ ব্যবহৃত হয়। ‘অনুসন্ধানের ইচ্ছা’ বা ‘অনুসন্ধান করার প্রবল আগ্রহ’ এক কথায় অনুসন্ধিৎসা। আর যিনি অনুসন্ধান করতে আগ্রহী বা ইচ্ছুক, তাঁকে অনুসন্ধিৎসু বলা হয়। অনুরূপ উদাহরণ-জানার ইচ্ছা = জিজ্ঞাসা, জয় করার ইচ্ছা = জিগীষা এবং দেখার ইচ্ছা = দিদৃক্ষা।","topic":"বাক্য সংকোচন"},{"id":"so031","n":31,"section":"bangla","q":"কোন বানানটি শুদ্ধ?","options":{"A":"পৌনঃপুনিক","B":"পৌনপুনিক","C":"পৌনঃপূনীক","D":"পোনঃপুনিক"},"answer":"A","explain":"বাংলা একাডেমি আধুনিক বাংলা অভিধান অনুযায়ী সঠিক বানানটি হলো 'পৌনঃপুনিক' অর্থ: বারবার সংঘটিত, পুনঃপুন ঘটে এমন বা পুনরাবৃত্তিমূলক। বানান বিশ্লেষণ: ‘পৌ’ (ঔ-কার) + ‘নঃ’ (বিসর্গ) + ‘পু’ (হ্রস্ব উ-কার) + ‘নি’ (হ্রস্ব ই-কার)।","topic":"বানান"},{"id":"so032","n":32,"section":"bangla","q":"সারাংশে মূলের প্রত্যক্ষ উক্তি কীভাবে লিখতে হয়?","options":{"A":"উদ্ধৃতি চিহ্নে","B":"পরোক্ষ উক্তিতে","C":"সংলাপ আকারে","D":"অপরিবর্তিতভাবে"},"answer":"B","explain":"সারাংশ বা সারমর্ম লেখার সময় মূল অনুচ্ছেদে কোনো বক্তার প্রত্যক্ষ উক্তি বা উদ্ধৃতি থাকলে তা হুবহু তুলে দেওয়া উচিত নয়। বরং উক্তির মূল বক্তব্য ও ভাব অক্ষুণ্ণ রেখে নিজের ভাষায় পরোক্ষ উক্তিতে প্রকাশ করতে হয়। এতে সারাংশের সংক্ষিপ্ততা, ভাষার স্বাভাবিকতা ও বক্তব্যের ধারাবাহিকতা বজায় থাকে। পাশাপাশি অপ্রয়োজনীয় উদ্ধৃতি, উপমা, অলংকার ও উদাহরণ পরিহার করে মূল বক্তব্যকে সংক্ষেপে উপস্থাপন করতে হয়।","topic":"নির্মিতি"},{"id":"so033","n":33,"section":"bangla","q":"'হকিকত-ই-মুসলমান-ই-বাঙ্গালা' (১৮৯৬) গ্রন্থের লেখক কে?","options":{"A":"কাজী আবদুল ওদুদ","B":"দেওয়ান খোন্দকার ফজলে রাব্বি","C":"আবুল হোসেন","D":"খান বাহাদুর আবদুর রহমান খাঁ"},"answer":"B","explain":"কিকত-ই-মুসলমান-ই-বাঙ্গালা’ (Haqiqate Musalman-i-Bengalah) উনিশ শতকের বাংলার মুসলমানদের উৎপত্তি ও ইতিহাসবিষয়ক একটি গুরুত্বপূর্ণ গবেষণাধর্মী গ্রন্থ। এর রচয়িতা খান বাহাদুর খোন্দকার ফজলে রাব্বি (১৮৪৮–১৯১৭)। তিনি মুর্শিদাবাদের নবাবের দেওয়ান হিসেবে দায়িত্ব পালন করেন। ইতিহাস, সমাজ ও সংস্কৃতিবিষয়ক গবেষণায় তাঁর বিশেষ অবদান রয়েছে। ব্রিটিশ সরকার তাঁকে ‘খান বাহাদুর’ উপাধিতে ভূষিত করে।গ্রন্থটিতে বাংলার মুসলমানদের উৎপত্তি, বংশপরিচয় ও জনসংখ্যাগত ইতিহাস অনুসন্ধান করা হয়েছে। বিশেষ করে ১৮৯১ সালের আদমশুমারিতে বাংলায় মুসলমানদের সংখ্যাধিক্যের কারণ ব্যাখ্যা করার চেষ্টা করা হয়। লেখক বাংলার ইতিহাস, বিভিন্ন ঐতিহাসিক বিবরণ ও প্রামাণ্য দলিল পর্যালোচনা করে মুসলমানদের আগমন ও বসতি স্থাপনের ইতিহাস তুলে ধরেন। তাঁর বক্তব্য অনুযায়ী, বাংলার মুসলমানদের একটি বড় অংশের পূর্বপুরুষ ছিলেন বহিরাগত মুসলিম শাসনামলে বাংলায় আগত মুসলমানরা। তিনি জোরপূর্বক ধর্মান্তরের ধারণার পরিবর্তে ঐতিহাসিক অভিবাসন ও বসতি স্থাপনের বিষয়টিকে গুরুত্ব দেন। তবে তাঁর এই ব্যাখ্যা ইতিহাসচর্চায় আলোচনার ও বিতর্কের বিষয়। প্রকাশনা ও ভাষা: মূল গ্রন্থটি ফারসি ভাষায় রচিত। এর ইংরেজি অনুবাদ The Origin of the Musalmans of Bengal নামে ১৮৯৫ সালে কলকাতার Thacker, Spink & Co. থেকে প্রকাশিত হয়। গ্রন্থটির অনুবাদ ও প্রকাশনার ইতিহাসে শেখ আবদুর রহিমের নামও\nগুরুত্বপূর্ণ, তিনি পরবর্তী সময়ে ‘বাঙ্গালার মুসলমান’ নামে বাংলায় অনুবাদ ধারাবাহিকভাবে প্রকাশ করেন।\nতথ্যসূত্র: The Origin of the Musalmans of Bengal ও ১৮৯৫-Granth Sanjeevani-এর গ্রন্থপঞ্জি।","topic":"বাংলা সাহিত্য"},{"id":"so034","n":34,"section":"bangla","q":"নিচের কোনটি দ্বিস্বর ধ্বনি নয়?","options":{"A":"বিধি","B":"রিষ্টি","C":"রদ","D":"ইয়ে"},"answer":"C","explain":"দ্বিস্বরধ্বনি বা যৌগিক স্বরধ্বনি (Diphthong) হলো এমন স্বরধ্বনি, যা উচ্চারণের সময় জিহ্বা ও মুখের অবস্থান একটি স্বরধ্বনি থেকে অন্য স্বরধ্বনির দিকে পরিবর্তিত হয়। অর্থাৎ একই উচ্চারণপ্রবাহে দুটি স্বরধ্বনির সংযুক্তি ঘটে। প্রদত্ত বিকল্পগুলোর মধ্যে ‘ইয়ে’ শব্দে ‘ই’ ও ‘এ’ স্বরধ্বনির সংযোগ লক্ষ করা যায়। অন্যদিকে, ‘রদ’ শব্দে (র্+অ+দ্) কেবল ‘অ’ স্বরধ্বনি রয়েছে, এখানে দুটি স্বরধ্বনির সংযুক্তি নেই।","topic":"ধ্বনি"},{"id":"so035","n":35,"section":"bangla","q":"নিচের কোনটির সন্ধিবিচ্ছেদ ঠিকভাবে হয়নি?","options":{"A":"ষষ্ + থ = ষষ্ঠ","B":"মহা + ঋষি = মহর্ষি","C":"শরৎ + চন্দ্র = শরৎচন্দ্র","D":"মৃত্যু + জয় = মৃত্যুঞ্জয়"},"answer":"C","explain":"বাংলা ব্যাকরণে ব্যঞ্জনসন্ধির নিয়ম অনুযায়ী, নির্দিষ্ট ক্ষেত্রে ‘ৎ’-এর পরে ‘চ’ থাকলে ‘ৎ’ পরিবর্তিত হয়ে ‘চ্’ হয়। সে অনুযায়ী ‘শরৎ + চন্দ্র’-এর সন্ধিবদ্ধ রূপ হবে ‘শরচ্চন্দ্র’, ‘শরৎচন্দ্র’ নয়। তবে ‘শরৎচন্দ্র’ একটি প্রচলিত ব্যক্তিনাম, যা সন্ধির নিয়ম অনুসারে গঠিত শব্দ নয়, এটি দুটি পৃথক শব্দের সংযোগে গঠিত নাম। ব্যঞ্জনসন্ধির নিয়ম অনুযায়ী, 'ৎ' বা 'দ'-এর পরে 'চ' বা 'ছ' থাকলে 'ৎ/দ্' স্থানে 'চ্' হয়। তাই শরৎ + চন্দ্র = শরচ্চন্দ্র হবে (শরৎচন্দ্র নয়!)। বাকি তিনটি সন্ধিবিচ্ছেদই প্রচলিত ব্যাকরণ অনুযায়ী সঠিক: (A) ষষ্ + থ = ষষ্ঠ ('ষ্'- এর পর 'থ' থাকলে 'ঠ' হয়), (B) মহা + ঋষি = মহর্ষি (আ + ঋ = অO), এবং (D) মৃতু\" + জয় = মৃত্যুঞ্জয় (নিপাতনে/বিশেষ নিয়মে অনুস্বার/ঞ্ আগম)।","topic":"সন্ধি"},{"id":"so036","n":36,"section":"bangla","q":"'কাগজ' শব্দটি কোন ভাষা হতে আগত?","options":{"A":"ফারসি","B":"উর্দু","C":"আরবি","D":"তুর্কি"},"answer":"A","explain":"‘কাগজ’ শব্দটি ফারসি ভাষার ‘কাগয’ (Kāghaz) শব্দ থেকে বাংলা ভাষায় এসেছে। বাংলা ভাষায় ব্যবহৃত বহু শব্দ ফারসি ভাষা থেকে গৃহীত হয়েছে। বিশেষ করে ধর্ম, প্রশাসন, ব্যবসা-বাণিজ্য ও দৈনন্দিন জীবনসংক্রান্ত শব্দের ক্ষেত্রে ফারসি ভাষার প্রভাব উল্লেখযোগ্য। ফারসি ভাষার আরও কিছু বহুল পরীক্ষিত শব্দ হলো: খোদা, গুনাহ, দোজখ, নামাজ, রোজা, বেহেশত, চশমা, দস্তখত, তারিখ, আমদানি, রপ্তানি, চাকরি, দোকান, কারখানা।\nতথ্যসূত্র: বাংলা একাডেমি, আধুনিক বাংলা অভিধান, ড. হায়াৎ মামুদ, বাংলা ভাষা ও ব্যাকরণবিষয়ক গ্রন্থ।","topic":"শব্দের উৎস"},{"id":"so037","n":37,"section":"bangla","q":"আর হায় হায় করে লাভ কী? - এ বাক্যে 'হায় হায়' কোন অর্থ প্রকাশ করছে?","options":{"A":"ভাবের প্রগাঢ়তা","B":"ভাবের গভীরতা","C":"তীব্রতা","D":"পৌনঃপুনিকতা"},"answer":"D","explain":"দ্বিরুক্ত শব্দের মাধ্যমে একই শব্দের পুনরাবৃত্তি ঘটিয়ে কোনো কাজ বারবার বা ক্রমাগত সংঘটিত হওয়ার ভাব প্রকাশ করা হলে তাকে পৌনঃপুনিকতা বলে। প্রদত্ত বাক্যে ‘আর হায় হায় করে লাভ কী?’-এখানে ‘হায় হায়’ শব্দের পুনরাবৃত্তির মাধ্যমে বারবার আক্ষেপ বা বিলাপ করার বিষয়টি বোঝানো হয়েছে। অর্থাৎ, বারবার আক্ষেপ করে কোনো লাভ নেই-এমন ভাব প্রকাশ পেয়েছে। তাই এখানে ‘হায় হায়’ পৌনঃপুনিকতা প্রকাশ করছে।","topic":"দ্বিরুক্ত শব্দ"},{"id":"so038","n":38,"section":"bangla","q":"ব্যধিকরণ বহুব্রীহি সমাসের উদাহরণ কোনটি?","options":{"A":"খোশ মেজাজ যার","B":"হাতে খড়ি যার","C":"কানে কানে যে কথা","D":"রত্ন গর্ভে যার"},"answer":"D","explain":"যে বহুব্রীহি সমাসে পূর্বপদ ও পরপদের মধ্যে অধিকরণ বা কারকগত বিভক্তির পার্থক্য থাকে, তাকে ব্যধিকরণ বহুব্রীহি সমাস বলে। অর্থাৎ, সমাসবদ্ধ পদে পূর্বপদ ও পরপদের বিভক্তিগত সম্পর্ক একরকম থাকে না। ‘রত্ন গর্ভে যার’ এর সমাসবদ্ধ রূপ ‘রত্নগর্ভা’। এখানে ‘রত্ন’ শব্দটি ‘গর্ভে’ পদের সঙ্গে সম্পর্কিত এবং ‘গর্ভে’ শব্দটি অধিকরণ কারক নির্দেশ করে। সমগ্র পদটি এমন নারীকে বোঝায়, যার গর্ভে রত্নতুল্য সন্তান রয়েছে। তাই এটি ব্যধিকরণ বহুব্রীহি সমাসের উদাহরণ। অন্য বিকল্পগুলোর পরিচয়:\n- খোশ মেজাজ যার: সমানাধিকরণ বহুব্রীহি সমাস।\n- হাতে খড়ি যার: অলুক বহুব্রীহি সমাস।\n- কানে কানে যে কথা: ব্যতিহার বহুব্রীহি সমাস।","topic":"সমাস"},{"id":"so039","n":39,"section":"bangla","q":"'ষ্ণ' প্রত্যয়যুক্ত শব্দে মূল স্বরের কী হয়?","options":{"A":"হ্রাস","B":"বৃদ্ধি","C":"দ্বিগুণ","D":"গুণ"},"answer":"B","explain":"সংস্কৃত তদ্ধিত প্রত্যয় ‘ষ্ণ’ যুক্ত হলে অনেক ক্ষেত্রে শব্দের আদি বা মূল স্বরের বৃদ্ধি ঘটে। সংস্কৃত ব্যাকরণের বৃদ্ধির নিয়ম অনুযায়ী, অ-কারের বৃদ্ধি আ-কার, ই বা ঈ-কারের বৃদ্ধি ঐ-কার, উ বা ঊ-কারের বৃদ্ধি ঔ-কার এবং ঋ-কারের বৃদ্ধি আ° হয়। যেমন- মনু + ষ্ণ = মানব, শিব + ষ্ণ = শৈব, বিষ্ণু + ষ্ণ = বৈষ্ণব এবং রঘু + ষ্ণ = রাঘব। এসব উদাহরণে প্রত্যয় যুক্ত হওয়ার ফলে মূল শব্দের স্বরধ্বনির পরিবর্তন ঘটেছে। এই পরিবর্তনকে স্বরবৃদ্ধি বলে।","topic":"প্রত্যয়"},{"id":"so040","n":40,"section":"bangla","q":"লেখার সময় কোনো কথা অব্যক্ত রাখতে চাইলে কোন বিরামচিহ্ন ব্যবহার করতে হয়?","options":{"A":"বিন্দু","B":"ত্রিবিন্দু","C":"কমা","D":"কোলন"},"answer":"B","explain":"কোনো বাক্য লেখার সময় কথা অসম্পূর্ণ রাখলে, কিছু অংশ বাদ দিলে বা কোনো ভাব অব্যক্ত (উহ্য) রাখতে চাইলে পরপর তিনটি বিন্দু (...) বা 'ত্রিবিন্দু' (Ellipsis) ব্যবহার করা হয়। বাংলা একাডেমি ও নবম-দশম শ্রেণির ব্যাকরণ অনুযায়ী এই চিহ্নের নাম ত্রিবিন্দু বা বর্জন চিহ্ন।\nউদাহরণ:\n- অনেক কিছু বলার ছিল, কিন্তু...\n- জীবন মানেই সংগ্রাম, আশা, স্বপ্ন...\n- ত্রিবিন্দু (...) = বর্জন চিহ্ন (Ellipsis)।","topic":"বিরামচিহ্ন"},{"id":"so041","n":41,"section":"math","q":"In a triangle, the second angle is three times the first angle, and the third angle is 20° more than the first angle. Find the first angle.","options":{"A":"28°","B":"32°","C":"36°","D":"40°"},"answer":"B","explain":"সমাধান:\nধরি, ত্রিভুজের প্রথম কোণ = x°\nপ্রশ্নমতে,\nদ্বিতীয় কোণ = ৩x°\nতৃতীয় কোণ = (x + ২০)°\nআমরা জানি, ত্রিভুজের তিনটি কোণের সমষ্টি ১৮০°।\nসুতরাং,\nx + 3x + (x + 20) = 180°\nবা, 5x + 20 = 180°\nবা, 5x = 180° − 20°\nবা, 5x = 160°\nবা, x = 160° ÷ 5\n∴ x = 32°\nঅতএব, ত্রিভুজের প্রথম কোণটির মান 32°।","topic":"Geometry"},{"id":"so042","n":42,"section":"math","q":"A rectangular tank 20 m × 10 m × 6 m is filled with water. The water is poured into cylindrical cans of radius 1 m and height 2 m. How many cans are needed?","options":{"A":"150","B":"200","C":"300","D":"400"},"answer":null,"explain":"আয়তাকার ট্যাংকের আয়তন = দৈর্ঘ্য × প্রস্থ × উচ্চতা\n= ২০ × ১০ × ৬\n= ১২০০ ঘনমিটার।\nএকটি বেলনাকার ক্যানের আয়তন = πr²h\n= π × ১² × ২\n= ২π ঘনমিটার।\nপ্রয়োজনীয় ক্যানের সংখ্যা = ট্যাংকের আয়তন ÷ একটি ক্যানের আয়তন\n= ১২০০ ÷ ২π\n= ৬০০ ÷ ৩.১৪১৬\n≈ ১৯০.৯৯\nঅর্থাৎ, সম্পূর্ণ পানি ধারণ করতে কমপক্ষে ১৯১টি ক্যান প্রয়োজন।","topic":"Mensuration","note":"সমাধান অনুযায়ী প্রদত্ত কোনো অপশনই সঠিক নয় (প্রকৃত উত্তর ≈ ১৯১টি ক্যান)। এই প্রশ্নটি স্কোরে গণনা করা হয় না।"},{"id":"so043","n":43,"section":"math","q":"A student who scores 40%, fails by 30 marks. Another student who scores 60%, gets 30 marks more than the pass mark. What is the total marks of the examination?","options":{"A":"100","B":"150","C":"300","D":"600"},"answer":"C","explain":"ধরি, পরীক্ষার মোট নম্বর = M।\nপ্রথম শিক্ষার্থী ৪০% নম্বর পেয়ে ৩০ নম্বরের জন্য অকৃতকার্য হয়েছে। সুতরাং, পাস নম্বর = (M-এর ৪০%) + ৩০। আবার, দ্বিতীয় শিক্ষার্থী ৬০% নম্বর পেয়ে পাস নম্বরের চেয়ে ৩০ নম্বর বেশি পেয়েছে। সুতরাং, পাস নম্বর = (M-এর ৬০%) − ৩০। শর্তানুযায়ী, M-এর ৪০% + ৩০ = M-এর ৬০% − ৩০\nবা, ৬০% − ৪০% = ৩০ + ৩০\nবা, ২০% = ৬০\nবা, ১০০% = (৬০ × ১০০) ÷ ২০\nবা, ১০০% = ৩০০\nঅতএব, পরীক্ষার মোট নম্বর ৩০০।","topic":"Percentage"},{"id":"so044","n":44,"section":"math","q":"Two numbers are in the ratio 4 : 7 and their sum is 220. What is the smaller number?","options":{"A":"80","B":"84","C":"88","D":"96"},"answer":"A","explain":"সমাধান:\nধরি, সংখ্যা দুটি যথাক্রমে ৪x এবং ৭x।\nপ্রশ্নমতে,\n৪x + ৭x = ২২০\nবা, ১১x = ২২০\nবা, x = ২২০ ÷ ১১\nবা, x = ২০\nসুতরাং, ছোট সংখ্যাটি = ৪x\n= ৪ × ২০\n= ৮০।\nঅতএব, ছোট সংখ্যাটি ৮০।","topic":"Ratio & Proportion"},{"id":"so045","n":45,"section":"math","q":"A man sold a watch at a 5% loss. If he had received Tk. 50 more, he would have sold it at no profit and no loss. Find the cost price.","options":{"A":"Tk. 400","B":"Tk. 600","C":"Tk. 800","D":"Tk. 1000"},"answer":"D","explain":"সমাধান:ঘড়িটি ৫% ক্ষতিতে বিক্রি করা হয়েছিল। অর্থাৎ, বিক্রয়মূল্য ছিল ক্রয়মূল্যের ৯৫%।\nযদি আরও ৫০ টাকা বেশি পাওয়া যেত, তাহলে কোনো লাভ বা ক্ষতি হতো না। অর্থাৎ, বিক্রয়মূল্য ক্রয়মূল্যের ১০০% হতো।\nসুতরাং,\nক্রয়মূল্যের ১০০% − ৯৫% = ৫০ টাকা\nবা, ক্রয়মূল্যের ৫% = ৫০ টাকা\nবা, ক্রয়মূল্যের ১% = ৫০ ÷ ৫ = ১০ টাকা\nবা, ক্রয়মূল্যের ১০০% = ১০ × ১০০\n= ১০০০ টাকা।\nঅতএব, ঘড়িটির ক্রয়মূল্য ১০০০ টাকা।","topic":"Profit & Loss"},{"id":"so046","n":46,"section":"math","q":"Find the value of lim(x→0) [sin(3x)/x].","options":{"A":"1","B":"3","C":"1/3","D":"0"},"answer":"B","explain":"সমাধান:\nআমরা জানি,\nlim(x→0) [sin x / x] = 1\nপ্রদত্ত রাশি,\nlim(x→0) [sin 3x / x]\n= lim(x→0) [sin 3x / 3x] × 3\n= 3 × lim(x→0) [sin 3x / 3x]\n= 3 × 1\n= 3\nঅতএব, নির্ণেয় সীমার মান 3।","topic":"Calculus"},{"id":"so047","n":47,"section":"math","q":"Find the value of (1 + i)⁸, where i = √(-1).","options":{"A":"8","B":"16","C":"-16","D":"8i"},"answer":"B","explain":"সমাধান:\nআমরা জানি, i² = −1\nপ্রদত্ত রাশি,\n(1 + i)⁸\n= [(1 + i)²]⁴\n= [1² + 2 × 1 × i + i²]⁴\n= [1 + 2i − 1]⁴\n= (2i)⁴\n= 2⁴ × i⁴\n= 16 × (i²)²\n= 16 × (−1)²\n= 16 × 1\n= 16\nঅতএব, নির্ণেয় মান 16।","topic":"Complex Numbers"},{"id":"so048","n":48,"section":"math","q":"Two fair dice are rolled. What is the probability that the sum of the numbers is 7?","options":{"A":"1/6","B":"5/36","C":"1/12","D":"7/36"},"answer":"A","explain":"সমাধান:\nদুটি ছক্কা একসঙ্গে নিক্ষেপ করলে মোট সম্ভাব্য ফলাফলের সংখ্যা = ৬ × ৬ = ৩৬টি।\nদুটি ছক্কার সংখ্যার যোগফল ৭ হওয়ার অনুকূল ফলাফলগুলো হলো:\n(১, ৬), (২, ৫), (৩, ৪), (৪, ৩), (৫, ২), (৬, ১)।\nঅর্থাৎ, অনুকূল ফলাফলের সংখ্যা = ৬টি।\nআমরা জানি,\nসম্ভাব্যতা = অনুকূল ফলাফলের সংখ্যা ÷ মোট সম্ভাব্য ফলাফলের সংখ্যা\n= ৬/৩৬\n= ১/৬\nঅতএব, নির্ণেয় সম্ভাব্যতা ১/৬।","topic":"Probability"},{"id":"so049","n":49,"section":"math","q":"Find the remainder when 2¹⁰ is divided by 7.","options":{"A":"1","B":"2","C":"4","D":"6"},"answer":"B","explain":"প্রদত্ত রাশি = ২¹⁰\nআমরা জানি,\n২১০ = ১০২৪\nএখন, ১০২৪-কে ৭ দিয়ে ভাগ করলে,\n৭ × ১৪৬ = ১০২২\nভাগশেষ = ১০২৪ − ১০২২\n= ২\nঅতএব, নির্ণেয় ভাগশেষ ২।","topic":"Number Theory"},{"id":"so050","n":50,"section":"math","q":"Solve log₂(x) + log₂(x - 2) = 3 for x > 2.","options":{"A":"2","B":"4","C":"-2","D":"8"},"answer":"B","explain":"প্রদত্ত সমীকরণ,\nlog₂(x) + log₂(x − 2) = 3\nআমরা জানি, logₐm + logₐn = logₐ(mn)\nসুতরাং,\nlog₂[x(x − 2)] = 3\nলগারিদমের সংজ্ঞা অনুযায়ী,\nx(x − 2) = 2³\nবা, x² − 2x = 8\nবা, x² − 2x − 8 = 0\nবা, (x − 4)(x + 2) = 0\nসুতরাং, x = 4 অথবা x = −2।\nপ্রশ্নে দেওয়া আছে, x > 2। তাই x = −2 গ্রহণযোগ্য নয়।\nঅতএব, নির্ণেয় মান x = ৪।","topic":"Logarithm"},{"id":"so051","n":51,"section":"math","q":"Find the average value of f(x) = x² on the interval [0, 3].","options":{"A":"3","B":"9/2","C":"9","D":"2"},"answer":"A","explain":"সমাধান:\nআমরা জানি, কোনো ফাংশনের নির্দিষ্ট ব্যবধিতে গড় মান নির্ণয়ের সূত্র হলো,\nগড় মান = (১ ÷ ব্যবধানের দৈর্ঘ্য) × নির্দিষ্ট সীমার মধ্যে ফাংশনের সমাকলন।\nপ্রশ্নমতে, নিম্নসীমা = ০, ঊর্ধ্বসীমা = ৩ এবং ফাংশন = x²।\nসুতরাং,\nগড় মান = (১ ÷ (৩ − ০)) × ∫₀³ x² dx\n= (১/৩) × [x৩/৩]০৩\n= (১/৩) × [(৩³/৩) − (০³/৩)]\n= (১/৩) × (২৭/৩)\n= (১/৩) × ৯\n= ৩","topic":"Calculus"},{"id":"so052","n":52,"section":"math","q":"How many distinct arrangements are there of the letters of the word \"LEVEL\"?","options":{"A":"30","B":"60","C":"120","D":"20"},"answer":"A","explain":"সমাধান:\n‘LEVEL’ শব্দটিতে মোট ৫টি অক্ষর রয়েছে। এর মধ্যে L অক্ষরটি ২ বার, E অক্ষরটি ২ বার এবং V অক্ষরটি ১ বার ব্যবহৃত হয়েছে। আমরা জানি, একই অক্ষরের পুনরাবৃত্তি থাকলে ভিন্ন বিন্যাসের সংখ্যা নির্ণয়ের সূত্র হলো, ভিন্ন বিন্যাসের সংখ্যা = n! ÷ (p! × q!)\nসুতরাং,\n= ৫! ÷ (২! × ২!)\n= (৫ × ৪ × ৩ × ২ × ১) ÷ [(২ × ১) × (২ × ১)]\n= ১২০ ÷ ৪\n= ৩০\nঅতএব, ‘LEVEL’ শব্দটির মোট ভিন্ন বিন্যাস সংখ্যা ৩০টি।","topic":"Permutation & Combination"},{"id":"so053","n":53,"section":"math","q":"Tk 12,600 is divided among X, Y and Z. X gets 2/3 of what Y gets, and Y gets 3/4 of what Z gets. Find each person's share.","options":{"A":"X Tk 3,000, Y Tk 4,000, Z Tk 5,600","B":"X Tk 2,800, Y Tk 4,200, Z Tk 5,600","C":"X Tk 2,600, Y Tk 4,200, Z Tk 5,800","D":"X Tk 2,400, Y Tk 4,600, Z Tk 5,600"},"answer":"B","explain":"সমাধান:\nপ্রশ্নমতে,\nX : Y = 2 : 3\nY : Z = 3 : 4\nঅতএব, সম্মিলিত অনুপাত-\nX : Y : Z = 2 : 3 : 4\nঅনুপাতের রাশিগুলোর যোগফল\n= 2 + 3 + 4\n= 9\nপ্রতি এককের মান\n= 12,600 ÷ 9\n= 1,400 টাকা।\nসুতরাং,\nX-এর প্রাপ্য = 2 × 1,400 = 2,800 টাকা।\nY-এর প্রাপ্য = 3 × 1,400 = 4,200 টাকা।\nZ-এর প্রাপ্য = 4 × 1,400 = 5,600 টাকা।","topic":"Ratio & Proportion"},{"id":"so054","n":54,"section":"math","q":"A customer pays Tk 41,400 for a refrigerator, including 15% VAT, after a 10% discount on the list price. Find the list price.","options":{"A":"Tk 45,000","B":"Tk 40,000","C":"Tk 36,000","D":"Tk 38,000"},"answer":"B","explain":"মাধান:\nধরি, রেফ্রিজারেটরটির তালিকামূল্য = Tk 100।\n10% ছাড় দেওয়ার পর মূল্য থাকে\n= Tk (100 − 10)\n= Tk 90।\nএখন, Tk 90-এর উপর 15% ভ্যাট যোগ করলে মোট মূল্য হয়\n= Tk (90 + 13.50)\n= Tk 103.50।\nঅর্থাৎ, তালিকামূল্য Tk 103.50 হলে ক্রেতাকে দিতে হয় Tk 103.50।\nপ্রশ্নমতে,\nTk 103.50 পরিশোধ করতে হয় = Tk 41,400।\nসুতরাং, তালিকামূল্য\n= (41,400 × 100) ÷ 103.50\n= Tk 40,000।\nঅতএব সঠিক উত্তর: B. Tk 40,000।","topic":"Percentage"},{"id":"so055","n":55,"section":"math","q":"Two articles are sold at Tk 1,200 each. One is sold at a 20% profit and the other at a 20% loss. Find the overall gain or loss percentage.","options":{"A":"4% loss","B":"4% gain","C":"No gain, no loss","D":"2% loss"},"answer":"A","explain":"সমাধান:\nপ্রথম পণ্যের বিক্রয়মূল্য = Tk 1,200\n২০% লাভে বিক্রয়মূল্য ক্রয়মূল্যের 120%।\nসুতরাং, প্রথম পণ্যের ক্রয়মূল্য\n= (1,200 × 100) ÷ 120\n= Tk 1,000।\nদ্বিতীয় পণ্যের বিক্রয়মূল্য = Tk 1,200\n২০% ক্ষতিতে বিক্রয়মূল্য ক্রয়মূল্যের 80%।\nসুতরাং, দ্বিতীয় পণ্যের ক্রয়মূল্য\n= (1,200 × 100) ÷ 80\n= Tk 1,500।\nএখন,\nমোট ক্রয়মূল্য = 1,000 + 1,500\n= Tk 2,500।\nমোট বিক্রয়মূল্য = 1,200 + 1,200\n= Tk 2,400।\nমোট ক্ষতি = 2,500 − 2,400\n= Tk 100।\nক্ষতির হার\n= (100 ÷ 2,500) × 100%\n= 4%।\nঅতএব, সঠিক উত্তর: A. 4% loss।।","topic":"Profit & Loss"},{"id":"so056","n":56,"section":"math","q":"The difference between the compound interest and the simple interest on a sum for 2 years at 8% per annum is Tk 96. Find the sum.","options":{"A":"Tk 12,000","B":"Tk 18,000","C":"Tk 20,000","D":"Tk 15,000"},"answer":"D","explain":"সমাধান:\nধরি, মূলধন = Tk P।\n২ বছরের চক্রবৃদ্ধি সুদ ও সরল সুদের পার্থক্য নির্ণয়ের সূত্র-\nপার্থক্য = মূলধন × (সুদের হার ÷ 100)²\nপ্রশ্নমতে,\n96 = P × (8 ÷ 100)²\nবা, 96 = P × 0.0064\nবা, P = 96 ÷ 0.0064\nবা, P = 15,000 টাকা।\nঅতএব, মূলধন = Tk 15,000।\nসঠিক উত্তর: D. Tk 15,000।","topic":"Interest"},{"id":"so057","n":57,"section":"math","q":"Find the smallest number which leaves remainder 7 when divided by 12, 15 or 20, and is exactly divisible by 11.","options":{"A":"187","B":"127","C":"247","D":"307"},"answer":"A","explain":"সমাধান: প্রথমে 12, 15 ও 20-এর ল.সা.গু. নির্ণয় করি।\nল.সা.গু. (12, 15, 20) = 60\nসুতরাং, নির্ণেয় সংখ্যাটি হবে-\n= 60k + 7\nএখানে, k = 1, 2, 3, ...\nএখন k-এর বিভিন্ন মান বসিয়ে পাই,\nk = 1 হলে, 60 × 1 + 7 = 67 (11 দ্বারা বিভাজ্য নয়)।\nk = 2 হলে, 60 × 2 + 7 = 127 (11 দ্বারা বিভাজ্য নয়)।\nk = 3 হলে, 60 × 3 + 7 = 187।\nএখানে, 187 = 11 × 17।\nঅর্থাৎ, 187 সংখ্যাটি 11 দ্বারা নিঃশেষে বিভাজ্য।\nঅতএব, নির্ণেয় ক্ষুদ্রতম সংখ্যা = 187।","topic":"LCM & HCF"},{"id":"so058","n":58,"section":"math","q":"Two kinds of tea cost Tk 120 and Tk 150 per kg. In what ratio should they be mixed so that selling the mixture at Tk 156 per kg gives a 20% profit?","options":{"A":"1:2","B":"3:2","C":"1:1","D":"2:1"},"answer":"D","explain":"সমাধান:\nমিশ্রণটির বিক্রয়মূল্য = Tk 156 প্রতি কেজি।\nলাভ = 20%।\nসুতরাং, মিশ্রণটির ক্রয়মূল্য\n= (156 × 100) ÷ 120\n= Tk 130 প্রতি কেজি।\nএখন, মিশ্রণ পদ্ধতি প্রয়োগ করে পাই-\nপ্রথম চায়ের দাম = Tk 120 প্রতি কেজি।\nদ্বিতীয় চায়ের দাম = Tk 150 প্রতি কেজি।\nমিশ্রণের গড় ক্রয়মূল্য = Tk 130 প্রতি কেজি।\nঅতএব, প্রয়োজনীয় অনুপাত\n= (150 − 130) : (130 − 120)\n= 20 : 10\n= 2 : 1।\nসুতরাং, প্রথম ও দ্বিতীয় প্রকারের চা 2 : 1 অনুপাতে মেশাতে হবে।","topic":"Mixture & Alligation"},{"id":"so059","n":59,"section":"math","q":"A machine loses 10% of its value every year. Its value after 2 years is Tk 48,600. What was its original value?","options":{"A":"Tk 58,320","B":"Tk 54,000","C":"Tk 60,000","D":"Tk 64,000"},"answer":"C","explain":"সমাধান:\nধরি, মেশিনটির প্রাথমিক মূল্য = Tk P।\nপ্রতি বছর 10% অবচয়ের পর অবশিষ্ট মূল্য থাকে 90%।\nসুতরাং, 2 বছর পর মেশিনটির মূল্য\n= P × (90 ÷ 100) × (90 ÷ 100)\n= P × 0.9 × 0.9\n= 0.81P\nপ্রশ্নমতে,\n0.81P = 48,600\nবা, P = 48,600 ÷ 0.81\nবা, P = 60,000 টাকা।\nঅতএব, মেশিনটির প্রাথমিক মূল্য = Tk 60,000।","topic":"Percentage"},{"id":"so060","n":60,"section":"math","q":"A rectangular field is 120 m long and 80 m wide. A path 4 m wide runs all around outside it. Find the cost of paving the path at Tk 150 per square metre.","options":{"A":"Tk 192,000","B":"Tk 249,600","C":"Tk 240,000","D":"Tk 260,400"},"answer":"B","explain":"সমাধান:\nমাঠের দৈর্ঘ্য = 120 m\nমাঠের প্রস্থ = 80 m\nরাস্তার প্রস্থ = 4 m।\nরাস্তা বাইরে চারদিকে থাকায়,\nরাস্তাসহ মোট দৈর্ঘ্য\n= 120 + (4 × 2)\n= 128 m।\nরাস্তাসহ মোট প্রস্থ\n= 80 + (4 × 2)\n= 88 m।\nরাস্তাসহ মোট ক্ষেত্রফল\n= 128 × 88\n= 11,264 m²।\nমাঠের ক্ষেত্রফল\n= 120 × 80\n= 9,600 m²।\nসুতরাং, রাস্তার ক্ষেত্রফল\n= 11,264 − 9,600\n= 1,664 m²।\nপ্রতি বর্গমিটারে পাকা করার খরচ = Tk 150।\nঅতএব, মোট খরচ\n= 1,664 × 150\n= Tk 249,600।","topic":"Mensuration"},{"id":"so061","n":61,"section":"banking","q":"Under Bangladesh Bank's revised rule effective from April 2025, a loan becomes classified (non- performing) once it is overdue for:","options":{"A":"30 days","B":"90 days","C":"180 days","D":"270 days"},"answer":"B","explain":"বাংলাদেশ ব্যাংকের Banking Regulation and Policy Department (BRPD) ২৭ নভেম্বর ২০২৪ তারিখে BRPD Circular No. 15 জারি করে ঋণ শ্রেণিকরণ ও প্রভিশন সংক্রান্ত সংশোধিত নীতিমালা প্রকাশ করে। এটি ১ এপ্রিল ২০২৫ থেকে কার্যকর হয়। নতুন নীতিমালা অনুযায়ী, কোনো ঋণ ৩ মাস বা তার বেশি সময় বকেয়া থাকলে তা Sub-standard (SS) বা শ্রেণিকৃত ঋণের অন্তর্ভুক্ত হবে। এ ধরনের শ্রেণিকৃত ঋণকে Non-Performing Loan (NPL) হিসেবে গণ্য করা হয়। ৯০ দিন বকেয়া থাকলে ঋণটি প্রথমে Sub-standard হিসেবে শ্রেণিকৃত হয়। তবে পরিস্থিতি ও ঝুঁকি বিবেচনায় বাংলাদেশ ব্যাংকের নীতিমালা অনুযায়ী নির্ধারিত সময়ের আগেও গুণগত মূল্যায়নের ভিত্তিতে ঋণ শ্রেণিকরণ করা সম্ভব। ঋণ শ্রেণিকরণের সময়সীমা: বকেয়া থাকার সময়                   ঋণের শ্রেণি ১ দিন থেকে ১ মাসের কম Standard-1 ১ মাস থেকে ২ মাসের কম Standard-2 ২ মাস থেকে ৩ মাসের কম Special Mention Account (SMA) ৩ মাস থেকে ৬ মাসের কম Sub-standard (SS) ৬ মাস থেকে ১২ মাসের কম Doubtful (DF) ১২ মাস বা তার বেশি  Bad/Loss (B/L)\nসূত্র:Bangladesh Bank, BRPD Circular No. 15: Master Circular on Loan Classification and Provisioning.","topic":"Banking Regulation"},{"id":"so062","n":62,"section":"banking","q":"Which DSE index tracks Shariah-compliant listed companies?","options":{"A":"DS30","B":"DSEX","C":"DSES","D":"CDSET"},"answer":"C","explain":"ঢাকা স্টক এক্সচেঞ্জের (DSE) DSES (DSEX Shariah Index) হলো শরিয়াহসম্মত নীতিমালা অনুসরণকারী তালিকাভুক্ত কোম্পানিগুলোর শেয়ার নিয়ে গঠিত একটি বিশেষ সূচক। এটি এসব কোম্পানির শেয়ারবাজারের সামগ্রিক কার্যকারিতা ও মূল্যগত পরিবর্তন পরিমাপ করে। ঢাকা স্টক এক্সচেঞ্জ ২০ জানুয়ারি ২০১৪ তারিখে সূচকটি চালু করে। অন্যদিকে, DSEX হলো সামগ্রিক শেয়ারবাজারের সূচক এবং DS30 হলো নির্বাচিত ৩০টি শীর্ষস্থানীয় কোম্পানির শেয়ার নিয়ে গঠিত সূচক। সুতরাং, শরিয়াহসম্মত তালিকাভুক্ত কোম্পানিগুলোর শেয়ারবাজারের কার্যকারিতা পরিমাপের জন্য DSES ব্যবহৃত হয়। Bangladesh's Capital Market\nতথ্যসূত্র: ঢাকা স্টক এক্সচেঞ্জ (DSE), DSES Index Methodology।","topic":"Capital Market"},{"id":"so063","n":63,"section":"banking","q":"In Bangladesh Bank's interest rate corridor, the floor is set by the:","options":{"A":"Repo rate","B":"Standing Lending Facility","C":"Bank rate","D":"Standing Deposit Facility"},"answer":"D","explain":"বাংলাদেশ ব্যাংকের মুদ্রানীতি কাঠামোর Interest Rate Corridor (IRC) বা সুদের হার করিডোরের সর্বনিম্ন সীমা (Floor) নির্ধারণ করে Standing Deposit Facility (SDF)। এর মাধ্যমে বাণিজ্যিক ব্যাংকগুলো তাদের অতিরিক্ত তারল্য বা উদ্বৃত্ত অর্থ বাংলাদেশ ব্যাংকে জমা রাখতে পারে এবং নির্ধারিত সুদ পায়। অন্যদিকে, করিডোরের সর্বোচ্চ সীমা (Ceiling) নির্ধারণ করে Standing Lending Facility (SLF), যার মাধ্যমে ব্যাংকগুলো সব্ল্পমেয়াদি তারল্যসংকটে বাংলাদেশ ব্যাংক থেকে অর্থ ধার নিতে পারে। করিডোরের মধ্যবর্তী অবস্থানে থাকে Policy Rate। বাংলাদেশ ব্যাংক ১ জুলাই ২০২৩ তারিখে আধুনিক সুদভিত্তিক মুদ্রানীতি কাঠামোর অংশ হিসেবে এই Interest Rate Corridor চালু করে। সুতরাং, করিডোরের Floor নির্ধারণ করে Standing Deposit Facility (SDF)।\nতথ্যসূত্র: বাংলাদেশ ব্যাংক।","topic":"Monetary Policy"},{"id":"so064","n":64,"section":"banking","q":"Under Basel III in Bangladesh, the minimum total capital requirement including the capital conservation buffer is:","options":{"A":"8%","B":"10%","C":"10.5%","D":"12.5%"},"answer":"D","explain":"বাংলাদেশ ব্যাংকের Basel III নির্দেশিকা অনুযায়ী, বাংলাদেশের তফসিলি ব্যাংকগুলোরু ঝঁকিভিত্তিক সম্পদের (Risk-Weighted Assets-RWA) বিপরীতে ন্যূনতম মোট মূলধন পর্যাপ্ততার হার (Minimum CRAR) 10%। এর অতিরিক্ত 2.5% মূলধন সংরক্ষণ সংরক্ষিতি (Capital Conservation Buffer-CCB) Common Equity Tier 1 (CET1) মূলধনের মাধ্যমে সংরক্ষণ করতে হয়। ফলে CCB-সহ ন্যূনতম মোট মূলধন পর্যাপ্ততার হার দাঁড়ায় 12.5%। বাংলাদেশ ব্যাংকের ২০২৫ সালের আর্থিক স্থিতিশীলতা প্রতিবেদনেও 10% ন্যূনতম CRAR এবং অতিরিক্ত 2.5% CCB-এর বিধান বহাল থাকার বিষয়টি উল্লেখ করা হয়েছে।\nহিসাব:\n- ন্যূনতম মোট মূলধন = 10%\n- Capital Conservation Buffer = 2.5%\n- সর্বমোট = 10% + 2.5% = 12.5%\nতথ্যসূত্র: Bangladesh Bank, Financial Stability Report 2025, পৃষ্ঠা ৫০।","topic":"Basel III & Capital"},{"id":"so065","n":65,"section":"banking","q":"Which risk cannot be eliminated through diversification?","options":{"A":"Business Risk","B":"Financial Risk","C":"Unsystematic Risk","D":"Systematic Risk"},"answer":"D","explain":"ফিন্যান্সে ঝুঁকি প্রধানত দুই প্রকার-Systematic Risk ও Unsystematic Risk। Unsystematic Risk নির্দিষ্ট প্রতিষ্ঠান বা শিল্পের সঙ্গে সম্পর্কিত এবং Diversification-এর মাধ্যমে এ ঝুঁকি কমানো যায়। অন্যদিকে, Systematic Risk সামগ্রিক অর্থনীতি ও বাজারের পরিবর্তনের কারণে সৃষ্টি হয়। যেমন-মূল্যস্ফীতি, সুদের হারের পরিবর্তন, অর্থনৈতিক মন্দা ও যুদ্ধ। এ ঝুঁকি পুরো বাজারকে প্রভাবিত করে বলে Diversification-এর মাধ্যমে এটি দূর করা সম্ভব নয়। তাই Systematic Risk হলো সেই ঝুঁকি, যা বিনিয়োগ বহুমুখীকরণের মাধ্যমে দূর করা যায় না।\nতথ্যসূত্র: ACCA, The Risk and Return Relationship – Part 1.","topic":"Risk Management"},{"id":"so066","n":66,"section":"banking","q":"Which of the following is a money market instrument?","options":{"A":"Ordinary Share","B":"Preference Share","C":"Treasury Bill","D":"Long-term Corporate Bond"},"answer":"C","explain":"আর্থিক বাজার (Financial Market) প্রধানত Money Market (মুদ্রাবাজার) ও Capital Market (পুঁজিবাজার)-এই দুই ভাগে বিভক্ত। Money Market-এ সাধারণত ১ বছর বা তার কম মেয়াদের সব্ল্পমেয়াদি আর্থিক উপকরণ লেনদেন হয়। Treasury Bill (T- Bill) হলো সরকার কর্তৃক সব্ল্পমেয়াদি অর্থ সংগ্রহের জন্য ইস্যু করা একটি ঋণপত্র, যার মেয়াদ সাধারণত ১ বছরের মধ্যে। বাংলাদেশে প্রচলিত T-Bill-এর মেয়াদ ১৪ দিন, ৯১ দিন, ১৮২ দিন ও ৩৬৪ দিন। অন্যদিকে, Ordinary Share ও Preference Share হলো পুঁজিবাজারের ইকুইটি উপকরণ এবং Long-term Corporate Bond হলো দীর্ঘমেয়াদি ঋণপত্র।\nতথ্যসূত্র: বাংলাদেশ ব্যাংক, Bangladesh Government Securities Quarterly Bulletin, January–March 2026.","topic":"Money Market"},{"id":"so067","n":67,"section":"banking","q":"Which international framework establishes capital adequacy and liquidity standards for banks?","options":{"A":"IFRS","B":"Basel III","C":"UCP 600","D":"ISO 9001"},"answer":"B","explain":"আন্তর্জাতিক ব্যাংকিং ব্যবস্থায় ব্যাংকগুলোর মূলধন পর্যাপ্ততা (Capital Adequacy), তারল্য ব্যবস্থাপনা (Liquidity Management), ঝুঁকি নিয়ন্ত্রণ ও আর্থিক স্থিতিশীলতা নিশ্চিত করার জন্য Basel III Framework প্রণয়ন করা হয়। ২০০৭–২০০৯ সালের বৈশ্বিক আর্থিক সংকটের পর Basel Committee on Banking Supervision (BCBS) এই কাঠামো তৈরি করে। এর মূল উদ্দেশ্য হলো ব্যাংকগুলোর আর্থিক সক্ষমতা বৃদ্ধি এবং সম্ভাব্য আর্থিক সংকট মোকাবিলার প্রস্তুতি জোরদার করা। Basel III-এর গুরুত্বপূর্ণ দুটি তারল্য মানদণ্ড হলো Liquidity Coverage Ratio (LCR), যা ৩০ দিনের আর্থিক চাপ মোকাবিলায় পর্যাপ্ত তারল্য সংরক্ষণ নিশ্চিত করে এবং Net Stable Funding Ratio (NSFR), যা ব্যাংকের স্থিতিশীল অর্থায়ন বজায় রাখতে সহায়তা করে। অন্যদিকে, IFRS হলো আন্তর্জাতিক আর্থিক প্রতিবেদন মানদণ্ড, UCP 600 হলো ঋণপত্র বা Letter of Credit-সংক্রান্ত আন্তর্জাতিক নিয়মাবলি এবং ISO 9001 হলো গুণগত ব্যবস্থাপনা মানদণ্ড। সুতরাং, ব্যাংকের মূলধন পর্যাপ্ততা ও তারল্যসংক্রান্ত আন্তর্জাতিক মানদণ্ড নির্ধারণকারী কাঠামো হলো Basel III।\nতথ্যসূত্র: Bank for International Settlements (BIS), Basel III: International Regulatory Framework for Banks.","topic":"Basel III & Capital"},{"id":"so068","n":68,"section":"banking","q":"Which of the following is the full form of SWIFT in international banking?","options":{"A":"Society for Worldwide Interbank Financial Transactions","B":"Society for Worldwide Interbank Financial Telecommunication","C":"System for Worldwide International Fund Transfer","D":"Society for World Investment and Financial Technology"},"answer":"B","explain":"আন্তর্জাতিক ব্যাংকিং ও আর্থিক লেনদেনে নিরাপদ যোগাযোগের জন্য ব্যবহৃত SWIFT-এর পূর্ণরূপ হলো Society for Worldwide Interbank Financial Telecommunication। এটি ১৯৭৩ সালে ১৫টি দেশের ২৩৯টি ব্যাংকের উদ্যোগে প্রতিষ্ঠিত হয় এবং ১৯৭৭ সালে আনুষ্ঠানিকভাবে কার্যক্রম শুরু করে। এর সদর দপ্তর বেলজিয়ামের লা হুল্পে (La Hulpe) অবস্থিত। SWIFT বিশ্বের বিভিন্ন দেশের ব্যাংক ও আর্থিক প্রতিষ্ঠানের মধ্যে আন্তর্জাতিক লেনদেনসংক্রান্ত নিরাপদ ও মানসম্মত বার্তা আদান-প্রদানের নেটওয়ার্ক হিসেবে কাজ করে। উল্লেখ্য, SWIFT নিজে অর্থ স্থানান্তর বা নিষ্পত্তি করে না, বরং অর্থ লেনদেনের নির্দেশনা ও সংশ্লিষ্ট আর্থিক বার্তা আদান-প্রদানের ব্যবস্থা করে।\nতথ্যসূত্র: SWIFT Official Website.","topic":"Banking Terms"},{"id":"so069","n":69,"section":"banking","q":"Which Shariah principle is used for mobilizing current deposits by Islamic banks in Bangladesh?","options":{"A":"Mudaraba","B":"Musharaka","C":"Al-Wadiah","D":"Bi-Salam"},"answer":"C","explain":"বাংলাদেশের ইসলামী ব্যাংকগুলো চলতি আমানত (Current Deposit) সংগ্রহের ক্ষেত্রে Al-Wadiah (আল-ওয়াদিয়াহ) নীতি অনুসরণ করে। এ নীতিতে আমানতকারী ব্যাংকের কাছে অর্থ জমা রাখেন এবং ব্যাংক আমানতকারীর অনুমতি নিয়ে শরিয়াহসম্মত খাতে ওই অর্থ ব্যবহার করতে পারে। ব্যাংক আমানতকারীর চাহিবামাত্র জমাকৃত অর্থ ফেরত দিতে বাধ্য থাকে। এ ধরনের আমানতের বিপরীতে সাধারণত কোনো মুনাফা দেওয়া হয় না এবং বিনিয়োগ থেকে অর্জিত মুনাফা বা ক্ষতির অংশও আমানতকারী বহন করেন না। অন্যদিকে, সঞ্চয়ী ও মেয়াদি আমানত সাধারণত Mudaraba (মুদারাবা) নীতিতে পরিচালিত হয়, যেখানে ব্যাংক ও আমানতকারীর মধ্যে পূর্বনির্ধারিত অনুপাতে মুনাফা বণ্টন করা হয়। সুতরাং, চলতি আমানত সংগ্রহের শরিয়াহভিত্তিক নীতি হলো Al-Wadiah।\nতথ্যসূত্র: বাংলাদেশ ব্যাংক, Prudential Regulation for Banks: Selected Issues, April 2024।","topic":"Islamic Banking"},{"id":"so070","n":70,"section":"banking","q":"Which of the following best describes the RTGS system?","options":{"A":"Batch processing of low-value transactions","B":"Real-time settlement of individual transactions on a gross basis","C":"Settlement of transactions only at the end of each month","D":"Processing of cheque images"},"answer":"B","explain":"RTGS-এর পূর্ণরূপ হলো Real Time Gross Settlement। এটি একটি ইলেকট্রনিক আন্তঃব্যাংক অর্থ স্থানান্তর ও নিষ্পত্তি ব্যবস্থা, যেখানে প্রতিটি লেনদেন আলাদাভাবে এবং তাৎক্ষণিকভাবে নিষ্পত্তি করা হয়। এখানে Real Time বলতে কোনো অপেক্ষা ছাড়াই লেনদেন নিষ্পত্তি হওয়া এবং Gross Settlement বলতে অন্য কোনো লেনদেনের সঙ্গে সমন্বয় বা নেটিং না করে প্রতিটি লেনদেন পৃথকভাবে নিষ্পত্তি করাকে বোঝায়। বাংলাদেশ ব্যাংক ২৯ অক্টোবর ২০১৫ তারিখে BD-RTGS চালু করে। বর্তমানে সাধারণ স্থানীয় মুদ্রার গ্রাহক-পর্যায়ের লেনদেনের সর্বনিম্ন সীমা ১,০০,০০০ টাকা, তবে সরকারি ও বৈদেশিক মুদ্রার লেনদেনে এ সীমা প্রযোজ্য নয়।\nঅন্যদিকে, BEFTN ব্যাচভিত্তিক ইলেকট্রনিক অর্থ স্থানান্তর এবং BACPS চেকের ছবি ও তথ্য ব্যবহার করে চেক নিষ্পত্তি করে।\nতথ্যসূত্র: বাংলাদেশ ব্যাংক, Bangladesh Real Time Gross Settlement (BD-RTGS) System Rules, PSD Circular No. 01, 19 January 2025।","topic":"Payment Systems"},{"id":"so071","n":71,"section":"analytical","q":"What comes next in the series: 3, 7, 15, 31, 63, ...?","options":{"A":"126","B":"127","C":"128","D":"129"},"answer":"B","explain":"ধারাটির প্রতিটি সংখ্যা আগের সংখ্যার দ্বিগুণের সঙ্গে ১ যোগ করে নির্ণয় করা হয়েছে। ৩ × ২ + ১ = ৭ ৭ × ২ + ১ = ১৫ ১৫ × ২ + ১ = ৩১ ৩১ × ২ + ১ = ৬৩\nসুতরাং, পরবর্তী সংখ্যা = ৬৩ × ২ + ১ = ১২৭।\nঅতএব, সঠিক উত্তর B. 127","topic":"Series"},{"id":"so072","n":72,"section":"analytical","q":"Which letter comes next in the series: A, C, F, J, O, ...?","options":{"A":"R","B":"S","C":"T","D":"U"},"answer":"D","explain":"এখানে ইংরেজি বর্ণগুলোর মধ্যবর্তী ব্যবধান ক্রমান্বয়ে ১ করে বৃদ্ধি পেয়েছে। অর্থাৎ, A থেকে C = ২ ঘর, C থেকে F = ৩ ঘর, F থেকে J = ৪ ঘর এবং J থেকে O = ৫ ঘর। সুতরাং পরবর্তী ব্যবধান হবে ৬ ঘর। O-এর পর ৬ ঘর এগোলে U পাওয়া যায়। অতএব, পরবর্তী বর্ণটি হলো U।","topic":"Series"},{"id":"so073","n":73,"section":"analytical","q":"Statements: All doctors are graduates. Some graduates are teachers. Conclusions: (I) Some doctors are teachers. (II) Some teachers are graduates. Which of the following logically follows?","options":{"A":"Only conclusion II follows","B":"Only conclusion I follows","C":"Both conclusions follow","D":"Neither conclusion follows"},"answer":"A","explain":"প্রদত্ত বিবৃতি অনুযায়ী, সব চিকিৎসকই স্নাতক এবং কিছু স্নাতক শিক্ষক। কিন্তু ওই শিক্ষকরা চিকিৎসক কি না, তা নিশ্চিতভাবে বলা যায় না। তাই সিদ্ধান্ত I (কিছু চিকিৎসক শিক্ষক) অনুসরণ করে না। অন্যদিকে, কিছু স্নাতক শিক্ষক হলে একইভাবে কিছু শিক্ষকও স্নাতক এটি যৌক্তিকভাবে অনুসরণ করে। সুতরাং শুধু সিদ্ধান্ত II অনুসরণ করে।","topic":"Syllogism"},{"id":"so074","n":74,"section":"analytical","q":"Statements: No cat is a dog. Some dogs are animals. Conclusions: (I) Some animals are not cats. (II) No animal is a cat. Which of the following logically follows?","options":{"A":"Only conclusion II follows","B":"Both conclusions follow.","C":"Only conclusion I follows","D":"Neither conclusion follows"},"answer":"C","explain":"দত্ত বিবৃতি অনুযায়ী, কোনো বিড়ালু কুকুর নয় এবং কিছু কুকুর প্রাণী। অর্থাৎ, যেসবু কুকুর প্রাণী, তারা কোনোভাবেই বিড়াল হতে পারে না। তাই কিছু প্রাণী বিড়াল নয় সিদ্ধান্ত I যৌক্তিকভাবে অনুসরণ করে। কিন্তু সব প্রাণীই বিড়াল নয় এমন কোনো তথ্য বিবৃতিতে দেওয়া হয়নি। তাই সিদ্ধান্ত II অনুসরণ করে না। সুতরাং শুধু সিদ্ধান্ত I অনুসরণ করে।","topic":"Syllogism"},{"id":"so075","n":75,"section":"analytical","q":"A man walks 10 km north, turns right and walks 6 km, then turns right again and walks 10 km. How far is he from his starting point, and in which direction?","options":{"A":"6 km east","B":"6 km west","C":"10 km south","D":"16 km north-east"},"answer":"A","explain":"ব্যক্তিটি প্রথমে উত্তর দিকে ১০ কিলোমিটার হাঁটলেন। এরপর ডান
