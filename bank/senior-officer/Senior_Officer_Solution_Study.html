 দিকে ঘুরে পূর্ব দিকে ৬ কিলোমিটার এবং পুনরায় ডান দিকে ঘুরে দক্ষিণ দিকে ১০ কিলোমিটার হাঁটলেন। ফলে উত্তর ও দক্ষিণ দিকে অতিক্রান্ত ১০ কিলোমিটার করে পথ পরস্পরকে বাতিল করে দেয়। অবশিষ্ট থাকে পূর্ব দিকে ৬ কিলোমিটার পথ। অতএব, তিনি শুরুর স্থান থেকে পূর্ব দিকে ৬ কিলোমিটার দূরে অবস্থান করবেন।","topic":"Direction Sense"},{"id":"so076","n":76,"section":"analytical","q":"In a certain code, LOGIC is written as MQJMH. How would MIND be written in the same code?","options":{"A":"NJQH","B":"NKPH","C":"QKQH","D":"NKQH"},"answer":"D","explain":"এখানে প্রতিটি ইংরেজি বর্ণের ক্ষেত্রে ধারাবাহিকভাবে ১, ২, ৩, ৪ ও ৫ ঘর করে সামনে এগিয়ে সংকেত তৈরি করা হয়েছে। LOGIC = MQJMH L + ১ = M O + ২ = Q G + ৩ = J I + ৪ = M C + ৫ = H এই নিয়মে MIND-এর ক্ষেত্রে - M + ১ = N I + ২ = K N + ৩ = Q D + ৪ = H\nসুতরাং, MIND-এর সংকেত হবে NKQH।","topic":"Coding-Decoding"},{"id":"so077","n":77,"section":"analytical","q":"Among five friends, Tania is taller than Rifa but shorter than Mitu. Sabbir is taller than Mitu but shorter than Nabil. Who is the second tallest?","options":{"A":"Mitu","B":"Sabbir","C":"Nabil","D":"Tania"},"answer":"B","explain":"প্রদত্ত তথ্য অনুযায়ী, তানিয়া রিনার চেয়ে লম্বা, কিন্তু মিতুর চেয়ে খাটো। আবার সাব্বির মিতুর চেয়ে লম্বা, কিন্তু নাবিলের চেয়ে খাটো। তাই লম্বা থেকে খাটো ক্রমানুসারে সাজালে পাওয়া যায়- নাবিল > সাব্বির > মিতু > তানিয়া > রিনা। অতএব, দ্বিতীয় সর্বোচ্চ উচ্চতার অধিকারী হলেন সাব্বির।","topic":"Ranking & Ordering"},{"id":"so078","n":78,"section":"analytical","q":"In a group of 100 people, 60 like tea, 45 like coffee, and 15 like neither. How many people like both tea and coffee?","options":{"A":"20","B":"25","C":"30","D":"35"},"answer":"A","explain":"মোট ১০০ জন মানুষের মধ্যে ১৫ জন চা ও কফি কোনোটিই পছন্দ করেন না। সুতরাং অন্তত একটি পানীয় পছন্দ করেন এমন মানুষের সংখ্যা = ১০০ − ১৫ = ৮৫ জন। এখন, উভয় পানীয় পছন্দ করেন এমন মানুষের সংখ্যা নির্ণয়ের সূত্র - উভয় পানীয় পছন্দকারী = চা পছন্দকারী + কফি পছন্দকারী − অন্তত একটি পছন্দকারী।\n= ৬০ + ৪৫ − ৮৫\n= ২০ জন।\nঅতএব, ২০ জন মানুষ চা ও কফি উভয়ই পছন্দ করেন।","topic":"Sets & Venn Diagram"},{"id":"so079","n":79,"section":"analytical","q":"A company's annual sales (in thousand units) were 40 in 2021, 50 in 2022, 45 in 2023, and 63 in 2024. What was the percentage increase in sales from 2023 to 2024?","options":{"A":"18%","B":"28.6%","C":"40%","D":"45%"},"answer":"C","explain":"২০২৩ সালে কোম্পানিটির বার্ষিক বিক্রয় ছিল ৪৫ হাজার ইউনিট এবং ২০২৪ সালে তা বেড়ে ৬৩ হাজার ইউনিটে দাঁড়ায়। অর্থাৎ, বিক্রয় বৃদ্ধি পেয়েছে = ৬৩ − ৪৫ = ১৮ হাজার ইউনিট। শতকরা বৃদ্ধির হার নির্ণয়ের সূত্র - শতকরা বৃদ্ধির হার = (বৃদ্ধির পরিমাণ ÷ প্রাথমিক পরিমাণ) × ১০০\n= (১৮ ÷ ৪৫) × ১০০\n= ৪০%।\nঅতএব, ২০২৩ থেকে ২০২৪ সালে কোম্পানিটির বিক্রয় ৪০% বৃদ্ধি পেয়েছে।","topic":"Data Interpretation"},{"id":"so080","n":80,"section":"analytical","q":"Statement I: 2x + y = 10. Statement II: y = 4. To find the value of x, which of the following is correct?","options":{"A":"Statements I and II together are sufficient, but neither alone is sufficient.","B":"Statement I alone is sufficient.","C":"Statement II alone is sufficient.","D":"Statements I and II together are not sufficient."},"answer":"A","explain":"x-এর মান নির্ণয়ের জন্য দুটি বিবৃতির প্রয়োজন।\nবিবৃতি I: 2x + y = 10। এখানে x ও y দুটি অজানা রাশি থাকায় শুধু এই সমীকরণ থেকে x-এর নির্দিষ্ট মান নির্ণয় করা সম্ভব নয়। বিবৃতি II: y = 4। এখানে শুধু y-এর মান দেওয়া আছে। তাই এককভাবে এই বিবৃতি থেকেও x-এর মান নির্ণয় করা সম্ভব নয়। কিন্তু উভয় বিবৃতি একত্রে ব্যবহার করলে- 2x + y = 10\nবা, 2x + 4 = 10\nবা, 2x = 10 − 4\nবা, 2x = 6\nসুতরাং, x = ৩।\nঅতএব, দুটি বিবৃতি একত্রে যথেষ্ট হলেও কোনো একটি বিবৃতি এককভাবে যথেষ্ট নয়। তাই সঠিক উত্তর A।","topic":"Data Sufficiency"},{"id":"so081","n":81,"section":"analytical","q":"A manager argues: \"We should move all staff to remote work, because it will cut our office rental costs.\" Which of the following is an assumption underlying this argument?","options":{"A":"Most employees prefer working from home.","B":"Competing firms have already adopted remote work.","C":"Remote work will not create costs or productivity losses large enough to cancel out the rent savings.","D":"Office rent is the company's largest single expense."},"answer":"C","explain":"ব্যবস্থাপক যুক্তি দিয়েছেন যে, সব কর্মীকে বাসা থেকে কাজ করার সুযোগ দিলে অফিস ভাড়ার খরচ কমবে। এই যুক্তির অন্তর্নিহিত অনুমান হলো, দূরবর্তী কাজের কারণে অতিরিক্ত কোনো ব্যয় বা উৎপাদনশীলতার ঘাটতি সৃষ্টি হবে না, যা অফিস ভাড়া সাশ্রয়ের সুবিধাকে পুরোপুরি নষ্ট করে দিতে পারে। কারণ, বাসা থেকে কাজের ফলে যদি অতিরিক্ত ব্যয় বা উৎপাদনশীলতার ক্ষতি ভাড়া সাশ্রয়ের সমান বা তার চেয়ে বেশি হয়, তাহলে এ সিদ্ধান্ত লাভজনক হবে না। অতএব, সঠিক উত্তর C।","topic":"Critical Reasoning"},{"id":"so082","n":82,"section":"analytical","q":"A city council argues that building a new flyover will ease traffic congestion in the city center. Which of the following, if true, most weakens this argument?","options":{"A":"The flyover will take about two years to build.","B":"The flyover will be built with locally sourced materials.","C":"A majority of residents support the project.","D":"In comparable cities, new flyovers attracted additional vehicles and congestion returned within a year."},"answer":"D","explain":"নগর কর্তৃপক্ষের দাবি, নতুন ফ্লাইওভার নির্মাণের ফলে শহরের কেন্দ্রস্থলের যানজট কমবে। কিন্তু একই ধরনের অন্যান্য শহরে দেখা গেছে, নতুন ফ্লাইওভার নির্মাণের পর অতিরিক্ত যানবাহন চলাচল শুরু হয় এবং এক বছরের মধ্যেই আবার যানজট ফিরে আসে। এ তথ্য ফ্লাইওভার নির্মাণের মাধ্যমে যানজট কমানোর যুক্তিকে সবচেয়ে বেশি দুর্বল করে। অন্যদিকে, নির্মাণে কত সময় লাগবে, স্থানীয় উপকরণ ব্যবহার হবে কি না কিংবা অধিকাংশ বাসিন্দার সমর্থন রয়েছে কি না এসব তথ্য যানজট কমার কার্যকারিতা প্রমাণ করে না।\nঅতএব, সঠিক উত্তর D।","topic":"Critical Reasoning"},{"id":"so083","n":83,"section":"analytical","q":"In a survey of 500 employees at a firm, 80% said flexible working hours improve their job satisfaction. After the firm introduced flexible hours, its staff turnover fell by 15% over the next year. Which conclusion is best supported by this information?","options":{"A":"Flexible hours were the only reason turnover fell.","B":"Flexible hours may have contributed to the fall in turnover.","C":"Every employee became more satisfied with their job.","D":"The firm's productivity rose by 15%."},"answer":"B","explain":"একটি প্রতিষ্ঠানের ৫০০ কর্মীর উপর পরিচালিত জরিপে ৮০ শতাংশ কর্মী জানিয়েছেন, নমনীয় কর্মঘণ্টা তাদের চাকরির সন্তুষ্টি বৃদ্ধি করে। পরবর্তী সময়ে প্রতিষ্ঠানটি নমনীয় কর্মঘণ্টা চালু করার পর এক বছরে কর্মী পদত্যাগের হার ১৫ শতাংশ কমে যায়। এ তথ্য থেকে ধারণা করা যায়, নমনীয় কর্মঘণ্টা কর্মীদের সন্তুষ্টি বাড়িয়ে পদত্যাগের হার কমাতে ভূমিকা রাখতে পারে। তবে শুধু এ তথ্যের ভিত্তিতে বলা যায় না যে, পদত্যাগের হার কমার একমাত্র কারণ নমনীয় কর্মঘণ্টা কিংবা প্রতিষ্ঠানের উৎপাদনশীলতা ১৫ শতাংশ বেড়েছে।\nঅতএব, নমনীয় কর্মঘণ্টা কর্মী পদত্যাগের হার কমাতে ভূমিকা রাখতে পারে এ সিদ্ধান্তটিই সবচেয়ে যৌক্তিক।","topic":"Critical Reasoning"},{"id":"so084","n":84,"section":"analytical","q":"If the day after the day after tomorrow is Sunday, what day was it the day before yesterday?","options":{"A":"Sunday","B":"Tuesday","C":"Wednesday","D":"Monday"},"answer":"B","explain":"প্রশ্নে বলা হয়েছে, আগামীকালের পরের দিন রবিবার। অর্থাৎ, আজ থেকে তিন দিন পর রবিবার। তাহলে, আজ = বৃহস্পতিবার। আগামীকাল = শুক্রবার। আগামীকালের পরের দিন = শনিবার। তার পরের দিন = রবিবার।\nসুতরাং, আজ বৃহস্পতিবার হলে গত পরশু ছিল মঙ্গলবার। অতএব, সঠিক উত্তর B. Tuesday (মঙ্গলবার)।","topic":"Calendar & Days"},{"id":"so085","n":85,"section":"analytical","q":"Which of the following numbers does not belong with the other three?","options":{"A":"13","B":"17","C":"19","D":"21"},"answer":"D","explain":"এখানে ১৩, ১৭ ও ১৯ এই তিনটি সংখ্যা মৌলিক সংখ্যা। কারণ, এদের ১ ও ওই সংখ্যা ছাড়া অন্য কোনো ধনাত্মক উৎপাদক নেই। কিন্তু ২১ একটি যৌগিক সংখ্যা, কারণ ২১ = ৩ × ৭। অর্থাৎ, ২১ সংখ্যাটি ১ ও নিজ সংখ্যা ছাড়াও ৩ ও ৭ দ্বারা বিভাজ্য। তাই অন্য তিনটি সংখ্যার তুলনায় ২১ ব্যতিক্রম। অতএব, সঠিক উত্তর D।","topic":"Odd One Out"},{"id":"so086","n":86,"section":"analytical","q":"A boy, looking at a person in a photograph, says, \"He is the son of my paternal grandfather's only daughter.\" How is the person in the photograph related to the boy?","options":{"A":"He is his cousin (specifically, his paternal aunt's son)","B":"He is his brother","C":"He is not a relative of him","D":"He is his uncle"},"answer":"A","explain":"ছেলেটির পিতামহের একমাত্র কন্যা হলেন ছেলেটিরু ফুফ। আরু ফুফর ছেলে হলো ছেলেটিরু ফফাতো ভাই। সুতরাং, ছবির ব্যক্তিটি ছেলেটিরু ফফাতো ভাই। অতএব, সঠিক উত্তর A।","topic":"Blood Relation"},{"id":"so087","n":87,"section":"analytical","q":"When a wall clock shows the time as 6:30, what is the angle (in degrees) between the hour hand and the minute hand?","options":{"A":"0°","B":"25°","C":"15°","D":"30°"},"answer":"C","explain":"ঘড়িতে ৬টা ৩০ মিনিটের সময় ঘণ্টার কাঁটা ও মিনিটের কাঁটার মধ্যবর্তী কোণ নির্ণয় করতে হবে। আমরা জানি, মিনিটের কাঁটার প্রতি মিনিটে অতিক্রান্ত কোণ = ৬°। ঘণ্টার কাঁটার প্রতি ঘণ্টায় অতিক্রান্ত কোণ = ৩০°। ৩০ মিনিটে ঘণ্টার কাঁটার অতিক্রান্ত কোণ = ৩০ × ০.৫° = ১৫°। ঘণ্টার কাঁটার অবস্থান = (৬ × ৩০°) + ১৫° = ১৯৫°। মিনিটের কাঁটার অবস্থান = ৩০ × ৬° = ১৮০°।\nসুতরাং, দুই কাঁটার মধ্যবর্তী কোণ = ১৯৫° − ১৮০° = ১৫°।\nঅতএব, সঠিক উত্তর C. 15°","topic":"Clock"},{"id":"so088","n":88,"section":"analytical","q":"A 30% solution and a 50% solution are mixed to produce 40 liters of a 42% solution. How many liters of the 50% solution are required?","options":{"A":"20","B":"24","C":"28","D":"32"},"answer":"B","explain":"ঘড়িতে ৬টা ৩০ মিনিটের সময় ঘণ্টার কাঁটা ও মিনিটের কাঁটার মধ্যবর্তী কোণ নির্ণয় করতে হবে। আমরা জানি, মিনিটের কাঁটার প্রতি মিনিটে অতিক্রান্ত কোণ = ৬°। ঘণ্টার কাঁটার প্রতি ঘণ্টায় অতিক্রান্ত কোণ = ৩০°। ৩০ মিনিটে ঘণ্টার কাঁটার অতিক্রান্ত কোণ = ৩০ × ০.৫° = ১৫°। ঘণ্টার কাঁটার অবস্থান = (৬ × ৩০°) + ১৫° = ১৯৫°। মিনিটের কাঁটার অবস্থান = ৩০ × ৬° = ১৮০°।\nসুতরাং, দুই কাঁটার মধ্যবর্তী কোণ = ১৯৫° − ১৮০° = ১৫°।\nঅতএব, সঠিক উত্তর C. 15°","topic":"Mixture & Alligation"},{"id":"so089","n":89,"section":"analytical","q":"A committee of 4 people is to be selected from 5 men and 6 women. How many different committees can be formed if at least two women must be included?","options":{"A":"220","B":"235","C":"250","D":"265"},"answer":"D","explain":"একটি কমিটিতে ৫ জন পুরুষ ও ৬ জন নারী থেকে মোট ৪ জন সদস্য নির্বাচন করতে হবে। শর্ত অনুযায়ী, কমিটিতে অন্তত ২ জন নারী থাকতে হবে। অর্থাৎ, কমিটিতে ২ জন, ৩ জন অথবা ৪ জন নারী থাকতে পারবেন। এখন পৃথকভাবে সম্ভাব্য কমিটির সংখ্যা নির্ণয় করি। ২ জন নারী ও ২ জন পুরুষ:\n= ⁶C₂ × ⁵C₂\n= ১৫ × ১০\n= ১৫০টি।\n৩ জন নারী ও ১ জন পুরুষ:\n= ⁶C₃ × ⁵C₁\n= ২০ × ৫\n= ১০০টি।\n৪ জন নারী ও ০ জন পুরুষ:\n= ⁶C₄ × ⁵C₀\n= ১৫ × ১\n= ১৫টি।\nসুতরাং, মোট কমিটির সংখ্যা = ১৫০ + ১০০ + ১৫ = ২৬৫টি।\nঅতএব, সঠিক উত্তর D. 265।","topic":"Permutation & Combination"},{"id":"so090","n":90,"section":"analytical","q":"In a survey of 180 customers, 90 use mobile banking, 80 use internet banking, and 70 use card services. Of these, 40 use both mobile and internet banking, 35 use both mobile banking and card services, 30 use both internet banking and card services, and 20 use all three. How many customers use none of these services?","options":{"A":"15","B":"20","C":"25","D":"30"},"answer":"C","explain":"১৮০ জন গ্রাহকের মধ্যে ৯০ জন মোবাইল ব্যাংকিং, ৮০ জন ইন্টারনেট ব্যাংকিং এবং ৭০ জন কার্ড সেবা ব্যবহার করেন। আবার, ৪০ জন মোবাইল ও ইন্টারনেট ব্যাংকিং, ৩৫ জন মোবাইল ব্যাংকিং ও কার্ড সেবা এবং ৩০ জন ইন্টারনেট ব্যাংকিং ও কার্ড সেবা ব্যবহার করেন। তিনটি সেবাই ব্যবহার করেন ২০ জন। অন্তত একটি সেবা ব্যবহারকারীর সংখ্যা নির্ণয়ের জন্য অন্তুর্ভক্তি-বর্জন সূত্র প্রয়োগ করি।\nসূত্র:\nn(A ∪ B ∪ C) = n(A) + n(B) + n(C) − n(A ∩ B) − n(A ∩ C) − n(B ∩ C) + n(A ∩ B ∩ C)\nপ্রশ্নমতে,\nঅন্তত একটি সেবা ব্যবহারকারীর সংখ্যা\n= ৯০ + ৮০ + ৭০ − ৪০ − ৩৫ − ৩০ + ২০\n= ২৪০ − ১০৫ + ২০\n= ১৫৫ জন।\nসুতরাং, কোনো সেবাই ব্যবহার করেন না এমন গ্রাহকের সংখ্যা\n= মোট গ্রাহক − অন্তত একটি সেবা ব্যবহারকারী\n= ১৮০ − ১৫৫\n= ২৫ জন।\nঅতএব, সঠিক উত্তর C. 25","topic":"Sets & Venn Diagram"},{"id":"so091","n":91,"section":"ict","q":"Which number system is primarily used internally by digital computers?","options":{"A":"Decimal","B":"Octal","C":"Binary","D":"Hexadecimal"},"answer":"C","explain":": ডিজিটাল কম্পিউটারের অভ্যন্তরীণ কার্যক্রমে প্রধানত বাইনারি সংখ্যা পদ্ধতি ব্যবহৃত হয়। বাইনারি সংখ্যা পদ্ধতির ভিত্তি ২ এবং এতে মাত্র দুটি অঙ্ক ০ ও ১ ব্যবহৃত হয়। কম্পিউটারের ইলেকট্রনিক সার্কিটে বিদ্যুতের উপস্থিতি ও অনুপস্থিতিকে যথাক্রমে ১ ও ০ দিয়ে প্রকাশ করা হয়। কম্পিউটারের সব ধরনের তথ্য, নির্দেশনা ও হিসাব-নিকাশ শেষ পর্যন্ত বাইনারি সংকেতে রূপান্তরিত হয়ে প্রক্রিয়াকৃত হয়।\nমনে রাখুন:\n• Binary: ভিত্তি ২, অঙ্ক ০ ও ১।\n• Octal: ভিত্তি ৮, অঙ্ক ০ থেকে ৭।\n• Decimal: ভিত্তি ১০, অঙ্ক ০ থেকে ৯।\n• Hexadecimal: ভিত্তি ১৬, অঙ্ক ০ থেকে ৯ এবং A থেকে F।","topic":"Number System"},{"id":"so092","n":92,"section":"ict","q":"What is the decimal equivalent of the binary number 1010?","options":{"A":"8","B":"10","C":"12","D":"14"},"answer":"B","explain":"বাইনারি সংখ্যা পদ্ধতির ভিত্তি ২। কোনো বাইনারি সংখ্যাকে দশমিক সংখ্যায় রূপান্তর করতে ডান দিক থেকে প্রতিটি অঙ্ককে ২- এর ধারাবাহিক ঘাত দিয়ে গুণ করে যোগ করতে হয়। প্রদত্ত বাইনারি সংখ্যা = (1010)₂\n= ১ × ২³ + ০ × ২² + ১ × ২¹ + ০ × ২⁰\n= ১ × ৮ + ০ × ৪ + ১ × ২ + ০ × ১\n= ৮ + ০ + ২ + ০\n= ১০\nঅতএব, (1010)₂-এর দশমিক মান ১০","topic":"Number System"},{"id":"so093","n":93,"section":"ict","q":"Which protocol is used to securely transfer web pages between a browser and a web server?","options":{"A":"FTP","B":"SMTP","C":"HTTPS","D":"POP3"},"answer":"C","explain":"HTTPS-এর পূর্ণরূপ হলো Hypertext Transfer Protocol Secure। এটি HTTP-এর নিরাপদ সংস্করণ। HTTPS প্রোটোকল SSL/TLS প্রযুক্তির মাধ্যমে ব্রাউজার ও ওয়েব সার্ভারের মধ্যে আদান-প্রদান করা তথ্য এনক্রিপ্ট করে। ফলে ব্যবহারকারীর পাসওয়াড্,র ব্যক্তিগত তথ্য, ব্যাংকিং তথ্য ও অনলাইন লেনদেনের তথ্য তুলনামূলকভাবে নিরাপদ থাকে। কোনো ওয়েবসাইটের ঠিকানার শুরুতে\nhttps:// থাকলে সাধারণত বোঝা যায় যে ওয়েবসাইটটি HTTPS সংযোগ ব্যবহার করছে।\nগুরুত্বপূর্ণ প্রোটোকল:\n• HTTP: ওয়েব পেজ আদান-প্রদানের প্রোটোকল।\n• HTTPS: নিরাপদ ওয়েব যোগাযোগের প্রোটোকল।\n• FTP: ফাইল আদান-প্রদানের প্রোটোকল।\n• SMTP: ই-মেইল পাঠানোর প্রোটোকল।\n• POP3: ই-মেইল গ্রহণ বা ডাউনলোডের প্রোটোকল।\n• IMAP: সার্ভারে সংরক্ষিত ই-মেইল বিভিন্ন ডিভাইস থেকে ব্যবহারের প্রোটোকল।","topic":"Networking & Protocols"},{"id":"so094","n":94,"section":"ict","q":"Which of the following provides an additional layer of security beyond a password?","options":{"A":"Browser Cache","B":"File Compression","C":"Two-Factor Authentication","D":"Disk Defragmentation"},"answer":"C","explain":"Two-Factor Authentication বা 2FA হলো একটি অতিরিক্ত নিরাপত্তাব্যবস্থা, যেখানে কোনো অ্যাকাউন্টে প্রবেশের জন্য পাসওয়ার্ডের পাশাপাশি দ্বিতীয় একটি যাচাইকরণ পদ্ধতি ব্যবহার করতে হয়। দ্বিতীয় ধাপ হিসেবে মোবাইলে পাঠানো OTP, Authenticator অ্যাপের কোড, নিরাপত্তা কী অথবা বায়োমেট্রিক যাচাইকরণ ব্যবহার করা যেতে পারে। ফলে কোনো ব্যক্তি পাসওয়ার্ড জেনে গেলেও দ্বিতীয় ধাপের যাচাইকরণ ছাড়া সহজে অ্যাকাউন্টে প্রবেশ করতে পারে না।উদাহরণ: ফেসবুক বা ই-মেইল অ্যাকাউন্টে পাসওয়ার্ড দেওয়ার পর মোবাইলে আসা OTP প্রবেশ করানো।\nমনে রাখুন:\n• 2FA: দুটি ধাপে পরিচয় যাচাই।\n• MFA: একাধিক ধাপে পরিচয় যাচাই।\n• OTP: One-Time Password, একবার ব্যবহারের উপযোগী পাসওয়ার্ড।","topic":"Cyber Security"},{"id":"so095","n":95,"section":"ict","q":"Which of the following is an example of cloud computing?","options":{"A":"Using a calculator offline","B":"Storing files in Google Drive","C":"Printing a document","D":"Installing additional RAM"},"answer":"B","explain":"ক্লাউড কম্পিউটিং হলো ইন্টারনেটের মাধ্যমে দূরবর্তী সার্ভারের কম্পিউটিং সম্পদ, সফটওয়্যার, স্টোরেজ ও বিভিন্ন সেবা ব্যবহার করার পদ্ধতি। Google Drive-এ ফাইল সংরক্ষণ করলে তা শুধু নিজের কম্পিউটারে নয়, বরং অনলাইন সার্ভারে সংরক্ষিত থাকে। ফলে ইন্টারনেট সংযোগের মাধ্যমে যেকোনো স্থান থেকে বিভিন্ন ডিভাইস ব্যবহার করে ফাইলগুলো দেখা, সম্পাদনা ও শেয়ার করা যায়। ক্লাউড কম্পিউটিংয়ের উদাহরণ:\n• Google Drive: অনলাইনে ফাইল সংরক্ষণ।\n• Dropbox: ক্লাউড স্টোরেজ সেবা।\n• Microsoft OneDrive: অনলাইন ফাইল সংরক্ষণ ও শেয়ারিং।\n• iCloud: অ্যাপল ডিভাইসের ক্লাউড সেবা।\nক্লাউড কম্পিউটিংয়ের প্রধান সেবা:\n• IaaS: Infrastructure as a Service।\n• PaaS: Platform as a Service।\n• SaaS: Software as a Service।","topic":"Cloud & Virtualization"},{"id":"so096","n":96,"section":"ict","q":"Which of the following best describes Machine Learning?","options":{"A":"A method of physically repairing computers","B":"A technique for increasing Internet bandwidth","C":"A process of manually entering data into databases","D":"A method enabling computers to learn patterns from data"},"answer":"D","explain":"Machine Learning (ML) হলো Artificial Intelligence (AI) বা কৃত্রিম বুদ্ধিমত্তার একটি গুরুত্বপূর্ণ শাখা। এ প্রযুক্তিতে কম্পিউটারকে বিপুল পরিমাণ ডেটা বিশ্লেষণ করে বিভিন্ন প্যাটার্ন, সম্পর্ক ও বৈশিষ্ট্য শনাক্ত করতে শেখানো হয়। এর মাধ্যমে কম্পিউটার পূর্বের তথ্য ও অভিজ্ঞতার ভিত্তিতে পূর্বাভাস দিতে এবং নির্দিষ্ট সিদ্ধান্ত গ্রহণে সক্ষম হয়। প্রতিটি কাজের জন্য আলাদাভাবে সব নিদের্শ না প্রোগ্রাম না করেও ডেটা থেকে শেখার সুযোগ তৈরি হয়।\nউদাহরণ:\n• ই-মেইলের স্প্যাম শনাক্তকরণ করা হয়।\n• অনলাইন কেনাকাটায় পণ্য সুপারিশ করা হয়।\n• মুখ ও ছবি শনাক্তকরণ করা হয়।\n• ব্যাংকিং খাতে জালিয়াতি শনাক্তকরণ করা হয়।\n• আবহাওয়ার পূর্বাভাস প্রদান করা।","topic":"AI & Machine Learning"},{"id":"so097","n":97,"section":"ict","q":"The speed of a processor is measured in ______.","options":{"A":"Hertz","B":"Byte","C":"Bit","D":"Pixel"},"answer":"A","explain":"প্রসেসরের ক্লক স্পিড বা ঘড়ির গতি হার্টজ (Hertz) এককে পরিমাপ করা হয়। এটি প্রতি সেকেন্ডে প্রসেসরের ক্লক সাইকেলের সংখ্যা নির্দেশ করে। আধুনিক প্রসেসরের গতি সাধারণত মেগাহার্টজ (MHz) ও গিগাহার্টজ (GHz) এককে প্রকাশ করা হয়। ১গিগাহার্টজ সমান ১০০ কোটি হার্টজ। তবে শুধু ক্লক স্পিড দিয়ে প্রসেসরের সামগ্রিক কর্মক্ষমতা নির্ধারণ করা যায় না, কোরের সংখ্যা, আর্কিটেকচার ও ক্যাশ মেমোরিও গুরুত্বপূর্ণ।\nমনে রাখুন:\n• Hertz (Hz): কম্পাঙ্ক ও প্রসেসরের ক্লক স্পিডের একক।\n• Byte: ডেটার পরিমাণ পরিমাপের একক।\n• Bit: কম্পিউটার ডেটার ক্ষুদ্রতম একক।\n• Pixel: ডিজিটাল ছবির ক্ষুদ্রতম উপাদান।\n• ১ Byte = ৮ Bit।","topic":"Hardware"},{"id":"so098","n":98,"section":"ict","q":"Which of the following is an example of system software?","options":{"A":"MS Word","B":"Windows 11","C":"Adobe Photoshop","D":"Google Chrome"},"answer":"B","explain":"সিস্টেম সফটওয়্যার হলো এমন সফটওয়্যার, যা কম্পিউটারের হার্ডওয়্যার পরিচালনা করে এবং অন্যান্য অ্যাপ্লিকেশন সফটওয়্যার চালানোর পরিবেশ তৈরি করে। Windows 11 একটি অপারেটিং সিস্টেম, যা কম্পিউটারের প্রসেসর, মেমোরি, ফাইল, ইনপুট-আউটপুট ডিভাইসসহ বিভিন্ন সম্পদ পরিচালনা করে। এটি ব্যবহারকারী ও কম্পিউটারের হার্ডওয়্যারের মধ্যে সমন্বয় সাধন করে। সিস্টেম সফটওয়্যারের উদাহরণ:\n• Windows 11\n• Linux\n• macOS\n• Device Driver\n• Utility Software\nঅ্যাপ্লিকেশন সফটওয়্যারের উদাহরণ:\n• MS Word: ডুকমেন্ট তৈরি।\n• MS Excel: হিসাব-নিকাশ ও স্প্রেডশিট তৈরি।\n• Adobe Photoshop: ছবি সম্পাদনা।\n• Google Chrome: ওয়েব ব্রাউজিং।","topic":"Software"},{"id":"so099","n":99,"section":"ict","q":"Which protocol is used for sending emails?","options":{"A":"HTTP","B":"FTP","C":"SMTP","D":"POP3"},"answer":"C","explain":"SMTP-এর পূর্ণরূপ হলো Simple Mail Transfer Protocol। এটি ই-মেইল পাঠানো এবং মেইল সার্ভারগুলোর মধ্যে ই- মেইল স্থানান্তরের জন্য ব্যবহৃত হয়। একজন ব্যবহারকারী ই-মেইল পাঠালে SMTP প্রোটোকল সেই বার্তা প্রেরকের মেইল সার্ভার থেকে প্রাপকের মেইল সার্ভারে পেঁৗছে দিতে কাজ করে। অন্যদিকে, POP3 ও IMAP সাধারণত মেইল সার্ভার থেকে ই-মেইল গ্রহণ বা অ্যাক্সেস করার কাজে ব্যবহৃত হয়।\nগুরুত্বপূর্ণ প্রোটোকল:\n•  SMTP: ই-মেইল পাঠানোর প্রোটোকল।\n•  POP3: সার্ভার থেকে ই-মেইল ডাউনলোড বা গ্রহণের প্রোটোকল।\n•  IMAP: সার্ভারে ই-মেইল রেখে বিভিন্ন ডিভাইস থেকে ব্যবহারের প্রোটোকল।\n•  HTTP: ওয়েব পেজ আদান-প্রদানের প্রোটোকল।\nFTP: ফাইল স্থানান্তরের প্রোটোকল।","topic":"Networking & Protocols"},{"id":"so100","n":100,"section":"ict","q":"Which technology allows multiple users to share one physical machine?","options":{"A":"Cloud Computing","B":"Blockchain","C":"Machine Learning","D":"Internet of Things"},"answer":"A","explain":"Cloud Computing বা ক্লাউড কম্পিউটিং হলো ইন্টারনেটের মাধ্যমে সার্ভার, স্টোরেজ, প্রসেসিং ক্ষমতা ও অন্যান্য কম্পিউটিং সম্পদ ব্যবহার করার একটি প্রযুক্তি। ক্লাউড কম্পিউটিংয়ে একটি শক্তিশালী ভৌত সার্ভারের সম্পদ ভার্চুয়ালাইজেশন প্রযুক্তির মাধ্যমে একাধিক ভার্চুয়াল মেশিন বা সেবায় ভাগ করে দেওয়া যায়। ফলে একাধিক ব্যবহারকারী একই ভৌত অবকাঠামোর কম্পিউটিং সম্পদ পৃথকভাবে ব্যবহার করতে পারেন। এতে সম্পদের সর্বোত্তম ব্যবহার, ব্যয় হ্রাস এবং প্রয়োজন অনুযায়ী সেবা সম্প্রসারণ করা সম্ভব হয়।\nউদাহরণ: একটি ক্লাউড সার্ভারে বিভিন্ন প্রতিষ্ঠানের ওয়েবসাইট, ডেটাবেজ ও অ্যাপ্লিকেশন পরিচালিত হতে পারে। ব্যবহারকারীরা ইন্টারনেটের মাধ্যমে নিজ নিজ সেবা গ্রহণ করেন।\nগুরুত্বপূর্ণ বিষয়:\n•  Cloud Computing: ইন্টারনেটের মাধ্যমে কম্পিউটিং সেবা গ্রহণ করা যায়।\n•  Virtualization: একটি ভৌত কম্পিউটার বা সার্ভারের সম্পদকে একাধিক ভার্চুয়াল পরিবেশে ভাগ করে ব্যবহার করা যায়।\n•  Blockchain: বিকেন্দ্রীভূত ও নিরাপদ ডিজিটাল লেজার প্রযুক্তি।\n•  Machine Learning: ডেটা থেকে শেখার প্রযুক্তি।\nInternet of Things (IoT): ইন্টারনেটের মাধ্যমে বিভিন্ন ডিভাইসের সংযোগ ও তথ্য আদান-প্রদান করা হয়।","topic":"Cloud & Virtualization"}]}</script>
<script type="text/x-study-script">
(function () {
'use strict';
const KEY = 'seniorofficer_study_v1';
const DATA = JSON.parse(document.getElementById('data-questions').textContent);
const QS = DATA.questions;
const QBY = Object.fromEntries(QS.map(q => [q.id, q]));
const SECS = DATA.sections;
const SECBY = Object.fromEntries(SECS.map(s => [s.id, s]));
const TOPICS = [...new Set(QS.map(q => q.topic))];
const LET = ['A', 'B', 'C', 'D'];
const DAY = 864e5;
const BOX_DAYS = [0, 0, 1, 3, 7, 15];
const $ = id => document.getElementById(id);
const V = () => $('view');
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BN = n => String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const pct = (a, b) => b ? Math.round(a * 1000 / b) / 10 : 0;
const fmtPct = v => BN(Number.isInteger(v) ? v : v.toFixed(1)) + '%';
const fmtNum = v => BN(Number.isInteger(v) ? v : (Math.round(v * 100) / 100).toString());
const fmtDate = t => new Date(t).toLocaleString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtTime = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const scored = q => !!q.answer;

// ---------- state ----------
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S.v = 1; S.people = S.people || {}; S.rec = S.rec || {}; S.draft = S.draft || {};
S.settings = Object.assign({ neg: 0.25, secPerQ: 36, shuffleQ: false }, S.settings || {});
if (S.active && !S.people[S.active]) S.active = null;

function rec(pid = S.active) {
  if (!pid) return null;
  const r = S.rec[pid] = S.rec[pid] || {};
  r.q = r.q || {}; r.read = r.read || {}; r.tests = r.tests || [];
  return r;
}
function aggregate() {
  // Combined record across all examinees, read by the dashboard's progress adapter.
  const out = {}, read = {};
  for (const pid of Object.keys(S.people)) {
    const r = rec(pid);
    for (const [id, row] of Object.entries(r.q)) {
      const o = out[id] = out[id] || { attempts: 0, correctCount: 0, wrongCount: 0 };
      o.attempts += row.attempts || 0; o.correctCount += row.correctCount || 0; o.wrongCount += row.wrongCount || 0;
      if (row.bookmarked) o.bookmarked = true;
      if (row.note) o.note = (o.note ? o.note + '\n' : '') + row.note;
      if (row.status === 'mastered') o.status = 'mastered'; else if (!o.status) o.status = row.attempts ? 'learning' : undefined;
      if (row.attempts && row.nextReview && (!o.nextReview || row.nextReview < o.nextReview)) o.nextReview = row.nextReview;
    }
    for (const id of Object.keys(r.read)) if (r.read[id]) read[id] = true;
  }
  S.questions = out; S.read = read;
}
function save() {
  aggregate();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert('সংরক্ষণ করা যায়নি: ' + e.message); }
}
function row(id, pid) { const r = rec(pid); return r.q[id] = r.q[id] || { attempts: 0, correctCount: 0, wrongCount: 0, box: 0 }; }
function recordAnswer(id, choice, source) {
  const q = QBY[id]; if (!scored(q) || !choice) return null;
  const r = row(id), ok = choice === q.answer;
  r.attempts++; ok ? r.correctCount++ : r.wrongCount++;
  r.last = choice; r.lastCorrect = ok; r.lastAt = Date.now(); r.src = source;
  r.box = ok ? Math.min(5, (r.box || 0) + 1) : 1;
  r.nextReview = new Date(Date.now() + BOX_DAYS[r.box] * DAY).toISOString();
  r.status = r.box >= 4 ? 'mastered' : 'learning';
  return ok;
}

// ---------- analytics ----------
function zoneStats(pid = S.active) {
  const r = rec(pid), sec = {}, top = {};
  for (const s of SECS) sec[s.id] = { c: 0, t: 0, seen: 0, n: 0 };
  for (const t of TOPICS) top[t] = { c: 0, t: 0, seen: 0, n: 0, sec: '' };
  for (const q of QS) {
    if (!scored(q)) continue;
    const x = r.q[q.id] || {};
    sec[q.section].n++; top[q.topic].n++; top[q.topic].sec = q.section;
    if (x.attempts) { sec[q.section].seen++; top[q.topic].seen++; }
    sec[q.section].c += x.correctCount || 0; sec[q.section].t += x.attempts || 0;
    top[q.topic].c += x.correctCount || 0; top[q.topic].t += x.attempts || 0;
  }
  return { sec, top };
}
function level(c, t) {
  if (t < 2) return { k: 'none', bn: 'অপর্যাপ্ত তথ্য', cls: '' };
  const p = c / t;
  if (p >= 0.75) return { k: 'strong', bn: 'শক্তিশালী', cls: 'ok' };
  if (p >= 0.5) return { k: 'mid', bn: 'মাঝারি', cls: 'mid' };
  return { k: 'weak', bn: 'দুর্বল', cls: 'bad' };
}
function personSummary(pid) {
  const r = rec(pid), tests = r.tests;
  const pcts = tests.map(t => t.pct);
  let a = 0, c = 0;
  for (const x of Object.values(r.q)) { a += x.attempts || 0; c += x.correctCount || 0; }
  return {
    tests: tests.length, best: pcts.length ? Math.max(...pcts) : null, avg: pcts.length ? pcts.reduce((x, y) => x + y, 0) / pcts.length : null,
    last: tests.length ? tests[tests.length - 1] : null, answers: a, correct: c, acc: pct(c, a),
    seen: Object.values(r.q).filter(x => x.attempts).length, read: Object.values(r.read).filter(Boolean).length,
    bookmarks: Object.values(r.q).filter(x => x.bookmarked).length,
    wrongNow: Object.entries(r.q).filter(([, x]) => x.attempts && !x.lastCorrect).length,
    due: Object.values(r.q).filter(x => x.attempts && x.nextReview && new Date(x.nextReview) <= new Date()).length
  };
}

// ---------- rendering helpers ----------
function expHTML(q, showAns = true) {
  const lines = String(q.explain || '').split('\n').filter(Boolean);
  const body = lines.map(l => {
    const cls = /^[-•]/.test(l) ? 'li' : /^(=|≈|∴|বা,)/.test(l) ? 'eq' : '';
    return `<p${cls ? ` class="${cls}"` : ''}>${esc(l)}</p>`;
  }).join('');
  const ans = showAns ? `<p class="ans">উত্তর: ${q.answer ? esc(q.answer + '. ' + q.options[q.answer]) : 'সঠিক উত্তর নেই'}</p>` : '';
  return `<div class="exp">${ans}${q.note ? `<div class="note">${esc(q.note)}</div>` : ''}${body}</div>`;
}
function optsHTML(q, { chosen, reveal, disabled, name } = {}) {
  return `<div class="opts">${LET.filter(k => q.options[k] != null).map(k => {
    let cls = 'opt';
    if (reveal) { if (k === q.answer) cls += ' right'; else if (k === chosen) cls += ' wrong'; }
    else if (k === chosen) cls += ' sel';
    return `<button class="${cls}" data-opt="${k}" ${disabled ? 'disabled' : ''} ${name ? `data-q="${name}"` : ''}><span class="k">${k}</span><span>${esc(q.options[k])}</span></button>`;
  }).join('')}</div>`;
}
const secName = id => SECBY[id] ? SECBY[id].bn : id;
function barHTML(p, cls = '') { return `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, p))}%"></i></div>`; }
function lineChart(points) {
  if (!points.length) return '<p class="muted">এখনো কোনো পরীক্ষা দেওয়া হয়নি।</p>';
  const W = 600, H = 180, P = 30, n = points.length;
  const x = i => P + (n === 1 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (n - 1));
  const y = v => H - P - (Math.max(0, v) / 100) * (H - 2 * P);
  const path = points.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const grid = [0, 25, 50, 75, 100].map(g => `<line x1="${P}" x2="${W - P}" y1="${y(g)}" y2="${y(g)}" stroke="var(--bd)" stroke-dasharray="3 3"/><text x="2" y="${y(g) + 4}">${g}%</text>`).join('');
  const dots = points.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--ac)"><title>অ্যাটেম্পট ${i + 1}: ${v}%</title></circle><text x="${x(i) - 4}" y="${H - 8}">${i + 1}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Score trend">${grid}<path d="${path}" fill="none" stroke="var(--ac)" stroke-width="2.5"/>${dots}</svg>`;
}

// ---------- navigation ----------
const TABS = [
  ['home', 'ড্যাশবোর্ড'], ['read', 'পড়ুন'], ['practice', 'অনুশীলন'], ['test', 'পরীক্ষা দিন'],
  ['history', 'অ্যাটেম্পট রেকর্ড'], ['zones', 'শক্তিশালী ও দুর্বল জোন'], ['review', 'রিভিশন'], ['people', 'পরীক্ষার্থী ও লিডারবোর্ড']
];
let cur = 'home', running = null; // running test session
function tabs() {
  $('tabs').innerHTML = TABS.map(([id, t]) => `<button class="tab" role="tab" data-tab="${id}" aria-selected="${id === cur}" ${!S.active && id !== 'people' && id !== 'home' ? 'disabled' : ''}>${t}</button>`).join('');
  $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
  const p = S.active && S.people[S.active];
  $('who').innerHTML = p ? `<span class="muted">পরীক্ষার্থী:</span> <b>${esc(p.name)}</b> <button class="btn small" id="switchP">পরিবর্তন</button>` : `<span class="muted">কোনো পরীক্ষার্থী নির্বাচিত নয়</span> <button class="btn small primary" id="switchP">নাম লিখুন</button>`;
  $('switchP').onclick = () => go('people');
}
function go(t, arg) {
  if (running && t !== 'test' && !running.done) {
    if (!confirm('পরীক্ষা চলছে। এখন অন্য পাতায় গেলে পরীক্ষা থেমে থাকবে (পরে আবার চালিয়ে যেতে পারবেন)। যাবেন?')) return;
    pauseRunning();
  }
  if (!S.active && t !== 'people' && t !== 'home') t = 'people';
  cur = t; tabs(); window.scrollTo(0, 0);
  ({ home, read, practice, test: testView, history, zones, review, people })[t](arg);
}

// ---------- examinee gate / people ----------
function welcome() {
  V().innerHTML = `<div class="card welcome"><h2>স্বাগতম! শুরু করতে পরীক্ষার্থীর নাম লিখুন</h2>
  <p class="muted">প্রত্যেক পরীক্ষার্থীর নম্বর, সব অ্যাটেম্পট, শক্তিশালী ও দুর্বল জোন আলাদাভাবে সংরক্ষিত থাকবে।</p>
  <form id="newP" class="row"><input type="text" id="pname" placeholder="পরীক্ষার্থীর নাম" maxlength="60" required style="flex:1"><button class="btn primary">শুরু করুন</button></form>
  ${Object.keys(S.people).length ? `<h3>অথবা আগের পরীক্ষার্থী নির্বাচন করুন</h3><div class="plist">${Object.values(S.people).map(p => `<button class="btn" data-pick="${p.id}">${esc(p.name)}</button>`).join('')}</div>` : ''}</div>`;
  bindNewPerson();
  V().querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { S.active = b.dataset.pick; S.people[S.active].last = Date.now(); save(); go('home'); });
}
function bindNewPerson() {
  const f = $('newP'); if (!f) return;
  f.onsubmit = e => {
    e.preventDefault();
    const name = $('pname').value.trim().replace(/\s+/g, ' ');
    if (!name) return;
    const ex = Object.values(S.people).find(p => p.name.toLowerCase() === name.toLowerCase());
    if (ex && !confirm(`"${name}" নামে পরীক্ষার্থী আগেই আছে। সেই রেকর্ডে যাবেন? (বাতিল চাপলে নতুন আলাদা রেকর্ড তৈরি হবে)`)) {
      // create separate
    } else if (ex) { S.active = ex.id; ex.last = Date.now(); save(); return go('home'); }
    const id = 'p' + uid();
    S.people[id] = { id, name, created: Date.now(), last: Date.now() };
    rec(id); S.active = id; save(); go('home');
  };
}
function people() {
  const list = Object.values(S.people).sort((a, b) => (b.last || 0) - (a.last || 0));
  const board = list.map(p => ({ p, s: personSummary(p.id) })).sort((a, b) => (b.s.best ?? -1) - (a.s.best ?? -1));
  V().innerHTML = `<div class="grid g2">
  <div class="card"><h2>পরীক্ষার্থী নির্বাচন / যোগ</h2>
    <form id="newP" class="row"><input type="text" id="pname" placeholder="নতুন পরীক্ষার্থীর নাম" maxlength="60" required style="flex:1"><button class="btn primary">যোগ করুন</button></form>
    <div class="plist">${list.map(p => `<div class="pitem ${p.id === S.active ? 'act' : ''}"><div><b>${esc(p.name)}</b><br><span class="muted">যোগ: ${fmtDate(p.created)}</span></div>
      <div class="row">${p.id === S.active ? '<span class="pill ok">সক্রিয়</span>' : `<button class="btn small primary" data-pick="${p.id}">নির্বাচন</button>`}
      <button class="btn small" data-ren="${p.id}">নাম বদল</button><button class="btn small danger" data-del="${p.id}">মুছুন</button></div></div>`).join('') || '<p class="muted">এখনো কোনো পরীক্ষার্থী নেই।</p>'}</div>
  </div>
  <div class="card"><h2>লিডারবোর্ড (সর্বোচ্চ নম্বর অনুযায়ী)</h2>${board.length ? `<div class="tablewrap"><table><thead><tr><th>#</th><th>নাম</th><th>অ্যাটেম্পট</th><th>সর্বোচ্চ</th><th>গড়</th><th>সর্বশেষ</th><th>নির্ভুলতা</th></tr></thead><tbody>
    ${board.map((b, i) => `<tr><td>${BN(i + 1)}</td><td>${esc(b.p.name)}</td><td>${BN(b.s.tests)}</td><td>${b.s.best == null ? '—' : fmtPct(b.s.best)}</td><td>${b.s.avg == null ? '—' : fmtPct(Math.round(b.s.avg * 10) / 10)}</td><td>${b.s.last ? fmtPct(b.s.last.pct) : '—'}</td><td>${b.s.answers ? fmtPct(b.s.acc) : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">কোনো তথ্য নেই।</p>'}</div>
  <div class="card"><h2>ব্যাকআপ</h2><p class="muted">সব পরীক্ষার্থীর রেকর্ড JSON ফাইলে সংরক্ষণ করুন বা অন্য ডিভাইস থেকে আনুন। সাইন-ইন করা থাকলে রেকর্ড আপনার অ্যাকাউন্টেও সিঙ্ক হয়।</p>
    <div class="row"><button class="btn" id="exp">JSON এক্সপোর্ট</button><label class="btn">JSON ইমপোর্ট<input type="file" id="imp" accept="application/json" hidden></label><button class="btn" id="csvAll">সব অ্যাটেম্পট CSV</button></div></div>
  </div>`;
  bindNewPerson();
  V().querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { S.active = b.dataset.pick; S.people[S.active].last = Date.now(); save(); go('home'); });
  V().querySelectorAll('[data-ren]').forEach(b => b.onclick = () => { const p = S.people[b.dataset.ren]; const n = prompt('নতুন নাম:', p.name); if (n && n.trim()) { p.name = n.trim(); save(); people(); tabs(); } });
  V().querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const p = S.people[b.dataset.del];
    if (!confirm(`"${p.name}"-এর সব রেকর্ড (${BN(rec(p.id).tests.length)}টি অ্যাটেম্পট) স্থায়ীভাবে মুছে যাবে। নিশ্চিত?`)) return;
    delete S.people[p.id]; delete S.rec[p.id]; delete S.draft[p.id];
    if (S.active === p.id) S.active = null; save(); go('people');
  });
  $('exp').onclick = () => download(`senior-officer-records-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: KEY, exported: new Date().toISOString(), people: S.people, rec: S.rec }, null, 1), 'application/json');
  $('imp').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => {
      const d = JSON.parse(t);
      if (d.app !== KEY || !d.people || !d.rec) throw new Error('ফাইলটি এই অ্যাপের নয়');
      let n = 0;
      for (const [id, p] of Object.entries(d.people)) {
        if (S.people[id] && !confirm(`"${p.name}" ইতিমধ্যে আছে। ফাইলের রেকর্ড দিয়ে প্রতিস্থাপন করবেন?`)) continue;
        S.people[id] = p; S.rec[id] = d.rec[id] || {}; n++;
      }
      save(); alert(BN(n) + ' জন পরীক্ষার্থীর রেকর্ড আনা হয়েছে।'); people(); tabs();
    }).catch(err => alert('ইমপোর্ট ব্যর্থ: ' + err.message));
  };
  $('csvAll').onclick = () => csvExport(Object.keys(S.people));
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function csvExport(pids) {
  const rows = [['Examinee', 'Attempt', 'Date', 'Test', 'Questions', 'Correct', 'Wrong', 'Skipped', 'Negative', 'Score', 'Max', 'Percent', 'Time (s)', ...SECS.map(s => s.en + ' %')]];
  for (const pid of pids) rec(pid).tests.forEach((t, i) => rows.push([S.people[pid].name, i + 1, new Date(t.at).toISOString(), t.title, t.qids.length, t.correct, t.wrong, t.skipped, t.neg, t.score, t.max, t.pct, Math.round(t.timeUsed), ...SECS.map(s => t.bySection[s.id] ? pct(t.bySection[s.id].c, t.bySection[s.id].n) : '')]));
  download('senior-officer-attempts.csv', '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
}

// ---------- home ----------
function home() {
  if (!S.active) return welcome();
  const p = S.people[S.active], s = personSummary(S.active), z = zoneStats();
  const tests = rec().tests;
  const weak = Object.entries(z.top).filter(([, v]) => level(v.c, v.t).k === 'weak').sort((a, b) => a[1].c / a[1].t - b[1].c / b[1].t).slice(0, 5);
  const strong = Object.entries(z.top).filter(([, v]) => level(v.c, v.t).k === 'strong').sort((a, b) => b[1].c / b[1].t - a[1].c / a[1].t).slice(0, 5);
  const draft = S.draft[S.active];
  V().innerHTML = `
  ${draft ? `<div class="card note" style="margin-bottom:14px"><div class="row spread"><span>অসমাপ্ত পরীক্ষা আছে: <b>${esc(draft.title)}</b> (${BN(Object.keys(draft.answers).length)}/${BN(draft.qids.length)} উত্তর)</span><span class="row"><button class="btn small primary" id="resume">চালিয়ে যান</button><button class="btn small danger" id="discard">বাতিল</button></span></div></div>` : ''}
  <div class="grid g4" style="margin-bottom:14px">
    <div class="card stat"><b>${BN(s.tests)}</b><span>মোট অ্যাটেম্পট (পরীক্ষা)</span></div>
    <div class="card stat"><b>${s.last ? fmtPct(s.last.pct) : '—'}</b><span>সর্বশেষ নম্বর${s.last ? ` (${fmtNum(s.last.score)}/${BN(s.last.max)})` : ''}</span></div>
    <div class="card stat"><b>${s.best == null ? '—' : fmtPct(s.best)}</b><span>সর্বোচ্চ নম্বর</span></div>
    <div class="card stat"><b>${s.avg == null ? '—' : fmtPct(Math.round(s.avg * 10) / 10)}</b><span>গড় নম্বর</span></div>
    <div class="card stat"><b>${BN(s.seen)}/${BN(QS.filter(scored).length)}</b><span>প্রশ্ন চেষ্টা করা হয়েছে</span></div>
    <div class="card stat"><b>${s.answers ? fmtPct(s.acc) : '—'}</b><span>সামগ্রিক নির্ভুলতা (${BN(s.answers)} উত্তর)</span></div>
    <div class="card stat"><b>${BN(s.read)}/${BN(QS.length)}</b><span>পড়া সম্পন্ন</span></div>
    <div class="card stat"><b>${BN(s.due)}</b><span>রিভিশন বাকি</span></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>শুরু করুন, ${esc(p.name)}</h2>
      <div class="row"><button class="btn primary" data-go="test">পূর্ণ মডেল টেস্ট (১০০)</button><button class="btn" data-go="practice">অনুশীলন</button><button class="btn" data-go="read">পড়ুন</button>
      ${s.wrongNow ? `<button class="btn" id="fixWrong">ভুলগুলো আবার (${BN(s.wrongNow)})</button>` : ''}
      ${weak.length ? `<button class="btn" id="weakTest">দুর্বল জোনের টেস্ট</button>` : ''}</div>
      <h3>নম্বরের অগ্রগতি</h3>${lineChart(tests.map(t => t.pct))}
    </div>
    <div class="card"><h2>বিষয়ভিত্তিক অবস্থা</h2>
      ${SECS.map(sc => { const v = z.sec[sc.id], L = level(v.c, v.t), P = pct(v.c, v.t); return `<div class="zone"><span>${esc(sc.bn)}<br><span class="muted">${BN(v.seen)}/${BN(v.n)} প্রশ্ন · ${v.t ? fmtPct(P) : 'শুরু হয়নি'}</span></span>${barHTML(P, L.cls)}<span class="pill ${L.cls}">${L.bn.split(' ')[0]}</span></div>`; }).join('')}
      <div class="row" style="margin-top:12px">
        <div style="flex:1;min-width:200px"><h3>শক্তিশালী</h3>${strong.map(([t, v]) => `<span class="pill ok">${esc(t)} ${fmtPct(pct(v.c, v.t))}</span>`).join('') || '<span class="muted">এখনো নেই</span>'}</div>
        <div style="flex:1;min-width:200px"><h3>দুর্বল</h3>${weak.map(([t, v]) => `<span class="pill bad">${esc(t)} ${fmtPct(pct(v.c, v.t))}</span>`).join('') || '<span class="muted">এখনো নেই</span>'}</div>
      </div>
    </div>
  </div>`;
  V().querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  if ($('resume')) $('resume').onclick = () => go('test', { resume: true });
  if ($('discard')) $('discard').onclick = () => { if (confirm('অসমাপ্ত পরীক্ষাটি বাতিল করবেন?')) { delete S.draft[S.active]; save(); home(); } };
  if ($('fixWrong')) $('fixWrong').onclick = () => startTest(wrongIds(), 'ভুল প্রশ্নের টেস্ট', 'wrong');
  if ($('weakTest')) $('weakTest').onclick = () => startTest(weakIds(), 'দুর্বল জোনের টেস্ট', 'weak');
}
function wrongIds() { const r = rec(); return QS.filter(q => scored(q) && r.q[q.id] && r.q[q.id].attempts && !r.q[q.id].lastCorrect).map(q => q.id); }
function weakIds() {
  const z = zoneStats();
  const weakT = new Set(Object.entries(z.top).filter(([, v]) => ['weak', 'mid'].includes(level(v.c, v.t).k)).map(([t]) => t));
  return QS.filter(q => scored(q) && weakT.has(q.topic)).map(q => q.id);
}

// ---------- read ----------
let readF = { sec: 'all', topic: 'all', term: '', hide: false, only: 'all' };
function read() {
  const r = rec();
  const topicsFor = readF.sec === 'all' ? TOPICS : TOPICS.filter(t => QS.some(q => q.section === readF.sec && q.topic === t));
  V().innerHTML = `<div class="card" style="margin-bottom:12px">
    <div class="chips">${[['all', 'সব বিষয়'], ...SECS.map(s => [s.id, s.bn])].map(([id, t]) => `<button class="chip ${readF.sec === id ? 'on' : ''}" data-sec="${id}">${esc(t)}</button>`).join('')}</div>
    <div class="row">
      <select id="rtopic" aria-label="টপিক"><option value="all">সব টপিক</option>${topicsFor.map(t => `<option ${readF.topic === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <select id="ronly" aria-label="ফিল্টার">${[['all', 'সব প্রশ্ন'], ['unread', 'পড়া বাকি'], ['bm', 'বুকমার্ক'], ['wrong', 'ভুল করা'], ['note', 'নোট আছে']].map(([v, t]) => `<option value="${v}" ${readF.only === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <input type="search" id="rterm" placeholder="প্রশ্ন বা ব্যাখ্যায় খুঁজুন…" value="${esc(readF.term)}" style="flex:1;min-width:180px">
      <button class="btn ${readF.hide ? 'on' : ''}" id="rhide">${readF.hide ? 'উত্তর দেখান' : 'উত্তর লুকান (নিজেকে যাচাই)'}</button>
      <button class="btn" id="rprint">প্রিন্ট</button>
    </div></div><div id="rlist"></div>`;
  V().querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { readF.sec = b.dataset.sec; readF.topic = 'all'; read(); });
  $('rtopic').onchange = e => { readF.topic = e.target.value; list(); };
  $('ronly').onchange = e => { readF.only = e.target.value; list(); };
  $('rterm').oninput = e => { readF.term = e.target.value; list(); };
  $('rhide').onclick = () => { readF.hide = !readF.hide; read(); };
  $('rprint').onclick = () => window.print();
  function list() {
    const t = readF.term.trim().toLowerCase();
    const items = QS.filter(q => (readF.sec === 'all' || q.section === readF.sec) && (readF.topic === 'all' || q.topic === readF.topic)
      && (!t || (q.q + ' ' + Object.values(q.options).join(' ') + ' ' + q.explain).toLowerCase().includes(t))
      && ({ all: 1, unread: !r.read[q.id], bm: r.q[q.id] && r.q[q.id].bookmarked, wrong: r.q[q.id] && r.q[q.id].wrongCount, note: r.q[q.id] && r.q[q.id].note })[readF.only]);
    $('rlist').innerHTML = `<p class="muted">${BN(items.length)}টি প্রশ্ন</p>` + (items.map(q => {
      const x = r.q[q.id] || {};
      return `<div class="card qcard" id="c-${q.id}"><div class="qhead"><span><span class="pill">প্রশ্ন ${BN(q.n)}</span><span class="pill">${esc(secName(q.section))}</span><span class="pill">${esc(q.topic)}</span>${x.attempts ? `<span class="pill ${x.lastCorrect ? 'ok' : 'bad'}">${BN(x.attempts)} বার চেষ্টা · ${BN(x.correctCount)} সঠিক</span>` : ''}</span>
        <span class="row noprint"><button class="star" data-bm="${q.id}" title="বুকমার্ক" aria-label="বুকমার্ক">${x.bookmarked ? '★' : '☆'}</button>
        <label class="row muted" style="gap:4px"><input type="checkbox" data-rd="${q.id}" ${r.read[q.id] ? 'checked' : ''}> পড়া হয়েছে</label></span></div>
        <div class="q">${esc(q.q)}</div>${optsHTML(q, { reveal: !readF.hide, disabled: !readF.hide ? true : false, name: q.id })}

  };
  $('tpause').onclick = () => { pauseRunning(); go('home'); };
  function pick(k) { T.answers[id] = k; if (T.i < T.qids.length - 1) T.i++; S.draft[S.active] = T; save(); renderTest(); }
  keyHandler = e => {
    if (e.target.matches('input,textarea,select')) return;
    const k = e.key.toUpperCase(), m = { 1: 'A', 2: 'B', 3: 'C', 4: 'D' }[k] || (LET.includes(k) ? k : null);
    if (m) pick(m);
    else if (e.key === 'ArrowRight' && T.i < T.qids.length - 1) { T.i++; renderTest(); }
    else if (e.key === 'ArrowLeft' && T.i) { T.i--; renderTest(); }
    else if (k === 'M') { T.marked[id] = !T.marked[id]; renderTest(); }
  };
}
function submitTest() {
  const T = running; if (!T || T.done) return;
  stopClock(); T.done = true; keyHandler = null;
  let correct = 0, wrong = 0, skipped = 0, excluded = 0;
  const bySection = {}, byTopic = {};
  for (const id of T.qids) {
    const q = QBY[id], a = T.answers[id];
    if (!scored(q)) { excluded++; continue; }
    const s = bySection[q.section] = bySection[q.section] || { n: 0, c: 0, w: 0, s: 0 };
    const t = byTopic[q.topic] = byTopic[q.topic] || { n: 0, c: 0, w: 0, s: 0 };
    s.n++; t.n++;
    if (!a) { skipped++; s.s++; t.s++; continue; }
    const ok = recordAnswer(id, a, 'test');
    if (ok) { correct++; s.c++; t.c++; } else { wrong++; s.w++; t.w++; }
  }
  const max = T.qids.length - excluded, score = Math.round((correct - wrong * T.neg) * 100) / 100;
  const result = { id: T.id, at: Date.now(), title: T.title, mode: T.mode, qids: T.qids, answers: T.answers, neg: T.neg, limit: T.limit, timeUsed: Math.min(T.elapsed, T.limit || Infinity),
    correct, wrong, skipped, excluded, max, score, pct: pct(Math.max(0, score), max), bySection, byTopic };
  rec().tests.push(result);
  delete S.draft[S.active];
  S.people[S.active].last = Date.now();
  save(); running = null;
  showResult(result.id);
}
function showResult(tid, pid = S.active) {
  const r = rec(pid), idx = r.tests.findIndex(t => t.id === tid), T = r.tests[idx];
  if (!T) return go('history');
  const prev = idx > 0 ? r.tests[idx - 1] : null;
  const allBest = Object.keys(S.people).flatMap(p => rec(p).tests.map(t => ({ p, pct: t.pct, id: t.id }))).sort((a, b) => b.pct - a.pct);
  const rank = allBest.findIndex(x => x.id === T.id) + 1;
  cur = 'history'; tabs();
  let filter = 'all';
  V().innerHTML = `<div class="grid g2">
    <div class="card"><div class="row spread"><h2>${esc(T.title)} — ফলাফল</h2><span class="muted">${esc(S.people[pid].name)} · অ্যাটেম্পট ${BN(idx + 1)}</span></div>
      <p class="big">${fmtNum(T.score)} / ${BN(T.max)}</p>
      <p><b>${fmtPct(T.pct)}</b> ${prev ? `<span class="pill ${T.pct >= prev.pct ? 'ok' : 'bad'}">আগের তুলনায় ${T.pct >= prev.pct ? '▲' : '▼'} ${fmtPct(Math.abs(Math.round((T.pct - prev.pct) * 10) / 10))}</span>` : ''} <span class="pill">সব অ্যাটেম্পটের মধ্যে র‍্যাংক ${BN(rank)}/${BN(allBest.length)}</span></p>
      <div class="grid g4"><div class="stat"><b style="color:var(--ok)">${BN(T.correct)}</b><span>সঠিক</span></div><div class="stat"><b style="color:var(--bad)">${BN(T.wrong)}</b><span>ভুল (−${fmtNum(T.wrong * T.neg)})</span></div><div class="stat"><b>${BN(T.skipped)}</b><span>উত্তর দেওয়া হয়নি</span></div><div class="stat"><b>${fmtTime(T.timeUsed)}</b><span>সময় লেগেছে${T.limit ? ' / ' + fmtTime(T.limit) : ''}</span></div></div>
      <p class="muted">${fmtDate(T.at)} · নেগেটিভ মার্কিং ${T.neg ? '−' + T.neg : 'নেই'}${T.excluded ? ' · ' + BN(T.excluded) + 'টি প্রশ্ন স্কোরের বাইরে' : ''}</p>
      <div class="row noprint"><button class="btn primary" id="retake">একই টেস্ট আবার দিন</button>${T.wrong + T.skipped ? `<button class="btn" id="retWrong">ভুল ও বাদ পড়া প্রশ্ন আবার</button>` : ''}<button class="btn" id="rprint">প্রিন্ট / PDF</button></div>
    </div>
    <div class="card"><h2>বিষয়ভিত্তিক ফলাফল</h2>${Object.entries(T.bySection).map(([s, v]) => { const L = level(v.c, v.n); return `<div class="zone"><span>${esc(secName(s))}<br><span class="muted">${BN(v.c)} সঠিক · ${BN(v.w)} ভুল · ${BN(v.s)} বাদ / ${BN(v.n)}</span></span>${barHTML(pct(v.c, v.n), L.cls)}<span>${fmtPct(pct(v.c, v.n))}</span></div>`; }).join('')}
      <h3>টপিক অনুযায়ী</h3>${Object.entries(T.byTopic).sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n).map(([t, v]) => `<span class="pill ${v.c === v.n ? 'ok' : v.c / v.n < 0.5 ? 'bad' : 'mid'}">${esc(t)} ${BN(v.c)}/${BN(v.n)}</span>`).join('')}
    </div></div>
    <div class="card" style="margin-top:14px"><div class="row spread"><h2>উত্তরপত্র ও ব্যাখ্যা</h2><div class="chips noprint" id="afilter">${[['all', 'সব'], ['wrong', 'ভুল'], ['skip', 'বাদ'], ['right', 'সঠিক']].map(([k, t]) => `<button class="chip ${k === 'all' ? 'on' : ''}" data-f="${k}">${t}</button>`).join('')}</div></div><div id="alist"></div></div>`;
  const draw = () => {
    $('alist').innerHTML = T.qids.map((id, i) => {
      const q = QBY[id], a = T.answers[id], st = !scored(q) ? 'x' : !a ? 'skip' : a === q.answer ? 'right' : 'wrong';
      if (filter !== 'all' && st !== filter) return '';
      return `<div class="card qcard"><div class="qhead"><span><span class="pill">${BN(i + 1)}</span><span class="pill">${esc(secName(q.section))}</span><span class="pill ${st === 'right' ? 'ok' : st === 'wrong' ? 'bad' : 'mid'}">${{ right: 'সঠিক', wrong: 'ভুল', skip: 'উত্তর দেওয়া হয়নি', x: 'স্কোরের বাইরে' }[st]}</span></span></div>
        <div class="q">${esc(q.q)}</div>${optsHTML(q, { chosen: a, reveal: true, disabled: true })}<details ${st === 'wrong' ? 'open' : ''}><summary class="muted" style="cursor:pointer;margin-top:8px">ব্যাখ্যা</summary>${expHTML(q)}</details></div>`;
    }).join('') || '<p class="muted">এই ফিল্টারে কিছু নেই।</p>';
  };
  draw();
  $('afilter').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; $('afilter').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); draw(); });
  $('rprint').onclick = () => window.print();
  $('retake').onclick = () => { if (pid !== S.active) return alert('অন্য পরীক্ষার্থীর টেস্ট আবার দিতে প্রথমে তাকে নির্বাচন করুন।'); startTest(T.qids.slice(), T.title, T.mode, T.limit, T.neg); };
  if ($('retWrong')) $('retWrong').onclick = () => { if (pid !== S.active) return alert('প্রথমে এই পরীক্ষার্থী নির্বাচন করুন।'); const ids = T.qids.filter(id => scored(QBY[id]) && T.answers[id] !== QBY[id].answer); startTest(ids, 'পুনঃচেষ্টা: ' + T.title, 'retry'); };
}

// ---------- history ----------
function history() {
  let scope = 'me';
  const draw = () => {
    const pids = scope === 'me' ? [S.active] : Object.keys(S.people);
    const rows = pids.flatMap(p => rec(p).tests.map((t, i) => ({ p, t, i }))).sort((a, b) => b.t.at - a.t.at);
    const me = personSummary(S.active);
    V().innerHTML = `<div class="card" style="margin-bottom:14px"><div class="row spread"><h2>অ্যাটেম্পট রেকর্ড</h2>
      <div class="row"><div class="chips" style="margin:0"><button class="chip ${scope === 'me' ? 'on' : ''}" data-s="me">${esc(S.people[S.active].name)}</button><button class="chip ${scope === 'all' ? 'on' : ''}" data-s="all">সব পরীক্ষার্থী</button></div><button class="btn small" id="csv">CSV ডাউনলোড</button></div></div>
      <p class="muted">${esc(S.people[S.active].name)}: মোট ${BN(me.tests)}টি অ্যাটেম্পট · সর্বোচ্চ ${me.best == null ? '—' : fmtPct(me.best)} · গড় ${me.avg == null ? '—' : fmtPct(Math.round(me.avg * 10) / 10)}</p>
      ${scope === 'me' ? lineChart(rec().tests.map(t => t.pct)) : ''}</div>
      <div class="card">${rows.length ? `<div class="tablewrap"><table><thead><tr>${scope === 'all' ? '<th>পরীক্ষার্থী</th>' : ''}<th>#</th><th>তারিখ</th><th>টেস্ট</th><th>সঠিক</th><th>ভুল</th><th>বাদ</th><th>নম্বর</th><th>%</th><th>সময়</th><th></th></tr></thead><tbody>
      ${rows.map(({ p, t, i }) => `<tr>${scope === 'all' ? `<td>${esc(S.people[p].name)}</td>` : ''}<td>${BN(i + 1)}</td><td>${fmtDate(t.at)}</td><td>${esc(t.title)}<br><span class="muted">${BN(t.qids.length)} প্রশ্ন</span></td><td>${BN(t.correct)}</td><td>${BN(t.wrong)}</td><td>${BN(t.skipped)}</td><td>${fmtNum(t.score)}/${BN(t.max)}</td><td><b>${fmtPct(t.pct)}</b></td><td>${fmtTime(t.timeUsed)}</td>
        <td class="row"><button class="btn small" data-view="${t.id}" data-p="${p}">দেখুন</button><button class="btn small danger" data-del="${t.id}" data-p="${p}">মুছুন</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">এখনো কোনো অ্যাটেম্পট নেই। "পরীক্ষা দিন" থেকে শুরু করুন।</div>'}</div>`;
    V().querySelectorAll('[data-s]').forEach(b => b.onclick = () => { scope = b.dataset.s; draw(); });
    V().querySelectorAll('[data-view]').forEach(b => b.onclick = () => showResult(b.dataset.view, b.dataset.p));
    V().querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      if (!confirm('এই অ্যাটেম্পটটি রেকর্ড থেকে মুছে যাবে (প্রশ্নভিত্তিক পরিসংখ্যান অপরিবর্তিত থাকবে)। নিশ্চিত?')) return;
      const r = rec(b.dataset.p); r.tests = r.tests.filter(t => t.id !== b.dataset.del); save(); draw();
    });
    $('csv').onclick = () => csvExport(pids);
  };
  draw();
}

// ---------- zones ----------
function zones() {
  const z = zoneStats(), r = rec();
  const tests = r.tests;
  const secTrend = SECS.map(s => ({ s, pts: tests.filter(t => t.bySection[s.id]).map(t => pct(t.bySection[s.id].c, t.bySection[s.id].n)) }));
  const tops = Object.entries(z.top).sort((a, b) => (a[1].t ? a[1].c / a[1].t : 2) - (b[1].t ? b[1].c / b[1].t : 2));
  V().innerHTML = `<div class="grid g2">
    <div class="card"><h2>বিষয়ভিত্তিক শক্তি ও দুর্বলতা</h2><p class="muted">পরীক্ষা, অনুশীলন ও স্ব-যাচাই — সব উত্তরের ভিত্তিতে। ৭৫%+ শক্তিশালী, ৫০–৭৫% মাঝারি, ৫০%-এর নিচে দুর্বল (কমপক্ষে ২টি উত্তর লাগবে)।</p>
      ${SECS.map(sc => { const v = z.sec[sc.id], L = level(v.c, v.t), tr = secTrend.find(x => x.s === sc).pts; return `<div class="zone"><span><b>${esc(sc.bn)}</b><br><span class="muted">${BN(v.c)}/${BN(v.t)} সঠিক · ${BN(v.seen)}/${BN(v.n)} প্রশ্ন${tr.length ? ' · টেস্টে সর্বশেষ ' + fmtPct(tr[tr.length - 1]) : ''}</span></span>${barHTML(pct(v.c, v.t), L.cls)}<span class="pill ${L.cls}">${L.bn.split(' ')[0]}</span></div>`; }).join('')}
    </div>
    <div class="card"><h2>করণীয়</h2>${(() => {
      const weakT = tops.filter(([, v]) => level(v.c, v.t).k === 'weak'), unseen = tops.filter(([, v]) => !v.t);
      return `<ul style="padding-left:18px;margin:0">
        ${weakT.length ? `<li>দুর্বল টপিক: ${weakT.map(([t]) => `<b>${esc(t)}</b>`).join(', ')} — "পড়ুন" ট্যাবে ব্যাখ্যা পড়ে তারপর অনুশীলন করুন।</li>` : '<li>কোনো দুর্বল টপিক চিহ্নিত হয়নি।</li>'}
        ${unseen.length ? `<li>${BN(unseen.length)}টি টপিক এখনো চেষ্টা করা হয়নি।</li>` : ''}
        <li>সর্বশেষ ভুল প্রশ্ন: ${BN(wrongIds().length)}টি।</li></ul>
        <div class="row" style="margin-top:12px">${weakIds().length ? '<button class="btn primary" id="zweak">দুর্বল ও মাঝারি টপিকের টেস্ট</button>' : ''}${wrongIds().length ? '<button class="btn" id="zwrong">ভুলগুলোর অনুশীলন</button>' : ''}</div>`;
    })()}</div></div>
    <div class="card" style="margin-top:14px"><h2>টপিকভিত্তিক বিশ্লেষণ</h2><div class="tablewrap"><table><thead><tr><th>টপিক</th><th>বিষয়</th><th>প্রশ্ন</th><th>উত্তর</th><th>নির্ভুলতা</th><th>অবস্থা</th><th></th></tr></thead><tbody>
    ${tops.map(([t, v]) => { const L = level(v.c, v.t); return `<tr><td>${esc(t)}</td><td>${esc(secName(v.sec))}</td><td>${BN(v.seen)}/${BN(v.n)}</td><td>${BN(v.c)}/${BN(v.t)}</td><td style="min-width:120px">${v.t ? barHTML(pct(v.c, v.t), L.cls) + fmtPct(pct(v.c, v.t)) : '—'}</td><td><span class="pill ${L.cls}">${L.bn}</span></td><td><button class="btn small" data-tp="${esc(t)}">অনুশীলন</button></td></tr>`; }).join('')}</tbody></table></div></div>`;
  if ($('zweak')) $('zweak').onclick = () => startTest(weakIds(), 'দুর্বল জোনের টেস্ট', 'weak');
  if ($('zwrong')) $('zwrong').onclick = () => startPractice(wrongIds(), 'ভুলগুলোর অনুশীলন');
  V().querySelectorAll('[data-tp]').forEach(b => b.onclick = () => startPractice(QS.filter(q => scored(q) && q.topic === b.dataset.tp).map(q => q.id), b.dataset.tp));
}

// ---------- review ----------
function review() {
  const r = rec(), now = new Date();
  const due = QS.filter(q => scored(q) && r.q[q.id] && r.q[q.id].attempts && new Date(r.q[q.id].nextReview) <= now);
  const wrong = QS.filter(q => scored(q) && r.q[q.id] && r.q[q.id].attempts && !r.q[q.id].lastCorrect);
  const bm = QS.filter(q => r.q[q.id] && r.q[q.id].bookmarked);
  const hard = QS.filter(q => scored(q) && r.q[q.id] && r.q[q.id].wrongCount >= 2).sort((a, b) => r.q[b.id].wrongCount - r.q[a.id].wrongCount);
  const block = (title, arr, key, desc) => `<div class="card"><div class="row spread"><h2>${title} (${BN(arr.length)})</h2>${arr.filter(scored).length ? `<button class="btn small primary" data-pr="${key}">অনুশীলন করুন</button>` : ''}</div><p class="muted">${desc}</p>
    ${arr.slice(0, 30).map(q => `<div style="padding:6px 0;border-bottom:1px dashed var(--bd)"><span class="pill">${BN(q.n)}</span>${esc(q.q.slice(0, 140))}${q.q.length > 140 ? '…' : ''}<br><span class="muted">উত্তর: ${esc(q.answer ? q.answer + '. ' + q.options[q.answer] : '—')}${r.q[q.id] && r.q[q.id].attempts ? ` · ${BN(r.q[q.id].correctCount)}/${BN(r.q[q.id].attempts)} সঠিক` : ''}</span></div>`).join('') || '<p class="muted">কিছু নেই।</p>'}</div>`;
  const sets = { due, wrong, bm, hard };
  V().innerHTML = `<div class="grid g2">${block('আজকের রিভিশন', due, 'due', 'স্পেসড রিপিটিশন: ভুল প্রশ্ন সাথে সাথে, সঠিক প্রশ্ন ১, ৩, ৭, ১৫ দিন পর আবার আসে।')}${block('সর্বশেষ ভুল', wrong, 'wrong', 'শেষবার যে প্রশ্নগুলো ভুল হয়েছে।')}${block('বারবার ভুল', hard, 'hard', 'অন্তত ২ বার ভুল হয়েছে — বিশেষ মনোযোগ দিন।')}${block('বুকমার্ক', bm, 'bm', 'আপনার চিহ্নিত প্রশ্ন।')}</div>`;
  V().querySelectorAll('[data-pr]').forEach(b => b.onclick = () => startPractice(sets[b.dataset.pr].filter(scored).map(q => q.id), 'রিভিশন'));
}

window.addEventListener('beforeunload', () => { if (running && !running.done) { S.draft[S.active] = running; save(); } });
save();
tabs(); home();
})();
</script>
</body>
</html>
