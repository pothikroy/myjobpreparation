<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../../firebase-config.js?v=9"></script>
  <script>window.AG_PAGE = {"id": "word-smart-vocabulary", "title": "Word Smart Vocabulary", "storage": {"type": "keys", "keys": ["wsv_progress_v1", "wsv_settings_v1"]}};</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Smart — Vocabulary Mastery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap');

:root{
  --c-bg: #FAF7F0;
  --c-bg-alt: #F2EDE1;
  --c-surface: #FFFFFF;
  --c-ink: #23281F;
  --c-ink-soft: #5B5E4F;
  --c-muted: #9A9A86;
  --c-border: #E1DAC6;
  --c-accent: #1F5C52;      /* deep teal-green ink */
  --c-accent-soft: #DCEAE4;
  --c-accent2: #B8863B;     /* gold ribbon */
  --c-accent2-soft: #F3E6C9;
  --c-danger: #A8412F;
  --c-danger-soft: #F5DCD5;
  --c-shadow: 0 2px 10px rgba(35,40,31,0.06), 0 1px 2px rgba(35,40,31,0.08);
  --radius: 14px;
  --font-display: 'Source Serif 4', 'Noto Sans Bengali', serif;
  --font-body: 'Inter', 'Noto Sans Bengali', -apple-system, sans-serif;
}
[data-theme="dark"]{
  --c-bg: #171D19;
  --c-bg-alt: #1E2620;
  --c-surface: #212B24;
  --c-ink: #EDEAE0;
  --c-ink-soft: #B8BBA9;
  --c-muted: #77806E;
  --c-border: #33402F;
  --c-accent: #6FC7B4;
  --c-accent-soft: #23352E;
  --c-accent2: #E0B562;
  --c-accent2-soft: #33291A;
  --c-danger: #E08370;
  --c-danger-soft: #3A231F;
  --c-shadow: 0 4px 18px rgba(0,0,0,0.35);
}
*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--c-bg);
  color: var(--c-ink);
  font-family: var(--font-body);
  line-height: 1.5;
  min-height: 100vh;
}
:lang(bn), .bn{ font-family: 'Noto Sans Bengali', var(--font-body); }

/* ---- App shell ---- */
#app-header{
  position: sticky; top:0; z-index: 50;
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-border);
  display:flex; align-items:center; gap:16px;
  padding: 12px 20px;
}
.logo{
  font-family: var(--font-display); font-weight:700; font-size:22px;
  color: var(--c-accent); white-space:nowrap; letter-spacing:0.2px;
  display:flex; align-items:center; gap:8px;
}
.logo .mark{
  display:inline-flex; align-items:center; justify-content:center;
  width:32px; height:32px; border-radius:8px;
  background: var(--c-accent); color:#fff; font-size:16px; font-family: var(--font-body); font-weight:700;
}
.search-wrap{ position:relative; flex:1; max-width:420px; }
#global-search{
  width:100%; padding:9px 14px; border-radius:20px; border:1px solid var(--c-border);
  background: var(--c-bg-alt); color: var(--c-ink); font-size:14px; font-family: var(--font-body);
}
#global-search:focus{ outline:2px solid var(--c-accent); outline-offset:1px; }
#search-results{
  display:none; position:absolute; top:calc(100% + 6px); left:0; right:0;
  background: var(--c-surface); border:1px solid var(--c-border); border-radius:10px;
  box-shadow: var(--c-shadow); max-height:360px; overflow-y:auto; z-index:60;
}
#search-results.open{ display:block; }
.search-item{ padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--c-border); font-size:14px; }
.search-item:last-child{ border-bottom:none; }
.search-item:hover{ background: var(--c-accent-soft); }
.search-empty{ padding:14px; color: var(--c-muted); font-size:14px; }
.header-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
#theme-toggle-btn{
  background:none; border:1px solid var(--c-border); border-radius:10px; padding:8px 10px; cursor:pointer;
  font-size:16px; color: var(--c-ink);
}

#app-nav{
  display:flex; gap:4px; overflow-x:auto; padding: 0 16px; background: var(--c-bg-alt);
  border-bottom: 1px solid var(--c-border);
}
.nav-btn{
  background:none; border:none; padding:12px 14px; font-size:13.5px; font-weight:600;
  color: var(--c-ink-soft); cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent;
  font-family: var(--font-body);
}
.nav-btn.active{ color: var(--c-accent); border-bottom-color: var(--c-accent); }
.nav-btn:hover{ color: var(--c-accent); }

#app-main{ max-width: 880px; margin:0 auto; padding: 20px 16px 60px; }
.view{ display:none; }
.view.active{ display:block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }

/* ---- Cards & generic elements ---- */
.card{
  background: var(--c-surface); border:1px solid var(--c-border); border-radius: var(--radius);
  padding:22px; margin-bottom:18px; box-shadow: var(--c-shadow);
}
.eyebrow{
  text-transform:uppercase; font-size:11px; letter-spacing:1.2px; font-weight:700; color: var(--c-accent2);
}
h2{ font-family: var(--font-display); font-size:22px; margin:6px 0 14px; }
h3{ font-family: var(--font-display); font-size:16px; margin:0 0 10px; }
.muted{ color: var(--c-ink-soft); font-size:13.5px; }

/* ---- Dashboard ---- */
.dash-grid{
  display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; margin-bottom:18px;
}
.stat-card{
  background: var(--c-surface); border:1px solid var(--c-border); border-radius:12px;
  padding:16px; text-align:center; box-shadow: var(--c-shadow);
}
.stat-card.accent{ background: var(--c-accent-soft); border-color: var(--c-accent); }
.stat-card.accent2{ background: var(--c-accent2-soft); border-color: var(--c-accent2); }
.stat-card.warn{ background: var(--c-danger-soft); border-color: var(--c-danger); }
.stat-num{ font-family: var(--font-display); font-size:26px; font-weight:700; }
.stat-label{ font-size:11.5px; color: var(--c-ink-soft); margin-top:4px; text-transform:uppercase; letter-spacing:0.5px; }
.progress-row{ margin-bottom:20px; }
.progress-label{ display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:6px; }
.progress-track{ background: var(--c-bg-alt); border-radius:20px; height:10px; overflow:hidden; border:1px solid var(--c-border); }
.progress-fill{ background: linear-gradient(90deg, var(--c-accent), var(--c-accent2)); height:100%; border-radius:20px; transition: width 0.4s ease; }

.wod-card{ border-left:5px solid var(--c-accent2); }
.wod-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.wod-word{ font-family: var(--font-display); font-size:26px; font-weight:700; display:flex; align-items:center; gap:10px; }
.wod-pron{ color: var(--c-ink-soft); font-size:13.5px; margin:4px 0 10px; }
.wod-def{ margin-bottom:4px; }
.wod-bn{ font-family:'Noto Sans Bengali', sans-serif; color: var(--c-accent); font-size:16px; margin-bottom:10px; }
.wod-example{ background: var(--c-bg-alt); border-radius:10px; padding:10px 14px; font-size:13.5px; margin-bottom:10px; }
.wod-example .bn{ color: var(--c-ink-soft); }
.wod-tip{ font-size:13.5px; background: var(--c-accent2-soft); border-radius:10px; padding:10px 14px; }
.wod-actions{ margin-top:14px; display:flex; gap:8px; }
.quick-links{ display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
.quick-btn{
  background: var(--c-surface); border:1px solid var(--c-border); border-radius:12px; padding:14px 8px;
  font-size:13px; font-weight:600; cursor:pointer; color: var(--c-ink); font-family: var(--font-body);
}
.quick-btn:hover{ border-color: var(--c-accent); color: var(--c-accent); }

/* ---- Buttons ---- */
button{ font-family: var(--font-body); }
.btn-primary{
  background: var(--c-accent); color:#fff; border:none; border-radius:10px; padding:11px 20px;
  font-weight:600; font-size:14px; cursor:pointer;
}
.btn-primary:hover{ opacity:0.9; }
.btn-secondary{
  background: var(--c-surface); color: var(--c-accent); border:1.5px solid var(--c-accent);
  border-radius:10px; padding:10px 18px; font-weight:600; font-size:14px; cursor:pointer;
}
.btn-ghost{ background:none; border:none; color: var(--c-accent); font-weight:600; cursor:pointer; font-size:13.5px; }
.btn-sm{
  background: var(--c-bg-alt); border:1px solid var(--c-border); border-radius:8px; padding:7px 12px;
  font-size:12.5px; font-weight:600; cursor:pointer; color: var(--c-ink);
}
.btn-sm.active{ background: var(--c-accent2-soft); border-color: var(--c-accent2); color: var(--c-accent2); }
.btn-icon{ background:none; border:1px solid var(--c-border); border-radius:8px; width:34px; height:34px; cursor:pointer; font-size:15px; }
.btn-icon.active{ background: var(--c-accent2-soft); border-color: var(--c-accent2); }
.btn-danger{ background: var(--c-danger-soft); color: var(--c-danger); border:1px solid var(--c-danger); border-radius:9px; padding:9px 14px; font-weight:600; cursor:pointer; font-size:13px; }
.file-label{ display:inline-flex; align-items:center; cursor:pointer; }

/* ---- Study mode ---- */
.study-toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.select{
  padding:8px 10px; border-radius:8px; border:1px solid var(--c-border); background: var(--c-surface);
  color: var(--c-ink); font-size:13px; font-family: var(--font-body);
}
.study-jump{ display:flex; gap:6px; }
.study-jump input{ width:70px; padding:8px; border-radius:8px; border:1px solid var(--c-border); background:var(--c-surface); color:var(--c-ink); }
.study-count{ margin-left:auto; font-size:13px; color: var(--c-ink-soft); font-weight:600; }
.study-card{ text-align:left; position:relative; }
.study-card-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.serial-badge{
  background: var(--c-accent2-soft); color: var(--c-accent2); font-weight:700; font-size:12px;
  padding:4px 10px; border-radius:20px;
}
.card-actions{ display:flex; gap:6px; }
.study-word{ font-family: var(--font-display); font-size:32px; font-weight:700; margin:6px 0 2px; }
.study-pron{ color: var(--c-ink-soft); font-size:14px; margin-bottom:14px; }
.pos-tag{ font-style:italic; color: var(--c-accent); }
.reveal-btn{ width:100%; margin-top:8px; }
.study-detail{ border-top:1px dashed var(--c-border); padding-top:14px; margin-top:8px; }
.detail-row{ margin-bottom:10px; font-size:14.5px; }
.detail-row.small{ font-size:13px; color: var(--c-ink-soft); }
.detail-row.bn{ font-family:'Noto Sans Bengali', sans-serif; color: var(--c-accent); }
.detail-label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color: var(--c-muted); font-weight:700; margin-bottom:2px; }
.detail-row.mnemonic{ background: var(--c-accent2-soft); padding:10px 12px; border-radius:10px; }
.study-toggles{ display:flex; gap:16px; margin-top:14px; font-size:13px; color: var(--c-ink-soft); }
.study-nav{ display:flex; justify-content:space-between; align-items:center; margin: 16px 0; gap:10px; }
.study-note{ margin-top:6px; }
.study-note label{ font-size:12px; font-weight:700; color: var(--c-muted); text-transform:uppercase; letter-spacing:0.5px; }
.study-note textarea{
  width:100%; min-height:70px; margin-top:6px; padding:10px; border-radius:10px; border:1px solid var(--c-border);
  background: var(--c-bg-alt); color: var(--c-ink); font-family: var(--font-body); font-size:13.5px; resize:vertical;
}
.empty-state{ text-align:center; padding:50px 20px; color: var(--c-muted); font-size:15px; }

/* ---- Flashcards ---- */
.flash-wrap{ perspective:1200px; margin-bottom:16px; }
.flashcard{
  position:relative; min-height:280px; border-radius: var(--radius); cursor:pointer;
  transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
  box-shadow: var(--c-shadow);
}
.flashcard.flipped{ transform: rotateY(180deg); }
.flash-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius: var(--radius);
  background: var(--c-surface); border:1px solid var(--c-border); padding:26px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
}
.flash-back{ transform: rotateY(180deg); align-items:flex-start; text-align:left; justify-content:flex-start; overflow-y:auto; }
.flash-word{ font-family: var(--font-display); font-size:34px; font-weight:700; margin-top:10px; }
.flash-hint{ margin-top:14px; color: var(--c-muted); font-size:12.5px; }
.flash-back-word{ font-family: var(--font-display); font-size:22px; font-weight:700; margin-bottom:10px; }
.flash-actions{ text-align:center; margin-bottom:14px; }
.sr-buttons{ display:grid; grid-template-columns: repeat(4,1fr); gap:8px; margin-bottom:16px; }
.sr-btn{ border:none; border-radius:10px; padding:12px 6px; font-weight:700; font-size:13px; cursor:pointer; color:#fff; }
.sr-btn.again{ background:#B4453A; }
.sr-btn.hard{ background:#C08A3E; }
.sr-btn.good{ background: var(--c-accent); }
.sr-btn.easy{ background:#3E8E5B; }

/* ---- Quiz ---- */
.quiz-setup .form-row{ margin-bottom:16px; }
.form-row label{ display:block; font-size:12.5px; font-weight:700; color: var(--c-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
.form-row.inline{ display:flex; align-items:center; gap:10px; }
.form-row.inline label{ margin-bottom:0; }
.range-inputs{ display:flex; gap:10px; }
.range-inputs input{ flex:1; padding:9px; border-radius:8px; border:1px solid var(--c-border); background: var(--c-surface); color: var(--c-ink); }
.quiz-progress{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.quiz-progress .progress-track{ flex:1; }
.quiz-progress span{ font-size:12.5px; color: var(--c-ink-soft); font-weight:600; white-space:nowrap; }
.quiz-card{ text-align:center; }
.quiz-prompt{ font-family: var(--font-display); font-size:22px; font-weight:600; margin:14px 0 20px; line-height:1.4; }
.quiz-options{ display:grid; gap:10px; }
.quiz-option{
  background: var(--c-bg-alt); border:1.5px solid var(--c-border); border-radius:10px; padding:13px;
  font-size:14.5px; cursor:pointer; text-align:left; color: var(--c-ink); font-family: var(--font-body);
}
.quiz-option:hover{ border-color: var(--c-accent); }
.quiz-option.correct{ background: var(--c-accent-soft); border-color: var(--c-accent); }
.quiz-option.incorrect{ background: var(--c-danger-soft); border-color: var(--c-danger); }
.quiz-input{ width:100%; padding:12px; border-radius:10px; border:1.5px solid var(--c-border); font-size:15px; margin-bottom:10px; background:var(--c-surface); color:var(--c-ink); }
.feedback{ margin:14px 0; font-weight:700; }
.feedback.ok{ color: var(--c-accent); }
.feedback.no{ color: var(--c-danger); }
.results-score{ font-family: var(--font-display); font-size:52px; font-weight:700; text-align:center; color: var(--c-accent); }
.results-sub{ text-align:center; color: var(--c-ink-soft); margin-bottom:20px; }
.wrong-list{ background: var(--c-bg-alt); border-radius:10px; padding:14px; margin-bottom:16px; }
.wrong-item{ padding:6px 0; border-bottom:1px solid var(--c-border); font-size:13.5px; }
.wrong-item:last-child{ border-bottom:none; }
.all-correct{ text-align:center; font-weight:700; color: var(--c-accent); }
.results-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

/* ---- Daily ---- */
.daily-complete{ text-align:center; }

/* ---- Lists ---- */
.tabs{ display:flex; gap:8px; margin-bottom:16px; }
.tab-btn{ background: var(--c-bg-alt); border:1px solid var(--c-border); padding:9px 16px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer; color: var(--c-ink-soft); }
.tab-btn.active{ background: var(--c-accent); color:#fff; border-color: var(--c-accent); }
.list-actions{ display:flex; gap:8px; margin-bottom:14px; }
.word-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
.word-chip{ background: var(--c-surface); border:1px solid var(--c-border); border-radius:10px; padding:12px; }
.chip-num{ color: var(--c-accent2); font-weight:700; font-size:11px; }
.chip-word{ display:block; font-family: var(--font-display); font-weight:700; font-size:16px; margin:2px 0; }
.chip-def{ font-size:12.5px; color: var(--c-ink-soft); }

/* ---- Progress page ---- */
.chart-row{ display:grid; grid-template-columns: 1.4fr 1fr; gap:14px; }
.chart-card{ text-align:center; }
.bar-chart{ width:100%; height:auto; }
.bar{ fill: var(--c-accent); }
.bar-label{ fill: var(--c-ink-soft); font-size:10px; }
.bar-value{ fill: var(--c-ink); font-size:10px; font-weight:700; }
.pie-chart{ width:140px; height:140px; }
.pie-legend{ margin-top:10px; text-align:left; font-size:12.5px; }
.legend-item{ display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.legend-dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }

/* ---- Settings ---- */
.shortcuts-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:10px; font-size:13.5px; }
kbd{ background: var(--c-bg-alt); border:1px solid var(--c-border); border-radius:5px; padding:2px 7px; font-family:monospace; font-size:12px; }
.ok-msg{ color: var(--c-accent); font-weight:600; }
.err-msg{ color: var(--c-danger); font-weight:600; }

/* ---- Responsive ---- */
@media (max-width: 720px){
  .dash-grid{ grid-template-columns: repeat(2,1fr); }
  .quick-links{ grid-template-columns: repeat(2,1fr); }
  .word-grid{ grid-template-columns: 1fr; }
  .chart-row{ grid-template-columns: 1fr; }
  .logo span.logo-text{ display:none; }
  #app-header{ padding:10px 12px; }
  .shortcuts-grid{ grid-template-columns:1fr; }
}
</style>
</head>
<body data-theme="light">
<div id="ag-overlay"></div>

<header id="app-header">
  <div class="logo"><span class="mark">WS</span><span class="logo-text">Word Smart</span></div>
  <div class="search-wrap">
    <input type="text" id="global-search" placeholder="Search words, meanings, বাংলা অর্থ, or #...">
    <div id="search-results"></div>
  </div>
  <div class="header-right">
    <button id="theme-toggle-btn" title="Toggle theme">🌓</button>
  </div>
</header>
<nav id="app-nav">
  <button class="nav-btn active" data-view="dashboard">🏠 Dashboard</button>
  <button class="nav-btn" data-view="study">📖 Study</button>
  <button class="nav-btn" data-view="flashcards">🗂 Flashcards</button>
  <button class="nav-btn" data-view="quiz">📝 Quiz</button>
  <button class="nav-btn" data-view="daily">📅 Daily</button>
  <button class="nav-btn" data-view="lists">⭐ Lists</button>
  <button class="nav-btn" data-view="progress">📊 Progress</button>
  <button class="nav-btn" data-view="settings">⚙️ Settings</button>
</nav>
<main id="app-main">
  <div class="view active" id="view-dashboard"></div>
  <div class="view" id="view-study"></div>
  <div class="view" id="view-flashcards"></div>
  <div class="view" id="view-quiz"></div>
  <div class="view" id="view-daily"></div>
  <div class="view" id="view-lists"></div>
  <div class="view" id="view-progress"></div>
  <div class="view" id="view-settings"></div>
</main>

const VOCAB_BY_NUM = {};
VOCAB.forEach(w => VOCAB_BY_NUM[w.num] = w);
const TOTAL_WORDS = VOCAB.length;

const STORE_KEY = 'wsv_progress_v1';
const SETTINGS_KEY = 'wsv_settings_v1';

/* ---------- Default state ---------- */
function defaultProgress(){
  return {
    status: 'new',        // new | learning | review | mastered | difficult
    ease: 2.5,
    interval: 0,          // days
    reviewCount: 0,
    lastReviewed: null,
    nextReview: null,
    favorite: false,
    difficult: false,
    learned: false,
    note: '',
    wrongCount: 0,
    correctCount: 0
  };
}
function defaultSettings(){
  return {
    theme: 'light',
    dailyTarget: 20,
    lastStudyDate: null,
    currentStreak: 0,
    longestStreak: 0,
    dailyLog: {},          // { 'YYYY-MM-DD': countStudied }
    quizStats: { totalAnswered: 0, totalCorrect: 0, sessions: 0 },
    todayCompleted: {},    // { 'YYYY-MM-DD': [nums studied today for daily mode] }
    wordOfDayDate: null,
    wordOfDayNum: null
  };
}

let progress = {};
let settings = defaultSettings();

function loadState(){
  try{
    const p = localStorage.getItem(STORE_KEY);
    progress = p ? JSON.parse(p) : {};
  }catch(e){ progress = {}; }
  try{
    const s = localStorage.getItem(SETTINGS_KEY);
    settings = s ? Object.assign(defaultSettings(), JSON.parse(s)) : defaultSettings();
  }catch(e){ settings = defaultSettings(); }
}
function saveProgress(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){}
}
function saveSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){}
}
function getProg(num){
  if(!progress[num]) progress[num] = defaultProgress();
  return progress[num];
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

/* ---------- Streak tracking ---------- */
function touchStudyToday(){
  const t = todayStr();
  if(settings.lastStudyDate === t) { return; }
  const yestDate = new Date(); yestDate.setDate(yestDate.getDate()-1);
  const yest = yestDate.getFullYear()+'-'+String(yestDate.getMonth()+1).padStart(2,'0')+'-'+String(yestDate.getDate()).padStart(2,'0');
  if(settings.lastStudyDate === yest){
    settings.currentStreak += 1;
  } else if(settings.lastStudyDate !== t){
    settings.currentStreak = 1;
  }
  settings.longestStreak = Math.max(settings.longestStreak, settings.currentStreak);
  settings.lastStudyDate = t;
  if(!settings.dailyLog[t]) settings.dailyLog[t] = 0;
  saveSettings();
}
function logStudyActivity(n){
  const t = todayStr();
  touchStudyToday();
  settings.dailyLog[t] = (settings.dailyLog[t]||0) + n;
  saveSettings();
}

/* ---------- SRS scheduling (simplified SM-2) ---------- */
function scheduleReview(num, grade){
  // grade: 'again' | 'hard' | 'good' | 'easy'
  const p = getProg(num);
  const now = Date.now();
  p.lastReviewed = now;
  p.reviewCount += 1;
  if(grade === 'again'){
    p.ease = Math.max(1.3, p.ease - 0.2);
    p.interval = 0;
    p.status = 'learning';
    p.wrongCount += 1;
  } else if(grade === 'hard'){
    p.ease = Math.max(1.3, p.ease - 0.15);
    p.interval = Math.max(1, Math.round((p.interval || 1) * 1.2));
    p.status = 'review';
    p.correctCount += 1;
  } else if(grade === 'good'){
    p.interval = p.interval ? Math.round(p.interval * p.ease) : 1;
    p.status = (p.reviewCount >= 5 && p.interval > 21) ? 'mastered' : 'review';
    p.correctCount += 1;
  } else if(grade === 'easy'){
    p.ease = Math.min(3.2, p.ease + 0.15);
    p.interval = Math.round((p.interval || 1) * p.ease * 1.3);
    p.status = (p.interval > 21) ? 'mastered' : 'review';
    p.correctCount += 1;
  }
  if(p.status === 'mastered'){ p.learned = true; }
  p.nextReview = now + p.interval * 86400000;
  if(grade === 'again' || grade === 'hard'){
    // heuristically flag repeatedly-missed words as difficult
    if(p.wrongCount >= 2) p.difficult = true;
  }
  saveProgress();
  logStudyActivity(1);
}

function isDue(num){
  const p = progress[num];
  if(!p || !p.nextReview) return p && p.status !== 'new';
  return p.nextReview <= Date.now();
}

/* ---------- Filters ---------- */
function getWordsByFilter(filter){
  switch(filter){
    case 'all': return VOCAB;
    case 'unlearned': return VOCAB.filter(w => !getProg(w.num).learned && getProg(w.num).status !== 'mastered');
    case 'learning': return VOCAB.filter(w => getProg(w.num).status === 'learning');
    case 'difficult': return VOCAB.filter(w => getProg(w.num).difficult);
    case 'favorites': return VOCAB.filter(w => getProg(w.num).favorite);
    case 'mastered': return VOCAB.filter(w => getProg(w.num).status === 'mastered');
    case 'due': return VOCAB.filter(w => progress[w.num] && progress[w.num].status !== 'new' && isDue(w.num));
    case 'new': return VOCAB.filter(w => !progress[w.num] || progress[w.num].status === 'new');
    default: return VOCAB;
  }
}

function searchWords(query){
  if(!query || !query.trim()) return [];
  const q = query.trim().toLowerCase();
  const qNum = parseInt(q,10);
  return VOCAB.filter(w => {
    if(!isNaN(qNum) && w.num === qNum) return true;
    if(w.word.toLowerCase().includes(q)) return true;
    if(w.def.toLowerCase().includes(q)) return true;
    if(w.bn && w.bn.includes(query.trim())) return true;
    return false;
  });
}

/* ---------- Stats ---------- */
function computeStats(){
  let learned=0, learning=0, difficult=0, mastered=0, due=0, newCount=0, favorites=0;
  VOCAB.forEach(w=>{
    const p = progress[w.num];
    if(!p || p.status === 'new') newCount++;
    else if(p.status === 'learning') learning++;
    else if(p.status === 'mastered') mastered++;
    else if(p.status === 'review') learning++; // count as "in progress"
    if(p && p.difficult) difficult++;
    if(p && p.favorite) favorites++;
    if(p && p.learned) learned++;
    if(p && p.status !== 'new' && isDue(w.num)) due++;
  });
  const t = todayStr();
  const todayCount = settings.dailyLog[t] || 0;
  const accuracy = settings.quizStats.totalAnswered > 0
    ? Math.round((settings.quizStats.totalCorrect/settings.quizStats.totalAnswered)*100) : 0;
  return {
    total: TOTAL_WORDS, learned, learning, difficult, mastered, due, newCount, favorites,
    todayCount, accuracy,
    overallPct: Math.round((mastered/TOTAL_WORDS)*100)
  };
}

/* ---------- Word of the Day ---------- */
function dateSeed(dateStr){
  let h = 0;
  for(let i=0;i<dateStr.length;i++){ h = (h*31 + dateStr.charCodeAt(i)) >>> 0; }
  return h;
}
function getWordOfDay(forceRandom){
  const t = todayStr();
  if(!forceRandom && settings.wordOfDayDate === t && settings.wordOfDayNum){
    return VOCAB_BY_NUM[settings.wordOfDayNum];
  }
  let num;
  if(forceRandom){
    num = VOCAB[Math.floor(Math.random()*VOCAB.length)].num;
  } else {
    num = (dateSeed(t) % TOTAL_WORDS) + 1;
  }
  settings.wordOfDayDate = t;
  settings.wordOfDayNum = num;
  saveSettings();
  return VOCAB_BY_NUM[num];
}

/* ---------- Speech ---------- */
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Quiz generation ---------- */
function pickRandom(arr, n, excludeNum){
  const pool = arr.filter(w => w.num !== excludeNum);
  const out = [];
  const used = new Set();
  while(out.length < n && out.length < pool.length){
    const idx = Math.floor(Math.random()*pool.length);
    if(used.has(idx)) continue;
    used.add(idx);
    out.push(pool[idx]);
  }
  return out;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildQuizQuestion(word, type, pool){
  const distractorWords = pickRandom(pool, 3, word.num);
  switch(type){
    case 'mc_meaning': {
      const options = shuffle([word.def, ...distractorWords.map(d=>d.def)]);
      return { type, word, prompt: word.word, options, answer: word.def, qType:'mcq' };
    }
    case 'bn_to_en': {
      const options = shuffle([word.word, ...distractorWords.map(d=>d.word)]);
      return { type, word, prompt: word.bn, options, answer: word.word, qType:'mcq' };
    }
    case 'meaning_to_word': {
      const options = shuffle([word.word, ...distractorWords.map(d=>d.word)]);
      return { type, word, prompt: word.def, options, answer: word.word, qType:'mcq' };
    }
    case 'type_answer': {
      return { type, word, prompt: word.def, answer: word.word, qType:'typed' };
    }
    case 'fill_blank': {
      const re = new RegExp(word.word, 'i');
      const blanked = word.example.replace(re, '_____');
      const options = shuffle([word.word, ...distractorWords.map(d=>d.word)]);
      return { type, word, prompt: blanked, options, answer: word.word, qType:'mcq' };
    }
    case 'true_false': {
      const isTrue = Math.random() < 0.5;
      const shownDef = isTrue ? word.def : distractorWords[0].def;
      return { type, word, prompt: word.word + ' — "' + shownDef + '"', answer: isTrue ? 'True' : 'False', qType:'tf' };
    }
    default: return buildQuizQuestion(word, 'mc_meaning', pool);
  }
}

const QUIZ_TYPES = ['mc_meaning','bn_to_en','meaning_to_word','type_answer','fill_blank','true_false'];

function generateQuiz(opts){
  // opts: {count, source, typeMode, rangeFrom, rangeTo}
  let pool = getWordsByFilter(opts.source || 'all');
  if(opts.rangeFrom && opts.rangeTo){
    pool = pool.filter(w => w.num >= opts.rangeFrom && w.num <= opts.rangeTo);
  }
  if(pool.length === 0) pool = VOCAB;
  const shuffled = shuffle(pool);
  const count = opts.count === 'all' ? shuffled.length : Math.min(opts.count, shuffled.length);
  const chosen = shuffled.slice(0, count);
  return chosen.map(w=>{
    const type = opts.typeMode === 'mixed' ? QUIZ_TYPES[Math.floor(Math.random()*QUIZ_TYPES.length)] : opts.typeMode;
    return buildQuizQuestion(w, type, pool.length >= 4 ? pool : VOCAB);
  });
}

/* ---------- Export / Import / Reset ---------- */
function exportData(){
  const payload = { progress, settings, exportedAt: new Date().toISOString(), version: 1 };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'word-smart-progress.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(jsonText){
  try{
    const payload = JSON.parse(jsonText);
    if(payload.progress) progress = payload.progress;
    if(payload.settings) settings = Object.assign(defaultSettings(), payload.settings);
    saveProgress(); saveSettings();
    return true;
  }catch(e){ return false; }
}
function resetAllProgress(){ progress = {}; saveProgress(); }
function resetQuizStats(){ settings.quizStats = { totalAnswered:0, totalCorrect:0, sessions:0 }; saveSettings(); }
function resetReviewSchedule(){
  Object.keys(progress).forEach(num=>{
    const p = progress[num];
    p.interval = 0; p.nextReview = null; p.status = p.learned ? 'review' : 'new';
  });
  saveProgress();
}

function el(sel){ return document.querySelector(sel); }
function els(sel){ return Array.from(document.querySelectorAll(sel)); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function applyTheme(){
  document.documentElement.setAttribute('data-theme', settings.theme);
}
function toggleTheme(){
  settings.theme = settings.theme === 'light' ? 'dark' : 'light';
  saveSettings(); applyTheme();
}

function switchView(view){
  currentView = view;
  els('.nav-btn').forEach(b=> b.classList.toggle('active', b.dataset.view===view));
  els('.view').forEach(v=> v.classList.toggle('active', v.id === 'view-'+view));
  renderCurrentView();
  el('#app-main').scrollTo(0,0);
}
function renderCurrentView(){
  switch(currentView){
    case 'dashboard': renderDashboard(); break;
    case 'study': renderStudy(); break;
    case 'flashcards': renderFlashcards(); break;
    case 'quiz': renderQuizSetup(); break;
    case 'daily': renderDaily(); break;
    case 'lists': renderLists(); break;

    case 'settings': renderSettingsView(); break;

  return opts.map(([v,l])=>`<option value="${v}" ${v===selected?'selected':''}>${l}</option>`).join('');
}

function renderQuizRunner(){
  const q = quizState.questions[quizState.idx];
  const container = el('#view-quiz');
  const progressPct = Math.round((quizState.idx/quizState.questions.length)*100);
  let bodyHtml = '';
  if(q.qType === 'mcq'){
    bodyHtml = q.options.map(opt=>`<button class="quiz-option" data-val="${esc(opt)}">${esc(opt)}</button>`).join('');
  } else if(q.qType === 'typed'){
    bodyHtml = `<input type="text" id="quiz-type-input" class="quiz-input" placeholder="Type the word..." autocomplete="off">
      <button class="btn-primary" id="quiz-submit-typed">Submit</button>`;
  } else if(q.qType === 'tf'){
    bodyHtml = `<button class="quiz-option" data-val="True">True</button><button class="quiz-option" data-val="False">False</button>`;
  }
  const label = {mc_meaning:'Multiple Choice', bn_to_en:'বাংলা → English', meaning_to_word:'Meaning → Word',
    type_answer:'Type the Answer', fill_blank:'Fill in the Blank', true_false:'True / False'}[q.type];
  container.innerHTML = `
    <div class="quiz-progress"><div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <span>${quizState.idx+1} / ${quizState.questions.length}</span></div>
    <div class="card quiz-card">
      <span class="eyebrow">${label}</span>
      <div class="quiz-prompt">${esc(q.prompt)}</div>
      <div class="quiz-options" id="quiz-options">${bodyHtml}</div>
      <div id="quiz-feedback"></div>
    </div>
  `;
  if(q.qType === 'typed'){
    el('#quiz-submit-typed').onclick = ()=> submitAnswer(el('#quiz-type-input').value.trim());
    el('#quiz-type-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submitAnswer(el('#quiz-type-input').value.trim()); });
    setTimeout(()=>el('#quiz-type-input') && el('#quiz-type-input').focus(), 50);
  } else {
    els('.quiz-option').forEach(b=> b.onclick = ()=> submitAnswer(b.dataset.val));
  }
}
function submitAnswer(val){
  if(quizState.answered) return;
  quizState.answered = true;
  const q = quizState.questions[quizState.idx];
  const correct = q.qType==='typed'
    ? val.toLowerCase() === q.answer.toLowerCase()
    : val === q.answer;
  settings.quizStats.totalAnswered += 1;
  if(correct){ settings.quizStats.totalCorrect += 1; quizState.correct += 1; scheduleReview(q.word.num, 'good'); }
  else { quizState.wrong.push(q); scheduleReview(q.word.num, 'again'); }
  saveSettings();
  els('.quiz-option').forEach(b=>{
    b.disabled = true;
    if(b.dataset.val === q.answer) b.classList.add('correct');
    else if(b.dataset.val === val && !correct) b.classList.add('incorrect');
  });
  el('#quiz-feedback').innerHTML = `<div class="feedback ${correct?'ok':'no'}">
    ${correct ? '✅ Correct!' : '❌ Incorrect. Correct answer: <strong>'+esc(q.answer)+'</strong>'}
    </div><button class="btn-primary" id="quiz-next">Continue</button>`;
  el('#quiz-next').onclick = ()=>{
    quizState.idx += 1; quizState.answered = false;
    if(quizState.idx >= quizState.questions.length) renderQuizResults();
    else renderQuizRunner();
  };
}
function renderQuizResults(){
  const q = quizState;
  const total = q.questions.length;
  const pct = Math.round((q.correct/total)*100);
  const timeSec = Math.round((Date.now()-q.startTime)/1000);
  const mins = Math.floor(timeSec/60), secs = timeSec%60;
  settings.quizStats.sessions += 1; saveSettings();
  el('#view-quiz').innerHTML = `
    <div class="card quiz-results">
      <h2>Quiz Complete!</h2>
      <div class="results-score">${pct}%</div>
      <div class="results-sub">${q.correct} / ${total} correct · ${mins}m ${secs}s</div>
      ${q.wrong.length ? `<div class="wrong-list"><h3>Words to review</h3>
        ${q.wrong.map(w=>`<div class="wrong-item">#${w.word.num} ${esc(w.word.word)} — ${esc(w.word.def)}</div>`).join('')}
      </div>` : '<p class="all-correct">Perfect score! 🎉</p>'}
      <div class="results-actions">
        ${q.wrong.length ? `<button class="btn-secondary" id="review-wrong">Review These Words</button>`:''}
        <button class="btn-primary" id="retake-quiz">Retake Quiz</button>
        <button class="btn-ghost" id="new-quiz">New Quiz</button>
      </div>
    </div>
  `;
  if(q.wrong.length) el('#review-wrong').onclick = ()=>{
    flashState.list = q.wrong.map(x=>x.word); flashState.idx=0; flashState.flipped=false;
    flashState.filter='all'; switchView('flashcards');
  };
  el('#retake-quiz').onclick = ()=>{
    quizState = { questions: shuffle(q.questions.map(x=>x)), idx:0, correct:0, wrong:[], startTime: Date.now(), answered:false };
    renderQuizRunner();
  };
  el('#new-quiz').onclick = ()=> renderQuizSetup();
}

/* ---------- Daily Study Mode ---------- */
function buildDailyList(target){
  const due = getWordsByFilter('due');
  const diff = getWordsByFilter('difficult').filter(w=>!due.includes(w));
  const fresh = getWordsByFilter('new').filter(w=>!due.includes(w) && !diff.includes(w));
  const combined = [...due, ...diff, ...fresh];
  return combined.slice(0, target);
}
function renderDaily(){
  const t = todayStr();
  const doneList = (settings.todayCompleted[t] || []);
  const target = settings.dailyTarget;
  const list = buildDailyList(target).filter(w=>!doneList.includes(w.num));
  const container = el('#view-daily');
  const completed = doneList.length;
  const pct = Math.min(100, Math.round((completed/target)*100));
  if(list.length === 0){
    container.innerHTML = `
      <div class="card daily-complete">
        <h2>🎉 Great job!</h2>
        <p>You've completed today's target of ${target} words. Come back tomorrow, or adjust your target below.</p>
        ${dailyTargetControl()}
      </div>`;
    el('#daily-target-select').onchange = e=>{ settings.dailyTarget = parseInt(e.target.value,10); saveSettings(); renderDaily(); };
    return;
  }
  const w = list[0];
  const p = getProg(w.num);
  container.innerHTML = `
    <div class="progress-row">
      <div class="progress-label"><span>Today's Progress</span><span>${completed} / ${target}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    ${dailyTargetControl()}
    <div class="card study-card">
      <div class="study-card-top"><span class="serial-badge">#${w.num}</span>
        <button class="btn-icon" onclick="speak('${esc(w.word)}')">🔊</button></div>
      <div class="study-word">${esc(w.word)}</div>
      <div class="study-pron">${esc(w.pron)} <span class="pos-tag">${esc(w.pos)}</span></div>
      ${renderStudyDetail(w)}
    </div>
    <div class="sr-buttons">
      <button class="sr-btn again" data-grade="again">😣 Again</button>
      <button class="sr-btn hard" data-grade="hard">😕 Hard</button>
      <button class="sr-btn good" data-grade="good">🙂 Good</button>
      <button class="sr-btn easy" data-grade="easy">😄 Easy</button>
    </div>
  `;
  el('#daily-target-select').onchange = e=>{ settings.dailyTarget = parseInt(e.target.value,10); saveSettings(); renderDaily(); };
  els('.sr-btn').forEach(b=> b.onclick = ()=>{
    scheduleReview(w.num, b.dataset.grade);
    const t2 = todayStr();
    if(!settings.todayCompleted[t2]) settings.todayCompleted[t2] = [];
    settings.todayCompleted[t2].push(w.num);
    saveSettings();
    renderDaily();
  });
}
function dailyTargetControl(){
  return `<div class="form-row inline"><label>Daily target:</label>
    <select id="daily-target-select" class="select">
      ${[10,20,30].map(n=>`<option value="${n}" ${settings.dailyTarget===n?'selected':''}>${n} words</option>`).join('')}
      <option value="${settings.dailyTarget}" ${![10,20,30].includes(settings.dailyTarget)?'selected':''}>${![10,20,30].includes(settings.dailyTarget)?settings.dailyTarget+' words (custom)':'Custom...'}</option>
    </select></div>`;
}

      <button class="tab-btn ${listsTab==='favorites'?'active':''}" data-tab="favorites">★ Favorites (${getWordsByFilter('favorites').length})</button>

    ${list.length ? `
    <div class="list-actions">

    el('#list-quiz').onclick = ()=>{ switchView('quiz'); el('#q-source').value = listsTab; };

/* ---------- Progress / Analytics ---------- */
function renderProgress(){
  const s = computeStats();
  const container = el('#view-progress');
  const last7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    last7.push({label: d.toLocaleDateString('en-US',{weekday:'short'}), count: settings.dailyLog[key]||0});
  }
  const maxCount = Math.max(1, ...last7.map(d=>d.count));
  const barWidth = 40, gap = 16, chartH = 120;
  const bars = last7.map((d,i)=>{
    const h = Math.round((d.count/maxCount)*chartH);
    const x = i*(barWidth+gap);
    return `<rect x="${x}" y="${chartH-h}" width="${barWidth}" height="${h}" rx="4" class="bar"/>
      <text x="${x+barWidth/2}" y="${chartH+18}" class="bar-label" text-anchor="middle">${d.label}</text>
      <text x="${x+barWidth/2}" y="${chartH-h-6}" class="bar-value" text-anchor="middle">${d.count}</text>`;
  }).join('');
  const statuses = [
    {label:'New', val:s.newCount, color:'var(--c-muted)'},
    {label:'Learning', val:s.learning, color:'var(--c-accent2)'},
    {label:'Mastered', val:s.mastered, color:'var(--c-accent)'},
  ];
  const totalForPie = statuses.reduce((a,b)=>a+b.val,0) || 1;
  let cumulative = 0;
  const radius = 60, cx=70, cy=70;
  const pieSlices = statuses.map(st=>{
    const frac = st.val/totalForPie;
    const startAngle = cumulative*2*Math.PI;
    cumulative += frac;
    const endAngle = cumulative*2*Math.PI;
    const x1 = cx + radius*Math.sin(startAngle), y1 = cy - radius*Math.cos(startAngle);
    const x2 = cx + radius*Math.sin(endAngle), y2 = cy - radius*Math.cos(endAngle);
    const largeArc = (endAngle-startAngle) > Math.PI ? 1 : 0;
    if(frac === 0) return '';
    if(frac >= 0.999) return `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="${st.color}"/>`;
    return `<path d="M${cx},${cy} L${x1},${y1} A${radius},${radius} 0 ${largeArc} 1 ${x2},${y2} Z" fill="${st.color}"/>`;
  }).join('');
  container.innerHTML = `
    <div class="dash-grid">
      <div class="stat-card"><div class="stat-num">${s.total}</div><div class="stat-label">Total Words</div></div>
      <div class="stat-card accent"><div class="stat-num">${s.mastered}</div><div class="stat-label">Mastered</div></div>
      <div class="stat-card"><div class="stat-num">${s.newCount}</div><div class="stat-label">New</div></div>
      <div class="stat-card warn"><div class="stat-num">${s.difficult}</div><div class="stat-label">Difficult</div></div>
      <div class="stat-card"><div class="stat-num">${s.due}</div><div class="stat-label">Due for Review</div></div>
      <div class="stat-card"><div class="stat-num">${s.accuracy}%</div><div class="stat-label">Quiz Accuracy</div></div>
      <div class="stat-card accent2"><div class="stat-num">${settings.currentStreak}</div><div class="stat-label">Current Streak</div></div>
      <div class="stat-card"><div class="stat-num">${settings.longestStreak}</div><div class="stat-label">Longest Streak</div></div>
      <div class="stat-card"><div class="stat-num">${settings.quizStats.sessions}</div><div class="stat-label">Quiz Sessions</div></div>
    </div>
    <div class="chart-row">
      <div class="card chart-card">
        <h3>Last 7 Days — Words Studied</h3>
        <svg viewBox="0 0 ${7*(barWidth+gap)} ${chartH+30}" class="bar-chart">${bars}</svg>
      </div>
      <div class="card chart-card">
        <h3>Word Status Breakdown</h3>
        <svg viewBox="0 0 140 140" class="pie-chart">${pieSlices}</svg>
        <div class="pie-legend">
          ${statuses.map(st=>`<div class="legend-item"><span class="legend-dot" style="background:${st.color}"></span>${st.label}: ${st.val}</div>`).join('')}
        </div>
      </div>
    </div>
  `;
}

/* ---------- Settings ---------- */
function renderSettingsView(){
  const container = el('#view-settings');
  container.innerHTML = `
    <div class="card">
      <h2>Appearance</h2>
      <div class="form-row inline"><label>Theme</label>
        <button class="btn-sm" id="settings-theme-toggle">${settings.theme==='light'?'🌙 Switch to Dark':'☀️ Switch to Light'}</button>
      </div>
    </div>
    <div class="card">
      <h2>Backup</h2>
      <p class="muted">Export all your progress, notes, favorites, and statistics as a JSON file, or restore from a previous export.</p>
      <div class="form-row inline">
        <button class="btn-secondary" id="settings-export">⬇ Export Progress</button>
        <label class="btn-secondary file-label">⬆ Import Progress<input type="file" id="settings-import" accept=".json" hidden></label>
      </div>
      <div id="import-status"></div>
    </div>
    <div class="card">
      <h2>Reset</h2>
      <p class="muted">These actions cannot be undone.</p>
      <div class="form-row inline">
        <button class="btn-danger" id="reset-all">Reset All Progress</button>
        <button class="btn-danger" id="reset-quiz">Reset Quiz Stats Only</button>
        <button class="btn-danger" id="reset-schedule">Reset Review Schedule Only</button>
      </div>
    </div>
    <div class="card">
      <h2>Keyboard Shortcuts</h2>
      <div class="shortcuts-grid">
        <div><kbd>Space</kbd> Flip flashcard</div>
        <div><kbd>←</kbd> / <kbd>→</kbd> Previous / Next</div>
        <div><kbd>1</kbd>-<kbd>4</kbd> Again / Hard / Good / Easy</div>
        <div><kbd>F</kbd> Toggle favorite</div>
        <div><kbd>D</kbd> Toggle difficult</div>
        <div><kbd>L</kbd> Mark learned</div>
      </div>
    </div>
  `;
  el('#settings-theme-toggle').onclick = ()=>{ toggleTheme(); renderSettingsView(); };
  el('#settings-export').onclick = exportData;
  el('#settings-import').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const ok = importData(reader.result);
      el('#import-status').innerHTML = ok ? `<p class="ok-msg">✅ Progress imported successfully.</p>` : `<p class="err-msg">❌ Could not read that file.</p>`;
      if(ok) renderCurrentView();
    };
    reader.readAsText(file);
  };
  el('#reset-all').onclick = ()=>{ if(confirm('Reset ALL progress? This cannot be undone.')){ resetAllProgress(); renderSettingsView(); } };
  el('#reset-quiz').onclick = ()=>{ if(confirm('Reset quiz statistics only?')){ resetQuizStats(); renderSettingsView(); } };
  el('#reset-schedule').onclick = ()=>{ if(confirm('Reset the spaced-repetition review schedule?')){ resetReviewSchedule(); renderSettingsView(); } };
}

/* ---------- Global Search ---------- */
function renderSearchResults(query){
  const results = searchWords(query);
  const box = el('#search-results');
  if(!query.trim()){ box.classList.remove('open'); box.innerHTML=''; return; }
  box.classList.add('open');
  if(results.length === 0){ box.innerHTML = `<div class="search-empty">No matches found.</div>`; return; }
  box.innerHTML = results.slice(0,30).map(w=>`
    <div class="search-item" data-num="${w.num}">
      <span class="chip-num">#${w.num}</span> <strong>${esc(w.word)}</strong> — ${esc(w.def)}
    </div>`).join('');
  els('.search-item').forEach(item=> item.onclick = ()=>{
    const num = parseInt(item.dataset.num,10);
    const idx = VOCAB.findIndex(w=>w.num===num);
    studyState.filter='all'; studyState.list = VOCAB; studyState.idx = idx; studyState.revealed = true;
    switchView('study');
    el('#global-search').value=''; box.classList.remove('open');
  });
}

/* ---------- Keyboard Shortcuts ---------- */
document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;
  if(currentView === 'flashcards'){
    if(e.code === 'Space'){ e.preventDefault(); el('#flashcard') && el('#flashcard').click(); return; }
    if(e.key === 'ArrowLeft'){ el('#flash-prev') && el('#flash-prev').click(); return; }
    if(e.key === 'ArrowRight'){ el('#flash-next') && el('#flash-next').click(); return; }
    if(['1','2','3','4'].includes(e.key) && flashState.flipped){
      const map = {'1':'again','2':'hard','3':'good','4':'easy'};
      const btn = els('.sr-btn').find(b=>b.dataset.grade===map[e.key]);
      if(btn) btn.click();
      return;
    }
    if(e.key.toLowerCase() === 'f'){ el('#flash-fav') && el('#flash-fav').click(); return; }
  }
  if(currentView === 'study'){
    if(e.key === 'ArrowLeft'){ el('#study-prev') && el('#study-prev').click(); return; }
    if(e.key === 'ArrowRight'){ el('#study-next') && el('#study-next').click(); return; }
    if(e.key.toLowerCase() === 'f'){ const w = studyState.list[studyState.idx]; if(w){ toggleFav(w.num); renderStudy(); } return; }
    if(e.key.toLowerCase() === 'd'){ const w = studyState.list[studyState.idx]; if(w){ toggleDifficult(w.num); renderStudy(); } return; }
    if(e.key.toLowerCase() === 'l'){ const w = studyState.list[studyState.idx]; if(w){ toggleLearned(w.num); renderStudy(); } return; }
  }
});

/* ---------- Init ---------- */
function initApp(){
  loadState();
  applyTheme();
  els('.nav-btn').forEach(b=> b.onclick = ()=> switchView(b.dataset.view));
  el('#theme-toggle-btn').onclick = ()=>{ toggleTheme(); renderCurrentView(); };
  const searchInput = el('#global-search');
  searchInput.addEventListener('input', ()=> renderSearchResults(searchInput.value));
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.search-wrap')){ el('#search-results').classList.remove('open'); }
  });
  switchView('dashboard');
}
document.addEventListener('DOMContentLoaded', initApp);

</script>
