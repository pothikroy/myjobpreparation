tr><td><p>ইনপুট ডিভাইস</p></td><td><p>কি-বোর্ড, মাউস, স্ক্যানার, মাইক্রোফোন, OMR, OCR, MICR (ব্যাংকের চেক), বারকোড রিডার, ওয়েবক্যাম</p></td></tr><tr><td><p>আউটপুট ডিভাইস</p></td><td><p>মনিটর, প্রিন্টার, প্লটার, স্পিকার, প্রজেক্টর। (টাচস্ক্রিন — ইনপুট ও আউটপুট দুটোই)</p></td></tr><tr><td><p>সফটওয়্যার</p></td><td><p>সিস্টেম সফটওয়্যার (অপারেটিং সিস্টেম: Windows, Linux, macOS, Android) ও অ্যাপ্লিকেশন সফটওয়্যার (MS Word, Excel, ব্রাউজার)। ওপেন সোর্স: Linux, Android, LibreOffice</p></td></tr><tr><td><p>প্রোগ্রামিং ভাষা</p></td><td><p>মেশিন ভাষা (০ ও ১) → অ্যাসেম্বলি → উচ্চস্তরের ভাষা (C, Java, Python)। অনুবাদক: কম্পাইলার (একসাথে পুরো প্রোগ্রাম), ইন্টারপ্রেটার (লাইন ধরে ধরে), অ্যাসেম্বলার</p></td></tr></tbody></table><h3><strong>সংখ্যা পদ্ধতি</strong></h3><ul><li>বাইনারি (ভিত্তি ২), অক্টাল (৮), ডেসিমাল (১০), হেক্সাডেসিমাল (১৬: ০-৯, A-F)।</li><li><strong>উদাহরণ:</strong> (১৩)₁₀ → বাইনারি: ১৩ = ৮ + ৪ + ১ = <strong>১১০১</strong>₂। আবার (১০১০)₂ = ৮ + ২ = <strong>১০</strong>। (FF)₁₆ = ১৫×১৬ + ১৫ = <strong>২৫৫</strong>।</li><li><strong>লজিক গেট:</strong> AND (সব ইনপুট ১ হলে আউটপুট ১), OR (যেকোনো একটি ১ হলে ১), NOT (উল্টো)। <strong>NAND ও NOR — সর্বজনীন গেট</strong>।</li></ul><h2><a id=\"_Toc143\"></a><strong>১৩.৫ ইন্টারনেট ও নেটওয়ার্ক</strong></h2><table><thead><tr><th><p><strong>শব্দ</strong></p></th><th><p><strong>অর্থ</strong></p></th></tr></thead><tbody><tr><td><p>LAN / MAN / WAN / PAN</p></td><td><p>স্থানীয় (ভবন), শহরভিত্তিক, বিস্তৃত (দেশ-মহাদেশ; ইন্টারনেট বৃহত্তম WAN), ব্যক্তিগত (ব্লুটুথ)</p></td></tr><tr><td><p>টপোলজি</p></td><td><p>বাস, স্টার (হাব/সুইচকেন্দ্রিক — বহুল ব্যবহৃত), রিং, মেশ, ট্রি</p></td></tr><tr><td><p>প্রোটোকল</p></td><td><p><strong>HTTP/HTTPS</strong> (ওয়েব; S = নিরাপদ/এনক্রিপ্টেড), <strong>FTP</strong> (ফাইল স্থানান্তর), <strong>SMTP</strong> (ইমেইল পাঠানো), <strong>POP3/IMAP</strong> (ইমেইল গ্রহণ), <strong>TCP/IP</strong> (ইন্টারনেটের মূল প্রোটোকল), <strong>DNS</strong> (ডোমেইন নামকে IP ঠিকানায় রূপান্তর)</p></td></tr><tr><td><p>IP ঠিকানা</p></td><td><p>IPv4 — ৩২ বিট (যেমন 192.168.0.1); IPv6 — ১২৮ বিট</p></td></tr><tr><td><p>URL</p></td><td><p>Uniform Resource Locator — ওয়েব ঠিকানা; WWW-এর উদ্ভাবক <strong>টিম বার্নার্স-লি</strong> (১৯৮৯-৯১, CERN)</p></td></tr><tr><td><p>ডিভাইস</p></td><td><p>মডেম (ডিজিটাল ↔ অ্যানালগ), রাউটার (ভিন্ন নেটওয়ার্ক যুক্ত করে), সুইচ, হাব, রিপিটার (সিগন্যাল বাড়ায়), গেটওয়ে</p></td></tr><tr><td><p>মাধ্যম</p></td><td><p>টুইস্টেড পেয়ার, কোএক্সিয়াল, <strong>অপটিক্যাল ফাইবার</strong> (দ্রুততম; আলোর পূর্ণ অভ্যন্তরীণ প্রতিফলন), ওয়্যারলেস (Wi-Fi, ব্লুটুথ, মাইক্রোওয়েভ, স্যাটেলাইট)</p></td></tr><tr><td><p>OSI মডেল (৭ স্তর)</p></td><td><p>Physical → Data Link → Network → Transport → Session → Presentation → Application</p></td></tr><tr><td><p>ক্লাউড কম্পিউটিং</p></td><td><p>ইন্টারনেটের মাধ্যমে চাহিদামাফিক সার্ভার/স্টোরেজ/সফটওয়্যার — SaaS, PaaS, IaaS</p></td></tr><tr><td><p>মোবাইল প্রজন্ম</p></td><td><p>১G অ্যানালগ ভয়েস → ২G (GSM, SMS) → ৩G → ৪G (LTE) → ৫G। বাংলাদেশে ৫G পরীক্ষামূলক চালু ১২ ডিসেম্বর ২০২১ (টেলিটক) ⚠</p></td></tr></tbody></table><ul><li><strong>সাবমেরিন কেবল:</strong> বাংলাদেশ SEA-ME-WE-4 (২০০৬, কক্সবাজার) ও SEA-ME-WE-5 (২০১৭, কুয়াকাটা)-এর সাথে যুক্ত। পরিচালনায় বাংলাদেশ সাবমেরিন কেবলস পিএলসি।</li></ul><h2><a id=\"_Toc144\"></a><strong>১৩.৬ সাইবার নিরাপত্তা</strong></h2><table><thead><tr><th><p><strong>শব্দ</strong></p></th><th><p><strong>অর্থ</strong></p></th></tr></thead><tbody><tr><td><p>ভাইরাস / ওয়ার্ম / ট্রোজান</p></td><td><p>ভাইরাস নিজেকে অন্য ফাইলে যুক্ত করে ছড়ায়; ওয়ার্ম নিজে নিজে নেটওয়ার্কে ছড়ায়; ট্রোজান উপকারী প্রোগ্রামের ছদ্মবেশে আসে</p></td></tr><tr><td><p>র‍্যানসমওয়্যার</p></td><td><p>ফাইল এনক্রিপ্ট করে মুক্তিপণ দাবি (যেমন WannaCry, ২০১৭)</p></td></tr><tr><td><p>ফিশিং</p></td><td><p>ভুয়া ইমেইল/ওয়েবসাইট দিয়ে পাসওয়ার্ড বা ব্যাংক তথ্য চুরি</p></td></tr><tr><td><p>DoS / DDoS</p></td><td><p>অসংখ্য অনুরোধ পাঠিয়ে সার্ভার অচল করা</p></td></tr><tr><td><p>ফায়ারওয়াল</p></td><td><p>নেটওয়ার্কে আসা-যাওয়া তথ্য ছেঁকে অননুমোদিত প্রবেশ ঠেকায়</p></td></tr><tr><td><p>এনক্রিপশন</p></td><td><p>তথ্যকে সংকেতে রূপান্তর; শুধু চাবিধারী পড়তে পারে (প্রতিরক্ষা মন্ত্রণালয়ের “গুপ্তসংকেত পরিদপ্তর”-এর কাজের সাথে সম্পর্কিত)</p></td></tr><tr><td><p>টু-ফ্যাক্টর অথেনটিকেশন (2FA)</p></td><td><p>পাসওয়ার্ডের সাথে দ্বিতীয় প্রমাণ (OTP)</p></td></tr><tr><td><p>বাংলাদেশ ব্যাংক রিজার্ভ চুরি</p></td><td><p>ফেব্রুয়ারি ২০১৬; SWIFT ব্যবস্থার অপব্যবহার করে নিউইয়র্ক ফেডের অ্যাকাউন্ট থেকে ৮১ মিলিয়ন ডলার ফিলিপাইনে স্থানান্তর</p></td></tr></tbody></table><h2><a id=\"_Toc145\"></a><strong>১৩.৭ কৃত্রিম বুদ্ধিমত্তা ও নতুন প্রযুক্তি</strong></h2><ul><li><strong>কৃত্রিম বুদ্ধিমত্তা (AI):</strong> যন্ত্রকে মানুষের মতো শেখা, যুক্তি ও সিদ্ধান্ত নেওয়ার ক্ষমতা দেওয়া। শব্দটির প্রবর্তক <strong>জন ম্যাকার্থি</strong> (১৯৫৬, ডার্টমাউথ সম্মেলন)। <strong>অ্যালান টুরিং</strong> — টুরিং টেস্ট (১৯৫০)।</li><li><strong>মেশিন লার্নিং:</strong> তথ্য থেকে নিজে নিজে শেখা; <strong>ডিপ লার্নিং:</strong> বহুস্তরের নিউরাল নেটওয়ার্ক; <strong>জেনারেটিভ AI / LLM:</strong> লেখা, ছবি, কোড তৈরি করে (ChatGPT, Claude, Gemini ইত্যাদি)।</li><li><strong>রোবট সোফিয়া:</strong> হ্যানসন রোবোটিক্স (হংকং) নির্মিত; ২০১৭ সালে সৌদি আরবের নাগরিকত্ব পায় (২০১৮ প্র. ৪৮)।</li><li><strong>অন্যান্য:</strong> IoT (ইন্টারনেট অব থিংস), ব্লকচেইন (বিটকয়েন — ২০০৯, ছদ্মনাম সাতোশি নাকামোতো), বিগ ডেটা, ভার্চুয়াল রিয়েলিটি (VR) ও অগমেন্টেড রিয়েলিটি (AR), কোয়ান্টাম কম্পিউটিং (কিউবিট), ন্যানোটেকনোলজি (১ ন্যানোমিটার = ১০⁻⁹ মিটার), ৩D প্রিন্টিং।</li><li><strong>প্রতিরক্ষা প্রযুক্তি:</strong> ড্রোন/UAV, স্টেলথ প্রযুক্তি (রাডারে ধরা না পড়া), হাইপারসনিক ক্ষেপণাস্ত্র (শব্দের ৫ গুণের বেশি বেগ — Mach 5+), আকাশ প্রতিরক্ষা ব্যবস্থা (S-400, Iron Dome), AWACS (২০১৯ প্র. ৭২), GPS (যুক্তরাষ্ট্র), GLONASS (রাশিয়া), Galileo (EU), BeiDou (চীন)।</li></ul><h2><a id=\"_Toc146\"></a><strong>১৩.৮ মহাকাশ</strong></h2><table><thead><tr><th><p><strong>বিষয়</strong></p></th><th><p><strong>তথ্য</strong></p></th></tr></thead><tbody><tr><td><p>সৌরজগৎ</p></td><td><p>৮টি গ্রহ (প্লুটো ২০০৬ থেকে বামন গ্রহ)। বৃহত্তম বৃহস্পতি; ক্ষুদ্রতম ্যার গুণফল + ১ সবসময় পূর্ণবর্গ (২০১৯ প্র. ৫৩)।</li><li><strong>সাধারণ কৌশল:</strong> সংখ্যা/অক্ষর-ধারায় প্রথমে ব্যবধান দেখুন (যোগ, গুণ, বর্গ, মৌলিক সংখ্যা), তারপর বিকল্প বাদ দিন।</li></ul><p>প্রতিটি ধরনের পদ্ধতি ও উদাহরণ নিচে ১৪.১–১৪.৮-এ।</p><p><strong>সংস্করণ ৪ — বিস্তারিত নোট (১৪.১–১৪.৮):</strong> তিনটি প্রশ্নপত্রে সরাসরি রিজনিং প্রশ্ন ছিল না, তাই এটি অগ্রাধিকার D। তবে অন্যান্য সরকারি পরীক্ষায় (বিশেষ করে বিসিএস-এর “মানসিক দক্ষতা” অংশে) এগুলো নিয়মিত আসে, আর প্রশ্নপত্রের ধরন বদলাতে পারে। তাই প্রতিটি ধরনের পদ্ধতি ও সমাধানসহ উদাহরণ দিলাম (সব উদাহরণ আমার তৈরি)।</p><h2><a id=\"_Toc148\"></a><strong>১৪.১ সংখ্যা ও অক্ষর ধারা (Series)</strong></h2><ul><li><strong>ধাপে ধাপে:</strong> (১) পরপর পদের পার্থক্য দেখুন; (২) পার্থক্যও না মিললে পার্থক্যের পার্থক্য; (৩) গুণ/ভাগ (অনুপাত) দেখুন; (৪) বর্গ/ঘন (১, ৪, ৯, ১৬… / ১, ৮, ২৭…); (৫) মৌলিক সংখ্যা; (৬) একান্তর (বিজোড় স্থান ও জোড় স্থান আলাদা দুটি ধারা)।</li></ul><table><thead><tr><th><p><strong>ধারা</strong></p></th><th><p><strong>উত্তর</strong></p></th><th><p><strong>নিয়ম</strong></p></th></tr></thead><tbody><tr><td><p>২, ৫, ১০, ১৭, ২৬, ?</p></td><td><p>৩৭</p></td><td><p>পার্থক্য ৩, ৫, ৭, ৯, ১১ (অথবা n² + 1)</p></td></tr><tr><td><p>৩, ৬, ১২, ২৪, ?</p></td><td><p>৪৮</p></td><td><p>প্রতিবার × ২</p></td></tr><tr><td><p>১, ৮, ২৭, ৬৪, ?</p></td><td><p>১২৫</p></td><td><p>ঘন সংখ্যা</p></td></tr><tr><td><p>২, ৩, ৫, ৭, ১১, ?</p></td><td><p>১৩</p></td><td><p>মৌলিক সংখ্যা</p></td></tr><tr><td><p>১, ১, ২, ৩, ৫, ৮, ?</p></td><td><p>১৩</p></td><td><p>ফিবোনাচ্চি — আগের দুই পদের যোগফল</p></td></tr><tr><td><p>৫, ১০, ৮, ১৬, ১৪, ?</p></td><td><p>২৮</p></td><td><p>একান্তর: × ২, − ২</p></td></tr><tr><td><p>A, C, F, J, ?</p></td><td><p>O</p></td><td><p>অবস্থান ১, ৩, ৬, ১০, ১৫ (পার্থক্য ২, ৩, ৪, ৫)</p></td></tr><tr><td><p>Z, X, V, T, ?</p></td><td><p>R</p></td><td><p>প্রতিবার ২ ধাপ পিছনে</p></td></tr></tbody></table><p><strong>অক্ষরের অবস্থান মুখস্থ রাখুন:</strong> E = ৫, J = ১০, O = ১৫, T = ২০, Y = ২৫ (“EJOTY”)। উল্টো অবস্থান = ২৭ − অবস্থান (A↔Z, B↔Y, M↔N)।</p><h2><a id=\"_Toc149\"></a><strong>১৪.২ সাদৃশ্য (Analogy) ও বেমানান খোঁজা (Odd one out)</strong></h2><ul><li><strong>সাদৃশ্য:</strong> প্রথম জোড়ার সম্পর্ক এক বাক্যে বলুন, তারপর বিকল্পে একই সম্পর্ক খুঁজুন। যেমন — ডাক্তার : হাসপাতাল :: শিক্ষক : <strong>বিদ্যালয়</strong> (কর্মস্থল); পাখি : বাসা :: মৌমাছি : <strong>মৌচাক</strong>; ৩ : ২৭ :: ৪ : <strong>৬৪</strong> (ঘন)।</li><li><strong>বেমানান:</strong> সব বিকল্পে একটি সাধারণ বৈশিষ্ট্য খুঁজুন। যেমন — ২, ৩, ৫, <strong>৯</strong>, ১১ (৯ মৌলিক নয়); গোলাপ, শাপলা, জবা, <strong>আম</strong> (আম ফুল নয়, ফল); মঙ্গল, বুধ, <strong>চাঁদ</strong>, শুক্র (চাঁদ গ্রহ নয়, উপগ্রহ)। ২০১৯ প্র. ৭৯-এর সতর্কতা (অধ্যায় ৫) দেখুন — বিকল্পগুলো একই শ্রেণির কি না আগে নিশ্চিত হোন।</li></ul><h2><a id=\"_Toc150\"></a><strong>১৪.৩ কোডিং-ডিকোডিং</strong></h2><ul><li><strong>অক্ষর সরানো:</strong> যদি COLD-কে লেখা হয় DPME (প্রতিটি অক্ষর ১ ধাপ সামনে), তাহলে WARM = <strong>XBSN</strong>।</li><li><strong>অবস্থানের সংখ্যা:</strong> যদি CAT = ৩১২০ (C = ৩, A = ১, T = ২০), তাহলে DOG = <strong>৪১৫৭</strong> (D = ৪, O = ১৫, G = ৭)।</li><li><strong>উল্টো লেখা:</strong> যদি PEN-কে লেখা হয় NEP, তাহলে BOOK = <strong>KOOB</strong>।</li></ul><h2><a id=\"_Toc151\"></a><strong>১৪.৪ দিক নির্ণয় (Direction)</strong></h2><ul><li><strong>কৌশল:</strong> খাতায় ছোট নকশা আঁকুন — ওপরে উত্তর, ডানে পূর্ব। ডানে ঘোরা = ঘড়ির কাঁটার দিকে ৯০°।</li><li><strong>উদাহরণ:</strong> একজন ১০ মিটার উত্তরে গেল, ডানে ঘুরে ৬ মিটার, আবার ডানে ঘুরে ১০ মিটার গেল। এখন সে শুরুর বিন্দু থেকে <strong>৬ মিটার পূর্বে</strong>।</li><li><strong>কোনাকুনি দূরত্ব:</strong> ৩ কিমি পূর্বে গিয়ে ৪ কিমি উত্তরে গেলে শুরু থেকে সরাসরি দূরত্ব = √(৯ + ১৬) = <strong>৫ কিমি</strong>, দিক উত্তর-পূর্ব। <strong>সকালে ছায়া পশ্চিমে, বিকেলে পূর্বে পড়ে</strong> (সূর্য পূর্বে উঠে পশ্চিমে অস্ত যায়)।</li></ul><h2><a id=\"_Toc152\"></a><strong>১৪.৫ রক্তের সম্পর্ক (Blood relation)</strong></h2><ul><li><strong>কৌশল:</strong> “আমি” থেকে শুরু করে ধাপে ধাপে সম্পর্ক বসান; প্রজন্ম ওপরে-নিচে আঁকুন।</li><li><strong>উদাহরণ ১:</strong> “আমার বাবার একমাত্র ছেলের ছেলে” → বাবার একমাত্র ছেলে = আমি → <strong>আমার ছেলে</strong>।</li><li><strong>উদাহরণ ২:</strong> একটি ছবি দেখিয়ে রহিম বলল, “ওর মা আমার মায়ের একমাত্র মেয়ে।” → রহিমের মায়ের একমাত্র মেয়ে = রহিমের বোন → ছবির ব্যক্তি <strong>রহিমের ভাগ্নে বা ভাগ্নি</strong>।</li></ul><h2><a id=\"_Toc153\"></a><strong>১৪.৬ ঘড়ি ও ক্যালেন্ডার</strong></h2><ul><li><strong>ঘড়ির কাঁটার কোণ = |৩০H − ৫.৫M|</strong> (H = ঘণ্টা, M = মিনিট); ফল ১৮০°-এর বেশি হলে ৩৬০° থেকে বিয়োগ করুন। কারণ: ঘণ্টার কাঁটা প্রতি মিনিটে ০.৫° এবং মিনিটের কাঁটা প্রতি মিনিটে ৬° ঘোরে।</li><li><strong>উদাহরণ:</strong> ৩টা ৩০ মিনিটে → |৯০ − ১৬৫| = <strong>৭৫°</strong>। ৯টা বাজে → |২৭০ − ০| = ২৭০ → ৩৬০ − ২৭০ = <strong>৯০°</strong>।</li><li><strong>ঘড়ির তথ্য:</strong> ১২ ঘণ্টায় দুই কাঁটা ১১ বার মিলিত হয় (২৪ ঘণ্টায় ২২ বার); ঘণ্টার কাঁটা ১ ঘণ্টায় ৩০° ঘোরে (BB AD ২০০৯-এ “প্রতি মিনিটে ১/৬০ ডিগ্রি” দেওয়া ছিল, যা বাস্তবে ভুল তথ্য — তাই সেটি বাদ দেওয়া হয়েছে)।</li><li><strong>ক্যালেন্ডার — বিজোড় দিন (odd days):</strong> সাধারণ বছর = ৩৬৫ দিন = ৫২ সপ্তাহ + <strong>১ দিন</strong>; অধিবর্ষ = <strong>২ দিন</strong>। তাই কোনো তারিখ পরের বছর এক বার (অধিবর্ষ পেরোলে দুই বার) সামনে সরে। <strong>অধিবর্ষ:</strong> ৪ দ্বারা বিভাজ্য; শতাব্দী বছর হলে ৪০০ দ্বারা বিভাজ্য হতে হবে (২০০০ অধিবর্ষ, ১৯০০ নয়)।</li></ul><h2><a id=\"_Toc154\"></a><strong>১৪.৭ যুক্তি: বিবৃতি ও সিদ্ধান্ত (Syllogism)</strong></h2><ul><li><strong>কৌশল:</strong> ভেন চিত্র আঁকুন। “সব A হয় B” → A-এর বৃত্ত B-এর ভেতরে। “কিছু A হয় B” → বৃত্ত দুটি আংশিক মিশে যায়। “কোনো A B নয়” → বৃত্ত দুটি আলাদা।</li><li><strong>উদাহরণ:</strong> বিবৃতি — সব কলম বই; সব বই খাতা। সিদ্ধান্ত: (১) সব কলম খাতা ✔ (নিশ্চিত) (২) সব খাতা কলম ✗ (নিশ্চিত নয়) (৩) কিছু খাতা বই ✔।</li><li><strong>সাধারণ ফাঁদ:</strong> “সব A হয় B” থেকে “সব B হয় A” বের করা যায় না, কিন্তু “কিছু B হয় A” বের করা যায়।</li></ul><h2><a id=\"_Toc155\"></a><strong>১৪.৮ উপাত্ত ব্যাখ্যা (Data interpretation) — মৌলিক কৌশল</strong></h2><ul><li>প্রশ্ন আগে পড়ুন, তারপর সারণি/চিত্রে শুধু দরকারি সংখ্যা খুঁজুন। শতকরা বৃদ্ধি = (নতুন − পুরনো)/পুরনো × ১০০। গড় = মোট/সংখ্যা। পাই-চিত্রে ৩৬০° = ১০০%, তাই ১% = ৩.৬°।</li><li><strong>উদাহরণ:</strong> কোনো বাজেটের পাই-চিত্রে প্রতিরক্ষা খাতের কোণ ৫৪° হলে প্রতিরক্ষার অংশ = ৫৪/৩৬০ × ১০০ = <strong>১৫%</strong>।</li></ul>"},{"title":"অধ্যায় ১৫: সাম্প্রতিক বিষয়াবলি (গবেষণার তারিখ: ৮ নভেম্বর ২০২৬)","html":"<h2><a id=\"_Toc157\"></a><strong>১৫.১ বিগত পরীক্ষাগুলোতে সাম্প্রতিক ঘটনার “সময়-জানালা”</strong></h2><table><thead><tr><th><p><strong>পরীক্ষা</strong></p></th><th><p><strong>প্রশ্নে আসা সাম্প্রতিক ঘটনা</strong></p></th><th><p><strong>পরীক্ষার আগের ব্যবধান (আনুমানিক)</strong></p></th></tr></thead><tbody><tr><td><p>২০১৯ (৫ এপ্রিল)</p></td><td><p>পুলওয়ামা হামলা — ১৪ ফেব্রুয়ারি ২০১৯ (প্র. ৬৫); স্বাধীনতা পদক ২০১৯ (প্র. ৭১); ২০১৯-এর জিডিপি প্রবৃদ্ধির লক্ষ্য (প্র. ৭৪)</p></td><td><p>প্রায় ৫০ দিন; কয়েক মাস</p></td></tr><tr><td><p>২০১৮ (তারিখ PDF-এ নেই)</p></td><td><p>ডোকলাম (২০১৭), Fire and Fury (জানুয়ারি ২০১৮), রোবট সোফিয়া</p></td><td><p>পরীক্ষার তারিখ অজানা — তাই ব্যবধান বলা যাচ্ছে না</p></td></tr><tr><td><p>২০২৩ (৩ ফেব্রুয়ারি)</p></td><td><p>ডেল্টাক্রন (জানুয়ারি ২০২২ — ~১২ মাস আগে); কমলা হ্যারিস (নভেম্বর ২০২১ — ~১৫ মাস, বাতিল); লিঙ্গবৈষম্য প্রতিবেদন ২০২১ (~২২ মাস); চিলাহাটি–হলদিবাড়ি রেল (ডিসেম্বর ২০২০ — ~২৬ মাস)</p></td><td><p>১ মাস থেকে ২+ বছর পর্যন্ত</p></td></tr></tbody></table><p><strong>সিদ্ধান্ত (সীমিত প্রমাণে):</strong> এই মন্ত্রণালয়ের প্রশ্নে সাম্প্রতিক ঘটনার সময়-পরিসর স্থির নয়; ২০২৩-এ প্রায় ২ বছর পিছনেও গিয়েছে। তাই শুধু শেষ ৬ মাস নয়, <strong>শেষ ১২-২৪ মাস</strong> পড়া নিরাপদ। প্রকৃতিগতভাবে: জাতীয়/আন্তর্জাতিক/স্বাস্থ্য/অবকাঠামো/পুরস্কার-সূচক — কোনো একটি ক্ষেত্রে সীমাবদ্ধ নয়।</p><h2><a id=\"_Toc158\"></a><strong>১৫.২ যাচাইকৃত সাম্প্রতিক তথ্য (২০২৬)</strong></h2><table><thead><tr><th><p><strong>তারিখ</strong></p></th><th><p><strong>ঘটনা</strong></p></th><th><p><strong>গুরুত্বপূর্ণ তথ্য</strong></p></th><th><p><strong>সূত্র (বিস্তারিত তথ্যসূত্রে)</strong></p></th></tr></thead><tbody><tr><td> /strong> ‘যা সহজে পাওয়া যায় না’ — এক কথায়? ক) অলভ্য খ) দুষ্প্রাপ্য গ) দুর্লভ ঘ) অপ্রাপ্য</p><p><strong>20.</strong> ‘ধরাকে সরা জ্ঞান’ বাগধারার অর্থ? ক) অহংকারে সবকিছু তুচ্ছ করা খ) দুর্বলতা গ) ভূমিকম্প ঘ) মাটির পাত্র</p><p><strong>21.</strong> ‘অরণ্যে রোদন’ এর অর্থ? ক) বিলাপ খ) নিষ্ফল আবেদন গ) দুঃখ ঘ) বনে কান্না</p><p><strong>22.</strong> ‘তাসের ঘর’ বাগধারার অর্থ? ক) মজবুত ঘর খ) জুয়ার আসর গ) খেলাঘর ঘ) ক্ষণস্থায়ী/ভঙ্গুর</p><p><strong>23.</strong> Secretariat এর বাংলা পরিভাষা? ক) মন্ত্রণালয় খ) পরিষদ গ) সচিবালয় ঘ) দপ্তর</p><p><strong>24.</strong> Ambassador এর বাংলা? ক) প্রতিনিধি খ) হাইকমিশনার গ) রাষ্ট্রদূত ঘ) কনসাল</p><p><strong>25.</strong> ‘প্রভাব’ শব্দে কোন উপসর্গ? ক) পরি খ) প্রা গ) প্রতি ঘ) প্র</p><p><strong>26.</strong> ‘লালসালু’ উপন্যাসের লেখক? ক) আবু ইসহাক খ) শওকত ওসমান গ) জহির রায়হান ঘ) সৈয়দ ওয়ালীউল্লাহ</p><p><strong>27.</strong> ‘মেঘনাদবধ কাব্য’ এর রচয়িতা? ক) নবীনচন্দ্র সেন খ) হেমচন্দ্র গ) মাইকেল মধুসূদন দত্ত ঘ) ভারতচন্দ্র</p><p><strong>28.</strong> বাংলা উপন্যাসের জনক কে? ক) মানিক খ) বঙ্কিমচন্দ্র চট্টোপাধ্যায় গ) শরৎচন্দ্র ঘ) রবীন্দ্রনাথ</p><p><strong>29.</strong> ‘কবর’ নাটকের রচয়িতা? ক) মুনীর চৌধুরী খ) আসকার ইবনে শাইখ গ) সেলিম আল দীন ঘ) সৈয়দ শামসুল হক</p><h2><a id=\"_Toc172\"></a><strong>English অনুশীলন-সেট (৩০টি)</strong></h2><p><strong>1.</strong> She is good ___ English. ক) on খ) with গ) in ঘ) at</p><p><strong>2.</strong> He has been living here ___ 2010. ক) in খ) from গ) since ঘ) for</p><p><strong>3.</strong> Look ___ the word in the dictionary. ক) up খ) into গ) for ঘ) after</p><p><strong>4.</strong> If he ___ hard, he would pass. ক) will work খ) had worked গ) works ঘ) worked</p><p><strong>5.</strong> By next year, I ___ my degree. ক) will have completed খ) completed গ) complete ঘ) will complete</p><p><strong>6.</strong> The teacher, along with the students, ___ present. ক) were খ) have গ) is ঘ) are</p><p><strong>7.</strong> Each of the boys ___ a book. ক) are খ) has গ) have ঘ) were</p><p><strong>8.</strong> He denied ___ the money. ক) take কবে? ক) ১ আগস্ট খ) ১৯ জুলাই গ) ২১ জুলাই ঘ) ২১ নভেম্বর</p><p><strong>2.</strong> জাতিসংঘ শান্তিরক্ষায় বাংলাদেশ প্রথম অংশ নেয় কোন সালে? ক) ১৯৮৮ খ) ১৯৯১ গ) ২০০১ ঘ) ১৯৯৫</p><p><strong>3.</strong> বাংলাদেশের প্রথম শান্তিরক্ষা মিশন কোথায়? ক) কঙ্গো খ) ইরান-ইরাক গ) সোমালিয়া ঘ) রুয়ান্ডা</p><p><strong>4.</strong> মার্চ ২০২৬ অনুযায়ী শান্তিরক্ষায় সেনা-অবদানে বাংলাদেশের অবস্থান? ক) ২য় খ) ৩য় গ) ১ম ঘ) ৪র্থ</p><p><strong>5.</strong> বীরশ্রেষ্ঠ খেতাবপ্রাপ্ত মোট কতজন? ক) ৭ খ) ১১ গ) ৯ ঘ) ৫</p><p><strong>6.</strong> ১৯৭৩ সালের গেজেটে বীর উত্তম পান কতজন? ক) ১৭৫ খ) ৬৮ গ) ৪২৬ ঘ) ৫০</p><p><strong>7.</strong> মুক্তিযুদ্ধের সর্বোচ্চ বীরত্বসূচক খেতাব? ক) বীর প্রতীক খ) বীর বিক্রম গ) বীরশ্রেষ্ঠ ঘ) বীর উত্তম</p><p><strong>8.</strong> নিচের কে বীরশ্রেষ্ঠ নন? ক) মতিউর রহমান খ) নূর মোহাম্মদ শেখ গ) জামিল উদ্দিন আহমদ ঘ) রুহুল আমিন</p><p><strong>9.</strong> বাংলাদেশ নৌবাহিনীর সাবমেরিন নবযাত্রা ও জয়যাত্রা কোন দেশ থেকে? ক) চীন খ) তুরস্ক গ) রাশিয়া ঘ) ভারত</p><p><strong>10.</strong> AWACS-এর পূর্ণরূপ? ক) Associated War Command System খ) Air Wings and Control Systems গ) Airborne Warning and Control System ঘ) Allied War Control System</p><p><strong>11.</strong> S-400 কী? ক) আকাশ-প্রতিরক্ষা ব্যবস্থা খ) যুদ্ধবিমান গ) সাবমেরিন ঘ) কামান</p><p><strong>12.</strong> Ordnance-এর বাংলা? ক) আদেশ খ) ক্রম গ) সমরাস্ত্র ঘ) অধ্যাদেশ</p><p><strong>13.</strong> ISPR-এর পূর্ণরূপ? ক) Internal Service Press Room খ) Inter-State Public Relations গ) Inter-Services Public Relations ঘ) International Security Police Regiment</p><p><strong>14.</strong> স্বাধীনতার ঘোষণাপত্র আনুষ্ঠানিকভাবে জারি হয়? ক) ১৭ এপ্রিল খ) ১০ এপ্রিল গ) ২৬ মার্চ ঘ) ১৬ ডিসেম্বর</p><p><strong>15.</strong> মুজিবনগর সরকার শপথ নেয়? ক) ১০ এপ্রিল খ) ২৬ মার্চ গ) ৭ মার্চ ঘ) ১৭ এপ্রিল</p><p><strong>16.</strong> স্বাধীনতা যুদ্ধকালে বাংলাদেশ কয়টি সেক্টরে বিভক্ত ছিল? ক) ১০ খ) ১১ গ) ১২ ঘ) ৯</p><p><strong>17.</strong> সরকারি কর্ম কমিশন সংবিধানের কত অনুচ্ছেদে? ক) ১৪০ খ) ১৩৮ গ) ১৩৭ ঘ) ১৩৬</p><p><strong>18.</strong> ৭ মার্চের ভাষণ সংবিধানের কোন তফসিলে? ক) ৫ম খ) ৬ষ্ঠ \"_Toc212\"></a><strong>২০.১ ৫০তম বিসিএস প্রিলিমিনারি (পরীক্ষা: ৩০ জানুয়ারি ২০২৬; পূর্ণমান ২০০)</strong></h2><ul><li>উৎস: Live MCQ — ৫০তম বিসিএস প্রিলিমিনারি প্রশ্নের সমাধান — <a href=\"https://web.livemcq.com/blog/50th-bcs-preliminary-question-solution-2026\">https://web.livemcq.com/blog/50th-bcs-preliminary-question-solution-2026</a></li></ul><p>উত্তর = উৎস পাতার চিহ্নিত উত্তর; ব্যাখ্যা আমার লেখা। পাতার ৪৮ নম্বরের পরের অংশ (গণিত, বাংলাদেশ, আন্তর্জাতিক) পড়া যায়নি — তাই সেগুলো নেই।</p><table><thead><tr><th><p><strong>#</strong></p></th><th><p><strong>প্রশ্ন ও বিকল্প (মূল শব্দচয়ন)</strong></p></th><th><p><strong>উত্তর</strong></p></th><th><p><strong>বাংলা ব্যাখ্যা</strong></p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p>তারাশঙ্কর বন্দ্যোপাধ্যায়ের 'কবি' গ্রন্থটিতে কোন্ বিষয়টি প্রাধান্য পেয়েছে? ক) অসম ভালোবাসা খ) আদিবাসীদের জীবন চিত্র গ) ডোম সম্প্রদায়ের জীবন কাহিনী ঘ) পঞ্চাশের মন্বন্তর</p></td><td><p>গ) ডোম সম্প্রদায়ের জীবন কাহিনী</p></td><td><p>'কবি' উপন্যাসের নায়ক নিতাই ডোম সম্প্রদায়ের এক যুবক, যে কবিয়াল হয়ে ওঠে।</p></td></tr><tr><td><p>2</p></td><td><p>কিশোর পত্রিকা 'বালক' প্রতিষ্ঠা কার অমর কীর্তি? ক) স্বর্ণকুমারী দেবী খ) সেলিনা হোসেন গ) আল মাহমুদ ঘ) কাদম্বরী দেবী</p></td><td><p>ক) স্বর্ণকুমারী দেবী (চাবি)</p></td><td><p>⚠ Live MCQ নিজেই উল্লেখ করেছে যে 'বালক'-এর সম্পাদক হিসেবে জ্ঞানদানন্দিনী দেবীর নামও পাওয়া যায়; প্রশ্নটি বিতর্কিত।</p></td></tr><tr><td><p>3</p></td><td><p>'পরমেশ' শব্দটির সঠিক সন্ধি বিচ্ছেদ কোনটি? ক) পরম + এশ খ) পরম + ঈশ গ) পরম + ইশ ঘ) পরম + ইস</p></td><td><p>খ) পরম + ঈশ</p></td><td><p>স্বরসন্ধি: অ + ঈ = এ (যেমন পরম + ঈশ্বর = পরমেশ্বর)।</p></td></tr><tr><td><p>4</p></td><td><p>বাংলা পুঁথি সাহিত্যের উদাহরণ কোনটি? ক) নূরনামা খ) আমীর হামজা গ) গুপি চন্দ্রের সন্ন্যাস ঘ) মহুয়া</p></td><td><p>খ) আমীর হামজা</p></td><td><p>'আমীর হামজা' দোভাষী পুঁথির জনপ্রিয় কাব্য; 'মহুয়া' মৈমনসিংহ গীতিকার পালা।</p></td></tr><tr><td><p>5</p></td><td><p>'স্বর্গ' শব্দের সঠিক সমার্থক শব্দজোড়া কোনটি? ক) হরিদশ্ব, বিবদান খ) ক্ষিতি, উর্বী গ) দিনমণি, দিন নাথ ঘ) ত্রিদিব, সুরপুর</p></td><td><p>ঘ) ত্রিদিব, সুরপুর</p></td><td><p>ক্ষিতি/উর্বী = পৃথিবী; দিনমণি/দিননাথ = সূর্য।</p></td></tr><tr><td><p>6</p></td><td><p>'ঢাকা মুসলিম সাহিত্য সমাজ' কত সালে প্রতিষ্ঠিত হয়? ক) ১৯২০ খ) ১৯২৬ গ) ১৯২৫ ঘ) ১৯৩০</p></td><td><p>খ) ১৯২৬</p></td><td><p>১৯ জানুয়ারি ১৯২৬; “বুদ্ধির মুক্তি আন্দোলন”, মুখপত্র “শিখা”।</p></td></tr><tr><td><p>7</p></td><td><p>কোনটি কাজী নজরুল ইসলামের প্রবন্ধ গ্রন্থ? ক) মৃত্যুক্ষুধা খ) সিন্ধু হিন্দোল গ) যুগবাণী ঘ) অগ্নিবীণা</p></td><td><p>গ) যুগবাণী</p></td><td><p>যুগবাণী (১৯২২) প্রথম প্রবন্ধগ্রন্থ; মৃত্যুক্ষুধা উপন্যাস; সিন্ধু হিন্দোল ও অগ্নিবীণা কাব্য।</p></td></tr><tr><td><p>8</p></td><td><p>'কাআ তরুবর পঞ্চ বি ডাল'- পদটির রচয়িতা কে? ক) লুইপা খ) ভুসুরুপা গ) শবরপা ঘ) কাহ্নপা</p></td><td><p>ক) লুইপা</p></td><td><p>চর্যাপদের প্রথম পদ, রচয়িতা লুইপা।</p></td></tr><tr><td><p>9</p></td><td><p>জসীমউদ্দিনের 'কবর' কবিতাটি কোন্ পত্রিকায় প্রথম প্রকাশিত হয়? ক) তত্ত্ব-বোধিনী খ) ধূমকেতু গ) কালি ও কলম ঘ) কল্লোল</p></td><td><p>ঘ) কল্লোল</p></td><td><p>'কবর' কল্লোল পত্রিকায় প্রকাশিত; পরে 'রাখালী' কাব্যে সংকলিত।</p></td></tr><tr><td><p>10</p></td><td><p>কোনটি 'ভাত' এর প্রতিশব্দ? ক) অলিপিক খ) প্রভঞ্জন গ) মহি ঘ) তণডুল</p></td><td><p>ঘ) তণ্ডুল</p></td><td><p>প্রভঞ্জন = বায়ু; মহি = পৃথিবী। শুদ্ধ বানান “তণ্ডুল”।</p></td></tr><tr><td><p>11</p></td><td><p>মুক্তিযুদ্ধকে উপজীব্য করে 'যাত্রা' উপন্যাসটি লিখেছেন- ক) শওকত ওসমান খ) শহিদুল জহির গ) শওকত আলী ঘ) সেলিনা হোসেন</p></td><td><p>গ) শওকত আলী</p></td><td><p>মুক্তিযুদ্ধভিত্তিক উপন্যাস “যাত্রা” — শওকত আলী।</p></td></tr><tr><td><p>12</p></td><td><p>'ফিকা কমলা রং'- এখানে ফিকা অর্থ কী? ক) অনুজ্জ্বল খ) উজ্জ্বল গ) তীব্র ঘ) ঝাঁঝালো</p></td><td><p>ক) অনুজ্জ্বল</p></td><td><p>ফিকা = হালকা, ম্লান।</p></td></tr><tr><td><p>13</p></td><td><p>'রাজপথ' শব্দের ব্যাসবাক্য কোনটি? ক) রাজা ও পথ খ) রাজার পথ গ) বিশাল পথ ঘ) পথের রাজা</p></td><td><p>ঘ) পথের রাজা</p></td><td><p>রাজপথ = পথের রাজা (ষষ্ঠী তৎপুরুষ, পূর্বপদ-পরপদ উল্টে); মন্ত্রণালয় ২০১৯ প্র. ১৪-এও “রাজপথ” বিকল্প ছিল।</p></td></tr><tr><td><p>14</p></td><td><p>১৩৫০ বঙ্গাব্দের দুর্ভিক্ষ নিয়ে রচিত উপন্যাস কোনটি? ক) ইছামতি খ) অশনি সংকেত গ) আরণ্যক ঘ) বিষাদসিন্ধু</p></td><td><p>খ) অশনি সংকেত</p></td><td><p>বিভূতিভূষণের “অশনি সংকেত” পঞ্চাশের মন্বন্তর-ভিত্তিক।</p></td></tr><tr><td><p>15</p></td><td><p>কোন্ কবি 'মজলুম আদিব' ছদ্মনামে কবিতা লিখতেন? ক) আল মাহমুদ খ) হেলাল হাফিজ গ) নির্মলেন্দু গুণ ঘ) শামসুর রাহমান</p></td><td><p>ঘ) শামসুর রাহমান</p></td><td><p>মুক্তিযুদ্ধকালে শামসুর রাহমান “মজলুম আদিব” নামে লিখতেন।</p></td></tr><tr><td><p>16</p></td><td><p>'বেতার, বিপত্নীক'-শব্দ দুটি কোন্ সমাসের উদাহরণ? ক) নঞ তৎপুরুষ, বহুব্রীহি খ) কর্মধারয়, বহুব্রীহি গ) অব্যয়ীভাব, তৎপুরুষ ঘ) তৃতীয়া তৎপুরুষ, দ্বিগু</p></td><td><p>ক) (চাবি)</p></td><td><p>⚠ অনেক ব্যাকরণে “বেতার” (নেই তার যার) নঞ বহুব্রীহি; চাবি নিজেও এ বিতর্ক স্বীকার করেছে।</p></td></tr><tr><td><p>17</p></td><td><p>কোন্ বাক্যে সমধাতুজ কর্ম রয়েছে? ক) সে বই পড়ছে। খ) সে গভীর চিন্তায় মগ্ন। গ) আজ এমন ঘুম ঘুমিয়েছি! ঘ) সে খেলা করছে।</p></td><td><p>গ) আজ এমন ঘুম ঘুমিয়েছি!</p></td><td><p>ক্রিয়া ও কর্ম একই ধাতু থেকে (ঘুম–ঘুমানো) = সমধাতুজ কর্ম।</p></td></tr><tr><td><p>18</p></td><td><p>'প্রাচ্য' শব্দের বিপরীত শব্দ কোনটি? ক) প্রতীচ্য খ) প্রাচ্যহীন গ) অপ্রাচ্য ঘ) নবীন</p></td><td><p>ক) প্রতীচ্য</p></td><td><p>প্রাচ্য = পূর্বদেশীয়; প্রতীচ্য = পশ্চিমদেশীয়।</p></td></tr><tr><td><p>19</p></td><td><p>পুঁথি সাহিত্যে প্রাচীনতম লেখক কে? ক) ভারত চন্দ্র রায় খ) কাজী দৌলত গ) আবদুল হাকিম ঘ) ফকির গরীবুল্লাহ</p></td><td><p>ঘ) ফকির গরীবুল্লাহ</p></td><td><p>দোভাষী পুঁথির প্রথম ও শ্রেষ্ঠ কবি ফকির গরীবুল্লাহ।</p></td></tr><tr><td><p>20</p></td><td><p>কোন্ বানানটি শুদ্ধ? ক) নিশিথিনি খ) কথোপকথন গ) পিপিলিকা ঘ) সমিচিন</p></td><td><p>খ) কথোপকথন</p></td><td><p>শুদ্ধ: নিশীথিনী, পিপীলিকা, সমীচীন। (“সমীচীন” মন্ত্রণালয় ২০১৮ ও ২০২৩-এও এসেছে!)</p></td></tr><tr><td><p>21</p></td><td><p>'Helena said I took the laptop home with me.' Its indirect form is- a) Helena said that she took the laptop home with her b) Helena said that she had taken the laptop home with her c) Helena confirmed that she has taken the laptop home with her d) Helena told that she had the laptop taken home with her</p></td><td><p>b)</p></td><td><p>Reporting verb past হলে simple past → past perfect; I/me → she/her।</p></td></tr><tr><td><p>22</p></td><td><p>'It is no good falling in love at first sight'. Here the word \"falling\" is a/an - a) participle b) infinitive c) gerund d) verbal noun</p></td><td><p>c) gerund</p></td><td><p>“It is no good + V-ing” কাঠামোয় V-ing বিশেষ্যের কাজ করে = gerund।</p></td></tr><tr><td><p>23</p></td><td><p>Which Matthew Arnold poem expresses a pessimistic view of a conflict-filled, joyless world? (প্রশ্নের ভাষা সংক্ষেপিত) a) Scholar Gipsy b) Dover Beach c) Rugby Chapel d) Immortality</p></td><td><p>b) Dover Beach</p></td><td><p>Dover Beach-এ বিশ্বাসহীন, দ্বন্দ্বময় পৃথিবীর হতাশা।</p></td></tr><tr><td><p>24</p></td><td><p>Candidates are required to get ______ the centre before 09:00 AM. a) at b) to c) in d) into</p></td><td><p>b) to</p></td><td><p>get to + স্থান = পৌঁছানো।</p></td></tr><tr><td><p>25</p></td><td><p>The killing of albatross in The Rime of the Ancient Mariner was indicative of - a) a trigger-happy Mariner b) the essential irrationality of man c) a superstitious Mariner d) the Mariner as a skillful fowler</p></td><td><p>b)</p></td><td><p>অকারণ হত্যা = মানুষের মৌলিক অযৌক্তিকতা (Coleridge)।</p></td></tr><tr><td><p>26</p></td><td><p>Which novel chronicles intense, destructive love fueling multigenerational cruelty &amp; obsession? a) Jane Eyre b) Emma c) Wuthering Heights d) Persuasion</p></td><td><p>c) Wuthering Heights</p></td><td><p>Emily Brontë-র উপন্যাস; Heathcliff–Catherine।</p></td></tr><tr><td><p>27</p></td><td><p>Which of these is not characteristic of English Romantic Poetry? a) Ordinary life b) Everyday language c) Expression of feelings rather than action or plot d) Inane and gaudy phraseology</p></td><td><p>d)</p></td><td><p>Wordsworth Lyrical Ballads-এর ভূমিকায় “gaudy and inane phraseology” বর্জনের কথা বলেন।</p></td></tr><tr><td><p>28</p></td><td><p>In William Shakespeare's play As You Like It, the Seven Ages of Man speech was delivered by- a) Oliver b) Orlando c) Jaques d) Rosalind</p></td><td><p>c) Jaques</p></td><td><p>“All the world's a stage” — Jaques (Act II, Scene VII)।</p></td></tr><tr><td><p>29</p></td><td><p>The book that she recommended turned out to be very helpful. Here the underlined clause is a- a) relative clause b) noun clause c) adverbial clause d) independent clause</p></td><td><p>a) relative clause</p></td><td><p>“that she recommended” বিশেষ্য “book”-কে বিশেষিত করছে।</p></td></tr><tr><td><p>30</p></td><td><p>What is the antonym of 'percipience'? a) shrewdness b) dullness c) discerning d) astuteness</p></td><td><p>b) dullness</p></td><td><p>percipience = অন্তর্দৃষ্টি/বোধশক্তি; বিপরীত = dullness (স্থূলবুদ্ধি)।</p></td></tr><tr><td><p>31</p></td><td><p>Identify the sentence where 'up' functions as a noun- a) He turned the volume up. b) Business confidence is on the up. c) We live just up the road. d) Our system should be up by afternoon.</p></td><td><p>b)</p></td><td><p>“on the up” = উন্নতির পথে; এখানে up বিশেষ্য।</p></td></tr><tr><td><p>32</p></td><td><p>Which one is a coordinating conjunction? a) since b) lest c) as d) so</p></td><td><p>d) so</p></td><td><p>FANBOYS: for, and, nor, but, or, yet, so।</p></td></tr><tr><td><p>33</p></td><td><p>Which novel best exemplifies racial prejudice, oppressive power and the East-West cultural gulf? (সংক্ষেপিত) a) Shadow of the Moon b) Bhowani Junction c) Kim d) A Passage to India</p></td><td><p>d) A Passage to India</p></td><td><p>E. M. Forster (১৯২৪)।</p></td></tr><tr><td><p>34</p></td><td><p>A very large building in which aircraft are housed is called a/an- a) terminal b) aerodrome c) hanger d) hangar</p></td><td><p>d) hangar</p></td><td><p>hangar = বিমান রাখার ছাউনি; hanger = জামা ঝোলানোর হ্যাঙ্গার। (প্রতিরক্ষা-সংশ্লিষ্ট শব্দ!)</p></td></tr><tr><td><p>35</p></td><td><p>'You will need a variety of skills, including leadership, endurance etc.' In this sentence the word 'including' is a – a) conjunction b) gerund c) participle d) preposition</p></td><td><p>d) preposition</p></td><td><p>including এখানে participial preposition।</p></td></tr><tr><td><p>36</p></td><td><p>A synonym of the word 'crepuscular' is- a) nocturnal b) diurnal c) cathemeral d) twilit</p></td><td><p>d) twilit</p></td><td><p>crepuscular = গোধূলিকালীন।</p></td></tr><tr><td><p>37</p></td><td><p>'Let me not to the marriage of true minds...' — from a sonnet by whom? (সংক্ষেপিত) a) Spencer b) Petrarch c) Shakespeare d) Donne</p></td><td><p>c) Shakespeare</p></td><td><p>Sonnet 116।</p></td></tr></tbody></table><h2><a id=\"_Toc213\"></a><strong>২০.২ ৪৯তম বিশেষ বিসিএস (শিক্ষা) — সাধারণ অংশ (পরীক্ষা: ১০ অক্টোবর ২০২৫; পূর্ণমান ১০০)</strong></h2><ul><li>উৎস: Live MCQ — ৪৯তম বিসিএস প্রশ্ন সমাধান — <a href=\"https://web.livemcq.com/blog/49th-bcs-question-solution-pdf\">https://web.livemcq.com/blog/49th-bcs-question-solution-pdf</a></li></ul><table><thead><tr><th><p><strong>#</strong></p></th><th><p><strong>প্রশ্ন ও বিকল্প (মূল শব্দচয়ন)</strong></p></th><th><p><strong>উত্তর</strong></p></th><th><p><strong>বাংলা ব্যাখ্যা</strong></p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p>'পরিবার থেকেই শিক্ষার শুরু'-এখানে 'থেকে' শব্দের সাথে যুক্ত 'ই'-এর ব্যাকরণিক পরিচয় কী? ক) উপসর্গ খ) প্রত্যয় গ) ধাতু ঘ) বলক</p></td><td><p>ঘ) বলক</p></td><td><p>“ই/ও” জোর বোঝায় — বলক (নতুন ব্যাকরণ-পরিভাষা)।</p></td></tr><tr><td><p>2</p></td><td><p>'এ কাজ করতে আমি বদ্ধ পরিকর'- এখানে 'পরিকর' শব্দের অর্থ কী? ক) শ্বাস খ) প্রতিজ্ঞা গ) কোমর ঘ) প্রতিশ্রুত</p></td><td><p>গ) কোমর</p></td><td><p>পরিকর = কোমরবন্ধ; বদ্ধপরিকর = কোমর বেঁধে প্রস্তুত = দৃঢ়প্রতিজ্ঞ।</p></td></tr><tr><td><p>3</p></td><td><p>'তিনি কথা শুনে ঘুমাতে পারলেন না' - বাক্যটির অস্তিবাচক রূপ কী হবে? ক) তিনি কথা না শুনে ঘুমাতে পারলেন না খ) তিনি কথা না শুনে ঘুমাতে পারলেন গ) তিনি জেগে রইলেন কথা না শুনে ঘ) তিনি কথা শুনে জেগে রইলেন</p></td><td><p>ঘ)</p></td><td><p>অর্থ অপরিবর্তিত রেখে না-বাচক থেকে হ্যাঁ-বাচক: “ঘুমাতে পারলেন না” = “জেগে রইলেন”।</p></td></tr><tr><td><p>4</p></td><td><p>কোন্ ধ্বনি পরিবর্তনটি যথাযথ নয়? ক) ক্রন্দন &gt; কাঁদা খ) অঞ্চল &gt; আঁচল গ) সংগীত &gt; গীতিকা ঘ) দন্ত &gt; দাঁত</p></td><td><p>গ)</p></td><td><p>বাকি তিনটি তদ্ভব রূপ (নাসিক্যীভবন); গীতিকা প্রত্যয়জাত।</p></td></tr><tr><td><p>5</p></td><td><p>কোন শব্দটি প্রত্যয়যোগে গঠিত? ক) ডাক্তারখানা খ) হাসপাতাল গ) আকাশছোঁয়া ঘ) গুণমান</p></td><td><p>ক) ডাক্তারখানা</p></td><td><p>“-খানা” বিদেশি তদ্ধিত প্রত্যয়।</p></td></tr><tr><td><p>6</p></td><td><p>'সত্যকে স্বীকার করতে অনেক ব্যক্তিরাই চায়না।'- এখানে ভুল ঘটেছে- ক) বানান ও প্রত্যয়ের খ) অর্থ ও বচনের গ) অর্থ ও প্রত্যয়ের ঘ) বানান ও বচনের</p></td><td><p>ঘ) বানান ও বচনের</p></td><td><p>“চায় না” আলাদা লিখতে হয়; “অনেক” + “রা” = দ্বিরুক্ত বহুবচন (ভুল)।</p></td></tr><tr><td><p>7</p></td><td><p>পরিভাষিক শব্দ বলতে বুঝায়- ক) ইংরেজি শব্দের বাংলা রূপান্তর খ) বিদেশি শব্দের অনুবাদ গ) বিষয়গত সুনির্দিষ্ট অর্থবোধক শব্দ ঘ) ব্যবহারিক প্রয়োজনে নবনির্মিত শব্দ</p></td><td><p>গ)</p></td><td><p>পারিভাষিক শব্দ নির্দিষ্ট বিষয়ে নির্দিষ্ট অর্থ বহন করে। (মন্ত্রণালয়ের সব প্রশ্নপত্রেই পারিভাষিক শব্দ এসেছে)</p></td></tr><tr><td><p>8</p></td><td><p>ধ্বনি ও বর্ণের পার্থক্য কোথায়? ক) লেখার ধরনে খ) উচ্চারনের বিশিষ্টতায় গ) সংখ্যাগত পরিমানে ঘ) ইন্দ্রিয় গ্রাহ্যে</p></td><td><p>ঘ) ইন্দ্রিয়গ্রাহ্যতায়</p></td><td><p>ধ্বনি শোনা যায় (কান), বর্ণ দেখা যায় (চোখ)।</p></td></tr><tr><td><p>9</p></td><td><p>কোন শব্দটি বিসর্গসন্ধির মাধ্যমে গঠিত? ক) নীরব খ) উজ্জ্বল গ) মানোত্তীর্ণ ঘ) সংগ্রাম</p></td><td><p>ক) নীরব</p></td><td><p>নিঃ + রব = নীরব (বিসর্গ লোপ, পূর্বস্বর দীর্ঘ)।</p></td></tr><tr><td><p>10</p></td><td><p>'স্বাধীন' শব্দের ব্যাসবাক্য কোনটি? ক) স্বীয়-এর অধীন খ) সত্ত্বার অধীন গ) স্ব-এর অধীন ঘ) স্বত্তের-অধীন</p></td><td><p>গ) স্ব-এর অধীন</p></td><td><p>ষষ্ঠী তৎপুরুষ।</p></td></tr><tr><td><p>11</p></td><td><p>Pick the correctly spelt word: a) Conscintious b) Consientious c) Concientious d) Conscientious</p></td><td><p>d) Conscientious</p></td><td><p>conscientious = বিবেকবান, কর্তব্যনিষ্ঠ।</p></td></tr p></th><th><p><strong>পরীক্ষা</strong></p></th><th><p><strong>প্রশ্ন (মূল ইংরেজি)</strong></p></th><th><p><strong>উত্তর (আমার হিসাব)</strong></p></th><th><p><strong>ধাপে ধাপে সমাধান (বাংলা)</strong></p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p>BB AD 2012</p></td><td><p>The product of two numbers x and y is twice the sum of the numbers. What is the sum of the reciprocals of x and y? (পাতায় বিকল্পের ভগ্নাংশ-চিহ্ন হারিয়ে গেছে: 23, 34, 37, 12)</p></td><td><p>১/২</p></td><td><p>xy = 2(x+y) ⇒ 1/x + 1/y = (x+y)/xy = (x+y)/2(x+y) = ১/২। (বিকল্প “12” সম্ভবত ১/২)</p></td></tr><tr><td><p>2</p></td><td><p>BB AD 2012</p></td><td><p>How many different six-digit numbers can be formed using all of the following digits: 3, 3, 4, 4, 4, 5? ক) 25 খ) 40 গ) 50 ঘ) 60 ঙ) None of them</p></td><td><p>ঘ) 60</p></td><td><p>পুনরাবৃত্ত অঙ্কসহ বিন্যাস = 6!/(2!×3!) = 720/12 = 60।</p></td></tr><tr><td><p>3</p></td><td><p>BB AD 2012</p></td><td><p>The total income of Mr. Sakib in the years 2003, 2004, and 2005 was Taka 36,400. His income increased by 20% each year. [What was his income in 2005?] ক) 1500 খ) 14400 গ) 16450 ঘ) 12350</p></td><td><p>খ) 14400</p></td><td><p>২০০৩-এ x হলে x + 1.2x + 1.44x = 3.64x = 36400 ⇒ x = 10000; ২০০৫ = 1.44 × 10000 = 14400।</p></td></tr><tr><td><p>4</p></td><td><p>BB AD 2012</p></td><td><p>The ratio of the number of red balls, to yellow balls, to green balls in an urn is 2 : 3 : 4. [Probability that a ball drawn at random is red?] ক) 2/7 খ) 5/10 গ) 5/9 ঘ) 2/9</p></td><td><p>ঘ) 2/9</p></td><td><p>মোট অংশ 2+3+4 = 9; লাল 2 ⇒ সম্ভাবনা 2/9।</p></td></tr><tr><td><p>5</p></td><td><p>BB AD 2012</p></td><td><p>After replacing an old member by a new member, it was found that the average age of five members of a club [is the same as it was 3 years ago. Difference between ages of old and new member?] ক) 15 খ) 8 গ) 4 ঘ) 2</p></td><td><p>ক) 15 বছর</p></td><td><p>৩ বছরে ৫ জনের মোট বয়স ১৫ বাড়ার কথা; গড় একই থাকায় পুরনো সদস্য নতুন সদস্যের চেয়ে ১৫ বছর বড় ছিলেন।</p></td></tr><tr><td><p>6</p></td><td><p>BB AD 2012</p></td><td><p>If for integer x, 5 &lt; x &lt; 10 and y = x + 5. What is the greatest possible value of x + y? ক) 32 খ) 22 গ) 23 ঘ) 27</p></td><td><p>গ) 23</p></td><td><p>x সর্বোচ্চ 9 ⇒ y = 14 ⇒ x + y = 23।</p></td></tr><tr><td><p>7</p></td><td><p>BB AD 2012</p></td><td><p>In an election a candidate who gets 84% of the votes is elected by a majority of 476 votes. [Total votes polled?] ক) 672 খ) 700 গ) 749 ঘ) 848</p></td><td><p>খ) 700</p></td><td><p>ব্যবধান = 84% − 16% = 68% = 476 ⇒ মোট = 476/0.68 = 700।</p></td></tr><tr><td><p>8</p></td><td><p>BB AD 2012</p></td><td><p>In a zoo, each pigeon has 2 legs, and each rabbit has 4 legs. [12 heads, 32 legs — pigeons &amp; rabbits?] ক) 6 &amp; 3 খ) 5 &amp; 10 গ) 8 &amp; 4 ঘ) 6 &amp; 8</p></td><td><p>গ) 8 ও 4</p></td><td><p>সব কবুতর ধরলে পা = 24; বাড়তি 8 পা ÷ 2 = 4 খরগোশ; কবুতর 8।</p></td></tr><tr><td><p>9</p></td><td><p>BB AD 2012</p></td><td><p>A closed rectangular tank ... placed on its 3 ft by 4 ft side, water height 5 ft. [Height when placed on its 4 ft by 5 ft side?] ক) 3 খ) 5 গ) 6 ঘ) 4</p></td><td><p>ক) 3 ফুট</p></td><td><p>পানির আয়তন = 3×4×5 = 60 ঘনফুট; নতুন ভূমি 20 ⇒ উচ্চতা 3।</p></td></tr><tr><td><p>10</p></td><td><p>BB AD 2012</p></td><td><p>A man ate 100 bananas in five days, each eating 6 more than the previous day. How many bananas did he eat on the first day? ক) 6 খ) 7 গ) 10 ঘ) 8</p></td><td><p>ঘ) 8</p></td><td><p>a + (a+6) + ... + (a+24) = 5a + 60 = 100 ⇒ a = 8।</p></td></tr><tr><td><p>11</p></td><td><p>BB AD 2012</p></td><td><p>Train X leaves Dhaka at 10:00 AM ... at x mph. Train Y leaves at 11:30 AM at 4x/3 on the same tracks. [When does Y catch X?] ক) 4 PM খ) 2 PM গ) 6 PM ঘ) 1 PM</p></td><td><p>ক) 4 PM</p></td><td><p>অগ্রগামী দূরত্ব 1.5x; আপেক্ষিক বেগ x/3 ⇒ সময় 4.5 ঘণ্টা ⇒ 11:30 + 4:30 = বিকেল 4টা।</p></td></tr><tr><td><p>12</p></td><td><p>BB AD 2012</p></td><td><p>Bank X pays a simple interest of Taka 80 on principal of taka 1,000 annually. [Bank Y pays Tk 140 on Tk 1000; ratio of rates?] ক) 4:7 খ) 6:8 গ) 9:18 ঘ) 2:7</p></td><td><p>ক) 4:7</p></td><td><p>হার 8% ও 14% ⇒ 8:14 = 4:7। (সরল সুদ — মন্ত্রণালয়ের প্রিয় টপিক)</p></td></tr><tr><td><p>13</p></td><td><p>BB AD 2012</p></td><td><p>The sum of two numbers is 5. And their product is 4. Then what is the difference between the numbers? ক) 1 খ) 2 গ) 3 ঘ) 4</p></td><td><p>গ) 3</p></td><td><p>(a−b)² = (a+b)² − 4ab = 25 − 16 = 9 ⇒ a−b = 3। (মন্ত্রণালয়ের a ± 1/a ধাঁচের অভেদ)</p></td></tr><tr><td><p>14</p></td><td><p>BB AD 2009</p></td><td><p>Susan can type 10 pages in 5 minutes. Mary can type 5 pages in 10 minutes. [Pages together in 30 minutes?] ক) 15 খ) 20 গ) 25 ঘ) 65 ঙ) 75</p></td><td><p>ঙ) 75</p></td><td><p>Susan 2 পৃ/মি, Mary 0.5 পৃ/মি ⇒ একত্রে 2.5 × 30 = 75।</p></td></tr><tr><td><p>15</p></td><td><p>BB AD 2009</p></td><td><p>In a class composed of x girls and y boys what part of the class is composed of girls? ক) y/(x+y) খ) x/xy গ) x/(x+y) ঘ) y/xy</p></td><td><p>গ) x/(x+y)</p></td><td><p>অংশ = মেয়ে/মোট।</p></td></tr><tr><td><p>16</p></td><td><p>BB AD 2009</p></td><td><p>r &gt; s &gt; 0; Quantity A = rs/r and Quantity B = rs/s</p></td><td><p>খ) B বড়</p></td><td><p>A = s, B = r; r &gt; s ⇒ B বড়।</p></td></tr><tr><td><p>17</p></td><td><p>BB AD 2009</p></td><td><p>What is the maximum number of half-pint bottles of cream that can be filled with a 4-gallon can of cream? (2 pt. = 1 qt. and 4 qt. = 1 gal) ক) 16 খ) 24 গ) 30 ঘ) 64</p></td><td><p>ঘ) 64</p></td><td><p>4 gal = 16 qt = 32 pt = 64 টি আধা-পাইন্ট।</p></td></tr><tr><td><p>18</p></td><td><p>BB AD 2009</p></td><td><p>If the operation ^ is defined by the equation x ^ y = 2x + y, what is the value of a in 2 ^ a = a ^ 3? ক) 0 খ) 1 গ) -1 ঘ) 4</p></td><td><p>খ) 1</p></td><td><p>4 + a = 2a + 3 ⇒ a = 1।</p></td></tr><tr><td><p>19</p></td><td><p>BB AD 2009</p></td><td><p>Which of the following fractions has the smallest value? ক) 8/7 খ) 10/9 গ) 21/20 ঘ) 41/40 ঙ) 1013/1012</p></td><td><p>ঙ) 1013/1012</p></td><td><p>সবগুলো 1 + 1/n আকারের; n বড় হলে মান ছোট।</p></td></tr><tr><td><p>20</p></td><td><p>BB AD 2009</p></td><td><p>After 3 semester in college, Jim has a 3.0 GPA. [GPA needed in 4th semester to make average 3.1?] ক) 2.7 খ) 3.1 গ) 3.3 ঘ) 3.4 ঙ) 3.5</p></td><td><p>ঘ) 3.4</p></td><td><p>(3×3.0 + x)/4 = 3.1 ⇒ x = 12.4 − 9 = 3.4।</p></td></tr><tr><td><p>21</p></td><td><p>BB AD 2009</p></td><td><p>A rectangle is 14 cm long and 10 cm wide. [Length reduced by x, width increased by x to make a square; change in area?] ক) 4 খ) 144 গ) 12 ঘ) 2</p></td><td><p>ক) 4 বর্গসেমি বৃদ্ধি</p></td><td><p>বর্গ 12×12 = 144; আগে 140 ⇒ 4 বাড়ে।</p></td></tr><tr><td><p>22</p></td><td><p>BB AD 2009</p></td><td><p>When a student weighing 45 kgs left a class, the average weight of the remaining 59 students increased by 200g. [Average of remaining 59?] ক) 57 খ) 56.8 গ) 58.2 ঘ) 52.2</p></td><td><p>ক) 57 কেজি</p></td><td><p>60A − 45 = 59(A + 0.2) ⇒ A = 56.8; বাকিদের গড় = 57।</p></td></tr></tbody></table><h2><a id=\"_Toc216\"></a><strong>২০.৫ বাংলাদেশ ব্যাংক সহকারী পরিচালক (AD) ২০১৫ — বাংলা</strong></h2><ul><li>উৎস: Satt Academy — BB AD Bangla 2015 — <a href=\"https://sattacademy.com/bangladesh-bank-assistant-director-2015/বাংলা/mcq-questions\">https://sattacademy.com/bangladesh-bank-assistant-director-2015/বাংলা/mcq-questions</a></li></ul><p>পাতায় উত্তর চিহ্নিত নেই; উত্তর প্রচলিত ব্যাকরণ ও সাহিত্য-তথ্য অনুযায়ী আমার দেওয়া।</p><table><thead><tr><th><p><strong>#</strong></p></th><th><p><strong>প্রশ্ন ও বিকল্প (মূল শব্দচয়ন)</strong></p></th><th><p><strong>উত্তর</strong></p></th><th><p><strong>বাংলা ব্যাখ্যা</strong></p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p>ভাষার সর্বনাম ব্যবহারের উদ্দেশ্য কি? ক) বিশেষণের পরিবর্তে ব্যবহার করা খ) বিশেষ্যের পুনরাবৃত্তি দূর করা গ) বিশেষ্যের অভাব দূর করা ঘ) ভাষা শব্দ সম্পদ বৃদ্ধি করা</p></td><td><p>খ)</p></td><td><p>সর্বনাম বিশেষ্যের পরিবর্তে বসে পুনরাবৃত্তি এড়ায়।</p></td></tr><tr><td><p>2</p></td><td><p>'চতুরঙ্গ' পত্রিকার সম্পাদক কে ছিলেন? ক) হুমায়ুন কবির খ) ফজল শাহাবুদ্দীন গ) আবুল হোসেন ঘ) মোজাম্মেল হক</p></td><td><p>ক) হুমায়ুন কবির</p></td><td><p>ত্রৈমাসিক “চতুরঙ্গ” (১৯৩৮) — হুমায়ুন কবির।</p></td></tr><tr><td><p>3</p></td><td><p>'ঢাকের কাঠি' বাগধারার অর্থ - ক) সাহায্যকারী খ) স্বাস্থ্যহীন লোক গ) বাদক ঘ) তোষামুদে</p></td><td><p>ঘ) তোষামুদে</p></td><td><p>ঢাকের কাঠি = মোসাহেব/তোষামোদকারী।</p></td></tr><tr><td><p>4</p></td><td><p>কোন বানানটি শুদ্ধ? ক) মূর্ধন্য খ) মূর্ধণ গ) মুর্ধন্য ঘ) মুর্ধণ্য</p></td><td><p>ক) মূর্ধন্য</p></td><td><p>মূর্ধা + য = মূর্ধন্য (ঊ-কার, ন্য)।</p></td></tr><tr><td><p>5</p></td><td><p>সন্ধির প্রধান সুবিধা কি? ক) উচ্চারণের সুবিধা খ) লেখার সুবিধা গ) শোনার সুবিধা ঘ) পড়ার সুবিধা</p></td><td><p>ক) উচ্চারণের সুবিধা</p></td><td><p>সন্ধির মূল উদ্দেশ্য উচ্চারণ সহজ ও শ্রুতিমধুর করা।</p></td></tr></tbody></table><h2><a id=\"_Toc217\"></a><strong>২০.৬ এই প্রশ্নব্যাংক থেকে শিক্ষা (মন্ত্রণালয়ের পরীক্ষার সাথে তুলনা)</strong></h2><table><thead><tr><th><p><strong>পর্যবেক্ষণ</strong></p></th><th><p><strong>প্রমাণ</strong></p></th></tr></thead><tbody><tr><td><p><strong>বানান: “সমীচীন”, “নিশীথিনী”, “পিপীলিকা”</strong> — একই শব্দগুচ্ছ বারবার ঘুরে আসে</p></td><td><p>মন্ত্রণালয় ২০১৮ ও ২০২৩-এ “সমীচীন”; ৫০তম বিসিএস (২০২৬)-এও “সমিচিন” বিকল্প</p></td></tr><tr><td><p><strong>সমাস: তৎপুরুষ বনাম বহুব্রীহি</strong> — বিসিএস-এ প্রশ্ন আরও সূক্ষ্ম ও বিতর্কিত হচ্ছে</p></td><td><p>৫০তম বিসিএস: রাজপথ, বেতার/বিপত্নীক; ৪৯তম: স্বাধীন; মন্ত্রণালয় ২০১৯ প্র. ১৪</p></td></tr><tr><td><p><strong>পারিভাষিক শব্দ</strong> — সংজ্ঞা ও উদাহরণ দুই ধরনেই আসে</p></td><td><p>৪৯তম (সংজ্ঞা), ৪৭তম (Glossary); মন্ত্রণালয় ২০১৯ প্র. ১৬</p></td></tr><tr><td><p><strong>English: gerund/participle, prepositions, literature (Shakespeare, Romantic poets)</strong></p></td><td><p>৫০তম ও ৪৯তম বিসিএস; মন্ত্রণালয় ২০১৮ প্র. ৩৮ (Paradise Lost)</p></td></tr><tr><td><p><strong>গণিত: শতকরা বৃদ্ধি, সরল সুদের অনুপাত, (a−b)² অভেদ, গড়</strong> — মৌলিক কিন্তু ধারণাভিত্তিক</p></td><td><p>BB AD ২০০৯/২০১২; মন্ত্রণালয়ের ৫৫টি গণিত প্রশ্নের বড় অংশ একই ছাঁচ</p></td></tr><tr><td><p><strong>বিসিএস এখন আগের চেয়ে কঠিন ও বিশ্লেষণধর্মী</strong> (যেমন “কেন অশুদ্ধ নয়”) — মন্ত্রণালয়ের প্রশ্ন তুলনামূলক সরাসরি তথ্যভিত্তিক</p></td><td><p>৪৭তম বিসিএস: “ঐক্যমত”, “বিরাট গরু-ছাগলের হাট”</p></td></tr></tbody></table><p><strong>সংখ্যা:</strong> এই সংস্করণে মোট ৮৪টি বাহ্যিক প্রশ্ন (৫০তম: ৩৭, ৪৯তম: ১২, ৪৭তম: ৮, BB AD গণিত: ২২, BB AD বাংলা: ৫)। মূল লক্ষ্য ১৫০-৩০০ ছিল; যাচাইযোগ্য পূর্ণপাঠ না পাওয়ায় বাকিগুলো যোগ করিনি। অনেক পাতায় প্রশ্ন শুধু PDF-এ (যেমন ৪৪তম, ৪৫তম বিসিএস) — সেগুলো পরের সংস্করণে। <strong>সংস্করণ ৭-এ আরও ১৩১টি যুক্ত (নিচে ২০.৭–২০.৯) — মোট ২১৫টি।</strong></p><p><strong>সংস্করণ ৭-এ নতুন ১৩১টি প্রকৃত বিগত প্রশ্ন (অংশ ২০.৭–২০.৯)।</strong> উৎস Satt Academy। প্রতিটি বিষয়ের শুধু প্রথম পাতা বিনামূল্যে পড়া যায়; বাকি পাতায় লগইন লাগে। তাই প্রতিটি পরীক্ষার আংশিক প্রশ্নই আছে। শুধু পাতা থেকে হুবহু পড়া প্রশ্নই রেখেছি (সারাংশ থেকে পাওয়া বা গাণিতিক চিহ্ন হারানো প্রশ্ন বাদ)। <strong>এই পাতাগুলোতে উত্তর চিহ্নিত নেই — সব উত্তর আমার</strong>, প্রতিটি হিসাব/তথ্য যাচাই করে দেওয়া; সন্দেহ থাকলে ⚠।</p><h2><a id=\"_Toc218\"></a><strong>২০.৭ প্রতিরক্ষা মন্ত্রণালয় — সিভিলিয়ান স্টাফ অফিসার ও সহকারী পরিচালক (১৮ মার্চ ২০১৬) — ৩০টি</strong></h2><ul><li>উৎস: Satt Academy — MoD CSO &amp; AD 2016 — <a href=\"https://sattacademy.com/প্রতিরক্ষা-মন্ত্রণালয়ের-সিভিলিয়ান-স্টাফ-অফিসার-এবং-সহকারী-পরিচালক-১৮-০৩-২০১৬/all/mcq-questions\">https://sattacademy.com/প্রতিরক্ষা-মন্ত্রণালয়ের-সিভিলিয়ান-স্টাফ-অফিসার-এবং-সহকারী-পরিচালক-১৮-০৩-২০১৬/all/mcq-questions</a></li></ul><p>একই মন্ত্রণালয়ের একই পদের পুরনো পরীক্ষা, তাই অগ্রাধিকার সর্বোচ্চ। লক্ষ করুন: ১০ জানুয়ারি (স্বদেশ প্রত্যাবর্তন) ২০১৮-তেও এসেছে; English-এ ব্যাকরণের পরিভাষা (phrase, clause, morpheme) বেশি।</p><h3><strong>বাংলা</strong></h3><table><thead><tr><th><p><strong>#</strong></p></th><th><p><strong>প্রশ্ন ও বিকল্প (মূল শব্দচয়ন)</strong></p></th><th><p><strong>উত্তর (আমার)</strong></p></th><th><p><strong>বাংলা ব্যাখ্যা</strong></p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p>কাজী নজরুল ইসলামের প্রথম কাব্যগ্রন্থ কোনটি? ক) অগ্নিবীণা খ) বিষের বাশি গ) সর্বহারা ঘ) সঞ্চিতা</p></td><td><p>ক) অগ্নিবীণা</p></td><td><p>প্রকাশ ১৯২২; প্রথম কবিতা “প্রলয়োল্লাস”।</p></td></tr><tr><td><p>2</p></td><td><p>মৌলিক শব্দ কোনটি? ক) গোলাপ খ) শীতল গ) নেয়ে ঘ) গৌরব</p></td><td><p>ক) গোলাপ</p></td><td><p>যে শব্দ ভাঙা যায় না = মৌলিক। শীতল (শীত + ল), নেয়ে (নাও + ইয়া), গৌরব (গুরু + অ) সাধিত।</p></td></tr><tr><td><p>3</p></td><td><p>মৈমনসিংহ গীতিকা কে সংগ্রহ করেন? ক) দীনেশচন্দ্র সেন খ) মোহিতালাল মজুমদার গ) ড. মো শহীদুল্লাহ ঘ) চন্দ্রকুমার দে</p></td><td><p>ঘ) চন্দ্রকুমার দে</p></td><td><p>সংগ্রাহক চন্দ্রকুমার দে; সম্পাদনা ও প্রকাশ (কলকাতা বিশ্ববিদ্যালয়, ১৯২৩) দীনেশচন্দ্র সেন। ⚠ “সম্পাদক” জিজ্ঞাসা করলে উত্তর দীনেশচন্দ্র সেন।</p></td></tr><tr><td><p>4</p></td><td><p>অক্ষির সমীপে কোনটি? ক) সমক্ষ খ) পরোক্ষ গ) প্রত্যক্ষ ঘ) নিরপেক্ষ</p></td><td><p>গ) প্রত্যক্ষ</p></td><td><p>অব্যয়ীভাব সমাস: অক্ষির সমীপে = প্রত্যক্ষ; অক্ষির অগোচরে = পরোক্ষ; অক্ষির সম্মুখে = সমক্ষ।</p></td></tr><tr><td><p>5</p></td><td><p>শাহ মুহাম্মদ সগীর রচিত গ্রন্থ কোনটি? ক) রসূল বিজয় খ) নূর চামা গ) শবে মেরাজ ঘ) ইউসুফ জোলেখা</p></td><td><p>ঘ) ইউসুফ জোলেখা</p></td><td><p>মধ্যযুগের প্রথম মুসলমান কবি হিসেবে স্বীকৃত; রোমান্টিক প্রণয়োপাখ্যান।</p></td></tr></tbody></table><h3><strong>English</strong></h3><table><thead><tr><th><p><strong>#</strong></p></th><th><p><strong>প্রশ্ন ও বিকল্প (মূল শব্দচয়ন)</strong></p></th><th><p><strong>উত্তর (আমার)</strong></p></th><th><p><strong>বাংলা ব্যাখ্যা</strong></p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p>Which is not a grammatical unit? ক) Clause খ) Morpheme গ) Paragraph ঘ) Phrase</p></td><td><p>গ) Paragraph</p></td><td><p>ব্যাকরণগত একক: morpheme → word → phrase → clause → sentence; paragraph রচনার একক।</p></td></tr><tr><td><p>2</p></td><td><p>Simple sentence consists of- ক) Two clause খ) One clause গ) Three clause ঘ) Four clause</p></td><td><p>খ) One clause</p></td><td><p>Simple sentence-এ একটি মাত্র independent clause (একটি finite verb)।</p></td></tr><tr><td><p>3</p></td><td><p>The central part of a noun phrase is mainly a- ক) Pronoun খ) Adjective গ) Noun ঘ) Adverb</p></td><td><p>গ) Noun</p></td><td><p>Noun phrase-এর head = noun।</p></td></tr><tr><td><p>4</p></td><td><p>The synonym of the word ' Envoy' is- ক) Ambassador খ) politician গ) Executive ঘ) Artist</p></td><td><p>ক) Ambassador</p></td><td><p>Envoy = দূত।</p></td></tr><tr><td><p>5</p></td><td><p>The antonym of the word 'Abandon' is- ক) Retain খ) A bdicate গ) Detain ঘ) Couture</p></td><td><p>ক) Retain</p></td><td><p>Abandon = ত্যাগ করা; বিপরীত retain = ধরে রাখা।</p></td></tr><tr><td><p>6</p></td><td><p>Which part of speech is the word ' Regarding'? ক) Adverb খ) Preposition গ) Verb ঘ) Noun</p></td><td><p>খ) Preposition</p></td><td><p>regarding = সম্পর্কে (preposition), যেমন regarding your letter।</p></td></tr><tr><td><p>7</p></td><td><p>Which is the Adjective form of the word \"Name\"? ক) proper খ) Nomination গ) concrete ঘ) Nominal</p></td><td><p>ঘ) Nominal</p></td><td><p>nominal = নামমাত্র/নামসংক্রান্ত।</p></td></tr><tr><td><p>8</p></td><td><p>The example of present progressive is- ক) Walking is a good exercise খ) He was reading a novel গ) You have had your meal ঘ) They are gossiping</p></td><td><p>ঘ) They are gossiping</p></td><td><p>am/is/are + V-ing। খ past progressive; গ present perfect; ক gerund।</p></td></tr><tr><td><p>9</p></td><td><p>'Black Sheep' is- ক) A phrase খ) A group গ) A clause ঘ) An idiom</p></td><td><p>ঘ) An idiom</p></td><td><p>black sheep = কুলাঙ্গার।</p></td></tr><tr><td><p>10</p></td><td><p>The meaning of the idiom 'ABC' is- ক) Advanced Knowledge খ) pre-intermediate Knowledge গ) intermediate Knowledge ঘ) Elementary Knowledge</p></td><td><p>ঘ) Elementary Knowledge</p></td><td><p>ABC = প্রাথমিক জ্ঞান।</p></td></tr><tr><td><p>11</p></td><td><p>Which one is the correct spelling? ক) Acomodation খ) Accomodation গ) Accommodassion ঘ) Accommodation</p></td><td><p>ঘ) Accommodation</p></td><td><p>দুটি c, দুটি m।</p></td></tr><tr><td><p>12</p></td><td><p>'Pride and Prejudice' is - ক) Sh /প্রতিরক্ষা-মন্ত্রণালয়-ডিজিএফআই-সহকারী-পরিচালক-22112025/all/mcq-questions\">https://sattacademy.com/প্রতিরক্ষা-মন্ত্রণালয়-ডিজিএফআই-সহকারী-পরিচালক-22112025/all/mcq-questions</a></li></ul><p>সবচেয়ে সাম্প্রতিক প্রতিরক্ষা-সংশ্লিষ্ট AD পরীক্ষা (পূর্ণমান ১০০, সময় ১ ঘণ্টা; বাংলা ২৫, English ২৫, গণিত ১৭, সাধারণ জ্ঞান ২৫, বিজ্ঞান ৭, মানসিক দক্ষতা ১ — পাতার তথ্য)। সাম্প্রতিক আন্তর্জাতিক ঘটনা (অপারেশন সিঁদুর, আব্রাহাম অ্যাকর্ড, মার্কিন নির্বাচন) এসেছে — অধ্যায় ২১ গুরুত্বপূর্ণ।</p><h3><strong>বাংলা</strong></h3><table><thead><tr><th><p><strong>#</strong></p></th><th><p><strong>প্রশ্ন ও বিকল্প (মূল শব্দচয়ন)</strong></p></th><th><p><strong>উত্তর (আমার)</strong></p></th><th><p><strong>বাংলা ব্যাখ্যা</strong></p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p>পাপে বিরত হও-এটি কোন কারক? ক) কর্তৃকারক খ) করণকারক গ) অধিকরণ কারক ঘ) অপাদান কারক</p></td><td><p>ঘ) অপাদান কারক</p></td><td><p>বিরত হওয়া (বিচ্যুতি) → অপাদানে ৭মী।</p></td></tr><tr><td><p>2</p></td><td><p>কোনটি পুনরাবৃত্ত দ্বিত্ব? ক) ঝিলমিল খ) লুচিফুচি গ) এলোমেলো ঘ) কবি কবি</p></td><td><p>ঘ) কবি কবি</p></td><td><p>একই শব্দ হুবহু দুবার = পুনরাবৃত্ত। লুচিফুচি অনুকার; ঝিলমিল ধ্বন্যাত্মক।</p></td></tr><tr><td><p>3</p></td><td><p>'হরদম' শব্দের বিপরীত শব্দ কোনটি? ক) হঠাৎ খ) ব্যর্থ গ) সমস্ত ঘ) সদা</p></td><td><p>ক) হঠাৎ</p></td><td><p>হরদম = সর্বদা; “সদা” সমার্থক। বিকল্পের মধ্যে বিপরীত অর্থে সবচেয়ে কাছে “হঠাৎ” (প্রকৃত বিপরীত “কদাচিৎ”) ⚠।</p></td></tr><tr><td><p>4</p></td><td><p>'এয়ো' শব্দটি কোন শব্দের উদাহরণ? ক) সংস্কৃত খ) প্রাকৃত গ) বাংলা ঘ) তদ্ভব</p></td><td><p>ঘ) তদ্ভব</p></td><td><p>সংস্কৃত অবিধবা → প্রাকৃত অবিহবা → এয়ো। ⚠ উৎস-বিষয়ক প্রশ্নে বইভেদে মতভেদ থাকতে পারে।</p></td></tr><tr><td><p>5</p></td><td><p>কোনটি অনুকার দ্বিত্ব? ক) সুরে সুরে খ) অল্পসল্প গ) দমাদম ঘ) ঘুম ঘুম</p></td><td><p>খ) অল্পসল্প</p></td><td><p>দ্বিতীয় অংশ ধ্বনি বদলে অনুকরণ = অনুকার। দমাদম ধ্বন্যাত্মক।</p></td></tr><tr><td><p>6</p></td><td><p>কূল এর প্রতিশব্দ হলঃ ক) পুলিন খ) ধার গ) উভয় ঘ) একটিও নয়</p></td><td><p>ক) পুলিন</p></td><td><p>কূল = নদী function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { console.warn(e); } }, 150); }

const row = id => S.questions[id] || (S.questions[id] = { attempts: 0, correctCount: 0, wrongCount: 0, box: 0, status: 'new' });
const peek = id => S.questions[id];
const INTERVAL = [0, 1, 3, 7, 15, 30];
function record(id, ok, countIt = true) {
  const r = row(id);
  if (countIt) { r.attempts++; ok ? r.correctCount++ : r.wrongCount++; r.lastCorrect = ok; }
  r.box = ok ? Math.min(5, (r.box || 0) + 1) : 1;
  r.nextReview = new Date(Date.now() + (ok ? INTERVAL[r.box] * DAY : 0)).toISOString();
  if (r.status !== 'mastered') r.status = r.box >= 4 ? 'mastered' : 'learning';
  r.lastAt = new Date().toISOString();
  save();
}
const isDue = id => { const r = peek(id); return r && r.nextReview && new Date(r.nextReview).getTime() <= Date.now() && r.status !== 'mastered'; };
const subjOf = q => q.s || 'অন্যান্য';
function bigSubj(q) {
  const s = subjOf(q);
  if (/গণিত/.test(s)) return 'গণিত';
  if (/English/i.test(s)) return 'English';
  if (/বাংলা/.test(s) && !/বাংলাদেশ/.test(s)) return 'বাংলা';
  return 'সাধারণ জ্ঞান';
}
function stats() {
  let att = 0, cor = 0, mastered = 0, due = 0, bm = 0, notes = 0;
  const bySubj = {};
  for (const [id, r] of Object.entries(S.questions)) {
    const q = QMAP[id]; if (!q) continue;
    att += r.attempts || 0; cor += r.correctCount || 0;
    if (r.status === 'mastered') mastered++; if (isDue(id)) due++; if (r.bookmarked) bm++; if (r.note) notes++;
    const b = bigSubj(q); bySubj[b] = bySubj[b] || { a: 0, c: 0 }; bySubj[b].a += r.attempts || 0; bySubj[b].c += r.correctCount || 0;
  }
  return { att, cor, mastered, due, bm, notes, bySubj, read: Object.values(S.readChapters).filter(Boolean).length };
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let sess = null;
function startSession(ids, title) { sess = { ids, i: 0, title, right: 0, wrong: 0, answered: {} }; current = 'practice'; tabs(); showQ(); }
function optHTML(q, chosen, reveal) {

    let cls = 'opt';
    if (reveal) { if (k === q.a) cls += ' correct'; else if (k === chosen) cls += ' wrong'; }
    return `<button class="${cls}" data-k="${k}" ${reveal ? 'disabled' : ''}><span class="k">${L[k]})</span><span>${esc(o)}</span></button>`;
  }).join('');
}

  return `<span>${esc(s.short)}${q.n ? ' · প্র. ' + BN(q.n) : ''} · ${esc(subjOf(q))} ${REPEATS.has(q.id) ? '<span class="pill">★ পুনরাবৃত্ত</span>' : ''}${extra}</span>`;
}

  const cn = Object.entries(S.chapterNotes).filter(([, v]) => v && v.trim());
  const li = ids => ids.slice(0, 200).map(id => { const q = QMAP[id]; return `<div class="li" data-id="${id}"><span class="muted">${esc(SETOF[id].short)} · ${esc(subjOf(q))}</span><br>${esc(q.q.slice(0, 160))}${(S.questions[id] || {}).note ? `<br><span class="muted">✎ ${esc(S.questions[id].note.slice(0, 120))}</span>` : ''}</div>`; }).join('') || '<p class="muted">কিছু নেই।</p>';
  const block = (t, ids, key) => `<div class="card"><div class="row" style="justify-content:space-between"><h2>${t} (${BN(ids.length)})</h2>${ids.length ? `<button class="btn small primary" data-start="${key}">অনুশীলন</button>` : ''}</div><div class="list">${li(ids)}</div></div>`;
  V().innerHTML = `<div class="grid g2">${block('আজকের রিভিশন (due)', due, 'due')}${block('বারবার ভুল', wrong, 'wrong')}${block('বুকমার্ক', bm, 'bm')}${block('প্রশ্নের নোট', notes, 'notes')}
    <div class="card"><h2>অধ্যায়ের নোট (${BN(cn.length)})</h2><div class="list">${cn.map(([i, v]) => `<div class="li" data-ch="${i}"><b>${esc((GUIDE[i] || {}).title || '')}</b><br><span class="muted">${esc(v.slice(0, 200))}</span></div>`).join('') || '<p class="muted">কিছু নেই।</p>'}</div></div></div>`;
  const lists = { due, wrong, bm, notes };
  V().querySelectorAll('[data-start]').forEach(b => b.onclick = () => startSession(lists[b.dataset.start], b.closest('.card').querySelector('h2').textContent));
  V().querySelectorAll('[data-id]').forEach(d => d.onclick = () => startSession([d.dataset.id], 'একটি প্রশ্ন'));
  V().querySelectorAll('[data-ch]').forEach(d => d.onclick = () => go('read', +d.dataset.ch));
}

// ---------- search ----------
function search(term) {
  term = (term || $('gq').value || '').trim(); $('gq').value = term;
  if (!term) { V().innerHTML = '<div class="card"><p>উপরের বাক্সে শব্দ লিখে খুঁজুন — প্রশ্ন, উত্তর, ব্যাখ্যা ও গাইডের সব অধ্যায়ে।</p></div>'; return; }
  const t = term.toLowerCase();
  const qs = ALLQ.filter(q => (q.q + ' ' + q.o.join(' ') + ' ' + (q.e || '') + ' ' + (q.ansText || '')).toLowerCase().includes(t));
  const ch = GUIDE.map((g, i) => [i, g]).filter(([i]) => GTEXT[i].includes(t));
  V().innerHTML = `<div class="grid g2"><div class="card"><div class="row" style="justify-content:space-between"><h2>প্রশ্ন (${BN(qs.length)})</h2>${qs.length ? '<button class="btn small primary" id="sall">সবগুলো অনুশীলন</button>' : ''}</div><div class="list">${qs.slice(0, 150).map(q => `<div class="li" data-id="${q.id}"><span class="muted">${esc(SETOF[q.id].short)} · ${esc(subjOf(q))}</span><br>${esc(q.q.slice(0, 200))}<br><b>${esc(q.a >= 0 ? q.o[q.a] : q.ansText || '')}</b></div>`).join('') || '<p class="muted">কিছু পাওয়া যায়নি।</p>'}</div></div>
    <div class="card"><h2>গাইডের অধ্যায় (${BN(ch.length)})</h2><div class="list">${ch.map(([i, g]) => { const k = GTEXT[i].indexOf(t); return `<div class="li" data-ch="${i}"><b>${esc(g.title)}</b><br><span class="muted">…${esc(GTEXT[i].slice(Math.max(0, k - 60), k + 90))}…</span></div>`; }).join('') || '<p class="muted">কিছু পাওয়া যায়নি।</p>'}</div></div></div>`;
  if ($('sall')) $('sall').onclick = () => startSession(qs.map(q => q.id), `খোঁজ: ${term}`);
  V().querySelectorAll('[data-id]').forEach(d => d.onclick = () => startSession([d.dataset.id], 'খোঁজার ফল'));
  V().querySelectorAll('[data-ch]').forEach(d => d.onclick = () => { go('read', { i: +d.dataset.ch, term }); });
}

tabs(); home();
})();

</script>
</body>
