্গল), বৈষ্ণব পদাবলি, অনুবাদ (কৃত্তিবাসের রামায়ণ, কাশীরাম দাসের মহাভারত), রোমান্টিক প্রণয়োপাখ্যান (শাহ মুহম্মদ সগীরের “ইউসুফ-জোলেখা”, আলাওলের “পদ্মাবতী”), মৈমনসিংহ গীতিকা, দোভাষী পুঁথি (ফকির গরীবুল্লাহ)</p></td></tr><tr><td><p>আধুনিক যুগ</p></td><td><p>১৮০১ – বর্তমান</p></td><td><p>ফোর্ট উইলিয়াম কলেজ (১৮০০; বাংলা বিভাগের প্রধান উইলিয়াম কেরি), গদ্যের বিকাশ</p></td></tr></tbody></table><table><thead><tr><th><p><strong>সাহিত্যিক</strong></p></th><th><p><strong>গুরুত্বপূর্ণ তথ্য ও রচনা</strong></p></th></tr></thead><tbody><tr><td><p>ঈশ্বরচন্দ্র বিদ্যাসাগর</p></td><td><p>বাংলা গদ্যের জনক; যতিচিহ্নের সার্থক প্রয়োগ। বেতাল পঞ্চবিংশতি, শকুন্তলা, সীতার বনবাস, বর্ণপরিচয়, ভ্রান্তিবিলাস</p></td></tr><tr><td><p>মাইকেল মধুসূদন দত্ত</p></td><td><p>অমিত্রাক্ষর ছন্দ ও সনেটের প্রবর্তক; প্রথম সার্থক নাটক <strong>শর্মিষ্ঠা</strong> (১৮৫৯); প্রথম সার্থক মহাকাব্য <strong>মেঘনাদবধ কাব্য</strong> (১৮৬১); প্রহসন: একেই কি বলে সভ্যতা?, বুড়ো সালিকের ঘাড়ে রোঁ; চতুর্দশপদী কবিতাবলী</p></td></tr><tr><td><p>বঙ্কিমচন্দ্র চট্টোপাধ্যায়</p></td><td><p>প্রথম সার্থক উপন্যাস <strong>দুর্গেশনন্দিনী</strong> (১৮৬৫); কপালকুণ্ডলা, আনন্দমঠ (“বন্দে মাতরম্”), বিষবৃক্ষ, কৃষ্ণকান্তের উইল; “বঙ্গদর্শন” পত্রিকা (১৮৭২); “সাহিত্যসম্রাট”</p></td></tr><tr><td><p>প্যারীচাঁদ মিত্র</p></td><td><p>ছদ্মনাম টেকচাঁদ ঠাকুর; <strong>আলালের ঘরের দুলাল</strong> (বাংলা উপন্যাসের প্রথম প্রয়াস; “মাসিক পত্রিকা”-য় ধারাবাহিক — ৪৭তম বিসিএস)</p></td></tr><tr><td><p>মীর মশাররফ হোসেন</p></td><td><p>বিষাদ-সিন্ধু (কারবালার কাহিনি), জমিদার দর্পণ (নাটক), গাজী মিয়াঁর বস্তানী</p></td></tr><tr><td><p>রবীন্দ্রনাথ ঠাকুর</p></td><td><p>জন্ম ১৮৬১, মৃত্যু ১৯৪১; ছদ্মনাম <strong>ভানুসিংহ ঠাকুর</strong>; <strong>১৯১৩-তে নোবেল</strong> (Gitanjali: Song Offerings) — প্রথম এশীয়; উপন্যাস: গোরা, ঘরে-বাইরে, চোখের বালি, শেষের কবিতা, যোগাযোগ; কাব্য: সোনার তরী, বলাকা, মানসী, গীতাঞ্জলি; নাটক: রক্তকরবী, ডাকঘর; গল্প: পোস্টমাস্টার, সমাপ্তি (মৃন্ময়ী — BB AD ২০১৫), কাবুলিওয়ালা; বাংলাদেশ ও ভারতের জাতীয় সংগীতের রচয়িতা</p></td></tr><tr><td><p>কাজী নজরুল ইসলাম</p></td><td><p>জাতীয় কবি; “বিদ্রোহী কবি”; অগ্নিবীণা (প্রথম কাব্য, “বিদ্রোহী” কবিতা), বিষের বাঁশী, সাম্যবাদী, সিন্ধু-হিন্দোল (“দারিদ্র্য”), সঞ্চিতা; উপন্যাস: মৃত্যুক্ষুধা, বাঁধনহারা, কুহেলিকা; প্রবন্ধ: যুগবাণী (প্রথম, ৫০তম বিসিএস), রাজবন্দীর জবানবন্দী; পত্রিকা: <strong>ধূমকেতু</strong>, লাঙল; রণসংগীত “চল চল চল”; ১৯৭২-এ বাংলাদেশে আনা হয়, মৃত্যু ১৯৭৬</p></td></tr><tr><td><p>শরৎচন্দ্র চট্টোপাধ্যায়</p></td><td><p>“অপরাজেয় কথাশিল্পী”; দেবদাস, শ্রীকান্ত, গৃহদাহ, পথের দাবী (বাজেয়াপ্ত), দেনাপাওনা, পল্লীসমাজ</p></td></tr><tr><td><p>বেগম রোকেয়া</p></td><td><p>নারী জাগরণের অগ্রদূত; সুলতানাস ড্রিম (ইংরেজিতে), অবরোধবাসিনী, মতিচূর, পদ্মরাগ; সাখাওয়াত মেমোরিয়াল গার্লস স্কুল; ৯ ডিসেম্বর রোকেয়া দিবস</p></td></tr><tr><td><p>জসীমউদ্দীন</p></td><td><p>“পল্লীকবি”; নকশী কাঁথার মাঠ, সোজন বাদিয়ার ঘাট, রাখালী (“কবর” — প্রথম প্রকাশ “কল্লোল”-এ; ৫০তম বিসিএস)</p></td></tr><tr><td><p>জীবনানন্দ দাশ</p></td><td><p>“রূপসী বাংলার কবি”, “নির্জনতম কবি”; বনলতা সেন, রূপসী বাংলা, ঝরা পালক, ধূসর পাণ্ডুলিপি</p></td></tr><tr><td><p>বিভূতিভূষণ বন্দ্যোপাধ্যায়</p></td><td><p>পথের পাঁচালী, অপরাজিত, আরণ্যক, ইছামতী, অশনি সংকেত (১৩৫০-এর মন্বন্তর — ৫০তম বিসিএস)</p></td></tr><tr><td><p>মানিক বন্দ্যোপাধ্যায়</p></td><td><p>পদ্মানদীর মাঝি (জেলে-জীবন), পুতুলনাচের ইতিকথা, দিবারাত্রির কাব্য</p></td></tr><tr><td><p>তারাশঙ্কর বন্দ্যোপাধ্যায়</p></td><td><p>কবি (ডোম সম্প্রদায় — ৫০তম বিসিএস), হাঁসুলী বাঁকের উপকথা, গণদেবতা, আরোগ্য নিকেতন</p></td></tr><tr><td><p>সৈয়দ ওয়ালীউল্লাহ</p></td><td><p>লালসালু (প্রথম উপন্যাস, ১৯৪৮), চাঁদের অমাবস্যা, কাঁদো নদী কাঁদো; নাটক: বহিপীর</p></td></tr><tr><td><p>মুনীর চৌধুরী</p></td><td><p>কবর (ভাষা আন্দোলনভিত্তিক নাটক, কারাগারে রচিত ১৯৫৩), রক্তাক্ত প্রান্তর (পানিপথের যুদ্ধ); মুনীর অপটিমা টাইপরাইটার</p></td></tr><tr><td><p>শহীদুল্লা কায়সার</p></td><td><p>সংশপ্তক, সারেং বৌ</p></td></tr><tr><td><p>শামসুর রাহমান</p></td><td><p>“স্বাধীনতা তুমি”, “তোমাকে পাওয়ার জন্য হে স্বাধীনতা”; বন্দী শিবির থেকে; ছদ্মনাম <strong>মজলুম আদিব</strong> (৫০তম বিসিএস)</p></td></tr><tr><td><p>সৈয়দ শামসুল হক</p></td><td><p>“সব্যসাচী লেখক”; নূরলদীনের সারাজীবন, পায়ের আওয়াজ পাওয়া যায় (২০২৩ প্র. ৫), নিষিদ্ধ লোবান, খেলারাম খেলে যা</p></td></tr><tr><td><p>হুমায়ূন আহমেদ</p></td><td><p>নন্দিত নরকে (প্রথম), শঙ্খনীল কারাগার, জোছনা ও জননীর গল্প (মুক্তিযুদ্ধ), হিমু ও মিসির আলি চরিত্র</p></td></tr><tr><td><p>মুক্তিযুদ্ধভিত্তিক উপন্যাস</p></td><td><p>জাহান্নাম হইতে বিদায় (শওকত ওসমান), রাইফেল রোটি আওরাত (আনোয়ার পাশা), যাত্রা (শওকত আলী — ৫০তম বিসিএস), হাঙর নদী গ্রেনেড (সেলিনা হোসেন), নিষিদ্ধ লোবান (সৈয়দ শামসুল হক), একাত্তরের দিনগুলি (জাহানারা ইমাম — দিনলিপি, উপন্যাস নয়)</p></td></tr></tbody></table>"},{"title":"অধ্যায় ৮: English Language and Literature — স্টাডি নোট","html":"<p>ব্যাখ্যা বাংলায়, উদাহরণ ও প্রশ্ন English-এ। সব উদাহরণ <strong>প্রকৃত বিগত প্রশ্ন</strong> (সাল ও প্র. নং সহ) বা সংলগ্ন নিয়ম।</p><h2><a id=\"_Toc70\"></a><strong>৮.১ গ্রামার নিয়ম (প্রশ্নপত্র-কেন্দ্রিক)</strong></h2><table><thead><tr><th><p><strong>নিয়ম (বাংলায়)</strong></p></th><th><p><strong>উদাহরণ/প্রশ্ন</strong></p></th><th><p><strong>প্রশ্নপত্র</strong></p></th></tr></thead><tbody><tr><td><p><strong>had better + base verb (to ছাড়া)</strong> — “উচিত/ভালো হবে” অর্থে</p></td><td><p>You had better <strong>go</strong> there. ✗ going / gone / to be going</p></td><td><p>২০১৮ প্র. ৩১</p></td></tr><tr><td><p><strong>It is (high) time + subject + past form</strong> — কাল্পনিক/প্রত্যাশিত কাজ; verb থাকে past form-এ</p></td><td><p>It is time he <strong>changed</strong> his bad habits.</p></td><td><p>২০১৮ প্র. ৩৯</p></td></tr><tr><td><p><strong>Passive-এ কিছু verb-এর পর by নয়, নির্দিষ্ট preposition:</strong> annoyed <strong>at/with</strong>, pleased <strong>with</strong>, surprised <strong>at</strong></p></td><td><p>His conduct annoyed me → I was annoyed <strong>at</strong> his conduct.</p></td><td><p>২০১৮ প্র. ৩৭</p></td></tr><tr><td><p><strong>finish + V-ing (gerund)</strong> — finish-এর পরে gerund বসে</p></td><td><p>I have finished <strong>reading</strong> the book. (✗ finished read)</p></td><td><p>২০১৮ প্র. ২৯ (বাতিল)</p></td></tr><tr><td><p><strong>Participle clause (একই কর্তা):</strong> “while + V-ing”</p></td><td><p>He found the gold coin <strong>while cleaning</strong> the floor.</p></td><td><p>২০১৮ প্র. ৩৩; ২০১৯ প্র. ৩৩</p></td></tr><tr><td><p><strong>Word form:</strong> noun → verb প্রত্যয় -ate/-ise/-en</p></td><td><p>necessity → <strong>necessitate</strong></p></td><td><p>২০১৮ প্র. ৩০</p></td></tr><tr><td><p><strong>Gender:</strong> stag (পুরুষ হরিণ) ↔ doe/hind (স্ত্রী হরিণ); fox ↔ vixen</p></td><td><p>Which is masculine? → <strong>Stag</strong></p></td><td><p>২০১৮ প্র. ৪০</p></td></tr><tr><td><p><strong>Number:</strong> irregular plural — ox → <strong>oxen</strong>; fish একবচন-বহুবচন একই রকম</p></td><td><p>Which is plural? → <strong>Oxen</strong>; fish = singular/plural</p></td><td><p>২০২৩ প্র. ৪৬, ৮৩</p></td></tr><tr><td><p><strong>Parts of speech:</strong> একই শব্দ বাক্যভেদে ভিন্ন পদ — “Still waters run deep”-এ still = <strong>adjective</strong> (নিস্তব্ধ)</p></td><td><p>Still waters run deep.</p></td><td><p>২০২৩ প্র. ২৫</p></td></tr><tr><td><p><strong>Prefix:</strong> a- (না/অ) + moral = <strong>amoral</strong> (নীতিবর্জিত); Authentic, Amnesia, Aspersions-এ a- prefix নয়</p></td><td><p>Which is formed with a prefix? → Amoral</p></td><td><p>২০২৩ প্র. ৬৭</p></td></tr><tr><td><p><strong>Intensifier:</strong> very sweet (খুব মিষ্টি); too/much too/excessive — অতিরিক্ত অর্থ</p></td><td><p>Honey is <strong>very</strong> sweet.</p></td><td><p>২০২৩ প্র. ৮৬</p></td></tr><tr><td><p><strong>Verb (archaic adj. ফাঁদ):</strong> bounden = কর্তব্যবদ্ধ (adjective), verb নয়; threaten, worsen, flatter = verb</p></td><td><p>Which is not a verb? → bounden</p></td><td><p>২০২৩ প্র. ১০০</p></td></tr><tr><td><p><strong>Sentence expressing wonder (exclamatory sense):</strong> “Who would have thought Shylock was so unkind” → wonder</p></td><td><p>—</p></td><td><p>২০১৮ প্র. ২৮</p></td></tr></tbody></table><h2><a id=\"_Toc71\"></a><strong>৮.২ Idiom ও Phrasal verb</strong></h2><table><thead><tr><th><p><strong>Expression</strong></p></th><th><p><strong>বাংলা অর্থ</strong></p></th><th><p><strong>প্রশ্নপত্র</strong></p></th></tr></thead><tbody><tr><td><p>wear your heart on your sleeve</p></td><td><p>মনের অনুভূতি অন্যকে দেখতে দেওয়া</p></td><td><p>২০১৮ প্র. ২৪</p></td></tr><tr><td><p>make ends meet</p></td><td><p>আয়ের মধ্যে চলা (ক্ষুদ্র আয়ে সংসার চালানো)</p></td><td><p>২০১৮ প্র. ২৫</p></td></tr><tr><td><p>few and far between</p></td><td><p>বিরল, কালেভদ্রে (infrequent)</p></td><td><p>২০১৮ প্র. ৩৫</p></td></tr><tr><td><p>once in a blue moon</p></td><td><p>কালেভদ্রে (very rarely)</p></td><td><p>২০২৩ প্র. ৬৮</p></td></tr><tr><td><p>Achilles heel</p></td><td><p>দুর্বল জায়গা</p></td><td><p>২০২৩ প্র. ২৭</p></td></tr><tr><td><p>put up with</p></td><td><p>সহ্য করা (tolerate)</p></td><td><p>২০২৩ প্র. ৩২</p></td></tr><tr><td><p>a bad egg</p></td><td><p>অবিশ্বাসী/অপদার্থ ব্যক্তি (চাবি: unreliable person)</p></td><td><p>২০২৩ প্র. ৯০</p></td></tr><tr><td><p>finger in the pie</p></td><td><p>কোনো কিছুতে জড়িত থাকা</p></td><td><p>২০১৯ প্র. ২৪</p></td></tr><tr><td><p>face the music</p></td><td><p>ফলাফলের মুখোমুখি হওয়া/সমস্যা সামলানো</p></td><td><p>২০১৯ প্র. ৩৫</p></td></tr><tr><td><p>give me a hand</p></td><td><p>সাহায্য করা</p></td><td><p>২০১৯ প্র. ২৫</p></td></tr><tr><td><p>that’s it</p></td><td><p>ব্যস, এটুকুই/শেষ</p></td><td><p>২০১৯ প্র. ২৬</p></td></tr><tr><td><p>get away with (it)</p></td><td><p>শাস্তি এড়িয়ে পার পাওয়া</p></td><td><p>২০১৯ প্র. ২৭</p></td></tr><tr><td><p>come across</p></td><td><p>কারও ওপর ছাপ ফেলা/ব্যক্তিত্ব প্রকাশ পাওয়া (come across as)</p></td><td><p>২০১৯ প্র. ২১</p></td></tr><tr><td><p>look out for</p></td><td><p>সতর্ক দৃষ্টি রাখা</p></td><td><p>২০১৯ প্র. ২২</p></td></tr><tr><td><p>expand on</p></td><td><p>বিস্তারিত বর্ণনা করা</p></td><td><p>২০১৯ প্র. ৩৮</p></td></tr><tr><td><p>blow up</p></td><td><p>বিস্ফোরণে উড়িয়ে দেওয়া</p></td><td><p>২০১৯ প্র. ৪০</p></td></tr></tbody></table><h2><a id=\"_Toc72\"></a><strong>৮.৩ Vocabulary</strong></h2><table><thead><tr><th><p><strong>Word</strong></p></th><th><p><strong>বাংলা অর্থ</strong></p></th><th><p><strong>Synonym / Antonym</strong></p></th><th><p><strong>প্রশ্নপত্র</strong></p></th></tr></thead><tbody><tr><td><p>stupendous</p></td><td><p>বিস্ময়কর, বিশাল</p></td><td><p>awesome</p></td><td><p>২০১৮ প্র. ২১</p></td></tr><tr><td><p>heckle</p></td><td><p>বক্তৃতায় বাধা/বিদ্রূপ করা</p></td><td><p>disrupt (চাবি)</p></td><td><p>২০১৮ প্র. ২৬</p></td></tr><tr><td><p>protrude</p></td><td><p>বেরিয়ে থাকা</p></td><td><p>stick out</p></td><td><p>২০১৮ প্র. ২৭</p></td></tr><tr><td><p>dwindle</p></td><td><p>ক্রমে কমে যাওয়া</p></td><td><p>drop, decrease</p></td><td><p>২০১৮ প্র. ৩৪</p></td></tr><tr><td><p>concord</p></td><td><p>ঐক্য, সম্প্রীতি</p></td><td><p>harmony; ant: conflict</p></td><td><p>২০২৩ প্র. ৮</p></td></tr><tr><td><p>transitory</p></td><td><p>ক্ষণস্থায়ী</p></td><td><p>ant: permanent</p></td><td><p>২০২৩ প্র. ৩৮</p></td></tr><tr><td><p>franchise</p></td><td><p>বিশেষ অধিকার/ভোটাধিকার/স্বত্ব</p></td><td><p>privilege</p></td><td><p>২০২৩ প্র. ৮৫</p></td></tr><tr><td><p>bounty</p></td><td><p>উদারতা, দান</p></td><td><p>generosity</p></td><td><p>২০২৩ প্র. ৯৩</p></td></tr><tr><td><p>yearn</p></td><td><p>তীব্র আকাঙ্ক্ষা করা</p></td><td><p>long, desire; ant (চাবি): refuse</p></td><td><p>২০১৯ প্র. ৩৪</p></td></tr><tr><td><p>dither</p></td><td><p>দ্বিধা করা, সিদ্ধান্তহীনতায় সময় নষ্ট করা</p></td><td><p>—</p></td><td><p>২০১৯ প্র. ২৮</p></td></tr><tr><td><p>undulating</p></td><td><p>তরঙ্গায়িত, ঢেউখেলানো</p></td><td><p>—</p></td><td><p>২০১৯ প্র. ২৩</p></td></tr><tr><td><p>articulate</p></td><td><p>স্পষ্টভাষী</p></td><td><p>—</p></td><td><p>২০১৯ প্র. ৩৮</p></td></tr></tbody></table><p><strong>Spelling:</strong> Perseverance · sovereignty · ascertain · (ভুল: Persiverence, soverinty, ascientain)। <strong>Homophones:</strong> scene/seen · rows/rose/roams/raids (২০১৯ প্র. ৩৬-৩৭)। <strong>Abbreviation:</strong> AD = Anno Domini (২০২৩ প্র. ২৬)।</p><h2><a id=\"_Toc73\"></a><strong>৮.৪ English Literature</strong></h2><table><thead><tr><th><p><strong>তথ্য</strong></p></th><th><p><strong>প্রশ্নপত্র</strong></p></th></tr></thead><tbody><tr><td><p><strong>Paradise Lost</strong> (John Milton): Book I ও II-এর প্রধান চরিত্র <strong>Satan</strong>।</p></td><td><p>২০১৮ প্র. ৩৮; ২০১৯ প্র. ৩৯</p></td></tr><tr><td><p><strong>Limerick</strong> — পাঁচ লাইনের হাস্যরসাত্মক কবিতা (funny poem of five lines)।</p></td><td><p>২০১৮ প্র. ৩২</p></td></tr><tr><td><p><strong>Ozymandias</strong> (Shelley): visage = <strong>face</strong>।</p></td><td><p>২০২৩ প্র. ৯</p></td></tr><tr><td><p><strong>Charles Dickens:</strong> লন্ডন শহর তাঁর রচনায় জীবন্ত সত্তার মতো।</p></td><td><p>২০২৩ প্র. ৪১</p></td></tr><tr><td><p><strong>The House of Fame</strong> — Geoffrey Chaucer।</p></td><td><p>২০২৩ প্র. ৬৫</p></td></tr><tr><td><p><strong>W. B. Yeats</strong> উপন্যাসিক নন (কবি)। Dickens, Joyce, Austen — ঔপন্যাসিক।</p></td><td><p>২০২৩ প্র. ৫৩</p></td></tr><tr><td><p><strong>The Modern State</strong> — R. M. MacIver · <strong>Clash of Civilizations</strong> — Samuel P. Huntington · <strong>Fire and Fury</strong> — Michael Wolff · <strong>Rules of Civility</strong> — Amor Towles.</p></td><td><p>২০১৮ প্র. ৫১, ৫৭; ২০১৯ প্র. ৭০, ৭৫</p></td></tr></tbody></table><p><strong>সংস্করণ ৪ — বিস্তারিত নোট (৮.৫–৮.১৪):</strong> নিয়ম বাংলায়, উদাহরণ ইংরেজিতে। ✔ = শুদ্ধ, ✗ = অশুদ্ধ। মন্ত্রণালয়ের প্রশ্নপত্রে English থেকে ২০টি করে প্রশ্ন এসেছে (অগ্রাধিকার A)।</p><h2><a id=\"_Toc74\"></a><strong>৮.৫ Subject-Verb Agreement (কর্তা ও ক্রিয়ার সামঞ্জস্য)</strong></h2><table><thead><tr><th><p><strong>নিয়ম</strong></p></th><th><p><strong>উদাহরণ</strong></p></th></tr></thead><tbody><tr><td><p><strong>and</strong> দিয়ে যুক্ত দুটি কর্তা → plural verb</p></td><td><p>Rahim and Karim <strong>are</strong> friends. ✔</p></td></tr><tr><td><p>কিন্তু and-যুক্ত দুটি শব্দ একই ব্যক্তি/বস্তু বোঝালে → singular</p></td><td><p>The poet and philosopher <strong>is</strong> dead. (একজন ব্যক্তি) · Bread and butter <strong>is</strong> my breakfast.</p></td></tr><tr><td><p><strong>each, every, either, neither, everyone, somebody, nobody</strong> → singular</p></td><td><p>Each of the boys <strong>has</strong> a pen. ✔ · Neither of them <strong>was</strong> present. ✔</p></td></tr><tr><td><p><strong>either…or / neither…nor / not only…but also</strong> → নিকটবর্তী কর্তা অনুযায়ী</p></td><td><p>Neither the teacher nor the students <strong>were</strong> there. · Neither the students nor the teacher <strong>was</strong> there.</p></td></tr><tr><td><p><strong>as well as, along with, together with, with, besides</strong> → প্রথম কর্তা অনুযায়ী</p></td><td><p>The captain, as well as the players, <strong>was</strong> praised. ✔</p></td></tr><tr><td><p><strong>The number of</strong> → singular; <strong>A number of</strong> → plural</p></td><td><p>The number of students <strong>is</strong> 50. · A number of students <strong>are</strong> absent.</p></td></tr><tr><td><p><strong>Collective noun</strong> — একক দল হিসেবে singular, সদস্যদের আলাদা বোঝালে plural</p></td><td><p>The jury <strong>has</strong> given its verdict. · The jury <strong>are</strong> divided in their opinion.</p></td></tr><tr><td><p>সবসময় plural: <strong>cattle, police, people, poultry, gentry</strong></p></td><td><p>The police <strong>have</strong> arrested the thief. ✔ (✗ has)</p></td></tr><tr><td><p>দেখতে plural কিন্তু singular: <strong>news, physics, mathematics, economics, politics (বিষয়)</strong></p></td><td><p>The news <strong>is</strong> true. ✔ · Mathematics <strong>is</strong> my favourite subject.</p></td></tr><tr><td><p>সবসময় uncountable/singular: <strong>information, advice, furniture, luggage, equipment, scenery</strong></p></td><td><p>He gave me <strong>some advice</strong> (✗ advices). · The scenery <strong>is</strong> beautiful.</p></td></tr><tr><td><p>সময়, দূরত্ব, অর্থের পরিমাণ এক একক হিসেবে → singular</p></td><td><p>Ten miles <strong>is</strong> a long distance. · Five hundred taka <strong>is</strong> enough.</p></td></tr><tr><td><p><strong>One of + plural noun</strong> → singular verb; <strong>one of those who</strong> → plural verb</p></td><td><p>One of the boys <strong>is</strong> absent. · He is one of those who <strong>work</strong> hard.</p></td></tr><tr><td><p><strong>Many a + singular noun</strong> → singular verb</p></td><td><p>Many a man <strong>has</strong> died in the war. ✔</p></td></tr></tbody></table><h2><a id=\"_Toc75\"></a><strong>৮.৬ Tense — গঠন ও ব্যবহার</strong></h2><table><thead><tr><th><p><strong>Tense</strong></p></th><th><p><strong>গঠন</strong></p></th><th><p><strong>চেনার শব্দ / ব্যবহার</strong></p></th></tr></thead><tbody><tr><td><p>Present indefinite</p></td><td><p>S + V1 (s/es)</p></td><td><p>চিরন্তন সত্য, অভ্যাস: always, every day — The sun <strong>rises</strong> in the east.</p></td></tr><tr><td><p>Present continuous</p></td><td><p>S + am/is/are + V-ing</p></td><td><p>now, at present; নিকট ভবিষ্যৎ পরিকল্পনা</p></td></tr><tr><td><p>Present perfect</p></td><td><p>S + have/has + V3</p></td><td><p>just, already, yet, ever, never, recently; <strong>নির্দিষ্ট অতীত সময় (yesterday, ago) থাকলে নয়</strong> — I have seen him yesterday ✗</p></td></tr><tr><td><p>Present perfect continuous</p></td><td><p>S + have/has been + V-ing</p></td><td><p>for/since + সময় — I <strong>have been reading</strong> for two hours.</p></td></tr><tr><td><p>Past indefinite</p></td><td><p>S + V2</p></td><td><p>yesterday, ago, last year; <strong>It is time + past</strong> (২০১৮ প্র. ৩৯); <strong>wish/as if + past (were)</strong></p></td></tr><tr><td><p>Past continuous</p></td><td><p>S + was/were + V-ing</p></td><td><p>While I <strong>was reading</strong>, he came.</p></td></tr><tr><td><p>Past perfect</p></td><td><p>S + had + V3</p></td><td><p>অতীতের দুটি কাজের মধ্যে যেটি আগে: The train <strong>had left</strong> before I reached.</p></td></tr><tr><td><p>Future indefinite</p></td><td><p>S + shall/will + V1</p></td><td><p>tomorrow, next week</p></td></tr><tr><td><p>Future perfect</p></td><td><p>S + shall/will have + V3</p></td><td><p>by + ভবিষ্যৎ সময় — I <strong>will have finished</strong> it by Friday.</p></td></tr></tbody></table><ul><li><strong>Since vs for:</strong> since + সময়ের শুরুর বিন্দু (since 2020, since morning); for + সময়ের ব্যাপ্তি (for three years)। <strong>Since-এর আগের clause present perfect, পরের clause past indefinite:</strong> It <strong>has been</strong> ten years since he <strong>died</strong>.</li><li><strong>Before/after:</strong> before-এর আগে past perfect, after-এর পরে past perfect — The patient <strong>had died</strong> before the doctor <strong>came</strong>. · The doctor came after the patient <strong>had died</strong>.</li></ul><h2><a id=\"_Toc76\"></a><strong>৮.৭ Voice (বাচ্য) পরিবর্তন</strong></h2><table><thead><tr><th><p><strong>Tense</strong></p></th><th><p><strong>Active</strong></p></th><th><p><strong>Passive</strong></p></th></tr></thead><tbody><tr><td><p>Present indefinite</p></td><td><p>He writes a letter.</p></td><td><p>A letter <strong>is written</strong> by him.</p></td></tr><tr><td><p>Present continuous</p></td><td><p>He is writing a letter.</p></td><td><p>A letter <strong>is being written</strong> by him.</p></td></tr><tr><td><p>Present perfect</p></td><td><p>He has written a letter.</p></td><td><p>A letter <strong>has been written</strong> by him.</p></td></tr><tr><td><p>Past indefinite</p></td><td><p>He wrote a letter.</p></td><td><p>A letter <strong>was written</strong> by him.</p></td></tr><tr><td><p>Future</p></td><td><p>He will write a letter.</p></td><td><p>A letter <strong>will be written</strong> by him.</p></td></tr><tr><td><p>Modal</p></td><td><p>You must do it.</p></td><td><p>It <strong>must be done</strong> by you.</p></td></tr><tr><td><p>Imperative</p></td><td><p>Open the door.</p></td><td><p><strong>Let</strong> the door <strong>be opened</strong>.</p></td></tr><tr><td><p>Interrogative (who)</p></td><td><p>Who wrote it?</p></td><td><p><strong>By whom was</strong> it written?</p></td></tr></tbody></table><ul><li><strong>by ছাড়া অন্য preposition:</strong> known <strong>to</strong>, pleased/satisfied <strong>with</strong>, surprised/annoyed <strong>at</strong>, interested <strong>in</strong>, married <strong>to</strong> (৪৭তম বিসিএস), filled <strong>with</strong>, covered <strong>with</strong> (২০১৮ প্র. ৩৭ দেখুন)।</li><li><strong>Continuous-এর passive হয় শুধু present ও past continuous-এ</strong>; perfect continuous ও future continuous-এর passive সাধারণত হয় না।</li></ul><h2><a id=\"_Toc77\"></a><strong>৮.৮ Narration (উক্তি পরিবর্তন)</strong></h2><ul><li><strong>Reporting verb past হলে</strong> reported speech-এ tense এক ধাপ পেছায়: present → past, past → past perfect (৫০তম বিসিএস: “I took” → “she had taken”), will → would, can → could, may → might। <strong>চিরন্তন সত্য</strong> হলে tense বদলায় না — He said that the earth <strong>moves</strong> round the sun.</li></ul><table><thead><tr><th><p><strong>Direct</strong></p></th><th><p><strong>Indirect</strong></p></th><th><p><strong>Direct</strong></p></th><th><p><strong>Indirect</strong></p></th></tr></thead><tbody><tr><td><p>now</p></td><td><p>then</p></td><td><p>today</p></td><td><p>that day</p></td></tr><tr><td><p>here</p></td><td><p>there</p></td><td><p>tonight</p></td><td><p>that night</p></td></tr><tr><td><p>this/these</p></td><td><p>that/those</p></td><td><p>yesterday</p></td><td><p>the previous day / the day before</p></td></tr><tr><td><p>ago</p></td><td><p>before</p></td><td><p>tomorrow</p></td><td><p>the next day / the following day</p></td></tr><tr><td><p>come</p></td><td><p>go (প্রসঙ্গভেদে)</p></td><td><p>last night</p></td><td><p>the previous night</p></td></tr></tbody></table><ul><li><strong>Interrogative:</strong> said → asked; yes/no প্রশ্নে if/whether; বাক্য assertive হয় — He said to me, “Are you ill?” → He <strong>asked me if I was</strong> ill. <strong>Imperative:</strong> said → ordered/requested/advised + to — He said to me, “Please help me.” → He <strong>requested me to help</strong> him. <strong>Exclamatory:</strong> exclaimed with joy/sorrow; <strong>Optative:</strong> wished/prayed.</li></ul><h2><a id=\"_Toc78\"></a><strong>৮.৯ Conditional ও বিশেষ কাঠামো</strong></h2><table><thead><tr><th><p><strong>ধরন</strong></p></th><th><p><strong>কাঠামো</strong></p></th><th><p><strong>উদাহরণ</strong></p></th></tr></thead><tbody><tr><td><p>Type 1 (সম্ভাব্য)</p></td><td><p>If + present, will + V1</p></td><td><p>If it rains, I <strong>will</strong> stay home.</p></td></tr><tr><td><p>Type 2 (কাল্পনিক বর্তমান)</p></td><td><p>If + past (were), would + V1</p></td><td><p>If I <strong>were</strong> a bird, I <strong>would</strong> fly.</p></td></tr><tr><td><p>Type 3 (অতীতের অবাস্তব)</p></td><td><p>If + had + V3, would have + V3</p></td><td><p>If he <strong>had worked</strong> hard, he <strong>would have passed</strong>.</p></td></tr><tr><td><p>Inversion</p></td><td><p>Had/Were/Should + subject</p></td><td><p><strong>Had</strong> I known, I would have come. · <strong>Were</strong> I rich, I would help.</p></td></tr></tbody></table><ul><li><strong>Would rather / had better + V1</strong> (২০১৮ প্র. ৩১): You had better <strong>go</strong>. · I would rather <strong>die</strong> than beg. <strong>Lest … should</strong>: Walk fast lest you <strong>should</strong> miss the train. <strong>No sooner had … than</strong>; <strong>Hardly/Scarcely had … when</strong>।</li><li><strong>Gerund বনাম Infinitive:</strong> avoid, enjoy, finish, mind, deny, postpone, practise, can't help, look forward to, be used to, object to, with a view to-এর পর <strong>V-ing</strong> — I look forward to <strong>meeting</strong> you. decide, want, hope, agree, refuse, plan-এর পর <strong>to + V1</strong>।</li></ul><h2><a id=\"_Toc79\"></a><strong>৮.১০ Article (a, an, the)</strong></h2><ul><li><strong>উচ্চারণ অনুযায়ী:</strong> a European, a university, a one-taka note, a uniform (উচ্চারণ “ইউ”/“ওয়ান”); an hour, an honest man, an MA, an MP, an FCPS (উচ্চারণ স্বরধ্বনিতে)।</li><li><strong>The বসে:</strong> একমাত্র বস্তু (the sun), নদী-সাগর-পর্বতমালা (the Padma, the Bay of Bengal, the Himalayas), ধর্মগ্রন্থ (the Quran), পত্রিকা (the Daily Star), superlative (the best), ordinal (the first), দিক (the east), বাদ্যযন্ত্র, জাতি (the English)। <strong>The বসে না:</strong> একক পর্বত (Mount Everest), ভাষা, খাবার, খেলা, রোগ, দেশ (তবে the USA, the UK, the Netherlands)।</li><li><strong>স্থানের আসল উদ্দেশ্যে গেলে article নয়:</strong> go to <strong>school</strong> (পড়তে), go to <strong>the school</strong> (অন্য কাজে); same for hospital, church, mosque, bed, prison।</li></ul><h2><a id=\"_Toc80\"></a><strong>৮.১১ Appropriate Preposition (সবচেয়ে বেশি আসা)</strong></h2><table><thead><tr><th><p><strong>শব্দ + preposition</strong></p></th><th><p><strong>উদাহরণ</strong></p></th><th><p><strong>শব্দ + preposition</strong></p></th><th><p><strong>উদাহরণ</strong></p></th></tr></thead><tbody><tr><td><p>abide <strong>by</strong></p></td><td><p>abide by the rules</p></td><td><p>accustomed <strong>to</strong></p></td><td><p>accustomed to hard work</p></td></tr><tr><td><p>afraid <strong>of</strong></p></td><td><p>afraid of dogs</p></td><td><p>aim <strong>at</strong></p></td><td><p>aim at success</p></td></tr><tr><td><p>angry <strong>with</strong> (ব্যক্তি) / <strong>at</strong> (বিষয়)</p></td><td><p>angry with him, at his conduct</p></td><td><p>senior/junior <strong>to</strong></p></td><td><p>senior to me (✗ than)</p></td></tr><tr><td><p>prefer A <strong>to</strong> B</p></td><td><p>prefer tea to coffee</p></td><td><p>superior/inferior <strong>to</strong></p></td><td><p>superior to others</p></td></tr><tr><td><p>comply <strong>with</strong></p></td><td><p>comply with orders</p></td><td><p>congratulate <strong>on</strong></p></td><td><p>congratulate him on his success</p></td></tr><tr><td><p>consist <strong>of</strong></p></td><td><p>consists of ten members</p></td><td><p>deal <strong>in</strong> (ব্যবসা) / <strong>with</strong> (আচরণ)</p></td><td><p>deals in rice; deal with problems</p></td></tr><tr><td><p>die <strong>of</strong> (রোগ) / <strong>from</strong> (কারণ)</p></td><td><p>died of cholera; from overwork</p></td><td><p>differ <strong>with</strong> (মত) / <strong>from</strong> (বৈশিষ্ট্য)</p></td><td><p>I differ with you; it differs from that</p></td></tr><tr><td><p>independent <strong>of</strong></p></td><td><p>independent of others</p></td><td><p>dependent <strong>on</strong></p></td><td><p>dependent on parents</p></td></tr><tr><td><p>instinct <strong>with</strong></p></td><td><p>instinct with life (২০১৮ প্র. ২৩ — চাবিতে “for”, ⚠)</p></td><td><p>indifferent <strong>to</strong></p></td><td><p>indifferent to praise</p></td></tr><tr><td><p>insist <strong>on</strong></p></td><td><p>insisted on going</p></td><td><p>interfere <strong>in</strong> (বিষয়) / <strong>with</strong> (ব্যক্তি)</p></td><td><p>do not interfere in my affairs</p></td></tr><tr><td><p>look <strong>after</strong> (দেখাশোনা)</p></td><td><p>look after the baby</p></td><td><p>look <strong>for</strong> (খোঁজা) / <strong>into</strong> (তদন্ত)</p></td><td><p>look for a job; look into the matter</p></td></tr><tr><td><p>married <strong>to</strong></p></td><td><p>She was married to a rich man (৪৭তম)</p></td><td><p>get <strong>to</strong> (পৌঁছানো)</p></td><td><p>get to the centre (৫০তম)</p></td></tr><tr><td><p>refrain <strong>from</strong></p></td><td><p>refrain from smoking</p></td><td><p>suffer <strong>from</strong></p></td><td><p>suffering from fever</p></td></tr><tr><td><p>entrust <strong>with</strong>/<strong>to</strong></p></td><td><p>entrust him with the task / the task to him</p></td><td><p>tired <strong>of</strong> (বিরক্ত) / <strong>from</strong> (ক্লান্ত)</p></td><td><p>tired of waiting; tired from work</p></td></tr></tbody></table><h2><a id=\"_Toc81\"></a><strong>৮.১২ Commonly Confused Words</strong></h2><table><thead><tr><th><p><strong>জোড়া</strong></p></th><th><p><strong>পার্থক্য</strong></p></th></tr></thead><tbody><tr><td><p>hangar / hanger</p></td><td><p>বিমানের ছাউনি / কাপড় ঝোলানোর হ্যাঙ্গার (৫০তম বিসিএস)</p></td></tr><tr><td><p>ordnance / ordinance</p></td><td><p>সমরাস্ত্র / অধ্যাদেশ (২০১৮ প্র. ১৫) — <strong>প্রতিরক্ষা প্রশ্নে বিশেষ গুরুত্বপূর্ণ</strong></p></td></tr><tr><td><p>hung / hanged</p></td><td><p>বস্তু ঝোলানো / ফাঁসি (৪৯তম বিসিএস)</p></td></tr><tr><td><p>principal / principle</p></td><td><p>প্রধান / নীতি</p></td></tr><tr><td><p>stationary / stationery</p></td><td><p>স্থির / লেখার সামগ্রী</p></td></tr><tr><td><p>affect / effect</p></td><td><p>প্রভাবিত করা (verb) / প্রভাব (noun)</p></td></tr><tr><td><p>complement / compliment</p></td><td><p>পরিপূরক / প্রশংসা</p></td></tr><tr><td><p>cavalry / calvary</p></td><td><p>অশ্বারোহী বাহিনী / যিশুর ক্রুশবিদ্ধ হওয়ার স্থান</p></td></tr><tr><td><p>infantry</p></td><td><p>পদাতিক বাহিনী (সেনাবাহিনীর মূল যুদ্ধ-শাখা)</p></td></tr><tr><td><p>marshal / martial</p></td><td><p>উচ্চপদস্থ সামরিক কর্মকর্তা (Air Marshal) / সামরিক (martial law)</p></td></tr><tr><td><p>corps / corpse</p></td><td><p>বাহিনীর শাখা (Signal Corps) / মৃতদেহ</p></td></tr><tr><td><p>council / counsel</p></td><td><p>পরিষদ / পরামর্শ</p></td></tr><tr><td><p>eligible / illegible</p></td><td><p>যোগ্য / অস্পষ্ট (লেখা)</p></td></tr><tr><td><p>loose / lose</p></td><td><p>ঢিলা / হারানো</p></td></tr><tr><td><p>personal / personnel</p></td><td><p>ব্যক্তিগত / কর্মীবৃন্দ (military personnel)</p></td></tr></tbody></table><h2><a id=\"_Toc82\"></a><strong>৮.১৩ Vocabulary — প্রতিরক্ষা ও প্রশাসনিক শব্দ</strong></h2><table><thead><tr><th><p><strong>Word</strong></p></th><th><p><strong>বাংলা অর্থ</strong></p></th><th><p><strong>Word</strong></p></th><th><p><strong>বাংলা অর্থ</strong></p></th></tr></thead><tbody><tr><td><p>reconnaissance</p></td><td><p>শত্রুর অবস্থান অনুসন্ধান (রেকি)</p></td><td><p>sovereignty</p></td><td><p>সার্বভৌমত্ব</p></td></tr><tr><td><p>deterrence</p></td><td><p>প্রতিরোধক ক্ষমতা (ভয় দেখিয়ে বিরত রাখা)</p></td><td><p>armistice / truce</p></td><td><p>যুদ্ধবিরতি</p></td></tr><tr><td><p>ceasefire</p></td><td><p>অস্ত্রবিরতি</p></td><td><p>insurgency</p></td><td><p>বিদ্রোহ, সশস্ত্র অভ্যুত্থান</p></td></tr><tr><td><p>garrison</p></td><td><p>সেনানিবাসের সৈন্যদল</p></td><td><p>cantonment</p></td><td><p>সেনানিবাস</p></td></tr><tr><td><p>logistics</p></td><td><p>রসদ ও সরবরাহ ব্যবস্থাপনা</p></td><td><p>arsenal</p></td><td><p>অস্ত্রাগার</p></td></tr><tr><td><p>espionage</p></td><td><p>গুপ্তচরবৃত্তি</p></td><td><p>surveillance</p></td><td><p>নজরদারি</p></td></tr><tr><td><p>contingent</p></td><td><p>দল/বাহিনী (শান্তিরক্ষী দল)</p></td><td><p>mandate</p></td><td><p>আদেশ, কর্মপরিধি</p></td></tr><tr><td><p>veteran</p></td><td><p>অভিজ্ঞ, প্রাক্তন সৈনিক</p></td><td><p>valour / gallantry</p></td><td><p>বীরত্ব</p></td></tr><tr><td><p>court martial</p></td><td><p>সামরিক আদালত</p></td><td><p>demobilisation</p></td><td><p>বাহিনী ভেঙে দেওয়া</p></td></tr><tr><td><p>bureaucracy</p></td><td><p>আমলাতন্ত্র</p></td><td><p>memorandum</p></td><td><p>স্মারক</p></td></tr><tr><td><p>procurement</p></td><td><p>ক্রয় (DGDP-র কাজ)</p></td><td><p>requisition</p></td><td><p>চাহিদাপত্র</p></td></tr><tr><td><p>tender</p></td><td><p>দরপত্র</p></td><td><p>audit</p></td><td><p>নিরীক্ষা</p></td></tr><tr><td><p>ad hoc</p></td><td><p>বিশেষ উদ্দেশ্যে, অস্থায়ী</p></td><td><p>bona fide</p></td><td><p>প্রকৃত, সরল বিশ্বাসে</p></td></tr><tr><td><p>ex officio</p></td><td><p>পদাধিকারবলে</p></td><td><p>pro tem</p></td><td><p>সাময়িকভাবে</p></td></tr><tr><td><p>de facto / de jure</p></td><td><p>কার্যত / আইনত</p></td><td><p>status quo</p></td><td><p>বর্তমান অবস্থা</p></td></tr></tbody></table><h2><a id=\"_Toc83\"></a><strong>৮.১৪ English Literature — যুগ ও প্রধান লেখক</strong></h2><table><thead><tr><th><p><strong>যুগ</strong></p></th><th><p><strong>লেখক ও বিখ্যাত রচনা</strong></p></th></tr></thead><tbody><tr><td><p>Old English (৪৫০–১০৬৬)</p></td><td><p><strong>Beowulf</strong> (প্রাচীনতম মহাকাব্য)</p></td></tr><tr><td><p>Middle English / Age of Chaucer (১৩৪০–১৪০০)</p></td><td><p><strong>Geoffrey Chaucer</strong> — “Father of English Poetry”; The Canterbury Tales, The House of Fame (২০২৩ প্র. ৬৫), Troilus and Criseyde</p></td></tr><tr><td><p>Elizabethan (১৫৫৮–১৬০৩)</p></td><td><p><strong>Shakespeare</strong> — Hamlet, Macbeth, Othello, King Lear (৪টি প্রধান ট্র্যাজেডি), Romeo and Juliet, Julius Caesar, The Merchant of Venice (Shylock — ২০১৮ প্র. ২৮), As You Like It (Jaques — ৫০তম), The Tempest, ১৫৪টি সনেট (Sonnet 116); <strong>Christopher Marlowe</strong> — Doctor Faustus; <strong>Edmund Spenser</strong> — The Faerie Queene; <strong>Francis Bacon</strong> — Essays (জনক: English essay)</p></td></tr><tr><td><p>Puritan (১৬২০–১৬৬০)</p></td><td><p><strong>John Milton</strong> — Paradise Lost (Satan — ২০১৮ প্র. ৩৮), Paradise Regained, Samson Agonistes; অন্ধ অবস্থায় রচনা</p></td></tr><tr><td><p>Restoration (১৬৬০–১৭০০)</p></td><td><p><strong>John Dryden</strong> — Absalom and Achitophel; <strong>John Bunyan</strong> — The Pilgrim's Progress</p></td></tr><tr><td><p>Augustan / Neo-classical (১৭০০–১৭৯৮)</p></td><td><p><strong>Alexander Pope</strong> — The Rape of the Lock; <strong>Jonathan Swift</strong> — Gulliver's Travels; <strong>Daniel Defoe</strong> — Robinson Crusoe; <strong>Samuel Johnson</strong> — Dictionary (১৭৫৫)</p></td></tr><tr><td><p>Romantic (১৭৯৮–১৮৩২)</p></td><td><p>সূচনা <strong>Lyrical Ballads</strong> (১৭৯৮, Wordsworth ও Coleridge); <strong>Wordsworth</strong> — Daffodils, The Prelude; <strong>Coleridge</strong> — The Rime of the Ancient Mariner (৫০তম), Kubla Khan; <strong>Byron</strong> — Don Juan; <strong>Shelley</strong> — Ozymandias (২০২৩ প্র. ৯), Ode to the West Wind; <strong>Keats</strong> — Ode to a Nightingale, “A thing of beauty is a joy for ever” (Endymion)</p></td></tr><tr><td><p>Victorian (১৮৩২–১৯০১)</p></td><td><p><strong>Tennyson</strong> — In Memoriam, Ulysses; <strong>Robert Browning</strong> — dramatic monologue; <strong>Matthew Arnold</strong> — Dover Beach (৫০তম); <strong>Charles Dickens</strong> — Oliver Twist, A Tale of Two Cities, David Copperfield (২০২৩ প্র. ৪১); <strong>Thomas Hardy</strong> — Tess of the d'Urbervilles; <strong>Brontë sisters</strong> — Jane Eyre (Charlotte), Wuthering Heights (Emily — ৫০তম); <strong>George Eliot</strong> — Middlemarch; <strong>Jane Austen</strong> (রোমান্টিক যুগে) — Pride and Prejudice, Emma, Persuasion</p></td></tr><tr><td><p>Modern (১৯০১–)</p></td><td><p><strong>T. S. Eliot</strong> — The Waste Land (নোবেল ১৯৪৮); <strong>W. B. Yeats</strong> — কবি (নোবেল ১৯২৩; ২০২৩ প্র. ৫৩); <strong>James Joyce</strong> — Ulysses; <strong>Virginia Woolf</strong> — Mrs Dalloway; <strong>G. B. Shaw</strong> — Arms and the Man (নোবেল ১৯২৫); <strong>E. M. Forster</strong> — A Passage to India (৫০তম); <strong>George Orwell</strong> — Animal Farm, Nineteen Eighty-Four; <strong>Rudyard Kipling</strong> — Kim (সাহিত্যে প্রথম ইংরেজিভাষী নোবেলজয়ী, ১৯০৭)</p></td></tr></tbody></table><ul><li><strong>কিছু গুরুত্বপূর্ণ উক্তি:</strong> “To be, or not to be” — Hamlet; “Frailty, thy name is woman” — Hamlet; “All the world's a stage” — As You Like It; “Better to reign in Hell than serve in Heaven” — Paradise Lost (Satan); “If Winter comes, can Spring be far behind?” — Shelley, Ode to the West Wind; “Water, water, every where, / Nor any drop to drink” — The Rime of the Ancient Mariner।</li><li><strong>সাহিত্যিক পরিভাষা:</strong> sonnet (১৪ লাইন), limerick (৫ লাইন, হাস্যরস — ২০১৮ প্র. ৩২), elegy (শোকগাথা), ode (স্তোত্র), epic (মহাকাব্য), ballad (গাথা), satire (ব্যঙ্গ), soliloquy (একক স্বগতোক্তি), dramatic monologue, blank verse (অমিত্রাক্ষর — Milton, Shakespeare), alliteration, metaphor, simile, personification, irony।</li></ul>"},{"title":"অধ্যায় ৯: গণিত","html":"<p>প্রতিটি উদাহরণ <strong>প্রকৃত বিগত প্রশ্ন</strong> — আমি নিজে পুনরায় সমাধান করেছি ✔। সূত্র আগে, তারপর কেন কাজ করে।</p><h2><a id=\"_Toc85\"></a><strong>৯.১ সরল সুদ</strong></h2><p><strong>সূত্র:</strong> সুদ I = P·n·r/100 (P আসল, n বছর, r শতকরা হার); সুদ-আসল A = P(1 + nr/100)।</p><ul><li><strong>২০২৩ প্র. ২:</strong> ৬% হারে ৯ মাসে ১০,০০০ টাকার সুদ। n = ৯/১২ বছর → I = ১০০০০ × (৯/১২) × ৬/১০০ = <strong>৪৫০</strong> ✔। (সতর্কতা: মাসকে বছরে রূপান্তর করুন।)</li><li><strong>২০১৯ প্র. ৪৫:</strong> ৭.৫% হারে ৪ বছরে সুদ-আসলে ১০১৪। A = P(1 + ৪×০.০৭৫) = ১.৩P → P = ১০১৪/১.৩ = <strong>৭৮০</strong> ✔।</li><li><strong>২০১৮ প্র. ৬৫:</strong> ৪.৫% ৪ বছরে ৮২৬ → P = ৮২৬/১.১৮ = <strong>৭০০</strong> ✔।</li><li><strong>২০১৯ প্র. ৪৩ (চতুর কৌশল):</strong> ৩ বছরে ৪৬০, ৫ বছরে ৬০০ → ২ বছরের সুদ ১৪০ → বার্ষিক ৭০ → আসল = ৪৬০ − ৩×৭০ = ২৫০ → হার = ৭০/২৫০ = <strong>২৮%</strong> ✔।</li><li><strong>২০১৯ প্র. ৫২:</strong> হার ০.৭৫ শতাংশ-পয়েন্ট কমায় ৪ বছরে আয় ৭৫০ কমে → P × ৪ × ০.০০৭৫ = ৭৫০ → P = <strong>২৫,০০০</strong> ✔।</li></ul><h2><a id=\"_Toc86\"></a><strong>৯.২ লাভ-ক্ষতি ও বাট্টা</strong></h2><p><strong>সূত্র:</strong> বিক্রয়মূল্য = ক্রয়মূল্য × (১ ± লাভ/ক্ষতি%)। লাভ/ক্ষতি সর্বদা ক্রয়মূল্যের শতকরা।</p><ul><li><strong>২০২৩ প্র. ১৬:</strong> CP = x; ১১০% লাভে ১.১x, ১০% ক্ষতিতে ০.৯x; পার্থক্য ০.২x = ২৫ → x = <strong>১২৫</strong> ✔।</li><li><strong>২০২৩ প্র. ৮০:</strong> ১ টাকায় ৩টি কিনলে প্রতিটির CP = ১/৩; ১ টাকায় ২টি বেচলে SP = ১/২; লাভ = (১/২ − ১/৩)/(১/৩) = ১/২ = <strong>৫০%</strong> ✔।</li><li><strong>২০২৩ প্র. ৯৫:</strong> টাকায় ৫টি, ১২% ক্ষতি → SP প্রতিটি ০.২, CP = ০.২/০.৮৮; ১০% লাভে SP = ০.২৫ → টাকায় <strong>৪টি</strong> ✔।</li><li><strong>২০১৮ প্র. ৬৯:</strong> ৩৬ টাকায় ক্ষতি L, ৭২ টাকায় লাভ ২L: c − ৩৬ = L; ৭২ − c = ২L → ৭২ − c = ২c − ৭২ → c = <strong>৪৮</strong> ✔।</li><li><strong>২০১৮ প্র. ৬৬:</strong> ১০,০০০ − ১০% = ৯০০০ (ক্রয়); ক্রয়মূল্যের উপর ১৫% বাট্টায় বিক্রয় = ৯০০০ × ০.৮৫ = <strong>৭৬৫০</strong> ✔।</li></ul><h2><a id=\"_Toc87\"></a><strong>৯.৩ শতকরা ও ক্ষেত্রফল-পরিবর্তন</strong></h2><p><strong>মূল ধারণা:</strong> ক্ষেত্রফল (বর্গ/বৃত্ত) বাহু/ব্যাসের <strong>বর্গের</strong> সমানুপাতিক। তাই দৈর্ঘ্য k গুণ → ক্ষেত্রফল k² গুণ।</p><ul><li><strong>২০২৩ প্র. ১৫:</strong> ব্যাস +২০% → ক্ষেত্রফল ১.২² = ১.৪৪ → <strong>৪৪%</strong> বৃদ্ধি ✔। <strong>২০১৮ প্র. ৬১:</strong> ব্যাস ৩ গুণ → ক্ষেত্রফল <strong>৯ গুণ</strong> ✔।</li><li><strong>২০১৯ প্র. ৫৪:</strong> দৈর্ঘ্য +২০%, প্রস্থ −১০% → ১.২ × ০.৯ = ১.০৮ → <strong>৮% বৃদ্ধি</strong> ✔।</li><li><strong>২০১৯ প্র. ৪৬:</strong> a = ২.৫b, a + b = ৯৮ → ৩.৫b = ৯৮ → b = ২৮, বড় সংখ্যা <strong>৭০</strong> ✔।</li><li><strong>২০১৮ প্র. ৭৭ / ২০১৯ প্র. ৫৭ / ২০২৩ প্র. ৫৪:</strong> রেখার উপর বর্গ (s²) বনাম রেখার k-তম অংশের উপর বর্গ (k²s²): k = ১/৪ → <strong>১৬ গুণ</strong>; k = ১/২ → <strong>৪ গুণ</strong> ✔।</li></ul><h2><a id=\"_Toc88\"></a><strong>৯.৪ বীজগণিত: সূত্র-ভিত্তিক সমস্যা</strong></h2><p><strong>মূল সূত্র:</strong> (a − 1/a)² = a² + 1/a² − 2; a³ − 1/a³ = (a − 1/a)³ + 3(a − 1/a)। একই ছাঁচ: (x + 1/x)-এর জন্য x³ + 1/x³ = (x + 1/x)³ − 3(x + 1/x)।</p><ul><li><strong>২০১৮ প্র. ৭২ / ২০১৯ প্র. ৪৮:</strong> a − 1/a = ৩ → a³ − 1/a³ = ২৭ + ৯ = <strong>৩৬</strong> ✔।</li><li><strong>২০২৩ প্র. ৮৯:</strong> x − 1/x = ১ → ১ + ৩ = <strong>৪</strong> ✔ (একই ছাঁচ, মান ভিন্ন)।</li><li><strong>২০১৯ প্র. ৪১:</strong> a⁴ + a²b² + b⁴ = (a² + ab + b²)(a² − ab + b²) = ৩(a² − ab + b²) = ৩ → a² − ab + b² = ১; আবার a² + ab + b² = ৩; যোগ করে ২(a² + b²) = ৪ → a² + b² = <strong>২</strong> ✔।</li><li><strong>২০১৯ প্র. ৪৪:</strong> a + b = −c ⇒ (a + b)² = a² + 2ab + b² = <strong>c²</strong> ✔।</li><li><strong>২০২৩ প্র. ৯৬:</strong> x² + y² − ৮x − ৮y + ১৬ = (x + y)² − ২xy − ৮(x + y) + ১৬; ২xy যোগ করলে (x + y − ৪)² ✔ → <strong>২xy</strong>।</li><li><strong>২০১৮ প্র. ৭৫:</strong> ab/x = √a → x = b√a → x/√b = √a·√b = <strong>√(ab)</strong> ✔।</li><li><strong>২০১৮/১৯ প্র. ৭৬/৫৬:</strong> √(x+৩) = √x + √৩ → বর্গ করে x + ৩ = x + ৩ + ২√(৩x) → x = <strong>০</strong> ✔।</li></ul><p><strong>⚠ ২০১৮ প্র. ৭৩/২০১৯ প্র. ৪৯:</strong> x² − √5x + 1 = 0 হলে x² − 1/x² = ±√5 (দুই মূলের জন্য); চাবির উত্তর <strong>√5</strong>। বিস্তারিত অধ্যায় ৫।</p><h2><a id=\"_Toc89\"></a><strong>৯.৫ সূচক, লগারিদম ও সমীকরণ</strong></h2><ul><li><strong>সূত্র:</strong> aᵐ·aⁿ = aᵐ⁺ⁿ; log_a(b) = c ⟺ aᶜ = b।</li><li><strong>২০১৮ প্র. ৮০:</strong> 4^(x+1) = 32 → 2^(2x+2) = 2⁵ → 2x + 2 = ৫ → x = <strong>৩/২</strong> ✔।</li><li><strong>২০১৯ প্র. ৬০:</strong> 7^(x+1) = 343 = 7³ → x = <strong>২</strong> ✔। <strong>২০১৯ প্র. ৫৯:</strong> log₅625 = <strong>৪</strong> ✔। <strong>২০১৮ প্র. ৭৯:</strong> log₂8 = <strong>৩</strong> ✔।</li><li><strong>২০২৩ প্র. ৩০:</strong> 4^x + 4^(1−x) = 4 → t = 4^x: t + ৪/t = ৪ → (t − ২)² = ০ → t = ২ → x = <strong>১/২</strong> ✔।</li><li><strong>২০১৯ প্র. ৪৭:</strong> ১৫x − ২ = ৪০ → x = ২.৮ → y = ২.৫ × ২.৮ + ৪ = <strong>১১</strong> ✔।</li></ul><h2><a id=\"_Toc90\"></a><strong>৯.৬ ল.সা.গু ও গ.সা.গু</strong></h2><p><strong>মূল সূত্র:</strong> দুটি সংখ্যার গুণফল = ল.সা.গু × গ.সা.গু। সংখ্যা দুটি = গ.সা.গু × (সহমৌলিক গুণক)।</p><ul><li><strong>২০১৮ প্র. ৭০ / ২০১৯ প্র. ৫০:</strong> ল.সা.গু ৬০, গ.সা.গু ১০, একটি অপরটির ২/৩ → সংখ্যা ১০a, ১০b; ab = ৬; অনুপাত ২:৩ → <strong>২০ ও ৩০</strong>; ছোটটি ২০ ✔।</li><li><strong>২০২৩ প্র. ৪৯:</strong> অনুপাত ৫:৬, গ.সা.গু ৪ → ২০, ২৪ → ছোটটি <strong>২০</strong> ✔।</li><li><strong>২০২৩ প্র. ৮৭ (ঘড়ি):</strong> ১০ ও ১৫-এর ল.সা.গু = <strong>৩০ মিনিট</strong> ✔।</li><li><strong>২০২৩ প্র. ৬০:</strong> “সংখ্যা সহগের” গ.সা.গু: gcd(৬, ৪) = ২ — বিকল্পে নেই → <strong>কোনোটিই নয়</strong> ✔।</li></ul><h2><a id=\"_Toc91\"></a><strong>৯.৭ বয়স, কাজ-সময়, নল-চৌবাচ্চা, গড়</strong></h2><ul><li><strong>বয়স (২০১৮ প্র. ৬৩):</strong> পিতা F, পুত্র S: F − ১০ = ৪(S − ১০); F + ১০ = ২(S + ১০) → S = ২০, F = <strong>৫০</strong> ✔। <strong>২০১৯ প্র. ৪২:</strong> ৩:১ ও ২:১ → <strong>৫৫ ও ২৫</strong> ✔।</li><li><strong>কাজ-সময় (২০১৯ প্র. ৫৫):</strong> ৯ জন × ১২ দিন = ১০৮ জন-দিন; ১২ জনে ১০৮/১২ = <strong>৯ দিন</strong> ✔।</li><li><strong>নল-চৌবাচ্চা (২০১৮ প্র. ৬৭):</strong> ধারণ V: V/১২ − ১৪ = V/৯৬ → V(৮ − ১)/৯৬ = ১৪ → V = <strong>১৯২</strong> লিটার ✔।</li><li><strong>আয়তন (২০১৮ প্র. ৬২, ৬৮):</strong> ১৯২০০ লিটার = ১৯.২ ঘ.মি; দৈর্ঘ্য = ১৯.২ ÷ (২.৫৬ × ২.৫) = <strong>৩ মি</strong> ✔। বই: ২০০ পৃষ্ঠা = ১০০ পাতা (leaf) × ০.১ মি.মি = ১ সে.মি পুরু; আয়তন = ২৫ × ১৮ × ১ = <strong>৪৫০ ঘ.সে.মি</strong> ✔।</li><li><strong>গড় (২০২৩ প্র. ৪০):</strong> x  ধারণা, সূত্র, সূত্র কেন কাজ করে, এবং সমাধানসহ নতুন উদাহরণ আছে। প্রতিটি উত্তর আমি দুইবার হিসাব করে মিলিয়েছি। মন্ত্রণালয়ের প্রশ্নপত্রে গণিত থেকে ১৫-২০টি করে প্রশ্ন এসেছে (অগ্রাধিকার A)।</p><h2><a id=\"_Toc94\"></a><strong>৯.১০ শতকরা — ধারণা ও শর্টকাট</strong></h2><ul><li><strong>মূল ধারণা:</strong> শতকরা মানে ১০০-এর মধ্যে কত। x% = x/100। “A, B-এর কত %?” → (A/B) × 100।</li><li><strong>মূল্যবৃদ্ধি ও ব্যবহার কমানো:</strong> দাম r% বাড়লে খরচ অপরিবর্তিত রাখতে ব্যবহার কমাতে হবে <strong>r/(100 + r) × 100%</strong>। কেন? খরচ = দাম × পরিমাণ; দাম (১ + r/100) গুণ হলে পরিমাণকে ১/(১ + r/100) গুণ করতে হবে।</li><li><strong>উদাহরণ:</strong> চালের দাম ২৫% বাড়ল। খরচ একই রাখতে ব্যবহার কত % কমাতে হবে? → ২৫/১২৫ × ১০০ = <strong>২০%</strong>। (উল্টো: দাম ২০% কমলে ব্যবহার বাড়ানো যাবে ২০/৮০ × ১০০ = ২৫%)</li><li><strong>পরপর দুটি পরিবর্তন:</strong> মোট পরিবর্তন = x + y + xy/100 (বৃদ্ধি ধনাত্মক, হ্রাস ঋণাত্মক)। <strong>উদাহরণ:</strong> বেতন ২০% বেড়ে পরে ২০% কমলে → ২০ − ২০ − ৪০০/১০০ = <strong>৪% হ্রাস</strong>। (এ কারণেই “সমান বাড়া-কমা = আগের মতো” ধারণা ভুল)</li><li><strong>আয়ত-ক্ষেত্রফলেও একই সূত্র:</strong> দৈর্ঘ্য ২০% বাড়ল, প্রস্থ ২০% কমল → ক্ষেত্রফল ৪% কমে।</li><li><strong>নির্বাচন-সমস্যা:</strong> দুই প্রার্থী; বিজয়ী ৬০% ভোট পেয়ে ৩০০ ভোটে জিতলেন → ব্যবধান ৬০% − ৪০% = ২০% = ৩০০ → মোট বৈধ ভোট <strong>১৫০০</strong>। (BB AD ২০১২-এর ৮৪% সমস্যা একই ছাঁচ — অধ্যায় ২০.৪)</li></ul><h2><a id=\"_Toc95\"></a><strong>৯.১১ লাভ-ক্ষতি — অতিরিক্ত কৌশল</strong></h2><ul><li><strong>সূত্র:</strong> লাভ% = (বিক্রয়মূল্য − ক্রয়মূল্য)/ক্রয়মূল্য × ১০০। <strong>সবসময় ক্রয়মূল্যের ওপর।</strong></li><li><strong>একই দামে দুটি জিনিস, একটিতে x% লাভ ও অন্যটিতে x% ক্ষতি:</strong> সবসময় <strong>ক্ষতি = x²/100 %</strong>। উদাহরণ: দুটি ঘড়ি প্রতিটি ১২০০ টাকায় বিক্রি, একটিতে ২০% লাভ, অন্যটিতে ২০% ক্ষতি → মোট ক্ষতি ৪%। (যাচাই: ক্রয়মূল্য ১০০০ ও ১৫০০, মোট ২৫০০; বিক্রয় ২৪০০; ক্ষতি ১০০ = ৪% ✔)</li><li><strong>ভুয়া বাটখারা:</strong> দোকানদার ১ কেজির জায়গায় ৯০০ গ্রাম দিয়ে ক্রয়মূল্যে বিক্রি করলে লাভ = ১০০/৯০০ × ১০০ = <strong>১১ ১/৯ %</strong>। (লাভ = বাদ দেওয়া পরিমাণ ÷ দেওয়া পরিমাণ)</li><li><strong>টাকায় n টি কিনে m টি বেচা (২০২৩ প্র. ৮০ ধাঁচ):</strong> লাভ% = (n − m)/m × ১০০। উদাহরণ: টাকায় ৬টি কিনে টাকায় ৪টি বেচলে লাভ = ২/৪ × ১০০ = <strong>৫০%</strong>।</li><li><strong>বাট্টা (discount):</strong> বাট্টা ধরা হয় <strong>লিখিত/তালিকা মূল্যের</strong> ওপর; লাভ ধরা হয় ক্রয়মূল্যের ওপর। পরপর ১০% ও ১০% বাট্টা = ১০ + ১০ − ১ = ১৯% (২০% নয়)।</li></ul><h2><a id=\"_Toc96\"></a><strong>৯.১২ সুদ — সরল ও চক্রবৃদ্ধি</strong></h2><table><thead><tr><th><p><strong>বিষয়</strong></p></th><th><p><strong>সূত্র</strong></p></th><th><p><strong>উদাহরণ</strong></p></th></tr></thead><tbody><tr><td><p>সরল সুদ</p></td><td><p>I = Pnr/100; A = P + I</p></td><td><p>৫০০০ টাকা, ৬%, ৩ বছর → I = ৫০০০ × ৩ × ৬/১০০ = ৯০০</p></td></tr><tr><td><p>আসল কত বছরে দ্বিগুণ (সরল সুদ)</p></td><td><p>n = 100/r</p></td><td><p>৮% হারে → ১০০/৮ = ১২.৫ বছর। তিনগুণ হতে লাগবে ২০০/r</p></td></tr><tr><td><p>চক্রবৃদ্ধি সুদ-আসল</p></td><td><p>A = P(1 + r/100)ⁿ</p></td><td><p>১০,০০০ টাকা, ১০%, ২ বছর → ১০০০০ × ১.২১ = ১২,১০০; চক্রবৃদ্ধি সুদ ২,১০০</p></td></tr><tr><td><p>২ বছরে চক্রবৃদ্ধি − সরল সুদ</p></td><td><p>P(r/100)²</p></td><td><p>ওপরের উদাহরণে সরল সুদ ২০০০; পার্থক্য = ১০০০০ × (০.১)² = <strong>১০০</strong> ✔</p></td></tr><tr><td><p>৩ বছরে পার্থক্য</p></td><td><p>P(r/100)²(3 + r/100)</p></td><td><p>১০০০০ টাকা, ১০% → ১০০০০ × ০.০১ × ৩.১ = ৩১০</p></td></tr><tr><td><p>অর্ধবার্ষিক চক্রবৃদ্ধি</p></td><td><p>হার r/2, সময় 2n</p></td><td><p>৮% বার্ষিক হার অর্ধবার্ষিক হলে প্রতি অর্ধবছরে ৪%</p></td></tr></tbody></table><p><strong>কেন পার্থক্য P(r/100)²?</strong> প্রথম বছরে দুই পদ্ধতিতেই সুদ সমান। দ্বিতীয় বছরে চক্রবৃদ্ধিতে প্রথম বছরের সুদের ওপরও সুদ হয় = (Pr/100) × r/100। সেটিই পার্থক্য।</p><h2><a id=\"_Toc97\"></a><strong>৯.১৩ অনুপাত, সমানুপাত ও অংশীদারি</strong></h2><ul><li><strong>যৌগিক অনুপাত মেলানো:</strong> a:b = ২:৩ এবং b:c = ৪:৫ → b-কে সমান করুন (৩ ও ৪-এর ল.সা.গু ১২) → a:b = ৮:১২, b:c = ১২:১৫ → <strong>a:b:c = ৮:১২:১৫</strong>।</li><li><strong>ভাগ করা:</strong> ৭২০ টাকা ৩:৪:৫ অনুপাতে → মোট অংশ ১২ → ১৮০, ২৪০, <strong>৩০০</strong>।</li><li><strong>অংশীদারি:</strong> লাভ ভাগ হয় (মূলধন × সময়) অনুপাতে। উদাহরণ: A ৫০০০ টাকা ১২ মাস, B ৬০০০ টাকা ৮ মাস → ৬০০০০ : ৪৮০০০ = <strong>৫ : ৪</strong>।</li><li><strong>মিশ্রণ:</strong> দুধ-পানি ৫:৩ অনুপাতে ৪০ লিটার → দুধ ২৫, পানি ১৫। কত লিটার পানি মেশালে অনুপাত ১:১ হবে? → ২৫ = ১৫ + x → <strong>x = ১০ লিটার</strong>।</li></ul><h2><a id=\"_Toc98\"></a><strong>৯.১৪ গড়</strong></h2><ul><li><strong>সূত্র:</strong> গড় = মোট/সংখ্যা। তাই <strong>মোট = গড় × সংখ্যা</strong> — প্রায় সব গড়-সমস্যা এই উল্টো সূত্রে সমাধান হয়।</li><li><strong>নতুন সদস্য যোগ:</strong> ৫ জনের গড় বয়স ৩০; একজন যোগ হলে গড় ৩২ → নতুন জনের বয়স = ৬ × ৩২ − ৫ × ৩০ = ১৯২ − ১৫০ = <strong>৪২</strong>।</li><li><strong>ক্রমিক সংখ্যার গড়:</strong> প্রথম ও শেষ সংখ্যার গড়ই সবগুলোর গড়। ১ থেকে ৫০ পর্যন্ত সংখ্যার গড় = (১ + ৫০)/২ = ২৫.৫।</li><li><strong>গড় বেগ (সমান দূরত্ব যাওয়া-আসা):</strong> 2xy/(x + y) — সাধারণ গড় নয়! যাওয়ার সময় ৬০ কিমি/ঘণ্টা, ফেরার সময় ৪০ → গড় = ২ × ৬০ × ৪০/১০০ = <strong>৪৮ কিমি/ঘণ্টা</strong> (৫০ নয়)।</li></ul><h2><a id=\"_Toc99\"></a><strong>৯.১৫ কাজ ও সময়, নল ও চৌবাচ্চা</strong></h2><ul><li><strong>মূল কৌশল:</strong> “এক দিনে কতটুকু কাজ” বের করুন। A একা x দিনে করলে এক দিনে করে 1/x অংশ। একত্রে: 1/x + 1/y।</li><li><strong>উদাহরণ:</strong> A ১২ দিনে, B ২৪ দিনে একটি কাজ করে। একত্রে → 1/12 + 1/24 = 3/24 = 1/8 → <strong>৮ দিন</strong>। শর্টকাট: xy/(x + y) = ২৮৮/৩৬ = ৮।</li><li><strong>কিছুদিন একত্রে, পরে একা:</strong> উপরের A ও B একত্রে ৪ দিন কাজ করার পর A চলে গেল। বাকি কাজ B কত দিনে করবে? → ৪ দিনে হয় ৪/৮ = ১/২; বাকি ১/২ কাজ B করবে ২৪ × ১/২ = <strong>১২ দিনে</strong>।</li><li><strong>জন-দিন (man-days):</strong> ১৫ জন ২০ দিনে একটি কাজ করলে মোট কাজ ৩০০ জন-দিন; ২৫ জনে লাগবে ৩০০/২৫ = <strong>১২ দিন</strong>। (M₁D₁ = M₂D₂; ঘণ্টা থাকলে M₁D₁H₁ = M₂D₂H₂)</li><li><strong>নল:</strong> ভরার নল ধনাত্মক, খালি করার নল ঋণাত্মক। একটি নল ৬ ঘণ্টায় ভরে, অন্যটি ৮ ঘণ্টায় খালি করে; দুটি একসাথে খুললে → 1/6 − 1/8 = 1/24 → <strong>২৪ ঘণ্টায়</strong> ভরবে।</li></ul><h2><a id=\"_Toc100\"></a><strong>৯.১৬ সময়, দূরত্ব ও গতি (ট্রেন, নৌকা)</strong></h2><ul><li><strong>সূত্র:</strong> দূরত্ব = বেগ × সময়। <strong>কিমি/ঘণ্টা → মিটার/সেকেন্ড: × ৫/১৮</strong>; উল্টো × ১৮/৫। (৭২ কিমি/ঘণ্টা = ২০ মি/সে; ৫৪ = ১৫; ৩৬ = ১০)</li><li><strong>ট্রেন খুঁটি/মানুষ অতিক্রম:</strong> দূরত্ব = ট্রেনের দৈর্ঘ্য। <strong>প্ল্যাটফর্ম/সেতু অতিক্রম:</strong> দূরত্ব = ট্রেনের দৈর্ঘ্য + প্ল্যাটফর্মের দৈর্ঘ্য। <strong>উদাহরণ:</strong> ১৫০ মিটার লম্বা ট্রেন ৭২ কিমি/ঘণ্টা (২০ মি/সে) বেগে ২৫০ মিটার প্ল্যাটফর্ম পার হতে সময় = ৪০০/২০ = <strong>২০ সেকেন্ড</strong>।</li><li><strong>আপেক্ষিক বেগ:</strong> একই দিকে চললে বেগের <strong>বিয়োগফল</strong>, বিপরীত দিকে চললে <strong>যোগফল</strong>। (BB AD ২০১২-এর ট্রেন X-Y সমস্যা — অধ্যায় ২০.৪)</li><li><strong>নৌকা ও স্রোত:</strong> অনুকূলে বেগ = নৌকা + স্রোত; প্রতিকূলে = নৌকা − স্রোত। অনুকূলে ১৬, প্রতিকূলে ১০ কিমি/ঘণ্টা হলে → নৌকার বেগ (১৬ + ১০)/২ = <strong>১৩</strong>, স্রোতের বেগ (১৬ − ১০)/২ = <strong>৩</strong>।</li></ul><h2><a id=\"_Toc101\"></a><strong>৯.১৭ বয়স</strong></h2><ul><li><strong>কৌশল:</strong> বর্তমান বয়স x ধরুন; “n বছর আগে” → x − n, “n বছর পরে” → x + n — <strong>দুজনের বয়সই</strong> একই পরিমাণ বদলায়, কিন্তু বয়সের <strong>পার্থক্য কখনো বদলায় না</strong>।</li><li><strong>উদাহরণ:</strong> মা ও মেয়ের বয়সের অনুপাত ৭ : ২; ১০ বছর পরে হবে ৯ : ৪। → (৭x + ১০)/(২x + ১০) = ৯/৪ → ২৮x + ৪০ = ১৮x + ৯০ → x = ৫ → মা <strong>৩৫</strong>, মেয়ে <strong>১০</strong>। (যাচাই: ৪৫ : ২০ = ৯ : ৪ ✔)</li></ul><h2><a id=\"_Toc102\"></a><strong>৯.১৮ সংখ্যা, বিভাজ্যতা, ল.সা.গু-গ.সা.গু</strong></h2><table><thead><tr><th><p><strong>বিভাজ্যতার নিয়ম</strong></p></th><th><p><strong>শর্ত</strong></p></th></tr></thead><tbody><tr><td><p>২</p></td><td><p>শেষ অঙ্ক জোড়</p></td></tr><tr><td><p>৩</p></td><td><p>অঙ্কগুলোর যোগফল ৩ দ্বারা বিভাজ্য</p></td></tr><tr><td><p>৪</p></td><td><p>শেষ দুই অঙ্কের সংখ্যা ৪ দ্বারা বিভাজ্য</p></td></tr><tr><td><p>৫</p></td><td><p>শেষ অঙ্ক ০ বা ৫</p></td></tr><tr><td><p>৬</p></td><td><p>২ ও ৩ উভয় দ্বারা বিভাজ্য</p></td></tr><tr><td><p>৮</p></td><td><p>শেষ তিন অঙ্কের সংখ্যা ৮ দ্বারা বিভাজ্য</p></td></tr><tr><td><p>৯</p></td><td><p>অঙ্কগুলোর যোগফল ৯ দ্বারা বিভাজ্য</p></td></tr><tr><td><p>১১</p></td><td><p>বিজোড় স্থানের অঙ্কের যোগফল ও জোড় স্থানের অঙ্কের যোগফলের পার্থক্য ০ বা ১১-এর গুণিতক</p></td></tr></tbody></table><ul><li><strong>মৌলিক সংখ্যা:</strong> ১ মৌলিকও নয়, যৌগিকও নয়; ২ একমাত্র জোড় মৌলিক সংখ্যা; ১ থেকে ১০০ পর্যন্ত মৌলিক সংখ্যা <strong>২৫টি</strong>।</li><li><strong>ভাগশেষ-সমস্যা:</strong> কোন ক্ষুদ্রতম সংখ্যাকে ১২, ১৫, ২০ দিয়ে ভাগ করলে প্রতিবার ৫ অবশিষ্ট থাকে? → ল.সা.গু ৬০ + ৫ = <strong>৬৫</strong>। (প্রতিবার ভাগশেষ আলাদা কিন্তু ভাজক − ভাগশেষ সমান হলে: ল.সা.গু − সেই পার্থক্য)</li><li><strong>ল.সা.গু × গ.সা.গু = দুই সংখ্যার গুণফল:</strong> গুণফল ২৪০০ ও গ.সা.গু ২০ হলে ল.সা.গু = <strong>১২০</strong>। গ.সা.গু সবসময় ল.সা.গু-কে নিঃশেষে ভাগ করে।</li><li><strong>ভগ্নাংশের ল.সা.গু = লবগুলোর ল.সা.গু ÷ হরগুলোর গ.সা.গু; ভগ্নাংশের গ.সা.গু = লবগুলোর গ.সা.গু ÷ হরগুলোর ল.সা.গু।</strong></li><li><strong>একক অঙ্ক:</strong> 7ⁿ-এর একক অঙ্ক চক্রাকারে ৭, ৯, ৩, ১ (চক্র ৪) — 7²⁶-এর একক অঙ্ক: ২৬ ÷ ৪ ভাগশেষ ২ → <strong>৯</strong>।</li></ul><h2><a id=\"_Toc103\"></a><strong>৯.১৯ বীজগণিত, সূচক ও লগারিদম — সূত্র-তালিকা</strong></h2><table><thead><tr><th><p><strong>সূত্র</strong></p></th><th><p><strong>ব্যবহার/উদাহরণ</strong></p></th></tr></thead><tbody><tr><td><p>(a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²</p></td><td><p>a + b = ৭, ab = ১০ → a² + b² = ৪৯ − ২০ = ২৯</p></td></tr><tr><td><p>(a + b)² − (a − b)² = 4ab</p></td><td><p>a + b = ৫, ab = ৪ → (a − b)² = ২৫ − ১৬ = ৯ → a − b = ৩</p></td></tr><tr><td><p>a² − b² = (a + b)(a − b)</p></td><td><p>১০১² − ৯৯² = ২০০ × ২ = ৪০০ (মুখে মুখে)</p></td></tr><tr><td><p>(a + b)³ = a³ + b³ + 3ab(a + b)</p></td><td><p>a³ + b³ = (a + b)³ − 3ab(a + b)</p></td></tr><tr><td><p>a + 1/a = k হলে a² + 1/a² = k² − 2; a³ + 1/a³ = k³ − 3k</p></td><td><p>k = ৩ → ৭ এবং ২৭ /p></td><td><p>পরিধি 2πr; ক্ষেত্রফল πr²; অর্ধবৃত্তে অন্তর্লিখিত কোণ সমকোণ; বৃত্তের কেন্দ্রস্থ কোণ বৃত্তস্থ কোণের দ্বিগুণ</p></td></tr><tr><td><p>ঘনবস্তু</p></td><td><p>আয়তাকার ঘনবস্তু: আয়তন lbh, সমগ্রতল 2(lb + bh + hl), কর্ণ √(l² + b² + h²); ঘনক: আয়তন a³, সমগ্রতল 6a², কর্ণ a√3</p></td></tr><tr><td><p>বেলন (সিলিন্ডার)</p></td><td><p>আয়তন πr²h; বক্রতল 2πrh; সমগ্রতল 2πr(r + h)</p></td></tr><tr><td><p>কোণক ও গোলক</p></td><td><p>কোণক: আয়তন ⅓πr²h; গোলক: আয়তন (৪/৩)πr³, পৃষ্ঠতল 4πr²</p></td></tr><tr><td><p>ঘনকের সমগ্রতল থেকে কর্ণ (৪৯তম বিসিএস)</p></td><td><p>6a² = ৪৮ → a = 2√2 → কর্ণ = a√3 = <strong>2√6</strong></p></td></tr></tbody></table><table><thead><tr><th><p><strong>একক রূপান্তর</strong></p></th><th><p><strong>মান</strong></p></th></tr></thead><tbody><tr><td><p>১ ইঞ্চি</p></td><td><p>২.৫৪ সেমি</p></td></tr><tr><td><p>১ মাইল</p></td><td><p>১.৬০৯ কিমি (≈ ১৭৬০ গজ)</p></td></tr><tr><td><p>১ নটিক্যাল মাইল</p></td><td><p>১৮৫২ মিটার</p></td></tr><tr><td><p>১ একর</p></td><td><p>১০০ শতাংশ (ডেসিমেল) = ৪৩,৫৬০ বর্গফুট = ৪০৪৭ বর্গমিটার (প্রায়)</p></td></tr><tr><td><p>১ হেক্টর</p></td><td><p>১০,০০০ বর্গমিটার ≈ ২.৪৭ একর</p></td></tr><tr><td><p>১ বিঘা</p></td><td><p>৩৩ শতাংশ (প্রচলিত; অঞ্চলভেদে ভিন্ন)</p></td></tr><tr><td><p>১ লিটার</p></td><td><p>১০০০ ঘন সেমি; ১ ঘনমিটার = ১০০০ লিটার</p></td></tr><tr><td><p>১ কিলোগ্রাম</p></td><td><p>≈ ২.২০৫ পাউন্ড</p></td></tr><tr><td><p>১ মেট্রিক টন</p></td><td><p>১০০০ কেজি</p></td></tr></tbody></table><h2><a id=\"_Toc105\"></a><strong>৯.২১ সেট, সম্ভাবনা ও ধারা</strong></h2><ul><li><strong>সেট:</strong> n(A ∪ B) = n(A) + n(B) − n(A ∩ B)। <strong>উদাহরণ:</strong> ১০০ জনের মধ্যে ৬০ জন ক্রিকেট, ৫০ জন ফুটবল এবং ২০ জন দুটোই পছন্দ করে → অন্তত একটি পছন্দ করে ৬০ + ৫০ − ২০ = ৯০ → কোনোটিই নয় <strong>১০ জন</strong>। n সদস্যের সেটের উপসেট <strong>2ⁿ</strong>টি, প্রকৃত উপসেট 2ⁿ − 1টি।</li><li><strong>সম্ভাবনা:</strong> P = অনুকূল ফল/মোট সম্ভাব্য ফল (০ থেকে ১)। একটি ছক্কায় জোড় সংখ্যা ৩/৬ = ১/২; দুটি মুদ্রায় অন্তত একটি হেড ৩/৪; দুটি ছক্কায় যোগফল ৭ → (১,৬),(২,৫),(৩,৪),(৪,৩),(৫,২),(৬,১) = ৬/৩৬ = <strong>১/৬</strong>; ৫২ তাসের প্যাকেট থেকে টেক্কা ৪/৫২ = ১/১৩।</li><li><strong>বিন্যাস ও সমাবেশ:</strong> n টি ভিন্ন জিনিসের সাজানো n!; পুনরাবৃত্তি থাকলে n!/(p!q!) — যেমন “ARMY”-র বর্ণ ৪! = ২৪ ভাবে; ৩, ৩, ৪, ৪, ৪, ৫ দিয়ে ৬!/(২!৩!) = ৬০ (BB AD ২০১২)। n থেকে r বাছাই: ⁿCᵣ = n!/[r!(n − r)!]।</li><li><strong>সমান্তর ধারা (AP):</strong> n-তম পদ a + (n − 1)d; প্রথম n পদের যোগফল n/2 × [2a + (n − 1)d] = n/2 × (প্রথম + শেষ)। ১ থেকে n পর্যন্ত যোগফল n(n + 1)/2 (১ থেকে ১০০ = ৫০৫০); প্রথম n বিজোড় সংখ্যার যোগফল <strong>n²</strong>; বর্গের যোগফল n(n + 1)(2n + 1)/6।</li><li><strong>গুণোত্তর ধারা (GP):</strong> n-তম পদ arⁿ⁻¹; উদাহরণ: ৫ম পদ ৩২, ৮ম পদ ২৫৬ → r³ = ৮ → r = ২ (৪৯তম বিসিএস)।</li></ul>"},{"title":"অধ্যায় ১০: বাংলাদেশ বিষয়াবলি","html":"<h2><a id=\"_Toc107\"></a><strong>১০.১ মুক্তিযুদ্ধ ও স্বাধীনতার ঘোষণা (চাবির ব্যাখ্যা ও যাচাইকৃত সূত্র অনুযায়ী)</strong></h2><table><thead><tr><th><p><strong>তারিখ/বিষয়</strong></p></th><th><p><strong>তথ্য</strong></p></th><th><p><strong>প্রশ্নপত্র</strong></p></th></tr></thead><tbody><tr><td><p>২৬ মার্চ ১৯৭১</p></td><td><p>বঙ্গবন্ধু শেখ মুজিবুর রহমান কর্তৃক স্বাধীনতা ঘোষণা</p></td><td><p>২০২৩ প্র. ৩ (ব্যাখ্যা)</p></td></tr><tr><td><p><strong>১০ এপ্রিল ১৯৭১</strong></p></td><td><p>আনুষ্ঠানিকভাবে <strong>স্বাধীনতার ঘোষণাপত্র জারি</strong> (বাংলাদেশকে গণপ্রজাতন্ত্রী হিসেবে ঘোষণা); ঘোষণাপত্র লিপিবদ্ধ করেন ব্যারিস্টার আমীরুল ইসলাম</p></td><td><p>২০২৩ প্র. ৩</p></td></tr><tr><td><p><strong>১৭ এপ্রিল ১৯৭১</strong></p></td><td><p>মুজিবনগর সরকারের শপথ (আনুষ্ঠানিক আত্মপ্রকাশ); ঘোষণাপত্র পাঠ করেন অধ্যাপক ইউসুফ আলী</p></td><td><p>২০২৩ প্র. ৩</p></td></tr><tr><td><p>অস্থায়ী রাষ্ট্রপতি</p></td><td><p>সৈয়দ নজরুল ইসলাম — একই দিনে “আইনের ধারাবাহিকতা বলবৎকরণ আদেশ” জারি</p></td><td><p>২০২৩ প্র. ৩</p></td></tr><tr><td><p>সেক্টর</p></td><td><p>স্বাধীনতা যুদ্ধকালে বাংলাদেশকে <strong>১১টি সেক্টরে</strong> ভাগ করা হয়; ঢাকা জেলা <strong>২ নং সেক্টর</strong>-এর অন্তর্ভুক্ত (চাবি)</p></td><td><p>২০২৩ প্র. ৯৮; ২০১৮ প্র. ৫৩</p></td></tr><tr><td><p><strong>মুক্তিযোদ্ধা দিবস</strong> (চাবি)</p></td><td><p>১ ডিসেম্বর</p></td><td><p>২০১৮ প্র. ৪৩</p></td></tr><tr><td><p><strong>স্বদেশ প্রত্যাবর্তন দিবস</strong></p></td><td><p>১০ জানুয়ারি (বঙ্গবন্ধু)</p></td><td><p>২০১৮ প্র. ৫৬</p></td></tr><tr><td><p><strong>বিজয় কেতন</strong></p></td><td><p>ঢাকা সেনানিবাসে মুক্তিযুদ্ধের স্মৃতিস্তম্ভ</p></td><td><p>২০২৩ প্র. ৪৮</p></td></tr><tr><td><p><strong>বেকার হোস্টেলের ২৪ নম্বর কক্ষ</strong></p></td><td><p>বঙ্গবন্ধুর স্মৃতিবিজড়িত; জাদুঘর (চাবি)</p></td><td><p>২০১৮ প্র. ৫৪</p></td></tr></tbody></table><h2><a id=\"_Toc108\"></a><strong>১০.২ বীরত্বসূচক খেতাব — যাচাইকৃত তথ্য</strong></h2><p>১৯৭৩ সালের ১৫ ডিসেম্বর গেজেটের মাধ্যমে <strong>৭ জনকে বীরশ্রেষ্ঠ, ৬৮ জনকে বীর উত্তম, ১৭৫ জনকে বীর বিক্রম ও ৪২৬ জনকে বীর প্রতীক</strong> খেতাব দেওয়া হয় (মুক্তিযোদ্ধা কল্যাণ ট্রাস্টের তথ্য; সূত্র: প্রথম আলো, ২০২৬-২৭ বাজেটের প্রতিবেদন)।</p><ul><li><strong>সাত বীরশ্রেষ্ঠ:</strong> ক্যাপ্টেন মহিউদ্দিন জাহাঙ্গীর, সিপাহী হামিদুর রহমান, সিপাহী মোস্তফা কামাল, ল্যান্স নায়েক নূর মোহাম্মদ শেখ, ইঞ্জিনরুম আর্টিফিসার মোহাম্মদ রুহুল আমিন, ফ্লাইট লেফটেন্যান্ট মতিউর রহমান, ল্যান্স নায়েক মুন্সী আবদুর রউফ (সূত্র: প্রথম আলো — সংসদ-গ্যালারি নামকরণের প্রতিবেদন)।</li><li><strong>২০১০ সালে</strong> একটি সূত্র অনুযায়ী ব্রিগেডিয়ার জেনারেল জামিল উদ্দিন আহমদকে মরণোত্তর বীর উত্তম (৬৯তম) দেওয়া হয় (শিক্ষা-ওয়েবসাইট; একক সূত্র)।</li><li><strong>খেতাবপ্রাপ্ত পরিবারের মাসিক ভাতা (বাজেট ২০২৬-২৭ প্রস্তাব):</strong> বীরশ্রেষ্ঠ পরিবার ৪০ হাজার, বীর উত্তম ৩০ হাজার, বীর বিক্রম ও বীর প্রতীক ২৫ হাজার টাকা; সাধারণ মুক্তিযোদ্ধার ২০ হাজার (অপরিবর্তিত)।</li></ul><p>“প্রথম শহীদ বীরশ্রেষ্ঠ” নিয়ে সূত্রে অমিল আছে (অধ্যায় ৫)। ২০১৯ প্র. ৮০-এর চাবি: মুন্সী আবদুর রউফ।</p><h2><a id=\"_Toc109\"></a><strong>১০.৩ সংবিধান</strong></h2><ul><li><strong>সরকারি কর্ম কমিশন:</strong> সংবিধানের <strong>১৩৭ অনুচ্ছেদ</strong> (২০২৩ প্র. ৮২)।</li><li><strong>৫ম তফসিল:</strong> বঙ্গবন্ধুর ঐতিহাসিক ৭ মার্চের ভাষণ (২০২৩ প্র. ৬৪)। <strong>৬ষ্ঠ তফসিল:</strong> ২৬ মার্চের স্বাধীনতার ঘোষণা (২০২৩ প্র. ৩-এর ব্যাখ্যা)।</li><li><strong>সরকার:</strong> রাষ্ট্রের প্রধান নির্বাহী — প্রধানমন্ত্রী (২০১৯ প্র. ৬১ “CEO of Bangladesh”)। প্রধানমন্ত্রী প্রতিরক্ষা মন্ত্রণালয়ের দায়িত্বে থাকেন (২০২৬-এ তারেক রহমান — অধ্যায় ১৫)।</li></ul><p>২০২৪-পরবর্তী সময়ে সংবিধান/শাসনব্যবস্থায় সংস্কার-আলোচনা চলেছে। আমি সংশোধনী বা গণভোট-সংক্রান্ত কোনো তথ্য যাচাই করিনি, তাই সংবিধানের কাঠামো-সংক্রান্ত নতুন তথ্য এখানে নেই। সংবিধানের হালনাগাদ পাঠ আইন মন্ত্রণালয়/legislativediv.gov.bd-তে দেখুন।</p><h2><a id=\"_Toc110\"></a><strong>১০.৪ জাতীয় প্রতীক, ইতিহাস, অবকাঠামো, অর্থনীতি</strong></h2><ul><li><strong>জাতীয় পতাকার ডিজাইনার:</strong> কামরুল হাসান (২০২৩ প্র. ৪৫)। <strong>ঢাকা গেইট:</strong> চাবি অনুযায়ী মীর জুমলা-নির্মিত (২০২৩ প্র. ২৯)।</li><li><strong>প্রাচীন জনপদ:</strong> পুণ্ড্র (চাবি) ⚠; সমতট, গৌড়, হরিকেলও জনপদ (২০২৩ প্র. ৩৬)।</li><li><strong>ছয় দফা:</strong> শাসনতান্ত্রিক কাঠামো, কেন্দ্রীয় সরকারের ক্ষমতা, স্বতন্ত্র মুদ্রাব্যবস্থা ছিল; <strong>বিচারব্যবস্থা</strong> ছিল না (২০২৩ প্র. ১৮)।</li><li><strong>চিলাহাটি–হলদিবাড়ি রেল যোগাযোগ</strong> দীর্ঘ ৫৫ বছর পর চালু: ১৭ ডিসেম্বর ২০২০ (২০২৩ প্র. ৯২)।</li><li><strong>অলিম্পিক:</strong> বাংলাদেশ প্রথম অংশ নেয় লস অ্যাঞ্জেলেস (১৯৮৪) (২০১৮ প্র. ৪৪)।</li><li><strong>উদ্ভাবক:</strong> মোবারক আহমেদ খান — পাটের আঁশ থেকে পচনশীল পলিমার ব্যাগ (২০২৩ প্র. ৪৭)।</li><li><strong>জিডিপি:</strong> ২০১৯ সালের পূর্বাভাস প্রবৃদ্ধি ৮.১৩% (২০১৯ প্র. ৭৪)।</li></ul><p><strong>সংস্করণ ৪ — বিস্তারিত নোট (১০.৫–১০.১১):</strong> ইতিহাস, সংবিধান, ভূগোল ও প্রশাসনের প্রতিষ্ঠিত তথ্য। <strong>সংবিধান-সংক্রান্ত সতর্কতা:</strong> ১২ ফেব্রুয়ারি ২০২৬-এর গণভোটে জুলাই সনদ অনুমোদিত হয়েছে (অধ্যায় ২১)। এর ফলে সংবিধানে কী কী পরিবর্তন কার্যকর হয়েছে, তা আমি যাচাই করিনি। নিচের অনুচ্ছেদগুলো প্রচলিত (২০২৪ পর্যন্ত) সংবিধান অনুযায়ী। পরীক্ষার আগে legislativediv.gov.bd / bdlaws.minlaw.gov.bd-এ হালনাগাদ পাঠ দেখুন।</p><h2><a id=\"_Toc111\"></a><strong>১০.৫ ইতিহাসের সময়রেখা (প্রাচীন থেকে ১৯৭১)</strong></h2><table><thead><tr><th><p><strong>সাল</strong></p></th>< (২৩ জুন)</p></td><td><p>আওয়ামী মুসলিম লীগ প্রতিষ্ঠা (সভাপতি মওলানা ভাসানী)</p></td></tr><tr><td><p>১৯৫২ (২১ ফেব্রুয়ারি)</p></td><td><p><strong>ভাষা আন্দোলন</strong> — সালাম, বরকত, রফিক, জব্বার, শফিউরসহ শহীদ; ১৯৯৯-এর ১৭ নভেম্বর ইউনেসকো একুশে ফেব্রুয়ারিকে <strong>আন্তর্জাতিক মাতৃভাষা দিবস</strong> ঘোষণা করে</p></td></tr><tr><td><p>১৯৫৪</p></td><td><p>যুক্তফ্রন্টের নির্বাচনী বিজয় (২১ দফা; প্রতীক নৌকা)</p></td></tr><tr><td><p>১৯৫৬</p></td><td><p>পাকিস্তানের প্রথম সংবিধান — বাংলা রাষ্ট্রভাষার স্বীকৃতি</p></td></tr><tr><td><p>১৯৫৮ (৭ অক্টোবর)</p></td><td><p>সামরিক শাসন; আইয়ুব খান</p></td></tr><tr><td><p>১৯৬২</p></td><td><p>শিক্ষা আন্দোলন (শরীফ শিক্ষা কমিশনের বিরুদ্ধে; ১৭ সেপ্টেম্বর শিক্ষা দিবস)</p></td></tr><tr><td><p>১৯৬৬ (৫ ফেব্রুয়ারি)</p></td><td><p>লাহোরে <strong>ছয় দফা</strong> উত্থাপন — “বাঙালির মুক্তির সনদ”; ৭ জুন ছয় দফা দিবস</p></td></tr><tr><td><p>১৯৬৮</p></td><td><p>আগরতলা ষড়যন্ত্র মামলা</p></td></tr><tr><td><p>১৯৬৯</p></td><td><p><strong>গণ-অভ্যুত্থান</strong>; আসাদ (২০ জানুয়ারি), মতিউর (২৪ জানুয়ারি); ২৩ ফেব্রুয়ারি শেখ মুজিবকে “বঙ্গবন্ধু” উপাধি (তোফায়েল আহমেদ ঘোষণা করেন); আইয়ুবের পতন, ইয়াহিয়ার সামরিক শাসন</p></td></tr><tr><td><p>১৯৭০ (৭ ডিসেম্বর)</p></td><td><p>সাধারণ নির্বাচন — আওয়ামী লীগ জাতীয় পরিষদে পূর্ব পাকিস্তানের ১৬৯ আসনের ১৬৭টিতে জয়ী (মোট ৩১৩ আসনের মধ্যে, সংরক্ষিতসহ)</p></td></tr></tbody></table><h3><strong>১৯৭১: মুক্তিযুদ্ধের গুরুত্বপূর্ণ তারিখ</strong></h3><table><thead><tr><th><p><strong>তারিখ</strong></p></th><th><p><strong>ঘটনা</strong></p></th></tr></thead><tbody><tr><td><p>১ মার্চ</p></td><td><p>ইয়াহিয়া খান জাতীয় পরিষদের অধিবেশন স্থগিত করেন — অসহযোগ আন্দোলনের সূচনা</p></td></tr><tr><td><p>২ মার্চ</p></td><td><p>ঢাকা বিশ্ববিদ্যালয়ের কলাভবনে প্রথম জাতীয় পতাকা উত্তোলন (আ স ম আবদুর রব)</p></td></tr><tr><td><p>৩ মার্চ</p></td><td><p>পল্টনে স্বাধীনতার ইশতেহার পাঠ (শাজাহান সিরাজ)</p></td></tr><tr><td><p>৭ মার্চ</p></td><td><p>রেসকোর্স ময়দানে বঙ্গবন্ধুর ভাষণ — “এবারের সংগ্রাম আমাদের মুক্তির সংগ্রাম…”; ইউনেসকো ৩০ অক্টোবর ২০১৭-এ “মেমোরি অব দ্য ওয়ার্ল্ড” রেজিস্টারে অন্তর্ভুক্ত করে</p></td></tr><tr><td><p>২৫ মার্চ রাত</p></td><td><p><strong>অপারেশন সার্চলাইট</strong> — পাকিস্তানি বাহিনীর গণহত্যা শুরু; ২৫ মার্চ জাতীয় গণহত্যা দিবস</p></td></tr><tr><td><p>২৬ মার্চ</p></td><td><p>স্বাধীনতা ঘোষণা; স্বাধীনতা ও জাতীয় দিবস। চট্টগ্রামের কালুরঘাট স্বাধীন বাংলা বেতার কেন্দ্র থেকে ঘোষণাপত্র পাঠ (২৬ মার্চ এম এ হান্নান; ২৭ মার্চ মেজর জিয়াউর রহমান)</p></td></tr><tr><td><p>১০ এপ্রিল</p></td><td><p>স্বাধীনতার ঘোষণাপত্র; মুজিবনগর সরকার গঠন</p></td></tr><tr><td><p>১৭ এপ্রিল</p></td><td><p>মেহেরপুরের বৈদ্যনাথতলায় (মুজিবনগর) সরকারের শপথ — রাষ্ট্রপতি বঙ্গবন্ধু (অনুপস্থিতিতে), উপরাষ্ট্রপতি ও অস্থায়ী রাষ্ট্রপতি সৈয়দ নজরুল ইসলাম, প্রধানমন্ত্রী তাজউদ্দীন আহমদ</p></td></tr><tr><td><p>মুক্তিবাহিনী</p></td><td><p>প্রধান সেনাপতি কর্নেল (পরে জেনারেল) <strong>এম এ জি ওসমানী</strong>; উপপ্রধান/চিফ অব স্টাফ লে. কর্নেল আবদুর রব; ডেপুটি চিফ অব স্টাফ গ্রুপ ক্যাপ্টেন এ কে খন্দকার। ১১টি সেক্টর; তিনটি ব্রিগেড ফোর্স — <strong>জেড ফোর্স</strong> (জিয়াউর রহমান), <strong>কে ফোর্স</strong> (খালেদ মোশাররফ), <strong>এস ফোর্স</strong> (কে এম সফিউল্লাহ)</p></td></tr><tr><td><p>২১ নভেম্বর</p></td><td><p>সেনা, নৌ ও বিমান বাহিনীর সম্মিলিত আক্রমণ — <strong>সশস্ত্র বাহিনী দিবস</strong> (২০১৮ প্র. ৪২; ২০১৯ প্র. ৬২)</p></td></tr><tr><td><p>২৮ সেপ্টেম্বর</p></td><td><p>বাংলাদেশ বিমানবাহিনীর যাত্রা — ভারতের ডিমাপুরে “কিলো ফ্লাইট” গঠন ⚠ তারিখ সূত্রভেদে</p></td></tr><tr><td><p>৩ ডিসেম্বর</p></td><td><p>পাকিস্তানের ভারত আক্রমণ; ভারত সরাসরি যুদ্ধে; যৌথ বাহিনী গঠন</p></td></tr><tr><td><p>৬ ডিসেম্বর</p></td><td><p><strong>ভুটান ও ভারত</strong> বাংলাদেশকে স্বীকৃতি দেয় (প্রথম স্বীকৃতি নিয়ে ভুটান/ভারত বিতর্ক আছে — অধিকাংশ সূত্রে ভুটান প্রথম)</p></td></tr><tr><td><p>১৪ ডিসেম্বর</p></td><td><p>বুদ্ধিজীবী হত্যা — শহীদ বুদ্ধিজীবী দিবস</p></td></tr><tr><td><p>১৬ ডিসেম্বর</p></td><td><p>রেসকোর্সে (সোহরাওয়ার্দী উদ্যান) পাকিস্তানি বাহিনীর আত্মসমর্পণ — লে. জেনারেল এ এ কে নিয়াজি, যৌথ বাহিনীর পক্ষে লে. জেনারেল জগজিৎ সিং অরোরা; বাংলাদেশের প্রতিনিধিত্ব করেন <strong>গ্রুপ ক্যাপ্টেন এ কে খন্দকার</strong>। ৯৩ হাজার সৈন্যের আত্মসমর্পণ। বিজয় দিবস</p></td></tr></tbody></table><h3><strong>স্বাধীনতার পর (নির্বাচিত)</strong></h3><table><thead><tr><th><p><strong>তারিখ</strong></p></th><th><p><strong>ঘটনা</strong></p></th></tr></thead><tbody><tr><td><p>১০ জানুয়ারি ১৯৭২</p></td><td><p>বঙ্গবন্ধুর স্বদেশ প্রত্যাবর্তন</p></td></tr><tr><td><p>১২ জানুয়ারি ১৯৭২</p></td><td><p>সংসদীয় সরকার; বঙ্গবন্ধু প্রধানমন্ত্রী</p></td></tr><tr><td><p>১২ মার্চ ১৯৭২</p></td><td><p>ভারতীয় মিত্রবাহিনীর বাংলাদেশ ত্যাগ</p></td></tr><tr><td><p>৪ নভেম্বর ১৯৭২</p></td><td><p>গণপরিষদে সংবিধান গৃহীত</p></td></tr><tr><td><p>১৬ ডিসেম্বর ১৯৭২</p></td><td><p>সংবিধান কার্যকর</p></td></tr><tr><td><p>৭ মার্চ ১৯৭৩</p></td><td><p>প্রথম জাতীয় সংসদ নির্বাচন</p></td></tr><tr><td><p>১৫ আগস্ট ১৯৭৫</p></td><td><p>সপরিবারে বঙ্গবন্ধু হত্যা (১৩ আগস্ট ২০২৪ অন্তর্বর্তী সরকার ১৫ আগস্টের সাধারণ ছুটি বাতিল করে — প্রথম আলো ✔)</p></td></tr><tr><td><p>৩ নভেম্বর ১৯৭৫</p></td><td><p>জেলহত্যা (চার জাতীয় নেতা)</p></td></tr><tr><td><p>১৯৯০ (৬ ডিসেম্বর)</p></td><td><p>এরশাদের পতন</p></td></tr><tr><td><p>১৯৯১</p></td><td><p>দ্বাদশ সংশোধনী — সংসদীয় ব্যবস্থায় প্রত্যাবর্তন; খালেদা জিয়া প্রথম নারী প্রধানমন্ত্রী</p></td></tr><tr><td><p>১৯৯৬</p></td><td><p>ত্রয়োদশ সংশোধনী — নির্দলীয় তত্ত্বাবধায়ক সরকার</p></td></tr><tr><td><p>জুলাই–আগস্ট ২০২৪</p></td><td><p>ছাত্র-জনতার গণ-অভ্যুত্থান; ৫ আগস্ট শেখ হাসিনার পদত্যাগ ও দেশত্যাগ; ৮ আগস্ট ড. ইউনূসের নেতৃত্বে অন্তর্বর্তী সরকার</p></td></tr><tr><td><p>১২ ফেব্রুয়ারি ২০২৬</p></td><td><p>ত্রয়োদশ সংসদ নির্বাচন ও জুলাই সনদ গণভোট</p></td></tr><tr><td><p>১৭ ফেব্রুয়ারি ২০২৬</p></td><td><p>তারেক রহমান প্রধানমন্ত্রী</p></td></tr></tbody></table><h2><a id=\"_Toc112\"></a><strong>১০.৬ সংবিধান — কাঠামো ও গুরুত্বপূর্ণ অনুচ্ছেদ</strong></h2><ul><li><strong>কাঠামো:</strong> প্রস্তাবনা, <strong>১১টি ভাগ</strong>, <strong>১৫৩টি অনুচ্ছেদ</strong>, <strong>৭টি তফসিল</strong> (পঞ্চদশ সংশোধনীর পর)। লিখিত ও দুষ্পরিবর্তনীয় (সংশোধনে সংসদের দুই-তৃতীয়াংশ ভোট লাগে)। হাতে লেখা মূল কপির লিপিকার <strong>এ কে এম আবদুর রউফ</strong>; অঙ্গসজ্জা শিল্পী জয়নুল আবেদিনের নেতৃত্বে। খসড়া কমিটির সভাপতি <strong>ড. কামাল হোসেন</strong> (৩৪ সদস্য, একমাত্র নারী সদস্য বেগম রাজিয়া বানু)।</li><li><strong>চার মূলনীতি (মূল সংবিধান ১৯৭২):</strong> জাতীয়তাবাদ, সমাজতন্ত্র, গণতন্ত্র, ধর্মনিরপেক্ষতা। ✔ <strong>নভেম্বর ২০২৬-এর অবস্থা:</strong> ১২ ফেব্রুয়ারি ২০২৬-এর গণভোটে জুলাই সনদ অনুমোদিত হয়েছে, কিন্তু সংবিধান এখনো সংশোধিত হয়নি। সংসদ ১৩ জুলাই ২০২৬ সংবিধান সংশোধনে বিশেষ কমিটি গঠন করেছে (সভাপতি স্বরাষ্ট্রমন্ত্রী সালাহউদ্দিন আহমেদ; বিরোধী দল প্রত্যাখ্যান করেছে)। কমিটির প্রতিবেদন ডিসেম্বরে এবং সংশোধনী বিল জানুয়ারি ২০২৭-এ আসার কথা (প্রথম আলো; বাসস; Dhaka Tribune)। দ্বিকক্ষ সংসদ (সিনেট) নিয়েও প্রস্তাব আছে, তবে তা এখনো কার্যকর নয়। তাই পরীক্ষায় বর্তমান সংবিধানের অনুচ্ছেদই ধরুন।</li></ul><table><thead><tr><th><p><strong>অনুচ্ছেদ</strong></p></th><th><p><strong>বিষয়</strong></p></th><th><p><strong>অনুচ্ছেদ</strong></p></th><th><p><strong>বিষয়</strong></p></th></tr></thead><tbody><tr><td><p>১</p></td><td><p>প্রজাতন্ত্র (একক, স্বাধীন, সার্বভৌম)</p></td><td><p>৬১</p></td><td><p>সশস্ত্র বাহিনীর <strong>সর্বাধিনায়কতা রাষ্ট্রপতির</strong></p></td></tr><tr><td><p>২ক</p></td><td><p>রাষ্ট্রধর্ম</p></td><td><p>৬২</p></td><td><p>প্রতিরক্ষা কর্মবিভাগে ভর্তি ইত্যাদি (সংসদ আইন দ্বারা নিয়ন্ত্রণ)</p></td></tr><tr><td><p>৩</p></td><td><p>রাষ্ট্রভাষা — বাংলা</p></td><td><p>৬৩</p></td><td><p>যুদ্ধ ঘোষণা — সংসদের সম্মতি ছাড়া নয়</p></td></tr><tr><td><p>৪</p></td><td><p>জাতীয় সংগীত, পতাকা ও প্রতীক</p></td><td><p>৬৫</p></td><td><p>জাতীয় সংসদ প্রতিষ্ঠা (৩০০ সাধারণ + ৫০ সংরক্ষিত নারী আসন = ৩৫০)</p></td></tr><tr><td><p>৫</p></td><td><p>রাজধানী — ঢাকা</p></td><td><p>৬৬</p></td><td><p>সংসদ সদস্য হওয়ার যোগ্যতা (ন্যূনতম বয়স ২৫)</p></td></tr><tr><td><p>৬</p></td><td><p>নাগরিকত্ব (বাংলাদেশি)</p></td><td><p>৭০</p></td><td><p>দলত্যাগে আসন শূন্য (ফ্লোর ক্রসিং নিষেধ)</p></td></tr><tr><td><p>৭</p></td><td><p>সংবিধানের প্রাধান্য — জনগণই সব ক্ষমতার মালিক</p></td><td><p>৭২</p></td><td><p>দ g>Global Gender Gap Report ২০২১:</strong> শীর্ষ দেশ আইসল্যান্ড (⚠ বছর-নির্দিষ্ট)।</p></td><td><p>২০২৩ প্র. ৭৫</p></td></tr><tr><td><p><strong>ডোকলাম উপত্যকা:</strong> চীন ও ভুটান (চাবি); ভারত-ভুটান-চীনের ত্রিসংযোগের কাছে।</p></td><td><p>২০১৮ প্র. ৫৮</p></td></tr><tr><td><p><strong>ভুটানের আইনসভা:</strong> পার্লামেন্ট (চাবি)। <strong>জাপানের পার্লামেন্ট:</strong> Diet।</p></td><td><p>২০১৮ প্র. ৪৭; ২০১৯ প্র. ৬৬</p></td></tr><tr><td><p><strong>পুলওয়ামা হামলা:</strong> ১৪ ফেব্রুয়ারি ২০১৯ (কাশ্মীর)।</p></td><td><p>২০১৯ প্র. ৬৫</p></td></tr><tr><td><p><strong>EDI (Electronic Data Interchange):</strong> ব্যবসায়িক তথ্যের কাঠামোবদ্ধ, কম্পিউটার-পাঠযোগ্য বৈদ্যুতিক আদান-প্রদান।</p></td><td><p>২০১৯ প্র. ৭৭</p></td></tr><tr><td><p><strong>ডেল্টাক্রন</strong> প্রথম শনাক্ত — সাইপ্রাস (চাবি)।</p></td><td><p>২০২৩ প্র. ৭৭</p></td></tr><tr><td><p><strong>মার্কিন ভাইস প্রেসিডেন্ট কমলা হ্যারিস ৮৫ মিনিটের জন্য ক্ষমতা পান:</strong> ১৯ নভেম্বর ২০২১ (প্রশ্নটি বাতিল)।</p></td><td><p>২০২৩ প্র. ৫০</p></td></tr><tr><td><p><strong>২০২৬ সালের নোবেল শান্তি পুরস্কার:</strong> নাভানেথেম “নাভি” পিল্লে (দক্ষিণ আফ্রিকা) — ঘোষণা ৯ অক্টোবর ২০২৬ (অধ্যায় ১৫)।</p></td><td><p>সাম্প্রতিক</p></td></tr></tbody></table><p>ওপরের সারণি প্রশ্নপত্রে আসা তথ্য। জাতিসংঘ, আঞ্চলিক জোট, চুক্তি, ভূগোল, রাজধানী-মুদ্রার পূর্ণ নোট নিচে ১১.১–১১.৮-এ।</p><p><strong>সংস্করণ ৪ — বিস্তারিত নোট (১১.১–১১.৮):</strong> নিচের তথ্য সুপ্রতিষ্ঠিত সাধারণ জ্ঞান (জাতিসংঘ সনদ, সংস্থাগুলোর নিজস্ব তথ্য)। সদস্যসংখ্যা ও পদধারী বদলায় — “⚠” চিহ্নিত তথ্য পরীক্ষার আগে মিলিয়ে নিন।</p><h2><a id=\"_Toc119\"></a><strong>১১.১ জাতিসংঘ (United Nations) — মৌলিক তথ্য</strong></h2><table><thead><tr><th><p><strong>বিষয়</strong></p></th><th><p><strong>তথ্য</strong></p></th></tr></thead><tbody><tr><td><p>সনদ স্বাক্ষর</p></td><td><p><strong>২৬ জুন ১৯৪৫</strong>, সান ফ্রান্সিসকো সম্মেলনে (৫০টি দেশ; পোল্যান্ড পরে স্বাক্ষর করে মূল সদস্য ৫১)</p></td></tr><tr><td><p>প্রতিষ্ঠা (সনদ কার্যকর)</p></td><td><p><strong>২৪ অক্টোবর ১৯৪৫</strong> — জাতিসংঘ দিবস</p></td></tr><tr><td><p>সদর দপ্তর</p></td><td><p>নিউইয়র্ক (ম্যানহাটন); অন্য প্রধান দপ্তর: জেনেভা, ভিয়েনা, নাইরোবি</p></td></tr><tr><td><p>সদস্য</p></td><td><p><strong>১৯৩টি</strong> দেশ (সর্বশেষ দক্ষিণ সুদান, ২০১১); পর্যবেক্ষক রাষ্ট্র: ভ্যাটিকান (হলি সি) ও ফিলিস্তিন</p></td></tr><tr><td><p>দাপ্তরিক ভাষা</p></td><td><p>৬টি — ইংরেজি, ফরাসি, রুশ, চীনা, স্প্যানিশ, আরবি (আরবি যুক্ত হয় ১৯৭৩-এ)</p></td></tr><tr><td><p>নামের প্রস্তাবক</p></td><td><p>মার্কিন প্রেসিডেন্ট ফ্রাঙ্কলিন ডি. রুজভেল্ট (“United Nations”, ১৯৪২-এর ঘোষণায়)</p></td></tr><tr><td><p>পূর্বসূরি</p></td><td><p>লীগ অব নেশনস (জাতিপুঞ্জ) — ১৯২০, জেনেভা; ১৯৪৬-এ বিলুপ্ত</p></td></tr><tr><td><p>বাংলাদেশের সদস্যপদ</p></td><td><p><strong>১৭ সেপ্টেম্বর ১৯৭৪</strong> — ১৩৬তম সদস্য; ২৫ সেপ্টেম্বর ১৯৭৪ বঙ্গবন্ধু সাধারণ পরিষদে প্রথম বাংলায় ভাষণ দেন</p></td></tr></tbody></table><h3><strong>জাতিসংঘের ৬টি প্রধান অঙ্গ</strong></h3><table><thead><tr><th><p><strong>অঙ্গ</strong></p></th><th><p><strong>মূল তথ্য</strong></p></th></tr></thead><tbody><tr><td><p>সাধারণ পরিষদ (General Assembly)</p></td><td><p>সব সদস্য, প্রত্যেকের এক ভোট; গুরুত্বপূর্ণ বিষয়ে দুই-তৃতীয়াংশ ভোট; অধিবেশন প্রতি বছর সেপ্টেম্বরে। বাংলাদেশ থেকে সভাপতি: <strong>হুমায়ুন রশীদ চৌধুরী</strong> (৪১তম অধিবেশন, ১৯৮৬)</p></td></tr><tr><td><p>নিরাপত্তা পরিষদ (Security Council)</p></td><td><p><strong>১৫ সদস্য</strong>: ৫ স্থায়ী (যুক্তরাষ্ট্র, যুক্তরাজ্য, ফ্রান্স, রাশিয়া, চীন — <strong>ভেটো</strong> ক্ষমতা) + ১০ অস্থায়ী (২ বছর মেয়াদে নির্বাচিত)। সিদ্ধান্তে ৯ ভোট লাগে। বাংলাদেশ অস্থায়ী সদস্য ছিল <strong>১৯৭৯-৮০ ও ২০০০-০১</strong></p></td></tr><tr><td><p>অর্থনৈতিক ও সামাজিক পরিষদ (ECOSOC)</p></td><td><p>৫৪ সদস্য, ৩ বছর মেয়াদ</p></td></tr><tr><td><p>অছি পরিষদ (Trusteeship Council)</p></td><td><p>১৯৯৪ সালে সর্বশেষ অছি অঞ্চল <strong>পালাউ</strong> স্বাধীন হওয়ার পর কার্যক্রম স্থগিত</p></td></tr><tr><td><p>আন্তর্জাতিক আদালত (ICJ)</p></td><td><p><strong>হেগ, নেদারল্যান্ডস</strong>; ১৫ বিচারক, ৯ বছর মেয়াদ; একমাত্র প্রধান অঙ্গ যা নিউইয়র্কের বাইরে</p></td></tr><tr><td><p>সচিবাল প্রধান ঘাঁটি <strong>বানৌজা ঈসা খান</strong>, চট্টগ্রাম। সাবমেরিন <strong>নবযাত্রা ও জয়যাত্রা</strong> (চীন থেকে কেনা; কমিশন ১২ মার্চ ২০১৭) — বাংলাদেশ সাবমেরিনধারী দেশ হয়। কক্সবাজারের পেকুয়ায় সাবমেরিন ঘাঁটি (কমিশন মার্চ ২০২৩, নাম ছিল “বানৌজা শেখ হাসিনা”; ছয়টি সাবমেরিন ও আটটি যুদ্ধজাহাজ ভিড়তে পারে। বর্তমানে <strong>“বানৌজা পেকুয়া”</strong> নামে উল্লেখিত — Wikipedia; নাম পরিবর্তনের সরকারি তারিখ পাইনি ⚠)</p></td></tr><tr><td><p>বিমানবাহিনী</p></td><td><p>প্রধান: <strong>এয়ার চিফ মার্শাল</strong>; যাত্রা ২৮ সেপ্টেম্বর ১৯৭১ — ভারতের ডিমাপুরে “কিলো ফ্লাইট”। ঘাঁটি: <strong>বীর উত্তম এ কে খন্দকার</strong> (কুর্মিটোলা, ঢাকা; আগের নাম “বঙ্গবন্ধু” — ISPR ✔), বাশার (ঢাকা), জহুরুল হক (চট্টগ্রাম), মতিউর রহমান (যশোর), পাহাড়কাঞ্চনপুর (টাঙ্গাইল), কক্সবাজার</p></td></tr></tbody></table><p><strong>২০১৮ প্র. ৪৯-এর ফাঁদ:</strong> চাবি অনুযায়ী দেশের বৃহত্তম যুদ্ধবিমান ঘাঁটি “বিমানবাহিনী ঘাঁটি বঙ্গবন্ধু”। কুর্মিটোলার এই ঘাঁটির বর্তমান নাম “বীর উত্তম এ কে খন্দকার” । অন্তর্বর্তী সরকার মার্চ ২০২৫-এ নাম পরিবর্তন করে; <strong>নামকরণ অনুষ্ঠান ১০ এপ্রিল ২০২৫</strong> (ISPR)। এ কে খন্দকার ছিলেন বিমানবাহিনীর প্রথম প্রধান ও মুক্তিযুদ্ধের উপপ্রধান সেনাপতি। একই সাথে “বঙ্গবন্ধু অ্যারোনটিক্যাল সেন্টার” → “বাংলাদেশ অ্যারোনটিক্যাল সেন্টার”। পরীক্ষায় বিকল্পে যে নামটি আছে, সেটিই বেছে নিন।</p><ul><li><strong>Forces Goal 2030:</strong> সশস্ত্র বাহিনীর আধুনিকায়নের দীর্ঘমেয়াদি পরিকল্পনা (গৃহীত ২০০৯, হালনাগাদ ২০১৭) — তিন বাহিনীর সক্ষমতা বাড়ানো, নতুন সরঞ্জাম কেনা ও নতুন ইউনিট গঠন।</li></ul><h2><a id=\"_Toc135\"></a><strong>১২.৮ ফাঁদ-প্রশ্ন: কোন বাহিনী কোন মন্ত্রণালয়ের অধীন</strong></h2><table><thead><tr><th><p><strong>বাহিনী/সংস্থা</strong></p></th><th><p><strong>মন্ত্রণালয়</strong></p></th><th><p><strong>মন্তব্য</strong></p></th></tr></thead><tbody><tr><td><p>সেনা, নৌ, বিমানবাহিনী</p></td><td><p>প্রতিরক্ষা মন্ত্রণালয় (প্রশাসনিক) ও সশস্ত্র বাহিনী বিভাগ (অপারেশনাল সমন্বয়)</p></td><td><p>সর্বাধিনায়ক রাষ্ট্রপতি (অনুচ্ছেদ ৬১)</p></td></tr><tr><td><p>বর্ডার গার্ড বাংলাদেশ (BGB)</p></td><td><p><stro ম শনাক্ত — সাইপ্রাস (চাবি)</p></td><td><p>ডেল্টা ও ওমিক্রনের মিশ্র ধরন বলে প্রচারিত</p></td><td><p>২০২৩ প্র. ৭৭</p></td></tr><tr><td><p><strong>Sophia</strong> রোবট — Hanson Robotics</p></td><td><p>—</p></td><td><p>২০১৮ প্র. ৪৮</p></td></tr><tr><td><p><strong>EDI</strong> বনাম EFT/SWIFT/CHIPS</p></td><td><p>EFT = অর্থ হস্তান্তর; SWIFT = ব্যাংক-বার্তা নেটওয়ার্ক; CHIPS = আন্তঃব্যাংক অর্থ-নিষ্পত্তি; <strong>EDI</strong> = কাঠামোবদ্ধ ব্যবসায়িক নথির বৈদ্যুতিক আদান-প্রদান</p></td><td><p>২০১৯ প্র. ৭৭</p></td></tr></tbody></table><p><strong>সংস্করণ ৪ — বিস্তারিত নোট (১৩.১–১৩.৮):</strong> ২০২৩ সালে বিজ্ঞান থেকে ১৪টি প্রশ্ন এসেছিল (আগে ১টি করে)। তাই মৌলিক বিজ্ঞান ও ICT-র পরীক্ষা-উপযোগী পূর্ণ নোট নিচে। তথ্যগুলো মাধ্যমিক-উচ্চমাধ্যমিক পাঠ্যবইয়ের প্রতিষ্ঠিত জ্ঞান।</p><h2><a id=\"_Toc139\"></a><strong>১৩.১ পদার্থবিজ্ঞান</strong></h2><h3><strong>SI মৌলিক একক (৭টি)</strong></h3><table><thead><tr><th><p><strong>রাশি</strong></p></th><th><p><strong>একক</strong></p></th><th><p><strong>প্রতীক</strong></p></th><th><p><strong>রাশি</strong></p></th><th><p><strong>একক</strong></p></th><th><p><strong>প্রতীক</strong></p></th></tr></thead><tbody><tr><td><p>দৈর্ঘ্য</p></td><td><p>মিটার</p></td><td><p>m</p></td><td><p>তাপমাত্রা</p></td><td><p>কেলভিন</p></td><td><p>K</p></td></tr><tr><td><p>ভর</p></td><td><p>কিলোগ্রাম</p></td><td><p>kg</p></td><td><p>পদার্থের পরিমাণ</p></td><td><p>মোল</p></td><td><p>mol</p></td></tr><tr><td><p>সময়</p></td><td><p>সেকেন্ড</p></td><td><p>s</p></td><td><p>দীপন তীব্রতা</p></td><td><p>ক্যান্ডেলা</p></td><td><p>cd</p></td></tr><tr><td><p>তড়িৎ প্রবাহ</p></td><td><p>অ্যাম্পিয়ার</p></td><td><p>A</p></td><td></td><td></td><td></td></tr></tbody></table><table><thead><tr><th><p><strong>লব্ধ রাশি</strong></p></th><th><p><strong>একক</strong></p></th><th><p><strong>মনে রাখুন</strong></p></th></tr></thead><tbody><tr><td><p>বল</p></td><td><p>নিউটন (N) = kg·m/s²</p></td><td><p>F = ma</p></td></tr><tr><td><p>কাজ/শক্তি</p></td><td><p>জুল (J)</p></td><td><p>W = Fs; গতিশক্তি = ½mv²; বিভবশক্তি = mgh</p></td></tr><tr><td><p>ক্ষমতা</p></td><td><p>ওয়াট (W) = J/s</p></td><td><p>১ অশ্বক্ষমতা (hp) ≈ ৭৪৬ ওয়াট</p></td></tr><tr><td><p>চাপ</p></td><td><p>প্যাসকেল (Pa) = N/m²</p></td><td><p>১ বায়ুমণ্ডলীয় চাপ ≈ ১,০১,৩২৫ Pa (২০২৩ প্র. ৯৭)</p></td></tr><tr><td><p>কম্পাঙ্ক</p></td><td><p>হার্জ (Hz)</p></td><td><p>মানুষের শ্রাব্যতার সীমা ২০ Hz – ২০,০০০ Hz</p></td></tr><tr><td><p>রোধ</p></td><td><p>ওহম (Ω)</p></td><td><p>V = IR (ওহমের সূত্র)</p></td></tr><tr><td><p>বৈদ্যুতিক শক্তি (বিল)</p></td><td><p>কিলোওয়াট-ঘণ্টা (kWh) = ১ ইউনিট</p></td><td><p>১০০ ওয়াটের বাল্ব ১০ ঘণ্টা = ১ ইউনিট</p></td></tr><tr><td><p>দূরত্ব (মহাকাশ)</p></td><td><p>আলোকবর্ষ — দূরত্বের একক, সময়ের নয়</p></td><td><p>আলোর বেগ ≈ ৩ × ১০⁸ m/s</p></td></tr><tr><td><p>সমুদ্রে দূরত্ব</p></td><td><p>নটিক্যাল মাইল = <strong>১৮৫২ মিটার</strong> (আন্তর্জাতিক মান)</p></td><td><p>চাবিতে ১৮৫৩.১৮ এসেছে — অধ্যায় ৫ দেখুন</p></td></tr></tbody></table><h3><strong>তাপমাত্রা রূপান্তর ও গুরুত্বপূর্ণ তথ্য</strong></h3><ul><li><strong>C/5 = (F − 32)/9 = (K − 273)/5</strong>। পানির হিমাঙ্ক ০°C = ৩২°F = ২৭৩K; স্ফুটনাঙ্ক ১০০°C = ২১২°F। <strong>−৪০° তে সেলসিয়াস ও ফারেনহাইট সমান।</strong> মানবদেহের স্বাভাবিক তাপমাত্রা ৯৮.৪°F ≈ ৩৭°C।</li><li><strong>শব্দ:</strong> মাধ্যম লাগে, শূন্যস্থানে চলে না; বাতাসে বেগ ≈ ৩৩২ m/s (০°C), কঠিনে সবচেয়ে বেশি। শ্রাব্যতার নিচে <strong>ইনফ্রাসোনিক</strong>, ওপরে <strong>আলট্রাসোনিক</strong> (বাদুড়, SONAR, আলট্রাসনোগ্রাফি)।</li><li><strong>আলো:</strong> শূন্যস্থানে সবচেয়ে দ্রুত; সূর্য থেকে পৃথিবীতে আসতে ≈ ৮ মিনিট ২০ সেকেন্ড। আকাশ নীল — বিক্ষেপণ (Rayleigh scattering); রংধনু — প্রতিসরণ ও বিচ্ছুরণ; হীরার ঝলক — পূর্ণ অভ্যন্তরীণ প্রতিফলন; অপটিক্যাল ফাইবারও পূর্ণ অভ্যন্তরীণ প্রতিফলনে কাজ করে।</li><li><strong>চুম্বক:</strong> লোহা, নিকেল, কোবাল্ট চৌম্বক পদার্থ; অ্যালুমিনিয়াম, তামা, কাচ অচৌম্বক (২০২৩ প্র. ২২)।</li><li><strong>বিদ্যুৎ:</strong> পরিবাহী — রুপা (সর্বোত্তম), তামা, অ্যালুমিনিয়াম; অপরিবাহী — কাচ, রাবার, প্লাস্টিক; অর্ধপরিবাহী — সিলিকন, জার্মেনিয়াম (ট্রানজিস্টর, সৌরকোষ)। ব
