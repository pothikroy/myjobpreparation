],"a":-1,"e":"xy = 2(x+y) ⇒ 1/x + 1/y = (x+y)/xy = (x+y)/2(x+y) = ১/২। (বিকল্প “12” সম্ভবত ১/২)","s":"গণিত","t":"BB AD 2012","ansText":"১/২"},{"id":"bbadmath-2","q":"How many different six-digit numbers can be formed using all of the following digits: 3, 3, 4, 4, 4, 5?","o":["25","40","50","60","None of them"],"a":3,"e":"পুনরাবৃত্ত অঙ্কসহ বিন্যাস = 6!/(2!×3!) = 720/12 = 60।","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-3","q":"The total income of Mr. Sakib in the years 2003, 2004, and 2005 was Taka 36,400. His income increased by 20% each year. [What was his income in 2005?]","o":["1500","14400","16450","12350"],"a":1,"e":"২০০৩-এ x হলে x + 1.2x + 1.44x = 3.64x = 36400 ⇒ x = 10000; ২০০৫ = 1.44 × 10000 = 14400।","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-4","q":"The ratio of the number of red balls, to yellow balls, to green balls in an urn is 2 : 3 : 4. [Probability that a ball drawn at random is red?]","o":["2/7","5/10","5/9","2/9"],"a":3,"e":"মোট অংশ 2+3+4 = 9; লাল 2 ⇒ সম্ভাবনা 2/9।","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-5","q":"After replacing an old member by a new member, it was found that the average age of five members of a club [is the same as it was 3 years ago. Difference between ages of old and new member?]","o":["15","8","4","2"],"a":0,"e":"৩ বছরে ৫ জনের মোট বয়স ১৫ বাড়ার কথা; গড় একই থাকায় পুরনো সদস্য নতুন সদস্যের চেয়ে ১৫ বছর বড় ছিলেন।","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-6","q":"If for integer x, 5 < x < 10 and y = x + 5. What is the greatest possible value of x + y?","o":["32","22","23","27"],"a":2,"e":"x সর্বোচ্চ 9 ⇒ y = 14 ⇒ x + y = 23।","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-7","q":"In an election a candidate who gets 84% of the votes is elected by a majority of 476 votes. [Total votes polled?]","o":["672","700","749","848"],"a":1,"e":"ব্যবধান = 84% − 16% = 68% = 476 ⇒ মোট = 476/0.68 = 700।","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-8","q":"In a zoo, each pigeon has 2 legs, and each rabbit has 4 legs. [12 heads, 32 legs — pigeons & rabbits?]","o":["6 & 3","5 & 10","8 & 4","6 & 8"],"a":2,"e":"সব কবুতর ধরলে পা = 24; বাড়তি 8 পা ÷ 2 = 4 খরগোশ; কবুতর 8।","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-9","q":"A closed rectangular tank ... placed on its 3 ft by 4 ft side, water height 5 ft. [Height when placed on its 4 ft by 5 ft side?]","o":["3","5","6","4"],"a":0,"e":"পানির আয়তন = 3×4×5 = 60 ঘনফুট; নতুন ভূমি 20 ⇒ উচ্চতা 3।","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-10","q":"A man ate 100 bananas in five days, each eating 6 more than the previous day. How many bananas did he eat on the first day?","o":["6","7","10","8"],"a":3,"e":"a + (a+6) + ... + (a+24) = 5a + 60 = 100 ⇒ a = 8।","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-11","q":"Train X leaves Dhaka at 10:00 AM ... at x mph. Train Y leaves at 11:30 AM at 4x/3 on the same tracks. [When does Y catch X?]","o":["4 PM","2 PM","6 PM","1 PM"],"a":0,"e":"অগ্রগামী দূরত্ব 1.5x; আপেক্ষিক বেগ x/3 ⇒ সময় 4.5 ঘণ্টা ⇒ 11:30 + 4:30 = বিকেল 4টা।","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-12","q":"Bank X pays a simple interest of Taka 80 on principal of taka 1,000 annually. [Bank Y pays Tk 140 on Tk 1000; ratio of rates?]","o":["4:7","6:8","9:18","2:7"],"a":0,"e":"হার 8% ও 14% ⇒ 8:14 = 4:7। (সরল সুদ — মন্ত্রণালয়ের প্রিয় টপিক)","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-13","q":"The sum of two numbers is 5. And their product is 4. Then what is the difference between the numbers?","o":["1","2","3","4"],"a":2,"e":"(a−b)² = (a+b)² − 4ab = 25 − 16 = 9 ⇒ a−b = 3। (মন্ত্রণালয়ের a ± 1/a ধাঁচের অভেদ)","s":"গণিত","t":"BB AD 2012"},{"id":"bbadmath-14","q":"Susan can type 10 pages in 5 minutes. Mary can type 5 pages in 10 minutes. [Pages together in 30 minutes?]","o":["15","20","25","65","75"],"a":4,"e":"Susan 2 পৃ/মি, Mary 0.5 পৃ/মি ⇒ একত্রে 2.5 × 30 = 75।","s":"গণিত","t":"BB AD 2009"},{"id":"bbadmath-15","q":"In a class composed of x girls and y boys what part of the class is composed of girls?","o":["y/(x+y)","x/xy","x/(x+y)","y/xy"],"a":2,"e":"অংশ = মেয়ে/মোট।","s":"গণিত","t":"BB AD 2009"},{"id":"bbadmath-16","q":"r > s > 0; Quantity A = rs/r and Quantity B = rs/s","o":[],"a":-1,"e":"A = s, B = r; r > s ⇒ B বড়।","s":"গণিত","t":"BB AD 2009","ansText":"খ) B বড়"},{"id":"bbadmath-17","q":"What is the maximum number of half-pint bottles of cream that can be filled with a 4-gallon can of cream? (2 pt. = 1 qt. and 4 qt. = 1 gal)","o":["16","24","30","64"],"a":3,"e":"4 gal = 16 qt = 32 pt = 64 টি আধা-পাইন্ট।","s":"গণিত","t":"BB AD 2009"},{"id":"bbadmath-18","q":"If the operation ^ is defined by the equation x ^ y = 2x + y, what is the value of a in 2 ^ a = a ^ 3?","o":["0","1","-1","4"],"a":1,"e":"4 + a = 2a + 3 ⇒ a = 1।","s":"গণিত","t":"BB AD 2009"},{"id":"bbadmath-19","q":"Which of the following fractions has the smallest value?","o":["8/7","10/9","21/20","41/40","1013/1012"],"a":4,"e":"সবগুলো 1 + 1/n আকারের; n বড় হলে মান ছোট।","s":"গণিত","t":"BB AD 2009"},{"id":"bbadmath-20","q":"After 3 semester in college, Jim has a 3.0 GPA. [GPA needed in 4th semester to make average 3.1?]","o":["2.7","3.1","3.3","3.4","3.5"],"a":3,"e":"(3×3.0 + x)/4 = 3.1 ⇒ x = 12.4 − 9 = 3.4।","s":"গণিত","t":"BB AD 2009"},{"id":"bbadmath-21","q":"A rectangle is 14 cm long and 10 cm wide. [Length reduced by x, width increased by x to make a square; change in area?]","o":["4","144","12","2"],"a":0,"e":"বর্গ 12×12 = 144; আগে 140 ⇒ 4 বাড়ে।","s":"গণিত","t":"BB AD 2009"},{"id":"bbadmath-22","q":"When a student weighing 45 kgs left a class, the average weight of the remaining 59 students increased by 200g. [Average of remaining 59?]","o":["57","56.8","58.2","52.2"],"a":0,"e":"60A − 45 = 59(A + 0.2) ⇒ A = 56.8; বাকিদের গড় = 57।","s":"গণিত","t":"BB AD 2009"}]},{"id":"bbadbn","group":"other","title":"বাংলাদেশ ব্যাংক AD ২০১৫ — বাংলা","short":"BB AD বাংলা","note":"উত্তর প্রচলিত ব্যাকরণ অনুযায়ী।","questions":[{"id":"bbadbn-1","q":"ভাষার সর্বনাম ব্যবহারের উদ্দেশ্য কি?","o":["বিশেষণের পরিবর্তে ব্যবহার করা","বিশেষ্যের পুনরাবৃত্তি দূর করা","বিশেষ্যের তের টীকায় সমাধানের সংকেত।</p><h2><a id=\"_Toc6\"></a><strong>গণিত (৫০টি)</strong></h2><table><thead><tr><th><p><strong>সাল/প্র.</strong></p></th><th><p><strong>প্রশ্ন</strong></p></th><th><p><strong>উত্তর</strong></p></th><th><p><strong>টীকা</strong></p></th></tr></thead><tbody><tr><td><p>১৮/৬১</p></td><td><p>বৃত্তের ব্যাস তিনগুণ বৃদ্ধি পেলে এর ক্ষেত্রফল কতগুণ বৃদ্ধি পায়?</p></td><td><p>৯ গুণ</p></td><td><p>✔ ব্যাসার্ধ ৩ গুণ → ক্ষেত্রফল ৯ গুণ</p></td></tr><tr><td><p>১৮/৬২</p></td><td><p>একটি চৌবাচ্চায় ১৯২০০ লিটার পানি ধরে। এর গভীরতা ২.৫৬ মিটার এবং প্রস্থ ২.৫ মিটার হলে দৈর্ঘ্য কত?</p></td><td><p>৩ মিটার</p></td><td><p>✔ ১৯.২ ঘন মি ÷ (২.৫৬×২.৫)=৩</p></td></tr><tr><td><p>১৮/৬৩</p></td><td><p>১০ বছর পূর্বে পিতা-পুত্রের বয়সের অনুপাত ছিল ৪:১ । ১০ বছর পর তাদের বয়সের অনুপাত হবে ২:১। তাদের বর্তমান বয়স কত?</p></td><td><p>৫০ ও ২০ বছর</p></td><td><p>✔ পুনরায় সমাধান করে মিলেছে</p></td></tr><tr><td><p>১৮/৬৪</p></td><td><p>নিচের ভগ্নাংশগুলোর মধ্যে কোনটি বৃহত্তম?</p></td><td><p>৫/৬</p></td><td><p>✔</p></td></tr><tr><td><p>১৮/৬৫</p></td><td><p>বার্ষিক ৪.৫ টাকা হার মুনাফায় কত টাকা বিনিয়োগে ৪ বছরে তা ৮২৬ টাকা হবে?</p></td><td><p>৭০০</p></td><td><p>✔ ৮২৬ ÷ ১.১৮ = ৭০০</p></td></tr><tr><td><p>১৮/৬৬</p></td><td><p>একটি বাইসাইকেলের মূল্য ১০,০০০ টাকা। উহা ১০% বাট্টায় ক্রয় করা হলো। তিনমাস ব্যবহারের পর ক্রয়মূল্যের উপর ১৫% বাট্টায় বিক্রি করলে বিক্রয়মূল্য কত ছিল?</p></td><td><p>৭৬৫০ টাকা</p></td><td><p>✔ ৯০০০×০.৮৫</p></td></tr><tr><td><p>১৮/৬৭</p></td><td><p>একটি নল ১২ মিনিটে একটি খালি চৌবাচ্চা পূর্ণ করে। অপর এক নল প্রতি মিনিটে ১৪ লিটার পানি বের করে দেয়। চৌবাচ্চাটি খালি থাকা অবস্থায় নল দুটি খুলে দিলে ৯৬ মিনিটে উহা পূর্ণ হয়। চৌবাচ্চাটিতে কত লিটার পানি ধরে?</p></td><td><p>১৯২ লিটার</p></td><td><p>✔</p></td></tr><tr><td><p>১৮/৬৮</p></td><td><p>একটি বইয়ের দৈর্ঘ্য ২৫ সে.মি ও প্রস্থ ১৮ সে.মি বইটির পৃষ্ঠা সংখ্যা ২০০ এবং প্রতি পাতার পুরুত্ব ০.১ মি.মি হলে, বইটির আয়তন কত?</p></td><td><p>৪৫০ ঘন সে.মি</p></td><td><p>✔ ২০০ পৃষ্ঠা=১০০ পাতা (leaf) ধরলে ১ সে.মি পুরু</p></td></tr><tr><td><p>১ ষয়ভিত্তিক শ্রেণিবিন্যাস, পুনরাবৃত্তি-বিশ্লেষণ, <strong>উত্তরমালা-যাচাই</strong>, অগ্রাধিকার-তালিকা, স্টাডি নোট, যাচাইকৃত সাম্প্রতিক বিষয়াবলি, অনুশীলনী ও মডেল টেস্ট দেওয়া হয়েছে।</p><h2><a id=\"_Toc30\"></a><strong>১.২ প্রশ্নপত্রগুলো সম্পর্কে একটি গুরুত্বপূর্ণ সতর্কতা</strong></h2><p><strong>তিনটি PDF-ই সরকারি মূল প্রশ্নপত্র নয়।</strong> এগুলো Live MCQ নামের একটি কোচিং-অ্যাপের তৈরি “প্রশ্ন ও সমাধান”। অর্থাৎ প্রশ্নের পাঠ ও <strong>উত্তরের চাবি</strong> তাদের নিজস্ব। আমি তাই চাবির উত্তরকে “চাবি অনুযায়ী উত্তর” হিসেবে রেখেছি এবং যেখানে নিজে পুনরায় হিসাব/যাচাই করে অমিল পেয়েছি, সেখানে ⚠ চিহ্ন দিয়েছি (অধ্যায় ৫ দেখুন)। পরীক্ষার আগে মূল সরকারি প্রশ্নপত্র/গণবিজ্ঞপ্তি থাকলে তার সাথে মিলিয়ে নিন।</p><h2><a id=\"_Toc31\"></a><strong>১.৩ আমি কী কী যাচাই করেছি</strong></h2><ul><li><strong>সব গাণিতিক প্রশ্ন</strong> (মোট ৫৫টি: ২০১৮-এ ২০, ২০১৯-এ ২০, ২০২৩-এ ১৫) নিজে নতুন করে সমাধান করে চাবির সাথে মিলিয়েছি। চিহ্ন ✔ = মিলেছে; ⚠ = অমিল বা দ্ব্যর্থকতা।</li><li>প্রতিরক্ষা, বাংলাদেশ ও সাম্প্রতিক তথ্যের যেগুলো সময়ের সাথে বদলায় (প্রধানমন্ত্রী, বাজেট, শান্তিরক্ষী-র‍্যাংক, নোবেল ইত্যাদি) সেগুলো <strong>ওয়েবে অনুসন্ধান করে</strong> তারিখসহ উৎস দিয়েছি (অধ্যায় ১৫ ও তথ্যসূত্র)।</li><li>ব্যাকরণ, সাহিত্য ও ইংরেজির উত্তর আমার ভাষাজ্ঞান অনুযায়ী পরীক্ষা করেছি; যেখানে সন্দেহ আছে বা স্বাধীন সূত্রে নিশ্চিত হইনি, সেখানে স্পষ্ট লিখেছি।</li></ul><h2><a id=\"_Toc32\"></a><strong>১.৪ সংস্করণ-ইতিহাস ও এখনো যা বাকি (সৎভাবে)</strong></h2><table><thead><tr><th><p><strong>সংস্করণ</strong></p></th><th><p><strong>যা যুক্ত হয়েছে</strong></p></th></tr></thead><tbody><tr><td><p>১-২</p></td><td><p>তিনটি প্রশ্নপত্রের ২৬০টি প্রশ্ন, বিশ্লেষণ, উত্তর-চাবি যাচাই, প্রশ্নপত্রকেন্দ্রিক নোট, অনুশীলন-সেট, তিনটি পূর্ণ মডেল টেস্ট, ২০২৬-এর অর্থনীতির সূচক</p></td></tr><tr><td><p>৩</p></td><td><p>mod.gov.bd থেকে যাচাই করা মন্ত্রণালয়-কাঠামো (অধ্যায় ১২); অন্য পরীক্ষার ৮৪টি প্রকৃত বিগত প্রশ্ন (অধ্যায় ২০); ৩৯টি সাম্প্রতিক MCQ (অধ্যায় ২১); যাচাই-লগ (অধ্যায় ২২)</p></td></tr><tr><td><p>৪</p></td><td><p>সব বিষয়ের বিস্তারিত exact repetition)</strong></h2><p>নিচের <strong>১১টি</strong> প্রশ্ন একই মন্ত্রণালয়ের পরীক্ষায় আগের প্রশ্নের প্রায় হুবহু প্রতিলিপি। ২০১৯-এর ৮০ প্রশ্নের মধ্যে <strong>১০টি (১২.৫%)</strong> এসেছে ২০১৮ থেকে; ২০২৩-এ ১টি (সমীচীন) ২০১৮ থেকে এসেছে।</p><table><thead><tr><th><p><strong>আগের প্রশ্ন</strong></p></th><th><p><strong>পরের প্রশ্ন</strong></p></th><th><p><strong>বিষয়</strong></p></th><th><p><strong>ধরন</strong></p></th></tr></thead><tbody><tr><td><p>২০১৮ প্র. ৫</p></td><td><p>২০১৯ প্র. ৫</p></td><td><p>মার্তণ্ডের সমার্থক শব্দ → সূর্য</p></td><td><p>হুবহু</p></td></tr><tr><td><p>২০১৮ প্র. ৩৩</p></td><td><p>২০১৯ প্র. ৩৩</p></td><td><p>He found the gold coin ___ the floor → while cleaning</p></td><td><p>হুবহু</p></td></tr><tr><td><p>২০১৮ প্র. ৩৮</p></td><td><p>২০১৯ প্র. ৩৯</p></td><td><p>Paradise Lost, Book I &amp; II-এর প্রধান চরিত্র → Satan</p></td><td><p>হুবহু</p></td></tr><tr><td><p>২০১৮ প্র. ৭০</p></td><td><p>২০১৯ প্র. ৫০</p></td><td><p>ল.সা.গু ৬০, গ.সা.গু ১০, একটি সংখ্যা অপরটির ২/৩ → ছোটটি ২০</p></td><td><p>হুবহু</p></td></tr><tr><td><p>২০১৮ প্র. ৭১</p></td><td><p>২০১৯ প্র. ৫১</p></td><td><p>এক নটিক্যাল মাইল = কত মিটার</p></td><td><p>হুবহু</p></td></tr><tr><td><p>২০১৮ প্র. ৭২</p></td><td><p>২০১৯ প্র. ৪৮</p></td><td><p>a − 1/a = 3 হলে a³ − 1/a³ = ৩৬</p></td><td><p>হুবহু</p></td></tr><tr><td><p>২০১৮ প্র. ৭৩</p></td><td><p>২০১৯ প্র. ৪৯</p></td><td><p>x² − √5x + 1 = 0 হলে x² − 1/x²</p></td><td><p>হুবহু</p></td></tr><tr><td><p>২০১৮ প্র. ৭৬</p></td><td><p>২০১৯ প্র. ৫৬</p></td><td><p>√(x+3) = √x + √3 হলে x = ০</p></td><td><p>হুবহু (একটি বিকল্প আলাদা ছাপা)</p></td></tr><tr><td><p>২০১৮ প্র. ৪২</p></td><td><p>২০১৯ প্র. ৬২</p></td><td><p>সশস্ত্র বাহিনী দিবস → ২১ নভেম্বর</p></td><td><p>হুবহু (বাংলা↔English)</p></td></tr><tr><td><p>২০১৮ প্র. ৪৫</p></td><td><p>২০১৯ প্র. ৬৩</p></td><td><p>প্রতিরক্ষা মন্ত্রণালয়ের অধীনে বিভাগের সংখ্যা → ১৯ (চাবি)</p></td><td><p>হুবহু (বাংলা↔English)</p></td></tr><tr><td><p>২০১৮ প্র. ১</p></td><td><p>২০২৩ প্র. ৪২</p></td><td><p>সমীচীন-এর শুদ্ধ বানান (একই চার বিকল্প, ক্রম ভিন্ন)</p></td><td><p>হুবহু — পাঁচ বছর ব্যবধানে</p></td></tr></tbody></table><p><strong>মূল শিক্ষা:</strong> এই মন্ত্রণালয়ের পরীক্ষায় <strong>আগের প্রশ্ন সরাসরি ফিরে আসে — বিশেষ করে ২০১৮ → ২০১৯-এ।</strong> ২০২৩-এ হুবহু পুনরাবৃত্তি কম (মাত্র ১টি), কিন্তু <strong>ধারণাগত পুনরাবৃত্তি</strong> (একই সূত্র, ভিন্ন মান) স্পষ্ট। তাই তিনটি প্রশ্নপত্রই মুখস্থ নয়, <strong>বুঝে</strong> সমাধান করা উচিত।</p><h2><a id=\"_Toc44\"></a><strong>৪.২ ধারণাগত সাদৃশ্য (conceptual similarity)</strong></h2><table><thead><tr><th><p><strong>প্রশ্ন ক</strong></p></th><th><p><strong>প্রশ্ন খ</strong></p></th><th><p><strong>কী একই</strong></p></th><th><p><strong>অন্য সংযোগ</strong></p></th></tr></thead><tbody><tr><td><p>২০১৮ প্র. ৭৭</p></td><td><p>২০১৯ প্র. ৫৭</p></td><td><p>সরলরেখার উপর বর্গ বনাম এক-চতুর্থাংশ/২৫%-এর উপর বর্গ → ১৬ গুণ</p></td><td><p>২০২৩ প্র. ৫৪ (অর্ধেক → ৪ গুণ) — একই ধারণা, ভিন্ন মান</p></td></tr><tr><td><p>২০১৮ প্র. ৭৮</p></td><td><p>২০১৯ প্র. ৫৮</p></td><td><p>চাকা প্রতি মিনিটে n বার ঘুরলে t সেকেন্ডে কত ডিগ্রি (৯০/১.৫ → ৮১০°; ৮০/১.০ → ৪৮০°)</p></td><td><p>—</p></td></tr><tr><td><p>২০১৮ প্র. ৭৯</p></td><td><p>২০১৯ প্র. ৫৯</p></td><td><p>লগারিদম: log₂8 = ৩; log₅625 = ৪</p></td><td><p>—</p></td></tr><tr><td><p>২০১৮ প্র. ৮০</p></td><td><p>২০১৯ প্র. ৬০</p></td><td><p>সূচক সমীকরণ: 4^(x+1)=32; 7^(x+1)=343</p></td><td><p>২০২৩ প্র. ৩০ (4^x + 4^(1−x) = 4)</p></td></tr><tr><td><p>২০১৮ প্র. ৭২/৭৩</p></td><td><p>২০১৯ প্র. ৪৮/৪৯</p></td><td><p>ঘনের/বর্গের পরিচয়: a − 1/a ও x + 1/x ধরনের সূত্র</p></td><td><p>২০২৩ প্র. ৮৯ (x − 1/x = 1 হলে x³ − 1/x³ = ৪) — একই সূত্র, ভিন্ন মান</p></td></tr><tr><td><p>২০১৮ প্র. ৬৩</p></td><td><p>২০১৯ প্র. ৪২</p></td><td><p>পিতা-পুত্রের বয়সের অনুপাত (১০ বছর আগে/পরে)</p></td><td><p>—</p></td></tr><tr><td><p>২০১৮ প্র. ৬৫</p></td><td><p>২০১৯ প্র. ৪৫</p></td><td><p>সরল সুদে আসল/সুদ-আসল সংক্রান্ত</p></td><td><p>২০২৩ প্র. ২; ২০১৯ প্র. ৪৩, ৫২</p></td></tr><tr><td><p>২০১৮ প্র. ৪১</p></td><td><p>২০১৯ প্র. ৬১</p></td><td><p>প্রধানমন্ত্র ণ)। সঠিক বিকল্প ক) with। অ্যাপ-ডাটাও সন্দেহের পক্ষে: সঠিক ২৯%, ভুল ৪৩%। মূল সরকারি চাবি পেলে মিলিয়ে নিন।</p></td></tr><tr><td><p>২০১৮ প্র. ৫৫ / ২০১৯ প্র. ৭৩</p></td><td><p>সেনাবাহিনীর কতজন বীর উত্তম?</p></td><td><p>২০১৮: ৪৯ জন; ২০১৯: ৫০ জন</p></td><td><p><strong>একই বিষয়ে দুই বছরে দুই উত্তর।</strong> সরকারি গেজেটের (১৫ ডিসেম্বর ১৯৭৩) হিসাবে বীর উত্তম মোট ৬৮ জন (প্রথম আলো: মুক্তিযোদ্ধা কল্যাণ ট্রাস্টের তথ্য)। “সেনাবাহিনী ৪৯/৫০” এই বিভাজন আমি যাচাই করতে পারিনি। ২০১৮ প্র. ৫৫-এ সঠিক উত্তরদাতা মাত্র ২%।</p></td></tr><tr><td><p>২০১৮ প্র. ৭১ / ২০১৯ প্র. ৫১</p></td><td><p>এক নটিক্যাল মাইল = কত মিটার</p></td><td><p>১৮৫৩.১৮</p></td><td><p>আন্তর্জাতিক নটিক্যাল মাইল = <strong>১৮৫২ মিটার</strong> (সংজ্ঞা অনুযায়ী)। ১৮৫৩.১৮ মি. পুরনো ব্রিটিশ মান (৬০৮০ ফুট)। বিকল্পে ১৮৫২ না থাকায় ১৮৫৩.১৮ গ্রহণযোগ্য — কিন্তু আধুনিক মান জেনে রাখুন।</p></td></tr><tr><td><p>২০১৮ প্র. ৭৩ / ২০১৯ প্র. ৪৯</p></td><td><p>x² − √5x + 1 = 0 হলে x² − 1/x²</p></td><td><p>খ) √5</p></td><td><p>✔⚠ সমীকরণের দুই মূল: x = (√5 ± 1)/2। প্রথমটির জন্য মান +√5, দ্বিতীয়টির জন্য −√5। চাবি ধনাত্মক ধরেছে। (x + 1/x = √5 ও (x − 1/x)² = 1 থেকে x² − 1/x² = ±√5)। পরীক্ষায় ‘√5’ই লিখুন।</p></td></tr><tr><td><p>২০১৯ প্র. ৭৯</p></td><td><p>Find the odd one: After Dark / Will Grayson / Paper Towns / Looking for Alaska</p></td><td><p>গ) Paper Towns</p></td><td><p><strong>সম্ভবত ভুল।</strong> Paper Towns, Looking for Alaska ও Will Grayson, Will Grayson জন গ্রিনের (বা তাঁর সহ-লেখকসহ) রচনা; After Dark হারুকি মুরাকামির উপন্যাস। তাই odd one = ক) After Dark হওয়ার কথা। (আমার সাহিত্য-জ্ঞান অনুযায়ী; স্বাধীন সূত্রে নিশ্চিত করিনি।)</p></td></tr><tr><td><p>২০১৯ প্র. ৮</p></td><td><p>নিপাতনে সিদ্ধ ‘ষ’ কোনটিতে</p></td><td><p>ঘ) ভূষণ</p></td><td><p>নিয়মভিত্তিক ব্যাখ্যা আমি পাইনি। ভূষণ সাধারণ ষত্ব-বিধির অন্তর্গত মনে হয়। চাবি অনুযায়ী মনে রাখুন; মূল বইয়ের সাথে মিলিয়ে নিন।</p></td></tr><tr><td><p>২০১৯ প্র. ১০</p></td><td><p>‘চাহিদা’ কোন ভাষা থেকে</p></td><td><p>গ) পাঞ্জাবী</p></td><td><p>শব্দের উৎস নিয়ে সূত্রভেদে ভিন্নমত থাকতে পারে (ফারসি/হিন্দি-উর্দুও বলা হয়)। চাবি অনুযায়ী উত্তর রাখুন।</p></td></tr><tr><td><p>২০১৮ প্র. ৪৫ / ২০১৯ প্র. ৬৩</p></td><td><p>প্রতিরক্ষা মন্ত্রণালয়ের অধীন কতটি বিভাগ</p></td><td><p>১৯টি</p></td><td><p>সংখ্যাটি আমি অফিসিয়াল সূত্রে যাচাই করতে পারিনি; অনলাইন সূত্রে নাম-করা কয়েকটি দপ্তরের উল্লেখ আছে (অধ্যায় ১২), পূর্ণ তালিকা mod.gov.bd-এ দেখুন। সময়ের সাথে পরিবর্তনশীল।</p></td></tr><tr><td><p>২০১৮ প্র. ৫৯</p></td><td><p>প্রতিরক্ষা মন্ত্রণালয়ের প্রথম দায়িত্বপ্রাপ্ত মন্ত্রী</p></td><td><p>বঙ্গবন্ধু</p></td><td><p>মুজিবনগর সরকার (১৯৭১) নাকি ১৯৭২-এর মন্ত্রিসভা — কোন সময় ধরা হচ্ছে তা অস্পষ্ট। চাবি অনুযায়ী।</p></td></tr><tr><td><p>২০১৯ প্র. ৬৭, ৮০</p></td><td><p>মুক্তিযুদ্ধে প্রথম শহীদ / সাত বীরশ্রেষ্ঠের মধ্যে প্রথম শহীদ</p></td><td><p>সঙ্কু সমাজদার; মুন্সী আবদুর রউফ</p></td><td><p>তারিখ-সংক্রান্ত সূত্রে অমিল পাওয়া গেছে: একটি শিক্ষাসূত্রে রউফের মৃত্যু ৮ এপ্রিল ১৯৭১, মোস্তফা কামালের ১৭/১৮ এপ্রিল; কিন্তু একই সূত্রের একটি অংশ আবার মোস্তফা কামালকে “প্রথম” বলেছে। তাই চাবি অনুযায়ী উত্তর, তবে ইতিহাস-প্রশ্নে সতর্ক থাকুন।</p></td></tr><tr><td><p>২০১৯ প্র. ৩২</p></td><td><p>I believe we meet … and you __ the priciest item</p></td><td><p>খ) choose</p></td><td><p>ব্যাকরণগতভাবে (opted/choose) নিয়ে বিতর্কের সুযোগ আছে; চাবি অনুযায়ী।</p></td></tr><tr><td><p>২০২৩ প্র. ৩৬</p></td><td><p>বাংলার প্রাচীন জনপদ কোনটি?</p></td><td><p>খ) পুণ্ড্র</p></td><td><p>সমতট, গৌড়, হরিকেল-ও প্রাচীন জনপদ। প্রশ্নটি দ্ব্যর্থক; “পুণ্ড্র” চাবির উত্তর।</p></td></tr><tr><td><p>২০২৩ প্র. ৫১</p></td><td><p>রবীন্দ্রনাথের ছদ্মনাম</p></td><td><p>গ) ভানুসিংহ</p></td><td><p>নীললোহিতও রবীন্দ্রনাথের ছদ্মনাম (বিকল্প খ)। প্রশ্নটি দ্ব্যর্থক।</p></td></tr><tr><td><p>২০২৩ প্র. ৫৮</p></td><td><p>‘তাই’ কোন অব্যয়</p></td><td><p>ক) সংযোজক</p></td><td><p>সমুচ্চয়ী ও সংযোজক প্রায় একই ধারণার ভিন্ন পরিভাষা; বিতর্কিত।</p></td></tr><tr><td><p>২০২৩ প্র. ৫৯</p></td><td><p>পাখা ধীরে ঘুরলে বিদ্যুৎ খরচ</p></td><td><p>গ) একই হয়</p></td><td><p>চাবি অনুযায়ী; রেগুলেটরের ধরন-ভেদে বাস্তবে ভিন্ন হতে পারে।</p></td></tr><tr><td><p>২০২৩ প্র. ২০</p></td><td><p>EU-র বৃহত্তম বাণিজ্যিক অংশীদার</p></td><td><p>খ) চীন</p></td><td><p>সময়-সংবেদনশীল; বছরভেদে বদলায়। (সঠিক ২৯%, ভুল ৩২%)</p></td></tr><tr><td><p>২০১৮ প্র. ৪১ / ২০১৯ প্র. ৬১</p></td><td><p>প্রধানমন্ত্রীই প্রতিরক্ষা মন্ত্রণালয়ের প্রধান</p></td><td><p>ক) প্রধানমন্ত্রী</p></td><td><p>সময়-সংবেদনশীল। ২০২৬-এ প্রধানমন্ত্রী তারেক রহমানই প্রতিরক্ষামন্ত্রী (সূত্র: উইকিপিডিয়া — যাচাই প্রয়োজন)।</p></td></tr><tr><td><p>২০১৯ প্র. ৭৮</p></td><td><p>জাতিসংঘ শান্তিরক্ষায় বাংলাদেশের র‍্যাংক</p></td><td><p>গ) ৩য়</p></td><td><p>২০১৯-এ ৩য় ছিল (ঢাকা ট্রিবিউন); <strong>মার্চ ২০২৬-এ ৪র্থ</strong> (নেপাল, ভারত, রুয়ান্ডার পর)। পরীক্ষার সময়ের জন্য সালসহ মনে রাখুন।</p></td></tr><tr><td><p>২০১৮ প্র. ২৯, ৪৬, ৫২; ২০২৩ প্র. ৫০</p></td><td><p>বাতিল প্রশ্ন</p></td><td><p>—</p></td><td><p>অধ্যায় ২.১ দেখুন।</p></td></tr></tbody></table><p>✔ সকল গাণিতিক প্রশ্ন পুনরায় সমাধান করা হয়েছে (পরিশিষ্টে ✔ চিহ্ন)। উপরের ছাড়া আর কোনো গাণিতিক অমিল পাইনি।</p>"},{"title":"অধ্যায় ৬: পরীক্ষকের পছন্দ ও অগ্রাধিকার-ক্রম (প্রমাণভিত্তিক)","html":"<h2><a id=\"_Toc49\"></a><strong>৬.১ পরীক্ষকের প্রবণতা</strong></h2><ul><li><strong>মুখস্থ বনাম বোধ:</strong> বেশিরভাগ প্রশ্ন সরাসরি তথ্যভিত্তিক (সংজ্ঞা, লেখক, সাল, শব্দার্থ, সন্ধি-বিচ্ছেদ)। গণিতে ছোট সূত্র-ভিত্তিক সমস্যা (১-৩ ধাপ), জটিল নয়।</li><li><strong>উৎস:</strong> বাংলা ব্যাকরণে মাধ্যমিক-উচ্চমাধ্যমিক স্তরের ব্যাকরণ বইয়ের অংশ (“ভাষা-শিক্ষা”, ড. হায়াৎ মামুদ; “বাংলা ভাষা ও সাহিত্য জিজ্ঞাসা”, ড. সৌমিত্র শেখর — চাবির দেওয়া উৎস)। বাংলাদেশ বিষয়ে মুক্তিযুদ্ধ ও জাতীয় প্রতীক-দিবস-কেন্দ্রিক।</li><li><strong>English স্তর:</strong> মাধ্যমিক-ডিগ্রি স্তরের সাধারণ ইডিয়ম/ভোকাব (২০১৯-এ বেশি কঠিন শব্দ: dither, undulating, heckle, protrude, stupendous)।</li><li><strong>প্রতিরক্ষা-প্রশ্ন:</strong> তথ্য-প্রধান: দিবস, সরঞ্জাম, খেতাব, সংখ্যা, শান্তিরক্ষা। ২০২৩-এ কমে গেছে — তবু পদটি এই মন্ত্রণালয়ের, তাই প্রস্তুতি রাখা বুদ্ধিমানের।</li><li><strong>সাম্প্রতিক ঘটনা:</strong> পরীক্ষার ২ মাস থেকে ২+ বছর আগের ঘটনা পর্যন্ত (বিস্তারিত অধ্যায় ১৫-এ)।</li><li><strong>BCS/অন্য নিয়োগ পরীক্ষার সাথে মিল:</strong> ২১৫টি বাহ্যিক প্রশ্নের তুলনা অধ্যায় ২০.৬-এ দেখুন (প্রতিরক্ষা মন্ত্রণালয়ের আরও দুটি AD পরীক্ষা — ২০১৬ ও DGFI ২০২৫ — অধ্যায় ২০.৭–২০.৮-এ) — বানান, সমাস, পারিভাষিক শব্দ ও মৌলিক গণিতে স্পষ্ট মিল আছে; বিসিএস তুলনামূলক বেশি বিশ্লেষণধর্মী।</li></ul><h2><a id=\"_Toc50\"></a><strong>৬.২ অগ্রাধিকার-ক্রম</strong></h2><p>ভিত্তি: তিনটি প্রশ্নপত্রের মধ্যে পুনরাবৃত্তি ও সংখ্যা। “Priority” = প্রমাণ-ভিত্তিক সুপারিশ, নিশ্চিতি নয়।</p><table><thead><tr><th><p><strong>স্তর</strong></p></th><th><p><strong>টপিক</strong></p></th><th><p><strong>প্রমাণ</strong></p></th></tr></thead><tbody><tr><td><p><strong>A — অত্যন্ত গুরুত্বপূর্ণ</strong></p></td><td><p>গণিত: সরল সুদ, লাভ-ক্ষতি/শতকরা, বীজগণিতের সূত্র (a ± 1/a), সূচক-লগারিদম, ল.সা.গু-গ.সা.গু, জ্যামিতি (ক্ষেত্রফল/বহুভুজ)</p></td><td><p>প্রতি পরীক্ষায় ১৫-২০টি; ২০১৮→২০১৯-এ ৯টি হুবহু/ধারণাগত পুনরাবৃত্তি</p></td></tr><tr><td><p><strong>A</strong></p></td><td><p>বাংলা ব্যাকরণ: সন্ধি, সমাস, কারক-বিভক্তি, পারিভাষিক শব্দ, বানান, সমার্থক/বিপরীত, এককথায় প্রকাশ, বাগধারা</p></td><td><p>প্রতি পরীক্ষায় ১৫-২০টি; “সমীচীন”, “মার্তণ্ড” পুনরাবৃত্ত</p></td></tr><tr><td><p><strong>A</strong></p></td><td><p>English: Idiom/Phrasal verb, Vocabulary (synonym/antonym), Spelling, মৌলিক Grammar (passive, preposition, tense)</p></td><td><p>প্রতি পরীক্ষায় ২০-২১টি; দুই বছরে একই প্রশ্ন (gold coin, Paradise Lost)</p></td></tr><tr><td><p><strong>A</strong></p></td><td><p>প্রতিরক্ষা: সশস্ত্র বাহিনী দিবস, বীরত্বসূচক খেতাব, শান্তিরক্ষা, নৌ/বিমান সরঞ্জাম, মন্ত্রণালয়ের কাঠামো</p></td><td><p>২০১৮, ২০১৯-এ ১০% করে; একাধিক হুবহু পুনরাবৃত্তি</p></td></tr><tr><td><p><strong>B — গুরুত্বপূর্ণ</strong></p></td><td><p>বাংলাদেশ: মুক্তিযুদ্ধ (তারিখ/সেক্টর/ঘোষণাপত্র), সংবিধান (তফসিল, অনুচ্ছেদ), জাতীয় প্রতীক-দিবস, সাহিত্য-সংস্কৃতি</p></td><td><p>প্রতি পরীক্ষায় ৪-১০টি</p></td></tr><tr><td><p><strong>B</strong></p></td><td><p>সাহিত্য: লেখক-গ্রন্থ-উপাধি (বাংলা), English literature (Milton, Dickens, Chaucer, Shelley)</p></td><td><p>প্রতি পরীক্ষায় ৪-১৬টি (বাংলা সাহিত্য ২০২৩-এ ১২)</p></td></tr><tr><td><p><strong>B</strong></p></td><td><p>বিজ্ঞান (জীববিজ্ঞান-কেন্দ্রিক), সাধারণ স্বাস্থ্য/রোগ</p></td><td><p>২০২৩-এ ১৪টি — ২০২৩-এর ধারা অনুসরণ করলে বাড়তে পারে</p></td></tr><tr><td><p><strong>C — মাঝারি</strong></p></td><td><p>আন্তর্জাতিক (রাজধানী, ভূগোল, সংস্থা, বই-লেখক), সাম্প্রতিক ঘটনা</p></td><td><p>প্রতি পরীক্ষায় ৪-১০টি, কিন্তু প্রতিবার ভিন্ন বিষয়</p></td></tr><tr><td><p><strong>D — অতিরিক্ত</strong></p></td><td><p>ICT (EDI, SWIFT, রোবটিক্স), মানসিক দক্ষতা/রিজনিং</p></td><td><p>২৬০টির মধ্যে ২টি ICT; রিজনিং ০টি</p></td></tr></tbody></table><p><strong>সতর্কতা:</strong> মাত্র তিনটি পরীক্ষা, তাই “A” মানে সর্বোচ্চ প্রমাণ — অন্য বিষয় অবহেলা করার ছাড়পত্র নয়। ২০২৩-এ প্রশ্নের সংখ্যা ১০০ এবং ছড়ানো; সব বিষয়েই ন্যূনতম প্রস্তুতি রাখুন।</p>"},{"title":"অধ্যায় ৭: বাংলা ভাষা ও সাহিত্য — স্টাডি নোট","html":"<p>এই নোট তিনটি প্রশ্নপত্রে যা এসেছে এবং তার সংলগ্ন নিয়মের ওপর কেন্দ্রীভূত। এটি সম্পূর্ণ ব্যাকরণ-বইয়ের বিকল্প নয়; উদাহরণগুলো প্রশ্নপত্র থেকে নেওয়া (সাল ও প্র. নং সহ)।</p><h2><a id=\"_Toc52\"></a><strong>৭.১ ধ্বনিতত্ত্ব, বর্ণ ও ধ্বনি-পরিবর্তন</strong></h2><ul><li><strong>ব্যাকরণের শাখা:</strong> ধ্বনিতত্ত্ব (ধ্বনি, বর্ণ, সন্ধি, ণত্ব-ষত্ব, ধ্বনি-পরিবর্তন) · রূপতত্ত্ব/শব্দতত্ত্ব (শব্দ, পদ, বচন, পুরুষ, কাল, প্রত্যয়, উপসর্গ, সমাস) · বাক্যতত্ত্ব · ছন্দতত্ত্ব। (২০১৯ প্র. ৩: ক্রিয়ার কাল ও পুরুষ → <strong>রূপতত্ত্ব</strong>। ২০২৩ প্র. ৪৪: সন্ধি → <strong>ধ্বনিতত্ত্ব</strong>।)</li><li><strong>ভাষার মূল উপকরণ → বাক্য</strong> (২০২৩ প্র. ৮১; চাবি অনুযায়ী)।</li><li><strong>পরাশ্রয়ী বর্ণ তিনটি:</strong> ং (অনুস্বার), ঃ (বিসর্গ), ঁ (চন্দ্রবিন্দু) (২০১৯ প্র. ৭)।</li></ul><table><thead><tr><th><p><strong>ধ্বনি-পরিবর্তন</strong></p></th><th><p><strong>সংজ্ঞা</strong></p></th><th><p><strong>উদাহরণ</strong></p></th></tr></thead><tbody><tr><td><p>আদি স্বরাগম (Prothesis)</p></td><td><p>শব্দের শুরুতে স্বর আসা</p></td><td><p>স্টেশন → ইস্টিশন, স্কুল → ইস্কুল</p></td></tr><tr><td><p>মধ্য স্বরাগম / বিপ্রকর্ষ / স্বরভক্তি (Anaptyxis)</p></td><td><p>শব্দের মাঝে স্বর আসা</p></td><td><p>প্রীতি → পিরীতি (২০১৯ প্র. ৬), জন্ম → জনম</p></td></tr><tr><td><p>অন্ত্য স্বরাগম (Apothesis)</p></td><td><p>শব্দের শেষে স্বর আসা</p></td><td><p>বেঞ্চ → বেঞ্চি</p></td></tr><tr><td><p>সমীভবন</p></td><td><p>অসম ধ্বনি সম (সদৃশ) হওয়া</p></td><td><p>পদ্ম → পদ্দ (পদ্ম→পদ্দ), গল্প → গপ্পো</p></td></tr><tr><td><p>বিষমীভবন</p></td><td><p>সমবর্ণের একটির পরিবর্তন (২০২৩ প্র. ৮৪)</p></td><td><p>লাল → নাল, শরীর → শরীল</p></td></tr><tr><td><p>অপিনিহিতি</p></td><td><p>ই/উ আগে চলে আসা</p></td><td><p>করিয়া → কইরা, আজি → আইজ</p></td></tr></tbody></table><h2><a id=\"_Toc53\"></a><strong>৭.২ সন্ধি ও সন্ধি-বিচ্ছেদ</strong></h2><p>সন্ধি তিন প্রকার: <strong>স্বরসন্ধি</strong> (স্বর + স্বর), <strong>ব্যঞ্জনসন্ধি</strong> (ব্যঞ্জন ও স্বর/ব্যঞ্জনের মিলন), <strong>বিসর্গসন্ধি</strong> (বিসর্গ ও স্বর/ব্যঞ্জন)। প্রশ্নপত্রে আসা শব্দ:</p><table><thead><tr><th><p><strong>শব্দ</strong></p></th><th><p><strong>সন্ধি-বিচ্ছেদ</strong></p></th><th><p><strong>প্রকার/সূত্র</strong></p></th><th><p><strong>প্রশ্নপত্র</strong></p></th></tr></thead><tbody><tr><td><p>অহরহ</p></td><td><p>অহঃ + অহ</p></td><td><p>বিসর্গসন্ধি (নিপাতন)</p></td><td><p>২০১৮ প্র. ৪</p></td></tr><tr><td><p>অহর্নিশ</p></td><td><p>অহঃ + নিশ</p></td><td><p>বিসর্গসন্ধি</p></td><td><p>২০১৮ প্র. ৪-এর ব্যাখ্যা</p></td></tr><tr><td><p>ভাস্কর</p></td><td><p>ভাঃ + কর</p></td><td><p>বিসর্গসন্ধি</p></td><td><p>২০১৮ প্র. ৪-এর ব্যাখ্যা</p></td></tr><tr><td><p>বাচস্পতি</p></td><td><p>বাচঃ + পতি</p></td><td><p>বিসর্গসন্ধি</p></td><td><p>ঐ</p></td></tr><tr><td><p>সঞ্চয়</p></td><td><p>সম্ + চয়</p></td><td><p>ব্যঞ্জনসন্ধি (ম্ + বর্গীয় বর্ণ → ঐ বর্গের পঞ্চম বর্ণ/ং)</p></td><td><p>২০১৯ প্র. ৯</p></td></tr><tr><td><p>পদ্ধতি</p></td><td><p>পদ + হতি</p></td><td><p>ব্যঞ্জনসন্ধি (দ্ + হ → দ্ধ)</p></td><td><p>২০১৮ প্র. ৯ (চাবি)</p></td></tr><tr><td><p>ব্যাকরণ</p></td><td><p>বি + আ + কৃ + অন</p></td><td><p>উপসর্গ + ধাতু + প্রত্যয়</p></td><td><p>২০১৮ প্র. ১৪</p></td></tr></tbody></table><p><strong>টিপস:</strong> সন্ধি-বিচ্ছেদে বিকল্পগুলো প্রায়ই এক-অক্ষরের পার্থক্যযুক্ত (সন্/সম্/সঙ/সৎ)। মূল শব্দের প্রথম অংশের ধ্বনি-পরিবর্তন কীভাবে হয় তা বুঝে নিয়ম মনে রাখুন; শুধু মুখস্থ করলে উল্টো-ফাঁদে পড়বেন।</p><h2><a id=\"_Toc54\"></a><strong>৭.৩ সমাস</strong></h2><table><thead><tr><th><p><strong>শব্দ</strong></p></th><th><p><strong>সমাস</strong></p></th><th><p><strong>ব্যাসবাক্য/ব্যাখ্যা</strong></p></th><th><p><strong>প্রশ্নপত্র</strong></p></th></tr></thead><tbody><tr><td><p>হজযাত্রা</p></td><td><p>চতুর্থী (নিমিত্ত) তৎপুরুষ</p></td><td><p>হজের জন্য যাত্রা</p></td><td><p>২০১৮ প্র. ১০</p></td></tr><tr><td><p>শতাব্দী</p></td><td><p>দ্বিগু</p></td><td><p>শত অব্দের সমাহার</p></td><td><p>২০১৯ প্র. ১৪</p></td></tr><tr><td><p>প্রগতি</p></td><td><p>প্রাদি সমাস</p></td><td><p>প্র (উপসর্গ) + গতি</p></td><td><p>২০২৩ প্র. ২১</p></td></tr><tr><td><p>ধানক্ষেত</p></td><td><p>ষষ্ঠী তৎপুরুষ — যোগরূঢ় নয়</p></td><td><p>ধানের ক্ষেত</p></td><td><p>২০২৩ প্র. ৩১</p></td></tr><tr><td><p>পঙ্কজ, মহাযাত্রা, রাজপুত</p></td><td><p>যোগরূঢ় শব্দ</p></td><td><p>সমাসজাত অর্থ ছাড়িয়ে বিশেষ অর্থ (পঙ্কজ = পদ্ম; মহাযাত্রা = মৃত্যু; রাজপুত = জাতিবিশেষ)</p></td><td><p>২০২৩ প্র. ৩১; ২০১৮ প্র. ১৯</p></td></tr></tbody></table><p><strong>যোগরূঢ় শব্দ</strong> (২০১৮ প্র. ১৯): সমাসসিদ্ধ যে শব্দ সমস্যমান পদগুলোর কোনোটির সাধারণ অর্থ না বুঝিয়ে বিশেষ অর্থ প্রকাশ করে।</p><h2><a id=\"_Toc55\"></a><strong>৭.৪ কারক-বিভক্তি, অব্যয়, বাক্য-শ্রেণি</strong></h2><ul><li><strong>অপাদান কারকে ৫মী বিভক্তি:</strong> গাছ <strong>হতে</strong> ফলটি পড়ল (২০১৮ প্র. ১১)। হতে/থেকে/চেয়ে — অপাদানের চিহ্ন।</li><li><strong>কর্তৃকারকে শূন্য বিভক্তি:</strong> “গৃহহীন চিরদিন থাকে পরাধীন” — গৃহহীন (২০১৯ প্র. ২০)।</li><li><strong>বাক্য-শ্রেণি:</strong> “‘মা’ ছিল না বলে কেউ তার চুল বেঁধে দেয়নি” → জটিল (মিশ্র) বাক্য, কারণ অধীন খণ্ড + স্বাধীন খণ্ড (২০১৮ প্র. ১৮)। “সকল অহংকার হে আমার ডুবাও চোখের জলে” → সরল বাক্য (একটি সমাপিকা ক্রিয়া) (২০২৩ প্র. ৩৫)।</li><li><strong>অব্যয়:</strong> “তিনি সৎ <strong>তাই</strong> সকলে শ্রদ্ধা করে” → সংযোজক অব্যয় (চাবি) (২০২৩ প্র. ৫৮) ⚠ পরিভাষা-বিভ্রাটের সম্ভাবনা।</li></ul><h2><a id=\"_Toc56\"></a><strong>৭.৫ উপসর্গ, প্রত্যয়, ধাতু</strong></h2><ul><li><strong>নাম ধাতু:</strong> বিশেষ্য/বিশেষণ/অনুকার-শব্দ থেকে গঠিত ধাতু — ঘুম → <strong>ঘুমা</strong> (২০১৯ প্র. ১২)। (খা, কর, ছাড় = মৌলিক ধাতু)।</li><li><strong>ইমন প্রত্যয়</strong> (ভাববাচক বিশেষ্য): নীল + ইমন = <strong>নীলিমা</strong>; (লাল → লালিমা, মহা → মহিমা) (২০১৯ প্র. ১৩)।</li><li><strong>বহুবচন-প্রকাশক:</strong> হস্তি + <strong>যূথ</strong> = হস্তিযূথ (২০১৯ প্র. ১৮)। (নিচয়, আবলি, রা, গণ, বৃন্দ — প্রত্যেকের নির্দিষ্ট ব্যবহার আছে)।</li><li><strong>‘স’ উপসর্গ:</strong> সরস — চাবি অনুযায়ী “সঙ্গে/সহিত” অর্থ (২০২৩ প্র. ২৪)।</li></ul><h2><a id=\"_Toc57\"></a><strong>৭.৬ ণত্ব-ষত্ব ও শব্দের উৎস</strong></h2><ul><li><strong>মূর্ধন্য-ষ কোথায় হয়:</strong> তৎসম শব্দে (২০২৩ প্র. ৬৯)। দেশি/বিদেশি/লোকজ শব্দে সাধারণত দন্ত্য-স বা শ।</li><li><strong>উৎস-ভাষা (প্রশ্নপত্রে):</strong> জংশন — ইংরেজি (২০২৩ প্র. ২৮); মহকুমা — আরবি (২০১৯ প্র. ১১); চাহিদা — চাবিতে পাঞ্জাবী (২০১৯ প্র. ১০, ⚠)।</li></ul><h2><a id=\"_Toc58\"></a><strong>৭.৭ শব্দভাণ্ডার: সমার্থক, বিপরীত, এক কথায়, বাগধারা, পরিভাষা</strong></h2><table><thead><tr><th><p><strong>ধরন</strong></p></th><th><p><strong>শব্দ/প্রকাশ</strong></p></th><th><p><strong>অর্থ/উত্তর</strong></p></th><th><p><strong>প্রশ্নপত্র</strong></p></th></tr></thead><tbody><tr><td><p>সমার্থক</p></td><td><p>মার্তণ্ড</p></td><td><p>সূর্য (আদিত্য, তপন, দিবাকর, ভাস্কর, ভানু, রবি, সবিতা)</p></td><td><p>২০১৮ প্র. ৫; ২০১৯ প্র. ৫</p></td></tr><tr><td><p>সমার্থক</p></td><td><p>নদী</p></td><td><p>সরিৎ (তটিনী, স্রোতস্বিনী, তরঙ্গিণী…)</p></td><td><p>২০২৩ প্র. ৩৭</p></td></tr><tr><td><p>বিপরীত</p></td><td><p>অলীক</p></td><td><p>বাস্তব</p></td><td><p>২০১৮ প্র. ১৩</p></td></tr><tr><td><p>এক কথায়</p></td><td><p>যে নারীর স্বামী ও পুত্র নেই</p></td><td><p>অবীরা</p></td><td><p>২০২৩ প্র. ১৯</p></td></tr><tr><td><p>এক কথায়</p></td><td><p>যা সহজে অতিক্রম করা যায় না</p></td><td><p>দুরতিক্রম্য</p></td><td><p>২০২৩ প্র. ৬১</p></td></tr><tr><td><p>বাক্য সংকোচন</p></td><td><p>যা বিনা যত্নে উৎপন্ন হয়েছে</p></td><td><p>অযত্নসম্ভূত</p></td><td><p>২০১৮ প্র. ৬</p></td></tr><tr><td><p>বাগধারা</p></td><td><p>শিরে সংক্রান্তি</p></td><td><p>আসন্ন বিপদ</p></td><td><p>২০১৮ প্র. ৭</p></td></tr><tr><td><p>বাগধারা</p></td><td><p>গোঁফ খেজুরে</p></td><td><p>অত্যন্ত অলস</p></td><td><p>২০১৯ প্র. ১৭</p></td></tr><tr><td><p>বাগধারা (সংলগ্ন)</p></td><td><p>খয়ের খাঁ; ছা-পোষা</p></td><td><p>চাটুকার/স্তাবক; সামান্য আয়ের ভরসায় পরিবার-প্রতিপালনকারী নিরীহ গরিব</p></td><td><p>২০১৯ প্র. ১৭ (বিকল্প)</p></td></tr><tr><td><p>পরিভাষা</p></td><td><p>corrigendum</p></td><td><p>শুদ্ধিপত্র</p></td><td><p>২০১৮ প্র. ৮</p></td></tr><tr><td><p>পরিভাষা</p></td><td><p>Ordnance / Ordinance</p></td><td><p>সমরাস্ত্র / অধ্যাদেশ</p></td><td><p>২০১৮ প্র. ১৫ ⚠</p></td></tr><tr><td><p>পরিভাষা</p></td><td><p>Subconscious</p></td><td><p>অবচেতন</p></td><td><p>২০১৮ প্র. ২০</p></td></tr><tr><td><p>পরিভাষা</p></td><td><p>স্নাতকোত্তর</p></td><td><p>পারিভাষিক শব্দ (Post-graduate)</p></td><td><p>২০১৯ প্র. ১৬</p></td></tr><tr><td><p>পদান্তর</p></td><td><p>সুষ্ঠু → বিশেষ্য</p></td><td><p>সৌষ্ঠব</p></td><td><p>২০১৮ প্র. ১৭</p></td></tr></tbody></table><p><strong>বানান-সতর্কতা:</strong> সমীচীন (✔) · সমিচীন ✗ · সমীচিন ✗ · সমিচিন ✗ (২০১৮ প্র. ১; ২০২৩ প্র. ৪২)। <strong>বাক্যশুদ্ধি:</strong> “তার কথা শুনে আমি আশ্চর্যান্বিত হলাম” (শুদ্ধ); “স্বপরিবারে আমন্ত্রিত”, “পরশ্রীকাতরতায় মুগ্ধ” — অশুদ্ধ (২০১৮ প্র. ২)।</p><h2><a id=\"_Toc59\"></a><strong>৭.৮ সাহিত্য — যুগ, লেখক, গ্রন্থ</strong></h2><table><thead><tr><th><p><strong>তথ্য</strong></p></th><th><p><strong>প্রশ্নপত্র</strong></p></th></tr></thead><tbody><tr><td><p><strong>চর্যাপদ</strong> বাংলা ভাষা ও সাহিত্যের আদি নিদর্শন। ১৯০৭ সালে মহামহোপাধ্যায় হরপ্রসাদ শাস্ত্রী নেপালের রাজদরবারের গ্রন্থাগার থেকে এর পুথি আবিষ্কার করেন; ১৯১৬ সালে “হাজার বছরের পুরাণ বাঙ্গালা ভাষায় বৌদ্ধগান ও দোহা” নামে প্রকাশ (বঙ্গীয় সাহিত্য পরিষৎ) — চাবির ব্যাখ্যা অনুযায়ী।</p></td><td><p>২০১৯ প্র. ২</p></td></tr><tr><td><p><strong>প্রমথ চৌধুরী</strong> — চলিত রীতির প্রবর্তক; ১৯১৪-তে মাসিক “সবুজপত্র”; গ্রন্থ: তেল-নুন-লাকড়ি, সনেট পঞ্চাশৎ, চার-ইয়ারি কথা, বীরবলের হালখাতা, পদচারণ প্রভৃতি।</p></td><td><p>২০১৯ প্র. ১</p></td></tr><tr><td><p><strong>কবিকঙ্কণ</strong> — মুকুন্দরাম চক্রবর্তীর উপাধি।</p></td><td><p>২০১৮ প্র. ১২</p></td></tr><tr><td><p>“ফুল ফুটুক না ফুটুক, আজ বসন্ত” — <strong>সুভাষ মুখোপাধ্যায়</strong>।</p></td><td><p>২০১৮ প্র. ৩</p></td></tr><tr><td><p><strong>মুজিব-লেনিন-ইন্দিরা</strong> — নির্মলেন্দু গুণ (চাবি)। <strong>রাজা যায় রাজা আসে</strong> — আবুল হাসান।</p></td><td><p>২০১৮ প্র. ১৬; ২০২৩ প্র. ৩৪</p></td></tr><tr><td><p><strong>পায়ের আওয়াজ পাওয়া যায়</strong> — সৈয়দ শামসুল হক; মুক্তিযুদ্ধভিত্তিক। তাঁর আরও নাটক: নূরলদীনের সারাজীবন, এখানে এখন।</p></td><td><p>২০২৩ প্র. ৫</p></td></tr><tr><td><p><strong>September on Jessore Road</strong> — Allen Ginsberg; মুক্তিযুদ্ধের শরণার্থীদের নিয়ে; বাংলা অনুবাদ খান মোহাম্মদ ফারাবি (চাবির ব্যাখ্যা)।</p></td><td><p>২০২৩ প্র. ৪</p></td></tr><tr><td><p><strong>ভানুসিংহ</strong> — রবীন্দ্রনাথের ছদ্মনাম (নীললোহিতও)। <strong>মরুভাস্কর</strong> — নজরুলের রচনা। <strong>দারিদ্র্য</strong> কবিতা — সিন্ধু-হিন্দোল (চাবি)।</p></td><td><p>২০২৩ প্র. ৫১, ৯১, ৯৯</p></td></tr><tr><td><p><strong>আমার ভাইয়ের রক্তে রাঙানো…</strong> — গীতিকার আবদুল গাফফার চৌধুরী; প্রথম সুরকার আবদুল লতিফ (চাবি); পরবর্তী সুরকার আলতাফ মাহমুদ।</p></td><td><p>২০২৩ প্র. ৭৯</p></td></tr><tr><td><p><strong>জাহান্নাম হইতে বিদায়</strong> — মুক্তিযুদ্ধভিত্তিক উপন্যাস (শওকত ওসমান)। <strong>ঘরে-বাইরে</strong> (রবীন্দ্রনাথ), <strong>পথের দাবী</strong> (শরৎচন্দ্র), <strong>চিলেকোঠার সেপাই</strong> (আখতারুজ্জামান ইলিয়াস) — রাজনৈতিক উপন্যাস; <strong>চাঁদের অমাবস্যা</strong> (সৈয়দ ওয়ালীউল্লাহ) নয়।</p></td><td><p>২০২৩ প্র. ৯৪, ৫২</p></td></tr><tr><td><p><strong>হাঁসুলী বাঁকের উপকথা</strong> (তারাশঙ্কর), <strong>পুতুলনাচের ইতিকথা</strong> (মানিক), <strong>গৃহদাহ</strong> (শরৎচন্দ্র); “জেলে-জীবনকেন্দ্রিক” — চাবি অনুযায়ী <strong>গঙ্গা</strong>।</p></td><td><p>২০২৩ প্র. ৪৩ ⚠</p></td></tr><tr><td><p><strong>নাটক</strong> = দৃশ্যকাব্য। <strong>নেমেসিস</strong> — চাবি অনুযায়ী নাটক।</p></td><td><p>২০২৩ প্র. ৭৬, ১১ ⚠</p></td></tr><tr><td><p><strong>আলোকিত মানুষ চাই</strong> — বিশ্বসাহিত্য কেন্দ্রের স্লোগান।</p></td><td><p>২০১৯ প্র. ৬৯</p></td></tr></tbody></table><p><strong>সংস্করণ ৪ — বিস্তারিত নোট (৭.৯–৭.১৭):</strong> নিচের নিয়ম ও উদাহরণ নবম-দশম শ্রেণির বাংলা ব্যাকরণ (NCTB) ও প্রচলিত ব্যাকরণ-বইয়ের প্রতিষ্ঠিত নিয়ম অনুযায়ী। বিভিন্ন বইয়ে মতভেদ আছে, এমন জায়গায় ⚠ দেওয়া আছে। মন্ত্রণালয়ের তিনটি প্রশ্নপত্রে বাংলা থেকে ১৯-২০টি করে প্রশ্ন এসেছে, তাই এই অংশ অগ্রাধিকার A।</p><h2><a id=\"_Toc60\"></a><strong>৭.৯ স্বরসন্ধির নিয়ম (সূত্র + উদাহরণ)</strong></h2><table><thead><tr><th><p><strong>সূত্র</strong></p></th><th><p><strong>উদাহরণ</strong></p></th></tr></thead><tbody><tr><td><p>অ/আ + অ/আ = আ</p></td><td><p>নর + অধম = নরাধম; হিম + আলয় = হিমালয়; বিদ্যা + আলয় = বিদ্যালয়; যথা + অর্থ = যথার্থ</p></td></tr><tr><td><p>অ/আ + ই/ঈ = এ</p></td><td><p>শুভ + ইচ্ছা = শুভেচ্ছা; পরম + ঈশ = পরমেশ (৫০তম বিসিএস); মহা + ঈশ = মহেশ; যথা + ইষ্ট = যথেষ্ট</p></td></tr><tr><td><p>অ/আ + উ/ঊ = ও</p></td><td><p>সূর্য + উদয় = সূর্যোদয়; নীল + উৎপল = নীলোৎপল; গঙ্গা + ঊর্মি = গঙ্গোর্মি</p></td></tr><tr><td><p>অ/আ + ঋ = অর্</p></td><td><p>দেব + ঋষি = দেবর্ষি; মহা + ঋষি = মহর্ষি; রাজা + ঋষি = রাজর্ষি</p></td></tr><tr><td><p>অ/আ + এ/ঐ = ঐ</p></td><td><p>জন + এক = জনৈক; সদা + এব = সদৈব; মহা + ঐশ্বর্য = মহৈশ্বর্য</p></td></tr><tr><td><p>অ/আ + ও/ঔ = ঔ</p></td><td><p>বন + ওষধি = বনৌষধি; মহা + ঔষধ = মহৌষধ</p></td></tr><tr><td><p>ই/ঈ + ই/ঈ = ঈ</p></td><td><p>অতি + ইত = অতীত; রবি + ইন্দ্র = রবীন্দ্র; সতী + ঈশ = সতীশ</p></td></tr><tr><td><p>ই/ঈ + অন্য স্বর = য-ফলা</p></td><td><p>অতি + অন্ত = অত্যন্ত; ইতি + আদি = ইত্যাদি; প্রতি + এক = প্রত্যেক</p></td></tr><tr><td><p>উ/ঊ + উ/ঊ = ঊ</p></td><td><p>মরু + উদ্যান = মরূদ্যান; বধূ + উৎসব = বধূৎসব</p></td></tr><tr><td><p>উ/ঊ + অন্য স্বর = ব-ফলা</p></td><td><p>সু + আগত = স্বাগত; অনু + এষণ = অন্বেষণ; তনু + ই = তন্বী</p></td></tr><tr><td><p>ঋ + অন্য স্বর = র-ফলা</p></td><td><p>পিতৃ + আলয় = পিত্রালয়</p></td></tr><tr><td><p>এ + অ = অয়; ঐ + অ = আয়</p></td><td><p>নে + অন = নয়ন; শে + অন = শয়ন; গৈ + অক = গায়ক; নৈ + অক = নায়ক</p></td></tr><tr><td><p>ও + অ = অব; ঔ + অ = আব</p></td><td><p>পো + অন = পবন; ভো + অন = ভবন; পৌ + অক = পাবক (পাবক = অগ্নি — BB AD ২০১৫)</p></td></tr><tr><td><p><strong>নিপাতনে সিদ্ধ</strong></p></td><td><p>কুল + অটা = কুলটা; গো + অক্ষ = গবাক্ষ; প্র + ঊঢ় = প্রৌঢ়; মার্ত + অণ্ড = মার্তণ্ড; শুদ্ধ + ওদন = শুদ্ধোদন; অন্য + অন্য = অন্যান্য</p></td></tr></tbody></table><h2><a id=\"_Toc61\"></a><strong>৭.১০ ব্যঞ্জনসন্ধি ও বিসর্গসন্ধির নিয়ম</strong></h2><table><thead><tr><th><p><strong>সূত্র</strong></p></th><th><p><strong>উদাহরণ</strong></p></th></tr></thead><tbody><tr><td><p>ক্/চ্/ট্/ত্/প্ + স্বর বা ঘোষ ব্যঞ্জন → গ্/জ্/ড্/দ্/ব্</p></td><td><p>দিক্ + অন্ত = দিগন্ত; বাক্ + দান = বাগ্‌দান; ষট্ + আনন = ষড়ানন; সৎ + উপদেশ = সদুপদেশ</p></td></tr><tr><td><p>ত্/দ্ + চ/ছ → চ্চ/চ্ছ</p></td><td><p>উৎ + চারণ = উচ্চারণ; সৎ + চরিত্র = সচ্চরিত্র; উৎ + ছেদ = উচ্ছেদ</p></td></tr><tr><td><p>ত্/দ্ + জ/ঝ → জ্জ</p></td><td><p>সৎ + জন = সজ্জন; বিপদ্ + জাল = বিপজ্জাল</p></td></tr><tr><td><p>ত্/দ্ + ল → ল্ল</p></td><td><p>উৎ + লাস = উল্লাস; উৎ + লেখ = উল্লেখ</p></td></tr><tr><td><p>ত্ + শ → চ্ছ</p></td><td><p>উৎ + শ্বাস = উচ্ছ্বাস; চলৎ + শক্তি = চলচ্ছক্তি</p></td></tr><tr><td><p>ত্/দ্ + হ → দ্ধ</p></td><td><p>উৎ + হার = উদ্ধার; পদ্ + হতি = পদ্ধতি (২০১৮ প্র. ৯)</p></td></tr><tr><td><p>ম্ + ক-ম বর্গীয় বর্ণ → ঙ্/ং বা ঐ বর্গের নাসিক্য</p></td><td><p>সম্ + চয় = সঞ্চয় (২০১৯ প্র. ৯); সম্ + গীত = সংগীত; সম্ + তাপ = সন্তাপ; কিম্ + কর = কিংকর</p></td></tr><tr><td><p>ম্ + য/র/ল/ব/শ/ষ/স/হ → ং</p></td><td><p>সম্ + যম = সংযম; সম্ + সার = সংসার; সম্ + হার = সংহার</p></td></tr><tr><td><p><strong>ব্যঞ্জন — নিপাতনে সিদ্ধ</strong></p></td><td><p>আ + চর্য = আশ্চর্য; গো + পদ = গোষ্পদ; বন + পতি = বনস্পতি; বৃহৎ + পতি = বৃহস্পতি; তৎ + কর = তস্কর; পর + পর = পরস্পর; ষট্ + দশ = ষোড়শ; এক + দশ = একাদশ</p></td></tr><tr><td><p>বিসর্গ: অঃ + অ / ঘোষ ব্যঞ্জন → ও</p></td><td><p>মনঃ + যোগ = মনোযোগ; তপঃ + বন = তপোবন; যশঃ + দা = যশোদা; মনঃ + রম = মনোরম</p></td></tr><tr><td><p>বিসর্গ: ইঃ/উঃ + স্বর বা ঘোষ ব্যঞ্জন → র্</p></td><td><p>নিঃ + আকার = নিরাকার; দুঃ + যোগ = দুর্যোগ; নিঃ + জন = নির্জন; আশীঃ + বাদ = আশীর্বাদ</p></td></tr><tr><td><p>বিসর্গ + চ/ছ → শ; + ট/ঠ → ষ; + ত/থ → স</p></td><td><p>নিঃ + চয় = নিশ্চয়; দুঃ + চরিত্র = দুশ্চরিত্র; নিঃ + তার = নিস্তার; দুঃ + তর = দুস্তর</p></td></tr><tr><td><p>ইঃ/উঃ + ক/প → ষ্ক/ষ্প</p></td><td><p>নিঃ + কাম = নিষ্কাম; দুঃ + কর = দুষ্কর; নিঃ + পাপ = নিষ্পাপ</p></td></tr><tr><td><p>নিঃ + র → নী (বিসর্গ লোপ, পূর্বস্বর দীর্ঘ)</p></td><td><p>নিঃ + রব = <strong>নীরব</strong> (৪৯তম বিসিএস); নিঃ + রস = নীরস; নিঃ + রোগ = নীরোগ</p></td></tr><tr><td><p><strong>বিসর্গ — নিপাতনে সিদ্ধ</strong></p></td><td><p>বাচঃ + পতি = বাচস্পতি; ভাঃ + কর = ভাস্কর; অহঃ + অহ = অহরহ; অহঃ + নিশ = অহর্নিশ (২০১৮ প্র. ৪)</p></td></tr></tbody></table><p><strong>খাঁটি বাংলা সন্ধি (তদ্ভব/দেশি শব্দে):</strong> কাঁচা + কলা = কাঁচকলা; শত + এক = শতেক; মিথ্যা + উক = মিথ্যুক; নাত + জামাই = নাজ্জামাই; চার + টি = চাট্টি। সন্ধির মূল উদ্দেশ্য — <strong>উচ্চারণ সহজ ও শ্রুতিমধুর করা</strong> (BB AD ২০১৫)।</p><h2><a id=\"_Toc62\"></a><strong>৭.১১ সমাস — সব প্রকার এক নজরে</strong></h2><table><thead><tr><th><p><strong>সমাস</strong></p></th><th><p><strong>চেনার উপায়</strong></p></th><th><p><strong>উদাহরণ (ব্যাসবাক্য)</strong></p></th></tr></thead><tbody><tr><td><p>দ্বন্দ্ব</p></td><td><p>দুই পদের অর্থই প্রধান; “ও/এবং” দিয়ে ব্যাসবাক্য</p></td><td><p>মা-বাবা (মা ও বাবা); অহিনকুল (অহি ও নকুল); দুধে-ভাতে (অলুক দ্বন্দ্ব); আমরা (একশেষ — তুমি, সে ও আমি)</p></td></tr><tr><td><p>কর্মধারয়</p></td><td><p>বিশেষণ-বিশেষ্য বা উপমা সম্পর্ক; পরপদ প্রধান</p></td><td><p>নীলপদ্ম (নীল যে পদ্ম); সিংহাসন (সিংহ-চিহ্নিত আসন — মধ্যপদলোপী); তুষারশুভ্র (তুষারের ন্যায় শুভ্র — উপমান); মুখচন্দ্র (মুখ চন্দ্রের ন্যায় — উপমিত); বিষাদসিন্ধু (বিষাদ রূপ সিন্ধু — রূপক)</p></td></tr><tr><td><p>তৎপুরুষ</p></td><td><p>পূর্বপদের বিভক্তি লোপ পায়; পরপদ প্রধান</p></td><td><p>দুঃখপ্রাপ্ত (২য়া); মধুমাখা (মধু দিয়ে মাখা — ৩য়া); হজযাত্রা (হজের জন্য যাত্রা — ৪র্থী; ২০১৮ প্র. ১০); বিলাতফেরত (বিলাত থেকে ফেরত — ৫মী); রাজপুত্র, ধানক্ষেত (৬ষ্ঠী); গাছপাকা (৭মী)</p></td></tr><tr><td><p>নঞ তৎপুরুষ</p></td><td><p>না-বাচক অব্যয় + বিশেষ্য</p></td><td><p>অনাচার (নয় আচার); অনতিদীর্ঘ; অকাল</p></td></tr><tr><td><p>উপপদ তৎপুরুষ</p></td><td><p>পরপদ কৃদন্ত পদ</p></td><td><p>জলদ (জল দেয় যে); পঙ্কজ (পঙ্কে জন্মে যে — যোগরূঢ়); ছেলেধরা</p></td></tr><tr><td><p>অলুক তৎপুরুষ</p></td><td><p>পূর্বপদের বিভক্তি লোপ পায় না</p></td><td><p>ঘোড়ার ডিম; মাটির মানুষ; গায়েপড়া</p></td></tr><tr><td><p>বহুব্রীহি</p></td><td><p>কোনো পদের অর্থ প্রধান নয়; তৃতীয় কোনো অর্থ; “যে/যার”</p></td><td><p>নীলকণ্ঠ (নীল কণ্ঠ যার — শিব); দশানন (দশ আনন যার — সংখ্যাবাচক); হাতাহাতি (ব্যতিহার); নির্ভয় (নেই ভয় যার — নঞ); গায়েহলুদ (অলুক); একচোখা (প্রত্যয়ান্ত)</p></td></tr><tr><td><p>দ্বিগু</p></td><td><p>সংখ্যাবাচক পূর্বপদ + সমাহার</p></td><td><p>শতাব্দী (শত অব্দের সমাহার — ২০১৯ প্র. ১৪); ত্রিভুবন; পঞ্চবটী; চৌরাস্তা</p></td></tr><tr><td><p>অব্যয়ীভাব</p></td><td><p>পূর্বপদ অব্যয়, তার অর্থ প্রধান</p></td><td><p>উপকূল (কূলের সমীপে); প্রতিদিন (দিন দিন — বীপ্সা); যথাশক্তি (শক্তিকে অতিক্রম না করে); আজীবন (জীবন পর্যন্ত)</p></td></tr><tr><td><p>প্রাদি</p></td><td><p>প্র, পরা প্রভৃতি উপসর্গের সাথে কৃদন্ত বিশেষ্য</p></td><td><p>প্রগতি (প্র যে গতি — ২০২৩ প্র. ২১); প্রভাত; অনুতাপ</p></td></tr><tr><td><p>নিত্য</p></td><td><p>ব্যাসবাক্য হয় না, অন্য শব্দ দিয়ে অর্থ বোঝাতে হয়</p></td><td><p>গ্রামান্তর (অন্য গ্রাম); কৃষ্ণসর্প (কৃষ্ণ বর্ণের সর্প)</p></td></tr></tbody></table><p><strong>ফাঁদ:</strong> “রাজপথ” = পথের রাজা (ষষ্ঠী তৎপুরুষ, পদ উল্টে যায় — ৫০তম বিসিএস); “রাজপুত্র” = রাজার পুত্র; “বেতার/বিপত্নীক” — বহুব্রীহি না নঞ তৎপুরুষ, তা নিয়ে বইভেদে মতভেদ ⚠। “সিংহাসন” মধ্যপদলোপী কর্মধারয় — “সিংহ চিহ্নিত আসন”।</p><h2><a id=\"_Toc63\"></a><strong>৭.১২ কারক ও বিভক্তি</strong></h2><table><thead><tr><th><p><strong>কারক</strong></p></th><th><p><strong>প্রশ্ন করুন</strong></p></th><th><p><strong>উদাহরণ</strong></p></th></tr></thead><tbody><tr><td><p>কর্তৃ</p></td><td><p>কে/কারা ক্রিয়া করে?</p></td><td><p><strong>গৃহহীন</strong> চিরদিন থাকে পরাধীন (শূন্য বিভক্তি — ২০১৯ প্র. ২০); বাবা বাড়ি আছেন</p></td></tr><tr><td><p>কর্ম</p></td><td><p>কী/কাকে?</p></td><td><p>ডাক্তার <strong>ডাকো</strong> (শূন্য); <strong>শিক্ষককে</strong> শ্রদ্ধা করো (দ্বিতীয়া)</p></td></tr><tr><td><p>করণ</p></td><td><p>কী দিয়ে/কীসের দ্বারা?</p></td><td><p><strong>কলম</strong> দিয়ে লিখি; <strong>টাকায়</strong> কী না হয়</p></td></tr><tr><td><p>সম্প্রদান</p></td><td><p>কাকে স্বত্বত্যাগ করে দান? (ফেরত চাওয়া হয় না)</p></td><td><p><strong>ভিক্ষুককে</strong> ভিক্ষা দাও; <strong>অন্ধজনে</strong> দেহ আলো</p></td></tr><tr><td><p>অপাদান</p></td><td><p>কোথা থেকে/কী থেকে (চ্যুত, ভীত, জাত, রক্ষিত)?</p></td><td><p>গাছ <strong>হতে</strong> পাতা পড়ে (২০১৮ প্র. ১১); <strong>বাঘকে</strong> ভয় পায় (দ্বিতীয়া বিভক্তি); মেঘ থেকে বৃষ্টি</p></td></tr><tr><td><p>অধিকরণ</p></td><td><p>কোথায়/কখন/কোন বিষয়ে?</p></td><td><p><strong>বনে</strong> বাঘ আছে; <strong>তিলে</strong> তৈল আছে (ব্যাপ্তি); <strong>প্রভাতে</strong> সূর্য ওঠে (কালাধিকরণ)</p></td></tr></tbody></table><ul><li><strong>বিভক্তি:</strong> শূন্য (অ), প্রথমা, দ্বিতীয়া (কে, রে), তৃতীয়া (দ্বারা, দিয়ে, কর্তৃক), চতুর্থী (কে, রে — সম্প্রদানে), পঞ্চমী (হতে, থেকে, চেয়ে), ষষ্ঠী (র, এর — সম্বন্ধ পদ, এটি কারক নয়!), সপ্তমী (এ, য়, তে)।</li><li><strong>সম্বন্ধ পদ ও সম্বোধন পদ কারক নয়</strong> — কারণ ক্রিয়ার সাথে এদের সরাসরি সম্পর্ক নেই। বাংলায় কারক <strong>ছয়টি</strong>।</li></ul><h2><a id=\"_Toc64\"></a><strong>৭.১৩ উপসর্গ ও প্রত্যয়</strong></h2><table><thead><tr><th><p><strong>ধরন</strong></p></th><th><p><strong>সংখ্যা ও উপসর্গ</strong></p></th><th><p><strong>উদাহরণ</strong></p></th></tr></thead><tbody><tr><td><p>বাংলা (খাঁটি)</p></td><td><p><strong>২১টি</strong>: অ, অঘা, অজ, অনা, আ, আড়, আন, আব, ইতি, ঊন (ঊনা), কদ, কু, নি, পাতি, বি, ভর, রাম, স, সা, সু, হা</p></td><td><p>অকেজো, অঘারাম, অজপাড়াগাঁ, অনাবৃষ্টি, আধোয়া, আড়চোখ, নিখুঁত, হাভাতে, ভরপেট, সরস (স = সহিত/সঙ্গে — ২০২৩ প্র. ২৪)</p></td></tr><tr><td><p>তৎসম (সংস্কৃত)</p></td><td><p><strong>২০টি</strong>: প্র, পরা, অপ, সম্, নি, অব, অনু, নির্, দুর্, বি, অধি, সু, উৎ, পরি, প্রতি, অতি, অপি, অভি, উপ, আ</p></td><td><p>প্রকাশ, পরাজয়, অপমান, সম্মান, নিবারণ, অবনতি, অনুকরণ, নির্ভয়, দুর্নাম, বিদেশ, অধিকার, সুনাম, উৎকর্ষ, পরিপূর্ণ, প্রতিদিন, অতিরিক্ত, অভিযান, উপকূল, আজীবন</p></td></tr><tr><td><p>বিদেশি</p></td><td><p>ফারসি: কার, দর, না, নিম, ফি, বদ, বে, বর, কম; আরবি: আম, খাস, লা, গর; ইংরেজি: ফুল, হাফ, হেড, সাব; উর্দু-হিন্দি: হর</p></td><td><p>কারখানা, দরপত্র, নারাজ, নিমরাজি, ফি-বছর, বদমেজাজ, বেহিসাব, লাপাত্তা, গরমিল, হেডমাস্টার, সাবডিভিশন, হররোজ</p></td></tr></tbody></table><ul><li><strong>কৃৎ প্রত্যয়</strong> (ধাতুর সাথে): √পড় + আ = পড়া; √চল্ + অন্ত = চলন্ত; √দৃশ্ + য = দৃশ্য। <strong>তদ্ধিত প্রত্যয়</strong> (শব্দের সাথে): নীল + ইমন = নীলিমা (২০১৯ প্র. ১৩); ঢাকা + আই = ঢাকাই; মিথ্যা + উক = মিথ্যুক; ডাক্তার + খানা = ডাক্তারখানা (৪৯তম বিসিএস)।</li><li><strong>উপসর্গের নিজস্ব অর্থ নেই, কিন্তু অর্থদ্যোতকতা আছে</strong>; এটি শব্দের আগে বসে। প্রত্যয় বসে শব্দ/ধাতুর পরে।</li></ul><h2><a id=\"_Toc65\"></a><strong>৭.১৪ ণত্ব ও ষত্ব বিধান</strong></h2><ul><li><strong>ণত্ব:</strong> ঋ, র, ষ-এর পরে মূর্ধন্য-ণ হয় — ঋণ, কারণ, বর্ণ, ভীষণ। ট-বর্গের সাথে যুক্ত হলে ণ — ঘণ্টা, কণ্ঠ, লণ্ঠন। প্র, পরা, পরি, নির্ উপসর্গের পর “নম্, নশ্, নহ্” ইত্যাদি ধাতুতে ণ — প্রণাম, পরিণাম, নির্ণয়। <strong>কিন্তু</strong> সমাসবদ্ধ শব্দে ণ হয় না — ত্রিনয়ন, সর্বনাম, দুর্নাম, মৃগনাভি, পরনিন্দা।</li><li><strong>ষত্ব:</strong> ই-কারান্ত ও উ-কারান্ত উপসর্গের পর কিছু ধাতুতে ষ — অভিষেক, অনুষ্ঠান, সুষম, বিষম। ঋ ও র-এর পর ষ — ঋষি, বর্ষা, বর্ষণ। ট/ঠ-এর সাথে যুক্ত হলে ষ — কষ্ট, স্পষ্ট, নিষ্ঠা। <strong>বিদেশি শব্দে ষ হয় না</strong> — জিনিস, পোশাক, স্টেশন, পোস্ট। মূর্ধন্য-ষ শুধু তৎসম শব্দে হয় (২০২৩ প্র. ৬৯)।</li></ul><h2><a id=\"_Toc66\"></a><strong>৭.১৫ বানান — বেশি জিজ্ঞাসিত শুদ্ধ রূপ</strong></h2><table><thead><tr><th><p><strong>শুদ্ধ</strong></p></th><th><p><strong>অশুদ্ধ</strong></p></th><th><p><strong>শুদ্ধ</strong></p></
