: <b>প<\/b>-দিয়ে শুরু দুটোতে <b>ণ<\/b>।<\/p><\/div><h3 id=\"c09-s4\">8.4 বাক্যশুদ্ধি — যে ভুলগুলো আসে<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>অশুদ্ধ<\/th><th>শুদ্ধ<\/th><th>ভুলের ধরন<\/th><\/tr><tr><td>সকল ছাত্ররা উপস্থিত ছিল।<\/td><td>সকল ছাত্র উপস্থিত ছিল।<\/td><td>বহুবচনের দ্বিত্ব<\/td><\/tr><tr><td>তার সৌজন্যতায় মুগ্ধ হলাম।<\/td><td>তার সৌজন্যে মুগ্ধ হলাম।<\/td><td>প্রত্যয়ের বাহুল্য<\/td><\/tr><tr><td>অধ্যাপনাই ছাত্রদের তপস্যা।<\/td><td>অধ্যয়নই ছাত্রদের তপস্যা।<\/td><td>শব্দের ভুল প্রয়োগ<\/td><\/tr><tr><td>সে সাক্ষী দিল।<\/td><td>সে সাক্ষ্য দিল।<\/td><td>বিশেষ্য-বিশেষণ বিভ্রাট<\/td><\/tr><tr><td>ইহার আবশ্যক নাই।<\/td><td>ইহার আবশ্যকতা নাই।<\/td><td>ঐ<\/td><\/tr><tr><td>আমি অপমান হয়েছি।<\/td><td>আমি অপমানিত হয়েছি।<\/td><td>ঐ<\/td><\/tr><tr><td>তিনি স্বস্ত্রীক এসেছেন।<\/td><td>তিনি সস্ত্রীক এসেছেন।<\/td><td>উপসর্গের বাহুল্য<\/td><\/tr><tr><td>সে সুস্বাগত জানাল।<\/td><td>সে স্বাগত জানাল।<\/td><td>বাহুল্য (সু + আগত)<\/td><\/tr><tr><td>অশ্রুজলে বুক ভেসে গেল।<\/td><td>অশ্রুতে বুক ভেসে গেল।<\/td><td>বাহুল্য (অশ্রু = চোখের জল)<\/td><\/tr><tr><td>কেবলমাত্র তুমিই পারবে।<\/td><td>কেবল তুমিই পারবে।<\/td><td>বাহুল্য<\/td><\/tr><tr><td>আমার কথাই প্রমাণ হলো।<\/td><td>আমার কথাই প্রমাণিত হলো।<\/td><td>পদবিভ্রাট<\/td><\/tr><tr><td>দৈন্যতা প্রশংসনীয় নয়।<\/td><td>দৈন্য/দীনতা প্রশংসনীয় নয়।<\/td><td>প্রত্যয়ের বাহুল্য<\/td><\/tr><tr><td>তিনি সানন্দিত চিত্তে গ্রহণ করলেন।<\/td><td>তিনি সানন্দচিত্তে গ্রহণ করলেন।<\/td><td>ঐ<\/td><\/tr><tr><td>বিদ্যান মূর্খ অপেক্ষা শ্রেষ্ঠতর।<\/td><td>বিদ্বান মূর্খ অপেক্ষা শ্রেষ্ঠ।<\/td><td>বানান ও তুলনার দ্বিত্ব<\/td><\/tr><tr><td>নিরপরাধী ব্যক্তিকে শাস্তি দিয়ো না।<\/td><td>নিরপরাধ ব্যক্তিকে শাস্তি দিয়ো না।<\/td><td>প্রত্যয়ের বাহুল্য<\/td><\/tr><tr><td>তাহারা বাড়ি যাচ্ছে।<\/td><td>তারা বাড়ি যাচ্ছে। / তাহারা বাড়ি যাইতেছে।<\/td><td>গুরুচণ্ডালী দোষ<\/td><\/tr><tr><td>তার বৈমাত্রেয় সহোদর অসুস্থ।<\/td><td>তার বৈমাত্রেয় ভাই অসুস্থ।<\/td><td>অর্থের অসংগতি<\/td><\/tr><tr><td>বৃক্ষটি সমূলসহ উৎপাটিত হয়েছে।<\/td><td>বৃক্ষটি সমূলে/মূলসহ উৎপাটিত হয়েছে।<\/td><td>বাহুল্য<\/td><\/tr><tr><td>এ কথা প্রমাণ হয়েছে।<\/td><td>এ কথা প্রমাণিত হয়েছে।<\/td><td>পদবিভ্রাট<\/td><\/tr><tr><td>ঘটনাটি শুনে তিনি উদ্বেলিত হলেন।<\/td><td>ঘটনাটি শুনে তিনি উদ্বেল হলেন।<\/td><td>প্রত্যয়ের বাহুল্য<\/td><\/tr><tr><td>আবশ্যকীয় ব্যয়ে কার্পণ্যতা অনুচিত।<\/td><td>আবশ্যক ব্যয়ে কার্পণ্য অনুচিত।<\/td><td>প্রত্যয়ের বাহুল্য<\/td><\/tr><tr><td>পূর্বদিকে সূর্য উদয় হয়।<\/td><td>পূর্বদিকে সূর্য উদিত হয়।<\/td><td>পদবিভ্রাট<\/td><\/tr><\/table><\/div><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 8<\/div><p class=\"li\">অ-তৎসম শব্দে ই ও উ: সরকারি, বাড়ি, কাহিনি। বিদেশি শব্দে ণ, ষ নয়: স্টেশন, গভর্নর।<\/p><p class=\"li\">দেদীপ্যমান, সমীচীন, বিভীষিকা, আনুষঙ্গিক, শুশ্রূষা, ভস্মীভূত, দুষ্কৃতকারী, অন্বেষণ, কল্যাণীয়েষু, রুগ্‌ণ, মুমূর্ষু, পিপীলিকা।<\/p><p class=\"li\">\"-তা\" বাহুল্য: সৌজন্যতা, দৈন্যতা, উৎকর্ষতা, সখ্যতা, কার্পণ্যতা — সব ভুল।<\/p><p class=\"li\">বহুবচনের দ্বিত্ব ও বাহুল্য (অশ্রুজল, সুস্বাগত, কেবলমাত্র) বাক্যশুদ্ধির প্রিয় প্রশ্ন।<\/p><\/div>"},{"id":"c10","no":9,"part":"PART B — BANGLA","title":"Chapter 9: বাংলা সাহিত্য","short":"বাংলা সাহিত্য","toc":[["c10-s1","9.1 কতটুকু পড়বেন"],["c10-s2","9.2 যুগবিভাগ"],["c10-s3","9.3 প্রাচীন যুগ: চর্যাপদ"],["c10-s4","9.4 মধ্যযুগ"],["c10-s5","9.5 আধুনিক যুগ: গদ্যের শুরু"],["c10-s6","9.6 প্রধান লেখক ও তাঁদের রচনা"],["c10-s7","9.7 উপাধি ও ছদ্মনাম"],["c10-s8","9.8 \"প্রথম\" তালিকা"],["c10-s9","9.9 পত্রপত্রিকা"],["c10-s10","9.10 ভাষা আন্দোলন ও মুক্তিযুদ্ধভিত্তিক সাহিত্য"]],"html":"<h3 id=\"c10-s1\">9.1 কতটুকু পড়বেন<\/h3><p>১১টি প্রশ্নপত্রে সাহিত্য থেকে ১১টি প্রশ্ন, তার একটিও পেট্রোবাংলার ২০১৬ বা ২০২৪ সালের প্রশ্নে নয়। তাই সাহিত্যে সময় দিন পরিমিত: যুগবিভাগ, প্রধান লেখকদের প্রধান গ্রন্থ, উপাধি-ছদ্মনাম, ভাষা আন্দোলন ও মুক্তিযুদ্ধভিত্তিক সাহিত্য এবং পত্রপত্রিকা। এ অধ্যায় ছক-নির্ভর রাখা হয়েছে।<\/p><h3 id=\"c10-s2\">9.2 যুগবিভাগ<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>যুগ<\/th><th>সময়<\/th><th>প্রধান নিদর্শন<\/th><\/tr><tr><td>প্রাচীন যুগ<\/td><td>৬৫০–১২০০ খ্রি. (ড. শহীদুল্লাহর মতে; সুনীতিকুমারের মতে ৯৫০–১২০০)<\/td><td>চর্যাপদ<\/td><\/tr><tr><td>অন্ধকার যুগ<\/td><td>১২০১–১৩৫০<\/td><td>উল্লেখযোগ্য সাহিত্য নেই; শূন্যপুরাণ, সেক শুভোদয়া<\/td><\/tr><tr><td>মধ্যযুগ<\/td><td>১২০১–১৮০০<\/td><td>শ্রীকৃষ্ণকীর্তন, বৈষ্ণব পদাবলি, মঙ্গলকাব্য, অনুবাদ সাহিত্য, রোমান্টিক প্রণয়োপাখ্যান, আরাকান রাজসভার সাহিত্য<\/td><\/tr><tr><td>আধুনিক যুগ<\/td><td>১৮০১–বর্তমান<\/td><td>গদ্যের বিকাশ, উপন্যাস, নাটক, ছোটগল্প<\/td><\/tr><\/table><\/div><h3 id=\"c10-s3\">9.3 প্রাচীন যুগ: চর্যাপদ<\/h3><ul><li>বাংলা ভাষা ও সাহিত্যের প্রাচীনতম নিদর্শন; বৌদ্ধ সহজিয়া সাধকদের সাধনসংগীত।<\/li><li>আবিষ্কারক <b>মহামহোপাধ্যায় হরপ্রসাদ শাস্ত্রী<\/b>, ১৯০৭ সালে নেপালের রাজদরবারের গ্রন্থাগার থেকে; ১৯১৬ সালে বঙ্গীয় সাহিত্য পরিষদ থেকে \"হাজার বছরের পুরাণ বাঙ্গালা ভাষায় বৌদ্ধগান ও দোহা\" নামে প্রকাশ।<\/li><li>চর্যার ভাষাকে <b>\"সন্ধ্যা ভাষা\" বা \"আলো-আঁধারি ভাষা\"<\/b> বলেছেন হরপ্রসাদ শাস্ত্রী — <span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021<\/span>।<\/li><li>পদসংখ্যা: ড. শহীদুল্লাহর মতে ৫০টি, সুকুমার সেনের মতে ৫১টি; পাওয়া গেছে সাড়ে ৪৬টি। পদকর্তা ২৩ জন (মতান্তরে ২৪)। আদি কবি লুইপা; সবচেয়ে বেশি পদ (১৩টি) কাহ্নপার; ভুসুকুপা নিজেকে \"বাঙালি\" বলেছেন। টীকাকার মুনিদত্ত; তিব্বতি অনুবাদ আবিষ্কার করেন প্রবোধচন্দ্র বাগচী।<\/li><li>ভাষাতাত্ত্বিক বিচারে চর্যার ভাষা যে বাংলা, তা প্রমাণ করেন ড. সুনীতিকুমার চট্টোপাধ্যায় (ODBL, ১৯২৬)।<\/li><li><span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021<\/span> প্রাচীন কথ্য ভারতীয় আর্যভাষার পরবর্তী স্তর — <b>প্রাচীন প্রাচ্য<\/b>।<\/li><\/ul><h3 id=\"c10-s4\">9.4 মধ্যযুগ<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>বিষয়<\/th><th>তথ্য<\/th><\/tr><tr><td>শ্রীকৃষ্ণকীর্তন<\/td><td>মধ্যযুগের প্রথম কাব্য; রচয়িতা বড়ু চণ্ডীদাস; আবিষ্কারক বসন্তরঞ্জন রায় বিদ্বদ্বল্লভ (১৯০৯, বাঁকুড়া); ১৩ খণ্ড<\/td><\/tr><tr><td>বৈষ্ণব পদাবলি<\/td><td>বিদ্যাপতি (মৈথিল কবি, ব্রজবুলি), চণ্ডীদাস, জ্ঞানদাস, গোবিন্দদাস<\/td><\/tr><tr><td>মঙ্গলকাব্য<\/td><td>মনসামঙ্গল (কানা হরিদত্ত আদি কবি; বিজয়গুপ্ত), চণ্ডীমঙ্গল (মানিক দত্ত আদি; মুকুন্দরাম চক্রবর্তী \"কবিকঙ্কণ\" শ্রেষ্ঠ), অন্নদামঙ্গল (ভারতচন্দ্র রায়গুণাকর — মধ্যযুগের শেষ বড় কবি, মৃত্যু ১৭৬০)<\/td><\/tr><tr><td>অনুবাদ সাহিত্য<\/td><td>রামায়ণ — কৃত্তিবাস ওঝা (প্রথম); প্রথম মহিলা কবি চন্দ্রাবতী। মহাভারত — কবীন্দ্র পরমেশ্বর (প্রথম), কাশীরাম দাস (শ্রেষ্ঠ)<\/td><\/tr><tr><td>রোমান্টিক প্রণয়োপাখ্যান<\/td><td>শাহ মুহম্মদ সগীর — \"ইউসুফ-জোলেখা\" (বাংলা সাহিত্যের প্রথম মুসলিম কবি); দৌলত উজির বাহরাম খান — \"লায়লী-মজনু\"<\/td><\/tr><tr><td>আরাকান রাজসভা<\/td><td>দৌলত কাজী — \"সতীময়না ও লোরচন্দ্রানী\"; আলাওল — \"পদ্মাবতী\", \"সয়ফুলমুলুক-বদিউজ্জামাল\", \"তোহফা\"<\/td><\/tr><tr><td>জীবনীসাহিত্য<\/td><td>শ্রীচৈতন্যদেবের জীবনী: \"চৈতন্যভাগবত\" (বৃন্দাবন দাস), \"চৈতন্যচরিতামৃত\" (কৃষ্ণদাস কবিরাজ)<\/td><\/tr><tr><td>মর্সিয়া, পুঁথি, কবিগান<\/td><td>মর্সিয়া (শোককাব্য); দোভাষী পুঁথি — ফকির গরীবুল্লাহ, সৈয়দ হামজা; কবিওয়ালা — ভোলা ময়রা, অ্যান্টনি ফিরিঙ্গি<\/td><\/tr><tr><td>যুগসন্ধিক্ষণের কবি<\/td><td>ঈশ্বরচন্দ্র গুপ্ত (১৮১২–১৮৫৯); \"সংবাদ প্রভাকর\" পত্রিকার সম্পাদক<\/td><\/tr><\/table><\/div><h3 id=\"c10-s5\">9.5 আধুনিক যুগ: গদ্যের শুরু<\/h3><ul><li><b>ফোর্ট উইলিয়াম কলেজ<\/b> (১৮০০; বাংলা বিভাগ ১৮০১) — উইলিয়াম কেরি, রামরাম বসু (\"রাজা প্রতাপাদিত্য চরিত্র\", বাঙালির লেখা প্রথম মুদ্রিত গদ্যগ্রন্থ), মৃত্যুঞ্জয় বিদ্যালঙ্কার।<\/li><li><b>রাজা রামমোহন রায়<\/b> — \"গৌড়ীয় ব্যাকরণ\" (১৮৩৩), \"বেদান্তগ্রন্থ\", \"বেদান্তসার\"; সতীদাহ প্রথা বিলোপের আন্দোলন। <span class=\"tg tg-actual\">ACTUAL: GTCL AM 2021 — রামমোহন রায়ের বাংলা ব্যাকরণ: গৌড়ীয় ব্যাকরণ<\/span><\/li><li><b>ঈশ্বরচন্দ্র বিদ্যাসাগর<\/b> — বাংলা গদ্যের জনক; যতিচিহ্নের প্রচলন; \"বেতাল পঞ্চবিংশতি\", \"শকুন্তলা\", \"সীতার বনবাস\", \"ভ্রান্তিবিলাস\", \"বর্ণপরিচয়\", \"ব্যাকরণ কৌমুদী\"।<\/li><li>প্রথম বাংলা ব্যাকরণ: মনোএল দা আসসুম্পসাঁউ (পর্তুগিজ ভাষায়, ১৭৪৩); ইংরেজিতে প্রথম — হ্যালহেড, \"A Grammar of the Bengal Language\" (১৭৭৮)।<\/li><li>\"কথাসাহিত্য\" বলতে <b>উপন্যাস ও ছোটগল্প<\/b> বোঝায় — <span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span>।<\/li><\/ul><h3 id=\"c10-s6\">9.6 প্রধান লেখক ও তাঁদের রচনা<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>লেখক<\/th><th>উপাধি/পরিচয়<\/th><th>প্রধান রচনা<\/th><\/tr><tr><td>মাইকেল মধুসূদন দত্ত (১৮২৪–১৮৭৩)<\/td><td><b>দত্তকুলোদ্ভব কবি<\/b> <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>; অমিত্রাক্ষর ছন্দ ও সনেটের প্রবর্তক<\/td><td>\"মেঘনাদবধ কাব্য\" (প্রথম সার্থক মহাকাব্য), \"তিলোত্তমাসম্ভব কাব্য\", \"বীরাঙ্গনা\", \"ব্রজাঙ্গনা\", \"চতুর্দশপদী কবিতাবলী\"; নাটক \"শর্মিষ্ঠা\", \"কৃষ্ণকুমারী\" (প্রথম সার্থক ট্র্যাজেডি); প্রহসন \"একেই কি বলে সভ্যতা\", \"বুড়ো শালিকের ঘাড়ে রোঁ\"<\/td><\/tr><tr><td>বঙ্কিমচন্দ্র চট্টোপাধ্যায় (১৮৩৮–১৮৯৪)<\/td><td>সাহিত্যসম্রাট; বাংলা উপন্যাসের জনক<\/td><td>\"দুর্গেশনন্দিনী\" (প্রথম সার্থক উপন্যাস, ১৮৬৫), \"কপালকুণ্ডলা\", \"বিষবৃক্ষ\", \"কৃষ্ণকান্তের উইল\", \"আনন্দমঠ\", \"কমলাকান্তের দপ্তর\"; পত্রিকা \"বঙ্গদর্শন\" (১৮৭২)<\/td><\/tr><tr><td>মীর মশাররফ হোসেন (১৮৪৭–১৯১১)<\/td><td>গাজী মিয়াঁ (ছদ্মনাম)<\/td><td>\"বিষাদ-সিন্ধু\", \"জমীদার দর্পণ\", \"বসন্তকুমারী\", \"রত্নবতী\", \"উদাসীন পথিকের মনের কথা\", <b>\"গাজী মিয়াঁর বস্তানী\"<\/b> <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021 — উত্তর: উপন্যাস (ব্যঙ্গাত্মক/আত্মজৈবনিক)<\/span><\/td><\/tr><tr><td>রবীন্দ্রনাথ ঠাকুর (১৮৬১–১৯৪১)<\/td><td>বিশ্বকবি; নোবেল ১৯১৩ (\"গীতাঞ্জলি\"/Song Offerings); ছদ্মনাম ভানুসিংহ ঠাকুর<\/td><td>কাব্য: \"মানসী\", \"সোনার তরী\", \"চিত্রা\", \"বলাকা\", \"পুনশ্চ\", \"শেষলেখা\"; উপন্যাস: \"চোখের বালি\", \"গোরা\", \"ঘরে বাইরে\", \"শেষের কবিতা\", \"যোগাযোগ\"; নাটক: \"রক্তকরবী\", \"ডাকঘর\", \"অচলায়তন\", \"বিসর্জন\"; গল্প: \"কাবুলিওয়ালা\", \"পোস্টমাস্টার\", \"হৈমন্তী\", \"ছুটি\", \"একরাত্রি\"<\/td><\/tr><tr><td>শরৎচন্দ্র চট্টোপাধ্যায় (১৮৭৬–১৯৩৮)<\/td><td>অপরাজেয় কথাশিল্পী<\/td><td>\"বড়দিদি\", \"দেবদাস\", \"শ্রীকান্ত\", \"গৃহদাহ\", \"পথের দাবী\", \"চরিত্রহীন\", \"পল্লীসমাজ\"; গল্প \"মহেশ\"<\/td><\/tr><tr><td>বেগম রোকেয়া (১৮৮০–১৯৩২)<\/td><td>মুসলিম নারী জাগরণের অগ্রদূত<\/td><td>\"মতিচূর\", \"পদ্মরাগ\", \"অবরোধবাসিনী\", \"Sultana's Dream\"<\/td><\/tr><tr><td>কাজী নজরুল ইসলাম (১৮৯৯–১৯৭৬)<\/td>< ")<\/td><\/tr><tr><td>প্রথম মহিলা ঔপন্যাসিক<\/td><td>স্বর্ণকুমারী দেবী (\"দীপনির্বাণ\")<\/td><\/tr><tr><td>প্রথম বাংলা সাময়িকপত্র<\/td><td>\"দিগদর্শন\" (১৮১৮, শ্রীরামপুর মিশন)<\/td><\/tr><tr><td>প্রথম বাংলা সংবাদপত্র<\/td><td>\"সমাচার দর্পণ\" (১৮১৮)<\/td><\/tr><tr><td>বাঙালি মুসলমান সম্পাদিত প্রথম পত্রিকা<\/td><td>\"সমাচার সভারাজেন্দ্র\" (১৮৩১)<\/td><\/tr><tr><td>বাংলাপিডিয়া (জাতীয় জ্ঞানকোষ) প্রকাশ করে<\/td><td><b>বাংলাদেশ এশিয়াটিক সোসাইটি<\/b> (২০০৩) — <span class=\"tg tg-repeated\">REPEATED: PB 2011, PGCL 2021<\/span><\/td><\/tr><\/table><\/div><h3 id=\"c10-s9\">9.9 পত্রপত্রিকা<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>পত্রিকা<\/th><th>সম্পাদক/প্রতিষ্ঠাতা<\/th><th>সাল<\/th><\/tr><tr><td>সংবাদ প্রভাকর<\/td><td>ঈশ্বরচন্দ্র গুপ্ত<\/td><td>১৮৩১<\/td><\/tr><tr><td>তত্ত্ববোধিনী<\/td><td>অক্ষয়কুমার দত্ত<\/td><td>১৮৪৩<\/td><\/tr><tr><td>বঙ্গদর্শন<\/td><td>বঙ্কিমচন্দ্র চট্টোপাধ্যায়<\/td><td>১৮৭২<\/td><\/tr><tr><td>ভারতী<\/td><td>দ্বিজেন্দ্রনাথ ঠাকুর<\/td><td>১৮৭৭<\/td><\/tr><tr><td>সবুজপত্র (চলিত রীতির প্রচার)<\/td><td>প্রমথ চৌধুরী<\/td><td>১৯১৪<\/td><\/tr><tr><td>সওগাত<\/td><td>মোহাম্মদ নাসিরউদ্দীন<\/td><td>১৯১৮<\/td><\/tr><tr><td>মোসলেম ভারত<\/td><td>মোজাম্মেল হক<\/td><td>১৯২০<\/td><\/tr><tr><td>ধূমকেতু, লাঙল<\/td><td>কাজী নজরুল ইসলাম<\/td><td>১৯২২, ১৯২৫<\/td><\/tr><tr><td>কল্লোল<\/td><td>দীনেশরঞ্জন দাশ<\/td><td>১৯২৩<\/td><\/tr><tr><td>শিখা (\"বুদ্ধির মুক্তি আন্দোলন\", মুসলিম সাহিত্য সমাজ)<\/td><td>আবুল হুসেন<\/td><td>১৯২৭<\/td><\/tr><tr><td>কবিতা<\/td><td>বুদ্ধদেব বসু<\/td><td>১৯৩৫<\/td><\/tr><tr><td>বেগম<\/td><td>নূরজাহান বেগম<\/td><td>১৯৪৭<\/td><\/tr><tr><td>সমকাল<\/td><td>সিকান্দার আবু জাফর<\/td><td>১৯৫৭<\/td><\/tr><\/table><\/div><h3 id=\"c10-s10\">9.10 ভাষা আন্দোলন ও মুক্তিযুদ্ধভিত্তিক সাহিত্য<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>বিষয়<\/th><th>রচনা<\/th><\/tr><tr><td>ভাষা আন্দোলন<\/td><td>প্রথম কবিতা \"কাঁদতে আসিনি, ফাঁসির দাবি নিয়ে এসেছি\" — মাহবুব উল আলম চৌধুরী; গান \"আমার ভাইয়ের রক্তে রাঙানো\" — গীতিকার আবদুল গাফ্‌ফার চৌধুরী, সুরকার আলতাফ মাহমুদ (প্রথম সুর আবদুল লতিফ); নাটক \"কবর\" — মুনীর চৌধুরী; উপন্যাস \"আরেক ফাল্গুন\" — জহির রায়হান, \"আর্তনাদ\" — শওকত ওসমান, \"নিরন্তর ঘণ্টাধ্বনি\" — সেলিনা হোসেন; প্রথম সংকলন \"একুশে ফেব্রুয়ারি\" — হাসান হাফিজুর রহমান সম্পাদিত (১৯৫৩)<\/td><\/tr><tr><td>মুক্তিযুদ্ধ — উপন্যাস<\/td><td>\"রাইফেল রোটি আওরাত\" — আনোয়ার পাশা (প্রথম); \"জাহান্নম হইতে বিদায়\", \"নেকড়ে অরণ্য\", \"দুই সৈনিক\" — শওকত ওসমান; \"হাঙর নদী গ্রেনেড\" — সেলিনা হোসেন; \"খাঁচায়\" — রশীদ হায়দার; \"জোছনা ও জননীর গল্প\", \"আগুনের পরশমণি\" — হুমায়ূন আহমেদ; \"নিষিদ্ধ লোবান\" — সৈয়দ শামসুল হক; \"যাত্রা\" — শওকত আলী; \"মা\" — আনিসুল হক<\/td><\/tr><tr><td>মুক্তিযুদ্ধ — স্মৃতিকথা<\/td><td>\"একাত্তরের দিনগুলি\" — জাহানারা ইমাম; \"একাত্তরের ডায়েরী\" — সুফিয়া কামাল; \"আমি বিজয় দেখেছি\" — এম আর আখতার মুকুল; \"আমি বীরাঙ্গনা বলছি\" — নীলিমা ইব্রাহিম<\/td><\/tr><tr><td>মুক্তিযুদ্ধ — নাটক<\/td><td>\"পায়ের আওয়াজ পাওয়া যায়\" — সৈয়দ শামসুল হক; \"বর্ণচোরা\", \"নরকে লাল গোলাপ\" — মমতাজউদদীন আহমদ<\/td><\/tr><tr><td>মুক্তিযুদ্ধ — চলচ্চিত্র<\/td><td>\"ওরা ১১ জন\" (চাষী নজরুল ইসলাম, প্রথম); \"আগুনের পরশমণি\"; \"মাটির ময়না\" (তারেক মাসুদ); প্রামাণ্যচিত্র \"Stop Genocide\", \"A State Is Born\" (জহির রায়হান), \"মুক্তির গান\" (তারেক ও ক্যাথরিন মাসুদ)<\/td><\/tr><\/table><\/div><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 9<\/div><p class=\"li\">চর্যাপদ: আবিষ্কার হরপ্রসাদ শাস্ত্রী, ১৯০৭, নেপাল; প্রকাশ ১৯১৬; \"আলো-আঁধারি/সন্ধ্যা ভাষা\"।<\/p><p class=\"li\">গৌড়ীয় ব্যাকরণ — রামমোহন রায়। দত্তকুলোদ্ভব কবি — মধুসূদন। গাজী মিয়াঁর বস্তানী — মীর মশাররফ হোসেন।<\/p><p class=\"li\">পুতুলনাচের ইতিকথা — মানিক; কাঁদো নদী কাঁদো — সৈয়দ ওয়ালীউল্লাহ; আরেক ফাল্গুন, A State Is Born — জহির রায়হান; উদ্ভট উটের পিঠে চলেছে স্বদেশ — শামসুর রাহমান; পাঞ্জেরি — ফররুখ আহমদ।<\/p><p class=\"li\">কথাসাহিত্য = উপন্যাস + ছোটগল্প। বাংলাপিডিয়া — এশিয়াটিক সোসাইটি।<\/p><\/div>"},{"id":"c11","no":10,"part":"PART B — BANGLA","title":"Chapter 10: লিখিত বাংলা — পত্র, দাপ্তরিক রচনা ও অনুবাদ","short":"লিখিত বাংলা — পত্র, দাপ্তরিক রচনা ও অনুবাদ","toc":[["c11-s1","10.1 কী আসতে পারে (Historical evidence)"],["c11-s2","10.2 আবেদনপত্রের কাঠামো"],["c11-s3","10.3 নমুনা ১: প্রিপেইড গ্যাস মিটারের আবেদন"],["c11-s4","10.4 নমুনা ২: কারণ দর্শানোর নোটিশ (অফিস থেকে কর্মচারীকে)"],["c11-s5","10.5 নমুনা ৩: বীমা কোম্পানিকে দুর্ঘটনার বিবরণ"],["c11-s6","10.6 অন্যান্য দাপ্তরিক রচনা যা প্রস্তুত রাখবেন"],["c11-s7","10.7 অনুবাদ (ইংরেজি থেকে বাংলা)"]],"html":"<h3 id=\"c11-s1\">10.1 কী আসতে পারে (Historical evidence)<\/h3><p>গ্যাস কোম্পানিগুলোর সাধারণ ক্যাডারের লিখিত অংশে বাংলা থেকে যা এসেছে: (ক) বীমা কোম্পানিকে দুর্ঘটনার বিবরণ জানিয়ে পত্র — KGDCL 2021; (খ) দেরিতে অফিসে আসা অধীনস্থ কর্মচারীকে কারণ দর্শানোর চিঠি — Bakhrabad 2021; (গ) গ্যাসের প্রিপেইড মিটার স্থাপনের অনুরোধ জানিয়ে কর্তৃপক্ষকে পত্র — SGFL 2021। তিনটিই <b>দাপ্তরিক বা আবেদনপত্র<\/b>, এবং তিনটিই একজন প্রশাসনিক কর্মকর্তার দৈনন্দিন কাজের সঙ্গে মেলে। পেট্রোবাংলা ২০২৪-এর লিখিত বাংলা/ইংরেজি অংশের প্রশ্ন জানা যায়নি।<\/p><h3 id=\"c11-s2\">10.2 আবেদনপত্রের কাঠামো<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>ক্রম<\/th><th>অংশ<\/th><th>কী লিখবেন<\/th><\/tr><tr><td>১<\/td><td>তারিখ<\/td><td>উপরে বাম দিকে: তারিখ: ২০ নভেম্বর ২০২৬<\/td><\/tr><tr><td>২<\/td><td>প্রাপক<\/td><td>বরাবর / ব্যবস্থাপনা পরিচালক / প্রতিষ্ঠানের নাম / ঠিকানা<\/td><\/tr><tr><td>৩<\/td><td>বিষয়<\/td><td>এক লাইনে, সুনির্দিষ্ট: \"বিষয়: আবাসিক গ্যাস সংযোগে প্রিপেইড মিটার স্থাপনের আবেদন।\"<\/td><\/tr><tr><td>৪<\/td><td>সম্ভাষণ<\/td><td>জনাব / মহোদয়,<\/td><\/tr><tr><td>৫<\/td><td>মূল বক্তব্য<\/td><td>তিন অনুচ্ছেদ: (১) নিজের পরিচয় ও প্রসঙ্গ; (২) সমস্যা বা ঘটনার বিবরণ — কখন, কোথায়, কীভাবে; (৩) সুনির্দিষ্ট প্রার্থনা<\/td><\/tr><tr><td>৬<\/td><td>সমাপ্তি<\/td><td>\"অতএব, ... প্রয়োজনীয় ব্যবস্থা গ্রহণের জন্য বিনীত অনুরোধ করছি।\"<\/td><\/tr><tr><td>৭<\/td><td>স্বাক্ষর<\/td><td>বিনীত নিবেদক / নাম / ঠিকানা, গ্রাহক সংকেত বা ফোন<\/td><\/tr><tr><td>৮<\/td><td>সংযুক্তি<\/td><td>প্রয়োজনে: ১. জাতীয় পরিচয়পত্রের অনুলিপি ২. সর্বশেষ বিলের অনুলিপি<\/td><\/tr><\/table><\/div><div class=\"bx bx-warn\"><div class=\"bxh\">CAUTION: পরীক্ষার খাতায় নিজের নাম নয়<\/div><p class=\"\">পত্রে নিজের প্রকৃত নাম, রোল বা ঠিকানা লিখবেন না; \"ক\", \"খ\" বা প্রশ্নে দেওয়া নাম ব্যবহার করুন। প্রকৃত পরিচয় লিখলে খাতা বাতিল হতে পারে।<\/p><\/div><h3 id=\"c11-s3\">10.3 নমুনা ১: প্রিপেইড গ্যাস মিটারের আবেদন<\/h3><p><span class=\"tg tg-actual\">ACTUAL: SGFL AM 2021 — \"গ্যাসের প্রিপেইড মিটার স্থাপনের অনুরোধ জানিয়ে সংশ্লিষ্ট কর্তৃপক্ষকে একটি চিঠি লিখুন।\" ১০ নম্বর<\/span><\/p><p>তারিখ: ২০ নভেম্বর ২০২৬<\/p><p>বরাবর<\/p><p>ব্যবস্থাপনা পরিচালক<\/p><p>জালালাবাদ গ্যাস ট্রান্সমিশন অ্যান্ড ডিস্ট্রিবিউশন সিস্টেম লিমিটেড, সিলেট।<\/p><p>বিষয়: আবাসিক গ্যাস সংযোগে প্রিপেইড মিটার স্থাপনের আবেদন।<\/p><p>জনাব,<\/p><p>সবিনয় নিবেদন এই যে, আমি সিলেট নগরীর উপশহর এলাকার একজন আবাসিক গ্যাস গ্রাহক (গ্রাহক সংকেত: ০০০০০০০)। আমার বাসায় দুই চুলার একটি সংযোগ রয়েছে এবং আমি নিয়মিত নির্ধারিত মাসিক বিল পরিশোধ করে আসছি।<\/p><p>বর্তমান ব্যবস্থায় ব্যবহারের পরিমাণ যা-ই হোক, প্রতি মাসে একই অঙ্কের বিল দিতে হয়। আমাদের পরিবারে সদস্য কম এবং বছরের একটি বড় সময় আমরা বাসার বাইরে থাকি; ফলে প্রকৃত ব্যবহারের তুলনায় বেশি বিল দিতে হচ্ছে। প্রিপেইড মিটার স্থাপিত হলে ব্যবহার অনুযায়ী বিল পরিশোধ করা যাবে, গ্যাসের অপচয় কমবে এবং বকেয়া বিলের ঝামেলাও থাকবে না।<\/p><p>অতএব, আমার বাসায় একটি প্রিপেইড গ্যাস মিটার স্থাপনের প্রয়োজনীয় ব্যবস্থা গ্রহণের জন্য বিনীত অনুরোধ জানাচ্ছি। এ জন্য নির্ধারিত ফি ও জামানত পরিশোধে আমি প্রস্তুত আছি।<\/p><p>বিনীত নিবেদক<\/p><p>ক<\/p><p>উপশহর, সিলেট<\/p><p>সংযুক্তি: ১. জাতীয় পরিচয়পত্রের অনুলিপি; ২. সর্বশেষ পরিশোধিত বিলের অনুলিপি।<\/p><h3 id=\"c11-s4\">10.4 নমুনা ২: কারণ দর্শানোর নোটিশ (অফিস থেকে কর্মচারীকে)<\/h3><p><span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021 — \"আপনার এক অধীনস্থ কর্মচারী প্রায়ই দেরি করে অফিসে আসছে। তার বিরুদ্ধে কেন দাপ্তরিক ব্যবস্থা গ্রহণ করা হবে না, তা জানতে চেয়ে কারণ দর্শানোর একটি চিঠি লিখুন।\"<\/span><\/p><p>এটি আবেদনপত্র নয়; এটি <b>দাপ্তরিক পত্র<\/b>। এর কাঠামো আলাদা: প্রতিষ্ঠানের নাম ও ঠিকানা (শিরোনাম) → স্মারক নম্বর ও তারিখ → বিষয় → বক্তব্য → স্বাক্ষর, নাম ও পদবি → প্রাপক → অনুলিপি।<\/p><p>বাখরাবাদ গ্যাস ডিস্ট্রিবিউশন কোম্পানি লিমিটেড<\/p><p>প্রশাসন বিভাগ, প্রধান কার্যালয়, কুমিল্লা<\/p><p>স্মারক নং: বিজিডিসিএল/প্রশা/ব্যক্তি/২০২৬/০০০                                তারিখ: ২০ নভেম্বর ২০২৬<\/p><p>বিষয়: বিলম্বে অফিসে উপস্থিতির জন্য কারণ দর্শানো প্রসঙ্গে।<\/p><p>উপর্যুক্ত বিষয়ে জানানো যাচ্ছে যে, হাজিরা বহি পর্যালোচনায় দেখা যায়, আপনি চলতি নভেম্বর মাসের ৩, ৫, ৯, ১১ ও ১৭ তারিখে নির্ধারিত সময়ের পরে অফিসে উপস্থিত হয়েছেন। ইতঃপূর্বে আপনাকে এ বিষয়ে মৌখিকভাবে সতর্ক করা হলেও কোনো উন্নতি পরিলক্ষিত হয়নি। আপনার এ আচরণ কোম্পানির চাকরি প্রবিধানমালা অনুযায়ী অসদাচরণের শামিল এবং অফিসের শৃঙ্খলার পরিপন্থী।<\/p><p>এমতাবস্থায়, কেন আপনার বিরুদ্ধে বিধি মোতাবেক বিভাগীয় ব্যবস্থা গ্রহণ করা হবে না, তা এ পত্র প্রাপ্তির ৭ (সাত) কার্যদিবসের মধ্যে নিম্নস্বাক্ষরকারীর নিকট লিখিতভাবে জানানোর জন্য নির্দেশ দেওয়া হলো। নির্ধারিত সময়ের মধ্যে সন্তোষজনক জবাব পাওয়া না গেলে একতরফাভাবে পরবর্তী ব্যবস্থা গ্রহণ করা হবে।<\/p><p>(স্বাক্ষর)<\/p><p>খ<\/p><p>সহকারী ব্যবস্থাপক (প্রশাসন)<\/p><p>প্রাপক: জনাব গ, অফিস সহায়ক, প্রশাসন বিভাগ।<\/p><p>অনুলিপি (সদয় অবগতির জন্য): ১. মহাব্যবস্থাপক (প্রশাসন); ২. সংশ্লিষ্ট কর্মচারীর ব্যক্তিগত নথি।<\/p><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: কারণ দর্শানোর নোটিশের পাঁচ উপাদান<\/div><p class=\"\">(১) কোন দিন কোন অনিয়ম — সুনির্দিষ্ট তথ্য; (২) আগে সতর্ক করা হয়েছিল কি না; (৩) কোন বিধির লঙ্ঘন; (৪) জবাবের সময়সীমা (সাধারণত ৭ বা ১০ কার্যদিবস); (৫) জবাব না দিলে কী হবে। ভাষা হবে নৈর্ব্যক্তিক — \"নির্দেশ দেওয়া হলো\", \"জানানো যাচ্ছে\"।<\/p><\/div><h3 id=\"c11-s5\">10.5 নমুনা ৩: বীমা কোম্পানিকে দুর্ঘটনার বিবরণ<\/h3><p><span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021 — \"গাড়ি চালানোর সময় আপনার একটি ছোট দুর্ঘটনা ঘটেছে। কখন, কোথায়, কীভাবে ঘটেছে এবং দুর্ঘটনার পর আপনি কী করেছেন সে সম্পর্কে গাড়ির বীমা কোম্পানিকে একটি চিঠি লিখুন।\" ৫ নম্বর<\/span><\/p><p>প্রশ্নই বলে দিয়েছে কী কী লিখতে হবে; চারটি প্রশ্নের উত্তর চারটি বাক্যে বা দুটি অনুচ্ছেদে দিন: <b>কখন<\/b> (তারিখ ও সময়), <b>কোথায়<\/b> (সড়ক, এলাকা), <b>কীভাবে<\/b> (ঘটনার বিবরণ, কার দোষ), <b>পরে কী করেছেন<\/b> (থানায় সাধারণ ডায়েরি, ওয়ার্কশপে নেওয়া, ছবি তোলা)। সঙ্গে পলিসি নম্বর, গাড়ির নিবন্ধন নম্বর এবং শেষে দাবি নিষ্পত্তির অনুরোধ। কাঠামো ১০.২-এর আবেদনপত্রের মতো; প্রাপক \"ব্যবস্থাপনা পরিচালক/শাখা ব্যবস্থাপক, ... ইন্স্যুরেন্স কোম্পানি লিমিটেড\"; বিষয় \"মোটরগাড়ি দুর্ঘটনাজনিত বীমা দাবি প্রসঙ্গে\"।<\/p><h3 id=\"c11-s6\">10.6 অন্যান্য দাপ্তরিক রচনা যা প্রস্তুত রাখবেন<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>রচনা<\/th><th>কাঠামোর মূল কথা<\/th><\/tr><tr><td>অফিস আদেশ<\/td><td>শিরোনাম \"অফিস আদেশ\"; নম্বর ও তারিখ; আদেশের বিষয়বস্তু; কার্যকর হওয়ার তারিখ; স্বাক্ষর; বিতরণ<\/td><\/tr><tr><td>বিজ্ঞপ্তি/নোটিশ<\/td><td>শিরোনাম \"বিজ্ঞপ্তি\"; এতদ্বারা সংশ্লিষ্ট সকলের অবগতির জন্য জানানো যাচ্ছে যে ...; তারিখ, সময়, স্থান; স্বাক্ষর<\/td><\/tr><tr><td>সভার কার্যবিবরণী<\/td><td>সভার নাম, তারিখ, সময়, স্থান, সভাপতি; উপস্থিতি (পরিশিষ্ট); আলোচ্যসূচি অনুযায়ী আলোচনা ও সিদ্ধান্ত; বাস্তবায়নকারী; সভাপতির স্বাক্ষর<\/td><\/tr><tr><td>প্রতিবেদন<\/td><td>শিরোনাম; প্রেরক-প্রাপক; প্রেক্ষাপট; অনুসন্ধান পদ্ধতি; প্রাপ্ত তথ্য; সুপারিশ; স্বাক্ষর ও তারিখ<\/td><\/tr><tr><td>নোট (টোকা)<\/td><td>নথিতে উপস্থাপিত সংক্ষিপ্ত বক্তব্য: প্রসঙ্গ → বিধিগত অবস্থান → প্রস্তাব; অনুচ্ছেদ নম্বরযুক্ত<\/td><\/tr><tr><td>ভাবসম্প্রসারণ/অনুচ্ছেদ<\/td><td>জ্বালানি নিরাপত্তা, গ্যাসের অপচয় রোধ, সুশাসন, তথ্য অধিকার, দুর্নীতি প্রতিরোধ — এসব বিষয়ে ১০–১২ বাক্য প্রস্তুত রাখুন<\/td><\/tr><\/table><\/div><p>বিস্তারিত নিয়ম অধ্যায় ৩৬-এ (অফিস ব্যবস্থাপনা)।<\/p><h3 id=\"c11-s7\">10.7 অনুবাদ (ইংরেজি থেকে বাংলা)<\/h3><p>PGCL (প্রশাসন) ২০২১-এ বিদ্যুৎ ও নবায়নযোগ্য জ্বালানি বিষয়ে একটি অনুচ্ছেদ দেওয়া হয়েছিল (৫ নম্বর)। অনুবাদের নিয়ম: শব্দে শব্দে নয়, বাক্যের ভাব অনুবাদ করুন; দীর্ঘ ইংরেজি বাক্য ভেঙে দুটি বাংলা বাক্য করুন; পরিভাষা ঠিক রাখুন।<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>English<\/th><th>বাংলা<\/th><\/tr><tr><td>Renewable energy<\/td><td>নবায়নযোগ্য জ্বালানি<\/td><\/tr><tr><td>Fossil fuel<\/td><td>জীবাশ্ম জ্বালানি<\/td><\/tr><tr><td>Energy security<\/td><td>জ্বালানি নিরাপত্তা<\/td><\/tr><tr><td>Power generation capacity<\/td><td>বিদ্যুৎ উৎপাদন ক্ষমতা<\/td><\/tr><tr><td>Transmission and distribution<\/td><td>সঞ্চালন ও বিতরণ<\/td><\/tr><tr><td>System loss<\/td><td>সিস্টেম লস (পদ্ধতিগত অপচয়)<\/td><\/tr><tr><td>Exploration and production<\/td><td>অনুসন্ধান ও উৎপাদন<\/td><\/tr><tr><td>Sustainable development<\/td><td>টেকসই উন্নয়ন<\/td><\/tr><tr><td>Greenhouse gas emission<\/td><td>গ্রিনহাউস গ্যাস নিঃসরণ<\/td><\/tr><tr><td>Subsidy<\/td><td>ভর্তুকি<\/td><\/tr><tr><td>Demand and supply gap<\/td><td>চাহিদা ও সরবরাহের ব্যবধান<\/td><\/tr><tr><td>Stakeholder<\/td><td>অংশীজন<\/td><\/tr><\/table><\/div><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> অনুবাদ করুন: \"Bangladesh has long depended on natural gas as its main source of commercial energy. As domestic reserves decline, the country has to import expensive liquefied natural gas. To ensure energy security, exploration must be strengthened and gas must be used efficiently.\"<\/p><p class=\"pa\">নমুনা উত্তর: বাংলাদেশ দীর্ঘদিন ধরে বাণিজ্যিক জ্বালানির প্রধান উৎস হিসেবে প্রাকৃতিক গ্যাসের ওপর নির্ভরশীল। দেশীয় মজুত কমে আসায় দেশকে ব্যয়বহুল তরলীকৃত প্রাকৃতিক গ্যাস আমদানি করতে হচ্ছে। জ্বালানি নিরাপত্তা নিশ্চিত করতে হলে অনুসন্ধান কার্যক্রম জোরদার করতে হবে এবং গ্যাসের দক্ষ ব্যবহার নিশ্চিত করতে হবে।<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 10<\/div><p class=\"li\">লিখিত বাংলায় এসেছে: আবেদনপত্র (প্রিপেইড মিটার), দাপ্তরিক পত্র (কারণ দর্শানো), অভিযোগ/বিবরণমূলক পত্র (বীমা)।<\/p><p class=\"li\">আবেদনপত্র: তারিখ → বরাবর → বিষয় → জনাব → তিন অনুচ্ছেদ → বিনীত নিবেদক → সংযুক্তি।<\/p><p class=\"li\">দাপ্তরিক পত্র: প্রতিষ্ঠানের শিরোনাম → স্মারক নং ও তারিখ → বিষয় → বক্তব্য → স্বাক্ষর ও পদবি → প্রাপক → অনুলিপি।<\/p><p class=\"li\">খাতায় নিজের প্রকৃত নাম-পরিচয় লিখবেন না।<\/p><\/div>"},{"id":"c12","no":11,"part":"PART C — ENGLISH","title":"Chapter 11: Parts of Speech and Subject–Verb Agreement","short":"Parts of Speech and Subject–Verb Agreement","toc":[["c12-s1","11.1 Why start here"],["c12-s2","11.2 The eight parts of speech in one table"],["c12-s3","11.3 Nouns: number and countability"],["c12-s4","11.4 Pronouns: case, reference and who/whom"],["c12-s5","11.5 Subject–verb agreement — the rules that are tested"],["c12-s6","11.6 Adjectives and adverbs: comparison"],["c12-s7","11.7 Conjunctions that come in pairs"]],"html":"<h3 id=\"c12-s1\">11.1 Why start here<\/h3><p>Every sentence-correction question in the IBA papers is solved by asking two things: <i>what is each word doing?<\/i> and <i>does the verb match its subject?<\/i> This chapter gives you those two tools. It is short on theory and long on the traps that were actually set.<\/p><h3 id=\"c12-s2\">11.2 The eight parts of speech in one table<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Part of speech<\/th><th>Job in the sentence<\/th><th>Test<\/th><\/tr><tr><td>Noun<\/td><td>Names a person, place, thing or idea<\/td><td>Can take <i>the<\/i>, a plural, or 's: beauty, the <b>beautification<\/b> of the city<\/td><\/tr><tr><td>Pronoun<\/td><td>Stands for a noun<\/td><td>I/me, who/whom, each, that<\/td><\/tr><tr><td>Adjective<\/td><td>Describes a noun<\/td><td>Fits in \"a ___ thing\": <b>beautiful<\/b>, honorary, hearty<\/td><\/tr><tr><td>Verb<\/td><td>Shows action or state<\/td><td>Changes with time: beautify → beautified<\/td><\/tr><tr><td>Adverb<\/td><td>Describes a verb, adjective or another adverb<\/td><td>Answers how/when/where: <b>heartily<\/b>, beautifully, very<\/td><\/tr><tr><td>Preposition<\/td><td>Links a noun to the rest<\/td><td>at, on, of, with, despite<\/td><\/tr><tr><td>Conjunction<\/td><td>Joins words or clauses<\/td><td>and, but, because, although, neither…nor<\/td><\/tr><tr><td>Interjection<\/td><td>Expresses feeling<\/td><td>Alas! Hurrah!<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span> The adverb form of the word \"heart\" is — (a) heartened (b) <b>heartily<\/b> (c) hearty (d) heartening. <i>Hearty<\/i> is the adjective; adding <i>-ly<\/i> (hearty → heartily) gives the adverb. বাংলায়: adjective + ly = adverb; y থাকলে i হয়ে যায়।<\/p><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span> Which one is the adjective? — Beauty (noun), <b>Beautiful<\/b> (adjective), Beautification (noun), Beautifying (participle/gerund).<\/p><h4>Word-family table: learn the endings<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Noun<\/th><th>Verb<\/th><th>Adjective<\/th><th>Adverb<\/th><\/tr><tr><td>beauty<\/td><td>beautify<\/td><td>beautiful<\/td><td>beautifully<\/td><\/tr><tr><td>heart<\/td><td>hearten<\/td><td>hearty<\/td><td>heartily<\/td><\/tr><tr><td>strength<\/td><td>strengthen<\/td><td>strong<\/td><td>strongly<\/td><\/tr><tr><td>success<\/td><td>succeed<\/td><td>successful<\/td><td>successfully<\/td><\/tr><tr><td>decision<\/td><td>decide<\/td><td>decisive<\/td><td>decisively<\/td><\/tr><tr><td>economy<\/td><td>economise<\/td><td>economic / economical<\/td><td>economically<\/td><\/tr><tr><td>competition<\/td><td>compete<\/td><td>competitive<\/td><td>competitively<\/td><\/tr><tr><td>obedience<\/td><td>obey<\/td><td>obedient<\/td><td>obediently<\/td><\/tr><tr><td>pride<\/td><td>pride (oneself)<\/td><td>proud<\/td><td>proudly<\/td><\/tr><tr><td>ability<\/td><td>enable<\/td><td>able<\/td><td>ably<\/td><\/tr><tr><td>danger<\/td><td>endanger<\/td><td>dangerous<\/td><td>dangerously<\/td><\/tr><tr><td>width<\/td><td>widen<\/td><td>wide<\/td><td>widely<\/td><\/tr><\/table><\/div><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: Typical endings<\/div><p class=\"\">Nouns: -tion, -ment, -ness, -ity, -ance/-ence, -ship, -hood. Verbs: -ify, -ise/-ize, -en, -ate. Adjectives: -ful, -less, -ous, -ive, -able, -al, -ic. Adverbs: -ly (but <i>friendly, lovely, costly, timely<\/i> are adjectives, and <i>fast, hard, late<\/i> are adverbs without -ly).<\/p><\/div><h3 id=\"c12-s3\">11.3 Nouns: number and countability<\/h3><ul><li><b>Uncountable nouns take no plural and a singular verb:<\/b> information, advice, furniture, luggage, baggage, news, scenery, poetry, machinery, equipment, stationery, bread, traffic. <i>The furniture is new. He gave me two pieces of advice.<\/i><\/li><li><b>Plural in form, singular in use:<\/b> mathematics, physics, economics, politics, news, measles, mumps, the United States, <i>Gulliver's Travels<\/i>. <i>Economics is his favourite subject.<\/i><\/li><li><b>Always plural:<\/b> scissors, trousers, spectacles, thanks, premises, wages, alms, cattle, people, police, gentry, poultry. <i>The police have arrested him. The cattle are grazing.<\/i><\/li><li><b>Same form in singular and plural:<\/b> sheep, deer, fish, aircraft, species, series, means.<\/li><li><b>Irregular plurals often tested:<\/b> criterion → criteria; phenomenon → phenomena; datum → data; medium → media; crisis → crises; thesis → theses; analysis → analyses; index → indices; radius → radii; alumnus → alumni; syllabus → syllabi; brother-in-law → brothers-in-law; passer-by → passers-by; commander-in-chief → commanders-in-chief.<\/li><li><b>fewer / less.<\/b> <i>Fewer<\/i> with countable nouns, <i>less<\/i> with uncountable ones. <span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span> \"There were ___ people in the mosque than I expected.\" — <b>fewer<\/b>.<\/li><\/ul><h3 id=\"c12-s4\">11.4 Pronouns: case, reference and who/whom<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Subject<\/th><th>Object<\/th><th>Possessive<\/th><th>Reflexive<\/th><\/tr><tr><td>I<\/td><td>me<\/td><td>my / mine<\/td><td>myself<\/td><\/tr><tr><td>we<\/td><td>us<\/td><td>our / ours<\/td><td>ourselves<\/td><\/tr><tr><td>he<\/td><td>him<\/td><td>his<\/td><td>himself<\/td><\/tr><tr><td>she<\/td><td>her<\/td><td>her / hers<\/td><td>herself<\/td><\/tr><tr><td>they<\/td><td>them<\/td><td>their / theirs<\/td><td>themselves<\/td><\/tr><tr><td>who<\/td><td>whom<\/td><td>whose<\/td><td>—<\/td><\/tr><\/table><\/div><ul><li>A pronoun that is the <b>subject<\/b> of a verb takes the subject form, however far away the verb is. <span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021<\/span> \"My friend and <b>me<\/b> study together during holidays.\" → <b>I<\/b>. Test: remove \"my friend and\" — you would never say \"me study\".<\/li><li>After a preposition use the object form: *between you and <b>me<b><i>; *for him and <\/b>her<\/i><\/b>.<\/li><li><b>who / whom.<\/b> Use <i>who<\/i> if you could answer with <i>he<\/i>, <i>whom<\/i> if with <i>him<\/i>. Ignore inserted phrases such as \"he thought\" or \"I believe\". <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span> \"He interviewed several candidates, ___ had the experience and qualifications the position required.\" Options: whom he thought / of whom he thought / which he thought / <b>who he thought<\/b>. Remove \"he thought\": \"<i>who<\/i> had the experience\" — <i>who<\/i> is the subject of <i>had<\/i>. Answer: <b>who he thought<\/b>.<\/li><li><b>whose<\/b> shows possession in a relative clause: <span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021<\/span> \"Rashed, two of ___ brothers attend primary school, wishes to be a teacher.\" — <b>whose<\/b>.<\/li><li><b>former / latter<\/b> refer to the first and second of <b>two<\/b> things only. <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2024<\/span> \"The restaurant had burgers, sandwiches, and pizzas; we ordered <b>the former<\/b>.\" Three items are listed, so \"the former\" is the error (use \"the first\").<\/li><li>A pronoun must agree with its antecedent: <i>Each of the boys has brought <b>his<\/b> book. Everyone must do <b>his or her<\/b> duty.<\/i><\/li><li><i>One<\/i> is followed by <i>one's<\/i>: <i>One should do one's duty.<\/i><\/li><\/ul><h3 id=\"c12-s5\">11.5 Subject–verb agreement — the rules that are tested<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Rule<\/th><th>Example<\/th><\/tr><tr><td>Ignore words between subject and verb (of-phrases, <i>along with, as well as, together with, in addition to, accompanied by<\/i>).<\/td><td>The quality of the mangoes <b>is<\/b> good. The captain, along with his players, <b>was<\/b> present.<\/td><\/tr><tr><td>Fractions and percentages take their number from the noun after <i>of<\/i>.<\/td><td>Three-fourths of the work <b>has been<\/b> finished. Three-fourths of the students <b>have<\/b> passed.<\/td><\/tr><tr><td><i>Each, every, either, neither, everyone, anybody, nobody, one of<\/i> → singular.<\/td><td>Each of the girls <b>has<\/b> a pen. One of the students <b>was<\/b> absent. Neither of them <b>is<\/b> guilty.<\/td><\/tr><tr><td><i>either…or, neither…nor, not only…but also<\/i>: verb agrees with the <b>nearer<\/b> subject.<\/td><td>Neither he nor his friends <b>were<\/b> present. Either they or he <b>is<\/b> responsible.<\/td><\/tr><tr><td><i>A number of<\/i> → plural; <i>the number of<\/i> → singular.<\/td><td>A number of students <b>are<\/b> absent. The number of students <b>is<\/b> fifty.<\/td><\/tr><tr><td>Amounts of money, time, distance as one unit → singular.<\/td><td>Fifty thousand taka <b>is<\/b> a large sum. Ten miles <b>is<\/b> a long walk.<\/td><\/tr><tr><td>Collective nouns → singular when acting as one body.<\/td><td>The committee <b>has<\/b> submitted its report. The jury <b>was<\/b> unanimous.<\/td><\/tr><tr><td>Two subjects joined by <i>and<\/i> → plural, unless they are one idea or one person.<\/td><td>Rice and curry <b>is<\/b> my favourite dish. The headmaster and secretary <b>is<\/b> coming (one person). Slow and steady <b>wins<\/b> the race.<\/td><\/tr><tr><td><i>There is/are<\/i>: verb agrees with what follows.<\/td><td>There <b>are<\/b> two reasons. There <b>is<\/b> a book and two pens on the table.<\/td><\/tr><tr><td>The relative pronoun takes the number of its antecedent.<\/td><td>He is one of the students who <b>have<\/b> passed. It is I who <b>am<\/b> to blame.<\/td><\/tr><tr><td><i>None<\/i> may take either; with a plural <i>of<\/i>-phrase formal English prefers the singular, but the plural is accepted.<\/td><td>None of us <b>has<\/b>/have enough money.<\/td><\/tr><tr><td><i>Many a<\/i> → singular.<\/td><td>Many a man <b>has<\/b> tried.<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span> \"Three-fourths of the work ___ finished.\" — <b>has been<\/b>. <i>Work<\/i> is uncountable, so the fraction is singular.<\/p><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span> \"Your progress report <b>show<\/b> you have more things to learn.\" — the error is <i>show<\/i> (subject <i>report<\/i> is singular → <i>shows<\/i>).<\/p><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2024<\/span> \"Despite the company's rapid growth…, its profits have remained relatively stagnant, largely because of an inability to control costs, which ___ rising steadily over the past three years.\" — <b>have been<\/b>. <i>Which<\/i> refers to <i>costs<\/i> (plural), and \"over the past three years\" calls for the present perfect continuous.<\/p><div class=\"bx bx-warn\"><div class=\"bxh\">CAUTION: A disputed 2024 question<\/div><p class=\"\">\"None of us <b>have<\/b> (A) enough money <b>to undertake<\/b> (B) the project alone, so we <b>had<\/b> (C) to depend <b>on<\/b> (D) our parents. No error (E).\" Question-bank sites mark (A). The stronger objection is the tense clash between <i>have<\/i> and <i>had<\/i>; whichever you fix, the faulty area is \"have/had\". If you meet this type, look first for a tense that does not match the rest of the sentence, and treat \"none…have\" as acceptable modern usage.<\/p><\/div><h3 id=\"c12-s6\">11.6 Adjectives and adverbs: comparison<\/h3><ul><li>Comparative with <i>than<\/i>; superlative with <i>the<\/i> and <i>of/in<\/i>: <i>worse than<\/i>, <i>the worst of all<\/i>. <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span> \"The performance … was rather <b>worst than I had expected<\/b>.\" → <b>worse than what I had expected<\/b>. <span class=\"tg tg-actual\">ACTUAL: GTCL AM 2021<\/span> \"Arguably one of the <b>worse<\/b> crises in living memory\" → <b>one of the worst crises<\/b> (<i>one of the<\/i> + superlative + plural noun).<\/li><li>No double comparatives or superlatives: not <i>more better<\/i>, <i>most unkindest<\/i>.<\/li><li>Latin comparatives take <i>to<\/i>, not <i>than<\/i>: senior, junior, superior, inferior, prior, anterior, posterior, prefer. <i>He is senior <b>to<\/b> me. I prefer tea <b>to<\/b> coffee.<\/i><\/li><li>Compare like with like: <i>The population of Dhaka is greater than <b>that of<\/b> Chattogram.<\/i> <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span> \"Mammals and birds have much larger brains than ___.\" — <b>other vertebrates do<\/b>.<\/li><li>Absolute adjectives do not compare: perfect, unique, universal, round, dead, supreme, ideal.<\/li><li><i>further<\/i> = additional/more distant in degree; <i>farther<\/i> = more distant in space. <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span> Correct sentence: <b>\"It is far from here.\"<\/b><\/li><li><i>beside<\/i> = next to; <i>besides<\/i> = in addition to. <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span> Correct sentence: <b>\"Besides being clever, she is very perceptive.\"<\/b> (The printed key in one solution book gives \"Beside…\", which is wrong.)<\/li><li><i>hardly, scarcely, barely<\/i> are already negative — never add <i>not<\/i>. <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span> \"The pharmacist <b>hadn't hardly any of those kind<\/b> of medicines.\" → <b>had hardly any of those kinds<\/b>. Two faults are corrected at once: the double negative, and <i>those kind<\/i> → <i>those kinds<\/i>.<\/li><\/ul><h3 id=\"c12-s7\">11.7 Conjunctions that come in pairs<\/h3><p><i>either…or, neither…nor, not only…but also, both…and, whether…or, no sooner…than, hardly/scarcely…when, as…as, so…that, such…that, rather…than, the more…the more.<\/i> The two halves must be followed by the same kind of word (see parallelism, Chapter 16).<\/p><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span> Correct sentence: <b>\"It is neither true nor valid.\"<\/b><\/p><p><span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span> \"___ all his attempts to pass the driving test, Zakir failed.\" — <b>Despite<\/b> (a preposition, followed by a noun phrase; <i>although<\/i> would need a clause).<\/p><p><span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span> \"He is ___ weak to go to office.\" — <b>too<\/b> (<i>too<\/i> + adjective + <i>to<\/i> + verb = so … that … cannot).<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 11<\/div><p class=\"li\">Adjective + ly = adverb (hearty → heartily); beauty (n.), beautify (v.), beautiful (adj.).<\/p><p class=\"li\">Fraction/percentage + of + noun: the noun decides (three-fourths of the work <b>has<\/b>).<\/p><p class=\"li\">who = he; whom = him. Ignore \"he thought/I believe\".<\/p><p class=\"li\">fewer + countable; less + uncountable. former/latter only for two.<\/p><p class=\"li\">worse than; one of the worst + plural noun; senior <b>to<\/b>; hardly any (no <i>not<\/i>).<\/p><p class=\"li\">besides = in addition to; beside = next to.<\/p><\/div>"},{"id":"c13","no":12,"part":"PART C — ENGLISH","title":"Chapter 12: Tense and Verb Forms","short":"Tense and Verb Forms","toc":[["c13-s1","12.1 The twelve tenses with their signal words"],["c13-s2","12.2 The questions that were set, and why the answers are right"],["c13-s3","12.3 Conditional sentences"],["c13-s4","12.4 Verb forms after particular words"],["c13-s5","12.5 Irregular verbs that cause mistakes"]],"html":"<h3 id=\"c13-s1\">12.1 The twelve tenses with their signal words<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Tense<\/th><th>Form<\/th><th>Signal words (এগুলো দেখলেই tense বুঝবেন)<\/th><\/tr><tr><td>Present simple<\/td><td>V1 / V1+s<\/td><td>always, usually, every day, often; universal truths<\/td><\/tr><tr><td>Present continuous<\/td><td>am/is/are + V-ing<\/td><td>now, at present, at this moment, <b>nowadays<\/b>, Look!, Listen!<\/td><\/tr><tr><td>Present perfect<\/td><td>have/has + V3<\/td><td>just, already, yet, ever, never, recently, lately, <b>since<\/b>, <b>for<\/b>, so far, <b>over the past few years<\/b><\/td><\/tr><tr><td>Present perfect continuous<\/td><td>have/has been + V-ing<\/td><td>since + point of time, for + period (action still going on)<\/td><\/tr><tr><td>Past simple<\/td><td>V2<\/td><td>yesterday, ago, last week, in 1971, once, <b>when + past event<\/b><\/td><\/tr><tr><td>Past continuous<\/td><td>was/were + V-ing<\/td><td>while, when (a longer action interrupted by a shorter one)<\/td><\/tr><tr><td>Past perfect<\/td><td>had + V3<\/td><td>before, after, by the time, <b>no sooner…than<\/b>, hardly…when<\/td><\/tr><tr><td>Past perfect continuous<\/td><td>had been + V-ing<\/td><td>for/since with a past reference point<\/td><\/tr><tr><td>Future simple<\/td><td>will/shall + V1<\/td><td>tomorrow, next year, soon<\/td><\/tr><tr><td>Future continuous<\/td><td>will be + V-ing<\/td><td>at this time tomorrow<\/td><\/tr><tr><td>Future perfect<\/td><td>will have + V3<\/td><td>by tomorrow, by 2030, by the time + present<\/td><\/tr><tr><td>Future perfect continuous<\/td><td>will have been + V-ing<\/td><td>by next year … for five years<\/td><\/tr><\/table><\/div><h3 id=\"c13-s2\">12.2 The questions that were set, and why the answers are right<\/h3><p class=\"pq\">1. Identify the correct use of \"since\". <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span><\/p><p class=\"po\">(a) It has been raining since last five days. (b) It works since morning. (c) I saw him last night since. (d) He has been staying with us since Monday last.<\/p><p class=\"pa\">Answer (d). <i>Since<\/i> needs a <b>point<\/b> of time (Monday last) and a perfect tense. (a) needs <i>for<\/i> because \"five days\" is a period.<\/p><p class=\"pq\">2. The use of preservatives in food manufacturing ___ steadily over the past few decades and ___ no signs of abating. <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span><\/p><p class=\"po\">(a) had risen, would show (b) would rise, will show (c) has risen, shows (d) rose, will show (e) None<\/p><p class=\"pa\">Answer (c). \"Over the past few decades\" up to now → present perfect; the present result → present simple.<\/p><p class=\"pq\">3. When the Principal entered the class, a student ___ on the blackboard. <span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021<\/span><\/p><p class=\"pa\"><b>was writing.<\/b> A shorter past action (entered) interrupts a longer one in progress (was writing).<\/p><p class=\"pq\">4. I have just hired a typewriter and I ___ to type nowadays. <span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021<\/span><\/p><p class=\"pa\"><b>am learning.<\/b> <i>Nowadays<\/i> marks a temporary present activity.<\/p><p class=\"pq\">5. How many glasses of milk ___ yesterday? / Columbus ___ America. / She still remembers the day when she first ___ to Ramna Park. <span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021<\/span><\/p><p class=\"pa\"><b>did you drink / discovered / went.<\/b> A finished action at a stated or understood past time takes the past simple.<\/p><p class=\"pq\">6. \"No sooner <b>do the bells ring<\/b> than the curtain rose.\" <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span><\/p><p class=\"pa\">→ <b>had the bell rung<\/b>. <i>No sooner<\/i> + had + subject + V3 … <i>than<\/i> + past simple. Note also <i>ring–rang–rung<\/i>: \"had rang\" is wrong.<\/p><p class=\"pq\">7. \"It was serendipity rather than genius that <b>leads<\/b> the archaeologist to his breathtaking discovery of the ancient civilization.\" <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2024<\/span><\/p><p class=\"pa\">The error is <i>leads<\/i>; the sentence is in the past (<i>It was…<\/i>), so <b>led<\/b>.<\/p><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: Sequence of tenses — the single most useful rule<\/div><p class=\"\">If the main clause is in the past, the dependent clause is normally in a past tense as well. Exceptions: universal truths (<i>He said that the earth moves round the sun<\/i>) and comparisons with <i>than/as<\/i>. When you spot-check a sentence, underline every verb and see whether one of them is in a different time from the rest.<\/p><\/div><h3 id=\"c13-s3\">12.3 Conditional sentences<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Type<\/th><th>Form<\/th><th>Example<\/th><\/tr><tr><td>Zero (general truth)<\/td><td>If + present, present<\/td><td>If you heat ice, it melts.<\/td><\/tr><tr><td>First (real possibility)<\/td><td>If + present, will + V1<\/td><td>If it rains, I <b>will<\/b> stay at home.<\/td><\/tr><tr><td>Second (unreal present)<\/td><td>If + past, would + V1<\/td><td>If I <b>were<\/b> a bird, I <b>would<\/b> fly. (always <i>were<\/i>)<\/td><\/tr><tr><td>Third (unreal past)<\/td><td>If + had V3, would have + V3<\/td><td>If he <b>had worked<\/b> hard, he <b>would have passed<\/b>.<\/td><\/tr><tr><td>Inverted<\/td><td>Had/Were/Should + subject<\/td><td><b>Had I known<\/b>, I would have helped. <b>Were I<\/b> you, I would refuse.<\/td><\/tr><\/table><\/div><p>Related forms: <i>I wish I <b>were<\/b> rich. It is high time we <b>left<\/b>. He talks as if he <b>knew<\/b> everything. I would rather you <b>went<\/b> now.<\/i><\/p><h3 id=\"c13-s4\">12.4 Verb forms after particular words<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>After this…<\/th><th>…use this<\/th><\/tr><tr><td>Prepositions; <i>mind, enjoy, avoid, finish, suggest, consider, deny, admit, practise, risk, keep, miss, postpone, delay<\/i>; <i>look forward to, be used to, with a view to, object to, cannot help, it is no use, worth<\/i><\/td><td><b>V-ing (gerund)<\/b>: Would you mind <b>closing<\/b> the door? <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span> Would you mind <b>having<\/b> a cup of tea with me? <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span> I look forward to <b>hearing<\/b> from you.<\/td><\/tr><tr><td><i>want, wish, hope, decide, agree, promise, refuse, plan, expect, manage, afford, fail, tend, pretend<\/i><\/td><td><b>to + V1<\/b>: He refused <b>to go<\/b>.<\/td><\/tr><tr><td>Modals; <i>let, make, had better, would rather, need not, do nothing but<\/i><\/td><td><b>V1 (bare infinitive)<\/b>: You had better <b>go<\/b>. He made me <b>laugh<\/b>.<\/td><\/tr><tr><td>Causative <i>have/make/let<\/i> + person<\/td><td><b>V1<\/b>: Mrs Jamila had her students <b>complete<\/b> their essays. <span class=\"tg tg-actual\">ACTUAL: Bakhrabad 2021<\/span><\/td><\/tr><tr><td>Causative <i>get<\/i> + person<\/td><td><b>to + V1<\/b>: I got him <b>to repair<\/b> it.<\/td><\/tr><tr><td>Causative <i>have/get<\/i> + thing<\/td><td><b>V3<\/b>: I had my car <b>repaired<\/b>. I got my hair <b>cut<\/b>.<\/td><\/tr><tr><td>Verbs of the senses (<i>see, hear, watch, notice<\/i>) + object<\/td><td><b>V1<\/b> (whole action) or <b>V-ing<\/b> (in progress): I saw him <b>cross / crossing<\/b> the road.<\/td><\/tr><tr><td><i>demand, suggest, recommend, insist, mandate, propose<\/i> + that; <i>it is essential/necessary that<\/i><\/td><td><b>V1 for every subject (subjunctive)<\/b>: The guidelines mandate that students <b>submit<\/b> their assignments on time. I suggest that he <b>be<\/b> present.<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2024<\/span> \"The new guidelines <b>mandate<\/b> that students <b>not only<\/b> <b>submit<\/b> their assignments on time, but also <b>participate<\/b> actively in class discussions. <b>No error<\/b>.\" — <b>No error.<\/b> After <i>mandate that<\/i>, the subjunctive base form (<i>submit, participate<\/i>) is correct, and <i>not only…but also<\/i> joins two parallel verbs. Many candidates wrongly \"correct\" <i>submit<\/i> to <i>submits<\/i>.<\/p><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span> \"Diversification is a strategy <b>to investing<\/b> in many unrelated businesses.\" — error: <i>to investing<\/i> → <b>of investing<\/b> / <b>to invest<\/b>.<\/p><h3 id=\"c13-s5\">12.5 Irregular verbs that cause mistakes<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>V1<\/th><th>V2<\/th><th>V3<\/th><th>Note<\/th><\/tr><tr><td>lie (শোয়া)<\/td><td>lay<\/td><td>lain<\/td><td>no object: He lay on the bed.<\/td><\/tr><tr><td>lay (রাখা)<\/td><td>laid<\/td><td>laid<\/td><td>takes an object: She laid the book down.<\/td><\/tr><tr><td>lie (মিথ্যা বলা)<\/td><td>lied<\/td><td>lied<\/td><td><\/td><\/tr><tr><td>rise (ওঠা)<\/td><td>rose<\/td><td>risen<\/td><td>no object: Prices have risen.<\/td><\/tr><tr><td>raise (ওঠানো)<\/td><td>raised<\/td><td>raised<\/td><td>takes an object: Raise your hand.<\/td><\/tr><tr><td>hang (ঝোলানো)<\/td><td>hung<\/td><td>hung<\/td><td>a picture<\/td><\/tr><tr><td>hang (ফাঁসি দেওয়া)<\/td><td>hanged<\/td><td>hanged<\/td><td>a person<\/td><\/tr><tr><td>ring<\/td><td>rang<\/td><td>rung<\/td><td><\/td><\/tr><tr><td>swim<\/td><td>swam<\/td><td>swum<\/td><td><\/td><\/tr><tr><td>begin<\/td><td>began<\/td><td>begun<\/td><td><\/td><\/tr><tr><td>drink<\/td><td>drank<\/td><td>drunk<\/td><td><\/td><\/tr><tr><td>bear (বহন/সহ্য)<\/td><td>bore<\/td><td>borne<\/td><td>born = জন্মগ্রহণ<\/td><\/tr><tr><td>flee<\/td><td>fled<\/td><td>fled<\/td><td><\/td><\/tr><tr><td>fly<\/td><td>flew<\/td><td>flown<\/td><td><\/td><\/tr><tr><td>flow<\/td><td>flowed<\/td><td>flowed<\/td><td><\/td><\/tr><tr><td>seek<\/td><td>sought<\/td><td>sought<\/td><td><\/td><\/tr><tr><td>bind<\/td><td>bound<\/td><td>bound<\/td><td><\/td><\/tr><tr><td>found (স্থাপন করা)<\/td><td>founded<\/td><td>founded<\/td><td><\/td><\/tr><tr><td>wind<\/td><td>wound<\/td><td>wound<\/td><td><\/td><\/tr><tr><td>strike<\/td><td>struck<\/td><td>struck / stricken<\/td><td><\/td><\/tr><\/table><\/div><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 12<\/div><p class=\"li\">since + point of time; for + period; both with a perfect tense.<\/p><p class=\"li\">\"over the past few years\", \"so far\", \"recently\" → present perfect.<\/p><p class=\"li\">When + past simple, …was/were + V-ing. No sooner had … than.<\/p><p class=\"li\">mind / enjoy / avoid / look forward to + V-ing. have + person + V1; have + thing + V3.<\/p><p class=\"li\">mandate/suggest/insist that + base verb. If I were…; I wish I were…<\/p><p class=\"li\">rise–rose–risen (no object); raise–raised–raised (object); lie–lay–lain; lay–laid–laid.<\/p><\/div>"},{"id":"c14","no":13,"part":"PART C — ENGLISH","title":"Chapter 13: Prepositions, Phrasal Verbs and Articles","short":"Prepositions, Phrasal Verbs and Articles","toc":[["c14-s1","13.1 Prepositions of time and place"],["c14-s2","13.2 Appropriate prepositions — the examination list"],["c14-s3","13.3 Phrasal verbs"],["c14-s4","13.4 Articles — rules worth one mark"]],"html":"<h3 id=\"c14-s1\">13.1 Prepositions of time and place<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Word<\/th><th>Use<\/th><th>Examples<\/th><\/tr><tr><td>at<\/td><td>exact time; small place; point<\/td><td>at 5 pm, at noon, at night, at Eid; at the door, at school, at Savar<\/td><\/tr><tr><td>on<\/td><td>day and date; surface<\/td><td>on Friday, on 21 February, on Monday morning; on the table, on the wall<\/td><\/tr><tr><td>in<\/td><td>month, year, season, long period; large place, enclosed space<\/td><td>in May, in 2026, in winter, in the morning; in Dhaka, in the room<\/td><\/tr><tr><td>by<\/td><td>not later than; agent; means<\/td><td>by 5 o'clock; written by him; by bus<\/td><\/tr><tr><td>for / since<\/td><td>period / starting point<\/td><td>for five days; since Monday<\/td><\/tr><tr><td>between / among<\/td><td>two / more than two<\/td><td>between the two parties; among the students<\/td><\/tr><tr><td>beside / besides<\/td><td>next to / in addition to<\/td><td>He sat beside me. Besides English, he knows French.<\/td><\/tr><tr><td>in / into<\/td><td>position / movement<\/td><td>He is in the room. He went into the room.<\/td><\/tr><tr><td>over / above<\/td><td>covering, more than / higher than<\/td><td>a bridge over the river; above sea level<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span> \"I am not bad ___ tennis.\" — <b>at<\/b> (good/bad/clever/expert <b>at<\/b>). One solution book prints \"in\"; that is a misprint.<\/p><h3 id=\"c14-s2\">13.2 Appropriate prepositions — the examination list<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Word<\/th><th>Preposition<\/th><th>Word<\/th><th>Preposition<\/th><\/tr><tr><td>abide<\/td><td>by (rules)<\/td><td>absorbed<\/td><td>in<\/td><\/tr><tr><td>accused<\/td><td>of<\/td><td>accustomed<\/td><td>to<\/td><\/tr><tr><td>addicted<\/td><td>to<\/td><td>adjacent<\/td><td>to<\/td><\/tr><tr><td>afraid<\/td><td>of<\/td><td>agree<\/td><td>with (person), to (proposal), on (point)<\/td><\/tr><tr><td>angry<\/td><td>with (person), at (thing)<\/td><td>annoyed<\/td><td>with / at<\/td><\/tr><tr><td>apologise<\/td><td>to (person), for (act)<\/td><td>apply<\/td><td>to (person), for (thing)<\/td><\/tr><tr><td>aware<\/td><td>of<\/td><td>based<\/td><td>on<\/td><\/tr><tr><td>beware<\/td><td>of<\/td><td>blind<\/td><td>of (one eye), to (faults)<\/td><\/tr><tr><td>capable<\/td><td>of<\/td><td>charge<\/td><td>with (crime)<\/td><\/tr><tr><td>comply<\/td><td>with<\/td><td>composed<\/td><td>of<\/td><\/tr><tr><td>confident<\/td><td>of<\/td><td>congratulate<\/td><td>on<\/td><\/tr><tr><td>consist<\/td><td>of<\/td><td><b>convicted<\/b><\/td><td><b>of<\/b> — <span class=\"tg tg-actual\">ACTUAL: Bakhrabad 2021<\/span><\/td><\/tr><tr><td>cope<\/td><td>with<\/td><td><b>debarred<\/b><\/td><td><b>from<\/b> — <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><\/tr><tr><td>deal<\/td><td>in (goods), with (matter/person)<\/td><td>depend<\/td><td>on<\/td><\/tr><tr><td>deprived<\/td><td>of<\/td><td>devoid<\/td><td>of<\/td><\/tr><tr><td>die<\/td><td>of (disease), from (cause), for (country), by (poison)<\/td><td>differ<\/td><td>from / with<\/td><\/tr><tr><td>dispose<\/td><td>of<\/td><td>eligible<\/td><td>for<\/td><\/tr><tr><td>entitled<\/td><td>to<\/td><td>envious<\/td><td>of<\/td><\/tr><tr><td>familiar<\/td><td>with<\/td><td>fond<\/td><td>of<\/td><\/tr><tr><td>good / bad<\/td><td>at<\/td><td>guilty<\/td><td>of<\/td><\/tr><tr><td>ignorant<\/td><td>of<\/td><td>indifferent<\/td><td>to<\/td><\/tr><tr><td>insist<\/td><td>on<\/td><td>interested<\/td><td>in<\/td><\/tr><tr><td><b>intrude<\/b><\/td><td><b>on / upon<\/b> (privacy)<\/td><td><b>invest<\/b><\/td><td><b>in<\/b><\/td><\/tr><tr><td>jealous<\/td><td>of<\/td><td>junior / senior<\/td><td>to<\/td><\/tr><tr><td>key<\/td><td>to<\/td><td>lack<\/td><td>of (noun); lacking in<\/td><\/tr><tr><td>loyal<\/td><td>to<\/td><td>married<\/td><td>to<\/td><\/tr><tr><td>object<\/td><td>to<\/td><td>parallel<\/td><td>to<\/td><\/tr><tr><td>prefer<\/td><td>to<\/td><td>prevent<\/td><td>from<\/td><\/tr><tr><td>prohibit<\/td><td>from<\/td><td>proud<\/td><td>of<\/td><\/tr><tr><td>quarrel<\/td><td>with (person), over (thing)<\/td><td><b>reconciled<\/b><\/td><td><b>to<\/b> (a situation), with (a person)<\/td><\/tr><tr><td>refrain<\/td><td>from<\/td><td>rely<\/td><td>on<\/td><\/tr><tr><td>responsible<\/td><td>for (act), to (authority)<\/td><td>satisfied<\/td><td>with<\/td><\/tr><tr><td>similar<\/td><td>to<\/td><td>succeed<\/td><td>in<\/td><\/tr><tr><td>suffer<\/td><td>from<\/td><td>superior<\/td><td>to<\/td><\/tr><tr><td>sure<\/td><td>of<\/td><td>sympathy<\/td><td>for; sympathise with<\/td><\/tr><tr><td>tired<\/td><td>of<\/td><td>worthy<\/td><td>of<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span> \"It is hardly worthwhile ___ invest more time ___ this matter.\" — <b>to, on<\/b> (worthwhile <i>to<\/i> do; spend/invest time <i>on<\/i> a matter).<\/p><p><span class=\"tg tg-actual\">ACTUAL: BAPEX AM 2023<\/span> \"Please do not intrude ___ my privacy.\" Options: on / in / into / upon. Standard usage is <i>intrude <b>on/upon<\/b> someone's privacy<\/i>; one solution book prints \"into\". Where both <i>on<\/i> and <i>upon<\/i> appear, the question itself is faulty; <i>upon<\/i> or <i>on<\/i> is the defensible choice. \"Today students should be reconciled ___ the way things are changing.\" — <b>to<\/b> (accept an unwelcome situation).<\/p><h3 id=\"c14-s3\">13.3 Phrasal verbs<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Phrasal verb<\/th><th>Meaning<\/th><th>Phrasal verb<\/th><th>Meaning<\/th><\/tr><tr><td><b>put up with<\/b><\/td><td>tolerate — <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span><\/td><td>put off<\/td><td>postpone<\/td><\/tr><tr><td>put out<\/td><td>extinguish<\/td><td>put on<\/td><td>wear<\/td><\/tr><tr><td>put down<\/td><td>suppress; write<\/td><td>put forward<\/td><td>propose<\/td><\/tr><tr><td><b>go down (in history)<\/b><\/td><td>be remembered — <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><td>go through<\/td><td>examine; suffer<\/td><\/tr><tr><td>go on<\/td><td>continue<\/td><td>go off<\/td><td>explode; ring<\/td><\/tr><tr><td>call off<\/td><td>cancel<\/td><td>call on / call at<\/td><td>visit a person / a place<\/td><\/tr><tr><td>call for<\/td><td>demand<\/td><td>call in<\/td><td>send for (a doctor)<\/td><\/tr><tr><td>bring up<\/td><td>rear<\/td><td>bring about<\/td><td>cause<\/td><\/tr><tr><td>bring out<\/td><td>publish<\/td><td>break out<\/td><td>start suddenly (war, fire)<\/td><\/tr><tr><td>break down<\/td><td>stop working; collapse<\/td><td>break into<\/td><td>enter by force<\/td><\/tr><tr><td>carry out<\/td><td>execute<\/td><td>carry on<\/td><td>continue<\/td><\/tr><tr><td>come across<\/td><td>meet by chance<\/td><td>come round<\/td><td>recover<\/td><\/tr><tr><td>give up<\/td><td>abandon<\/td><td>give in<\/td><td>yield<\/td><\/tr><tr><td>give away<\/td><td>distribute<\/td><td>get rid of<\/td><td>be free from<\/td><\/tr><tr><td>look after<\/td><td>take care of<\/td><td>look into<\/td><td>investigate<\/td><\/tr><tr><td>look for<\/td><td>search<\/td><td>look down upon<\/td><td>despise<\/td><\/tr><tr><td>look up<\/td><td>search in a book<\/td><td>look forward to<\/td><td>await eagerly<\/td><\/tr><tr><td>make out<\/td><td>understand<\/td><td>make up<\/td><td>compensate; invent<\/td><\/tr><tr><td>make up one's mind<\/td><td>decide<\/td><td>run out of<\/td><td>exhaust the supply<\/td><\/tr><tr><td>run over<\/td><td>knock down (by a vehicle)<\/td><td>set up<\/td><td>establish<\/td><\/tr><tr><td>set out<\/td><td>start a journey<\/td><td>take after<\/td><td>resemble<\/td><\/tr><tr><td>take off<\/td><td>remove; leave the ground<\/td><td>take over<\/td><td>assume control<\/td><\/tr><tr><td>turn down<\/td><td>reject<\/td><td>turn up<\/td><td>appear<\/td><\/tr><tr><td>wind up<\/td><td>close (a company, a meeting)<\/td><td>work out<\/td><td>solve; calculate<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: BAPEX AM 2023<\/span> \"You can only do it ___ my dead body.\" — <b>over<\/b> (idiom: <i>over my dead body<\/i> = I will never allow it).<\/p><h3 id=\"c14-s4\">13.4 Articles — rules worth one mark<\/h3><ul><li><b>a / an<\/b> depends on the <b>sound<\/b>, not the letter: <i>an hour, an honest man, an MBA, an heir, an umbrella<\/i>; <i>a university, a European, a one-taka note, a useful book, a unit<\/i>.<\/li><li><b>the<\/b> with: unique things (the sun, the earth); superlatives (the best); ordinals (the first); rivers, seas, oceans, mountain ranges, island groups, deserts (the Padma, the Bay of Bengal, the Himalayas, the Maldives); plural or descriptive country names (the USA, the UK, the Netherlands, the Philippines); newspapers and holy books (the Daily Star, the Quran); musical instruments (play the piano); adjective used as noun (the rich, the poor); a noun made specific (the water of this pond).<\/li><li><b>No article<\/b> with: proper names; uncountable and abstract nouns in a general sense (<i>Honesty is the best policy<\/i>); meals, games, languages, subjects (<i>play football, speak English, have dinner<\/i>); single mountains and lakes (Mount Everest, Lake Baikal); <i>go to school/bed/hospital/prison<\/i> for the usual purpose.<\/li><li><i>A<\/i> before a proper noun changes the meaning: <i>He is a Nazrul<\/i> (a poet like Nazrul).<\/li><\/ul><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 13<\/div><p class=\"li\">good/bad <b>at<\/b>; convicted <b>of<\/b>; debarred <b>from<\/b>; reconciled <b>to<\/b>; intrude <b>on/upon<\/b>; invest time <b>on<\/b>/money <b>in<\/b>; comply <b>with<\/b>; prefer … <b>to<\/b>.<\/p><p class=\"li\">put up with = tolerate; call off = cancel; wind up = close; turn down = reject; go down in history.<\/p><p class=\"li\">an hour, an MBA, an honest man; a university, a European, a one-taka note.<\/p><\/div>"},{"id":"c15","no":14,"part":"PART C — ENGLISH","title":"Chapter 14: Voice, Narration, Transformation","short":"Voice, Narration, Transformation","toc":[["c15-s1","14.1 How much to do"],["c15-s2","14.2 Active to passive"],["c15-s3","14.3 Direct to indirect speech"],["c15-s4","14.4 Transformation of sentences"],["c15-s5","14.5 Tag questions"]],"html":"<h3 id=\"c15-s1\">14.1 How much to do<\/h3><p>Voice has appeared twice and narration not at all in the eleven papers, but both are standard items in FBS-style papers and in written transformation exercises. Learn the mechanism; do not memorise long lists.<\/p><h3 id=\"c15-s2\">14.2 Active to passive<\/h3><p>Object → subject; verb → <i>be<\/i> (in the same tense) + V3; subject → <i>by<\/i> + object.<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Tense<\/th><th>Active<\/th><th>Passive<\/th><\/tr><tr><td>Present simple<\/td><td>He writes a letter.<\/td><td>A letter <b>is written<\/b> by him.<\/td><\/tr><tr><td>Present continuous<\/td><td>He is writing a letter.<\/td><td>A letter <b>is being written<\/b> by him.<\/td><\/tr><tr><td>Present perfect<\/td><td>He has written a letter.<\/td><td>A letter <b>has been written<\/b> by him.<\/td><\/tr><tr><td>Past simple<\/td><td>They held a meeting very early.<\/td><td>A meeting <b>was held<\/b> by them very early. <span class=\"tg tg-actual\">ACTUAL: Bakhrabad 2021<\/span><\/td><\/tr><tr><td>Past continuous<\/td><td>He was writing a letter.<\/td><td>A letter <b>was being written<\/b> by him.<\/td><\/tr><tr><td>Past perfect<\/td><td>He had written a letter.<\/td><td>A letter <b>had been written<\/b> by him.<\/td><\/tr><tr><td>Future simple<\/td><td>He will write a letter.<\/td><td>A letter <b>will be written<\/b> by him.<\/td><\/tr><tr><td>Modal<\/td><td>He can do it.<\/td><td>It <b>can be done<\/b> by him.<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span> Best passive form of \"I don't like idle people.\" — <b>Idle people are not liked by me.<\/b><\/p><h4>Special cases<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Pattern<\/th><th>Passive<\/th><\/tr><tr><td>Imperative: Open the door.<\/td><td><b>Let<\/b> the door <b>be opened<\/b>.<\/td><\/tr><tr><td>Imperative with <i>please<\/i>: Please help me.<\/td><td>You are requested to help me.<\/td><\/tr><tr><td>Question: Who wrote the book?<\/td><td><b>By whom<\/b> was the book written?<\/td><\/tr><tr><td>Question: Did he do the work?<\/td><td>Was the work done by him?<\/td><\/tr><tr><td>Two objects: He gave me a pen.<\/td><td>I was given a pen by him. / A pen was given (to) me by him.<\/td><\/tr><tr><td><i>People say that he is honest.<\/i><\/td><td><b>It is said that<\/b> he is honest. / He <b>is said to be<\/b> honest.<\/td><\/tr><tr><td>Quasi-passive: Honey tastes sweet.<\/td><td>Honey <b>is sweet when it is tasted<\/b>.<\/td><\/tr><tr><td>Verbs with fixed prepositions other than <i>by<\/i><\/td><td>I <b>was surprised at<\/b> the news. He <b>is known to<\/b> me. The room <b>was filled with<\/b> smoke. She <b>is married to<\/b> a doctor. They <b>were shocked at<\/b> his failure. He <b>is interested in<\/b> music. I <b>am satisfied with<\/b> you.<\/td><\/tr><tr><td>Intransitive verbs (<i>come, go, die, happen, belong, occur, seem<\/i>)<\/td><td>No passive is possible.<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span> \"They <b>were all shocked<\/b> at his failure in the competition.\" — no correction needed.<\/p><h3 id=\"c15-s3\">14.3 Direct to indirect speech<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Change<\/th><th>Rule<\/th><th><\/th><\/tr><tr><td>Reporting verb in the present or future<\/td><td>No change of tense: He says, \"I am ill.\" → He says that he is ill.<\/td><td><\/td><\/tr><tr><td>Reporting verb in the past<\/td><td>Present → past; past simple → past perfect; <i>will<\/i> → <i>would<\/i>; <i>can<\/i> → <i>could<\/i>; <i>may<\/i> → <i>might<\/i>; <i>must<\/i> → <i>had to<\/i><\/td><td><\/td><\/tr><tr><td>Universal truth or habitual fact<\/td><td>No change: He said that honesty is the best policy.<\/td><td><\/td><\/tr><tr><td>Words of nearness → distance<\/td><td>now → then; today → that day; tomorrow → the next day; yesterday → the previous day; ago → before; here → there; this → that; these → those; last night → the previous night<\/td><td><\/td><\/tr><tr><td>Pronouns<\/td><td>1st person follows the <b>speaker<\/b>, 2nd person follows the <b>listener<\/b>, 3rd person does not change (\"SON\": Subject–Object–No change)<\/td><td><\/td><\/tr><tr><td>Sentence type<\/td><td>Direct<\/td><td>Indirect<\/td><\/tr><tr><td>Statement<\/td><td>He said to me, \"I am busy now.\"<\/td><td>He <b>told<\/b> me <b>that<\/b> he was busy then.<\/td><\/tr><tr><td>Yes/no question<\/td><td>He said to me, \"Are you ill?\"<\/td><td>He <b>asked<\/b> me <b>if/whether<\/b> I was ill.<\/td><\/tr><tr><td>Wh-question<\/td><td>He said, \"Where do you live?\"<\/td><td>He asked where I lived. (statement word order)<\/td><\/tr><tr><td>Command/request<\/td><td>He said to me, \"Please open the door.\"<\/td><td>He <b>requested<\/b> me <b>to open<\/b> the door.<\/td><\/tr><tr><td>Negative command<\/td><td>The teacher said, \"Don't make a noise.\"<\/td><td>The teacher <b>forbade<\/b> us <b>to make<\/b> a noise / told us not to make a noise.<\/td><\/tr><tr><td><i>Let us<\/i><\/td><td>He said, \"Let us go out.\"<\/td><td>He <b>proposed that<\/b> we <b>should<\/b> go out.<\/td><\/tr><tr><td>Exclamation<\/td><td>He said, \"Alas! I am undone.\"<\/td><td>He <b>exclaimed with sorrow that<\/b> he was undone.<\/td><\/tr><tr><td>Wish/prayer<\/td><td>He said, \"May you be happy.\"<\/td><td>He <b>prayed that<\/b> I might be happy.<\/td><\/tr><\/table><\/div><h3 id=\"c15-s4\">14.4 Transformation of sentences<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>From → To<\/th><th>Method<\/th><th>Example<\/th><\/tr><tr><td>Affirmative → negative (same meaning)<\/td><td>Use the opposite word with <i>not<\/i>; <i>only → none but/nothing but<\/i>; <i>as soon as → no sooner…than<\/i>; <i>too…to → so…that…not<\/i>; <i>always → never + opposite<\/i>; <i>every → there is no…but<\/i><\/td><td>He is honest. → He is not dishonest. Only Allah can help us. → None but Allah can help us. He is too weak to walk. → He is so weak that he cannot walk.<\/td><\/tr><tr><td>Assertive → interrogative<\/td><td>Affirmative → negative question; negative → affirmative question<\/td><td>Everybody loves his country. → Who does not love his country?<\/td><\/tr><tr><td>Exclamatory → assertive<\/td><td>Use <i>very/great<\/i><\/td><td>What a beautiful bird it is! → It is a very beautiful bird.<\/td><\/tr><tr><td>Simple → complex<\/td><td>Expand a phrase into a clause (<i>who, which, when, if, though, because<\/i>)<\/td><td>He confessed his guilt. → He confessed that he was guilty.<\/td><\/tr><tr><td>Simple → compound<\/td><td>Join with <i>and, but, or, so<\/i><\/td><td>Being ill, he could not come. → He was ill and so he could not come.<\/td><\/tr><tr><td>Complex → compound<\/td><td><i>if → imperative + and/or<\/i>; <i>though → but<\/i><\/td><td>If you work hard, you will succeed. → Work hard and you will succeed. Though he is poor, he is honest. → He is poor but he is honest.<\/td><\/tr><tr><td>Positive ↔ comparative ↔ superlative<\/td><td><i>No other…as…as<\/i> ↔ <i>…-er than any other<\/i> ↔ <i>the …-est<\/i><\/td><td>No other city in Bangladesh is as big as Dhaka. ↔ Dhaka is bigger than any other city in Bangladesh. ↔ Dhaka is the biggest city in Bangladesh.<\/td><\/tr><tr><td>Degree with \"very few\"<\/td><td><i>Very few…as…as<\/i> ↔ <i>…-er than most other<\/i> ↔ <i>one of the …-est<\/i><\/td><td>Very few boys are as tall as he. ↔ He is taller than most other boys. ↔ He is one of the tallest boys.<\/td><\/tr><\/table><\/div><h3 id=\"c15-s5\">14.5 Tag questions<\/h3><p>Positive statement → negative tag, and the reverse; the tag repeats the auxiliary and uses a pronoun. <i>He is ill, isn't he? You don't smoke, do you? I am late, <b>aren't I<\/b>? Let us go, <b>shall we<\/b>? Open the door, <b>will you<\/b>? Nobody came, <b>did they<\/b>? He hardly works, <b>does he<\/b>? Everything is ready, <b>isn't it<\/b>?<\/i><\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 14<\/div><p class=\"li\">Passive = be (same tense) + V3. Imperative → Let … be + V3. Who → By whom.<\/p><p class=\"li\">known <b>to<\/b>, surprised <b>at<\/b>, shocked <b>at<\/b>, filled <b>with<\/b>, married <b>to<\/b>, interested <b>in<\/b>.<\/p><p class=\"li\">Indirect speech: said to → told/asked/requested; question → if/whether + statement order; universal truth keeps its tense.<\/p><p class=\"li\">too…to ↔ so…that…cannot; as soon as ↔ no sooner had…than; only ↔ none but.<\/p><\/div>"},{"id":"c16","no":15,"part":"PART C — ENGLISH","title":"Chapter 15: Vocabulary — Words in Context, Synonyms and Antonyms","short":"Vocabulary — Words in Context, Synonyms and Antonyms","toc":[["c16-s1","15.1 What the papers do with vocabulary"],["c16-s2","15.2 A method for sentence-completion questions"],["c16-s3","15.3 Words that have already been asked"],["c16-s4","15.4 Core list — 300 high-value words"],["c16-s5","15.5 Antonym pairs"],["c16-s6","15.6 Words often confused"]],"html":"<h3 id=\"c16-s1\">15.1 What the papers do with vocabulary<\/h3><p>Fifty of the 123 English questions in the database are pure vocabulary: a sentence with a blank, a pair of blanks, or a capitalised word whose meaning must be chosen. The words are of GRE/GMAT level (<i>lugubrious, quiescent, impasse, provident, ubiquitous<\/i>). No list can guarantee the exact word, so two things are needed: a core list learnt well, and a method for words you do not know.<\/p><h3 id=\"c16-s2\">15.2 A method for sentence-completion questions<\/h3><ul><li><b>Read the whole sentence and find the clue.<\/b> Every sentence contains a word or phrase that defines the blank. In \"The negotiations reached a(n) ___ when both parties <b>refused to compromise<\/b>\", the clue is <i>refused to compromise<\/i> → a deadlock → <b>impasse<\/b>.<\/li><li><b>Decide the direction: same or opposite.<\/b> <i>And, moreover, because, so, thus, ;<\/i> keep the direction. <i>But, although, despite, yet, however, in contrast, rather than<\/i> reverse it. \"The losing team made a ___ <b>but<\/b> ___ effort\" needs a positive word then a negative one → <b>valiant … futile<\/b>.<\/li><li><b>Decide positive or negative before looking at the options<\/b>, then delete the options with the wrong charge.<\/li><li><b>Use word parts.<\/b> <i>bene-<\/i> good (benevolent), <i>mal-<\/i> bad (malevolent), <i>a-/an-<\/i> without (apathy), <i>ante-<\/i> before, <i>anti-<\/i> against, <i>circum-<\/i> around, <i>omni-<\/i> all (omnipotent), <i>-phile<\/i> lover, <i>-phobia<\/i> fear, <i>-cide<\/i> killing, <i>loqu-<\/i> speak (loquacious), <i>luc-<\/i> light (lucid), <i>greg-<\/i> group (gregarious), <i>ver-<\/i> truth (veracity), <i>pac-<\/i> peace (pacify), <i>culp-<\/i> blame (culpable), <i>ubiq-<\/i> everywhere.<\/li><\/ul><h3 id=\"c16-s3\">15.3 Words that have already been asked<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Word<\/th><th>Meaning (অর্থ)<\/th><th>Synonym given<\/th><th>Paper<\/th><\/tr><tr><td>impasse<\/td><td>deadlock — অচলাবস্থা<\/td><td>stalemate<\/td><td>PB 2024<\/td><\/tr><tr><td>bewildered<\/td><td>confused — হতবুদ্ধি<\/td><td>perplexed<\/td><td>PB 2024<\/td><\/tr><tr><td>autocratic<\/td><td>dictatorial — স্বৈরাচারী<\/td><td>despotic<\/td><td>PB 2024<\/td><\/tr><tr><td>provident<\/td><td>prudent, showing foresight — দূরদর্শী<\/td><td>far-sighted<\/td><td>PB 2024<\/td><\/tr><tr><td>qualms<\/td><td>doubts, misgivings — দ্বিধা<\/td><td>scruples<\/td><td>PB 2024<\/td><\/tr><tr><td>dearth<\/td><td>scarcity — অভাব<\/td><td>lack<\/td><td>PB 2024<\/td><\/tr><tr><td>lugubrious<\/td><td>very sad — বিষণ্ণ<\/td><td><b>gloomy<\/b><\/td><td>PB 2024<\/td><\/tr><tr><td>quiescent<\/td><td>at rest — নিষ্ক্রিয়, শান্ত<\/td><td><b>inactive<\/b><\/td><td>PB 2024<\/td><\/tr><tr><td>aversion<\/td><td>strong dislike — বিতৃষ্ণা<\/td><td><b>distaste<\/b><\/td><td>PB 2016<\/td><\/tr><tr><td>belittle<\/td><td>make seem small — হেয় করা<\/td><td><b>demean<\/b><\/td><td>PB 2016<\/td><\/tr><tr><td>commuting<\/td><td>regular travel to work — যাতায়াত<\/td><td><b>travelling<\/b><\/td><td>PB 2016<\/td><\/tr><tr><td>conjugal<\/td><td>of marriage — দাম্পত্য<\/td><td><b>bridal<\/b><\/td><td>PB 2011<\/td><\/tr><tr><td>honorary (antonym)<\/td><td>unpaid — অবৈতনিক<\/td><td>ant. <b>salaried<\/b><\/td><td>PB 2011<\/td><\/tr><tr><td>exonerate<\/td><td>free from blame — দায়মুক্ত করা<\/td><td><b>acquit<\/b><\/td><td>BAPEX 2023<\/td><\/tr><tr><td>perturb<\/td><td>disturb — উদ্বিগ্ন করা<\/td><td><b>worry<\/b><\/td><td>BAPEX 2023<\/td><\/tr><tr><td>estrange<\/td><td>make hostile — বিচ্ছিন্ন করা<\/td><td><b>alienate<\/b><\/td><td>BAPEX 2023<\/td><\/tr><tr><td>squander<\/td><td>waste — অপচয় করা<\/td><td><b>waste<\/b><\/td><td>BAPEX 2023<\/td><\/tr><tr><td>accolade<\/td><td>award, praise — সম্মাননা<\/td><td><b>honor<\/b><\/td><td>BAPEX 2023<\/td><\/tr><tr><td>inadvertent<\/td><td>unintentional — অনিচ্ছাকৃত<\/td><td>accidental<\/td><td>BAPEX 2023<\/td><\/tr><tr><td>lush<\/td><td>rich, green — সবুজ-শ্যামল<\/td><td>luxuriant<\/td><td>BAPEX 2023<\/td><\/tr><tr><td>abominable<\/td><td>hateful — জঘন্য<\/td><td>detestable<\/td><td>BAPEX 2023<\/td><\/tr><tr><td>advent<\/td><td>arrival — আগমন<\/td><td>coming<\/td><td>BAPEX 2023<\/td><\/tr><tr><td>abdicate<\/td><td>give up the throne — সিংহাসন ত্যাগ করা<\/td><td>renounce<\/td><td>BAPEX 2023<\/td><\/tr><tr><td>acumen<\/td><td>sharp judgement — তীক্ষ্ণ বুদ্ধি<\/td><td>shrewdness<\/td><td>Titas 2021<\/td><\/tr><tr><td>dilate (on)<\/td><td>speak at length — বিস্তারিত বলা<\/td><td>expatiate<\/td><td>Titas 2021<\/td><\/tr><tr><td>divergent<\/td><td>differing — ভিন্নমুখী<\/td><td>conflicting<\/td><td>Titas 2021<\/td><\/tr><tr><td>harness<\/td><td>bring under control and use — কাজে লাগানো<\/td><td>utilise<\/td><td>Titas 2021<\/td><\/tr><tr><td>spell<\/td><td>short period — স্বল্প সময়কাল<\/td><td>period<\/td><td>Titas 2021<\/td><\/tr><tr><td>panacea<\/td><td>cure for all diseases — সর্বরোগের ঔষধ<\/td><td>cure-all<\/td><td>Titas 2021<\/td><\/tr><tr><td>wary<\/td><td>cautious — সতর্ক<\/td><td><b>vigilant<\/b><\/td><td>Titas 2021<\/td><\/tr><tr><td>brisk<\/td><td>quick — দ্রুত<\/td><td><b>swift<\/b><\/td><td>Titas 2021<\/td><\/tr><tr><td>sumptuous<\/td><td>costly, lavish — জাঁকালো<\/td><td><b>luxurious<\/b><\/td><td>Titas 2021<\/td><\/tr><tr><td>obstinate<\/td><td>unyielding — একগুঁয়ে<\/td><td><b>stubborn<\/b><\/td><td>Titas 2021<\/td><\/tr><tr><td>fidelity<\/td><td>faithfulness — বিশ্বস্ততা<\/td><td><b>loyalty<\/b><\/td><td>Titas 2021<\/td><\/tr><tr><td>valiant / futile<\/td><td>brave / useless — সাহসী / ব্যর্থ<\/td><td>—<\/td><td>GTCL 2021<\/td><\/tr><tr><td>stipulate / compliant<\/td><td>lay down / obeying — শর্তারোপ করা / অনুগত<\/td><td>—<\/td><td>GTCL 2021<\/td><\/tr><tr><td>calibrated<\/td><td>adjusted to a standard — মানাঙ্কিত<\/td><td>—<\/td><td>GTCL 2021<\/td><\/tr><tr><td>deliberate (on) … at length<\/td><td>consider carefully … in detail<\/td><td>—<\/td><td>GTCL 2021<\/td><\/tr><tr><td>delude<\/td><td>deceive — বিভ্রান্ত করা<\/td><td>mislead<\/td><td>BGFCL 2021<\/td><\/tr><tr><td>ubiquitous<\/td><td>found everywhere — সর্বত্র বিরাজমান<\/td><td>omnipresent<\/td><td>BGFCL 2021<\/td><\/tr><tr><td>exclusively<\/td><td>only — একান্তভাবে<\/td><td>solely<\/td><td>PGCL 2021<\/td><\/tr><tr><td>summit<\/td><td>highest point — শীর্ষ<\/td><td><b>top<\/b><\/td><td>PGCL 2021<\/td><\/tr><tr><td>pertinent<\/td><td>to the point — প্রাসঙ্গিক<\/td><td><b>relevant<\/b><\/td><td>PGCL 2021<\/td><\/tr><tr><td>fallacy (antonym)<\/td><td>false belief — ভ্রান্ত ধারণা<\/td><td>ant. <b>truth<\/b><\/td><td>Bakhrabad 2021<\/td><\/tr><tr><td>encroach<\/td><td>intrude — অনধিকার প্রবেশ করা<\/td><td><b>trespass<\/b><\/td><td>Bakhrabad 2021<\/td><\/tr><\/table><\/div><div class=\"bx bx-warn\"><div class=\"bxh\">CAUTION: Where the printed keys are wrong<\/div><p class=\"li\">BAPEX 2023 Q17, \"I did not do it intentionally; it was totally ___.\" One book prints <i>inevitable<\/i>. The answer is <b>inadvertent<\/b> (unintentional), which is the direct opposite of \"intentionally\".<\/p><p class=\"li\">GTCL 2021 Q14, \"The instrument must be ___ and used according to the manufacturer's ___.\" One book prints <i>codified…dictation<\/i>. The answer is <b>calibrated…instructions<\/b>.<\/p><p class=\"li\">GTCL 2021 Q13, \"We still follow the ___ of keeping the school closed in ___ of the death anniversary of the founder.\" The best fit is <b>tradition…observance<\/b> (in observance of); one book prints <i>culture…honor<\/i>.<\/p><p class=\"li\">Petrobangla 2016 Q32, \"Frankly, I find it too ___ a situation for him to have berated his child like that.\" The sense is that the situation was too minor to justify a scolding → <b>insignificant<\/b>; one book prints <i>acute<\/i>.<\/p><\/div><h3 id=\"c16-s4\">15.4 Core list — 300 high-value words<\/h3><p>Learn 25 a day. Cover the
