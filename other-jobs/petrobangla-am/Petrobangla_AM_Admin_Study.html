":"en-one","f":"The study of mankind","b":"anthropology","x":""},{"id":"en-one-850533c3","deck":"en-one","f":"The study of birds","b":"ornithology","x":""},{"id":"en-one-72bdca28","deck":"en-one","f":"The study of insects","b":"entomology","x":""},{"id":"en-one-68f0b059","deck":"en-one","f":"A place where money is coined","b":"mint","x":""},{"id":"en-one-6b037ab8","deck":"en-one","f":"A place where birds are kept","b":"aviary","x":""},{"id":"en-one-d4a41b6d","deck":"en-one","f":"A place where bees are kept","b":"apiary","x":""},{"id":"en-one-043d2c7c","deck":"en-one","f":"A place for the dead before burial","b":"mortuary","x":""},{"id":"en-one-b0dd45dc","deck":"en-one","f":"An assembly of listeners","b":"audience","x":""},{"id":"en-one-a9ac0cd2","deck":"en-one","f":"A list of items for a meeting","b":"agenda","x":""},{"id":"en-one-2002a13d","deck":"en-one","f":"The minimum number of members required for a meeting","b":"quorum","x":""},{"id":"en-one-cb660450","deck":"en-one","f":"A written statement made on oath","b":"affidavit","x":""},{"id":"en-one-4b9c1632","deck":"en-one","f":"Formal giving up of office","b":"resignation; abdication (throne)","x":""},{"id":"en-one-a0e2d93b","deck":"en-one","f":"An office for which no salary is paid","b":"honorary","x":""},{"id":"en-one-af3419bd","deck":"en-one","f":"Animals living both on land and in water","b":"amphibian","x":""}],"decks":[{"id":"bn-syn","name":"সমার্থক শব্দ","n":39,"ch":"c08"},{"id":"bn-pyq","name":"শব্দার্থ — আগে আসা","n":23,"ch":"c08"},{"id":"bn-hard","name":"কঠিন শব্দের অর্থ","n":40,"ch":"c08"},{"id":"bn-ant","name":"বিপরীত শব্দ","n":68,"ch":"c08"},{"id":"bn-one","name":"এক কথায় প্রকাশ","n":80,"ch":"c08"},{"id":"bn-idiom","name":"বাগধারা","n":152,"ch":"c08"},{"id":"bn-term","name":"পরিভাষা","n":60,"ch":"c08"},{"id":"en-prep","name":"Appropriate prepositions","n":72,"ch":"c14"},{"id":"en-phr","name":"Phrasal verbs","n":48,"ch":"c14"},{"id":"en-pyq","name":"Vocabulary — already asked","n":45,"ch":"c16"},{"id":"en-core","name":"Core vocabulary (300)","n":296,"ch":"c16"},{"id":"en-ant","name":"Antonym pairs","n":42,"ch":"c16"},{"id":"en-idiom","name":"Idioms and phrases","n":76,"ch":"c19"},{"id":"en-one","name":"One-word substitution","n":67,"ch":"c19"}],"written":[{"id":"w01","type":"math","marks":5,"src":"Petrobangla AM 2024 — written","label":"ACTUAL","prompt":"A violet paint is 30% blue and 70% red. A green paint is 50% blue and 50% yellow. When they are mixed, the brown paint obtained is 40% blue. If the brown paint weighs 10 grams, how many grams of red does it contain?","model":"Blue: violet 30%, green 50%, mixture 40%. By alligation violet : green = (50 − 40) : (40 − 30) = 1 : 1. So the 10 g of brown contains 5 g of violet, of which 70% is red = 3.5 g. (Or: 0.3v + 0.5(10 − v) = 4 → v = 5.) Answer: 3.5 g.","ch":"c22"},{"id":"w02","type":"math","marks":5,"src":"Petrobangla AM 2024 — written","label":"ACTUAL","prompt":"Sazid has $360 for a tour. If he extends the tour by 4 days, he must cut his daily expenses by $3. How long is the tour?","model":"Let the tour be d days. 360/d − 360/(d + 4) = 3 → 1440 = 3d(d + 4) → d² + 4d − 480 = 0 → (d − 20)(d + 24) = 0. d = −24 is rejected. Answer: 20 days. Check: 360/20 − 360/24 = 18 − 15 = 3.","ch":"c24"},{"id":"w03","type":"math","marks":5,"src":"PGCL AM (Administration) 2021 — written","label":"ACTUAL","prompt":"Rahim gave half of his stamps to Karim, Karim gave half of his stamps to Fatima, Fatima gave 1/4 of the stamps given to her to Tonmoy and kept the remaining 12. How many stamps did Rahim start with?","model":"Work backwards. Fatima kept 3/4 of what she received = 12 → she received 16. That was half of Karim's stamps → Karim had 32. That was half of Rahim's → Rahim had 64.","ch":"c20"},{"id":"w04","type":"math","marks":5,"src":"Bakhrabad AM 2021 — written","label":"ACTUAL","prompt":"A train 150 metres long passes a man who is moving at 2 km/h in the same direction in 3 seconds. Find the speed of the train.","model":"Relative speed = 150/3 = 50 m/s = 180 km/h. They move in the same direction, so train − man = 180 → train = 182 km/h.","ch":"c23"},{"id":"w05","type":"math","marks":5,"src":"KGDCL AM 2021 — written","label":"ACTUAL","prompt":"A password is made up of two letters followed by two single-digit numbers. If a password is assigned at random, what is the probability, rounded to the nearest hundredth, that it uses only even digits for the numbers?","model":"The letters do not matter. Each digit is even (0, 2, 4, 6, 8) with probability 5/10 = 1/2, and the two digits are independent: (1/2)(1/2) = 0.25.","ch":"c26"},{"id":"w06","type":"bangla","marks":10,"src":"SGFL AM 2021 — written","label":"ACTUAL","prompt":"গ্যাসের প্রিপেইড মিটার স্থাপনের অনুরোধ জানিয়ে সংশ্লিষ্ট কর্তৃপক্ষকে একটি চিঠি লিখুন।","model":"আবেদনপত্রের কাঠামো: তারিখ → বরাবর, ব্যবস্থাপনা পরিচালক, (বিতরণ কোম্পানির নাম) → বিষয়: আবাসিক গ্যাস সংযোগে প্রিপেইড মিটার স্থাপনের আবেদন → জনাব → (১) নিজের পরিচয় ও গ্রাহক সংকেত; (২) কেন প্রয়োজন: ব্যবহার অনুযায়ী বিল, অপচয় রোধ, বকেয়ার ঝামেলা নেই; (৩) সুনির্দিষ্ট প্রার্থনা ও ফি পরিশোধের সম্মতি → বিনীত নিবেদক 'ক' → সংযুক্তি। পূর্ণ নমুনা গাইডের অধ্যায় ১০-এ। খাতায় নিজের প্রকৃত নাম লিখবেন না।","ch":"c11"},{"id":"w07","type":"bangla","marks":10,"src":"Bakhrabad AM 2021 — written","label":"ACTUAL","prompt":"আপনার এক অধীনস্থ কর্মচারী প্রায়ই দেরি করে অফিসে আসছে। তার বিরুদ্ধে কেন দাপ্তরিক ব্যবস্থা গ্রহণ করা হবে না, তা জানতে চেয়ে কারণ দর্শানোর একটি চিঠি লিখুন।","model":"দাপ্তরিক পত্রের কাঠামো: প্রতিষ্ঠানের নাম ও বিভাগ → স্মারক নং ও তারিখ → বিষয়: বিলম্বে উপস্থিতির জন্য কারণ দর্শানো প্রসঙ্গে → বক্তব্যে পাঁচ উপাদান: (১) কোন কোন তারিখে বিলম্ব; (২) আগে মৌখিক সতর্কতা; (৩) চাকরি প্রবিধান অনুযায়ী অসদাচরণ; (৪) ৭ কার্যদিবসের মধ্যে লিখিত জবাব; (৫) জবাব না দিলে একতরফা ব্যবস্থা → স্বাক্ষর, নাম, পদবি → প্রাপক → অনুলিপি। পূর্ণ নমুনা অধ্যায় ১০-এ।","ch":"c11"},{"id":"w08","type":"bangla","marks":5,"src":"KGDCL AM 2021 — written","label":"ACTUAL","prompt":"গাড়ি চালানোর সময় আপনার একটি ছোট দুর্ঘটনা ঘটেছে। কখন, কোথায়, কীভাবে ঘটেছে এবং দুর্ঘটনার পর আপনি কী করেছেন সে সম্পর্কে গাড়ির বীমা কোম্পানিকে একটি চিঠি লিখুন।","model":"প্রশ্নের চারটি অংশের উত্তর দিন: কখন (তারিখ ও সময়), কোথায় (সড়ক/এলাকা), কীভাবে (ঘটনার বিবরণ), পরে কী করেছেন (থানায় সাধারণ ডায়েরি, ওয়ার্কশপে নেওয়া, ছবি)। সঙ্গে পলিসি নম্বর ও গাড়ির নিবন্ধন নম্বর; শেষে দাবি নিষ্পত্তির অনুরোধ। বিষয়: মোটরগাড়ি দুর্ঘটনাজনিত বীমা দাবি প্রসঙ্গে।","ch":"c11"},{"id":"w09","type":"english","marks":10,"src":"GTCL AM 2021 — written","label":"ACTUAL","prompt":"Argument writing: \"Small and medium businesses are more important than large business.\" Justify this statement with your views, providing examples.","model":"Plan: (1) position — for a developing economy SMEs matter more; (2) they create most non-farm jobs and spread income to towns and villages (light engineering in Bogura, footwear in Bhairab); (3) they make the economy flexible and supply large firms; concede that large firms bring technology, exports and tax, then answer it; (4) conclusion — easier credit, training and market access for SMEs. A full 220-word model is in Chapter 17.","ch":"c18"},{"id":"w10","type":"english","marks":15,"src":"SGFL AM 2021 — written","label":"ACTUAL","prompt":"Write a short essay on \"Affordable and Clean Energy\". You should write at least 150 words.","model":"Skeleton: definition (SDG 7, by 2030) → why energy matters and why fossil fuels are a problem → Bangladesh's situation (declining domestic gas, costly LNG imports, solar and wind potential, system loss) → what should be done (renewables, efficiency, fair pricing). Full model in Chapter 17; current figures in Chapter 35.","ch":"c18"},{"id":"w11","type":"english","marks":10,"src":"GTCL AM 2021 — written","label":"ACTUAL","prompt":"Write short notes on: (a) OPEC (b) FIFA World Cup 2022.","model":"Short-note formula: what it is → when and where founded → members or structure → what it does → why it matters. OPEC: founded Baghdad, September 1960, by Iran, Iraq, Kuwait, Saudi Arabia and Venezuela; headquarters Vienna; coordinates members' oil output and so influences crude prices; works with Russia and others as OPEC+; matters to Bangladesh through the cost of imported oil and LNG.","ch":"c18"},{"id":"w12","type":"english","marks":10,"src":"Mock Examination 1","label":"NEW","prompt":"\"Bangladesh should give priority to exploring its own gas rather than importing LNG.\" Do you agree? Argue your position in about 150 words.","model":"Agree, with a qualification. Imported LNG now supplies about two-fifths of the gas and is paid for in foreign currency at volatile prices; domestic gas is far cheaper; the Bay of Bengal, Bhola and Sylhet are under-explored. Concession: exploration takes years, so LNG is needed as a bridge. Conclusion: strengthen BAPEX and attract international companies through the 2026 bidding round, using LNG only to fill the gap.","ch":"c36"},{"id":"w13","type":"bangla","marks":10,"src":"Mock Examination 2","label":"NEW","prompt":"শীত মৌসুমে গ্যাস ও বিদ্যুতের সাশ্রয়ী ব্যবহার নিশ্চিত করতে আপনার কার্যালয়ের সকল কর্মকর্তা-কর্মচারীর উদ্দেশে প্রশাসন বিভাগের পক্ষ থেকে একটি অফিস বিজ্ঞপ্তি লিখুন।","model":"বিজ্ঞপ্তির কাঠামো: প্রতিষ্ঠানের নাম ও বিভাগ → স্মারক নং ও তারিখ → শিরোনাম 'বিজ্ঞপ্তি' → 'এতদ্বারা সংশ্লিষ্ট সকলের অবগতির জন্য জানানো যাচ্ছে যে…' → নির্দেশনা (কক্ষ ত্যাগের সময় বাতি, পাখা ও এসি বন্ধ; দিনের আলো ব্যবহার; অপ্রয়োজনে চুলা/হিটার না জ্বালানো; লিকেজ দেখলে জানানো) → কার্যকর হওয়ার তারিখ ও তদারকির দায়িত্ব → স্বাক্ষর, নাম, পদবি → বিতরণ।","ch":"c11"},{"id":"w14","type":"math","marks":5,"src":"Mock Examination 1","label":"NEW","prompt":"A dealer mixes tea costing Tk 300 per kg with tea costing Tk 450 per kg to obtain 30 kg of a mixture worth Tk 360 per kg. How many kilograms of each kind does he use?","model":"Cheaper : dearer = (450 − 360) : (360 − 300) = 3 : 2. Of 30 kg: 18 kg at Tk 300 and 12 kg at Tk 450. Check: 18 × 300 + 12 × 450 = 10,800 = 30 × 360.","ch":"c22"}],"sections":[{"id":"bangla","bn":"বাংলা","en":"Bangla"},{"id":"english","bn":"ইংরেজি","en":"English"},{"id":"math","bn":"গণিত","en":"Mathematics"},{"id":"gk","bn":"সাধারণ জ্ঞান","en":"General Knowledge"}]}</script>
<script type="text/x-study-script">
(function () {
'use strict';
const KEY = 'petrobangla_am_study_v1';
const DATA = JSON.parse(document.getElementById('data-pb').textContent);
const CH = DATA.chapters, QS = DATA.questions, CARDS = DATA.cards, DECKS = DATA.decks, WR = DATA.written, SECS = DATA.sections;
const CHBY = Object.fromEntries(CH.map(c => [c.id, c]));
const QBY = Object.fromEntries(QS.map(q => [q.id, q]));
const SECBY = Object.fromEntries(SECS.map(s => [s.id, s]));
const SRCS = [...new Set(QS.map(q => q.src))];
const DAY = 864e5, BOX_DAYS = [0, 0, 1, 3, 7, 15];
const $ = id => document.getElementById(id);
const V = () => $('view');
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BN = n => String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const pct = (a, b) => b ? Math.round(a * 1000 / b) / 10 : 0;
const fmtPct = v => BN(Number.isInteger(v) ? v : v.toFixed(1)) + '%';
const fmtDate = t => new Date(t).toLocaleString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtTime = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const letters = q => Object.keys(q.options);

// ---------- state ----------
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S.v = 1;
for (const k of ['questions', 'readChapters', 'cards', 'written']) if (!S[k] || typeof S[k] !== 'object') S[k] = {};
if (!Array.isArray(S.tests)) S.tests = [];
S.settings = Object.assign({ neg: 0, secPerQ: 51, examDate: '', hideAns: false }, S.settings || {});
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert('সংরক্ষণ করা যায়নি: ' + e.message); } }
function row(id) { return S.questions[id] = S.questions[id] || { attempts: 0, correctCount: 0, wrongCount: 0, box: 0 }; }
function recordAnswer(id, choice, source) {
  const q = QBY[id]; if (!q || !choice) return null;
  const r = row(id), ok = choice === q.answer;
  r.attempts++; ok ? r.correctCount++ : r.wrongCount++;
  r.last = choice; r.lastCorrect = ok; r.lastAt = Date.now(); r.src = source;
  r.box = ok ? Math.min(5, (r.box || 0) + 1) : 1;
  r.nextReview = new Date(Date.now() + BOX_DAYS[r.box] * DAY).toISOString();
  r.status = r.box >= 4 ? 'mastered' : 'learning';
  return ok;
}
const isDue = r => r && r.attempts && r.nextReview && new Date(r.nextReview) <= new Date();
const dueIds = () => QS.filter(q => isDue(S.questions[q.id])).map(q => q.id);
const wrongIds = () => QS.filter(q => { const r = S.questions[q.id]; return r && r.attempts && !r.lastCorrect; }).map(q => q.id);
const cardDue = c => { const r = S.cards[c.id]; return r && r.due && new Date(r.due) <= new Date(); };

function secStats() {
  const o = {}; for (const s of SECS) o[s.id] = { c: 0, t: 0, seen: 0, n: 0 };
  for (const q of QS) { const x = S.questions[q.id] || {}, z = o[q.section]; z.n++; if (x.attempts) z.seen++; z.c += x.correctCount || 0; z.t += x.attempts || 0; }
  return o;
}
function level(c, t) {
  if (t < 3) return { bn: 'তথ্য কম', cls: '' };
  const p = c / t;
  return p >= 0.75 ? { bn: 'শক্তিশালী', cls: 'ok' } : p >= 0.5 ? { bn: 'মাঝারি', cls: 'mid' } : { bn: 'দুর্বল', cls: 'bad' };
}
function totals() {
  let a = 0, c = 0; for (const x of Object.values(S.questions)) { a += x.attempts || 0; c += x.correctCount || 0; }
  const pcts = S.tests.map(t => t.pct);
  return { answers: a, correct: c, seen: Object.values(S.questions).filter(x => x.attempts).length,
    read: CH.filter(ch => S.readChapters[ch.id]).length, best: pcts.length ? Math.max(...pcts) : null,
    cardsSeen: Object.values(S.cards).filter(x => x.seen).length, cardsDue: CARDS.filter(cardDue).length, due: dueIds().length };
}
const barHTML = (p, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, p))}%"></i></div>`;
function optsHTML(q, { chosen, reveal, disabled } = {}) {
  return `<div class="opts">${letters(q).map(k => {
    let cls = 'opt';
    if (reveal) { if (k === q.answer) cls += ' right'; else if (k === chosen) cls += ' wrong'; } else if (k === chosen) cls += ' sel';
    return `<button class="${cls}" data-opt="${k}" ${disabled ? 'disabled' : ''}><span class="k">${k}</span><span>${esc(q.options[k])}</span></button>`;
  }).join('')}</div>`;
}
const expHTML = q => `<div class="exp"><p class="ans">উত্তর: ${esc(q.answer + '. ' + q.options[q.answer])}</p>${q.explain ? `<p>${esc(q.explain)}</p>` : ''}</div>`;
const qMeta = q => `<span class="pill">${esc(SECBY[q.section].bn)}</span><span class="pill">${esc(q.src)} · ${BN(q.n)}</span><span class="tg tg-${q.label.toLowerCase()}">${q.label}</span>`;
function lineChart(points) {
  if (!points.length) return '<p class="muted">এখনো কোনো পরীক্ষা দেওয়া হয়নি।</p>';
  const W = 600, H = 180, P = 30, n = points.length;
  const x = i => P + (n === 1 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (n - 1)), y = v => H - P - (Math.max(0, v) / 100) * (H - 2 * P);
  const path = points.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const grid = [0, 25, 50, 75, 100].map(g => `<line x1="${P}" x2="${W - P}" y1="${y(g)}" y2="${y(g)}" stroke="var(--bd)" stroke-dasharray="3 3"/><text x="2" y="${y(g) + 4}">${g}%</text>`).join('');
  const dots = points.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--ac)"><title>${i + 1}: ${v}%</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Score trend">${grid}<line x1="${P}" x2="${W - P}" y1="${y(50)}" y2="${y(50)}" stroke="var(--bad)" stroke-width="1"/><path d="${path}" fill="none" stroke="var(--ac)" stroke-width="2.5"/>${dots}</svg>`;
}

// ---------- navigation ----------
const TABS = [['home', 'ড্যাশবোর্ড'], ['guide', 'গাইড (বই)'], ['practice', 'অনুশীলন'], ['test', 'পরীক্ষা দিন'], ['cards', 'ফ্ল্যাশকার্ড'], ['written', 'লিখিত'], ['review', 'রিভিশন'], ['records', 'রেকর্ড ও সেটিংস']];
let cur = 'home', running = null, tick = null;
function tabs() {
  $('tabs').innerHTML = TABS.map(([id, t]) => `<button class="tab" role="tab" data-tab="${id}" aria-selected="${id === cur}">${t}</button>`).join('');
  $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
}
function go(t, arg) {
  if (running && !running.done && t !== 'test') {
    if (!confirm('পরীক্ষা চলছে। অন্য পাতায় গেলে পরীক্ষা থেমে থাকবে; পরে চালিয়ে যেতে পারবেন। যাবেন?')) return;
    pauseRunning();
  }
  cur = t; tabs(); if (!(arg && arg.keepScroll)) window.scrollTo(0, 0);
  ({ home, guide, practice, test: testView, cards: cardsView, written, review, records })[t](arg);
}

// ---------- home ----------
function home() {
  const t = totals(), z = secStats(), d = S.draft;
  let cd = '';
  if (S.settings.examDate) { const n = Math.ceil((new Date(S.settings.examDate + 'T00:00:00') - new Date()) / DAY); cd = n >= 0 ? `<b>${BN(n)}</b><span>দিন বাকি (${esc(S.settings.examDate)})</span>` : `<b>—</b><span>নির্ধারিত তারিখ পার হয়েছে</span>`; }
  else cd = `<b>—</b><span>পরীক্ষার তারিখ ঘোষিত হয়নি; নিজে সেট করুন</span>`;
  V().innerHTML = `
  ${d ? `<div class="card note" style="margin-bottom:14px"><div class="row spread"><span>অসমাপ্ত পরীক্ষা: <b>${esc(d.title)}</b> (${BN(Object.keys(d.answers).length)}/${BN(d.qids.length)} উত্তর)</span><span class="row"><button class="btn small primary" id="resume">চালিয়ে যান</button><button class="btn small danger" id="discard">বাতিল</button></span></div></div>` : ''}
  <div class="grid g4" style="margin-bottom:14px">
    <div class="card stat">${cd}</div>
    <div class="card stat"><b>${BN(t.read)}/${BN(CH.length)}</b><span>অধ্যায় পড়া সম্পন্ন</span></div>
    <div class="card stat"><b>${BN(t.seen)}/${BN(QS.length)}</b><span>প্রশ্ন চেষ্টা করা হয়েছে</span></div>
    <div class="card stat"><b>${t.answers ? fmtPct(pct(t.correct, t.answers)) : '—'}</b><span>নির্ভুলতা (${BN(t.answers)} উত্তর)</span></div>
    <div class="card stat"><b>${BN(S.tests.length)}</b><span>পরীক্ষা দেওয়া হয়েছে</span></div>
    <div class="card stat"><b>${t.best == null ? '—' : fmtPct(t.best)}</b><span>সর্বোচ্চ নম্বর (পাস ৫০%)</span></div>
    <div class="card stat"><b>${BN(t.due)}</b><span>প্রশ্ন রিভিশন বাকি</span></div>
    <div class="card stat"><b>${BN(t.cardsDue)}</b><span>ফ্ল্যাশকার্ড রিভিশন বাকি</span></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>পরীক্ষার কাঠামো — যা নিশ্চিত, যা নয়</h2>
      <div class="tablewrap"><table><tr><th>বিষয়</th><th>নম্বর (সরকারি নীতিমালা)</th></tr>
      <tr><td>বাংলা</td><td>২৫</td></tr><tr><td>ইংরেজি</td><td>২৫</td></tr><tr><td>গণিত</td><td>২৫</td></tr><tr><td>সাধারণ জ্ঞান</td><td>২৫</td></tr>

// ---------- guide ----------
let gCur = null, gTerm = '';
const chText = c => c._t || (c._t = c.html.replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').toLowerCase());
function highlight(rootEl, term) {
  if (!term) return;
  const w = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT), nodes = []; let n;
  while ((n = w.nextNode())) if (n.nodeValue.toLowerCase().includes(term)) nodes.push(n);
  let first = null;
  for (const node of nodes) {
    const frag = document.createDocumentFragment(), txt = node.nodeValue, low = txt.toLowerCase(); let i = 0, j;
    while ((j = low.indexOf(term, i)) >= 0) { frag.append(txt.slice(i, j)); const m = document.createElement('mark'); m.textContent = txt.slice(j, j + term.length); frag.append(m); first = first || m; i = j + term.length; }
    frag.append(txt.slice(i)); node.replaceWith(frag);
  }
  if (first) first.scrollIntoView({ block: 'center' });
}
function guide(arg) {
  if (arg && arg.ch) gCur = arg.ch;
  if (!gCur || !CHBY[gCur]) gCur = (S.last && CHBY[S.last.chapter]) ? S.last.chapter : CH[0].id;
  const c = CHBY[gCur], idx = CH.indexOf(c), term = gTerm.trim().toLowerCase();
  const hits = term ? CH.filter(x => chText(x).includes(term) || x.title.toLowerCase().includes(term)) : CH;
  let last = '', toc = '';
  for (const x of hits) {
    if (x.part !== last) { toc += `<div class="pt">${esc(x.part)}</div>`; last = x.part; }
    toc += `<button data-ch="${x.id}" class="${x.id === gCur ? 'on' : ''}"><span class="tick">${S.readChapters[x.id] ? '✓' : ''}</span><span>${esc(x.no ? BN(x.no) + '. ' + x.short : x.title)}</span></button>`;
  }
  V().innerHTML = `<div class="guide">
    <aside class="card toc noprint"><input type="search" id="gsearch" placeholder="বইয়ে খুঁজুন…" value="${esc(gTerm)}" style="width:100%">
      <p class="muted" style="margin:6px 4px">${term ? BN(hits.length) + 'টি অধ্যায়ে পাওয়া গেছে' : BN(CH.filter(x => S.readChapters[x.id]).length) + '/' + BN(CH.length) + ' অধ্যায় পড়া হয়েছে'}</p>${toc || '<p class="muted">কিছু পাওয়া যায়নি।</p>'}</aside>
    <article class="card book ${S.settings.hideAns ? 'hideans' : ''}" id="book">
      <div class="row spread noprint" style="margin-bottom:8px"><span class="muted">${esc(c.part)}</span>
        <span class="row"><button class="btn small" id="gprev" ${idx ? '' : 'disabled'}>← আগের</button><button class="btn small" id="gnext" ${idx < CH.length - 1 ? '' : 'disabled'}>পরের →</button>
        <button class="btn small ${S.settings.hideAns ? 'on' : ''}" id="ghide">${S.settings.hideAns ? 'উত্তর দেখান' : 'উত্তর লুকান'}</button><button class="btn small" id="gprint">প্রিন্ট</button></span></div>
      <h2>${esc(c.title)}</h2>
      ${c.toc.length > 1 ? `<select id="gjump" class="noprint" aria-label="অনুচ্ছেদ" style="margin:6px 0 4px;max-width:100%"><option value="">এই অধ্যায়ের অনুচ্ছেদ…</option>${c.toc.map(([id, t]) => `<option value="${id}">${esc(t)}</option>`).join('')}</select>` : ''}
      <div id="gbody">${c.html}</div>
      <div class="row spread noprint" style="margin-top:18px;border-top:1px solid var(--bd);padding-top:12px">
        <label class="row"><input type="checkbox" id="gread" ${S.readChapters[c.id] ? 'checked' : ''}> এই অধ্যায় পড়া শেষ</label>
        <button class="btn primary" id="gdone">${idx < CH.length - 1 ? 'পড়া শেষ — পরের অধ্যায় →' : 'পড়া শেষ'}</button></div>
    </article></div>`;
  S.last = { chapter: c.id }; save();
  const open = id => { gCur = id; guide(); window.scrollTo(0, 0); };
  V().querySelectorAll('[data-ch]').forEach(b => b.onclick = () => open(b.dataset.ch));
  $('gsearch').oninput = e => { gTerm = e.target.value; const pos = e.target.selectionStart; guide({ keepScroll: true }); const el = $('gsearch'); el.focus(); el.setSelectionRange(pos, pos); };
  $('gprev').onclick = () => open(CH[idx - 1].id); $('gnext').onclick = () => open(CH[idx + 1].id);
  $('ghide').onclick = () => { S.settings.hideAns = !S.settings.hideAns; save(); guide({ keepScroll: true }); };
  $('gprint').onclick = () => window.print();
  if ($('gjump')) $('gjump').onchange = e => { const el = $(e.target.value); if (el) el.scrollIntoView({ block: 'start' }); };
  $('gread').onchange = e => { S.readChapters[c.id] = e.target.checked; save(); };
  $('gdone').onclick = () => { S.readChapters[c.id] = true; save(); if (idx < CH.length - 1) open(CH[idx + 1].id); else guide({ keepScroll: true }); };
  $('gbody').querySelectorAll('.pa').forEach(p => p.onclick = () => p.classList.add('shown'));
  if (term) highlight($('gbody'), term);
}

function startTest(ids, title) {
  if (!ids.length) return alert('এই টেস্টের জন্য কোনো প্রশ্ন নেই।');
  if (S.draft && !confirm('একটি অসমাপ্ত পরীক্ষা আছে; নতুন শুরু করলে সেটি মুছে যাবে। চালিয়ে যাবেন?')) return;
  running = { title, qids: ids, answers: {}, marked: {}, i: 0, total: Math.round(ids.length * S.settings.secPerQ), left: Math.round(ids.length * S.settings.secPerQ), started: Date.now(), done: false };
  cur = 'test'; tabs(); persistDraft(); startClock(); renderTest(); window.scrollTo(0, 0);
}
function persistDraft() { if (!running || running.done) return; S.draft = { title: running.title, qids: running.qids, answers: running.answers, marked: running.marked, i: running.i, total: running.total, left: running.left }; save(); }
function resumeDraft() { const d = S.draft; running = { ...d, answers: { ...d.answers }, marked: { ...d.marked }, done: false }; cur = 'test'; tabs(); startClock(); renderTest(); }
function pauseRunning() { clearInterval(tick); tick = null; persistDraft(); running = null; }
function startClock() {
  clearInterval(tick);
  tick = setInterval(() => {
    if (!running || running.done) return clearInterval(tick);
    running.left--; const el = $('timer');
    if (el) { el.textContent = fmtTime(running.left); el.classList.toggle('low', running.left < 60); }
    if (running.left % 15 === 0) persistDraft();
    if (running.left <= 0) { alert('সময় শেষ! উত্তরপত্র জমা হচ্ছে।'); submitTest(); }
  }, 1000);
}
function renderTest() {
  const t = running, q = QBY[t.qids[t.i]];
  V().innerHTML = `<div class="testlay"><div class="card"><div class="qhead"><span><span class="pill">প্রশ্ন ${BN(t.i + 1)}/${BN(t.qids.length)}</span><span class="pill">${esc(SECBY[q.section].bn)}</span></span><span class="timer" id="timer">${fmtTime(t.left)}</span></div>
    <div class="q">${esc(q.q)}</div><div id="topts">${optsHTML(q, { chosen: t.answers[q.id] })}</div>
    <div class="row spread" style="margin-top:14px"><button class="btn" id="tprev" ${t.i ? '' : 'disabled'}>← আগের</button>
    <span class="row"><button class="btn small" id="tclear">উত্তর মুছুন</button><button class="btn small ${t.marked[q.id] ? 'on' : ''}" id="tmark">${t.marked[q.id] ? 'চিহ্ন তুলুন' : 'পরে দেখব'}</button></span>
    <button class="btn primary" id="tnext">${t.i < t.qids.length - 1 ? 'পরের →' : 'শেষ প্রশ্ন'}</button></div></div>
    <aside class="card side"><b>${esc(t.title)}</b><p class="muted">উত্তর ${BN(Object.keys(t.answers).length)}/${BN(t.qids.length)}</p>
    <div class="palette">${t.qids.map((id, i) => `<button data-j="${i}" class="${t.answers[id] ? 'ans' : ''} ${t.marked[id] ? 'mk' : ''} ${i === t.i ? 'cur' : ''}">${i + 1}</button>`).join('')}</div>
    <button class="btn primary" id="tsubmit" style="width:100%;margin-top:12px;justify-content:center">জমা দিন</button></aside></div>`;
  $('topts').onclick = e => { const b = e.target.closest('[data-opt]'); if (!b) return; t.answers[q.id] = b.dataset.opt; persistDraft(); renderTest(); };
  $('tprev').onclick = () => { t.i--; renderTest(); };
  $('tnext').onclick = () => { if (t.i < t.qids.length - 1) { t.i++; renderTest(); } };
  $('tclear').onclick = () => { delete t.answers[q.id]; persistDraft(); renderTest(); };
  $('tmark').onclick = () => { t.marked[q.id] = !t.marked[q.id]; renderTest(); };
  V().querySelectorAll('[data-j]').forEach(b => b.onclick = () => { t.i = +b.dataset.j; renderTest(); });
  $('tsubmit').onclick = () => { const un = t.qids.length - Object.keys(t.answers).length; if (confirm(un ? `${BN(un)}টি প্রশ্নের উত্তর দেওয়া হয়নি। জমা দেবেন?` : 'উত্তরপত্র জমা দেবেন?')) submitTest(); };
}
function submitTest() {
  const t = running; if (!t || t.done) return; t.done = true; clearInterval(tick);
  let c = 0, w = 0; const bySec = {};
  for (const id of t.qids) {
    const q = QBY[id], a = t.answers[id], z = bySec[q.section] = bySec[q.section] || { c: 0, w: 0, n: 0 }; z.n++;
    if (!a) continue;
    const ok = recordAnswer(id, a, 'test'); if (ok) { c++; z.c++; } else { w++; z.w++; }
  }
  const neg = Math.round(w * S.settings.neg * 100) / 100, score = Math.round((c - neg) * 100) / 100;
  const res = { at: Date.now(), title: t.title, qids: t.qids, answers: t.answers, total: t.qids.length, correct: c, wrong: w, unanswered: t.qids.length - c - w, neg, score, max: t.qids.length, pct: Math.max(0, pct(score, t.qids.length)), timeUsed: t.total - t.left, bySection: bySec };
  S.tests.push(res); if (S.tests.length > 80) S.tests = S.tests.slice(-80);
  delete S.draft; save(); running = null; showResult(res);
}
function showResult(r, back) {
  cur = 'test'; tabs();
  const pass = r.pct >= 50;
  V().innerHTML = `<div class="card" style="margin-bottom:14px"><div class="row spread"><div><span class="muted">${esc(r.title)} · ${fmtDate(r.at)}</span><div class="big">${fmtPct(r.pct)}</div>
    <span class="pill ${pass ? 'ok' : 'bad'}">${pass ? '৫০% পাস নম্বরের ওপরে' : '৫০% পাস নম্বরের নিচে'}</span><span class="pill">নম্বর ${BN(r.score)}/${BN(r.max)}</span><span class="pill ok">সঠিক ${BN(r.correct)}</span><span class="pill bad">ভুল ${BN(r.wrong)}</span><span class="pill">বাদ ${BN(r.unanswered)}</span>${r.neg ? `<span class="pill">নেগেটিভ −${BN(r.neg)}</span>` : ''}<span class="pill">সময় ${fmtTime(r.timeUsed)}</span>
    <p class="muted">১০০ নম্বরের অনুপাতে: ${BN(Math.round(r.pct))} → মেধাতালিকার ৭৫-এ ${BN(Math.round(r.pct * 0.75))}</p></div>
    <div style="min-width:260px;flex:1">${SECS.filter(s => r.bySection[s.id]).map(s => { const z = r.bySection[s.id], P = pct(z.c, z.n); return `<div class="zone"><span>${esc(s.bn)}</span>${barHTML(P, P >= 75 ? 'ok' : P >= 50 ? 'mid' : 'bad')}<span>${BN(z.c)}/${BN(z.n)}</span></div>`; }).join('')}</div></div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="rnew">${back ? 'রেকর্ডে ফিরুন' : 'আরেকটি টেস্ট'}</button><button class="btn" id="rwrong" ${r.wrong + r.unanswered ? '' : 'disabled'}>ভুল ও বাদ পড়াগুলো অনুশীলন</button>
    <span class="chips" style="margin:0"><button class="chip on" data-rf="all">সব</button><button class="chip" data-rf="wrong">ভুল</button><button class="chip" data-rf="skip">বাদ</button><button class="chip" data-rf="right">সঠিক</button></span></div></div><div id="rlist"></div>`;
  const draw = f => {
    $('rlist').innerHTML = r.qids.map((id, i) => { const q = QBY[id]; if (!q) return ''; const a = r.answers[id], st = !a ? 'skip' : a === q.answer ? 'right' : 'wrong'; if (f !== 'all' && f !== st) return '';
      return `<div class="card" style="margin-bottom:10px"><div class="qhead"><span><span class="pill ${st === 'right' ? 'ok' : st === 'wrong' ? 'bad' : ''}">${BN(i + 1)} · ${st === 'right' ? 'সঠিক' : st === 'wrong' ? 'ভুল' : 'বাদ'}</span>${qMeta(q)}</span></div><div class="q">${esc(q.q)}</div>${optsHTML(q, { chosen: a, reveal: true, disabled: true })}${expHTML(q)}</div>`; }).join('') || '<div class="card empty">এই ফিল্টারে কিছু নেই।</div>';
  };
  draw('all');
  V().querySelectorAll('[data-rf]').forEach(b => b.onclick = () => { V().querySelectorAll('[data-rf]').forEach(x => x.classList.toggle('on', x === b)); draw(b.dataset.rf); });
  $('rnew').onclick = () => go(back ? 'records' : 'test');
  $('rwrong').onclick = () => go('practice', { ids: r.qids.filter(id => QBY[id] && r.answers[id] !== QBY[id].answer), title: 'টেস্টের ভুলগুলো' });
}

// ---------- flashcards ----------
let fDeck = null, fList = [], fIdx = 0, fFlip = false;
function cardsView() {
  if (fDeck) return fShow();
  V().innerHTML = `<div class="card" style="margin-bottom:14px"><h2>ফ্ল্যাশকার্ড — শব্দভাণ্ডার ও মুখস্থের বিষয়</h2><p class="muted">কার্ডে ক্লিক করে উত্তর দেখুন, তারপর 'জানি' বা 'জানি না' দিন। জানা কার্ড ১, ৩, ৭, ১৫ দিন পর আবার আসবে; না-জানা কার্ড সেদিনই ফিরে আসবে।</p></div>
  <div class="grid g3">${DECKS.map(d => { const cs = CARDS.filter(c => c.deck === d.id), seen = cs.filter(c => S.cards[c.id] && S.cards[c.id].seen).length, known = cs.filter(c => S.cards[c.id] && S.cards[c.id].box >= 3).length, due = cs.filter(cardDue).length;
    return `<div class="card"><h3 style="margin-top:0">${esc(d.name)}</h3><p class="muted">${BN(cs.length)}টি কার্ড · দেখা ${BN(seen)} · আয়ত্ত ${BN(known)} · বাকি ${BN(due)}</p>${barHTML(pct(known, cs.length), 'ok')}
    <div class="row" style="margin-top:10px"><button class="btn small primary" data-deck="${d.id}" data-m="new">নতুন ২০টি</button><button class="btn small" data-deck="${d.id}" data-m="due" ${due ? '' : 'disabled'}>রিভিশন (${BN(due)})</button><button class="btn small" data-deck="${d.id}" data-m="all">সব</button><button class="btn small" data-chap="${d.ch}">অধ্যায়</button></div></div>`; }).join('')}</div>`;
  V().querySelectorAll('[data-deck]').forEach(b => b.onclick = () => {
    const cs = CARDS.filter(c => c.deck === b.dataset.deck), m = b.dataset.m;
    fList = m === 'due' ? cs.filter(cardDue) : m === 'new' ? cs.filter(c => !(S.cards[c.id] && S.cards[c.id].seen)).slice(0, 20) : cs;
    if (!fList.length) fList = shuffle(cs).slice(0, 20);
    fList = fList.map(c => c.id); fDeck = b.dataset.deck; fIdx = 0; fFlip = false; fShow();
  });
  V().querySelectorAll('[data-chap]').forEach(b => b.onclick = () => go('guide', { ch: b.dataset.chap }));
}
function fShow() {
  const deck = DECKS.find(d => d.id === fDeck);
  if (fIdx >= fList.length) {
    V().innerHTML = `<div class="card empty"><h2>সেশন শেষ</h2><p>${BN(fList.length)}টি কার্ড দেখা হয়েছে।</p><button class="btn primary" id="fback">ডেকে ফিরুন</button></div>`;
    $('fback').onclick = () => { fDeck = null; cardsView(); }; return;
  }
  const c = CARDS.find(x => x.id === fList[fIdx]), r = S.cards[c.id] || {};
  V().innerHTML = `<div class="card" style="max-width:720px;margin:0 auto"><div class="qhead"><span><span class="pill">${esc(deck.name)}</span><span class="pill">${BN(fIdx + 1)}/${BN(fList.length)}</span>${r.box ? `<span class="pill">বক্স ${BN(r.box)}</span>` : ''}</span><button class="btn small" id="fexit">বন্ধ</button></div>
    <div class="fc" id="fcard" tabindex="0" role="button" aria-label="কার্ড উল্টান"><div><div class="f">${esc(c.f)}</div>${fFlip ? `<div class="b">${esc(c.b)}</div>${c.x ? `<div class="x">${esc(c.x)}</div>` : ''}` : '<div class="x">উত্তর দেখতে ক্লিক করুন (Space)</div>'}</div></div>
    <div class="row" style="justify-content:center;margin-top:10px">${fFlip ? `<button class="btn danger" id="fno">জানি না (1)</button><button class="btn primary" id="fyes">জানি (2)</button>` : `<button class="btn primary" id="fflip">উত্তর দেখুন</button>`}</div></div>`;
  const flip = () => { fFlip = true; fShow(); };
  const rate = ok => { const x = S.cards[c.id] = S.cards[c.id] || { box: 0 }; x.seen = (x.seen || 0) + 1; x.box = ok ? Math.min(5, (x.box || 0) + 1) : 1; x.due = new Date(Date.now() + BOX_DAYS[x.box] * DAY).toISOString(); x.status = x.box >= 4 ? 'mastered' : 'learning'; save(); if (!ok) fList.push(c.id); fIdx++; fFlip = false; fShow(); };
  $('fcard').onclick = () => { if (!fFlip) flip(); };
  if ($('fflip')) $('fflip').onclick = flip;
  if ($('fyes')) { $('fyes').onclick = () => rate(true); $('fno').onclick = () => rate(false); }
  $('fexit').onclick = () => { fDeck = null; cardsView(); };
}
document.addEventListener('keydown', e => {
  if (cur !== 'cards' || !fDeck || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === ' ' && !fFlip) { e.preventDefault(); const b = $('fflip'); if (b) b.click(); }
  else if (fFlip && e.key === '1' && $('fno')) $('fno').click();
  else if (fFlip && e.key === '2' && $('fyes')) $('fyes').click();
});

  V().querySelectorAll('[data-rc]').forEach(b => b.onclick = () => go('guide', { ch: b.dataset.rc }));
}

// ---------- records & settings ----------
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function records() {
  const ts = S.tests.slice().reverse();
  V().innerHTML = `<div class="grid g2"><div class="card"><h2>পরীক্ষার রেকর্ড</h2>${lineChart(S.tests.map(x => x.pct))}
    ${ts.length ? `<div class="tablewrap"><table><thead><tr><th>তারিখ</th><th>পরীক্ষা</th><th>নম্বর</th><th>সঠিক/ভুল/বাদ</th><th>সময়</th><th></th></tr></thead><tbody>${ts.map((r, i) => `<tr><td>${fmtDate(r.at)}</td><td>${esc(r.title)}</td><td><b>${fmtPct(r.pct)}</b></td><td>${BN(r.correct)}/${BN(r.wrong)}/${BN(r.unanswered)}</td><td>${fmtTime(r.timeUsed)}</td><td><button class="btn small" data-rv="${S.tests.length - 1 - i}">দেখুন</button></td></tr>`).join('')}</tbody></table></div>` : ''}</div>
  <div class="card"><h2>সেটিংস</h2>
    <div class="row" style="margin-bottom:10px"><label class="muted">আমার পরীক্ষার তারিখ <input type="date" id="sdate" value="${esc(S.settings.examDate)}"></label></div>
    <div class="row" style="margin-bottom:10px"><label class="muted">নেগেটিভ মার্কিং (প্রতি ভুলে) <select id="sneg">${[0, 0.25, 0.5].map(v => `<option value="${v}" ${S.settings.neg === v ? 'selected' : ''}>${v ? BN(v) : 'নেই'}</option>`).join('')}</select></label>
    <label class="muted">প্রতি প্রশ্নে সময় <select id="ssec">${[36, 45, 51, 60, 72].map(v => `<option value="${v}" ${S.settings.secPerQ === v ? 'selected' : ''}>${BN(v)} সেকেন্ড</option>`).join('')}</select></label></div>
    <p class="muted">পরীক্ষার তারিখ, নেগেটিভ মার্কিং ও সময় সরকারিভাবে ঘোষিত হয়নি; এগুলো আপনার ব্যক্তিগত অনুশীলন-সেটিং।</p>
    <h3>ব্যাকআপ</h3><div class="row"><button class="btn" id="exp">JSON এক্সপোর্ট</button><label class="btn">JSON ইমপোর্ট<input type="file" id="imp" accept="application/json" hidden></label><button class="btn danger" id="reset">সব অগ্রগতি মুছুন</button></div>
    <p class="muted">সাইন-ইন করা থাকলে অগ্রগতি আপনার অ্যাকাউন্টেও সিঙ্ক হয়।</p>
    <h3>এই অংশে যা আছে</h3><p class="muted">${BN(CH.length)}টি অধ্যায় · ${BN(QS.length)}টি এমসিকিউ · ${BN(CARDS.length)}টি ফ্ল্যাশকার্ড (${BN(DECKS.length)}টি ডেক) · ${BN(WR.length)}টি লিখিত অনুশীলন। উৎস ও যাচাইয়ের সীমাবদ্ধতা গাইডের শেষ অধ্যায়ে।</p></div></div>`;
  V().querySelectorAll('[data-rv]').forEach(b => b.onclick = () => showResult(S.tests[+b.dataset.rv], true));
  $('sdate').onchange = e => { S.settings.examDate = e.target.value; save(); };
  $('sneg').onchange = e => { S.settings.neg = +e.target.value; save(); };
  $('ssec').onchange = e => { S.settings.secPerQ = +e.target.value; save(); };
  $('exp').onclick = () => download(`petrobangla-am-progress-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: KEY, exported: new Date().toISOString(), state: S }, null, 1), 'application/json');
  $('imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { const d = JSON.parse(t); if (d.app !== KEY || !d.state) throw new Error('ফাইলটি এই অংশের নয়'); if (!confirm('বর্তমান অগ্রগতি ফাইলের তথ্য দিয়ে প্রতিস্থাপিত হবে। নিশ্চিত?')) return; S = d.state; save(); location.reload(); }).catch(err => alert('ইমপোর্ট ব্যর্থ: ' + err.message)); };
  $('reset').onclick = () => { if (!confirm('এই অংশের সব অগ্রগতি (উত্তর, পড়া, কার্ড, পরীক্ষা) মুছে যাবে। নিশ্চিত?')) return; S = { v: 1, questions: {}, readChapters: {}, cards: {}, written: {}, tests: [], settings: S.settings }; save(); go('home'); };
}

window.addEventListener('beforeunload', () => { if (running && !running.done) persistDraft(); });
tabs(); home();
})();

</script>
</body>
</html>
