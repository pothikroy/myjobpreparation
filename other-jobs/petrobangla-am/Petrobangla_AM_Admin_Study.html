ke Manasarovar, Tibet; enters at Kurigram<\/td><\/tr><tr><td>Karnaphuli<\/td><td>rises in the Lushai Hills, Mizoram; Kaptai dam and hydro station (230 MW, the only hydropower plant); Chattogram port; Karnaphuli tunnel<\/td><\/tr><tr><td>Teesta<\/td><td>enters at Nilphamari; Teesta Barrage at Lalmonirhat<\/td><\/tr><tr><td><b>Buriganga<\/b><\/td><td>a branch of the <b>Dhaleshwari<\/b> — <span class=\"tg tg-actual\">ACTUAL: GTCL 2021<\/span>; Dhaka stands on it<\/td><\/tr><tr><td>Others<\/td><td>Sangu and Matamuhuri rise inside/near Bangladesh; Halda is the natural carp-breeding river; Naf separates Bangladesh from Myanmar; Gorai, Madhumati, Rupsha, Pasur in the south-west<\/td><\/tr><tr><td>Cities and rivers<\/td><td>Dhaka — Buriganga; Chattogram — Karnaphuli; Khulna — Rupsha/Bhairab; Rajshahi — Padma; Sylhet — Surma; Barishal — Kirtankhola; Mymensingh — old Brahmaputra; Cumilla — Gomti; Bogura — Karatoya; Mongla port — Pasur<\/td><\/tr><\/table><\/div><ul><li>Farakka Barrage is on the Ganges, about 16–18 km upstream of the border; the Ganges Water Treaty was signed on 12 December 1996 for 30 years and <b>expires in December 2026<\/b> — a live current-affairs topic.<\/li><li>57 trans-boundary rivers are usually cited: 54 with India, 3 with Myanmar.<\/li><\/ul><h3 id=\"c30-s3\">29.3 Ports, bridges and infrastructure<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Facts<\/th><\/tr><tr><td>Sea ports<\/td><td>Chattogram (principal), Mongla (1950), Payra (2016); deep-sea port under construction at Matarbari, Maheshkhali<\/td><\/tr><tr><td>Land ports<\/td><td>Benapole (largest), Sonamasjid, <b>Hili<\/b> <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>, Burimari, Akhaura, Tamabil, Banglabandha (links with India, Nepal and Bhutan), Bhomra, Teknaf (with Myanmar)<\/td><\/tr><tr><td>Airports<\/td><td>Hazrat Shahjalal (Dhaka), Shah Amanat (Chattogram), Osmani (Sylhet) are the long-established international airports<\/td><\/tr><tr><td>Padma Bridge<\/td><td>6.15 km; road above, rail below; opened 25 June 2022; own financing<\/td><\/tr><tr><td>Karnaphuli Tunnel<\/td><td>first under-river road tunnel in South Asia; opened October 2023<\/td><\/tr><tr><td>Rooppur Nuclear Power Plant<\/td><td>Pabna; two VVER-1200 units, 2,400 MW; built with Russia (Rosatom)<\/td><\/tr><tr><td>Major coal power plants<\/td><td>Rampal (<b>Maitree Super Thermal Power Project<\/b>, 1,320 MW, Bagerhat; joint venture with India's NTPC) — <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span>; Payra (1,320 MW); Matarbari (1,200 MW); Banshkhali<\/td><\/tr><tr><td>Economic zones<\/td><td>Mirsarai–Sitakunda–Sonagazi national special economic zone, <b>Chattogram<\/b> — <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021 asked its location under its earlier name<\/span><\/td><\/tr><tr><td>Export processing zones<\/td><td>the first EPZ was Chattogram (1983)<\/td><\/tr><tr><td>Tannery<\/td><td>the leather industrial estate is at <b>Savar<\/b> (moved from Hazaribagh in 2017). <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021 asked where the \"first tannery village\" was established; one solution book answers Narayanganj on the ground that the first tannery was set up there in 1940. The relocated tannery estate is at Savar — treat the item as disputed.<\/span><\/td><\/tr><tr><td>India–Bangladesh Friendship Pipeline<\/td><td>131.5 km diesel pipeline from Siliguri (Numaligarh Refinery's terminal) to <b>Parbatipur, Dinajpur<\/b>; inaugurated 18 March 2023 — <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><\/tr><\/table><\/div><h3 id=\"c30-s4\">29.4 Economy — structure<\/h3><ul><li><b>Fiscal year:<\/b> 1 July to 30 June. The budget is presented in June by the Finance Minister.<\/li><li><b>Sectors of GDP:<\/b> services (about half), industry (about a third and rising), agriculture (about 11–12%). Agriculture still employs the largest share of the labour force.<\/li><li><b>Exports:<\/b> ready-made garments earn about four-fifths of export income; Bangladesh is the second-largest garment exporter after China. <b>Accord and Alliance<\/b> were the two foreign buyers' platforms formed after the Rana Plaza collapse (24 April 2013) to inspect <b>garment<\/b> factories — <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span>.<\/li><li><b>Remittance<\/b> from migrant workers is the second pillar of foreign exchange; Saudi Arabia, the UAE, the USA and the UK are leading sources.<\/li><li><b>Central bank:<\/b> Bangladesh Bank (established 1972 under P.O. 127). Currency notes are issued by Bangladesh Bank; one- and two-taka notes and coins by the Ministry of Finance.<\/li><li><b>Stock exchanges:<\/b> Dhaka (DSE) and Chattogram (CSE); regulator BSEC. A rising market is <b>bullish<\/b>, a falling one bearish — <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span>.<\/li><li><b>Pragoti Industries Ltd<\/b> (Chattogram, state-owned) assembles Japanese vehicles such as Mitsubishi — <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span>.<\/li><li><b>Eastern Refinery Limited<\/b> (Chattogram) is the only state-owned oil refinery — <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>.<\/li><li><b>Development planning:<\/b> five-year plans (the Eighth ran 2020–25); Perspective Plan 2021–2041; Delta Plan 2100. The Planning Commission prepares plans; NEC/ECNEC approve.<\/li><\/ul><h3 id=\"c30-s5\">29.5 Economy — current figures (dated)<\/h3><p>Use these only with their dates; replace them if newer figures are published.<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Indicator<\/th><th>Figure<\/th><th>Source and date<\/th><\/tr><tr><td>Per capita income<\/td><td>US$ 3,020 (first time above $3,000; previous year $2,769)<\/td><td>BBS provisional estimate for FY2025-26, released 10 June 2026<\/td><\/tr><tr><td>GDP growth<\/td><td>4.14% (previous year 3.49%)<\/td><td>same<\/td><\/tr><tr><td>Size of GDP<\/td><td>about US$ 501 billion<\/td><td>same, as reported in the press<\/td><\/tr><tr><td>National budget FY2026-27<\/td><td>Tk 9,38,000 crore; deficit Tk 2,43,000 crore (3.6% of GDP)<\/td><td>presented June 2026 by Finance Minister Amir Khosru Mahmud Chowdhury<\/td><\/tr><tr><td>LDC graduation<\/td><td><b>deferred by three years, from 24 November 2026 to 24 November 2029<\/b><\/td><td>UN General Assembly resolution, 2026 (ECOSOC decision 21 July 2026)<\/td><\/tr><\/table><\/div><div class=\"bx bx-warn\"><div class=\"bxh\">CAUTION: LDC graduation — old questions, new answer<\/div><p class=\"\">Titas 2021 asked \"Bangladesh is scheduled to officially become a developing country in —\" and the answer then was 2026. Since the 2026 deferral the scheduled date is <b>24 November 2029<\/b>. The three criteria remain: GNI per capita, the Human Assets Index and the Economic and Environmental Vulnerability Index; the Committee for Development Policy (CDP) reviews them every three years. BGFCL 2021 asked the income threshold; the key gave $1,230 (the 2018 review figure), and the threshold is revised at each review.<\/p><\/div><h3 id=\"c30-s6\">29.6 Mineral and energy resources (overview)<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Resource<\/th><th>Where<\/th><\/tr><tr><td>Natural gas<\/td><td>the main commercial fuel; fields mostly in Sylhet, Brahmanbaria, Habiganj, Cumilla, Bhola (details in Chapter 35)<\/td><\/tr><tr><td>Coal<\/td><td>Barapukuria (Dinajpur) — the only producing mine; Jamalganj (Joypurhat) — the largest deposit, <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>; Phulbari, Khalaspir, Dighipara<\/td><\/tr><tr><td>Hard rock<\/td><td>Maddhapara, Dinajpur<\/td><\/tr><tr><td>Limestone<\/td><td>Jaflong, Takerghat (Sylhet), St Martin's, Jaipurhat<\/td><\/tr><tr><td>White clay (china clay)<\/td><td>Bijoypur (Netrokona), Sherpur<\/td><\/tr><tr><td>Glass sand<\/td><td>Balijuri (Sherpur), Shahjibazar (Habiganj), Chauddagram (Cumilla)<\/td><\/tr><tr><td>Oil<\/td><td>Haripur, Sylhet (discovered 1986; production stopped 1994)<\/td><\/tr><tr><td>Black gold (heavy mineral sands: zircon, monazite, ilmenite)<\/td><td>Cox's Bazar beach<\/td><\/tr><tr><td>Peat<\/td><td>Gopalganj, Khulna, Madaripur<\/td><\/tr><\/table><\/div><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 29<\/div><p class=\"li\">Five Indian border states: West Bengal, Assam, Meghalaya, Tripura, Mizoram. Not Manipur.<\/p><p class=\"li\">Buriganga ← Dhaleshwari. Karnaphuli → Kaptai hydro. Halda → natural carp breeding.<\/p><p class=\"li\">Hili, Benapole, Burimari = land ports. Maitree power plant = Rampal. Friendship Pipeline → Parbatipur.<\/p><p class=\"li\">Accord and Alliance → garments. Eastern Refinery = the state refinery. Jamalganj → coal.<\/p><p class=\"li\">Dated figures: per capita income $3,020 (FY26, provisional); budget FY27 Tk 9.38 lakh crore; LDC graduation moved to 24 November 2029.<\/p><\/div>"},{"id":"c31","no":30,"part":"PART E — GENERAL KNOWLEDGE","title":"Chapter 30: International Organisations and Agreements","short":"International Organisations and Agreements","toc":[["c31-s1","30.1 The United Nations"],["c31-s2","30.2 Economic and financial institutions"],["c31-s3","30.3 Regional and political organisations"],["c31-s4","30.4 Treaties and agreements"],["c31-s5","30.5 Climate conferences"]],"html":"<h3 id=\"c31-s1\">30.1 The United Nations<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Fact<\/th><\/tr><tr><td>Founded<\/td><td>24 October 1945 (UN Day); Charter signed at San Francisco, 26 June 1945; name coined by Franklin D. Roosevelt<\/td><\/tr><tr><td>Headquarters<\/td><td>New York; European office Geneva<\/td><\/tr><tr><td>Members<\/td><td>193 (latest: South Sudan, 2011); observers: the Holy See and Palestine<\/td><\/tr><tr><td>Official languages<\/td><td>6: Arabic, Chinese, English, French, Russian, Spanish<\/td><\/tr><tr><td>Principal organs<\/td><td>General Assembly; Security Council; Economic and Social Council (ECOSOC, 54 members); Trusteeship Council (inactive since 1994); International Court of Justice (The Hague; 15 judges, 9-year terms); Secretariat<\/td><\/tr><tr><td>Security Council<\/td><td>15 members: 5 permanent with veto (China, France, Russia, UK, USA) + 10 elected for two years<\/td><\/tr><tr><td>Secretary-General<\/td><td>António Guterres (Portugal) since 1 January 2017; his second term ends on 31 December 2026 — the choice of his successor is a current-affairs item<\/td><\/tr><tr><td>Bangladesh<\/td><td>136th member, 17 September 1974; twice a non-permanent member of the Security Council (1979–80, 2000–01); Humayun Rasheed Choudhury presided over the 41st General Assembly (1986); a leading contributor to peacekeeping<\/td><\/tr><\/table><\/div><h4>UN agencies and related bodies<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Body<\/th><th>Full name / work<\/th><th>Headquarters<\/th><th>Founded<\/th><\/tr><tr><td>UNESCO<\/td><td>Educational, Scientific and Cultural Organization<\/td><td><b>Paris<\/b> — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><td>1945<\/td><\/tr><tr><td>UNICEF<\/td><td>Children's Fund<\/td><td>New York<\/td><td>1946<\/td><\/tr><tr><td>UNHCR<\/td><td>High Commissioner for <b>Refugees<\/b> — <span class=\"tg tg-actual\">ACTUAL: SGFL 2021<\/span><\/td><td>Geneva<\/td><td>1950<\/td><\/tr><tr><td>UNDP<\/td><td>Development Programme; publishes the Human Development Report<\/td><td>New York<\/td><td>1965<\/td><\/tr><tr><td>UNEP<\/td><td>Environment Programme<\/td><td>Nairobi<\/td><td>1972<\/td><\/tr><tr><td>UNFPA<\/td><td>Population Fund<\/td><td>New York<\/td><td>1969<\/td><\/tr><tr><td>WHO<\/td><td>World Health Organization<\/td><td>Geneva<\/td><td>1948<\/td><\/tr><tr><td>ILO<\/td><td>International Labour Organization<\/td><td>Geneva<\/td><td>1919<\/td><\/tr><tr><td>FAO<\/td><td>Food and Agriculture Organization<\/td><td>Rome<\/td><td>1945<\/td><\/tr><tr><td>WFP, IFAD<\/td><td>World Food Programme; agricultural development fund<\/td><td>Rome<\/td><td>1961, 1977<\/td><\/tr><tr><td>IAEA<\/td><td>International Atomic Energy Agency<\/td><td><b>Vienna, Austria<\/b> — <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span><\/td><td>1957<\/td><\/tr><tr><td>IMO<\/td><td>International Maritime Organization<\/td><td>London<\/td><td>1948<\/td><\/tr><tr><td>ICAO<\/td><td>International Civil Aviation Organization<\/td><td>Montreal<\/td><td>1944<\/td><\/tr><tr><td>ITU, UPU<\/td><td>telecommunication; postal union<\/td><td>Geneva; Berne<\/td><td>1865; 1874<\/td><\/tr><tr><td>WIPO, WMO<\/td><td>intellectual property; meteorology<\/td><td>Geneva<\/td><td>1967; 1950<\/td><\/tr><tr><td>UNCTAD<\/td><td>trade and development<\/td><td>Geneva<\/td><td>1964<\/td><\/tr><tr><td>UNIDO<\/td><td>industrial development<\/td><td>Vienna<\/td><td>1966<\/td><\/tr><tr><td>ESCAP<\/td><td>Economic and Social Commission for Asia and the Pacific<\/td><td><b>Bangkok<\/b> — <span class=\"tg tg-actual\">ACTUAL: GTCL 2021<\/span><\/td><td>1947<\/td><\/tr><tr><td>IPCC<\/td><td>Intergovernmental Panel on Climate Change (UNEP + WMO) — the body \"concerned with environmental issues\" in <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><td>Geneva<\/td><td>1988<\/td><\/tr><\/table><\/div><div class=\"bx bx-mem\"><div class=\"bxh\">MEMORY AID: Headquarters in clusters<\/div><p class=\"\"><b>Geneva:<\/b> WHO, ILO, WTO, UNHCR, ITU, WIPO, WMO, UNCTAD, Red Cross. <b>Rome:<\/b> FAO, WFP, IFAD (\"food in Rome\"). <b>Vienna:<\/b> IAEA, UNIDO, OPEC. <b>Washington:<\/b> World Bank, IMF. <b>Paris:<\/b> UNESCO, OECD. <b>Nairobi:<\/b> UNEP, UN-Habitat. <b>The Hague:<\/b> ICJ, ICC, OPCW.<\/p><\/div><h3 id=\"c31-s2\">30.2 Economic and financial institutions<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Body<\/th><th>Facts<\/th><th>Headquarters<\/th><\/tr><tr><td>World Bank Group<\/td><td>IBRD (1944, Bretton Woods), IDA (soft loans, 1960), IFC, <b>MIGA<\/b>, ICSID; 189 members; publishes the World Development Report<\/td><td>Washington, DC<\/td><\/tr><tr><td>IMF<\/td><td>1944; 191 members; unit of account SDR; publishes the World Economic Outlook; Bangladesh has a US$ 4.7 billion programme approved in January 2023 (later enlarged)<\/td><td>Washington, DC<\/td><\/tr><tr><td>WTO<\/td><td>replaced GATT on 1 January 1995; 166 members; highest body the Ministerial Conference<\/td><td>Geneva<\/td><\/tr><tr><td>ADB<\/td><td>1966; Bangladesh joined 1973<\/td><td>Manila<\/td><\/tr><tr><td><b>AIIB<\/b><\/td><td>Asian Infrastructure Investment Bank; began work in 2016 — \"the latest multilateral development bank\" in <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span><\/td><td>Beijing<\/td><\/tr><tr><td>NDB (BRICS bank)<\/td><td>2015; Bangladesh joined 2021<\/td><td>Shanghai<\/td><\/tr><tr><td>IsDB<\/td><td>Islamic Development Bank, 1975<\/td><td>Jeddah<\/td><\/tr><\/table><\/div><h3 id=\"c31-s3\">30.3 Regional and political organisations<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Body<\/th><th>Facts<\/th><th>Headquarters<\/th><\/tr><tr><td>SAARC<\/td><td>founded 8 December 1985, Dhaka; 8 members (Afghanistan joined 2007); Secretariat opened 1987<\/td><td>Kathmandu<\/td><\/tr><tr><td>BIMSTEC<\/td><td>1997 (Bangkok Declaration); 7 members: Bangladesh, Bhutan, India, Myanmar, Nepal, Sri Lanka, Thailand<\/td><td>Dhaka<\/td><\/tr><tr><td><b>ASEAN<\/b><\/td><td>Association of Southeast Asian Nations, 8 August 1967 (Bangkok Declaration); founders Indonesia, Malaysia, Philippines, Singapore, Thailand; later Brunei, Vietnam, Laos, Myanmar, Cambodia; Timor-Leste admitted as the 11th member in October 2025. <b>China is not a member<\/b> — <span class=\"tg tg-repeated\">REPEATED: PB 2011 (full form), PB 2024<\/span><\/td><td>Jakarta<\/td><\/tr><tr><td>OIC<\/td><td>1969 (after the Al-Aqsa fire); 57 members; Bangladesh joined 1974 (Lahore summit)<\/td><td>Jeddah<\/td><\/tr><tr><td>European Union<\/td><td>created by the <b>Maastricht Treaty<\/b> (signed 7 February 1992; in force 1 November 1993) — <span class=\"tg tg-actual\">ACTUAL: GTCL 2021<\/span>; 27 members after Brexit (31 January 2020); the euro is used by 20 members — 21 from January 2026 with Bulgaria — and by some non-EU states <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021, written<\/span><\/td><td>Brussels<\/td><\/tr><tr><td>NATO<\/td><td>4 April 1949, Washington Treaty; Article 5 collective defence; 32 members: Finland joined April 2023, <b>Sweden became the 32nd on 7 March 2024<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span><\/td><td>Brussels<\/td><\/tr><tr><td>Commonwealth<\/td><td>56 members; Bangladesh joined 1972<\/td><td>London<\/td><\/tr><tr><td>NAM<\/td><td>Non-Aligned Movement, Belgrade 1961; Bangladesh joined 1973<\/td><td>—<\/td><\/tr><tr><td>G7<\/td><td>Canada, France, Germany, Italy, Japan, UK, USA<\/td><td>—<\/td><\/tr><tr><td>G20<\/td><td>19 countries + EU + African Union<\/td><td>—<\/td><\/tr><tr><td>BRICS<\/td><td>Brazil, Russia, India, China, South Africa; enlarged from 2024 (Egypt, Ethiopia, Iran, UAE, Indonesia and others)<\/td><td>—<\/td><\/tr><tr><td>D-8<\/td><td>eight developing Muslim countries, 1997; Bangladesh is a member<\/td><td>Istanbul<\/td><\/tr><tr><td><b>OPEC<\/b><\/td><td>14 September 1960, Baghdad; founders Iran, Iraq, Kuwait, Saudi Arabia, Venezuela; coordinates oil output and so \"controls the price of crude oil\" — <span class=\"tg tg-repeated\">REPEATED: Titas 2021, BGFCL 2021, GTCL 2021<\/span>. Indonesia's membership is suspended and Malaysia was never a member<\/td><td>Vienna<\/td><\/tr><tr><td>APEC<\/td><td>Asia-Pacific Economic Cooperation, 1989<\/td><td>Singapore<\/td><\/tr><tr><td>SCO<\/td><td>Shanghai Cooperation Organisation, 2001<\/td><td>Beijing<\/td><\/tr><tr><td>Arab League<\/td><td>1945<\/td><td>Cairo<\/td><\/tr><tr><td>African Union<\/td><td>2002 (successor to the OAU)<\/td><td>Addis Ababa<\/td><\/tr><tr><td>Amnesty International<\/td><td>human rights; 1961; Nobel Peace Prize 1977<\/td><td>London<\/td><\/tr><tr><td>Interpol<\/td><td>international police cooperation<\/td><td>Lyon<\/td><\/tr><tr><td>Red Cross (ICRC)<\/td><td>founded by Henry Dunant, 1863<\/td><td>Geneva<\/td><\/tr><\/table><\/div><h3 id=\"c31-s4\">30.4 Treaties and agreements<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Treaty<\/th><th>Purpose and date<\/th><\/tr><tr><td>NPT<\/td><td>Nuclear Non-Proliferation Treaty, 1968 (in force 1970)<\/td><\/tr><tr><td><b>CTBT<\/b><\/td><td>Comprehensive Nuclear-Test-Ban Treaty, 1996 — bans all nuclear explosions; <span class=\"tg tg-actual\">ACTUAL: GTCL 2021<\/span><\/td><\/tr><tr><td>SALT I and II<\/td><td>US–Soviet Strategic Arms Limitation Talks, 1972 and 1979<\/td><\/tr><tr><td><b>START-2<\/b><\/td><td>Strategic Arms Reduction Treaty, signed in Moscow, January 1993 (Bush–Yeltsin) — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span><\/td><\/tr><tr><td><b>Montreal Protocol<\/b><\/td><td>1987; protects the <b>ozone layer<\/b> by phasing out CFCs — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td>Kyoto Protocol<\/td><td>1997 (in force 2005); binding greenhouse-gas cuts for developed countries<\/td><\/tr><tr><td><b>Paris Agreement<\/b><\/td><td>adopted at <b>COP21, Paris<\/b>, 12 December 2015 — <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span>; limit warming to well below 2 °C, pursuing 1.5 °C<\/td><\/tr><tr><td>Rio Earth Summit<\/td><td>1992; UNFCCC, Convention on Biological Diversity, Agenda 21<\/td><\/tr><tr><td>Ramsar Convention<\/td><td>1971; wetlands (Sundarbans, Tanguar Haor are Ramsar sites)<\/td><\/tr><tr><td>Basel Convention<\/td><td>1989; hazardous waste<\/td><\/tr><tr><td>UNCLOS<\/td><td>UN Convention on the Law of the Sea, 1982<\/td><\/tr><tr><td>Geneva Conventions<\/td><td>1949; humanitarian law in war<\/td><\/tr><tr><td>Simla Agreement<\/td><td>India–Pakistan, 1972<\/td><\/tr><tr><td>Camp David Accords<\/td><td>Egypt–Israel, 1978<\/td><\/tr><tr><td>Dayton Accord<\/td><td>Bosnia, 1995<\/td><\/tr><tr><td>Good Friday Agreement<\/td><td>Northern Ireland, 1998<\/td><\/tr><tr><td><b>Sunshine Policy<\/b><\/td><td>South Korea's policy of engagement with North Korea (Kim Dae-jung, 1998) — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span><\/td><\/tr><tr><td><b>SDGs<\/b><\/td><td>17 Sustainable Development Goals, 169 targets, adopted September 2015, period 2016–<b>2030<\/b> — <span class=\"tg tg-repeated\">REPEATED: Titas 2021, BAPEX 2023<\/span>; SDG 7 is \"Affordable and Clean Energy\"<\/td><\/tr><tr><td>MDGs<\/td><td>8 Millennium Development Goals, 2000–2015<\/td><\/tr><\/table><\/div><h3 id=\"c31-s5\">30.5 Climate conferences<\/h3><p>COP = Conference of the Parties to the UNFCCC. COP21 Paris (2015); COP26 Glasgow (2021); COP27 Sharm el-Sheikh (2022; loss and damage fund); COP28 Dubai (2023; \"transitioning away from fossil fuels\"); COP29 Baku (2024; new finance goal of US$ 300 billion a year by 2035); COP30 Belém, Brazil (November 2025). The <b>Climate Vulnerable Forum<\/b> (2009) groups the countries most at risk; Bangladesh chaired it in 2011–13 and 2020–22 — <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>.<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 30<\/div><p class=\"li\">UN: 24 October 1945; 193 members; 6 languages; 5 permanent members.<\/p><p class=\"li\">UNESCO Paris; IAEA and OPEC Vienna; ESCAP Bangkok; UNHCR Geneva; SAARC Kathmandu; BIMSTEC Dhaka; ASEAN Jakarta; OIC Jeddah.<\/p><p class=\"li\">EU ← Maastricht. NATO: 32 members, Sweden the latest. ASEAN: China is not a member.<\/p><p class=\"li\">Montreal → ozone; Kyoto and Paris → climate; CTBT → nuclear tests; COP21 → Paris.<\/p><p class=\"li\">SDGs: 17 goals, 169 targets, by 2030.<\/p><\/div>"},{"id":"c32","no":31,"part":"PART E — GENERAL KNOWLEDGE","title":"Chapter 31: General Science","short":"General Science","toc":[["c32-s1","31.1 What is asked"],["c32-s2","31.2 Measuring instruments"],["c32-s3","31.3 Physics"],["c32-s4","31.4 Chemistry"],["c32-s5","31.5 Biology and the human body"],["c32-s6","31.6 Earth, environment and space"],["c32-s7","31.7 Inventions and discoveries"]],"html":"<h3 id=\"c32-s1\">31.1 What is asked<\/h3><p>Twenty science questions appear in the database; almost all are single facts from school science. They fall into five groups: measuring instruments, the human body and disease, light–heat–sound, everyday chemistry, and environment and space.<\/p><h3 id=\"c32-s2\">31.2 Measuring instruments<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Instrument<\/th><th>Measures<\/th><th>Instrument<\/th><th>Measures<\/th><\/tr><tr><td><b>Hygrometer<\/b><\/td><td>humidity — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span><\/td><td><b>Seismograph<\/b><\/td><td>earthquakes — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span><\/td><\/tr><tr><td>Barometer<\/td><td>atmospheric pressure<\/td><td>Hydrometer<\/td><td>density of liquids<\/td><\/tr><tr><td>Sphygmomanometer<\/td><td>blood pressure<\/td><td>Lactometer<\/td><td>purity of milk<\/td><\/tr><tr><td>Thermometer<\/td><td>temperature<\/td><td>Anemometer<\/td><td>wind speed<\/td><\/tr><tr><td>Altimeter<\/td><td>altitude<\/td><td>Fathometer<\/td><td>depth of the sea<\/td><\/tr><tr><td>Ammeter<\/td><td>electric current<\/td><td>Voltmeter<\/td><td>potential difference<\/td><\/tr><tr><td>Galvanometer<\/td><td>small currents<\/td><td>Odometer<\/td><td>distance travelled<\/td><\/tr><tr><td>Speedometer<\/td><td>speed of a vehicle<\/td><td>Tachometer<\/td><td>rotational speed<\/td><\/tr><tr><td>Rain gauge<\/td><td>rainfall<\/td><td>Sextant<\/td><td>angular height of stars (navigation)<\/td><\/tr><tr><td>Manometer<\/td><td>gas pressure<\/td><td>Audiometer<\/td><td>hearing<\/td><\/tr><tr><td>Stethoscope<\/td><td>heart and lung sounds<\/td><td>Richter scale<\/td><td>magnitude of earthquakes<\/td><\/tr><tr><td>Chronometer<\/td><td>accurate time at sea<\/td><td>Pyrometer<\/td><td>very high temperatures<\/td><\/tr><\/table><\/div><div class=\"bx bx-mem\"><div class=\"bxh\">MEMORY AID: Three look-alikes<\/div><p class=\"\"><b>Hygro<\/b>meter — humidity (আর্দ্রতা); <b>hydro<\/b>meter — density of liquids; <b>baro<\/b>meter — air pressure. The 2024 paper put all three in the options.<\/p><\/div><h3 id=\"c32-s3\">31.3 Physics<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Facts<\/th><\/tr><tr><td>Units<\/td><td>SI base units: metre, kilogram, second, ampere, kelvin, mole, candela. Force — newton; work/energy — joule; power — watt (1 horsepower = 746 W); pressure — pascal; frequency — hertz; charge — coulomb; resistance — ohm. <b>Light year is a unit of distance<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span> (about 9.46 × 10¹² km)<\/td><\/tr><tr><td>Newton's laws<\/td><td>inertia; F = ma; action and reaction. Newton wrote <i>Philosophiae Naturalis Principia Mathematica<\/i> (1687) — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span><\/td><\/tr><tr><td>Light<\/td><td>speed 3 × 10⁸ m/s; sunlight reaches the earth in about 8 minutes 20 seconds; <b>primary colours of light: red, green, blue<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>; in the spectrum (VIBGYOR) violet has the shortest wavelength and bends most, red the longest; the sky is blue because of scattering<\/td><\/tr><tr><td>Sound<\/td><td>cannot travel in a vacuum; <b>speed is lowest in gases<\/b>, higher in liquids, highest in solids — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>; in air about 332 m/s at 0 °C; audible range 20–20,000 Hz; echo needs about 17 m<\/td><\/tr><tr><td>Heat<\/td><td>conduction, convection, radiation. <b>A black surface absorbs and radiates heat best<\/b>, so tea cools fastest in a black cup — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>; white reflects. Water is densest at 4 °C. <b>Ice occupies more volume than the water it melts into, so on melting the volume decreases<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span><\/td><\/tr><tr><td>Evaporation<\/td><td>slower when the air is humid: <b>in the rainy season wet clothes dry slowly because the air holds much water vapour<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span><\/td><\/tr><tr><td>Temperature scales<\/td><td>C/5 = (F − 32)/9 = (K − 273)/5; −40° is the same on Celsius and Fahrenheit; normal body temperature 98.4 °F (about 37 °C)<\/td><\/tr><tr><td>Electricity<\/td><td>Ohm's law V = IR; household supply in Bangladesh 220 V, 50 Hz AC; a fuse has a low melting point; the commercial unit is the kilowatt-hour<\/td><\/tr><tr><td>Ultraviolet rays<\/td><td>UV-A (longest wavelength, reaches the ground), UV-B (causes sunburn; largely absorbed by ozone), <b>UV-C (shortest wavelength, most energetic and most harmful<\/b>; fully absorbed by the atmosphere) — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span><\/td><\/tr><tr><td>Radioactivity<\/td><td>discovered by Henri Becquerel; alpha, beta, gamma rays; nuclear power uses fission of uranium-235<\/td><\/tr><\/table><\/div><h3 id=\"c32-s4\">31.4 Chemistry<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Facts<\/th><\/tr><tr><td>Matter<\/td><td>three common states; plasma is the fourth. Lightest element and gas: hydrogen; lightest metal: lithium; liquid metal: mercury; liquid non-metal: bromine; hardest natural substance: <b>diamond — an allotrope of carbon, not a metal<\/b> <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span><\/td><\/tr><tr><td>Air<\/td><td>nitrogen about 78%, oxygen about 21%, argon 0.93%, carbon dioxide about 0.04%<\/td><\/tr><tr><td>Water<\/td><td>H₂O; hard water contains calcium and magnesium salts; pH of pure water 7 (below 7 acidic, above 7 alkaline)<\/td><\/tr><tr><td>Common compounds<\/td><td>table salt NaCl; baking soda NaHCO₃; washing soda Na₂CO₃; caustic soda NaOH; bleaching powder Ca(OCl)Cl; limestone/marble CaCO₃; quicklime CaO; vinegar is acetic acid; lemon has citric acid; laughing gas N₂O; dry ice is solid CO₂; urea CO(NH₂)₂<\/td><\/tr><tr><td>Fuels<\/td><td><b>natural gas is mainly methane (CH₄)<\/b>; LPG is propane and butane; CNG is compressed natural gas; biogas is mainly methane<\/td><\/tr><tr><td>Alloys<\/td><td>brass = copper + zinc; bronze = copper + tin; steel = iron + carbon; stainless steel adds chromium and nickel<\/td><\/tr><tr><td>Greenhouse gases<\/td><td>CO₂, methane, nitrous oxide, CFCs, water vapour. CFCs destroy the ozone layer<\/td><\/tr><\/table><\/div><h3 id=\"c32-s5\">31.5 Biology and the human body<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Facts<\/th><\/tr><tr><td>Cell<\/td><td>the unit of life; mitochondria are the \"powerhouse\"; DNA carries heredity (double helix — Watson and Crick, 1953)<\/td><\/tr><tr><td>Blood<\/td><td>red cells carry oxygen with <b>haemoglobin, an iron-containing protein<\/b> — a protein-rich diet helps its production <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>; white cells fight infection; platelets and <b>vitamin K help clotting<\/b> — <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span>. Universal donor: O negative; universal recipient: AB positive<\/td><\/tr><tr><td>Organs<\/td><td>largest organ: skin; largest gland: liver; longest bone: femur; smallest bone: stapes (ear); 206 bones in an adult; normal blood pressure 120/80 mm Hg; heart has four chambers<\/td><\/tr><tr><td>Vitamins<\/td><td>A — night blindness; B₁ — beriberi; B₁₂ — anaemia; C — scurvy; D — rickets (sunlight); E — fertility; K — clotting. A, D, E, K are fat-soluble<\/td><\/tr><tr><td>Minerals<\/td><td>iron — haemoglobin; iodine — goitre; calcium and <b>phosphorus — bones and teeth<\/b> <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span><\/td><\/tr><tr><td>Diseases<\/td><td>bacterial: tuberculosis, typhoid, cholera, tetanus, diphtheria, leprosy; viral: smallpox, measles, mumps, polio, influenza, dengue, AIDS, Covid-19, mpox; protozoan: malaria (female Anopheles); dengue is carried by Aedes<\/td><\/tr><tr><td>Photosynthesis<\/td><td>6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂; needs chlorophyll<\/td><\/tr><tr><td>Others<\/td><td>a <b>pearl is formed in an oyster as a response to irritation<\/b> <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>; insulin (pancreas) controls blood sugar; the jute genome was decoded by a team led by <b>Dr Maqsudul Alam<\/b> (2010) <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span><\/td><\/tr><\/table><\/div><div class=\"bx bx-warn\"><div class=\"bxh\">CAUTION: A disputed 2024 question<\/div><p class=\"\">\"Which is not a contagious disease? Smallpox / Typhoid / Tuberculosis / Mumps / None.\" Smallpox, tuberculosis and mumps pass directly from person to person. Typhoid spreads through contaminated food and water rather than by contact, so the best single answer is <b>typhoid<\/b>; but typhoid is still an infectious, communicable disease, and at least one answer key marks \"None\". Know the reasoning; either key may be met.<\/p><\/div><h3 id=\"c32-s6\">31.6 Earth, environment and space<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Facts<\/th><\/tr><tr><td>Earth<\/td><td>third planet; one rotation 23 h 56 min; one revolution 365¼ days; tilt 23.5°. <b>Day and night are equal on 21 March and 23 September<\/b> (equinoxes) — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>; longest day 21 June, shortest 22 December (northern hemisphere)<\/td><\/tr><tr><td>Earthquakes<\/td><td>caused mainly by the <b>movement of tectonic plates<\/b> — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span>; measured by seismograph on the Richter scale; the focus is underground and the epicentre lies above it<\/td><\/tr><tr><td>Atmosphere<\/td><td>troposphere (weather), stratosphere (ozone layer), mesosphere, thermosphere/ionosphere (reflects radio waves), exosphere<\/td><\/tr><tr><td>Solar system<\/td><td>8 planets; largest Jupiter; smallest and nearest the sun Mercury; hottest Venus; red planet Mars; Saturn has the rings; Pluto reclassified as a dwarf planet in 2006<\/td><\/tr><tr><td>Space<\/td><td>first satellite Sputnik-1 (1957); first man in space Yuri Gagarin (1961); first on the moon Neil Armstrong (Apollo 11, 20 July 1969); Hubble telescope 1990; James Webb telescope 2021. <b>Stephen Hawking<\/b> is best known for work on <b>black holes<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span>. <b>UFO<\/b> = Unidentified Flying Object — <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span>. Boeing's crew spacecraft is <b>Starliner<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>; SpaceX's is Crew Dragon<\/td><\/tr><tr><td>Environment days<\/td><td>World Environment Day <b>5 June<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>; Earth Day 22 April; Ozone Day 16 September; Water Day 22 March<\/td><\/tr><tr><td>Energy<\/td><td>renewable: solar, wind, hydro, biomass, geothermal, tidal; non-renewable: coal, oil, gas, nuclear fuel. Iceland has the highest energy use per person — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span><\/td><\/tr><\/table><\/div><h3 id=\"c32-s7\">31.7 Inventions and discoveries<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Invention<\/th><th>Inventor<\/th><th>Discovery<\/th><th>Discoverer<\/th><\/tr><tr><td>Telephone<\/td><td>Alexander Graham Bell<\/td><td>Gravitation<\/td><td>Isaac Newton<\/td><\/tr><tr><td>Electric bulb<\/td><td>Thomas Edison<\/td><td>Relativity<\/td><td>Albert Einstein<\/td><\/tr><tr><td>Radio<\/td><td>Marconi (J. C. Bose's earlier work)<\/td><td>Penicillin<\/td><td>Alexander Fleming<\/td><\/tr><tr><td>Television<\/td><td>John Logie Baird<\/td><td>X-ray<\/td><td>Wilhelm Röntgen<\/td><\/tr><tr><td>Steam engine<\/td><td>James Watt<\/td><td>Radium<\/td><td>Marie and Pierre Curie<\/td><\/tr><tr><td>Aeroplane<\/td><td>Wright brothers<\/td><td>Oxygen<\/td><td>Joseph Priestley<\/td><\/tr><tr><td>Computer (analytical engine)<\/td><td>Charles Babbage<\/td><td>Blood circulation<\/td><td>William Harvey<\/td><\/tr><tr><td>World Wide Web<\/td><td>Tim Berners-Lee<\/td><td>Vaccination (smallpox)<\/td><td>Edward Jenner<\/td><\/tr><tr><td>Printing press<\/td><td>Gutenberg<\/td><td>Electron<\/td><td>J. J. Thomson<\/td><\/tr><tr><td>Dynamite<\/td><td>Alfred Nobel<\/td><td>Cholera bacillus<\/td><td>Robert Koch<\/td><\/tr><\/table><\/div><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 31<\/div><p class=\"li\">Hygrometer humidity; seismograph earthquakes; barometer pressure; sphygmomanometer blood pressure.<\/p><p class=\"li\">Primary colours of light: red, green, blue. Sound slowest in gas. Black absorbs and radiates most heat.<\/p><p class=\"li\">Vitamin K clotting; phosphorus and calcium for bones; haemoglobin is an iron protein.<\/p><p class=\"li\">UV-C most harmful. Light year = distance. Equinoxes 21 March, 23 September.<\/p><p class=\"li\">Natural gas = methane. Diamond = carbon, not a metal.<\/p><\/div>"},{"id":"c33","no":32,"part":"PART E — GENERAL KNOWLEDGE","title":"Chapter 32: Computer and ICT","short":"Computer and ICT","toc":[["c33-s1","32.1 Why this chapter is longer than you expect"],["c33-s2","32.2 Computer fundamentals"],["c33-s3","32.3 Abbreviations"],["c33-s4","32.4 Windows and general shortcuts"],["c33-s5","32.5 Microsoft Word"],["c33-s6","32.6 Microsoft Excel"],["c33-s7","32.7 PowerPoint, internet and security"],["c33-s8","32.8 Practice set"]],"html":"<h3 id=\"c33-s1\">32.1 Why this chapter is longer than you expect<\/h3><p>The only paper in the database set expressly for an <b>administration<\/b> post — PGCL Assistant Manager (Administration), 2021 — had twenty questions on MS Word and Excel. Petrobangla 2024 asked a valid Excel function. An administrative officer uses these programs daily, and examiners know it.<\/p><h3 id=\"c33-s2\">32.2 Computer fundamentals<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Facts<\/th><\/tr><tr><td>Father of the computer<\/td><td>Charles Babbage; first programmer Ada Lovelace; ENIAC (1946) the first general-purpose electronic computer; architecture by John von Neumann<\/td><\/tr><tr><td>Generations<\/td><td>1st vacuum tubes; 2nd transistors; 3rd integrated circuits; 4th microprocessors (Intel 4004, 1971); 5th artificial intelligence<\/td><\/tr><tr><td>Parts<\/td><td>input (keyboard, mouse, scanner, microphone); output (monitor, printer, speaker, plotter); CPU = control unit + arithmetic logic unit + registers — the \"brain\"; storage<\/td><\/tr><tr><td>Memory<\/td><td>RAM — volatile, working memory; ROM — permanent; cache — fastest; secondary: hard disk, SSD, pen drive, CD/DVD<\/td><\/tr><tr><td>Units<\/td><td>1 byte = 8 bits; 1 nibble = 4 bits; 1 KB = 1024 bytes; then MB, GB, TB; <b>1 petabyte = 1024 terabytes<\/b> — <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span>; then exabyte, zettabyte, yottabyte<\/td><\/tr><tr><td>Number systems<\/td><td>binary (base 2), octal (8), decimal (10), hexadecimal (16); (1010)₂ = 10; (F)₁₆ = 15<\/td><\/tr><tr><td>Software<\/td><td>system software (operating systems: Windows, Linux, macOS, Android; utilities) and application software (Word, Excel, browsers). Languages: machine, assembly, high-level (C, Java, Python); compiler and interpreter translate<\/td><\/tr><tr><td>Booting<\/td><td>starting the computer; BIOS = Basic Input Output System<\/td><\/tr><tr><td>Clipboard<\/td><td>the temporary memory that holds what you cut or copy — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span><\/td><\/tr><tr><td>Cursor<\/td><td>the blinking mark showing your position in the text — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span><\/td><\/tr><tr><td>In Bangladesh<\/td><td>first computer: IBM 1620 at the Atomic Energy Centre, Dhaka (1964); Bangla keyboard layout \"Bijoy\" by Mustafa Jabbar; submarine cables SEA-ME-WE 4 (Cox's Bazar, 2006) and SEA-ME-WE 5 (Kuakata, 2017)<\/td><\/tr><\/table><\/div><h3 id=\"c33-s3\">32.3 Abbreviations<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Short<\/th><th>Full form<\/th><th>Short<\/th><th>Full form<\/th><\/tr><tr><td><b>IoT<\/b><\/td><td>Internet of Things — <span class=\"tg tg-repeated\">REPEATED: Titas 2021, BAPEX 2023<\/span><\/td><td><b>OCR<\/b><\/td><td>Optical Character Reader/Recognition — <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span><\/td><\/tr><tr><td><b>MOOC<\/b><\/td><td>Massive Open Online Course — <span class=\"tg tg-actual\">ACTUAL: SGFL 2021<\/span><\/td><td><b>ISBN<\/b><\/td><td>International Standard Book Number — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span><\/td><\/tr><tr><td>AI<\/td><td>Artificial Intelligence<\/td><td>CPU<\/td><td>Central Processing Unit<\/td><\/tr><tr><td>RAM / ROM<\/td><td>Random Access / Read Only Memory<\/td><td>USB<\/td><td>Universal Serial Bus<\/td><\/tr><tr><td>HTML<\/td><td>HyperText Markup Language — <b>web pages are written in HTML<\/b> <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><td>HTTP<\/td><td>HyperText Transfer Protocol<\/td><\/tr><tr><td>URL<\/td><td>Uniform Resource Locator<\/td><td>WWW<\/td><td>World Wide Web<\/td><\/tr><tr><td>IP<\/td><td>Internet Protocol<\/td><td>DNS<\/td><td>Domain Name System<\/td><\/tr><tr><td>LAN / WAN / MAN<\/td><td>Local / Wide / Metropolitan Area Network<\/td><td>Wi-Fi<\/td><td>Wireless Fidelity<\/td><\/tr><tr><td>ISP<\/td><td>Internet Service Provider<\/td><td>VPN<\/td><td>Virtual Private Network<\/td><\/tr><tr><td>PDF<\/td><td>Portable Document Format<\/td><td>GUI<\/td><td>Graphical User Interface<\/td><\/tr><tr><td>SMS<\/td><td>Short Message Service<\/td><td>SIM<\/td><td>Subscriber Identity Module<\/td><\/tr><tr><td>GPS<\/td><td>Global Positioning System<\/td><td>OTP<\/td><td>One-Time Password<\/td><\/tr><tr><td>ATM<\/td><td>Automated Teller Machine<\/td><td>QR<\/td><td>Quick Response<\/td><\/tr><tr><td>MICR / OMR<\/td><td>Magnetic Ink Character / Optical Mark Recognition<\/td><td>ASCII<\/td><td>American Standard Code for Information Interchange<\/td><\/tr><tr><td>DBMS<\/td><td>Database Management System<\/td><td>SQL<\/td><td>Structured Query Language<\/td><\/tr><tr><td>e-GP<\/td><td>electronic Government Procurement<\/td><td>ERP<\/td><td>Enterprise Resource Planning<\/td><\/tr><\/table><\/div><ul><li>The <b>Fourth Industrial Revolution<\/b> is associated with AI, the Internet of Things, robotics, big data, cloud computing, 3D printing and blockchain — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021: \"A, B and C\"<\/span>.<\/li><li>Search engines: Google, Bing, Yahoo, Baidu, DuckDuckGo, Yandex; the Bangladeshi one is Pipilika. <b>Cortana<\/b> is Microsoft's voice assistant, not a search engine — <span class=\"tg tg-actual\">ACTUAL: GTCL 2021<\/span>. Among Facebook, LinkedIn, Twitter and Google, the one that is <b>not a social network is Google<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span>. Facebook was founded by <b>Mark Zuckerberg<\/b> (2004) — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>.<\/li><li>\"Jogajog\" was announced as a Bangladeshi alternative to Facebook and \"Alapon\" as a messaging app — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span>. The <b>333<\/b> call centre is the national information and service helpline — <span class=\"tg tg-actual\">ACTUAL: SGFL 2021<\/span>.<\/li><\/ul><h3 id=\"c33-s4\">32.4 Windows and general shortcuts<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Keys<\/th><th>Action<\/th><th>Keys<\/th><th>Action<\/th><\/tr><tr><td>Ctrl + C / X / V<\/td><td>copy / cut / paste<\/td><td>Ctrl + Z / Y<\/td><td>undo / redo<\/td><\/tr><tr><td>Ctrl + A<\/td><td>select all<\/td><td>Ctrl + S<\/td><td>save<\/td><\/tr><tr><td>Ctrl + P<\/td><td>print<\/td><td>Ctrl + F<\/td><td>find<\/td><\/tr><tr><td>Ctrl + N<\/td><td>new document — <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><td>Ctrl + O<\/td><td>open<\/td><\/tr><tr><td><b>Shift + Delete<\/b><\/td><td>delete permanently, bypassing the Recycle Bin — <span class=\"tg tg-repeated\">REPEATED: Titas 2021, BAPEX 2023<\/span><\/td><td>Alt + Tab<\/td><td>switch windows<\/td><\/tr><tr><td>Alt + F4<\/td><td>close the program<\/td><td>F2<\/td><td>rename<\/td><\/tr><tr><td>F1<\/td><td>help<\/td><td>F5<\/td><td>refresh (browser); start slide show (PowerPoint)<\/td><\/tr><tr><td>Ctrl + Alt + Delete<\/td><td>security options / Task Manager<\/td><td>Windows + D<\/td><td>show desktop<\/td><\/tr><tr><td>Windows + L<\/td><td>lock the computer<\/td><td>Print Screen<\/td><td>capture the screen<\/td><\/tr><\/table><\/div><h3 id=\"c33-s5\">32.5 Microsoft Word<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Feature<\/th><th>Fact<\/th><\/tr><tr><td>File extension<\/td><td>.docx (older .doc); template .dotx<\/td><\/tr><tr><td>Alignment<\/td><td>Ctrl + L left; <b>Ctrl + E centre<\/b> — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>; Ctrl + R right; Ctrl + J justify<\/td><\/tr><tr><td>Character format<\/td><td>Ctrl + B bold; Ctrl + I italic; Ctrl + U underline; Ctrl + ] / [ increase/decrease font size; Ctrl + = subscript; Ctrl + Shift + + superscript<\/td><\/tr><tr><td>Other shortcuts<\/td><td>Ctrl + H replace; Ctrl + K hyperlink; Ctrl + Enter page break; Ctrl + Home/End start/end of document; F7 spelling and grammar; F12 Save As; Shift + F3 change case<\/td><\/tr><tr><td><b>Orientation<\/b><\/td><td><b>Portrait and Landscape<\/b> are the two page orientations — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td><b>Header and footer<\/b><\/td><td>printed on <b>all pages<\/b> by default — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td><b>Section break<\/b><\/td><td>lets different parts of one document carry different formatting (margins, orientation, page numbers) — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td><b>AutoSave / AutoRecover<\/b><\/td><td>saves the document automatically at intervals — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td><b>Mail merge<\/b><\/td><td>combines a main document with a data source to produce personalised letters. <span class=\"tg tg-actual\">ACTUAL: GTCL 2021: \"minimum number of files required\" — keyed answer 3 (main document, data source, merged document); the two inputs are the main document and the data source.<\/span><\/td><\/tr><tr><td>Others<\/td><td>Track Changes records edits; a table of contents is built from heading styles; gutter margin is the extra margin for binding; \"widow/orphan control\" prevents single lines at the top or bottom of a page; default font in recent versions is Aptos (earlier Calibri 11)<\/td><\/tr><\/table><\/div><h3 id=\"c33-s6\">32.6 Microsoft Excel<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Feature<\/th><th>Fact<\/th><\/tr><tr><td>Structure<\/td><td>a workbook (.xlsx) contains worksheets; a <b>cell<\/b> is the basic unit where data are entered — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>; <b>rows are numbered 1, 2, 3…<\/b> and columns lettered A, B, C… — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>; 1,048,576 rows and 16,384 columns (last column XFD)<\/td><\/tr><tr><td>Formula<\/td><td><b>always begins with an equal sign (=)<\/b> — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td>Cell reference<\/td><td>relative A1; <b>absolute $B$1<\/b> — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>; mixed $A1 or A$1; F4 toggles<\/td><\/tr><tr><td>Range<\/td><td>A1:A10 — the colon is the range operator<\/td><\/tr><tr><td><b>SUM<\/b><\/td><td>=SUM(A20:C20) — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td><b>MAX / MIN<\/b><\/td><td>=MAX(A1:A10) finds the highest value — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td><b>AVERAGE<\/b><\/td><td>the average function is AVERAGE; <b>\"AVG\" is not an Excel function<\/b> — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td><b>COUNT / COUNTA<\/b><\/td><td>COUNT counts cells containing <b>numbers<\/b>; COUNTA counts <b>non-empty<\/b> cells; COUNTBLANK counts empty cells; COUNTIF counts cells meeting a condition — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021 (COUNTA), BAPEX 2023 (COUNT). One solution book keys BAPEX's COUNT question as \"counts non-empty cells\"; that is the definition of COUNTA, and the correct answer is \"counts cells having numbers\".<\/span><\/td><\/tr><tr><td><b>IF<\/b><\/td><td>tests whether a condition is true: =IF(A1&gt;=50,\"Pass\",\"Fail\") — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td><b>Nested function<\/b><\/td><td>a function inside another function — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td><b>CONCAT<\/b><\/td><td>joins text; <b>a valid Excel function<\/b> (it replaced CONCATENATE). \"YLOOKUP\" and \"TEXTMERGE\" do not exist; the real ones are VLOOKUP, HLOOKUP, XLOOKUP and TEXTJOIN — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span><\/td><\/tr><tr><td>Lookup and others<\/td><td>VLOOKUP searches down the first column; HLOOKUP across the first row; ROUND, TODAY(), NOW(), LEN, LEFT, RIGHT, UPPER, PROPER, SUMIF, AVERAGEIF<\/td><\/tr><tr><td><b>Wrap Text<\/b><\/td><td>breaks long text into several lines inside a cell — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>; Alt + Enter starts a new line in a cell<\/td><\/tr><tr><td><b>Charts<\/b><\/td><td><b>column chart<\/b> to compare values across categories; <b>line chart<\/b> to show a trend over time, such as daily share prices; pie chart for shares of a whole — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td>Tools<\/td><td>sort, filter, freeze panes, conditional formatting, pivot table, data validation<\/td><\/tr><tr><td>Errors<\/td><td>#DIV/0! division by zero; #NAME? unknown function name; #VALUE! wrong data type; #REF! invalid reference; #N/A value not found; ##### column too narrow<\/td><\/tr><\/table><\/div><h3 id=\"c33-s7\">32.7 PowerPoint, internet and security<\/h3><ul><li><b>PowerPoint:<\/b> file .pptx; <b>F5 starts the slide show<\/b> from the first slide — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>; Shift + F5 from the current slide; Ctrl + M new slide; Esc ends the show; \"slide sorter\" view rearranges slides; transitions act between slides and animations within a slide.<\/li><li><b>Internet:<\/b> began as ARPANET (1969); the World Wide Web was invented by Tim Berners-Lee (1989); a browser displays web pages; e-mail address = user@domain; CC sends a visible copy, BCC a hidden one; upload and download; cloud storage.<\/li><li><b>Networks:<\/b> LAN, MAN, WAN; router, switch, modem; topologies — bus, star, ring, mesh; bandwidth is measured in bits per second; 5G is the fifth-generation mobile network.<\/li><li><b>Security:<\/b> virus, worm, Trojan horse, ransomware, spyware; phishing (fraudulent messages to steal data); firewall; antivirus; two-factor authentication; strong passwords; backup. A \"hacker\" breaks into systems; \"encryption\" scrambles data.<\/li><li><b>Law:<\/b> the Information and Communication Technology Act, 2006 gave legal recognition to electronic records and digital signatures. The Digital Security Act, 2018 was replaced by the Cyber Security Act, 2023, which in turn was replaced by the Cyber Security Ordinance, 2025 (check its present status).<\/li><li><b>E-governance in Bangladesh:<\/b> a2i; the national portal bangladesh.gov.bd; e-Nothi/D-Nothi for electronic files; e-GP for procurement; national helpline 333; emergency 999.<\/li><\/ul><h3 id=\"c33-s8\">32.8 Practice set<\/h3><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 1. Which function counts the cells in A1:A20 that contain any entry? (a) COUNT (b) COUNTA (c) COUNTIF (d) SUM<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 2. In Excel, =AVERAGE(4,6,8) + MAX(2,9) returns (a) 15 (b) 13 (c) 18 (d) 9<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 3. Which shortcut justifies a paragraph in MS Word? (a) Ctrl + E (b) Ctrl + L (c) Ctrl + J (d) Ctrl + R<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 4. Which of the following is an absolute reference? (a) A1 (b) $A1 (c) A$1 (d) $A$1<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 5. 1 GB equals (a) 1000 KB (b) 1024 MB (c) 1024 KB (d) 1024 TB<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 6. Which is an output device? (a) scanner (b) plotter (c) mouse (d) microphone<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 7. To give page 1 of a document portrait orientation and page 2 landscape, you must insert a (a) page break (b) section break (c) column break (d) header<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 8. Which chart best shows each sector's share of total gas sales? (a) line (b) pie (c) scatter (d) area<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 9. BCC in e-mail means (a) Basic Carbon Copy (b) Blind Carbon Copy (c) Blank Copy Code (d) Back Copy Carbon<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 10. A fraudulent e-mail asking for your password is an example of (a) spamming (b) phishing (c) hacking (d) cracking<\/p><p class=\"pa\">Answers: 1 b · 2 a (6 + 9) · 3 c · 4 d · 5 b · 6 b · 7 b · 8 b · 9 b · 10 b.<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 32<\/div><p class=\"li\">Shift + Delete: permanent delete. Ctrl + N new; Ctrl + E centre; F5 slide show.<\/p><p class=\"li\">Excel: formula starts with =; $B$1 absolute; COUNT numbers, COUNTA non-empty; AVERAGE not AVG; CONCAT valid; IF tests a condition; Wrap Text.<\/p><p class=\"li\">Column chart compares; line chart shows trend; pie chart shows share.<\/p><p class=\"li\">Word: header/footer on all pages; section break for different formatting; portrait/landscape = orientation.<\/p><p class=\"li\">IoT, OCR, MOOC, HTML, ISBN; 1 PB = 1024 TB.<\/p><\/div>"},{"id":"c34","no":33,"part":"PART E — GENERAL KNOWLEDGE","title":"Chapter 33: World Facts — Geography, History, Books and Sport","short":"World Facts — Geography, History, Books and Sport","toc":[["c34-s1","33.1 Geography"],["c34-s2","33.2 Capitals and currencies often confused"],["c34-s3","33.3 World history in dates"],["c34-s4","33.4 Books, art and prizes"],["c34-s5","33.5 Sport"]],"html":"<h3 id=\"c34-s1\">33.1 Geography<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Facts<\/th><\/tr><tr><td>Continents and oceans<\/td><td>7 continents (largest Asia, smallest Australia); 5 oceans (largest and deepest Pacific; Mariana Trench)<\/td><\/tr><tr><td>Extremes<\/td><td>highest peak Everest (8,848.86 m); longest river Nile (the Amazon carries the most water); largest desert Sahara; largest lake Caspian Sea; deepest lake Baikal; largest freshwater lake Superior; highest waterfall Angel (Venezuela); <b>Victoria Falls is on the Zambezi<\/b> — <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span>; largest island Greenland, which <b>belongs to Denmark<\/b> — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span>; largest country Russia; smallest Vatican City; most populous India (overtook China in 2023)<\/td><\/tr><tr><td>Straits<\/td><td><b>Bosphorus<\/b> — between Asia and Europe, joins the Black Sea and the Sea of Marmara <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span>; Dardanelles; Gibraltar — Spain and Morocco, Atlantic and Mediterranean; Hormuz — Persian Gulf and Gulf of Oman (oil route); Malacca — Malaysia and Sumatra; Bab-el-Mandeb — Red Sea and Gulf of Aden; Bering — Asia and North America; Palk — India and Sri Lanka; Dover — England and France<\/td><\/tr><tr><td>USA and Russia<\/td><td>the US state nearest to Russia is <b>Alaska<\/b> (Bering Strait) — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span><\/td><\/tr><tr><td>Canals<\/td><td>Suez (Mediterranean–Red Sea, 1869, Egypt); Panama (Atlantic–Pacific, 1914)<\/td><\/tr><tr><td>Landlocked countries<\/td><td>Nepal, Bhutan, Afghanistan, Mongolia, Laos, Switzerland, Austria; in South America <b>Bolivia<\/b> and Paraguay — <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span><\/td><\/tr><tr><td>Scandinavia<\/td><td>Norway, Sweden, <b>Denmark<\/b> (Nordic countries add Finland and Iceland) — <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span><\/td><\/tr><tr><td>Ports and places<\/td><td><b>Port of Valencia — Spain<\/b> <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>; <b>Aleppo — Syria<\/b> <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span>; <b>Gatwick Airport — UK<\/b> <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span>; Heathrow — London; Great Ocean Road — <b>Australia<\/b> <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>; Reindeer Lake — <b>Canada<\/b> <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span><\/td><\/tr><tr><td>Nicknames<\/td><td>Land of the Rising Sun — <b>Japan<\/b> <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>; Land of the Midnight Sun — Norway; Land of Thunderbolt — Bhutan; Roof of the World — Pamir; <b>Windy City — Chicago<\/b> <span class=\"tg tg-actual\">ACTUAL: Bakhrabad 2021<\/span>; <b>City of Love — Paris<\/b> <span class=\"tg tg-actual\">ACTUAL: SGFL 2021<\/span>; City of Seven Hills — Rome; Venice of the East — Bangkok; Venice of Bengal — Barishal; Pearl of the Orient — Sri Lanka; Gift of the Nile — Egypt; Sorrow of China — Hwang Ho; Sick Man of Europe — Turkey; Playground of Europe — Switzerland<\/td><\/tr><tr><td>Switzerland<\/td><td>26 cantons — <span class=\"tg tg-actual\">ACTUAL: Bakhrabad 2021<\/span><\/td><\/tr><\/table><\/div><h3 id=\"c34-s2\">33.2 Capitals and currencies often confused<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Country<\/th><th>Capital<\/th><th>Currency<\/th><th>Country<\/th><th>Capital<\/th><th>Currency<\/th><\/tr><tr><td><b>Canada<\/b><\/td><td><b>Ottawa<\/b> — <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><td>dollar<\/td><td>Australia<\/td><td>Canberra<\/td><td>dollar<\/td><\/tr><tr><td>USA<\/td><td>Washington, DC (New York is not a capital — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>)<\/td><td>dollar<\/td><td>Brazil<\/td><td>Brasília<\/td><td>real<\/td><\/tr><tr><td>Switzerland<\/td><td>Bern<\/td><td>franc<\/td><td>Turkey<\/td><td>Ankara<\/td><td>lira<\/td><\/tr><tr><td>New Zealand<\/td><td>Wellington<\/td><td>dollar<\/td><td>South Africa<\/td><td>Pretoria (executive)<\/td><td>rand<\/td><\/tr><tr><td>Myanmar<\/td><td>Naypyidaw<\/td><td>kyat<\/td><td>Sri Lanka<\/td><td>Sri Jayawardenepura Kotte<\/td><td>rupee<\/td><\/tr><tr><td>Nepal<\/td><td>Kathmandu<\/td><td>rupee<\/td><td>Bhutan<\/td><td>Thimphu<\/td><td>ngultrum<\/td><\/tr><tr><td>Maldives<\/td><td>Malé<\/td><td>rufiyaa<\/td><td>Afghanistan<\/td><td>Kabul<\/td><td>afghani<\/td><\/tr><tr><td>China<\/td><td>Beijing<\/td><td>yuan (renminbi)<\/td><td>Japan<\/td><td>Tokyo<\/td><td>yen<\/td><\/tr><tr><td>South Korea<\/td><td>Seoul<\/td><td>won<\/td><td>Vietnam<\/td><td>Hanoi<\/td><td>dong<\/td><\/tr><tr><td>Thailand<\/td><td>Bangkok<\/td><td>baht<\/td><td>Indonesia<\/td><td>Jakarta (new capital Nusantara under development)<\/td><td>rupiah<\/td><\/tr><tr><td>Malaysia<\/td><td>Kuala Lumpur<\/td><td>ringgit<\/td><td>Saudi Arabia<\/td><td>Riyadh<\/td><td>riyal<\/td><\/tr><tr><td>Iran<\/td><td>Tehran<\/td><td>rial<\/td><td>Iraq<\/td><td>Baghdad<\/td><td>dinar<\/td><\/tr><tr><td>Qatar<\/td><td>Doha — home of <b>Al Jazeera<\/b> <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span><\/td><td>riyal<\/td><td>UAE<\/td><td>Abu Dhabi<\/td><td>dirham<\/td><\/tr><tr><td>Egypt<\/td><td>Cairo<\/td><td>pound<\/td><td>Nigeria<\/td><td>Abuja<\/td><td>naira<\/td><\/tr><tr><td><b>Ethiopia<\/b><\/td><td>Addis Ababa<\/td><td><b>birr<\/b> — <span class=\"tg tg-actual\">ACTUAL: Bakhrabad 2021<\/span><\/td><td>Kenya<\/td><td>Nairobi<\/td><td>shilling<\/td><\/tr><tr><td>Russia<\/td><td>Moscow<\/td><td>rouble<\/td><td>Ukraine<\/td><td>Kyiv<\/td><td>hryvnia<\/td><\/tr><tr><td>Germany, France, Italy, Spain<\/td><td>Berlin, Paris, Rome, Madrid<\/td><td>euro<\/td><td>UK<\/td><td>London<\/td><td>pound sterling<\/td><\/tr><tr><td>Sweden<\/td><td>Stockholm<\/td><td>krona<\/td><td>Norway<\/td><td>Oslo<\/td><td>krone<\/td><\/tr><\/table><\/div><ul><li>Central banks: <b>Reserve Bank of India<\/b> <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>; Federal Reserve (USA); Bank of England; People's Bank of China; State Bank of Pakistan; Bangladesh Bank.<\/li><li>Parliaments: Jatiya Sangsad (Bangladesh); Lok Sabha and Rajya Sabha (India); Congress (USA); Diet (Japan); Knesset (Israel); Majlis (Iran, Maldives); Duma (Russia); <b>Riksdag (Sweden)<\/b> <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span>; Bundestag (Germany); National People's Congress (China).<\/li><li>Famous addresses: <b>10 Downing Street<\/b> — residence of the British Prime Minister <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>; White House — US President; Élysée Palace — French President; Kremlin — Russian government; Rashtrapati Bhavan — President of India; Bangabhaban — President of Bangladesh. The BBC's London headquarters is Broadcasting House (Bush House was the World Service's home until 2012) — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>.<\/li><li>Countries without a written (codified) constitution: the <b>United Kingdom<\/b>, New Zealand, Israel — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>.<\/li><li>Intelligence agencies: CIA (USA, founded <b>1947<\/b> <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span>); MI6 (UK); Mossad (Israel); RAW (India); ISI (Pakistan); FSB (Russia). The <b>Coldstream Guards<\/b> is a regiment of the <b>British<\/b> Army <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span>.<\/li><\/ul><h3 id=\"c34-s3\">33.3 World history in dates<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Date<\/th><th>Event<\/th><\/tr><tr><td>c. 3500 BC<\/td><td><b>Sumerian civilisation<\/b> in <b>Mesopotamia<\/b> (between the Tigris and Euphrates, modern Iraq) — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>; cuneiform writing<\/td><\/tr><tr><td>Ancient<\/td><td>Egyptian (Nile; pyramids, hieroglyphics); Indus Valley (Harappa, Mohenjo-daro); Chinese (Hwang Ho); Greek; Roman; Maya (Central America)<\/td><\/tr><tr><td>1215<\/td><td>Magna Carta<\/td><\/tr><tr><td>1453<\/td><td>Fall of Constantinople<\/td><\/tr><tr><td>1492<\/td><td>Columbus reaches America; 1498 Vasco da Gama reaches India<\/td><\/tr><tr><td>1776<\/td><td>American Declaration of Independence (4 July); <b>George Washington<\/b> led the revolutionary army and became the first President — <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span><\/td><\/tr><tr><td><b>1789–1799<\/b><\/td><td>French Revolution: begins with the fall of the Bastille (14 July 1789); <b>ends in 1799<\/b> with Napoleon's coup — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>; \"Liberty, Equality, Fraternity\"<\/td><\/tr><tr><td>1861–65<\/td><td>American Civil War; Abraham Lincoln; slavery abolished<\/td><\/tr><tr><td>1914–18<\/td><td>First World War; Treaty of Versailles 1919; League of Nations 1920<\/td><\/tr><tr><td>1917<\/td><td>Russian (October) Revolution — Lenin<\/td><\/tr><tr><td>1939–45<\/td><td>Second World War; atomic bombs on Hiroshima (6 August) and Nagasaki (9 August 1945)<\/td><\/tr><tr><td>1947<\/td><td>Independence of India and Pakistan<\/td><\/tr><tr><td>1949<\/td><td>People's Republic of China (Mao Zedong); NATO formed<\/td><\/tr><tr><td>1989–91<\/td><td>Fall of the Berlin Wall; dissolution of the Soviet Union (December 1991)<\/td><\/tr><tr><td>2001<\/td><td>11 September attacks<\/td><\/tr><tr><td>2020<\/td><td>Covid-19 declared a pandemic (11 March)<\/td><\/tr><tr><td>2022<\/td><td>Russia invades Ukraine (24 February)<\/td><\/tr><\/table><\/div><h3 id=\"c34-s4\">33.4 Books, art and prizes<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Work<\/th><th>Author / artist<\/th><\/tr><tr><td><i>The Persistence of Memory<\/i> (melting clocks)<\/td><td><b>Salvador Dalí<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span><\/td><\/tr><tr><td><i>Mona Lisa<\/i>, <i>The Last Supper<\/i><\/td><td>Leonardo da Vinci<\/td><\/tr><tr><td>Sistine Chapel ceiling, <i>David<\/i><\/td><td>Michelangelo<\/td><\/tr><tr><td><i>Guernica<\/i><\/td><td>Pablo Picasso<\/td><\/tr><tr><td><i>The Starry Night<\/i><\/td><td>Vincent van Gogh<\/td><\/tr><tr><td><i>Principia Mathematica<\/i><\/td><td>Isaac Newton — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span><\/td><\/tr><tr><td><i>Harry Potter<\/i> series<\/td><td>J. K. Rowling — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span><\/td><\/tr><tr><td><i>My Life<\/i><\/td><td>Bill Clinton — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span>; (<i>My Experiments with Truth<\/i> — Gandhi)<\/td><\/tr><tr><td><i>How to Avoid a Climate Disaster<\/i><\/td><td>Bill Gates — <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span><\/td><\/tr><tr><td><i>A Golden Age<\/i><\/td><td>Tahmima Anam — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span><\/td><\/tr><tr><td><i>Das Kapital<\/i><\/td><td>Karl Marx<\/td><\/tr><tr><td><i>The Wealth of Nations<\/i><\/td><td>Adam Smith<\/td><\/tr><tr><td><i>The Republic<\/i><\/td><td>Plato<\/td><\/tr><tr><td><i>Long Walk to Freedom<\/i><\/td><td>Nelson Mandela<\/td><\/tr><tr><td><i>The Unfinished Memoirs<\/i> (অসমাপ্ত আত্মজীবনী)<\/td><td>Sheikh Mujibur Rahman<\/td><\/tr><tr><td><i>War and Peace<\/i>, <i>Anna Karenina<\/i><\/td><td>Leo Tolstoy — who <b>never won the Nobel Prize<\/b> <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>; Pablo Neruda (1971), George Bernard Shaw (1925) and Bertrand Russell (1950) did<\/td><\/tr><\/table><\/div><ul><li><b>Nobel Prize:<\/b> first awarded 1901; six fields — physics, chemistry, medicine, literature, peace (awarded in Oslo; the others in Stockholm) and economics (from 1969). Rabindranath Tagore 1913 (literature); Amartya Sen 1998 (economics); <b>Muhammad Yunus and Grameen Bank 2006 (peace)<\/b>. Yunus's \"<b>Three Zeros<\/b>\": zero poverty, zero unemployment, zero net carbon emissions — \"zero hunger\" is not one of them <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>.<\/li><li>Other prizes: Booker (fiction), Pulitzer (journalism and letters, USA), Ramon Magsaysay (\"Asia's Nobel\"), Oscar (film), Fields Medal (mathematics), Abel Prize (mathematics).<\/li><\/ul><h3 id=\"c34-s5\">33.5 Sport<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Event<\/th><th>Facts<\/th><\/tr><tr><td>Olympic Games<\/td><td>modern Games from 1896 (Athens); founder Pierre de Coubertin; five rings; 2020 Tokyo (held 2021); <b>2024 Paris<\/b> — <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span>; 2028 Los Angeles; 2032 Brisbane. At Paris 2024 the athletes' village followed the \"social business\" idea advocated by Muhammad Yunus — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>; <b>Léon Marchand<\/b> of France broke Michael Phelps's 400 m individual medley record — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>. Michael Phelps (swimming) holds the most Olympic gold medals (23) — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td>FIFA World Cup (men)<\/td><td>first 1930 (Uruguay); 2018 France; <b>2022 Qatar<\/b> — champions Argentina, Golden Boot <b>Kylian Mbappé<\/b>, Golden Ball Lionel Messi <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span>; <b>2026 USA–Canada–Mexico with 48 teams<\/b> <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span>; 2030 Morocco–Spain–Portugal; 2034 Saudi Arabia<\/td><\/tr><tr><td>FIFA Women's World Cup<\/td><td><b>2023 (Australia–New Zealand): Spain<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span><\/td><\/tr><tr><td>Cricket<\/td><td>ODI World Cup 2023 (India): Australia; T20 World Cup 2022: England, player of the tournament <b>Sam Curran<\/b> <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span>; T20 World Cup 2024: India. Bangladesh gained Test status in 2000 (10th Test nation)<\/td><\/tr><tr><td>Copa América<\/td><td>2021 host Brazil, champions Argentina — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span>; 2024 host USA, champions Argentina<\/td><\/tr><tr><td>Terms<\/td><td>cricket — googly, LBW, maiden; football — offside, penalty; tennis — deuce, love, ace; chess — checkmate, gambit; golf — birdie, bogey<\/td><\/tr><tr><td>Grand Slams<\/td><td>Australian Open, French Open (clay), Wimbledon (grass), US Open<\/td><\/tr><\/table><\/div><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 33<\/div><p class=\"li\">Bosphorus: Asia–Europe. Alaska nearest to Russia. Victoria Falls: Zambezi. Greenland: Denmark. Bolivia: landlocked.<\/p><p class=\"li\">Ottawa, Canberra, Bern, Ankara, Wellington — capitals that are not the largest city.<\/p><p class=\"li\">French Revolution 1789–1799. Sumer → Mesopotamia. George Washington.<\/p><p class=\"li\">Dalí — Persistence of Memory. Tolstoy — no Nobel. Yunus — Three Zeros.<\/p><p class=\"li\">2022 World Cup: Argentina; Golden Boot Mbappé; 2026: 48 teams. Women's 2023: Spain.<\/p><\/div>"},{"id":"c35","no":34,"part":"PART F — PETROBANGLA, ENERGY AND ADMINISTRATION","title":"Chapter 34: Petrobangla — The Organisation","short":"Petrobangla — The Organisation","toc":[["c35-s1","34.1 Why this chapter matters"],["c35-s2","34.2 Name and legal status"],["c35-s3","34.3 History — the official timeline"],["c35-s4","34.4 Vision and mission (official)"],["c35-s5","34.5 Functions"],["c35-s6","34.6 Management structure"],["c35-s7","34.7 The thirteen companies"],["c35-s8","34.8 International oil companies and PSCs"],["c35-s9","34.9 Laws and rules listed by Petrobangla as governing its work"]],"html":"<h3 id=\"c35-s1\">34.1 Why this chapter matters<\/h3><p>Three kinds of marks depend on it: (1) energy questions in the General Knowledge section — fifteen were found in the eleven papers, including \"Which one is not a Petrobangla subsidiary?\" in Petrobangla's own 2016 paper; (2) written essays and short notes, which are regularly set on energy; (3) the viva, where five of ten marks are for \"knowledge of the relevant subject\". The organisational history below is taken from Petrobangla's official website (page last updated 1 September 2024, read 16 November 2026).<\/p><h3 id=\"c35-s2\">34.2 Name and legal status<\/h3><ul><li>Full name: <b>Bangladesh Oil, Gas and Mineral Corporation — বাংলাদেশ তেল, গ্যাস ও খনিজসম্পদ কর্পোরেশন<\/b>; short name <b>Petrobangla (পেট্রোবাংলা)<\/b>.<\/li><li>It is a <b>statutory public corporation<\/b> (সংবিধিবদ্ধ সংস্থা), now constituted under the <b>Bangladesh Oil, Gas and Mineral Corporation Act, 2022 (Act No. 19 of 2022)<\/b>.<\/li><li>It works under the <b>Energy and Mineral Resources Division (জ্বালানি ও খনিজ সম্পদ বিভাগ)<\/b> of the <b>Ministry of Power, Energy and Mineral Resources (বিদ্যুৎ, জ্বালানি ও খনিজ সম্পদ মন্ত্রণালয়)<\/b>. The ministry has two divisions: the Power Division and the Energy and Mineral Resources Division.<\/li><li>Head office: Petrocentre, 3 Kawran Bazar Commercial Area, Dhaka.<\/li><li>It is a holding corporation: exploration, production, transmission, distribution and mining are carried out by <b>13 companies<\/b> registered under the Companies Act, 1994, whose shares Petrobangla holds on behalf of the government.<\/li><\/ul><h3 id=\"c35-s3\">34.3 History — the official timeline<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Date<\/th><th>Event (Verified: petrobangla.org.bd)<\/th><\/tr><tr><td>26 March 1972<\/td><td>President's Order No. 27 creates the <b>Bangladesh Mineral, Oil and Gas Corporation (BMOGC)<\/b> to explore and develop oil, gas and mineral resources<\/td><\/tr><tr><td>27 September 1972<\/td><td>President's Order No. 120 creates the <b>Bangladesh Mineral Exploration and Development Corporation (BMEDC)<\/b>; BMOGC is reconstituted as the <b>Bangladesh Oil and Gas Corporation (BOGC)<\/b><\/td><\/tr><tr><td>22 August 1974<\/td><td>Ordinance No. 15 gives BOGC the short name <b>\"Petrobangla\"<\/b><\/td><\/tr><tr><td>28 November 1974<\/td><td>The Oil and Gas Development Corporation Ordinance, 1961 is repealed; the Pakistan-era OGDC is abolished and its assets and liabilities vest in Petrobangla<\/td><\/tr><tr><td><b>9 August 1975<\/b><\/td><td>Five gas fields — <b>Titas, Habiganj, Rashidpur, Kailashtila and Bakhrabad<\/b> — are bought from the British company Shell Oil for <b>£4.5 million<\/b>. The day is observed as <b>National Energy Security Day<\/b><\/td><\/tr><tr><td>13 November 1976<\/td><td>Ordinance No. 88 creates the <b>Bangladesh Petroleum Corporation (BPC)<\/b> for the import, refining and marketing of crude oil and petroleum products<\/td><\/tr><tr><td>11 April 1985<\/td><td>The Bangladesh Oil, Gas and Mineral Corporation Ordinance, 1985 (Ordinance No. 21) merges BOGC and BMEDC into the <b>Bangladesh Oil, Gas and Mineral Corporation (BOGMC)<\/b><\/td><\/tr><tr><td>1989<\/td><td>An amending Act authorises the corporation to hold the shares of its companies and confirms the short name \"Petrobangla\"<\/td><\/tr><tr><td>20 November 2022<\/td><td><b>Act No. 19 of 2022<\/b> repeals the 1985 Ordinance and re-enacts the law in Bangla<\/td><\/tr><\/table><\/div><div class=\"bx bx-mem\"><div class=\"bxh\">MEMORY AID: Five dates<\/div><p class=\"\"><b>1972<\/b> born (P.O. 27, 26 March) → <b>1974<\/b> named \"Petrobangla\" → <b>1975<\/b> five fields from Shell, 9 August → <b>1985<\/b> BOGMC (oil + gas + minerals) → <b>2022<\/b> new Act.<\/p><\/div><p><span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span> \"On which date was National Energy Security Day observed?\" — <b>9 August<\/b>. <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span> \"When did the Bangladesh Petroleum Act come into force?\" — <b>1974<\/b>.<\/p><h3 id=\"c35-s4\">34.4 Vision and mission (official)<\/h3><ul><li><b>Vision (রূপকল্প):<\/b> to supply energy for sustainable economic growth and to ensure the energy security of the country — \"টেকসই অর্থনৈতিক প্রবৃদ্ধির জন্য জ্বালানি সরবরাহ করা এবং দেশের জ্বালানি নিরাপত্তা নিশ্চিত করা\"।<\/li><li><b>Mission (অভিলক্ষ্য):<\/b> to increase the exploration and production of natural gas; to supply indigenous primary energy to all areas and all socio-economic groups; to diversify indigenous energy resources; to develop coal as an alternative source of energy; to develop CNG, LNG and LPG so as to narrow the gap between gas demand and supply and to improve the environment; to contribute to environmental conservation; and to encourage the efficient use of gas for future energy security.<\/li><\/ul><h3 id=\"c35-s5\">34.5 Functions<\/h3><ul><li>Exploration for and development of oil, gas and mineral resources, through its companies and through <b>Production Sharing Contracts (PSCs)<\/b> with international oil companies (IOCs).<\/li><li>Production, purchase, transmission, distribution and sale of natural gas.<\/li><li>Import of liquefied natural gas (LNG) and its regasification and sale.<\/li><li>Mining of coal and hard rock.<\/li><li>Planning, coordination, supervision and control of the companies; approval of their budgets and major projects; holding their shares.<\/li><li>Advising the government on energy policy; administering the PSCs; maintaining geological and geophysical data.<\/li><li>Central recruitment of officers for the companies through the Central Selection Committee.<\/li><\/ul><h3 id=\"c35-s6\">34.6 Management structure<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Level<\/th><th>Detail<\/th><\/tr><tr><td>Board of Directors<\/td><td>chaired by the Chairman of Petrobangla; includes the full-time Directors and representatives of the ministry and other government bodies<\/td><\/tr><tr><td>Chairman<\/td><td>chief executive; normally an officer of Additional Secretary rank or above. The gazette of 5 October 2026 was signed by <b>Md Abdul Mannan, Chairman (additional charge)<\/b><\/td><\/tr><tr><td>Directors<\/td><td>Administration; Finance; Operation and Mines; Production Sharing Contract (PSC); Planning<\/td><\/tr><tr><td>Below the Directors<\/td><td>General Managers (e.g. GM Administration, who is Member-Secretary of the Central Selection Committee), Deputy General Managers, Managers, Deputy Managers, <b>Assistant Managers<\/b> (Grade 9), Assistant Officers (Grade 10)<\/td><\/tr><tr><td>Career ladder of your post<\/td><td>Assistant Manager → Deputy Manager → Manager → Deputy General Manager → General Manager → Director / Managing Director of a company<\/td><\/tr><tr><td>Typical work of the Administration division<\/td><td>personnel records, recruitment and posting, leave and discipline, training, board and meeting secretariat, welfare, estate, transport, security, public relations, procurement support, legal liaison, Right-to-Information and citizen's-charter duties<\/td><\/tr><\/table><\/div><h3 id=\"c35-s7\">34.7 The thirteen companies<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Company<\/th><th>Formed<\/th><th>Head office<\/th><th>What it does<\/th><\/tr><tr><td><b>Exploration and production<\/b><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>BAPEX — Bangladesh Petroleum Exploration and Production Company Ltd<\/td><td>1989<\/td><td>Dhaka<\/td><td>the national exploration company; drilling, seismic survey and production; operates fields such as Saldanadi, Fenchuganj, Shahbazpur, Semutang, Srikail, Begumganj, Sundalpur, Rupganj and the Bhola fields<\/td><\/tr><tr><td>BGFCL — Bangladesh Gas Fields Company Ltd<\/td><td>1975 (successor of Pakistan Shell, 1956)<\/td><td>Brahmanbaria<\/td><td>largest state gas producer; Titas, Habiganj, Bakhrabad, Narsingdi, Meghna (Kamta suspended)<\/td><\/tr><tr><td>SGFL — Sylhet Gas Fields Ltd<\/td><td>1982<\/td><td>Sylhet<\/td><td>oldest gas operations; Haripur (Sylhet), Kailashtila, Rashidpur, Beanibazar (Chhatak suspended); produces condensate, petrol and other liquids<\/td><\/tr><tr><td><b>Transmission<\/b><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>GTCL — Gas Transmission Company Ltd<\/td><td>14 December 1993<\/td><td>Dhaka<\/td><td>owns and operates the high-pressure national gas grid<\/td><\/tr><tr><td><b>Distribution and marketing<\/b><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Titas Gas Transmission and Distribution PLC (TGTDPLC)<\/td><td>20 November 1964<\/td><td>Dhaka<\/td><td>the largest distributor: greater Dhaka and Mymensingh; listed on the stock exchange<\/td><\/tr><tr><td>BGDCL — Bakhrabad Gas Distribution Company Ltd<\/td><td>7 June 1980<\/td><td>Cumilla<\/td><td>greater Cumilla and Noakhali<\/td><\/tr><tr><td>JGTDSL — Jalalabad Gas Transmission and Distribution System Ltd<\/td><td>1986<\/td><td>Sylhet<\/td><td>Sylhet division<\/td><\/tr><tr><td>PGCL — Pashchimanchal Gas Company Ltd<\/td><td>1999<\/td><td>Sirajganj<\/td><td>Rajshahi and Rangpur divisions<\/td><\/tr><tr><td>KGDCL — Karnaphuli Gas Distribution Company Ltd<\/td><td>2010<\/td><td>Chattogram<\/td><td>Chattogram region<\/td><\/tr><tr><td>SGCL — Sundarban Gas Company Ltd<\/td><td>2009<\/td><td>Khulna<\/td><td>Khulna and Barishal divisions, including Bhola<\/td><\/tr><tr><td><b>LNG, CNG and LPG<\/b><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>RPGCL — Rupantarita Prakritik Gas Company Ltd<\/td><td>1987<\/td><td>Dhaka<\/td><td>LNG import and regasification on Petrobangla's behalf; CNG; LPG and liquids<\/td><\/tr><tr><td><b>Mining<\/b><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>BCMCL — Barapukuria Coal Mining Company Ltd<\/td><td>1998<\/td><td>Parbatipur, Dinajpur<\/td><td>the country's only operating coal mine; supplies the Barapukuria power station<\/td><\/tr><tr><td>MGMCL — Maddhapara Granite Mining Company Ltd<\/td><td>1998<\/td><td>Parbatipur, Dinajpur<\/td><td>the only underground hard-rock mine<\/td><\/tr><\/table><\/div><p class=\"sm\">Twelve of the thirteen appear in the 2026 circular (all except MGMCL). Formation dates are from the companies' published profiles; exact dates not shown above should be quoted by year only.<\/p><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span> \"Which one is not a Petrobangla subsidiary company? (a) BAPEX (b) Titas Gas T&amp;D Co. Ltd (c) Barapukuria Coal Mine Company (d) All of them.\" — All three <b>are<\/b> subsidiaries, so none of (a)–(c) is \"not a subsidiary\". The archives show the fourth option (\"none of them\"/\"all of them\") as the key; the point being tested is that you recognise all three as Petrobangla companies.<\/p><div class=\"bx bx-warn\"><div class=\"bxh\">CAUTION: Not Petrobangla companies<\/div><p class=\"\"><b>BPC<\/b> (Bangladesh Petroleum Corporation) and its companies — Eastern Refinery, Padma Oil, Meghna Petroleum, Jamuna Oil, LP Gas Ltd — deal with liquid fuel and are a separate corporation under the same division. <b>PDB, DESCO, DPDC, PGCB, EGCB, NWPGCL, REB<\/b> belong to the Power Division. Examiners put these among the options.<\/p><\/div><h3 id=\"c35-s8\">34.8 International oil companies and PSCs<\/h3><ul><li>A <b>Production Sharing Contract<\/b> is an agreement under which a contractor explores at its own cost and risk; if gas is found, the contractor first recovers its cost from a share of production (\"cost recovery gas\") and the remainder (\"profit gas\") is divided between Petrobangla and the contractor in agreed proportions. Ownership of the petroleum stays with the State (Bangladesh Petroleum Act, 1974).<\/li><li>The country is divided into exploration <b>blocks<\/b>; offshore there are <b>26 blocks — 11 shallow-water and 15 deep-water<\/b>.<\/li><li><b>Chevron<\/b> operates Bibiyana (Habiganj — the largest producing field), Jalalabad (Sylhet) and Moulvibazar; a smaller IOC operates the Bangora field in Cumilla.<\/li><li><b>Offshore Bidding Round 2026:<\/b> launched on 24 May 2026 under the Bangladesh Offshore Model PSC 2026, offering all 26 offshore blocks with improved terms after the 2024 round attracted no bids; bids were due to close on 30 November 2026 (press reports, November 2026). An onshore bidding round — the first in nearly three decades — was reported to be in preparation.<\/li><\/ul><h3 id=\"c35-s9\">34.9 Laws and rules listed by Petrobangla as governing its work<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Law<\/th><th>Relevance<\/th><\/tr><tr><td>The Explosives Act, 1884; the Petroleum Act, 1934
