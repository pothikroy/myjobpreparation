ollowing must be true?<\/p><p class=\"po\">(A) x + y &gt; 8 (B) x − y &gt; 0 (C) x − 2y &lt; 2 (D) 2x − y &gt; 1 (E) None<\/p><h4>Written part<\/h4><p class=\"pq\">Problem Solving (show your calculations/steps) [5 × 2 = 10 marks]<\/p><p class=\"po\">(a) A violet paint is 30% blue and 70% red. A green paint is 50% blue and 50% yellow. When they are mixed, the brown paint obtained is 40% blue. If the brown paint weighs 10 grams, how many grams of red does it contain?<\/p><p class=\"po\">(b) Sazid has $360 for a tour. If he extends the tour by 4 days, he must cut his daily expenses by $3. How long is the tour?<\/p><p class=\"sm\">The other written question(s), on the unscanned pages 4–6 of the booklet, are not recorded.<\/p><h3 id=\"c39-s3\">38.2 Petrobangla — Assistant Manager, 2016<\/h3><p class=\"sm\">Source: \"Recent Job Solution\" pages in the third PDF. Part 1: MCQs, 60 × 1 = 60 marks, four options. Order in the original: Bangla 1–15, General Knowledge 16–30, English 31–45, Mathematics 46–60.<\/p><h4>Bangla (Q1–15)<\/h4><p class=\"pq\">1. 'কার মাথায় হাত বুলিয়েছ' – এখানে 'মাথা' শব্দের অর্থ?<\/p><p class=\"po\">(ক) স্বভাব নষ্ট করা (খ) স্পর্ধা বাড়া (গ) ফাঁকি দেওয়া (ঘ) কোনো উপায়ে কাজ হাসিল করা<\/p><p class=\"pq\">2. 'হাত ভারি' বাগধারার অর্থ?<\/p><p class=\"po\">(ক) দাতা (খ) কম খরচে (গ) দারিদ্র্য (ঘ) কৃপণ<\/p><p class=\"pq\">3. 'ঠোঁট কাটা' বলতে কী বুঝায়?<\/p><p class=\"po\">(ক) অহংকারী (খ) স্পষ্টভাষী (গ) মিথ্যাবাদী (ঘ) পক্ষপাতদুষ্ট<\/p><p class=\"pq\">4. 'ব্যাঙের সর্দি' এর অর্থ কী?<\/p><p class=\"po\">(ক) রোগ বিশেষ (খ) সম্ভাব্য ঘটনা (গ) অসম্ভব ঘটনা (ঘ) প্রতারণা<\/p><p class=\"pq\">5. 'একাদশে বৃহস্পতি' বলতে কী বুঝায়?<\/p><p class=\"po\">(ক) আশার কথা (খ) সৌভাগ্যের বিষয় (গ) মজা পাওয়া (ঘ) আনন্দের বিষয়<\/p><p class=\"pq\">6. লিঙ্গান্তর হয় না এমন শব্দ কোনটি?<\/p><p class=\"po\">(ক) সাহেব (খ) শিক্ষক (গ) সঙ্গী (ঘ) কবিরাজ<\/p><p class=\"pq\">7. কোন বাক্যটি দ্বারা অনুরোধ বুঝায়?<\/p><p class=\"po\">(ক) তুই বাড়ি যা (খ) ক্ষমা কর (গ) দূর হও (ঘ) কাল একবার আসতে পারবে<\/p><p class=\"pq\">8. কোন বানানটি শুদ্ধ?<\/p><p class=\"po\">(ক) সমিচিন (খ) সমীচীন (গ) সমীচিন (ঘ) সমিচীন<\/p><p class=\"pq\">9. কোন বানানটি শুদ্ধ?<\/p><p class=\"po\">(ক) বিভিষীকা (খ) বিভীষিকা (গ) বীভিষিকা (ঘ) বীভিষীকা<\/p><p class=\"pq\">10. 'অর্ধচন্দ্র' এর অর্থ কী?<\/p><p class=\"po\">(ক) গলা ধাক্কা দেওয়া (খ) অমাবস্যা (গ) আদর করা (ঘ) শাসন করা<\/p><p class=\"pq\">11. 'বালকেরা স্কুলে যাচ্ছে' বাক্যটি কোন ধরনের বর্তমান কাল নির্দেশ করে?<\/p><p class=\"po\">(ক) সাধারণ (খ) ঘটমান (গ) নিত্যবৃত্ত (ঘ) অনুজ্ঞা<\/p><p class=\"pq\">12. 'যা সহজে অতিক্রম করা যায় না' – সংক্ষিপ্ত রূপ কী?<\/p><p class=\"po\">(ক) দুর্গম (খ) দুরতিক্রম্য (গ) অনতিক্রম্য (ঘ) দুর্গমি<\/p><p class=\"pq\">13. 'একাদশে বৃহস্পতি' এর অর্থ কী?<\/p><p class=\"po\">(ক) আশার কথা (খ) সৌভাগ্যের বিষয় (গ) মজা পাওয়া (ঘ) আনন্দের বিষয়<\/p><p class=\"pq\">14. কোন প্রবচনটি 'হতভাগ্য' অর্থে ব্যবহৃত?<\/p><p class=\"po\">(ক) উড়নচণ্ডী (খ) ছা-পোষা (গ) আটকপালে (ঘ) ভূশণ্ডির কাক<\/p><p class=\"pq\">15. এক কথায় প্রকাশ করুন – 'যা বলা হয়নি'<\/p><p class=\"po\">(ক) অউক্ত (খ) অব্যক্ত (গ) অনুক্ত (ঘ) অব্যাক্ত<\/p><h4>General Knowledge (Q16–30)<\/h4><p class=\"pq\">16. Which industry-related organizations are Accord and Alliance?<\/p><p class=\"po\">(a) Garments (b) Insurance (c) Banking (d) Shipping<\/p><p class=\"pq\">17. Which one is not a social network?<\/p><p class=\"po\">(a) Facebook (b) LinkedIn (c) Twitter (d) Google<\/p><p class=\"pq\">18. Where is the headquarters of Al Jazeera Television?<\/p><p class=\"po\">(a) Doha (b) Dubai (c) Cairo (d) New York<\/p><p class=\"pq\">19. Aleppo is a city of which country?<\/p><p class=\"po\">(a) Iraq (b) Jordan (c) Syria (d) KSA<\/p><p class=\"pq\">20. Which of the following companies assembles Japanese automobiles in Bangladesh?<\/p><p class=\"po\">(a) Nitol Motors (b) Ifad Autos (c) Rangs Motors (d) Pragoti Industries Ltd<\/p><p class=\"pq\">21. What is the name of the latest multilateral development bank?<\/p><p class=\"po\">(a) IDB (b) ADB (c) WB (d) AIIB<\/p><p class=\"pq\">22. Bangladesh has recently been offered membership of which UN panel/committee?<\/p><p class=\"po\">(a) High-Level Panel on Water (and three other options)<\/p><p class=\"pq\">23. Which one is not a Petrobangla subsidiary company?<\/p><p class=\"po\">(a) BAPEX (b) Titas Gas T&amp;D Co. Ltd (c) Barapukuria Coal Mine Company (d) All of them<\/p><p class=\"pq\">24. Where was the last conference on climate change, COP21, held?<\/p><p class=\"po\">(a) Paris (b) Tokyo (c) Sao Paulo (d) Doha<\/p><p class=\"pq\">25. In which country was the Under-19 Cricket World Cup 2016 held?<\/p><p class=\"po\">(a) West Indies (b) Bangladesh (c) India (d) Australia<\/p><p class=\"pq\">26. What does UFO stand for?<\/p><p class=\"po\">(c) Unidentified Flying Object (other options were variants)<\/p><p class=\"pq\">27. The American General who led the revolt against the British and declared American independence was —<\/p><p class=\"po\">(a) Abraham Lincoln (b) George Washington (c) John F. Kennedy (d) Richard Nixon<\/p><p class=\"pq\">28. Which of the following countries is landlocked?<\/p><p class=\"po\">(a) Brazil (b) Cuba (c) Bolivia (d) Colombia<\/p><p class=\"pq\">29. Stephen Hawking is best known for the study of —<\/p><p class=\"po\">(a) Comets (b) Galaxies (c) Quasars (d) Black holes<\/p><p class=\"pq\">30. Light year is related to —<\/p><p class=\"po\">(a) Energy (b) Speed (c) Distance (d) Intensity<\/p><h4>English (Q31–45)<\/h4><p class=\"pq\">31. It is hardly worthwhile ___ invest more time ___ this matter.<\/p><p class=\"po\">(a) to, at (b) for, to (c) to, on (d) for, on<\/p><p class=\"pq\">32. Frankly, I find it too ___ a situation for him to have berated his child like that.<\/p><p class=\"po\">(a) insignificant (b) grave (c) acute (d) delicate<\/p><p class=\"pq\">33. The ___ option left for you is not an option at all.<\/p><p class=\"po\">(a) prime (b) only (c) first (d) best<\/p><p><i>Questions 34–36: choose the word nearest in meaning to the underlined word.<\/i><\/p><p class=\"pq\">34. He has a natural <b>aversion<\/b> toward duplicity.<\/p><p class=\"po\">(a) affinity (b) attraction (c) distaste (d) tendency<\/p><p class=\"pq\">35. It is in his nature to <b>belittle<\/b> his opponents when faced with criticism.<\/p><p class=\"po\">(a) avoid (b) demean (c) annoy (d) stop<\/p><p class=\"pq\">36. The reduced <b>commuting<\/b> time was an additional perk that came with his new job.<\/p><p class=\"po\">(a) communicating (b) traveling (c) working (d) supervising<\/p><p><i>Questions 37–39: identify the error.<\/i><\/p><p class=\"pq\">37. It is easier (a) said (b) then (c) done (d).<\/p><p class=\"pq\">38. Your progress report show (a) you have (b) more (c) things to learn (d).<\/p><p class=\"pq\">39. Diversification is a strategy (a) to investing (b) in many (c) unrelated (d) businesses.<\/p><p><i>Questions 40–42: choose the best replacement for the underlined part.<\/i><\/p><p class=\"pq\">40. He interviewed several candidates, ___ had the experience and qualifications the position required.<\/p><p class=\"po\">(a) whom he thought (b) of whom he thought (c) which he thought (d) who he thought<\/p><p class=\"pq\">41. <b>Using it<\/b> wisely, leisure promotes health, efficiency and happiness.<\/p><p class=\"po\">(a) Because of usefulness (b) Having used it wisely (c) If used wisely (d) Because it is used wisely<\/p><p class=\"pq\">42. Writing a beautiful sonnet is as much an achievement as <b>to finish<\/b> a 400-page novel.<\/p><p class=\"po\">(a) it is to finish (b) finishing (c) if to finish (d) to have finished<\/p><p><i>Questions 43–45: identify the correct sentence.<\/i><\/p><p class=\"pq\">43. (a) It is further from here. (b) It is still furthur from the truth. (c) What you say is fur from the truth. (d) It is far from here.<\/p><p class=\"pq\">44. (a) Besides being clever, she is very perceptive. (b) Beside being clever, she is very perceptive. (c) Beside being clever, she is also perceptive. (d) Aside to being clever, she is very perceptive.<\/p><p class=\"pq\">45. (a) It is neither true nor valid. (b) It is neither true or valid. (c) It is not neither true nor valid. (d) It is either true nor valid.<\/p><h4>Mathematics (Q46–60)<\/h4><p class=\"pq\">46. The area of a rectangle R with width 4 feet is equal to the area of a square S, which has a perimeter of 24 feet. The perimeter of R, in feet, is —<\/p><p class=\"po\">(a) 16 (b) 24 (c) 26 (d) None<\/p><p class=\"pq\">47. Suppose x &gt; y and xy &lt; 0. Which of the following must be negative?<\/p><p class=\"po\">(a) y (b) x (c) x − y (d) None<\/p><p class=\"pq\">48. A boat sails m miles upstream at the rate of r miles per hour. If the speed of the stream is s miles per hour, how long will it take the boat to return to its starting point?<\/p><p class=\"po\">(a) m/(r + 2s) (b) mr − s (c) m/(r + s) (d) None<\/p><p class=\"pq\">49. A wheel rotates 10 times per minute and moves 20 feet during each rotation. How many feet does the wheel move in 1 hour?<\/p><p class=\"po\">(a) 1,200 (b) 600 (c) 12,000 (d) None<\/p><p class=\"pq\">50. If x is doubled and y is tripled in z = 3x/y, then the value of z is —<\/p><p class=\"po\">(a) doubled (b) multiplied by 6 (c) multiplied by a factor of 2/3 (d) None<\/p><p class=\"pq\">51. A petrol tank that is 1/2 full has 8 gallons removed. The tank is then 1/10 full. What is the capacity of the tank in gallons?<\/p><p class=\"po\">(a) 40 (b) 15½ (c) 20 (d) None<\/p><p class=\"pq\">52. There are 45 students in a class; 2/3 are girls and 1/2 of the girls are blue-eyed. How many blue-eyed girls are there?<\/p><p class=\"po\">(a) 30 (b) 15 (c) 28 (d) None<\/p><p class=\"pq\">53. Of 30,000 tickets sold, 1/4 were sold at Tk 300, 1/3 at Tk 250 and the rest at Tk 125. How many tickets were sold at Tk 125?<\/p><p class=\"po\">(a) 5,000 (b) 7,500 (c) 12,500 (d) None<\/p><p class=\"pq\">54. In a group of 15 students, 7 study Latin, 8 study French and 3 study neither. How many study both?<\/p><p class=\"po\">(a) 3 (b) 4 (c) 15 (d) None<\/p><p class=\"pq\">55. A square sheet of plywood has an area of 169 square feet. A 2-foot strip is cut off one side to fit a wall. What is the area of the wall in square feet?<\/p><p class=\"po\">(a) 117 (b) 121 (c) 143 (d) None<\/p><p class=\"pq\">56. Mr Expert can do a job in 8 days and his son in 12 days. Working together, how many days will they take?<\/p><p class=\"po\">(a) 5 (b) 4 4/5 (c) 6 (d) None<\/p><p class=\"pq\">57. Mr Power attends 12 TV service calls a day and Mr Fixit 16. Mr Power's average charge is 3/2 of Mr Fixit's, who earns Tk 7,200 a month. What are Mr Power's monthly earnings?<\/p><p class=\"po\">(a) 3,600 (b) 7,200 (c) 8,100 (d) None<\/p><p class=\"pq\">58. Tip and Top together had Tk 100. After giving Top Tk 10, Tip finds he has Tk 4 more than 1/5 of what Top now has. How much does Tip have now?<\/p><p class=\"po\">(a) 21 (b) 35 (c) 20 (d) None<\/p><p class=\"pq\">59. Square ABCD has area x². E lies on DC with EC = y. What is the area of triangle AED?<\/p><p class=\"po\">(a) (x² − xy)/2 (b) x² − xy (c) y² − xy (d) None<\/p><p class=\"pq\">60. The elevator in an eleven-storey office building travels at one floor per 1/4 minute. At the main floor and at the top floor the operator stops for 1 minute. How many complete trips will the elevator make in 7 hours?<\/p><p class=\"po\">(a) 50 (b) 60 (c) 80 (d) None<\/p><h3 id=\"c39-s4\">38.3 Petrobangla — Assistant Manager (General), 5 August 2011<\/h3><p class=\"sm\">Source: Eminent, pp. 156–161 of the book. 44 questions survive as recollections; some option sets are incomplete. Items whose answers have changed with time are marked \"dated\" in the key.<\/p><p class=\"pq\">1. কোনটি সঠিক? (ক) ব্যাকরণ ভাষার অনুগামী (খ) ভাষা ব্যাকরণের অনুগামী (গ) ব্যাকরণ শিক্ষার অনুগামী (ঘ) ব্যাকরণ শব্দ যন্ত্রের অনুগামী<\/p><p class=\"pq\">2. সাধু ও চলিত ভাষার মূল পার্থক্য কোন পদে সবচেয়ে বেশি? (ক) বিশেষ্য ও বিশেষণে (খ) বিশেষ্য ও সর্বনামে (গ) ক্রিয়া ও সর্বনামে (ঘ) বিশেষণ ও ক্রিয়ায়<\/p><p class=\"pq\">3. 'গিন্নী' কোন প্রকার শব্দ? (ক) খাঁটি বাংলা (খ) দেশি (গ) বিদেশি (ঘ) সংস্কৃত<\/p><p class=\"pq\">4. 'প্রতিদিন ফুল ফুটত' – কোন কাল? (ক) সাধারণ অতীত (খ) ঘটমান অতীত (গ) পুরাঘটিত অতীত (ঘ) নিত্যবৃত্ত অতীত<\/p><p class=\"pq\">5. 'আকাশ' শব্দের প্রতিশব্দ কোনগুলো? (ক) অনল, কৃশানু (খ) অম্বর, পাবক, বহ্নি (গ) ব্যোম, অন্তরীক্ষ, শূন্য (ঘ) ধরিত্রী, মহী, মেদিনী<\/p><p class=\"pq\">6. 'শশাঙ্ক' শব্দের সন্ধি বিচ্ছেদ কোনটি? (ক) শশ + অঙ্ক (খ) শস + অঙ্ক (গ) শশা + অঙ্ক (ঘ) শন + অঙ্ক<\/p><p class=\"pq\">7. 'রুই-কাতলা' বলতে বোঝায় — (ক) ক্ষমতাশালী ব্যক্তি (খ) সম্মানিত ব্যক্তি (গ) পদস্থ ব্যক্তি (ঘ) জ্ঞানী ব্যক্তি<\/p><p class=\"pq\">8. কোনটি একবচনের উদাহরণ? (ক) বনে বাঘ থাকে (খ) শিক্ষক ছাত্র পড়াচ্ছেন (গ) লোকে বলে (ঘ) মানুষ মরণশীল<\/p><p class=\"pq\">9. 'বৃষ্টি পড়ে টাপুর টুপুর' – 'টাপুর টুপুর' কোন ধরনের শব্দ? (ক) অবস্থাবাচক (খ) বাক্যালঙ্কার (গ) ধ্বন্যাত্মক (ঘ) দ্বিরুক্ত<\/p><p class=\"pq\">10. 'গুরুজনে কর শ্রদ্ধা' – কোন কারক? (ক) কর্তৃ (খ) অপাদান (গ) করণ (ঘ) কর্ম<\/p><p class=\"pq\">11. I am not bad ___ tennis. (a) in (b) at (c) on (d) about<\/p><p class=\"pq\">12. Three-fourths of the work ___ finished. (a) have been (b) has been (c) had (d) were<\/p><p class=\"pq\">13. Synonym of \"conjugal\": (a) Bridal (b) Approval (c) Deadly (d) Disputable<\/p><p class=\"pq\">14. Antonym of \"honorary\": (a) Salaried (b) Literary (c) Honourable (d) Official<\/p><p class=\"pq\">15. Choose the correct sentence: (a) Would you mind close the door? (b) Would you mind closing the door? (c) Would you mind to close the door? (d) Would you mind in closing the door?<\/p><p class=\"pq\">16. The adverb form of \"heart\" is: (a) heartened (b) heartily (c) hearty (d) heartening<\/p><p class=\"pq\">17. Identify the correct use of \"since\": (a) It has been raining since last five days. (b) It works since morning. (c) I saw him last night since. (d) He has been staying with us since Monday last.<\/p><p class=\"pq\">18. Best passive form of \"I don't like idle people\": (a) I am not liked by the idle people. (b) Idle people are not like me. (c) Idle people are not liked by me. (d) Idle people are not of my liking.<\/p><p class=\"pq\">19. Which one is the adjective? (a) Beauty (b) Beautiful (c) Beautification (d) Beautifying<\/p><p class=\"pq\">20. বাংলাপিডিয়া কারা প্রকাশ করেন? (ক) ঢাকা বিশ্ববিদ্যালয় (খ) বাংলা একাডেমি (গ) শিল্পকলা একাডেমি (ঘ) এশিয়াটিক সোসাইটি<\/p><p class=\"pq\">21. পৃথিবীতে দিন ও রাত্রি সমান হয় কোন কোন তারিখে?<\/p><p class=\"pq\">22. ভূমিকম্প নির্ণায়ক যন্ত্র কোনটি? (ক) ব্যারোমিটার (খ) সেক্সট্যান্ট (গ) সিসমোগ্রাফ (ঘ) ম্যানোমিটার<\/p><p class=\"pq\">23. যে তিনটি মুখ্য বর্ণের সমন্বয়ে অন্যান্য সকল বর্ণ সৃষ্টি করা যায় — (ক) হলুদ, সবুজ, নীল (খ) লাল, সবুজ, নীল (গ) লাল, নীল, বেগুনি (ঘ) লাল, কমলা, বেগুনি<\/p><p class=\"pq\">24. মুক্তা হলো ঝিনুকের — (ক) খোলসের টুকরা (খ) চোখের মণি (গ) প্রদাহের ফল (ঘ) জমাট হরমোন<\/p><p class=\"pq\">25. কোন মাধ্যমে শব্দের গতি সবচেয়ে কম? (ক) শূন্যতায় (খ) কঠিন (গ) তরল (ঘ) বায়বীয়<\/p><p class=\"pq\">26. 'হ্যারি পটার' কী?<\/p><p class=\"pq\">27. ফেসবুকের উদ্ভাবক কে?<\/p><p class=\"pq\">28. 'এ গোল্ডেন এজ' উপন্যাসটির রচয়িতা কে?<\/p><p class=\"pq\">29. বর্ষাকালে ভিজা কাপড় শুকাতে দেরি হয় কেন?<\/p><p class=\"pq\">30. ASEAN-এর পূর্ণরূপ কী?<\/p><p class=\"pq\">31. একখণ্ড বরফকে উত্তপ্ত করে পানিতে পরিণত করলে আয়তন — (ক) বাড়বে (খ) কমবে (গ) প্রথমে কমবে পরে বাড়বে (ঘ) একই থাকবে<\/p><p class=\"pq\">32. বিশ্ব পরিবেশ দিবস কোন তারিখে?<\/p><p class=\"pq\">33. বাংলাদেশ জাতিসংঘের কততম সদস্য?<\/p><p class=\"pq\">34. START-2 কী?<\/p><p class=\"pq\">35. হাড় ও দাঁতকে মজবুত করে — (ক) আয়োডিন (খ) আয়রন (গ) ম্যাগনেসিয়াম (ঘ) ফসফরাস<\/p><p class=\"pq\">36. ১০ নং ডাউনিং স্ট্রিট কী?<\/p><p class=\"pq\">37. লন্ডনে বিবিসির প্রধান কার্যালয়ের নাম কী?<\/p><p class=\"pq\">38. কোন রঙের কাপে চা তাড়াতাড়ি ঠান্ডা হয়? (ক) সাদা (খ) কালো (গ) লাল (ঘ) বেগুনি<\/p><p class=\"pq\">39. বিএসটিআই-এর আঞ্চলিক অফিস কয়টি?<\/p><p class=\"pq\">40. সম্প্রতি পাটের জীবনরহস্য উন্মোচন করেছেন কোন বিজ্ঞানী?<\/p><p class=\"pq\">41. বাংলাদেশের মানুষের মাথাপিছু জাতীয় আয় কত? (তৎকালীন)<\/p><p class=\"pq\">42. ইনস্টিটিউট ফর ইকোনমিকস অ্যান্ড পিস-এর মতে সবচেয়ে শান্তির দেশ কোনটি? (২০১০)<\/p><p class=\"pq\">43. বাংলাদেশে সিভিল সার্ভিসের ক্যাডার সংখ্যা কত?<\/p><p class=\"pq\">44. ২০১০-১১ অর্থবছরে জিডিপিতে শিল্প খাতের অবদান কত?<\/p><h3 id=\"c39-s5\">38.4 Answer key and explanations — 2024 paper<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Q<\/th><th>Answer<\/th><th>Explanation<\/th><\/tr><tr><td>1<\/td><td>শব্দ<\/td><td>নিনাদ = ধ্বনি, শব্দ, গর্জন<\/td><\/tr><tr><td>2<\/td><td>সমুদ্র<\/td><td>বারি (জল) + ধি (ধারণ করে)<\/td><\/tr><tr><td>3<\/td><td>উড়োজাহাজ<\/td><td>খ (আকাশ) + পোত (যান)<\/td><\/tr><tr><td>4<\/td><td>পুষ্প<\/td><td>প্রসূন = ফুল<\/td><\/tr><tr><td>5<\/td><td>অনুভূমিক<\/td><td>Vertical = উল্লম্ব<\/td><\/tr><tr><td>6<\/td><td>নিঃ + আময়<\/td><td>র-জাত বিসর্গ + স্বর → র (Ch. 4)<\/td><\/tr><tr><td>7<\/td><td>আনুষঙ্গিক<\/td><td><\/td><\/tr><tr><td>8<\/td><td>দেদীপ্যমান<\/td><td><span class=\"tg tg-repeated\">REPEATED: Titas 2021<\/span><\/td><\/tr><tr><td>9<\/td><td>অন্তঃসার<\/td><td><\/td><\/tr><tr><td>10<\/td><td>কোনোটিই নয় (as archived)<\/td><td>সাতকাহন = প্রচুর পরিমাণ; বিশদ বর্ণনা<\/td><\/tr><tr><td>11<\/td><td>আসন্ন বিপদ<\/td><td><\/td><\/tr><tr><td>12<\/td><td>গোমড়ামুখো লোক<\/td><td><\/td><\/tr><tr><td>13<\/td><td>বাইরে পরিপাটি<\/td><td>বাইরের ঠাট বজায় রেখে চলে যে<\/td><\/tr><tr><td>14<\/td><td>কর্মধারয়<\/td><td>যিনি গণ্য তিনিই মান্য (Ch. 5)<\/td><\/tr><tr><td>15<\/td><td>কোনোটিই নয় (as archived)<\/td><td>টাইফুন চীনা উৎসের শব্দ<\/td><\/tr><tr><td>16<\/td><td>A<\/td><td>refusal to compromise → deadlock<\/td><\/tr><tr><td>17<\/td><td>C<\/td><td>\"costs, which have been rising … over the past three years\"<\/td><\/tr><tr><td>18<\/td><td>A<\/td><td>\"although … initially ___ … soon developed a theory\": a negative state overcome<\/td><\/tr><tr><td>19<\/td><td>A<\/td><td>\"rigid policies and lack of empathy\"<\/td><\/tr><tr><td>20<\/td><td>B<\/td><td>\"both ___ and innovative\": a positive word; provident = showing foresight<\/td><\/tr><tr><td ্দের সমার্থক শব্দ কোনটি?<\/p><p class=\"po\">(ক) দিন (খ) রাত্রি (গ) নদী (ঘ) বিদ্যুৎ (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">4. কোনটি 'চাঁদ'-এর প্রতিশব্দ নয়?<\/p><p class=\"po\">(ক) সুধাকর (খ) নিশাকর (গ) প্রভাকর (ঘ) শশধর (ঙ) বিধু<\/p><p class=\"pq\">5. 'Ex-officio'-এর পরিভাষা কোনটি?<\/p><p class=\"po\">(ক) ভারপ্রাপ্ত (খ) পদাধিকারবলে (গ) তদর্থক (ঘ) প্রেষণ (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">6. 'পুরস্কার' শব্দের সন্ধি বিচ্ছেদ কোনটি?<\/p><p class=\"po\">(ক) পুর + কার (খ) পুরঃ + কার (গ) পুরস + কার (ঘ) পুরো + কার (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">7. কোন বানানটি শুদ্ধ?<\/p><p class=\"po\">(ক) মুমুর্ষু (খ) মূমুর্ষু (গ) মুমূর্ষু (ঘ) মুমূর্ষূ (ঙ) মূমূর্ষু<\/p><p class=\"pq\">8. কোন বানানটি শুদ্ধ?<\/p><p class=\"po\">(ক) পিপিলিকা (খ) পিপীলিকা (গ) পীপিলিকা (ঘ) পিপিলীকা (ঙ) পীপীলিকা<\/p><p class=\"pq\">9. কোন বানানটি শুদ্ধ?<\/p><p class=\"po\">(ক) প্রতিযোগীতা (খ) প্রতিযোগিতা (গ) প্রতীযোগিতা (ঘ) প্রতিযোগিতো (ঙ) প্রতীযোগীতা<\/p><p class=\"pq\">10. 'তামার বিষ' বাগধারার অর্থ কী?<\/p><p class=\"po\">(ক) বিষাক্ত ধাতু (খ) অর্থের কুপ্রভাব (গ) কঠিন রোগ (ঘ) গোপন শত্রু (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">11. 'গোঁফ খেজুরে' বাগধারার অর্থ কী?<\/p><p class=\"po\">(ক) নিতান্ত অলস (খ) ভোজনরসিক (গ) কৃপণ (ঘ) ধূর্ত (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">12. 'তুলসী বনের বাঘ' বাগধারার অর্থ কী?<\/p><p class=\"po\">(ক) সাহসী (খ) ভণ্ড (গ) দুর্লভ বস্তু (ঘ) নিরীহ (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">13. 'কেঁচে গণ্ডূষ' বাগধারার অর্থ কী?<\/p><p class=\"po\">(ক) বিফল চেষ্টা (খ) পুনরায় আরম্ভ (গ) অল্প লাভ (ঘ) সর্বনাশ (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">14. 'ত্রিফলা' কোন সমাস?<\/p><p class=\"po\">(ক) দ্বন্দ্ব (খ) বহুব্রীহি (গ) দ্বিগু (ঘ) কর্মধারয় (ঙ) অব্যয়ীভাব<\/p><p class=\"pq\">15. 'চাবি' কোন ভাষার শব্দ?<\/p><p class=\"po\">(ক) আরবি (খ) ফারসি (গ) পর্তুগিজ (ঘ) তুর্কি (ঙ) ফরাসি<\/p><h4>English<\/h4><p class=\"pq\">16. The minister's speech was so ___ that even his critics admitted it had been clear and convincing.<\/p><p class=\"po\">(A) verbose (B) cogent (C) banal (D) equivocal (E) insipid<\/p><p class=\"pq\">17. Neither the chairman nor the directors ___ willing to postpone the meeting.<\/p><p class=\"po\">(A) is (B) was (C) were (D) has been (E) be<\/p><p class=\"pq\">18. Having worked in the field for years, she was ___ at spotting errors that others overlooked.<\/p><p class=\"po\">(A) inept (B) adept (C) indolent (D) diffident (E) lax<\/p><p class=\"pq\">19. The new rules are intended to ___ the hardship of low-income consumers, not to increase it.<\/p><p class=\"po\">(A) aggravate (B) exacerbate (C) alleviate (D) perpetuate (E) elicit<\/p><p class=\"pq\">20. The auditor's remarks were brief and to the point; in fact they were remarkably ___.<\/p><p class=\"po\">(A) garrulous (B) succinct (C) redundant (D) circuitous (E) ornate<\/p><p class=\"pq\">21. The manager insisted that every officer ___ present at the briefing.<\/p><p class=\"po\">(A) is (B) was (C) be (D) were (E) would be<\/p><p class=\"pq\">22. The scheme, once hailed as a remedy for every problem, proved to be no ___.<\/p><p class=\"po\">(A) fallacy (B) panacea (C) dearth (D) impasse (E) anomaly<\/p><p class=\"pq\">23. Because rainfall was ___, the reservoirs remained almost empty.<\/p><p class=\"po\">(A) copious (B) incessant (C) meagre (D) abundant (E) torrential<\/p><p><i>Questions 24–28: identify the part containing an error, or choose (E).<\/i><\/p><p class=\"pq\">24. Each of the applicants (A) have submitted (B) the required documents (C) before the deadline (D). No error (E)<\/p><p class=\"pq\">25. He is senior (A) than me (B) in service, though (C) we joined in the same year (D). No error (E)<\/p><p class=\"pq\">26. Walking along the corridor (A), the notice board caught (B) my attention (C) at once (D). No error (E)<\/p><p class=\"pq\">27. The committee recommended (A) that the proposal be (B) examined again (C) by the finance division (D). No error (E)<\/p><p class=\"pq\">28. She not only drafted (A) the report but also (B) presenting it (C) to the board (D). No error (E)<\/p><p class=\"pq\">29. OBSOLETE<\/p><p class=\"po\">(A) modern (B) outdated (C) hidden (D) stubborn (E) costly<\/p><p class=\"pq\">30. PRUDENT<\/p><p class=\"po\">(A) reckless (B) proud (C) cautious (D) wealthy (E) strict<\/p><h4>General Knowledge<\/h4><p class=\"pq\">31. The Bangladesh Oil and Gas Corporation was given the short name \"Petrobangla\" in —<\/p><p class=\"po\">(A) 1972 (B) 1974 (C) 1975 (D) 1985 (E) 2022<\/p><p class=\"pq\">32. National Energy Security Day is observed on —<\/p><p class=\"po\">(A) 7 March (B) 9 August (C) 14 December (D) 26 March (E) 5 June<\/p><p class=\"pq\">33. Which company owns and operates the national gas transmission grid?<\/p><p class=\"po\">(A) BAPEX (B) Titas Gas (C) GTCL (D) RPGCL (E) BGFCL<\/p><p class=\"pq\">34. The first gas field of Bangladesh was discovered in 1955 at —<\/p><p class=\"po\">(A) Titas (B) Chhatak (C) Haripur (D) Habiganj (E) Bakhrabad<\/p><p class=\"pq\">35. The Constitution of Bangladesh came into force on —<\/p><p class=\"po\">(A) 4 November 1972 (B) 16 December 1972 (C) 26 March 1972 (D) 10 January 1972 (E) 7 March 1973<\/p><p class=\"pq\">36. The writ jurisdiction of the High Court Division is given by Article —<\/p><p class=\"po\">(A) 44 (B) 77 (C) 102 (D) 137 (E) 142<\/p><p class=\"pq\">37. The Mujibnagar Government took the oath on —<\/p><p class=\"po\">(A) 10 April 1971 (B) 17 April 1971 (C) 26 March 1971 (D) 25 March 1971 (E) 16 December 1971<\/p><p class=\"pq\">38. Which Indian state does NOT share a border with Bangladesh?<\/p><p class=\"po\">(A) Assam (B) Tripura (C) Nagaland (D) Mizoram (E) Meghalaya<\/p><p class=\"pq\">39. The Six-Point Programme was announced in —<\/p><p class=\"po\">(A) 1952 (B) 1962 (C) 1966 (D) 1969 (E) 1970<\/p><p class=\"pq\">40. The headquarters of the International Monetary Fund is in —<\/p><p class=\"po\">(A) Geneva (B) New York (C) Washington, DC (D) Paris (E) Vienna<\/p><p class=\"pq\">41. The Montreal Protocol deals with —<\/p><p class=\"po\">(A) climate finance (B) protection of the ozone layer (C) wetlands (D) nuclear tests (E) hazardous waste<\/p><p class=\"pq\">42. Which of the following was NOT a founding member of OPEC?<\/p><p class=\"po\">(A) Iran (B) Iraq (C) Kuwait (D) Qatar (E) Venezuela<\/p><p class=\"pq\">43. \"Affordable and Clean Energy\" is Sustainable Development Goal number —<\/p><p class=\"po\">(A) 5 (B) 6 (C) 7 (D) 9 (E) 13<\/p><p class=\"pq\">44. The strait that connects the Persian Gulf with the Gulf of Oman is —<\/p><p class=\"po\">(A) Malacca (B) Hormuz (C) Bosphorus (D) Gibraltar (E) Bering<\/p><p class=\"pq\">45. Atmospheric pressure is measured by a —<\/p><p class=\"po\">(A) hygrometer (B) barometer (C) hydrometer (D) anemometer (E) altimeter<\/p><p class=\"pq\">46. The chief component of natural gas is —<\/p><p class=\"po\">(A) ethane (B) propane (C) butane (D) methane (E) hydrogen<\/p><p class=\"pq\">47. Rickets is caused by deficiency of vitamin —<\/p><p class=\"po\">(A) A (B) B (C) C (D) D (E) K<\/p><p class=\"pq\">48. Which Excel function counts only the cells that contain numbers?<\/p><p class=\"po\">(A) COUNT (B) COUNTA (C) COUNTBLANK (D) SUM (E) LEN<\/p><p class=\"pq\">49. Which key starts a PowerPoint slide show from the first slide?<\/p><p class=\"po\">(A) F1 (B) F2 (C) F5 (D) F7 (E) F12<\/p><p class=\"pq\">50. One terabyte equals —<\/p><p class=\"po\">(A) 1024 KB (B) 1024 MB (C) 1024 GB (D) 1024 PB (E) 1000 bytes<\/p><p class=\"pq\">51. <span class=\"tg tg-predicted\">PREDICTED<\/span> After the deferral approved in 2026, Bangladesh is scheduled to graduate from the LDC category in —<\/p><p class=\"po\">(A) 2024 (B) 2026 (C) 2027 (D) 2029 (E) 2031<\/p><p class=\"pq\">52. <span class=\"tg tg-predicted\">PREDICTED<\/span> How many offshore blocks were offered in the Bangladesh Offshore Bidding Round 2026?<\/p><p class=\"po\">(A) 11 (B) 15 (C) 22 (D) 26 (E) 48<\/p><p class=\"pq\">53. Who was elected Pope in May 2025?<\/p><p class=\"po\">(A) Francis II (B) Leo XIV (C) John Paul III (D) Benedict XVII (E) Pius XIII<\/p><p class=\"pq\">54. Which country won the FIFA World Cup 2022?<\/p><p class=\"po\">(A) France (B) Brazil (C) Argentina (D) Croatia (E) Germany<\/p><p class=\"pq\">55. Banglapedia is published by —<\/p><p class=\"po\">(A) Bangla Academy (B) Asiatic Society of Bangladesh (C) University of Dhaka (D) Shilpakala Academy (E) National Museum<\/p><h4>Mathematics<\/h4><p class=\"pq\">56. A shopkeeper marks his goods 50% above cost and allows a discount of 20%. His profit is —<\/p><p class=\"po\">(A) 10% (B) 15% (C) 20% (D) 25% (E) 30%<\/p><p class=\"pq\">57. The average of 6 numbers is 15. When one number is removed the average becomes 14. The number removed is —<\/p><p class=\"po\">(A) 16 (B) 18 (C) 20 (D) 21 (E) None<\/p><p class=\"pq\">58. A can do a job in 12 days and B in 24 days. Together they will take —<\/p><p class=\"po\">(A) 6 days (B) 8 days (C) 9 days (D) 18 days (E) None<\/p><p class=\"pq\">59. If 2x + 3y = 13 and 3x + 2y = 12, then x + y =<\/p><p class=\"po\">(A) 4 (B) 5 (C) 6 (D) 7 (E) None<\/p><p class=\"pq\">60. A train 200 m long passes a pole in 10 seconds. Its speed in km/h is —<\/p><p class=\"po\">(A) 36 (B) 54 (C) 72 (D) 90 (E) None<\/p><p class=\"pq\">61. A tank is 1/4 full. After 45 litres are added it is 5/8 full. Its capacity in litres is —<\/p><p class=\"po\">(A) 90 (B) 100 (C) 120 (D) 150 (E) None<\/p><p class=\"pq\">62. Two numbers are in the ratio 3 : 5 and their sum is 96. The larger number is —<\/p><p class=\"po\">(A) 36 (B) 48 (C) 60 (D) 64 (E) None<\/p><p class=\"pq\">63. Solution A is 10% acid and solution B is 40% acid. In what ratio (A : B) must they be mixed to obtain a 22% solution?<\/p><p class=\"po\">(A) 2 : 3 (B) 3 : 2 (C) 1 : 2 (D) 2 : 1 (E) None<\/p><p class=\"pq\">64. When n is divided by 7 the remainder is 4. What is the remainder when 3n is divided by 7?<\/p><p class=\"po\">(A) 1 (B) 3 (C) 4 (D) 5 (E) None<\/p><p class=\"pq\">65. A father is three times as old as his son. Ten years ago he was five times as old. The father's present age is —<\/p><p class=\"po\">(A) 45 (B) 50 (C) 54 (D) 60 (E) None<\/p><p class=\"pq\">66. The minimum value of x² − 6x + 14 is —<\/p><p class=\"po\">(A) 3 (B) 5 (C) 9 (D) 14 (E) None<\/p><p class=\"pq\">67. If 2 &lt; x &lt; 5 and 1 &lt; y &lt; 4, which of the following must be true?<\/p><p class=\"po\">(A) x − y &gt; 0 (B) x + y &gt; 5 (C) xy &gt; 4 (D) 2x + y &gt; 5 (E) None<\/p><p class=\"pq\">68. A sum of money doubles itself in 8 years at simple interest. The annual rate is —<\/p><p class=\"po\">(A) 8% (B) 10% (C) 12.5% (D) 15% (E) None<\/p><p class=\"pq\">69. In a class of 40 students, 25 like tea, 20 like coffee and 5 like neither. How many like both?<\/p><p class=\"po\">(A) 5 (B) 10 (C) 15 (D) 20 (E) None<\/p><p class=\"pq\">70. A man walks at 4 km/h for 3 hours and then cycles at 12 km/h for 2 hours. His average speed in km/h is —<\/p><p class=\"po\">(A) 7.2 (B) 8 (C) 8.5 (D) 9 (E) None<\/p><h3 id=\"c40-s3\">39.2 Mock Examination 1 — Part II (30 marks)<\/h3><p class=\"pq\">1. Problem solving — show your steps. [5 × 2 = 10]<\/p><p class=\"po\">(a) A dealer mixes tea costing Tk 300 per kg with tea costing Tk 450 per kg to obtain 30 kg of a mixture worth Tk 360 per kg. How many kilograms of each kind does he use?<\/p><p class=\"po\">(b) A man has Tk 600 to spend on a trip. If he extends the trip by 5 days, he must reduce his daily expenses by Tk 10. Find the original length of the trip.<\/p><p class=\"pq\">2. বাংলা: আপনার এলাকায় অবৈধ গ্যাস সংযোগের কারণে বৈধ গ্রাহকেরা গ্যাসের স্বল্প চাপে ভুগছেন। অবৈধ সংযোগ বিচ্ছিন্ন করার অনুরোধ জানিয়ে সংশ্লিষ্ট গ্যাস বিতরণ কোম্পানির ব্যবস্থাপনা পরিচালকের কাছে একটি আবেদনপত্র লিখুন। [10]<\/p><p class=\"pq\">3. English: \"Bangladesh should give priority to exploring its own gas rather than importing LNG.\" Do you agree? Argue your position in about 150 words. [10]<\/p><h3 id=\"c40-s4\">39.3 Mock Examination 2 — Part I (70 marks)<\/h3><h4>Bangla<\/h4><p class=\"pq\">1. 'উর্বী' শব্দের অর্থ কী?<\/p><p class=\"po\">(ক) আকাশ (খ) পৃথিবী (গ) নদী (ঘ) পাহাড় (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">2. 'পন্নগ' শব্দের অর্থ কী?<\/p><p class=\"po\">(ক) পাখি (খ) হাতি (গ) সাপ (ঘ) ঘোড়া (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">3. 'অপলাপ' শব্দের অর্থ কী?<\/p><p class=\"po\">(ক) প্রলাপ (খ) অস্বীকার (গ) আলাপ (ঘ) বিলাপ (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">4. 'আবির্ভাব' শব্দের বিপরীত শব্দ কোনটি?<\/p><p class=\"po\">(ক) অভাব (খ) তিরোভাব (গ) প্রভাব (ঘ) স্বভাব (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">5. 'Corrigendum'-এর পরিভাষা কোনটি?<\/p><p class=\"po\">(ক) পরিপত্র (খ) শুদ্ধিপত্র (গ) স্মারকলিপি (ঘ) প্রজ্ঞাপন (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">6. 'দুর্যোগ' শব্দের সন্ধি বিচ্ছেদ কোনটি?<\/p><p class=\"po\">(ক) দু + যোগ (খ) দুর + যোগ (গ) দুঃ + যোগ (ঘ) দূর + যোগ (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">7. কোন বানানটি শুদ্ধ?<\/p><p class=\"po\">(ক) শারিরীক (খ) শারীরিক (গ) শারিরিক (ঘ) শারীরীক (ঙ) সারীরিক<\/p><p class=\"pq\">8. কোন বানানটি শুদ্ধ?<\/p><p class=\"po\">(ক) আকাংখা (খ) আকাঙ্খা (গ) আকাঙ্ক্ষা (ঘ) আকাংক্ষা (ঙ) আকাঙ্ক্ষ্যা<\/p><p class=\"pq\">9. কোন বাক্যটি শুদ্ধ?<\/p><p class=\"po\">(ক) সকল সদস্যগণ উপস্থিত ছিলেন। (খ) তার সৌজন্যতায় মুগ্ধ হলাম। (গ) তিনি সস্ত্রীক এসেছেন। (ঘ) অশ্রুজলে বুক ভেসে গেল। (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">10. 'ইঁদুর কপালে' বাগধারার অর্থ কী?<\/p><p class=\"po\">(ক) ধূর্ত (খ) নিতান্ত মন্দভাগ্য (গ) ভীতু (ঘ) লোভী (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">11. 'ঢাক ঢাক গুড় গুড়' বাগধারার অর্থ কী?<\/p><p class=\"po\">(ক) প্রচার করা (খ) গোপন রাখার চেষ্টা (গ) ঝগড়া করা (ঘ) আনন্দ করা (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">12. 'শাঁখের করাত' বাগধারার অর্থ কী?<\/p><p class=\"po\">(ক) কঠিন কাজ (খ) উভয় সংকট (গ) ধারালো অস্ত্র (ঘ) নিষ্ঠুর ব্যক্তি (ঙ) কোনোটিই নয়<\/p><p class=\"pq\">13. এক কথায় প্রকাশ করুন: 'জানার ইচ্ছা'<\/p><p class=\"po\">(ক) জিগীষা (খ) জিজ্ঞাসা (গ) জিঘাংসা (ঘ) জিজীবিষা (ঙ) বুভুক্ষা<\/p><p class=\"pq\">14. 'মেঘে বৃষ্টি হয়' — 'মেঘে' কোন কারকে কোন বিভক্তি?<\/p><p class=\"po\">(ক) কর্তৃকারকে ৭মী (খ) করণে ৭মী (গ) অপাদানে ৭মী (ঘ) অধিকরণে ৭মী (ঙ) কর্মে ৭মী<\/p><p class=\"pq\">15. 'পদ্মানদীর মাঝি' উপন্যাসের রচয়িতা কে?<\/p><p class=\"po\">(ক) বিভূতিভূষণ বন্দ্যোপাধ্যায় (খ) তারাশঙ্কর বন্দ্যোপাধ্যায় (গ) মানিক বন্দ্যোপাধ্যায় (ঘ) শরৎচন্দ্র চট্টোপাধ্যায় (ঙ) সৈয়দ ওয়ালীউল্লাহ<\/p><h4>English<\/h4><p class=\"pq\">16. He has been working here ___ 2019.<\/p><p class=\"po\">(A) for (B) since (C) from (D) by (E) in<\/p><p class=\"pq\">17. I look forward to ___ from you.<\/p><p class=\"po\">(A) hear (B) hearing (C) be heard (D) heard (E) have heard<\/p><p class=\"pq\">18. No sooner had he reached the station ___ the train left.<\/p><p class=\"po\">(A) when (B) then (C) than (D) that (E) while<\/p><p class=\"pq\">19. The officer was accused ___ negligence of duty.<\/p><p class=\"po\">(A) for (B) with (C) of (D) on (E) at<\/p><p class=\"pq\">20. I had my car ___ yesterday.<\/p><p class=\"po\">(A) repair (B) repaired (C) repairing (D) to repair (E) repairs<\/p><p class=\"pq\">21. The number of applicants ___ increased this year.<\/p><p class=\"po\">(A) have (B) has (C) are (D) were (E) having<\/p><p class=\"pq\">22. The passive form of \"They are building a bridge\" is —<\/p><p class=\"po\">(A) A bridge is built by them. (B) A bridge is being built by them. (C) A bridge has been built by them. (D) A bridge was being built by them. (E) A bridge will be built by them.<\/p><p class=\"pq\">23. He said to me, \"Where do you live?\" In indirect speech:<\/p><p class=\"po\">(A) He asked me where did I live. (B) He asked me where I lived. (C) He asked me where I live. (D) He told me where I lived. (E) He asked me that where I lived.<\/p><p class=\"pq\">24. BENEVOLENT means —<\/p><p class=\"po\">(A) cruel (B) kind (C) wealthy (D) clever (E) weak<\/p><p class=\"pq\">25. The antonym of FRUGAL is —<\/p><p class=\"po\">(A) thrifty (B) careful (C) extravagant (D) poor (E) honest<\/p><p class=\"pq\">26. \"To turn down\" means —<\/p><p class=\"po\">(A) to reject (B) to reduce (C) to fold (D) to overturn (E) to visit<\/p><p class=\"pq\">27. \"Red tape\" means —<\/p><p class=\"po\">(A) a danger signal (B) official delay and excessive formality (C) a prize (D) a warning (E) a decoration<\/p><p class=\"pq\">28. Which is correctly spelt?<\/p><p class=\"po\">(A) accomodation (B) accommodation (C) acommodation (D) accomodasion (E) accommodetion<\/p><p class=\"pq\">29. A government run by officials is called —<\/p><p class=\"po\">(A) democracy (B) autocracy (C) bureaucracy (D) oligarchy (E) plutocracy<\/p><p class=\"pq\">30. Page : Book ::<\/p><p class=\"po\">(A) pen : ink (B) brick : wall (C) teacher : school (D) knife : cut (E) hot : cold<\/p><h4>General Knowledge<\/h4><p class=\"pq\">31. Petrobangla's first predecessor, BMOGC, was created by —<\/p><p class=\"po\">(A) President's Order No. 27 of 1972 (B) Act No. 19 of 2022 (C) Ordinance No. 21 of 1985 (D) President's Order No. 120 of 1972 (E) Ordinance No. 88 of 1976<\/p><p class=\"pq\">32. Which of the following is NOT a company of Petrobangla?<\/p><p class=\"po\">(A) BGFCL (B) SGCL (C) Jamuna Oil Company (D) BCMCL (E) KGDCL<\/p><p class=\"pq\">33. Which gas field, discovered in 1962, lies in Brahmanbaria?<\/p><p class=\"po\">(A) Habiganj (B) Titas (C) Kailashtila (D) Rashidpur (E) Sangu<\/p><p class=\"pq\">34. Bangladesh's floating LNG terminals (FSRUs) are located at —<\/p><p class=\"po\">(A) Payra (B) Mongla (C) Moheshkhali (D) Kuakata (E) Sandwip<\/p><p class=\"pq\">35. Gas and electricity tariffs in Bangladesh are determined by —<\/p><p class=\"po\">(A) Petrobangla (B) BERC (C) BPC (D) GTCL (E) NBR<\/p><p class=\"pq\">36. \"Operation Searchlight\" was launched on —<\/p><p class=\"po\">(A) 7 March 1971 (B) 25 March 1971 (C) 26 March 1971 (D) 17 April 1971 (E) 14 December 1971<\/p><p class=\"pq\">37. The number of Bir Sreshthas is —<\/p><p class=\"po\">(A) 5 (B) 7 (C) 11 (D) 68 (E) 175<\/p><p class=\"pq\">38. Which amendment restored the parliamentary system of government?<\/p><p class=\"po\">(A) 4th (B) 8th (C) 12th (D) 13th (E) 15th<\/p><p class=\"pq\">39. The minimum age for membership of Parliament is —<\/p><p class=\"po\">(A) 21 (B) 25 (C) 30 (D) 35 (E) 40<\/p><p class=\"pq\">40. The administrative head of a ministry is the —<\/p><p class=\"po\">(A) Minister (B) Secretary (C) Director General (D) Cabinet Secretary (E) Joint Secretary<\/p><p class=\"pq\">41. The only coral island of Bangladesh is —<\/p><p class=\"po\">(A) Bhola (B) Sandwip (C) St Martin's (D) Maheshkhali (E) Kutubdia<\/p><p class=\"pq\">42. Hili is a —<\/p><p class=\"po\">(A) sea port (B) river port (C) land port (D) airport (E) export processing zone<\/p><p class=\"pq\">43. The secretariat of SAARC is in —<\/p><p class=\"po\">(A) Dhaka (B) New Delhi (C) Kathmandu (D) Colombo (E) Islamabad<\/p><p class=\"pq\">44. The European Union was created by the Treaty of —<\/p><p class=\"po\">(A) Rome (B) Maastricht (C) Lisbon (D) Versailles (E) Paris<\/p><p class=\"pq\">45. Which country became the 32nd member of NATO in 2024?<\/p><p class=\"po\">(A) Finland (B) Sweden (C) Ukraine (D) Bosnia (E) Georgia<\/p><p class=\"pq\">46. COP21, which adopted the climate agreement of 2015, was held in —<\/p><p class=\"po\">(A) Kyoto (B) Copenhagen (C) Paris (D) Glasgow (E) Dubai<\/p><p class=\"pq\">47. The primary colours of light are —<\/p><p class=\"po\">(A) red, yellow, blue (B) red, green, blue (C) green, yellow, violet (D) red, orange, violet (E) blue, yellow, white<\/p><p class=\"pq\">48. Sound travels fastest in —<\/p><p class=\"po\">(A) a vacuum (B) air (C) water (D) steel (E) the same in all<\/p><p class=\"pq\">49. Which vitamin helps blood to clot?<\/p><p class=\"po\">(A) A (B) C (C) D (D) E (E) K<\/p><p class=\"pq\">50. Web pages are written in —<\/p><p class=\"po\">(A) FTP (B) HTTP (C) HTML (D) URL (E) SQL<\/p><p class=\"pq\">51. In MS Word, Ctrl + E —<\/p><p class=\"po\">(A) aligns text left (B) centres text (C) aligns text right (D) justifies text (E) makes text bold<\/p><p class=\"pq\">52. Which is an absolute cell reference in Excel?<\/p><p class=\"po\">(A) C4 (B) $C4 (C) C$4 (D) $C$4 (E) #C#4<\/p><p class=\"pq\">53. <span class=\"tg tg-predicted\">PREDICTED<\/span> According to the BBS provisional estimate for FY2025-26, the per capita income of Bangladesh is about —<\/p><p class=\"po\">(A) $2,069 (B) $2,529 (C) $2,769 (D) $3,020 (E) $3,520<\/p><p class=\"pq\">54. <span class=\"tg tg-predicted\">PREDICTED<\/span> The size of the national budget for FY2026-27 is about —<\/p><p class=\"po\">(A) Tk 6.78 lakh crore (B) Tk 7.61 lakh crore (C) Tk 7.90 lakh crore (D) Tk 9.38 lakh crore (E) Tk 10.5 lakh crore<\/p><p class=\"pq\">55. \"Guernica\" was painted by —<\/p><p class=\"po\">(A) Salvador Dalí (B) Pablo Picasso (C) Vincent van Gogh (D) Claude Monet (E) Leonardo da Vinci<\/p><h4>Mathematics<\/h4><p class=\"pq\">56. 15% of 480 + 25% of 120 =<\/p><p class=\"po\">(A) 92 (B) 100 (C) 102 (D) 112 (E) None<\/p><p class=\"pq\">57. By selling an article for Tk 720 a man loses 10%. At what price must he sell it to gain 5%?<\/p><p class=\"po\">(A) 800 (B) 820 (C) 840 (D) 860 (E) None<\/p><p class=\"pq\">58. The HCF of 84, 126 and 210 is —<\/p><p class=\"po\">(A) 14 (B) 21 (C) 42 (D) 84 (E) None<\/p><p class=\"pq\">59. The average of four consecutive even numbers is 27. The largest is —<\/p><p class=\"po\">(A) 28 (B) 30 (C) 32 (D) 34 (E) None<\/p><p class=\"pq\">60. Pipe A fills a tank in 20 minutes and pipe B in 30 minutes. Together they fill it in —<\/p><p class=\"po\">(A) 10 min (B) 12 min (C) 15 min (D) 25 min (E) None<\/p><p class=\"pq\">61. A boat's speed in still water is 15 km/h and the stream flows at 3 km/h. How long does it take to go 36 km downstream?<\/p><p class=\"po\">(A) 2 h (B) 2.4 h (C) 3 h (D) 12 h (E) None<\/p><p class=\"pq\">62. If x + 1/x = 3, then x² + 1/x² =<\/p><p class=\"po\">(A) 5 (B) 7 (C) 9 (D) 11 (E) None<\/p><p class=\"pq\">63. The simple interest on Tk 5,000 at 8% a year for 3 years is —<\/p><p class=\"po\">(A) 1,000 (B) 1,200 (C) 1,260 (D) 1,500 (E) None<\/p><p class=\"pq\">64. The area of a square whose perimeter is 48 cm is —<\/p><p class=\"po\">(A) 96 (B) 121 (C) 144 (D) 169 (E) None<\/p><p class=\"pq\">65. If A : B = 2 : 3 and B : C = 4 : 5, then A : C =<\/p><p class=\"po\">(A) 2 : 5 (B) 8 : 15 (C) 3 : 5 (D) 8 : 12 (E) None<\/p><p class=\"pq\">66. Two dice are thrown. The probability that the sum is 7 is —<\/p><p class=\"po\">(A) 1/12 (B) 1/9 (C) 1/6 (D) 5/36 (E) None<\/p><p class=\"pq\">67. x² − 7x + 10 &lt; 0 when —<\/p><p class=\"po\">(A) x &lt; 2 (B) 2 &lt; x &lt; 5 (C) x &gt; 5 (D) x &lt; 2 or x &gt; 5 (E) None<\/p><p class=\"pq\">68. 3 men or 5 women can do a piece of work in 12 days. In how many days can 6 men and 5 women do it?<\/p><p class=\"po\">(A) 3 (B) 4 (C) 6 (D) 8 (E) None<\/p><p class=\"pq\">69. The price of rice rises by 25%. By what per cent must a family cut its consumption to keep its expenditure unchanged?<\/p><p class=\"po\">(A) 15% (B) 20% (C) 25% (D) 30% (E) None<\/p><p class=\"pq\">70. Two trains, 150 m and 100 m long, run in opposite directions at 50 km/h and 40 km/h. They cross each other in —<\/p><p class=\"po\">(A) 8 s (B) 10 s (C) 12 s (D) 15 s (E) None<\/p><h3 id=\"c40-s5\">39.4 Mock Examination 2 — Part II (30 marks)<\/h3><p class=\"pq\">1. Problem solving — show your steps. [5 × 2 = 10]<\/p><p class=\"po\">(a) A PIN consists of four digits, each from 0 to 9, and digits may repeat. If a PIN is chosen at random, what is the probability that all four digits are odd?<\/p><p class=\"po\">(b) A train 240 m long crosses a bridge 360 m long in 30 seconds. Find its speed in km/h, and the time it would take to pass a man walking at 6 km/h in the same direction.<\/p><p class=\"pq\">2. বাংলা: শীত মৌসুমে গ্যাস ও বিদ্যুতের সাশ্রয়ী ব্যবহার নিশ্চিত করতে আপনার কার্যালয়ের সকল কর্মকর্তা-কর্মচারীর উদ্দেশে প্রশাসন বিভাগের পক্ষ থেকে একটি অফিস বিজ্ঞপ্তি (নোটিশ) লিখুন। [10]<\/p><p class=\"pq\">3. English: Write short notes on (a) LNG and (b) the Right to Information Act, 2009. [5 + 5 = 10]<\/p>"},{"id":"c41","no":40,"part":"PART G — QUESTION BANK","title":"Chapter 40: Answer Keys and Explanations for the Mock Examinations","short":"Answer Keys and Explanations for the Mock Examinations","toc":[["c41-s1","40.1 Mock Examination 1 — Part I"],["c41-s2","40.2 Mock Examination 1 — Part II (outline answers)"],["c41-s3","40.3 Mock Examination 2 — Part I"],["c41-s4","40.4 Mock Examination 2 — Part II (outline answers)"]],"html":"<h3 id=\"c41-s1\">40.1 Mock Examination 1 — Part I<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Q<\/th><th>Key<\/th><th>Why<\/th><th>Q<\/th><th>Key<\/th><th>Why<\/th><\/tr><tr><td>1<\/td><td>খ<\/td><td>অম্বু (জল) + ধি<\/td><td>36<\/td><td>C<\/td><td>Article 102<\/td><\/tr><tr><td>2<\/td><td>গ<\/td><td>কৃশানু = আগুন<\/td><td>37<\/td><td>B<\/td><td>formed 10 April; oath 17 April<\/td><\/tr><tr><td>3<\/td><td>খ<\/td><td>বিভাবরী = রাত্রি<\/td><td>38<\/td><td>C<\/td><td>five border states: WB, Assam, Meghalaya, Tripura, Mizoram<\/td><\/tr><tr><td>4<\/td><td>গ<\/td><td>প্রভাকর = সূর্য<\/td><td>39<\/td><td>C<\/td><td>1966, Lahore<\/td><\/tr><tr><td>5<\/td><td>খ<\/td><td>পদাধিকারবলে<\/td><td>40<\/td><td>C<\/td><td>Washington, DC<\/td><\/tr><tr><td>6<\/td><td>খ<\/td><td>পুরঃ + কার<\/td><td>41<\/td><td>B<\/td><td>ozone layer, 1987<\/td><\/tr><tr><td>7<\/td><td>গ<\/td><td>মুমূর্ষু<\/td><td>42<\/td><td>D<\/td><td>founders: Iran, Iraq, Kuwait, Saudi Arabia, Venezuela<\/td><\/tr><tr><td>8<\/td><td>খ<\/td><td>পিপীলিকা<\/td><td>43<\/td><td>C<\/td><td>SDG 7<\/td><\/tr><tr><td>9<\/td><td>খ<\/td><td>প্রতিযোগিতা<\/td><td>44<\/td><td>B<\/td><td>Hormuz<\/td><\/tr><tr><td>10<\/td><td>খ<\/td><td>অর্থের কুপ্রভাব<\/td><td>45<\/td><td>B<\/td><td>barometer<\/td><\/tr><tr><td>11<\/td><td>ক<\/td><td>নিতান্ত অলস<\/td><td>46<\/td><td>D<\/td><td>methane<\/td><\/tr><tr><td>12<\/td><td>খ<\/td><td>ভণ্ড<\/td><td>47<\/td><td>D<\/td><td>vitamin D<\/td><\/tr><tr><td>13<\/td><td>খ<\/td><td>পুনরায় আরম্ভ<\/td><td>48<\/td><td>A<\/td><td>COUNT (COUNTA counts non-empty cells)<\/td><\/tr><tr><td>14<\/td><td>গ<\/td><td>তিন ফলের সমাহার — দ্বিগু<\/td><td>49<\/td><td>C<\/td><td>F5<\/td><\/tr><tr><td>15<\/td><td>গ<\/td><td>পর্তুগিজ<\/td><td>50<\/td><td>C<\/td><td>1024 GB<\/td><\/tr><tr><td>16<\/td><td>B<\/td><td>cogent = convincing<\/td><td>51<\/td><td>D<\/td><td>24 November 2029<\/td><\/tr><tr><td>17<\/td><td>C<\/td><td>verb agrees with the nearer subject, \"directors\"<\/td><td>52<\/td><td>D<\/td><td>11 shallow + 15 deep<\/td><\/tr><tr><td>18<\/td><td>B<\/td><td>adept = skilled<\/td><td>53<\/td><td>B<\/td><td>Leo XIV<\/td><\/tr><tr><td>19<\/td><td>C<\/td><td>alleviate = relieve<\/td><td>54<\/td><td>C<\/td><td>Argentina<\/td><\/tr><tr><td>20<\/td><td>B<\/td><td>succinct = brief and clear<\/td><td>55<\/td><td>B<\/td><td>Asiatic Society<\/td><\/tr><tr><td>21<\/td><td>C<\/td><td>subjunctive after \"insisted that\"<\/td><td>56<\/td><td>C<\/td><td>1.5 × 0.8 = 1.2<\/td><\/tr><tr><td>22<\/td><td>B<\/td><td>panacea = cure-all<\/td><td>57<\/td><td>C<\/td><td>90 − 70 = 20<\/td><\/tr><tr><td>23<\/td><td>C<\/td><td>meagre = scanty<\/td><td>58<\/td><td>B<\/td><td>12 × 24/36 = 8<\/td><\/tr><tr><td>24<\/td><td>B<\/td><td>\"Each … has submitted\"<\/td><td>59<\/td><td>B<\/td><td>add: 5(x + y) = 25<\/td><\/tr><tr><td>25<\/td><td>B<\/td><td>senior <b>to<\/b> me<\/td><td>60<\/td><td>C<\/td><td>20 m/s = 72 km/h<\/td><\/tr><tr><td>26<\/td><td>B<\/td><td>dangling modifier: the notice board was not walking<\/td><td>61<\/td><td>C<\/td><td>3/8 of the tank = 45<\/td><\/tr><tr><td>27<\/td><td>E<\/td><td>subjunctive \"be\" is correct<\/td><td>62<\/td><td>C<\/td><td>96 × 5/8<\/td><\/tr><tr><td>28<\/td><td>C<\/td><td>parallelism: drafted … presented<\/td><td>63<\/td><td>B<\/td><td>(40 − 22) : (22 − 10) = 3 : 2<\/td><\/tr><tr><td>29<\/td><td>B<\/td><td>outdated<\/td><td>64<\/td><td>D<\/td><td>3 × 4 = 12 → remainder 5<\/td><\/tr><tr><td>30<\/td><td>C<\/td><td>cautious<\/td><td>65<\/td><td>D<\/td><td>3s − 10 = 5(s − 10) → s = 20<\/td><\/tr><tr><td>31<\/td><td>B<\/td><td>22 August 1974<\/td><td>66<\/td><td>B<\/td><td>(x − 3)² + 5<\/td><\/tr><tr><td>32<\/td><td>B<\/td><td>9 August (1975)<\/td><td>67<\/td><td>D<\/td><td>2x + y &gt; 4 + 1<\/td><\/tr><tr><td>33<\/td><td>C<\/td><td>GTCL<\/td><td>68<\/td><td>C<\/td><td>100/8 = 12.5<\/td><\/tr><tr><td>34<\/td><td>C<\/td><td>Haripur, Sylhet<\/td><td>69<\/td><td>B<\/td><td>25 + 20 − 35<\/td><\/tr><tr><td>35<\/td><td>B<\/td><td>adopted 4 November; in force 16 December 1972<\/td><td>70<\/td><td>A<\/td><td>36 km ÷ 5 h<\/td><\/tr><\/table><\/div><h3 id=\"c41-s2\">40.2 Mock Examination 1 — Part II (outline answers)<\/h3><ul><li><b>1(a)<\/b> Cheaper : dearer = (450 − 360) : (360 − 300) = 90 : 60 = 3 : 2. Of 30 kg: <b>18 kg at Tk 300 and 12 kg at Tk 450<\/b>. Check: 18 × 300 + 12 × 450 = 10,800 = 30 × 360.<\/li><li><b>1(b)<\/b> Let the trip be d days. 600/d − 600/(d + 5) = 10 → 3000 = 10d(d + 5) → d² + 5d − 300 = 0 → (d − 15)(d + 20) = 0 → <b>15 days<\/b>. Check: 40 − 30 = 10.<\/li><li><b>2<\/b> Use the application format of Chapter 10: তারিখ → বরাবর, ব্যবস্থাপনা পরিচালক, … গ্যাস … কোম্পানি → বিষয়: অবৈধ গ্যাস সংযোগ বিচ্ছিন্নকরণ প্রসঙ্গে → (১) নিজের পরিচয় ও গ্রাহক সংকেত; (২) সমস্যা: কোন এলাকায়, কত দিন ধরে, গ্যাসের চাপ কমে যাওয়া, দুর্ঘটনার ঝুঁকি ও রাজস্ব ক্ষতি; (৩) প্রার্থনা: সরেজমিন তদন্ত, অবৈধ সংযোগ বিচ্ছিন্ন, দায়ীদের বিরুদ্ধে গ্যাস আইন অনুযায়ী ব্যবস্থা → বিনীত নিবেদক (এলাকাবাসীর পক্ষে \"ক\")।<\/li><li><b>3<\/b> Position: agree, with a qualification. Reasons: imported LNG now supplies about two-fifths of gas and must be paid for in foreign currency at volatile prices; domestic gas is far cheaper; unexplored potential offshore and in Bhola and Sylhet. Concession: exploration takes years and carries risk, so LNG is needed as a bridge. Conclusion: explore first — strengthen BAPEX, attract IOCs through the 2026 bidding round — while using LNG only to fill the gap.<\/li><\/ul><h3 id=\"c41-s3\">40.3 Mock Examination 2 — Part I<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Q<\/th><th>Key<\/th><th>Why<\/th><th>Q<\/th><th>Key<\/th><th>Why<\/th><\/tr><tr><td>1<\/td><td>খ<\/td><td>উর্বী = পৃথিবী<\/td><td>36<\/td><td>B<\/td><td>night of 25 March 1971<\/td><\/tr><tr><td>2<\/td><td>গ<\/td><td>পন্নগ = সাপ<\/td><td>37<\/td><td>B<\/td><td>seven<\/td><\/tr><tr><td>3<\/td><td>খ<\/td><td>সত্যের অপলাপ = অস্বীকার<\/td><td>38<\/td><td>C<\/td><td>12th Amendment, 1991<\/td><\/tr><tr><td>4<\/td><td>খ<\/td><td>তিরোভাব<\/td><td>39<\/td><td>B<\/td><td>25<\/td><\/tr><tr><td>5<\/td><td>খ<\/td><td>শুদ্ধিপত্র<\/td><td>40<\/td><td>B<\/td><td>Secretary<\/td><\/tr><tr><td>6<\/td><td>গ<\/td><td>দুঃ + যোগ<\/td><td>41<\/td><td>C<\/td><td>St Martin's<\/td><\/tr><tr><td>7<\/td><td>খ<\/td><td>শারীরিক<\/td><td>42<\/td><td>C<\/td><td>land port, Dinajpur<\/td><\/tr><tr><td>8<\/td><td>গ<\/td><td>আকাঙ্ক্ষা<\/td><td>43<\/td><td>C<\/td><td>Kathmandu<\/td><\/tr><tr><td>9<\/td><td>গ<\/td><td>others: বহুবচনের দ্বিত্ব; \"-তা\" বাহুল্য; অশ্রুজল বাহুল্য<\/td><td>44<\/td><td>B<\/td><td>Maastricht, 1992<\/td><\/tr><tr><td>10<\/td><td>খ<\/td><td>নিতান্ত মন্দভাগ্য<\/td><td>45<\/td><td>B<\/td><td>Sweden<\/td><\/tr><tr><td>11<\/td><td>খ<\/td><td>গোপন রাখার চেষ্টা<\/td><td>46<\/td><td>C<\/td><td>Paris<\/td><\/tr><tr><td>12<\/td><td>খ<\/td><td>উভয় সংকট<\/td><td>47<\/td><td>B<\/td><td>red, green, blue<\/td><\/tr><tr><td>13<\/td><td>খ<\/td><td>জিজ্ঞাসা<\/td><td>48<\/td><td>D<\/td><td>fastest in solids<\/td><\/tr><tr><td>14<\/td><td>গ<\/td><td>মেঘ থেকে — অপাদানে ৭মী<\/td><td>49<\/td><td>E<\/td><td>vitamin K<\/td><\/tr><tr><td>15<\/td><td>গ<\/td><td>মানিক বন্দ্যোপাধ্যায়<\/td><td>50<\/td><td>C<\/td><td>HTML<\/td><\/tr><tr><td>16<\/td><td>B<\/td><td>since + point of time<\/td><td>51<\/td><td>B<\/td><td>centre<\/td><\/tr><tr><td>17<\/td><td>B<\/td><td>look forward to + V-ing<\/td><td>52<\/td><td>D<\/td><td>$C$4<\/td><\/tr><tr><td>18<\/td><td>C<\/td><td>no sooner … than<\/td><td>53<\/td><td>D<\/td><td>$3,020<\/td><\/tr><tr><td>19<\/td><td>C<\/td><td>accused of<\/td><td>54<\/td><td>D<\/td><td>Tk 9,38,000 crore<\/td><\/tr><tr><td>20<\/td><td>B<\/td><td>have + thing + V3<\/td><td>55<\/td><td>B<\/td><td>Picasso<\/td><\/tr><tr><td>21<\/td><td>B<\/td><td>\"the number of\" is singular<\/td><td>56<\/td><td>C<\/td><td>72 + 30<\/td><\/tr><tr><td>22<\/td><td>B<\/td><td>is being built<\/td><td>57<\/td><td>C<\/td><td>CP 800 → 840<\/td><\/tr><tr><td>23<\/td><td>B<\/td><td>statement order, past tense<\/td><td>58<\/td><td>C<\/td><td>42<\/td><\/tr><tr><td>24<\/td><td>B<\/td><td>kind<\/td><td>59<\/td><td>B<\/td><td>24, 26, 28, 30<\/td><\/tr><tr><td>25<\/td><td>C<\/td><td>extravagant<\/td><td>60<\/td><td>B<\/td><td>20 × 30/50<\/td><\/tr><tr><td>26<\/td><td>A<\/td><td>reject<\/td><td>61<\/td><td>A<\/td><td>36 ÷ 18<\/td><\/tr><tr><td>27<\/td><td>B<\/td><td>official delay<\/td><td>62<\/td><td>B<\/td><td>9 − 2<\/td><\/tr><tr><td>28<\/td><td>B<\/td><td>accommodation<\/td><td>63<\/td><td>B<\/td><td>5000 × 8 × 3/100<\/td><\/tr><tr><td>29<\/td><td>C<\/td><td>bureaucracy<\/td><td>64<\/td><td>C<\/td><td>side 12<\/td><\/tr><tr><td>30<\/td><td>B<\/td><td>part : whole<\/td><td>65<\/td><td>B<\/td><td>8 : 12 : 15<\/td><\/tr><tr><td>31<\/td><td>A<\/td><td>26 March 1972<\/td><td>66<\/td><td>C<\/td><td>6/36<\/td><\/tr><tr><td>32<\/td><td>C<\/td><td>Jamuna Oil belongs to BPC<\/td><td>67<\/td><td>B<\/td><td>(x − 2)(x − 5) &lt; 0<\/td><\/tr><tr><td>33<\/td><td>B<\/td><td>Titas<\/td><td>68<\/td><td>B<\/td><td>6 men = 10 women; 15 women take 12 × 5/15<\/td><\/tr><tr><td>34<\/td><td>C<\/td><td>Moheshkhali<\/td><td>69<\/td><td>B<\/td><td>25/125<\/td><\/tr><tr><td>35<\/td><td>B<\/td><td>BERC<\/td><td>70<\/td><td>B<\/td><td>250 m ÷ 25 m/s<\/td><\/tr><\/table><\/div><h3 id=\"c41-s4\">40.4 Mock Examination 2 — Part II (outline answers)<\/h3><ul><li><b>1(a)<\/b> Each digit is odd (1, 3, 5, 7, 9) with probability 5/10 = 1/2; the four digits are independent → (1/2)⁴ = <b>1/16 = 0.0625<\/b>.<\/li><li><b>1(b)<\/b> Distance = 240 + 360 = 600 m in 30 s → 20 m/s = <b>72 km/h<\/b>. Relative to the man: 72 − 6 = 66 km/h = 18.33 m/s → 240 ÷ 18.33 ≈ <b>13.1 seconds<\/b>.<\/li><li><b>2<\/b> বিজ্ঞপ্তির কাঠামো: প্রতিষ্ঠানের নাম ও বিভাগ → স্মারক নং ও তারিখ → শিরোনাম \"বিজ্ঞপ্তি\" → \"এতদ্বারা সংশ্লিষ্ট সকলের অবগতির জন্য জানানো যাচ্ছে যে, …\" → নির্দেশনা (কক্ষ ত্যাগের সময় বাতি, পাখা ও এসি বন্ধ; এসি ২৫° সেলসিয়াসের নিচে নয়; দিনের আলো ব্যবহার; গ্যাসের চুলা/হিটার অপ্রয়োজনে না জ্বালানো; লিকেজ দেখলে তাৎক্ষণিক জানানো) → কার্যকর হওয়ার তারিখ ও তদারকির দায়িত্ব → স্বাক্ষর, নাম, পদবি → বিতরণ।<\/li><li><b>3(a) LNG:<\/b> liquefied natural gas — natural gas cooled to about −162 °C so that it becomes a liquid about 1/600 of its volume and can be carried by ship; regasified at a terminal or FSRU; Bangladesh has imported it since 2018 through two FSRUs at Moheshkhali under long-term contracts with Qatar and Oman and spot purchases; it now supplies about two-fifths of the gas but is costly and exposes the country to world prices. <b>(b) RTI Act, 2009:<\/b> gives every citizen the right to information from public authorities; in force from 1 July 2009; designated officers must supply information within 20 working days; appeal within 30 days; Information Commission hears complaints; exemptions in section 7; aims at transparency, accountability and reduction of corruption.<\/li><\/ul>"},{"id":"c42","no":0,"part":"PART G — QUESTION BANK","title":"Sources and Verification Record","short":"Sources and Verification Record","toc":[["c42-s1","A. Official documents (read directly)"],["c42-s2","B. The three PDFs supplied by the candidate"],["c42-s3","C. Press and reference sources"],["c42-s4","D. What could not be verified"],["c42-s5","E. If you find an error"]],"html":"<h3 id=\"c42-s1\">A. Official documents (read directly)<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Document<\/th><th>Where and when read<\/th><\/tr><tr><td>Recruitment circular, Petrobangla Central Selection Committee, memo no. ২৮.০২.০০০০.০০০.০১১.২৬.০০২৭.২৬.৪৫৩, dated 29 September 2026 (10 pages)<\/td><td>copy at petrobanglajobprep.com/petrobangla-recruitment-circular-2026.pdf; read 15 November 2026. The official application portal is bogmc.teletalk.com.bd<\/td><\/tr><tr><td>পেট্রোবাংলা ও এর অধীন কোম্পানিসমূহের ৯ম ও ১০ম গ্রেডে কর্মকর্তা নিয়োগে কেন্দ্রীয়ভাবে প্রার্থী বাছাই নীতিমালা-২০২৩ (সংশোধিত ২০২৬), Bangladesh Gazette (Extraordinary), 5 October 2026, pp. 25893–25904<\/td><td>petrobangla.org.bd/pages/notices/centralselection-2026-amended-6ad3691cfde009fa70fce7f4; read 15 November 2026<\/td><\/tr><tr><td>Petrobangla website: \"পেট্রোবাংলার গঠন ও ইতিহাস\", \"ভিশন ও মিশন\", \"পেট্রোবাংলা সংশ্লিষ্ট আইন, অধ্যাদেশ ও রাষ্ট্রপতির আদেশ\"<\/td><td>petrobangla.org.bd; read 16 November 2026<\/td><\/tr><\/table><\/div><h3 id=\"c42-s2\">B. The three PDFs supplied by the candidate<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>File<\/th><th>Use made of it<\/th><\/tr><tr><td>PetroBangla=বিগত_প্রশ্ন_প্রিলি_রিটেন.pdf (82 scanned pages)<\/td><td>Petrobangla Assistant Manager 2016 (pp. 39–45); photograph of the original 22 November 2024 booklet (pp. 46–49); solutions to its mathematics (pp. 72–81). Also contains BPI Assistant Director 2020, Petrobangla Accounts Assistant 2019 and 2025 power-sector written papers, which were indexed but not used<\/td><\/tr><tr><td>Eminent Petro Bangla job solution.pdf (317 scanned pages)<\/td><td>General/administration-cadre papers of BAPEX 2023; Bakhrabad, Titas, GTCL, SGFL, PGCL (Administration), BGFCL and KGDCL 2021; Petrobangla 2011 (pp. 8–118). Finance, technical and power-sector sections were examined for relevance and excluded<\/td><\/tr><tr><td>Matrix Job Solution – Petrobangla 2011–2024.pdf (317 scanned pages)<\/td><td>Contents list and headers examined; it prints the same company papers. Used to confirm examination dates and setting bodies<\/td><\/tr><\/table><\/div><p class=\"sm\">All three files are image scans without a text layer; pages were read as images. Printed answer keys were re-checked; the places where this book departs from a printed key are stated in the text.<\/p><h3 id=\"c42-s3\">C. Press and reference sources<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Source<\/th><th>Used for<\/th><\/tr><tr><td>Prothom Alo, \"পেট্রোবাংলায় ৭৫৩ পদে চাকরি: নিয়োগ নীতিমালা ও পরীক্ষার নম্বর বণ্টন দেখুন\", updated 11 November 2026<\/td><td>number of posts; summary of the selection rules<\/td><\/tr><tr><td>Prothom Alo, \"পেট্রোবাংলার চাকরির লিখিত পরীক্ষার প্রস্তুতি নেবেন যেভাবে\", 26 May 2024 (by an Assistant Manager of BAPEX)<\/td><td>the 15 MCQ + 10 written split in mathematics; topic guidance<\/td><\/tr><tr><td>bdniyog.com, lyannabooks.com, bdmerit.com (question archives)<\/td><td>the 2024 paper's question count and timing; the 2024 Bangla items; lists of archived papers. Treated as unofficial<\/td><\/tr><tr><td>BSS, UNB, bdnews24, The Financial Express, Dhaka Tribune, The Daily Star, Prothom Alo English (reports of February–November 2026)<\/td><td>gas supply and reserves; Petrobangla chairman's statements; Offshore Bidding Round 2026; cabinet of February 2026; budget FY2026-27; BBS provisional estimates; LDC graduation deferral; referendum result<\/td><\/tr><\/table><\/div><h3 id=\"c42-s4\">D. What could not be verified<\/h3><ul><li>The MCQ/written split, duration, negative marking and setting body of the 2026 examination — not announced.<\/li><li>The written questions on pages 4–6 of the 2024 booklet — not in the sources.<\/li><li>The option sets of the fifteen Bangla questions of 2024, and the keys to Q44, Q50 and Q51 of that paper — taken from unofficial archives.<\/li><li>Current holders of several offices and several 2026 results (listed with \"check\" in Chapter 37).<\/li><li>Formation dates and details of individual companies in Chapter 34 and background figures in Chapter 35 that are not marked with a dated source were written from general reference knowledge and should be confirmed against the companies' own websites before being quoted in a viva.<\/li><li>Recent amendments to the labour, procurement, cyber-security and government-service laws are noted where known, but the current texts were not read for this book.<\/li><\/ul><h3 id=\"c42-s5\">E. If you find an error<\/h3><p>This is a first edition prepared quickly for one examination. Where the book and an official document disagree, the official document is right. Correct the page in your copy — the file is an ordinary editable Word document — and move on.<\/p>"}],"questions":[{"id":"pb24-q16","n":16,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"The negotiations reached a(n) ___ when both parties refused to compromise on critical issues, leaving the agreement in jeopardy.","options":{"A":"impasse","B":"culmination","C":"denouement","D":"prelude","E":"inception"},"answer":"A","explain":"refusal to compromise → deadlock"},{"id":"pb24-q17","n":17,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"Despite the company's rapid growth and market expansion, its profits have remained relatively stagnant, largely because of an inability to control costs, which ___ rising steadily over the past three years.","options":{"A":"has been","B":"is","C":"have been","D":"were","E":"had been"},"answer":"C","explain":"\"costs, which have been rising … over the past three years\""},{"id":"pb24-q18","n":18,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"Although the scientist was initially ___ by the complexity of the data, he soon developed a theory that not only explained the results but also predicted outcomes.","options":{"A":"bewildered","B":"intrigued","C":"mollified","D":"placated","E":"exonerated"},"answer":"A","explain":"\"although … initially ___ … soon developed a theory\": a negative state overcome"},{"id":"pb24-q19","n":19,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"The CEO's ___ approach to leadership alienated many of his subordinates, who felt stifled by his rigid policies and lack of empathy.","options":{"A":"autocratic","B":"benevolent","C":"laissez-faire","D":"deferential","E":"pragmatic"},"answer":"A","explain":"\"rigid policies and lack of empathy\""},{"id":"pb24-q20","n":20,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"The board of directors was unanimous in its decision, finding the plan both ___ and innovative.","options":{"A":"imprudent","B":"provident","C":"capricious","D":"volatile","E":"perfunctory"},"answer":"B","explain":"\"both ___ and innovative\": a positive word; provident = showing foresight"},{"id":"pb24-q21","n":21,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"In contrast to last year's model, the new electric car features a more efficient battery and a streamlined design, allowing it to travel farther on a single charge and ___ better in extreme weather conditions.","options":{"A":"perform","B":"performs","C":"performing","D":"performed","E":"None of these"},"answer":"A","explain":"parallel infinitives: to travel … and (to) perform"},{"id":"pb24-q22","n":22,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"Although Simran was afraid of heights, she seemed to have no ___ about driving over bridges.","options":{"A":"enormity","B":"qualms","C":"imminence","D":"resurrection","E":"None of these"},"answer":"B","explain":"qualms = misgivings"},{"id":"pb24-q23","n":23,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"Because of the ___ of reliable information, her report was comprised mostly of speculation.","options":{"A":"dearth","B":"diatribe","C":"myriad","D":"juxtaposition","E":"None of these"},"answer":"A","explain":"dearth = scarcity → \"mostly speculation\""},{"id":"pb24-q24","n":24,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"As far as (A) money is (B) concerned, I'd (C) like to be (D) rich. No error (E)","options":{"A":"As far as","B":"money is","C":"concerned, I'd","D":"like to be","E":"No error"},"answer":"E","explain":"\"As far as … is concerned\" is correct"},{"id":"pb24-q25","n":25,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"The restaurant had (A) burgers, sandwiches (B), and pizzas; we ordered (C) the former (D). No error (E)","options":{"A":"The restaurant had","B":"burgers, sandwiches","C":"and pizzas; we ordered","D":"the former","E":"No error"},"answer":"D","explain":"the former refers to the first of two, but three items are listed"},{"id":"pb24-q26","n":26,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"None of us have (A) enough money to undertake (B) the project alone, so we had (C) to depend on (D) our parents. No error (E)","options":{"A":"None of us have","B":"enough money to undertake","C":"the project alone, so we had","D":"to depend on","E":"No error"},"answer":"A","explain":"archived key. tense clash between have and had; see the note in Ch. 11"},{"id":"pb24-q27","n":27,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"It was (A) serendipity rather than (B) genius that leads (C) the archaeologist to his breathtaking discovery of (D) the ancient civilization. No error (E)","options":{"A":"It was","B":"serendipity rather than","C":"genius that leads","D":"the archaeologist to his breathtaking discovery of","E":"No error"},"answer":"C","explain":"leads → led (past narrative)"},{"id":"pb24-q28","n":28,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"The new guidelines mandate (A) that students not only (B) submit (C) their assignments on time, but also participate (D) actively in class discussions. No error (E)","options":{"A":"The new guidelines mandate","B":"that students not only","C":"submit","D":"their assignments on time, but also participate","E":"No error"},"answer":"E","explain":"subjunctive after mandate that; not only … but also is parallel"},{"id":"pb24-q29","n":29,"src":"Petrobangla AM 2024","label":"ACTUAL","section":"english","q":"LUGUBRIOUS","options":{"A":"Treasure","B":"Sanguine","C":"Engorged","D":"Gloomy","E":"None"},"answer":"D","explain":"lugubrious = mournful, gloomy"},{"id":"pb24-q30",
