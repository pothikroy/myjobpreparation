    <div class="title"><h1>পেট্রোবাংলা — সহকারী ব্যবস্থাপক (প্রশাসন)</h1><small>Petrobangla Assistant Manager (Administration) · গাইড · প্রশ্নব্যাংক · মডেল টেস্ট · ফ্ল্যাশকার্ড · লিখিত</small></div>

<script type="application/json" id="data-pb">{"chapters":[{"id":"c01","no":1,"part":"PART A — THE EXAMINATION","title":"Chapter 1: The Examination — Verified Structure and Rules","short":"The Examination — Verified Structure and Rules","toc":[["c01-s1","1.1 The post you are applying for (Verified)"],["c01-s2","1.2 The rules that govern selection (Verified)"],["c01-s3","1.3 What is NOT officially specified"],["c01-s4","1.4 The most recent precedent: 22 November 2024 (Historical evidence)"],["c01-s5","1.5 Examination structure and syllabus table"],["c01-s6","1.6 The viva voce"]],"html":"<h3 id=\"c01-s1\">1.1 The post you are applying for (Verified)<\/h3><p>The facts below were read directly from the recruitment circular signed by the General Manager (Administration), Petrobangla, as Member-Secretary of the Central Selection Committee (memo no. ২৮.০২.০০০০.০০০.০১১.২৬.০০২৭.২৬.৪৫৩, dated 29 September 2026 / ১৪ আশ্বিন ১৪৩৩).<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>What the circular says<\/th><\/tr><tr><td>Post (serial 1)<\/td><td>সহকারী ব্যবস্থাপক (প্রশাসন) — Assistant Manager (Administration)<\/td><\/tr><tr><td>Grade and scale<\/td><td>Grade 9; pay scale printed in the circular: ৪৪,০০০–১,০৫,৯০০ টাকা<\/td><\/tr><tr><td>Vacancies<\/td><td>97 in total: Petrobangla 14, BGFCL 1, SGFL 4, GTCL 6, Titas Gas (TGTDPLC) 43, BGDCL 20, KGDCL 2, PGCL 1, JGTDSL 1, SGCL 1, RPGCL 2, BCMCL 2<\/td><\/tr><tr><td>Qualification<\/td><td>Master's degree in any subject from a recognised university, or a four-year degree after HSC. No third division/class at any level.<\/td><\/tr><tr><td>Age<\/td><td>Maximum 32 years on 1 September 2026<\/td><\/tr><tr><td>Application<\/td><td>Online at bogmc.teletalk.com.bd, 18 October 2026 (10:00) to 17 November 2026 (17:00); fee Tk 200 + Tk 23 service charge = Tk 223<\/td><\/tr><tr><td>Posting<\/td><td>You rank the institutions in order of preference when you apply. After appointment you cannot move to another institution.<\/td><\/tr><tr><td>Related post<\/td><td>Serial 13: সহকারী কর্মকর্তা (প্রশাসন), Grade 10 — 73 posts; it sits the same style of general-cadre paper.<\/td><\/tr><\/table><\/div><p>The whole circular covers 753 officer posts in Grades 9 and 10 across Petrobangla and its companies (figure as reported by Prothom Alo, 11 November 2026). The date of the written examination had <b>not<\/b> been announced when this edition was prepared (16 November 2026); the circular says candidates will be informed by SMS and through www.petrobangla.org.bd.<\/p><h3 id=\"c01-s2\">1.2 The rules that govern selection (Verified)<\/h3><p>Selection is governed by <b>\"পেট্রোবাংলা ও এর অধীন কোম্পানিসমূহের ৯ম ও ১০ম গ্রেডে কর্মকর্তা নিয়োগে কেন্দ্রীয়ভাবে প্রার্থী বাছাই নীতিমালা-২০২৩ (সংশোধিত ২০২৬)\"<\/b>, published in the Bangladesh Gazette (Extraordinary) on 5 October 2026 and placed on the Petrobangla website on 17 October 2026. It was approved at the 629th meeting of the Petrobangla Board (26 August 2026) and is made under sections 7 and 25 of the Bangladesh Oil, Gas and Mineral Corporation Act, 2022. The policy states that appointments themselves follow the Petrobangla recruitment policy of 2016 (পেট্রোবাংলা নিয়োগ নীতিমালা-২০১৬).<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Rule<\/th><th>Provision of the policy<\/th><\/tr><tr><td>Total marks<\/td><td>100 (para 9.1). Minimum overall pass mark: 50 (para 9.2).<\/td><\/tr><tr><td>Components<\/td><td>Written examination 75 + educational qualification 15 + viva voce 10 (para 9.3).<\/td><\/tr><tr><td>Written examination<\/td><td>A paper of <b>100 marks<\/b>; the pass mark is 50%; the score is then scaled to 75 (para 9.4).<\/td><\/tr><tr><td>Subjects — Administration cadre (general), Grades 9 and 10<\/td><td><b>বাংলা ২৫, ইংরেজি ২৫, অংক ২৫, সাধারণ জ্ঞান ২৫<\/b> (para 9.4).<\/td><\/tr><tr><td>Subjects — other cadres<\/td><td>Bangla 15, English 15, Mathematics 15, General Knowledge 15 and the professional subject 40. This does <b>not<\/b> apply to your post.<\/td><\/tr><tr><td>Who sets the paper<\/td><td>The Central Selection Committee itself, or BUET, IBA or a similar reputed neutral institution under its supervision (para 5).<\/td><\/tr><tr><td>Call for viva<\/td><td>Six candidates per post (1:6), never fewer than two; results are published by roll number only (paras 6–7).<\/td><\/tr><tr><td>Viva marks (10)<\/td><td>Personality and aptitude 3, knowledge of the relevant subject 5, general knowledge 2 (para 9.6).<\/td><\/tr><tr><td>Final list<\/td><td>Written + viva + educational marks are added; posts are allotted by merit first and your institution preference second (para 11).<\/td><\/tr><tr><td>Waiting panel<\/td><td>Kept at 1:2, valid for one year or until the next circular (para 13).<\/td><\/tr><\/table><\/div><h4>Marks for educational qualification (15) — Administration and Finance cadres<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Examination<\/th><th>First division/class<\/th><th>Second<\/th><th>Third<\/th><\/tr><tr><td>SSC or equivalent<\/td><td>3<\/td><td>2<\/td><td>1<\/td><\/tr><tr><td>HSC or equivalent<\/td><td>4<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>Bachelor (pass)<\/td><td>5<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>Master's<\/td><td>3<\/td><td>2<\/td><td>1<\/td><\/tr><tr><td>Four-year bachelor's degree<\/td><td>8<\/td><td>6<\/td><td>3<\/td><\/tr><\/table><\/div><p class=\"sm\">A four-year degree holder is given the 8/6/3 marks and no separate marks for a master's. GPA/CGPA results are converted to divisions under the government and UGC equivalence rules. (As the circular bars third divisions, the last column is of no practical use to applicants.)<\/p><div class=\"bx bx-key\"><div class=\"bxh\">KEY FACT: What this means for you<\/div><p class=\"li\">With first-class results throughout, a four-year graduate carries 3 + 4 + 8 = <b>15/15<\/b> into the merit list before sitting the paper. You cannot change those marks now; the 75 written marks are where rank is decided.<\/p><p class=\"li\">The written score is scaled: every 4 marks on the paper are worth 3 marks in the merit list. One careless mark lost is 0.75 lost.<\/p><p class=\"li\">You must score at least 50 on the 100-mark paper to stay in the race at all.<\/p><\/div><h3 id=\"c01-s3\">1.3 What is NOT officially specified<\/h3><p>Neither the circular nor the gazetted policy states any of the following. Anyone who tells you these are \"official\" is guessing.<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Question<\/th><th>Status on 16 November 2026<\/th><\/tr><tr><td>How many of the 100 marks are MCQ and how many are descriptive<\/td><td><b>Not specified.<\/b><\/td><\/tr><tr><td>Duration of the paper<\/td><td><b>Not specified.<\/b><\/td><\/tr><tr><td>Negative marking<\/td><td><b>Not specified.<\/b> No previous paper in the sources carries a printed negative-marking rule either.<\/td><\/tr><tr><td>A topic-by-topic syllabus<\/td><td><b>None has been published.<\/b> Only the four subject names and their 25 marks each are official.<\/td><\/tr><tr><td>Which institution will set the 2026 paper<\/td><td><b>Not announced.<\/b> The policy permits IBA, BUET or a similar body.<\/td><\/tr><tr><td>A separate preliminary (screening) test<\/td><td>None is provided for in the policy: it describes one written examination followed by the viva.<\/td><\/tr><\/table><\/div><h3 id=\"c01-s4\">1.4 The most recent precedent: 22 November 2024 (Historical evidence)<\/h3><p>The last Petrobangla Assistant Manager paper for this cadre was held on 22 November 2024 and was set by the Institute of Business Administration (IBA), University of Dhaka. A photograph of the original question booklet (pages 1, 2, 3 and 7 of 7) is in your third PDF. It shows:<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Section<\/th><th>Marks<\/th><th>What it contained<\/th><\/tr><tr><td>Part I — MCQ<\/td><td>70<\/td><td>70 questions, <b>five options each (A–E)<\/b>; Bangla 15 (Q1–15), English 15 (Q16–30), General Knowledge 25 (Q31–55), Mathematics 15 (Q56–70)<\/td><\/tr><tr><td>Written — problem solving<\/td><td>10<\/td><td>\"Question 3: Problem Solving (Show your calculations/steps) [5 × 2 = 10 Marks]\" — two mathematics problems<\/td><\/tr><tr><td>Written — remainder<\/td><td>20 (inferred)<\/td><td>\"Question 2\" lay on the unscanned pages 4–6. If the paper totalled 100, it carried 20 marks. Its content is <b>not verified<\/b>.<\/td><\/tr><\/table><\/div><p>Notice how exactly this fits the official 25/25/25/25 rule: Mathematics 15 MCQ + 10 written = 25; General Knowledge 25 MCQ = 25; Bangla 15 MCQ and English 15 MCQ leave 10 + 10 = 20 marks of written Bangla and English. An Assistant Manager of BAPEX, writing in Prothom Alo on 26 May 2024, described the same thing: in mathematics \"১৫ নম্বর এমসিকিউ প্রশ্ন হয়ে থাকে আর সহকারী ব্যবস্থাপক/সহকারী কর্মকর্তার (প্রশাসন) ক্ষেত্রে ১০ নম্বর লিখিত।\" A question-archive site records the MCQ part as 70 questions in 60 minutes; that timing comes from a secondary source and is unverified.<\/p><div class=\"bx bx-ver\"><div class=\"bxh\">EVIDENCE STATUS: Reconciling the figures you may have seen<\/div><p class=\"li\">\"Bangla 25, English 25, Maths 25, GK 25\" — the official subject distribution of the 100-mark written paper (Verified, policy para 9.4).<\/p><p class=\"li\">\"70 questions, 60 minutes\" — the MCQ part of the 2024 paper only (Historical evidence; the timing is unverified).<\/p><p class=\"li\">\"Written 75, academic 15, viva 10\" — how the final merit list of 100 is built (Verified, para 9.3). The 100-mark paper is scaled to 75.<\/p><p class=\"li\">These are three descriptions of three different things. They do not contradict one another.<\/p><\/div><h3 id=\"c01-s5\">1.5 Examination structure and syllabus table<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Subject<\/th><th>Verified marks<\/th><th>Topics supported by previous papers<\/th><th>Evidence<\/th><th>Confidence<\/th><\/tr><tr><td>Bangla<\/td><td>25<\/td><td>Vocabulary (সমার্থক, শব্দার্থ, বিপরীত), বাগধারা, বানান, এক কথায় প্রকাশ, সন্ধি, সমাস, literature; written letter or composition<\/td><td>Marks: policy 9.4. Topics: 2011–2024 papers<\/td><td>Marks high; topics medium<\/td><\/tr><tr><td>English<\/td><td>25<\/td><td>Vocabulary in context, synonyms, sentence correction and error spotting, tense, prepositions, idioms, spelling; written essay, argument or short notes<\/td><td>Marks: policy 9.4. Topics: 2011–2024 papers<\/td><td>Marks high; topics medium<\/td><\/tr><tr><td>Mathematics<\/td><td>25<\/td><td>Percentage, profit, averages, ratio and mixture, fractions, speed and work, equations and inequalities, geometry; two to three written problems<\/td><td>Marks: policy 9.4. Split 15 MCQ + 10 written: 2024 paper<\/td><td>Marks high; split medium<\/td><\/tr><tr><td>General Knowledge<\/td><td>25<\/td><td>Bangladesh and world affairs, recent events, science, computer and ICT, energy sector<\/td><td>Marks: policy 9.4. Topics: 2011–2024 papers<\/td><td>Marks high; topics medium<\/td><\/tr><tr><td>MCQ/written split, time, negative marking<\/td><td>Not verified<\/td><td>2024: 70 MCQ + 30 written<\/td><td>2024 booklet<\/td><td>Low — may change<\/td><\/tr><\/table><\/div><h3 id=\"c01-s6\">1.6 The viva voce<\/h3><p>Five of the ten viva marks are for \"knowledge of the relevant subject\". For an administration post that means Petrobangla itself, the gas sector, office management and the rules an administrative officer works with. Part F of this book exists for that reason, and because energy questions also appear in the General Knowledge section of the written paper.<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 1<\/div><p class=\"li\">Post: Assistant Manager (Administration), Grade 9, 97 vacancies, 43 of them at Titas Gas.<\/p><p class=\"li\">Policy: Central Selection Policy 2023 (amended 2026), gazetted 5 October 2026.<\/p><p class=\"li\">Merit list = written 75 + education 15 + viva 10. Written paper is out of 100, pass mark 50, then scaled to 75.<\/p><p class=\"li\">Official distribution for your cadre: Bangla 25, English 25, Mathematics 25, General Knowledge 25.<\/p><p class=\"li\">Not official: MCQ/written split, duration, negative marking, detailed syllabus.<\/p><p class=\"li\">2024 precedent (IBA): 70 MCQ with five options + written part including two 5-mark mathematics problems.<\/p><\/div>"},{"id":"c02","no":2,"part":"PART A — THE EXAMINATION","title":"Chapter 2: What the Previous Papers Actually Asked","short":"What the Previous Papers Actually Asked","toc":[["c02-s1","2.1 The evidence base"],["c02-s2","2.2 Subject distribution in the three Petrobangla Assistant Manager papers"],["c02-s3","2.3 Subject distribution across all eleven papers"],["c02-s4","2.4 Bangla — topic frequency"],["c02-s5","2.5 English — topic frequency"],["c02-s6","2.6 Mathematics — topic frequency"],["c02-s7","2.7 General Knowledge — what it is made of"],["c02-s8","2.8 Questions and facts that came back"],["c02-s9","2.9 The written part — what has been set"],["c02-s10","2.10 Preparation weightage model"]],"html":"<h3 id=\"c02-s1\">2.1 The evidence base<\/h3><p>Your three PDFs are scans without a text layer, so each relevant page was read as an image. Two of the books (Matrix and Eminent, 317 pages each) cover the whole Ministry of Power, Energy and Mineral Resources; most of their pages are finance, engineering and power-sector papers that have nothing to do with your post. The third (82 pages) holds the Petrobangla papers themselves. The papers below were transcribed in full and form the \"question database\" behind this book.<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Paper (general/administration cadre)<\/th><th>Date<\/th><th>Set by<\/th><th>MCQs logged<\/th><\/tr><tr><td><b>Petrobangla — Assistant Manager<\/b><\/td><td>22.11.2024<\/td><td>IBA, DU<\/td><td>70<\/td><\/tr><tr><td><b>Petrobangla — Assistant Manager<\/b><\/td><td>2016<\/td><td>(IBA style)<\/td><td>60<\/td><\/tr><tr><td><b>Petrobangla — Assistant Manager (General)<\/b><\/td><td>05.08.2011<\/td><td>—<\/td><td>44 (recalled)<\/td><\/tr><tr><td>PGCL — Assistant Manager (<b>Administration<\/b>)<\/td><td>18.09.2021<\/td><td>IBA, DU<\/td><td>80<\/td><\/tr><tr><td>BAPEX — Assistant Manager (General)<\/td><td>27.01.2023<\/td><td>IBA, DU<\/td><td>60<\/td><\/tr><tr><td>Titas Gas — Assistant Manager (General)<\/td><td>08.10.2021<\/td><td>IBA, DU<\/td><td>60<\/td><\/tr><tr><td>BGFCL — Assistant Manager (General)<\/td><td>03.12.2021<\/td><td>IBA, DU<\/td><td>60<\/td><\/tr><tr><td>GTCL — Assistant Manager (General)<\/td><td>26.11.2021<\/td><td>IBA, DU<\/td><td>40<\/td><\/tr><tr><td>KGDCL — Assistant Manager (General)<\/td><td>04.12.2021<\/td><td>Business Faculty, DU<\/td><td>50<\/td><\/tr><tr><td>Bakhrabad — Assistant Manager (General)<\/td><td>16.10.2021<\/td><td>Business Faculty, DU<\/td><td>30 (partly logged)<\/td><\/tr><tr><td>SGFL — Assistant Manager (General)<\/td><td>01.10.2021<\/td><td>Business Faculty, DU<\/td><td>20 (partly logged)<\/td><\/tr><\/table><\/div><p class=\"sm\">Sources: Petrobangla 2024 and 2016 from \"PetroBangla=বিগত প্রশ্ন প্রিলি রিটেন\" pp. 39–49 and 72–81; all others from the Eminent book pp. 8–118. The Matrix book prints the same papers. The 15 Bangla items of the 2024 paper were illegible in the photograph and were taken from a public question archive (lyannabooks.com), so they carry a lower level of confidence. Indexed but not transcribed: SGCL Coordination Officer 2020, GTCL 2018, Bakhrabad/BGFCL/BAPEX 2017, BGFCL 2011, Petrobangla Upper Division Assistant 2017 and Accounts Assistant 2019, and all finance, technical and power-sector papers.<\/p><div class=\"bx bx-key\"><div class=\"bxh\">KEY FACT: Who sets the paper matters more than which company it is for<\/div><p class=\"li\">Seven of the eleven papers, including the 2024 Petrobangla paper, were set by <b>IBA<\/b>. IBA papers have five options, vocabulary-heavy English, GMAT-style sentence correction and word-problem mathematics written in English.<\/p><p class=\"li\">The <b>Business Faculty (FBS)<\/b> papers of 2021 have four options and far more textbook grammar: Bangla phonetics, tense, voice, analogy.<\/p><p class=\"li\">Prepare for the IBA style first, because it is harder and it is the Petrobangla precedent; the FBS style is then covered automatically.<\/p><\/div><h3 id=\"c02-s2\">2.2 Subject distribution in the three Petrobangla Assistant Manager papers<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Subject<\/th><th>2024 (70 MCQ)<\/th><th>2016 (60 MCQ)<\/th><th>2011 (44 recalled)<\/th><\/tr><tr><td>Bangla<\/td><td>15<\/td><td>15<\/td><td>10<\/td><\/tr><tr><td>English<\/td><td>15<\/td><td>15<\/td><td>9<\/td><\/tr><tr><td>Mathematics<\/td><td>15 (+10 written)<\/td><td>15<\/td><td>none recalled<\/td><\/tr><tr><td>General Knowledge incl. science, ICT, current affairs<\/td><td>25<\/td><td>15<\/td><td>25<\/td><\/tr><\/table><\/div><p class=\"sm\">The 2011 paper survives only as recalled questions; the absence of mathematics there is a gap in the record, not evidence that none was set.<\/p><h3 id=\"c02-s3\">2.3 Subject distribution across all eleven papers<\/h3><p>Counted from the database: 551 MCQs (536 transcribed from the scans and 15 from the archive).<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Subject area<\/th><th>Questions found<\/th><th>Share<\/th><\/tr><tr><td>General Knowledge (Bangladesh, international, current affairs, sport)<\/td><td>128<\/td><td>23%<\/td><\/tr><tr><td>English<\/td><td>123<\/td><td>22%<\/td><\/tr><tr><td>Bangla<\/td><td>119<\/td><td>22%<\/td><\/tr><tr><td>Mathematics (plus written problems, not counted here)<\/td><td>104<\/td><td>19%<\/td><\/tr><tr><td>Computer and ICT<\/td><td>37<\/td><td>7%<\/td><\/tr><tr><td>Science<\/td><td>20<\/td><td>4%<\/td><\/tr><tr><td>Energy sector and Petrobangla<\/td><td>15<\/td><td>3%<\/td><\/tr><tr><td>Analytical puzzle (one set, BAPEX 2023)<\/td><td>5<\/td><td>1%<\/td><\/tr><\/table><\/div><p class=\"sm\">20 of the 37 ICT questions come from a single paper — PGCL Assistant Manager (Administration) 2021 — which devoted a whole section to MS Word and Excel. It is the only paper in the set written specifically for an <i>administration<\/i> post, so that section deserves respect.<\/p><h3 id=\"c02-s4\">2.4 Bangla — topic frequency<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Questions found<\/th><th>Papers in which it appeared<\/th><th>Priority<\/th><\/tr><tr><td>শব্দার্থ ও সমার্থক শব্দ<\/td><td>23<\/td><td>PB 2024, 2011; BAPEX 2023; Titas, PGCL, KGDCL 2021<\/td><td>High<\/td><\/tr><tr><td>বাগধারা<\/td><td>20<\/td><td>PB 2024 (4), PB 2016 (8), PB 2011; all 2021 papers<\/td><td>High<\/td><\/tr><tr><td>বানান (শুদ্ধ বানান)<\/td><td>13<\/td><td>PB 2024 (3), PB 2016 (2); BAPEX 2023 (4); Titas, KGDCL<\/td><td>High<\/td><\/tr><tr><td>সাহিত্য (লেখক, গ্রন্থ, উক্তি)<\/td><td>11<\/td><td>PGCL, GTCL, BGFCL, KGDCL 2021; PB 2011<\/td><td>Medium<\/td><\/tr><tr><td>এক কথায় প্রকাশ<\/td><td>8<\/td><td>PB 2016 (2); Titas, GTCL, BGFCL, PGCL 2021<\/td><td>High<\/td><\/tr><tr><td>সন্ধি বিচ্ছেদ<\/td><td>6<\/td><td>PB 2024, 2011; PGCL (3), BGFCL 2021<\/td><td>High<\/td><\/tr><tr><td>বিপরীত শব্দ<\/td><td>3<\/td><td>PGCL (2), GTCL 2021<\/td><td>Medium<\/td><\/tr><tr><td>লিঙ্গ (নিত্য পুরুষবাচক)<\/td><td>3<\/td><td>PB 2016; GTCL, Bakhrabad 2021<\/td><td>Medium<\/td><\/tr><tr><td>ধ্বনি, বর্ণ, উচ্চারণ<\/td><td>5<\/td><td>KGDCL, Bakhrabad 2021 (FBS papers)<\/td><td>Low–medium<\/td><\/tr><tr><td>উপসর্গ, প্রত্যয়, সমাস, শব্দের উৎস<\/td><td>8<\/td><td>PB 2024 (2), PB 2011; PGCL, BGFCL, Bakhrabad<\/td><td>Medium<\/td><\/tr><tr><td>কাল, বাচ্য, কারক, বচন, দ্বিরুক্তি, সাধু–চলিত<\/td><td>10<\/td><td>PB 2016, 2011; GTCL, PGCL, Bakhrabad<\/td><td>Medium<\/td><\/tr><\/table><\/div><p>Reading: three-quarters of the Bangla MCQ marks in the Petrobangla papers are <b>vocabulary in one form or another<\/b> — meaning, synonym, idiom, spelling, one-word substitution. Pure literature has been light in IBA papers (none in Petrobangla 2024 or 2016), though it does appear in the company papers.<\/p><h3 id=\"c02-s5\">2.5 English — topic frequency<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Questions found<\/th><th>Papers<\/th><th>Priority<\/th><\/tr><tr><td>Vocabulary in context (sentence completion, word pairs)<\/td><td>29<\/td><td>Every IBA paper; PB 2024 (6), PB 2016 (2)<\/td><td>High<\/td><\/tr><tr><td>Sentence correction and error spotting (parallelism, modifiers, comparison, agreement, tense consistency)<\/td><td>27<\/td><td>PB 2024 (5), PB 2016 (9); GTCL, BGFCL, KGDCL<\/td><td>High<\/td><\/tr><tr><td>Synonyms and antonyms<\/td><td>21<\/td><td>PB 2024 (2), PB 2016 (3), PB 2011 (2); BAPEX, Titas, PGCL<\/td><td>High<\/td><\/tr><tr><td>Tense and verb forms (incl. gerund, causative)<\/td><td>12<\/td><td>KGDCL (6), BGFCL, Bakhrabad, PB 2011<\/td><td>Medium<\/td><\/tr><tr><td>Prepositions and phrasal verbs<\/td><td>9<\/td><td>BAPEX (4), Titas, PB 2016, PB 2011, Bakhrabad<\/td><td>Medium<\/td><\/tr><tr><td>Idioms and phrases<\/td><td>6<\/td><td>PGCL (4), BAPEX, Bakhrabad<\/td><td>Medium<\/td><\/tr><tr><td>Spelling<\/td><td>6<\/td><td>BGFCL (5), Bakhrabad<\/td><td>Medium<\/td><\/tr><tr><td>Voice<\/td><td>2<\/td><td>PB 2011, Bakhrabad<\/td><td>Low–medium<\/td><\/tr><tr><td>Analogy<\/td><td>2<\/td><td>KGDCL<\/td><td>Low<\/td><\/tr><tr><td>Narration, literature<\/td><td>0<\/td><td>—<\/td><td>Low<\/td><\/tr><\/table><\/div><p>Reading: not one question on English literature and none on narration appears in the eleven papers. English here is a test of <b>vocabulary and of the ability to see why a sentence is wrong<\/b>.<\/p><h3 id=\"c02-s6\">2.6 Mathematics — topic frequency<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Questions found<\/th><th>Papers<\/th><th>Priority<\/th><\/tr><tr><td>Percentage, profit–loss, discount, interest<\/td><td>16<\/td><td>PB 2024 (4); every 2021 paper; BAPEX<\/td><td>High<\/td><\/tr><tr><td>Algebra: equations, expressions, inequality, quadratic, indices, surds<\/td><td>21<\/td><td>PB 2024 (5), PB 2016 (3); all IBA papers<\/td><td>High<\/td><\/tr><tr><td>Average<\/td><td>10<\/td><td>PB 2024; Titas (3), BGFCL (2), KGDCL (2), GTCL<\/td><td>High<\/td><\/tr><tr><td>Ratio, mixture, partnership<\/td><td>10<\/td><td>PB 2024 (written), PB 2016; Titas (4), BAPEX<\/td><td>High<\/td><\/tr><tr><td>Speed, train, boat<\/td><td>8<\/td><td>PB 2024, PB 2016; BAPEX (3), Titas (2)<\/td><td>High<\/td><\/tr><tr><td>Geometry and mensuration<\/td><td>8<\/td><td>PB 2016 (3); BGFCL (2), GTCL, PGCL, Bakhrabad<\/td><td>Medium<\/td><\/tr><tr><td>Fractions<\/td><td>7<\/td><td>PB 2024, PB 2016 (3); BGFCL, KGDCL, BAPEX<\/td><td>High<\/td><\/tr><tr><td>Numbers: remainder, divisibility, HCF<\/td><td>7<\/td><td>PB 2024; BAPEX, BGFCL (3), GTCL, KGDCL<\/td><td>Medium<\/td><\/tr><tr><td>Work and time<\/td><td>5<\/td><td>PB 2024, PB 2016; GTCL (2), KGDCL<\/td><td>Medium<\/td><\/tr><tr><td>Age<\/td><td>4<\/td><td>PB 2024; PGCL, GTCL, Titas<\/td><td>Medium<\/td><\/tr><tr><td>Probability, sets, series<\/td><td>3 MCQ + 1 written<\/td><td>BAPEX, PB 2016, KGDCL<\/td><td>Low–medium<\/td><\/tr><\/table><\/div><p>Reading: the mathematics is arithmetic and early algebra <b>dressed in English sentences<\/b>. Logarithms, trigonometry, progressions and permutation did not appear once as an MCQ; probability appeared twice (once as a written question). The difficulty lies in turning a paragraph into an equation quickly, not in advanced technique.<\/p><h3 id=\"c02-s7\">2.7 General Knowledge — what it is made of<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Area<\/th><th>What was asked<\/th><th>Priority<\/th><\/tr><tr><td>Recent events (previous 6–12 months)<\/td><td>2024: Tangail saree GI, Mpox, Paris Olympics, Hamas leadership, NATO's newest member, Starliner, \"Three Zeros\". Every paper has 5–9 such items.<\/td><td>High<\/td><\/tr><tr><td>Bangladesh: history, Liberation War, geography, government<\/td><td>Operation Searchlight, Mujibnagar, gallantry awards, reserved seats, neighbouring Indian states, city corporations, ethnic groups<\/td><td>High<\/td><\/tr><tr><td>International organisations and treaties<\/td><td>ASEAN, NATO, OPEC, IAEA, UNESCO, ESCAP, UNHCR, Maastricht, CTBT, Montreal Protocol, SDGs<\/td><td>High<\/td><\/tr><tr><td>World geography and general facts<\/td><td>Capitals, straits, ports, lakes, currencies, \"land of the rising sun\"<\/td><td>Medium<\/td><\/tr><tr><td>Science<\/td><td>Instruments, vitamins, light and sound, disease, UV rays<\/td><td>Medium<\/td><\/tr><tr><td>Computer and ICT<\/td><td>Excel functions, Word shortcuts, storage units, IoT, OCR, search engines<\/td><td>High for an administration post<\/td><\/tr><tr><td>Energy sector<\/td><td>Largest gas field, first offshore field, 28th gas field, Energy Security Day, Petroleum Act 1974, Eastern Refinery, Jamalganj coal, Maitree power plant, OPEC<\/td><td>High — easy marks no other book gives you<\/td><\/tr><\/table><\/div><h3 id=\"c02-s8\">2.8 Questions and facts that came back<\/h3><p><span class=\"tg tg-repeated\">REPEATED<\/span> items found in the database — each of these has been asked at least twice:<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Question or fact<\/th><th>Where<\/th><\/tr><tr><td>'একাদশে বৃহস্পতি' — সৌভাগ্যের বিষয়<\/td><td>Petrobangla 2016 (twice in the same paper), BAPEX 2023<\/td><\/tr><tr><td>শুদ্ধ বানান: দেদীপ্যমান<\/td><td>Titas 2021, Petrobangla 2024<\/td><\/tr><tr><td>'সম্মুখে অগ্রসর হয়ে অভ্যর্থনা' — প্রত্যুদ্গমন<\/td><td>GTCL 2021, BGFCL 2021<\/td><\/tr><tr><td>নিত্য পুরুষবাচক শব্দ (কবিরাজ, ঢাকী, সভাপতি)<\/td><td>Petrobangla 2016, GTCL 2021, Bakhrabad 2021<\/td><\/tr><tr><td>Banglapedia is published by the Asiatic Society<\/td><td>Petrobangla 2011, PGCL 2021<\/td><\/tr><tr><td>Shift + Delete permanently deletes a file<\/td><td>Titas 2021, BAPEX 2023<\/td><\/tr><tr><td>IoT = Internet of Things<\/td><td>Titas 2021, BAPEX 2023<\/td><\/tr><tr><td>SDGs are to be achieved by 2030<\/td><td>Titas 2021, BAPEX 2023<\/td><\/tr><tr><td>OPEC (members; controls crude price; short note)<\/td><td>Titas 2021, BGFCL 2021, GTCL 2021 (written)<\/td><\/tr><tr><td>ASEAN (full form; which country is not a member)<\/td><td>Petrobangla 2011, Petrobangla 2024<\/td><\/tr><tr><td>\"The work of A, B together\" and \"tank filled from 1/3 to 7/9\" fraction problems<\/td><td>Petrobangla 2016, Petrobangla 2024<\/td><\/tr><\/table><\/div><h3 id=\"c02-s9\">2.9 The written part — what has been set<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Paper<\/th><th>Written questions<\/th><\/tr><tr><td>Petrobangla 2024<\/td><td>Two mathematics problems (5 marks each): a paint-mixture problem and a tour-budget problem leading to a quadratic. Other written questions not recorded.<\/td><\/tr><tr><td>PGCL (Administration) 2021<\/td><td>A passage on power and renewable energy [5]; essay \"Covid-19 Impact on Economy of Bangladesh\" [10]; one mathematics problem [5].<\/td><\/tr><tr><td>GTCL 2021<\/td><td>Argument writing: \"Small and medium businesses are more important than large business.\" [10]; short notes on OPEC and FIFA World Cup 2022 [10].<\/td><\/tr><tr><td>KGDCL 2021<\/td><td>Opinion essay on computers [5]; বাংলা পত্র — বীমা কোম্পানিকে দুর্ঘটনার বিবরণ [5]; probability [5]; average speed [5]; five short GK answers [10].<\/td><\/tr><tr><td>Bakhrabad 2021<\/td><td>Three mathematics problems [15]; অধীনস্থ কর্মচারীকে কারণ দর্শানোর চিঠি; English writing.<\/td><\/tr><tr><td>SGFL 2021<\/td><td>গ্যাসের প্রিপেইড মিটার স্থাপনের অনুরোধ জানিয়ে পত্র [10]; essay \"Affordable and Clean Energy\" [15].<\/td><\/tr><\/table><\/div><p>Three patterns stand out: written mathematics is almost always present; the Bangla task is usually an <b>official or application letter<\/b> on an office or gas-service situation; the English task is an <b>argument or short essay<\/b>, often on energy or the economy.<\/p><h3 id=\"c02-s10\">2.10 Preparation weightage model<\/h3><div class=\"bx bx-ver\"><div class=\"bxh\">EVIDENCE STATUS: Status<\/div><p class=\"\">This is a <b>preparation recommendation<\/b> derived from the historical data above. It is not an official syllabus, and the marks beside each subject are the only official figures in it.<\/p><\/div><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Subject (official marks)<\/th><th>Share of study time<\/th><th>Order of attack<\/th><th>Chapters<\/th><\/tr><tr><td>Mathematics (25)<\/td><td>30%<\/td><td>Percentage and profit → ratio and mixture → average → speed and work → equations and inequalities → fractions and numbers → geometry → written practice<\/td><td>19–26<\/td><\/tr><tr><td>English (25)<\/td><td>25%<\/td><td>Vocabulary list daily → sentence correction → tense and agreement → prepositions and idioms → essay and argument writing<\/td><td>11–18<\/td><\/tr><tr><td>Bangla (25)<\/td><td>20%<\/td><td>বাগধারা, সমার্থক, বানান, এক কথায় daily → সন্ধি, সমাস → remaining grammar → literature tables → পত্র লিখন<\/td><td>3–10<\/td><\/tr><tr><td>General Knowledge (25)<\/td><td>25%<\/td><td>Current affairs and energy sector → Bangladesh affairs → international organisations → ICT → science<\/td><td>27–37<\/td><\/tr><\/table><\/div><p>Mathematics receives the largest share although it carries the same marks, for two reasons: a mathematics answer is either fully right or fully wrong, and ten of its marks have historically been written, where method is rewarded.<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 2<\/div><p class=\"li\">Eleven general-cadre papers, 551 MCQs, were analysed; seven were set by IBA.<\/p><p class=\"li\">Bangla = vocabulary, idiom, spelling, one-word substitution, সন্ধি. English = vocabulary in context and sentence correction. Mathematics = word problems in English on percentage, ratio, average, speed, equations.<\/p><p class=\"li\">General Knowledge = recent events + Bangladesh + organisations, with ICT and energy-sector questions that suit an administration post.<\/p><p class=\"li\">Written part: mathematics problems, a Bangla official letter, an English argument or essay.<\/p><\/div>"},{"id":"c03","no":0,"part":"PART A — THE EXAMINATION","title":"Study Plan and Examination Technique","short":"Study Plan and Examination Technique","toc":[["c03-s1","3.1 A six-week plan (adjust to the announced date)"],["c03-s2","3.2 Spaced revision"],["c03-s3","3.3 In the examination hall"]],"html":"<h3 id=\"c03-s1\">3.1 A six-week plan (adjust to the announced date)<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Week<\/th><th>Main work<\/th><th>Daily fixed habit<\/th><\/tr><tr><td>1<\/td><td>Part A; Mathematics chapters 19–21; Bangla chapter 7 (শব্দভাণ্ডার)<\/td><td>25 English words (Ch. 15), 20 বাগধারা, 10 mathematics problems<\/td><\/tr><tr><td>2<\/td><td>Mathematics 22–24; English 11–13; Bangla 3–5<\/td><td>Same; add one page of current affairs (Ch. 37)<\/td><\/tr><tr><td>3<\/td><td>English 14–16; Bangla 6, 8, 9; GK 27–29<\/td><td>Same; revise week 1 words on day 1 of the week<\/td><\/tr><tr><td>4<\/td><td>GK 30–33; Part F (34–36); Mathematics 25–26<\/td><td>One timed 20-question mathematics set<\/td><\/tr><tr><td>5<\/td><td>Written work: Bangla letter, English argument, written mathematics (Ch. 10, 17, 26); previous papers in Part G<\/td><td>One full previous paper every second day<\/td><\/tr><tr><td>6<\/td><td>Mock tests; Quick Revision boxes; formula sheet; Chapter 37 updated from the news<\/td><td>Sleep, not new material<\/td><\/tr><\/table><\/div><h3 id=\"c03-s2\">3.2 Spaced revision<\/h3><p>Memory fades fastest in the first two days. Revise each list four times: the same evening, after 2 days, after 7 days, after 21 days. Mark a word or fact only when you get it right on two visits in a row. This is why the vocabulary chapters are printed as tables: cover the right-hand column and test yourself.<\/p><h3 id=\"c03-s3\">3.3 In the examination hall<\/h3><ul><li><b>Order.<\/b> Do Bangla and General Knowledge first: each answer takes seconds and either you know it or you do not. Then English. Leave mathematics for the largest unbroken block of time.<\/li><li><b>Two passes.<\/b> On the first pass answer only what you are sure of and mark the rest. A hard question carries the same mark as an easy one.<\/li><li><b>Five options.<\/b> IBA papers carry an option E, often \"None of these\". In mathematics it is correct more often than candidates expect — in the papers analysed, \"None\" was the right answer in GTCL 2021 Q22, BGFCL 2021 Q38, PGCL 2021 Q39 and Petrobangla 2024 Q59. Work the problem out; do not choose the option that \"looks closest\".<\/li><li><b>Negative marking.<\/b> None is officially stated. Read the instructions on the cover of your booklet: if a penalty is printed there, guess only when you can eliminate at least two options; if none is printed, leave nothing blank.<\/li><li><b>Written part.<\/b> Show every step in mathematics — the booklet itself says \"Show your calculations/steps\". In letters follow the form exactly (Chapter 10). In English writing, three clear paragraphs beat one long one.<\/li><\/ul><div class=\"bx bx-mem\"><div class=\"bxh\">MEMORY AID: The 4-3 rule<\/div><p class=\"\">Every 4 marks on the paper become 3 in the merit list. Twelve extra correct MCQs — three per subject — move you 9 merit marks, which is almost the whole of the viva.<\/p><\/div>"},{"id":"c04","no":3,"part":"PART B — BANGLA","title":"Chapter 3: ভাষা, ধ্বনি ও বর্ণ","short":"ভাষা, ধ্বনি ও বর্ণ","toc":[["c04-s1","3.1 কেন পড়বেন"],["c04-s2","3.2 ভাষা ও ব্যাকরণ"],["c04-s3","3.3 ধ্বনি ও বর্ণ — সংখ্যাগুলো"],["c04-s4","3.4 প্রমিত উচ্চারণ"],["c04-s5","3.5 ণত্ব ও ষত্ব বিধান"]],"html":"<h3 id=\"c04-s1\">3.1 কেন পড়বেন<\/h3><p>পেট্রোবাংলার আইবিএ-প্রণীত প্রশ্নে ধ্বনিতত্ত্ব কম আসে, কিন্তু বিজনেস ফ্যাকাল্টির প্রশ্নে (কর্ণফুলী ও বাখরাবাদ ২০২১) এখান থেকেই চার-পাঁচটি প্রশ্ন ছিল। এই অধ্যায়টি ছোট; একবার বুঝে নিলে আর ভুল হয় না।<\/p><h3 id=\"c04-s2\">3.2 ভাষা ও ব্যাকরণ<\/h3><ul><li><b>ভাষা আগে, ব্যাকরণ পরে।<\/b> ব্যাকরণ ভাষাকে বিশ্লেষণ করে; ভাষাকে তৈরি করে না। তাই \"ব্যাকরণ ভাষার অনুগামী\" — <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span>।<\/li><li>বাংলা ভাষা <b>ইন্দো-ইউরোপীয়<\/b> ভাষাবংশের সদস্য। ক্রম: ইন্দো-ইউরোপীয় → শতম → আর্য (ইন্দো-ইরানীয়) → ভারতীয় আর্য → প্রাকৃত → (ড. মুহম্মদ শহীদুল্লাহর মতে গৌড়ী প্রাকৃত; সুনীতিকুমারের মতে মাগধী প্রাকৃত) → অপভ্রংশ → বাংলা।<\/li><li>\"হিস্পানি\" (স্প্যানিশ) একটি ভাষার নাম, ভাষাবংশের নাম নয় — <span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021<\/span>।<\/li><li>বাংলার নিকটতম আত্মীয় ভাষা: অহমিয়া (আসামি) ও ওড়িয়া।<\/li><li>ব্যাকরণের চারটি মূল আলোচ্য বিষয়: <b>ধ্বনিতত্ত্ব<\/b> (ধ্বনি, বর্ণ, সন্ধি, ণত্ব-ষত্ব), <b>রূপতত্ত্ব<\/b> (শব্দ, পদ, প্রত্যয়, উপসর্গ, সমাস, কারক, ক্রিয়াবিশেষণ), <b>বাক্যতত্ত্ব<\/b> (বাক্য, বাচ্য, উক্তি, যতিচিহ্ন), <b>অর্থতত্ত্ব<\/b> (প্রতিশব্দ, বিপরীত শব্দ, বাগধারা)। <span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021 — রূপতত্ত্বের অন্তর্ভুক্ত: ক্রিয়াবিশেষণ<\/span><\/li><\/ul><h4>সাধু ও চলিত রীতি<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>বিষয়<\/th><th>সাধু<\/th><th>চলিত<\/th><\/tr><tr><td>ক্রিয়া ও সর্বনাম<\/td><td>পূর্ণরূপ: করিয়াছি, তাহারা, ইহা<\/td><td>সংক্ষিপ্ত: করেছি, তারা, এ<\/td><\/tr><tr><td>শব্দ<\/td><td>তৎসম শব্দ বেশি<\/td><td>তদ্ভব ও দেশি শব্দ বেশি<\/td><\/tr><tr><td>প্রকৃতি<\/td><td>গুরুগম্ভীর, অপরিবর্তনীয়, নাটক-সংলাপের অনুপযোগী<\/td><td>পরিবর্তনশীল, সহজ, বক্তৃতা ও সংলাপের উপযোগী<\/td><\/tr><\/table><\/div><ul><li>সাধু ও চলিতের মূল পার্থক্য <b>ক্রিয়া ও সর্বনাম পদে<\/b> — <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span>।<\/li><li>সাধু ও চলিতের মিশ্রণকে বলে <b>গুরুচণ্ডালী দোষ<\/b> — <span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span>।<\/li><\/ul><h4>উপভাষা<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>অঞ্চল<\/th><th>উপভাষা<\/th><\/tr><tr><td>বাংলাদেশের উত্তর-পশ্চিমাঞ্চল<\/td><td>বরেন্দ্রী — <span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021<\/span><\/td><\/tr><tr><td>বাংলাদেশের মধ্য ও দক্ষিণাঞ্চল<\/td><td>বাঙালি (বঙ্গালী)<\/td><\/tr><tr><td>পূর্বাঞ্চল, ত্রিপুরা, বরাক<\/td><td>পূর্বী<\/td><\/tr><tr><td>রংপুর, উত্তরবঙ্গ, পূর্ব বিহার<\/td><td>কামরূপী<\/td><\/tr><tr><td>পশ্চিমবঙ্গ<\/td><td>রাঢ়ী (প্রমিত বাংলার ভিত্তি)<\/td><\/tr><\/table><\/div><h3 id=\"c04-s3\">3.3 ধ্বনি ও বর্ণ — সংখ্যাগুলো<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>বিষয়<\/th><th>সংখ্যা<\/th><\/tr><tr><td>বাংলা বর্ণমালায় মোট বর্ণ<\/td><td>৫০<\/td><\/tr><tr><td>স্বরবর্ণ<\/td><td>১১<\/td><\/tr><tr><td>ব্যঞ্জনবর্ণ<\/td><td>৩৯<\/td><\/tr><tr><td>মৌলিক স্বরধ্বনি<\/td><td>৭ (ই, এ, অ্যা, আ, অ, ও, উ)<\/td><\/tr><tr><td>মৌলিক ব্যঞ্জনধ্বনি<\/td><td>৩০ — <span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021<\/span><\/td><\/tr><tr><td>মোট মৌলিক ধ্বনি<\/td><td>৩৭<\/td><\/tr><tr><td>যৌগিক স্বরজ্ঞাপক বর্ণ<\/td><td>২ (ঐ = অ+ই, ঔ = অ+উ)<\/td><\/tr><tr><td>মাত্রাহীন বর্ণ<\/td><td>১০ (স্বর ৪: এ ঐ ও ঔ; ব্যঞ্জন ৬: ঙ ঞ ৎ ং ঃ ঁ)<\/td><\/tr><tr><td>অর্ধমাত্রার বর্ণ<\/td><td>৮ (ঋ, খ, গ, ণ, থ, ধ, প, শ)<\/td><\/tr><tr><td>পূর্ণমাত্রার বর্ণ<\/td><td>৩২<\/td><\/tr><tr><td>কার-চিহ্ন<\/td><td>১০ ('অ'-এর কোনো কার নেই)<\/td><\/tr><tr><td>ফলা<\/td><td>৬ (য, র, ল, ব, ম, ন/ণ)<\/td><\/tr><\/table><\/div><div class=\"bx bx-mem\"><div class=\"bxh\">MEMORY AID: ৫০ = ১১ + ৩৯; ৩৭ = ৭ + ৩০<\/div><p class=\"\">\"বর্ণ\" লেখার চিহ্ন (৫০টি); \"ধ্বনি\" উচ্চারণের একক (মৌলিক ৩৭টি)। প্রশ্নে \"বর্ণ\" না \"ধ্বনি\" চাওয়া হয়েছে — আগে সেটি দেখুন। বাখরাবাদ ২০২১-এ অপশনে ৩০ ও ৩৯ দুটোই ছিল।<\/p><\/div><h4>স্বরধ্বনির উচ্চারণ-ছক (জিভের উচ্চতা ও অবস্থান)<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>জিভের উচ্চতা<\/th><th>সম্মুখ<\/th><th>মধ্য<\/th><th>পশ্চাৎ<\/th><\/tr><tr><td>উচ্চ<\/td><td>ই<\/td><td><\/td><td>উ<\/td><\/tr><tr><td>উচ্চ-মধ্য<\/td><td>এ<\/td><td><\/td><td>ও<\/td><\/tr><tr><td>নিম্ন-মধ্য<\/td><td>অ্যা<\/td><td><\/td><td>অ<\/td><\/tr><tr><td>নিম্ন<\/td><td><\/td><td>আ<\/td><td><\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021<\/span> জিভের উচ্চতা অনুযায়ী উচ্চ-মধ্য স্বরধ্বনি — <b>এ, ও<\/b>।<\/p><ul><li><b>দ্বিস্বরধ্বনি:<\/b> পূর্ণ স্বর ও অর্ধস্বর একসঙ্গে উচ্চারিত হলে — যেমন তৈল (ওই), বউ (ওউ), খই, মৌ। <span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021 — দ্বিস্বরধ্বনিযুক্ত শব্দ: তৈল<\/span><\/li><\/ul><h4>ব্যঞ্জনধ্বনি: উচ্চারণস্থান অনুযায়ী বর্গ<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>বর্গ<\/th><th>বর্ণ<\/th><th>উচ্চারণস্থান<\/th><th>নাম<\/th><th>মনে রাখুন<\/th><\/tr><tr><td>ক-বর্গ<\/td><td>ক খ গ ঘ ঙ<\/td><td>জিহ্বামূল<\/td><td>কণ্ঠ্য<\/td><td>ক = কণ্ঠ<\/td><\/tr><tr><td>চ-বর্গ<\/td><td>চ ছ জ ঝ ঞ<\/td><td>তালু<\/td><td>তালব্য<\/td><td>চ = তালু<\/td><\/tr><tr><td>ট-বর্গ<\/td><td>ট ঠ ড ঢ ণ<\/td><td>মূর্ধা<\/td><td>মূর্ধন্য<\/td><td>ট = মূর্ধা<\/td><\/tr><tr><td>ত-বর্গ<\/td><td>ত থ দ ধ ন<\/td><td>দন্ত<\/td><td>দন্ত্য<\/td><td>ত = দাঁত<\/td><\/tr><tr><td>প-বর্গ<\/td><td>প ফ ব ভ ম<\/td><td>ওষ্ঠ<\/td><td>ওষ্ঠ্য<\/td><td>প = ঠোঁট<\/td><\/tr><\/table><\/div><ul><li>প্রতি বর্গের ১ম ও ৩য় বর্ণ <b>অল্পপ্রাণ<\/b>, ২য় ও ৪র্থ <b>মহাপ্রাণ<\/b>; ১ম ও ২য় <b>অঘোষ<\/b>, ৩য়–৫ম <b>ঘোষ<\/b>; ৫ম বর্ণ (ঙ ঞ ণ ন ম) <b>নাসিক্য<\/b>।<\/li><li>অন্তঃস্থ ধ্বনি: য র ল ব; উষ্ম (শিস) ধ্বনি: শ ষ স হ; পরাশ্রয়ী বর্ণ: ং ঃ ঁ; কম্পনজাত: র; তাড়নজাত: ড় ঢ়; পার্শ্বিক: ল।<\/li><\/ul><h4>যুক্তবর্ণ — যেগুলো চেনা যায় না<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>যুক্তবর্ণ<\/th><th>গঠন<\/th><th>যুক্তবর্ণ<\/th><th>গঠন<\/th><\/tr><tr><td>ক্ষ<\/td><td>ক + ষ<\/td><td>জ্ঞ<\/td><td>জ + ঞ — <span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021<\/span><\/td><\/tr><tr><td>হ্ম<\/td><td>হ + ম<\/td><td>ঞ্জ<\/td><td>ঞ + জ<\/td><\/tr><tr><td>ঞ্চ<\/td><td>ঞ + চ<\/td><td>ষ্ণ<\/td><td>ষ + ণ<\/td><\/tr><tr><td>হ্ন<\/td><td>হ + ন<\/td><td>হ্ণ<\/td><td>হ + ণ<\/td><\/tr><tr><td>ত্থ<\/td><td>ত + থ<\/td><td>ক্ত<\/td><td>ক + ত<\/td><\/tr><tr><td>ঙ্গ<\/td><td>ঙ + গ<\/td><td>ক্ষ্ম<\/td><td>ক + ষ + ম<\/td><\/tr><\/table><\/div><h3 id=\"c04-s4\">3.4 প্রমিত উচ্চারণ<\/h3><ul><li>অন্যান্য → ওন্‌নান্‌নো <span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021<\/span>; শত → শতো; শ্রমিক → স্রোমিক; অধ্যাপক → ওদ্‌ধাপোক্; একা → অ্যাকা; স্মরণ → শঁরোন্।<\/li><li>নিয়ম: শব্দের আদ্য 'অ'-এর পরে ই, উ, ক্ষ, জ্ঞ, য-ফলা, ঋ-কার থাকলে 'অ' → 'ও' হয় (অতি → ওতি, অদ্য → ওদ্‌দো, পক্ষ → পোক্‌খো)।<\/li><\/ul><h3 id=\"c04-s5\">3.5 ণত্ব ও ষত্ব বিধান<\/h3><p>কেবল <b>তৎসম<\/b> শব্দে প্রযোজ্য।<\/p><ul><li>ঋ, র, ষ-এর পরে মূর্ধন্য-ণ: ঋণ, তৃণ, বর্ণ, কারণ, বিষ্ণু। ট-বর্গের সঙ্গে যুক্ত হলে ণ: কণ্টক, লুণ্ঠন।<\/li><li>স্বভাবতই ণ: চাণক্য, মাণিক্য, গণ, বাণিজ্য, লবণ, কল্যাণ, শোণিত, বীণা, কঙ্কণ, বিপণি, গণিকা, নিপুণ, বেণু, পণ্য, পুণ্য।<\/li><li>অ, আ ছাড়া অন্য স্বর এবং ক, র-এর পরে ষ: ভবিষ্যৎ, মুমূর্ষু, চক্ষুষ্মান। ট, ঠ-এর সঙ্গে যুক্ত হলে ষ: কষ্ট, কাষ্ঠ।<\/li><li><b>স্বভাবতই ষ:<\/b> ষড়ঋতু, কোষ, ভাষা, আষাঢ়, ভাষণ, রোষ, মানুষ, পাষাণ, ষোড়শ, পৌষ, ঔষধ, ঈষৎ। <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021 — উত্তর: ষড়ঋতু, কোষ, ভাষা সবগুলোই<\/span><\/li><li>বিদেশি ও তদ্ভব শব্দে ণ, ষ হয় না: গভর্নর, কর্নেল, স্টেশন, পোস্ট, জিনিস, পোশাক।<\/li><\/ul><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 3<\/div><p class=\"li\">ব্যাকরণ ভাষার অনুগামী। সাধু-চলিতের পার্থক্য ক্রিয়া ও সর্বনামে। মিশ্রণ = গুরুচণ্ডালী দোষ।<\/p><p class=\"li\">বর্ণ ৫০ (স্বর ১১ + ব্যঞ্জন ৩৯); মৌলিক ধ্বনি ৩৭ (স্বর ৭ + ব্যঞ্জন ৩০)।<\/p><p class=\"li\">উচ্চ-মধ্য স্বর: এ, ও। জ্ঞ = জ + ঞ; ক্ষ = ক + ষ।<\/p><p class=\"li\">উত্তর-পশ্চিমাঞ্চলের উপভাষা বরেন্দ্রী। হিস্পানি ভাষাবংশ নয়।<\/p><p class=\"li\">ণত্ব-ষত্ব শুধু তৎসম শব্দে।<\/p><\/div>"},{"id":"c05","no":4,"part":"PART B — BANGLA","title":"Chapter 4: সন্ধি","short":"সন্ধি","toc":[["c05-s1","4.1 সন্ধি কী"],["c05-s2","4.2 স্বরসন্ধির সূত্র"],["c05-s3","4.3 ব্যঞ্জনসন্ধি — সবচেয়ে বেশি আসা রূপ"],["c05-s4","4.4 বিসর্গসন্ধি"],["c05-s5","4.5 পূর্ববর্তী প্রশ্ন"],["c05-s6","4.6 অনুশীলন"]],"html":"<h3 id=\"c05-s1\">4.1 সন্ধি কী<\/h3><p>পাশাপাশি দুটি ধ্বনির মিলনকে সন্ধি বলে। সন্ধির কাজ উচ্চারণ সহজ করা ও ধ্বনিগত মাধুর্য আনা। সন্ধি তিন প্রকার: <b>স্বরসন্ধি, ব্যঞ্জনসন্ধি, বিসর্গসন্ধি<\/b>। খাঁটি বাংলা শব্দে স্বর ও ব্যঞ্জনসন্ধি আছে; <b>খাঁটি বাংলায় বিসর্গসন্ধি নেই<\/b> — <span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span>।<\/p><p>পরীক্ষায় প্রশ্ন আসে একটিই রূপে: \"সন্ধি বিচ্ছেদ করুন\"। ছয়টি প্রশ্নের চারটিই ছিল <b>বিসর্গসন্ধি<\/b> থেকে (প্রাতরাশ, নিষ্ঠুর, নিরবধি, নিরাময়)। তাই বিসর্গসন্ধি সবচেয়ে মনোযোগ দিয়ে পড়ুন।<\/p><h3 id=\"c05-s2\">4.2 স্বরসন্ধির সূত্র<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>মিলন<\/th><th>ফল<\/th><th>উদাহরণ<\/th><\/tr><tr><td>অ/আ + অ/আ<\/td><td>আ<\/td><td>নর + অধম = নরাধম; হিম + আলয় = হিমালয়; <b>শশ + অঙ্ক = শশাঙ্ক<\/b> <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>; বিদ্যা + আলয় = বিদ্যালয়<\/td><\/tr><tr><td>ই/ঈ + ই/ঈ<\/td><td>ঈ<\/td><td>অতি + ইত = অতীত; পরি + ঈক্ষা = পরীক্ষা; রবি + ইন্দ্র = রবীন্দ্র<\/td><\/tr><tr><td>উ/ঊ + উ/ঊ<\/td><td>ঊ<\/td><td>মরু + উদ্যান = মরূদ্যান; বধূ + উৎসব = বধূৎসব<\/td><\/tr><tr><td>অ/আ + ই/ঈ<\/td><td>এ<\/td><td>শুভ + ইচ্ছা = শুভেচ্ছা; মহা + ঈশ = মহেশ; যথা + ইষ্ট = যথেষ্ট<\/td><\/tr><tr><td>অ/আ + উ/ঊ<\/td><td>ও<\/td><td>সূর্য + উদয় = সূর্যোদয়; গঙ্গা + ঊর্মি = গঙ্গোর্মি; পর + উপকার = পরোপকার<\/td><\/tr><tr><td>অ/আ + ঋ<\/td><td>অর্<\/td><td>দেব + ঋষি = দেবর্ষি; মহা + ঋষি = মহর্ষি<\/td><\/tr><tr><td>অ/আ + এ/ঐ<\/td><td>ঐ<\/td><td>জন + এক = জনৈক; মত + ঐক্য = মতৈক্য; সদা + এব = সদৈব<\/td><\/tr><tr><td>অ/আ + ও/ঔ<\/td><td>ঔ<\/td><td>বন + ওষধি = বনৌষধি; মহা + ঔষধ = মহৌষধ<\/td><\/tr><tr><td>ই/ঈ + অন্য স্বর<\/td><td>য-ফলা<\/td><td>অতি + অন্ত = অত্যন্ত; প্রতি + এক = প্রত্যেক; ইতি + আদি = ইত্যাদি<\/td><\/tr><tr><td>উ/ঊ + অন্য স্বর<\/td><td>ব-ফলা<\/td><td>সু + আগত = স্বাগত; অনু + এষণ = অন্বেষণ; সু + অল্প = স্বল্প<\/td><\/tr><tr><td>এ/ঐ/ও/ঔ + স্বর<\/td><td>অয়/আয়/অব/আব<\/td><td>নে + অন = নয়ন; গৈ + অক = গায়ক; পো + অন = পবন; নৌ + ইক = নাবিক<\/td><\/tr><\/table><\/div><p><b>নিপাতনে সিদ্ধ স্বরসন্ধি<\/b> (নিয়ম মানে না): কুল + অটা = কুলটা; গো + অক্ষ = গবাক্ষ; প্র + ঊঢ় = প্রৌঢ়; অন্য + অন্য = অন্যান্য; মার্ত + অণ্ড = মার্তণ্ড; শুদ্ধ + ওদন = শুদ্ধোদন; স্ব + ঈর = স্বৈর; সার + অঙ্গ = সারঙ্গ।<\/p><h3 id=\"c05-s3\">4.3 ব্যঞ্জনসন্ধি — সবচেয়ে বেশি আসা রূপ<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>সূত্র<\/th><th>উদাহরণ<\/th><\/tr><tr><td>ত/দ + চ/ছ → চ্চ/চ্ছ<\/td><td>উৎ + চারণ = উচ্চারণ; সৎ + চিন্তা = সচ্চিন্তা; উৎ + ছেদ = উচ্ছেদ<\/td><\/tr><tr><td>ত/দ + জ/ঝ → জ্জ/জ্ঝ<\/td><td>সৎ + জন = সজ্জন; বিপদ + জনক = বিপজ্জনক; উৎ + জ্বল = উজ্জ্বল<\/td><\/tr><tr><td>ত/দ + ল → ল্ল<\/td><td>উৎ + লাস = উল্লাস; তদ্ + লিখিত = তল্লিখিত<\/td><\/tr><tr><td>ত/দ + শ → চ্ছ<\/td><td>উৎ + শ্বাস = উচ্ছ্বাস; চলৎ + শক্তি = চলচ্ছক্তি<\/td><\/tr><tr><td>ত/দ + হ → দ্ধ<\/td><td>উৎ + হার = উদ্ধার; পদ্ + হতি = পদ্ধতি; উৎ + হত = উদ্ধত<\/td><\/tr><tr><td>বর্গের ১ম বর্ণ + স্বর/ঘোষ → ৩য় বর্ণ<\/td><td>দিক্ + অন্ত = দিগন্ত; বাক্ + ঈশ = বাগীশ; ষট্ + আনন = ষড়ানন; সৎ + উপায় = সদুপায়<\/td><\/tr><tr><td>বর্গের ১ম বর্ণ + ন/ম → ৫ম বর্ণ<\/td><td>জগৎ + নাথ = জগন্নাথ; বাক্ + ময় = বাঙ্ময়; উৎ + নত = উন্নত; তৎ + মধ্যে = তন্মধ্যে<\/td><\/tr><tr><td>ম + স্পর্শধ্বনি → বর্গের ৫ম বর্ণ/ং<\/td><td>সম্ + চয় = সঞ্চয়; সম্ + তাপ = সন্তাপ; শম্ + কা = শঙ্কা; সম্ + বাদ = সংবাদ<\/td><\/tr><tr><td>স্বর + ছ → চ্ছ<\/td><td>পরি + ছেদ = পরিচ্ছেদ; বি + ছেদ = বিচ্ছেদ; আ + ছাদন = আচ্ছাদন; এক + ছত্র = একচ্ছত্র<\/td><\/tr><tr><td>ষ + ত/থ → ষ্ট/ষ্ঠ<\/td><td>কৃষ্ + তি = কৃষ্টি; ষষ্ + থ = ষষ্ঠ<\/td><\/tr><\/table><\/div><p><b>নিপাতনে সিদ্ধ ব্যঞ্জনসন্ধি:<\/b> আ + চর্য = আশ্চর্য; গো + পদ = গোষ্পদ; বন + পতি = বনস্পতি; বৃহৎ + পতি = বৃহস্পতি; তৎ + কর = তস্কর; পর + পর = পরস্পর; মনস্ + ঈষা = মনীষা; ষট্ + দশ = ষোড়শ; এক + দশ = একাদশ; পতৎ + অঞ্জলি = পতঞ্জলি।<\/p><h3 id=\"c05-s4\">4.4 বিসর্গসন্ধি<\/h3><p>বিসর্গ (ঃ) আসলে শব্দের শেষে থাকা র্ বা স্-এর সংক্ষিপ্ত রূপ। তাই বিসর্গ দুই রকম: <b>র-জাত<\/b> (অন্তঃ, প্রাতঃ, পুনঃ, নিঃ, দুঃ) ও <b>স-জাত<\/b> (মনঃ, শিরঃ, নমঃ, পুরঃ, তিরঃ)।<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>সূত্র<\/th><th>উদাহরণ<\/th><\/tr><tr><td>অ + ঃ + অ/ঘোষ বর্ণ → ও<\/td><td>ততঃ + অধিক = ততোধিক; মনঃ + যোগ = মনোযোগ; তিরঃ + ধান = তিরোধান; সদ্যঃ + জাত = সদ্যোজাত<\/td><\/tr><tr><td>র-জাত ঃ + স্বর/ঘোষ বর্ণ → র<\/td><td><b>নিঃ + অবধি = নিরবধি<\/b> <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>; <b>প্রাতঃ + আশ = প্রাতরাশ<\/b> <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>; <b>নিঃ + আময় = নিরাময়<\/b> <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>; পুনঃ + আয় = পুনরায়; অন্তঃ + গত = অন্তর্গত; দুঃ + যোগ = দুর্যোগ; নিঃ + আকার = নিরাকার<\/td><\/tr><tr><td>ঃ + চ/ছ → শ্চ/শ্ছ<\/td><td>নিঃ + চয় = নিশ্চয়; দুঃ + চরিত্র = দুশ্চরিত্র; শিরঃ + ছেদ = শিরশ্ছেদ<\/td><\/tr><tr><td>ঃ + ট/ঠ → ষ্ট/ষ্ঠ<\/td><td>ধনুঃ + টঙ্কার = ধনুষ্টঙ্কার; <b>নিঃ + ঠুর = নিষ্ঠুর<\/b> <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td>ঃ + ত/থ → স্ত/স্থ<\/td><td>নিঃ + তার = নিস্তার; দুঃ + তর = দুস্তর; নিঃ + তেজ = নিস্তেজ<\/td><\/tr><tr><td>ই/উ + ঃ + ক খ প ফ → ষ<\/td><td>নিঃ + কর = নিষ্কর; আবিঃ + কার = আবিষ্কার; দুঃ + কৃতি = দুষ্কৃতি; চতুঃ + পদ = চতুষ্পদ; নিঃ + ফল = নিষ্ফল<\/td><\/tr><tr><td>অ/আ + ঃ + ক খ প ফ → স<\/td><td>নমঃ + কার = নমস্কার; পুরঃ + কার = পুরস্কার; তিরঃ + কার = তিরস্কার; ভাঃ + কর = ভাস্কর<\/td><\/tr><tr><td>ঃ + র → ঃ লোপ, পূর্বস্বর দীর্ঘ<\/td><td>নিঃ + রব = নীরব; নিঃ + রস = নীরস; নিঃ + রোগ = নীরোগ; চক্ষুঃ + রোগ = চক্ষূরোগ<\/td><\/tr><tr><td>বিসর্গ অপরিবর্তিত<\/td><td>মনঃ + কষ্ট = মনঃকষ্ট; অন্তঃ + করণ = অন্তঃকরণ; প্রাতঃ + কাল = প্রাতঃকাল; শিরঃ + পীড়া = শিরঃপীড়া<\/td><\/tr><\/table><\/div><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: বিচ্ছেদ করার তিন ধাপ<\/div><p class=\"li\">শব্দে \"র্‌\", \"ষ্ক/ষ্প/ষ্ফ/ষ্ট/ষ্ঠ\", \"শ্চ\", \"স্ত\" বা \"ও-কার + ঘোষ বর্ণ\" দেখলে প্রথমেই বিসর্গসন্ধি ভাবুন: নি<b>র<\/b>বধি → নিঃ + অবধি; নি<b>ষ্ঠু<\/b>র → নিঃ + ঠুর।<\/p><p class=\"li\">উপসর্গ \"নি\" নয়, \"নিঃ\" (নির্‌); \"দু\" নয়, \"দুঃ\" (দুর্‌)। অপশনে \"নির + অবধি\" বা \"নি + ঠুর\" থাকলে সেগুলো ফাঁদ।<\/p><p class=\"li\">প্রাতরাশ = সকালের আহার। \"আশ\" মানে ভোজন। তাই প্রাতঃ + আশ; \"প্রাতঃ + রাশ\" নয়।<\/p><\/div><h3 id=\"c05-s5\">4.5 পূর্ববর্তী প্রশ্ন<\/h3><p class=\"pq\">১. 'শশাঙ্ক' শব্দের সন্ধি বিচ্ছেদ কোনটি? <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span><\/p><p class=\"po\">(ক) শশ + অঙ্ক  (খ) শস + অঙ্ক  (গ) শশা + অঙ্ক  (ঘ) শন + অঙ্ক<\/p><p class=\"pa\">উত্তর: (ক)। অ + অ = আ। শশ (খরগোশ) + অঙ্ক (চিহ্ন, কোল) = শশাঙ্ক অর্থাৎ চাঁদ।<\/p><p class=\"pq\">২. সন্ধি বিচ্ছেদ করুন: 'প্রাতরাশ' <span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span><\/p><p class=\"po\">(ক) প্রতি + রাশ  (খ) প্রাতঃ + রাশ  (গ) প্রাত + আশ  (ঘ) প্রাতঃ + আশ  (ঙ) কোনোটিই নয়<\/p><p class=\"pa\">উত্তর: (ঘ)। র-জাত বিসর্গ + স্বর → র।<\/p><p class=\"pq\">৩. 'নিরবধি'-এর সন্ধি বিচ্ছেদ <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span> এবং 'নিরাময়'-এর সন্ধি বিচ্ছেদ <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2024<\/span><\/p><p class=\"pa\">নিঃ + অবধি; নিঃ + আময়। দুটোই একই সূত্র। 'আময়' অর্থ রোগ; নিরাময় = রোগমুক্তি।<\/p><p class=\"pq\">৪. 'নিষ্ঠুর'-এর সন্ধি বিচ্ছেদ কোনটি? <span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span><\/p><p class=\"pa\">নিঃ + ঠুর। বিসর্গ + ঠ → ষ্ঠ।<\/p><h3 id=\"c05-s6\">4.6 অনুশীলন<\/h3><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> সন্ধি বিচ্ছেদ করুন: (১) পরিষ্কার (২) মনীষা (৩) দুর্যোগ (৪) উচ্ছ্বাস (৫) নাবিক (৬) পুরস্কার (৭) সংবাদ (৮) অন্বেষণ (৯) ষোড়শ (১০) নীরব (১১) গবাক্ষ (১২) বনস্পতি (১৩) অত্যন্ত (১৪) তিরোধান (১৫) উদ্ধার<\/p><p class=\"pa\">উত্তর: (১) পরিঃ + কার (২) মনস্ + ঈষা (৩) দুঃ + যোগ (৪) উৎ + শ্বাস (৫) নৌ + ইক (৬) পুরঃ + কার (৭) সম্ + বাদ (৮) অনু + এষণ (৯) ষট্ + দশ (১০) নিঃ + রব (১১) গো + অক্ষ (১২) বন + পতি (১৩) অতি + অন্ত (১৪) তিরঃ + ধান (১৫) উৎ + হার।<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 4<\/div><p class=\"li\">খাঁটি বাংলায় বিসর্গসন্ধি নেই।<\/p><p class=\"li\">নিঃ + স্বর → নির্‌ (নিরবধি, নিরাময়, নিরাকার); নিঃ + ক/প/ফ → নিষ্‌ (নিষ্কর, নিষ্ফল); নিঃ + র → নী (নীরব)।<\/p><p class=\"li\">নিপাতনে সিদ্ধ: গবাক্ষ, কুলটা, প্রৌঢ়, অন্যান্য, মার্তণ্ড, আশ্চর্য, বনস্পতি, বৃহস্পতি, তস্কর, পরস্পর, মনীষা, ষোড়শ, একাদশ।<\/p><\/div>"},{"id":"c06","no":5,"part":"PART B — BANGLA","title":"Chapter 5: শব্দ ও শব্দগঠন","short":"শব্দ ও শব্দগঠন","toc":[["c06-s1","5.1 উৎস অনুসারে শব্দ"],["c06-s2","5.2 গঠন অনুসারে ও অর্থ অনুসারে শব্দ"],["c06-s3","5.3 উপসর্গ"],["c06-s4","5.4 প্রকৃতি ও প্রত্যয়"],["c06-s5","5.5 সমাস"],["c06-s6","5.6 লিঙ্গ"],["c06-s7","5.7 বচন"],["c06-s8","5.8 দ্বিরুক্তি (শব্দদ্বিত্ব)"]],"html":"<h3 id=\"c06-s1\">5.1 উৎস অনুসারে শব্দ<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>শ্রেণি<\/th><th>পরিচয়<\/th><th>উদাহরণ<\/th><\/tr><tr><td>তৎসম<\/td><td>সংস্কৃত থেকে অবিকৃতভাবে আসা<\/td><td>চন্দ্র, সূর্য, নক্ষত্র, ভবন, ধর্ম, পাত্র, মনুষ্য, হস্ত<\/td><\/tr><tr><td>অর্ধ-তৎসম<\/td><td>সংস্কৃত থেকে সামান্য বিকৃত হয়ে আসা<\/td><td>জ্যোৎস্না &gt; জোছনা; শ্রাদ্ধ &gt; ছেরাদ্দ; <b>গৃহিণী &gt; গিন্নি<\/b>; বৈষ্ণব &gt; বোষ্টম; কুৎসিত &gt; কুচ্ছিত<\/td><\/tr><tr><td>তদ্ভব (খাঁটি বাংলা)<\/td><td>সংস্কৃত → প্রাকৃত → বাংলা<\/td><td>হস্ত &gt; হাত; চন্দ্র &gt; চাঁদ; চর্মকার &gt; চামার; মাতা &gt; মা<\/td><\/tr><tr><td>দেশি<\/td><td>এ দেশের আদিম অধিবাসীদের ভাষা থেকে<\/td><td>কুলা, গঞ্জ, চোঙ্গা, টোপর, ডাব, ডাগর, ঢেঁকি, কুড়ি, পেট, ডিঙি<\/td><\/tr><tr><td>বিদেশি<\/td><td>অন্য ভাষা থেকে<\/td><td>নিচের ছক দেখুন<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span> 'গিন্নী' কোন প্রকার শব্দ? — প্রকৃত উত্তর <b>অর্ধ-তৎসম<\/b>। (প্রশ্নের অপশনে এটি ছিল না; প্রশ্নটি ত্রুটিপূর্ণ।)<\/p><p><span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span> 'ডাব' কোন ধরনের শব্দ? — <b>দেশি<\/b>।<\/p><h4>বিদেশি শব্দ — উৎস ভাষা<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>ভাষা<\/th><th>শব্দ<\/th><\/tr><tr><td>আরবি<\/td><td>আল্লাহ, ইসলাম, ঈমান, হজ, জাকাত, আদালত, উকিল, এজলাস, কলম, কিতাব, খারিজ, গায়েব, মহকুমা, মুনসেফ, রায়, ইনসান, আলেম, দোয়াত, নগদ, বাকি<\/td><\/tr><tr><td>ফারসি<\/td><td>খোদা, গুনাহ, নামাজ, রোজা, বেহেশত, দোজখ, ফেরেশতা, কারখানা, চশমা, জবানবন্দি, তারিখ, দফতর, দরবার, দোকান, দস্তখত, নালিশ, বাদশাহ, মেথর, রসদ, আমদানি, রফতানি, জিন্দা, বদমাশ<\/td><\/tr><tr><td>পর্তুগিজ<\/td><td>আনারস, আলপিন, আলমারি, গির্জা, গুদাম, চাবি, পাউরুটি, পাদ্রি, বালতি, পেয়ারা, কামরা, জানালা, তোয়ালে, সাবান, ইস্পাত<\/td><\/tr><tr><td>ফরাসি<\/td><td>কার্তুজ, কুপন, ডিপো, রেস্তোরাঁ, ক্যাফে, আঁতাত, বুর্জোয়া<\/td><\/tr><tr><td>ওলন্দাজ<\/td><td>ইস্কাপন, টেক্কা, তুরুপ, রুইতন, হরতন<\/td><\/tr><tr><td>তুর্কি<\/td><td>চাকর, চাকু, তোপ, দারোগা, বাবা, বাবুর্চি, কুলি, কাঁচি, বেগম, লাশ, মুচলেকা<\/td><\/tr><tr><td>গুজরাটি<\/td><td>খদ্দর, হরতাল<\/td><\/tr><tr><td>পাঞ্জাবি<\/td><td>চাহিদা, শিখ<\/td><\/tr><tr><td>চীনা<\/td><td>চা, চিনি, লিচু, সাম্পান, <b>টাইফুন<\/b><\/td><\/tr><tr><td>জাপানি<\/td><td>রিকশা, হারিকিরি, সুনামি, জুডো, হাসনাহেনা<\/td><\/tr><tr><td>বর্মি (মায়ানমার)<\/td><td>লুঙ্গি, ফুঙ্গি<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2024<\/span> 'টাইফুন' কোন ভাষার শব্দ — সংকলিত উত্তর \"কোনোটিই নয়\"; শব্দটি চীনা উৎসের (tai fung, প্রবল বাতাস)।<\/p><div class=\"bx bx-mem\"><div class=\"bxh\">MEMORY AID: বিদেশি শব্দ মনে রাখার সূত্র<\/div><p class=\"li\">পর্তুগিজ: \"<b>আনারস, পেয়ারা, পাউরুটি<\/b> খেয়ে <b>পাদ্রি<\/b> <b>চাবি<\/b> দিয়ে <b>গির্জার আলমারি<\/b> খুলে <b>বালতি<\/b> রাখলেন।\"<\/p><p class=\"li\">তুর্কি: \"<b>বাবা<\/b>র <b>চাকর দারোগা<\/b>কে <b>চাকু<\/b> দেখাল; <b>বাবুর্চি বেগম<\/b>কে খবর দিল।\"<\/p><p class=\"li\">ওলন্দাজ: তাসের চার রং — ইস্কাপন, রুইতন, হরতন, টেক্কা/তুরুপ।<\/p><\/div><h3 id=\"c06-s2\">5.2 গঠন অনুসারে ও অর্থ অনুসারে শব্দ<\/h3><ul><li>গঠন অনুসারে: <b>মৌলিক<\/b> (যাকে ভাঙা যায় না: গোলাপ, নাক, তিন) ও <b>সাধিত<\/b> (প্রত্যয়, উপসর্গ বা সমাসে গঠিত: চলন্ত, প্রশাসন, নীলাকাশ)।<\/li><li>অর্থ অনুসারে: <b>যৌগিক<\/b> (ব্যুৎপত্তিগত অর্থই ব্যবহারিক অর্থ: গায়ক, কর্তব্য, দৌহিত্র, মধুর), <b>রূঢ়ি<\/b> (ব্যুৎপত্তিগত অর্থ ছেড়ে বিশেষ অর্থ: হস্তী, গবেষণা, বাঁশি, তৈল, প্রবীণ, সন্দেশ, পাঞ্জাবি), <b>যোগরূঢ়<\/b> (সমাসনিষ্পন্ন পদ বিশেষ অর্থে: পঙ্কজ, রাজপুত, মহাযাত্রা, জলধি, পীতাম্বর)।<\/li><\/ul><h3 id=\"c06-s3\">5.3 উপসর্গ<\/h3><p>উপসর্গের নিজস্ব অর্থবাচকতা নেই, কিন্তু অর্থদ্যোতকতা আছে; এরা শব্দের আগে বসে নতুন শব্দ গঠন করে।<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>শ্রেণি<\/th><th>সংখ্যা<\/th><th>উপসর্গ<\/th><\/tr><tr><td>খাঁটি বাংলা<\/td><td>২১<\/td><td>অ, অঘা, অজ, অনা, আ, আড়, আন, আব, ইতি, ঊন (ঊনা), কদ, কু, নি, পাতি, বি, ভর, রাম, স, সা, সু, হা<\/td><\/tr><tr><td>তৎসম (সংস্কৃত)<\/td><td>২০<\/td><td>প্র, পরা, অপ, সম, নি, অনু, অব, নির, দুর, বি, অধি, সু, উৎ, পরি, প্রতি, অতি, অপি, অভি, উপ, আ<\/td><\/tr><tr><td>বিদেশি<\/td><td>অনির্দিষ্ট<\/td><td>ফারসি: কার, দর, না, নিম, ফি, বদ, বে, বর, ব, কম; আরবি: আম, খাস, লা, গর; ইংরেজি: ফুল, হাফ, হেড, সাব; উর্দু-হিন্দি: হর<\/td><\/tr><\/table><\/div><ul><li>উভয় তালিকায় আছে চারটি: <b>আ, সু, বি, নি<\/b>।<\/li><li><span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span> 'পাতিহাঁস' শব্দে 'পাতি' উপসর্গ — <b>ছোট/ক্ষুদ্র<\/b> অর্থে (পাতিলেবু, পাতিকাক)।<\/li><li><span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span> 'অনাবৃষ্টি' শব্দে 'অনা' — <b>অভাব<\/b> অর্থে (অনাচার = অশুভ অর্থে; অনাদর = অভাব)।<\/li><li>'রাম' = বড় বা উৎকৃষ্ট (রামছাগল, রামদা); 'অজ' = নিতান্ত মন্দ (অজপাড়াগাঁ, অজমূর্খ); 'কদ' = নিন্দিত (কদাকার, কদবেল); 'হা' = অভাব (হাভাতে, হাঘরে); 'নিম' = আধা (নিমরাজি); 'গর' = অভাব (গরমিল, গরহাজির); 'লা' = না (লাপাত্তা, লাজওয়াব)।<\/li><\/ul><h3 id=\"c06-s4\">5.4 প্রকৃতি ও প্রত্যয়<\/h3><ul><li><b>প্রকৃতি<\/b> = শব্দ বা ক্রিয়ার মূল। ক্রিয়ার মূল <b>ধাতু<\/b> (√চল্, √কর্), শব্দের মূল <b>নাম-প্রকৃতি বা প্রাতিপদিক<\/b> (হাত, ঢাকা)।<\/li><li><b>কৃৎ প্রত্যয়<\/b>: ধাতুর পরে বসে → কৃদন্ত পদ। √চল্ + অন্ত = চলন্ত; √পড়্ + উয়া = পড়ুয়া; √জন্ + অক = জনক; √রাঁধ্ + উনি = রাঁধুনি; √কাঁদ্ + না = কান্না; √কৃ + তব্য = কর্তব্য; √গম্ + অন = গমন; √শ্রু + তি = শ্রুতি।<\/li><li><b>তদ্ধিত প্রত্যয়<\/b>: শব্দের পরে বসে → তদ্ধিতান্ত পদ। ছাপা + খানা = ছাপাখানা; ঢাকা + আই = ঢাকাই; বাঘ + আ = বাঘা; মনু + ষ্ণ = মানব; নীল + ইমা = নীলিমা; বন্ধু + ত্ব = বন্ধুত্ব।<\/li><\/ul><p><span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021<\/span> নিচের কোনটি তদ্ধিত প্রত্যয়? — <b>ছাপা + খানা<\/b> (বাকি তিনটি — জন + অক, রাঁধ + উনি, কাঁদ + না — ধাতুর সঙ্গে যুক্ত, তাই কৃৎ প্রত্যয়)।<\/p><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: কৃৎ না তদ্ধিত — এক প্রশ্নে চিনুন<\/div><p class=\"\">প্রত্যয় বাদ দিলে যা থাকে সেটি কি একটি <b>কাজ<\/b> (চল, পড়, জন, রাঁধ) না একটি <b>নাম/বস্তু<\/b> (ছাপা, ঢাকা, বাঘ, বন্ধু)? কাজ হলে কৃৎ; নাম হলে তদ্ধিত।<\/p><\/div><h3 id=\"c06-s5\">5.5 সমাস<\/h3><p>সমাস মানে সংক্ষেপণ: পরস্পর অর্থসম্পর্কযুক্ত একাধিক পদের এক পদে মিলন। সমস্ত পদের প্রথম অংশ <b>পূর্বপদ<\/b>, শেষ অংশ <b>পরপদ (উত্তরপদ)<\/b>; ভেঙে দেখানো বাক্যাংশ <b>ব্যাসবাক্য<\/b>।<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>সমাস<\/th><th>কোন পদের অর্থ প্রধান<\/th><th>চেনার উপায় ও উদাহরণ<\/th><\/tr><tr><td>দ্বন্দ্ব<\/td><td>উভয় পদ<\/td><td>\"ও/এবং/আর\" দিয়ে ভাঙে: মা-বাবা, দোয়াত-কলম, সুখ-দুঃখ, ভাই-বোন, জমা-খরচ। <b>অলুক দ্বন্দ্ব:<\/b> দুধে-ভাতে, হাতে-কলমে<\/td><\/tr><tr><td>কর্মধারয়<\/td><td>পরপদ<\/td><td>বিশেষণ + বিশেষ্য, \"যে/যিনি/যা\" দিয়ে ভাঙে: নীল যে পদ্ম = নীলপদ্ম; মহান যে রাজা = মহারাজ; <b>গণ্য ও মান্য যিনি = গণ্যমান্য<\/b>। মধ্যপদলোপী: সিংহ চিহ্নিত আসন = সিংহাসন। উপমান: তুষারের ন্যায় শুভ্র = তুষারশুভ্র। উপমিত: মুখ চন্দ্রের ন্যায় = মুখচন্দ্র। রূপক: মন রূপ মাঝি = মনমাঝি<\/td><\/tr><tr><td>তৎপুরুষ<\/td><td>পরপদ<\/td><td>পূর্বপদের বিভক্তি লোপ: বিপদকে আপন্ন = বিপদাপন্ন (২য়া); মন দিয়ে গড়া = মনগড়া (৩য়া); গুরুকে ভক্তি = গুরুভক্তি (৪র্থী); বিলাত থেকে ফেরত = বিলাতফেরত (৫মী); রাজার পুত্র = রাজপুত্র (৬ষ্ঠী); গাছে পাকা = গাছপাকা (৭মী)। নঞ্: ন আচার = অনাচার। উপপদ: জলে চরে যা = জলচর। অলুক: গায়ে পড়া<\/td><\/tr><tr><td>দ্বিগু<\/td><td>পরপদ (সমাহার অর্থ)<\/td><td>পূর্বপদ সংখ্যাবাচক, সমষ্টি বোঝায়: তিন কালের সমাহার = ত্রিকাল; চৌরাস্তা, শতাব্দী, সপ্তাহ, পঞ্চবটী, তেপান্তর, নবরত্ন<\/td><\/tr><tr><td>অব্যয়ীভাব<\/td><td>পূর্বপদ (অব্যয়)<\/td><td>উপসর্গ/অব্যয় আগে: উপকূল (কূলের সমীপে), প্রতিদিন, যথারীতি, আজীবন, নির্ভাবনা, উপশহর, হাভাতে, আমরণ<\/td><\/tr><tr><td>বহুব্রীহি<\/td><td>কোনো পদই নয়; তৃতীয় অর্থ<\/td><td>\"যার/যাতে\" দিয়ে ভাঙে: নীল কণ্ঠ যার = নীলকণ্ঠ; দশ আনন যার = দশানন; বীণা পাণিতে যার = বীণাপাণি; ব্যতিহার: হাতাহাতি, কানাকানি; সহিত অর্থে: সবান্ধব; নঞ্ বহুব্রীহি: বেতার, নির্ভুল; সংখ্যাবাচক: চৌচালা, দোনলা<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2024<\/span> 'গণ্যমান্য' কোন সমাস? — <b>কর্মধারয়<\/b>। ব্যাসবাক্য \"যিনি গণ্য তিনিই মান্য\": দুটি বিশেষণ একই ব্যক্তিকে বোঝাচ্ছে, তাই কর্মধারয় (একই ধরনের উদাহরণ: \"কাঁচামিঠা\", \"চালাকচতুর\")। দ্বন্দ্ব হতো যদি দুটি আলাদা ব্যক্তি বা বস্তু বোঝাত। কিছু গাইডে একে দ্বন্দ্ব বলা হয়; প্রচলিত ব্যাকরণ ও প্রশ্নসংকলনের উত্তর কর্মধারয়।<\/p><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: দ্বিগু না বহুব্রীহি; কর্মধারয় না বহুব্রীহি<\/div><p class=\"li\">সংখ্যা আগে থাকলে দেখুন <b>সমষ্টি<\/b> বোঝাচ্ছে (ত্রিফলা = তিন ফলের সমাহার → দ্বিগু) নাকি <b>অন্য কাউকে<\/b> বোঝাচ্ছে (দশানন = রাবণ → বহুব্রীহি)।<\/p><p class=\"li\">নীলপদ্ম = পদ্মটাই নীল → কর্মধারয়। নীলকণ্ঠ = কণ্ঠ নয়, শিবকে বোঝায় → বহুব্রীহি।<\/p><p class=\"li\">\"প্রাদি সমাস\" (প্র-বচন = প্রবচন, পরি-ভ্রমণ = পরিভ্রমণ) ও \"নিত্য সমাস\" (অন্য গ্রাম = গ্রামান্তর, কেবল দর্শন = দর্শনমাত্র) আলাদা নামে চিনে রাখুন।<\/p><\/div><h3 id=\"c06-s6\">5.6 লিঙ্গ<\/h3><ul><li><b>নিত্য পুরুষবাচক<\/b> (স্ত্রীবাচক রূপ নেই): কবিরাজ, ঢাকী, কৃতদার, অকৃতদার, সভাপতি, যোদ্ধা, বিপত্নীক, স্ত্রৈণ, রাষ্ট্রপতি, সেনাপতি, কাজী।<\/li><li><b>নিত্য স্ত্রীবাচক<\/b> (পুরুষবাচক রূপ নেই): সতীন, সৎমা, এয়ো, দাই, সধবা, বিধবা, কুলটা, অসূর্যম্পশ্যা, অন্তঃসত্ত্বা, ডাইনি, শাঁকচুন্নি, অর্ধাঙ্গিনী, রূপসী।<\/li><li>উভয়লিঙ্গ: শিশু, সন্তান, মানুষ, পাখি, জন, শিক্ষিত।<\/li><\/ul><p><span class=\"tg tg-repeated\">REPEATED<\/span> এই একটি তথ্য তিনবার এসেছে — Petrobangla AM 2016 (\"লিঙ্গান্তর হয় না এমন শব্দ\": <b>কবিরাজ<\/b>), GTCL 2021 (<b>ঢাকী<\/b>), Bakhrabad 2021 (<b>সভাপতি<\/b>)।<\/p><ul><li>স্ত্রীবাচক প্রত্যয়: আ (প্রিয় → প্রিয়া), ঈ (কিশোর → কিশোরী), ইনি/আনি (কাঙাল → কাঙালিনি; ইন্দ্র → ইন্দ্রাণী), নি (জেলে → জেলেনি)। ক্ষুদ্রার্থে \"ইকা\": নাটক → নাটিকা, পুস্তক → পুস্তিকা (এগুলো স্ত্রীবাচক নয়)।<\/li><\/ul><h3 id=\"c06-s7\">5.7 বচন<\/h3><ul><li>একবচন বোঝায় একজন বা একটি; বহুবচন একাধিক। কিন্তু একবচনের রূপ দিয়েও জাতি বোঝানো যায়: \"বনে বাঘ থাকে\", \"মানুষ মরণশীল\", \"লোকে বলে\" — এগুলো অর্থে বহুবচন।<\/li><li><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span> কোনটি একবচনের উদাহরণ? — <b>\"শিক্ষক ছাত্র পড়াচ্ছেন\"<\/b> (এখানে শিক্ষক একজন)।<\/li><li>প্রাণিবাচক বহুবচন: রা, এরা, গণ, বৃন্দ, মণ্ডলী, বর্গ; অপ্রাণিবাচক: আবলি, গুচ্ছ, দাম, নিকর, পুঞ্জ, মালা, রাজি, রাশি; উভয়ে: কুল, সকল, সব, সমূহ; ইতর প্রাণী: পাল, যূথ।<\/li><li>একই সঙ্গে দুবার বহুবচন চিহ্ন ব্যবহার ভুল: \"সকল ছাত্ররা\" নয়, \"সকল ছাত্র\" বা \"ছাত্ররা\"।<\/li><\/ul><h3 id=\"c06-s8\">5.8 দ্বিরুক্তি (শব্দদ্বিত্ব)<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>প্রকার<\/th><th>উদাহরণ<\/th><\/tr><tr><td>শব্দের দ্বিরুক্তি<\/td><td>ভালো ভালো ফল; ধীরে ধীরে; রাশি রাশি; জ্বর জ্বর<\/td><\/tr><tr><td>পদের দ্বিরুক্তি<\/td><td>ঘরে ঘরে; পায়ে পায়ে; হাতে হাতে; দেশে বিদেশে<\/td><\/tr><tr><td>অনুকার দ্বিত্ব<\/td><td>চুপচাপ; আমটাম; বাড়াবাড়ি; বইটই; ঝিকিমিকি<\/td><\/tr><tr><td>ধ্বন্যাত্মক দ্বিরুক্তি<\/td><td>টাপুর টুপুর; ঝমঝম; কুটকুট; শনশন; <b>পটাপট<\/b>; ঘেউ ঘেউ<\/td><\/tr><\/table><\/div><p>দ্বিরুক্তির অর্থ: আধিক্য (রাশি রাশি ধান), সামান্যতা (জ্বর জ্বর লাগছে), ধারাবাহিকতা (দিন দিন রোগা হচ্ছে), আগ্রহ (<b>মা মা<\/b> বলে কাঁদছে), তীব্রতা (গরম গরম জিলাপি), পৌনঃপুনিকতা (বার বার), ক্রিয়াবিশেষণ (ধীরে ধীরে যায়)।<\/p><ul><li><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span> 'বৃষ্টি পড়ে টাপুর টুপুর' — 'টাপুর টুপুর' <b>ধ্বন্যাত্মক শব্দ<\/b>।<\/li><li><span class=\"tg tg-actual\">ACTUAL: GTCL AM 2021<\/span> 'শিশুটি মা মা বলে কাঁদছে' — দ্বিরুক্তি <b>আগ্রহ<\/b> অর্থে।<\/li><li><span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021<\/span> ধ্বন্যাত্মক শব্দদ্বিত্ব — <b>পটাপট<\/b>।<\/li><\/ul><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 5<\/div><p class=\"li\">গিন্নি, জোছনা, ছেরাদ্দ, বোষ্টম = অর্ধ-তৎসম। ডাব, ঢেঁকি, কুলা = দেশি। টাইফুন, চা, চিনি, লিচু = চীনা।<\/p><p class=\"li\">বাংলা উপসর্গ ২১, তৎসম ২০; উভয়ে: আ, সু, বি, নি। পাতি = ছোট; অনা = অভাব।<\/p><p class=\"li\">ধাতু + প্রত্যয় = কৃৎ; শব্দ + প্রত্যয় = তদ্ধিত (ছাপাখানা)।<\/p><p class=\"li\">গণ্যমান্য = কর্মধারয়; নীলকণ্ঠ = বহুব্রীহি; ত্রিফলা = দ্বিগু; উপকূল = অব্যয়ীভাব; রাজপুত্র = ষষ্ঠী তৎপুরুষ।<\/p><p class=\"li\">নিত্য পুরুষবাচক: কবিরাজ, ঢাকী, সভাপতি, কৃতদার।<\/p><\/div>"},{"id":"c07","no":6,"part":"PART B — BANGLA","title":"Chapter 6: পদ, কারক, কাল, বাক্য ও বাচ্য","short":"পদ, কারক, কাল, বাক্য ও বাচ্য","toc":[["c07-s1","6.1 পদ"],["c07-s2","6.2 কারক ও বিভক্তি"],["c07-s3","6.3 ক্রিয়ার কাল"],["c07-s4","6.4 বাক্য"],["c07-s5","6.5 বাচ্য"],["c07-s6","6.6 উক্তি পরিবর্তন"]],"html":"<h3 id=\"c07-s1\">6.1 পদ<\/h3><p>বিভক্তিযুক্ত শব্দকে পদ বলে। প্রচলিত ব্যাকরণে পদ পাঁচ প্রকার — বিশেষ্য, বিশেষণ, সর্বনাম, ক্রিয়া, অব্যয়; নতুন পাঠ্যবইয়ে (নবম-দশম শ্রেণি, ২০২১) আট প্রকার — বিশেষ্য, সর্বনাম, বিশেষণ, ক্রিয়া, ক্রিয়াবিশেষণ, অনুসর্গ, যোজক, আবেগ।<\/p><ul><li><b>বিশেষ্য<\/b> ছয় প্রকার: সংজ্ঞাবাচক (ঢাকা, নজরুল), জাতিবাচক (মানুষ, নদী), বস্তুবাচক (লোহা, পানি), <b>সমষ্টিবাচক<\/b> (জনতা, <b>পঞ্চায়েত<\/b>, সভা, বহর, মাহফিল), ভাববাচক (গমন, দর্শন), গুণবাচক (মধুরতা, সততা)।<\/li><li><span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span> নিচের কোনটি বিশেষ্য পদ? — <b>পঞ্চায়েত<\/b> (চিরন্তন = বিশেষণ; সে = সর্বনাম; এবং = অব্যয়)।<\/li><li>বিশেষণ: নাম-বিশেষণ (নীল আকাশ) ও ভাব-বিশেষণ (ধীরে চলো, খুব ভালো)।<\/li><\/ul><h3 id=\"c07-s2\">6.2 কারক ও বিভক্তি<\/h3><p>ক্রিয়াপদের সঙ্গে নামপদের সম্পর্ককে কারক বলে। প্রচলিত মতে ছয় কারক; ক্রিয়াকে প্রশ্ন করে চিনুন।<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>কারক<\/th><th>ক্রিয়াকে প্রশ্ন<\/th><th>উদাহরণ<\/th><\/tr><tr><td>কর্তৃ<\/td><td>কে/কারা?<\/td><td><b>পাগলে<\/b> কী না বলে (৭মী); <b>ঘোড়ায়<\/b> গাড়ি টানে<\/td><\/tr><tr><td>কর্ম<\/td><td>কী/কাকে?<\/td><td>ডাক্তার <b>ডাক<\/b>; আমাকে একখানা <b>বই<\/b> দাও; <b>গুরুজনে<\/b> কর ভক্তি<\/td><\/tr><tr><td>করণ<\/td><td>কী দিয়ে/কীসের দ্বারা?<\/td><td><b>কলমে<\/b> লিখি; <b>টাকায়<\/b> কী না হয়; ছাত্ররা <b>বল<\/b> খেলে<\/td><\/tr><tr><td>সম্প্রদান<\/td><td>কাকে দান (স্বত্ব ত্যাগ করে)?<\/td><td><b>ভিক্ষুককে<\/b> ভিক্ষা দাও; <b>সমিতিতে<\/b> চাঁদা দাও<\/td><\/tr><tr><td>অপাদান<\/td><td>কোথা থেকে/কীসের থেকে?<\/td><td><b>মেঘে<\/b> বৃষ্টি হয়; <b>তিলে<\/b> তেল হয়; <b>পাপে<\/b> বিরত হও<\/td><\/tr><tr><td>অধিকরণ<\/td><td>কোথায়/কখন/কী বিষয়ে?<\/td><td><b>আকাশে<\/b> চাঁদ; <b>প্রভাতে<\/b> সূর্য ওঠে; তিনি <b>অঙ্কে<\/b> কাঁচা<\/td><\/tr><\/table><\/div><p>সম্বন্ধ পদ ও সম্বোধন পদ কারক নয়, কারণ ক্রিয়ার সঙ্গে এদের সম্পর্ক নেই।<\/p><p><span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2011<\/span> 'গুরুজনে কর শ্রদ্ধা/নতি' — অপশনে কর্তৃ, অপাদান, করণ ও কর্ম ছিল; উত্তর <b>কর্মকারকে সপ্তমী<\/b>। (শ্রদ্ধা \"দান\" হলেও এখানে কাকে শ্রদ্ধা করো → কর্ম; অপশনে সম্প্রদান থাকলেও অনেক ব্যাকরণবিদ একে কর্মই ধরেন।)<\/p><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: বিভক্তি চেনা<\/div><p class=\"\">শূন্য/অ = ১মা; কে, রে = ২য়া (ও ৪র্থী); দ্বারা, দিয়ে, কর্তৃক = ৩য়া; হতে, থেকে, চেয়ে = ৫মী; র, এর = ৬ষ্ঠী; এ, য়, তে = ৭মী। প্রশ্নে \"কোন কারকে কোন বিভক্তি\" চাইলে আগে কারক, পরে শব্দের শেষ অক্ষর দেখে বিভক্তি বলুন।<\/p><\/div><h3 id=\"c07-s3\">6.3 ক্রিয়ার কাল<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>কাল<\/th><th>চিহ্ন (চলিত)<\/th><th>উদাহরণ<\/th><\/tr><tr><td>সাধারণ (নিত্যবৃত্ত) বর্তমান<\/td><td>-ই, -ও, -এ<\/td><td>সূর্য পূর্ব দিকে ওঠে<\/td><\/tr><tr><td><b>ঘটমান বর্তমান<\/b><\/td><td>-ছি, -ছ, -ছে<\/td><td><b>বালকেরা স্কুলে যাচ্ছে<\/b> <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span><\/td><\/tr><tr><td>পুরাঘটিত বর্তমান<\/td><td>-এছি, -এছে<\/td><td>আমি ভাত খেয়েছি<\/td><\/tr><tr><td>সাধারণ অতীত<\/td><td>-লাম, -ল, -লে<\/td><td>সে বাড়ি গেল<\/td><\/tr><tr><td><b>নিত্যবৃত্ত অতীত<\/b><\/td><td>-তাম, -ত, -তে<\/td><td><b>প্রতিদিন ফুল ফুটত<\/b> <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>; আমরা রোজ খেলতাম<\/td><\/tr><tr><td>ঘটমান অতীত<\/td><td>-ছিলাম, -ছিল<\/td><td>সে পড়ছিল<\/td><\/tr><tr><td>পুরাঘটিত অতীত<\/td><td>-এছিলাম, -এছিল<\/td><td>আমি গিয়েছিলাম<\/td><\/tr><tr><td>সাধারণ ভবিষ্যৎ<\/td><td>-ব, -বে<\/td><td>আমি যাব<\/td><\/tr><tr><td>ঘটমান ভবিষ্যৎ<\/td><td>-তে থাকব<\/td><td>সে পড়তে থাকবে<\/td><\/tr><tr><td>পুরাঘটিত ভবিষ্যৎ<\/td><td>-এ থাকব<\/td><td>তুমি হয়তো শুনে থাকবে<\/td><\/tr><\/table><\/div><p>কালের বিশিষ্ট প্রয়োগ: ঐতিহাসিক বর্তমান (\"বাবরের মৃত্যুর পর হুমায়ুন সিংহাসনে বসেন\"), অনুজ্ঞা (\"তুমি যাও\")। অনুরোধ বা প্রার্থনা বোঝাতে অনুজ্ঞা বা প্রশ্নবোধক বাক্য: \"কাল একবার আসতে পারবে?\" — <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016, অনুরোধ অর্থে<\/span>।<\/p><h3 id=\"c07-s4\">6.4 বাক্য<\/h3><p>সার্থক বাক্যের তিন গুণ: <b>আকাঙ্ক্ষা<\/b> (অর্থ পূর্ণ হওয়ার চাহিদা), <b>আসত্তি<\/b> (পদের সঠিক ক্রম), <b>যোগ্যতা<\/b> (অর্থগত ও ভাবগত মিল)।<\/p><ul><li>বাগধারার শব্দ বদলালে (যেমন \"অরণ্যে রোদন\"-এর জায়গায় \"বনে ক্রন্দন\") বাক্য <b>যোগ্যতা<\/b> হারায় — <span class=\"tg tg-actual\">ACTUAL: GTCL AM 2021<\/span>।<\/li><li>যোগ্যতার অভাবের আরও কারণ: বাহুল্য দোষ (\"সকল শিক্ষকগণ\"), উপমার ভুল প্রয়োগ, দুর্বোধ্যতা, গুরুচণ্ডালী দোষ, রীতিসিদ্ধ অর্থ ভঙ্গ।<\/li><\/ul><div class=\"tablewrap\"><table class=\"bt\"><tr><th>গঠন অনুসারে<\/th><th>চেনার উপায়<\/th><th>উদাহরণ<\/th><\/tr><tr><td>সরল<\/td><td>একটি সমাপিকা ক্রিয়া<\/td><td>সে এসে আমাকে ডাকল।<\/td><\/tr><tr><td>জটিল (মিশ্র)<\/td><td>যে–সে, যদি–তবে, যখন–তখন, যেহেতু–সেহেতু<\/td><td>যে পরিশ্রম করে, সে-ই সফল হয়।<\/td><\/tr><tr><td>যৌগিক<\/td><td>এবং, ও, কিন্তু, অথবা, তথাপি, সুতরাং<\/td><td>সে এল এবং আমাকে ডাকল।<\/td><\/tr><\/table><\/div><p>বাক্য রূপান্তরে অর্থ বদলানো যাবে না: \"যারা পরিশ্রম করে তারা সফল হয়\" (জটিল) → \"পরিশ্রমীরা সফল হয়\" (সরল) → \"পরিশ্রম করো, তবেই সফল হবে\" (যৌগিক)। অস্তিবাচক → নেতিবাচক: \"সে ধনী\" → \"সে গরিব নয়\"; \"সবাই মরণশীল\" → \"কেউ অমর নয়\"।<\/p><h3 id=\"c07-s5\">6.5 বাচ্য<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>বাচ্য<\/th><th>বৈশিষ্ট্য<\/th><th>উদাহরণ<\/th><\/tr><tr><td>কর্তৃবাচ্য<\/td><td>কর্তা প্রধান, ক্রিয়া কর্তার অনুগামী<\/td><td>ছাত্ররা অঙ্ক করছে।<\/td><\/tr><tr><td>কর্মবাচ্য<\/td><td>কর্ম প্রধান; কর্তায় দ্বারা/কর্তৃক<\/td><td>শিকারি কর্তৃক বাঘ নিহত হয়েছে।<\/td><\/tr><tr><td>ভাববাচ্য<\/td><td>ক্রিয়ার অর্থই প্রধান; কর্ম থাকে না<\/td><td>আমার যাওয়া হলো না। এবার ওঠা যাক।<\/td><\/tr><tr><td>কর্মকর্তৃবাচ্য<\/td><td>কর্মই কর্তার মতো আচরণ করে<\/td><td><b>কাজটা ভালো দেখায় না।<\/b> বাঁশি বাজে। সুতি কাপড় অনেক দিন টেকে।<\/td><\/tr><\/table><\/div><p><span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021<\/span> 'কাজটা ভালো দেখায় না' — <b>কর্মকর্তৃবাচ্য<\/b>।<\/p><h3 id=\"c07-s6\">6.6 উক্তি পরিবর্তন<\/h3><p>প্রত্যক্ষ → পরোক্ষ করার সময়: উদ্ধৃতিচিহ্ন উঠে যায় ও \"যে\" বসে; সর্বনামের পুরুষ বদলায়; আজ → সেদিন, কাল (আগামী) → পরদিন, কাল (গত) → আগের দিন, এখানে → সেখানে, এই → সেই। চিরন্তন সত্যের কাল বদলায় না।<\/p><ul><li>শিক্ষক বললেন, \"তোমরা কাল আসবে।\" → শিক্ষক বললেন যে, তারা (আমরা) পরদিন যাবে (আসব)।<\/li><li>সে বলল, \"আমি অসুস্থ।\" → সে বলল যে, সে অসুস্থ।<\/li><\/ul><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 6<\/div><p class=\"li\">পঞ্চায়েত, জনতা = সমষ্টিবাচক বিশেষ্য।<\/p><p class=\"li\">'প্রতিদিন ফুল ফুটত' = নিত্যবৃত্ত অতীত; 'যাচ্ছে' = ঘটমান বর্তমান।<\/p><p class=\"li\">বাক্যের গুণ: আকাঙ্ক্ষা, আসত্তি, যোগ্যতা। বাগধারার শব্দ বদলালে যোগ্যতা নষ্ট।<\/p><p class=\"li\">'কাজটা ভালো দেখায় না', 'বাঁশি বাজে' = কর্মকর্তৃবাচ্য।<\/p><p class=\"li\">মেঘে বৃষ্টি হয় = অপাদানে ৭মী; টাকায় কী না হয় = করণে ৭মী; পাগলে কী না বলে = কর্তায় ৭মী।<\/p><\/div>"},{"id":"c08","no":7,"part":"PART B — BANGLA","title":"Chapter 7: শব্দভাণ্ডার — সমার্থক, শব্দার্থ, বিপরীত, এক কথায় প্রকাশ, বাগধারা, পরিভাষা","short":"শব্দভাণ্ডার — সমার্থক, শব্দার্থ, বিপরীত, এক কথায় প্রকাশ, বাগধারা, পরিভাষা","toc":[["c08-s1","7.1 এই অধ্যায়ের গুরুত্ব"],["c08-s2","7.2 সমার্থক শব্দ — গুচ্ছ ধরে মনে রাখুন"],["c08-s3","7.3 বিপরীত শব্দ"],["c08-s4","7.4 এক কথায় প্রকাশ (বাক্য সংকোচন)"],["c08-s5","7.5 বাগধারা"],["c08-s6","7.6 পারিভাষিক শব্দ"]],"html":"<h3 id=\"c08-s1\">7.1 এই অধ্যায়ের গুরুত্ব<\/h3><p>পেট্রোবাংলার ২০২৪ সালের বাংলা ১৫টি প্রশ্নের ১২টি এবং ২০১৬ সালের ১৫টির ১২টি এই অধ্যায়ের বিষয় থেকে। প্রতিদিন এক পৃষ্ঠা পড়ুন; ডান পাশের কলাম ঢেকে নিজেকে পরীক্ষা করুন।<\/p><h3 id=\"c08-s2\">7.2 সমার্থক শব্দ — গুচ্ছ ধরে মনে রাখুন<\/h3><p>আইবিএ-এর প্রশ্নে সহজ শব্দ দেওয়া হয় না; দেওয়া হয় গুচ্ছের <b>অপরিচিত<\/b> সদস্যটি (যেমন 'পানি' নয় — 'উদক'; 'সূর্য' নয় — 'মার্তণ্ড')। তাই প্রতিটি গুচ্ছের কঠিন শব্দগুলো মোটা হরফে দেওয়া হলো।<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>মূল শব্দ<\/th><th>সমার্থক শব্দ<\/th><\/tr><tr><td>পানি<\/td><td>জল, বারি, সলিল, নীর, অম্বু, <b>উদক<\/b>, <b>পয়ঃ<\/b>, <b>তোয়<\/b>, অপ, জীবন, <b>ইলা<\/b><\/td><\/tr><tr><td>সমুদ্র<\/td><td>সাগর, সিন্ধু, <b>বারিধি<\/b>, <b>জলধি<\/b>, <b>অর্ণব<\/b>, <b>পারাবার<\/b>, <b>রত্নাকর<\/b>, <b>পাথার<\/b>, <b>অম্বুধি<\/b>, <b>পয়োধি<\/b>, বারীশ, দরিয়া<\/td><\/tr><tr><td>আকাশ<\/td><td>গগন, অম্বর, নভঃ, <b>ব্যোম<\/b>, <b>অন্তরীক্ষ<\/b>, শূন্য, আসমান, <b>দ্যুলোক<\/b>, খ, নীলিমা<\/td><\/tr><tr><td>সূর্য<\/td><td>রবি, তপন, ভানু, ভাস্কর, দিবাকর, দিনমণি, <b>মার্তণ্ড<\/b>, <b>আদিত্য<\/b>, <b>সবিতা<\/b>, <b>অংশুমালী<\/b>, <b>মিহির<\/b>, প্রভাকর, অরুণ, বিভাকর, <b>পূষা<\/b><\/td><\/tr><tr><td>চাঁদ<\/td><td>চন্দ্র, শশী, শশধর, <b>শশাঙ্ক<\/b>, <b>সুধাকর<\/b>, <b>সুধাংশু<\/b>, <b>হিমাংশু<\/b>, <b>নিশাকর<\/b>, <b>বিধু<\/b>, ইন্দু, <b>সোম<\/b>, <b>রজনীকান্ত<\/b>, <b>মৃগাঙ্ক<\/b>, কলানিধি<\/td><\/tr><tr><td>পৃথিবী<\/td><td>ধরা, ধরণী, ধরিত্রী, বসুধা, <b>বসুন্ধরা<\/b>, <b>মেদিনী<\/b>, <b>মহী<\/b>, <b>অবনী<\/b>, ভূ, <b>ক্ষিতি<\/b>, <b>উর্বী<\/b>, জগৎ<\/td><\/tr><tr><td>আগুন<\/td><td>অগ্নি, অনল, <b>পাবক<\/b>, <b>বহ্নি<\/b>, <b>হুতাশন<\/b>, <b>কৃশানু<\/b>, <b>বৈশ্বানর<\/b>, শিখা, <b>সর্বভুক<\/b><\/td><\/tr><tr><td>বাতাস<\/td><td>বায়ু, পবন, সমীর, সমীরণ, অনিল, <b>মারুত<\/b>, <b>বাত<\/b>, <b>প্রভঞ্জন<\/b>, হাওয়া<\/td><\/tr><tr><td>মেঘ<\/td><td>জলদ, <b>জলধর<\/b>, <b>বারিদ<\/b>, <b>নীরদ<\/b>, <b>অম্বুদ<\/b>, <b>জীমূত<\/b>, <b>বলাহক<\/b>, <b>পয়োধর<\/b>, <b>তোয়দ<\/b>, ঘন<\/td><\/tr><tr><td>নদী<\/td><td>তটিনী, তরঙ্গিণী, <b>স্রোতস্বিনী<\/b>, <b>প্রবাহিণী<\/b>, <b>নির্ঝরিণী<\/b>, সরিৎ, <b>শৈবলিনী<\/b>, কল্লোলিনী<\/td><\/tr><tr><td>পাহাড়<\/td><td>পর্বত, গিরি, অচল, <b>শৈল<\/b>, <b>অদ্রি<\/b>, <b>ভূধর<\/b>, <b>মহীধর<\/b>, নগ, শৃঙ্গী<\/td><\/tr><tr><td>বন<\/td><td>অরণ্য, কানন, বিপিন, <b>অটবী<\/b>, <b>কান্তার<\/b>, জঙ্গল, <b>গহন<\/b><\/td><\/tr><tr><td>গাছ<\/td><td>বৃক্ষ, তরু, <b>পা /td><td>বুদ্ধিতে স্থূল<\/td><td>হ-য-ব-র-ল<\/td><td>বিশৃঙ্খলা<\/td><\/tr><\/table><\/div><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: \"একই অর্থের\" বাগধারা জোড়ায় মনে রাখুন<\/div><p class=\"li\">অপদার্থ: অকাল কুষ্মাণ্ড, আমড়া কাঠের ঢেঁকি, কচুবনের কালাচাঁদ, ঢাকের বায়া।<\/p><p class=\"li\">ভণ্ড: বকধার্মিক, বিড়াল তপস্বী, তুলসী বনের বাঘ, ভিজে বিড়াল, বর্ণচোরা আম।<\/p><p class=\"li\">দুর্লভ: অমাবস্যার চাঁদ, ডুমুরের ফুল। অসম্ভব: ব্যাঙের সর্দি, কাঁঠালের আমসত্ত্ব, আকাশ কুসুম, ঘোড়ার ডিম।<\/p><p class=\"li\">শত্রুতা: অহিনকুল সম্বন্ধ, আদায় কাঁচকলায়, দা-কুমড়া। মারা যাওয়া: পটল তোলা, অক্কা পাওয়া।<\/p><p class=\"li\">হতভাগ্য: আটকপালে, ইঁদুর কপালে, হাড় হাভাতে। সৌভাগ্য: একাদশে বৃহস্পতি, পোয়া বারো, লগন চাঁদ।<\/p><\/div><h3 id=\"c08-s6\">7.6 পারিভাষিক শব্দ<\/h3><p>প্রশাসন পদের জন্য দাপ্তরিক পরিভাষা বিশেষ গুরুত্বপূর্ণ; লিখিত পত্রেও কাজে লাগে।<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>English<\/th><th>পরিভাষা<\/th><th>English<\/th><th>পরিভাষা<\/th><\/tr><tr><td>Horizontal<\/td><td>অনুভূমিক — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span><\/td><td>Vertical<\/td><td>উল্লম্ব<\/td><\/tr><tr><td>Acting<\/td><td>ভারপ্রাপ্ত<\/td><td>Ad hoc<\/td><td>তদর্থক<\/td><\/tr><tr><td>Affidavit<\/td><td>হলফনামা<\/td><td>Agenda<\/td><td>আলোচ্যসূচি<\/td><\/tr><tr><td>Allotment<\/td><td>বরাদ্দ<\/td><td>Amendment<\/td><td>সংশোধনী<\/td><\/tr><tr><td>Appendix<\/td><td>পরিশিষ্ট<\/td><td>Autonomous<\/td><td>স্বায়ত্তশাসিত<\/td><\/tr><tr><td>Audit<\/td><td>নিরীক্ষা<\/td><td>Bail<\/td><td>জামিন<\/td><\/tr><tr><td>Bidder<\/td><td>দরদাতা<\/td><td>Bond<\/td><td>মুচলেকা<\/td><\/tr><tr><td>Bureaucracy<\/td><td>আমলাতন্ত্র<\/td><td>By-law<\/td><td>উপবিধি<\/td><\/tr><tr><td>Circular<\/td><td>পরিপত্র<\/td><td>Code<\/td><td>সংহিতা, বিধি<\/td><\/tr><tr><td>Compensation<\/td><td>ক্ষতিপূরণ<\/td><td>Confidential<\/td><td>গোপনীয়<\/td><\/tr><tr><td>Consumer<\/td><td>ভোক্তা<\/td><td>Corrigendum<\/td><td>শুদ্ধিপত্র<\/td><\/tr><tr><td>Deputation<\/td><td>প্রেষণ<\/td><td>Designation<\/td><td> ্ন বিপদ; লেফাফা দুরস্ত = বাইরে পরিপাটি।<\/p><p class=\"li\">Horizontal = অনুভূমিক; Ex-officio = পদাধিকারবলে; Deputation = প্রেষণ; Quorum = গণপূর্তি।<\/p><\/div>"},{"id":"c09","no":8,"part":"PART B — BANGLA","title":"Chapter 8: বানান ও বাক্যশুদ্ধি","short":"বানান ও বাক্যশুদ্ধি","toc":[["c09-s1","8.1 প্রশ্নের ধরন"],["c09-s2","8.2 বাংলা একাডেমির প্রমিত বানানের মূল নিয়ম"],["c09-s3","8.3 সবচেয়ে বেশি ভুল হওয়া বানান"],["c09-s4","8.4 বাক্যশুদ্ধি — যে ভুলগুলো আসে"]],"html":"<h3 id=\"c09-s1\">8.1 প্রশ্নের ধরন<\/h3><p>চারটি বা পাঁচটি বানান দেওয়া থাকে, একটি শুদ্ধ। ভুলগুলো তৈরি হয় চারটি জায়গায়: ই-কার/ঈ-কার, উ-কার/ঊ-কার, ণ/ন, শ/ষ/স। তাই প্রতিটি শব্দের \"বিপজ্জনক অক্ষর\" চিহ্নিত করে পড়ুন।<\/p><h3 id=\"c09-s2\">8.2 বাংলা একাডেমির প্রমিত বানানের মূল নিয়ম<\/h3><ul><li><b>তৎসম শব্দের বানান অপরিবর্তিত<\/b> থাকে; তবে যেসব তৎসম শব্দে ই/ঈ বা উ/ঊ উভয়ই শুদ্ধ, সেখানে শুধু ই ও উ এবং তাদের কার-চিহ্ন হবে: কিংবদন্তি, খঞ্জনি, চিৎকার, ধমনি, পদবি, ভঙ্গি, মঞ্জরি, লহরি, সরণি, সূচিপত্র, উষা।<\/li><li><b>অ-তৎসম (তদ্ভব, দেশি, বিদেশি) শব্দে কেবল ই ও উ<\/b>: বাড়ি, গাড়ি, শাড়ি, পাখি, সরকারি, তরকারি, বেশি, দাদি, কাহিনি, জাপানি, ইংরেজি, রেশমি, পুজো, ধুলো।<\/li><li>রেফের পরে ব্যঞ্জনের দ্বিত্ব হবে না: কর্ম, কার্য, সূর্য, অর্চনা, কর্তা, ধর্ম (কর্ম্ম নয়)।<\/li><li>সন্ধিতে ম্-এর পরে ক-বর্গ থাকলে ং: অহংকার, ভয়ংকর, সংগীত, সংঘটন, শুভংকর (বিকল্পে ঙ)। কিন্তু সন্ধিবদ্ধ না হলে ঙ: অঙ্ক, অঙ্গ, আকাঙ্ক্ষা, গঙ্গা, বঙ্গ, শঙ্কা, সঙ্গ।<\/li><li>বিদেশি শব্দে ণ, ষ হয় না; \"ষ্ট\" নয় \"স্ট\": স্টেশন, পোস্ট, স্টোর, মাস্টার, খ্রিস্ট, গভর্নর, কর্নার, হর্ন।<\/li><li>ইংরেজি s-এর জন্য স, sh/-tion-এর জন্য শ: স্টল, সিনেমা, শার্ট, মিশন, স্টেশন।<\/li><li>\"আলি\" প্রত্যয়যুক্ত শব্দে ই-কার: সোনালি, রুপালি, বর্ণালি, মিতালি, গীতাঞ্জলি। ব্যতিক্রম নয়।<\/li><li>পদাশ্রিত নির্দেশক \"টি\", \"টা\": ছেলেটি, বইটি। \"কি\" (প্রশ্নবোধক অব্যয়: তুমি কি যাবে?) ও \"কী\" (সর্বনাম/বিশেষণ: তুমি কী খাবে? কী সুন্দর!) আলাদা।<\/li><li>হস্-চিহ্ন যথাসম্ভব বর্জনীয়: কাত, মদ, চট, ফটফট। ঊর্ধ্ব-কমা বর্জনীয়: করল, বলে, দুজন।<\/li><li>\"-ইত, -ঈয়, -ইক\" প্রত্যয়: ভৌগোলিক, সামাজিক, জাতীয়, নাটকীয়।<\/li><\/ul><h3 id=\"c09-s3\">8.3 সবচেয়ে বেশি ভুল হওয়া বানান<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>শুদ্ধ<\/th><th>মনে রাখুন<\/th><th>শুদ্ধ<\/th><th>মনে রাখুন<\/th><\/tr><tr><td>দেদীপ্যমান<\/td><td>দে-<b>দী<\/b>-প্য-মা<b>ন<\/b> <span class=\"tg tg-repeated\">REPEATED: Titas 2021, PB 2024<\/span><\/td><td>সমীচীন<\/td><td>স-<b>মী<\/b>-<b>চী<\/b>-ন <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span><\/td><\/tr><tr><td>বিভীষিকা<\/td><td>বি-<b>ভী<\/b>-<b>ষি<\/b>-কা <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span><\/td><td>আনুষঙ্গিক<\/td><td>আনু-<b>ষ<\/b>-ঙ্গিক <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span><\/td><\/tr><tr><td>অন্তঃসার<\/td><td>বিসর্গসহ <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span><\/td><td>শুশ্রূষা<\/td><td>শু-<b>শ্রূ<\/b>-<b>ষা<\/b> <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><\/tr><tr><td>ভস্মীভূত<\/td><td>ভ-<b>স্মী<\/b>-<b>ভূ<\/b>-ত <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><td>দুষ্কৃতকারী<\/td><td>দু-<b>ষ্কৃ<\/b>-ত <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><\/tr><tr><td>অস্তায়মান<\/td><td>অস্তা-<b>য়<\/b>-মান <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><td>অন্বেষণ<\/td><td>অ-<b>ন্বে<\/b>-ষ<b>ণ<\/b> <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span><\/td><\/tr><tr><td>কল্যাণীয়েষু<\/td><td>কল্যা<b>ণী<\/b>য়ে<b>ষু<\/b> <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span><\/td><td>রুগ্‌ণ<\/td><td>গ + ণ (\"রুগ্ন\" ভুল) <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span><\/td><\/tr><tr><td>মুমূর্ষু<\/td><td>মু-<b>মূ<\/b>-র্<b>ষু<\/b><\/td><td>মনীষী<\/td><td>ম-<b>নী<\/b>-<b>ষী<\/b><\/td><\/tr><tr><td>পিপীলিকা<\/td><td>পি-<b>পী<\/b>-লিকা<\/td><td>নিশীথিনী<\/td><td>নি-<b>শী<\/b>-<b>থি<\/b>-<b>নী<\/b><\/td><\/tr><tr><td>শারীরিক<\/td><td>শা-<b>রী<\/b>-<b>রি<\/b>-ক<\/td><td>প্রতিযোগিতা<\/td><td>যো-<b>গি<\/b>-তা<\/td><\/tr><tr><td>সহযোগিতা<\/td><td>গি-তা (ই-কার)<\/td><td>প্রতিদ্বন্দ্বিতা<\/td><td>দ্ব-ন
