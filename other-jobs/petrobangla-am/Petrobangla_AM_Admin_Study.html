etrobangla AM 2024<\/span><\/p><p class=\"pa\">Relative speed = 250/10 = 25 m/s = 90 km/h. Opposite directions add, so the train's speed = 90 − 5 = <b>85 km/h<\/b>.<\/p><p class=\"pq\">13. A train 150 metres long passes a man who is moving at 2 km/h in the same direction in 3 seconds. Find the speed of the train. <span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021, written, 5 marks<\/span><\/p><p class=\"pa\">Relative speed = 150/3 = 50 m/s = 180 km/h. Same direction subtracts, so the train's speed = 180 + 2 = <b>182 km/h<\/b>.<\/p><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: Opposite adds, same subtracts — then undo it<\/div><p class=\"\">Relative speed (from length ÷ time) is train + person when they move in opposite directions and train − person in the same direction. To recover the train's own speed, do the reverse operation. The two questions above differ only in this step.<\/p><\/div><h3 id=\"c23-s4\">22.4 Boats and streams<\/h3><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Boats<\/div><p class=\"li\">Downstream speed = b + s; upstream speed = b − s (b = boat in still water, s = stream).<\/p><p class=\"li\">b = (downstream + upstream)/2; s = (downstream − upstream)/2.<\/p><\/div><p class=\"pq\">14. A boat sails m miles upstream at the rate of r miles per hour. If the speed of the stream is s miles per hour, how long will it take the boat to return to its starting point? <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span><\/p><p class=\"pa\">Upstream speed r = b − s → b = r + s → downstream speed = b + s = r + 2s → time = <b>m/(r + 2s)<\/b>.<\/p><p class=\"pq\">15. <span class=\"tg tg-new\">NEW<\/span> A boat goes 24 km downstream in 2 hours and returns in 3 hours. Find the speed of the boat in still water and of the stream.<\/p><p class=\"pa\">Downstream 12, upstream 8 → boat <b>10 km/h<\/b>, stream <b>2 km/h<\/b>.<\/p><h3 id=\"c23-s5\">22.5 Practice set<\/h3><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P1. A can do a piece of work in 10 days and B in 15 days. They work together for 3 days and then A leaves. In how many more days will B finish?<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P2. Two pipes fill a tank in 12 and 18 hours; a third pipe empties it in 36 hours. With all three open, how long does the tank take to fill?<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P3. A man goes to his office at 40 km/h and returns at 60 km/h. Find his average speed.<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P4. A train 300 m long crosses a platform 200 m long in 25 seconds. Find its speed in km/h.<\/p><p class=\"pq\"><span class=\"tg tg-modified\">MODIFIED: Petrobangla AM 2024 Q66<\/span> P5. A 180-metre train passes a man running at 6 km/h in the same direction in 12 seconds. Find the speed of the train.<\/p><p class=\"pq\"><span class=\"tg tg-modified\">MODIFIED: GTCL AM 2021 Q27<\/span> P6. A leak can empty a full tank in 10 hours; an inlet pipe can fill it in 6 hours. If the tank is empty and both operate, in how many hours will it be full?<\/p><p class=\"pa\">Answers: P1: 3(1/10 + 1/15) = 1/2 done; B needs (1/2) × 15 = 7.5 days · P2: 1/12 + 1/18 − 1/36 = 4/36 → 9 hours · P3: 2 × 40 × 60/100 = 48 km/h · P4: 500/25 = 20 m/s = 72 km/h · P5: 180/12 = 15 m/s = 54 km/h relative → 60 km/h · P6: 1/6 − 1/10 = 1/15 → 15 hours.<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 22<\/div><p class=\"li\">One-day work = 1/days; add rates; leaks subtract. Using the LCM of the days as \"total units\" avoids fractions.<\/p><p class=\"li\">Average speed = total distance ÷ total time. Equal distances: 2uv/(u + v).<\/p><p class=\"li\">Meeting problems: distance ÷ sum of speeds. Round-trip meeting: together they cover twice the distance.<\/p><p class=\"li\">Train length ÷ time = relative speed; convert with 18/5; then add or subtract the other speed.<\/p><p class=\"li\">Downstream b + s; upstream b − s.<\/p><\/div>"},{"id":"c24","no":23,"part":"PART D — MATHEMATICS","title":"Chapter 23: Algebra — Expressions, Equations, Inequalities, Indices","short":"Algebra — Expressions, Equations, Inequalities, Indices","toc":[["c24-s1","23.1 Identities you must know"],["c24-s2","23.2 Linear equations and word problems"],["c24-s3","23.3 Quadratic equations"],["c24-s4","23.4 Inequalities"],["c24-s5","23.5 Indices and surds"],["c24-s6","23.6 Logarithms (for completeness)"],["c24-s7","23.7 Sequences and series"],["c24-s8","23.8 Practice set"]],"html":"<h3 id=\"c24-s1\">23.1 Identities you must know<\/h3><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Algebraic identities<\/div><p class=\"li\">(a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²<\/p><p class=\"li\">a² − b² = (a + b)(a − b)<\/p><p class=\"li\">(a + b)² = (a − b)² + 4ab; a² + b² = (a + b)² − 2ab<\/p><p class=\"li\">(a + b)³ = a³ + 3a²b + 3ab² + b³ = a³ + b³ + 3ab(a + b)<\/p><p class=\"li\">a³ + b³ = (a + b)(a² − ab + b²); a³ − b³ = (a − b)(a² + ab + b²)<\/p><p class=\"li\">(x + 1/x)² = x² + 1/x² + 2; (x − 1/x)² = x² + 1/x² − 2<\/p><p class=\"li\">(a + b + c)² = a² + b² + c² + 2(ab + bc + ca)<\/p><\/div><p class=\"pq\">1. If x = (y + 3)², which of the following equals (−2y − 6)²? <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span><\/p><p class=\"pa\">(−2y − 6)² = [−2(y + 3)]² = 4(y + 3)² = <b>4x<\/b>.<\/p><p class=\"pq\">2. 4x = 52; x² − 5² = ? <span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021<\/span><\/p><p class=\"pa\">x = 13 → 169 − 25 = <b>144<\/b> (or (13 + 5)(13 − 5) = 18 × 8).<\/p><p class=\"pq\">3. For which value of P will 4x² − Px + 9 be a perfect square? <span class=\"tg tg-actual\">ACTUAL: GTCL AM 2021<\/span><\/p><p class=\"pa\">(2x − 3)² = 4x² − 12x + 9 → P = <b>12<\/b>.<\/p><p class=\"pq\">4. <span class=\"tg tg-new\">NEW<\/span> If x + 1/x = 5, find x² + 1/x² and x³ + 1/x³.<\/p><p class=\"pa\">x² + 1/x² = 25 − 2 = <b>23<\/b>; x³ + 1/x³ = 5³ − 3 × 5 = <b>110<\/b>.<\/p><h3 id=\"c24-s2\">23.2 Linear equations and word problems<\/h3><p class=\"pq\">5. If 5(3a − 7) = 20, what is (3a − 8)? <span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span><\/p><p class=\"pa\">3a − 7 = 4 → 3a − 8 = <b>3<\/b>. <i>Do not find a.<\/i><\/p><p class=\"pq\">6. What value of x satisfies x − 1 = 1 − x? <span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span><\/p><p class=\"pa\">2x = 2 → x = <b>1<\/b>.<\/p><p class=\"pq\">7. When 9 is added to one-fourth of a number, the result is 19. What is the number? <span class=\"tg tg-actual\">ACTUAL: PGCL AM (Admin) 2021<\/span><\/p><p class=\"pa\">x/4 = 10 → <b>40<\/b>.<\/p><p class=\"pq\">8. In an essay competition a winner gets a prize of Tk 100 and a participant who does not win gets Tk 25. The total prize money is Tk 3,000 and there are 63 participants. Find the number of winners. <span class=\"tg tg-actual\">ACTUAL: BAPEX AM 2023<\/span><\/p><p class=\"pa\">100w + 25(63 − w) = 3,000 → 75w = 1,425 → w = <b>19<\/b>.<\/p><p class=\"pq\">9. In a class, if 4 students sit on each bench, 3 benches are empty; but if 3 students sit on each bench, 6 students have to stand. How many students are there? <span class=\"tg tg-actual\">ACTUAL: GTCL AM 2021<\/span><\/p><p class=\"pa\">Let benches = b: 4(b − 3) = 3b + 6 → b = 18 → students = <b>60<\/b>.<\/p><p class=\"pq\">10. The electricity bill of an establishment is partly fixed and partly varies with the units consumed. For 540 units the bill is Tk 1,800; for 620 units it is Tk 2,040. What is the bill for 500 units? <span class=\"tg tg-actual\">ACTUAL: Titas AM 2021<\/span><\/p><p class=\"pa\">80 extra units cost 240 → Tk 3 per unit; fixed part = 1,800 − 1,620 = 180 → 180 + 1,500 = <b>Tk 1,680<\/b>.<\/p><p class=\"pq\">11. Tip and Top together had Tk 100. After giving Top Tk 10, Tip finds he has Tk 4 more than one-fifth of what Top now has. How much does Tip have now? <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span><\/p><p class=\"pa\">Let Tip now have t; Top now has 100 − t. t = (100 − t)/5 + 4 → 5t = 120 − t → t = <b>Tk 20<\/b>.<\/p><p class=\"pq\">12. Apu, Babu and Tipu paid for a football. Tipu paid twice as much as Apu, and Babu paid the most. Apu paid Tk 70 less than the difference between Babu's and Tipu's payments. If Apu had paid twice as much as he did, Babu and Tipu would each have paid Tk 10 less. How much did Babu pay? <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2024<\/span><\/p><p class=\"pa\">Apu a, Tipu 2a, Babu b. a = (b − 2a) − 70 → b = 3a + 70. Apu's extra payment a equals the others' saving 10 + 10 = 20 → a = 20 → b = <b>Tk 130<\/b>.<\/p><p class=\"pq\">13. ABCD is a rectangle. If its length is decreased by 5 m and its width increased by 3 m, the area decreases by 9 m². If its length is increased by 3 m and its width by 2 m, the area increases by 67 m². What is the width? <span class=\"tg tg-actual\">ACTUAL: GTCL AM 2021<\/span><\/p><p class=\"pa\">(x − 5)(y + 3) = xy − 9 → 3x − 5y = 6. (x + 3)(y + 2) = xy + 67 → 2x + 3y = 61. Solving: y = <b>9 m<\/b>, x = 17 m.<\/p><h3 id=\"c24-s3\">23.3 Quadratic equations<\/h3><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Quadratics<\/div><p class=\"li\">ax² + bx + c = 0 → x = [−b ± √(b² − 4ac)] / 2a.<\/p><p class=\"li\">Sum of roots = −b/a; product of roots = c/a.<\/p><p class=\"li\">Discriminant D = b² − 4ac: D &gt; 0 two real roots; D = 0 equal roots (perfect square); D &lt; 0 no real root.<\/p><p class=\"li\"><b>Minimum or maximum<\/b> of ax² + bx + c occurs at x = −b/2a; its value is c − b²/4a. (a &gt; 0 gives a minimum.)<\/p><\/div><p class=\"pq\">14. What is the minimum value of 4x² + 16x − 17? <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2024<\/span><\/p><p class=\"pa\">Complete the square: 4(x² + 4x + 4) − 16 − 17 = 4(x + 2)² − 33 → minimum <b>−33<\/b> (at x = −2).<\/p><p class=\"pq\">15. Sazid has $360 for a tour. If he extends the tour by 4 days, he must cut his daily expenses by $3. How long was the tour originally planned to be? <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2024, written, 5 marks<\/span><\/p><p class=\"pa\">Let the tour be d days. 360/d − 360/(d + 4) = 3 → 360 × 4 = 3d(d + 4) → d² + 4d − 480 = 0 → (d − 20)(d + 24) = 0 → d = <b>20 days<\/b>. Check: 360/20 = 18; 360/24 = 15; difference 3 ✓. <i>Always write the check in a written answer.<\/i><\/p><p class=\"pq\">16. <span class=\"tg tg-new\">NEW<\/span> The product of two consecutive positive integers is 156. Find them.<\/p><p class=\"pa\">n(n + 1) = 156 → n² + n − 156 = 0 → (n − 12)(n + 13) = 0 → <b>12 and 13<\/b>.<\/p><h3 id=\"c24-s4\">23.4 Inequalities<\/h3><ul><li>Adding or subtracting the same number keeps the sign; multiplying or dividing by a <b>negative<\/b> number reverses it.<\/li><li>(x − a)(x − b) &lt; 0 with a &lt; b → a &lt; x &lt; b (\"between the roots\"); (x − a)(x − b) &gt; 0 → x &lt; a or x &gt; b.<\/li><li>For \"which must be true\" with ranges, combine the extremes: to make x − y smallest use the smallest x and largest y.<\/li><\/ul><p class=\"pq\">17. For which values of x is x² − 6x + 8 negative? <span class=\"tg tg-actual\">ACTUAL: Titas AM 2021<\/span><\/p><p class=\"pa\">(x − 2)(x − 4) &lt; 0 → <b>2 &lt; x &lt; 4<\/b>.<\/p><p class=\"pq\">18. Suppose x &gt; y and xy &lt; 0. Which must be negative: y, x, x − y? <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span><\/p><p class=\"pa\">xy &lt; 0 means opposite signs; the larger, x, is positive, so <b>y<\/b> is negative.<\/p><p class=\"pq\">19. If 3 &lt; x &lt; 7 and 5 &gt; y &gt; 2, which must be true? (A) x + y &gt; 8 (B) x − y &gt; 0 (C) x − 2y &lt; 2 (D) 2x − y &gt; 1 (E) None <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2024<\/span><\/p><p class=\"pa\">Test each with extreme values. (A) x = 3.1, y = 2.1 → 5.2: false. (B) x = 3.1, y = 4.9: false. (C) x = 6.9, y = 2.1 → 2.7: false. (D) smallest 2x − y is just above 6 − 5 = 1 → always true. <b>(D)<\/b>.<\/p><h3 id=\"c24-s5\">23.5 Indices and surds<\/h3><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Indices<\/div><p class=\"li\">aᵐ × aⁿ = aᵐ⁺ⁿ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐⁿ; (ab)ⁿ = aⁿbⁿ<\/p><p class=\"li\">a⁰ = 1 (a ≠ 0); a⁻ⁿ = 1/aⁿ; a^(1/n) = ⁿ√a; a^(m/n) = ⁿ√(aᵐ)<\/p><p class=\"li\">If aˣ = aʸ (a ≠ 0, ±1) then x = y.<\/p><p class=\"li\">√a × √b = √(ab); rationalise 1/(√a − √b) by multiplying by (√a + √b).<\/p><\/div><p class=\"pq\">20. (1000)⁷ ÷ (10)¹⁸ = ? <span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021<\/span><\/p><p class=\"pa\">10²¹ ÷ 10¹⁸ = 10³ = <b>1000<\/b>.<\/p><p class=\"pq\">21. If m and n are whole numbers such that mⁿ = 121, what is (m − 1)ⁿ⁺¹? <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span><\/p><p class=\"pa\">121 = 11² → m = 11, n = 2 → 10³ = <b>1000<\/b>.<\/p><p class=\"pq\">22. If aˣ = b, bʸ = c and cᶻ = a, then xyz = ? <span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021<\/span><\/p><p class=\"pa\">a = cᶻ = (bʸ)ᶻ = bʸᶻ = (aˣ)ʸᶻ = aˣʸᶻ → xyz = <b>1<\/b>.<\/p><h3 id=\"c24-s6\">23.6 Logarithms (for completeness)<\/h3><p>No logarithm question appears in the eleven papers, but the topic is named in published guidance for this examination.<\/p><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Logarithms<\/div><p class=\"li\">If aˣ = N then logₐN = x. logₐ1 = 0; logₐa = 1.<\/p><p class=\"li\">log(MN) = log M + log N; log(M/N) = log M − log N; log(Mⁿ) = n log M.<\/p><p class=\"li\">Change of base: logₐb = log b / log a; logₐb × log_b a = 1.<\/p><\/div><p class=\"pq\">23. <span class=\"tg tg-new\">NEW<\/span> Find log₂ 64 and log₅ (1/125); solve log₁₀ x = 3.<\/p><p class=\"pa\">6; −3; x = 1000.<\/p><h3 id=\"c24-s7\">23.7 Sequences and series<\/h3><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Progressions<\/div><p class=\"li\">Arithmetic progression (সমান্তর ধারা): nth term = a + (n − 1)d; sum of n terms = n/2 × [2a + (n − 1)d] = n/2 × (first + last).<\/p><p class=\"li\">1 + 2 + … + n = n(n + 1)/2; 1 + 3 + 5 + … (n odd numbers) = n²; 1² + 2² + … + n² = n(n + 1)(2n + 1)/6.<\/p><p class=\"li\">Geometric progression (গুণোত্তর ধারা): nth term = arⁿ⁻¹; sum = a(rⁿ − 1)/(r − 1).<\/p><\/div><p class=\"pq\">24. <span class=\"tg tg-new\">NEW<\/span> Find the sum 5 + 8 + 11 + … to 20 terms, and the 20th term.<\/p><p class=\"pa\">20th term = 5 + 19 × 3 = 62; sum = 20/2 × (5 + 62) = <b>670<\/b>.<\/p><p class=\"pq\">25. <span class=\"tg tg-new\">NEW<\/span> Find the next term: 2, 6, 12, 20, 30, ? and 1, 1, 2, 3, 5, 8, ?<\/p><p class=\"pa\">Differences 4, 6, 8, 10, 12 → <b>42<\/b> (n(n + 1)); Fibonacci → <b>13<\/b>.<\/p><h3 id=\"c24-s8\">23.8 Practice set<\/h3><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P1. If a + b = 7 and ab = 10, find a² + b² and (a − b)².<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P2. A man has Tk 5 and Tk 10 notes, 40 in all, worth Tk 275. How many Tk 10 notes has he?<\/p><p class=\"pq\"><span class=\"tg tg-modified\">MODIFIED: Petrobangla AM 2024 Q68<\/span> P3. What is the minimum value of 3x² − 12x + 5?<\/p><p class=\"pq\"><span class=\"tg tg-modified\">MODIFIED: Petrobangla AM 2024 written<\/span> P4. A man has Tk 480 for a trip. If he extends the trip by 2 days he must reduce his daily expenses by Tk 8. Find the original length of the trip.<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P5. Solve: x² − 5x − 14 &gt; 0.<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P6. Simplify: (2⁵ × 4³) ÷ 8³.<\/p><p class=\"pa\">Answers: P1: 49 − 20 = 29; 49 − 40 = 9 · P2: 5(40 − t) + 10t = 275 → t = 15 · P3: 3(x − 2)² − 7 → −7 · P4: 480/d − 480/(d + 2) = 8 → d² + 2d − 120 = 0 → d = 10 days · P5: (x − 7)(x + 2) &gt; 0 → x &lt; −2 or x &gt; 7 · P6: 2⁵ × 2⁶ ÷ 2⁹ = 4.<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 23<\/div><p class=\"li\">Look for the expression asked, not the variable: 3a − 8 from 3a − 7; x + y from adding two equations.<\/p><p class=\"li\">Translate the story sentence by sentence; with numeric options, substitute.<\/p><p class=\"li\">Minimum of ax² + bx + c = c − b²/4a at x = −b/2a (complete the square).<\/p><p class=\"li\">(x − a)(x − b) &lt; 0 → between the roots. \"Must be true\" → test extremes.<\/p><p class=\"li\">Same base → add or subtract the powers.<\/p><\/div>"},{"id":"c25","no":24,"part":"PART D — MATHEMATICS","title":"Chapter 24: Geometry and Mensuration","short":"Geometry and Mensuration","toc":[["c25-s1","24.1 Lines and angles"],["c25-s2","24.2 Triangles"],["c25-s3","24.3 Quadrilaterals"],["c25-s4","24.4 Circles"],["c25-s5","24.5 Solids"],["c25-s6","24.6 Coordinate geometry in brief"],["c25-s7","24.7 Practice set"]],"html":"<h3 id=\"c25-s1\">24.1 Lines and angles<\/h3><ul><li>Angles on a straight line add up to 180°; angles round a point to 360°. Complementary angles (পূরক কোণ) sum to 90°; supplementary (সম্পূরক কোণ) to 180°.<\/li><li>Acute (সূক্ষ্ম) &lt; 90°; right (সমকোণ) = 90°; obtuse (স্থূল) between 90° and 180°; straight = 180°; reflex (প্রবৃদ্ধ) between 180° and 360°.<\/li><li>Vertically opposite angles (বিপ্রতীপ কোণ) are equal. With parallel lines: alternate angles (একান্তর) equal, corresponding angles (অনুরূপ) equal, co-interior angles sum to 180°.<\/li><\/ul><h3 id=\"c25-s2\">24.2 Triangles<\/h3><ul><li>Angles sum to 180°. An exterior angle equals the sum of the two opposite interior angles.<\/li><li>The sum of any two sides is <b>greater<\/b> than the third; otherwise no triangle exists.<\/li><li>Equilateral (সমবাহু): three equal sides, each angle 60°. Isosceles (সমদ্বিবাহু): two equal sides and equal base angles. Scalene (বিষমবাহু): all different.<\/li><li><b>Pythagoras:<\/b> in a right-angled triangle, hypotenuse² = base² + height². Triples: 3-4-5, 5-12-13, 8-15-17, 7-24-25 and their multiples (6-8-10, 9-12-15).<\/li><li>The largest side is opposite the largest angle. A median joins a vertex to the midpoint of the opposite side; the three medians meet at the centroid (ভরকেন্দ্র), which divides each in the ratio 2 : 1.<\/li><\/ul><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Triangle<\/div><p class=\"li\">Area = ½ × base × height.<\/p><p class=\"li\">Heron: area = √[s(s − a)(s − b)(s − c)], s = (a + b + c)/2.<\/p><p class=\"li\">Equilateral triangle of side a: area = (√3/4)a²; height = (√3/2)a.<\/p><\/div><p class=\"pq\">1. What is the area in square feet of the triangle whose sides are 10, 6 and 4 feet? <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span><\/p><p class=\"po\">(A) 480 (B) 24 (C) 48 (D) 30 (E) None of these<\/p><p class=\"pa\">As printed, 6 + 4 = 10: the three \"sides\" lie on a straight line and enclose no area, so the correct choice is <b>(E) None of these<\/b>. The solution books change the data to 10, 8, 6 (a right-angled triangle, area ½ × 8 × 6 = 24) and mark (B). If the paper in front of you says 10, 8, 6, the answer is 24; if it says 10, 6, 4, it is \"None\". <i>Always test the triangle inequality before using Heron's formula.<\/i><\/p><h3 id=\"c25-s3\">24.3 Quadrilaterals<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Figure<\/th><th>Properties<\/th><th>Area and perimeter<\/th><\/tr><tr><td>Square (বর্গ)<\/td><td>4 equal sides, 4 right angles; diagonals equal and perpendicular<\/td><td>Area a²; perimeter 4a; diagonal a√2<\/td><\/tr><tr><td>Rectangle (আয়ত)<\/td><td>opposite sides equal, 4 right angles; diagonals equal<\/td><td>Area l × w; perimeter 2(l + w); diagonal √(l² + w²)<\/td><\/tr><tr><td>Parallelogram (সামান্তরিক)<\/td><td>opposite sides parallel and equal; diagonals bisect each other<\/td><td>Area base × height<\/td><\/tr><tr><td>Rhombus (রম্বস)<\/td><td>4 equal sides; diagonals perpendicular bisectors<\/td><td>Area ½ × d₁ × d₂<\/td><\/tr><tr><td>Trapezium (ট্রাপিজিয়াম)<\/td><td>one pair of parallel sides<\/td><td>Area ½ × (sum of parallel sides) × height<\/td><\/tr><\/table><\/div><ul><li>Sum of interior angles of a polygon with n sides = (n − 2) × 180°; each exterior angle of a regular polygon = 360°/n; number of diagonals = n(n − 3)/2.<\/li><\/ul><p class=\"pq\">2. The area of a rectangle R with width 4 feet is equal to the area of a square S which has a perimeter of 24 feet. What is the perimeter of R? <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span><\/p><p class=\"pa\">Side of S = 6 → area 36 → length of R = 9 → perimeter = 2(9 + 4) = <b>26 feet<\/b>.<\/p><p class=\"pq\">3. A square sheet of plywood has an area of 169 square feet. A strip 2 feet wide is cut off one side so that it fits a wall. What is the area of the wall? <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span><\/p><p class=\"pa\">Side 13 → 13 × 11 = <b>143 square feet<\/b>.<\/p><p class=\"pq\">4. Square ABCD has area x². E is a point on DC with EC = y. What is the area of triangle AED? <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span><\/p><p class=\"pa\">Side = x; DE = x − y; the triangle has base DE and height AD = x → ½ × x × (x − y) = <b>(x² − xy)/2<\/b>.<\/p><p class=\"pq\">5. A rectangular plot has a fence along three of its four sides. The unfenced side and the side opposite it are each three times as long as the other two sides. If the area is 432 square feet, what is the total length of the fence? <span class=\"tg tg-actual\">ACTUAL: BGFCL AM 2021<\/span><\/p><p class=\"pa\">Sides x and 3x: 3x² = 432 → x = 12. Fence = x + x + 3x = 5x = <b>60 feet<\/b>.<\/p><h3 id=\"c25-s4\">24.4 Circles<\/h3><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Circle<\/div><p class=\"li\">Circumference = 2πr; area = πr²; diameter = 2r.<\/p><p class=\"li\">Arc length = (θ/360) × 2πr; sector area = (θ/360) × πr². Both are the <b>same fraction<\/b> of the whole.<\/p><p class=\"li\">Angle in a semicircle = 90°. The angle at the centre is twice the angle at the circumference on the same arc.<\/p><p class=\"li\">A tangent is perpendicular to the radius at the point of contact. Equal chords are equidistant from the centre.<\/p><p class=\"li\">If the radius is multiplied by k, the circumference is multiplied by k and the area by k².<\/p><\/div><p class=\"pq\">6. If the ratio of the area of a sector to the area of the circle is 3 : 5, what is the ratio of the length of the arc of the sector to the circumference? <span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021<\/span><\/p><p class=\"pa\">Both depend on the same fraction θ/360 → <b>3/5<\/b>.<\/p><p class=\"pq\">7. <span class=\"tg tg-new\">NEW<\/span> The radius of a circle is increased by 20%. By what per cent does its area increase?<\/p><p class=\"pa\">1.2² = 1.44 → <b>44%<\/b>.<\/p><h3 id=\"c25-s5\">24.5 Solids<\/h3><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Volume and surface<\/div><p class=\"li\">Cube (side a): volume a³; surface 6a²; diagonal a√3.<\/p><p class=\"li\">Cuboid: volume lwh; surface 2(lw + wh + hl); diagonal √(l² + w² + h²).<\/p><p class=\"li\">Cylinder: volume πr²h; curved surface 2πrh; total surface 2πr(r + h).<\/p><p class=\"li\">Cone: volume ⅓πr²h; curved surface πrl, slant height l = √(r² + h²).<\/p><p class=\"li\">Sphere: volume (4/3)πr³; surface 4πr².<\/p><p class=\"li\">Pyramid: volume ⅓ × base area × height.<\/p><\/div><p class=\"pq\">8. If the height of a right square pyramid is increased by 12%, by what per cent must the side of the base be increased so that the volume increases by 28%? <span class=\"tg tg-actual\">ACTUAL: Bakhrabad AM 2021, written, 5 marks<\/span><\/p><p class=\"pa\">Volume ∝ s²h. New volume: k² × 1.12 = 1.28 → k² = 1.28/1.12 = 8/7 = 1.142857 → k = 1.069 → the side must increase by about <b>6.9%<\/b>.<\/p><h3 id=\"c25-s6\">24.6 Coordinate geometry in brief<\/h3><p>Distance between (x₁, y₁) and (x₂, y₂) = √[(x₂ − x₁)² + (y₂ − y₁)²]; midpoint = ((x₁ + x₂)/2, (y₁ + y₂)/2); slope = (y₂ − y₁)/(x₂ − x₁). The line y = mx + c has slope m and y-intercept c; parallel lines have equal slopes; perpendicular lines have slopes whose product is −1.<\/p><h3 id=\"c25-s7\">24.7 Practice set<\/h3><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P1. The length of a rectangle is twice its width and its perimeter is 72 m. Find its area.<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P2. The angles of a triangle are in the ratio 2 : 3 : 4. Find the largest angle.<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P3. A ladder 13 m long reaches a window 12 m above the ground. How far is its foot from the wall?<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P4. How many tiles 25 cm × 20 cm are needed to cover a floor 5 m × 4 m?<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P5. A wheel has a diameter of 70 cm. How far does it travel in 100 revolutions? (π = 22/7)<\/p><p class=\"pq\"><span class=\"tg tg-modified\">MODIFIED: Petrobangla AM 2016 Q46<\/span> P6. A rectangle with width 5 cm has the same area as a square of perimeter 40 cm. Find the perimeter of the rectangle.<\/p><p class=\"pa\">Answers: P1: w = 12, l = 24 → 288 m² · P2: 180 × 4/9 = 80° · P3: √(169 − 144) = 5 m · P4: 200,000 ÷ 500 = 400 · P5: 220 cm × 100 = 220 m · P6: area 100 → length 20 → perimeter 50 cm.<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 24<\/div><p class=\"li\">Test the triangle inequality first. Pythagorean triples: 3-4-5, 5-12-13, 8-15-17.<\/p><p class=\"li\">Square: perimeter → side → area. Rectangle: area ÷ width = length.<\/p><p class=\"li\">Arc : circumference = sector : circle. Scale k → length × k, area × k², volume × k³.<\/p><p class=\"li\">Polygon angle sum (n − 2) × 180°.<\/p><\/div>"},{"id":"c26","no":25,"part":"PART D — MATHEMATICS","title":"Chapter 25: Sets, Counting, Probability and Analytical Reasoning","short":"Sets, Counting, Probability and Analytical Reasoning","toc":[["c26-s1","25.1 Sets"],["c26-s2","25.2 Counting: permutation and combination"],["c26-s3","25.3 Probability"],["c26-s4","25.4 Number series and coding"],["c26-s5","25.5 Analytical (logical arrangement) puzzles"],["c26-s6","25.6 Other reasoning types"],["c26-s7","25.7 Data interpretation"],["c26-s8","25.8 Practice set"]],"html":"<h3 id=\"c26-s1\">25.1 Sets<\/h3><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Two and three sets<\/div><p class=\"li\">n(A ∪ B) = n(A) + n(B) − n(A ∩ B).<\/p><p class=\"li\">Total = n(A ∪ B) + neither.<\/p><p class=\"li\">n(A ∪ B ∪ C) = n(A) + n(B) + n(C) − n(A ∩ B) − n(B ∩ C) − n(C ∩ A) + n(A ∩ B ∩ C).<\/p><\/div><p class=\"pq\">1. In a group of 15 students, 7 study Latin, 8 study French and 3 study neither. How many study both? <span class=\"tg tg-actual\">ACTUAL: Petrobangla AM 2016<\/span><\/p><p class=\"pa\">At least one = 15 − 3 = 12. Both = 7 + 8 − 12 = <b>3<\/b>.<\/p><p class=\"pq\">2. <span class=\"tg tg-new\">NEW<\/span> Of 100 employees, 60 read Bangla newspapers, 45 read English newspapers and 20 read both. How many read neither?<\/p><p class=\"pa\">100 − (60 + 45 − 20) = <b>15<\/b>.<\/p><h3 id=\"c26-s2\">25.2 Counting: permutation and combination<\/h3><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Counting<\/div><p class=\"li\">Multiplication rule: if one task can be done in m ways and another in n ways, both can be done in m × n ways.<\/p><p class=\"li\">n! = n × (n − 1) × … × 1; 0! = 1.<\/p><p class=\"li\">Permutation (order matters, বিন্যাস): ⁿPᵣ = n!/(n − r)!.<\/p><p class=\"li\">Combination (order does not matter, সমাবেশ): ⁿCᵣ = n!/[r!(n − r)!]; ⁿCᵣ = ⁿCₙ₋ᵣ.<\/p><p class=\"li\">Arrangements of n things with p alike of one kind and q of another = n!/(p! q!).<\/p><p class=\"li\">n people round a table: (n − 1)!. Handshakes among n people: ⁿC₂ = n(n − 1)/2.<\/p><\/div><p class=\"pq\">3. <span class=\"tg tg-new\">NEW<\/span> In how many ways can the letters of the word DHAKA be arranged?<\/p><p class=\"pa\">5 letters with A twice → 5!/2! = <b>60<\/b>.<\/p><p class=\"pq\">4. <span class=\"tg tg-new\">NEW<\/span> A committee of 3 is to be chosen from 5 men and 4 women so that it contains exactly 2 women. In how many ways?<\/p><p class=\"pa\">⁴C₂ × ⁵C₁ = 6 × 5 = <b>30<\/b>.<\/p><p class=\"pq\">5. <span class=\"tg tg-new\">NEW<\/span> Twelve officers shake hands with one another once. How many handshakes?<\/p><p class=\"pa\">¹²C₂ = <b>66<\/b>.<\/p><h3 id=\"c26-s3\">25.3 Probability<\/h3><div class=\"bx bx-formula\"><div class=\"bxh\">FORMULA: Probability<\/div><p class=\"li\">P(event) = favourable outcomes ÷ total equally likely outcomes; 0 ≤ P ≤ 1.<\/p><p class=\"li\">P(not A) = 1 − P(A).<\/p><p class=\"li\">P(A or B) = P(A) + P(B) − P(A and B). For independent events P(A and B) = P(A) × P(B).<\/p><p class=\"li\">A coin has 2 outcomes; a die 6; two dice 36; a pack of cards 52 (4 suits of 13; 26 red, 26 black; 12 face cards).<\/p><\/div><p class=\"pq\">6. There are 8 marbles in a box — 6 red and 2 black. If you pick 2 marbles at the same time at random, what is the probability of getting one red and one black? <span class=\"tg tg-actual\">ACTUAL: BAPEX AM 2023<\/span><\/p><p class=\"pa\">(⁶C₁ × ²C₁)/⁸C₂ = 12/28 = <b>3/7<\/b>.<\/p><p class=\"pq\">7. A password is made up of two letters followed by two single-digit numbers. If a password is assigned at random, what is the probability, rounded to the nearest hundredth, that it uses only even digits for the numbers? <span class=\"tg tg-actual\">ACTUAL: KGDCL AM 2021, written, 5 marks<\/span><\/p><p class=\"pa\">The letters do not matter. Each digit is even (0, 2, 4, 6, 8) with probability 5/10 = 1/2 → (1/2)(1/2) = <b>0.25<\/b>.<\/p><p class=\"pq\">8. <span class=\"tg tg-new\">NEW<\/span> Two dice are thrown. What is the probability that the sum is 8?<\/p><p class=\"pa\">(2,6), (3,5), (4,4), (5,3), (6,2) → <b>5/36<\/b>.<\/p><p class=\"pq\">9. <span class=\"tg tg-new\">NEW<\/span> A bag has 5 red and 3 blue balls. Two are drawn one after another without replacement. Find the probability that both are red.<\/p><p class=\"pa\">(5/8)(4/7) = <b>5/14<\/b>.<\/p><h3 id=\"c26-s4\">25.4 Number series and coding<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Pattern<\/th><th>Example<\/th><\/tr><tr><td>Constant difference<\/td><td>3, 7, 11, 15, <b>19<\/b><\/td><\/tr><tr><td>Increasing difference<\/td><td>2, 3, 5, 8, 12, <b>17<\/b> (+1, +2, +3, +4, +5)<\/td><\/tr><tr><td>Constant ratio<\/td><td>3, 6, 12, 24, <b>48<\/b><\/td><\/tr><tr><td>Squares / cubes<\/td><td>1, 4, 9, 16, <b>25<\/b>; 1, 8, 27, 64, <b>125<\/b><\/td><\/tr><tr><td>Squares ± 1<\/td><td>2, 5, 10, 17, <b>26<\/b> (n² + 1)<\/td><\/tr><tr><td>Two interleaved series<\/td><td>2, 10, 4, 20, 6, 30, <b>8<\/b><\/td><\/tr><tr><td>Sum of previous two<\/td><td>1, 1, 2, 3, 5, 8, <b>13<\/b><\/td><\/tr><tr><td>Primes<\/td><td>2, 3, 5, 7, 11, <b>13<\/b><\/td><\/tr><\/table><\/div><p>Method: write the differences; if they show no pattern, write the differences of the differences; then try ratios; then look at alternate terms.<\/p><h3 id=\"c26-s5\">25.5 Analytical (logical arrangement) puzzles<\/h3><p>One IBA paper (BAPEX 2023) carried a five-question seating puzzle, and IBA admission tests use the type regularly. The method is mechanical.<\/p><p><span class=\"tg tg-actual\">ACTUAL: BAPEX AM 2023, Q36–40<\/span> <i>In a talk show there are 7 chairs in a row, numbered 1 to 7 from left to right. Seven discussants A, B, C, D, X, Y and Z take part. A must occupy the 1st, 2nd or 3rd chair. C must sit immediately before B. D cannot sit in the 1st or last chair. X must sit in the 1st or last chair. Y must be in one of the last three chairs.<\/i><\/p><p><b>Step 1 — write the rules as symbols.<\/b> A ∈ {1, 2, 3}; \"CB\" is a block; D ∉ {1, 7}; X ∈ {1, 7}; Y ∈ {5, 6, 7}.<\/p><p><b>Step 2 — draw seven blanks and test.<\/b><\/p><p class=\"pq\">Q36. Which is an acceptable order? (A) A Z C D Y B X (B) C B A D Z Y X (C) D Z A C B X Y (D) X A Y C D B Z<\/p><p class=\"pa\">(A) C is not immediately before B. (C) D is in chair 1. (D) Y is in chair 3. (B) satisfies every rule → <b>(B)<\/b>.<\/p><p class=\"pq\">Q37. If Z, D and A occupy three consecutive chairs in that order, C must occupy —<\/p><p class=\"pa\">A must be in chair 1–3, so Z, D, A take chairs 1, 2, 3. X then takes 7, Y takes 5 or 6, and the block CB needs two adjacent chairs from 4, 5, 6 → C in 4, B in 5, Y in 6. C is in the <b>4th<\/b> chair.<\/p><p class=\"pq\">Q38. If C occupies the 1st chair, who could occupy the 4th chair?<\/p><p class=\"pa\">C 1, B 2, so A is 3 and X is 7. Chairs 4, 5, 6 go to D, Z, Y with Y in 5 or 6 → chair 4 is D or Z; of the options given, <b>D<\/b>.<\/p><p class=\"pq\">Q39. If Y occupies the 6th chair, C could occupy any chair except —<\/p><p class=\"pa\">C in the 5th chair would put B in the 6th, which Y holds → <b>5th<\/b>.<\/p><p class=\"pq\">Q40. If X occupies the last chair and A the 2nd, who must occupy chair 1?<\/p><p class=\"pa\">Chair 1 cannot be D (rule), Y (must be 5–7), B (C must be before B) or C (B would need chair 2, taken by A) → <b>Z<\/b>.<\/p><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: Three rules for arrangement puzzles<\/div><p class=\"li\">Fix the most restricted people first (here X, then A, then the CB block).<\/p><p class=\"li\">For \"acceptable order\" questions, take one rule at a time and strike out every option that breaks it.<\/p><p class=\"li\">\"Must\" means true in every valid arrangement; \"could\" means true in at least one. Do not confuse them.<\/p><\/div><h3 id=\"c26-s6\">25.6 Other reasoning types<\/h3><ul><li><b>Blood relations:<\/b> draw a small family tree; mark generations level by level. \"My father's only son's daughter\" = my daughter (if I am male).<\/li><li><b>Directions:<\/b> draw the path; right turns are clockwise. Use Pythagoras for the straight-line distance.<\/li><li><b>Syllogism:<\/b> draw circles. \"All A are B; all B are C → all A are C\" is valid; \"Some A are B; some B are C → some A are C\" is <b>not<\/b> valid.<\/li><li><b>Coding:<\/b> find the shift. If CAT is coded DBU (+1 each), DOG is EPH.<\/li><li><b>Clock:<\/b> the hour hand moves 0.5° a minute and the minute hand 6°; the angle at H:M is |30H − 5.5M|. At 3:30 the angle is |90 − 165| = 75°.<\/li><li><b>Calendar:<\/b> an ordinary year has 1 odd day and a leap year 2; the same date moves forward by that many weekdays each year.<\/li><\/ul><h3 id=\"c26-s7\">25.7 Data interpretation<\/h3><p>Tables and charts did not appear in the eleven papers, but the skills are those of Chapter 20.<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> The gas sales of a company (in crore taka) were: power 240, industry 300, domestic 120, fertiliser 90, others 50. (i) What percentage of sales is industry? (ii) What is the ratio of power to domestic? (iii) If domestic sales rise by 25% and the rest stay the same, what is the new total?<\/p><p class=\"pa\">Total 800. (i) 300/800 = <b>37.5%<\/b> (ii) <b>2 : 1<\/b> (iii) 800 + 30 = <b>830<\/b>.<\/p><h3 id=\"c26-s8\">25.8 Practice set<\/h3><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P1. In a class of 50, 30 play cricket, 25 play football and 10 play both. How many play neither?<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P2. How many three-digit numbers can be formed from 1, 2, 3, 4, 5 without repetition?<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P3. A card is drawn from a pack of 52. What is the probability that it is a king or a heart?<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P4. Find the missing term: 4, 9, 19, 39, ?<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> P5. A man walks 6 km north, then 8 km east. How far is he from the start?<\/p><p class=\"pq\"><span class=\"tg tg-modified\">MODIFIED: BAPEX AM 2023 Q31<\/span> P6. A box has 5 white and 3 black balls. Two are drawn together. Find the probability that they are of different colours.<\/p><p class=\"pa\">Answers: P1: 50 − 45 = 5 · P2: 5 × 4 × 3 = 60 · P3: (4 + 13 − 1)/52 = 4/13 · P4: ×2 + 1 → 79 · P5: 10 km · P6: 15/28.<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 25<\/div><p class=\"li\">Both = A + B − (total − neither).<\/p><p class=\"li\">Order matters → permutation; choosing a group → combination.<\/p><p class=\"li\">Probability = favourable ÷ total; \"both\" → multiply; \"at least one\" → 1 − none.<\/p><p class=\"li\">Puzzles: symbols, blanks, most restricted first; must ≠ could.<\/p><\/div>"},{"id":"c27","no":26,"part":"PART D — MATHEMATICS","title":"Chapter 26: Written Mathematics and the Formula Sheet","short":"Written Mathematics and the Formula Sheet","toc":[["c27-s1","26.1 What the written questions look like"],["c27-s2","26.2 How to write a five-mark solution"],["c27-s3","26.3 Six more written-style problems with full solutions"],["c27-s4","26.4 Master formula sheet"]],"html":"<h3 id=\"c27-s1\">26.1 What the written questions look like<\/h3><p>Ten of the 25 mathematics marks were written in the 2024 Petrobangla paper (\"Problem Solving: Show your calculations/steps\", 5 × 2 = 10). Company papers gave one to three written problems of 5 marks. All of them are solved in Chapters 19–25:<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Problem<\/th><th>Paper<\/th><th>Solved in<\/th><\/tr><tr><td>Paint mixture: grams of red in 10 g of brown<\/td><td>Petrobangla 2024<\/td><td>21.3, Q11<\/td><\/tr><tr><td>Tour of $360 extended by 4 days<\/td><td>Petrobangla 2024<\/td><td>23.3, Q15<\/td><\/tr><tr><td>Stamps passed from Rahim to Karim to Fatima<\/td><td>PGCL (Admin) 2021<\/td><td>19.6, Q14<\/td><\/tr><tr><td>Mangoes: least x for a 10% profit<\/td><td>Bakhrabad 2021<\/td><td>20.2, Q21<\/td><\/tr><tr><td>Train passing a walking man<\/td><td>Bakhrabad 2021<\/td><td>22.3, Q13<\/td><\/tr><tr><td>Pyramid: height +12%, volume +28%<\/td><td>Bakhrabad 2021<\/td><td>24.5, Q8<\/td><\/tr><tr><td>Password with even digits (probability)<\/td><td>KGDCL 2021<\/td><td>25.3, Q7<\/td><\/tr><tr><td>Average speed in an 800 m race<\/td><td>KGDCL 2021<\/td><td>22.2, Q11<\/td><\/tr><\/table><\/div><h3 id=\"c27-s2\">26.2 How to write a five-mark solution<\/h3><p>A written answer is marked for method. Use this layout every time:<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Step<\/th><th>What to write<\/th><th>Example (the tour problem)<\/th><\/tr><tr><td>1<\/td><td>Define the unknown in words<\/td><td>Let the original length of the tour be d days.<\/td><\/tr><tr><td>2<\/td><td>Translate the conditions<\/td><td>Daily expense originally = 360/d; after extension = 360/(d + 4).<\/td><\/tr><tr><td>3<\/td><td>Form the equation, citing the condition<\/td><td>By the question, 360/d − 360/(d + 4) = 3.<\/td><\/tr><tr><td>4<\/td><td>Solve, one operation per line<\/td><td>360(d + 4) − 360d = 3d(d + 4) → 1440 = 3d² + 12d → d² + 4d − 480 = 0 → (d + 24)(d − 20) = 0.<\/td><\/tr><tr><td>5<\/td><td>Reject impossible values, with a reason<\/td><td>d = −24 is not acceptable as days cannot be negative; so d = 20.<\/td><\/tr><tr><td>6<\/td><td>State the answer with its unit, and check<\/td><td>The tour was planned for 20 days. Check: 360/20 − 360/24 = 18 − 15 = 3.<\/td><\/tr><\/table><\/div><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: Presentation that earns marks<\/div><p class=\"li\">Write \"Solution:\" and number the lines of working down the page; do not write side by side.<\/p><p class=\"li\">Keep the unit (Tk, km/h, days, grams) in the final line and underline or box the answer.<\/p><p class=\"li\">If you cannot finish, still write the definition and the equation: they usually carry two of the five marks.<\/p><p class=\"li\">The question may be answered in English or Bangla; follow the language of the question unless told otherwise.<\/p><\/div><h3 id=\"c27-s3\">26.3 Six more written-style problems with full solutions<\/h3><p class=\"pq\">1. <span class=\"tg tg-new\">NEW<\/span> A trader mixes two kinds of rice costing Tk 54 and Tk 66 per kg and sells the mixture at Tk 69 per kg, gaining 15%. In what ratio did he mix them?<\/p><p class=\"pa\">Cost price of the mixture = 69 × 100/115 = Tk 60 per kg. By alligation, cheaper : dearer = (66 − 60) : (60 − 54) = 6 : 6 = 1 : 1. <b>Answer: 1 : 1.<\/b><\/p><p class=\"pq\">2. <span class=\"tg tg-new\">NEW<\/span> A and B can finish a piece of work in 12 days, B and C in 15 days, and C and A in 20 days. In how many days can they finish it together, and A alone?<\/p><p class=\"pa\">Adding: 2(A + B + C) = 1/12 + 1/15 + 1/20 = (5 + 4 + 3)/60 = 1/5 → A + B + C = 1/10 → together <b>10 days<\/b>. A = 1/10 − 1/15 = 1/30 → A alone <b>30 days<\/b>.<\/p><p class=\"pq\">3. <span class=\"tg tg-new\">NEW<\/span> A sum of money becomes Tk 6,690 in 3 years and Tk 10,035 in 6 years at compound interest. Find the sum.<\/p><p class=\"pa\">(1 + r/100)³ = 10,035/6,690 = 1.5. P × 1.5 = 6,690 → P = <b>Tk 4,460<\/b>.<\/p><p class=\"pq\">4. <span class=\"tg tg-new\">NEW<\/span> Two trains 120 m and 180 m long run in opposite directions on parallel tracks at 42 km/h and 30 km/h. How long do they take to cross each other?<\/p><p class=\"pa\">Relative speed = 72 km/h = 20 m/s; distance = 300 m → <b>15 seconds<\/b>.<\/p><p class=\"pq\">5. <span class=\"tg tg-new\">NEW<\/span> A rectangular field is 20 m longer than it is wide, and its area is 2,400 m². Find the cost of fencing it at Tk 150 per metre.<\/p><p class=\"pa\">w(w + 20) = 2,400 → w² + 20w − 2,400 = 0 → (w − 40)(w + 60) = 0 → w = 40, l = 60. Perimeter = 200 m → <b>Tk 30,000<\/b>.<\/p><p class=\"pq\">6. <span class=\"tg tg-new\">NEW<\/span> In an examination 70% of the candidates passed in English, 65% in Mathematics and 27% failed in both. If 248 candidates passed in both, find the total number of candidates.<\/p><p class=\"pa\">Passed in at least one = 73%. Passed in both = 70 + 65 − 73 = 62% = 248 → total = <b>400<\/b>.<\/p><h3 id=\"c27-s4\">26.4 Master formula sheet<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Formulas<\/th><\/tr><tr><td>Percentage<\/td><td>x% of y = xy/100; change % = change/original × 100; successive: a + b + ab/100<\/td><\/tr><tr><td>Profit<\/td><td>SP = CP(100 + p)/100; CP = SP × 100/(100 + p); SP = MP(100 − d)/100<\/td><\/tr><tr><td>Interest<\/td><td>I = Pnr/100; A = P(1 + r/100)ⁿ; CI − SI (2 yrs) = P(r/100)²<\/td><\/tr><tr><td>Ratio<\/td><td>a : b and b : c → make b equal; partnership = capital × time<\/td><\/tr><tr><td>Alligation<\/td><td>cheaper : dearer = (d − m) : (m − c)<\/td><\/tr><tr><td>Average<\/td><td>sum = average × number; middle term of consecutive numbers<\/td><\/tr><tr><td>Work<\/td><td>1/a + 1/b; together ab/(a + b); M₁D₁ = M₂D₂<\/td><\/tr><tr><td>Speed<\/td><td>d = st; km/h × 5/18 = m/s; average = total d ÷ total t; 2uv/(u + v)<\/td><\/tr><tr><td>Trains, boats<\/td><td>relative speed u ± v; downstream b + s, upstream b − s<\/td><\/tr><tr><td>Numbers<\/td><td>n = dq + r; HCF × LCM = product; 1 + 2 + … + n = n(n + 1)/2<\/td><\/tr><tr><td>Algebra<\/td><td>(a ± b)² = a² ± 2ab + b²; a² − b² = (a + b)(a − b); a³ ± b³ = (a ± b)(a² ∓ ab + b²)<\/td><\/tr><tr><td>Quadratic<\/td><td>x = [−b ± √(b² − 4ac)]/2a; sum −b/a; product c/a; min value c − b²/4a<\/td><\/tr><tr><td>Indices, logs<\/td><td>aᵐaⁿ = aᵐ⁺ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁰ = 1; log MN = log M + log N<\/td><\/tr><tr><td>Progressions<\/td><td>AP: a + (n − 1)d; Sₙ = n/2 [2a + (n − 1)d]; GP: arⁿ⁻¹; Sₙ = a(rⁿ − 1)/(r − 1)<\/td><\/tr><tr><td>Triangle<\/td><td>½bh; √[s(s − a)(s − b)(s − c)]; (√3/4)a²; a² + b² = c²<\/td><\/tr><tr><td>Quadrilaterals<\/td><td>square a², 4a; rectangle lw, 2(l + w); rhombus ½d₁d₂; trapezium ½(a + b)h<\/td><\/tr><tr><td>Circle<\/td><td>2πr; πr²; arc (θ/360)2πr; sector (θ/360)πr²<\/td><\/tr><tr><td>Solids<\/td><td>cube a³; cuboid lwh; cylinder πr²h; cone ⅓πr²h; sphere (4/3)πr³<\/td><\/tr><tr><td>Sets<\/td><td>n(A ∪ B) = n(A) + n(B) − n(A ∩ B)<\/td><\/tr><tr><td>Counting<\/td><td>ⁿPᵣ = n!/(n − r)!; ⁿCᵣ = n!/[r!(n − r)!]<\/td><\/tr><tr><td>Probability<\/td><td>favourable ÷ total; P(A') = 1 − P(A); independent: multiply<\/td><\/tr><\/table><\/div><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 26<\/div><p class=\"li\">Written mathematics is marked for method: define, translate, solve, reject, answer with unit, check.<\/p><p class=\"li\">Expect mixture, quadratic word problems, trains, work, percentage and simple probability.<\/p><p class=\"li\">Read the formula sheet the night before; it fits on one page on purpose.<\/p><\/div>"},{"id":"c28","no":27,"part":"PART E — GENERAL KNOWLEDGE","title":"Chapter 27: Bangladesh — History and the Liberation War","short":"Bangladesh — History and the Liberation War","toc":[["c28-s1","27.1 How this chapter is arranged"],["c28-s2","27.2 Ancient and medieval Bengal"],["c28-s3","27.3 British rule"],["c28-s4","27.4 The Pakistan period, 1947–1971"],["c28-s5","27.5 The Liberation War, 1971"],["c28-s6","27.6 Bangladesh after independence — key dates"],["c28-s7","27.7 Culture, heritage and \"firsts\""]],"html":"<h3 id=\"c28-s1\">27.1 How this chapter is arranged<\/h3><p>History questions in the papers are single facts: a date, a name, a place. The chapter is therefore a set of timelines and tables. Items already asked are marked.<\/p><h3 id=\"c28-s2\">27.2 Ancient and medieval Bengal<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Period / item<\/th><th>Facts<\/th><\/tr><tr><td>Ancient janapadas<\/td><td>Pundra (Bogura — oldest; capital Pundranagar, now Mahasthangarh), Vanga (Dhaka–Faridpur–Barishal), Samatata (Cumilla–Noakhali), Harikela (Sylhet–Chattogram), Varendra (Rajshahi), Gauda, Radha, <b>Chandradwip (Barishal)<\/b> — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021: ancient name of Barisal — Chandradwip<\/span><\/td><\/tr><tr><td>Maurya and Gupta<\/td><td>Bengal under Ashoka (Mahasthan Brahmi inscription); Gupta \"golden age\"<\/td><\/tr><tr><td>Shashanka<\/td><td>first independent king of Bengal (c. 606 AD); capital Karnasuvarna<\/td><\/tr><tr><td>Matsyanyaya<\/td><td>a century of anarchy after Shashanka (7th–8th century)<\/td><\/tr><tr><td>Pala dynasty (c. 750–1160)<\/td><td>founder Gopala (elected); Dharmapala built Somapura Mahavihara (Paharpur, Naogaon); Buddhist; longest-ruling dynasty of Bengal<\/td><\/tr><tr><td>Sena dynasty<\/td><td>Vijayasena, Ballalasena (Kulinism), Lakshmanasena (last)<\/td><\/tr><tr><td>Muslim conquest<\/td><td>Ikhtiyar Uddin Muhammad Bakhtiyar Khalji, 1204<\/td><\/tr><tr><td>Independent Sultanate (1338–1538)<\/td><td>Fakhruddin Mubarak Shah (first independent sultan, Sonargaon); Shamsuddin Ilyas Shah (\"Shah-i-Bangalah\"); Alauddin Husain Shah (golden age of the Sultanate); Ibn Battuta visited in 1346<\/td><\/tr><tr><td>Bara Bhuiyans<\/td><td>Isa Khan of Sonargaon resisted the Mughals; <b>Panam City, Sonargaon, Narayanganj<\/b> — <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><\/tr><tr><td>Mughal Bengal<\/td><td>Islam Khan made Dhaka the capital in 1610 (Jahangirnagar); Shaista Khan (rice at 8 maunds a taka; conquered Chattogram 1666); Lalbagh Fort begun 1678 by Prince Azam<\/td><\/tr><tr><td>Nawabs<\/td><td>Murshid Quli Khan (first independent nawab; capital Murshidabad); Alivardi Khan; Siraj-ud-Daulah<\/td><\/tr><tr><td>Old names<\/td><td>Dhaka — Jahangirnagar; Chattogram — Islamabad, Porto Grande; Sonargaon — Subarnagram; Mahasthangarh — Pundranagar; Mainamati — Rohitagiri; Sylhet — Jalalabad, Srihatta; Cumilla — Tripura; Jashore — Khalifatabad; Khulna — Jahanabad; Noakhali — Bhulua; Faridpur — Fatehabad; Barishal — Chandradwip, Bakla; Rajshahi — Rampur Boalia; Mymensingh — Nasirabad<\/td><\/tr><\/table><\/div><h3 id=\"c28-s3\">27.3 British rule<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Year<\/th><th>Event<\/th><\/tr><tr><td>1757<\/td><td>Battle of Plassey (23 June): Siraj-ud-Daulah defeated by Robert Clive<\/td><\/tr><tr><td>1764<\/td><td>Battle of Buxar<\/td><\/tr><tr><td>1765<\/td><td>East India Company obtains the Diwani of Bengal, Bihar and Orissa; dual government (abolished 1772 by Warren Hastings)<\/td><\/tr><tr><td>1770<\/td><td>Great Famine — \"ছিয়াত্তরের মন্বন্তর\" (Bengali year 1176)<\/td><\/tr><tr><td>1773<\/td><td>Regulating Act; <b>Warren Hastings<\/b> first Governor-General of Bengal — <span class=\"tg tg-actual\">ACTUAL: Bakhrabad 2021<\/span><\/td><\/tr><tr><td>1793<\/td><td>Permanent Settlement — Lord Cornwallis<\/td><\/tr><tr><td>1829<\/td><td>Abolition of Sati — Lord William Bentinck (first Governor-General of India, 1833)<\/td><\/tr><tr><td>1831<\/td><td>Titumir's bamboo fort at Narikelbaria<\/td><\/tr><tr><td>1855–56<\/td><td>Santal rebellion; Widow Remarriage Act 1856 (Lord Dalhousie; Vidyasagar's movement)<\/td><\/tr><tr><td>1857<\/td><td>Sepoy Mutiny — first war of independence<\/td><\/tr><tr><td>1858<\/td><td>Company rule ends; <b>Lord Canning<\/b> first Viceroy — <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021, written<\/span><\/td><\/tr><tr><td>1859–60<\/td><td>Indigo revolt<\/td><\/tr><tr><td>1885<\/td><td>Indian National Congress founded (A. O. Hume)<\/td><\/tr><tr><td>1905<\/td><td>Partition of Bengal (16 October) — Lord Curzon; capital of East Bengal and Assam: Dhaka<\/td><\/tr><tr><td>1906<\/td><td>All-India Muslim League founded in Dhaka (Nawab Salimullah)<\/td><\/tr><tr><td>1911<\/td><td>Partition annulled (Lord Hardinge); capital moved from Calcutta to Delhi<\/td><\/tr><tr><td>1919<\/td><td>Jallianwala Bagh massacre; Rabindranath renounces his knighthood<\/td><\/tr><tr><td>1921<\/td><td>University of Dhaka established<\/td><\/tr><tr><td>1930<\/td><td>Chattogram armoury raid — Masterda Surya Sen; Pritilata Waddedar (1932)<\/td><\/tr><tr><td>1937<\/td><td>A. K. Fazlul Huq — first Prime Minister of undivided Bengal<\/td><\/tr><tr><td>1940<\/td><td>Lahore Resolution (23 March), moved by A. K. Fazlul Huq<\/td><\/tr><tr><td>1943<\/td><td>Bengal famine — \"পঞ্চাশের মন্বন্তর\" (Bengali year 1350)<\/td><\/tr><tr><td>1947<\/td><td>Partition of India: Pakistan 14 August, India 15 August; Radcliffe boundary<\/td><\/tr><\/table><\/div><h3 id=\"c28-s4\">27.4 The Pakistan period, 1947–1971<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Date<\/th><th>Event<\/th><\/tr><tr><td>1948<\/td><td>21 March: Jinnah declares at the Racecourse that \"Urdu and Urdu alone\" shall be the state language; protests follow<\/td><\/tr><tr><td>23 June 1949<\/td><td>East Pakistan Awami Muslim League founded (Rose Garden, Dhaka)<\/td><\/tr><tr><td><b>21 February 1952<\/b><\/td><td>Language Movement: Salam, Barkat, Rafiq, Jabbar, Shafiur and others martyred (8 Falgun 1358). First Shaheed Minar built 23 February 1952<\/td><\/tr><tr><td>1954<\/td><td>United Front (Jukto Front) wins the provincial election on its 21-point programme; leaders: Fazlul Huq, Bhasani, Suhrawardy<\/td><\/tr><tr><td>1956<\/td><td>First constitution of Pakistan; Bangla recognised as a state language<\/td><\/tr><tr><td>1958<\/td><td>Martial law — Ayub Khan<\/td><\/tr><tr><td>1962<\/td><td>Education movement against the Sharif Commission report (17 September — Education Day)<\/td><\/tr><tr><td><b>1966<\/b><\/td><td>Six-Point Programme announced in Lahore, 5–6 February, by Sheikh Mujibur Rahman — \"the charter of freedom of the Bengalis\"; 7 June is Six-Point Day<\/td><\/tr><tr><td>1968<\/td><td>Agartala Conspiracy Case (\"State vs Sheikh Mujibur Rahman and others\"; 35 accused)<\/td><\/tr><tr><td><b>1969<\/b><\/td><td>Mass uprising: Asad killed 20 January, Sergeant Zahurul Huq 15 February, Dr Shamsuzzoha 18 February; case withdrawn 22 February; title \"Bangabandhu\" conferred 23 February (by Tofail Ahmed); Ayub resigns 25 March<\/td><\/tr><tr><td>1970<\/td><td>12 November cyclone; general election 7 December — Awami League wins 160 of 162 general seats of East Pakistan in the National Assembly (167 of 169 with reserved seats)<\/td><\/tr><tr><td>1971<\/td><td>7 March: historic speech at the Racecourse Maidan (UNESCO Memory of the World, 30 October 2017)<\/td><\/tr><\/table><\/div><div class=\"bx bx-mem\"><div class=\"bxh\">MEMORY AID: The road to 1971 in six numbers<\/div><p class=\"\"><b>52 – 54 – 62 – 66 – 69 – 70<\/b>: Language Movement, United Front election, education movement, Six Points, mass uprising, general election. Published guidance for this examination names exactly this sequence.<\/p><\/div><h3 id=\"c28-s5\">27.5 The Liberation War, 1971<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Fact<\/th><\/tr><tr><td><b>Operation Searchlight<\/b><\/td><td>the Pakistan army's crackdown on the night of 25 March 1971 — <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><\/tr><tr><td>Declaration of independence<\/td><td>26 March 1971; Independence and National Day<\/td><\/tr><tr><td>Mujibnagar Government<\/td><td>formed 10 April; sworn in 17 April 1971 at Baidyanathtala, Meherpur (renamed <b>Mujibnagar<\/b> — \"first temporary capital\", <span class=\"tg tg-actual\">ACTUAL: KGDCL 2021<\/span>)<\/td><\/tr><tr><td>Its members<\/td><td>President Sheikh Mujibur Rahman; Acting President Syed Nazrul Islam; Prime Minister Tajuddin Ahmad; Finance M. Mansur Ali; Home A. H. M. Qamaruzzaman; Foreign Khondaker Mostaq Ahmad; Commander-in-Chief General M. A. G. Osmani<\/td><\/tr><tr><td>Sectors<\/td><td>11 sectors; three brigade forces — Z (Ziaur Rahman), S (K. M. Shafiullah), K (Khaled Mosharraf). Sector 10 (naval) had no regular commander; Sector 11 included Mymensingh–Tangail<\/td><\/tr><tr><td>Operation Jackpot<\/td><td>naval commando attacks on ports, 15–16 August 1971<\/td><\/tr><tr><td>Joint Command<\/td><td>formed 21 November 1971 (Armed Forces Day); India recognises Bangladesh 6 December (Bhutan is recorded as the first to recognise)<\/td><\/tr><tr><td>Martyred Intellectuals Day<\/td><td>14 December<\/td><\/tr><tr><td><b>Victory<\/b><\/td><td>16 December 1971: Lt Gen. A. A. K. Niazi surrenders to Lt Gen. Jagjit Singh Aurora at the Racecourse Maidan (Suhrawardy Udyan); Group Captain A. K. Khandker represents Bangladesh<\/td><\/tr><tr><td>Foreign friends<\/td><td>Concert for Bangladesh (George Harrison, Ravi Shankar; New York, 1 August 1971); André Malraux; W. A. S. Ouderland (Bir Protik, the only foreign recipient); \"Stop Genocide\" (Zahir Raihan)<\/td><\/tr><tr><td>Homecoming<\/td><td>Bangabandhu returns 10 January 1972<\/td><\/tr><\/table><\/div><h4>Gallantry awards (announced 15 December 1973)<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Award (in order)<\/th><th>Number<\/th><th>Note<\/th><\/tr><tr><td>Bir Sreshtha (বীরশ্রেষ্ঠ)<\/td><td>7<\/td><td>highest; all posthumous<\/td><\/tr><tr><td>Bir Uttam (বীর উত্তম)<\/td><td>68 (69 with one later award)<\/td><td>second<\/td><\/tr><tr><td><b>Bir Bikram (বীর বিক্রম)<\/b><\/td><td>175<\/td><td><b>third highest<\/b> — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td>Bir Protik (বীর প্রতীক)<\/td><td>426<\/td><td>fourth; two women: Taramon Bibi, Dr Sitara Begum<\/td><\/tr><\/table><\/div><p>The seven Bir Sreshthas: Captain Mohiuddin Jahangir (army); Sepoy Hamidur Rahman (army; the youngest); Sepoy Mostafa Kamal (army); Engine Room Artificer Ruhul Amin (navy); Flight Lieutenant Matiur Rahman (air force); Lance Naik Munshi Abdur Rouf (EPR); Lance Naik Nur Mohammad Sheikh (EPR).<\/p><h3 id=\"c28-s6\">27.6 Bangladesh after independence — key dates<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Date<\/th><th>Event<\/th><\/tr><tr><td>4 November 1972<\/td><td>Constitution adopted; in force 16 December 1972<\/td><\/tr><tr><td>7 March 1973<\/td><td>first parliamentary election<\/td><\/tr><tr><td>17 September 1974<\/td><td>Bangladesh becomes the <b>136th<\/b> member of the United Nations — <span class=\"tg tg-actual\">ACTUAL: PB 2011<\/span>; Bangabandhu addresses the General Assembly in Bangla on 25 September 1974<\/td><\/tr><tr><td>9 August 1975<\/td><td>five gas fields bought from Shell Oil (National Energy Security Day)<\/td><\/tr><tr><td>15 August 1975<\/td><td>assassination of Bangabandhu and most of his family<\/td><\/tr><tr><td>1982–1990<\/td><td>H. M. Ershad's rule; mass uprising and resignation 6 December 1990<\/td><\/tr><tr><td>1991<\/td><td>return to parliamentary government (12th Amendment)<\/td><\/tr><tr><td>17 November 1999<\/td><td>UNESCO declares 21 February International Mother Language Day; first observed worldwide <b>2000<\/b> — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td>2 December 1997<\/td><td>Chittagong Hill Tracts Peace Accord<\/td><\/tr><tr><td>12 May 2018<\/td><td>Bangabandhu Satellite-1 launched<\/td><\/tr><tr><td>25 June 2022<\/td><td>Padma Bridge opened (6.15 km)<\/td><\/tr><tr><td>28 December 2022<\/td><td>Dhaka Metro Rail (MRT Line-6) opened<\/td><\/tr><tr><td>July–August 2024<\/td><td>Student-led mass uprising; the Awami League government falls on 5 August 2024; an interim government headed by Professor Muhammad Yunus takes office on 8 August 2024<\/td><\/tr><tr><td>February 2026<\/td><td>13th parliamentary election and a referendum on the July National Charter; the BNP wins; the new government takes office on 17 February 2026 (see Chapter 37)<\/td><\/tr><\/table><\/div><h3 id=\"c28-s7\">27.7 Culture, heritage and \"firsts\"<\/h3><ul><li><b>UNESCO World Heritage Sites:<\/b> Historic Mosque City of Bagerhat (1985), Ruins of the Buddhist Vihara at Paharpur (1985), the Sundarbans (1997).<\/li><li><b>UNESCO intangible heritage:<\/b> Baul songs, Jamdani weaving, Mangal Shobhajatra, Shital Pati weaving, rickshaws and rickshaw painting of Dhaka.<\/li><li><b>Ethnic communities:<\/b> the Chakma are the largest — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>; their main festival is <b>Biju<\/b> — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>. Marma: Sangrai; Tripura: Baisu (together \"Baisabi\"); Garo: Wangala; Santal: Sohrai; Manipuri: Rasa Lila.<\/li><li><b>Geographical Indication (GI):<\/b> Jamdani was the first GI product of Bangladesh (2016), followed by hilsa, Khirsapat mango, Dhakai muslin and many others. In early 2024 India registered <b>Tangail saree<\/b> as its own GI product — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>; Bangladesh then registered Tangail saree as its GI as well.<\/li><li><b>Banglapedia<\/b> is published by the Asiatic Society of Bangladesh — <span class=\"tg tg-repeated\">REPEATED: PB 2011, PGCL 2021<\/span>.<\/li><li>First Test captain: Naimur Rahman Durjoy (2000, v India) — <span class=\"tg tg-actual\">ACTUAL: GTCL 2021: the options named others, so \"None of these\"<\/span>. First grandmaster: <b>Niaz Murshed<\/b> (1987) — <span class=\"tg tg-actual\">ACTUAL: GTCL 2021<\/span>. Bangladesh hosted the Under-19 World Cup in 2016 — <span class=\"tg tg-actual\">ACTUAL: PB 2016<\/span>.<\/li><li>Keane Bridge is in <b>Sylhet<\/b> (on the Surma) — <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span>. Rabindra University is at <b>Shahjadpur, Sirajganj<\/b> — <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span>. Bhasan Char is in <b>Noakhali<\/b> (Hatiya) — <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span>. The Cox's Bazar–Teknaf Marine Drive (80 km) is called the world's longest marine drive — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span>.<\/li><li>National Memorial, Savar — architect Syed Mainul Hossain; National Parliament House — Louis I. Kahn; Central Shaheed Minar — Hamidur Rahman; Aparajeyo Bangla — Syed Abdullah Khalid; Shabash Bangladesh (Rajshahi University) — Nitun Kundu.<\/li><\/ul><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 27<\/div><p class=\"li\">1757 Plassey; 1793 Permanent Settlement; 1905 Partition; 1911 annulled; 1940 Lahore Resolution.<\/p><p class=\"li\">52–54–62–66–69–70–71.<\/p><p class=\"li\">Operation Searchlight 25 March; Mujibnagar government 10/17 April; 11 sectors; victory 16 December.<\/p><p class=\"li\">Bir Sreshtha 7, Bir Uttam 68, Bir Bikram 175 (third), Bir Protik 426.<\/p><p class=\"li\">UN membership: 136th, 17 September 1974. Mother Language Day observed from 2000.<\/p><p class=\"li\">Chakma — Biju; Garo — Wangala; Marma — Sangrai.<\/p><\/div>"},{"id":"c29","no":28,"part":"PART E — GENERAL KNOWLEDGE","title":"Chapter 28: The Constitution and Government of Bangladesh","short":"The Constitution and Government of Bangladesh","toc":[["c29-s1","28.1 Making of the Constitution"],["c29-s2","28.2 The eleven Parts"],["c29-s3","28.3 Articles worth memorising"],["c29-s4","28.4 The executive"],["c29-s5","28.5 Parliament (Jatiya Sangsad)"],["c29-s6","28.6 The judiciary"],["c29-s7","28.7 Amendments"],["c29-s8","28.8 National symbols"],["c29-s9","28.9 Civil service"]],"html":"<div class=\"bx bx-warn\"><div class=\"bxh\">CAUTION: Read this first<\/div><p class=\"\">The Constitution is in a period of change. After the July 2024 uprising a Constitution Reform Commission reported, a \"July National Charter\" was signed by political parties, and a referendum on it was held with the February 2026 election. Its proposals (for example a two-chamber parliament with a 100-member upper house) were <b>still being implemented and disputed<\/b> when this edition was prepared. This chapter states the Constitution <b>as its text has long stood<\/b>, which is what examination questions have tested, and flags the points under change. Check the news before the examination.<\/p><\/div><h3 id=\"c29-s1\">28.1 Making of the Constitution<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Fact<\/th><\/tr><tr><td>Constitution Drafting Committee<\/td><td>formed 11 April 1972; 34 members; chairman Dr Kamal Hossain; only woman member Razia Banu<\/td><\/tr><tr><td>Draft placed<\/td><td>12 October 1972<\/td><\/tr><tr><td>Adopted by the Constituent Assembly<\/td><td>4 November 1972 (Constitution Day)<\/td><\/tr><tr><td>Came into force<\/td><td>16 December 1972<\/td><\/tr><tr><td>Form<\/td><td>written; rigid (two-thirds majority to amend); unitary; parliamentary<\/td><\/tr><tr><td>Structure<\/td><td>Preamble, 11 Parts, 153 Articles, 7 Schedules<\/td><\/tr><tr><td>Handwritten original<\/td><td>calligraphy by A. K. M. Abdur Rouf; decoration supervised by Shilpacharya Zainul Abedin<\/td><\/tr><tr><td>Languages<\/td><td>Bangla and English; the Bangla text prevails in case of conflict (Article 153)<\/td><\/tr><\/table><\/div><h3 id=\"c29-s2\">28.2 The eleven Parts<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Part<\/th><th>Subject<\/th><th>Articles<\/th><\/tr><tr><td>I<\/td><td>The Republic<\/td><td>1–7<\/td><\/tr><tr><td>II<\/td><td>Fundamental Principles of State Policy<\/td><td>8–25<\/td><\/tr><tr><td>III<\/td><td>Fundamental Rights<\/td><td>26–47A<\/td><\/tr><tr><td>IV<\/td><td>The Executive<\/td><td>48–64<\/td><\/tr><tr><td>V<\/td><td>The Legislature<\/td><td>65–93<\/td><\/tr><tr><td>VI<\/td><td>The Judiciary<\/td><td>94–117<\/td><\/tr><tr><td>VII<\/td><td>Elections<\/td><td>118–126<\/td><\/tr><tr><td>VIII<\/td><td>Comptroller and Auditor-General<\/td><td>127–132<\/td><\/tr><tr><td>IX<\/td><td>The Services of Bangladesh (incl. Public Service Commissions)<\/td><td>133–141<\/td><\/tr><tr><td>IXA<\/td><td>Emergency Provisions<\/td><td>141A–141C<\/td><\/tr><tr><td>X<\/td><td>Amendment of the Constitution<\/td><td>142<\/td><\/tr><tr><td>XI<\/td><td>Miscellaneous<\/td><td>143–153<\/td><\/tr><\/table><\/div><div class=\"bx bx-mem\"><div class=\"bxh\">MEMORY AID: Order of the Parts<\/div><p class=\"\">\"<b>প্র<\/b>-<b>মূ<\/b>-<b>মৌ<\/b>-<b>নি<\/b>-<b>আ<\/b>-<b>বি<\/b>-<b>নি<\/b>-<b>ম<\/b>-<b>ক<\/b>-<b>সং<\/b>-<b>বি<\/b>\": প্রজাতন্ত্র, মূলনীতি, মৌলিক অধিকার, নির্বাহী, আইনসভা, বিচার, নির্বাচন, মহা হিসাব-নিরীক্ষক, কর্মবিভাগ, সংশোধন, বিবিধ।<\/p><\/div><h3 id=\"c29-s3\">28.3 Articles worth memorising<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Article<\/th><th>Provision<\/th><\/tr><tr><td>1<\/td><td>Bangladesh is a unitary, independent, sovereign Republic<\/td><\/tr><tr><td>2A<\/td><td>The state religion<\/td><\/tr><tr><td>3<\/td><td>The state language is Bangla<\/td><\/tr><tr><td>4<\/td><td>National anthem, flag and emblem<\/td><\/tr><tr><td>5<\/td><td>The capital is Dhaka<\/td><\/tr><tr><td>6<\/td><td>Citizenship<\/td><\/tr><tr><td>7<\/td><td>All powers belong to the people; supremacy of the Constitution<\/td><\/tr><tr><td>8<\/td><td>The fundamental principles of state policy<\/td><\/tr><tr><td>11<\/td><td>Democracy and human rights<\/td><\/tr><tr><td>15<\/td><td>Provision of basic necessities<\/td><\/tr><tr><td>17<\/td><td>Free and compulsory education<\/td><\/tr><tr><td>18A<\/td><td>Protection of the environment and biodiversity<\/td><\/tr><tr><td>21<\/td><td>Duties of citizens and of public servants (\"to strive at all times to serve the people\")<\/td><\/tr><tr><td>22<\/td><td>Separation of the judiciary from the executive<\/td><\/tr><tr><td>23A<\/td><td>Culture of tribes, minor races, ethnic sects and communities<\/td><\/tr><tr><td>25<\/td><td>Promotion of international peace, security and solidarity<\/td><\/tr><tr><td>27<\/td><td>Equality before law<\/td><\/tr><tr><td>28<\/td><td>No discrimination on grounds of religion, race, caste, sex or place of birth<\/td><\/tr><tr><td>29<\/td><td>Equality of opportunity in public employment<\/td><\/tr><tr><td>31, 32<\/td><td>Right to protection of law; protection of life and personal liberty<\/td><\/tr><tr><td>33<\/td><td>Safeguards as to arrest and detention<\/td><\/tr><tr><td>34<\/td><td>Prohibition of forced labour<\/td><\/tr><tr><td>36, 37, 38<\/td><td>Freedom of movement, of assembly, of association<\/td><\/tr><tr><td>39<\/td><td>Freedom of thought, conscience, speech and the press<\/td><\/tr><tr><td>40, 41<\/td><td>Freedom of profession; freedom of religion<\/td><\/tr><tr><td>44<\/td><td>Enforcement of fundamental rights (High Court Division under Article 102)<\/td><\/tr><tr><td>48<\/td><td>The President<\/td><\/tr><tr><td>52<\/td><td>Impeachment of the President<\/td><\/tr><tr><td>55, 56<\/td><td>The Cabinet; Ministers<\/td><\/tr><tr><td>59, 60<\/td><td>Local government<\/td><\/tr><tr><td>64<\/td><td>The Attorney-General<\/td><\/tr><tr><td>65<\/td><td>Establishment of Parliament (Jatiya Sangsad)<\/td><\/tr><tr><td>70<\/td><td>Vacation of seat on resignation from the party or voting against it<\/td><\/tr><tr><td>76<\/td><td>Standing committees of Parliament<\/td><\/tr><tr><td>77<\/td><td>Ombudsman (ন্যায়পাল)<\/td><\/tr><tr><td>81<\/td><td>Money Bills<\/td><\/tr><tr><td>87<\/td><td>Annual financial statement (the budget)<\/td><\/tr><tr><td>93<\/td><td>Ordinance-making power of the President<\/td><\/tr><tr><td>94<\/td><td>Establishment of the Supreme Court<\/td><\/tr><tr><td>102<\/td><td>Writ jurisdiction of the High Court Division<\/td><\/tr><tr><td>108<\/td><td>Supreme Court as a court of record<\/td><\/tr><tr><td>117<\/td><td>Administrative tribunals<\/td><\/tr><tr><td>118, 119<\/td><td>Election Commission; its functions<\/td><\/tr><tr><td>127<\/td><td>Comptroller and Auditor-General<\/td><\/tr><tr><td>137<\/td><td>Public Service Commissions<\/td><\/tr><tr><td>141A<\/td><td>Proclamation of emergency<\/td><\/tr><tr><td>142<\/td><td>Power to amend the Constitution<\/td><\/tr><tr><td>148<\/td><td>Oaths of office<\/td><\/tr><\/table><\/div><h4>Similar provisions that are easily confused<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Article<\/th><th>How to tell them apart<\/th><\/tr><tr><td>Equality before law<\/td><td>27<\/td><td>the general principle<\/td><\/tr><tr><td>Non-discrimination<\/td><td>28<\/td><td>by the State, on five named grounds; 28(2) women's equal rights; 28(4) special provision for women and children<\/td><\/tr><tr><td>Equal opportunity in public employment<\/td><td>29<\/td><td>jobs in the service of the Republic; 29(3) allows special provision (the constitutional basis of quotas)<\/td><\/tr><tr><td>Writ<\/td><td>102<\/td><td>the remedy in the High Court Division<\/td><\/tr><tr><td>Right to move the court<\/td><td>44<\/td><td>the right itself, in Part III<\/td><\/tr><tr><td>Ordinance<\/td><td>93<\/td><td>President, when Parliament is not in session<\/td><\/tr><tr><td>Emergency<\/td><td>141A<\/td><td>President, with the Prime Minister's countersignature; 120 days<\/td><\/tr><tr><td>Ombudsman<\/td><td>77<\/td><td>office provided for but never set up<\/td><\/tr><tr><td>Attorney-General<\/td><td>64<\/td><td>chief law officer; has the right of audience in all courts<\/td><\/tr><\/table><\/div><h3 id=\"c29-s4\">28.4 The executive<\/h3><ul><li><b>President:<\/b> head of state; elected by Members of Parliament (Article 48); minimum age 35; term 5 years; not more than two terms; may be impeached (Article 52) or removed for incapacity (Article 53) by a two-thirds majority. Acts on the advice of the Prime Minister except in appointing the Prime Minister and the Chief Justice.<\/li><li><b>Prime Minister:<\/b> head of government; the member who commands the support of the majority in Parliament; minimum age 25.<\/li><li><b>Cabinet:<\/b> collectively responsible to Parliament (Article 55). Not more than one-tenth of ministers may be chosen from outside Parliament (technocrat ministers).<\/li><li><b>Administrative units:<\/b> 8 divisions (Dhaka, Chattogram, Rajshahi, Khulna, Barishal, Sylhet, Rangpur, Mymensingh), 64 districts, 495 upazilas, 12 city corporations — the 12th being <b>Mymensingh<\/b> <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>. Counts of upazilas, municipalities and unions change; check before the examination.<\/li><li><b>Who heads what:<\/b> the political head of a ministry is the Minister; the <b>administrative head is the Secretary<\/b> — <span class=\"tg tg-actual\">ACTUAL: GTCL 2021<\/span>. A division is headed by a Divisional Commissioner, a district by a Deputy Commissioner, an upazila by an Upazila Nirbahi Officer.<\/li><li><b>Rules of Business, 1996<\/b> allocate work among ministries; the <b>Secretariat Instructions, 2014<\/b> govern how files are handled.<\/li><li><b>NEC and ECNEC:<\/b> the National Economic Council, chaired by the Prime Minister, is the highest body for approving development plans and economic policy; its Executive Committee (ECNEC) approves development projects. <span class=\"tg tg-actual\">ACTUAL: PGCL 2021 asked for the \"highest authority for approving economic policies and development plans\"; the printed key gives ECNEC, because NEC was not among the options. Strictly, the highest body is the NEC.<\/span><\/li><\/ul><h3 id=\"c29-s5\">28.5 Parliament (Jatiya Sangsad)<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Fact<\/th><\/tr><tr><td>Seats<\/td><td>350: 300 directly elected + <b>50 reserved for women<\/b> — <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span> (raised from 45 to 50 by the 15th Amendment, 2011; extended by the 17th Amendment, 2018)<\/td><\/tr><tr><td>Term<\/td><td>5 years from the first sitting<\/td><\/tr><tr><td>Minimum age of a member<\/td><td>25<\/td><\/tr><tr><td>Quorum<\/td><td>60 members<\/td><\/tr><tr><td>Interval between sessions<\/td><td>not more than 60 days<\/td><\/tr><tr><td>Speaker<\/td><td>elected at the first sitting; chairs the House; acts as President when the office is vacant<\/td><\/tr><tr><td>Absence<\/td><td>a seat falls vacant after 90 consecutive sitting days' absence without leave<\/td><\/tr><tr><td>Budget<\/td><td>presented under Article 87; Money Bill Article 81<\/td><\/tr><tr><td>Building<\/td><td>at Sher-e-Bangla Nagar; architect Louis I. Kahn; inaugurated 28 January 1982<\/td><\/tr><tr><td>First parliament<\/td><td>election 7 March 1973; first sitting 7 April 1973<\/td><\/tr><tr><td>Proposed change<\/td><td>a second chamber of 100 members under the July National Charter — not in force when this edition was prepared<\/td><\/tr><\/table><\/div><h3 id=\"c29-s6\">28.6 The judiciary<\/h3><ul><li>The Supreme Court has two divisions: the <b>Appellate Division<\/b> and the <b>High Court Division<\/b>. The Chief Justice is appointed by the President.<\/li><li>Judges retire at 67. The judiciary was formally separated from the executive on 1 November 2007.<\/li><li><b>Writs<\/b> (Article 102): habeas corpus, mandamus, prohibition, certiorari, quo warranto.<\/li><li><i>Amicus curiae<\/i> (\"friend of the court\") is a term of the <b>judiciary<\/b> — <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span>.<\/li><li>Constitutional bodies: Election Commission (118), Comptroller and Auditor-General (127), Public Service Commission (137), Attorney-General (64). Statutory bodies: Anti-Corruption Commission (2004), National Human Rights Commission (2009), Information Commission (2009), BERC (2003).<\/li><\/ul><h3 id=\"c29-s7\">28.7 Amendments<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>No.<\/th><th>Year<\/th><th>Subject<\/th><\/tr><tr><td>1st<\/td><td>1973<\/td><td>trial of war criminals<\/td><\/tr><tr><td>2nd<\/td><td>1973<\/td><td>emergency provisions, preventive detention<\/td><\/tr><tr><td>3rd<\/td><td>1974<\/td><td>Bangladesh–India boundary agreement (Berubari)<\/td><\/tr><tr><td>4th<\/td><td>1975<\/td><td>presidential system; one-party rule (BAKSAL)<\/td><\/tr><tr><td>5th<\/td><td>1979<\/td><td>validated martial-law actions of 1975–79; \"Bismillah\" in the Preamble (declared illegal by the Supreme Court, 2010)<\/td><\/tr><tr><td>6th<\/td><td>1981<\/td><td>Vice-President eligible for the presidential election<\/td><\/tr><tr><td>7th<\/td><td>1986<\/td><td>validated Ershad's martial law (declared illegal, 2010)<\/td><\/tr><tr><td>8th<\/td><td>1988<\/td><td>Islam as state religion; permanent High Court benches outside Dhaka (the latter struck down); \"Dacca\" to \"Dhaka\"<\/td><\/tr><tr><td>9th<\/td><td>1989<\/td><td>direct election of the Vice-President; two-term limit for the President<\/td><\/tr><tr><td>10th<\/td><td>1990<\/td><td>reserved women's seats (30) for a further 10 years<\/td><\/tr><tr><td>11th<\/td><td>1991<\/td><td>return of Acting President Justice Shahabuddin Ahmed to the post of Chief Justice<\/td><\/tr><tr><td><b>12th<\/b><\/td><td>1991<\/td><td><b>return to the parliamentary system<\/b><\/td><\/tr><tr><td><b>13th<\/b><\/td><td>1996<\/td><td><b>non-party caretaker government<\/b> (declared void by the Appellate Division in 2011; in November 2025 the Appellate Division, on review, restored the caretaker system for future elections)<\/td><\/tr><tr><td>14th<\/td><td>2004<\/td><td>reserved women's seats raised to 45; retirement age of judges 67<\/td><\/tr><tr><td><b>15th<\/b><\/td><td>2011<\/td><td>caretaker system abolished; women's seats 50; the four original principles restored (parts of this amendment were struck down by the High Court Division in December 2024)<\/td><\/tr><tr><td>16th<\/td><td>2014<\/td><td>power to remove judges given to Parliament (struck down by the Supreme Court, 2017)<\/td><\/tr><tr><td>17th<\/td><td>2018<\/td><td>reserved women's seats extended for 25 years<\/td><\/tr><\/table><\/div><div class=\"bx bx-mem\"><div class=\"bxh\">MEMORY AID: Three amendments to know cold<\/div><p class=\"\"><b>4<\/b> (presidential, 1975) — <b>12<\/b> (back to parliamentary, 1991) — <b>13<\/b> (caretaker government, 1996). Then 8 (state religion), 15 (women's seats 50), 17 (25 more years).<\/p><\/div><h3 id=\"c29-s8\">28.8 National symbols<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Symbol<\/th><th>Detail<\/th><\/tr><tr><td>National flag<\/td><td>bottle green with a red circle; ratio 10 : 6; circle radius one-fifth of the length; designed by Quamrul Hassan (original 1971 design with the map: Shib Narayan Das); first hoisted 2 March 1971<\/td><\/tr><tr><td>National anthem<\/td><td>\"আমার সোনার বাংলা\" — first 10 lines of Rabindranath's song (25 lines); the first 4 lines are played on state occasions<\/td><\/tr><tr><td>National emblem<\/td><td>a water lily on water, flanked by ears of paddy, with three jute leaves and four stars; designed by Quamrul Hassan<\/td><\/tr><tr><td>National song (রণসংগীত)<\/td><td>\"চল্ চল্ চল্\" — Kazi Nazrul Islam<\/td><\/tr><tr><td>National flower, fruit, fish, bird, animal, tree<\/td><td>shapla (white water lily), jackfruit, hilsa, doyel (magpie robin), Royal Bengal tiger, mango tree<\/td><\/tr><tr><td>National sport, mosque, museum, park, poet<\/td><td>kabaddi; Baitul Mukarram; Bangladesh National Museum (Shahbagh); Bhawal National Park; Kazi Nazrul Islam<\/td><\/tr><tr><td>National days<\/td><td>21 February (Shaheed Day/International Mother Language Day); 26 March (Independence and National Day); 16 December (Victory Day)<\/td><\/tr><\/table><\/div><h3 id=\"c29-s9\">28.9 Civil service<\/h3><p>The Bangladesh Civil Service has <b>26 cadres<\/b> at present (28 and 29 at earlier dates; a 2011 Petrobangla question accepted 28). Recruitment is by the Bangladesh Public Service Commission (Article 137). Petrobangla and its companies are <b>not<\/b> part of the cadre service: Petrobangla is a statutory corporation and the companies are registered under the Companies Act, 1994 (Chapter 36).<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 28<\/div><p class=\"li\">Adopted 4 November 1972; in force 16 December 1972; 11 Parts, 153 Articles, 7 Schedules.<\/p><p class=\"li\">Articles 27 (equality), 28 (non-discrimination), 29 (public employment), 39 (speech), 77 (Ombudsman), 102 (writ), 137 (PSC), 142 (amendment).<\/p><p class=\"li\">Parliament 300 + 50; quorum 60; member's age 25; President's age 35.<\/p><p class=\"li\">Amendments: 4th presidential; 12th parliamentary; 13th caretaker; 15th women's seats 50.<\/p><p class=\"li\">Administrative head of a ministry: the Secretary. 12th city corporation: Mymensingh.<\/p><p class=\"li\">Reform under the July National Charter is in progress — check the latest position.<\/p><\/div>"},{"id":"c30","no":29,"part":"PART E — GENERAL KNOWLEDGE","title":"Chapter 29: Bangladesh — Geography, Economy and Resources","short":"Bangladesh — Geography, Economy and Resources","toc":[["c30-s1","29.1 Location and boundaries"],["c30-s2","29.2 Rivers"],["c30-s3","29.3 Ports, bridges and infrastructure"],["c30-s4","29.4 Economy — structure"],["c30-s5","29.5 Economy — current figures (dated)"],["c30-s6","29.6 Mineral and energy resources (overview)"]],"html":"<h3 id=\"c30-s1\">29.1 Location and boundaries<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Fact<\/th><\/tr><tr><td>Location<\/td><td>20°34′–26°38′ N and 88°01′–92°41′ E; the Tropic of Cancer and the 90° E meridian cross the country<\/td><\/tr><tr><td>Area<\/td><td>1,47,570 sq km (56,977 sq miles)<\/td><\/tr><tr><td>Standard time<\/td><td>GMT + 6 hours<\/td><\/tr><tr><td>Land border<\/td><td>about 4,246 km in total: with India about 4,156 km (5 Indian states), with Myanmar 271 km<\/td><\/tr><tr><td>Indian states bordering Bangladesh<\/td><td>West Bengal, Assam, Meghalaya, Tripura, Mizoram (\"the five sisters touching us\"). <b>Manipur<\/b>, Nagaland and Arunachal do not — <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span><\/td><\/tr><tr><td>Districts bordering Myanmar<\/td><td>Rangamati, Bandarban, Cox's Bazar<\/td><\/tr><tr><td>Coastline<\/td><td>about 711–716 km; Cox's Bazar sea beach about 120 km<\/td><\/tr><tr><td>Maritime boundary<\/td><td>settled with Myanmar by ITLOS (14 March 2012) and with India by the Permanent Court of Arbitration (7 July 2014); territorial sea 12 nautical miles, EEZ 200 nautical miles<\/td><\/tr><tr><td>Extremes<\/td><td>northernmost Banglabandha (Tetulia, Panchagarh); southernmost Chhera Dwip (St Martin's, Teknaf); largest district Rangamati; smallest Narayanganj; largest division by area Chattogram<\/td><\/tr><tr><td>Highest peak<\/td><td>Tajingdong (Bijoy), Bandarban — officially; Saka Haphong is often cited as higher<\/td><\/tr><tr><td>Islands<\/td><td>Bhola (largest), St Martin's (the only coral island; \"Narikel Jinjira\"), Maheshkhali (the only hilly island), Sandwip, Hatiya, Nijhum Dwip, Kutubdia, Sonadia<\/td><\/tr><\/table><\/div><h3 id=\"c30-s2\">29.2 Rivers<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>River<\/th><th>Facts<\/th><\/tr><tr><td>Padma<\/td><td>the Ganges enters at Chapainawabganj; joins the Jamuna at Goalanda and the Meghna at Chandpur<\/td><\/tr><tr><td>Jamuna<\/td><td>main channel of the Brahmaputra since the 1787 flood; Jamuna Bridge 4.8 km (1998)<\/td><\/tr><tr><td>Meghna<\/td><td>formed by the Surma and Kushiyara (from the Barak); the widest river<\/td><\/tr><tr><td>Brahmaputra<\/td><td>rises near La
