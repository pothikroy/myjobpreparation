 (now Petroleum Act, 2016)<\/td><td>safety, storage and transport of petroleum and explosives<\/td><\/tr><tr><td><b>The Bangladesh Petroleum Act, 1974<\/b><\/td><td>vests all petroleum in the government; allows petroleum agreements (PSCs)<\/td><\/tr><tr><td>The Bangladesh Petroleum Corporation Ordinance, 1976<\/td><td>created BPC<\/td><\/tr><tr><td>The Public Corporations (Management Co-ordination) Ordinance, 1986<\/td><td>coordination of public corporations<\/td><\/tr><tr><td>Mines and Minerals (Regulation and Development) Act, 1992<\/td><td>mining leases and licences<\/td><\/tr><tr><td>Bangladesh Environment Conservation Act, 1995<\/td><td>environmental clearance for projects<\/td><\/tr><tr><td><b>Bangladesh Energy Regulatory Commission Act, 2003<\/b><\/td><td>independent regulation and tariff-setting<\/td><\/tr><tr><td><b>Bangladesh Gas Act, 2010<\/b><\/td><td>transmission, distribution, sale and use of gas; offences such as illegal connections<\/td><\/tr><tr><td>Quick Enhancement of Electricity and Energy Supply (Special Provisions) Act, 2010<\/td><td>allowed contracts without competitive tender; widely criticised and repealed in November 2024<\/td><\/tr><tr><td><b>Bangladesh Oil, Gas and Mineral Corporation Act, 2022<\/b><\/td><td>Petrobangla's own constituent Act<\/td><\/tr><\/table><\/div><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 34<\/div><p class=\"li\">Petrobangla = Bangladesh Oil, Gas and Mineral Corporation; statutory corporation under the Energy and Mineral Resources Division.<\/p><p class=\"li\">26 March 1972 BMOGC (P.O. 27) → 1974 \"Petrobangla\" → 9 August 1975 five Shell fields for £4.5 million → 1985 BOGMC → Act 19 of 2022.<\/p><p class=\"li\">13 companies: 3 E&amp;P (BAPEX, BGFCL, SGFL), 1 transmission (GTCL), 6 distribution (Titas, Bakhrabad, Jalalabad, Pashchimanchal, Karnaphuli, Sundarban), RPGCL, 2 mining (BCMCL, MGMCL).<\/p><p class=\"li\">BPC and the power companies are not Petrobangla companies.<\/p><p class=\"li\">PSC: contractor bears the risk; cost-recovery gas, then profit gas is shared; 26 offshore blocks.<\/p><\/div>"},{"id":"c36","no":35,"part":"PART F — PETROBANGLA, ENERGY AND ADMINISTRATION","title":"Chapter 35: The Energy Sector of Bangladesh","short":"The Energy Sector of Bangladesh","toc":[["c36-s1","35.1 Natural gas — the basics"],["c36-s2","35.2 Milestones of gas in Bangladesh"],["c36-s3","35.3 Reserves, production and demand (dated figures)"],["c36-s4","35.4 Who uses the gas"],["c36-s5","35.5 The gas chain and who does what"],["c36-s6","35.6 Coal and other minerals"],["c36-s7","35.7 Electricity in brief"],["c36-s8","35.8 Renewable energy and policy"],["c36-s9","35.9 Energy security — the argument in one page"],["c36-s10","35.10 Previous questions on energy — all in one place"],["c36-s11","35.11 Practice quiz"]],"html":"<h3 id=\"c36-s1\">35.1 Natural gas — the basics<\/h3><ul><li>Natural gas is mainly <b>methane (CH₄)<\/b>. Bangladesh's gas is unusually pure (\"sweet\", with almost no sulphur). The by-product liquid is <b>condensate<\/b>, from which petrol, diesel and kerosene are obtained.<\/li><li>Units: cubic foot (cf); <b>MMcfd<\/b> = million cubic feet per day (the unit of production); <b>Bcf<\/b> = billion cubic feet; <b>Tcf<\/b> = trillion cubic feet (the unit of reserves). 1 Tcf = 1,000 Bcf.<\/li><li><b>LNG<\/b> (liquefied natural gas) is gas cooled to about −162 °C, which shrinks it to about 1/600 of its volume for shipping. <b>CNG<\/b> is gas compressed for vehicles. <b>LPG<\/b> (liquefied petroleum gas) is propane and butane, sold in cylinders — it is a petroleum product, not natural gas.<\/li><li>An <b>FSRU<\/b> (Floating Storage and Regasification Unit) is a ship that stores LNG and turns it back into gas for the pipeline.<\/li><\/ul><h3 id=\"c36-s2\">35.2 Milestones of gas in Bangladesh<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Year<\/th><th>Event<\/th><\/tr><tr><td>1910–14<\/td><td>first exploration well at Sitakunda (Indian Petroleum Prospecting Company)<\/td><\/tr><tr><td><b>1955<\/b><\/td><td>first gas field discovered at <b>Haripur, Sylhet<\/b> (Burmah Oil Company)<\/td><\/tr><tr><td>1959<\/td><td>Chhatak gas field discovered; gas supplied to the Chhatak cement factory from 1960 — the first commercial use<\/td><\/tr><tr><td><b>1962<\/b><\/td><td><b>Titas<\/b> gas field discovered (Brahmanbaria; Pakistan Shell Oil Company) — the largest gas field by reserves <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span><\/td><\/tr><tr><td>1963, 1969<\/td><td>Habiganj; Bakhrabad discovered<\/td><\/tr><tr><td>1968<\/td><td>Titas Gas begins supply (Siddhirganj power station, 28 April 1968)<\/td><\/tr><tr><td>1975<\/td><td>five fields bought from Shell (9 August)<\/td><\/tr><tr><td>1977<\/td><td>Kutubdia — first offshore discovery (not developed)<\/td><\/tr><tr><td>1986<\/td><td>Haripur — the only oil discovery; production 1987–94<\/td><\/tr><tr><td>1993<\/td><td>National gas grid company GTCL formed; first PSC bidding round<\/td><\/tr><tr><td><b>1996<\/b><\/td><td><b>Sangu<\/b> — the first offshore field to be developed (Cairn Energy; produced 1998–2013) <span class=\"tg tg-actual\">ACTUAL: PGCL 2021<\/span><\/td><\/tr><tr><td>1997<\/td><td>Magurchhara blow-out (14 June; Occidental)<\/td><\/tr><tr><td>1998<\/td><td>Bibiyana discovered (Habiganj) — now the largest producing field<\/td><\/tr><tr><td>2005<\/td><td>Tengratila (Chhatak) blow-outs (Niko)<\/td><\/tr><tr><td>2018<\/td><td>first LNG import (FSRU at Moheshkhali; commercial supply from August 2018); Bhola North discovered<\/td><\/tr><tr><td>2021<\/td><td><b>Zakiganj, Sylhet — the 28th gas field<\/b> (BAPEX) <span class=\"tg tg-actual\">ACTUAL: Titas 2021<\/span><\/td><\/tr><tr><td>2023<\/td><td><b>Ilisha-1, Bhola — the 29th gas field<\/b> (BAPEX)<\/td><\/tr><\/table><\/div><h3 id=\"c36-s3\">35.3 Reserves, production and demand (dated figures)<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Figure<\/th><th>Source and date<\/th><\/tr><tr><td>Gas fields discovered<\/td><td>29<\/td><td>Petrobangla; press, 2026<\/td><\/tr><tr><td>Total recoverable reserve<\/td><td>29.74 Tcf<\/td><td>Energy Minister's statement in Parliament, 2026<\/td><\/tr><tr><td>Already produced<\/td><td>22.11 Tcf to the end of 2025<\/td><td>same<\/td><\/tr><tr><td>Remaining recoverable reserve<\/td><td><b>7.63 Tcf on 1 January 2026<\/b> — about 12 years at the present rate<\/td><td>same<\/td><\/tr><tr><td>Domestic production<\/td><td>about 1,600 MMcfd, down from about 2,500 MMcfd six years earlier<\/td><td>press reports, 2026<\/td><\/tr><tr><td>Producers (MMcfd)<\/td><td>Chevron 861; BGFCL 480; SGFL 138; BAPEX 108; another IOC 30<\/td><td>BSS, early November 2026<\/td><\/tr><tr><td>LNG supply<\/td><td>about 1,100 MMcfd through two FSRUs — about 41% of supply<\/td><td>same<\/td><\/tr><tr><td>Total supply<\/td><td>about 2,700 MMcfd on average<\/td><td>same<\/td><\/tr><tr><td>Demand<\/td><td>about 3,800 MMcfd in actual use (5,300 MMcfd on approved load)<\/td><td>same<\/td><\/tr><tr><td>Shortfall<\/td><td>more than 1,000 MMcfd<\/td><td>same; the Minister cited 1,146 MMcfd<\/td><\/tr><tr><td>Drilling programme<\/td><td>target of 150 wells by 2031; 11 wells completed since 17 February 2026 added 58.8 MMcfd of potential<\/td><td>Chairman of Petrobangla, press, November 2026<\/td><\/tr><\/table><\/div><div class=\"bx bx-warn\"><div class=\"bxh\">CAUTION: Use these numbers with their dates<\/div><p class=\"\">In an essay write \"about 7.6 Tcf at the beginning of 2026\" or \"nearly two-fifths of supply now comes from imported LNG\", not bare figures. In an MCQ, expect round numbers: 29 fields; first field Haripur 1955; largest Titas; largest producer Bibiyana.<\/p><\/div><h3 id=\"c36-s4\">35.4 Who uses the gas<\/h3><p>Power generation is the largest user (roughly two-fifths, including captive power in factories), followed by industry, fertiliser, households and CNG. New household connections have been suspended for years; LPG is promoted for cooking instead. Gas is the feedstock of <b>urea fertiliser<\/b>, so gas shortages affect both electricity and agriculture.<\/p><h3 id=\"c36-s5\">35.5 The gas chain and who does what<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Stage<\/th><th>Organisations<\/th><\/tr><tr><td>Exploration and production<\/td><td>BAPEX, BGFCL, SGFL; IOCs under PSCs<\/td><\/tr><tr><td>LNG import<\/td><td>Petrobangla through RPGCL; two FSRUs at <b>Moheshkhali<\/b>, Cox's Bazar (one operated by Excelerate Energy, one by Summit); long-term supply contracts with <b>Qatar<\/b> and <b>Oman<\/b>, plus spot purchases; a land-based terminal is planned at Matarbari<\/td><\/tr><tr><td>Transmission<\/td><td>GTCL — national grid of high-pressure pipelines<\/td><\/tr><tr><td>Distribution<\/td><td>Titas, Bakhrabad, Jalalabad, Pashchimanchal, Karnaphuli, Sundarban<\/td><\/tr><tr><td>Regulation and price<\/td><td><b>Bangladesh Energy Regulatory Commission (BERC)<\/b> — set up under the BERC Act, 2003; fixes gas and electricity tariffs after public hearings; licenses operators; settles disputes<\/td><\/tr><tr><td>Policy<\/td><td>Energy and Mineral Resources Division; Hydrocarbon Unit (technical arm)<\/td><\/tr><tr><td>Liquid fuels (outside Petrobangla)<\/td><td>BPC imports crude and refined oil; <b>Eastern Refinery Limited<\/b>, Chattogram — the only state refinery <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>; Padma, Meghna and Jamuna oil companies market the products; the <b>India–Bangladesh Friendship Pipeline<\/b> brings diesel to Parbatipur <span class=\"tg tg-actual\">ACTUAL: BAPEX 2023<\/span><\/td><\/tr><tr><td>Minerals<\/td><td>Geological Survey of Bangladesh (survey); Bureau of Mineral Development (leases)<\/td><\/tr><\/table><\/div><h3 id=\"c36-s6\">35.6 Coal and other minerals<\/h3><ul><li>Five major coal fields: <b>Barapukuria<\/b> (Dinajpur; the only one mined, underground method, since 2005), Phulbari and Dighipara (Dinajpur), Khalaspir (Rangpur) and <b>Jamalganj<\/b> (Joypurhat — the largest and deepest) <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>.<\/li><li>Hard rock: Maddhapara, Dinajpur (granite; production from 2007).<\/li><li>Imported coal now feeds the large power stations at Payra, Rampal, Matarbari and Banshkhali.<\/li><\/ul><h3 id=\"c36-s7\">35.7 Electricity in brief<\/h3><ul><li>Installed generating capacity has grown to well over 27,000 MW (including captive and renewable; the figure changes — check the Power Division's current number), while peak demand is far lower; the gap has made \"capacity charges\" a public issue.<\/li><li>Fuel mix of generation: natural gas (the largest), then furnace oil and diesel, coal, imported power from India, hydro (Kaptai, 230 MW) and renewables.<\/li><li><b>Rooppur Nuclear Power Plant<\/b> (Pabna): two units of 1,200 MW each, built by Russia's Rosatom.<\/li><li>Bodies: Bangladesh Power Development Board (BPDB, 1972) — generation and single buyer; Power Grid Company (PGCB) — transmission; BREB (rural), DPDC and DESCO (Dhaka), NESCO, WZPDCL — distribution. <b>Electricity Generation Company of Bangladesh<\/b> was formerly <b>Meghnaghat Power Company Ltd<\/b> <span class=\"tg tg-actual\">ACTUAL: BGFCL 2021<\/span>.<\/li><li>The <b>60 MW wind power plant at Khurushkul, Cox's Bazar<\/b> is the country's first utility-scale wind farm — which is why \"None\" was the answer when the 2024 paper offered 58, 62, 64 and 66 MW <span class=\"tg tg-actual\">ACTUAL: PB 2024<\/span>.<\/li><\/ul><h3 id=\"c36-s8\">35.8 Renewable energy and policy<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Facts<\/th><\/tr><tr><td>Sources<\/td><td>solar (home systems, rooftop, solar parks, irrigation pumps), wind, hydro, biomass and biogas, waste-to-energy<\/td><\/tr><tr><td>Institutions<\/td><td><b>SREDA<\/b> — Sustainable and Renewable Energy Development Authority (Act of 2012); IDCOL finances solar home systems<\/td><\/tr><tr><td>Policies<\/td><td>National Energy Policy 1996 (revised 2004); Renewable Energy Policy 2008, replaced by the Renewable Energy Policy 2025, which sets targets of about 20% of electricity from renewables by 2030 and 30% by 2040; Integrated Energy and Power Master Plan (2023)<\/td><\/tr><tr><td>Share today<\/td><td>renewables supply only a few per cent of electricity; land scarcity and grid limits are the main obstacles<\/td><\/tr><tr><td>SDG 7<\/td><td>affordable, reliable, sustainable and modern energy for all by 2030<\/td><\/tr><tr><td>Net metering<\/td><td>lets rooftop solar owners sell surplus power to the grid<\/td><\/tr><\/table><\/div><h3 id=\"c36-s9\">35.9 Energy security — the argument in one page<\/h3><p><b>Energy security<\/b> means an uninterrupted supply of energy at an affordable price. For an essay, a short note or a viva answer, organise the subject like this:<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Heading<\/th><th>Points<\/th><\/tr><tr><td>The problem<\/td><td>Domestic gas reserves and production are declining; demand exceeds supply by more than 1,000 MMcfd; about two-fifths of gas is now imported LNG, paid for in dollars at volatile prices; coal and oil for power are also imported; industry and fertiliser plants face rationing<\/td><\/tr><tr><td>Causes<\/td><td>too little exploration for two decades, especially offshore; over-reliance on a single fuel; easy recourse to imports; under-pricing and waste; system loss and illegal connections; slow renewable development<\/td><\/tr><tr><td>What is being done<\/td><td>accelerated drilling and workover of wells (target 150 wells by 2031); the Offshore Bidding Round 2026 with a new model PSC; planned onshore round; new discoveries in Bhola and Sylhet; pipeline to bring Bhola gas to the mainland; LNG terminals; removal of illegal connections; prepaid meters<\/td><\/tr><tr><td>What more is needed<\/td><td>strengthen BAPEX with rigs, technology and skilled people; explore the Bay of Bengal after the settlement of the maritime boundary; efficient appliances and co-generation; rational pricing with protection for the poor; a larger renewable share; regional energy trade (hydropower from Nepal and Bhutan); transparency in contracts<\/td><\/tr><tr><td>Administrative angle<\/td><td>timely procurement under the public procurement law; good records and data; disciplined project management; customer service and grievance handling; integrity<\/td><\/tr><\/table><\/div><h3 id=\"c36-s10\">35.10 Previous questions on energy — all in one place<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Question<\/th><th>Answer<\/th><\/tr><tr><td>Which is the largest gas field in Bangladesh? [BGFCL 2021]<\/td><td>Titas<\/td><\/tr><tr><td>Which is the first sea-shore (offshore) gas field? [PGCL 2021]<\/td><td>Sangu<\/td><\/tr><tr><td>The country's 28th gas field is in — [Titas 2021]<\/td><td>Zakiganj (Sylhet)<\/td><\/tr><tr><td>When did the Bangladesh Petroleum Act come into force? [BGFCL 2021]<\/td><td>1974<\/td><\/tr><tr><td>National Energy Security Day [BGFCL 2021]<\/td><td>9 August<\/td><\/tr><tr><td>Which organisation controls the price of crude oil? [BGFCL 2021]<\/td><td>OPEC<\/td><\/tr><tr><td>Which country is not a member of OPEC? [Titas 2021]<\/td><td>Malaysia (never a member); Indonesia's membership is suspended<\/td><\/tr><tr><td>Which country is the largest producer of natural gas? [Titas 2021]<\/td><td>The United States (not among the options; of the options, Russia)<\/td><\/tr><tr><td>Highest exporter of natural gas from the Middle East [KGDCL 2021]<\/td><td>Qatar<\/td><\/tr><tr><td>State-owned oil refinery [BGFCL 2021]<\/td><td>Eastern Refinery Limited<\/td><\/tr><tr><td>Mineral found at Jamalganj, Joypurhat [BGFCL 2021]<\/td><td>Coal<\/td><\/tr><tr><td>\"Maitree Super Thermal Power Project\" is at — [Titas 2021]<\/td><td>Rampal<\/td><\/tr><tr><td>Friendship Pipeline delivers diesel to — [BAPEX 2023]<\/td><td>Parbatipur<\/td><\/tr><tr><td>Former name of EGCB [BGFCL 2021]<\/td><td>Meghnaghat Power Company Ltd<\/td><\/tr><tr><td>Capacity of the Cox's Bazar wind power plant [PB 2024]<\/td><td>60 MW (answer \"None\")<\/td><\/tr><tr><td>Headquarters of the IAEA [BGFCL 2021]<\/td><td>Vienna, Austria<\/td><\/tr><tr><td>Highest energy consumption per capita [KGDCL 2021]<\/td><td>Iceland<\/td><\/tr><tr><td>Which is not a Petrobangla subsidiary? [PB 2016]<\/td><td>BAPEX, Titas and Barapukuria all are<\/td><\/tr><tr><td>Short note: OPEC [GTCL 2021, written]<\/td><td>see Chapter 17<\/td><\/tr><tr><td>Essay: Affordable and Clean Energy [SGFL 2021, written]<\/td><td>see Chapter 17<\/td><\/tr><\/table><\/div><h3 id=\"c36-s11\">35.11 Practice quiz<\/h3><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 1. Petrobangla was first constituted (as BMOGC) by — (a) P.O. 27 of 1972 (b) P.O. 120 of 1972 (c) Ordinance 21 of 1985 (d) Act 19 of 2022<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 2. The first gas field of Bangladesh was discovered at — (a) Titas (b) Haripur (c) Chhatak (d) Bakhrabad<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 3. Which company owns the national gas grid? (a) Titas (b) BAPEX (c) GTCL (d) RPGCL<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 4. The five gas fields bought from Shell in 1975 did NOT include — (a) Titas (b) Rashidpur (c) Kailashtila (d) Bibiyana<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 5. LNG is natural gas cooled to about — (a) −62 °C (b) −162 °C (c) −262 °C (d) 0 °C<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 6. Gas tariffs in Bangladesh are fixed by — (a) Petrobangla (b) BPC (c) BERC (d) Hydrocarbon Unit<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 7. The head office of Pashchimanchal Gas Company is in — (a) Rajshahi (b) Bogura (c) Sirajganj (d) Rangpur<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 8. The only operating coal mine of Bangladesh is — (a) Jamalganj (b) Phulbari (c) Barapukuria (d) Khalaspir<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 9. In a PSC, the gas from which the contractor recovers its expenses is called — (a) profit gas (b) cost recovery gas (c) royalty gas (d) flare gas<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 10. Which is not a company of Petrobangla? (a) SGFL (b) RPGCL (c) Padma Oil Company (d) MGMCL<\/p><p class=\"pq\"><span class=\"tg tg-predicted\">PREDICTED<\/span> 11. How many offshore blocks were offered in the Bangladesh Offshore Bidding Round 2026? (a) 22 (b) 24 (c) 26 (d) 48<\/p><p class=\"pq\"><span class=\"tg tg-predicted\">PREDICTED<\/span> 12. The remaining recoverable gas reserve of Bangladesh at the start of 2026 was stated in Parliament to be about — (a) 4.6 Tcf (b) 7.6 Tcf (c) 12.6 Tcf (d) 29.7 Tcf<\/p><p class=\"pa\">Answers: 1 a · 2 b · 3 c · 4 d · 5 b · 6 c · 7 c · 8 c · 9 b · 10 c · 11 c · 12 b.<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 35<\/div><p class=\"li\">First field Haripur 1955; largest Titas 1962; largest producer Bibiyana (Chevron); first offshore Sangu; 28th Zakiganj; 29th Ilisha-1.<\/p><p class=\"li\">29 fields; remaining reserve about 7.6 Tcf (1 January 2026); domestic output about 1,600 MMcfd; LNG about 41% of supply.<\/p><p class=\"li\">LNG: two FSRUs at Moheshkhali; Qatar and Oman long-term; RPGCL handles import.<\/p><p class=\"li\">BERC sets tariffs. BPC and Eastern Refinery handle oil. SREDA handles renewables.<\/p><p class=\"li\">Energy security = uninterrupted supply at affordable price: explore more, waste less, diversify.<\/p><\/div>"},{"id":"c37","no":36,"part":"PART F — PETROBANGLA, ENERGY AND ADMINISTRATION","title":"Chapter 36: Administration, Office Management and Relevant Laws","short":"Administration, Office Management and Relevant Laws","toc":[["c37-s1","36.1 Management: definition and functions"],["c37-s2","36.2 Planning and decision-making"],["c37-s3","36.3 Organising"],["c37-s4","36.4 Leadership and motivation"],["c37-s5","36.5 Communication, coordination, control"],["c37-s6","36.6 Human resource management"],["c37-s7","36.7 Office management"],["c37-s8","36.8 Ethics, public relations and time management"],["c37-s9","36.9 Which laws apply to Petrobangla's officers?"],["c37-s10","36.10 Conduct rules — the provisions worth knowing"],["c37-s11","36.11 Discipline and appeal — the procedure"],["c37-s12","36.12 Public procurement"],["c37-s13","36.13 Right to Information Act, 2009"],["c37-s14","36.14 Other laws in brief"],["c37-s15","36.15 Practice quiz"]],"html":"<div class=\"bx bx-ver\"><div class=\"bxh\">EVIDENCE STATUS: Status of this chapter<\/div><p class=\"\">No previous general-cadre paper in the database contains MCQs on management theory or service law; such questions appear only in the finance and accounts papers. This chapter is therefore a <b>preparation recommendation<\/b>, not a response to historical frequency. It is included for three reasons: the post is an administration post; five viva marks are for \"knowledge of the relevant subject\"; and written tasks (show-cause letter, application, notice) draw on it. Read it once carefully; revise from the boxes.<\/p><\/div><h3 id=\"c37-s1\">36.1 Management: definition and functions<\/h3><p>Management is the process of getting work done through people by using resources efficiently to reach the organisation's goals. The classical list of functions:<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Function<\/th><th>Meaning<\/th><\/tr><tr><td><b>Planning<\/b> (পরিকল্পনা)<\/td><td>deciding in advance what is to be done, how, when and by whom; the first function — all others follow from it<\/td><\/tr><tr><td><b>Organising<\/b> (সংগঠন)<\/td><td>grouping tasks, assigning them, establishing authority and reporting lines<\/td><\/tr><tr><td><b>Staffing<\/b> (কর্মীসংস্থান)<\/td><td>recruitment, selection, placement, training, appraisal, compensation<\/td><\/tr><tr><td><b>Directing / leading<\/b> (নির্দেশনা)<\/td><td>supervising, motivating, communicating, leading<\/td><\/tr><tr><td><b>Coordinating<\/b> (সমন্বয়)<\/td><td>harmonising the work of different units — \"the essence of management\"<\/td><\/tr><tr><td><b>Controlling<\/b> (নিয়ন্ত্রণ)<\/td><td>setting standards, measuring performance, comparing, correcting deviations; the last function, linked back to planning<\/td><\/tr><\/table><\/div><ul><li><b>POSDCORB<\/b> (Luther Gulick): Planning, Organising, Staffing, Directing, COordinating, Reporting, Budgeting.<\/li><li><b>Henri Fayol<\/b> (France) — father of modern management / administrative management; five functions (plan, organise, command, coordinate, control) and fourteen principles. <b>F. W. Taylor<\/b> (USA) — father of scientific management (time and motion study, differential piece rate). <b>Max Weber<\/b> — bureaucracy (hierarchy, rules, impersonality, merit). <b>Elton Mayo<\/b> — Hawthorne experiments, human relations. <b>Peter Drucker<\/b> — Management by Objectives (MBO).<\/li><li>Levels of management: top (policy; conceptual skill), middle (departmental; human skill), lower/supervisory (operational; technical skill). An Assistant Manager is at the entry level of the officer tier: mostly operational, supervising staff.<\/li><\/ul><h4>Fayol's fourteen principles<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Principle<\/th><th>Meaning<\/th><\/tr><tr><td>Division of work<\/td><td>specialisation raises output<\/td><\/tr><tr><td>Authority and responsibility<\/td><td>the right to give orders must be matched by accountability<\/td><\/tr><tr><td>Discipline<\/td><td>obedience and respect for agreements<\/td><\/tr><tr><td><b>Unity of command<\/b><\/td><td>each employee receives orders from one superior only<\/td><\/tr><tr><td><b>Unity of direction<\/b><\/td><td>one head and one plan for activities with the same objective<\/td><\/tr><tr><td>Subordination of individual interest<\/td><td>the organisation's interest comes first<\/td><\/tr><tr><td>Remuneration<\/td><td>fair pay<\/td><\/tr><tr><td>Centralisation<\/td><td>the right balance between central and delegated authority<\/td><\/tr><tr><td><b>Scalar chain<\/b><\/td><td>the line of authority from top to bottom; \"gangplank\" allows direct contact between equals in emergencies<\/td><\/tr><tr><td>Order<\/td><td>a place for everything and everyone<\/td><\/tr><tr><td>Equity<\/td><td>kindness and justice<\/td><\/tr><tr><td>Stability of tenure<\/td><td>low turnover<\/td><\/tr><tr><td>Initiative<\/td><td>freedom to propose and carry out plans<\/td><\/tr><tr><td>Esprit de corps<\/td><td>team spirit — \"union is strength\"<\/td><\/tr><\/table><\/div><div class=\"bx bx-mem\"><div class=\"bxh\">MEMORY AID: Fourteen principles<\/div><p class=\"\">\"<b>D<\/b>ivision, <b>A<\/b>uthority, <b>D<\/b>iscipline, <b>U<\/b>nity of command, <b>U<\/b>nity of direction, <b>S<\/b>ubordination, <b>R<\/b>emuneration, <b>C<\/b>entralisation, <b>S<\/b>calar chain, <b>O<\/b>rder, <b>E<\/b>quity, <b>S<\/b>tability, <b>I<\/b>nitiative, <b>E<\/b>sprit de corps\" — DAD-UU-SRC-SOE-SIE.<\/p><\/div><h3 id=\"c37-s2\">36.2 Planning and decision-making<\/h3><ul><li>Types of plans: strategic (long-term, top level), tactical (medium), operational (short); standing plans (policies, procedures, rules) and single-use plans (programmes, projects, budgets).<\/li><li>Steps in planning: set objectives → study the environment (SWOT: strengths, weaknesses, opportunities, threats) → identify alternatives → evaluate → choose → implement → review.<\/li><li>SMART objectives: Specific, Measurable, Achievable, Relevant, Time-bound.<\/li><li>Decision-making steps: define the problem → collect information → develop alternatives → evaluate → select → implement → follow up. Programmed decisions are routine; non-programmed decisions are novel.<\/li><li>Tools: brainstorming, cost–benefit analysis, Gantt chart (schedule), PERT/CPM (project networks), break-even analysis.<\/li><\/ul><h3 id=\"c37-s3\">36.3 Organising<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Concept<\/th><th>Meaning<\/th><\/tr><tr><td>Organisation structure<\/td><td>line (direct chain); line and staff (advisers support line managers); functional; matrix (project + function); committee<\/td><\/tr><tr><td>Organogram<\/td><td>the chart showing posts and reporting lines; a new post needs an approved organogram and budget<\/td><\/tr><tr><td><b>Span of control<\/b><\/td><td>the number of subordinates one superior can supervise effectively; narrow span → tall structure; wide span → flat structure<\/td><\/tr><tr><td><b>Delegation<\/b><\/td><td>passing authority to a subordinate; <b>authority can be delegated, responsibility cannot<\/b><\/td><\/tr><tr><td>Centralisation / decentralisation<\/td><td>concentration or dispersal of decision-making<\/td><\/tr><tr><td>Formal / informal organisation<\/td><td>official structure / social relationships (\"grapevine\")<\/td><\/tr><tr><td>Chain of command<\/td><td>the unbroken line of authority<\/td><\/tr><\/table><\/div><h3 id=\"c37-s4\">36.4 Leadership and motivation<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Content<\/th><\/tr><tr><td>Leadership styles<\/td><td>autocratic (leader decides), democratic/participative (consults), laissez-faire/free-rein (leaves it to the group), bureaucratic (by the book). Situational leadership: the best style depends on the people and the task. Transformational leaders inspire; transactional leaders exchange reward for performance<\/td><\/tr><tr><td>Maslow's hierarchy of needs<\/td><td>physiological → safety → social → esteem → self-actualisation; a satisfied need no longer motivates<\/td><\/tr><tr><td>Herzberg's two-factor theory<\/td><td>hygiene factors (salary, policy, supervision, working conditions) prevent dissatisfaction; motivators (achievement, recognition, responsibility, growth) create satisfaction<\/td><\/tr><tr><td>McGregor<\/td><td>Theory X (people dislike work and need control) and Theory Y (people are self-directed)<\/td><\/tr><tr><td>Others<\/td><td>Vroom's expectancy theory; McClelland's needs (achievement, power, affiliation); Adams's equity theory<\/td><\/tr><tr><td>Financial and non-financial incentives<\/td><td>pay, bonus, increment, profit-sharing / recognition, promotion, job security, participation, training<\/td><\/tr><\/table><\/div><h3 id=\"c37-s5\">36.5 Communication, coordination, control<\/h3><ul><li>Communication process: sender → encoding → message → channel → receiver → decoding → <b>feedback<\/b>. Without feedback, communication is incomplete.<\/li><li>Directions: downward (orders, circulars), upward (reports, appeals), horizontal (between equals), diagonal. Formal channels follow the hierarchy; the informal channel is the grapevine.<\/li><li>Media: written (letter, memo, notice, report, e-mail — permanent record), oral (meeting, telephone — quick), non-verbal (gesture, tone).<\/li><li>Barriers: semantic (language), psychological, organisational (too many levels), physical (noise, distance). The <b>7 Cs<\/b>: clear, concise, concrete, correct, coherent, complete, courteous.<\/li><li>Coordination techniques: clear objectives, chain of command, meetings and committees, liaison officers, good communication.<\/li><li>Control process: set standards → measure → compare → correct. Tools: budget, audit, reports, inspection, MIS, key performance indicators. Public bodies in Bangladesh sign an <b>Annual Performance Agreement (APA)<\/b> with their ministry and follow the <b>National Integrity Strategy (শুদ্ধাচার কৌশল)<\/b>, a <b>Citizen's Charter (সেবা প্রদান প্রতিশ্রুতি)<\/b>, a <b>Grievance Redress System (GRS)<\/b> and innovation plans — all of which appear on Petrobangla's website and are part of an administrative officer's routine reporting.<\/li><\/ul><h3 id=\"c37-s6\">36.6 Human resource management<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Function<\/th><th>Content<\/th><\/tr><tr><td>HR planning<\/td><td>forecasting how many people of which skills are needed<\/td><\/tr><tr><td>Job analysis<\/td><td>job description (duties) and job specification (qualifications)<\/td><\/tr><tr><td><b>Recruitment<\/b><\/td><td>attracting candidates — internal (promotion, transfer) and external (advertisement) sources; a \"positive\" process<\/td><\/tr><tr><td><b>Selection<\/b><\/td><td>choosing among candidates — application, written test, interview, medical test, verification, appointment; a \"negative\" (eliminating) process<\/td><\/tr><tr><td>Placement and induction<\/td><td>posting; orientation of the new employee<\/td><\/tr><tr><td>Training and development<\/td><td>on-the-job (coaching, job rotation, apprenticeship) and off-the-job (lecture, case study, simulation); training improves present skills, development prepares for future roles<\/td><\/tr><tr><td><b>Performance appraisal<\/b><\/td><td>systematic evaluation; in public bodies the Annual Confidential Report (ACR, গোপনীয় অনুবেদন), now being replaced in government by APAR; methods: rating scale, ranking, MBO, 360-degree feedback<\/td><\/tr><tr><td>Compensation<\/td><td>pay scale, increment, allowances, bonus, provident fund, gratuity, pension<\/td><\/tr><tr><td>Promotion, transfer, separation<\/td><td>on seniority and/or merit; retirement, resignation, dismissal<\/td><\/tr><tr><td>Discipline and grievance<\/td><td>rules of conduct; fair procedure; progressive discipline<\/td><\/tr><tr><td>Probation<\/td><td>a trial period (শিক্ষানবিশকাল) before confirmation — normally two years for directly recruited officers in public bodies<\/td><\/tr><\/table><\/div><h3 id=\"c37-s7\">36.7 Office management<\/h3><p>An office is the information centre of an organisation: it receives, records, processes, stores and supplies information. Office management is the planning, organising and controlling of office work.<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Topic<\/th><th>Content<\/th><\/tr><tr><td>Functions of an office<\/td><td>receiving, recording, arranging, analysing and giving information; safeguarding assets; public relations<\/td><\/tr><tr><td>Layout<\/td><td>open office (economical, easy supervision, noisy) and private office (privacy, costly)<\/td><\/tr><tr><td><b>Receipt and despatch<\/b><\/td><td>incoming letters are entered in a receipt (diary) register and marked to the dealing officer; outgoing letters are entered in a despatch (issue) register with a memo/reference number<\/td><\/tr><tr><td><b>Filing<\/b><\/td><td>systematic preservation of records so that they can be found quickly. Classification: alphabetical, numerical, alphanumeric, subject-wise, geographical, chronological. Methods: horizontal (flat) and vertical (upright in folders; modern, quick). Centralised or departmental filing<\/td><\/tr><tr><td><b>Indexing<\/b><\/td><td>the guide to the files — page index, card index, visible index, computer index<\/td><\/tr><tr><td>Qualities of good filing<\/td><td>simplicity, accessibility, economy, safety, flexibility, suitable classification, cross-reference<\/td><\/tr><tr><td><b>Records management<\/b><\/td><td>creation → use → storage → retention → disposal. In government practice records are classified by retention: permanent (ক-শ্রেণি), 10 years or more (খ), 3–5 years (গ), up to 1 year (ঘ) — the classes under the Secretariat Instructions, 2014<\/td><\/tr><tr><td>A file in government practice<\/td><td>has two parts: the <b>note portion<\/b> (নোটাংশ — where the case is examined and orders are written) and the <b>correspondence portion<\/b> (পত্রাংশ — letters received and copies of letters issued); pages are numbered; each file has a unique number<\/td><\/tr><tr><td><b>Noting<\/b><\/td><td>a note states the facts, the rule or precedent, the points for decision and a proposal; paragraphs are numbered; it is signed with date and designation and submitted upward<\/td><\/tr><tr><td><b>Drafting<\/b><\/td><td>preparing the letter that will issue once the note is approved: reference, subject, body, signature block, copy list<\/td><\/tr><tr><td>Digital office<\/td><td>e-Nothi/D-Nothi (electronic file system), official e-mail, e-GP, biometric attendance, document scanning, digital signature<\/td><\/tr><\/table><\/div><h4>Forms of official communication<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Form<\/th><th>Use<\/th><\/tr><tr><td>Official letter (সরকারি পত্র)<\/td><td>formal communication to another office or person; memo number, date, subject<\/td><\/tr><tr><td>Demi-official (D.O.) letter (আধা-সরকারি পত্র)<\/td><td>from one officer to another by name, in a personal tone, to draw attention to a matter<\/td><\/tr><tr><td>Office memorandum (অফিস স্মারক)<\/td><td>between offices on routine matters; written in the third person<\/td><\/tr><tr><td>Office order (অফিস আদেশ)<\/td><td>internal instructions: posting, leave, assignment of duties<\/td><\/tr><tr><td>Notification / gazette (প্রজ্ঞাপন)<\/td><td>rules, appointments and orders published in the official Gazette<\/td><\/tr><tr><td>Circular (পরিপত্র)<\/td><td>the same instruction sent to many offices<\/td><\/tr><tr><td>Notice (বিজ্ঞপ্তি/নোটিশ)<\/td><td>information for employees or the public<\/td><\/tr><tr><td>Press release (প্রেস বিজ্ঞপ্তি)<\/td><td>information for the media<\/td><\/tr><tr><td>Endorsement (পৃষ্ঠাঙ্কন)<\/td><td>forwarding a copy with \"copy forwarded for information and necessary action\"<\/td><\/tr><tr><td>Resolution (সিদ্ধান্ত প্রস্তাব)<\/td><td>a formal decision of a board or committee<\/td><\/tr><tr><td>Summary (সারসংক্ষেপ)<\/td><td>a brief of a case submitted to a higher authority for decision<\/td><\/tr><\/table><\/div><h4>Meetings<\/h4><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Term<\/th><th>Meaning<\/th><\/tr><tr><td>Notice<\/td><td>written intimation of date, time, place and business; sent in advance<\/td><\/tr><tr><td><b>Agenda<\/b> (আলোচ্যসূচি)<\/td><td>the list of items to be discussed<\/td><\/tr><tr><td><b>Quorum<\/b> (কোরাম)<\/td><td>the minimum number of members who must be present for the meeting to be valid<\/td><\/tr><tr><td>Chairperson<\/td><td>conducts the meeting; may have a casting vote in a tie<\/td><\/tr><tr><td>Motion and resolution<\/td><td>a proposal put to the meeting; when adopted it becomes a resolution<\/td><\/tr><tr><td><b>Minutes<\/b> (কার্যবিবরণী)<\/td><td>the official written record of proceedings and decisions; confirmed at the next meeting and signed by the chairperson<\/td><\/tr><tr><td>Proxy<\/td><td>a person authorised to attend and vote for a member<\/td><\/tr><tr><td>Adjournment<\/td><td>postponement to another time<\/td><\/tr><tr><td>Types<\/td><td>board meeting, annual general meeting (AGM), extraordinary general meeting (EGM), committee meeting<\/td><\/tr><\/table><\/div><p>Minutes should record: name of the body, date, time, place; who presided; members present; confirmation of previous minutes; each agenda item with a short discussion and the <b>decision<\/b>, the person responsible and the deadline; closing; signature.<\/p><h4>Reports<\/h4><p>A report is an orderly statement of facts, with findings and recommendations, for a specific reader. Qualities: accuracy, clarity, brevity, objectivity, completeness. Structure: title → terms of reference → method → findings → conclusions → recommendations → signature and date → appendices. Types: routine (monthly, annual) and special (inquiry, feasibility).<\/p><h3 id=\"c37-s8\">36.8 Ethics, public relations and time management<\/h3><ul><li><b>Workplace ethics:<\/b> integrity, impartiality, accountability, transparency, confidentiality, punctuality, respect, avoidance of conflicts of interest, refusing gifts in connection with official work. Conflict of interest arises when a private interest could influence an official decision.<\/li><li><b>Good governance<\/b> (UNDP's characteristics): participation, rule of law, transparency, responsiveness, consensus, equity, effectiveness and efficiency, accountability.<\/li><li><b>Public relations:<\/b> planned effort to build goodwill with customers, media, government and the community — press releases, annual reports, websites, hotlines, complaint handling, CSR.<\/li><li><b>Time management:<\/b> set priorities (Eisenhower matrix: urgent/important), plan the day, delegate, avoid procrastination, handle each paper once, keep meetings short. Pareto's 80/20 rule: 20% of tasks produce 80% of results.<\/li><\/ul><h3 id=\"c37-s9\">36.9 Which laws apply to Petrobangla's officers?<\/h3><p>This question is easy to get wrong. Three layers must be kept apart.<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Layer<\/th><th>What it is, and how it applies<\/th><\/tr><tr><td><b>1. Statute creating the body<\/b><\/td><td>The Bangladesh Oil, Gas and Mineral Corporation Act, 2022 makes Petrobangla a body corporate and empowers it to make regulations (প্রবিধান) for the service of its employees. Petrobangla's officers are <b>employees of a statutory public corporation<\/b>; they are public servants, but they are <b>not<\/b> \"government servants\" of the civil service and do not belong to a BCS cadre.<\/td><\/tr><tr><td><b>2. The body's own service regulations<\/b><\/td><td>Appointment, conduct, discipline, leave, promotion and retirement of Petrobangla's staff are governed by its own <b>service regulations<\/b> and by the recruitment policy of 2016 and the Central Selection Policy 2023 (amended 2026). The <b>companies<\/b> are registered under the Companies Act, 1994 and each has its own service rules approved by its board. The website lists \"Service Rules and Delegation\".<\/td><\/tr><tr><td><b>3. General government rules<\/b><\/td><td>The Government Servants (Conduct) Rules, 1979 and the Government Servants (Discipline and Appeal) Rules, 2018 are made for civil servants under the Government Service Act, 2018. They do <b>not apply automatically<\/b> to corporation or company employees; but corporations' own conduct and discipline regulations are closely modelled on them, and government orders on pay scale, leave, quota and age limits are applied to corporations by adoption or direction — the 2026 circular itself cites the Ministry of Public Administration's rules for age and quota.<\/td><\/tr><tr><td>Laws that apply to every public body<\/td><td>The Constitution; Public Procurement Act and Rules; Right to Information Act, 2009; Anti-Corruption Commission Act, 2004; Public Interest Information Disclosure (Protection) Act, 2011; ICT and cyber-security law; Public Corporations (Management Co-ordination) Ordinance, 1986; audit by the Comptroller and Auditor-General<\/td><\/tr><tr><td>Labour law<\/td><td>The Bangladesh Labour Act, 2006 protects <b>workers<\/b>; it excludes persons employed mainly in a managerial or administrative capacity. In the companies it governs workers and trade unions (CBA); an Assistant Manager administers it rather than being covered by it<\/td><\/tr><\/table><\/div><div class=\"bx bx-key\"><div class=\"bxh\">KEY FACT: The safe sentence for a viva<\/div><p class=\"\">\"Petrobangla is a statutory corporation under the Act of 2022. Its officers are governed by the corporation's own service regulations, which follow the pattern of the government conduct and discipline rules; the companies under it are governed by the Companies Act and their own service rules; and general laws such as the Public Procurement Act and the Right to Information Act apply to all of them.\"<\/p><\/div><h3 id=\"c37-s10\">36.10 Conduct rules — the provisions worth knowing<\/h3><p>The Government Servants (Conduct) Rules, 1979 (the model for corporate conduct regulations) provide, among other things:<\/p><ul><li><b>Gifts:<\/b> no gift may be accepted, by the employee or family, from persons with whom there are official dealings, without permission; gifts above a small value must be reported. Foreign awards require approval.<\/li><li><b>Property:<\/b> a declaration of assets on entry into service and periodically; permission for acquiring or disposing of immovable property above a prescribed value; no construction of a building without informing the authority of the source of funds.<\/li><li><b>Money matters:<\/b> no lending or borrowing with persons under one's authority or having official dealings; no speculation in investments; no private trade or employment without permission.<\/li><li><b>Politics:<\/b> no membership of or assistance to a political party; no canvassing in elections; no participation in strikes or demonstrations against the government.<\/li><li><b>Communication:<\/b> no unauthorised disclosure of official documents or information to the press or outsiders; no public criticism of government policy; prior permission for broadcasts and publications on official matters.<\/li><li><b>Others:<\/b> no approaching Members of Parliament or outsiders to influence service matters; no nepotism or favouritism; no sexual harassment; no dowry; no insolvency or habitual indebtedness; behave courteously to the public.<\/li><\/ul><h3 id=\"c37-s11\">36.11 Discipline and appeal — the procedure<\/h3><p>The Government Servants (Discipline and Appeal) Rules, 2018 replaced the 1985 Rules. Corporate regulations follow the same scheme.<\/p><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Content<\/th><\/tr><tr><td>Grounds for penalty<\/td><td>inefficiency (অদক্ষতা); <b>misconduct<\/b> (অসদাচরণ) — conduct prejudicial to discipline, breach of the conduct rules, disobedience, negligence of duty; <b>desertion<\/b> (পলায়ন) — absence without leave for 60 days or more; <b>corruption<\/b> (দুর্নীতি); subversive activity (নাশকতা)<\/td><\/tr><tr><td>Minor penalties (লঘুদণ্ড)<\/td><td>censure (তিরস্কার); withholding of promotion or increment for a fixed period; recovery from pay of loss caused; reduction to a lower stage in the pay scale<\/td><\/tr><tr><td>Major penalties (গুরুদণ্ড)<\/td><td>reduction to a lower grade or post; <b>compulsory retirement<\/b> (বাধ্যতামূলক অবসর); <b>removal from service<\/b> (অপসারণ — no bar to future employment); <b>dismissal<\/b> (বরখাস্ত — a bar to future government employment)<\/td><\/tr><tr><td>Procedure for a major penalty<\/td><td>written charge with a statement of allegations → <b>show-cause notice<\/b> (written reply normally within 10 working days) → personal hearing if requested → inquiry officer or board → report → second show-cause notice on the proposed penalty → order<\/td><\/tr><tr><td>Suspension (সাময়িক বরখাস্ত)<\/td><td>not a penalty; the employee draws subsistence allowance<\/td><\/tr><tr><td>Appeal and review<\/td><td>appeal to the next higher authority within the prescribed time (three months under the government rules); review by the President in government cases<\/td><\/tr><tr><td>Natural justice<\/td><td>no one may be punished unheard (audi alteram partem); no one may be a judge in his own cause — also reflected in Article 135 of the Constitution for civil servants<\/td><\/tr><\/table><\/div><div class=\"bx bx-tip\"><div class=\"bxh\">EXAM TIP: Link with the written paper<\/div><p class=\"\">The Bakhrabad 2021 written question — a show-cause letter to a subordinate who is habitually late — is this procedure in miniature. Habitual late attendance is <b>misconduct<\/b>. The letter must state the facts, cite the rule, give a time to reply and warn of the consequence (model in Chapter 10).<\/p><\/div><h3 id=\"c37-s12\">36.12 Public procurement<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Content<\/th><\/tr><tr><td>Law<\/td><td><b>Public Procurement Act, 2006<\/b> (Act No. 24 of 2006) and the Public Procurement Rules, 2008; the rules were substantially revised in 2025 (Public Procurement Rules, 2025) following amendment of the Act — check the current text<\/td><\/tr><tr><td>Applies to<\/td><td>procurement of goods, works and services with public funds by ministries, departments, <b>statutory corporations and government-owned companies<\/b> — so it binds Petrobangla and its companies<\/td><\/tr><tr><td>Authority<\/td><td>the Central Procurement Technical Unit (CPTU) of the IME Division, reconstituted as the <b>Bangladesh Public Procurement Authority (BPPA)<\/b> under an Act of 2023<\/td><\/tr><tr><td>Objectives<\/td><td>transparency, accountability, fair competition, equal treatment, value for money<\/td><\/tr><tr><td><b>e-GP<\/b><\/td><td>electronic government procurement portal (introduced 2011); tendering online<\/td><\/tr><tr><td>Methods for goods and works<\/td><td><b>Open Tendering Method (OTM)<\/b> — the preferred method; Limited Tendering (LTM); Two-Stage Tendering; <b>Direct Procurement (DPM)<\/b> — only in specified circumstances; <b>Request for Quotation (RFQ)<\/b> — low-value, off-the-shelf items; international competitive tendering (ICT)<\/td><\/tr><tr><td>Methods for consultancy<\/td><td>Quality and Cost Based Selection (QCBS), Fixed Budget, Least Cost, Selection Based on Consultants' Qualifications, single source<\/td><\/tr><tr><td>Key terms<\/td><td><b>APP<\/b> — annual procurement plan; <b>PE<\/b> — procuring entity; <b>HOPE<\/b> — head of the procuring entity; <b>TOC<\/b> — tender opening committee; <b>TEC<\/b> — tender evaluation committee; tender security; performance security; <b>NOA<\/b> — notification of award; framework contract; debarment<\/td><\/tr><tr><td>Principles in evaluation<\/td><td>only criteria stated in the tender document may be used; the lowest <b>evaluated responsive<\/b> tender wins; complaints go through an administrative ladder to an independent Review Panel<\/td><\/tr><tr><td>Offences<\/td><td>collusion, fraud, coercion and corrupt practice lead to rejection and debarment<\/td><\/tr><\/table><\/div><h3 id=\"c37-s13\">36.13 Right to Information Act, 2009<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Content<\/th><\/tr><tr><td>Law<\/td><td>Act No. 20 of 2009; in force 1 July 2009; overrides inconsistent provisions of other laws<\/td><\/tr><tr><td>Right<\/td><td>every citizen has the right to information from an \"authority\"; authorities include constitutional and statutory bodies, government offices and organisations funded by the government or foreign aid<\/td><\/tr><tr><td>Proactive disclosure<\/td><td>each authority must publish its structure, functions, decisions, budget and services and an annual report<\/td><\/tr><tr><td><b>Designated officer<\/b> (দায়িত্বপ্রাপ্ত কর্মকর্তা)<\/td><td>each unit appoints one; Petrobangla's website lists its designated and appellate officers<\/td><\/tr><tr><td>Time limits<\/td><td>information within <b>20 working days<\/b>; <b>30<\/b> if more than one unit is involved; a refusal must be communicated within 10 working days; within <b>24 hours<\/b> where life, death, arrest or release from jail is concerned<\/td><\/tr><tr><td>Appeal<\/td><td>to the appellate authority within 30 days; to be disposed of within 15 days<\/td><\/tr><tr><td>Complaint<\/td><td>to the <b>Information Commission<\/b> (a Chief Information Commissioner and two Commissioners, at least one a woman)<\/td><\/tr><tr><td>Exemptions (section 7)<\/td><td>information harming national security, foreign relations, commercial secrets, privacy, investigation, court proceedings and similar; eight security and intelligence agencies are excluded except for corruption and human-rights matters<\/td><\/tr><tr><td>Penalty<\/td><td>fine of Tk 50 a day up to Tk 5,000 on a defaulting officer; departmental action may be recommended<\/td><\/tr><\/table><\/div><h3 id=\"c37-s14\">36.14 Other laws in brief<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Law<\/th><th>What to know<\/th><\/tr><tr><td><b>Bangladesh Labour Act, 2006<\/b> (Act 42 of 2006) and Labour Rules, 2015<\/td><td>consolidated 25 earlier labour laws. Working hours 8 a day and 48 a week (up to 10 and 60 with overtime at twice the basic rate); weekly holiday; casual leave 10 days, sick leave 14 days, festival holidays 11 days, annual leave one day for every 18 days worked; maternity benefit (16 weeks under the Act as long in force; lengthened by later amendment — check); no child below 14 to be employed; appointment letter and identity card; termination with notice; trade unions and collective bargaining agent (CBA); participation committee; 5% of net profit to the Workers' Profit Participation and Welfare Funds; labour courts and the Labour Appellate Tribunal. The Act was extensively amended in 2025–26 — check current provisions<\/td><\/tr><tr><td><b>Companies Act, 1994<\/b> (Act 18 of 1994)<\/td><td>registration with the Registrar of Joint Stock Companies and Firms (RJSC). Private limited company: 2–50 members, at least 2 directors; public limited company: at least 7 members, at least 3 directors; one-person company added in 2020. Constitutional documents: <b>Memorandum of Association<\/b> (objects and powers — the company's charter) and <b>Articles of Association<\/b> (internal rules). Annual general meeting every calendar year, not more than 15 months apart; statutory audit; a company is a separate legal person with perpetual succession and limited liability. Petrobangla's companies are government-owned companies under this Act<\/td><\/tr><tr><td><b>Bangladesh Energy Regulatory Commission Act, 2003<\/b> (Act 13 of 2003)<\/td><td>creates BERC — a chairman and four members; licences for generation, transmission, distribution and marketing of energy; <b>tariff determination after public hearing<\/b>; consumer protection; dispute settlement. A 2023 amendment had allowed the government to set prices in special circumstances; that power was withdrawn in 2024, returning tariff-setting to the Commission<\/td><\/tr><tr><td><b>Bangladesh Gas Act, 2010<\/b><\/td><td>governs transmission, distribution, marketing, supply and storage of gas; penalties for illegal connection, meter tampering and unauthorised use<\/td><\/tr><tr><td><b>ICT Act, 2006<\/b><\/td><td>legal recognition of electronic records and digital signatures; Controller of Certifying Authorities; the controversial section 57 was repealed in 2018<\/td><\/tr><tr><td><b>Anti-Corruption Commission Act, 2004<\/b><\/td><td>independent commission; inquiry and investigation of scheduled offences, including by employees of statutory bodies<\/td><\/tr><tr><td><b>Public Interest Information Disclosure (Protection) Act, 2011<\/b><\/td><td>protects whistle-blowers<\/td><\/tr><tr><td><b>Government Service Act, 2018<\/b> (সরকারি চাকরি আইন)<\/td><td>the framework law for civil servants (in force 1 October 2019); amended by ordinance in 2025; applies to government servants, not directly to corporation employees<\/td><\/tr><tr><td><b>National Pay Scale, 2015<\/b><\/td><td>20 grades. The policy's schedule quotes Tk 22,000–53,060 for Grade 9, the 2015 scale, whereas the 2026 circular prints Tk 44,000–1,05,900 for the same grade. Use the circular's figure for the current recruitment and check the latest pay order before a viva<\/td><\/tr><\/table><\/div><h3 id=\"c37-s15\">36.15 Practice quiz<\/h3><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 1. Who is called the father of modern (administrative) management? (a) F. W. Taylor (b) Henri Fayol (c) Max Weber (d) Elton Mayo<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 2. \"Each subordinate should receive orders from one superior only\" is — (a) unity of direction (b) scalar chain (c) unity of command (d) span of control<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 3. Which function of management comes first? (a) organising (b) controlling (c) planning (d) staffing<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 4. In Maslow's hierarchy the highest need is — (a) esteem (b) safety (c) social (d) self-actualisation<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 5. The minimum number of members required to hold a valid meeting is the — (a) agenda (b) quorum (c) proxy (d) minutes<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 6. Which cannot be delegated? (a) authority (b) work (c) responsibility (d) power to sign<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 7. Under the Right to Information Act, 2009, information must ordinarily be supplied within — (a) 10 working days (b) 15 working days (c) 20 working days (d) 30 days<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 8. Which is the preferred method of procurement under the Public Procurement Act? (a) DPM (b) RFQ (c) OTM (d) LTM<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 9. Which of these is a major penalty? (a) censure (b) withholding of increment (c) compulsory retirement (d) recovery of loss from pay<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 10. The document that defines the objects and powers of a company is the — (a) Articles of Association (b) Memorandum of Association (c) prospectus (d) certificate of incorporation<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 11. In a government file, the part in which a case is examined and orders are recorded is the — (a) correspondence portion (b) note portion (c) index (d) despatch register<\/p><p class=\"pq\"><span class=\"tg tg-new\">NEW<\/span> 12. POSDCORB was coined by — (a) Gulick (b) Fayol (c) Drucker (d) Herzberg<\/p><p class=\"pa\">Answers: 1 b · 2 c · 3 c · 4 d · 5 b · 6 c · 7 c · 8 c · 9 c · 10 b · 11 b · 12 a.<\/p><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 36<\/div><p class=\"li\">Functions: planning, organising, staffing, directing, coordinating, controlling. Fayol — 14 principles; Taylor — scientific management; Gulick — POSDCORB.<\/p><p class=\"li\">Authority can be delegated; responsibility cannot. Unity of command ≠ unity of direction.<\/p><p class=\"li\">File = note portion + correspondence portion. Agenda, quorum, minutes.<\/p><p class=\"li\">Petrobangla's officers: statutory-corporation employees under the 2022 Act and its service regulations; government conduct and discipline rules are the model, not automatically the law.<\/p><p class=\"li\">Minor penalties: censure, withholding increment/promotion, recovery, lower stage. Major: lower grade, compulsory retirement, removal, dismissal.<\/p><p class=\"li\">PPA 2006: OTM preferred; e-GP; TEC; APP. RTI 2009: 20 working days; appeal 30 days; Information Commission.<\/p><\/div>"},{"id":"c38","no":37,"part":"PART F — PETROBANGLA, ENERGY AND ADMINISTRATION","title":"Chapter 37: Current Affairs Revision File","short":"Current Affairs Revision File","toc":[["c38-s1","37.1 What the 2024 paper tells you about current affairs"],["c38-s2","37.2 Bangladesh — government and politics"],["c38-s3","37.3 Bangladesh — economy"],["c38-s4","37.4 Energy sector — 2026"],["c38-s5","37.5 The world — items of lasting examination value"],["c38-s6","37.6 The disputed current-affairs items of the 2024 paper"],["c38-s7","37.7 A one-page checklist for the last week"]],"html":"<div class=\"bx bx-ver\"><div class=\"bxh\">EVIDENCE STATUS: How to use this chapter<\/div><p class=\"\">Every item below carries the date to which it is correct. The chapter was closed on <b>16 November 2026<\/b>. It is printed as a separate file on purpose: strike out and rewrite entries as news changes. Items marked \"check\" could not be confirmed when the book was prepared; do not rely on them.<\/p><\/div><h3 id=\"c38-s1\">37.1 What the 2024 paper tells you about current affairs<\/h3><p>The 22 November 2024 paper contained about nine current-affairs MCQs, all from the preceding <b>three to ten months<\/b>: the Tangail-saree GI dispute (February 2024), Sweden's entry to NATO (March 2024), the Mpox emergency (August 2024), the Paris Olympics (July–August 2024), the Hamas leadership (August–October 2024), Boeing's Starliner (June 2024), and Professor Yunus's \"Three Zeros\" (interim government, August 2024). The lesson: <b>study January to the examination month of the current year<\/b>, with weight on Bangladesh's own headline events, big sports events, deaths and appointments of world figures, and science-and-space news.<\/p><h3 id=\"c38-s2\">37.2 Bangladesh — government and politics<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Position (date)<\/th><\/tr><tr><td>July uprising and interim government<\/td><td>student-led mass uprising, July–August 2024; fall of the Awami League government 5 August 2024; interim government under Chief Adviser Professor Muhammad Yunus from 8 August 2024<\/td><\/tr><tr><td>July National Charter<\/td><td>reform charter signed by political parties in 2025; implementation order issued by the President on 13 November 2025<\/td><\/tr><tr><td>13th parliamentary election and referendum<\/td><td>held together in February 2026; the BNP won a two-thirds majority; in the referendum \"Yes\" won with about 4.81 crore votes against 2.26 crore, turnout 60.26% (Election Commission figures as reported)<\/td><\/tr><tr><td>Government<\/td><td>Prime Minister <b>Tarique Rahman<\/b>; the cabinet took office on <b>17 February 2026<\/b><\/td><\/tr><tr><td>Finance Minister<\/td><td>Amir Khosru Mahmud Chowdhury (presented the FY2026-27 budget, June 2026)<\/td><\/tr><tr><td>Minister, Power, Energy and Mineral Resources<\/td><td><b>Iqbal Hasan Mahmud (Tuku)<\/b>; State Minister Anindya Islam Amit (cabinet list, February 2026)<\/td><\/tr><tr><td>Chairman, Petrobangla<\/td><td>Md Abdul Mannan (additional charge) — as signed in the gazette of 5 October 2026<\/td><\/tr><tr><td>President; Speaker; Chief Justice; Chief Election Commissioner<\/td><td><b>check<\/b> the current holders in the week before the examination<\/td><\/tr><tr><td>Upper house<\/td><td>proposed 100-member second chamber under the Charter — implementation disputed as of mid-2026; <b>check<\/b><\/td><\/tr><\/table><\/div><h3 id=\"c38-s3\">37.3 Bangladesh — economy<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Position (date)<\/th><\/tr><tr><td>Budget FY2026-27<\/td><td>Tk 9,38,000 crore — the largest ever and the BNP's first in 20 years; deficit Tk 2,43,000 crore (3.6% of GDP); previous year's budget Tk 7,90,000 crore (June 2026)<\/td><\/tr><tr><td>Per capita income<\/td><td>US$ 3,020 — above $3,000 for the first time (BBS provisional, FY2025-26, 10 June 2026)<\/td><\/tr><tr><td>GDP growth; size<\/td><td>4.14% (FY2025-26 provisional); about US$ 501 billion<\/td><\/tr><tr><td>LDC graduation<\/td><td><b>deferred to 24 November 2029<\/b> by a UN General Assembly resolution in 2026; the government had sought a three-year deferral immediately after taking office<\/td><\/tr><tr><td>Ganges Water Treaty<\/td><td>the 30-year treaty of 12 December 1996 expires in December 2026 — renewal talks are a live issue; <b>check<\/b> the outcome<\/td><\/tr><tr><td>Reserves, inflation, exchange rate, export and remittance totals<\/td><td>change monthly — <b>check<\/b> Bangladesh Bank figures<\/td><\/tr><\/table><\/div><h3 id=\"c38-s4\">37.4 Energy sector — 2026<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Position (date)<\/th><\/tr><tr><td>Recruitment<\/td><td>753 officer posts in Grades 9–10 across Petrobangla and its companies; circular 29 September 2026; applications to 17 November 2026<\/td><\/tr><tr><td>Selection policy<\/td><td>Central Selection Policy 2023 (amended 2026), gazetted 5 October 2026<\/td><\/tr><tr><td>Gas reserve<\/td><td>7.63 Tcf remaining on 1 January 2026 of 29.74 Tcf recoverable (statement in Parliament, 2026)<\/td><\/tr><tr><td>Supply and demand<\/td><td>supply about 2,700 MMcfd; LNG about 1,100 MMcfd (41%); demand about 3,800 MMcfd (early November 2026)<\/td><\/tr><tr><td>Drilling<\/td><td>150 wells targeted by 2031; 11 wells completed since February 2026 (November 2026)<\/td><\/tr><tr><td>Offshore Bidding Round 2026<\/td><td>launched 24 May 2026; 26 blocks (11 shallow, 15 deep); Offshore Model PSC 2026; bids due 30 November 2026 — <b>check<\/b> how many bids were received<\/td><\/tr><tr><td>FSRU maintenance<\/td><td>one of the two Moheshkhali FSRUs was shut for maintenance on 4–7 November 2026, cutting LNG supply temporarily<\/td><\/tr><tr><td>Special Provisions Act, 2010<\/td><td>the \"quick supply\" law allowing unsolicited contracts was repealed by ordinance in November 2024<\/td><\/tr><\/table><\/div><h3 id=\"c38-s5\">37.5 The world — items of lasting examination value<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Item<\/th><th>Position (date)<\/th><\/tr><tr><td>United States<\/td><td>Donald Trump inaugurated as the 47th President on 20 January 2025; Vice-President J. D. Vance<\/td><\/tr><tr><td>United Nations<\/td><td>Secretary-General António Guterres's term ends 31 December 2026; <b>check<\/b> the name of the successor chosen in 2026<\/td><\/tr><tr><td>Catholic Church<\/td><td>Pope Francis died on 21 April 2025; Pope <b>Leo XIV<\/b> (Robert Prevost, the first pope from the United States) elected 8 May 2025<\/td><\/tr><tr><td>Syria<\/td><td>fall of Bashar al-Assad, 8 December 2024<\/td><\/tr><tr><td>NATO<\/td><td>32 members; Sweden the 32nd (7 March 2024)<\/td><\/tr><tr><td>ASEAN<\/td><td>Timor-Leste admitted as the 11th member (October 2025)<\/td><\/tr><tr><td>BRICS<\/td><td>enlarged in 2024–25; Indonesia joined in January 2025<\/td><\/tr><tr><td>Climate<\/td><td>COP29 Baku (November 2024); COP30 Belém, Brazil (November 2025); <b>check<\/b> the venue and outcome of COP31 (November 2026)<\/td><\/tr><tr><td>Nobel Peace Prize<\/td><td>2024 Nihon Hidankyo (Japan); 2025 María Corina Machado (Venezuela); <b>check<\/b> 2026<\/td><\/tr><tr><td>Nobel Prize in Literature<\/td><td>2024 Han Kang (South Korea); 2025 László Krasznahorkai (Hungary); <b>check<\/b> 2026<\/td><\/tr><tr><td>Sport<\/td><td>Paris Olympics 2024 (USA topped the table); T20 World Cup 2024 — India; Champions Trophy 2025 — India; FIFA Club World Cup 2025 — Chelsea; <b>FIFA World Cup 2026<\/b> (USA, Canada, Mexico; 48 teams; June–July 2026) — <b>check<\/b> the champion, runner-up, Golden Ball and Golden Boot, which are near-certain questions; Los Angeles Olympics 2028<\/td><\/tr><tr><td>Science and technology<\/td><td>artificial intelligence (generative AI, large language models); India's Chandrayaan-3 landed near the Moon's south pole (August 2023); Boeing Starliner's crewed test flight (June 2024); Mpox declared a public health emergency of international concern (August 2024)<\/td><\/tr><\/table><\/div><h3 id=\"c38-s6\">37.6 The disputed current-affairs items of the 2024 paper<\/h3><div class=\"tablewrap\"><table class=\"bt\"><tr><th>Question<\/th><th>Position<\/th><\/tr><tr><td>\"Current Chairman of the Political Bureau of Hamas\" — Ismail Haniyeh / Abu Ubaida / Yahya Sinwar / Khalil al-Hayya / None<\/td><td>Haniyeh was killed in Tehran on 31 July 2024; <b>Yahya Sinwar<\/b> was named on 6 August 2024 and was killed on 16 October 2024. On the examination date no single successor had been named. Archives mark Sinwar; strictly, \"None\" was correct on 22 November 2024<\/td><\/tr><tr><td>\"Recently which country has proposed a three-day weekend?\"<\/td><td>Archives mark <b>Saudi Arabia<\/b>; this could not be independently confirmed<\/td><\/tr><tr><td>\"Theme of the Paris Olympics 2024\" — Social business / …<\/td><td>Archives mark <b>social business<\/b>, referring to the social-business model promoted by Professor Yunus for the Games<\/td><\/tr><tr><td>\"Country severely affected by the recent Mpox outbreak\"<\/td><td>Democratic Republic of the <b>Congo<\/b><\/td><\/tr><tr><td>\"Newest member of NATO\"<\/td><td><b>Sweden<\/b><\/td><\/tr><\/table><\/div><h3 id=\"c38-s7\">37.7 A one-page checklist for the last week<\/h3><ul><li>Who holds which office in Bangladesh (President, Prime Minister, Speaker, Chief Justice, CEC, energy minister, Petrobangla chairman, Bangladesh Bank governor).<\/li><li>The latest budget size, per capita income, growth rate; LDC date (2029).<\/li><li>Gas: 29 fields, remaining reserve, LNG share, the offshore bidding result, any new field or well.<\/li><li>The football World Cup 2026 results; the 2026 Nobel laureates; the next UN Secretary-General; COP31.<\/li><li>Any new GI product, UNESCO listing, bridge, satellite or mega-project opening in Bangladesh.<\/li><li>Deaths, awards and appointments of prominent people in the last three months.<\/li><\/ul><div class=\"bx bx-rev\"><div class=\"bxh\">QUICK REVISION: Chapter 37<\/div><p class=\"li\">Study the last ten months before the examination; weight Bangladesh, sport, appointments, science.<\/p><p class=\"li\">17 February 2026: new government; Prime Minister Tarique Rahman. Budget FY27: Tk 9.38 lakh crore. Per capita income: $3,020. LDC graduation: 24 November 2029.<\/p><p class=\"li\">Energy: 7.63 Tcf remaining (1 January 2026); LNG about 41% of supply; Offshore Bidding Round 2026, 26 blocks.<\/p><p class=\"li\">Fill in every \"check\" item yourself in the final week.<\/p><\/div>"},{"id":"c39","no":38,"part":"PART G — QUESTION BANK","title":"Chapter 38: The Three Petrobangla Assistant Manager Papers","short":"The Three Petrobangla Assistant Manager Papers","toc":[["c39-s1","How to use this chapter"],["c39-s2","38.1 Petrobangla — Assistant Manager, 22 November 2024 (IBA, University of Dhaka)"],["c39-s3","38.2 Petrobangla — Assistant Manager, 2016"],["c39-s4","38.3 Petrobangla — Assistant Manager (General), 5 August 2011"],["c39-s5","38.4 Answer key and explanations — 2024 paper"],["c39-s6","38.5 Answer key and explanations — 2016 paper"],["c39-s7","38.6 Answer key — 2011 paper"]],"html":"<h3 id=\"c39-s1\">How to use this chapter<\/h3><p>Sit each paper against the clock before you look at the key: 60 minutes for the 70 MCQs of 2024, 55 minutes for the 60 MCQs of 2016. The answer keys and explanations are in section 38.4 onwards. Every question here is an <span class=\"tg tg-actual\">ACTUAL<\/span> previous question; wording follows the source as far as the scans allowed. Questions from the related company papers are distributed through the subject chapters.<\/p><h3 id=\"c39-s2\">38.1 Petrobangla — Assistant Manager, 22 November 2024 (IBA, University of Dhaka)<\/h3><p class=\"sm\">Source: photograph of the original booklet (pages 1–3 and 7), a published solution of the mathematics section, and public question archives. Part I: 70 MCQs, 70 marks, options A–E. Q1–15 are reconstructed from an archive because the photograph of that page is illegible; where the options could not be recovered only the stem is given.<\/p><h4>Bangla (Q1–15)<\/h4><p class=\"pq\">1. 'নিনাদ' শব্দের সমার্থক শব্দ কোনটি?<\/p><p class=\"pq\">2. 'বারিধি' শব্দের সমার্থক শব্দ কোনটি?<\/p><p class=\"pq\">3. 'খপোত' শব্দের অর্থ কী?<\/p><p class=\"pq\">4. 'প্রসূন' শব্দের সমার্থক শব্দ কোনটি?<\/p><p class=\"pq\">5. 'Horizontal'-এর বাংলা পরিভাষা কোনটি?<\/p><p class=\"pq\">6. 'নিরাময়' শব্দের সন্ধি বিচ্ছেদ কোনটি?<\/p><p class=\"pq\">7. কোন বানানটি শুদ্ধ? (আনুষঙ্গিক শব্দের বিভিন্ন বানান)<\/p><p class=\"pq\">8. কোন বানানটি শুদ্ধ? (দেদীপ্যমান শব্দের বিভিন্ন বানান)<\/p><p class=\"pq\">9. কোন বানানটি শুদ্ধ? (অন্তঃসার শব্দের বিভিন্ন বানান)<\/p><p class=\"pq\">10. 'সাতকাহন' বাগধারার অর্থ কী?<\/p><p class=\"pq\">11. 'শিরে সংক্রান্তি' বাগধারার অর্থ কী?<\/p><p class=\"pq\">12. 'রামগরুড়ের ছানা' বাগধারার অর্থ কী?<\/p><p class=\"pq\">13. 'লেফাফা দুরস্ত' বাগধারার অর্থ কী?<\/p><p class=\"pq\">14. 'গণ্যমান্য' কোন সমাস?<\/p><p class=\"pq\">15. 'টাইফুন' কোন ভাষার শব্দ?<\/p><h4>English (Q16–30)<\/h4><p><i>Questions 16–23: choose the option that best completes the sentence.<\/i><\/p><p class=\"pq\">16. The negotiations reached a(n) ___ when both parties refused to compromise on critical issues, leaving the agreement in jeopardy.<\/p><p class=\"po\">(A) impasse (B) culmination (C) denouement (D) prelude (E) inception<\/p><p class=\"pq\">17. Despite the company's rapid growth and market expansion, its profits have remained relatively stagnant, largely because of an inability to control costs, which ___ rising steadily over the past three years.<\/p><p class=\"po\">(A) has been (B) is (C) have been (D) were (E) had been<\/p><p class=\"pq\">18. Although the scientist was initially ___ by the complexity of the data, he soon developed a theory that not only explained the results but also predicted outcomes.<\/p><p class=\"po\">(A) bewildered (B) intrigued (C) mollified (D) placated (E) exonerated<\/p><p class=\"pq\">19. The CEO's ___ approach to leadership alienated many of his subordinates, who felt stifled by his rigid policies and lack of empathy.<\/p><p class=\"po\">(A) autocratic (B) benevolent (C) laissez-faire (D) deferential (E) pragmatic<\/p><p class=\"pq\">20. The board of directors was unanimous in its decision, finding the plan both ___ and innovative.<\/p><p class=\"po\">(A) imprudent (B) provident (C) capricious (D) volatile (E) perfunctory<\/p><p class=\"pq\">21. In contrast to last year's model, the new electric car features a more efficient battery and a streamlined design, allowing it to travel farther on a single charge and ___ better in extreme weather conditions.<\/p><p class=\"po\">(A) perform (B) performs (C) performing (D) performed (E) None of these<\/p><p class=\"pq\">22. Although Simran was afraid of heights, she seemed to have no ___ about driving over bridges.<\/p><p class=\"po\">(A) enormity (B) qualms (C) imminence (D) resurrection (E) None of these<\/p><p class=\"pq\">23. Because of the ___ of reliable information, her report was comprised mostly of speculation.<\/p><p class=\"po\">(A) dearth (B) diatribe (C) myriad (D) juxtaposition (E) None of these<\/p><p><i>Questions 24–28: identify the part that contains an error; if there is none, choose (E).<\/i><\/p><p class=\"pq\">24. As far as (A) money is (B) concerned, I'd (C) like to be (D) rich. No error (E)<\/p><p class=\"pq\">25. The restaurant had (A) burgers, sandwiches (B), and pizzas; we ordered (C) the former (D). No error (E)<\/p><p class=\"pq\">26. None of us have (A) enough money to undertake (B) the project alone, so we had (C) to depend on (D) our parents. No error (E)<\/p><p class=\"pq\">27. It was (A) serendipity rather than (B) genius that leads (C) the archaeologist to his breathtaking discovery of (D) the ancient civilization. No error (E)<\/p><p class=\"pq\">28. The new guidelines mandate (A) that students not only (B) submit (C) their assignments on time, but also participate (D) actively in class discussions. No error (E)<\/p><p><i>Questions 29–30: choose the word closest in meaning.<\/i><\/p><p class=\"pq\">29. LUGUBRIOUS<\/p><p class=\"po\">(A) Treasure (B) Sanguine (C) Engorged (D) Gloomy (E) None<\/p><p class=\"pq\">30. QUIESCENT<\/p><p class=\"po\">(A) Fastidious (B) Inactive (C) Complex (D) Mournful (E) None<\/p><h4>General Knowledge (Q31–55)<\/h4><p class=\"pq\">31. Sumerian civilization is a part of ___ civilization.<\/p><p class=\"po\">(A) Mesopotamian (B) Mayan (C) Hebrew (D) Egyptian (E) None<\/p><p class=\"pq\">32. What is the biggest religious and social festival of the Chakmas?<\/p><p class=\"po\">(A) Biju (B) Sandray (C) Wangala (D) Sangrai (E) None<\/p><p class=\"pq\">33. Who is the painter of \"The Persistence of Memory\"?<\/p><p class=\"po\">(A) Michelangelo (B) Leonardo da Vinci (C) Salvador Dali (D) Claude Monet (E) None<\/p><p class=\"pq\">34. Which of the following is not a contagious disease?<\/p><p class=\"po\">(A) Smallpox (B) Typhoid (C) Tuberculosis (D) Mumps (E) None<\/p><p class=\"pq\">35. Which American state is nearest to Russia?<\/p><p class=\"po\">(A) Washington (B) Maine (C) Alaska (D) Connecticut<\/p><p class=\"pq\">36. Who among the following is not a recipient of the Nobel Prize in Literature?<\/p><p class=\"po\">(A) Pablo Neruda (B) Leo Tolstoy (C) Bernard Shaw (D) Bertrand Russell<\/p><p class=\"pq\">37. Humidity is measured by —<\/p><p class=\"po\">(A) Barometer (B) Sphygmomanometer (C) Hygrometer (D) Hydrometer<\/p><p class=\"pq\">38. Which ultraviolet ray is the most harmful?<\/p><p class=\"po\">(A) UV-A (B) UV-B (C) UV-C (D) UV-D<\/p><p class=\"pq\">39. Which of the following helps the production of haemoglobin?<\/p><p class=\"po\">(A) Protein (B) Fat (C) Carbohydrate (D) Starch<\/p><p class=\"pq\">40. Which product recently lost its GI tag from Bangladesh to India?<\/p><p class=\"po\">(A) Baluchari (B) Tangail saree (C) Kota (D) Jamdani<\/p><p class=\"pq\">41. The French Revolution ended in the year —<\/p><p class=\"po\">(A) 1767 (B) 1776 (C) 1789 (D) 1799<\/p><p class=\"pq\">42. The Port of Valencia is in —<\/p><p class=\"po\">(A) Spain (B) Morocco (C) Portugal (D) Italy (E) France<\/p><p class=\"pq\">43. Which of the following is a valid Excel function?<\/p><p class=\"po\">(A) CONCAT (B) YLOOKUP (C) TEXTMERGE (D) All (E) None<\/p><p class=\"pq\">44. Recently, which country has proposed a three-day weekend?<\/p><p class=\"po\">(A) Canada (B) Saudi Arabia (C) Singapore (D) Tunisia (E) Cuba<\/p><p class=\"pq\">45. Who recently broke Michael Phelps's record in the 400 m individual medley?<\/p><p class=\"po\">(A) Léon Marchand (and four other names)<\/p><p class=\"pq\">46. Which country has been severely affected by the recent Mpox outbreak?<\/p><p class=\"po\">(A) Kenya (B) Senegal (C) Djibouti (D) Congo (E) Ethiopia<\/p><p class=\"pq\">47. The spacecraft designed by Boeing is called —<\/p><p class=\"po\">(A) Starliner (B) Dream Chaser (C) SpaceX (D) Ariane (E) Skylon<\/p><p class=\"pq\">48. The design capacity of the wind power plant in Cox's Bazar is ___ MW.<\/p><p class=\"po\">(A) 58 (B) 62 (C) 64 (D) 66 (E) None<\/p><p class=\"pq\">49. Which Indian province has no common boundary with Bangladesh?<\/p><p class=\"po\">(A) Manipur (B) Tripura (C) Mizoram (D) Meghalaya<\/p><p class=\"pq\">50. What was the theme of the Paris Olympics 2024?<\/p><p class=\"po\">(A) Social business (B) Life and livelihood (C) Human rights (D) Microfinance (E) None<\/p><p class=\"pq\">51. Who is the current Chairman of the Political Bureau of Hamas?<\/p><p class=\"po\">(A) Ismail Haniyeh (B) Abu Ubaida (C) Yahya Sinwar (D) Khalil al-Hayya (E) None<\/p><p class=\"pq\">52. Which of the following is NOT an ASEAN country?<\/p><p class=\"po\">(A) Brunei (B) Myanmar (C) Cambodia (D) China (E) All are members<\/p><p class=\"pq\">53. Which is the newest member of NATO?<\/p><p class=\"po\">(A) Finland (B) Sweden (C) Ukraine (D) Georgia<\/p><p class=\"pq\">54. Which country won the 2023 FIFA Women's World Cup?<\/p><p class=\"po\">(A) Germany (B) USA (C) Spain (D) England (E) Uruguay<\/p><p class=\"pq\">55. Which of the following is NOT one of Professor Yunus's \"3 Zeros\"?<\/p><p class=\"po\">(A) Zero Poverty (B) Zero Unemployment (C) Zero Net Carbon Emissions (D) Zero Hunger (E) None<\/p><h4>Mathematics (Q56–70)<\/h4><p class=\"pq\">56. A trader paid Tk 300 for x identical pens. He gave two away free and sold each of the rest for Tk 5 more than the average cost. His revenue was Tk 120 more than his cost. How many pens did he buy?<\/p><p class=\"po\">(A) 20 (B) 24 (C) 28 (D) 30 (E) None<\/p><p class=\"pq\">57. The average of 5 positive integers is 40 and the difference between the largest and the smallest is 10. What is the maximum possible value of the largest integer?<\/p><p class=\"po\">(A) 44 (B) 48 (C) 50 (D) 52<\/p><p class=\"pq\">58. A customer asks for a 20% discount on the list price and 2 free pens for every 10 purchased. The manager agrees and still makes 20% profit on cost. If the cost of a pen is x, what is the list price?<\/p><p class=\"po\">(A) 1.75x (B) 1.8x (C) 1.9x (D) 2x<\/p><p class=\"pq\">59. A school raised its fee by x%. Arif got a y% waiver on the new fee and paid 80% of the previous year's fee. What is y in terms of x?<\/p><p class=\"po\">(A) x + 40 (B) 100(x + 40)/(x + 100) (C) 60x + 10 (D) (x + 60)/(x + 100) (E) None<\/p><p class=\"pq\">60. A box of 200 pens has 25% red pens, the rest black. Some pens were sold, of which 60% were black. Of the remaining pens only 20% are red. How many pens were sold?<\/p><p class=\"po\">(A) 50 (B) 60 (C) 75 (D) 80<\/p><p class=\"pq\">61. The ratio of foreign to local delegates is 3 : 7. Three-quarters of the local and one-quarter of the foreign delegates are female. What percentage of the delegates are female?<\/p><p class=\"po\">(A) 50% (B) 60% (C) 64% (D) 65%<\/p><p class=\"pq\">62. Apu, Babu and Tipu paid for a football. Tipu paid twice as much as Apu; Babu paid the most. Apu paid Tk 70 less than the difference between Babu's and Tipu's payments. Had Apu paid twice as much, Babu and Tipu would each have paid Tk 10 less. How much did Babu pay?<\/p><p class=\"po\">(A) 90 (B) 100 (C) 120 (D) 130<\/p><p class=\"pq\">63. x = 5√5, y = 7 + √5, z = 2 + 4√5. Which is correct?<\/p><p class=\"po\">(A) x &gt; y &gt; z (B) x &gt; z &gt; y (C) y &gt; x &gt; z (D) z &gt; x &gt; y<\/p><p class=\"pq\">64. When the integer n is divided by 4 the quotient is p and the remainder 1; when divided by 6 the quotient is q and the remainder 5. What is 3q − 2p?<\/p><p class=\"pq\">65. x years ago, Apu was one-fifth as old as Topu. In x years, Topu will be twice as old as Apu. What is the ratio of Apu's present age to Topu's?<\/p><p class=\"po\">(A) 2 : 5 (B) 5 : 7 (C) 3 : 7 (D) 5 : 13 (E) None<\/p><p class=\"pq\">66. A 250-metre-long train passes a person in 10 seconds. The person was running at 5 km/h in the opposite direction. What is the speed of the train in km/h?<\/p><p class=\"po\">(A) 50 (B) 55 (C) 75 (D) 85 (E) None<\/p><p class=\"pq\">67. A team of 2 men and 5 women completed one-fourth of a project in 3 days. Then one woman left and one man joined; the new team took 2 days to complete another one-fourth. How many days would 4 men take to complete the project alone?<\/p><p class=\"po\">(A) 6 (B) 8 (C) 12 (D) 24 (E) None<\/p><p class=\"pq\">68. What is the minimum value of 4x² + 16x − 17?<\/p><p class=\"po\">(A) 0 (B) −29 (C) −30 (D) −33 (E) None<\/p><p class=\"pq\">69. When m litres of fuel were added to a tank that was already 1/3 full, it was filled to 7/9 of its capacity. In terms of m, what is the capacity of the tank?<\/p><p class=\"po\">(A) 10m/9 (B) 4m/3 (C) 3m/2 (D) 9m/4 (E) None<\/p><p class=\"pq\">70. If 3 &lt; x &lt; 7 and 5 &gt; y &gt; 2, which of the f
