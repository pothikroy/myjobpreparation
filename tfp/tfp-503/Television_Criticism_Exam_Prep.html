<script>

// ============================================================
// TELEVISION CRITICISM — EXAM PREP DATA
// Topic 1: "Introduction" by Janet Wasko
// Topic 2: "On Television" by Pierre Bourdieu
// ============================================================

const TOPICS = {
  1: { name: "Television — Introduction", author: "Janet Wasko", short: "Topic 1" },
  2: { name: "On Television", author: "Pierre Bourdieu", short: "Topic 2" }
};

const SECTIONS = [
// ============================== TOPIC 1 ==============================
{
  id: "t1-what-is-tv",
  topic: 1,
  order: 1,
  title: "What is Television?",
  priority: "must",
  quick: "Television is a multifaceted apparatus: a technology (electromagnetic transmission of images/sound), an industry, and a social/political/economic/cultural force all at once. Its underlying technology was built in the 1920s, but it only became a mass medium in the late 1940s–early 1950s. Early inventors like Philo Farnsworth were deeply optimistic about what TV could achieve, though that dream was never fully realized.",
  examNotes: [
    "<b>Formal definition</b> (American Heritage Dictionary of the English Language, 4th ed., 2000) — television has three linked senses: (1) the transmission of moving/stationary visual images, usually with sound, as electromagnetic waves, and the reconversion of received waves into images; (2a) the electronic apparatus that receives and displays these images; (2b) the audible/visible content produced by that apparatus; (3) the industry that produces and broadcasts television programs.",
    "<b>Etymology</b> — the word \"television\" is a hybrid: half Greek (<i>tele-</i>, meaning \"far\") and half Latin/French (<i>vision</i>). English journalist <b>C. P. Scott</b> (1846–1932) mocked this mixed origin: \"Television? The word is half Greek, half Latin. No good can come of it.\"",
    "<b>Historical development</b> — television as a form of <i>mass communication</i> did not emerge until the late 1940s and early 1950s, even though much of the underlying technology was actually developed during the <b>1920s</b>. As with many media technologies, early expectations were \"optimistic and propitious.\"",
    "<b>Philo Farnsworth</b> — an often-overlooked American inventor of television, was hopeful about its future. His biographer (<b>Schwartz, 2002, p. 113</b>) explains Farnsworth's vision: television would become \"the world's greatest teaching tool\" and wipe out illiteracy; its immediacy meant viewers would watch news unfold live, without relying on others to interpret/distort it; people would watch sporting events and symphony orchestras; \"instead of going to the movies, the movies would come to us\"; and television would even bring about <b>world peace</b> — if people could see and understand people in other countries, misunderstandings (and war) would end.",
    "Farnsworth's <i>full</i> vision has not been realized, though parts of it have been \"more than fulfilled.\"",
    "Television today is a common household appliance serving as a source of <b>news, information, politics, entertainment, education, religion, art, culture, sports, weather, and music</b>.",
    "Television is also an <b>industrial system</b> that produces and distributes products, and often promotes other commodities/commerce.",
    "Conclusion of this section: television is not only a technical device, but also a <b>social, political, economic, and cultural force</b>.",
    "Television keeps changing with new technology (VCRs, cable, pay TV, satellite, digital, HD) and faces growing competition from other communication systems (computers, internet). Its meaning also varies across different parts of the world.",
    "Because of this constant variation and change, Wasko calls television an <b>\"enigmatic 'moving target'\"</b> — its future uncertain and contested. Nevertheless, scholars must still try to define its character and influence."
  ],
  deeper: [
    "The dictionary definition is useful because exam answers that open with a formal definition immediately show the examiner you understand television as simultaneously a technology, an object, content, and an industry — four senses in one word.",
    "Farnsworth is described as \"often-overlooked\" — worth noting if a question asks specifically about early inventors or the optimistic/utopian view of new media technology in general (a recurring theme across many media theories: new technologies are often first welcomed with utopian hopes, then later criticized)."
  ],
  memoryTrick: "Contrast chain: Definition (3-part) → Etymology (half-Greek/half-Latin, Scott's mockery) → History (1920s tech → 1940s-50s mass medium) → Farnsworth's utopia (teach, no distortion, peace) → Reality today (appliance + industry + social/political/economic/cultural force) → \"Moving target.\"",
  memorize: "3-part definition → half-Greek/half-Latin (Scott) → 1920s tech → 1940s-50s mass medium → Farnsworth's dream (teach • live news • peace) → moving target",
  keywords: ["electromagnetic waves", "apparatus", "industry", "Philo Farnsworth", "C. P. Scott", "moving target", "multifaceted", "Schwartz (2002)"],
  important: [
    "<b>Philo Farnsworth</b> — American inventor, optimistic pioneer of television technology.",
    "<b>Schwartz (2002, p. 113)</b> — Farnsworth's biographer; source of the utopian-vision quotation.",
    "<b>C. P. Scott</b> (1846–1932) — English journalist who mocked the word \"television\" as a hybrid Greek/Latin coinage.",
    "American Heritage Dictionary of the English Language, 4th edition (2000) — source of the three-part formal definition."
  ],
  citations: [
    { source: "American Heritage Dictionary of the English Language (4th ed., 2000)", argument: "Formal three-part definition of television: transmission technology, the receiving apparatus, and the industry of producing/broadcasting programs.", useFor: ["Definition questions", "Introduction of any TV essay"] },
    { source: "C. P. Scott, English journalist (1846–1932)", argument: "Direct quotation: \"Television? The word is half Greek, half Latin. No good can come of it.\"", useFor: ["Essay hook/opening", "Showing early skepticism toward the new medium"] },
    { source: "Schwartz (2002, p. 113), biographer of Philo Farnsworth", argument: "Describes Farnsworth's utopian vision of TV as a teaching tool that would end illiteracy, transmit live/undistorted news, and even bring world peace.", useFor: ["Utopian/optimistic view of media technology", "Contrast with later critics (Minow, Silver, Mander)"] }
  ],
  whatToWrite: [
    "Introduction: television as a multifaceted phenomenon — technology + institution + cultural force, not just a screen.",
    "Main point 1: give the formal/technical definition (dictionary) — electromagnetic transmission of image + sound, the apparatus, and the industry.",
    "Main point 2: etymology — hybrid Greek/Latin word; cite C. P. Scott's skeptical quote as an early reaction.",
    "Main point 3: historical development — underlying technology built in the 1920s, but mass-medium status only from the late 1940s/1950s.",
    "Important example/evidence: Farnsworth's utopian vision (teaching tool, live/undistorted news, world peace) via Schwartz (2002).",
    "Relevant thinker/author: Philo Farnsworth (optimistic inventor).",
    "Citation: use the dictionary definition and/or the Scott quotation to anchor the introduction or conclusion.",
    "Closing idea: because of ongoing technological change and global variation, television remains an \"enigmatic moving target\" that scholars must keep trying to define."
  ],
  skeleton: [
    { step: "Introduction", sub: "define television as multifaceted (technology / institution / cultural force)" },

  title: "Opening Questions: Why (and How) Speak on Television?",
  priority: "should",
  quick: "Bourdieu opens by questioning whether one can say anything meaningful \"on\" television at all, given the constraints normally imposed on speakers. He is speaking under unusually free conditions — no time limit, his own topic, no outside interference — which reveals, by contrast, how constrained ordinary TV appearances really are. He argues many people appear on TV mainly out of a \"desire to be seen,\" turning the screen into a space of narcissistic self-display, yet he still believes scholars have a duty to communicate their research publicly, under the right conditions.",
  examNotes: [
    "Bourdieu poses questions <i>about</i> television <i>on</i> television, acknowledging a paradox: in general \"you can't say much on television, particularly not about television.\"",
    "He is speaking under \"absolutely exceptional circumstances\": he faces <b>no time limit</b>, his <b>topic is his own</b> (not imposed, and he can still change it), and no one is present to bring him into line with technical requirements, \"the public-that-won't-understand,\" or morality/decency. He calls this unusual \"control of the instruments of production.\"",
    "This exceptional situation itself reveals something about what <i>normally</i> happens when someone appears on television (i.e., ordinary guests usually lack this control).",
    "Bourdieu raises a question rarely asked by researchers, scholars, writers, or journalists who appear on TV: <b>why do people accept the usual constrained conditions</b> imposed on television guests?",
    "His answer: by agreeing to appear on shows without worrying whether they'll be able to say anything, guests reveal they aren't really there to say something at all, but for \"altogether different reasons\" — chiefly the <b>\"desire to be seen.\"</b>",
    "He cites the philosopher <b>Berkeley</b>: <i>\"to be is to be perceived.\"</i> For some thinkers and writers, \"to be\" has come to mean \"to be perceived on television\" — that is, to be perceived by journalists, to be on their \"good side.\"",
    "Because such thinkers/writers cannot count on their work lasting over time, they feel they have \"no recourse but to appear on television as often as possible\" — churning out work whose real function, as <b>Gilles Deleuze</b> used to say, is simply \"to get them on television.\"",
    "Result: the television screen \"becomes a sort of mirror for Narcissus, a space for narcissistic exhibitionism.\"",
    "Bourdieu argues artists, writers, and thinkers should ask themselves these questions <b>openly and collectively</b> — ideally negotiating a kind of contract with journalists together, rather than each person deciding alone. This is not about blaming/fighting journalists (who also suffer real constraints), but about resisting \"the threat of instrumentalization.\"",
    "He does not think one can categorically refuse to appear on television — in some cases there is even something of a <b>\"duty\"</b> to appear, under the right conditions, especially because television offers, in theory, the possibility of reaching everybody.",
    "Researchers and scholars have an obligation — \"especially urgent for the social sciences\" — to make the results of research available to everyone. He cites <b>Edmund Husserl</b>: in Europe, scholars are paid by the government as <i>\"humanity's civil servants\"</i> to make discoveries, and sharing findings is part of that responsibility.",

  fullAnswer10: "Bourdieu argues that although television seems to offer open access to information, this openness is actually offset by a powerful but largely invisible censorship. Obvious factors play a role — strict time limits make sustained argument almost impossible, political pressures encourage self-censorship (especially where stations are state-controlled), and ownership matters: NBC is owned by General Electric, CBS by Westinghouse, ABC by Disney, and the French channel TF1 by the construction company Bouygues. Yet Bourdieu insists these crude, visible facts actually conceal deeper, unconscious mechanisms. He calls this hidden pressure \"symbolic violence\": violence exercised with the tacit complicity of both the people who wield it and the people who suffer it, neither fully aware of what is happening. Sociology's task, he says, is to expose such hidden mechanisms. As an example, he points to sensationalism: television devotes scarce airtime to \"safe,\" attention-grabbing stories — blood, sex, crime — that interest everyone but touch nothing important, crowding out substantive news. Because a large part of the population relies solely on television for information, he concludes that \"television enjoys a de facto monopoly on what goes into the heads of a significant part of the population and what they think.\" For Bourdieu, then, real censorship on television operates less through obvious political or economic control and more through invisible structural mechanisms that shape thought without anyone consciously intending it.",

  quick: "Television can \"hide by showing\": it conceals reality precisely through what and how it displays things — showing something else, showing things insignificantly, or constructing images that distort reality. Journalists select stories through their own perceptual \"glasses,\" driven by the search for the sensational and \"dramatization.\" Using Patrick Champagne's research (inner-city reporting, the 1986 student strike), Bourdieu argues television doesn't just record reality — it creates it.",
  examNotes: [
    "Central paradox: television can hide things \"by showing something other than what would be shown if television did what it's supposed to do\" (i.e. provide real information); or by showing what has to be shown but in a way that makes it insignificant; or by constructing an image so it takes on a meaning unrelated to reality.",
    "Bourdieu draws two examples from <b>Patrick Champagne's</b> work, especially <i>La Misère du monde</i>, a detailed study of how media represent events in \"the inner city.\"",
    "Journalists are shaped by: (a) the exigencies of their job, (b) their view of the world, (c) their training/orientation, and (d) the profession's own internal reasoning. They select very specific aspects of the inner city based on their own perceptual categories.",
    "<b>Metaphor:</b> journalists have special \"glasses\" — invisible structures (built from education, history, etc.) that organize perception, determining what is seen or not seen, and how it is seen.",
    "The principle driving story selection is the <b>search for the sensational and the spectacular</b>. Television calls for <b>dramatization</b>, in both senses of the term: it puts an event \"on stage\" (in images), and it exaggerates the event's seriousness and dramatic/tragic character. For the inner city, this dramatization typically means <b>riots</b>.",
    "Words themselves get dramatized too: photos are \"nothing without words\" (the French word for caption, <i>légende</i>, literally means \"legend\" — a caption \"can show anything at all\"). To name something is to show/create/bring it into existence — words \"can do a lot of damage\" (Bourdieu's example: is a headscarf \"Islamic\" or \"Islamicist\"?). Careless words create \"phantasms, fears, and phobias\" or simply \"false representations.\"",
    "Journalists are drawn to the exceptional — whatever is exceptional \"for them\" (fires, floods, murders) — under constant pressure to get a \"scoop.\" Paradoxically, this competitive search for exclusivity produces uniformity and banality: everyone copies everyone else.",
    "<b>Key highlighted quote:</b> <i>\"The political dangers inherent in the ordinary use of television have to do with the fact that images have the peculiar capacity to produce what literary critics call a reality effect. They show things and make people believe in what they show. This power to show is also a power to mobilize.\"</i> This mobilizing power can carry political or ethnic significance, potentially unleashing racism, chauvinism, or xenophobia.",
    "<b>Second key quote:</b> <i>\"The simple report, the very fact of reporting, of putting on record as a reporter, always implies a social construction of reality that can mobilize (or demobilize) individuals or groups.\"</i>",

  fullAnswer20: "Bourdieu's central claim in \"Show and Hide\" is paradoxical: television can conceal reality precisely by showing it. Rather than presenting a neutral window onto events, television shows something other than what genuine information would require, presents things so insignificantly that they lose meaning, or constructs images that take on a meaning that has nothing to do with reality. Bourdieu explains this through the metaphor of journalists' \"glasses\": invisible perceptual categories, shaped by education, training and the pressures of the job, that determine what journalists notice and how they interpret it. The governing principle behind story selection, he argues, is the search for the sensational and the spectacular — television calls for \"dramatization,\" both putting events on stage and exaggerating their seriousness. He draws on sociologist Patrick Champagne's research to illustrate this. In coverage of the inner city (from Champagne's La Misère du monde), dramatization typically means riots; ordinary, monotonous daily life is considered uninteresting by journalists, even when it might be more truthful. Bourdieu also stresses that words themselves can distort — a caption or a label such as \"Islamic\" versus \"Islamicist\" can create fear or false impressions even from a simple choice of vocabulary. Champagne's second example, the 1986 French high-school strike, shows how journalists, acting in good faith, unconsciously sought out the most articulate and politicized student representatives because they feared missing \"a new 1968\" — inadvertently distorting the story they were meant to simply report. From these examples Bourdieu draws his central theoretical claim: images possess a \"reality effect\" — they make people believe in what is shown — and this power to show is simultaneously a power to mobilize people, sometimes along dangerous political or ethnic lines. The very act of reporting, he insists, is never neutral; it always implies a social construction of reality that can mobilize or demobilize groups. This leads to his most quoted line in the section: \"television, which claims to record reality, creates it instead,\" so that the social world becomes increasingly described — and in a sense prescribed — by television. He extends this with a striking practical example: organizing a demonstration today (say, for early retirement) may matter less than hiring a \"savvy media consultant,\" because a demonstration staged with the right visual elements can, through television, produce an effect equivalent to fifty thousand real protesters in the street. The wider political stake, Bourdieu concludes, is the capacity to impose a particular \"way of seeing the world\" on the public — and increasingly, political actors must design their actions specifically for television's perceptual categories in order to be seen and to have any effect at all.",

  priority: "must",
  quick: "Bourdieu distinguishes two kinds of flawed televised debates: those that are openly fake (pundits who supposedly disagree but are secretly \"birds of a feather\"), and those that only look genuinely democratic while hidden mechanisms — the moderator's power, panel selection, prior arrangements, and unconscious bias — actually distort and unequalize the discussion. His main case study is the debate organized by Cavada during the November strikes.",
  examNotes: [
    "<b>Two types of bogus debates:</b> (1) entirely bogus, immediately recognizable ones — TV talk shows pairing pundits such as <b>Alain Minc & Jacques Attali</b>, or <b>Luc Ferry & Alain Finkielkraut</b>, who supposedly represent opposite views but are \"birds of a feather\": these people \"know each other, lunch together, have dinner together.\"",
    "<b>Example:</b> in <b>Guillaume Durand's</b> program about elites, Attali began to say \"Nicolas...\" to Sarkozy before pausing and adding \"Sarkozy\" — a near-slip that would have revealed their closeness, even though they're meant to represent opposite political sides — a \"tiny signal of complicity.\"",
    "The \"milieu of television regulars\" is a closed, self-reinforcing world; figures like <b>Julliard and Imbert</b>, supposedly representing Left and Right, are \"at odds but in an utterly conventional way\" (a Kabyle saying is quoted: \"he put my east in the west,\" meaning someone who twists/distorts positions).",
    "(2) Debates that \"seem genuine, but are falsely so\" — Bourdieu's main example: the debate organized by <b>Cavada</b> during the November strikes, which \"looked for all the world like a democratic debate,\" making his case \"all the stronger.\"",
    "Bourdieu identifies a hidden \"string of censorship\" within this seemingly fair debate:",
    "&nbsp;&nbsp;(a) <b>The moderator</b> — highly interventionist; determines the subject and decides the debate question (sometimes absurdly framed, e.g. Durand's \"should elites be burned?\"); keeps debaters \"in line with the rules of the game\" — rules that vary depending on who's speaking (different for a union organizer vs. an Académie Française member); allots time and sets the tone (respectful/impatient); subtle cues (\"yeah, yeah, yeah,\" a curt \"thank you\") shape or discourage speakers, often unconsciously even for the moderator.",
    "&nbsp;&nbsp;(b) <b>Result:</b> in a two-hour Cavada program, the union delegate had exactly <b>five minutes</b> to speak — even though the strike was the entire reason for the program. Yet, on the surface, \"the program adhered to all the formal signs of equality.\"",
    "&nbsp;&nbsp;(c) <b>Structural inequality:</b> not all discussants are equal — some are professional TV talkers, others (e.g. striking workers) are \"rank amateurs.\" True equality would require the moderator to be <b>\"inegalitarian\"</b> — actively helping less-experienced speakers, as Bourdieu's own research team does in interviews for <i>La Misère du monde</i> — calling this a \"Socratic mission.\" But TV moderators typically do the opposite: they fail to help unaccustomed speakers, and often inhibit them (not ceding the floor at the right moment, putting people on the spot, showing impatience).",

  fullAnswer20: "Bourdieu distinguishes two broad categories of flawed televised debate. The first, \"truly false\" debates, are immediately recognizable as bogus: pairs of well-known pundits such as Alain Minc and Jacques Attali, or Luc Ferry and Alain Finkielkraut, are presented as representing opposing viewpoints, but in reality they belong to the same closed social milieu — they know each other, lunch together, and share far more in common than the program lets on. Bourdieu offers a small but telling example: during a program about elites hosted by Guillaume Durand, Attali began addressing Sarkozy simply as \"Nicolas,\" catching himself and adding the surname only at the last moment — a near-slip revealing an intimacy at odds with their supposed political opposition. Far more interesting to Bourdieu, though, are debates that are \"falsely true\" — that look genuinely democratic on the surface while actually being shaped by invisible mechanisms of censorship. His central example is a debate organized by the moderator Cavada during the November strikes, chosen precisely because it looked, on the surface, like an exemplary democratic exchange. Bourdieu uncovers a whole \"string of censorship\" within it. First, the moderator himself wields enormous, often unconscious power: he sets the topic and frames the question (sometimes absurdly, as in Durand's \"should elites be burned?\"), controls how much time each speaker gets, and shapes tone through small verbal cues. The practical result, in Cavada's two-hour broadcast, was that the striking union delegate — the very reason the program existed — received only five minutes of speaking time, even though the program maintained all the surface signs of formal equality. This points to a deeper structural inequality: professional television talkers and ordinary participants such as striking workers are simply not equally equipped to perform on air, and real equality, Bourdieu argues, would require the moderator to actively help the less experienced speak — a kind of \"Socratic mission\" that television moderators rarely undertake. Behind the scenes, panel selection is equally decisive: the Cercle de minuit talk show, covering intellectuals and the strikes over two successive episodes, simply moved the same people from the right side of the set to the left between programs, changing the entire visual message of the debate through nothing more than a seating rearrangement. Guests are also often bound by prior agreements that function like a rehearsed \"screenplay,\" leaving little room for spontaneity. Bourdieu frames all of this using Wittgenstein's concept of a \"language game\": televised debate follows tacit rules modeled on wrestling, in which conflict between \"good guys\" and \"bad guys\" is expected, but only within tightly formal, intellectual bounds. This is why the industry favors so-called \"good guests\" — smooth, reliable fast-talkers who \"take to the television format like fish to water\" and never cause problems for producers. Altogether, Bourdieu's analysis shows that even television debates that appear scrupulously fair are structured, often invisibly, in ways that systematically favor the already powerful and marginalize genuine outsiders.",

// ---------- Countdown ----------
function updateCountdowns(){
  const el1 = document.getElementById('miniCountdown');
  if(!STATE.examTime){
    if(el1) el1.textContent = '';
    const big = document.getElementById('bigCountdown');
    if(big) big.innerHTML = '<span style="color:var(--ink-soft);font-size:14px;">No exam time set</span>';
    return;
  }
  const target = new Date(STATE.examTime).getTime();
  const now = Date.now();
  let diff = target - now;
  let text;
  if(diff <= 0){ text = "Exam time reached"; }
  else{
    const totalSec = Math.floor(diff/1000);
    const d = Math.floor(totalSec/86400);
    const h = Math.floor((totalSec%86400)/3600);
    const m = Math.floor((totalSec%3600)/60);
    const s = totalSec%60;
    text = (d>0? d+"d ":"") + String(h).padStart(2,'0')+"h "+String(m).padStart(2,'0')+"m "+String(s).padStart(2,'0')+"s";
  }
  if(el1) el1.innerHTML = 'Exam in <strong>'+text+'</strong>';
  const big = document.getElementById('bigCountdown');
  if(big) big.innerHTML = '<span class="cd-num">'+text+'</span>';
}
setInterval(updateCountdowns, 1000);

// ---------- Helpers ----------
function sectionsByTopic(topic){ return SECTIONS.filter(s=>s.topic===topic).sort((a,b)=>a.order-b.order); }
function getSection(id){ return SECTIONS.find(s=>s.id===id); }
function statusOf(id){ return STATE.progress[id] || 'not-started'; }
function setStatus(id, status){ STATE.progress[id] = status; saveProgress(); }

function coveragePct(topic){
  const secs = topic ? sectionsByTopic(topic) : SECTIONS;
  if(secs.length===0) return 0;
  const done = secs.filter(s=>{ const st = statusOf(s.id); return st==='learned' || st==='reading' || st==='review'; }).length;
  return Math.round(done/secs.length*100);
}
function learnedPct(topic){
  const secs = topic ? sectionsByTopic(topic) : SECTIONS;
  if(secs.length===0) return 0;
  const done = secs.filter(s=> statusOf(s.id)==='learned').length;
  return Math.round(done/secs.length*100);
}

function escapeHtml(s){ return (s+'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  const next = idx<secs.length-1 ? secs[idx+1] : null;

function buildSearchIndex(){
  const idx = [];
  SECTIONS.forEach(s=>{
    idx.push({ type:'Section', label:s.title, sub:TOPICS[s.topic].short, go:()=>goSection(s.id), text:(s.title+' '+s.keywords.join(' ')+' '+s.quick).toLowerCase() });
    s.important.forEach(i=>{ idx.push({ type:'Name', label:i.replace(/<\/?b>/g,''), sub:s.title, go:()=>goSection(s.id), text:i.replace(/<[^>]+>/g,'').toLowerCase() }); });
    s.citations.forEach(c=>{ idx.push({ type:'Citation', label:c.source, sub:s.title, go:()=>goSection(s.id), text:(c.source+' '+c.argument).toLowerCase() }); });
    s.vocab.forEach(v=>{ idx.push({ type:'Vocab', label:v.word, sub:s.title, go:()=>goSection(s.id), text:(v.word+' '+v.simple).toLowerCase() }); });
    s.keywords.forEach(k=>{ idx.push({ type:'Keyword', label:k, sub:s.title, go:()=>goSection(s.id), text:k.toLowerCase() }); });
  });
  return idx;
}
const SEARCH_INDEX = buildSearchIndex();
let searchResultFns = [];

function doSearch(q){
  const box = document.getElementById('searchResults');
  q = q.trim().toLowerCase();
  if(q.length < 2){ box.classList.add('hidden'); box.innerHTML=''; return; }
  const matches = SEARCH_INDEX.filter(item=>item.text.includes(q)).slice(0,25);
  if(matches.length===0){ box.innerHTML = '<div class="sr-item">No matches.</div>'; box.classList.remove('hidden'); return; }
  searchResultFns = matches.map(m=>m.go);
  box.innerHTML = matches.map((m,i)=>`<div class="sr-item" onclick="runSearchResult(${i})"><span class="sr-tag">${m.type}</span><br>${escapeHtml(m.label)} <span style="color:var(--ink-soft);">— ${escapeHtml(m.sub)}</span></div>`).join('');
  box.classList.remove('hidden');
}
function runSearchResult(i){
  document.getElementById('searchResults').classList.add('hidden');
  document.getElementById('searchbox').value='';
  searchResultFns[i]();
}
document.addEventListener('click', function(e){
  const box = document.getElementById('searchResults');
  if(!box.contains(e.target) && e.target.id !== 'searchbox'){ box.classList.add('hidden'); }
});

    case 'emergency': html = renderEmergency(); break;
    case 'citations': html = renderCitations(); break;
    case 'checklist': html = renderChecklist(); break;
    case 'connect': html = renderConnect(); break;
    default: html = renderHome();
  }
  app.innerHTML = html;
  updateCountdowns();
}

// Init
render();


</script>
</body>
</html>
