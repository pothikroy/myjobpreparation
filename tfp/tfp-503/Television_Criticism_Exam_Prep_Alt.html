<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Television Criticism — Exam Prep</title>
<style>
:root{
  --bg:#f6f4ef; --bg-elev:#ffffff; --ink:#20241f; --ink-soft:#5b6058; --line:#e2ded3;
  --accent:#8a5a2b; --accent-ink:#ffffff;
  --source:#2b5d8a; --source-bg:#e8f0f7;
  --interp:#6a3f9e; --interp-bg:#f0e9f8;
  --appl:#2f7d4f; --appl-bg:#e7f5ec;
  --bd:#0f7a72; --bd-bg:#e2f4f2;
  --strategy:#a15b00; --strategy-bg:#fbf0dd;
  --weak:#c0392b; --review:#c07a1b; --strong:#2f7d4f;
  --shadow: 0 1px 3px rgba(20,20,10,.06), 0 1px 2px rgba(20,20,10,.08);
  --radius:12px;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
}
[data-theme="dark"]{
  --bg:#1a1c19; --bg-elev:#22251f; --ink:#e9e7df; --ink-soft:#a8a99c; --line:#34372f;
  --accent:#d8a25f; --accent-ink:#20241f;
  --source:#7fb2e0; --source-bg:#1c2c38;
  --interp:#c3a3ec; --interp-bg:#2a2035;
  --appl:#8fd6ac; --appl-bg:#183226;
  --bd:#7fd8cd; --bd-bg:#123230;
  --strategy:#f0bd6c; --strategy-bg:#332508;
  --weak:#e57468; --review:#e8b15c; --strong:#8fd6ac;
  --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100vh; display:flex; flex-direction:column;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
.btn{
  border:1px solid var(--line); background:var(--bg-elev); color:var(--ink);
  padding:9px 16px; border-radius:9px; font-size:14px; font-weight:600;
  transition:all .15s ease;
}
.btn:hover{border-color:var(--accent); color:var(--accent);}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn.primary:hover{opacity:.9; color:var(--accent-ink);}
.btn.ghost{background:transparent; border-color:transparent;}
.btn.small{padding:5px 10px; font-size:12.5px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

/* ===== Top bar ===== */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 18px; border-bottom:1px solid var(--line); background:var(--bg-elev);
  position:sticky; top:0; z-index:50;
}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-weight:700; font-size:17px; cursor:pointer;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.topbar-tools{display:flex; align-items:center; gap:8px;}
.hamburger-btn{display:none;}
.sidebar-backdrop{display:none;}
.pill{
  font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px;
  background:var(--source-bg); color:var(--source);
}

/* ===== Layout ===== */
.layout{display:flex; flex:1; min-height:0;}
.sidebar{
  width:250px; flex-shrink:0; border-right:1px solid var(--line); background:var(--bg-elev);
  padding:16px 10px; overflow-y:auto;
}
.sidebar.hidden{display:none;}
.sidebar-close-btn{display:none;}
.side-section{margin-bottom:18px;}
.side-title{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; padding:0 8px 6px;}
.side-link{
  display:flex; align-items:center; gap:8px; padding:8px 8px; border-radius:8px; font-size:13.5px;
  color:var(--ink); text-decoration:none; cursor:pointer; margin-bottom:2px;
}
.side-link:hover{background:var(--bg);}
.side-link.active{background:var(--source-bg); color:var(--source); font-weight:700;}
.side-link .status-dot{width:7px;height:7px;border-radius:50%; flex-shrink:0; background:var(--line);}
.status-understood{background:var(--strong) !important;}
.status-reading{background:var(--review) !important;}
.status-needsreview{background:var(--weak) !important;}

.main{flex:1; min-width:0; overflow-y:auto; padding:26px 30px 80px;}
.main.wide{max-width:100%;}
.container{max-width:760px; margin:0 auto;}
.container.wider{max-width:980px;}

/* ===== Home dashboard ===== */
.countdown-card{
  background:linear-gradient(135deg, var(--accent), #b9803f); color:#fff; border-radius:16px;
  padding:22px 26px; margin-bottom:20px; box-shadow:var(--shadow);
}
[data-theme="dark"] .countdown-card{background:linear-gradient(135deg,#7a4e22,#4a3116);}
.countdown-label{font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; opacity:.85; font-weight:700;}
.countdown-time{font-family:var(--serif); font-size:44px; font-weight:700; margin:6px 0 4px; letter-spacing:.01em;}
.countdown-sub{font-size:13.5px; opacity:.9;}
.countdown-actions{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
.countdown-actions .btn{background:rgba(255,255,255,.15); border-color:rgba(255,255,255,.4); color:#fff;}
.countdown-actions .btn:hover{background:rgba(255,255,255,.28);}
.urgency-critical{background:linear-gradient(135deg,#8f2b20,#c0392b) !important;}
.urgency-high{background:linear-gradient(135deg,#a15b00,#c07a1b) !important;}

.card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow);}
.card h3{margin:0 0 12px; font-family:var(--serif); font-size:16.5px;}
.progress-row{margin-bottom:12px;}
.progress-row:last-child{margin-bottom:0;}
.progress-label{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
.progress-bar-bg{height:8px; background:var(--bg); border-radius:5px; overflow:hidden; border:1px solid var(--line);}
.progress-bar-fill{height:100%; background:var(--source); border-radius:5px; transition:width .3s ease;}

.recommend-card{border-left:4px solid var(--accent);}
.recommend-card .why{color:var(--ink-soft); font-size:13.5px; margin:6px 0 12px;}

.quick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.quick-tile{
  background:var(--bg-elev); border:1px solid var(--line); border-radius:10px; padding:14px;
  text-align:left; font-size:13.5px; font-weight:700; display:flex; flex-direction:column; gap:4px;
}
.quick-tile:hover{border-color:var(--accent);}
.quick-tile .sub{font-weight:400; color:var(--ink-soft); font-size:11.5px;}

.emergency-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;}
.emergency-tile{
  background:var(--weak); color:#fff; border:none; border-radius:10px; padding:14px; font-weight:700; font-size:13px;
}
.emergency-tile:nth-child(2){background:var(--review);}
.emergency-tile:nth-child(3){background:#8f2b20;}
.emergency-tile:nth-child(4){background:#5c1710;}

h1.page-title{font-family:var(--serif); font-size:26px; margin:0 0 4px;}
.breadcrumb{font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;}
.breadcrumb a{color:var(--source); text-decoration:none; cursor:pointer;}

/* ===== Topic hub ===== */
.topic-hero{padding:8px 0 18px;}
.topic-hero p{color:var(--ink-soft); line-height:1.6; max-width:640px;}
.section-nav-list{display:flex; flex-direction:column; gap:6px;}
.section-nav-item{
  display:flex; align-items:center; gap:12px; padding:13px 15px; border:1px solid var(--line);
  border-radius:10px; background:var(--bg-elev); cursor:pointer;
}
.section-nav-item:hover{border-color:var(--accent);}
.section-nav-item .num{font-family:var(--serif); font-weight:700; color:var(--ink-soft); width:22px; flex-shrink:0;}
.section-nav-item .info{flex:1; min-width:0;}
.section-nav-item .info .t{font-weight:700; font-size:14.5px;}
.section-nav-item .info .m{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.priority-tag{font-size:10.5px; font-weight:800; padding:3px 7px; border-radius:6px; flex-shrink:0;}
.priority-must{background:#fbe3df; color:var(--weak);}
[data-theme="dark"] .priority-must{background:#3a1c17;}
.priority-should{background:var(--strategy-bg); color:var(--strategy);}
.priority-good{background:var(--line); color:var(--ink-soft);}

/* ===== Section reader ===== */
.reader-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
.reader-progress{font-size:12px; color:var(--ink-soft);}
.reader-content{font-family:var(--serif); font-size:17.5px; line-height:1.75; max-width:700px;}
.reader-content p{margin:0 0 16px;}
.reader-content .lead{font-size:19px;}
.tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.tag{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; padding:4px 9px; border-radius:6px; font-family:var(--sans);}
.tag-source{background:var(--source-bg); color:var(--source);}
.tag-interp{background:var(--interp-bg); color:var(--interp);}
.tag-appl{background:var(--appl-bg); color:var(--appl);}
.tag-bd{background:var(--bd-bg); color:var(--bd);}
.tag-strategy{background:var(--strategy-bg); color:var(--strategy);}

.highlight-box{background:var(--source-bg); border-left:3px solid var(--source); padding:12px 16px; border-radius:0 8px 8px 0; margin:16px 0; font-size:16px;}
[data-theme="dark"] .highlight-box{background:var(--source-bg);}

.disclose{border:1px solid var(--line); border-radius:9px; margin:10px 0; overflow:hidden; font-family:var(--sans);}
.disclose summary{padding:11px 14px; cursor:pointer; font-weight:700; font-size:13.5px; list-style:none; display:flex; justify-content:space-between; align-items:center; background:var(--bg-elev);}
.disclose summary::-webkit-details-marker{display:none;}
.disclose summary:after{content:"▸"; color:var(--ink-soft); transition:transform .15s;}
.disclose[open] summary:after{transform:rotate(90deg);}
.disclose .body{padding:4px 14px 14px; font-size:14.5px; line-height:1.65; color:var(--ink);}

.bangla-note{font-size:13px; color:var(--bd); background:var(--bd-bg); padding:2px 8px; border-radius:6px; margin-left:6px; font-family:var(--sans); display:inline-block;}

.levels-tab{display:flex; gap:6px; margin-bottom:12px;}
.level-btn{font-size:12px; padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--bg-elev); font-weight:700;}
.level-btn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

.reader-footer{display:flex; justify-content:space-between; align-items:center; margin-top:32px; padding-top:16px; border-top:1px solid var(--line); gap:10px; flex-wrap:wrap;}

.related-link{font-size:13px; color:var(--source); cursor:pointer; text-decoration:underline; text-underline-offset:2px;}

/* ===== Cards: thinker / citation / evidence / vocab ===== */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px;}
.mini-card{background:var(--bg-elev); border:1px solid var(--line); border-radius:11px; padding:15px 16px;}
.mini-card h4{margin:0 0 6px; font-size:14.5px; font-family:var(--serif);}
.mini-card .row{font-size:12.5px; margin:4px 0; line-height:1.5;}
.mini-card .row b{color:var(--ink-soft); font-weight:700; text-transform:uppercase; font-size:10px; letter-spacing:.03em; display:block; margin-bottom:1px;}
.used-in{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px;}
.used-in span{font-size:11px; background:var(--source-bg); color:var(--source); padding:3px 8px; border-radius:6px; cursor:pointer;}

/* ===== Recall ===== */
.recall-card{background:var(--bg-elev); border:1px solid var(--line); border-radius:14px; padding:24px; text-align:center; max-width:600px; margin:20px auto;}
.recall-q{font-family:var(--serif); font-size:19px; margin-bottom:18px; line-height:1.5;}
.recall-answer{background:var(--bg); border-radius:10px; padding:16px; text-align:left; font-size:14.5px; line-height:1.6; margin-top:14px;}
.recall-rate{display:flex; gap:8px; justify-content:center; margin-top:16px;}
.rate-btn{flex:1; max-width:140px; padding:10px; border-radius:9px; font-weight:700; font-size:13px; border:1px solid var(--line);}
.rate-know{background:var(--appl-bg); color:var(--appl);}
.rate-almost{background:var(--strategy-bg); color:var(--strategy);}
.rate-forgot{background:#fbe3df; color:var(--weak);}
[data-theme="dark"] .rate-forgot{background:#3a1c17;}

/* ===== Exam question flow ===== */
.exam-step{background:var(--bg-elev); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:12px;}
.exam-step h4{margin:0 0 8px; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); font-family:var(--sans); font-weight:800;}
.exam-step .content{font-size:15px; line-height:1.65;}

/* ===== Search ===== */
.search-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding-top:80px;
}
.search-box{background:var(--bg-elev); width:560px; max-width:92vw; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.3); overflow:hidden;}
.search-input{width:100%; border:none; padding:18px 20px; font-size:17px; background:transparent; color:var(--ink); outline:none; border-bottom:1px solid var(--line);}
.search-results{max-height:400px; overflow-y:auto;}
.search-result{padding:12px 20px; border-bottom:1px solid var(--line); cursor:pointer;}
.search-result:hover{background:var(--bg);}
.search-result .rtitle{font-weight:700; font-size:14px;}
.search-result .rloc{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

/* Modal for exam time / shortcuts */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; display:flex; align-items:center; justify-content:center;}
.modal{background:var(--bg-elev); border-radius:14px; padding:24px; width:380px; max-width:90vw;}
.modal h3{margin-top:0;}
.modal input, .modal select{width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:14px; margin-bottom:12px;}
.modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:6px;}

.filter-row{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.filter-chip{font-size:12px; padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--bg-elev); font-weight:700;}
.filter-chip.active{background:var(--ink); color:var(--bg);}

.connect-diagram{display:flex; align-items:stretch; gap:14px; margin:18px 0; flex-wrap:wrap;}
.connect-col{flex:1; min-width:220px; background:var(--bg-elev); border:1px solid var(--line); border-radius:12px; padding:16px;}
.connect-col h4{margin:0 0 8px; font-family:var(--serif);}
.connect-mid{flex:0 0 40px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:20px;}

.mastersheet-block{margin-bottom:20px;}
.mastersheet-block h3{font-family:var(--serif); border-bottom:2px solid var(--accent); padding-bottom:6px; margin-bottom:10px;}
.mastersheet-item{font-size:13.5px; line-height:1.6; margin-bottom:6px; padding-left:14px; border-left:2px solid var(--line);}

footer.shortcuts-hint{position:fixed; bottom:12px; right:16px; font-size:11px; color:var(--ink-soft); background:var(--bg-elev); padding:6px 10px; border-radius:8px; border:1px solid var(--line); z-index:10;}

@media (max-width:820px){
  .hamburger-btn{display:inline-flex; align-items:center; justify-content:center;}
  .sidebar{
    position:fixed; left:0; top:0; bottom:0; z-index:150; box-shadow:var(--shadow);
    width:82vw; max-width:300px; transform:translateX(-100%); transition:transform .2s ease;
    padding-top:60px;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-close-btn{
    display:flex; align-items:center; justify-content:center; position:absolute; top:10px; right:10px;
    width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
    font-size:16px; z-index:1;
  }
  .sidebar-backdrop{
    display:block; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:140;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sidebar-backdrop.open{opacity:1; pointer-events:auto;}
  .main{padding:18px 16px 80px;}
  footer.shortcuts-hint{display:none;}
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}
</style>
</head>

<script>
/* =========================================================================
   DATA LAYER
   Every content object carries a `tag` field: source | interp | appl | bd | strategy
   SOURCE = directly supported by the two texts in the PDF (Wasko's Introduction,
   and Bourdieu's "On Television", Part One, as excerpted in Television_Criticism.pdf)
   ========================================================================= */

const DATA = {
  topics: [
    {
      id:"t1", short:"Topic 1", title:"Television as a Social, Cultural, Political & Economic Force",
      author:"Janet Wasko — “Introduction”",
      blurb:"A broad, balanced overview of what television is, why it matters, and how scholars have studied it — covering both its praised and its criticized sides.",
      sections:[
        {
          id:"t1-1", title:"Big Picture: What Is Television?", priority:"must",
          level1:"Television isn't just a box that shows pictures. It's a technology, a household object, an industry, and a huge force that shapes society, politics, the economy and culture — all at once.",
          level2:"Wasko frames television as a <b>multifaceted apparatus</b>: (1) a technological process — an electronic device transmitting images and sound; (2) an industrial system that produces and distributes content and commerce; and (3) consequently a <b>social, political, economic, and cultural force</b>. The technology itself dates to the 1920s, but television as mass communication only emerged in the late 1940s–1950s. Because delivery systems keep changing (cable, satellite, digital, the internet), Wasko calls television a <b>“moving target”</b> — an enigmatic, uncertain, and contested object of study.",
          level3:"Exam line: “Television is not merely a technical device but, as Wasko (2013) argues, a social, political, economic, and cultural force whose character is a constantly shifting ‘moving target.’”",
          highlight:"Television is not only a technical device, but also a social, political, economic, and cultural force.",
          bangla:[["multifaceted","বহুমুখী (বহু দিক বিশিষ্ট)"],["ubiquitous","সর্বত্র বিরাজমান"]],
          why:"This is the thesis statement of the whole introduction — almost any Topic 1 answer can open with it.",
          evidence:"e-history",
          citation:"c-multifaceted",
          exam:"Use this as your opening definition sentence for ANY question that asks 'what is television' or 'define television as a social force.'",
          bd:"In Bangladesh, television has similarly moved from a state-run single channel (BTV) to a multi-channel, satellite and now digital-streaming environment — the same 'moving target' quality Wasko describes.",
          related:["t1-6"]
        },
        {
          id:"t1-2", title:"Core Concepts: Definitions & Character", priority:"should",
          level1:"The dictionary defines television three ways: the transmission technology, the physical device, and the industry that makes programs.",
          level2:"Wasko opens with the dictionary definition (technology of transmission; the apparatus/device; and the <i>industry</i> of producing and broadcasting programs). She stresses that television's meaning is not fixed — it varies by country and era, and keeps changing with new technology (VCRs, cable, pay-TV, satellite, digital/HD) and with competition from computers and the internet, which increasingly challenge TV's dominance as the primary mass medium.",
          level3:"Exam line: “Television can be defined technologically (as an apparatus), industrially (as a system of production and distribution), and socially (as a cultural force) — and Wasko notes all three meanings shift with new technology.”",
          bangla:[["apparatus","যন্ত্র / যন্ত্রপাতি"],["mass communication","গণযোগাযোগ"]],
          why:"Examiners like a clean three-part definition at the start of an answer — it signals command of terminology.",
          citation:"c-dictionary",
          exam:"If asked to 'define television,' give this three-part structure before moving to argument.",
        },
        {
          id:"t1-3", title:"Positive Perspectives", priority:"must",
          level1:"Many people say television is a good thing: it teaches, informs, brings people together, and even helps the economy.",
          level2:"Wasko surveys the case FOR television. Philo Farnsworth (an early inventor) hoped TV would become <b>“the world's greatest teaching tool”</b>, wipe out illiteracy, deliver undistorted live news, and even promote world peace by letting people see other cultures. Later, others echoed a milder version: 'good television' can present arts, science and culture, teach values, explore sensitive issues, build critical thinking, and provide companionship for isolated people. Signorielli and Bacue (1999) call television society's <b>common storyteller</b> — its 'mainstream,' teaching audiences who is good/bad, who wins/loses, and what gender roles mean, functioning as a socialization agent. Wasko also notes the economic case: in 2001 US broadcast TV revenues were $54.4 billion, and TV provides significant employment.",
          level3:"Exam line: “Television has been defended as a socializing ‘storyteller’ (Signorielli & Bacue, 1999) and an educational tool (Farnsworth), as well as a significant economic engine.”",
          highlight:"Television's role in society is one of common storyteller — it is the mainstream of our popular culture.",
          bangla:[["storyteller","গল্পকথক"],["socialization","সামাজিকীকরণ"]],
          why:"Gives you the 'positive' half of any balanced-discussion answer.",

      blurb:"Bourdieu's sociological critique of television journalism: how invisible mechanisms — time pressure, ratings, competition, and the very format of the medium — shape (and censor) what gets shown, often without anyone intending it.",
      sections:[
        {
          id:"t2-1", title:"Big Picture: Why Bourdieu Is Speaking", priority:"must",
          level1:"Bourdieu is giving a rare, unscripted TV lecture about television itself, and he explains why that's an unusual and important opportunity.",
          level2:"Bourdieu opens by noting the paradox of criticizing television <i>on</i> television. He says this appearance is exceptional: he faces no time limit, chose his own topic, and is free from the usual production pressures (technical requirements, 'the public-that-won't-understand,' morality/decency demands) — what he calls unusual <b>“control of the instruments of production.”</b> He argues researchers have a duty (‘humanity's civil servants,’ citing Husserl) to share findings with everyone, but warns that agreeing to appear on TV without asking hard questions first (Do I have something to say? Can I say it here?) often means people appear merely from <b>“the desire to be seen”</b> — citing Berkeley's “to be is to be perceived” and Deleuze's remark that many public intellectuals produce work mainly to “get them on television.”",

          id:"t2-2", title:"Invisible Censorship", priority:"must",
          level1:"Television looks free, but it's actually shaped by hidden pressures — political, economic, and self-imposed — that limit what can be said.",

          id:"t2-3", title:"Symbolic Violence", priority:"must",
          level1:"'Symbolic violence' means a kind of hidden power that works because both the people using it and the people affected by it don't fully realize it's happening.",
          level2:"This is one of Bourdieu's central concepts. He defines it precisely: <b>“Symbolic violence is violence wielded with tacit complicity between its victims and its agents, insofar as both remain unconscious of submitting to or wielding it.”</b> He argues the more people in the media 'milieu' are themselves manipulated (by ratings, competition, deadlines), the more effectively they manipulate others — and the less conscious they are of doing so. Sociology's job, he says, is to reveal what is hidden, thereby helping minimize this symbolic violence in social/communicative relations.",
          level3:"Exam line: “Symbolic violence, for Bourdieu, is domination that works through complicity rather than force — both journalist and audience are typically unaware of the mechanism, which is precisely what makes it powerful.”",

          id:"t2-4", title:"Sensationalism, Selection & Show-and-Hide", priority:"must",
          level1:"TV news picks certain stories because they're dramatic and safe crowd-pleasers, and can even 'hide' the truth by showing something else instead, or by showing something in a way that empties it of meaning.",
          level2:"Bourdieu starts with 'an easy example': sensational news (blood, sex, melodrama, crime) — always the 'favorite food of tabloids,' now spilling into TV news because of competition for audience share. Sensational, uncontroversial items ('that won't shock anyone... don't divide') fill up scarce broadcast time — time that could otherwise cover substantive issues. He then goes deeper: television can <b>“hide by showing.”</b> It hides things by (a) showing something other than what should be shown, (b) showing something but insignificantly, or (c) constructing it so it 'takes on a meaning that has nothing to do with reality.' Drawing on Patrick Champagne's research, Bourdieu explains journalists see through particular perceptual <b>“glasses”</b> (categories shaped by education/training) that determine what gets selected — driven by a principle he calls the search for the <b>sensational and the spectacular</b>, achieved through <b>dramatization</b> (putting an event 'on stage,' exaggerating its seriousness/drama).",

          id:"t2-5", title:"The Reality Effect", priority:"must",
          level1:"Because images look so real, television doesn't just show reality — it can actually create belief, and even mobilize groups of people, sometimes with dangerous political effects.",
          level2:"Bourdieu names this the <b>reality effect</b> (a term he borrows from literary criticism): <b>“images have the peculiar capacity to produce... a reality effect. They show things and make people believe in what they show.”</b> This 'power to show is also a power to mobilize' — images can 'give a life to ideas or images, but also to groups,' and can unleash racism, chauvinism or xenophobia. Crucially: <b>“The simple report, the very fact of reporting, of putting on record as a reporter, always implies a social construction of reality that can mobilize (or demobilize) individuals or groups.”</b> He also states television <b>“enjoys a de facto monopoly on what goes into the heads of a significant part of the population and what they think”</b> — because many people rely on TV as their sole source of news. Using Champagne's case studies (inner-city coverage; the 1986 student strike), Bourdieu shows how even well-intentioned, 'innocent' journalism produces real political effects nobody intended.",
          level3:"Exam line: “Bourdieu's ‘reality effect’ captures television's unique power: because images seem to simply record reality, they can construct and mobilize belief — while appearing neutral.”",

          id:"t2-6", title:"The Circular Circulation of Information", priority:"should",
          level1:"Journalists mostly get their ideas about what's newsworthy from... other journalists. This makes news outlets copy each other and become surprisingly similar, even though they compete fiercely.",
          level2:"Bourdieu argues 'the journalist' as an individual subject barely exists — journalistic products are 'much more alike than is generally thought,' because journalists constantly read/watch each other (a 'daily review of the press' is essential), producing homogenization. Counter-intuitively, he says <b>competition produces uniformity, not diversity</b> (against classic free-market theory), because outlets facing identical pressures and audience-rating polls converge on the same stories and commentators. He gives a vivid example: journalists boast <b>“we left TF1 in the dust”</b> over tiny production differences (like who had better sound) that are invisible to ordinary viewers but treated as hugely significant by producers. The result, he says, is choices “made on television are choices made by no [single] subject” — a 'circular circulation' that also produces a strong, largely invisible form of censorship (anything outside the shared agenda struggles to get covered, e.g. he notes news from Algeria or on foreigners' status in France was hard to place).",
          level3:"Exam line: “Bourdieu inverts free-market logic: rather than producing diversity, competition among journalists subject to identical pressures produces homogenization — a ‘circular circulation of information.’”",
          highlight:"Free market economics holds that monopoly creates uniformity and competition produces diversity... I observe that competition homogenizes.",

        {
          id:"t2-7", title:"Audience Ratings & Fast-Thinking", priority:"must",
          level1:"Because ratings decide careers, TV favors guests who can produce quick, ready-made opinions — 'fast-thinkers' — rather than people who need time to actually think something through.",
          level2:"Audience ratings (Nielsen in the US) have become, in Bourdieu's phrase, the <b>“journalist's Last Judgment”</b> — a 'rating mindset' now dominates editorial rooms and even avant-garde publishing, reversing a historical norm (since Baudelaire/Flaubert) where immediate market success was viewed with suspicion in serious cultural production. This ratings pressure produces <b>fast-thinkers</b>: because television rewards people who can respond instantly, it mainly gives airtime to those who think in <b>“received ideas”</b> — banal, ready-made, already-familiar thoughts (a term from Flaubert) that require no real decoding effort from the audience. Bourdieu contrasts this with genuine <i>thought</i>, which he calls inherently subversive and time-dependent: it must build a chain of reasoning ('therefore... consequently...'), which television's time pressure makes nearly impossible.",
          level3:"Exam line: “Because ratings punish hesitation, Bourdieu argues television structurally selects for ‘fast-thinkers’ offering ‘received ideas’ rather than genuine, time-dependent thought.”",

        {
          id:"t2-8", title:"Debates: Truly False or Falsely True", priority:"should",
          level1:"Some TV debates are obviously fake (everyone agrees already). Others look genuinely democratic but are secretly controlled by the moderator, the guest list, and pre-arranged scripts.",
          level2:"Bourdieu distinguishes two kinds of flawed televised debate. (1) <b>Bogus debates</b>: pairing commentators who are 'birds of a feather' despite supposedly representing opposite political sides — they lunch together, know each other, and the 'opposition' is performance. (2) <b>Falsely genuine debates</b> — his main example is a debate organized by Cavada during 1986 strikes, which <i>looked</i> democratic. Bourdieu 'uncovers a string of censorship' within it: the <b>moderator</b> controls topic, tone, turn-taking, and subtly signals approval/impatience (even the many meanings of 'thank you'); the <b>studio arrangement</b> (who's seated where, e.g. an earlier Cercle de Minuit program reshuffled who sat 'left' vs. 'right' between two broadcasts, changing the apparent message); <b>pre-show arrangements</b> create a near-'screenplay' guests are expected to follow, leaving little room for spontaneity; and the industry favors <b>“good guests”</b> — a real term for reliable fast-thinkers who 'won't create problems.' He also invokes Wittgenstein's idea of a <b>language game</b>: TV debate has tacit rules modelled on wrestling (conflict with 'good guys and bad guys') where not all rhetorical 'holds' are allowed.",
          level3:"Exam line: “Even a debate that looks formally democratic can be shaped by invisible factors — the moderator's unconscious biases, studio arrangement, pre-negotiated ‘screenplays,’ and a preference for compliant ‘good guests.’”",

        {
          id:"t2-9", title:"Contradictions, Tensions & the Journalistic Field", priority:"should",
          level1:"Television is caught in a basic contradiction: the very conditions that let people produce serious, independent work are undermined by the market pressure needed to reach a mass audience — and Bourdieu introduces a technical idea, the 'journalistic field,' to explain this structurally rather than blaming individuals.",
          level2:"Bourdieu closes Part One by naming <b>relations of competition</b> (relentless, even absurd) and <b>relations of collusion</b> (shared interests) among journalists, both rooted in shared social background and training. He revisits the 1960s fear that TV would simply 'massify' (flatten) culture — arguing this underestimated both viewers' resistance <i>and</i> television's deeper power to transform cultural producers themselves via its 'irresistible fascination.' He identifies a fundamental contradiction: work like avant-garde poetry or mathematics needs conditions of relative independence from the market to be produced, but transmitting it to everybody requires exactly the market-driven, ratings-based system that undermines that independence. He also notes rising tension between star journalists (highly paid, highly exposed to pressure) and 'invisible' reporters increasingly trained but assigned to insignificant work. In the opening of Part Two, Bourdieu introduces the <b>“journalistic field”</b> — a technical sociological term for journalism as a semi-autonomous microcosm with its own internal rules, shaped by (but not reducible to) both its position in the wider world and pressures from other fields. He explicitly rejects simple economic determinism: TF1's programming <i>cannot</i> be explained solely by the fact that it is owned by Bouygues — that fact matters, but a 'half-baked' Marxist explanation based on ownership alone 'explains nothing.'",
          level3:"Exam line: “Bourdieu resists simple economic determinism, introducing the ‘journalistic field’ as a semi-autonomous microcosm whose internal competitive/collusive dynamics — not ownership alone — shape output.”",
          highlight:"This half-baked version of materialism, associated with Marxism, condemns without shedding light anywhere and ultimately explains nothing.",
          bangla:[["field (sociology)","ক্ষেত্র (সমাজতাত্ত্বিক অর্থে)"],["autonomy","স্বায়ত্তশাসন"],["determinism","নির্ধারণবাদ"]],

    {id:"th-bourdieu", name:"Pierre Bourdieu", idea:"French sociologist; author of “On Television.”", argue:"Television's power operates through invisible, structural mechanisms — symbolic violence, invisible censorship, the reality effect, fast-thinking, and the 'journalistic field' — not through any single villain or owner.", concept:"Symbolic violence; the journalistic field; the reality effect.", useIn:"Every Topic 2 question.", citation:"“Symbolic violence is violence wielded with tacit complicity between its victims and its agents...”", hook:"BOURDIEU digs BELOW (bourdieu ≈ 'under') the visible surface for hidden structures."},

  vocabulary:[
    {word:"Sensationalism", simple:"Exaggerated, dramatic presentation designed to grab attention.", bn:"চমকপ্রদ/উত্তেজনামূলক উপস্থাপন", meaning:"Bourdieu's term for TV/tabloid focus on blood, sex, crime and melodrama to attract audience share.", ex:"“Sensationalism attracts notice, and it also diverts it” (Bourdieu).", related:"t2-4"},
    {word:"Symbolic violence", simple:"A hidden kind of power that works because people don't realize it's happening.", bn:"প্রতীকী সহিংসতা", meaning:"Domination exercised with the unconscious complicity of both the person using it and the person affected by it.", ex:"Television's structural pressures operate as a form of symbolic violence on both journalists and audiences.", related:"t2-3"},
    {word:"Reality effect", simple:"The way images make us believe what they show is simply 'the truth.'", bn:"বাস্তবতার প্রতিভাস", meaning:"The peculiar capacity of images to make people believe in what they show, giving television power to mobilize belief and even groups.", ex:"The reality effect helps explain why televised images can provoke strong political reactions.", related:"t2-5"},
    {word:"Fast-thinkers", simple:"Guests/commentators who can produce quick, ready-made opinions on demand.", bn:"দ্রুত-চিন্তক", meaning:"People television repeatedly invites because they can speak instantly in 'received ideas' rather than developed argument.", ex:"Fast-thinkers offer cultural 'fast food' — predigested culture.", related:"t2-7"},
    {word:"Journalistic field", simple:"Journalism as its own 'world' with its own internal rules, not fully controlled by any single owner or government.", bn:"সাংবাদিকতার ক্ষেত্র", meaning:"Bourdieu's technical term for journalism as a semi-autonomous social microcosm shaped by internal competition and collusion.", ex:"Bourdieu explains TF1's output through the journalistic field, not ownership alone.", related:"t2-9"},
    {word:"Dramatization", simple:"Making an event seem more serious, exciting or tragic than it plainly is.", bn:"নাটকীয়করণ", meaning:"Putting an event 'on stage' — exaggerating its importance and emotional weight for television.", ex:"Television calls for dramatization in both senses: staging an event, and putting it into images.", related:"t2-4"},
    {word:"Homogenization", simple:"Different news outlets ending up looking and sounding the same.", bn:"একরূপীকরণ", meaning:"The process by which competing journalists/outlets, facing identical pressures, converge on similar stories and framing.", ex:"Bourdieu argues competition among journalists produces homogenization rather than diversity.", related:"t2-6"},
    {word:"Ideological source", simple:"A source of values and beliefs, even if it doesn't try to be.", bn:"মতাদর্শিক উৎস", meaning:"Wasko's description of TV as inevitably distributing values, morals and ethical standards through its content.", ex:"Television is an ideological source that cannot be overlooked in modern societies (Wasko).", related:"t1-7"},

    {word:"Self-censorship", simple:"Holding back what you'd say, without anyone forcing you to.", bn:"স্ব-নিয়ন্ত্রণ", meaning:"Journalists limiting themselves due to job insecurity and competitive pressure, without explicit orders.", ex:"Consciously or unconsciously, people censor themselves — they don't need to be called into line (Bourdieu).", related:"t2-2"},

  examQuestions:[
    {marks:"20", type:"single", topic:"t1", q:"Discuss the major positive and negative perspectives on television's role in society, as outlined by Wasko.",
      wants:"A balanced discussion covering BOTH sides — not just one — with named thinkers on each side and an evaluative conclusion.",
      concepts:["Multifaceted force","Storyteller/socialization agent","Vast wasteland","Inherently destructive technology (Mander)"],
      evidenceIds:["e-revenue","e-history"], citationIds:["c-multifaceted","c-storyteller","c-minow"],
      structure:"Intro (define TV as multifaceted force) → Body 1: positive case (Farnsworth, storyteller, economic impact) → Body 2: negative case (Minow, Silver, Mander) → Complexity/evaluation (why views differ; TV as 'moving target') → Conclusion.",
      intro:"Television, as Wasko (2013) argues, is not merely a technical device but a social, political, economic, and cultural force — and this dual identity underlies a long-running debate between defenders who see it as educational and unifying, and critics who see it as vacuous or even destructive.",
      body1:"On the positive side, early inventors like Farnsworth envisioned television as an unprecedented teaching tool capable of ending illiteracy and even fostering world peace through cross-cultural understanding. More measured defenders point to television's role as society's 'common storyteller' (Signorielli & Bacue, 1999) — a socialization agent that conveys shared norms — as well as its substantial economic contribution ($54.4 billion in US broadcast revenue in 2001).",
      body2:"On the negative side, Newton Minow's 1961 description of American television as a 'vast wasteland' remains one of the most quoted critiques, acknowledging television's potential while condemning its actual output. John Silver went further, arguing television's 'indiscriminate advocacy of pleasure' erodes the institutions — family, church, school — that sustain internalized morality. Jerry Mander's 1977 position is the most radical: he claims television is not a neutral technology at all, and that its very existence, independent of content, is destructive to human nature.",
      conclusion:"These competing views may partly reflect television's nature as a 'moving target' (Wasko) — a medium whose meaning shifts across time, technology, and culture, making a single fixed verdict on its value difficult to sustain."
    },
    {marks:"20", type:"single", topic:"t2", q:"Explain, with reference to Bourdieu, how invisible mechanisms shape what appears on television.",
      wants:"A structural, mechanism-by-mechanism explanation — not a list of complaints about journalists as individuals.",
      concepts:["Invisible censorship","Symbolic violence","Reality effect / show-and-hide","Circular circulation / homogenization","Fast-thinkers & ratings","Journalistic field"],
      evidenceIds:["e-ownership","e-champagne","e-ratings"], citationIds:["c-symbolicviolence","c-ownership","c-monopoly","c-tf1dust","c-fastthinkers"],
      structure:"Intro (Bourdieu's project is structural, not personal blame) → Body 1: invisible censorship (time, politics, ownership, self-censorship) → Body 2: symbolic violence & the reality effect (show-and-hide) → Body 3: circular circulation and ratings/fast-thinking → Conclusion (journalistic field, not simple ownership determinism).",
      intro:"Bourdieu's central claim in 'On Television' is that what appears on screen is shaped less by any single controlling actor than by a set of largely invisible structural mechanisms — what he terms symbolic violence, operating with the unconscious complicity of both journalists and audiences.",
      body1:"First, television is subject to a layered, invisible censorship: severe time limits that make sustained argument nearly impossible, political control (especially over hiring at state-linked stations), economic ownership (e.g. NBC/General Electric, TF1/Bouygues), and — perhaps most powerfully — self-censorship born of job insecurity, which requires no direct order ('they don't need to be called into line').",
      body2:"Second, television can 'hide by showing': sensational, safe stories crowd out substantive coverage, and journalists' trained perceptual 'glasses' (per Champagne's fieldwork) determine what counts as newsworthy through a logic of dramatization. This connects to the 'reality effect' — Bourdieu's argument that images do not merely record reality but construct belief in it, giving television 'a de facto monopoly on what goes into the heads of a significant part of the population.'",
      body3:"Third, competition among journalists produces homogenization rather than diversity, as outlets facing identical ratings pressure copy and monitor one another — Bourdieu's 'circular circulation of information.' Audience ratings, which he calls the journalist's 'Last Judgment,' further reward 'fast-thinkers' who supply ready-made 'received ideas' rather than the sustained argument genuine thought requires.",
      conclusion:"Crucially, Bourdieu resists reducing this to simple economic determinism: TF1's output cannot be explained by Bouygues ownership alone. Instead, he proposes the 'journalistic field' — a semi-autonomous microcosm whose internal dynamics of competition and collusion shape output independently of any single owner's intentions."
    },
    {marks:"10+10", type:"double", topic:"both", qa:"Explain the concept of symbolic violence in Bourdieu's analysis of television.", qb:"Discuss two positive functions of television identified by Wasko.",
      wants:"Two separate, concise, well-organized answers — do not blend them.",
      aAnswer:"Symbolic violence, for Bourdieu, is 'violence wielded with tacit complicity between its victims and its agents, insofar as both remain unconscious of submitting to or wielding it' (p.17). Unlike physical coercion, it works precisely because neither the journalist exercising it (through sensationalism, dramatization, or ratings-driven choices) nor the audience receiving it is fully aware of the mechanism. Bourdieu argues that those most embedded in the media system are often themselves the most manipulated — by ratings, competition, and time pressure — and this unconsciousness is what makes their influence over others so effective. Sociology's task, for Bourdieu, is to reveal these hidden mechanisms and thereby help minimize the symbolic violence within social and communicative relations.",
      bAnswer:"Wasko identifies several positive functions. First, television acts as society's 'common storyteller' (Signorielli & Bacue, 1999) — a socialization agent that conveys shared cultural norms about success, failure, and gender roles, functioning as 'the mainstream of our popular culture.' Second, television has a significant educational and informational function: Farnsworth envisioned it as 'the world's greatest teaching tool,' and Wasko notes that 'good television' can present arts, science and culture, teach values, and build critical thinking about society. A brief third point — television's economic role, generating $54.4 billion in US broadcast revenue in 2001 and providing employment — could substitute if a purely social/educational focus is not required.",
    },
    {marks:"20", type:"single", topic:"connection", q:"Compare Wasko's overview of television's role in society with Bourdieu's critical analysis of the mechanisms behind television's power.",
      wants:"A genuine comparison — similarities AND differences — not two separate summaries stitched together.",

/* =========================================================================
   COUNTDOWN
   ========================================================================= */
function countdownParts(){
  if(!STATE.examTime) return null;
  const diff = new Date(STATE.examTime).getTime() - Date.now();
  if(diff<=0) return {d:0,h:0,m:0,s:0,total:0,past:true};
  const total = diff;
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  return {d,h,m,s,total,past:false};
}
function countdownShortText(){
  const p = countdownParts();
  if(!p) return 'Set exam time';
  if(p.past) return 'Exam time reached';
  if(p.d>0) return `${p.d}d ${p.h}h left`;
  return `${String(p.h).padStart(2,'0')}:${String(p.m).padStart(2,'0')}:${String(p.s).padStart(2,'0')}`;
}
let countdownTimer = setInterval(()=>{
  const pill = document.getElementById('countdown-pill');
  if(pill) pill.textContent = countdownShortText();
  const big = document.getElementById('countdown-big');
  if(big){
    const p = countdownParts();
    if(p && !p.past){
      big.textContent = (p.d>0? p.d+'d ' : '') + `${String(p.h).padStart(2,'0')}:${String(p.m).padStart(2,'0')}:${String(p.s).padStart(2,'0')}`;
      const card = document.getElementById('countdown-card');
      if(card){
        card.classList.remove('urgency-critical','urgency-high');
        if(p.total < 15*60000) card.classList.add('urgency-critical');
        else if(p.total < 2*3600000) card.classList.add('urgency-high');
      }
    } else if(p && p.past){
      big.textContent = "Good luck!";
    }
  }
},1000);

  const timeVal = `${pad(existing.getHours())}:${pad(existing.getMinutes())}`;

/* =========================================================================

   ========================================================================= */
function topicProgress(topicId){
  const t = DATA.topics.find(x=>x.id===topicId);
  const total = t.sections.length;
  let understood=0, reading=0;
  t.sections.forEach(s=>{
    const st = STATE.progress[s.id];
    if(st==='understood') understood++;
    else if(st==='reading'||st==='needsreview') reading++;
  });
  const pct = Math.round((understood/total)*100);
  return {pct, understood, total, reading};
}
function overallRecallPct(){
  const keys = Object.keys(STATE.recall);
  if(DATA.recall.length===0) return 0;
  const known = keys.filter(k=>STATE.recall[k]==='know').length;
  return Math.round((known/DATA.recall.length)*100);
}
function weakConcepts(){
  return DATA.recall.map((r,i)=>({...r,i})).filter(r=>STATE.recall[r.i]==='forgot' || STATE.recall[r.i]==='almost')
    .sort((a,b)=> (STATE.recall[a.i]==='forgot'?0:1) - (STATE.recall[b.i]==='forgot'?0:1));
}
function nextRecommendation(){
  const p = countdownParts();
  const t1 = topicProgress('t1'), t2 = topicProgress('t2');
  const recallPct = overallRecallPct();
  if(p && !p.past && p.total < 15*60000){
    return {title:"FINAL REVISION MODE", why:"Under 15 minutes left — stop reading new material and switch to the compressed Last 15 Minutes sheet.", action:{screen:'last15'}, label:"Open Last 15 Minutes"};
  }
  if(p && !p.past && p.total < 30*60000){
    return {title:"Master Sheet", why:"Under 30 minutes left — use the one-screen master sheet for final compression.", action:{screen:'master'}, label:"Open Master Sheet"};
  }
  if(t1.pct < 60){
    const next = DATA.topics[0].sections.find(s=>STATE.progress[s.id]!=='understood');
    return {title:`Topic 1 → ${next?next.title:'Review'}`, why:"You haven't yet built a solid base in Topic 1 — start (or continue) reading it section by section.", action: next? {screen:'reader', sectionId:next.id} : {screen:'topicHub', topicId:'t1'}, label:"Start studying →"};
  }
  if(t2.pct < 60){
    const next = DATA.topics[1].sections.find(s=>STATE.progress[s.id]!=='understood');
    return {title:`Topic 2 → ${next?next.title:'Review'}`, why:"Topic 1 is in good shape. Build Topic 2 next — Bourdieu is dense, so go section by section.", action: next? {screen:'reader', sectionId:next.id} : {screen:'topicHub', topicId:'t2'}, label:"Start studying →"};
  }
  if(recallPct < 50){
    return {title:"Active Recall", why:"You understand the concepts — now test whether you can actually remember them without looking.", action:{screen:'recall'}, label:"Start recall →"};
  }
  return {title:"Practice a 20-mark answer", why:"Your foundations and recall are solid. The highest-value use of remaining time now is practicing exam question structure.", action:{screen:'examMode'}, label:"Practice exam questions →"};
}

let readerLevel = 2;
function renderReader(sectionId){
  const s = SECTION_INDEX[sectionId];
  if(!s) return renderHome();
  const t = DATA.topics.find(x=>x.id===s.topicId);
  const idx = t.sections.findIndex(x=>x.id===sectionId);
  const prev = t.sections[idx-1];
  const next = t.sections[idx+1];
  STATE.currentPosition = {topicId:t.id, sectionId}; LS.set('currentPosition', STATE.currentPosition);
  const status = STATE.progress[sectionId] || 'unread';
  if(status==='unread'){ STATE.progress[sectionId]='reading'; saveProgress(); }

  const bangla = STATE.bangla && s.bangla ? s.bangla.map(([w,bn])=>`<span class="bangla-note">${w} → ${bn}</span>`).join(' ') : '';

  const levelContent = readerLevel===1? s.level1 : (readerLevel===3? s.level3 : s.level2);

  return `
  <div class="container">
    <div class="breadcrumb"><a onclick='nav({screen:"topicHub",topicId:"${t.id}"})'>${t.short}</a> → ${s.title}</div>
    <div class="reader-topbar">
      <h1 class="page-title" style="margin-bottom:0">${s.title}</h1>
    </div>
    <div class="reader-progress">Section ${idx+1} of ${t.sections.length}</div>

    <div class="tag-row" style="margin-top:14px">
      <span class="tag tag-source">Source: ${t.author.split('—')[1] ? t.author.split('—')[1].trim() : t.author}</span>
      ${s.priority==='must'?'<span class="tag" style="background:#fbe3df;color:var(--weak)">Must Master</span>':''}
    </div>

    <div class="levels-tab">
      <button class="level-btn ${readerLevel===1?'active':''}" onclick="setReaderLevel(1)">Level 1 · Simple</button>
      <button class="level-btn ${readerLevel===2?'active':''}" onclick="setReaderLevel(2)">Level 2 · Exam Understanding</button>
      <button class="level-btn ${readerLevel===3?'active':''}" onclick="setReaderLevel(3)">Level 3 · Exam Language</button>
    </div>

    <div class="reader-content">
      <p class="lead">${levelContent}</p>
      ${bangla ? `<div style="margin-bottom:16px">${bangla}</div>` : ''}
      ${s.highlight ? `<div class="highlight-box"><span class="tag tag-source" style="margin-bottom:6px;display:inline-block">Source quote</span><br>“${s.highlight}”</div>` : ''}

      ${s.why ? `<details class="disclose"><summary>Why does this matter? ▸</summary><div class="body">${s.why}</div></details>` : ''}
      ${s.evidence && DATA.evidence.find(e=>e.id===s.evidence) ? renderEvidenceDisclose(s.evidence) : ''}
      ${s.exam ? `<details class="disclose"><summary>How can I use this in an exam? ▸</summary><div class="body">${s.exam}</div></details>` : ''}
      ${s.bd ? `<details class="disclose"><summary>Possible Bangladesh application ▸</summary><div class="body"><span class="tag tag-bd">Bangladesh context</span><br><br>${s.bd}</div></details>` : ''}
      ${s.citation && DATA.citations.find(c=>c.id===s.citation) ? renderCitationDisclose(s.citation) : ''}
      ${s.thinkers ? `<details class="disclose"><summary>Related thinkers ▸</summary><div class="body">${s.thinkers.map(tid=>{const th=DATA.thinkers.find(x=>x.id===tid); return th? `<b>${th.name}</b> — ${th.concept}<br>` : '';}).join('')}</div></details>` : ''}
      ${s.related ? `<div style="margin:16px 0">${s.related.map(rid=>{const rs=SECTION_INDEX[rid]; return rs? `<span class="related-link" onclick='nav({screen:"reader",sectionId:"${rid}"})'>Related: ${rs.title} →</span>` : '';}).join(' &nbsp; ')}</div>` : ''}
    </div>

    <div style="display:flex;gap:8px;margin:20px 0">
      <button class="btn ${status==='understood'?'primary':''}" onclick="markSection('${sectionId}','understood')">✓ Mark as understood</button>
      <button class="btn ${status==='needsreview'?'primary':''}" onclick="markSection('${sectionId}','needsreview')">🔴 Needs review</button>
    </div>

    <div class="reader-footer">
      <button class="btn" ${!prev?'disabled':''} onclick='${prev?`nav({screen:"reader",sectionId:"${prev.id}"})`:''}'>← Previous</button>
      <span style="font-size:12px;color:var(--ink-soft)">${idx+1} / ${t.sections.length}</span>
      <button class="btn primary" ${!next?'disabled':''} onclick='${next?`nav({screen:"reader",sectionId:"${next.id}"})`:`nav({screen:"topicHub",topicId:"${t.id}"})`}'>${next?'Next →':'Finish topic →'}</button>
    </div>
  </div>`;
}
function setReaderLevel(l){ readerLevel=l; render(); }
function markSection(id, status){
  STATE.progress[id] = STATE.progress[id]===status ? 'reading' : status;

function renderEvidenceDisclose(eid){
  const e = DATA.evidence.find(x=>x.id===eid);

  return `<details class="disclose"><summary>What evidence supports it? ▸</summary><div class="body">
    <div class="mini-card" style="border:none;padding:0">

function renderCitationDisclose(cid){

  return `<details class="disclose"><summary>Evidence & citation ▸</summary><div class="body">

   ========================================================================= */
let recallState = {order:null, pos:0, revealed:false};
function renderRecall(){
  if(!recallState.order){
    recallState.order = DATA.recall.map((_,i)=>i);
    recallState.pos = 0; recallState.revealed=false;
  }
  const idx = recallState.order[recallState.pos];
  const item = DATA.recall[idx];
  const weak = weakConcepts();
  return `
  <div class="container">
    <h1 class="page-title">Active Recall</h1>
    <div class="filter-row">
      <button class="filter-chip active">${recallState.pos+1} / ${DATA.recall.length}</button>
      <button class="filter-chip" onclick="restartRecall()">Restart</button>
      <button class="filter-chip" onclick="restartRecallWeak()">Review weakest only (${weak.length})</button>
    </div>
    <div class="recall-card">
      <div class="tag-row" style="justify-content:center"><span class="tag ${item.topic==='t1'?'tag-source':'tag-interp'}">${item.topic==='t1'?'Topic 1':'Topic 2'}</span></div>
      <div class="recall-q">${item.q}</div>
      ${!recallState.revealed ? `<button class="btn primary" onclick="revealRecall()">Reveal Answer</button>` : `
        <div class="recall-answer">${item.a}</div>
        <div class="recall-rate">
          <button class="rate-btn rate-forgot" onclick="rateRecall(${idx},'forgot')">✗ I forgot</button>
          <button class="rate-btn rate-almost" onclick="rateRecall(${idx},'almost')">~ Almost</button>
          <button class="rate-btn rate-know" onclick="rateRecall(${idx},'know')">✓ I know this</button>
        </div>
      `}
    </div>
  </div>`;
}
function revealRecall(){ recallState.revealed=true; render(); }
function rateRecall(idx, val){
  STATE.recall[idx]=val; saveRecall();
  recallState.pos++;
  if(recallState.pos>=recallState.order.length){ recallState.order=null; }
  recallState.revealed=false;
  render();
}
function restartRecall(){ recallState.order=null; render(); }
function restartRecallWeak(){
  const weak = weakConcepts();
  recallState.order = weak.length? weak.map(w=>w.i) : DATA.recall.map((_,i)=>i);
  recallState.pos=0; recallState.revealed=false; render();
}

        "Bourdieu: reality effect = images make people believe + can mobilize.",
        "Bourdieu: TV has 'de facto monopoly' on what people think.",
        "Bourdieu: competition among journalists → homogenization, not diversity.",
        "Bourdieu: ratings reward 'fast-thinkers' offering 'received ideas.'",
        "Bourdieu: rejects ownership-only (Marxist) explanation — 'journalistic field' instead."
      ].map(c=>`<div class="mastersheet-item">${c}</div>`).join('')}
  </div>
  <div class="mastersheet-block"><h3>5 citations I can safely use</h3>${DATA.masterSheet.citations.map(c=>`<div class="mastersheet-item">${c}</div>`).join('')}</div>
  <div class="mastersheet-block"><h3>3 answer structures</h3>
    <div class="mastersheet-item">20-mark: Intro → Body 1 → Body 2 → Conclusion.</div>
    <div class="mastersheet-item">10-mark: Definition/claim → citation → short example.</div>
    <div class="mastersheet-item">Bangladesh: source idea → hedge word → application → limit.</div>
  </div>
  <div class="mastersheet-block"><h3>5 key English phrases</h3>${DATA.masterSheet.phrases.map(c=>`<div class="mastersheet-item">${c}</div>`).join('')}</div>
  </div>`;
}

/* =========================================================================
   SEARCH
   ========================================================================= */
function buildSearchIndex(){
  const idx = [];
  DATA.topics.forEach(t=>t.sections.forEach(s=>{
    idx.push({type:'Section', title:s.title, loc:t.short, text:(s.level2||'')+(s.level1||''), go:{screen:'reader',sectionId:s.id}});
  }));
  DATA.thinkers.forEach(th=>idx.push({type:'Thinker', title:th.name, loc:'Thinker Bank', text:th.argue+th.concept, go:{screen:'thinkers'}}));
  DATA.citations.forEach(c=>idx.push({type:'Citation', title:c.claim, loc:'Citation Bank', text:c.quote+c.author, go:{screen:'citations'}}));
  DATA.evidence.forEach(e=>idx.push({type:'Evidence', title:e.what, loc:'Evidence Bank', text:e.why, go:{screen:'evidence'}}));
  DATA.vocabulary.forEach(v=>idx.push({type:'Vocabulary', title:v.word, loc:'Vocabulary', text:v.meaning, go:{screen:'vocab'}}));
  DATA.examQuestions.forEach((q,i)=>idx.push({type:'Exam Q', title:q.q||q.qa, loc:'Exam Questions', text:q.wants||'', go:{screen:'examQ',qIndex:i}}));
  return idx;
}
const SEARCH_INDEX = buildSearchIndex();
function openSearch(){
  const overlay = document.createElement('div');
  overlay.className='search-overlay';
  overlay.id='search-overlay';
  overlay.innerHTML = `<div class="search-box">
    <input class="search-input" id="search-input" placeholder="Search concepts, authors, citations, questions…" oninput="doSearch(this.value)">
    <div class="search-results" id="search-results"></div>
  </div>`;
  overlay.onclick=(e)=>{ if(e.target===overlay) closeSearch(); };
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('search-input').focus(), 30);
}
function closeSearch(){ const o=document.getElementById('search-overlay'); if(o) o.remove(); }
function doSearch(q){
  const results = document.getElementById('search-results');
  if(!q || q.length<2){ results.innerHTML=''; return; }
  const ql = q.toLowerCase();
  const matches = SEARCH_INDEX.filter(item => (item.title+item.text).toLowerCase().includes(ql)).slice(0,20);
  results.innerHTML = matches.map(m=>`<div class="search-result" onclick='goSearchResult(${JSON.stringify(m.go)})'>
    <div class="rtitle">${m.title}</div><div class="rloc">${m.type} · ${m.loc}</div>
  </div>`).join('') || `<div class="search-result">No results.</div>`;
}
function goSearchResult(go){ closeSearch(); nav(go); }

/* =========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================= */
document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea'){ if(e.key==='Escape'){ closeSearch(); closeModal(); } return; }
  if(e.key==='/'){ e.preventDefault(); openSearch(); }
  else if(e.key==='Escape'){ closeSearch(); closeModal(); }
  else if(e.key==='f' || e.key==='F'){ toggleFocus(); }
  else if(e.key==='r' || e.key==='R'){ nav({screen:'recall'}); }
  else if(e.key==='ArrowRight'){ readerArrow(1); }
  else if(e.key==='ArrowLeft'){ readerArrow(-1); }
});
function readerArrow(dir){
  const r = STATE.route;
  if(r.screen!=='reader') return;
  const s = SECTION_INDEX[r.sectionId];
  const t = DATA.topics.find(x=>x.id===s.topicId);
  const idx = t.sections.findIndex(x=>x.id===r.sectionId);
  const target = t.sections[idx+dir];
  if(target) nav({screen:'reader', sectionId:target.id});
}

/* =========================================================================
   THEME / BANGLA / FOCUS
   ========================================================================= */
function toggleTheme(){ STATE.theme = STATE.theme==='dark'?'light':'dark'; LS.set('theme',STATE.theme); render(); }
function toggleBangla(){ STATE.bangla = !STATE.bangla; LS.set('bangla',STATE.bangla); render(); }
function toggleFocus(){ STATE.focusMode = !STATE.focusMode; render(); }
function attachDetailPersistence(){ /* placeholder for future per-section open-state persistence */ }

/* =========================================================================
   INIT
   ========================================================================= */
(function init(){
  if(STATE.currentPosition && !STATE.examTime){
    // no-op, just ensures object exists
  }
  render();
})();
</script>
