<style>
:root{
  --paper:#EDE9DE;
  --paper-2:#E2DCC9;
  --ink:#20241F;
  --ink-soft:#4A4F45;
  --line:#C9C0A5;
  --signal:#B5432B;      /* CRT-red accent, urgency */
  --signal-2:#2E5C4E;    /* broadcast-green accent, structure */
  --amber:#C98A2C;
  --card:#F6F3E9;
  --card-b:#FFFFFF;
  --shadow: 2px 2px 0 rgba(32,36,31,0.08);
  --radius:3px;
  --mono: "Courier New", ui-monospace, Consolas, monospace;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
[data-theme="dark"]{
  --paper:#171916;
  --paper-2:#1F221D;
  --ink:#E7E3D3;
  --ink-soft:#B4AF9D;
  --line:#3A3D33;
  --card:#1D201B;
  --card-b:#22251F;
  --shadow: 2px 2px 0 rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.5;
  font-size:16px;
  transition:background .2s, color .2s;
}
::selection{background:var(--amber); color:#1a1a1a;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:700; margin:0 0 .4em; color:var(--ink);}
h1{font-size:1.5rem;}
h2{font-size:1.35rem; border-bottom:2px solid var(--line); padding-bottom:.35em; margin-bottom:.6em;}
h3{font-size:1.08rem; color:var(--signal-2);}
p{margin:.5em 0;}
a{color:var(--signal-2);}
.mono{font-family:var(--mono);}
button{
  font-family:var(--sans);
  cursor:pointer;
  border:1px solid var(--ink);
  background:var(--card-b);
  color:var(--ink);
  padding:.45em .8em;
  border-radius:var(--radius);
  font-size:.85rem;
  box-shadow:var(--shadow);
}
button:hover{background:var(--signal-2); color:#fff; border-color:var(--signal-2);}
button.primary{background:var(--signal); color:#fff; border-color:var(--signal);}
button.ghost{box-shadow:none;}
input[type=text], input[type=search]{
  font-family:var(--sans);
  padding:.5em .7em;
  border:1px solid var(--ink);
  border-radius:var(--radius);
  background:var(--card-b);
  color:var(--ink);
  font-size:.9rem;
}
/* ===== HEADER ===== */
header{
  position:sticky; top:0; z-index:50;
  background:var(--paper); border-bottom:2px solid var(--ink);
}
.hbar{
  display:flex; align-items:center; gap:.7em; padding:.55em .9em;
  flex-wrap:wrap;
}
.brand{font-family:var(--serif); font-weight:700; font-size:1.05rem; white-space:nowrap;}
.brand small{display:block; font-family:var(--sans); font-weight:400; font-size:.62rem; letter-spacing:.03em; color:var(--ink-soft);}
#searchBox{flex:1; min-width:120px;}
#searchResults{
  position:absolute; left:0; right:0; top:100%; background:var(--card-b);
  border:1px solid var(--ink); max-height:60vh; overflow:auto; display:none; z-index:60;
}
#searchResults div{padding:.5em .8em; border-bottom:1px solid var(--line); font-size:.85rem; cursor:pointer;}
#searchResults div:hover{background:var(--paper-2);}
#searchWrap{position:relative; flex:1; min-width:140px;}
.progressWrap{display:flex; align-items:center; gap:.4em; font-size:.75rem; color:var(--ink-soft);}
.progressBar{width:80px; height:8px; background:var(--paper-2); border:1px solid var(--ink); border-radius:6px; overflow:hidden;}
.progressBar > div{height:100%; background:var(--signal-2);}
nav#tabs{
  display:flex; gap:.2em; overflow-x:auto; padding:0 .9em .5em; scrollbar-width:thin;
}
nav#tabs button{
  white-space:nowrap; font-size:.78rem; border:1px solid var(--line); background:transparent;
  box-shadow:none; padding:.4em .7em;
}
nav#tabs button.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

/* ===== LAYOUT ===== */
main{max-width:920px; margin:0 auto; padding:1em .9em 4em;}
.section{display:none;}
.section.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:.9em 1em; margin:.7em 0; box-shadow:var(--shadow);
}
.tag{
  display:inline-block; font-size:.68rem; font-weight:700; padding:.15em .5em;
  border-radius:999px; margin-right:.3em; letter-spacing:.02em;
}
.tag.must{background:#F0D8CE; color:#7A2A14;}
[data-theme=dark] .tag.must{background:#4A2418; color:#F0C4B4;}
.tag.should{background:#F3E2C0; color:#7A5410;}
[data-theme=dark] .tag.should{background:#4A3818; color:#F0D9A6;}
.tag.good{background:#D9E6DA; color:#2A5A30;}
[data-theme=dark] .tag.good{background:#20351F; color:#B6D9B8;}
.tag.wasko{background:#D6E3EE; color:#1E4566;}
[data-theme=dark] .tag.wasko{background:#182B3A; color:#AECBE0;}
.tag.bourdieu{background:#E7DAEF; color:#4A2166;}
[data-theme=dark] .tag.bourdieu{background:#2C1B3A; color:#D3B6E8;}
.tag.combo{background:#EFE6C8; color:#5A4813;}
[data-theme=dark] .tag.combo{background:#3A3018; color:#E0CF9C;}
.tag.outside{background:#E5E5E5; color:#333;}
[data-theme=dark] .tag.outside{background:#2A2A2A; color:#ccc;}
.bn{color:var(--ink-soft); font-size:.85em; display:block; margin-top:.2em;}
.qbox{border-left:4px solid var(--signal-2); padding:.4em .8em; margin:.5em 0; background:var(--card-b); font-style:italic;}
.qbox cite{font-style:normal; display:block; font-size:.78rem; color:var(--ink-soft); margin-top:.25em;}
table{width:100%; border-collapse:collapse; font-size:.88rem;}
th,td{border:1px solid var(--line); padding:.45em .55em; text-align:left; vertical-align:top;}
th{background:var(--paper-2);}
.checklist label{display:flex; align-items:flex-start; gap:.5em; padding:.35em 0; border-bottom:1px dashed var(--line); font-size:.92rem;}
.checklist input{margin-top:.25em;}
.checklist label.checked span{text-decoration:line-through; color:var(--ink-soft);}
details{border:1px solid var(--line); border-radius:var(--radius); margin:.5em 0; background:var(--card);}
details summary{padding:.6em .8em; cursor:pointer; font-weight:700; font-family:var(--serif);}
details .inner{padding:0 1em 1em;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:.8em;}
@media(max-width:700px){.grid2{grid-template-columns:1fr;}}
.pill-row{display:flex; gap:.4em; flex-wrap:wrap; margin:.6em 0;}
.pill-row button.filt{font-size:.75rem; padding:.3em .6em; box-shadow:none;}
.pill-row button.filt.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.crisis-block{border:2px solid var(--signal); border-radius:var(--radius); padding:.8em 1em; margin:.8em 0; background:var(--card);}
.crisis-block h3{color:var(--signal); margin-top:0;}
.timer{font-family:var(--mono); font-size:1.6rem; text-align:center; padding:.4em; background:var(--ink); color:var(--paper); border-radius:var(--radius);}
.flash-stage{
  min-height:200px; border:1px solid var(--ink); border-radius:var(--radius);
  background:var(--card-b); padding:1.2em; display:flex; flex-direction:column; justify-content:center;
  cursor:pointer; position:relative;
}
.flash-stage .side-label{position:absolute; top:.5em; right:.7em; font-size:.65rem; color:var(--ink-soft);}
.answer-mode-toggle{display:inline-flex; border:1px solid var(--ink); border-radius:var(--radius); overflow:hidden; margin-bottom:.6em;}
.answer-mode-toggle button{border:none; box-shadow:none; border-radius:0;}
.answer-mode-toggle button.on{background:var(--ink); color:var(--paper);}
.mode10, .mode20{display:none;}
.mode10.show, .mode20.show{display:block;}
footer.printfoot{display:none;}
#focusOverlay .hideable{display:none !important;}
.small{font-size:.8rem; color:var(--ink-soft);}
.badge-count{font-size:.7rem; background:var(--paper-2); border-radius:8px; padding:0 .4em; margin-left:.3em;}
mark{background:var(--amber); color:#1a1a1a;}
@media print{
  header, nav#tabs, .no-print, button{display:none !important;}
  .section{display:block !important; margin-bottom:2em;}
  body{background:#fff; color:#000; font-size:12px;}
  .card{box-shadow:none; border:1px solid #999;}
}
</style>
</head>

{id:"c2", tier:"must", author:"bourdieu", name:"Symbolic violence",

 bangla:"প্রতীকী সহিংসতা — শারীরিক শক্তি নয়, বরং ধারণা ও অর্থের মাধ্যমে প্রয়োগ করা ক্ষমতা, যা মানুষ অনেক সময় না বুঝেই মেনে নেয়।",

 exam:"Explain and critically discuss Bourdieu's concept of symbolic violence in relation to television.",

 why:"Great for 'critically discuss the limits of television as a free medium' style questions.",

{id:"c4", tier:"must", author:"bourdieu", name:"Journalistic 'glasses' and selection",

 bangla:"সাংবাদিকদের 'চশমা' — তাদের নির্দিষ্ট দৃষ্টিভঙ্গি যা ঠিক করে দেয় কী দেখানো হবে আর কী বাদ যাবে।",

{id:"c5", tier:"must", author:"bourdieu", name:"Show and hide (dramatization)",

{id:"c6", tier:"must", author:"bourdieu", name:"The reality effect",

 argue:"Bourdieu says images have 'the peculiar capacity to produce what literary critics call a reality effect. They show things and make people believe in what they show. This power to show is also a power to mobilize.'",

{id:"c8", tier:"must", author:"bourdieu", name:"Audience ratings as the 'hidden god'",

{id:"c9", tier:"must", author:"bourdieu", name:"Fast-thinkers and received ideas",

 {w:"autonomy", s:"independence; freedom to act by one's own rules", bn:"স্বায়ত্তশাসন", ex:"Television has 'very little autonomy' from social pressures."},
 {w:"legitimation", s:"making something seem acceptable or valid", bn:"বৈধতাদান", ex:"The market is now accepted as a means of legitimation for cultural products."},
 {w:"microcosm", s:"a small world that reflects a larger one", bn:"ক্ষুদ্র জগৎ", ex:"Bourdieu describes journalism as a microcosm with its own laws."},
 {w:"complicity", s:"being involved in something, often without full awareness", bn:"যোগসাজশ", ex:"Symbolic violence depends on the complicity of victim and agent."},
 {w:"tacit", s:"understood without being openly stated", bn:"অব্যক্ত/নীরব", ex:"There is tacit complicity in symbolic violence."},
 {w:"pervasive", s:"present or spreading everywhere", bn:"সর্বব্যাপী", ex:"Television is a pervasive part of daily life."},
 {w:"ideological", s:"related to a system of ideas, beliefs, or values", bn:"মতাদর্শগত", ex:"Wasko calls television an ideological source."},
 {w:"socialization", s:"the process of learning social norms and values", bn:"সামাজিকীকরণ", ex:"Television is described as an agent of socialization."},
 {w:"exhibitionism", s:"a strong desire to be seen or noticed", bn:"প্রদর্শনপ্রিয়তা", ex:"Bourdieu calls television a space for narcissistic exhibitionism."},
 {w:"invisible mechanisms", s:"hidden processes that are not directly seen", bn:"অদৃশ্য প্রক্রিয়া", ex:"Invisible mechanisms of censorship are harder to challenge than open control."},
 {w:"reductionism", s:"explaining something complex using only one simple cause", bn:"হ্রাসবাদ", ex:"Bourdieu rejects a purely economic reductionism of television."},
 {w:"legitimacy", s:"the quality of being accepted as valid or proper", bn:"বৈধতা", ex:"Market success gained legitimacy in cultural production over time."},
 {w:"commodify / commodity", s:"to turn something into a product to be bought/sold", bn:"পণ্যে পরিণত করা", ex:"Time on television is treated as a rare commodity."},
 {w:"discourse", s:"a way of talking or writing about a subject", bn:"বক্তব্য/আলোচনা", ex:"Television reshapes public discourse."},
 {w:"institutional", s:"related to organizations and their established systems", bn:"প্রাতিষ্ঠানিক", ex:"Institutional pressures shape journalistic output."},
 {w:"conform / conformity", s:"behaving according to accepted standards", bn:"অনুসরণ/সামঞ্জস্যতা", ex:"Job insecurity increases political conformity among journalists."},
 {w:"consensual", s:"agreed upon by most people; non-controversial", bn:"ঐকমত্যপূর্ণ", ex:"Banal, consensual items fill television's limited time."},
 {w:"polemic", s:"a strong verbal or written attack on an idea", bn:"তীক্ষ্ণ বিতর্ক/আক্রমণ", ex:"Bourdieu says his analysis is not meant as an ad hominem polemic."},
 {w:"exhaustive/inexhaustible", s:"never running out; without limit", bn:"অফুরন্ত", ex:"Television's capacity to transmit content is seemingly inexhaustible."},
 {w:"catalyst", s:"something that causes or speeds up a change", bn:"অনুঘটক", ex:"Television can act as a catalyst for reading."},
];

const $ = sel => document.querySelector(sel);

const state = { checks: JSON.parse(localStorage.getItem('tvchecks')||'{}'), knowMap: JSON.parse(localStorage.getItem('tvknow')||'{}') };

function saveChecks(){ localStorage.setItem('tvchecks', JSON.stringify(state.checks)); updateProgress(); }

function allCheckableIds(){
  let ids = [];
  MEMORIZE.wasko.forEach((_,i)=>ids.push('mw'+i));
  MEMORIZE.bourdieu.forEach((_,i)=>ids.push('mb'+i));
  MEMORIZE.connecting.forEach((_,i)=>ids.push('mc'+i));
  MEMORIZE.bangladesh.forEach((_,i)=>ids.push('md'+i));
  ['wasko-done','bourdieu-done','core-done','citation-done','answers-done','bangladesh-done','mock-done'].forEach(x=>ids.push(x));
  return ids;
}
function updateProgress(){
  const ids = allCheckableIds();
  const done = ids.filter(id=>state.checks[id]).length;
  const pct = Math.round(100*done/ids.length);
  $('#progressPct').textContent = pct+'%';
  $('#progressFill').style.width = pct+'%';
}

function tierTag(t){ return `<span class="tag ${t}">${t.toUpperCase()}</span>`; }
function authorTag(a){
  const map={wasko:'WASKO',bourdieu:'BOURDIEU',combined:'COMBINED'};
  const cls={wasko:'wasko',bourdieu:'bourdieu',combined:'combo'};
  return `<span class="tag ${cls[a]}">${map[a]}</span>`;
}

function checklistItem(id, text, extraClass){
  const checked = !!state.checks[id];
  return `<label class="${checked?'checked':''} ${extraClass||''}" data-id="${id}">
    <input type="checkbox" ${checked?'checked':''} onchange="toggleCheck('${id}', this)">
    <span>${text}</span>
  </label>`;
}
function toggleCheck(id, el){
  state.checks[id] = el.checked;
  el.closest('label').classList.toggle('checked', el.checked);
  saveChecks();
}

function renderFlash(){
  const id = flashState.order[flashState.idx];
  const c = CONCEPTS.find(x=>x.id===id);
  const known = state.knowMap[id];
  const front = `<div class="side-label">FRONT · card ${flashState.idx+1}/${flashState.order.length}</div><h3>${c.name}</h3><p class="small">${authorTag(c.author)} ${tierTag(c.tier)}</p><p class="small">(Click card to flip)</p>`;
  const back = `<div class="side-label">BACK</div>
    <p><b>Simple:</b> ${c.simple}</p>
    <span class="bn">বাংলা: ${c.bangla}</span>
    <p><b>Argument:</b> ${c.argue}</p>
    <p><b>Example:</b> ${c.example}</p>
    <p class="small"><b>Citation:</b> ${c.page}</p>`;
  $('#flashArea').innerHTML = `
    <div class="flash-stage" id="flashCard" onclick="flashState.flipped=!flashState.flipped; renderFlash();">
      ${flashState.flipped ? back : front}
    </div>
    <div class="pill-row">
      <button onclick="flashNav(-1)">◀ Prev</button>
      <button onclick="flashShuffle()">🔀 Shuffle</button>
      <button onclick="flashMark(true)" class="${known===true?'primary':''}">✔ I know this</button>
      <button onclick="flashMark(false)" class="${known===false?'primary':''}">↻ Need revision</button>
      <button onclick="flashNav(1)">Next ▶</button>
    </div>
    <p class="small">Known: ${Object.values(state.knowMap).filter(v=>v===true).length} / ${CONCEPTS.length}</p>`;
}
function flashNav(d){ flashState.flipped=false; flashState.idx=(flashState.idx+d+flashState.order.length)%flashState.order.length; renderFlash(); }
function flashShuffle(){ flashState.order.sort(()=>Math.random()-0.5); flashState.idx=0; flashState.flipped=false; renderFlash(); }
function flashMark(v){ const id=flashState.order[flashState.idx]; state.knowMap[id]=v; saveKnow(); renderFlash(); }

let quizState = {idx:0, score:0, order:[], answered:false};
function startQuiz(){
  quizState = {idx:0, score:0, order:QUIZ_QUESTIONS.map((_,i)=>i).sort(()=>Math.random()-0.5).slice(0,5), answered:false};
  renderQuiz();
}
function renderQuiz(){
  const area = $('#quizArea');
  if(quizState.idx >= quizState.order.length){
    area.innerHTML = `<div class="card"><h3>Quiz complete!</h3><p>Score: ${quizState.score} / ${quizState.order.length}</p><button onclick="startQuiz()">Try again</button></div>`;
    return;
  }
  const q = QUIZ_QUESTIONS[quizState.order[quizState.idx]];
  area.innerHTML = `<div class="card">
    <p class="small">Question ${quizState.idx+1} of ${quizState.order.length} · Score so far: ${quizState.score}</p>
    <p><b>${q.q}</b></p>
    <div id="quizOpts">${q.opts.map((o,i)=>`<div><button class="quizOpt" style="display:block;width:100%;text-align:left;margin:.3em 0;" data-i="${i}">${o}</button></div>`).join('')}</div>
    <div id="quizFeedback"></div>
  </div>`;
  $all('.quizOpt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(quizState.answered) return;
      quizState.answered = true;
      const i = parseInt(btn.dataset.i);
      const correct = i === q.correct;
      if(correct) quizState.score++;
      $all('.quizOpt').forEach((b,bi)=>{
        b.disabled = true;
        if(bi===q.correct) b.style.borderColor = 'var(--signal-2)';
        if(bi===i && !correct) b.style.borderColor = 'var(--signal)';
      });
      $('#quizFeedback').innerHTML = `<p style="margin-top:.6em;"><b>${correct?'Correct!':'Not quite.'}</b> ${q.exp}</p><button onclick="quizState.idx++; quizState.answered=false; renderQuiz();">Next →</button>`;
    });
  });
}

function buildRecall(){
  return `<h2>Active Recall</h2>
  <div class="pill-row no-print">
   <button onclick="showSubtab('quiz')" class="subtab on" id="tab-quiz">Quiz</button>
   <button onclick="showSubtab('flash')" class="subtab" id="tab-flash">Flashcards</button>
  </div>
  <div id="recallQuiz"><h3>Quiz</h3><div id="quizArea"></div></div>
  <div id="recallFlash" style="display:none;"><h3>Flashcards</h3>${buildFlashcards()}</div>`;
}
function showSubtab(which){
  $('#recallQuiz').style.display = which==='quiz' ? 'block':'none';
  $('#recallFlash').style.display = which==='flash' ? 'block':'none';
  $('#tab-quiz').classList.toggle('on', which==='quiz');
  $('#tab-flash').classList.toggle('on', which==='flash');
  if(which==='quiz' && !quizState.order.length) startQuiz();
  if(which==='flash') renderFlash();
}

/* ---------- Random Question Generator + Mock ---------- */
const ALL_QUESTIONS = [...QUESTIONS.wasko, ...QUESTIONS.bourdieu, ...QUESTIONS.combined, ...QUESTIONS.bangladesh];
let mockTimer = null, mockSeconds = 0;
function buildRandom(){
  return `<h2>Random Question Generator</h2>
  <div class="card">
    <button onclick="pickRandomQ()" class="primary">🎲 Give me an exam question</button>
    <div id="randomQArea"></div>
  </div>
  <h2>Mock Exam Simulator</h2>
  <div class="card">
    <p class="small">Pick a mode, then plan and write your answer on paper or in another window. Use the timer to simulate exam pressure.</p>
    <div class="pill-row">
      <button onclick="startMock(20)">20-mark mock (start 30 min timer)</button>
      <button onclick="startMock(10)">10+10 mock (start 40 min timer)</button>
      <button onclick="stopMock()" class="ghost">Stop timer</button>
    </div>
    <div id="mockTimerBox" class="timer" style="display:none;">30:00</div>
    <div id="mockQs"></div>
  </div>`;
}
function pickRandomQ(){
  const q = ALL_QUESTIONS[Math.floor(Math.random()*ALL_QUESTIONS.length)];
  let secs = 120;
  const area = $('#randomQArea');
  area.innerHTML = `<p style="margin-top:.7em;"><b>${q}</b></p>
    <div class="timer" id="planTimer">2:00</div>
    <p class="small">Use this time to plan your outline before revealing help.</p>
    <div class="pill-row">
      <button onclick="revealStructure()">Show answer structure</button>
      <button onclick="revealModel()">Show closest model answer (if available)</button>
      <button onclick="revealCitations()">Show citation suggestions</button>
    </div>
    <div id="randomReveal"></div>`;
  clearInterval(window._planInt);
  window._planInt = setInterval(()=>{
    secs--;
    const m = Math.floor(secs/60), s = String(secs%60).padStart(2,'0');
    const el = $('#planTimer'); if(el) el.textContent = m+':'+s;
    if(secs<=0){ clearInterval(window._planInt); if(el) el.textContent = "Time's up!"; }
  },1000);
  window._currentRandomQ = q;
}
function revealStructure(){
  $('#randomReveal').innerHTML = `<div class="card"><b>Suggested structure:</b><br>Define → Explain author's argument → Evidence/example → Critical remark → Conclude (10-mark) or use the full 20-mark formula in the Answer Formula tab.</div>`;
}
function revealModel(){
  const match = MODEL_ANSWERS.find(m=>m.q===window._currentRandomQ);
  $('#randomReveal').innerHTML = match ? `<div class="card">A full model answer for this exact question is available in the <b>Model Answers</b> tab.</div>` : `<div class="card">No ready-made full model answer for this exact question — build one using the Answer Formula and relevant Concept Bank entries.</div>`;
}
function revealCitations(){
  $('#randomReveal').innerHTML = `<div class="card">Check the <b>Citation Bank</b> tab for the citation whose "Use for" column matches this question's topic.</div>`;
}
function startMock(mode){
  mockSeconds = mode===20 ? 30*60 : 40*60;
  $('#mockTimerBox').style.display='block';
  const qs = mode===20 ? [ALL_QUESTIONS[Math.floor(Math.random()*ALL_QUESTIONS.length)]] :
    [QUESTIONS.wasko[Math.floor(Math.random()*QUESTIONS.wasko.length)], QUESTIONS.bourdieu[Math.floor(Math.random()*QUESTIONS.bourdieu.length)]];
  $('#mockQs').innerHTML = `<ol>${qs.map(q=>`<li>${q}</li>`).join('')}</ol><p class="small">Write your answer(s) on paper. When the timer ends, self-evaluate using the Rubric tab.</p>`;
  clearInterval(mockTimer);
  mockTimer = setInterval(()=>{
    mockSeconds--;
    const m = Math.floor(mockSeconds/60), s=String(mockSeconds%60).padStart(2,'0');
    $('#mockTimerBox').textContent = m+':'+s;
    if(mockSeconds<=0){ clearInterval(mockTimer); $('#mockTimerBox').textContent="Time's up!"; }
  },1000);
}
function stopMock(){ clearInterval(mockTimer); $('#mockTimerBox').style.display='none'; }

function buildRubric(){
  return `<h2>Self-Assessment Rubric</h2>
  <p class="small">This is a study-oriented self-assessment rubric, not an official university marking scheme.</p>
  <div class="card"><h3>20-mark checklist</h3>
   <ul>
    <li>Understood exactly what the question asked</li>
    <li>Accurate, non-confused use of Wasko and/or Bourdieu</li>
    <li>Correct use of key concepts (named accurately)</li>
    <li>Evidence/examples drawn from the text</li>
    <li>At least 3–4 in-text citations, correctly formatted</li>
    <li>A genuine critical/analytical paragraph, not just description</li>
    <li>Bangladesh/application content only where relevant, clearly labelled</li>
    <li>Clear structure: introduction, points, critical paragraph, conclusion</li>
    <li>Simple, grammatically safe English</li>
    <li>A conclusion that actually answers the question</li>
   </ul>
  </div>`;
}

function buildSchedule(){
  let html = `<h2>Personalized 10-Hour Study Strategy</h2>`;
  SCHEDULE.forEach(s=>{
    html += `<div class="card">${checklistItem('sched-'+s.t.replace(/\\W+/g,''), `<b>${s.t}:</b> ${s.act}`)}</div>`;
  });
  return html;
}

/* =====================================================================
   MAIN RENDER + NAV
===================================================================== */
const BUILDERS = {
  crisis: buildCrisis, concepts: buildConcepts, arguments: buildArguments,
  citations: buildCitations, quotes: buildQuotes, memorize: buildMemorize,
  questions: buildQuestions, answers: buildAnswers, formula: buildFormula,
  bangladesh: buildBangladesh, writing: buildWriting, vocab: buildVocab,
  recall: buildRecall, random: buildRandom, rubric: buildRubric, schedule: buildSchedule,
};

function renderApp(){
  const main = $('#main');
  main.innerHTML = SECTIONS.map(s=>`<section class="section" id="sec-${s.id}"></section>`).join('');
  SECTIONS.forEach(s=>{ $('#sec-'+s.id).innerHTML = BUILDERS[s.id](); });
  const nav = $('#tabs');
  nav.innerHTML = SECTIONS.map(s=>`<button data-id="${s.id}">${s.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>showSection(b.dataset.id)));
  showSection('crisis');
  updateProgress();
  wireConceptFilters();
  wireAnswerToggles();
  showSubtab('quiz');
}

function showSection(id){
  $all('.section').forEach(s=>s.classList.remove('active'));
  const t = $('#sec-'+id); if(t) t.classList.add('active');
  $all('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  window.scrollTo({top:0, behavior:'instant'});
  location.hash = id;
}

function wireConceptFilters(){
  $all('.filt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      $all('.filt').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      const tier = btn.dataset.tier;
      $all('.concept-item').forEach(c=>{
        c.style.display = (tier==='all' || c.dataset.tier===tier) ? '' : 'none';
      });
    });
  });
}
function wireAnswerToggles(){
  $all('.modeBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = btn.dataset.ans, mode = btn.dataset.mode;
      $all(`.modeBtn[data-ans="${idx}"]`).forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
      $('#ans'+idx+'-10').classList.toggle('show', mode==='10');
      $('#ans'+idx+'-20').classList.toggle('show', mode==='20');
    });
  });
}

/* ---------- Theme, Focus, Print ---------- */
$('#themeBtn').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next==='dark'?'dark':'');
  localStorage.setItem('tvtheme', next);
});
(function initTheme(){
  const saved = localStorage.getItem('tvtheme');
  if(saved==='dark') document.documentElement.setAttribute('data-theme','dark');
})();

let focusOn = false;
$('#focusBtn').addEventListener('click', ()=>{
  focusOn = !focusOn;
  document.body.classList.toggle('focus-mode', focusOn);
  $all('.card, details').forEach(el=>{}); // no-op hook, focus mode simplified via CSS below
});

/* ---------- Search ---------- */
function buildSearchIndex(){
  const idx = [];
  CONCEPTS.forEach(c=>idx.push({type:'Concept', text:c.name+' '+c.simple+' '+c.argue, goto:'concepts'}));
  QUOTES.forEach(q=>idx.push({type:'Quote', text:q.q+' '+q.meaning, goto:'quotes'}));
  CITATIONS.forEach(c=>idx.push({type:'Citation', text:c.claim, goto:'citations'}));
  ALL_QUESTIONS.forEach(q=>idx.push({type:'Question', text:q, goto:'questions'}));
  VOCAB.forEach(v=>idx.push({type:'Vocab', text:v.w+' '+v.s, goto:'vocab'}));
  ARGUMENTS.wasko.forEach(a=>idx.push({type:'Argument (Wasko)', text:a.a+' '+a.e, goto:'arguments'}));
  ARGUMENTS.bourdieu.forEach(a=>idx.push({type:'Argument (Bourdieu)', text:a.a+' '+a.e, goto:'arguments'}));
  return idx;
}
let SEARCH_INDEX = [];
$('#searchBox').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  const box = $('#searchResults');
  if(q.length<2){ box.style.display='none'; return; }
  const hits = SEARCH_INDEX.filter(item=>item.text.toLowerCase().includes(q)).slice(0,12);
  if(!hits.length){ box.innerHTML = '<div>No matches.</div>'; box.style.display='block'; return; }
  box.innerHTML = hits.map(h=>`<div data-goto="${h.goto}"><b>[${h.type}]</b> ${h.text.slice(0,110)}${h.text.length>110?'…':''}</div>`).join('');
  box.style.display='block';
  box.querySelectorAll('div[data-goto]').forEach(d=>d.addEventListener('click', ()=>{ showSection(d.dataset.goto); box.style.display='none'; e.target.value=''; }));
});
document.addEventListener('click', e=>{ if(!e.target.closest('#searchWrap')) $('#searchResults').style.display='none'; });

/* ---------- Boot ---------- */
renderApp();
SEARCH_INDEX = buildSearchIndex();
if(location.hash){ const id = location.hash.slice(1); if(SECTIONS.some(s=>s.id===id)) showSection(id); }
</script>
