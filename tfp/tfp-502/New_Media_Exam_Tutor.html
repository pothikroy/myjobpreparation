<title>New Media — Emergency Exam Tutor</title>
<style>
:root{
  --font-scale: 1;
  --paper: #f3f1e9;
  --paper-2: #ebe7da;
  --ink: #23281f;
  --ink-soft: #565c4d;
  --line: #d8d3c0;
  --accent: #1f6f6b;      /* teal - source/safe */
  --accent-2: #b8863a;    /* amber - priority/must-know */
  --accent-3: #a3402a;    /* rust - warnings/unsupported */
  --accent-4: #3d5a80;    /* slate blue - inference */
  --card-bg: #fffdf6;
  --shadow: 0 1px 0 rgba(35,40,31,0.06);
  --radius: 10px;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
body.dark{
  --paper: #1a1d16;
  --paper-2: #22261c;
  --ink: #e9e6d8;
  --ink-soft: #b3af9c;
  --line: #3a3e30;
  --card-bg: #21251b;
  --shadow: 0 1px 0 rgba(0,0,0,0.3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:calc(16px * var(--font-scale));
  line-height:1.55;
}
#appRoot{display:flex; height:100vh; overflow:hidden;}

/* ---- SIDEBAR ---- */
#sidebar{
  width:260px; min-width:220px; background:var(--paper-2);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column; overflow-y:auto;
  padding:16px 10px;
}
.brand{
  font-family:var(--serif); font-size:1.15rem; font-weight:700;
  padding:4px 10px 14px; border-bottom:1px solid var(--line); margin-bottom:10px;
  color:var(--ink);
}
.brand small{display:block; font-family:var(--sans); font-weight:400; font-size:0.72rem; color:var(--ink-soft); margin-top:2px;}
.navbtn{
  display:block; width:100%; text-align:left; background:none; border:none;
  padding:9px 10px; border-radius:8px; color:var(--ink); font-size:0.92rem;
  cursor:pointer; margin-bottom:2px; font-family:var(--sans);
}
.navbtn:hover{background:var(--line);}
.navbtn.active{background:var(--accent); color:#fff;}
.navbtn.small{font-size:0.82rem; padding:6px 10px;}
.navsub{padding-left:12px; margin-bottom:6px;}

/* ---- TOP BAR ---- */
#topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 20px; border-bottom:1px solid var(--line); background:var(--paper);
  gap:10px; flex-wrap:wrap;
}
.tb-controls{display:flex; gap:8px; align-items:center;}
.icon-btn{
  background:var(--card-bg); border:1px solid var(--line); border-radius:8px;
  padding:6px 10px; cursor:pointer; font-size:0.85rem; color:var(--ink);
}
.icon-btn:hover{background:var(--line);}

/* ---- MAIN AREA ---- */
#mainWrap{flex:1; display:flex; flex-direction:column; overflow:hidden;}
#mainContent{flex:1; overflow-y:auto; padding:24px 32px 80px;}
.page{max-width:980px; margin:0 auto;}
.page h1{font-family:var(--serif); font-size:1.9rem; margin-bottom:6px;}
.page h2{font-family:var(--serif); font-size:1.35rem; margin-top:0;}
.page h3{font-size:1.05rem; margin-bottom:6px;}
.lede{color:var(--ink-soft); max-width:70ch; margin-bottom:18px;}
.hint{color:var(--ink-soft); font-size:0.85rem;}

/* ---- CARDS ---- */
.card{
  background:var(--card-bg); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:18px; box-shadow:var(--shadow);
}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:14px;}
@media (max-width:800px){ .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;} #sidebar{position:fixed; z-index:20; height:100%;} }

/* ---- BADGES ---- */
.badge{display:inline-block; font-size:0.72rem; font-weight:700; padding:2px 8px; border-radius:20px; margin-right:4px;}
.badge.src{background:rgba(31,111,107,0.15); color:var(--accent);}
.badge.inf{background:rgba(61,90,128,0.15); color:var(--accent-4);}
.badge.app{background:rgba(184,134,58,0.18); color:var(--accent-2);}
.badge.tip{background:rgba(163,64,42,0.15); color:var(--accent-3);}
.pri{display:inline-block; font-size:0.7rem; font-weight:700; padding:2px 8px; border-radius:20px; margin-right:6px; white-space:nowrap;}
.pri-high{background:rgba(163,64,42,0.15); color:var(--accent-3);}
.pri-med{background:rgba(184,134,58,0.18); color:var(--accent-2);}
.pri-low{background:rgba(31,111,107,0.15); color:var(--accent);}

/* ---- COUNTDOWN ---- */
.countdown-card{
  background:var(--card-bg); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; margin-bottom:20px; text-align:center;
}
.cd-label{font-size:0.78rem; letter-spacing:0.02em; color:var(--ink-soft); margin-bottom:6px;}
.cd-time{font-family:var(--serif); font-size:2.6rem; font-weight:700; color:var(--accent-3);}
.cd-set{display:block; margin-top:10px; font-size:0.85rem; color:var(--ink-soft);}
.cd-set input{margin-left:8px; font-family:var(--sans); padding:4px 6px; border-radius:6px; border:1px solid var(--line); background:var(--paper);color:var(--ink);}

/* ---- CHECKLISTS ---- */
.phase-box{margin-bottom:16px; padding-bottom:12px; border-bottom:1px dashed var(--line);}
.phase-box:last-child{border-bottom:none;}
.checklist{display:flex; flex-direction:column; gap:6px;}
.check-row{display:flex; gap:8px; align-items:flex-start; font-size:0.92rem; cursor:pointer;}
.check-row input{margin-top:3px;}

/* ---- READINESS ---- */
.readiness-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.readiness-label{width:180px; font-size:0.85rem;}
.bar-track{flex:1; height:8px; background:var(--line); border-radius:6px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent);}
.readiness-pct{width:40px; text-align:right; font-size:0.85rem;}
.readiness-banner{margin-top:14px; padding:10px 14px; background:var(--paper-2); border-radius:8px; font-size:1rem;}

/* ---- TOPIC PAGE ---- */
.topic-tabs, .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chip{background:var(--card-bg); border:1px solid var(--line); border-radius:20px; padding:6px 14px; font-size:0.85rem; cursor:pointer; color:var(--ink);}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.topic-meta{color:var(--ink-soft); font-size:0.85rem; margin-bottom:6px;}
.subtabs{display:flex; gap:6px; flex-wrap:wrap; margin:14px 0; border-bottom:1px solid var(--line); padding-bottom:10px;}
.subtab{background:none; border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:0.85rem; cursor:pointer; color:var(--ink);}
.subtab.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.hero-argument{font-size:1.05rem; font-weight:600; padding:14px 16px; background:var(--paper-2); border-left:4px solid var(--accent); border-radius:6px; margin-bottom:14px;}
.arglist li{margin-bottom:10px;}

/* ---- ONE SCREEN ---- */
.oneScreen h4{margin-bottom:4px; margin-top:14px; color:var(--accent-4);}
.oneScreen ul{margin-top:4px;}

/* ---- CONCEPTS ---- */
.concept-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px;}
.concept-card{background:var(--card-bg); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
.concept-card h3{color:var(--accent-4); margin-bottom:8px;}
.layer{margin-bottom:8px; font-size:0.87rem;}
.layer-label{display:block; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:700;}
.layer.bangla p{font-family:'Noto Sans Bengali','SolaimanLipi',var(--sans);}
.layer.memory p{font-weight:700; color:var(--accent-2);}
.layer.examline{background:var(--paper-2); padding:6px 8px; border-radius:6px;}

/* ---- WORDS ---- */
.words-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;}
.word-card{background:var(--paper-2); border-radius:8px; padding:12px; cursor:pointer;}
.word-term{font-weight:700;}
.reveal-hint{font-weight:400; font-size:0.75rem; color:var(--ink-soft);}
.word-bangla{margin:4px 0; color:var(--accent-4); font-weight:600;}
.word-bangla.hidden{display:none;}
.word-simple{font-size:0.85rem;}
.word-example{font-size:0.82rem; color:var(--ink-soft); margin-top:4px;}

/* ---- QUESTIONS ---- */
.qlist{display:flex; flex-direction:column; gap:10px;}
.qrow{padding:8px 0; border-bottom:1px solid var(--line);}
.qtype{font-size:0.78rem; color:var(--ink-soft); margin-right:6px;}

/* ---- CONNECTIONS ---- */
.conn-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px;}
.conn-card{background:var(--card-bg); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
.conn-card h3{color:var(--accent-4);}
.conn-card p{font-size:0.88rem; margin:6px 0;}

/* ---- CITATIONS ---- */
.citation-grid{display:flex; flex-direction:column; gap:10px;}
.citation-row{padding:10px; background:var(--paper-2); border-radius:8px; font-size:0.87rem;}
.cit-scholar{font-weight:700; color:var(--accent-4); margin-bottom:4px;}
.cit-examuse{font-style:italic;}
.cit-loc{font-size:0.75rem; color:var(--ink-soft); margin-top:4px;}
.facts-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px;}
.fact-card{background:var(--paper-2); border-radius:8px; padding:12px; font-size:0.85rem;}
.fact-text{font-weight:600; margin-bottom:6px;}

/* ---- SENTENCES ---- */
.sentence-cat{margin-bottom:14px;}
.sentence-cat h3{color:var(--accent-4);}
.safe-row{margin-bottom:10px; padding-bottom:10px; border-bottom:1px dashed var(--line);}
.advanced{color:var(--accent-3);}
.safe{color:var(--accent);}

/* ---- BLUEPRINTS ---- */
.blueprint-card{margin-bottom:14px; padding-bottom:10px; border-bottom:1px dashed var(--line);}
.blueprint-card h3{color:var(--accent-4);}
.model-answer{margin-bottom:20px;}
.model-text p{margin:8px 0; font-size:0.92rem;}
.skeleton{margin-top:10px; background:var(--paper-2); padding:10px; border-radius:8px; font-size:0.85rem;}

/* ---- RECALL ---- */
.recall-tabs{display:flex; gap:8px; margin-bottom:16px;}
.flashcard-wrap{text-align:center;}
.flashcard{background:var(--paper-2); border-radius:12px; padding:40px 24px; min-height:120px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; cursor:pointer;}
.flash-front,.flash-back{font-size:1.05rem;}
.flash-back{color:var(--accent-4);}
.flash-controls{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
.btn{background:var(--card-bg); border:1px solid var(--line); border-radius:8px; padding:8px 16px; cursor:pointer; font-size:0.88rem; color:var(--ink);}
.btn:hover{background:var(--line);}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.quiz-q{margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--line);}
.qprompt{font-weight:600; margin-bottom:6px;}
.quiz-opt{display:block; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:0.9rem;}
.quiz-opt:hover{background:var(--paper-2);}
.quiz-opt.correct{background:rgba(31,111,107,0.18);}
.quiz-opt.incorrect{background:rgba(163,64,42,0.18);}
.explain{font-size:0.82rem; margin-top:4px; color:var(--ink-soft);}
.blind-area{margin-top:14px;}
.hidden{display:none !important;}

/* ---- BANGLADESH ---- */
.bd-block{margin-bottom:14px; padding-bottom:10px; border-bottom:1px dashed var(--line); font-size:0.92rem;}

/* ---- SEARCH ---- */
.search-input{width:100%; padding:12px 14px; font-size:1rem; border-radius:10px; border:1px solid var(--line); background:var(--card-bg); color:var(--ink); margin-bottom:14px;}
.search-row{padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:10px; align-items:baseline;}
.search-row:hover{background:var(--paper-2);}
.search-type{font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase; min-width:120px;}
.search-label{font-size:0.92rem;}

/* ---- NOTES ---- */
.note-area{width:100%; min-height:80px; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:0.92rem;}

/* ---- MASTER SHEET ---- */
.master-sheet .card{font-size:0.85rem;}

/* ---- EXAM MODE ---- */
.exam-mode .card ol{margin:0; padding-left:20px;}
.exam-mode .card li{margin-bottom:4px; font-size:0.9rem;}

@media print{
  #sidebar, #topbar{display:none;}
  #mainContent{overflow:visible; height:auto;}
}

</style>

ively stable infrastructure as a foundation of social justice.'", "keyConcepts": [{"term": "Infrastructure", "academic": "An essential, widely shared sociotechnical system marked by ubiquity, reliability, durability and (often) invisibility — visible mainly when it breaks down.", "simple": "Something everyone depends on every day, like roads or electricity, that you only notice when it stops working.", "bangla": "অবকাঠামো — এমন ব্যবস্থা যার ওপর সবাই নির্ভর করে", "memory": "Infrastructure = INVISIBLE until it BREAKS.", "exam": "Infrastructure studies focuses on essential, widely-shared systems such as electric grids and the internet (Plantin et al., 2018)."}, {"term": "Platform", "academic": "A system with a stable, programmable 'core' and variable 'complementary components' built on top by outside developers — Bogost and Montfort's phrase: 'if you can program it, it's a platform.'", "simple": "A base that other people can build extra things on top of, like an app store where anyone can add apps.", "bangla": "প্ল্যাটফর্ম — একটি মূল কাঠামো যার ওপর অন্যরা নতুন কিছু তৈরি করতে পারে", "memory": "Platform = CORE + OUTSIDE BUILDERS.", "exam": "A platform is defined by its programmability — a stable core that outside developers can extend (Plantin et al., 2018)."}, {"term": "Platformization of infrastructures", "academic": "The process by which once publicly-regulated, monopoly infrastructures (telecoms, the internet) are deregulated, privatised and 'splintered' into multiple competing, market-driven providers.", "simple": "Public services that used to be run like a utility for everyone slowly turn into competing private businesses.", "bangla": "অবকাঠামোর 'প্ল্যাটফর্মীকরণ' — সরকারি সেবা বেসরকারি প্রতিযোগিতামূলক ব্যবসায় পরিণত হওয়া", "memory": "PUBLIC utility → SPLINTERED private competition.", "exam": "The deregulation of telecoms and the internet since the 1970s represents a 'platformization of infrastructures' (Plantin et al., 2018)."}, {"term": "Infrastructuralization of platforms", "academic": "The process by which huge commercial platforms (Facebook, Google) become so embedded, essential and ubiquitous in daily life that they take on the properties of infrastructure.", "simple": "A private app or website becomes so important that everyone needs it, like it was public infrastructure.", "bangla": "প্ল্যাটফর্মের 'অবকাঠামোকরণ' — একটি বেসরকারি প্ল্যাটফর্ম এত জরুরি হয়ে ওঠে যে তা অবকাঠামোর মতো আচরণ করে", "memory": "Private PLATFORM grows so big it becomes essential INFRASTRUCTURE.", "exam": "Facebook and Google increasingly resemble infrastructure because of how embedded and essential they have become (Plantin et al., 2018)."}, {"term": "Gateway", "academic": "A technical or social device that connects otherwise incompatible systems, enabling interoperability (e.g. AC/DC converters, the ISO shipping container, TCP/IP).", "simple": "A connector piece that lets two different systems talk to each other.", "bangla": "গেটওয়ে — দুটি ভিন্ন ব্যবস্থাকে সংযুক্ত করার মাধ্যম", "memory": "Gateway = the PLUG that connects two different systems.", "exam": "An API acts as a gateway, but a corporate-controlled API creates lock-in rather than open interoperability (Plantin et al., 2018)."}, {"term": "API (as gateway)", "academic": "Application Programming Interface: permits outside programs to exchange data with a platform, but — unlike an open gateway — this two-way data flow is unilaterally controlled by the platform owner.", "simple": "A rulebook that lets other apps connect to a big platform, but only on that platform's own terms.", "bangla": "এপিআই — অন্য অ্যাপকে বড় প্ল্যাটফর্মের সাথে যুক্ত হতে দেয়, তবে প্ল্যাটফর্মের শর্তে", "memory": "API = a DOOR that only the platform owner can lock or unlock.", "exam": "The Facebook API is a 'double-edged sword': it enables an ecology of apps while locking developers and users into a Facebook-controlled landscape (Langlois and Elmer, 2013, cited in Plantin et al., 2018)."}, {"term": "Modern infrastructural ideal", "academic": "Graham and Marvin's (2001) term for the mid-19th-century vision of cities/states providing universal essential services (roads, sewers, post, telephone) to all citizens.", "simple": "The old idea that government should provide basic services fairly to everyone.", "bangla": "'আধুনিক অবকাঠামোগত আদর্শ' — সবার জন্য সমান মৌলিক সেবা দেওয়ার পুরনো ধারণা", "memory": "Old ideal: ONE service, for EVERYONE, run by government.", "exam": "The 'modern infrastructural ideal' of universal public service began collapsing under neoliberal deregulation from the late 1970s (Graham and Marvin, 2001, cited in Plantin et al., 2018)."}], "questions": [{"q": "Explain the difference between infrastructure studies and platform studies, and discuss why Plantin et al. (2018) argue the two should be combined.", "priority": "high", "type": "Explain/Discuss"}, {"q": "Critically examine the concepts of 'platformization of infrastructures' and 'infrastructuralization of platforms' using the examples of Google and/or Facebook.", "priority": "high", "type": "Critical analysis"}, {"q": "To what extent can Facebook or Google be considered infrastructure rather than merely a platform?", "priority": "high", "type": "To what extent"}, {"q": "Compare the API-as-gateway with a genuinely open infrastructure gateway (e.g. the ISO shipping container). What is lost when a gateway is privately controlled?", "priority": "medium", "type": "Comparative"}, {"q": "Apply Plantin et al.'s infrastructure/platform framework to a digital service used in Bangladesh.", "priority": "high", "type": "Application"}], "mistakes": ["Don't confuse 'infrastructure' (public-interest, historically evolved, often regulated) with 'platform' (privately controlled, programmable core + outside developers) — the whole point of the paper is that these are becoming blurred, not identical.", "Don't say platforms and infrastructures are 'the same thing' — say their boundaries are becoming blurry / they are converging.", "Don't confuse 'platformization of infrastructures' (public → private/splintered) with 'infrastructuralization of platforms' (private platform → essential/public-like) — they point in opposite directions."], "bangladesh": [{"source": "Plantin et al. argue that platforms increasingly acquire infrastructure-like properties (ubiquity, essential daily-life role) while remaining privately controlled.", "application": "Facebook functions as a de-facto communication and even commercial infrastructure for millions of users in Bangladesh (small businesses running entirely on Facebook Pages/Marketplace, government offices using Facebook pages for public updates), despite being a private, profit-driven platform rather than a public utility.", "safe": "Although Plantin et al. do not discuss Bangladesh, their framework can be applied to the Bangladeshi context by considering how a private platform such as Facebook has taken on an infrastructural role in everyday communication and small business, which raises the same public-interest-versus-private-control tension the authors identify."}]}, {"id": "t2", "short": "Information & Capitalism", "title": "Information and Advanced Capitalism: Herbert Schiller", "author": "Frank Webster (discussing Herbert Schiller)", "source": "Theories of the Information Society, Ch.5", "tagline": "The 'information society' is just capitalism wearing a new coat", "centralQuestion": "Does the rise of the 'information society' represent a genuine break from capitalism — or is it better explained as a continuation of long-standing capitalist priorities?", "centralArgument": "Herbert Schiller (a political-economy / Critical Theory / Marxian thinker) argues the 'information society' is NOT a new, post-capitalist era. It is the latest stage of familiar capitalism: market pressures, class inequality and corporate capitalism decide how information and IT are produced, distributed and controlled — and information/IT have in turn become essential props that sustain capitalism.", "supportingArguments": [{"tag": "SOURCE", "text": "Market criteria: information/IT is produced and made available chiefly where there is a prospect of profit — R&D, products and services follow money, not public need (e.g. Thorn-EMI dropping medical electronics because it saw little profit there)."}, {"tag": "SOURCE", "text": "Class inequalities: ability-to-pay decides who gets rich, sophisticated information (corporations, governments, the military) and who gets 'garbage information' (mass entertainment) — the 'information rich' versus the 'information poor' (Schiller, 1983b)."}, {"tag": "SOURCE", "text": "Corporate capitalism: a small number of huge, oligopolistic, transnational corporations (IBM, AT&T, etc.) dominate the information industry, and IT is developed above all to serve corporate needs (global coordination, decentralised-yet-centrally-monitored operations, transfer pricing)."}, {"tag": "SOURCE", "text": "Transnational/cultural imperialism: global media flow overwhelmingly from the West (especially the US) outward — a 'one-way street' that spreads capitalist/consumerist values and marginalises poorer nations, prompting Schiller's advocacy for a New World Information Order (NWIO)."}, {"tag": "SOURCE", "text": "Consumer capitalism: television and advertising use surveillance and psychological persuasion to manufacture consumer demand, turning audiences themselves into a commodity sold to advertisers ('audience commodity', Dallas Smythe, 1981)."}], "evidence": ["British Telecom (BT): received about one-third of its revenue from just 300 corporate customers; over 70% of its traffic came from business customers, while at least 20% of UK households lacked even a basic telephone.", "80% of the European IT market was accounted for by corporate and government customers, with the 'general public' making up the rest (Butler Cox and Partners, cited in Schiller).", "Just four Western news agencies (2 American, 1 British, 1 French) produced about 90% of the world's international news; UPI gave over two-thirds of its coverage to the US and only 1.8% to Africa.", "AT&T (revenue $60bn+/year) shed over 140,000 jobs while expanding into global telecommunications; Bell Atlantic attempted a $33bn takeover of the US's biggest cable operator, TCI."], "criticisms": [{"tag": "SOURCE", "text": "No clear alternative policy: critics note Critical Theorists rarely propose a practical alternative, and the collapse of Communist states is said to discredit anti-capitalist critique (Webster argues this doesn't invalidate Schiller's explanatory value)."}, {"tag": "SOURCE", "text": "'Fall from grace' assumption: the claim that things are getting worse (more 'garbage information', more surveillance) lacks a solid historical/comparative baseline; Giddens notes that surveillance/control technologies can also expand people's choices, not just constrain them."}, {"tag": "SOURCE", "text": "Crude class model: the blunt 'information rich / information poor' split ignores gender, race/ethnicity, and the difference between institutional (corporate) wealth and personal wealth, and overlooks cultural capital (education, literacy) as distinct from economic capital."}, {"tag": "SOURCE", "text": "'All or nothing' view: Critical Theory can overstate how much information is mere 'garbage' — in absolute terms, high-quality information (e.g. UK's Channel 4, VCR time-shifting to educational programming, paperback classics) has also increased."}, {"tag": "SOURCE", "text": "The 'duped audience' assumption: postmodernists argue ordinary people are smart enough to see through advertising's artificiality/irony, and that home-centred life doesn't necessarily mean losing communal ties (Saunders, 1990)."}], "conclusionSource": "Despite these objections, Webster concludes Schiller's work remains valuable: it starts from the 'real, substantive world' rather than speculative futures, correctly foregrounds market criteria and corporate capitalism, and rightly insists that social inequality persists — indeed is reshaped, not erased — in the so-called 'information age'.", "keyConcepts": [{"term": "Political economy approach", "academic": "An approach that (1) looks behind media messages to underlying economic structures (ownership, advertising revenue, audience spending power), (2) analyses information/communication systemically within the whole socio-economic system, and (3) stresses historical periodisation.", "simple": "Instead of just looking at the news story itself, you ask: who owns this company, who pays for the ads, and how does that shape what gets shown?", "bangla": "রাজনৈতিক অর্থনীতি দৃষ্টিভঙ্গি — মালিকানা ও অর্থের উৎস দেখে গণমাধ্যম বিশ্লেষণ", "memory": "Political economy = follow the MONEY and OWNERSHIP behind the message.", "exam": "The political economy approach looks behind media content to the structural, economic features that shape it (Golding and Murdock, 1991, cited in Schiller's work)."}, {"term": "Commodification of information", "academic": "The process by which information becomes available only on condition that it can be sold — treated like any other market good.", "simple": "Information gets turned into something you have to buy, like toothpaste or cereal.", "bangla": "তথ্যের পণ্যীকরণ — তথ্যকে পণ্যের মতো বিক্রি করা", "memory": "Commodification = information becomes a PRODUCT FOR SALE.", "exam": "Schiller argues that information is increasingly treated as a commodity, made available only when it can be sold profitably (Schiller and Schiller, 1982)."}, {"term": "Information rich / information poor", "academic": "A stratification concept describing how the ability to pay for premium information services divides society (and nations) into those with sophisticated, valuable information access and those left with 'garbage information'.", "simple": "Rich people/companies get high-quality, useful information; poor people mostly get entertainment and gossip.", "bangla": "তথ্য-ধনী ও তথ্য-দরিদ্র — অর্থ থাকা বা না-থাকার ভিত্তিতে তথ্যপ্রাপ্তির বৈষম্য", "memory": "PAY more → GET better information. Can't pay → GET 'garbage' info.", "exam": "Schiller distinguishes between the 'information rich' and the 'information poor', both within and between nations (Schiller, 1983b)."}, {"term": "Corporate capitalism", "academic": "A stage of capitalism dominated by a relatively small number of large, oligopolistic, often transnational corporations that command national and international markets.", "simple": "A few giant companies control most of the economy, and they operate across many countries.", "bangla": "কর্পোরেট পুঁজিবাদ — কয়েকটি বৃহৎ বহুজাতিক কোম্পানির নিয়ন্ত্রণ", "memory": "A FEW giant firms, controlling a GLOBAL market.", "exam": "Contemporary capitalism, in Schiller's view, is dominated by corporate institutions with national and international reach (Schiller, cited in Webster)."}, {"term": "Cultural imperialism / NWIO", "academic": "The claim that Western (especially US) media dominance spreads capitalist/consumerist values globally in a largely one-directional flow; Schiller advocated a New World Information Order (NWIO) to redress this imbalance.", "simple": "Rich Western countries' movies, news and shows dominate the world, while poorer countries barely get their own voice heard internationally.", "bangla": "সাংস্কৃতিক সাম্রাজ্যবাদ — পশ্চিমা গণমাধ্যমের বৈশ্বিক আধিপত্য", "memory": "Information flows ONE WAY: rich West → rest of world.", "exam": "Schiller identifies a 'one-way street' of global information flow dominated by Western, especially American, media, and calls this 'cultural imperialism' (Schiller, cited in Webster)."}, {"term": "Audience commodity", "academic": "Dallas Smythe's (1981) term for the way commercial media (especially television) 'sell' assembled audiences to advertisers — the audience itself becomes the product.", "simple": "A TV channel doesn't just sell you a show — it sells YOU (as a viewer) to advertisers.", "bangla": "দর্শক-পণ্য — টেলিভিশন দর্শকদেরই বিজ্ঞাপনদাতাদের কাছে বিক্রি করে", "memory": "You watch TV for free... because YOU are the product being sold.", "exam": "Dallas Smythe (1981) coined the term 'audience commodity' to describe how television delivers audiences to advertisers."}], "questions": [{"q": "Explain Herbert Schiller's political economy critique of the 'information society'.", "priority": "high", "type": "Explain/Discuss"}, {"q": "Critically evaluate the Critical Theory / Marxian account of information and advanced capitalism.", "priority": "high", "type": "Critical analysis"}, {"q": "To what extent does the concept of an 'information society' represent a genuine break from capitalism?", "priority": "high", "type": "To what extent"}, {"q": "Compare Schiller's political economy approach with a non-Marxist (e.g. postmodernist) account of consumer culture.", "priority": "medium", "type": "Comparative"}, {"q": "Apply Schiller's concept of the 'information rich' and 'information poor' to the Bangladesh context.", "priority": "high", "type": "Application"}], "mistakes": ["Don't confuse 'information society' (the popular/mainstream idea of a new post-industrial era) with Schiller's own position — he is a CRITIC of this idea, not a supporter of it.", "Don't say Schiller believes technology itself is bad — his argument is about who controls and profits from technology, not the technology itself.", "Don't present the 'objections to Critical Theory' as Schiller's own view — they are counter-arguments Webster raises against Schiller."], "bangladesh": [{"source": "Schiller argues that market criteria decide where and to whom information/telecom services are provided, producing 'information rich' and 'information poor' groups.", "application": "Bangladesh's mobile/internet market is dominated by a small number of private operators competing mainly for profitable urban and corporate customers, while rural connectivity and affordability can lag behind — a pattern consistent with an 'information rich' urban/corporate segment versus an 'information poor' rural segment.", "safe": "Although Schiller was writing about British Telecom and the US/UK, the same market logic can be applied to the Bangladeshi telecom sector by considering how private operators prioritise profitable markets, potentially widening urban-rural information inequality."}]}, {"id": "t3", "short": "Urban Change", "title": "Information and Urban Change: Manuel Castells", "author": "Frank Webster (discussing Manuel Castells)", "source": "Theories of the Information Society, Ch.9", "tagline": "How the 'informational city' splits into a professional elite and an urban underclass", "centralQuestion": "How have capitalist restructuring and new information technology together reshaped cities, class structure and urban culture since the 1970s?", "centralArgument": "Manuel Castells argues that a combination of capitalist restructuring (following the 1970s economic crisis) and a new 'informational mode of development' has transformed society and cities. This produces 'informational cities' marked by (a) a new, sharply polarised ('dual') class structure — an elite of information professionals alongside a growing service/underclass — and (b), in Webster's more speculative extension, a distinctive 'postmodern' urban culture of consumption, fragmentation and pleasure.", "supportingArguments": [{"tag": "SOURCE", "text": "Castells separates the 'capitalist mode of production' (social/market organisation) from an 'informational mode of development' (a technical paradigm where information processing is the core productive activity), which he claims is 'relatively autonomous' from capitalism."}, {"tag": "SOURCE", "text": "Restructuring + informationalism: post-1970s capitalist crisis was addressed through restructuring that depended on new information technology (flexible/Just-in-Time production, globalised finance and management)."}, {"tag": "SOURCE", "text": "Flows of information / global cities: IT networks let organisations transcend physical place, but information flows still need 'nerve centres' — global cities (New York, London, Tokyo) where information is collated and decisions made (supported by Saskia Sassen's research on 'global cities' and 'producer services')."}, {"tag": "SOURCE", "text": "Class polarisation / the 'dual city': the informational city produces both a growing professional-managerial 'information producer' class and a huge expansion of low-paid, insecure service jobs and a 'ghetto poor' underclass (William Wilson) living close by but worlds apart."}, {"tag": "INFERENCE / STUDY TIP", "text": "Webster's own (explicitly speculative) extension: the informational city is also a 'postmodern city' — marked by cultural fragmentation, gentrification, privatised/securitised public space, and a shift toward being a 'landscape of consumption' (Zukin)."}], "evidence": ["New York held a 44% share of world capital, alongside roughly 2,000 murders a year and deep poverty in the Bronx — a city of 'dreams and nightmares' (Castells).", "Anthony King (1990): New York had headquarters of 59 transnational corporations, London 37, Tokyo 34, Paris 26 — evidence of corporate concentration in a few 'world cities'.", "Los Angeles: by 1988, 70% of downtown LA was foreign-owned; the city saw serious rioting in 1992 after the Rodney King beating, read by commentators as a symptom of the 'dual city'.", "London's Docklands/Canary Wharf redevelopment (aiming for 71 acres and 50,000 jobs) displaced the traditional working-class East End community with offices and upmarket housing for information professionals."], "criticisms": [{"tag": "SOURCE", "text": "Technological determinism: separating an 'autonomous' informational mode of development from capitalism echoes Daniel Bell's conservative post-industrial theory and Althusserian 'Scientific Marxism' — Critical Marxists (Adorno, Marcuse, Raymond Williams, E.P. Thompson) and STS scholars reject treating technique as separate from social values."}, {"tag": "SOURCE", "text": "Overgeneralisation: not all 'global cities' fit the same mould — Tokyo is more homogeneous and settled than London or New York (Sassen); it is unclear whether cities like Paris, Chicago, Frankfurt or Hong Kong merit the same label (Markusen and Gwiasda, 1994)."}, {"tag": "SOURCE", "text": "Historical novelty overstated: divided, feared urban underclasses are not new — 19th-century 'outcast London' shows similar fears about a 'dangerous' urban poor (Jones, 1984)."}, {"tag": "SOURCE", "text": "The 'postmodern city' argument is explicitly flagged by Webster himself as speculative and going further than Castells himself would allow — students should treat this section as Webster's extension, not Castells' own claim."}], "conclusionSource": "Webster concludes that Castells' empirical analysis of class polarisation in global cities (New York, Los Angeles, London) is illuminating and well-evidenced, even though the theoretical foundation (an 'autonomous' informational mode of development) is disputable and risks technological determinism; the further claim about a 'postmodern' urban culture is suggestive but more speculative.", "keyConcepts": [{"term": "Informational mode of development", "academic": "Castells' term for a new socio-technical paradigm in which information processing becomes the core activity conditioning all production, distribution, consumption and management — claimed to be 'relatively autonomous' from the capitalist mode of production.", "simple": "A new way of organising how things get made and managed, based on processing information rather than just making physical goods.", "bangla": "তথ্যভিত্তিক উন্নয়ন-পদ্ধতি — তথ্য প্রক্রিয়াকরণ যখন উৎপাদনের মূল ভিত্তি হয়ে ওঠে", "memory": "Mode of DEVELOPMENT = the TECHNICAL way things get produced (separate, Castells claims, from capitalism itself).", "exam": "Castells argues that an 'informational mode of development', where information processing is the core productive activity, is emerging alongside (and relatively autonomous from) the capitalist mode of production (Castells, 1989)."}, {"term": "Space of flows / flows of information", "academic": "Castells' idea that IT networks let economic and social activity transcend the limits of physical place, with information itself (rather than location) becoming central to organisation — though flows still require physical 'nerve centres'.", "simple": "Money, information and decisions can move instantly around the world through networks, but they still need to be physically managed somewhere.", "bangla": "তথ্যপ্রবাহ — তথ্যপ্রযুক্তি যখন স্থানের সীমাবদ্ধতা অতিক্রম করে", "memory": "Information FLOWS everywhere, but still needs a physical HOME BASE (a global city).", "exam": "Castells argues that information networks reduce the significance of place while increasing the importance of the flow of information itself (Castells, 1989)."}, {"term": "Global city", "academic": "Saskia Sassen's (1991) term for cities (New York, London, Tokyo) that function as 'highly concentrated command posts of the world economy', housing 'producer services' professionals who manage global economic activity.", "simple": "A handful of major cities where the world's big financial and business decisions get made.", "bangla": "গ্লোবাল সিটি — বিশ্ব অর্থনীতির কেন্দ্রীয় নিয়ন্ত্রণকেন্দ্র হিসেবে কাজ করা শহর", "memory": "Global city = the world economy's COMMAND CENTRE.", "exam": "Sassen (1991) identifies New York, London and Tokyo as 'global cities' functioning as command posts of the world economy."}, {"term": "Dual city / bipolarisation", "academic": "Castells' term for the class structure of the informational city, split between an affluent professional-managerial 'information producer' class and an expanding low-paid, insecure service-sector/underclass.", "simple": "A city splitting into two very different worlds — rich information professionals on one side, poor service workers on the other, living close together but far apart in lifestyle.", "bangla": "দ্বৈত নগরী — একদিকে ধনী তথ্য-পেশাজীবী, অন্যদিকে দরিদ্র সেবা-শ্রমিক শ্রেণি", "memory": "Dual city = TWO cities in ONE — rich professionals + poor underclass, side by side.", "exam": "Castells (1989) argues the informational city is marked by 'bipolarization', producing a 'dual city' of information professionals and an urban underclass."}, {"term": "Postmodern city (Webster's extension)", "academic": "Webster's speculative extension suggesting the informational city's culture is marked by fragmentation, consumption, gentrification, privatised/securitised public space and hedonistic 'aestheticisation of life'.", "simple": "A city where fashion, shopping and image matter more than tradition or authenticity, and rich and poor areas are physically separated and guarded.", "bangla": "'উত্তরাধুনিক শহর' — ভোগবাদ ও বিভক্তির সংস্কৃতিতে চিহ্নিত শহর (ওয়েবস্টারের নিজস্ব সম্প্রসারণ)", "memory": "Postmodern city = SHOPPING + STYLE + SECURITY WALLS (explicitly Webster's own speculative addition).", "exam": "Webster speculatively extends Castells' analysis to suggest the informational city is also a 'postmodern city', citing Zukin's idea of cities as a 'landscape of consumption'."}], "questions": [{"q": "Explain Manuel Castells' concept of the 'informational city' and its consequences for urban class structure.", "priority": "high", "type": "Explain/Discuss"}, {"q": "Critically examine Castells' distinction between the capitalist mode of production and the informational mode of development.", "priority": "high", "type": "Critical analysis"}, {"q": "To what extent is the 'dual city' or 'bipolarisation' thesis supported by evidence from global cities such as New York, London and Los Angeles?", "priority": "high", "type": "To what extent"}, {"q": "Compare Castells' 'informational city' thesis with Webster's speculative 'postmodern city' extension.", "priority": "medium", "type": "Comparative"}, {"q": "Apply Castells' 'dual city'/informational city framework to a city in Bangladesh, such as Dhaka.", "priority": "high", "type": "Application"}], "mistakes": ["Don't confuse the 'capitalist mode of production' with the 'informational mode of development' — Castells insists (controversially) that they are analytically SEPARATE, even though related.", "Don't attribute the 'postmodern city' argument directly to Castells — Webster is explicit that this part is his own speculative extension.", "Don't say Castells is a straightforward Marxist throughout his career — Webster notes he moved from an early Marxist position (The Urban Question, 1972) toward 'post-Marxism' by the time of The Informational City (1989)."], "bangladesh": [{"source": "Castells argues that informational cities develop a 'dual' class structure: an affluent professional-managerial class alongside a large low-paid service/underclass, often living in close physical proximity but very different worlds.", "application": "Dhaka's rapid growth as a hub for garment-export management, banking, IT/BPO and NGOs alongside a very large informal/service-sector and slum population (e.g. areas like Korail) could be examined for signs of a similar 'dual city' pattern of spatial and class polarisation.", "safe": "Although Castells writes about New York, London, Tokyo and Los Angeles, not Dhaka, the same conceptual lens — informational-economy growth alongside a growing urban underclass — could be applied to Dhaka's development, while noting the very different colonial, economic and demographic history of a South Asian megacity."}]}, {"id": "t4", "short": "AI & Creative Industries", "title": "Artificial Intelligence in the Creative Industries", "author": "Anantrasirichai & Bull (2022)", "source": "Artificial Intelligence Review, 55", "tagline": "Can AI actually create — or is it only a very capable assistant?", "centralQuestion": "What is the current state of AI/machine learning technology in the creative industries, and can AI genuinely be a 'creator' in its own right, or only a tool?", "centralArgument": "AI — especially deep learning methods like CNNs, GANs, RNNs and deep reinforcement learning — has become a powerful assistant across five categories of creative work (content creation, information analysis, content enhancement, information extraction, and data compression). But current AI works best as a human-centric tool or collaborator, not an autonomous creator: genuine creative originality, broad contextual judgement, and awards-level creativity remain out of reach for now.", "supportingArguments": [{"tag": "SOURCE", "text": "AI succeeds where problems are well-defined, data-rich, and don't require broad context or long chains of reasoning — e.g. automated journalism (BBC, Forbes' 'Bertie', the Washington Post's 'Heliograf'), recommendation engines (Spotify, Netflix), and post-production tasks like denoising or colourisation."}, {"tag": "SOURCE", "text": "AI struggles to be a genuine autonomous 'creator' because creative tasks are 'ill-posed' and 'one-to-many' — e.g. if many artists are asked to draw a cat, all the results will differ in colour, shape and pose, which does not fit the labelled, single-correct-answer structure that supervised learning needs."}, {"tag": "SOURCE", "text": "Generative Adversarial Networks (GANs) can now produce near-photorealistic content (e.g. NVIDIA's 1024×1024-pixel portraits) but still show artefacts at object boundaries and are limited to relatively small, constrained outputs, so they remain a tool rather than an independent artist."}, {"tag": "SOURCE", "text": "AI in the creative sector carries real ethical/social risks: biased training data produces biased outputs (e.g. face recognition failing on some ethnic groups), deepfakes enable disinformation and non-consensual content, and a widening 'digital divide' (flagged by UNESCO) risks deepening inequality of access to creative/cultural opportunity."}], "evidence": ["Sunspring (2016): a short film scripted entirely by an RNN-based AI named 'Benjamin', showing unnatural but creative dialogue.", "'The Next Rembrandt' (2016): a new 'Rembrandt' painting generated by deep learning trained on his portfolio.", "An AI-generated artwork was auctioned for $432,500 in 2018 — the first painting created solely by AI to be auctioned.", "Research publication growth on AI relevant to the creative industries exceeded 500% in five years (1490% in Taiwan) according to Davies et al. (2020).", "A survey by Adobe found three-quarters of artists (US, UK, Germany, Japan) were open to using AI as an assistant for 'non-creative' tasks like image search and editing."], "criticisms": [{"tag": "SOURCE", "text": "Ethical risks: biased/unrepresentative training data leads to biased, judgemental outputs; authorship and intellectual-property rights are unclear when AI 'creates' content; deepfakes enable fraud, political disruption and non-consensual content."}, {"tag": "SOURCE", "text": "Technical limitation: most GAN-based methods are still confined to relatively small or constrained outputs with visible artefacts, especially at the boundary between foreground and background."}, {"tag": "SOURCE", "text": "AI does not learn the way humans do: unlike a human infant, which can generalise from very little experience (LeCun's example of a baby learning that objects obey gravity), AI needs huge amounts of labelled data and generalises far less flexibly."}, {"tag": "SOURCE", "text": "The paper's own conclusion is explicit: the prospect of AI (or its developers) winning creative awards in genuine competition with human creatives is 'some way off'."}], "conclusionSource": "The paper concludes that, for the creative industries, maximum benefit from AI comes from designing it to be human-centric — augmenting rather than replacing human creativity — while continuing to address bias, fakes, authorship and the wider social impact of these technologies.", "keyConcepts": [{"term": "Narrow AI vs. General AI", "academic": "'Narrow'/'weak' AI operates within a limited domain on a specific task; 'general'/'strong' AI would exhibit full human-like intelligence across domains. Current AI (including in the creative sector) is narrow AI.", "simple": "Narrow AI is good at ONE job (like recognising faces); general AI (which doesn't really exist yet) would be smart at EVERYTHING like a human.", "bangla": "সংকীর্ণ এআই বনাম সাধারণ এআই — নির্দিষ্ট কাজে দক্ষ বনাম মানুষের মতো সর্বজনীন বুদ্ধিমত্তা", "memory": "Narrow AI = ONE-TRICK expert. General AI = human-level ALL-ROUNDER (still hypothetical).", "exam": "Current AI technologies are restricted to a limited domain and are described as 'narrow' or 'weak' AI (Anantrasirichai and Bull, 2022)."}, {"term": "CNN (Convolutional Neural Network)", "academic": "A deep-learning architecture designed for grid-like data (e.g. images), which learns a hierarchy of features — edges, then shapes, then semantic content — through layers of convolution.", "simple": "A type of AI that looks at pictures the way our eyes do: first spotting edges, then shapes, then whole objects.", "bangla": "সিএনএন — ছবি বিশ্লেষণের জন্য ব্যবহৃত একটি এআই কাঠামো", "memory": "CNN = sees EDGES → SHAPES → WHOLE OBJECT, layer by layer.", "exam": "CNNs learn to detect edges in early layers, then combine these into higher-level, more semantically meaningful features (Anantrasirichai and Bull, 2022)."}, {"term": "GAN (Generative Adversarial Network)", "academic": "An architecture (Goodfellow et al., 2014) with two competing networks — a generator that creates content and a discriminator that judges whether it is real or fake — whose competition drives increasingly realistic output.", "simple": "Two AIs compete: one tries to fake an image, the other tries to spot the fake — and this competition makes the fakes better and better.", "bangla": "জিএএন — দুটি প্রতিদ্বন্দ্বী এআই নেটওয়ার্ক যা বাস্তবসদৃশ ছবি তৈরি করে", "memory": "GAN = a FORGER vs. a DETECTIVE, competing until the forgery is nearly perfect.", "exam": "GANs consist of a generator and a discriminator in competition, producing increasingly realistic synthetic content (Goodfellow et al., 2014, cited in Anantrasirichai and Bull, 2022)."}, {"term": "Deepfake", "academic": "AI-generated (typically GAN- or VAE-based) synthetic media that convincingly replaces or fabricates a person's face, voice or movement.", "simple": "A fake video or photo made by AI that looks so real it's hard to tell it's fake.", "bangla": "ডিপফেক — এআই দিয়ে তৈরি করা বাস্তবসদৃশ ভুয়া ভিডিও বা ছবি", "memory": "Deepfake = AI-made FAKE that looks DEEP-ly real.", "exam": "Deepfake technologies can create realistic fake videos, raising concerns about disinformation and non-consensual content (Anantrasirichai and Bull, 2022)."}, {"term": "Human-in-the-loop", "academic": "A design principle in which AI outputs are checked, curated or corrected by humans, because AI performs poorly on open-ended, ill-posed creative judgement.", "simple": "AI does the first draft; a human always checks and fixes it before it's finished.", "bangla": "হিউম্যান-ইন-দ্য-লুপ — এআই-এর ফলাফল মানুষ যাচাই করে চূড়ান্ত করে", "memory": "AI drafts. HUMAN decides.", "exam": "The paper argues AI tools must be designed with a 'human in the loop' rather than as an isolated black-box solution (Anantrasirichai and Bull, 2022)."}, {"term": "Ethics by/in/for Design", "academic": "Dignum's (2018) three-part framework: Ethics by Design (building ethical behaviour into autonomous systems), Ethics in Design (analysing ethical implications), Ethics for Design (codes/protocols for developers and users).", "simple": "Three ways to keep AI ethical: build ethics INTO the system, THINK about its ethical effects, and set RULES for the people who build and use it.", "bangla": "এআই নৈতিকতার তিনটি স্তর — নকশায় নৈতিকতা, নকশার নৈতিক বিশ্লেষণ, এবং নকশার জন্য নীতিমালা", "memory": "BY (built in), IN (analysed), FOR (rules for people).", "exam": "Dignum (2018) distinguishes Ethics by Design, Ethics in Design, and Ethics for Design as three ways ethics relates to AI systems."}], "questions": [{"q": "Explain how AI technologies such as CNNs, GANs and RNNs are used in the creative industries.", "priority": "high", "type": "Explain/Discuss"}, {"q": "Critically examine whether AI can be considered a genuine 'creator' rather than merely a creative tool.", "priority": "high", "type": "Critical analysis"}, {"q": "To what extent do ethical concerns (bias, deepfakes, the digital divide) limit the beneficial use of AI in the creative industries?", "priority": "high", "type": "To what extent"}, {"q": "Compare the use of AI as a creative 'tool' versus AI as an autonomous 'creator', using examples from the text.", "priority": "medium", "type": "Comparative"}, {"q": "Discuss how AI in the creative industries could be applied in the Bangladeshi context (e.g. freelancing, digital marketing, journalism).", "priority": "high", "type": "Application"}], "mistakes": ["Don't say AI in this paper equals 'general/strong AI' — the entire paper is about narrow/weak AI applied to specific creative tasks.", "Don't confuse a GAN's generator with a fully independent 'creator' — the paper explicitly says a GAN generator does not learn to create new content, only to imitate the training data's style, which is why a special variant (the Creative Adversarial Network) was proposed to push toward more original output.", "Don't treat 'deepfake' as always malicious in the source — the paper also discusses legitimate creative and entertainment uses, while clearly flagging the ethical risks."], "bangladesh": [{"source": "The paper stresses that current AI works best as a human-centric assistant, and separately raises UNESCO's concern about AI widening the 'digital divide'.", "application": "Bangladesh's growing freelance/outsourcing and digital-marketing sector could be examined as an example of AI-as-assistant (freelancers using AI writing, image and video tools to increase productivity), while the urban-rural and income-based gap in access to computing devices, reliable internet and AI literacy illustrates the 'digital divide' concern UNESCO raises.", "safe": "Although the paper does not discuss Bangladesh, its 'AI as human-centric tool' conclusion and its digital-divide warning can both be applied to the Bangladeshi context by considering how differential access to AI tools may affect who benefits most from this technology."}]}], "connections": [{"pair": "Topic 1 ↔ Topic 2", "title": "Infrastructure/Platforms ↔ Information & Capitalism", "common": "Both concern how private corporate power shapes information/communication systems for profit rather than public benefit.", "differ": "Schiller writes broad political-economy/Marxist theory about capitalism in general (telecoms, media, IT industries in the 1980s-90s); Plantin et al. write STS-influenced theory focused specifically on digital objects (APIs, gateways, programmability) in the 2010s (Google, Facebook).", "addsToEachOther": "Schiller's 'corporate capitalism' and 'market criteria' supply the deeper political-economy explanation of WHY infrastructures get 'platformized' (Plantin's term) — Plantin describes the structural 'what', Schiller supplies the 'why'.", "combineTip": "Use Schiller's 'for whose benefit and under whose control?' question to critically interrogate Plantin et al.'s account of Google/Facebook's platform power.", "cite": "Schiller (1981) on 'market economy imperatives' + Plantin et al. (2018) on 'platformization of infrastructures'."}, {"pair": "Topic 1 ↔ Topic 3", "title": "Infrastructure/Platforms ↔ Urban Change", "common": "Both are concerned with networks that let information/capital 'flow' globally while control concentrates in a few hands/places.", "differ": "Plantin et al. focus on the technical/corporate mechanics (APIs, gateways) of specific digital platforms; Castells focuses on the spatial/urban and class consequences (global cities, the 'dual city') of information flows.", "addsToEachOther": "Plantin et al.'s platform/infrastructure vocabulary gives concrete technical mechanisms (APIs, walled gardens) for how Castells' abstract 'space of flows' actually operates and who controls it.", "combineTip": "Use Plantin's platform lens to update/ground Castells' 'informational mode of development' with a specific contemporary example (e.g., Google/Facebook headquartered in and shaping global cities).", "cite": "Plantin et al. (2018) on APIs/gateways + Castells (1989) on the 'space of flows' and global cities."}, {"pair": "Topic 1 ↔ Topic 4", "title": "Infrastructure/Platforms ↔ AI & Creative Industries", "common": "Both show large corporate platforms (notably Google) enclosing public-interest resources within proprietary, API-mediated systems.", "differ": "Plantin et al. analyse infrastructure/platform power structurally; Anantrasirichai and Bull analyse specific AI techniques and their creative applications, with only limited discussion of ownership/political economy.", "addsToEachOther": "Plantin et al.'s account of Google Books 'platformizing the library' parallels the AI paper's account of AI-driven recommendation/creative tools enclosing creative and cultural production within corporate platforms (e.g. Spotify, Netflix).", "combineTip": "Note that many AI creative tools (Sect 3.2.4 recommendation engines) run on exactly the platform/API model Plantin et al. describe — connect the technical/political-economy dots.", "cite": "Plantin et al. (2018) on Google Books/APIs + Anantrasirichai and Bull (2022) on recommendation engines (Sect. 3.2.4)."}, {"pair": "Topic 2 ↔ Topic 3", "title": "Information & Capitalism ↔ Urban Change", "common": "Both are explicitly linked in the source text: Webster notes that Castells' Marxian concepts (commodification, corporate capitalism) draw directly on the same Critical Theory tradition represented by Schiller.", "differ": "Schiller focuses on the media/information industries broadly (national and global media economy); Castells applies similar political-economy logic specifically to urban/spatial restructuring (which cities/classes win and lose).", "addsToEachOther": "Schiller explains the general capitalist logic driving the 'information revolution'; Castells shows its specific spatial consequence — where information capital physically concentrates and how it polarises a city's class structure.", "combineTip": "Schiller explains WHY information capital concentrates in a few transnational corporations; Castells shows WHERE that concentration lands physically (a handful of global cities, split into rich and poor).", "cite": "Schiller (1981) on corporate capitalism + Castells (1989) on the 'dual city' and global cities."}, {"pair": "Topic 2 ↔ Topic 4", "title": "Information & Capitalism ↔ AI & Creative Industries", "common": "Schiller's 'information rich / information poor' divide anticipates the AI paper's 'digital divide' concern (UNESCO); both concern unequal access driven by corporate/economic power.", "differ": "Schiller offers a macro-structural, Marxist critique of the whole information economy and its corporate ownership; Anantrasirichai and Bull's paper is narrower and more technical, and does not offer a class-based political economy critique of who owns/profits from AI.", "addsToEachOther": "Schiller's political-economy questions ('for whose benefit? under whose control?') can be used to critically interrogate the AI paper's largely techno-optimist, human-centric framing.", "combineTip": "Apply Schiller's 'commodification' and 'corporate capitalism' concepts to today's AI industry (a handful of firms — Google, Meta, Microsoft, Amazon — control the data/compute needed for AI).", "cite": "Schiller (1983b) on 'information rich/poor' + Anantrasirichai and Bull (2022) on the digital divide (Sect. 4.1, citing UNESCO)."}, {"pair": "Topic 3 ↔ Topic 4", "title": "Urban Change ↔ AI & Creative Industries", "common": "Castells' 'information producer' professional-managerial class (advertising, finance, journalism, media) is precisely the workforce whose jobs the AI paper discusses being reshaped by automation.", "differ": "Castells focuses on urban/spatial class polarisation from the 1970s-90s restructuring; the AI paper focuses on specific technologies (2010s-2020s) transforming creative/media production tasks.", "addsToEachOther": "The AI paper's account of automated journalism, ad analytics and recommendation engines can be read as an intensification of the same 'information producer' class Castells describes decades earlier — now partly automated.", "combineTip": "(APPLICATION/INFERENCE) AI-driven automation could deepen Castells' 'dual city' polarisation if AI displaces some lower-skilled creative/service jobs while enriching a small AI-literate professional elite.", "cite": "Castells (1989) on information professionals + Anantrasirichai and Bull (2022) on automated journalism (Sect. 3.1.2)."}], "crossTopicQuestions": [{"q": "Discuss how Schiller's political economy of information and Plantin et al.'s infrastructure/platform framework together explain the power of corporations such as Google.", "askingReally": "Can you combine a Marxist political-economy explanation (why corporations dominate information) with a structural/technical framework (how they dominate, through APIs and platformization)?", "theories": ["Schiller's corporate capitalism/market criteria", "Plantin et al.'s platformization of infrastructures / infrastructuralization of platforms"], "arguments": ["Corporate capitalism drives the profit motive behind platformization (T2)", "APIs act as gateways that lock users/developers into corporate control (T1)", "Google/Facebook show infrastructure-like ubiquity while remaining privately profit-driven (T1+T2)"], "scholars": ["Schiller (1981)", "Plantin et al. (2018)"], "structure": "Intro (define both concepts) → Schiller's political economy of corporate capitalism → Plantin et al.'s infrastructure/platform framework → apply both to Google/Facebook → critical evaluation → conclusion", "avoid": "Don't treat the two theories as identical — one is macro-political-economy, the other is meso-level structural/technical.", "keyPoints": ["Market criteria (T2) explain profit motive", "Corporate capitalism (T2) explains scale/concentration", "Platformization of infrastructures (T1) explains historical process", "Infrastructuralization of platforms (T1) explains outcome for Google/Facebook", "API as gateway (T1) explains lock-in mechanism", "'For whose benefit, under whose control?' (T2) as critical question to ask of T1's case studies"]}, {"q": "How can Castells' informational city thesis and Schiller's political economy of information together explain global inequality in the information age?", "askingReally": "Can you connect a spatial/urban theory (where inequality lands) with a political-economy theory (why inequality is produced)?", "theories": ["Schiller's information rich/poor and corporate capitalism", "Castells' dual city and global cities"], "arguments": ["Market criteria and corporate capitalism (T2) explain why information/capital concentrates in a few corporations", "Global cities (T3) are where that concentration is spatially expressed", "The dual city / bipolarisation (T3) is the urban class consequence of the same corporate logic (T2) Schiller describes"], "scholars": ["Schiller (1983b)", "Castells (1989)", "Sassen (1991)"], "structure": "Intro → Schiller's information rich/poor thesis → Castells' dual/global city thesis → show how they combine (why + where) → evaluate limitations of both → conclusion", "avoid": "Don't discuss the two theories in separate, disconnected halves — explicitly link 'why' (T2) to 'where' (T3).", "keyPoints": ["Information rich/poor (T2)", "Corporate capitalism (T2)", "Global city as command post (T3, Sassen)", "Dual city/bipolarisation (T3)", "Both use a political-economy/Marxian lens", "Both face similar criticism: crude/overgeneralised class model"]}, {"q": "To what extent do AI technologies in the creative industries intensify the class and information inequalities described by Schiller and Castells?", "askingReally": "Can you apply older (1990s) political-economy/urban theory to a newer (2020s) technology (AI) to evaluate whether inequality is intensifying?", "theories": ["Schiller's information rich/poor", "Castells' dual city", "Anantrasirichai and Bull's digital divide/bias concerns"], "arguments": ["AI's digital divide (T4) echoes Schiller's information rich/poor divide (T2)", "AI-driven automation of 'information producer' jobs (T4) could deepen Castells' dual city polarisation (T3, as an APPLICATION/INFERENCE, not stated in either source)", "Bias in AI training data (T4) is a new mechanism producing familiar inequalities (T2, T3)"], "scholars": ["Schiller (1983b)", "Castells (1989)", "Anantrasirichai and Bull (2022)"], "structure": "Intro → briefly explain Schiller's and Castells' inequality concepts → explain AI paper's digital divide/bias concerns → argue for intensification (with appropriate caution/label as extension) → discuss limits of the comparison → conclusion", "avoid": "Don't claim the AI paper itself makes this connection to Schiller/Castells — this is your own synthesis; be explicit that this is an extension/application.", "keyPoints": ["Digital divide (T4, UNESCO)", "Information rich/poor (T2)", "Dual city (T3)", "Bias in AI training data (T4)", "This connection is INFERENCE — flag clearly in the exam"]}, {"q": "Compare how Plantin et al. and Castells each use the concept of 'infrastructure' to describe digital-age power.", "askingReally": "Can you show you understand that both texts use similar vocabulary ('flows', 'networks', 'infrastructure') but for different purposes?", "theories": ["Plantin et al.'s infrastructure studies", "Castells' space of flows"], "arguments": ["Plantin et al. use 'infrastructure' to analyse specific technical/corporate systems (Google, Facebook, the Open Web)", "Castells uses 'flows of information' to analyse economic/spatial reorganisation of cities", "Both share the idea that essential systems increasingly transcend traditional public/state control"], "scholars": ["Plantin et al. (2018)", "Castells (1989)"], "structure": "Intro → Plantin's infrastructure concept → Castells' space of flows concept → compare purposes and levels of analysis → conclusion", "avoid": "Don't conflate 'infrastructure' in the STS/platform-studies sense (T1) with 'informational mode of development' in Castells' Marxian sense (T3) — they are related but not identical.", "keyPoints": ["Infrastructure = ubiquity/reliability/durability (T1)", "Space of flows = information transcending place (T3)", "Both concern erosion of traditional (public/state) control", "Different disciplinary roots: STS/platform studies (T1) vs. urban sociology/Marxism (T3)"]}], "citationBank": [{"scholar": "Plantin, Lagoze, Edwards & Sandvig", "year": "2018", "concept": "Platformization of infrastructures / infrastructuralization of platforms", "use": "Any question on Google, Facebook, digital platforms, or the public-vs-private control of digital infrastructure.", "exam": "Plantin et al. (2018) argue that the boundaries between infrastructure and platform have become increasingly blurred.", "loc": "Topic 1"}, {"scholar": "Herbert Schiller", "year": "1981", "concept": "Market imperatives remain determining even amid technological change", "use": "Any question on the 'information society' debate, capitalism, or market criteria.", "exam": "Schiller (1981) insists that 'long prevailing imperatives of a market economy remain as determining as ever'.", "loc": "Topic 2"}, {"scholar": "Schiller and Schiller", "year": "1982", "concept": "Commodification of information", "use": "Questions on the commercialisation of information/data.", "exam": "Schiller and Schiller (1982) argue that information today is treated as a commodity, like toothpaste or breakfast cereals.", "loc": "Topic 2"}, {"scholar": "Dallas S  "use": "Questions on AI-generated content, deepfakes, or image generation.", "exam": "Goodfellow et al. (2014) introduced the Generative Adversarial Network, where a generator and discriminator compete to produce realistic synthetic content.", "loc": "Topic 4"}, {"scholar": "Anantrasirichai and Bull", "year": "2022", "concept": "AI as a human-centric creative tool, not an autonomous creator", "use": "Questions on AI and creativity, or the future of AI in media/creative industries.", "exam": "Anantrasirichai and Bull (2022) conclude that maximum benefit from AI in the creative industries comes from designing it to augment, rather than replace, human creativity.", "loc": "Topic 4"}, {"scholar": "Dignum", "year": "2018", "concept": "Ethics by/in/for Design framework", "use": "Questions on AI ethics.", "exam": "Dignum (2018) distinguishes Ethics by Design, Ethics in Design and Ethics for Design as three ways ethics relates to AI systems.", "loc": "Topic 4"}], "factsBank": [{"fact": "Facebook accounted for over 60% of global social-media traffic at the time of writing.", "citation": "Plantin et al. (2018)", "use": "Platform dominance / infrastructuralization of platforms", "memory": "FB = 60%+ of social media traffic"}, {"fact": "Google accounted for about 65% of global web searches (85% in the US, 92% in Europe).", "citation": "Plantin et al. (2018)", "use": "Platform dominance / near-monopoly", "memory": "Google = ~65% global search"}, {"fact": "The privatisation of the US internet backbone occurred in 1987, with deregulation of commercial use following in 1992.", "citation": "Plantin et al. (2018)", "use": "Platformization of infrastructures / neoliberal deregulation", "memory": "1987 privatised, 1992 deregulated"}, {"fact": "Estonia offers universal internet connectivity as a public utility, unlike the splintered, for-profit US model.", "citation": "Plantin et al. (2018)", "use": "Contrast between public infrastructure and private platform models", "memory": "Estoni ital", "memory": "70% of downtown LA = foreign-owned"}, {"fact": "The 1992 Los Angeles riots followed the Rodney King beating and were read as a symptom of the 'dual city'.", "citation": "Castells (1989)/Webster", "use": "Consequences of urban class polarisation", "memory": "1992 LA riots = dual city symptom"}, {"fact": "An AI-generated painting was auctioned for $432,500 in 2018.", "citation": "Anantrasirichai and Bull (2022)", "use": "AI as creator debate", "memory": "$432,500 = first AI painting sold at auction"}, {"fact": "Research on AI relevant to creative industries grew by over 500% in five years (1490% in Taiwan).", "citation": "Davies et al. (2020), cited in Anantrasirichai and Bull (2022)", "use": "Growth/scale of AI in creative industries", "memory": "500%+ growth in 5 years (Taiwan: 1490%)"}, {"fact": "Three-quarters of surveyed artists were open to using AI as an assistant for 'non-creative' tasks.", "citation": "Adobe survey, cited in Anantrasirichai and Bull (2022)", "use": "AI as tool vs. creator debate", "memory": "75% of artists open to AI as assistant"}, {"fact": "NVIDIA achieved near-realistic 1024×1024-pixel GAN-generated portraits, trained for 14 days.", "citation": "Karras et al. (2018), cited in Anantrasirichai and Bull (2022)", "use": "Technical limits/progress of GAN image generation", "memory": "1024x1024 pixels, 14-day training"}], "sentenceTemplates": {"Introducing a theory": ["According to ________, ...", "________ argues that ...", "The concept of ________, developed by ________, refers to ..."], "Explaining an argument": ["The central argument of ________ is that ...", "________ suggests that this happens because ...", "At the heart of this theory is the idea that ..."], "Adding evidence": ["This argument is supported by ...", "For example, ________ shows that ...", "This is illustrated by the case of ________."], "Using another scholar": ["This view is further developed by ________.", "________ extends this argument by showing that
