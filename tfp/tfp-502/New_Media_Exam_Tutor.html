a citation.", "Body 2: give supporting arguments with evidence/examples.", "Body 3: briefly note a criticism or limitation.", "Conclusion: summarise the value and limits of the theory."]}, {"type": "Critically analyse", "structure": ["Introduction: define the theory and state that you will evaluate it critically.", "Body 1: explain the theory's main claims (with citation).", "Body 2: present the strongest criticisms/objections (labelled clearly as such).", "Body 3: weigh the theory's strengths against its weaknesses.", "Conclusion: give a balanced final judgement."]}, {"type": "Compare two theories/topics", "structure": ["Introduction: name both theories and state what you will compare.", "Body 1: explain theory/topic A.", "Body 2: explain theory/topic B.", "Body 3: explicitly compare — what they share, where they differ, what one adds to the other.", "Conclusion: state which combination (or theory) is more useful and why."]}, {"type": "Theory + Bangladesh application", "structure": ["Introduction: explain the theory from the source.", "Body 1: cite the relevant scholar and explain what the theory predicts/emphasises.", "Body 2: introduce Bangladesh as an application, using safe language ('Although the author does not discuss Bangladesh...').", "Body 3: explain the application in detail with a plausible example.", "Conclusion: return to the theoretical argument and conclude."]}, {"type": "Combined/merged topic", "structure": ["Introduction: name both topics and state the connection you will make.", "Body 1: explain topic/theory A.", "Body 2: explain topic/theory B.", "Body 3: explicitly connect them (common ground, difference, what each adds to the other).", "Conclusion: summarise how combining them gives a fuller explanation."]}, {"type": "'To what extent?' question", "structure": ["Introduction: restate the question and give your overall position (a brief thesis).", "Body 1: evidence/arguments supporting the claim.", "Body 2: evidence/arguments limiting or questioning the claim.", "Body 3 (optional): a nuanced middle-ground point.", "Conclusion: state your final judgement on 'to what extent', justified by the balance of evidence."]}], "difficultWords": [{"word": "commodification", "simple": "turning something into a product to be bought and sold", "bangla": "পণ্যীকরণ", "synonym": "marketisation", "example": "Schiller argues information has undergone commodification under capitalism."}, {"word": "oligopolistic", "simple": "controlled by a small number of large companies", "bangla": "কয়েকটি বৃহৎ প্রতিষ্ঠানের নিয়ন্ত্রণাধীন", "synonym": "concentrated", "example": "The information industry is described as highly oligopolistic."}, {"word": "transnational", "simple": "operating across many countries", "bangla": "বহুজাতিক", "synonym": "multinational", "example": "Corporate capitalism has created a transnational empire."}, {"word": "bipolarisation", "simple": "splitting into two very different, unequal groups", "bangla": "দ্বিমেরুকরণ", "synonym": "polarisation", "example": "Castells describes the bipolarisation of the informational city's class structure."}, {"word": "gentrification", "simple": "wealthier people moving into and redeveloping a poorer area", "bangla": "অভিজাতকরণ", "synonym": "urban renewal (with displacement)", "example": "London's Docklands underwent gentrification in the 1980s."}, {"word": "ubiquity", "simple": "being present everywhere", "bangla": "সর্বব্যাপ্তি", "synonym": "omnipresence", "example": "Infrastructure is defined partly by its ubiquity."}, {"word": "interoperability", "simple": "different systems being able to work together", "bangla": "আন্তঃব্যবহারযোগ্যতা", "synonym": "compatibility", "example": "Gateways enable interoperability between heterogeneous systems."}, {"word": "deregulation", "simple": "removing government rules/control from an industry", "bangla": "নিয়ন্ত্রণমুক্তকরণ", "synonym": "liberalisation", "example": "Deregulation of telecoms allowed private competition."}, {"word": "hegemonic", "simple": "dominant, holding cultural or social power over others", "bangla": "আধিপত্যবাদী", "synonym": "dominant", "example": "Castells calls information professionals a 'hegemonic social class'."}, {"word": "technological determinism", "simple": "the idea that technology alone drives social change, on its own", "bangla": "প্রযুক্তি-নিয়ন্ত্রণবাদ", "synonym": "tech-driven change theory", "example": "Critics accuse Castells of technological determinism."}, {"word": "stratification", "simple": "society divided into layers/classes based on wealth or status", "bangla": "স্তরবিন্যাস", "synonym": "social hierarchy", "example": "Class stratification shapes access to information."}, {"word": "discriminator (GAN)", "simple": "the part of a GAN that judges if an image is real or fake", "bangla": "জিএএন-এর বিচারক অংশ", "synonym": "classifier/judge network", "example": "The discriminator competes with the generator in a GAN."}, {"word": "algorithmic bias", "simple": "AI systems producing unfair results because of skewed training data", "bangla": "অ্যালগরিদমিক পক্ষপাত", "synonym": "AI bias", "example": "Algorithmic bias can cause face recognition to fail on certain groups."}], "modelAnswers": [{"title": "Model Answer 1 — 'Critically examine Herbert Schiller's political economy of information.' (Explain/Critical type)", "text": "<p><strong>Introduction:</strong> The idea of an 'information society' is often presented as a sharp break from industrial capitalism. Herbert Schiller, a leading political-economy / Critical Theory scholar, rejects this view. According to Schiller (1981), 'long prevailing imperatives of a market economy remain as determining as ever' in the informational and technological transformations of the current era. This essay explains Schiller's central argument, evaluates the evidence for it, and considers major criticisms of his position.</p>\n<p><strong>Central argument and supporting evidence:</strong> Schiller's political economy approach looks behind media content to underlying economic structures such as ownership, advertising revenue and audience spending power (Golding and Murdock, 1991). He argues that information is increasingly commodified — Schiller and Schiller (1982) state that information 'is something which, like toothpaste, breakfast cereals and automobiles, is increasingly bought and sold'. This commodification interacts with class inequality: because access depends on ability to pay, Schiller (1983b) distinguishes between the 'information rich' and the 'information poor'. Evidence supports this: 80% of the European IT market was accounted for by corporate and government customers (Butler Cox and Partners, cited in Schiller), while at least 20% of UK households lacked even a basic telephone. Finally, Schiller stresses corporate capitalism: a small number of oligopolistic transnational corporations (such as AT&T, with revenue exceeding $60 billion a year) dominate the information industry and shape it to serve their own interests, for instance through global expansion and mergers (e.g. Bell Atlantic's attempted $33bn takeover of TCI).</p>\n<p><strong>Critical evaluation:</strong> Schiller's account faces several objections. First, critics note that Critical Theorists rarely propose a workable political alternative, and the collapse of Communist regimes is sometimes said to discredit anti-capitalist critique altogether. However, this does not undermine the explanatory value of Schiller's diagnosis of the present. Second, Schiller's 'information rich/poor' model has been criticised as too crude, since it does not account for gender, ethnicity, or the difference between institutional (corporate) wealth and personal wealth. Third, some argue Schiller presents an 'all or nothing' view of information quality, ignoring the fact that high-quality information (for example, via the UK's Channel 4) has also increased in absolute terms. Fourth, postmodern critics contest Schiller's assumption that audiences are simply 'duped' by advertising, arguing that people are often capable of recognising and even enjoying the artificiality of consumer imagery (Saunders, 1990).</p>\n<p><strong>Conclusion:</strong> Despite these legitimate criticisms, Schiller's political economy of information remains valuable because it grounds analysis of new technology in real economic structures rather than speculative claims about a wholly 'new' society, and it correctly foregrounds the persistence — indeed the reshaping — of inequality in the so-called information age.</p>"}, {"title": "Model Answer 2 — 'Discuss how infrastructure/platform theory and urban change theory together explain digital-age inequality, with reference to Bangladesh.' (Combined + Bangladesh type)", "text": "<p><strong>Introduction:</strong> Understanding digital-age inequality requires combining insights from different levels of analysis. Plantin et al. (2018) analyse how corporate platforms such as Google and Facebook increasingly function as infrastructure while remaining privately controlled, while Castells (1989) analyses how information technology and capitalist restructuring reshape cities into 'dual' structures of rich information professionals and a poor urban underclass. This essay argues that combining these frameworks — and cautiously applying them to Bangladesh — gives a fuller account of digital-age inequality than either alone.</p>\n<p><strong>Plantin et al.'s framework:</strong> Plantin et al. (2018) argue that a 'platformization of infrastructures' (public services becoming private and competitive) has occurred alongside an 'infrastructuralization of platforms' (private platforms like Facebook and Google becoming so embedded in daily life that they resemble infrastructure). Facebook, for example, held over 60% of global social-media traffic at the time of writing, and its API acts as a 'gateway' that locks developers and users into a Facebook-controlled ecosystem rather than the open web.</p>\n<p><strong>Castells' framework:</strong> Castells (1989) argues that information technology, combined with capitalist restructuring since the 1970s, has created 'informational cities' marked by a 'dual' class structure: an affluent, cosmopolitan professional-managerial class of 'information producers' alongside a growing low-paid service sector and 'ghetto poor' underclass (Wilson, 1991). Sassen (1991) supports this by showing how a handful of 'global cities' (New York, London, Tokyo) concentrate corporate headquarters and 'producer services' professionals.</p>\n<p><strong>Combining the two, with a Bangladesh application:</strong> Plantin et al.'s framework explains the technical/corporate mechanism by which a few platforms concentrate power over communication; Castells' framework explains the resulting spatial and class consequences. Applied together, they suggest that as platforms like Facebook become de facto communication infrastructure, the professionals who can leverage them (for business, marketing, or global information access) may benefit disproportionately, while those without reliable access remain excluded — echoing Castells' 'dual city' pattern. Although neither author writes about Bangladesh, this combined framework can plausibly be applied to Dhaka: Facebook already functions as an infrastructure-like platform for many small businesses and individuals in Bangladesh, and Dhaka's growth as a hub for garment-export management, banking and IT/BPO alongside a very large informal/slum population shows a pattern broadly consistent with Castells' 'dual city' concept. This is offered as a reasonable application of the theory, not a claim that either author studied Bangladesh directly.</p>\n<p><strong>Conclusion:</strong> Combining Plantin et al.'s infrastructure/platform framework with Castells' informational/dual-city thesis provides both the 'how' (corporate platform mechanisms) and the 'where/who' (spatial and class consequences) of digital-age inequality, and this combined lens can be cautiously extended to make sense of comparable developments in a Bangladeshi context.</p>"}], "quiz": [{"prompt": "According to Plantin et al. (2018), what is the 'platformization of infrastructures'?", "options": [{"id": "a", "text": "Public/regulated infrastructures becoming deregulated, privatised and split into competing providers"}, {"id": "b", "text": "Private platforms becoming government-owned"}, {"id": "c", "text": "Infrastructure completely disappearing"}, {"id": "d", "text": "Platforms merging into a single company"}], "correct": "a", "explain": "Platformization of infrastructures refers to the deregulation/privatisation/splintering of once publicly-regulated infrastructure (e.g. telecoms, the internet)."}, {"prompt": "What does Herbert Schiller mean by the 'commodification of information'?", "options": [{"id": "a", "text": "Information becoming free for everyone"}, {"id": "b", "text": "Information being made available only when it can be sold for profit"}, {"id": "c", "text": "Information being banned by governments"}, {"id": "d", "text": "Information becoming purely digital"}], "correct": "b", "explain": "Schiller and Schiller (1982) argue information is treated like any other market commodity, sold for profit."}, {"prompt": "In Castells' theory, what is the 'dual city'?", "options": [{"id": "a", "text": "A city with two mayors"}, {"id": "b", "text": "A city split between an affluent information-professional class and a low-paid/underclass service sector"}, {"id": "c", "text": "A city located in two countries"}, {"id": "d", "text": "A fully planned, equal city"}], "correct": "b", "explain": "Castells (1989) argues informational cities polarise into a professional elite and an underclass."}, {"prompt": "What is a Generative Adversarial Network (GAN)?", "options": [{"id": "a", "text": "A single neural network with no competition"}, {"id": "b", "text": "Two competing networks — a generator and a discriminator"}, {"id": "c", "text": "A type of database"}, {"id": "d", "text": "A rule-based (symbolic) AI system"}], "correct": "b", "explain": "Goodfellow et al. (2014) proposed GANs, where a generator and discriminator compete."}, {"prompt": "According to Anantrasirichai and Bull (2022), why does AI struggle to be an autonomous 'creator'?", "options": [{"id": "a", "text": "AI cannot process images at all"}, {"id": "b", "text": "Creative tasks are 'ill-posed' and 'one-to-many', which doesn't fit supervised learning's need for clear ground truth"}, {"id": "c", "text": "AI is too expensive to run"}, {"id": "d", "text": "There is no interest from artists in using AI"}], "correct": "b", "explain": "The paper explains that creative tasks lack a single correct answer, unlike most supervised-learning tasks."}, {"prompt": "What is an API described as, in Plantin et al.'s infrastructure-studies vocabulary?", "options": [{"id": "a", "text": "A gateway"}, {"id": "b", "text": "A type of hardware"}, {"id": "c", "text": "A government regulation"}, {"id": "d", "text": "A social movement"}], "correct": "a", "explain": "Plantin et al. describe an API as a 'gateway' — but one unilaterally controlled by the platform owner."}, {"prompt": "Schiller (1981) is best known for which theoretical approach?", "options": [{"id": "a", "text": "Postmodernism"}, {"id": "b", "text": "Political economy / Critical Theory (Marxian)"}, {"id": "c", "text": "Technological determinism only"}, {"id": "d", "text": "Structuralist linguistics"}], "correct": "b", "explain": "Schiller is a leading political-economy/Critical Theory (Marxian) scholar."}, {"prompt": "Which city did Saskia Sassen NOT identify as one of the main 'global cities' in her 1991 study?", "options": [{"id": "a", "text": "New York"}, {"id": "b", "text": "London"}, {"id": "c", "text": "Tokyo"}, {"id": "d", "text": "Dhaka"}], "correct": "d", "explain": "Sassen's (1991) study focused on New York, London and Tokyo — not Dhaka."}, {"prompt": "Complete the citation: Dallas Smythe (____) coined the term 'audience commodity'.", "options": [{"id": "a", "text": "1981"}, {"id": "b", "text": "1999"}, {"id": "c", "text": "2018"}, {"id": "d", "text": "1965"}], "correct": "a", "explain": "Smythe (1981) coined 'audience commodity' to describe how TV sells audiences to advertisers."}, {"prompt": "What does Webster explicitly flag about the 'postmodern city' section of the Castells chapter?", "options": [{"id": "a", "text": "It is Castells' own core argument"}, {"id": "b", "text": "It is Webster's own speculative extension, going further than Castells would allow"}, {"id": "c", "text": "It has no relevance to the chapter"}, {"id": "d", "text": "It was written by Sassen"}], "correct": "b", "explain": "Webster is explicit that the postmodern-city discussion is his own speculative extension."}], "extraFlashcards": [{"front": "What is the 'modern infrastructural ideal'?", "back": "Graham and Marvin's (2001) term for the mid-19th-century vision of cities/states providing universal essential services to all citizens — an ideal that began collapsing under neoliberal deregulation from the late 1970s."}, {"front": "What is 'cultural imperialism' (Schiller)?", "back": "The claim that Western (especially US) media dominance spreads capitalist/consumerist values globally in a largely one-directional flow, marginalising poorer nations' own media voice."}, {"front": "What is the 'space of flows' (Castells)?", "back": "The idea that IT networks let economic/social activity transcend physical place, though flows still require physical 'nerve centres' (global cities)."}, {"front": "What is a Creative Adversarial Network (CAN)?", "back": "A GAN variant (Elgammal et al., 2017) with an added signal that prevents the generator from imitating existing styles too closely, aimed at more original creative output."}, {"front": "Name the three 'ethics' categories from Dignum (2018).", "back": "Ethics by Design, Ethics in Design, Ethics for Design."}], "emergencyPlan": {"phase1": {"title": "Phase 1 — Understand (2 hrs)", "items": ["Read each topic's 'Core Argument' card once, slowly, for real understanding (not memorising yet).", "For each topic, be able to answer in your own words: What problem is this theory trying to explain? What is the main claim?", "Look at the 'Topic in One Screen' dashboard for each topic to see the big picture before drilling into detail."]}, "phase2": {"title": "Phase 2 — Memorise (2.5 hrs)", "items": ["Memorise the 5 key concepts per topic using the Academic → Simple → Bangla → Memory → Exam Sentence layers.", "Memorise 15-20 of the highest-priority facts from the Facts Bank (the ones marked with concrete numbers/stats).", "Memorise at least 2 citations per topic from the Citation Bank so you can write in-text citations confidently."]}, "phase3": {"title": "Phase 3 — Connect (1.5 hrs)", "items": ["Study the 6 cross-topic Connections cards — for each, be able to state one sentence of what's common and one of what differs.", "Read the 4 Cross-Topic Questions and their key points — these show you HOW an examiner might merge topics.", "Read the Bangladesh Application Lab for all 4 topics, focusing on the 'Safe Exam Language' sentences."]}, "phase4": {"title": "Phase 4 — Practise (2.5 hrs)", "items": ["Pick 2-3 🔥 VERY HIGH PRIORITY questions per topic and outline (don't fully write) an answer using the Blueprints.", "Fully write out ONE model-answer-length response using the Answer Blueprint for your weakest topic.", "Use the Active Recall flashcards and quiz to test yourself — redo any topic you score below 70% on."]}, "phase5": {"title": "Phase 5 — Final 60-Minute Revision", "items": ["Open Exam Mode and review only the TOP 10 arguments, TOP 10 citations, TOP 10 facts and TOP 5 answer structures.", "Re-read the Common Mistakes / Source-vs-Opinion guardrail for each topic one last time.", "Do NOT read new material in the last 30 minutes — only review what you've already studied."]}}, "twoHourPlan": {"studyFirst": ["The 4 Core <script>
/* ============ APP LOGIC ============ */
let DATA = null;
let state = {
  currentView: 'home',
  currentTopic: 't1',
  fontScale: 1,
  theme: 'light',
  mastered: {},
  notes: {},
  quizScore: null,
  flashIndex: 0,
  flashDeck: [],
  examDate: null
};

const PRIORITY_LABEL = {high:'🔥 VERY HIGH PRIORITY', medium:'🟠 HIGH PRIORITY', low:'🟡 MEDIUM PRIORITY'};

function loadState(){
  try{
    const raw = localStorage.getItem('nm_study_state');
    if(raw){ const parsed = JSON.parse(raw); state = Object.assign(state, parsed); }
  }catch(e){}
  if(!state.examDate){
    const d = new Date(); d.setHours(d.getHours()+10);
    state.examDate = d.toISOString();
  }
}
function saveState(){
  try{ localStorage.setItem('nm_study_state', JSON.stringify(state)); }catch(e){}
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function badge(tag){
  const map = {SOURCE:'badge src', INFERENCE:'badge inf', APPLICATION:'badge app', 'POSSIBLE / EXAMPLE':'badge app', 'STUDY TIP':'badge tip', 'INFERENCE / STUDY TIP':'badge inf'};
  const cls = map[tag] || 'badge inf';
  return `<span class="${cls}">${tag}</span>`;
}

function priorityBadge(p){
  const map = {high:'pri-high', medium:'pri-med', low:'pri-low'};
  return `<span class="pri ${map[p]||'pri-med'}">${PRIORITY_LABEL[p]||PRIORITY_LABEL.medium}</span>`;
}

/* ---------- NAV ---------- */
const NAV = [
  {id:'home', label:'🚨 Emergency Plan'},
  {id:'topic', label:'📚 Topics', sub:true},
  {id:'connections', label:'🔗 Connections Map'},
  {id:'cross', label:'🔥 Cross-Topic Questions'},
  {id:'bangladesh', label:'🇧🇩 Bangladesh Lab'},
  {id:'citations', label:'📌 Citation Bank & Facts'},
  {id:'sentences', label:'✍️ Sentence Builders'},
  {id:'answers', label:'🏗️ Blueprints & Model Answers'},
  {id:'recall', label:'🧠 Active Recall'},
  {id:'mistakes', label:'❌ Common Mistakes'},
  {id:'search', label:'🔍 Search'},
  {id:'notes', label:'📝 My Notes'},
  {id:'master', label:'🧠 Master Revision Sheet'},
  {id:'exammode', label:'⏱️ EXAM MODE (last 30 min)'}
];

function renderNav(){
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  NAV.forEach(item=>{
    const btn = el('button','navbtn'+(state.currentView===item.id?' active':''), item.label);
    btn.onclick = ()=>{ state.currentView = item.id; saveState(); render(); };
    nav.appendChild(btn);
    if(item.id==='topic'){
      const sub = el('div','navsub');
      DATA.topics.forEach(t=>{
        const b = el('button','navbtn small'+((state.currentView==='topic'&&state.currentTopic===t.id)?' active':''), t.short);
        b.onclick = ()=>{ state.currentView='topic'; state.currentTopic=t.id; saveState(); render(); };
        sub.appendChild(b);
      });
      nav.appendChild(sub);
    }
  });
}

/* ---------- COUNTDOWN ---------- */
function updateCountdown(){
  const target = new Date(state.examDate);
  const now = new Date();
  let diff = Math.max(0, target - now);
  const h = Math.floor(diff/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  const cd = document.getElementById('countdownDisplay');
  if(cd) cd.textContent = `${h}h ${m}m ${s}s`;
}

/* ---------- RENDER MAIN ---------- */
function render(){
  renderNav();
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  main.scrollTop = 0;
  switch(state.currentView){
    case 'home': renderHome(main); break;
    case 'topic': renderTopic(main); break;
    case 'connections': renderConnections(main); break;
    case 'cross': renderCross(main); break;
    case 'bangladesh': renderBangladesh(main); break;
    case 'citations': renderCitations(main); break;
    case 'sentences': renderSentences(main); break;
    case 'answers': renderAnswers(main); break;
    case 'recall': renderRecall(main); break;
    case 'mistakes': renderMistakes(main); break;
    case 'search': renderSearch(main); break;
    case 'notes': renderNotes(main); break;
    case 'master': renderMaster(main); break;
    case 'exammode': renderExamMode(main); break;
    default: renderHome(main);
  }
}

/* ---------- HOME / EMERGENCY PLAN ---------- */
function renderHome(main){
  main.innerHTML='';
  const wrap = el('div','page');
  wrap.innerHTML = `
    <h1>🚨 10-Hour Emergency Preparation</h1>
    <p class="lede">Exam-focused study system built from your <strong>New Media.pdf</strong> — four sources: Plantin et al. (2018) on infrastructure/platforms, Schiller (via Webster) on information & capitalism, Castells (via Webster) on urban change, and Anantrasirichai & Bull (2022) on AI in the creative industries.</p>
    <div class="countdown-card">
      <div class="cd-label">TIME REMAINING (edit below if your exam is at a different time)</div>
      <div id="countdownDisplay" class="cd-time">--</div>
      <label class="cd-set">Exam date/time: <input type="datetime-local" id="examDateInput"/></label>
    </div>
    <div class="grid-2">
      <div class="card">
        <h2>Phase-by-phase plan</h2>
        <div id="phasesWrap"></div>
      </div>
      <div class="card">
        <h2>Overall readiness</h2>
        <div id="readinessWrap"></div>
        <h3 style="margin-top:20px">If you only have 2 hours left</h3>
        <div id="twoHourWrap"></div>
      </div>
    </div>
  `;
  main.appendChild(wrap);

  const dtInput = document.getElementById('examDateInput');
  const dt = new Date(state.examDate);
  dtInput.value = dt.toISOString().slice(0,16);
  dtInput.onchange = ()=>{ state.examDate = new Date(dtInput.value).toISOString(); saveState(); updateCountdown(); };
  updateCountdown();

  const phasesWrap = document.getElementById('phasesWrap');
  const plan = DATA.emergencyPlan;
  ['phase1','phase2','phase3','phase4','phase5'].forEach(pk=>{
    const p = plan[pk];
    const box = el('div','phase-box');
    box.innerHTML = `<h3>${p.title}</h3>`;
    const ul = el('div','checklist');
    p.items.forEach((item,i)=>{
      const key = pk+'_'+i;
      const checked = !!state.mastered[key];
      const row = el('label','check-row');
      row.innerHTML = `<input type="checkbox" ${checked?'checked':''}/> <span>${item}</span>`;
      row.querySelector('input').onchange = (e)=>{ state.mastered[key]=e.target.checked; saveState(); renderHome(main); };
      ul.appendChild(row);
    });
    box.appendChild(ul);
    phasesWrap.appendChild(box);
  });

  // readiness
  const readinessWrap = document.getElementById('readinessWrap');
  DATA.topics.forEach(t=>{
    const items = t.questions ? 10 : 10;
    let total=0, done=0;
    ['def','arg','scholar','sup1','sup2','ev1','ev2','crit1','crit2','conn','app'].forEach(k=>{
      total++; if(state.mastered['selftest_'+t.id+'_'+k]) done++;
    });
    const pct = Math.round((done/total)*100);
    const bar = el('div','readiness-row');
    bar.innerHTML = `<div class="readiness-label">${t.short}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="readiness-pct">${pct}%</div>`;
    readinessWrap.appendChild(bar);
  });

  const twoHourWrap = document.getElementById('twoHourWrap');
  const tp = DATA.twoHourPlan;
  twoHourWrap.innerHTML = `
    <p><strong>Study this first:</strong></p><ul>${tp.studyFirst.map(x=>`<li>${x}</li>`).join('')}</ul>
    <p><strong>Memorise these citations:</strong></p><ul>${tp.memoriseCitations.map(x=>`<li>${x}</li>`).join('')}</ul>
    <p><strong>Memorise these arguments:</strong></p><ul>${tp.memoriseArguments.map(x=>`<li>${x}</li>`).join('')}</ul>
    <p><strong>Ignore for now:</strong></p><ul>${tp.ignoreForNow.map(x=>`<li>${x}</li>`).join('')}</ul>
  `;
}

/* ---------- TOPIC PAGE ---------- */
function renderTopic(main){
  main.innerHTML='';
  const t = DATA.topics.find(x=>x.id===state.currentTopic);
  const wrap = el('div','page');
  wrap.innerHTML = `
    <div class="topic-tabs" id="topicPicker"></div>
    <h1>${t.title}</h1>
    <div class="topic-meta">${t.author} — <em>${t.source}</em></div>
    <p class="lede">${t.tagline}</p>
    <div class="subtabs" id="subtabs"></div>
    <div id="topicBody"></div>
  `;
  main.appendChild(wrap);

  const picker = document.getElementById('topicPicker');
  DATA.topics.forEach(x=>{
    const b = el('button','chip'+(x.id===t.id?' active':''), x.short);
    b.onclick = ()=>{ state.currentTopic = x.id; saveState(); render(); };
    picker.appendChild(b);
  });

  const subtabs = ['Core Argument (10-min)','Topic in One Screen','Key Concepts','Difficult Words','Possible Exam Qs','Self-Test'];
  const subtabWrap = document.getElementById('subtabs');
  let activeSub = state['sub_'+t.id] || subtabs[0];
  subtabs.forEach(s=>{
    const b = el('button','subtab'+(s===activeSub?' active':''), s);
    b.onclick = ()=>{ state['sub_'+t.id]=s; saveState(); renderTopic(main); };
    subtabWrap.appendChild(b);
  });

  const body = document.getElementById('topicBody');
  if(activeSub==='Core Argument (10-min)') body.appendChild(renderCoreArgument(t));
  else if(activeSub==='Topic in One Screen') body.appendChild(renderOneScreen(t));
  else if(activeSub==='Key Concepts') body.appendChild(renderKeyConcepts(t));
  else if(activeSub==='Difficult Words') body.appendChild(renderTopicWords(t));
  else if(activeSub==='Possible Exam Qs') body.appendChild(renderTopicQuestions(t));
  else if(activeSub==='Self-Test') body.appendChild(renderSelfTest(t));
}

function renderCoreArgument(t){
  const box = el('div','card');
  box.innerHTML = `
    <h2>🎯 THE ONE THING YOU MUST UNDERSTAND</h2>
    <div class="hero-argument">${t.centralArgument}</div>
    <h3>Central question</h3><p>${t.centralQuestion}</p>
    <h3>Supporting arguments</h3>
    <ol class="arglist">${t.supportingArguments.map(a=>`<li>${badge(a.tag)} ${a.text}</li>`).join('')}</ol>
    <h3>Evidence / examples</h3>
    <ul>${t.evidence.map(e=>`<li>${badge('SOURCE')} ${e}</li>`).join('')}</ul>
    <h3>Criticism</h3>
    <ul>${t.criticisms.map(c=>`<li>${badge(c.tag)} ${c.text}</li>`).join('')}</ul>
    <h3>Conclusion</h3>
    <p>${badge('SOURCE')} ${t.conclusionSource}</p>
  `;
  return box;
}

function renderOneScreen(t){
  const box = el('div','card oneScreen');
  box.innerHTML = `
    <h2>📊 ${t.short} — Topic in One Screen</h2>
    <div class="grid-3">
      <div><h4>Author(s)</h4><p>${t.author}</p></div>
      <div><h4>Central thesis</h4><p>${t.centralArgument.slice(0,160)}...</p></div>
      <div><h4>Source</h4><p>${t.source}</p></div>
    </div>
    <h4>5 key concepts</h4>
    <ul>${t.keyConcepts.slice(0,5).map(k=>`<li><strong>${k.term}</strong> — ${k.simple}</li>`).join('')}</ul>
    <h4>Supporting arguments</h4>
    <ul>${t.supportingArguments.map(a=>`<li>${a.text}</li>`).join('')}</ul>
    <h4>Evidence</h4>
    <ul>${t.evidence.slice(0,3).map(e=>`<li>${e}</li>`).join('')}</ul>
    <h4>Criticisms</h4>
    <ul>${t.criticisms.slice(0,3).map(c=>`<li>${c.text}</li>`).join('')}</ul>
    <h4>Possible 20-mark questions (top 3)</h4>
    <ul>${t.questions.slice(0,3).map(q=>`<li>${priorityBadge(q.priority)} ${q.q}</li>`).join('')}</ul>
  `;
  return box;
}

function renderKeyConcepts(t){
  const box = el('div','');
  box.innerHTML = `<h2>Key Concepts — layered explanations</h2><p class="hint">Click a card to flip through Academic → Simple → বাংলা → Memory → Exam sentence.</p>`;
  const grid = el('div','concept-grid');
  t.keyConcepts.forEach((k,i)=>{
    const card = el('div','concept-card');
    card.innerHTML = `
      <h3>${k.term}</h3>
      <div class="layer"><span class="layer-label">Academic</span><p>${k.academic}</p></div>
      <div class="layer simple"><span class="layer-label">Simple English</span><p>${k.simple}</p></div>
      <div class="layer bangla"><span class="layer-label">বাংলায়</span><p>${k.bangla}</p></div>
      <div class="layer memory"><span class="layer-label">Remember</span><p>${k.memory}</p></div>
      <div class="layer examline"><span class="layer-label">Write in exam</span><p>"${k.exam}"</p></div>
    `;
    grid.appendChild(card);
  });
  box.appendChild(grid);
  return box;
}

function renderTopicWords(t){
  const box = el('div','card');
  box.innerHTML = `<h2>Difficult Words for ${t.short}</h2><p class="hint">Hover/tap the word to reveal the Bangla meaning.</p>`;
  const relevant = DATA.difficultWords;
  const list = el('div','words-grid');
  relevant.forEach(w=>{
    const c = el('div','word-card');
    c.innerHTML = `<div class="word-term">${w.word} <span class="reveal-hint">(tap)</span></div>
      <div class="word-bangla hidden">${w.bangla}</div>
      <div class="word-simple">${w.simple}</div>
      <div class="word-example"><em>${w.example}</em></div>`;
    c.onclick = ()=>{ c.querySelector('.word-bangla').classList.toggle('hidden'); };
    list.appendChild(c);
  });
  box.appendChild(list);
  return box;
}

function renderTopicQuestions(t){
  const box = el('div','card');
  box.innerHTML = `<h2>Possible Exam Questions — ${t.short}</h2><p class="hint">${badge('SOURCE')} labels don't apply here — these are all <strong>POSSIBLE EXAM QUESTIONS</strong> generated for practice, not actual exam questions.</p>`;
  const list = el('div','qlist');
  t.questions.forEach(q=>{
    const row = el('div','qrow');
    row.innerHTML = `${priorityBadge(q.priority)} <span class="qtype">[${q.type}]</span> <span class="qtext">${q.q}</span>`;
    list.appendChild(row);
  });
  box.appendChild(list);
  const mist = el('div','card');
  mist.innerHTML = `<h3>❌ Do Not Confuse</h3><ul>${t.mistakes.map(m=>`<li>${m}</li>`).join('')}</ul>`;
  box.appendChild(mist);
  return box;
}

function renderSelfTest(t){
  const box = el('div','card');
  const items = [
    ['def','I can define the theory'],
    ['arg','I can explain its central argument'],
    ['scholar','I can name the key scholar(s)'],
    ['sup1','I know at least 3 supporting arguments'],
    ['sup2','I can explain how those arguments connect to each other'],
    ['ev1','I know at least 2 pieces of evidence/examples'],
    ['ev2','I can use these examples inside a written answer'],
    ['crit1','I know at least 2 criticisms of the theory'],
    ['crit2','I can give an in-text citation for this topic'],
    ['conn','I can connect this topic to at least one other topic'],
    ['app','I can apply this topic to the Bangladesh context']
  ];
  box.innerHTML = `<h2>Can I Answer This? — ${t.short}</h2>`;
  const ul = el('div','checklist');
  items.forEach(([k,label])=>{
    const key = 'selftest_'+t.id+'_'+k;
    const checked = !!state.mastered[key];
    const row = el('label','check-row');
    row.innerHTML = `<input type="checkbox" ${checked?'checked':''}/> <span>${label}</span>`;
    row.querySelector('input').onchange = (e)=>{ state.mastered[key]=e.target.checked; saveState(); renderTopic(document.getElementById('mainContent')); };
    ul.appendChild(row);
  });
  box.appendChild(ul);
  let done=0; items.forEach(([k])=>{ if(state.mastered['selftest_'+t.id+'_'+k]) done++; });
  const pct = Math.round((done/items.length)*100);
  const readiness = el('div','readiness-banner', `Topic readiness: <strong>${pct}%</strong>`);
  box.appendChild(readiness);
  return box;
}

/* ---------- CONNECTIONS ---------- */
function renderConnections(main){
  const wrap = el('div','page');
  wrap.innerHTML = `<h1>🔗 How the Four Topics Connect</h1><p class="lede">These connections are the student's own reasonable synthesis (${badge('INFERENCE')}) built from what each source actually says — always flag them as your own connection in the exam, not a quote from any single author.</p>`;
  const grid = el('div','conn-grid');
  DATA.connections.forEach(c=>{
    const card = el('div','conn-card');
    card.innerHTML = `
      <h3>${c.title}</h3>
      <p><strong>What they have in common:</strong> ${c.common}</p>
      <p><strong>Where they differ:</strong> ${c.differ}</p>
      <p><strong>What one adds to the other:</strong> ${c.addsToEachOther}</p>
      <p><strong>How to combine in a 20-mark answer:</strong> ${c.combineTip}</p>
      <p><strong>Citation combo:</strong> <em>${c.cite}</em></p>
    `;
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  main.appendChild(wrap);
}

/* ---------- CROSS-TOPIC QUESTIONS ---------- */
function renderCross(main){
  const wrap = el('div','page');
  wrap.innerHTML = `<h1>🔥 Cross-Topic (Merged) Questions</h1><p class="lede">${badge('INFERENCE')} These are practice questions built by combining topics — labelled POSSIBLE EXAM QUESTIONS, not real ones.</p>`;
  DATA.crossTopicQuestions.forEach(q=>{
    const card = el('div','card');
    card.innerHTML = `
      <h3>${q.q}</h3>
      <p><strong>What the examiner is really asking:</strong> ${q.askingReally}</p>
      <p><strong>Theories to use:</strong> ${q.theories.join('; ')}</p>

/* ---------- ACTIVE RECALL: FLASHCARDS + QUIZ ---------- */
function buildFlashDeck(){
  let deck = [];
  DATA.topics.forEach(t=>{
    t.keyConcepts.forEach(k=>{
      deck.push({front:`[${t.short}] What is "${k.term}"?`, back:`${k.academic}<br><br><em>Simple:</em> ${k.simple}<br><em>Exam line:</em> "${k.exam}"`});
    });
  });
  DATA.extraFlashcards.forEach(f=> deck.push(f));
  return deck;
}

function renderRecall(main){
  const wrap = el('div','page');
  wrap.innerHTML = `
    <h1>🧠 Active Recall</h1>
    <div class="recall-tabs" id="recallTabs"></div>
    <div id="recallBody"></div>
  `;
  main.appendChild(wrap);
  const tabs = ['Flashcards','Quiz','Blind Recall'];
  let active = state.recallTab || 'Flashcards';
  const tabWrap = document.getElementById('recallTabs');
  tabs.forEach(tb=>{
    const b = el('button','chip'+(tb===active?' active':''), tb);
    b.onclick = ()=>{ state.recallTab = tb; saveState(); renderRecall(main); };
    tabWrap.appendChild(b);
  });
  const body = document.getElementById('recallBody');
  if(active==='Flashcards') body.appendChild(renderFlashcards());
  else if(active==='Quiz') body.appendChild(renderQuiz());
  else body.appendChild(renderBlindRecall());
}

function renderFlashcards(){
  if(!state.flashDeck || state.flashDeck.length===0) state.flashDeck = buildFlashDeck();
  const box = el('div','card flashcard-wrap');
  const idx = state.flashIndex % state.flashDeck.length;
  const card = state.flashDeck[idx];
  box.innerHTML = `
    <p class="hint">Card ${idx+1} of ${state.flashDeck.length}</p>
    <div class="flashcard" id="flashcardEl">
      <div class="flash-inner" id="flashInner">
        <div class="flash-front">${card.front}</div>
        <div class="flash-back hidden">${card.back}</div>
      </div>
    </div>
    <div class="flash-controls">
      <button class="btn" id="flashFlip">Flip</button>
      <button class="btn" id="flashPrev">◀ Prev</button>
      <button class="btn" id="flashNext">Next ▶</button>
      <button class="btn" id="flashShuffle">🔀 Shuffle</button>
    </div>
  `;
  setTimeout(()=>{
    document.getElementById('flashFlip').onclick = ()=>{
      document.querySelectorAll('.flash-front,.flash-back').forEach(e=>e.classList.toggle('hidden'));
    };
    document.getElementById('flashPrev').onclick = ()=>{ state.flashIndex = (state.flashIndex-1+state.flashDeck.length)%state.flashDeck.length; saveState(); render(); };
    document.getElementById('flashNext').onclick = ()=>{ state.flashIndex = (state.flashIndex+1)%state.flashDeck.length; saveState(); render(); };
    document.getElementById('flashShuffle').onclick = ()=>{
      for(let i=state.flashDeck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [state.flashDeck[i],state.flashDeck[j]]=[state.flashDeck[j],state.flashDeck[i]]; }
      state.flashIndex=0; saveState(); render();
    };
  },0);
  return box;
}

function renderQuiz(){
  const box = el('div','card');
  box.innerHTML = `<h2>Quiz — instant feedback</h2><div id="quizList"></div><button class="btn primary" id="quizSubmit">Check Answers</button><div id="quizResult"></div>`;
  const list = document.createElement('div');
  DATA.quiz.forEach((q,i)=>{
    const qc = el('div','quiz-q');
    qc.innerHTML = `<p class="qprompt">${i+1}. ${q.prompt}</p>` + q.options.map(o=>`
      <label class="quiz-opt"><input type="radio" name="q${i}" value="${o.id}"/> ${o.text}</label>
    `).join('');
    list.appendChild(qc);
  });
  box.querySelector('#quizList').appendChild(list);
  setTimeout(()=>{
    document.getElementById('quizSubmit').onclick = ()=>{
      let score=0;
      DATA.quiz.forEach((q,i)=>{
        const chosen = document.querySelector(`input[name="q${i}"]:checked`);
        const qc = list.children[i];
        qc.querySelectorAll('.quiz-opt').forEach(o=>o.classList.remove('correct','incorrect'));
        const correctLabel = [...qc.querySelectorAll('.quiz-opt')].find(l=>l.querySelector('input').value===q.correct);
        if(correctLabel) correctLabel.classList.add('correct');
        if(chosen){
          if(chosen.value===q.correct) score++;
          else { const wrongLabel = chosen.closest('.quiz-opt'); wrongLabel.classList.add('incorrect'); }
        }
        let explain = qc.querySelector('.explain');
        if(!explain){ explain = el('p','explain', `<em>${q.explain}</em>`); qc.appendChild(explain); }
      });
      document.getElementById('quizResult').innerHTML = `<h3>Score: ${score} / ${DATA.quiz.length}</h3>`;
    };
  },0);
  return box;
}

function renderBlindRecall(){
  const box = el('div','card');

/* ---------- SEARCH ---------- */
function buildSearchIndex(){
  const idx = [];
  DATA.topics.forEach(t=>{
    idx.push({type:'Topic', label:t.short, text:t.centralArgument, go:()=>{state.currentView='topic'; state.currentTopic=t.id;}});
    t.keyConcepts.forEach(k=> idx.push({type:'Concept ('+t.short+')', label:k.term, text:k.academic+' '+k.simple, go:()=>{state.currentView='topic'; state.currentTopic=t.id; state['sub_'+t.id]='Key Concepts';}}));
    t.questions.forEach(q=> idx.push({type:'Question ('+t.short+')', label:q.q, text:q.type, go:()=>{state.currentView='topic'; state.currentTopic=t.id; state['sub_'+t.id]='Possible Exam Qs';}}));
  });
  DATA.citationBank.forEach(c=> idx.push({type:'Scholar', label:`${c.scholar} (${c.year})`, text:c.concept+' '+c.exam, go:()=>{state.currentView='citations';}}));
  DATA.factsBank.forEach(f=> idx.push({type:'Fact', label:f.fact.slice(0,60)+'...', text:f.fact+' '+f.citation, go:()=>{state.currentView='citations';}}));
  DATA.connections.forEach(c=> idx.push({type:'Connection', label:c.title, text:c.common+' '+c.differ, go:()=>{state.currentView='connections';}}));
  DATA.crossTopicQuestions.forEach(c=> idx.push({type:'Cross-topic Q', label:c.q, text:c.askingReally, go:()=>{state.currentView='cross';}}));
  DATA.topics.forEach(t=> t.bangladesh.forEach(b=> idx.push({type:'Bangladesh ('+t.short+')', label:b.application.slice(0,60)+'...', text:b.application+' '+b.safe, go:()=>{state.currentView='bangladesh';}})));
  return idx;
}
let SEARCH_INDEX = null;

function renderSearch(main){
  const wrap = el('div','page');
  wrap.innerHTML = `<h1>🔍 Search everything</h1>
    <input type="text" id="searchInput" class="search-input" placeholder="Search scholar, concept, keyword, citation, question, Bangladesh application..."/>
    <div id="searchResults"></div>`;
  main.appendChild(wrap);
  if(!SEARCH_INDEX) SEARCH_INDEX = buildSearchIndex();
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  input.oninput = ()=>{
    const q = input.value.trim().toLowerCase();
    results.innerHTML = '';
    if(q.length<2) return;
    const hits = SEARCH_INDEX.filter(item => (item.label+' '+item.text).toLowerCase().includes(q)).slice(0,30);
    if(hits.length===0){ results.innerHTML = '<p class="hint">No matches.</p>'; return; }
    hits.forEach(h=>{
      const row = el('div','search-row');
      row.innerHTML = `<span class="search-type">${h.type}</span><span class="search-label">${h.label}</span>`;
      row.onclick = ()=>{ h.go(); saveState(); render(); };
      results.appendChild(row);
    });
  };
  input.focus();
}

/* ---------- EXAM MODE ---------- */
function renderExamMode(main){
  const wrap = el('div','page exam-mode');
  wrap.innerHTML = `<h1>⏱️ EXAM MODE — Last 30 Minutes</h1><p class="lede">No long explanations. Just the essentials.</p>`;
  const top10Args = [];
  DATA.topics.forEach(t=> top10Args.push(`[${t.short}] ${t.supportingArguments[0].text}`));
  DATA.connections.slice(0,6).forEach(c=> top10Args.push(`[Connection] ${c.combineTip}`));
  const top10Cites = DATA.citationBank.slice(0,10).map(c=>`${c.scholar} (${c.year}) — ${c.concept}`);
  const top10Facts = DATA.factsBank.slice(0,10).map(f=>`${f.fact} (${f.citation})`);
  const top10Concepts = [];
  DATA.topics.forEach(t=> top10Concepts.push(`${t.keyConcepts[0].term}: ${t.keyConcepts[0].memory}`));
  const top5Sentences = ["According to ________, ...","The central argument of ________ is that ...","While ________ focuses on ________, ________ emphasises ________.","However, this argument can be questioned because ...","In the Bangladeshi context, this framework can be applied to ..."];
  const top5Structures = DATA.blueprints.slice(0,5).map(b=>b.type+': '+b.structure[0]);
  const top5Merged = DATA.crossTopicQuestions.slice(0,4).map(q=>q.q);
  const top5BD = [];
  DATA.topics.forEach(t=> t.bangladesh.forEach(b=> top5BD.push(b.application.slice(0,90)+'...')));
  const top5Mistakes = [];
  DATA.topics.forEach(t=> top5Mistakes.push(t.mistakes[0]));

  function sec(title, items){
    return `<div class="card"><h3>${title}</h3><ol>${items.map(i=>`<li>${i}</li>`).join('')}</ol></div>`;
  }
  wrap.innerHTML += sec('TOP arguments', top10Args.slice(0,10));
  wrap.innerHTML += sec('TOP citations', top10Cites);
  wrap.innerHTML += sec('TOP facts/evidence', top10Facts);
  wrap.innerHTML += sec('TOP concepts', top10Concepts);
  wrap.innerHTML += sec('TOP exam sentences', top5Sentences);
  wrap.innerHTML += sec('Answer structures', top5Structures);
  wrap.innerHTML += sec('Likely merged questions', top5Merged);
  wrap.innerHTML += sec('Bangladesh applications', top5BD.slice(0,5));
  wrap.innerHTML += sec('Common mistakes to avoid', top5Mistakes);
  main.appendChild(wrap);
}

/* ---------- SETTINGS ---------- */
function applyTheme(){
  document.body.classList.toggle('dark', state.theme==='dark');
  document.documentElement.style.setProperty('--font-scale', state.fontScale);
}

function initSettings(){
  document.getElementById('themeToggle').onclick = ()=>{
    state.theme = state.theme==='dark' ? 'light' : 'dark'; saveState(); applyTheme();
  };
  document.getElementById('fontDown').onclick = ()=>{ state.fontScale = Math.max(0.8, state.fontScale-0.1); saveState(); applyTheme(); };
  document.getElementById('fontUp').onclick = ()=>{ state.fontScale = Math.min(1.4, state.fontScale+0.1); saveState(); applyTheme(); };
  document.getElementById('globalSearchBtn').onclick = ()=>{ state.currentView='search'; saveState(); render(); };
}

/* ---------- INIT ---------- */
window.addEventListener('DOMContentLoaded', ()=>{
  DATA = window.__STUDY_DATA__;
  loadState();
  applyTheme();
  initSettings();
  render();
  setInterval(updateCountdown, 1000);
});
