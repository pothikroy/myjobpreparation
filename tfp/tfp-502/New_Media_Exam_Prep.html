<style>
:root{
  --paper:#F6F4EE; --ink:#1E2128; --ink-soft:#4B4F58; --card:#FFFFFF; --border:#E3DFD3;
  --accent:#1F6F63; --accent-soft:#DCEAE7; --amber:#B8752B; --amber-soft:#F3E4D0;
  --slate:#6B7280; --slate-soft:#E7E8EA; --red:#B34A4A; --red-soft:#F4E0DF;
  --green:#2F7D4F; --green-soft:#DEEEE3; --topic1:#2B6CB0; --topic2:#8A3B2E; --topic3:#6B4C9A; --topic4:#1E7A6F;
  --shadow:0 1px 2px rgba(30,33,40,.06),0 4px 14px rgba(30,33,40,.05);
  --serif:'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --bn:'Noto Sans Bengali','Nirmala UI','Vrinda',var(--sans);
  --radius:10px;
}
[data-theme="dark"]{
  --paper:#14171C; --ink:#E9E7E0; --ink-soft:#ABAFB8; --card:#1C2027; --border:#2B3038;
  --accent:#5FBFAE; --accent-soft:#1D3B36; --amber:#E0A25E; --amber-soft:#3A2C1B;
  --slate:#9AA0AC; --slate-soft:#262B33; --red:#E39494; --red-soft:#3A2426;
  --green:#8FD3AA; --green-soft:#1D3226; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;font-size:16px;transition:background .2s,color .2s;}
body.fs-sm{font-size:14px;} body.fs-lg{font-size:18px;} body.fs-xl{font-size:20px;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.25;margin:0 0 .5em;}
p{margin:0 0 .8em;}
.bn{font-family:var(--bn);}
a{color:var(--accent);}
button{font-family:var(--sans);cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}

/* Layout */
#app{display:flex;min-height:100vh;}
#sidebar{width:250px;flex:0 0 250px;background:var(--card);border-right:1px solid var(--border);padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto;}
#sidebar .brand{font-family:var(--serif);font-size:1.15rem;font-weight:700;padding:4px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:10px;}
#sidebar .brand span{display:block;font-family:var(--sans);font-weight:400;font-size:.72rem;color:var(--ink-soft);margin-top:3px;}
.navgroup{margin-bottom:14px;}
.navgroup-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:4px 8px;}
.navbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;padding:8px 8px;border-radius:8px;color:var(--ink);font-size:.88rem;margin-bottom:1px;}
.navbtn:hover{background:var(--paper);}
.navbtn.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.navbtn .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
#main{flex:1;min-width:0;padding:22px 32px 80px;max-width:980px;margin:0 auto;}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
#countdown{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;font-size:.82rem;box-shadow:var(--shadow);}
#countdown b{font-family:var(--serif);font-size:1rem;color:var(--red);}
#searchbox{flex:1;min-width:180px;position:relative;}
#searchbox input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);font-size:.88rem;}
#searchresults{position:absolute;top:105%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);max-height:340px;overflow-y:auto;z-index:50;display:none;}
#searchresults div{padding:8px 12px;border-bottom:1px solid var(--border);font-size:.83rem;cursor:pointer;}
#searchresults div:hover{background:var(--paper);}
#searchresults .sr-tag{font-size:.68rem;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;}
.iconbtn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.85rem;box-shadow:var(--shadow);}

/* Cards & generic */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.card h3{margin-top:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr;} #sidebar{position:fixed;left:-260px;z-index:100;transition:left .2s;box-shadow:var(--shadow);} #sidebar.open{left:0;} #main{padding:16px 14px 70px;} #menubtn{display:inline-block!important;}}
#menubtn{display:none;}

.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.68rem;font-weight:700;letter-spacing:.02em;}
.pri-must{background:var(--red-soft);color:var(--red);}
.pri-should{background:var(--amber-soft);color:var(--amber);}
.pri-nice{background:var(--slate-soft);color:var(--slate);}
.tag-source{background:var(--green-soft);color:var(--green);}
.tag-app{background:var(--amber-soft);color:var(--amber);}
.tag-unsupported{background:var(--red-soft);color:var(--red);}
.tag-inference{background:var(--accent-soft);color:var(--accent);}
.tag-studytip{background:var(--slate-soft);color:var(--slate);}
.pill{margin-right:4px;}

.badge-topic{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:var(--ink-soft);margin-bottom:6px;}
.badge-topic .sw{width:10px;height:10px;border-radius:3px;}

details{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;background:var(--paper);}
details summary{padding:10px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;}
details summary::-webkit-details-marker{display:none;}
details summary:before{content:'▸';display:inline-block;transition:transform .15s;color:var(--accent);}
details[open] summary:before{transform:rotate(90deg);}
details .inner{padding:2px 16px 14px;}

.checklist label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:.9rem;}
.checklist input{margin-top:3px;}
progress{width:100%;height:10px;border-radius:6px;overflow:hidden;}
progress::-webkit-progress-bar{background:var(--slate-soft);border-radius:6px;}
progress::-webkit-progress-value{background:var(--accent);border-radius:6px;}

.btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:.85rem;font-weight:600;}
.btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--border);}
.btn.small{padding:5px 11px;font-size:.78rem;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

table{width:100%;border-collapse:collapse;font-size:.86rem;}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top;}
th{background:var(--paper);}

blockquote{border-left:3px solid var(--accent);margin:0 0 10px;padding:2px 14px;font-style:italic;color:var(--ink-soft);font-size:.92rem;}
.factcard{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--paper);}
.factcard .hook{font-size:.78rem;color:var(--accent);}
.layer{border-left:3px solid var(--border);padding:4px 0 4px 12px;margin-bottom:6px;}
.layer b{display:inline-block;min-width:112px;color:var(--ink-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.02em;}
.hoverword{border-bottom:1.5px dotted var(--accent);cursor:help;position:relative;}
.hoverword .tip{display:none;position:absolute;bottom:120%;left:0;background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:6px;font-size:.78rem;white-space:nowrap;z-index:10;}
.hoverword:hover .tip,.hoverword:focus .tip{display:block;}

.flash{background:var(--card);border:1px solid var(--border);border-radius:14px;min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:1.02rem;cursor:pointer;box-shadow:var(--shadow);}
.flashwrap{max-width:600px;margin:0 auto;}
.flashmeta{text-align:center;color:var(--ink-soft);font-size:.82rem;margin:8px 0;}

.qz-opt{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);margin-bottom:8px;font-size:.9rem;}
.qz-opt.correct{background:var(--green-soft);border-color:var(--green);}
.qz-opt.wrong{background:var(--red-soft);border-color:var(--red);}

.notearea{width:100%;min-height:110px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:.88rem;}

.readiness-ring{font-family:var(--serif);font-size:1.4rem;font-weight:700;}
.smallmuted{color:var(--ink-soft);font-size:.8rem;}

.tab-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.tab-btn{padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:.82rem;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.conn-line{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--paper);}
.conn-line h4{margin-bottom:6px;}

.exammode-list{columns:1;}
.exammode-item{padding:7px 0;border-bottom:1px dashed var(--border);font-size:.9rem;}

footer.pagefoot{text-align:center;color:var(--ink-soft);font-size:.75rem;margin-top:30px;}

.mark-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:.72rem;color:var(--ink-soft);}
.mark-btn.done{background:var(--green-soft);color:var(--green);border-color:var(--green);}

.builder-select{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);margin-bottom:10px;}
.plan-block{border-left:3px solid var(--accent);padding-left:12px;margin-bottom:10px;}
</style>
</head>

<script>
/* ======================= DATA ======================= */
const TOPICS = [
{
  id:'t1', short:'Infrastructure & Platform', color:'var(--topic1)',
  title:'Infrastructure Studies Meet Platform Studies',
  authors:'Plantin, Lagoze, Edwards & Sandvig (2018), New Media & Society',
  oneLiner:'How should we understand Google, Facebook and the Web — as infrastructures or as platforms?',
  coreArgument:{
    question:'Are digital giants like Google and Facebook better understood as "infrastructures" (essential, public-interest systems) or as "platforms" (profit-driven, programmable ecosystems) — and can these two theories be combined?',
    argument:'Infrastructure studies and platform studies are not opposed but complementary. Digital technology has produced a "platformization of infrastructures" (once-public services like telecoms/the internet split into private, competitive platforms) and an "infrastructuralization of platforms" (corporate platforms like Google/Facebook become as essential and embedded as infrastructure). A combined "theoretical bifocal" view explains today\'s digital media better than either theory alone.',
    supporting:[
      'Infrastructure studies (STS/history) tracks systems evolving from centrally-built systems → networks → webs, joined by "gateways", becoming ubiquitous, reliable, and often publicly regulated (e.g. electricity, the Internet backbone).',
      'Platform studies (media/cultural studies) treats "platform" as a programmable core with variable complementary parts (apps, APIs) — privately controlled, profit-driven, and locking in users/developers.',
      'The 1970s–80s neoliberal turn caused the "modern infrastructural ideal" (universal public service) to "splinter" into deregulated, privatised, competitive provision — this is the platformization of infrastructure.',
      'Meanwhile Facebook and Google, through APIs (which work like gateways) and sheer ubiquity, have become so embedded in daily life that they now behave like infrastructures — this is infrastructuralization of platforms.'
    ],
    evidence:'Facebook (60%+ share of social media traffic) hosting news content; Google (65%+ of web search, 85% in the US) running Search, Maps, Books via APIs; historical case of the Minitel and early US "computer utility" model; the Open Web (HTTP/URI/HTML/hyperlinks) as a genuine public infrastructure being partly displaced by walled gardens.',
    criticism:'The article itself is more a synthesis/agenda-setting piece than a critique of either theory; the main built-in tension it flags is that treating essential public-interest services as private platforms creates political, environmental and ethical risk, and that the neat Table-1 dichotomy between infrastructure and platform is "increasingly blurry" in practice.',
    conclusion:'A "theoretical bifocal" combining both lenses better captures how contemporary digital media are both embedded in daily life (infrastructure-like) and privately, profitably controlled (platform-like) — and this combination should guide future case studies (e.g. smart cities, scholarly platforms like Academia.edu).'
  },
  concepts:[
    {term:'Infrastructure', simple:'A system so basic and widely shared that everyone depends on it without thinking about it — like electricity or roads.', bn:'অবকাঠামো — এমন একটি ব্যবস্থা যা সবাই ব্যবহার করে কিন্তু সাধারণত খেয়াল করে না', memory:'Infrastructure = big, shared, invisible-until-broken, often public.', exam:'Infrastructure refers to widely shared, essential systems that are reliable, ubiquitous, and often regulated in the public interest (Plantin et al., 2018).', tag:'SOURCE'},
    {term:'Platform', simple:'A company-built base (like an app or operating system) that lets outside developers build things on top of it, under rules the company controls.', bn:'প্ল্যাটফর্ম — একটি মূল কাঠামো যার উপর অন্যরা নিজেদের অ্যাপ বা সেবা তৈরি করতে পারে, কিন্তু নিয়ন্ত্রণ কোম্পানির হাতে থাকে', memory:'Platform = programmable core + APIs + profit + lock-in.', exam:'A platform is a centrally controlled, programmable core system that allows third-party developers to build complementary products through APIs (Plantin et al., 2018).', tag:'SOURCE'},
    {term:'Platformization of infrastructures', simple:'When something that used to be a shared public service (like telecoms) gets broken up and run instead like competing private businesses.', bn:'অবকাঠামোর প্ল্যাটফর্মীকরণ — সরকারি সেবা যখন বেসরকারি প্রতিযোগিতামূলক ব্যবসায় রূপান্তরিত হয়', memory:'Public monopoly → deregulated → splintered → run like a platform.', exam:'Platformization of infrastructures describes how deregulation and privatisation turned once-public, monopoly infrastructures into competitive, platform-like markets (Plantin et al., 2018).', tag:'SOURCE'},
    {term:'Infrastructuralization of platforms', simple:'When a private company\'s app or service (like Facebook) becomes so widely used and essential that it starts acting like public infrastructure.', bn:'প্ল্যাটফর্মের অবকাঠামোকরণ — বেসরকারি প্ল্যাটফর্ম যখন এত ব্যাপকভাবে ব্যবহৃত হয় যে তা অবকাঠামোর মতো অপরিহার্য হয়ে ওঠে', memory:'Private platform + massive scale + daily dependence = acts like infrastructure.', exam:'Infrastructuralization of platforms occurs when corporate platforms such as Facebook or Google become so embedded in everyday life that they take on the properties of infrastructure (Plantin et al., 2018).', tag:'SOURCE'},
    {term:'API as gateway', simple:'An API is like a plug socket that lets outside apps connect to a big company\'s system — but the company decides the rules of the plug.', bn:'এপিআই একটি সংযোগ-বিন্দু যা বাইরের অ্যাপকে বড় কোম্পানির সিস্টেমের সাথে যুক্ত হতে দেয়', memory:'API = gateway, but a controlled/owned one (unlike open standards).', exam:'In infrastructure-studies terms, an API functions as a "gateway" that permits interoperability, but one that is privately controlled by the platform owner (Plantin et al., 2018).', tag:'SOURCE'},
    {term:'Modern infrastructural ideal / splintering', simple:'The old idea that cities/governments should provide one shared, universal service to everyone — an idea that broke down after the 1970s into many competing private providers.', bn:'আধুনিক অবকাঠামোগত আদর্শ — সবার জন্য একক সরকারি সেবা প্রদানের ধারণা, যা ১৯৭০-এর দশক থেকে ভেঙে পড়ে', memory:'One public system → splintered into many private, unequal ones.', exam:'The "modern infrastructural ideal" of universal public provision splintered from the late 1970s under neoliberal deregulation and privatisation (Graham and Marvin, 2001, cited in Plantin et al., 2018).', tag:'SOURCE'},
    {term:'Walled garden', simple:'A closed online space (like early AOL, or Facebook\'s ecosystem) that keeps users inside and limits what they can access outside it.', bn:'ওয়ালড গার্ডেন — একটি বদ্ধ অনলাইন পরিবেশ যা ব্যবহারকারীকে ভেতরে আটকে রাখে', memory:'Walled garden = closed platform vs. Open Web.', exam:'A "walled garden" is a closed platform ecosystem (e.g. Facebook) that channels users and data through its own controlled systems rather than the Open Web (Plantin et al., 2018).', tag:'SOURCE'},
  ],
  scholars:[
    {name:'Plantin, Lagoze, Edwards & Sandvig', role:'Authors — propose the combined "infrastructure + platform" bifocal framework.'},
    {name:'Thomas Hughes', role:'Large Technical Systems (LTS) historical approach: systems evolve from invention → network → web.'},
    {name:'Star & Bowker', role:'Phenomenology/sociology of infrastructure: ubiquity, reliability, "learned as part of membership."'},
    {name:'Graham & Marvin', role:'"Splintering Urbanism" — the collapse of the modern infrastructural ideal under neoliberalism.'},
    {name:'Bogost & Montfort', role:'Platform studies — programmability as the defining feature ("if you can program it, it\'s a platform").'},
    {name:'José van Dijck', role:'Platforms as "a set of relations that constantly needs to be performed" between user goals and profit-seeking.'},
    {name:'Langlois & Elmer', role:'"Double articulation" — corporate data-gathering shapes platform design and communication.'},
    {name:'Gillespie', role:'"Platform" is a deliberately vague term companies use to appear neutral (studied via YouTube).'}
  ],
  facts:[
    {fact:'Google accounts for roughly 65% of global web searches (85% in the US, 92% in Europe).', use:'evidence for Google-as-infrastructure argument', cite:'Plantin et al. (2018)'},
    {fact:'Facebook has over 60% share of global social media traffic.', use:'evidence for Facebook-as-infrastructure', cite:'Plantin et al. (2018)'},
    {fact:'The Open Web is built on four open components: HTTP, URIs, HTML, hyperlinks.', use:'defining the Open Web as genuine infrastructure', cite:'Plantin et al. (2018)'},
    {fact:'The "modern infrastructural ideal" began collapsing in the late 1970s under neoliberal deregulation.', use:'explaining platformization historically', cite:'Graham & Marvin, in Plantin et al. (2018)'},
    {fact:'Table 1 in the article contrasts infrastructure and platform across architecture, market structure, funding, and user agency ("opt out" vs "opt in").', use:'comparison/critical-analysis questions', cite:'Plantin et al. (2018)'}
  ],
  questions:[
    {q:'Explain the difference between infrastructure studies and platform studies as approaches to new media.', type:'Direct', priority:'must'},
    {q:'Critically examine Plantin et al.\'s concept of "platformization of infrastructures" and "infrastructuralization of platforms."', type:'Analytical', priority:'must'},
    {q:'Using Google or Facebook as a case study, discuss whether digital platforms should be regulated as public infrastructure.', type:'Application/Analytical', priority:'must'},
    {q:'To what extent do platforms like Facebook and Google function as modern-day infrastructures?', type:'Analytical', priority:'should'},
    {q:'Discuss the concept of the "Open Web" and its erosion by corporate walled gardens.', type:'Direct', priority:'should'},
    {q:'Apply the infrastructure/platform framework to a Bangladeshi example of internet or telecom services.', type:'Application', priority:'should'}
  ],
  mistakes:[
    'Don\'t confuse "infrastructure" with just "hardware" — in this theory it means a socio-technical system with public-interest, reliability and ubiquity properties.',
    'Don\'t treat platform and infrastructure as strictly opposite categories — the article\'s whole point is that they blur together.',
    'Don\'t say Facebook/Google literally ARE infrastructure in a legal sense — the authors argue they increasingly behave like infrastructure, which is a critical/analytical claim, not a factual/legal one.'
  ],
  bangladesh:{
    fromPdf:'The article does not discuss Bangladesh, South Asia, or any developing-country telecom context at all — it focuses on the US/global cases of Google, Facebook, and the historical Internet/Minitel.',
    application:'The infrastructure/platform framework can plausibly be applied to Bangladesh by considering how BTRC-regulated telecom infrastructure (mobile networks, fibre backbone) coexists with — and is increasingly mediated by — global platforms such as Facebook, WhatsApp, and mobile financial services like bKash, which many users treat as a de facto essential service.',
    safe:'"Although Plantin et al. (2018) do not discuss Bangladesh, their framework can be applied to the Bangladeshi context by considering how mobile network infrastructure is increasingly platformized through dominant apps such as Facebook and mobile financial services."'
  }
},
{
  id:'t2', short:'Schiller & Capitalism', color:'var(--topic2)',
  title:'Information and Advanced Capitalism',
  authors:'Herbert Schiller (via Frank Webster, "Theories of the Information Society")',
  oneLiner:'Is the "information society" really something new — or just capitalism continuing under a new name?',
  coreArgument:{
    question:'Does the huge growth of information and IT represent a genuinely new "information society" that breaks with the past, or is it best explained as a continuation of established capitalist priorities?',
    argument:'Herbert Schiller, from a Marxist/political-economy perspective, argues that the "information society" is not a break from capitalism but its latest expression: information and communication have become foundational to advanced, corporate capitalism, and are shaped by market criteria, class inequality, and corporate power — not by neutral technological progress.',
    supporting:[

      'Cultural/media imperialism: Western (especially US) media dominance shapes global news and entertainment flows, prompting Schiller\'s advocacy of a New World Information Order (NWIO).',

    criticism:'Webster raises several objections: (1) the "information rich/information poor" model is too crude, ignoring gender, race, and cultural capital; (2) Schiller\'s "all-or-nothing" view of information ignores real increases in high-quality information (e.g. Channel 4, VCR time-switching, paperback classics); (3) audiences may not simply be "duped" by advertising — postmodern critics argue people are savvy readers of consumerist imagery; (4) home-centred life doesn\'t necessarily mean social withdrawal; (5) the critique risks an exaggerated "fall from grace" narrative when we lack reliable historical comparison.',
    conclusion:'Despite these objections, Webster concludes Schiller\'s work remains valuable because it insists on starting from real, material conditions (market, class, corporate power) rather than idealised "technological possibilities," and it highlights persistent, real inequalities in the "information age."'

  coreArgument:{
    question:'How do information networks and the restructuring of capitalism transform cities — their class structure and their culture?',
    argument:'Manuel Castells argues that a combination of capitalist restructuring and technological innovation (the "informational mode of development") is transforming urban space, producing "informational" and "global" cities marked by sharp class polarisation between an information-professional elite and a growing "underclass" — a "dual city" — alongside a possible postmodern urban culture.',
    supporting:[
      'Castells distinguishes the capitalist "mode of production" (social/market relations) from the informational "mode of development" (a technical paradigm), which he claims is "relatively autonomous."',
      'Global cities (Sassen: New York, London, Tokyo) become "nerve centres" where information flows are collated and managed, hosting concentrated corporate headquarters and "producer services."',
      'Restructuring creates a "dual city": expansion of highly-paid information professionals (~30% of the workforce in global cities) alongside a huge growth in low-paid service jobs and an "underclass" trapped in poverty.',
      'Information networks enable simultaneous decentralisation of operations and centralisation of corporate control.',

    evidence:'New York, London, Tokyo and Paris hosting the headquarters of dozens of transnational corporations (King, 1990); Los Angeles case study — 70% of downtown LA foreign-owned by 1988, the 1992 riots after the Rodney King beating; London\'s Docklands/Canary Wharf redevelopment displacing the working class.',
    criticism:'Webster criticises Castells for technological determinism: treating the "informational mode of development" as autonomous from capitalism puts him surprisingly close to the conservative, non-Marxist post-industrial theory of Daniel Bell. Webster also flags that the "underclass" concept is empirically shaky and not historically new (compare Victorian "outcast London"), that Castells overgeneralises across very different cities (Tokyo is far more homogeneous than London/New York), and that Castells\' postmodern-city claims are speculative — Webster admits he goes further than Castells himself would.',

    {term:'Dual city / underclass', simple:'A city sharply split between a wealthy, globally-connected professional class and a poor, locally-trapped "underclass," living close together but worlds apart.', bn:'দ্বৈত শহর — ধনী পেশাজীবী শ্রেণি ও দরিদ্র নিম্নশ্রেণির মধ্যে তীব্র বিভাজন', memory:'Same city, two worlds: yuppies vs underclass.', exam:'Castells describes a "dual city" of bipolarization between an information-professional elite and a growing underclass (Castells, 1989: 184).', tag:'SOURCE'},
    {term:'Producer services', simple:'Highly-paid jobs (finance, law, advertising, consulting) that manage and coordinate the global economy from within global cities.', bn:'প্রোডিউসার সার্ভিস — অর্থ, আইন, বিজ্ঞাপনের মতো উচ্চ-বেতনের পেশা যা বিশ্ব অর্থনীতি পরিচালনা করে', memory:'Producer services = the brains of the global economy, based in global cities.', exam:'Producer services (finance, banking, advertising, legal) are concentrated in global cities and organise the global economy (Sassen, 1991).', tag:'SOURCE'},
    {term:'Postmodern city', simple:'A city culture defined by constant change, consumption/shopping as pleasure, mixing of high and low culture, and a focus on style/experience over tradition.', bn:'উত্তরাধুনিক শহর — ক্রমাগত পরিবর্তনশীল, ভোগবাদী, শৈলীকেন্দ্রিক শহুরে সংস্কৃতি', memory:'Postmodern city = "I shop therefore I am."', exam:'The postmodern city is characterised by consumption as a cultural experience, aestheticisation of everyday life, and a breakdown of traditional/modern norms (Harvey; Zukin, cited in Webster on Castells).', tag:'INFERENCE'},

  oneLiner:'Can AI actually create — or is it best understood as a powerful assistant to human creativity?',
  coreArgument:{
    question:'How is AI currently used in the creative industries, and can AI realistically become an autonomous "creator" rather than just a tool?',
    argument:'AI (especially deep learning) has rapidly advanced across five categories of creative application — content creation, information analysis, content enhancement, information extraction, and data compression — but remains far from replacing human creativity. For the foreseeable future, AI should be understood and developed as a human-centric tool that augments rather than replaces human creators.',
    supporting:[
      'AI performs very well on constrained, well-defined tasks with lots of labelled data (e.g. denoising, colourisation, super-resolution, recommendation systems).',
      'In content creation (scripts, music, images), AI-generated results still typically require human curation, editing, or collaboration to be usable (e.g. the AI-scripted film Sunspring had "unnatural" storylines).',
      'Creativity is open-ended and hard to label: asking many artists to "draw a cat" produces very different, all valid results — this "one-to-many" nature resists the labelled-data approach most AI relies on.',
      'Ethical issues — deepfakes, bias in training data, authorship/IP questions, and the digital divide — must be addressed alongside technical progress.'
    ],
    evidence:'IBM Watson\'s AI-edited trailer for the film Morgan; the AI-scripted films Sunspring and Zone Out; music album "Hello World" (Flow Machines/Sony); automated journalism at BBC, Forbes, Washington Post; the first AI-generated painting sold for $432,500 in 2018; deepfake technology used for both entertainment and malicious fraud/misinformation.',
    criticism:'The authors themselves flag key limitations: AI cannot truly offer "broad context, emotion, or social relationship"; it works well with clearly-defined, non-context-dependent problems but poorly with genuinely open-ended creative tasks; GAN-based generative methods are not yet robust and are prone to visual artefacts; AI systems can encode and amplify bias present in training data; current deep learning does not mimic how humans actually learn (citing LeCun\'s example of a baby learning about gravity through experience, not backpropagation).',
    conclusion:'The authors conclude that, for the foreseeable future, AI development in the creative industries will and should remain human-centric — designed to augment, not replace, human creativity — while developers must build trust by addressing ethical issues, data bias, and wider social impact alongside technical advances.'

  body:`<p><b>Introduction:</b> Herbert Schiller, writing from a Marxist political-economy perspective, argues that the growth of information and communication technologies does not represent a genuinely new "information society" but is instead the latest expression of advanced, corporate capitalism (Schiller, 1981). This essay explains Schiller's core argument and evaluates its strengths and limitations.</p>
  <p><b>Explanation:</b> Schiller's central claim is that information has become a commodity, "increasingly bought and sold" like any other product (Schiller and Schiller, 1982). He identifies three key mechanisms: market criteria determine what information is produced; class inequalities determine who can access quality information, producing an "information rich" and "information poor" divide (Schiller, 1983b); and corporate capitalism, dominated by a small number of transnational corporations, shapes the information domain for private rather than public benefit.</p>
  <p><b>Evidence:</b> This is illustrated by the case of British Telecom, which after privatisation shifted its pricing to favour large corporate customers over domestic users (Schiller/Webster, citing British Telecom, 1990), and by the dominance of financial information in the electronic-database industry by the mid-1980s. Schiller also extends this analysis internationally, arguing that Western (especially US) media dominance amounts to a form of "cultural imperialism," prompting his advocacy of a New World Information Order.</p>
  <p><b>Criticism:</b> However, this theory has notable limitations. Webster argues that the "information rich/information poor" model is too crude, failing to account for gender, race, and cultural capital. Schiller's "all-or-nothing" view of information also risks ignoring genuine increases in high-quality information (for example, the introduction of Channel 4 or the "paperback revolution"). Postmodern critics further suggest that Schiller underestimates audience agency — ordinary viewers may be capable of reading advertising critically rather than being simply "duped."</p>
  <p><b>Conclusion:</b> Despite these limitations, Schiller's insistence on grounding analysis in real market structures, class relations, and corporate power remains a valuable corrective to overly optimistic "information society" narratives. His work usefully reminds us that new technologies do not automatically produce social benefit unless questions of ownership and access are addressed.</p>`,

  <p><b>Castells' argument:</b> Castells (1989) contends that a combination of capitalist restructuring and an "informational mode of development" transforms cities into "global cities" — concentrated nodes managing worldwide information flows (Sassen, 1991) — producing a "dual city" polarised between highly-paid information professionals and a low-paid, often marginalised "underclass."</p>
  <p><b>Plantin et al.'s argument:</b> Plantin, Lagoze, Edwards and Sandvig (2018) argue that digital platforms such as Google and Facebook increasingly take on the properties of infrastructure ("infrastructuralization of platforms"), even as older public infrastructures are broken up into competitive private platforms ("platformization of infrastructures"). This is achieved partly through APIs, which function as controlled "gateways."</p>
  <p><b>Connecting the two:</b> These frameworks connect directly: the global cities Castells identifies as "nerve centres" of the information economy are precisely where the platform corporations Plantin et al. discuss are headquartered and where their infrastructural power is organised. Both perspectives converge on a similar warning — that essential, widely-used systems (whether urban services or digital platforms) are increasingly controlled by private corporate interests rather than the public.</p>

  <p><b>The theory:</b> Schiller argues information becomes commodified — made available mainly where it can be sold profitably — and that class position determines the quality of information one can access, producing an "information rich" and "information poor" divide (Schiller, 1983b).</p>
  <p><b>Acknowledging the source's scope:</b> It is important to note that Schiller's chapter discusses only Western examples, chiefly the United States and Britain (notably the British Telecom case study), and does not mention Bangladesh or South Asia.</p>
  <p><b>Bangladesh application:</b> Although the author does not specifically discuss Bangladesh, the framework can be applied to the Bangladeshi context by considering how private telecom operators price data and voice services in ways that may favour urban, higher-income, and corporate customers, potentially leaving rural and lower-income users with comparatively limited access — a pattern consistent with Schiller's information rich/information poor thesis. This is offered as a plausible application, not as a finding from the source text.</p>
  <p><b>Return to theory:</b> This application illustrates Schiller's broader point: that access to information technology is shaped by market criteria and existing inequalities rather than being automatically or evenly distributed.</p>
  <p><b>Conclusion:</b> While Schiller's theory was developed in a different national context, its core insight — that information access follows economic power — offers a useful lens for examining digital inequality in Bangladesh, provided such applications are clearly presented as extensions rather than claims made by the source itself.</p>`,
  skeleton:'INTRO → THEORY (commodification, info rich/poor) → NOTE SOURCE SCOPE → BANGLADESH APPLICATION (clearly marked) → RETURN TO THEORY → CONCLUSION'
 }
];

function renderCountdown(){
  const el=document.getElementById('countdown');
  const stored = STATE.examTime;
  if(!stored){
    el.innerHTML = 'Exam time not set — <button class="btn small" onclick="setExamTime()">Set exam time</button>';
    return;
  }
  const diff = new Date(stored) - new Date();
  if(diff<=0){ el.innerHTML='⏰ Exam time reached — good luck!'; return; }
  const h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000);
  el.innerHTML = `⏳ Time left: <b>${h}h ${m}m</b> <button class="mark-btn" onclick="setExamTime()">edit</button>`;
}
function setExamTime(){
  const v = prompt('Exam date & time (e.g. 2026-09-08 09:00):', STATE.examTime || '');

}

function tagFor(tag){
  const map={SOURCE:'tag-source', APPLICATION:'tag-app', UNSUPPORTED:'tag-unsupported', INFERENCE:'tag-inference', STUDYTIP:'tag-studytip'};

  return `<span class="pill ${map[tag]||'tag-studytip'}">${label[tag]||tag}</span>`;
}

function buildPlan(){
  const type = document.getElementById('b-type').value;
  const a = parseInt(document.getElementById('b-topicA').value);
  const b = parseInt(document.getElementById('b-topicB').value);
  const bp = BLUEPRINTS.find(x=>x.type===type);
  const tA = TOPICS[a]; const tB = b>=0 ? TOPICS[b] : null;
  let out = `<div class="card"><h3>Answer Plan: ${type} — ${tA.short}${tB?' + '+tB.short:''}</h3>`;
  out += `<div class="plan-block"><b>Thesis:</b> ${tA.coreArgument.argument.split('.')[0]}.${tB?' Combined with: '+tB.coreArgument.argument.split('.')[0]+'.':''}</div>`;
  out += `<div class="plan-block"><b>Key arguments:</b><ul>${tA.coreArgument.supporting.slice(0,2).map(s=>`<li>${s}</li>`).join('')}${tB?tB.coreArgument.supporting.slice(0,2).map(s=>`<li>${s}</li>`).join(''):''}</ul></div>`;
  out += `<div class="plan-block"><b>Scholars/citations:</b> ${tA.scholars.slice(0,2).map(s=>s.name).join(', ')}${tB?', '+tB.scholars.slice(0,2).map(s=>s.name).join(', '):''}</div>`;
  out += `<div class="plan-block"><b>Evidence:</b> ${tA.coreArgument.evidence.split(';')[0]}.${tB?' '+tB.coreArgument.evidence.split(';')[0]+'.':''}</div>`;
  out += `<div class="plan-block"><b>Criticism:</b> ${tA.coreArgument.criticism.split('.')[0]}.</div>`;
  if(tB){
    const conn = CONNECTIONS.find(c=>(c.a===a&&c.b===b)||(c.a===b&&c.b===a));
    if(conn) out += `<div class="plan-block"><b>How to combine:</b> ${conn.combine}</div>`;
  }
  out += `<div class="plan-block"><b>Suggested structure:</b> ${bp.steps.join(' → ')}</div>`;
  out += `<div class="plan-block"><b>Conclusion pointer:</b> ${tA.coreArgument.conclusion}</div>`;
  out += `</div>`;
  document.getElementById('b-output').innerHTML = out;
}

function checkPractice(){
  const text = document.getElementById('pr-answer').value.toLowerCase();

    {label:'Thesis / clear position', test:/argue|thesis|this essay|i argue|central argument/},
    {label:'Scholar named', test:/schiller|castells|plantin|sandvig|bull|anantrasirichai|sassen|bogost|hughes/},
    {label:'Citation (year in brackets)', test:/\(\d{4}/},
    {label:'Evidence/example', test:/for example|for instance|evidence|case of/},
    {label:'Explanation (not just claim)', test:/because|this means|in other words/},
    {label:'Critical analysis', test:/however|criticis|limitation|weakness|critique/},

/* Quiz data generation from concepts/facts */
function buildQuizForTopic(ti){
  const t = TOPICS[ti];
  const qs = [];
  t.concepts.forEach(c=>{
    const distractors = TOPICS.flatMap(tt=>tt.concepts).filter(x=>x.term!==c.term).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.simple);
    qs.push({prompt:`What best describes "${c.term}"?`, options:[c.simple,...distractors].sort(()=>Math.random()-0.5), answer:c.simple, explain:c.exam});
  });
  t.scholars.slice(0,4).forEach(s=>{
    const distractors = TOPICS.flatMap(tt=>tt.scholars).filter(x=>x.name!==s.name).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.role);
    qs.push({prompt:`What is ${s.name} known for in this topic?`, options:[s.role,...distractors].sort(()=>Math.random()-0.5), answer:s.role, explain:`${s.name}: ${s.role}`});
  });
  return qs.sort(()=>Math.random()-0.5).slice(0,8);
}
let QUIZ_STATE = {topic:0, qs:[], idx:0, score:0};
function viewQuizHub(){
  let html = `<h1>Quizzes</h1><p class="smallmuted">Pick a topic to test yourself. Instant feedback included.</p><div class="tab-strip">`;
  TOPICS.forEach((t,i)=>{ html+=`<button class="tab-btn" onclick="startQuiz(${i})">${t.short}</button>`; });
  html += `</div><div id="quiz-area"><p class="smallmuted">Select a topic above to begin.</p></div>`;
  return html;
}
function startQuiz(ti){
  QUIZ_STATE = {topic:ti, qs:buildQuizForTopic(ti), idx:0, score:0};
  renderQuizQ();
}
function renderQuizQ(){
  const area = document.getElementById('quiz-area');
  if(!area) return;
  if(QUIZ_STATE.idx >= QUIZ_STATE.qs.length){
    STATE.quizScores['t'+QUIZ_STATE.topic] = Math.round(100*QUIZ_STATE.score/QUIZ_STATE.qs.length);
    saveState();
    area.innerHTML = `<div class="card"><h3>Quiz complete!</h3><p>Score: ${QUIZ_STATE.score} / ${QUIZ_STATE.qs.length}</p><button class="btn" onclick="startQuiz(${QUIZ_STATE.topic})">Retry</button></div>`;
    return;
  }
  const q = QUIZ_STATE.qs[QUIZ_STATE.idx];
  area.innerHTML = `<div class="card">
    <p class="smallmuted">Question ${QUIZ_STATE.idx+1} of ${QUIZ_STATE.qs.length}</p>
    <h3>${q.prompt}</h3>
    <div id="quiz-opts">${q.options.map((o,i)=>`<button class="qz-opt" onclick="answerQuiz(${i})">${o}</button>`).join('')}</div>
    <div id="quiz-explain"></div>
  </div>`;
}
function answerQuiz(i){
  const q = QUIZ_STATE.qs[QUIZ_STATE.idx];
  const opts = document.querySelectorAll('#quiz-opts .qz-opt');
  const correct = q.options[i]===q.answer;
  if(correct) QUIZ_STATE.score++;
  opts.forEach((btn,idx)=>{
    btn.disabled = true;
    if(q.options[idx]===q.answer) btn.classList.add('correct');
    else if(idx===i) btn.classList.add('wrong');
  });
  document.getElementById('quiz-explain').innerHTML = `<p style="margin-top:10px;"><b>${correct?'Correct!':'Not quite.'}</b> ${q.explain}</p><button class="btn small" onclick="nextQuiz()">Next</button>`;
}
function nextQuiz(){ QUIZ_STATE.idx++; renderQuizQ(); }

function buildSearchIndex(){
  const idx=[];
  TOPICS.forEach((t,i)=>{
    idx.push({tag:'Topic', text:t.title, go:'t'+i});
    t.concepts.forEach(c=>idx.push({tag:'Concept · '+t.short, text:c.term+' — '+c.simple, go:'t'+i}));
    t.scholars.forEach(s=>idx.push({tag:'Scholar · '+t.short, text:s.name+' — '+s.role, go:'t'+i}));
    t.facts.forEach(f=>idx.push({tag:'Fact · '+t.short, text:f.fact, go:'t'+i}));
    t.questions.forEach(q=>idx.push({tag:'Question · '+t.short, text:q.q, go:'t'+i}));
  });
  CITATION_BANK.forEach(c=>idx.push({tag:'Citation', text:c.scholar+' ('+c.year+') — '+c.concept, go:'citations'}));
  CROSS_QUESTIONS.forEach(c=>idx.push({tag:'Cross-topic Q', text:c.q, go:'crossq'}));
  TOPICS.forEach((t,i)=>idx.push({tag:'Bangladesh · '+t.short, text:t.bangladesh.application, go:'bangladesh'}));
  return idx;
}
const SEARCH_INDEX = buildSearchIndex();
function doSearch(val){
  const box = document.getElementById('searchresults');
  if(!val || val.length<2){ box.style.display='none'; return; }
  const v = val.toLowerCase();
  const results = SEARCH_INDEX.filter(r=>r.text.toLowerCase().includes(v)).slice(0,12);
  if(!results.length){ box.innerHTML='<div class="smallmuted" style="padding:10px;">No results</div>'; box.style.display='block'; return; }
  box.innerHTML = results.map(r=>`<div onclick="go('${r.go}'); document.getElementById('searchresults').style.display='none'; document.getElementById('searchinput').value='';"><span class="sr-tag">${r.tag}</span><br>${r.text}</div>`).join('');
  box.style.display='block';
}
document.addEventListener('click', (e)=>{ if(!document.getElementById('searchbox').contains(e.target)) document.getElementById('searchresults').style.display='none'; });
